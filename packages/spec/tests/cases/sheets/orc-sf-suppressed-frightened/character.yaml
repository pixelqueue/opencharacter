# An orc-sf-2e character: a 1st-level vesk soldier with a trooper background, in heavy armor with
# a scattergun (an area weapon) and its rounds.
#
# Boosts: the vesk's Strength and Constitution with a Wisdom flaw and a free Dexterity, the
# trooper's Constitution and a free Strength, the soldier's Constitution, and four free (Strength,
# Dexterity, Constitution, Wisdom): Str +3, Dex +2, Con +4, Wis +0. The warblood heritage's
# Brutal Anatomy gives vesk claws. Trained skills: Athletics and Warfare Lore (trooper, with the
# Barricade feat), Intimidation (soldier) and three more (3 + Intelligence +0).
specVersion: 0.1.0
id: example-orc-sf-kade
packs:
  - { id: orc-sf-2e, version: 0.1.0 }
values:
  orc-sf-2e:hp.current: 24
features:
  - id: ancestry
    item: orc-sf-2e:ancestries.vesk
    choices:
      heritage:
        - option: orc-sf-2e:heritages.warblood-vesk
          choices:
            orc-sf-2e:feats.ancestry.brutal-anatomy/attack:
              - option: orc-sf-2e:features.ancestry.vesk-claw
      boosts:
        - option: standard
          choices:
            free:
              - option: orc-sf-2e:boosts.dex
  - id: background
    item: orc-sf-2e:backgrounds.trooper
    choices:
      boost:
        - option: orc-sf-2e:boosts.con
      free-boost:
        - option: orc-sf-2e:boosts.str
  - id: class
    item: orc-sf-2e:classes.soldier
    choices:
      fighting-style:
        - option: orc-sf-2e:features.soldier.style.bombard
      skills:
        - option: skill.survival
        - option: skill.piloting
        - option: skill.medicine
      class-feat-1:
        - option: orc-sf-2e:feats.soldier.pin-down
inventory:
  - { id: scattergun, item: orc-sf-2e:weapons.scattergun, equipped: true }
  - { id: armor, item: orc-sf-2e:armor.defiance-series, equipped: true }
  - { id: rounds, item: orc-sf-2e:ammunition.projectile-ammo, quantity: 20 }
choices:
  free-boosts:
    - option: orc-sf-2e:boosts.str
    - option: orc-sf-2e:boosts.dex
    - option: orc-sf-2e:boosts.con
    - option: orc-sf-2e:boosts.wis
  ancestry-feat-1:
    - option: orc-sf-2e:feats.ancestry.vesk-weapon-familiarity
  languages:
    - option: orc-sf-2e:languages.kasatha
applied:
  - { id: pinned, source: orc-sf-2e:conditions.suppressed }
  - { id: fear, source: orc-sf-2e:conditions.frightened, state: { value: 1 } }
