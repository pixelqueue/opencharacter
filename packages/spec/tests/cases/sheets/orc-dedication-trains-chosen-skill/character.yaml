# A 2nd-level human fighter (Dexterity +2) who chose Stealth among the class's free skills, then
# took Rogue Dedication, whose Stealth training comes after: the class's pick stays
# eligible, and the dedication's training is freed for another skill (`extra-training`, Medicine).
specVersion: 0.1.0
id: test-dedication-trains-chosen-skill
packs:
  - { id: orc-2e, version: 0.2.0 }
values:
  orc-2e:level: 2
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      boosts:
        - option: orc-2e:boosts.dex
        - option: orc-2e:boosts.str
  - id: class
    item: orc-2e:classes.fighter
    choices:
      key-attribute:
        - option: str
      class-skill:
        - option: skill.athletics
      skills:
        - option: skill.stealth
        - option: skill.thievery
        - option: skill.survival
      class-feat-2:
        - option: orc-2e:feats.archetype.rogue.rogue-dedication
          choices:
            skill:
              - option: skill.stealth
            free-skill:
              - option: skill.society
choices:
  free-boosts:
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
  extra-training:
    - option: skill.medicine
