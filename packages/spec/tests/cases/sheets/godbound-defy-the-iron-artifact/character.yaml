specVersion: 0.1.0
id: iron-charm
packs:
  - { id: godbound-core, version: 0.3.0 }
homebrew:
  defaultLanguage: en
  content:
    - id: artifacts.iron-charm
      type: artifact
      fields: { effort: 1 }
      grants:
        - item: godbound-core:gifts.endurance.defy-the-iron
          when: self.bonded
          state: { artifactEffort: item.effort }
  i18n:
    en:
      artifacts.iron-charm.name: Iron Charm
inventory:
  - id: charm
    item: homebrew:artifacts.iron-charm
    equipped: true
    state: { bonded: true }
