# Two extras that give Armor against physical harm: Super-Resilience at two ranks (Armor:4) and a
# second copy at one rank (Armor:2). Ratings don't add up: the highest counts.
specVersion: 0.1.0
id: example-fate-two-extras
packs:
  - { id: fate-core, version: 0.1.2 }
values:
  fate-core:aspects.highConcept: Twice-Blessed Champion
  fate-core:ratings.weaponArmor: true
  fate-core:refresh.base: 5
features:
  - id: x-resilience
    item: fate-core:extras.super-resilience
    state: { ranks: 2 }
  - id: x-resilience-2
    item: fate-core:extras.super-resilience
