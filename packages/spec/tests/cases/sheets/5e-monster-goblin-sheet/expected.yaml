  5e-srd-5.1:proficiency.bonus: { value: 2 }
  5e-srd-5.1:combat.ac: { value: 15 }
  5e-srd-5.1:hp.max: { value: 7 }
  5e-srd-5.1:skills.stealth: { value: 6 }
  5e-srd-5.1:senses.darkvision: { value: 60 }
  5e-srd-5.1:senses.passivePerception: { value: 9 }
