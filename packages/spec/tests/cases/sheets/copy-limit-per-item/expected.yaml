# Fighter twice is over `perItem`; the wizard and the one race are within their limits.
issues:
  - { code: too-many-copies, id: 5e-srd-5.1:class }
copyLimits:
  # Types held only by picks or grants are listed too, at 0.
  - { type: 5e-srd-5.1:hunterTactic, max: 0, count: 0, entries: [] }
  - { type: 5e-srd-5.1:metamagic, max: 0, count: 0, entries: [] }
  - { type: 5e-srd-5.1:invocation, max: 0, count: 0, entries: [] }
  - { type: 5e-srd-5.1:pactBoon, max: 0, count: 0, entries: [] }
  - type: 5e-srd-5.1:class
    perItem: 1
    count: 3
    entries:
      - { entry: fighter, item: 5e-srd-5.1:classes.fighter }
      - { entry: wizard, item: 5e-srd-5.1:classes.wizard }
      - { entry: fighter-2, item: 5e-srd-5.1:classes.fighter }
  - { type: 5e-srd-5.1:subclass, max: 0, count: 0, entries: [] }
  - { type: 5e-srd-5.1:fightingStyle, max: 0, count: 0, entries: [] }
  - { type: 5e-srd-5.1:improvement, max: 0, count: 0, entries: [] }
  - type: 5e-srd-5.1:race
    max: 1
    count: 1
    entries:
      - { entry: race, item: 5e-srd-5.1:races.human }
  - { type: 5e-srd-5.1:subrace, max: 0, count: 0, entries: [] }
  - { type: 5e-srd-5.1:draconicAncestry, max: 0, count: 0, entries: [] }
  - type: 5e-srd-5.1:background
    max: 1
    count: 0
    entries: []
  - { type: 5e-srd-5.1:backgroundFeature, max: 0, count: 0, entries: [] }
errors: []
