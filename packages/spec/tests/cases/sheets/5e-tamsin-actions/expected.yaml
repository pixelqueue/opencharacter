# weapon type actions: [use weapon-attack], available: self.equipped
#   inv-1 longsword equipped -> available; inv-2 longsword not equipped -> not listed
# Second Wind is granted to the fighter copy: its own (inline) action is listed as <item>#<action>,
# with the granted item as its source.
# class type actions: [use spend-hit-die], available while hit dice remain -> both classes
# saving-throw and the other rules actions are not used by any content type or item -> rules action, no entry
# weapon-attack is used by the weapon type -> not listed as a rules action
# Rage's rage action is listed for the barbarian copy (end-rage only while raging).
# order: copy actions first, then rules actions
actions:
  - { action: 5e-srd-5.1:spend-hit-die, entry: fighter }
  - action: '5e-srd-5.1:features.fighter.second-wind#second-wind'
    entry: fighter
    source: 5e-srd-5.1:features.fighter.second-wind
  - action: '5e-srd-5.1:features.fighter.action-surge#action-surge'
    entry: fighter
    source: 5e-srd-5.1:features.fighter.action-surge
  - { action: 5e-srd-5.1:spend-hit-die, entry: barbarian }
  - action: '5e-srd-5.1:features.barbarian.rage#rage'
    entry: barbarian
    source: 5e-srd-5.1:features.barbarian.rage
  - { action: 5e-srd-5.1:weapon-attack, entry: inv-1 }
  - { action: 5e-srd-5.1:saving-throw }
  - { action: 5e-srd-5.1:level-up }
  - { action: 5e-srd-5.1:ability-check }
  - { action: 5e-srd-5.1:skill-check }
  - { action: 5e-srd-5.1:initiative }
  - { action: 5e-srd-5.1:unarmed-strike }
  - { action: 5e-srd-5.1:fall }
  - { action: 5e-srd-5.1:take-damage }
  - { action: 5e-srd-5.1:heal }
  - { action: 5e-srd-5.1:long-rest }
  - { action: 5e-srd-5.1:concentration-check }
  - { action: 5e-srd-5.1:short-rest }
