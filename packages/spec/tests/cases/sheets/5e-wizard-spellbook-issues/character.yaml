    item: 5e-srd-5.1:classes.wizard
    state: { level: 3, startingClass: true }
    choices:
      skills: [{ option: skill.arcana }, { option: skill.history }]
      arcane-tradition: [{ option: 5e-srd-5.1:subclasses.school-of-evocation }]
      5e-srd-5.1:features.wizard.spellcasting/cantrips:
        - option: 5e-srd-5.1:spells.fire-bolt
        - option: 5e-srd-5.1:spells.light
        - option: 5e-srd-5.1:spells.mage-hand
      5e-srd-5.1:features.wizard.spellcasting/spellbook-1:
        - option: 5e-srd-5.1:spells.burning-hands
        - option: 5e-srd-5.1:spells.detect-magic
        - option: 5e-srd-5.1:spells.mage-armor
        - option: 5e-srd-5.1:spells.magic-missile
        - option: 5e-srd-5.1:spells.shield
        - option: 5e-srd-5.1:spells.sleep
      # Magic missile is already in the book.
      5e-srd-5.1:features.wizard.spellcasting/spellbook-2:
        [{ option: 5e-srd-5.1:spells.magic-missile }, { option: 5e-srd-5.1:spells.identify }]
      5e-srd-5.1:features.wizard.spellcasting/spellbook-3:
        [{ option: 5e-srd-5.1:spells.misty-step }, { option: 5e-srd-5.1:spells.web }]
      # Fireball is too high to copy at wizard 3.
      5e-srd-5.1:features.wizard.spellcasting/copied: [{ option: 5e-srd-5.1:spells.fireball }]
      # Invisibility isn't in the book.
      5e-srd-5.1:features.wizard.spellcasting/spells:
        - option: 5e-srd-5.1:spells.magic-missile
        - option: 5e-srd-5.1:spells.invisibility
