# Carried: armor 2 + the rifle 2 + the spent vial 0 = 4, over the light load of 3. The spare
# gadget isn't carried. Only the rifle can be used: the vial has no uses left, and the gadget
# isn't carried on this score. Alchemist's starting formula (a standard copy)
# offers craft-design first: features come before the inventory.
values:
  fitd-scoundrel:load.used:
    value: 4
  fitd-scoundrel:load.limit:
    value: 3
issues:
  - code: constraint-failed
    id: fitd-scoundrel:load-limit
actions:
  - action: fitd-scoundrel:craft-design
    entry: fitd-scoundrel-designs-alchemical
  - action: fitd-scoundrel:use-creation
