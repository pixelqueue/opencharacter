# The copy lists drink; each active applied entry lists surge (while it has surges left) and
# boast, with its own ID as `entry`. drunk-3 is inactive, so none. Boast is used by content, so it
# isn't a rules action too.
actions:
  - { action: 'test-applied:potions.haste#drink', entry: haste }
  - { action: 'test-applied:potions.haste#surge', entry: drunk-1 }
  - { action: test-applied:boast, entry: drunk-1 }
  - { action: test-applied:boast, entry: drunk-2 }
  - { action: test-applied:curse }
  - { action: test-applied:calm }
  - { action: test-applied:worsen }
  - { action: test-applied:mark }
