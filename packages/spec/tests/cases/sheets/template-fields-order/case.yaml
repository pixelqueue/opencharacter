description: "A copy's templates merge their fields in template order, a later value replacing an earlier one by name; `base` is the base item alone, not the earlier templates' result"
specVersion: 0.1.0
call: computeSheet
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        templateFields:
          bonus: { type: integer, default: 0 }
        contentTypes:
          gear:
            carried: true
            fields:
              weight: { type: integer }
            computed:
              bonus: { type: integer, formula: item.bonus }
              weight: { type: integer, formula: item.weight }
      content:
        - { id: gear.box, type: gear, fields: { weight: 3 } }
        - id: light
          type: template
          appliesTo: { type: gear }
          fields: { bonus: 1, weight: base.weight - 1 }
        - id: heavy
          type: template
          appliesTo: { type: gear }
          fields: { bonus: 2, weight: base.weight * 2 }
