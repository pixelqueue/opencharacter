# set group: stance-low 14 (picked) over stance-high 16 (recommended);
# morale group (playerChooses): cheer +1 (picked) over rally +2 (recommended) -> 14 + 1 = 15
values:
  test-effects:stats.might: { value: 15 }
competing:
  - field: test-effects:stats.might
    op: set
    options: ['test-effects:boons.stance-low#0', 'test-effects:boons.stance-high#0']
    recommended: 'test-effects:boons.stance-high#0'
    applied: 'test-effects:boons.stance-low#0'
  - field: test-effects:stats.might
    op: add
    stackKey: morale
    options: ['test-effects:boons.cheer#0', 'test-effects:boons.rally#0']
    recommended: 'test-effects:boons.rally#0'
    applied: 'test-effects:boons.cheer#0'
