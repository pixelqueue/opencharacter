# The file's copy first, then the unsaved standard copy after the file's features.
issues:
  - { code: too-many-copies, id: test-pack:trait }
copyLimits:
  - type: test-pack:trait
    max: 1
    count: 2
    entries:
      - { entry: bold, item: test-pack:traits.bold }
      - { entry: test-pack-traits-basic, item: test-pack:traits.basic }
errors: []
