# A 1st-level human fighter with the farmhand background. The farmhand
# trains Athletics and Farming Lore, and the fighter's own skill is Athletics too: the training
# freed isn't spent yet (`extra-training` is pending), and nothing trains a skill twice.
specVersion: 0.1.0
id: test-orc-trained-twice
packs:
  - { id: orc-2e, version: 0.1.0 }
values:
  orc-2e:hp.current: 22
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      heritage:
        - option: orc-2e:heritages.versatile-human
          choices:
            feat:
              - option: orc-2e:feats.general.toughness
      boosts:
        - option: orc-2e:boosts.str
        - option: orc-2e:boosts.con
  - id: background
    item: orc-2e:backgrounds.farmhand
    choices:
      boost:
        - option: orc-2e:boosts.con
      free-boost:
        - option: orc-2e:boosts.str
  - id: class
    item: orc-2e:classes.fighter
    choices:
      key-attribute:
        - option: str
      class-skill:
        - option: skill.athletics
      skills:
        - option: skill.acrobatics
        - option: skill.diplomacy
        - option: skill.survival
      class-feat-1:
        - option: orc-2e:feats.fighter.vicious-swing
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.natural-ambition
      choices:
        feat:
          - option: orc-2e:feats.fighter.sudden-charge
  languages:
    - option: orc-2e:languages.dwarven
