# An orc-2e character: a 3rd-level woodland elf champion of justice, with an artist background,
# sworn to a deity of his own making: the heal font, holy, the divine skill Diplomacy and the
# longsword as favored weapon.
#
# Boosts: his ancestry's Dexterity and Intelligence (Constitution flaw) and a free Constitution, the
# artist's Dexterity and a free Strength, the champion's Strength, and four free (Strength,
# Constitution, Wisdom, Charisma): Str +3, Dex +2, Con +1, Int +1, Wis +1, Cha +1. AC 20 in chain
# mail. Trained skills: Crafting and Art Lore (artist), Religion (champion), Diplomacy (his deity),
# Arcana, Nature and Elf Lore (Elven Lore) and three more.
#
# Lay on hands (his devotion spell, one Focus Point), Retributive Strike (his champion's reaction),
# Shield Block, and blessed shield as his blessing of the devoted.
specVersion: 0.3.0
id: example-orc-aldric
packs:
  - { id: orc-2e, version: 0.3.0 }
values:
  orc-2e:level: 3
  orc-2e:hp.current: 42
  orc-2e:skills.athletics.increases: 1
features:
  - id: ancestry
    item: orc-2e:ancestries.elf
    choices:
      heritage:
        - option: orc-2e:heritages.woodland-elf
      boosts:
        - option: standard
          choices:
            free:
              - option: orc-2e:boosts.con
  - id: background
    item: orc-2e:backgrounds.artist
    choices:
      boost:
        - option: orc-2e:boosts.dex
      free-boost:
        - option: orc-2e:boosts.str
      orc-2e:feats.skill.specialty-crafting/specialty:
        - option: artistry
  - id: class
    item: orc-2e:classes.champion
    choices:
      key-attribute:
        - option: str
      divine-font:
        - option: heal
      sanctification:
        - option: holy
      divine-skill:
        - option: skill.diplomacy
      favored-weapon-category:
        - option: martial
      favored-weapon:
        - option: orc-2e:weapons.longsword
      cause:
        - option: orc-2e:classes.champion.causes.justice
      devotion-spell:
        - option: lay-on-hands
      skills:
        - option: skill.athletics
        - option: skill.medicine
        - option: skill.intimidation
      class-feat-1:
        - option: orc-2e:feats.champion.defensive-advance
      class-feat-2:
        - option: orc-2e:feats.champion.divine-grace
      skill-feat-2:
        - option: orc-2e:feats.skill.intimidating-glare
      orc-2e:features.champion.blessing-of-the-devoted/blessing:
        - option: shield
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
    - option: orc-2e:boosts.cha
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.elven-lore
  languages:
    - option: orc-2e:languages.halfling
  general-feat-3:
    - option: orc-2e:feats.general.toughness
inventory:
  - { id: longsword, item: orc-2e:weapons.longsword, equipped: true }
  - { id: shield, item: orc-2e:shields.steel-shield, equipped: true }
  - { id: armor, item: orc-2e:armor.chain-mail, equipped: true }
  - { id: backpack, item: orc-2e:gear.backpack }
