specVersion: 0.1.0
id: test
packs:
  - { id: fitd-crew, version: 0.2.0 }
# The table's own crew type (the SRD names none): it starts with a Hidden lair, Prowess
# training and a gang of Skulks, and offers Composed, Elite Skulks and Underground Maps.
homebrew:
  defaultLanguage: en
  rules: { tags: [wardens] }
  content:
    - id: crew-types.wardens
      type: crewType
      tags: [wardens]
      fields:
        upgrades:
          [
            fitd-crew:upgrades.composed,
            fitd-crew:upgrades.elite.skulks,
            fitd-crew:upgrades.undergroundMaps,
          ]
        startingUpgrades: [fitd-crew:upgrades.lair.hidden, fitd-crew:upgrades.training.prowess]
        startingCohort: skulks
      choices:
        - id: special-ability
          pick: 1 + advances.abilities
          from: { type: crewAbility }
        - id: operation
          pick: 1
          from: { type: operation }
  i18n:
    en:
      crew-types.wardens.name: Wardens
      tags.wardens.name: Wardens
values:
  fitd-crew:tier: 1
  fitd-crew:advances.upgrades: 3
  fitd-crew:upgrades.lair.hidden: 1
  fitd-crew:upgrades.lair.vault: 2
  fitd-crew:upgrades.lair.workshop: 1
  fitd-crew:upgrades.training.prowess: 1
  fitd-crew:upgrades.training.mastery: 1
  fitd-crew:upgrades.composed: 1
  fitd-crew:upgrades.elite.thugs: 1
choices:
  crew-type:
    - option: homebrew:crew-types.wardens
      choices:
        special-ability:
          - option: fitd-crew:crew-abilities.second-story
        operation:
          - option: fitd-crew:operations.burglary
features:
  - id: c-1
    item: fitd-crew:cohorts.gang
    state: { gangType: skulks }
    choices:
      edges:
        - option: fitd-crew:cohort-traits.loyal
      flaws:
        - option: fitd-crew:cohort-traits.wild
