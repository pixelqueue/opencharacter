# A human (every attribute +0) in +1 resilient leather armor, invested (its resilient rune works
# only then), with a +1 flaming shock dagger: two
# property runes on a +1 weapon, one too many.
specVersion: 0.1.0
id: example-orc-armor-runes
packs:
  - { id: orc-2e, version: 0.2.1 }
features:
  - { id: ancestry, item: orc-2e:ancestries.human }
inventory:
  - id: armor
    item: orc-2e:armor.leather-armor
    equipped: true
    state: { invested: true }
    templates: [orc-2e:runes.armor-potency-1, orc-2e:runes.resilient]
  - id: dagger
    item: orc-2e:weapons.dagger
    templates: [orc-2e:runes.weapon-potency-1, orc-2e:runes.flaming, orc-2e:runes.shock]
