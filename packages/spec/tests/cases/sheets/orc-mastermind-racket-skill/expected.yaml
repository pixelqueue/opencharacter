# The mastermind's skill, picked in the racket, comes right after the racket and before the
# rogue's free skills.
pending:
  - { choice: [free-boosts] }
  - { choice: [ancestry-feat-1] }
  - { choice: [languages] }
  - { entry: class, choice: [racket, 'orc-2e:classes.rogue.rackets.mastermind', skill] }
  - { entry: class, choice: [skills] }
  - { entry: class, choice: [class-feat-1] }
  - { entry: class, choice: [skill-feat-1] }
