# A 1st-level mastermind rogue with only its racket and key attribute picked.
specVersion: 0.1.0
id: example-orc-mastermind
packs:
  - { id: orc-2e, version: 0.2.0 }
features:
  - id: class
    item: orc-2e:classes.rogue
    choices:
      racket:
        - option: orc-2e:classes.rogue.rackets.mastermind
      key-attribute:
        - option: int
