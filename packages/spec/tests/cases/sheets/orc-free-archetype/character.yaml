# A 4th-level human fighter in a free archetype game: fighter feats in her class feat
# slots, and Barbarian Dedication and Barbarian Resiliency in the free archetype slots of 2nd and
# 4th level.
specVersion: 0.1.0
id: test-free-archetype
packs:
  - { id: orc-2e, version: 0.2.0 }
values:
  orc-2e:level: 4
  orc-2e:variants.freeArchetype: true
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      boosts:
        - option: orc-2e:boosts.con
        - option: orc-2e:boosts.dex
  - id: class
    item: orc-2e:classes.fighter
    choices:
      key-attribute:
        - option: str
      class-skill:
        - option: skill.athletics
      class-feat-1:
        - option: orc-2e:feats.fighter.sudden-charge
      class-feat-2:
        - option: orc-2e:feats.fighter.intimidating-strike
      class-feat-4:
        - option: orc-2e:feats.fighter.lunge
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.wis
  archetype-feat-2:
    - option: orc-2e:feats.archetype.barbarian.barbarian-dedication
      choices:
        instinct:
          - option: fury
  archetype-feat-4:
    - option: orc-2e:feats.archetype.barbarian.barbarian-resiliency
