# A 2nd-level human fighter (Strength +4, Constitution +2) who took Barbarian Dedication in her
# 2nd-level class feat slot, with the giant instinct.
specVersion: 0.1.0
id: test-multiclass-dedication
packs:
  - { id: orc-2e, version: 0.1.0 }
values:
  orc-2e:level: 2
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      boosts:
        - option: orc-2e:boosts.str
        - option: orc-2e:boosts.con
  - id: class
    item: orc-2e:classes.fighter
    choices:
      key-attribute:
        - option: str
      class-skill:
        - option: skill.acrobatics
      class-feat-1:
        - option: orc-2e:feats.fighter.sudden-charge
      class-feat-2:
        - option: orc-2e:feats.archetype.barbarian.barbarian-dedication
          choices:
            instinct:
              - option: giant
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.wis
