# A 12th-level human fighter (Dexterity +4) with Rogue Dedication (Stealth, Thievery), Basic
# Trickery, Advanced Trickery taken twice and Skill Mastery (Stealth from expert to master,
# Thievery from trained to expert): the rogue class DC its dedication trains, a rogue level
# of half the level, five rogue archetype feats (Advanced Trickery counts twice), and the skill
# ranks Skill Mastery raises.
specVersion: 0.1.0
id: test-rogue-archetype-numbers
packs:
  - { id: orc-2e, version: 0.2.1 }
values:
  orc-2e:level: 12
  orc-2e:skills.stealth.increases: 1
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      boosts:
        - option: orc-2e:boosts.dex
        - option: orc-2e:boosts.con
  - id: class
    item: orc-2e:classes.fighter
    choices:
      key-attribute:
        - option: str
      class-feat-2:
        - option: orc-2e:feats.archetype.rogue.rogue-dedication
          choices:
            skill:
              - option: skill.stealth
            free-skill:
              - option: skill.thievery
      class-feat-4:
        - option: orc-2e:feats.archetype.rogue.basic-trickery
          choices:
            feat:
              - option: orc-2e:feats.rogue.nimble-dodge
      class-feat-6:
        - option: orc-2e:feats.archetype.rogue.advanced-trickery
          choices:
            feat:
              - option: orc-2e:feats.rogue.trap-finder
      class-feat-8:
        - option: orc-2e:feats.archetype.rogue.advanced-trickery
          choices:
            feat:
              - option: orc-2e:feats.rogue.mobility
      class-feat-10:
        - option: orc-2e:feats.archetype.rogue.skill-mastery
          choices:
            to-master:
              - option: skill.stealth
            to-expert:
              - option: skill.thievery
choices:
  free-boosts:
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
  boosts-5:
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
  boosts-10:
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
