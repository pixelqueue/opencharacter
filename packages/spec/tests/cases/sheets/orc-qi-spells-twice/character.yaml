# Ren (orc-monk-crane-stance) takes Qi Spells twice, as a monk feat (inner upheaval) and through
# Natural Ambition (qi rush), with no stance. The qi spells' tradition is the rules' choice, asked
# once.
specVersion: 0.1.0
id: case-orc-qi-spells-twice
packs:
  - { id: orc-2e, version: 0.2.1 }
values:
  orc-2e:hp.current: 19
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      heritage:
        - option: orc-2e:heritages.versatile-human
          choices:
            feat:
              - option: orc-2e:feats.general.fleet
      boosts:
        - option: orc-2e:boosts.dex
        - option: orc-2e:boosts.wis
  - id: background
    item: orc-2e:backgrounds.acrobat
    choices:
      boost:
        - option: orc-2e:boosts.dex
      free-boost:
        - option: orc-2e:boosts.str
  - id: class
    item: orc-2e:classes.monk
    choices:
      key-attribute:
        - option: dex
      skills:
        - option: skill.athletics
        - option: skill.stealth
        - option: skill.medicine
        - option: skill.religion
      class-feat-1:
        - option: orc-2e:feats.monk.qi-spells
          choices:
            spell:
              - option: inner-upheaval
inventory:
  - { id: backpack, item: orc-2e:gear.backpack }
  - { id: rations, item: orc-2e:gear.rations, quantity: 2 }
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.natural-ambition
      choices:
        feat:
          - option: orc-2e:feats.monk.qi-spells
            choices:
              spell:
                - option: qi-rush
  languages:
    - option: orc-2e:languages.elven
  qi-tradition:
    - option: occult
