  - id: 5e-srd-5.1:level-up
    kind: derived
    followUp: 5e-srd-5.1:level-up
    to: self
    required: false
    action: { id: 5e-srd-5.1:level-up, followUp: 5e-srd-5.1:level-up }
    params: {}
