  # fighter (starting): light, medium, shield, heavy; barbarian (not starting): shield only
  5e-srd-5.1:proficiencies.armor: { value: [heavy, light, medium, shield] }
  # only the starting class (fighter) grants save.str and save.con
  5e-srd-5.1:proficiencies.saves: { value: [save.con, save.str] }
  5e-srd-5.1:saves.str: { value: 6 } # str mod 4 + proficiency 2
  5e-srd-5.1:saves.con: { value: 4 } # con mod 2 + proficiency 2
  5e-srd-5.1:saves.dex: { value: 2 } # dex mod 2, not proficient
  # shield equipped grants 'shield'; chain mail is not equipped, so no 'armor'
  5e-srd-5.1:equipment.tags: { value: [shield] }
