# A 12th-level human fighter with automatic bonus progression on, skill potency in
# Athletics (twice: +2) and Intimidation and Acrobatics (+1 each).
specVersion: 0.1.0
id: test-automatic-bonus-progression
packs:
  - { id: orc-2e, version: 0.2.1 }
values:
  orc-2e:level: 12
  orc-2e:variants.automaticBonus: true
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      boosts:
        - option: orc-2e:boosts.con
        - option: orc-2e:boosts.dex
  - id: class
    item: orc-2e:classes.fighter
    choices:
      key-attribute:
        - option: str
      class-skill:
        - option: skill.athletics
  - id: orc-2e-features-variants-automatic-bonus-progression
    item: orc-2e:features.variants.automatic-bonus-progression
    choices:
      skill-potency-3:
        - option: skill.athletics
      skill-potency-6:
        - option: skill.intimidation
      skill-potency-9:
        - option: skill.athletics
inventory:
  - { id: longsword, item: orc-2e:weapons.longsword, equipped: true }
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.wis
