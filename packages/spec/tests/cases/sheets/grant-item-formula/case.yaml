description: "A grant whose item is a formula: the feature grants the spell an input names (a local ID, qualified in the grant's pack), so its effect applies; with the input empty, nothing is granted"
specVersion: 0.1.0
call: computeSheet
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          daily.spell: { type: string, input: true, default: '' }
          light: { type: integer, formula: 0 }
          ward: { type: integer, formula: 0 }
        contentTypes:
          feature: {}
          spell: {}
      content:
        - id: features.evolution
          type: feature
          grants:
            - { item: { formula: daily.spell }, when: "daily.spell != ''" }
        - id: spells.light
          type: spell
          effects:
            - { target: light, op: add, value: 1 }
        - id: spells.ward
          type: spell
          effects:
            - { target: ward, op: add, value: 1 }
