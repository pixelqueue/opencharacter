# Custom stunts with and without limits: one per session already used up, one per conflict with a
# use left, one that only costs a fate point, and a plain one with neither.
specVersion: 0.1.0
id: example-fate-custom-stunts
packs:
  - { id: fate-core, version: 0.1.1 }
values:
  fate-core:aspects.highConcept: Smuggler Queen of the Outer Rim
  fate-core:fatePoints.current: 1
  fate-core:refresh.base: 4
features:
  - id: s-spent
    item: fate-core:stunts.custom
    fields: { limit: session }
    state: { label: Lucky Break, used: 1 }
  - id: s-fresh
    item: fate-core:stunts.custom
    fields: { limit: conflict, uses: 2 }
    state: { label: Quick Exit, used: 1 }
  - id: s-paid
    item: fate-core:stunts.custom
    fields: { fatePoint: true }
    state: { label: Friends in Low Places }
  - id: s-plain
    item: fate-core:stunts.custom
    fields: { skill: fate-core:skills.deceive }
    state: { label: Fast Talker, bonus: true }
