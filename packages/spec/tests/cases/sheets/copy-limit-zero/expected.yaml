# The homebrew Tracker picked, and added by hand as a copy as well: the copy is flagged. It is
# still active, so its dots count twice and Hunt is past its limit.
issues:
  - { code: too-many-copies, id: fitd-scoundrel:playbook }
  - { code: out-of-limits, id: fitd-scoundrel:ratings.hunt }
copyLimits:
  - type: fitd-scoundrel:playbook
    max: 0
    count: 1
    entries:
      - { entry: tracker, item: homebrew:playbooks.tracker }
errors: []
