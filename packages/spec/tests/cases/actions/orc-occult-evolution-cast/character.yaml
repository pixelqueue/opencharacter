# A 4th-level draconic sorcerer (an occult exemplar) with Occult Evolution, which added calm (a
# mental occult 2nd-rank spell) to her repertoire for the day.
specVersion: 0.1.0
id: test-occult-evolution
packs:
  - { id: orc-2e, version: 0.3.0 }
values:
  orc-2e:level: 4
  orc-2e:sorcerer.evolutionSpell: orc-2e:spells.calm
  orc-2e:sorcerer.evolutionRank: 2
  orc-2e:hp.current: 27
  orc-2e:skills.intimidation.increases: 1
features:
  - id: ancestry
    item: orc-2e:ancestries.halfling
    choices:
      heritage:
        - option: orc-2e:heritages.gutsy-halfling
      boosts:
        - option: standard
          choices:
            free:
              - option: orc-2e:boosts.cha
  - id: background
    item: orc-2e:backgrounds.criminal
    choices:
      boost:
        - option: orc-2e:boosts.dex
      free-boost:
        - option: orc-2e:boosts.cha
  - id: class
    item: orc-2e:classes.sorcerer
    choices:
      bloodline:
        - option: orc-2e:classes.sorcerer.bloodlines.draconic
          choices:
            exemplar:
              - option: occult
      skills:
        - option: skill.deception
        - option: skill.diplomacy
      orc-2e:features.spellcasting.repertoire/cantrips:
        - option: orc-2e:spells.electric-arc
        - option: orc-2e:spells.frostbite
        - option: orc-2e:spells.ignition
        - option: orc-2e:spells.tangle-vine
      orc-2e:features.spellcasting.repertoire/spells-1:
        - option: orc-2e:spells.breathe-fire
        - option: orc-2e:spells.heal
        - option: orc-2e:spells.thunderstrike
      orc-2e:features.spellcasting.repertoire/spells-2:
        - option: orc-2e:spells.entangling-flora
        - option: orc-2e:spells.oaken-resilience
      orc-2e:features.spellcasting.signature-spells/signature-1:
        - option: orc-2e:spells.breathe-fire
      orc-2e:features.spellcasting.signature-spells/signature-2:
        - option: orc-2e:spells.shatter
      class-feat-2:
        - option: orc-2e:feats.sorcerer.propelling-sorcery
      class-feat-4:
        - option: orc-2e:feats.sorcerer.occult-evolution
          choices:
            skill:
              - option: skill.society
      skill-feat-2:
        - option: orc-2e:feats.skill.intimidating-glare
inventory:
  - { id: staff, item: orc-2e:weapons.staff, equipped: true }
  - { id: sling, item: orc-2e:weapons.sling, equipped: true }
  - { id: backpack, item: orc-2e:gear.backpack }
  - { id: bedroll, item: orc-2e:gear.bedroll }
choices:
  free-boosts:
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.wis
    - option: orc-2e:boosts.cha
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.halfling-luck
  general-feat-3:
    - option: orc-2e:feats.general.fleet
