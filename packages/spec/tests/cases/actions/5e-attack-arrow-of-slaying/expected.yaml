    step: ammo
    change: { type: adjustQuantity, entry: slaying, by: -1 }
  - {
      to: target,
      character: wyrmling,
      step: deal,
      change:
        {
          type: adjust,
          field: 5e-srd-5.1:hp.current,
          by: -8,
          tags:
            [
              damage,
              attack,
              weapon,
              ranged,
              magical,
              plain-material,
              wielder.neutral,
              damage.piercing,
            ],
        },
    }
  - {
      to: target,
      character: wyrmling,
      step: 'slay[0]',
      change:
        {
          type: adjust,
          field: 5e-srd-5.1:hp.current,
          by: -21,
          tags:
            [
              damage,
              damage.piercing,
              weapon,
              ranged,
              magical,
              wielder.neutral,
              save-half,
              save.con,
              save-failure,
