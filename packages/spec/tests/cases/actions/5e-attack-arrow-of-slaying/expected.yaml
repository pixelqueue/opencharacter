# piercing, magical. The arrow slays dragons and the target is one: 6d10 (21) piercing more, and
# the wyrmling's DC 17 Constitution save fails (12), so it takes all 21.
status: finished
outcome:
  result: hit
  data: { critical: false, attack: 18 }
