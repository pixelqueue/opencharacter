# Just Passing Through: 1 heat off (1 to 0). No heat left, so No Traces gives 1 rep (2 to 3),
# on the sheet the earlier step proposed.
status: finished
outcome:
  result: done
proposedChanges:
  - to: self
    step: heat
    change:
      type: set
      field: fitd-crew:heat.current
      value: 0
  - to: self
    step: rep
    change:
      type: set
      field: fitd-crew:rep.current
      value: 3
