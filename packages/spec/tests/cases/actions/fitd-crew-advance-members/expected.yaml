# Tier I: each member passed takes tier + 2 = 3 stash on their own sheet; the outcome still
# reports it for an app that passes none.
status: finished
outcome:
  result: ability
  data:
    stash: 3
proposedChanges:
  - to: self
    step: advance
    change:
      type: adjust
      field: fitd-crew:advances.abilities
      by: 1
  - to: self
    step: ability
    change:
      type: choose
      path:
        choice:
          - crew-abilities
      option: fitd-crew:crew-abilities.patron
  - to: self
    step: clear
    change:
      type: set
      field: fitd-crew:xp.current
      value: 0
  - to: member
    character: kit
    step: stash[0]
    change:
      type: adjust
      field: fitd-scoundrel:stash
      by: 3
  - to: member
    character: vale
    step: stash[1]
    change:
      type: adjust
      field: fitd-scoundrel:stash
      by: 3
