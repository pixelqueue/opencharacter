# 3 stress for the ritual. Attune 2 (the Whisper's dots) rolls [4, 1]: a partial, so some
# consequence manifests. The fortune roll, 2d6 [5, 2], is a partial too; 1 coin of rare
# materials makes it a success.
status: finished
outcome:
  result: performed
  data: { stress: 3, danger: partial, manifest: success }
proposedChanges:
  - { to: self, step: cost, change: { type: adjust, field: fitd-scoundrel:stress.current, by: 3 } }
  - { to: self, step: spend, change: { type: adjust, field: fitd-scoundrel:coin, by: -1 } }
log:
  - {
      step: danger/roll,
      kind: dice,
      by: engine,
      faces: [4, 1],
      total: 4,
      band: partial,
      bandSet: fitd-scoundrel:action,
    }
  - {
      step: manifest/roll,
      kind: dice,
      by: engine,
      faces: [5, 2],
      total: 5,
      band: partial,
      bandSet: fitd-scoundrel:action,
    }
  - { step: coin, kind: choice, by: app, option: '1' }
