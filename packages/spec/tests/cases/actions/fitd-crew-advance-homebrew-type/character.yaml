specVersion: 0.1.0
id: test
packs:
  - { id: fitd-crew, version: 0.3.0 }
# The table's own crew type, offering three of the SRD's abilities.
homebrew:
  defaultLanguage: en
  rules: { tags: [wardens] }
  content:
    - id: crew-types.wardens
      type: crewType
      tags: [wardens]
      fields:
        upgrades: [fitd-crew:upgrades.prisonContacts]
        startingUpgrades: [fitd-crew:upgrades.lair.hidden, fitd-crew:upgrades.training.prowess]
      choices:
        - id: special-ability
          pick: 1 + advances.abilities
          from:
            type: crewAbility
            where: >-
              item.id in [@fitd-crew:crew-abilities.second-story,
                @fitd-crew:crew-abilities.pack-rats,
                @fitd-crew:crew-abilities.synchronized]
        - id: operation
          pick: 1
          from: { type: operation }
  i18n:
    en:
      crew-types.wardens.name: Wardens
      tags.wardens.name: Wardens
values:
  fitd-crew:tier: 1
  fitd-crew:xp.current: 8
  fitd-crew:upgrades.lair.hidden: 1
  fitd-crew:upgrades.training.prowess: 1
choices:
  crew-type:
    - option: homebrew:crew-types.wardens
      choices:
        special-ability:
          - option: fitd-crew:crew-abilities.second-story
        operation:
          - option: fitd-crew:operations.burglary
