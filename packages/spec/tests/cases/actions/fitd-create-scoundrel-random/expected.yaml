# The engine draws each pick. No playbook (the pack has none): the d42
# 14 picks the 14th special ability of the SRD's pool, Expertise; the d7 3 Luxury. The three
# starting dots: the d12 9 puts one on Attune, the d12 9 a second there, then (Attune full) the
# d11 1 one on Hunt. The heritage's d11 5 and the background's d11 5 go on Finesse; with Finesse
# full, the last two d10 9s go on Consort. Expertise's action: the d12 4, Tinker.
status: finished
outcome: {}
proposedChanges:
  - to: self
    step: poolAbility
    change:
      type: choose
      path:
        choice:
          - special-abilities
      option: fitd-scoundrel:special-abilities.expertise
  - to: self
    step: vice
    change:
      type: choose
      path:
        choice:
          - vice
      option: fitd-scoundrel:vices.luxury
  - to: self
    step: startingDots
    change:
      type: adjust
      field: fitd-scoundrel:ratings.hunt
      by: 1
  - to: self
    step: startingDots
    change:
      type: adjust
      field: fitd-scoundrel:ratings.attune
      by: 2
  - to: self
    step: heritageDot
    change:
      type: adjust
      field: fitd-scoundrel:ratings.finesse
      by: 1
  - to: self
    step: backgroundDot
    change:
      type: adjust
      field: fitd-scoundrel:ratings.finesse
      by: 1
  - to: self
    step: dots
    change:
      type: adjust
      field: fitd-scoundrel:ratings.consort
      by: 2
  - to: self
    step: picks
    change:
      type: choose
      path: { choice: [special-abilities, fitd-scoundrel:special-abilities.expertise, action] }
      option: tinker
  - to: self
    step: finish
    change:
      type: finishCreation
