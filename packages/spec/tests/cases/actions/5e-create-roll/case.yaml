description: "5E's guided creation by rolling: six 4d6 dropping the lowest, then an allocate step whose values are the rolls gives each to a different ability; two equal rolls are two values, then the fighter's starting equipment"
specVersion: 0.1.0
call: startAction
packs:
  - path: ../../../../../../packs/5e/srd-5.1
input:
  action: { id: 5e-srd-5.1:create-character }
  # The pending picks take their recommendations where they have one: `#done` isn't
  # offered while the character is being created.
  policy: { choices: pause, allocations: pause, rules: [{ kind: choice, step: picks, then: auto }] }
answers:
  - option: 5e-srd-5.1:races.dwarf
  - option: 5e-srd-5.1:subraces.hill-dwarf
  - option: 5e-srd-5.1:classes.fighter
  - option: 5e-srd-5.1:backgrounds.acolyte
  - option: roll
  - amounts:
      {
        5e-srd-5.1:abilities.str.base: 18,
        5e-srd-5.1:abilities.dex.base: 12,
        5e-srd-5.1:abilities.con.base: 15,
        5e-srd-5.1:abilities.int.base: 5,
        5e-srd-5.1:abilities.wis.base: 12,
        5e-srd-5.1:abilities.cha.base: 9,
      }
  # The pending picks the recommendations leave open, in the step's order.
  - option: 5e-srd-5.1:tools.smiths-tools
  - option: 5e-srd-5.1:fighting-styles.archery
  - option: skill.acrobatics
  - option: skill.animal-handling
  - option: 5e-srd-5.1:languages.abyssal
  - option: 5e-srd-5.1:languages.celestial

  # The fighter's starting equipment, line by line: two martial weapons this time.
  - option: leather-longbow
  - option: two-martial
  - option: 5e-srd-5.1:weapons.battleaxe
  - option: 5e-srd-5.1:weapons.warhammer
  - option: two-handaxes
  - option: explorers-pack
  - option: 5e-srd-5.1:gear.amulet
