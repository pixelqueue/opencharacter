# The classes in ID order: esoteric-hermit, fanged-deserter, gutterborn-scum, heretical-priest,
# occult-herbmaster, wretched-royalty; the d6 rolls 6. The Royalty rolls 3d6 for each ability:
# 12, 12, 17 (+3), 12. HP 1d6 = 5. Silver 4d6 = 6, x10. Weapon d8 7 is a bow: 3 + 10 = 13
# arrows. Armor d3 3 is medium. The character already has a copy `weapons-bow-1`, so the bow is
# `weapons-bow-2`. Features, asked over the class's pending choice, are drawn among its options:
# the d6 4 draws Hamfund, then the d5 1 the blade, the 1st of the five left. The weapons the
# features bring follow, in the class's option order: the blade itself, then Hamfund's Eurekia. Before the
# weapon, food (d4 2 days) and the equipment tables: the d6 3 a backpack, the d12 2 Presence + 4 = 7
# torches, the second d12 9 a shield (not equipped).
status: finished
outcome:
  result: rolled
proposedChanges:
  - to: self
    step: class
    change:
      {
        type: addItem,
        entry: { id: classes-wretched-royalty-1, item: mork-borg-core:classes.wretched-royalty },
      }
  - {
      to: self,
      step: save,
      change: { type: set, field: mork-borg-core:abilities.strength, value: 0 },
    }
  - {
      to: self,
      step: save,
      change: { type: set, field: mork-borg-core:abilities.agility, value: 0 },
