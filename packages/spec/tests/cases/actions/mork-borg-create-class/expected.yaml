    change:
      type: addItem
      entry: { id: shields-shield-1, item: mork-borg-core:shields.shield }
  - to: self
    step: features
    change:
      {
        type: choose,
        path: { entry: classes-wretched-royalty-1, choice: [feature] },
        option: hamfund,
      }
  - to: self
    step: features
    change:
      type: choose
      path: { entry: classes-wretched-royalty-1, choice: [feature] }
