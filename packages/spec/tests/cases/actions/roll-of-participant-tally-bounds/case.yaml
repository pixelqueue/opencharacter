description: "A roll's tally bound holds when it is classified again per participant, after the participant's own adds, though it matches only the roll's tag: banes don't count, the roll's own or a taunting target's"
specVersion: 0.1.0
call: startAction
packs:
  - path: ../../../packs/test-power-rolls
input:
  action: { id: test-power-rolls:strike }
  situational: { test-power-rolls:banes: 1 }
  participants:
    target:
      - { id: b, values: { test-power-rolls:prone: true } }
      - { id: d, values: { test-power-rolls:taunting: true } }
