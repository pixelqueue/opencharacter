# The opposition (+2) is known before the dice, so skill-roll's 4dF roll is summarized against
# it: the outcome bands with `succeed` marked, the ladder half of `check` unreachable, and
# skill-roll's flags. The ladder rung is read after, by the dice-less `rung` step. Overcome's
# dice-less `final` step reads the total after invocations against the same bands. `style`
# reads `roll.total - 2` (arithmetic on the roll), so it has text only.
status: finished
outcome:
  result: succeed
  data: { total: 3, opposition: 2, shifts: 1, boost: false }
log:
  - step: roll/roll
    action: fate-core:skill-roll
    kind: dice
    total: 3
    band: succeed
    bandSet: fate-core:check
    summary:
      bandSet: fate-core:check
      bands:
        - { band: style, when: 'roll.total - 2 >= 3' }
        - band: succeed
          success: true
          when: 'roll.total > 2'
          tests: [{ of: roll.total, compare: gt, value: 2 }]
        - band: tie
          when: 'roll.total == 2'
          tests: [{ of: roll.total, compare: eq, value: 2 }]
        - { band: fail, when: 'true', tests: [] }
      flags: { against: true, opposition: 2 }
  - { step: 'roll/rerolling[0]/reroll', kind: choice, option: keep }
  - { step: roll/invokes, kind: choice, option: '0' }
  - { step: roll/freeInvokes, kind: choice, option: '0' }
  - { step: roll/rung, action: fate-core:skill-roll, kind: dice, total: 3, band: good }
  - step: final
    action: fate-core:overcome
    kind: dice
    faces: null
    total: 3
    band: succeed
    bandSet: fate-core:outcome
    summary:
      bandSet: fate-core:outcome
      bands:
        - { band: style, when: 'roll.total - 2 >= 3' }
        - band: succeed
          success: true
          when: 'roll.total > 2'
          tests: [{ of: roll.total, compare: gt, value: 2 }]
        - band: tie
          when: 'roll.total == 2'
          tests: [{ of: roll.total, compare: eq, value: 2 }]
        - { band: fail, when: 'true', tests: [] }
      flags: { total: 3, opposition: 2 }
