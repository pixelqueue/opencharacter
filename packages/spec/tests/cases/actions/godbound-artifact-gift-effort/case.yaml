description:
  "godbound-core: a gift an artifact grants spends the artifact's Effort: its grant marks the gift
  with the artifact's pool, and invoke-gift (with the artifact's copy as self) adds to its spent
  Effort instead of committing the hero's"
specVersion: 0.1.0
call: startAction
packs:
  - path: ../../../../../../packs/godbound/core
input:
  action:
    id: godbound-core:invoke-gift
    entry: ember-heart
    source: godbound-core:gifts.health.vital-furnace
