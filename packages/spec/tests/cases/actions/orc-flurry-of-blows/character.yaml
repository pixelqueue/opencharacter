# The example monk at 2nd level with Stunning Blows, in Tiger Stance: Dexterity +4, Strength +2,
# trained in unarmed attacks (+4 at 2nd level).
specVersion: 0.1.0
id: example-orc-ren
packs:
  - { id: orc-2e, version: 0.3.0 }
values:
  orc-2e:level: 2
  orc-2e:hp.current: 30
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      heritage:
        - option: orc-2e:heritages.versatile-human
          choices:
            feat:
              - option: orc-2e:feats.general.fleet
      boosts:
        - option: orc-2e:boosts.dex
        - option: orc-2e:boosts.wis
