# Fireball is on the wizard's list, so the scroll offers `read`; the wizard knows no fireball of
# their own, so the scroll's DC 15 applies. 8d6 = 32, and reading spends the scroll.
status: finished
outcome:
  result: save
  data:
    slot: 3
    spellcastingClass: none
    metamagic: none
    dc: 15
    save: dex
    halfOnSave: true
    damage: 32
    healing: 0
    concentration: false
    critical: false
proposedChanges:
  - to: self
    step: cost
    change: { type: adjustQuantity, entry: scroll, by: -1 }
log:
  - step: cost
    action: 5e-srd-5.1:cast-spell
    kind: choice
    by: app
    option: '5e-srd-5.1:magic-items.spell-scroll-level-3#read'
  - step: damage
    action: 5e-srd-5.1:cast-spell
    kind: dice
    by: engine
    faces: [6, 5, 4, 3, 2, 1, 6, 5]
    total: 32
