description: "A per-copy `by` that reads `self` and a flag is passed on with the flag's value substituted"
specVersion: 0.1.0
call: startAction
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          gem:
            carried: true
            fields:
              color: { type: enum, values: [red, blue] }
            state:
              charge: { type: integer, min: 0, default: 3 }
        actions:
          - id: drain-all
            params:
              amount: { type: integer, min: 0 }
            steps:
              - id: amount
                kind: branch
                cases:
                  - when: true
                    flags: { amount: params.amount * 2 }
              - id: spend
                kind: changes
                changes:
                  - type: adjustState
                    copies: { type: gem, where: self.charge > 0 }
                    key: charge
                    by: -min(self.charge, flags.amount)
      content:
        - { id: gems.ruby, type: gem, fields: { color: red } }
input:
  action: { id: test-pack:drain-all }
  params: { amount: 2 }
