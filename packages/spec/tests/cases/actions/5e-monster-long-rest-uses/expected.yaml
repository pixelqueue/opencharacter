# The rest's usual changes, then one setState over monsterAction copies with uses to regain:
# Legendary Resistance back to 3. The breath (no uses) doesn't match; an innate spell's copy
# would, by its `perDay` state.
status: finished
outcome: { result: rested }
proposedChanges:
  - { to: self, step: rest, change: { type: set, field: '5e-srd-5.1:hp.current', value: 256 } }
