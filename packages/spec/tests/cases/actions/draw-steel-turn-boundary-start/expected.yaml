# foe's turn starts: its next-start entries end and its next-end ones last this turn; goblin's
# turn ended, so what goblin applied this turn ends.
status: finished
outcome:
  result: passed
proposedChanges:
  - to: self
    step: boundary
    change:
      type: removeEffect
      applied:
        where: has(self.duration) && self.duration == 'this-turn' && self.appliedBy ==
          'goblin'
  - to: self
    step: boundary
    change:
      type: removeEffect
      applied:
        where: has(self.duration) && self.duration == 'next-start' && self.appliedBy ==
          'foe'
  - to: self
    step: boundary
    change:
      type: setState
      key: duration
      applied:
        where: has(self.duration) && self.duration == 'next-end' && self.appliedBy ==
          'foe'
      value: "'this-turn'"
log: []
