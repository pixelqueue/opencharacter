# The potion is spent, and its condition applied to the drinker, magically.
status: finished
outcome:
  result: drunk
  data:
    healed: 0
proposedChanges:
  - to: self
    step: drink
    change:
      type: adjustQuantity
      entry: potion
      by: -1
  - to: self
    step: drink
    change:
      type: applyEffect
      source: 5e-srd-5.1:conditions.invisible
      state:
        magical: true
