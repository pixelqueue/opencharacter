# A 1st-level Warrior with a soldier's background: rolled attributes with Strength raised to 14,
# the quick skills, Armsmaster as the Warrior's combat Focus and Die Hard as the free one,
# pieced armor and a large shield, and a short sword.
specVersion: 0.1.0
id: example-wn-fantasy-brannoc
packs:
  - { id: wn-fantasy, version: 0.1.0 }
values:
  wn-fantasy:attributes.str.score: 14
  wn-fantasy:attributes.dex.score: 11
  wn-fantasy:attributes.con.score: 15
  wn-fantasy:attributes.int.score: 8
  wn-fantasy:attributes.wis.score: 10
  wn-fantasy:attributes.cha.score: 7
  # Soldier: Stab-0 free, Exert-0 and Survive-0 quick; Armsmaster's Stab makes it Stab-1;
  # Notice-0 is the free pick.
  wn-fantasy:skills.stab: 1
  wn-fantasy:skills.exert: 0
  wn-fantasy:skills.survive: 0
  wn-fantasy:skills.notice: 0
  # 1d6 + 2 + Constitution +1.
  wn-fantasy:hp.rolled: 7
  wn-fantasy:hp.current: 9
  wn-fantasy:coins.silver: 12
features:
  - id: background
    item: wn-fantasy:backgrounds.soldier
  - id: class
    item: wn-fantasy:classes.warrior
  - id: focus-1
    item: wn-fantasy:foci.armsmaster
    state: { level: 1 }
  - id: focus-2
    item: wn-fantasy:foci.die-hard
    state: { level: 1 }
inventory:
  - { id: armor, item: wn-fantasy:armor.pieced-armor, equipped: true }
  - { id: shield, item: wn-fantasy:armor.large-shield, equipped: true }
  - { id: sword, item: wn-fantasy:weapons.short-sword, equipped: true }
  - { id: dagger, item: wn-fantasy:weapons.dagger, equipped: true }
  - { id: backpack, item: wn-fantasy:gear.backpack, equipped: true }
  - { id: tinder-box, item: wn-fantasy:gear.tinder-box }
  - { id: torches, item: wn-fantasy:gear.torch, quantity: 3 }
