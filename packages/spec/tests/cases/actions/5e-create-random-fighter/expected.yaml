      to: self,
      step: picks,
      change:
        {
          type: choose,
          path: { entry: race, choice: [5e-srd-5.1:traits.tool-proficiency-dwarf/tool] },
          option: 5e-srd-5.1:tools.brewers-supplies,
        },
    }
  - {
      to: self,
      step: picks,
      change:
        {
          type: choose,
          path: { entry: class, choice: [fighting-style] },
          option: 5e-srd-5.1:fighting-styles.dueling,
