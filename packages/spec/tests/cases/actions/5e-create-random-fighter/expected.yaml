status: finished
proposedChanges:
  - {
      to: self,
      step: race,
      change: { type: addItem, entry: { id: race, item: 5e-srd-5.1:races.dwarf } },
    }
  - {
      to: self,
      step: subrace,
      change:
        {
          type: choose,
          path: { entry: race, choice: [subrace] },
          option: 5e-srd-5.1:subraces.hill-dwarf,
        },
    }
  - {
      to: self,
      step: class,
      change:
        {
          type: addItem,
          entry:
            {
              id: class,
              item: 5e-srd-5.1:classes.fighter,
              state: { level: 1, startingClass: true },
            },
        },
    }
  - {
      to: self,
      step: background,
      change: { type: addItem, entry: { id: background, item: 5e-srd-5.1:backgrounds.acolyte } },
    }
  - {
      to: self,
      step: scores,
      change: { type: set, field: 5e-srd-5.1:abilities.str.base, value: 17 },
    }
  - {
      to: self,
      step: scores,
      change: { type: set, field: 5e-srd-5.1:abilities.dex.base, value: 14 },
    }
  - {
      to: self,
      step: scores,
      change: { type: set, field: 5e-srd-5.1:abilities.con.base, value: 14 },
    }
  - {
      to: self,
      step: scores,
      change: { type: set, field: 5e-srd-5.1:abilities.int.base, value: 8 },
    }
  - {
      to: self,
      step: scores,
      change: { type: set, field: 5e-srd-5.1:abilities.wis.base, value: 12 },
