    kind: dice
    by: engine
    faces: [1]
    draw: { among: ['test-pack:stats.might', 'test-pack:stats.wits', 'test-pack:stats.grace'] }
  - step: points
    kind: dice
    by: engine
    faces: [1]
    draw: { among: ['test-pack:stats.wits', 'test-pack:stats.grace'] }
