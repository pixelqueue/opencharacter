description: "draw-steel-heroes: a melee strike gains each target's edges and banes against it, from the target's view (powerRoll.*Against), and they add up"
specVersion: 0.4.0
call: startAction
packs:
  - path: ../../../../../../packs/draw-steel/heroes
  - path: ../../../packs/test-draw-steel-foe
input:
  action:
    {
      id: draw-steel-heroes:use-ability,
      entry: draw-steel-heroes-abilities-common-melee-weapon-free-strike,
    }
  participants:
    target:
      - { id: plain, values: {} }
      - { id: any-roll, values: { draw-steel-heroes:powerRoll.edgesAgainst: 1 } }
      - { id: strikes, values: { draw-steel-heroes:powerRoll.strikeEdgesAgainst: 1 } }
      - { id: melee-strikes, values: { draw-steel-heroes:powerRoll.meleeStrikeEdgesAgainst: 1 } }
      - { id: strike-bane, values: { draw-steel-heroes:powerRoll.strikeBanesAgainst: 1 } }
      - { id: for-heroes, values: { draw-steel-heroes:powerRoll.edgesAgainstFor: [heroes] } }
      - { id: for-director, values: { draw-steel-heroes:powerRoll.edgesAgainstFor: [director] } }
      - id: double-edge
        values:
          {
            draw-steel-heroes:powerRoll.edgesAgainst: 1,
            draw-steel-heroes:powerRoll.strikeEdgesAgainst: 1,
          }
      - id: edge-and-bane
        values:
          {
            draw-steel-heroes:powerRoll.strikeEdgesAgainst: 2,
            draw-steel-heroes:powerRoll.banesAgainst: 1,
          }
