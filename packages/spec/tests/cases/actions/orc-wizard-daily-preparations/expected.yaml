# Two 1st-rank copies were cast today (fear, force barrage) and the 1st rank drained: both come
# back.
status: finished
outcome:
  result: prepared
proposedChanges:
  # Every once-a-day feat's pick is reset; with none used, nothing changes.
  - to: self
    step: regain
    change:
      type: setState
      key: used
      picks: { where: self.used }
      value: false
  - to: self
    step: regain
    change:
      type: setState
      key: fanUses
      picks: { where: has(self.fanUses) && self.fanUses > 0 }
      value: 0
  - to: self
    step: regain
    change:
      type: setState
      key: expended
      copies:
        type: orc-2e:spell
        where: self.expended
      value: false
  - to: self
    step: regain
    change:
      type: setState
      key: bondDrained
      grants: { where: self.bondDrained > 0 }
      value: 0
  # Arcane Bond keeps its own state; with Linked Focus unused, nothing changes.
  - to: self
    step: regain
    change:
      type: setState
      key: linkedFocusUsed
      grants: { where: self.linkedFocusUsed }
      value: false
log: []
