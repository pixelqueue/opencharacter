description: "draw-steel-heroes: a ranged strike gains the target's strike edges, not its melee-strike ones"
specVersion: 0.4.0
call: startAction
packs:
  - path: ../../../../../../packs/draw-steel/heroes
  - path: ../../../packs/test-draw-steel-foe
input:
  action:
    {
      id: draw-steel-heroes:use-ability,
      entry: draw-steel-heroes-abilities-common-ranged-weapon-free-strike,
    }
  participants:
    target:
      - { id: strikes, values: { draw-steel-heroes:powerRoll.strikeEdgesAgainst: 1 } }
      - { id: melee-strikes, values: { draw-steel-heroes:powerRoll.meleeStrikeEdgesAgainst: 1 } }
