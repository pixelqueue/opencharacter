specVersion: 0.1.0
id: test
packs:
  - { id: fitd-scoundrel, version: 0.1.0 }
creating: true
# A table's own playbook: Hunt 2 and Survey 1, with two of the SRD's abilities.
homebrew:
  rules: { tags: [tracker] }
  content:
    - id: playbooks.tracker
      type: playbook
      tags: [tracker]
      fields:
        twoDots: [fitd-scoundrel:ratings.hunt]
        oneDot: [fitd-scoundrel:ratings.survey]
      choices:
        - id: special-ability
          pick: 1 + advances.playbook
          from:
            type: specialAbility
            where: >-
              item.id in [@fitd-scoundrel:special-abilities.scout,
                @fitd-scoundrel:special-abilities.sharpshooter]
