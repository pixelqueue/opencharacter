# Strength test, natural 20: crit. Damage 1d6 = 5, doubled in the roll (`crit-damage`): 10 for
# the target, whose worn armor drops a tier (a change aimed at the target's armor copies,
# resolved by its applyChanges).
status: finished
outcome:
  result: crit
  data:
    damage: 10
    sepsis: false
    skullSmashed: false
proposedChanges:
  - to: target
    step: deal
    change:
      type: adjust
      field: mork-borg-core:hp.current
      by: -10
      tags:
        - damage
  - to: target
    step: sunder
    change:
      type: adjustState
      copies:
        type: mork-borg-core:armor
        where: self.equipped && self.damage < item.tier
      limit: 1
      key: damage
      by: 1
log:
  - step: check/check
    action: mork-borg-core:test
    kind: dice
    by: engine
    faces:
      - 20
    total: 21
    band: crit
    bandSet: mork-borg-core:test
  - step: damage
    action: mork-borg-core:attack
    kind: dice
    by: engine
    faces:
      - 5
    total: 10
