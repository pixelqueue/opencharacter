description: "draw-steel-heroes: a creature on the Director's side (side set by an effect) gains the edge a target gives the Director's side"
specVersion: 0.4.0
call: startAction
packs:
  - path: ../../../../../../packs/draw-steel/heroes
  - path: ../../../packs/test-draw-steel-foe
input:
  action:
    {
      id: draw-steel-heroes:use-ability,
      entry: draw-steel-heroes-abilities-common-melee-weapon-free-strike,
    }
  participants:
    target:
      - { id: for-heroes, values: { draw-steel-heroes:powerRoll.edgesAgainstFor: [heroes] } }
      - { id: for-director, values: { draw-steel-heroes:powerRoll.edgesAgainstFor: [director] } }
