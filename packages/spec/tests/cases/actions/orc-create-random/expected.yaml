# Each pick is a draw among its options: a d16's 8 is the 8th of 16 ancestries
# (human), 1 the first of its nine heritages (aiuvarin, a versatile heritage), 10 the 10th of 64
# backgrounds (barkeep) and 12 the 12th of 16 classes (rogue). The d2's 1 plans Strength as the
# key, so the human's two free boosts go to Strength and Constitution and the
# barkeep's to Constitution (of Constitution and Charisma) and Strength; the thief racket makes
# Dexterity the key, and the four free boosts are Dexterity, Strength, Constitution and Wisdom.
# Every other pick is uniform among its options. The changes apply cleanly
# (orc-finish-random-creation).
