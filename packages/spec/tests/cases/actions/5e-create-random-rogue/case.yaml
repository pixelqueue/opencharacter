description: "5E's random start, run automatically: a half-elf rogue. The rolls go to the rogue's abilities by its priority (Dexterity, Constitution, Wisdom, Intelligence, Charisma, Strength), the half-elf's two +1s to its first two (Dexterity and Constitution), and the engine draws every other pick among the options it offers: a skill the character already has (Insight and Religion from the acolyte, then each skill picked) and a language it knows aren't offered again, while Expertise picks among the skills it has; then its starting equipment and the acolyte's, each line drawn among its options"
