# No class die: the class is the player's pick. Every die shows 2: the Deserter's Strength 3d6 + 2
# = 8 (−1), the other abilities 3d6 = 6 (−2), HP max(1, −2 + 2) = 1. The feature is the player's
# pick, the gore-hound, and creation finishes though the hound's sheet isn't linked yet.
