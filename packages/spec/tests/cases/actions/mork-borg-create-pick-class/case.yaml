description: "MÖRK BORG guided start: the player picks the class (any of the seven, the classless one included) instead of the d6, then the rest is rolled as in the random starts, each item the tables give offered as a pick among its type's content (the table's recommended); the class's feature still recommends a drawn option, which the player may change: here the gore-hound, whose missing sheet doesn't stop creation finishing"
specVersion: 0.1.0
call: startAction
packs:
  - path: ../../../../../../packs/mork-borg/core
input:
  action: { id: mork-borg-core:create-character }
  params: { choose: true }
  policy: { dice: auto, choices: pause }
answers:
  - option: mork-borg-core:classes.fanged-deserter
  - option: mork-borg-core:weapons.staff
  - option: mork-borg-core:armor.light
  - option: mork-borg-core:scrolls.sacred.grace-for-a-sinner
  - option: ancient-gore-hound
