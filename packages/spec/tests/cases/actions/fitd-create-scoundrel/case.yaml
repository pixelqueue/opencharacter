description: "FitD's guided creation with no playbook (the SRD names none) picks a special ability from the SRD's pool and the vice, places the three starting dots, adds the heritage's dot, the background's and two more, writes the player's words and ends by proposing finishCreation"
specVersion: 0.1.0
call: startAction
packs:
  - path: ../../../../../../packs/fitd/scoundrel
input:
  action: { id: fitd-scoundrel:create-scoundrel }
  params:
    heritage: Northern refugees
    background: Military, a deserter
    alias: Slate
    look: Long coat, scarred knuckles
    friend: Ivo, a boxer
    rival: Dren, a debt collector
    purveyor: Old Mott, at the dice den
  policy: { dice: pause, choices: pause, allocations: pause }
answers:
  - option: fitd-scoundrel:special-abilities.mule
  - option: fitd-scoundrel:vices.gambling
  - amounts: { fitd-scoundrel:ratings.skirmish: 2, fitd-scoundrel:ratings.command: 1 }
  - amounts: { fitd-scoundrel:ratings.survey: 1 }
  - amounts: { fitd-scoundrel:ratings.prowl: 1 }
  - amounts: { fitd-scoundrel:ratings.prowl: 1, fitd-scoundrel:ratings.command: 1 }
