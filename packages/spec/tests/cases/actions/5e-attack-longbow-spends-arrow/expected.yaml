    action: 5e-srd-5.1:weapon-attack
    kind: choice
    by: engine
    option: arrows-2
  - step: attack
    action: 5e-srd-5.1:weapon-attack
    kind: dice
    by: engine
    faces: [10]
    total: 13
  - step: damage
    action: 5e-srd-5.1:weapon-attack
