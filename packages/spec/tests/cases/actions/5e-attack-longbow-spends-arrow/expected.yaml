outcome:
  result: hit
  data: { critical: false, attack: 13 }
proposedChanges:
  - to: self
    step: ammo
    change: { type: adjustQuantity, entry: arrows-2, by: -1 }
  - {
      to: target,
      step: deal,
      change:
        {
          type: adjust,
          field: 5e-srd-5.1:hp.current,
          by: -8,
          tags:
            [
              damage,
              attack,
              weapon,
              ranged,
              nonmagical,
              plain-material,
              wielder.neutral,
              damage.piercing,
            ],
        },
    }
log:
