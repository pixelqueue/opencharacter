description: "A proposed `adjust` whose `by` gives dice is a dice checkpoint at its step, matched by the change's tags: with the policy pausing on them, the action asks for the dice and takes the app's faces"
specVersion: 0.3.0
call: startAction
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.3.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        tags: [strain]
        fields:
          hp: { type: integer, input: true, default: 10 }
        contentTypes:
          feature: {}
        actions:
          - id: strain
            steps:
              - id: hurt
                kind: changes
                changes:
                  - { type: adjust, field: hp, by: -2d6kh1, tags: [strain] }
      content: []
input:
  action: { id: 'test-pack:strain' }
  policy:
    dice: auto
    rules:
      - { tags: [strain], then: pause }
answers:
  - faces: [2, 5]
