    kind: dice
    by: engine
    faces:
      - 11
    total: 12
    band: success
    bandSet: mork-borg-core:test
  - step: damage
    action: mork-borg-core:attack
    kind: dice
    by: engine
    faces:
      - 3
      - 4
    total: 7
  - step: curse
    action: mork-borg-core:attack
    kind: dice
    by: engine
    faces:
      - 1
    total: 1
