# Rage's turn-start effect proposes its own removal: the query names the entry by its source's
# item ID (the changes case draw-steel-monster-effects-end applies it).
status: finished
proposedChanges:
  - to: self
    step: start
    change:
      type: removeEffect
      applied: { where: "item.id == 'draw-steel-monsters:effects.werewolf.rage'" }
