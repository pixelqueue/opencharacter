description: "A formula error that stops an action keeps the formula error's data: `no-such-key` names the missing `key` its standard text fills in"
specVersion: 0.1.0
call: startAction
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        actions:
          # `tier` is optional and not passed, and nothing guards it with has().
          - id: acquire
            params:
              tier: { type: integer, min: 0, optional: true }
            steps:
              - id: quality
                kind: branch
                cases:
                  - when: true
                    flags: { quality: params.tier + 1 }
              - { id: done, kind: outcome, data: { quality: flags.quality } }
      content: []
input:
  action: { id: test-pack:acquire }
