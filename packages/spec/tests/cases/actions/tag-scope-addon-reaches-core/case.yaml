description: "An add-on reaches its core's tagged actions: its content's `params`, roll, `changes` and `option` effects all reach the core's attack, while an unrelated pack loaded beside them, sharing the tags, reaches none of it"
specVersion: 0.3.0
call: startAction
packs:
  - path: ../../../packs/test-scope-core
  - path: ../../../packs/test-scope-addon
  - path: ../../../packs/test-scope-other
input:
  action: { id: 'test-scope-core:attack' }
  params: { style: true }
answers:
  - { option: 'test-scope-addon:features.edge#mark' }
