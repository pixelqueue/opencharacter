description:
  "cwn-srd: without Veteran's Luck, a missed knife attack doesn't pause at the luck step, even
  under a policy that pauses there"
specVersion: 0.1.0
call: startAction
packs:
  - path: ../../../../../../packs/cwn/srd
input:
  action:
    id: cwn-srd:attack
    entry: knife
  participants:
    target:
      - id: guard
        values:
          cwn-srd:ac.ranged: 16
          cwn-srd:ac.melee: 13
          cwn-srd:trauma.target: 7
  policy:
    dice: auto
    choices: auto
    allocations: auto
    rules:
      - { kind: choice, tags: [missed-attack], then: pause }
