description: 'draw-steel-heroes: the creature view carries temporary Stamina and damage immunity (stamina.temp, immunity.fire)'
specVersion: 0.4.0
call: startAction
packs:
  - path: ../../../../../../packs/draw-steel/heroes
  - path: ../../../packs/test-draw-steel-foe
input:
  action:
    { id: draw-steel-heroes:use-ability, entry: foe, source: test-draw-steel-foe:abilities.gauge }
  participants:
    target:
      - { id: plain, values: { draw-steel-heroes:characteristics.might.score: 1 } }
      - id: temp
        values:
          { draw-steel-heroes:characteristics.might.score: 1, draw-steel-heroes:stamina.temp: 5 }
      - id: immune
        values:
          { draw-steel-heroes:characteristics.might.score: 1, draw-steel-heroes:immunity.fire: 3 }
