# Wren (examples/characters/orc-wren.yaml) hunting a wolf: a 1st-level cavern elf ranger, acrobat
# background and the flurry edge, a shortbow and a dagger, in studded leather armor.
#
# Boosts: the elf's Dexterity and Intelligence (Constitution flaw) and a free Wisdom, the
# acrobat's Dexterity and a free Wisdom, the ranger's Dexterity, and four free (Strength,
# Dexterity, Constitution, Charisma): Str +1, Dex +4, Con +0, Int +1, Wis +2, Cha +1. Trained
# skills: Acrobatics and Circus Lore (acrobat), Nature and Survival (ranger), and five more
# (4 + Intelligence +1). One more language.
specVersion: 0.1.0
id: example-orc-wren
packs:
  - { id: orc-2e, version: 0.2.1 }
values:
  orc-2e:hp.current: 16
  orc-2e:prey.target: wolf
features:
  - id: ancestry
    item: orc-2e:ancestries.elf
    choices:
      heritage:
        - option: orc-2e:heritages.cavern-elf
      boosts:
        - option: standard
          choices:
            free:
              - option: orc-2e:boosts.wis
  - id: background
    item: orc-2e:backgrounds.acrobat
    choices:
      boost:
        - option: orc-2e:boosts.dex
      free-boost:
        - option: orc-2e:boosts.wis
  - id: class
    item: orc-2e:classes.ranger
    choices:
      key-attribute:
        - option: dex
      hunters-edge:
        - option: orc-2e:classes.ranger.edges.flurry
      skills:
        - option: skill.athletics
        - option: skill.crafting
        - option: skill.intimidation
        - option: skill.medicine
        - option: skill.stealth
      class-feat-1:
        - option: orc-2e:feats.ranger.hunted-shot
inventory:
  - { id: shortbow, item: orc-2e:weapons.shortbow, equipped: true }
  - { id: dagger, item: orc-2e:weapons.dagger, equipped: true }
  - { id: armor, item: orc-2e:armor.studded-leather-armor, equipped: true }
  - { id: backpack, item: orc-2e:gear.backpack }
  - { id: bedroll, item: orc-2e:gear.bedroll }
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.cha
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.nimble-elf
  languages:
    - option: orc-2e:languages.fey
