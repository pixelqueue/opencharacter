# The app answers the power roll (15), then the 1d4 the winded target's band asks for at
# `tier[1]`; the outcome is as when the engine rolls.
status: finished
outcome:
  result: tier2
  data:
    total: 15
    targets: [a, b]
    totals: [15, 15]
    tiers: [2, 3]
    edges: [0, 2]
    banes: [0, 0]
proposedChanges:
  - to: target
    character: b
    step: 'tier[1]'
    change: { type: adjust, field: test-power-rolls:might, by: -3 }
log:
  - { step: roll, kind: dice, by: app, faces: [8, 5], total: 15, band: tier2 }
  - { step: 'tier[0]', kind: dice, by: engine, of: roll, total: 15, band: tier2 }
  - { step: 'tier[1]', kind: dice, by: engine, of: roll, total: 15, band: tier3 }
  - { step: 'tier[1]', kind: dice, by: app, faces: [3], total: -3 }
