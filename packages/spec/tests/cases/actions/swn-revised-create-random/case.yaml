description:
  'swn-revised: the random start rolls every quick creation table (class and style, background,
  disciplines, foci, bonus skill, hit points and equipment), so an automatic run finishes the
  character'
specVersion: 0.1.0
call: startAction
packs:
  - path: ../../../../../../packs/swn/revised
input:
  action:
    id: swn-revised:quick-character
  params: { random: true }
  policy: { dice: auto, choices: auto, allocations: auto }
