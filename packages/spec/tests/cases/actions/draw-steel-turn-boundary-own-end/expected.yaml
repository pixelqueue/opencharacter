# hero's turn ends: its own-this-turn taunted ends, though goblin applied it.
status: finished
outcome:
  result: passed
proposedChanges:
  - to: self
    step: boundary
    change:
      type: removeEffect
      applied:
        where: has(self.duration) && self.duration == 'this-turn' && self.appliedBy ==
          'hero'
  - to: self
    step: boundary
    change:
      type: removeEffect
      applied:
        where: has(self.duration) && self.duration == 'next-start' && self.appliedBy ==
          'goblin'
  - to: self
    step: boundary
    change:
      type: setState
      key: duration
      applied:
        where: has(self.duration) && self.duration == 'next-end' && self.appliedBy ==
          'goblin'
      value: "'this-turn'"
  - to: self
    step: boundary
    change:
      type: removeEffect
      applied:
        where: has(self.duration) && self.duration == 'own-this-turn'
log: []
