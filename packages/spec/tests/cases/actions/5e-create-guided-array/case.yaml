description: "5E's guided start, run with every checkpoint automatic but its race, subrace, class and background answered and its pending picks paused: its method falls back to the standard array, which goes out by the class's ability priority (a barbarian's Strength, Constitution, Dexterity, Wisdom, Charisma, Intelligence), and the run pauses at the first pending pick, the hill dwarf's tool, recommending the first tool offered"
