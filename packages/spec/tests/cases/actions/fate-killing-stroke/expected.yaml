status: finished
outcome:
  result: style
  data:
    total: 5
    opposition: 0
    hit: 5
    harm: physical
    boost: false
    strokeSecond: false
    takenOut: false
proposedChanges:
  - to: self
    step: gain
    change:
      type: addItem
      entry:
        id: advantages-advantage-1
        item: fate-core:advantages.advantage
        state:
          invokes: 1
          kind: consequence
  - to: self
    step: strike
    change:
      type: adjust
      field: fate-core:fatePoints.current
      by: -1
  - to: self
    step: strike
    change:
      type: adjustState
      key: used
      copies:
        type: fate-core:stunt
        where: item.id == 'fate-core:stunts.killing-stroke'
      limit: 1
      by: 1
  - to: target
    character: duelist
    step: worsen
    change:
      type: setState
      key: slot
      copies:
        type: fate-core:consequence
        where: self.slot == 'mild'
      limit: 1
      value: "'moderate'"
log:
  - step: roll/roll
    action: fate-core:skill-roll
    kind: dice
    by: engine
    faces:
      - 1
      - 0
      - 0
      - 0
    total: 5
    band: superb
    bandSet: fate-core:check
  - step: roll/rerolling[0]/reroll
    action: fate-core:skill-roll
    kind: choice
    by: engine
    option: keep
  - step: roll/invokes
    action: fate-core:skill-roll
    kind: choice
    by: engine
    option: '0'
  - step: roll/freeInvokes
    action: fate-core:skill-roll
    kind: choice
    by: engine
    option: '0'
  - { step: roll/rung, action: fate-core:skill-roll, kind: dice, total: 5, band: superb }
  - step: defense[0]
    action: fate-core:attack
    kind: handoff
    by: app
    participant:
      role: target
      id: duelist
    outcome:
      result: fail
      data:
        total: 0
  - step: final
    action: fate-core:attack
    kind: dice
    by: engine
    total: 5
    band: style
    bandSet: fate-core:outcome
  - step: boost
    action: fate-core:attack
    kind: choice
    by: engine
    option: full
  - step: hit[0]
    action: fate-core:attack
    kind: handoff
    by: app
    participant:
      role: target
      id: duelist
    outcome:
      result: absorbed
      data:
        shifts: 5
        box: 3
        consequences: 1
        slots:
          - mild
        unabsorbed: 0
  - step: stroke
    action: fate-core:attack
    kind: choice
    by: app
    option: strike
