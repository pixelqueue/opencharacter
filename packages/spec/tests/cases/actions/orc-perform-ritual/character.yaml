# An orc-2e character, raised to 3rd level for this case (her later
# choices left pending): a human cleric (cloistered cleric)
# with an acolyte background, a mace and a wooden religious symbol.
#
# Her deity is her own (the pack lists none): a healing font, holy, Diplomacy as its
# divine skill and the mace as its favored weapon. Domain Initiate (her doctrine's) gives the
# fire domain's fire ray and one Focus Point; Natural Ambition gives Healing Hands.
#
# Boosts: two free from her ancestry (Wisdom, Constitution), the acolyte's Wisdom and a free
# Strength, the cleric's Wisdom, and four free (Strength, Dexterity, Constitution, Wisdom):
# Str +2, Dex +1, Con +2, Int +0, Wis +4, Cha +0. Spell attack +7, spell DC 17. Trained skills:
# Religion and Scribing Lore (acolyte; the cleric's Religion frees a training, here Medicine),
# Diplomacy (her deity), and Nature and Society (2 + Intelligence +0).
#
# Prepared today: five cantrips, two 1st-rank spells and four heal in her divine font's slots.
specVersion: 0.1.0
id: example-orc-oriel
packs:
  - { id: orc-2e, version: 0.2.1 }
values:
  orc-2e:level: 3
  orc-2e:hp.current: 19
features:
  # A ritual she knows.
  - { id: consecrate, item: orc-2e:rituals.consecrate }
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      heritage:
        - option: orc-2e:heritages.versatile-human
          choices:
            feat:
              - option: orc-2e:feats.general.toughness
      boosts:
        - option: orc-2e:boosts.wis
        - option: orc-2e:boosts.con
  - id: background
    item: orc-2e:backgrounds.acolyte
    choices:
      boost:
        - option: orc-2e:boosts.wis
      free-boost:
        - option: orc-2e:boosts.str
  - id: class
    item: orc-2e:classes.cleric
    choices:
      divine-font:
        - option: heal
      sanctification:
        - option: holy
      divine-skill:
        - option: skill.diplomacy
      favored-weapon-category:
        - option: simple
      favored-weapon:
        - option: orc-2e:weapons.mace
      doctrine:
        - option: orc-2e:classes.cleric.doctrines.cloistered-cleric
          choices:
            orc-2e:feats.cleric.domain-initiate/domain:
              - option: fire
      skills:
        - option: skill.nature
        - option: skill.society
  # Prepared spells: each a copy of the spell, its slot's rank, and the font's copies marked.
  - { id: divine-lance, item: orc-2e:spells.divine-lance }
  - { id: guidance, item: orc-2e:spells.guidance }
  - { id: light, item: orc-2e:spells.light }
  - { id: stabilize, item: orc-2e:spells.stabilize }
  - { id: vitality-lash, item: orc-2e:spells.vitality-lash }
  - { id: bless-1, item: orc-2e:spells.bless, state: { rank: 1 } }
  - { id: fear-1, item: orc-2e:spells.fear, state: { rank: 1 } }
  - { id: font-1, item: orc-2e:spells.heal, state: { rank: 1, font: true } }
  - { id: font-2, item: orc-2e:spells.heal, state: { rank: 1, font: true } }
  - { id: font-3, item: orc-2e:spells.heal, state: { rank: 1, font: true } }
  - { id: font-4, item: orc-2e:spells.heal, state: { rank: 1, font: true } }
inventory:
  - { id: mace, item: orc-2e:weapons.mace, equipped: true }
  - { id: symbol, item: orc-2e:gear.religious-symbol-wooden }
  - { id: backpack, item: orc-2e:gear.backpack }
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.natural-ambition
      choices:
        feat:
          - option: orc-2e:feats.cleric.healing-hands
  languages:
    - option: orc-2e:languages.elven
  extra-training:
    - option: skill.medicine
