# The d4 rolls 1, the Android; after the rolls, the stat d4 rolls 2: speed.
# The class's skills: the first option each time, an Expert skill, then Hacking, which Computers
# (granted) allows.
status: finished
proposedChanges:
  - to: self
    step: class
    change: { type: addItem, entry: { id: classes-android-1, item: mothership-1e:classes.android } }
  - to: self
    step: stat
    change:
      { type: choose, path: { entry: classes-android-1, choice: [stat-penalty] }, option: speed }
  - to: self
    step: skills
    change:
      { type: choose, path: { entry: classes-android-1, choice: [bonus-skills] }, option: expert }
  - to: self
    step: skills
    change:
      type: choose
      path: { entry: classes-android-1, choice: [bonus-skills, expert, expert] }
      option: mothership-1e:skills.hacking
  - { to: self, step: save, change: { type: set, field: mothership-1e:stats.strength, value: 32 } }
  - { to: self, step: save, change: { type: set, field: mothership-1e:stats.speed, value: 36 } }
  - { to: self, step: save, change: { type: set, field: mothership-1e:stats.intellect, value: 40 } }
  - { to: self, step: save, change: { type: set, field: mothership-1e:stats.combat, value: 44 } }
  - { to: self, step: save, change: { type: set, field: mothership-1e:saves.sanity, value: 13 } }
  - { to: self, step: save, change: { type: set, field: mothership-1e:saves.fear, value: 17 } }
  - { to: self, step: save, change: { type: set, field: mothership-1e:saves.body, value: 21 } }
  - { to: self, step: save, change: { type: set, field: mothership-1e:health.max, value: 17 } }
  - { to: self, step: save, change: { type: set, field: mothership-1e:health.current, value: 17 } }
  - {
      to: self,
      step: save,
      change: { type: set, field: mothership-1e:credits.current, value: 170 },
    }
  - { to: self, step: save, change: { type: set, field: mothership-1e:loadout.owed, value: true } }
  - { to: self, step: save, change: { type: finishCreation } }
