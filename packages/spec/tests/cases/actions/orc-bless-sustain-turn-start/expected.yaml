  - { to: self, step: reset, change: { type: set, field: orc-2e:turn.flourishes, value: 0 } }
  - { to: self, step: reset, change: { type: set, field: orc-2e:shield.raised, value: false } }
  - { to: self, step: reset, change: { type: set, field: orc-2e:parry.active, value: false } }
  - { to: self, step: reset, change: { type: set, field: orc-2e:parry.weapon, value: false } }
