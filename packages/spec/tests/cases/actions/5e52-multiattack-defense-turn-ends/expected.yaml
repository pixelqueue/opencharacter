# The ogre's turn ended: the grant state's record is cleared.
status: finished
proposedChanges:
  - to: self
    step: boundary
    change:
      type: removeEffect
      applied:
        where: >-
          item.id == '5e-srd-5.2:combat-effects.vexed' && self.armed && (self.appliedBy != '' ? self.appliedBy : self.attacker) == 'ogre-1'
  - to: self
    step: boundary
    change:
      type: setState
      path: { entry: class, choice: [subclass] }
      option: 5e-srd-5.2:subclasses.hunter
      grant: 5e-srd-5.2:features.ranger.defensive-tactics
      key: hitBy
      value: []
