# The class draw (a d4) rolls 3, the Scientist. Its pending choices, in order, are stat-bonus
# (its draw, a d4, rolls 3: intellect), master, expert, trained and bonus. No Master or Expert
# skill is eligible at first, so trained is asked (a Trained skill on the way to a Master one);
# Archaeology allows Mysticism (expert), which allows Hyperspace (master); then the bonus Trained
# skill, Archaeology no longer eligible.
# Each pick is drawn (a d1 when only one skill is eligible isn't rolled): the dice give the
# first option each time.
status: finished
outcome: { result: rolled }
log:
  - { step: strength, kind: dice, faces: [3, 4], total: 32 }
  - { step: speed, kind: dice, faces: [5, 6], total: 36 }
  - { step: intellect, kind: dice, faces: [7, 8], total: 40 }
  - { step: combat, kind: dice, faces: [9, 10], total: 44 }
  - { step: sanity, kind: dice, faces: [1, 2], total: 13 }
  - { step: fear, kind: dice, faces: [3, 4], total: 17 }
  - { step: body, kind: dice, faces: [5, 6], total: 21 }
  - step: class
    kind: dice
    by: engine
    faces: [3]
    draw:
      among:
        - mothership-1e:classes.android
        - mothership-1e:classes.marine
        - mothership-1e:classes.scientist
        - mothership-1e:classes.teamster
  - { step: class, kind: choice, by: engine, option: mothership-1e:classes.scientist }
  - { step: health, kind: dice, faces: [7], total: 17 }
  - { step: skills, kind: dice, by: engine, faces: [3] }
  - step: skills
    kind: choice
    by: engine
    option: intellect
    index: 0
    choice: { entry: classes-scientist-1, choice: [stat-bonus] }
  - { step: skills, kind: dice, by: engine, faces: [1] }
  - step: skills
    kind: choice
    by: engine
    option: mothership-1e:skills.archaeology
    index: 1
    choice: { entry: classes-scientist-1, choice: [trained] }
  - step: skills
    kind: choice
    by: engine
    option: mothership-1e:skills.mysticism
    index: 2
    choice: { entry: classes-scientist-1, choice: [expert] }
  - { step: skills, kind: dice, by: engine, faces: [1] }
  - step: skills
    kind: choice
    by: engine
    option: mothership-1e:skills.hyperspace
    index: 3
    choice: { entry: classes-scientist-1, choice: [master] }
  - { step: skills, kind: dice, by: engine, faces: [1] }
  - step: skills
    kind: choice
    by: engine
    option: mothership-1e:skills.art
    index: 4
    choice: { entry: classes-scientist-1, choice: [bonus] }
  - { step: credits, kind: dice, faces: [8, 9], total: 17 }
  - { step: kit, kind: choice, by: engine, option: loadout }
