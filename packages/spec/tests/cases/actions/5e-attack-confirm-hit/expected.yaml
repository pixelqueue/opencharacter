# critRange 19 (Champion's Improved Critical, fighter level 3).
# attack 22 -> paused at hit/confirm; the app answers hit; the replay reuses the recorded
# attack faces and the dice function continues with 6. damage 6 + 7 = 13. Else-branch flags: critical false
