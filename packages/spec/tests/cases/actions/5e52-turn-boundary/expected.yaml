status: finished
proposedChanges:
  - to: self
    step: boundary
    change:
      type: removeEffect
      applied:
        where: >-
          item.id == '5e-srd-5.2:combat-effects.vexed' && self.armed && (self.appliedBy != '' ? self.appliedBy : self.attacker) == 'rogue'
  - to: self
    step: boundary
    change:
      type: removeEffect
      applied:
        where: >-
          item.id in ['5e-srd-5.2:combat-effects.sapped', '5e-srd-5.2:combat-effects.slowed', '5e-srd-5.2:combat-effects.hamstrung'] && (self.appliedBy != '' ? self.appliedBy : self.attacker) == 'fighter'
  - to: self
    step: boundary
    change:
      type: setState
      applied:
        where: >-
          item.id == '5e-srd-5.2:combat-effects.vexed' && (self.appliedBy != '' ? self.appliedBy : self.attacker) == 'fighter'
      key: armed
      value: true
