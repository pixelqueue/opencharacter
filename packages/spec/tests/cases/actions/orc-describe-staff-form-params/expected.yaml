action:
  params:
    - { name: rank, type: integer, required: false, min: 1, max: 10 }
    - { name: actions, type: integer, required: false, min: 1, max: 3 }
    - { name: ac, type: integer, required: false }
    - { name: copy, type: string, required: false }
    - { name: source, type: string, required: false }
    - name: form
      type: enum
      required: false
      values: [bat, bird, pterosaur, wasp]
      addedBy: orc-2e:spells.aerial-form
