# An orc-2e character: a 1st-level hold-scarred orc barbarian with
# the warrior background and the fury instinct, a greataxe, in hide armor.
#
# Boosts: the orc's two free (Strength, Constitution), the warrior's Strength and a free
# Dexterity, the barbarian's Strength, and four free (Strength, Dexterity, Constitution, Wisdom):
# Str +4, Dex +2, Con +2, Int +0, Wis +1, Cha +0. Trained skills: Intimidation and Warfare Lore
# (warrior), Athletics (barbarian), and three more (3 + Intelligence +0). The fury instinct's
# bonus feat is Raging Thrower; Sudden Charge is a barbarian feat too.
specVersion: 0.1.0
id: example-orc-grusha
packs:
  - { id: orc-2e, version: 0.3.0 }
values:
  orc-2e:hp.current: 26
features:
  - id: ancestry
    item: orc-2e:ancestries.orc
    choices:
      heritage:
        - option: orc-2e:heritages.hold-scarred-orc
      boosts:
        - option: orc-2e:boosts.str
        - option: orc-2e:boosts.con
  - id: background
    item: orc-2e:backgrounds.warrior
    choices:
      boost:
        - option: orc-2e:boosts.str
      free-boost:
        - option: orc-2e:boosts.dex
  - id: class
    item: orc-2e:classes.barbarian
    choices:
      instinct:
        - option: orc-2e:classes.barbarian.instincts.fury
          choices:
            feat:
              - option: orc-2e:feats.barbarian.raging-thrower
      skills:
        - option: skill.acrobatics
        - option: skill.medicine
        - option: skill.survival
      class-feat-1:
        - option: orc-2e:feats.fighter.sudden-charge
inventory:
  - { id: greataxe, item: orc-2e:weapons.greataxe, equipped: true }
  - { id: armor, item: orc-2e:armor.hide-armor, equipped: true }
  - { id: backpack, item: orc-2e:gear.backpack }
  - { id: rations, item: orc-2e:gear.rations, quantity: 2 }
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.orc-ferocity
