specVersion: 0.3.0
call: startAction
packs:
  - path: ../../../packs/test-action-params
input:
  action: { id: 'test-action-params:use-ability', entry: hurl }
  params: { element: fire }
  participants:
    target:
      - { id: orc, values: {} }
