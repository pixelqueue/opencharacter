# A 10th-level human fighter (Charisma and Wisdom +3) with Sorcerer Dedication (the imperial
# bloodline: arcane), Basic Sorcerer Spellcasting and Basic Blood Potency, then Cleric Dedication
# and Basic Cleric Spellcasting: two archetype spellcasting sources, a spontaneous arcane
# one and a prepared divine one, each with its own numbers and slots. A heal prepared in a cleric
# slot is today's copy.
specVersion: 0.1.0
id: test-prepare-staff-archetype
packs:
  - { id: orc-2e, version: 0.1.0 }
values:
  orc-2e:level: 10
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      boosts:
        - option: orc-2e:boosts.cha
        - option: orc-2e:boosts.wis
  - id: class
    item: orc-2e:classes.fighter
    choices:
      key-attribute:
        - option: str
      class-feat-2:
        - option: orc-2e:feats.archetype.sorcerer.sorcerer-dedication
          choices:
            bloodline:
              - option: imperial
            orc-2e:features.spellcasting.archetype-repertoire/cantrips:
              - option: orc-2e:spells.electric-arc
              - option: orc-2e:spells.daze
            orc-2e:features.spellcasting.archetype-repertoire/spells-1:
              - option: orc-2e:spells.force-barrage
            orc-2e:features.spellcasting.archetype-repertoire/spells-2:
              - option: orc-2e:spells.blur
            orc-2e:features.spellcasting.archetype-repertoire/spells-3:
              - option: orc-2e:spells.fireball
      class-feat-4:
        - option: orc-2e:feats.archetype.sorcerer.basic-sorcerer-spellcasting
      class-feat-6:
        - option: orc-2e:feats.archetype.sorcerer.basic-blood-potency
          choices:
            feat:
              - option: orc-2e:feats.sorcerer.tap-into-blood
      class-feat-8:
        - option: orc-2e:feats.archetype.cleric.cleric-dedication
          choices:
            divine-skill:
              - option: skill.medicine
      class-feat-10:
        - option: orc-2e:feats.archetype.cleric.basic-cleric-spellcasting
  - { id: heal-1, item: orc-2e:spells.heal, state: { rank: 1, source: cleric } }
inventory:
  - { id: staff, item: orc-2e:staves.staff-of-healing, equipped: true }
choices:
  free-boosts:
    - option: orc-2e:boosts.cha
    - option: orc-2e:boosts.wis
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
  boosts-5:
    - option: orc-2e:boosts.cha
    - option: orc-2e:boosts.wis
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.dex
  boosts-10:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.int
