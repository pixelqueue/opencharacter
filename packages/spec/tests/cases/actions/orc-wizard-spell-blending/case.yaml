  - option: orc-2e:spells.electric-arc
  - option: orc-2e:spells.frostbite
  - option: orc-2e:spells.ignition
  - option: orc-2e:spells.daze
  - option: orc-2e:spells.detect-magic
  - option: orc-2e:spells.light
  - option: orc-2e:spells.read-aura
  - option: orc-2e:spells.force-barrage
  - option: orc-2e:spells.sleep
