# foe's dazed and Look! end, its slowed lasts this turn; goblin's weakened ends; other's
# bleeding stays.
ok: true
character:
  applied:
    - id: slowed
      source: draw-steel-heroes:conditions.slowed
      state:
        duration: this-turn
      appliedBy: foe
    - id: bleeding
      source: draw-steel-heroes:conditions.bleeding
      state:
        duration: next-start
      appliedBy: other
