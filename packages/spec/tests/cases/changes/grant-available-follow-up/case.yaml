description: "Content a grant's `available` holds back declares no follow-ups: with no matching kit, Roar's follow-up on `strain` isn't listed, while the treasure's own is"
specVersion: 0.3.0
call: applyChanges
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.3.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          kit.gear: { type: set, of: string }
          stability: { type: integer, formula: 0 }
          strain: { type: integer, input: true, default: 0 }
          echoes: { type: integer, input: true, default: 0 }
        contentTypes:
          kit:
            fields:
              gear: { type: string, default: '' }
            effects:
              - { target: kit.gear, op: grant, value: { formula: item.gear } }
          treasure:
            carried: true
            fields:
              gear: { type: string, default: '' }
          ability:
            grantOnly: true
      content:
        - { id: kits.shield, type: kit, fields: { gear: shield } }
        - { id: kits.mail, type: kit, fields: { gear: armor } }
        # The shield's ability needs a kit with a shield.
        - id: treasures.kings-roar
          type: treasure
          fields: { gear: shield }
          grants:
            - item: abilities.roar
              available: item.gear in kit.gear
          followUps:
            - id: ring
              on: { field: strain }
              changes: [{ type: adjust, field: echoes, by: 1 }]
        - id: abilities.roar
          type: ability
          effects:
            - { target: stability, op: add, value: 1 }
          actions:
            - { id: roar, steps: [{ id: done, kind: outcome }] }
          auras:
            - id: dread
              effects:
                - { target: stability, op: add, value: -1, scope: applied }
          grants:
            - { item: abilities.echo }
          followUps:
            - id: answer
              on: { field: strain }
              changes: [{ type: adjust, field: echoes, by: 10 }]
        - id: abilities.echo
          type: ability
          actions:
            - { id: echo, steps: [{ id: done, kind: outcome }] }
