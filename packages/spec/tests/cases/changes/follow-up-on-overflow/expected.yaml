# Health 3 - 5 overflows into a wound (adjustment 1): a wound roll, its damage type left to the
# app. One wound of two: no death save.
ok: true
adjustments:
  - { field: mothership-1e:health.current, by: -5, requested: -5, taken: -5, reason: requested }
  - { field: mothership-1e:wounds.current, by: 1, reason: overflow }
  - { field: mothership-1e:health.current, by: 16, reason: reset }
  - { field: mothership-1e:health.current, by: -2, reason: carry }
followUps:
  - id: wound-1
    kind: ephemeral
    followUp: mothership-1e:wound
    to: self
    required: true
    action:
      id: mothership-1e:wound-roll
      followUp: wound-1
    params: {}
    cause:
      field: mothership-1e:wounds.current
      by: 1
      requested: 0
      taken: 0
      reason: overflow
      clamped: false
      tags: []
