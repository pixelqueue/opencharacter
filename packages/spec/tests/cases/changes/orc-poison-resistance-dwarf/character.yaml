# A 4th-level strong-blooded dwarf druid of the leaf order with Poison Resistance (2nd level):
# poison resistance 2 from the heritage and 2 from the feat. Only what the damage reads is filled.
specVersion: 0.1.0
id: example-orc-poison-resistance
packs:
  - { id: orc-2e, version: 0.2.1 }
values:
  orc-2e:level: 4
  orc-2e:hp.current: 40
features:
  - id: ancestry
    item: orc-2e:ancestries.dwarf
    choices:
      heritage:
        - option: orc-2e:heritages.strong-blooded-dwarf
  - id: class
    item: orc-2e:classes.druid
    choices:
      order:
        - option: orc-2e:classes.druid.orders.leaf
      class-feat-2:
        - option: orc-2e:feats.druid.poison-resistance
