# The dazed ends; the frightened lasts this turn and keeps its applier (foe, who frightens it).
ok: true
character:
  applied:
    - id: frightened
      source: draw-steel-heroes:conditions.frightened
      state:
        duration: own-this-turn
      appliedBy: foe
    - id: taunted
      source: draw-steel-heroes:conditions.taunted
      state:
        duration: own-this-turn
      appliedBy: goblin
