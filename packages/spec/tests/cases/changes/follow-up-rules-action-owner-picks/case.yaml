description: "A rules follow-up's action checks its `available` against the rules-level choices' picks, read with the one-argument `picksOf`: with the oath sworn, the damage stores the vow follow-up"
specVersion: 0.2.0
call: applyChanges
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.2.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        tags: [damage]
        fields:
          hp: { type: integer, input: true, default: 10 }
        choices:
          - id: oath
            pick: { min: 0, max: 1 }
            required: false
            from: { values: [valor, mercy] }
        actions:
          - id: vow
            available: "'valor' in picksOf('oath')"
            steps:
              - { id: done, kind: outcome }
        followUps:
          - id: vow
            on: { field: hp, tags: [damage] }
            action: vow
      content: []
