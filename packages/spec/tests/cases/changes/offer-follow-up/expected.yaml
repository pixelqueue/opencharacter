# The offered ones first, in change order (recover with the change's damage, kindle naming the
# ember's flash with its copy), then those the damage triggered: the ally's help, the ember's warm
# and its burst.
ok: true
followUps:
  - id: recover-1
    kind: ephemeral
    followUp: test-follow-ups:recover
    to: self
    required: false
    action:
      id: test-follow-ups:steady
      followUp: recover-1
    params:
      damage: 3
  - id: kindle-1
    kind: ephemeral
    followUp: test-follow-ups:charms.ember#kindle
    source: &a1
      type: item
      id: test-follow-ups:charms.ember
      entry: ember-1
    to: self
    required: false
    action:
      id: test-follow-ups:charms.ember#flash
      entry: ember-1
      followUp: kindle-1
    params: {}
  - id: call-ally-1
    kind: ephemeral
    followUp: test-follow-ups:call-ally
    to:
      link: test-follow-ups:ally
    required: false
    action:
      id: test-ally:help
    params:
      lost: 6
    cause: &c1
      field: test-follow-ups:hp.current
      by: -6
      requested: -6
      taken: -6
      reason: requested
      clamped: false
      tags:
        - damage.fire
  - id: warm-1
    kind: ephemeral
    followUp: test-follow-ups:charms.ember#warm
    source: *a1
    to: self
    required: false
    changes:
      - type: adjustState
        entry: ember-1
        key: glow
        by: 1
      - type: clearFollowUp
        id: warm-1
    cause: *c1
  - id: burst-1
    kind: ephemeral
    followUp: test-follow-ups:charms.ember#burst
    source: *a1
    to: self
    required: false
    action:
      id: test-follow-ups:charms.ember#flash
      entry: ember-1
      followUp: burst-1
    params: {}
character:
  followUps:
    - { id: recover-1, followUp: test-follow-ups:recover, params: { damage: 3 } }
    - { id: kindle-1, followUp: test-follow-ups:charms.ember#kindle, source: *a1, params: {} }
    - id: call-ally-1
      followUp: test-follow-ups:call-ally
      to: { link: test-follow-ups:ally }
      params: { lost: 6 }
      cause: *c1
    - { id: warm-1, followUp: test-follow-ups:charms.ember#warm, source: *a1, cause: *c1 }
    - { id: burst-1, followUp: test-follow-ups:charms.ember#burst, source: *a1, params: {} }
