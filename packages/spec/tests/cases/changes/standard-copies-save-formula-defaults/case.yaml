description: 'Saving a standard copy writes its formula state defaults as evaluated, as addItem would'
specVersion: 0.1.0
call: applyChanges
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        standardCopies:
          - { type: faction }
        fields:
          boost: { type: integer, input: true, default: 0 }
        contentTypes:
          faction:
            fields:
              tier: { type: integer }
            state:
              tier: { type: integer, default: item.tier + boost }
              hold: { type: boolean, default: true }
      content:
        - { id: factions.watch, type: faction, fields: { tier: 2 } }
