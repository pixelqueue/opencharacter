# rod-1 gets charges 3 and glow 6 from the template's maxCharges; rod-2 keeps its saved glow.
ok: true
character:
  inventory:
    - id: rod-1
      item: test-pack:gear.rod
      templates: [test-pack:charged]
      state: { charges: 3, glow: 6 }
    - id: rod-2
      item: test-pack:gear.rod
      state: { glow: 1, charges: 3 }
      templates: [test-pack:charged]
