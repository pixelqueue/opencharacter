# First hit: the shield soaks min(3, 5) = 3, so -5 + 3 = -2 (hp 12 -> 10), and its charge drops
# by 3 to 0. Second hit: the charge is 0, so the effect doesn't count and nothing changes the
# shield: hp 10 -> 8.
ok: true
character:
  values:
    test-pack:hp.current: 8
  inventory:
    - { id: shield, item: test-pack:gear.shield, equipped: true, state: { charge: 0 } }
adjustments:
  - { field: test-pack:hp.current, by: -2, requested: -5, taken: -2, reason: requested }
  - entry: shield
    key: charge
    value: 0
    source: { type: item, id: 'test-pack:gear.shield', entry: shield, effect: soak }
  - { field: test-pack:hp.current, by: -2, requested: -2, taken: -2, reason: requested }
