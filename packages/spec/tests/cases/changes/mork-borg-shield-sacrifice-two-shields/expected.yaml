# The hit does nothing, and only the first worn unbroken shield breaks (the cracked one is
# skipped); the spare stays whole.
ok: true
adjustments:
  - { field: mork-borg-core:hp.current, by: 0, requested: -7, taken: 0, reason: requested }
  - copies: [shield]
    source: { type: situational, id: mork-borg-core:shieldSacrifice }
followUps: []
character:
  values:
    mork-borg-core:hp.max: 10
    mork-borg-core:hp.current: 8
  inventory:
    - { id: worn, item: mork-borg-core:armor.medium, equipped: true, state: { damage: 0 } }
    - { id: cracked, item: mork-borg-core:shields.shield, equipped: true, state: { broken: true } }
    - { id: shield, item: mork-borg-core:shields.shield, equipped: true, state: { broken: true } }
    - { id: spare, item: mork-borg-core:shields.shield, equipped: true, state: { broken: false } }
