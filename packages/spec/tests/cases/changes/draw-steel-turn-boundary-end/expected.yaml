# foe's this-turn slowed ends; other's dazed and foe's next-end prone stay.
ok: true
character:
  applied:
    - id: dazed
      source: draw-steel-heroes:conditions.dazed
      state:
        duration: this-turn
      appliedBy: other
    - id: prone
      source: draw-steel-heroes:conditions.prone
      state:
        duration: next-end
      appliedBy: foe
