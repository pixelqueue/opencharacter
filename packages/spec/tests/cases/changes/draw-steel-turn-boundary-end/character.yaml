# A hero holding entries other creatures applied, with next-turn durations.
specVersion: 0.4.0
id: hero
packs:
  - id: draw-steel-heroes
    version: 0.2.0
  - id: test-draw-steel-foe
    version: 0.1.0
values:
  draw-steel-heroes:combat.active: true
applied:
  - {
      id: slowed,
      source: draw-steel-heroes:conditions.slowed,
      state: { duration: this-turn },
      appliedBy: foe,
    }
  - {
      id: dazed,
      source: draw-steel-heroes:conditions.dazed,
      state: { duration: this-turn },
      appliedBy: other,
    }
  - {
      id: prone,
      source: draw-steel-heroes:conditions.prone,
      state: { duration: next-end },
      appliedBy: foe,
    }
