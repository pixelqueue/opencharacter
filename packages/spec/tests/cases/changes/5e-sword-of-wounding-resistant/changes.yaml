# The sword's hit as the action proposed it (actions/5e-sword-of-wounding).
- type: adjust
  field: 5e-srd-5.1:hp.current
  by: -9
  tags: [damage, attack, weapon, melee, magical, plain-material, wielder.neutral, damage.slashing]
- type: applyEffect
  source: 5e-srd-5.1:conditions.wound
  state:
    amount:
      formula: "max(0, -sumList(batch.adjustments, x.by, x.field == '5e-srd-5.1:hp.current' && x.reason == 'requested' && 'damage' in x.tags))"
    bleeding: false
    by: humanoid
    magical: true
