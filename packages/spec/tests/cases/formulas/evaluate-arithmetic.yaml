description: Arithmetic, comparison and equality
specVersion: 0.1.0
cases:
  - name: int plus int is int
    evaluate: 1 + 2
    value: 3
    valueType: int
  - name: int times int is int
    evaluate: 6 * 7
    value: 42
    valueType: int
  - name: int minus int can be negative
    evaluate: 2 - 5
    value: -3
    valueType: int
  - name: precedence when evaluating
    evaluate: 2 + 3 * 4
    value: 14
    valueType: int
  - name: parentheses when evaluating
    evaluate: (2 + 3) * 4
    value: 20
    valueType: int
  - name: subtraction left to right
    evaluate: 10 - 4 - 3
    value: 3
    valueType: int
  - name: '* and % left to right'
    evaluate: 2 * 3 % 4
    value: 2
    valueType: int
  - name: division is always decimal
    evaluate: 7 / 2
    value: 3.5
    valueType: decimal
  - name: exact division is still decimal
    evaluate: 6 / 2
    value: 3
    valueType: decimal
  - name: negative division is decimal
    evaluate: -1 / 2
    value: -0.5
    valueType: decimal
  - name: int plus decimal is decimal
    evaluate: 1 + 2.5
    value: 3.5
    valueType: decimal
  - name: int times decimal is decimal even when whole
    evaluate: 2 * 1.5
    value: 3
    valueType: decimal
  - name: decimal minus decimal
    evaluate: 2.5 - 0.5
    value: 2
    valueType: decimal
  - name: decimal arithmetic is rounded to six places
    evaluate: 0.1 + 0.2
    value: 0.3
    valueType: decimal
  - name: unary minus on int
    evaluate: '-3'
    value: -3
    valueType: int
  - name: double unary minus
    evaluate: --3
    value: 3
    valueType: int
  - name: unary minus on decimal
    evaluate: '-1.5'
    value: -1.5
    valueType: decimal
  - name: unary minus on a string
    evaluate: -'a'
    error: type-mismatch
  - name: floor of a negative half
    evaluate: floor(-0.5)
    value: -1
    valueType: int
  - name: floor of a positive decimal
    evaluate: floor(3.7)
    value: 3
    valueType: int
  - name: floor of an int
    evaluate: floor(5)
    value: 5
    valueType: int
  - name: ceil of a negative half
    evaluate: ceil(-0.5)
    value: 0
    valueType: int
  - name: ceil of a positive decimal
    evaluate: ceil(2.1)
    value: 3
    valueType: int
  - name: ceil of a quarter (challenge rating 1/4)
    evaluate: ceil(0.25)
    value: 1
    valueType: int
  - name: round half away from zero, positive
    evaluate: round(2.5)
    value: 3
    valueType: int
  - name: round half away from zero, negative
    evaluate: round(-2.5)
    value: -3
    valueType: int
  - name: round half of one
    evaluate: round(0.5)
    value: 1
    valueType: int
  - name: round below half
    evaluate: round(2.4)
    value: 2
    valueType: int
  - name: round negative below half
    evaluate: round(-2.4)
    value: -2
    valueType: int
  - name: trunc of a negative decimal
    evaluate: trunc(-2.7)
    value: -2
    valueType: int
  - name: trunc of a positive decimal
    evaluate: trunc(2.7)
    value: 2
    valueType: int
  - name: floor of a string
    evaluate: floor('a')
    error: type-mismatch
  - name: ability modifier for 9 is -1
    evaluate: floor((abilities.str.score - 10) / 2)
    fields:
      abilities.str.score:
        type: integer
        value: 9
    value: -1
    valueType: int
  - name: ability modifier for 8 is -1
    evaluate: floor((abilities.str.score - 10) / 2)
    fields:
      abilities.str.score:
        type: integer
        value: 8
    value: -1
    valueType: int
  - name: ability modifier for 10 is 0
    evaluate: floor((abilities.str.score - 10) / 2)
    fields:
      abilities.str.score:
        type: integer
        value: 10
    value: 0
    valueType: int
  - name: ability modifier for 15 is 2
    evaluate: floor((abilities.str.score - 10) / 2)
    fields:
      abilities.str.score:
        type: integer
        value: 15
    value: 2
    valueType: int
  - name: ability modifier for 1 is -5
    evaluate: floor((abilities.str.score - 10) / 2)
    fields:
      abilities.str.score:
        type: integer
        value: 1
    value: -5
    valueType: int
  - name: ability modifier for 30 is 10
    evaluate: floor((abilities.str.score - 10) / 2)
    fields:
      abilities.str.score:
        type: integer
        value: 30
    value: 10
    valueType: int
  - name: remainder
    evaluate: 7 % 3
    value: 1
    valueType: int
  - name: remainder takes the sign of the dividend (negative dividend)
    evaluate: -7 % 3
    value: -1
    valueType: int
  - name: remainder takes the sign of the dividend (negative divisor)
    evaluate: 7 % -3
    value: 1
    valueType: int
  - name: remainder with both negative
    evaluate: -7 % -3
    value: -1
    valueType: int
  - name: percentile 100 reads as 00
    evaluate: 100 % 100
    value: 0
    valueType: int
  - name: remainder of a decimal
    evaluate: 7.5 % 2
    error: type-mismatch
  - name: remainder by zero
    evaluate: 5 % 0
    error: division-by-zero
  - name: division by zero
    evaluate: 1 / 0
    error: division-by-zero
  - name: decimal division by zero
    evaluate: 1.0 / 0
    error: division-by-zero
  - name: division by decimal zero
    evaluate: 1 / 0.0
    error: division-by-zero
  - name: zero divided by zero
    evaluate: 0 / 0
    error: division-by-zero
  - name: largest int
    evaluate: 9007199254740990 + 1
    value: 9007199254740991
    valueType: int
  - name: int addition overflow
    evaluate: 9007199254740991 + 1
    error: overflow
  - name: int multiplication overflow
    evaluate: 9007199254740991 * 2
    error: overflow
  - name: int subtraction overflow
    evaluate: -9007199254740991 - 1
    error: overflow
  - name: decimal overflow to infinity
    evaluate: .0 * 10.0
    error: overflow
  - name: string concatenation
    evaluate: "'a' + 'b'"
    value: ab
    valueType: string
  - name: building a field ID from strings
    evaluate: "'abilities.' + params.ability + '.mod'"
    roots:
      params:
        ability: dex
    value: abilities.dex.mod
    valueType: string
  - name: string plus int
    evaluate: "'a' + 1"
    error: type-mismatch
  - name: list concatenation
    evaluate: '[1] + [2, 3]'
    value:
      - 1
      - 2
      - 3
    valueType: list
  - name: string times int
    evaluate: "'a' * 2"
    error: type-mismatch
  - name: int below decimal
    evaluate: 1 < 1.5
    value: true
    valueType: bool
  - name: int equals decimal numerically
    evaluate: 2 == 2.0
    value: true
    valueType: bool
  - name: int not unequal to equal decimal
    evaluate: 2 != 2.0
    value: false
    valueType: bool
  - name: greater or equal
    evaluate: 3 >= 3
    value: true
    valueType: bool
  - name: less or equal
    evaluate: 4 <= 3
    value: false
    valueType: bool
  - name: greater
    evaluate: 4 > 3
    value: true
    valueType: bool
  - name: strings compare by code point
    evaluate: "'B' < 'a'"
    value: true
    valueType: bool
  - name: string prefix is smaller
    evaluate: "'a' < 'aa'"
    value: true
    valueType: bool
  - name: empty string is smallest
    evaluate: "'' < 'a'"
    value: true
    valueType: bool
  - name: strings compare character by character
    evaluate: "'abd' > 'abc'"
    value: true
    valueType: bool
  - name: ordering an int against a string
    evaluate: 1 < 'a'
    error: type-mismatch
  - name: ordering booleans
    evaluate: true < false
    error: type-mismatch
  - name: int and string are unequal
    evaluate: 1 == '1'
    value: false
    valueType: bool
  - name: bool and int are unequal
    evaluate: true == 1
    value: false
    valueType: bool
  - name: different kinds with !=
    evaluate: "'a' != 1"
    value: true
    valueType: bool
  - name: null equals null
    evaluate: null == null
    value: true
    valueType: bool
  - name: null is not zero
    evaluate: null == 0
    value: false
    valueType: bool
  - name: equal lists
    evaluate: '[1, 2] == [1, 2]'
    value: true
    valueType: bool
  - name: order matters in list equality
    evaluate: '[1, 2] == [2, 1]'
    value: false
    valueType: bool
  - name: list elements compare numerically
    evaluate: '[1] == [1.0]'
    value: true
    valueType: bool
  - name: lists of different length
    evaluate: '[1] == [1, 1]'
    value: false
    valueType: bool
  - name: string equality
    evaluate: "'fire' == 'fire'"
    value: true
    valueType: bool
  - name: membership in a list
    evaluate: 2 in [1, 2, 3]
    value: true
    valueType: bool
  - name: not a member
    evaluate: 4 in [1, 2, 3]
    value: false
    valueType: bool
  - name: nothing is in an empty list
    evaluate: "'x' in []"
    value: false
    valueType: bool
  - name: membership uses numeric equality
    evaluate: 2.0 in [1, 2]
    value: true
    valueType: bool
  - name: string membership
    evaluate: "'sword' in ['martial', 'sword']"
    value: true
    valueType: bool
  - name: in with a string on the right
    evaluate: "'a' in 'abc'"
    error: type-mismatch
