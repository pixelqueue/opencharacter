description: 'Standard copies: a query is resolved at load, so its where reads only item; a field is unknown-name'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          tier: { type: integer, input: true, default: 0 }
        contentTypes:
          gear: { carried: true }
        standardCopies:
          - { type: gear, where: tier > 0 }
      content:
        - { id: gear.rope, type: gear }
