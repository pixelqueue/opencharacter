description: 'A kept template must be a template: naming other content is unknown-reference'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        { id: test-pack, version: 1.0.0, specVersion: 0.1.0, license: CC0-1.0, defaultLanguage: en }
      rules:
        contentTypes:
          weapon: { carried: true }
          feature: {}
      content:
        - { id: weapons.club, type: weapon }
        - id: features.keeper
          type: feature
          keepsTemplates:
            - { template: weapons.club, copies: { type: weapon } }
