description: 'A follow-up naming an action no pack has is unknown-reference'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          hp.current: { type: integer, input: true, default: 10, min: 0 }
        followUps:
          - id: faint
            becomes: hp.current == 0
            action: faint
      content: []
