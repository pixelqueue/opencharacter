description: "A kept template's content query reads only the item, as its copies query does: reading a field is unknown-name"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        { id: test-pack, version: 1.0.0, specVersion: 0.1.0, license: CC0-1.0, defaultLanguage: en }
      rules:
        fields:
          level: { type: integer, input: true, default: 1 }
        contentTypes:
          spell: {}
          feature: {}
      content:
        - { id: spells.bolt, type: spell }
        - { id: templates.far, type: template, appliesTo: { type: spell } }
        - id: features.keeper
          type: feature
          keepsTemplates:
            - { template: templates.far, content: { type: spell, where: 'level > 1' } }
