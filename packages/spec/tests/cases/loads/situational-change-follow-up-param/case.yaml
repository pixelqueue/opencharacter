description: "A situational choice's `offerFollowUp` passes only parameters the follow-up's action takes: another is `invalid-situational-change`"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        tags: [damage]
        fields:
          hp: { type: integer, input: true, default: 10 }
        situational:
          - id: parry
            type: boolean
            default: false
            incoming: { fields: [hp], tags: [damage] }
            changes:
              - { type: offerFollowUp, followUp: riposte, params: { strength: 1, speed: 2 } }
        followUps:
          - { id: riposte, action: riposte }
        actions:
          - id: riposte
            params:
              strength: { type: integer, default: 0 }
            steps:
              - { id: done, kind: outcome }
      content: []
