description: "`picked` is bound only in a choice step\u2019s changes"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          gem:
            carried: true
            fields:
              color: { type: enum, values: [red, blue] }
            state:
              charge: { type: integer, default: 3 }
        actions:
          - id: pick
            steps:
              - id: spend
                kind: changes
                changes:
                  - { type: adjustState, entry: self, key: charge, by: picked.self.charge }
      content:
        - { id: gems.ruby, type: gem, fields: { color: red } }
