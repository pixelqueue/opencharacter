description: 'A choice step tag no pack declares is unknown-tag'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        tags: [push-cost]
        actions:
          - id: push
            steps:
              - id: pay
                kind: choice
                tags: [push-cost, push-price]
                options: [{ id: stress }]
      content: []
