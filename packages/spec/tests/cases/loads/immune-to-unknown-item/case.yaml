description: 'An immunity to content no pack has is unknown-reference'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          feature:
            carried: false
      content:
        - id: features.steady
          type: feature
          immuneTo:
            - { id: slowed, items: [conditions.slowed] }
