description: "An immunity's when is an activation condition: a derived field is a formula error"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might: { type: integer, input: true, default: 1, min: 0, max: 10 }
          stats.bonus: { type: integer, formula: stats.might * 2 }
        contentTypes:
          condition:
            carried: false
          feature:
            carried: false
      content:
        - id: conditions.slowed
          type: condition
        - id: features.steady
          type: feature
          immuneTo:
            - { id: slowed, items: [conditions.slowed], when: stats.bonus > 4 }
