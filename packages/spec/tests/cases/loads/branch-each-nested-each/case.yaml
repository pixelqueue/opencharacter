description: "An `each` branch step's case steps run per participant already, so one with an `each` of its own is `unknown-role`"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          hp: { type: integer, input: true, default: 10 }
        actions:
          - id: blast
            participants:
              target: {}
            steps:
              - id: outcome
                kind: branch
                each: target
                cases:
                  - when: true
                    flags: { mult: 1 }
                    steps:
                      - id: burn
                        kind: changes
                        each: target
                        to: target
                        changes:
                          - { type: adjust, field: hp, by: -1 }
      content: []
