description: "A kept template's copies query reads the item and the keeper, as an activation condition does: reading a derived field is unknown-name"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        { id: test-pack, version: 1.0.0, specVersion: 0.1.0, license: CC0-1.0, defaultLanguage: en }
      rules:
        fields:
          level: { type: integer, formula: 1 }
        contentTypes:
          weapon: { carried: true }
          feature: {}
      content:
        - { id: weapons.club, type: weapon }
        - { id: templates.sharp, type: template, appliesTo: { type: weapon } }
        - id: features.keeper
          type: feature
          keepsTemplates:
            - { template: templates.sharp, copies: { type: weapon, where: 'level > 1' } }
