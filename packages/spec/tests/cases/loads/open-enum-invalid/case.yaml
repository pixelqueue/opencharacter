description: "extendEnums must name an open enum of a dependency: a closed enum, a field that isn't an enum, an unknown type, a pack that isn't a dependency, a closed action parameter, an unknown action, a closed item state key and an unknown item are each invalid-extension"
specVersion: 0.2.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: base-pack
        version: 1.0.0
        specVersion: 0.2.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          might: { type: integer, input: true, default: 0 }
        contentTypes:
          weapon:
            fields:
              reach: { type: enum, values: [close, far] }
        actions:
          - id: swing
            params:
              style: { type: enum, values: [wide, low], required: true }
            steps:
              - { id: result, kind: outcome, data: { style: params.style } }
      content:
        - id: weapons.axe
          type: weapon
          state:
            grip: { type: enum, values: [one, two], default: one }
  - inline:
      manifest:
        id: other-pack
        version: 1.0.0
        specVersion: 0.2.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          mood: { type: enum, values: [calm, angry], input: true, default: calm, open: true }
      content: []
  - inline:
      manifest:
        id: addon-pack
        version: 1.0.0
        specVersion: 0.2.0
        license: CC0-1.0
        defaultLanguage: en
        dependencies: { base-pack: ^1.0.0 }
      rules:
        extendEnums:
          'base-pack:types.weapon.fields.reach': [touch]
          'base-pack:fields.might': [lots]
          'base-pack:types.shield.fields.reach': [touch]
          'other-pack:fields.mood': [giddy]
          'base-pack:actions.swing.params.style': [high]
          'base-pack:actions.chop.params.style': [high]
          'base-pack:weapons.axe.state.grip': [none]
          'base-pack:weapons.mace.state.grip': [none]
      content: []
