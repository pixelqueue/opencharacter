description: "An added option's flag must have a type its action sets it to: a string for an int flag is formula-error with cause type-mismatch"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        tags: [cost]
        contentTypes:
          trait: {}
        actions:
          - id: cast
            steps:
              - id: start
                kind: branch
                cases:
                  - when: true
                    flags: { slot: 1 }
              - id: cost
                kind: choice
                tags: [cost]
                options: [{ id: slot, flags: { slot: 3 } }]
      content:
        - id: traits.legacy
          type: trait
          effects:
            - target: { choices: [cost] }
              op: option
              value:
                id: legacy
                flags: { slot: "'two'" }
