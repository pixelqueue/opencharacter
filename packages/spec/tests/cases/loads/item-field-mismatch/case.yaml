description: 'Item fields must match their content type: a missing required field (an item that extends another inherits it), an undeclared one and a value of the wrong type are invalid-item-field, each with a path to the field'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might: { type: integer, input: true, default: 0 }
        contentTypes:
          blade:
            fields:
              edge: { type: enum, values: [keen, dull], required: true }
              damage: { type: dice }
              boosts: { type: set, of: field }
      content:
        - { id: blades.sword, type: blade, fields: { edge: keen, damage: 1d8 } }
        - { id: blades.rusty, extends: blades.sword, fields: { edge: dull } }
        - { id: blades.stub, type: blade, fields: { damage: 1d4 } }
        - { id: blades.saw, type: blade, fields: { edge: jagged, boosts: stats.might } }
        - { id: blades.odd, type: blade, fields: { edge: keen, weight: 2 } }
