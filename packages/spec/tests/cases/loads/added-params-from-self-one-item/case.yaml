description: "One spell's two `from: self` effects add `damageType` with other values: both reach that spell's runs, so they conflict"
specVersion: 0.3.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.3.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        tags: [spell]
        contentTypes:
          spell:
            actions:
              - id: cast
                tags: [spell]
                steps: [{ id: done, kind: outcome }]
      content:
        - id: spells.resist-energy
          type: spell
          effects:
            - target: { actions: [spell], from: self }
              op: params
              value:
                damageType: { type: enum, values: [acid, cold, fire], optional: true }
            - target: { actions: [spell], from: self }
              op: params
              value:
                damageType: { type: enum, values: [sonic], optional: true }
