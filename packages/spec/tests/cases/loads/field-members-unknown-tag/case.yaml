description: "A tag that a field's members names must be declared (unknown-tag)"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        tags: [damage.fire]
        fields:
          resists: { type: set, of: tag, input: true, members: { under: [damage, acid] } }
      content: []
