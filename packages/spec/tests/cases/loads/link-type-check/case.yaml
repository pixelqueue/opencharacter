description: 'A link field is typed by its declaration, so formulas type-check without the linked pack'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        links:
          crew:
            fields:
              upgrades.mastery: { type: boolean, default: false }
        fields:
          cap: { type: integer, formula: 'links.crew.upgrades.mastery + 3' }
      content: []
