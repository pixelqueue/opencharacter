description: "`options` is bound only in a choice step\u2019s `recommend`"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        actions:
          - id: pick
            steps:
              - id: ask
                kind: choice
                options: [{ id: a, when: size(options) > 0 }]
      content: []
