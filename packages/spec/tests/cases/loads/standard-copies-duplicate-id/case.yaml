description: 'Standard copies: two standard items whose IDs derive the same instance ID'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          tier: { type: integer, input: true, default: 0 }
        contentTypes:
          gear: { carried: true }
        standardCopies:
          - { type: gear }
      content:
        - { id: gear.rope-coil, type: gear }
        - { id: gear-rope.coil, type: gear }
