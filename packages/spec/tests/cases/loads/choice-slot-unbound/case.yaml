description: '`slot` is bound only in a slotted choice: elsewhere it is `unknown-name`'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          feature: {}
          feat: {}
      content:
        - id: features.training
          type: feature
          choices:
            - id: feat
              when: slot > 1
              from: { type: feat }
