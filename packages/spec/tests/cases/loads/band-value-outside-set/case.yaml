description: 'roll.value is bound only in the bands of a set with a value'
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        resultBands:
          ladder:
            - { id: good, when: roll.value >= 3 }
            - { id: poor, when: true }
      content: []
