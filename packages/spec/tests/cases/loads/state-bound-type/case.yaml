description: "A state key's max must be a number: a string is a formula error"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          weapon:
            carried: true
            state:
              shots: { type: integer, min: 0, max: "'six'" }
      content:
        - id: weapons.pistol
          type: weapon
