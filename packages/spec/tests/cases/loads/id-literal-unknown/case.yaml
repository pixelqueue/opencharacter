description: "An ID literal must name content, a field, a content type, an action or a link slot the pack sees: `@feats.tougness` is formula-error (cause unknown-name) at load; `@feats.toughness` and a qualified ID of a pack the ruleset doesn't load are fine"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          feats.held: { type: set, input: true, default: [] }
          tough: { type: boolean, formula: '@feats.toughness in feats.held' }
          typo: { type: boolean, formula: '@feats.tougness in feats.held' }
          other: { type: boolean, formula: '@other-pack:feats.toughness in feats.held' }
        contentTypes:
          feat: {}
      content:
        - { id: feats.toughness, type: feat }
