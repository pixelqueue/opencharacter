description: "A content group's sectionBy is an integer or a string and its sortBy a number or a string"
specVersion: 0.1.0
call: loadRuleset
packs:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          spell:
            fields:
              level: { type: integer, default: 0 }
              damage: { type: dice, default: 1d6 }
            state:
              prepared: { type: boolean, default: false }
        display:
          groups:
            - id: by-level
              kind: content
              members: { type: spell, where: self.prepared }
              sectionBy: item.level
              sortBy: item.level * 10
            - id: by-damage
              kind: content
              members: { type: spell }
              sectionBy: item.damage
              sortBy: self.prepared
      content: []
