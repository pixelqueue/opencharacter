# The SRD's one feat, Grappler, needs Strength 13: with Strength 10 no feat is open, so the feat
# option's choice, which must have something to pick, has no eligible option and
# the option isn't offered, rather than leaving a feat pick with nothing to pick.
options:
  - option: 5e-srd-5.1:improvements.plus-two
    eligible: true
    picked: false
    recommended: false
    reasons: []
  - option: 5e-srd-5.1:improvements.plus-one
    eligible: true
    picked: false
    recommended: false
    reasons: []
  - option: 5e-srd-5.1:improvements.feat
    eligible: false
    picked: false
    recommended: false
    reasons:
      - { code: no-eligible-option, id: 5e-srd-5.1:improvements.feat/feat }
min: 1
max: 1
