# Every value is listed in written order; Perception, which the character isn't proficient in,
# fails `where`.
options:
  - { option: athletics, eligible: true, picked: false, recommended: false, reasons: [] }
  - option: perception
    eligible: false
    picked: false
    recommended: false
    reasons:
      - { code: option-not-eligible, id: test-pack:features.expertise/skills }
  - { option: stealth, eligible: true, picked: true, recommended: false, reasons: [] }
min: 2
max: 2
