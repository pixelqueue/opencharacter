description: "A choice's `eligible` is apart from its query: the content-only `where` leaves the secret language out of the list, and `eligible` marks Common (known already) and Draconic (not wise) ineligible; Elvish, picked here, stays eligible"
specVersion: 0.1.0
call: listOptions
packs:
  - path: ../../../packs/test-choice-picks
input:
  choice: { entry: sage, choice: [language] }
