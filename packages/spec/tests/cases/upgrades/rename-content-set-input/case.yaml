description: renameContent replaces a member of a set-valued input field
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          kit.favorites:
            type: set
            of: gear
            input: true
            default: []
        contentTypes:
          gear:
            carried: true
      content:
        - id: gear.rope
          type: gear
        - id: gear.torch
          type: gear
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          kit.favorites:
            type: set
            of: gear
            input: true
            default: []
        contentTypes:
          gear:
            carried: true
      content:
        - id: gear.cord
          type: gear
        - id: gear.torch
          type: gear
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - op: renameContent
              from: gear.rope
              to: gear.cord
