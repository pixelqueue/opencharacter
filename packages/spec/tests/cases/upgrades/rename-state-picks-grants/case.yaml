description: renameState renames a key in the saved state of copies, picks and granted content of a type
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          path: {}
          feat:
            state:
              skill: { type: string, default: '' }
              uses: { type: integer, default: 0 }
      content:
        - id: paths.scout
          type: path
          grants:
            - item: feats.track
          choices:
            - id: feat
              from: { type: feat }
        - id: feats.track
          type: feat
        - id: feats.hide
          type: feat
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          path: {}
          feat:
            state:
              focus: { type: string, default: '' }
              uses: { type: integer, default: 0 }
      content:
        - id: paths.scout
          type: path
          grants:
            - item: feats.track
          choices:
            - id: feat
              from: { type: feat }
        - id: feats.track
          type: feat
        - id: feats.hide
          type: feat
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - op: renameState
              type: feat
              from: skill
              to: focus
