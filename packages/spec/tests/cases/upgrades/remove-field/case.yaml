description: removeField drops the saved value
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
          stats.luck:
            type: integer
            input: true
            default: 0
      content: []
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
      content: []
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - op: removeField
              field: stats.luck
