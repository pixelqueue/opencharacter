description: "An action parameter removed, retyped, narrowed or made required is an interface change: on a rules action, an item's or a content type's inline action, or added by a `params` effect (a choice option's included; each declaration of a name compared). An inline action or a `use` gone from a remaining item or content type is `action-removed`. A new optional parameter is no change, and a removed action's parameters are its `action-removed` only"
specVersion: 0.2.0
call: checkRelease
previous:
  inline:
    manifest:
      { id: test-pack, version: 0.1.0, specVersion: 0.2.0, license: CC0-1.0, defaultLanguage: en }
    rules:
      tags: [kw, kw.psionic, kw.magic]
      contentTypes:
        power:
          actions:
            - id: focus
              params:
                depth: { type: integer, default: 1 }
              steps:
                - { id: result, kind: outcome, result: "'done'" }
            - { use: strike }
            - { use: retired }
      effects:
        - target: { actions: [kw.psionic] }
          op: params
          value:
            surge: { type: boolean, default: false }
      choices:
        - id: vow
          from:
            options:
              - id: silence
                effects:
                  - target: { actions: [kw.magic] }
                    op: params
                    value:
                      chant: { type: boolean, default: false }
      actions:
        - id: strike
          tags: [kw.psionic]
          params:
            target: { type: integer }
            mode: { type: enum, values: [quick, heavy], default: quick }
            reach: { type: integer, optional: true }
            power: { type: integer, optional: true }
            edge: { type: integer, default: 0 }
          steps:
            - { id: result, kind: outcome, result: "'done'" }
        - id: spell
          tags: [kw.magic]
          steps:
            - { id: result, kind: outcome, result: "'done'" }
        - id: retired
          params:
            count: { type: integer, default: 1 }
          steps:
            - { id: result, kind: outcome, result: "'done'" }
    content:
      - id: powers.blast
        type: power
        effects:
          - target: { actions: [kw.psionic] }
            op: params
            value:
              boost: { type: boolean, default: false }
        actions:
          - id: overload
            params:
              level: { type: integer, default: 1 }
            steps:
              - { id: result, kind: outcome, result: "'done'" }
          - id: vent
            steps:
              - { id: result, kind: outcome, result: "'done'" }
      - id: powers.ward
        type: power
        effects:
          - target: { actions: [kw.psionic] }
            op: params
            value:
              guard: { type: integer, default: 0 }
          - target: { actions: [kw.magic] }
            op: params
            value:
              guard: { type: boolean, default: false }
