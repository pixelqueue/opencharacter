description: "stateToField moves a state key off copies to the copy's own value of a perCopy item field; a value equal to the item's (or the field's default) is dropped"
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          stunt:
            fields:
              limit: { type: enum, values: [none, scene, session], default: none }
            state:
              limit: { type: enum, values: [none, scene, session], default: none }
              uses: { type: integer, default: 0 }
      content:
        - id: stunts.custom
          type: stunt
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          stunt:
            fields:
              limit: { type: enum, values: [none, scene, session], default: none, perCopy: true }
            state:
              uses: { type: integer, default: 0 }
      content:
        - id: stunts.custom
          type: stunt
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - { op: stateToField, item: stunts.custom, from: limit }
