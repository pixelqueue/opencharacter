description: changeContentType covers content-type-changed only when its types match the change
specVersion: 0.1.0
call: checkRelease
previous:
  inline:
    manifest:
      id: test-pack
      version: 1.0.0
      specVersion: 0.1.0
      license: CC0-1.0
      defaultLanguage: en
    rules:
      contentTypes:
        gear: { carried: true }
        tool: { carried: true }
        trait: {}
    content:
      - { id: gear.torch, type: gear }
      - { id: gear.rope, type: gear }
next:
  inline:
    manifest:
      id: test-pack
      version: 2.0.0
      specVersion: 0.1.0
      license: CC0-1.0
      defaultLanguage: en
    rules:
      contentTypes:
        gear: { carried: true }
        tool: { carried: true }
        trait: {}
    content:
      - { id: gear.torch, type: tool }
      - { id: gear.rope, type: tool }
    upgrades:
      - pack: test-pack
        from: 1.0.0
        to: 2.0.0
        steps:
          - { op: changeContentType, id: gear.torch, from: gear, to: tool }
          # Wrong old type: doesn't cover the rope's change.
          - { op: changeContentType, id: gear.rope, from: trait, to: tool }
