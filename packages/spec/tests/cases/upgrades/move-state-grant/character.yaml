specVersion: 0.1.0
id: test
packs:
  - id: test-pack
    version: 1.0.0
features:
  # The orc's endurance trait takes the value. Its rebuke trait already has a saved value, which
  # stays.
  - id: o1
    item: test-pack:races.orc
    state: { enduranceUsed: true, rebukeUsed: false }
    grants:
      test-pack:traits.rebuke: { state: { used: false } }
  # The grant sets rebuke's used to true, so a false is kept though it is the declared default.
  - id: o2
    item: test-pack:races.orc
    state: { rebukeUsed: false }
  # The elf grants no endurance trait: the value is dropped.
  - id: e
    item: test-pack:races.elf
    state: { enduranceUsed: true }
