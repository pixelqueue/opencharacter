description: renameItemField, mapItemValues and removeItemField change the item fields of homebrew items of the type, and renameItemField their item.<field> names
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.harm: { type: integer, formula: 0 }
        contentTypes:
          weapon:
            carried: true
            fields:
              damage: { type: integer, default: 1 }
              reach: { type: enum, values: [close, near, far], default: close }
              weight: { type: integer, default: 0 }
      content: []
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.harm: { type: integer, formula: 0 }
        contentTypes:
          weapon:
            carried: true
            fields:
              harm: { type: integer, default: 1 }
              reach: { type: enum, values: [close, far], default: close }
      content: []
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - { op: renameItemField, type: weapon, from: damage, to: harm }
            - { op: mapItemValues, type: weapon, field: reach, map: { near: close } }
            - { op: removeItemField, type: weapon, field: weight }
