description: Before 1.0.0, a minor bump is a breaking bump; with a complete script it is valid
specVersion: 0.1.0
call: checkRelease
previous:
  inline:
    manifest:
      id: test-pack
      version: 0.1.0
      specVersion: 0.1.0
      license: CC0-1.0
      defaultLanguage: en
    rules:
      fields:
        stats.might:
          type: integer
          input: true
          default: 1
          min: 0
          max: 10
        stats.bonus:
          type: integer
          formula: stats.might * 2
      contentTypes:
        gear:
          carried: true
    content:
      - id: gear.rope
        type: gear
      - id: gear.torch
        type: gear
next:
  inline:
    manifest:
      id: test-pack
      version: 0.2.0
      specVersion: 0.1.0
      license: CC0-1.0
      defaultLanguage: en
    rules:
      fields:
        stats.might:
          type: integer
          input: true
          default: 1
          min: 0
          max: 10
        stats.bonus:
          type: integer
          formula: stats.might * 2
      contentTypes:
        gear:
          carried: true
    content:
      - id: gear.rope
        type: gear
    upgrades:
      - pack: test-pack
        from: 0.1.0
        to: 0.2.0
        steps:
          - op: removeContent
            id: gear.torch
