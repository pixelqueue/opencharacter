description: 'Versions without a script changed no state: the chain skips to the next script'
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
      content: []
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.power:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
      content: []
      upgrades:
        - pack: test-pack
          from: 1.1.0
          to: 2.0.0
          steps:
            - op: renameField
              from: stats.might
              to: stats.power
