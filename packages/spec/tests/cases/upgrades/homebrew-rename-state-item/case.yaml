description: renameState with an item renames the key only on that item's homebrew variants (through extends) and their saved copies, not on every homebrew item
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.light: { type: integer, formula: 0 }
        contentTypes:
          gear: { carried: true }
      content:
        - id: gear.rope
          type: gear
          state:
            uses: { type: integer, default: 0 }
        - id: gear.lamp
          type: gear
          state:
            uses: { type: integer, default: 0 }
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.light: { type: integer, formula: 0 }
        contentTypes:
          gear: { carried: true }
      content:
        - id: gear.rope
          type: gear
          state:
            charges: { type: integer, default: 0 }
        - id: gear.lamp
          type: gear
          state:
            uses: { type: integer, default: 0 }
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - { op: renameState, item: gear.rope, from: uses, to: charges }
