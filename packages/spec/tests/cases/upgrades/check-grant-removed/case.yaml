description: grant-removed is detected for content a remaining item stops granting (not for content grant-only now); grantsToCopies naming the holder or removeContent covers it
specVersion: 0.1.0
call: checkRelease
previous:
  inline:
    manifest:
      id: test-pack
      version: 1.0.0
      specVersion: 0.1.0
      license: CC0-1.0
      defaultLanguage: en
    rules:
      contentTypes:
        monster: {}
        action: {}
        gift: {}
    content:
      - id: monsters.ogre
        type: monster
        grants: [{ item: actions.club }, { item: gifts.blessing }]
      - id: monsters.troll
        type: monster
        grants: [{ item: actions.claw }, { item: actions.bite }]
      - { id: actions.club, type: action }
      - { id: actions.claw, type: action }
      - { id: actions.bite, type: action }
      - { id: gifts.blessing, type: gift }
next:
  inline:
    manifest:
      id: test-pack
      version: 2.0.0
      specVersion: 0.1.0
      license: CC0-1.0
      defaultLanguage: en
    rules:
      contentTypes:
        monster: {}
        action: {}
        gift: { grantOnly: true }
    content:
      - { id: monsters.ogre, type: monster }
      - { id: monsters.troll, type: monster }
      - { id: actions.club, type: action }
      - { id: actions.claw, type: action }
      - { id: actions.bite, type: action }
      - { id: gifts.blessing, type: gift }
    upgrades:
      - pack: test-pack
        from: 1.0.0
        to: 2.0.0
        steps:
          - { op: grantsToCopies, item: monsters.ogre }
          - { op: removeContent, id: actions.claw }
