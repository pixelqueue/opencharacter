description: mapValues replaces a saved value found in the map
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.size:
            type: enum
            values:
              - small
              - medium
              - large
            input: true
            default: medium
      content: []
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.size:
            type: enum
            values:
              - tiny
              - average
              - huge
            input: true
            default: average
      content: []
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - op: mapValues
              field: stats.size
              map:
                small: tiny
                medium: average
                large: huge
