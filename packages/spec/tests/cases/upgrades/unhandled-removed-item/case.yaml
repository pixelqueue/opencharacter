description: A removed item no script handles is reported in report.errors; the upgrade still succeeds
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
        contentTypes:
          gear:
            carried: true
      content:
        - id: gear.rope
          type: gear
        - id: gear.torch
          type: gear
to:
  - inline:
      manifest:
        id: test-pack
        version: 1.1.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
        contentTypes:
          gear:
            carried: true
      content:
        - id: gear.torch
          type: gear
