description: content-removed and content-type-changed are detected; a covering script makes the release valid
specVersion: 0.1.0
call: checkRelease
previous:
  inline:
    manifest:
      id: test-pack
      version: 1.0.0
      specVersion: 0.1.0
      license: CC0-1.0
      defaultLanguage: en
    rules:
      fields:
        stats.might:
          type: integer
          input: true
          default: 1
          min: 0
          max: 10
      contentTypes:
        gear:
          carried: true
        tool:
          carried: true
    content:
      - id: gear.rope
        type: gear
      - id: gear.torch
        type: gear
next:
  inline:
    manifest:
      id: test-pack
      version: 2.0.0
      specVersion: 0.1.0
      license: CC0-1.0
      defaultLanguage: en
    rules:
      fields:
        stats.might:
          type: integer
          input: true
          default: 1
          min: 0
          max: 10
      contentTypes:
        gear:
          carried: true
        tool:
          carried: true
    content:
      - id: gear.cord
        type: gear
      - id: gear.torch
        type: tool
    upgrades:
      - pack: test-pack
        from: 1.0.0
        to: 2.0.0
        steps:
          - op: renameContent
            from: gear.rope
            to: gear.cord
          - op: removeContent
            id: gear.torch
