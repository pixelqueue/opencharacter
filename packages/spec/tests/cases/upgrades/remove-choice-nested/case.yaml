description: an owner path names a choice nested in an inline option; removeChoice drops its picks and renameChoice renames one
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          class: {}
          feat: {}
        choices:
          - id: motto
            from:
              options:
                - id: brave
                  choices:
                    - id: deed
                      required: false
                      from: { values: [duel, rescue] }
      content:
        - id: classes.operative
          type: class
          choices:
            - id: specialization
              from:
                options:
                  - id: ghost
                    choices:
                      - id: skill-feat
                        from: { type: feat }
                  - id: sniper
                    choices:
                      - id: skill-feat
                        from: { type: feat }
        - id: feats.hide
          type: feat
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        contentTypes:
          class: {}
          feat: {}
        choices:
          - id: motto
            from:
              options:
                - id: brave
                  choices:
                    - id: feat
                      required: false
                      from: { values: [duel, rescue] }
      content:
        - id: classes.operative
          type: class
          choices:
            - id: specialization
              from:
                options:
                  - id: ghost
                  - id: sniper
                    choices:
                      - id: skill-feat
                        from: { type: feat }
        - id: feats.hide
          type: feat
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - op: removeChoice
              owner: classes.operative/specialization/ghost
              choice: skill-feat
            - op: renameChoice
              owner: motto/brave
              from: deed
              to: feat
