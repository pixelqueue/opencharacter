description: 'A formula change needs no script: pins move and the report shows the recalculated value'
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
          stats.bonus:
            type: integer
            formula: stats.might * 2
      content: []
to:
  - inline:
      manifest:
        id: test-pack
        version: 1.1.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
          stats.bonus:
            type: integer
            formula: stats.might * 3
      content: []
