description: setDefault evaluates its formula against the original character under the old ruleset
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
          stats.max:
            type: integer
            formula: stats.might * 10
      content: []
to:
  - inline:
      manifest:
        id: test-pack
        version: 1.1.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
          stats.max:
            type: integer
            formula: stats.might * 10
          stats.reserve:
            type: integer
            input: true
            default: 0
      content: []
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 1.1.0
          steps:
            - op: setDefault
              field: stats.reserve
              value: stats.max
