description: renameState without a type renames the key on every copy
specVersion: 0.1.0
call: upgrade
from:
  - inline:
      manifest:
        id: test-pack
        version: 1.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
        contentTypes:
          gear:
            carried: true
            state:
              uses:
                type: integer
                default: 0
          tool:
            carried: true
            state:
              uses:
                type: integer
                default: 0
      content:
        - id: gear.rope
          type: gear
        - id: tools.hammer
          type: tool
to:
  - inline:
      manifest:
        id: test-pack
        version: 2.0.0
        specVersion: 0.1.0
        license: CC0-1.0
        defaultLanguage: en
      rules:
        fields:
          stats.might:
            type: integer
            input: true
            default: 1
            min: 0
            max: 10
        contentTypes:
          gear:
            carried: true
            state:
              charges:
                type: integer
                default: 0
          tool:
            carried: true
            state:
              charges:
                type: integer
                default: 0
      content:
        - id: gear.rope
          type: gear
        - id: tools.hammer
          type: tool
      upgrades:
        - pack: test-pack
          from: 1.0.0
          to: 2.0.0
          steps:
            - op: renameState
              from: uses
              to: charges
