# Every character has a fist (a standard copy). Iron fists keep the iron template on unarmed
# weapons; the iron template grants training, which keeps the sharp template on heavy weapons
# (by the base item's tags); focus keeps it while focused; an applied enchantment keeps it on
# every weapon. Potent keeps the far template on picked or granted spells with a range; a spell's
# own effect and its cast action read its range. Spear keeps the spear template on the cantrip it
# names, 30 farther per rank; bond keeps the keen template on copies of the weapon it names.
standardCopies:
  - { type: weapon, where: "'standard' in item.tags" }

tags: [standard, unarmed, light, heavy, far]

contentTypes:
  weapon:
    carried: true
    equippable: true
    fields:
      damage: { type: dice, required: true }
      bonus: { type: integer, default: 0 }
    computed:
      bonus: { type: integer, formula: item.bonus }
      heavy: { type: boolean, formula: "'heavy' in item.tags" }
      light: { type: boolean, formula: "'light' in item.tags" }
      templates: { type: integer, formula: size(self.templates) }
  feature:
    state:
      focused: { type: boolean, default: false }
      rank: { type: integer, default: 1 }
  spell:
    fields:
      level: { type: integer, default: 0 }
      range: { type: integer, default: 0 }
    effects:
      - { target: range.best, op: atLeast, value: item.range }
    actions:
      - use: cast

fields:
  range.best: { type: integer, formula: 0 }
  kept.count: { type: integer, formula: 0 }
  heavy.count:
    { type: integer, formula: "countCopies(copy.type == 'weapon' && 'heavy' in copy.tags)" }

actions:
  # A spell's cast: its range, as its item reads it.
  - id: cast
    steps:
      - id: result
        kind: outcome
        result: item.id
        data:
          range: item.range
          far: "'far' in item.tags"
