id: charms.ember
type: charm
# +1d4 fire damage to a strike, and +1 fire, neither multiplied.
effects:
  - target: { rolls: [strike] }
    op: add
    value: 1d4
    tags: [damage.fire]
    multiplied: false
  - target: { rolls: [strike] }
    op: add
    value: 1
    tags: [damage.fire]
    multiplied: false
