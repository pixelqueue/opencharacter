# +2 to one ability and +1 to another, or +1 to each. The two picks are sibling choices of the
# inline option: each recommends the first ability the other hasn't taken. They read each
# other's saved picks, not recommendations, so this can't loop: whichever is asked first takes
# dex.
id: backgrounds.scholar
type: background
choices:
  - id: increase
    recommend: "'two-and-one'"
    from:
      options:
        - id: two-and-one
          choices:
            - id: plus-two
              unique: increase
              uniqueScope: owner
              from: { values: [dex, con, str] }
              recommend: "filterList(['dex', 'con', 'str'], !(x in picksOf('plus-one')))[0]"
              effects:
                - target: { fields: { where: "item.id == 'test-owner-picks:' + pick.value" } }
                  op: add
                  value: 2
            - id: plus-one
              unique: increase
              uniqueScope: owner
              from: { values: [dex, con, str] }
              recommend: "filterList(['dex', 'con', 'str'], !(x in picksOf('plus-two')))[0]"
              effects:
                - target: { fields: { where: "item.id == 'test-owner-picks:' + pick.value" } }
                  op: add
                  value: 1
        - id: one-each
          effects:
            - { target: dex, op: add, value: 1 }
            - { target: con, op: add, value: 1 }
            - { target: str, op: add, value: 1 }
