tags: [attack, check]

fields:
  # Advantage on attacks from an ally's help.
  aided: { type: boolean, input: true, default: false }

contentTypes:
  condition:
    carried: false
  feat:
    state:
      used: { type: boolean, default: false }
  class: {}
  boon:
    state:
      uses: { type: integer, default: 1, min: 0 }

effects:
  - target: { rolls: [attack] }
    op: rollModifier
    value: { kind: advantage }
    when: aided

actions:
  - id: attack
    steps:
      - { id: roll, kind: roll, tags: [attack], parts: [{ dice: 1d20 }] }
      - { id: result, kind: outcome, data: { total: steps.roll.total } }
  - id: check
    steps:
      - { id: roll, kind: roll, tags: [check], parts: [{ dice: 1d20 }] }
      - { id: result, kind: outcome, data: { total: steps.roll.total } }
  # Two attacks, one per pass of a group.
  - id: volley
    steps:
      - id: shots
        kind: group
        repeat: { while: 'true', max: 2 }
        steps:
          - { id: roll, kind: roll, tags: [attack], parts: [{ dice: 1d20 }] }
      - id: result
        kind: outcome
        data: { first: 'steps.shots[0].roll.total', last: steps.roll.total }
