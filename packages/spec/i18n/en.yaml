# A roll summary's comparison codes: the fallback wording of a band's `tests`
# when its pack has no `bands.<set>.<band>.condition` text. `value` is the test's number.
compare.lt: 'under {value}'
compare.le: '{value} or lower'
compare.gt: 'over {value}'
compare.ge: '{value} or higher'
compare.eq: 'exactly {value}'

# A roll's dice in words: a dice item is `dice.dice` (`count`, `sides`) or, for
# Fate dice, `dice.fate`; each dice modifier (data/dice-modifiers.json) is `dice.<modifier>` with
# `count` (keep, drop), `target` (minimum, maximum) or `faces` (the faces it matches, as
# `compare.<code>` text or the face itself), added with `dice.modified`; items are joined with
# `dice.plus` and `dice.minus`, and a subtracted first item is `dice.negative`.
dice.dice: '{count}d{sides}'
dice.fate: '{count}dF'
dice.modified: '{dice}, {modifier}'
dice.plus: '{first} + {second}'
dice.minus: '{first} - {second}'
dice.negative: '-{dice}'
dice.keepHighest: '{count, plural, =1 {keep highest} other {keep highest #}}'
dice.keepLowest: '{count, plural, =1 {keep lowest} other {keep lowest #}}'
dice.dropHighest: '{count, plural, =1 {drop highest} other {drop highest #}}'
dice.dropLowest: '{count, plural, =1 {drop lowest} other {drop lowest #}}'
dice.explode: 'exploding on {faces}'
dice.explodeCompound: 'compounding on {faces}'
dice.reroll: 'reroll {faces}'
dice.rerollOnce: 'reroll {faces} once'
dice.countSuccesses: 'count successes on {faces}'
dice.countFailures: 'less one per {faces}'
dice.minimum: 'each die at least {target}'
dice.maximum: 'each die at most {target}'
