# Standard English text for the spec's own error and rules-issue codes, and for the options the
# spec itself reserves. Keys: errors.<code>, issues.<code>, actions.options.<option>.name,
# compare.<code> and dice.*. ICU MessageFormat; placeholders come from the
# error's `data`.

# A repeated choice step's `#done` option: stop picking.
actions.options.done.name: 'Done'
# `#done` on a choice step over pending choices: it ends the whole step, leaving
# every choice still pending.
actions.options.done.pending.name: 'Skip the rest'

# A code with no text of its own (an engine newer than this text, or an error passed as an issue):
# never the bare code.
errors.other: 'Something went wrong ({code}).'

