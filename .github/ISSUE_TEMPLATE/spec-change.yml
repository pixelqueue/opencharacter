name: Spec change
description: Something the format can't express, or expresses badly.
labels: ['spec change']
body:
  - type: textarea
    id: modeling
    attributes:
      label: What you were modeling
      description: The game, the rule, and where it appears.
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What's missing
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: What you did instead, if anything, and why it falls short.
  - type: textarea
    id: options
    attributes:
      label: Options
      description: The changes you see, with their trade-offs.
