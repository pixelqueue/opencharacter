name: New pack
description: Propose a pack for another game or book.
labels: ['new pack']
body:
  - type: input
    id: game
    attributes:
      label: Game or book
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: The open license the rules are released under, with a link (for example CC-BY-4.0, ORC, OGL 1.0a). Packs need an open license, or must be mechanics only.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What the pack would cover, and whether you plan to build it.
