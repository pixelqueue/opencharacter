changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Spec
      labels: ['area: spec', 'spec change']
    - title: Engine and text
      labels: ['area: engine', 'area: text']
    - title: Packs
      labels:
        [
          'pack: 5e-srd-5.1',
          'pack: fate-core',
          'pack: fitd-crew',
          'pack: fitd-scoundrel',
          'pack: mork-borg-core',
          'pack: mothership-1e',
          'pack: orc-2e',
          'pack: orc-sf-2e',
          'new pack',
          'rules error',
        ]
    - title: Fixes
      labels: [bug]
    - title: Other
      labels: ['*']
