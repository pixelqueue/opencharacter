# A 3rd-level Adventurer, partial Expert and partial High Mage, from an artisan's background: the
# attribute array, three High Mage arts, six first-level spells with three prepared and one cast
# today, a Focus at second level, and skill points spent as she advanced.
specVersion: 0.1.0
id: example-wn-fantasy-ysolde
packs:
  - { id: wn-fantasy, version: 0.1.0 }
values:
  wn-fantasy:level: 3
  wn-fantasy:xp.current: 7
  wn-fantasy:attributes.str.score: 9
  wn-fantasy:attributes.dex.score: 11
  wn-fantasy:attributes.con.score: 10
  wn-fantasy:attributes.int.score: 14
  wn-fantasy:attributes.wis.score: 12
  wn-fantasy:attributes.cha.score: 7
  wn-fantasy:skills.know: 1
  wn-fantasy:skills.heal: 0
  wn-fantasy:skills.craft: 0
  wn-fantasy:skills.magic: 1
  wn-fantasy:skills.notice: 1
  wn-fantasy:skills.sneak: 0
  wn-fantasy:skills.stab: 0
  wn-fantasy:skillPoints.unspent: 1
  wn-fantasy:hp.rolled: 10
  wn-fantasy:hp.current: 8
  wn-fantasy:spells.castsUsed: 1
  wn-fantasy:effort.highmage.day: 1
  wn-fantasy:coins.silver: 65
features:
  - id: background
    item: wn-fantasy:backgrounds.artisan
  - id: class
    item: wn-fantasy:classes.adventurer
    choices:
      first:
        - option: wn-fantasy:partials.expert
      second:
        - option: wn-fantasy:partials.mage
          choices:
            tradition:
              - option: high-mage
  - id: focus-1
    item: wn-fantasy:foci.specialist
    state: { level: 1 }
    choices:
      skill:
        - option: know
  - id: focus-2
    item: wn-fantasy:foci.alert
    state: { level: 1 }
  - id: focus-3
    item: wn-fantasy:foci.armored-magic
    state: { level: 1 }
  - { id: art-1, item: wn-fantasy:arts.high-mage.counter-magic }
  - { id: art-2, item: wn-fantasy:arts.high-mage.sense-magic }
  - { id: art-3, item: wn-fantasy:arts.high-mage.empowered-sorcery }
  - id: spell-1
    item: wn-fantasy:spells.high.coruscating-coffin
    state: { prepared: true }
  - id: spell-2
    item: wn-fantasy:spells.high.wind-of-the-final-repose
    state: { prepared: true }
  - id: spell-3
    item: wn-fantasy:spells.high.phantasmal-mimesis
    state: { prepared: true }
  - { id: spell-4, item: wn-fantasy:spells.high.wardpact-invocation }
  - { id: spell-5, item: wn-fantasy:spells.high.velocitous-imbuement }
  - { id: spell-6, item: wn-fantasy:spells.high.apprehending-the-arcane-form }
inventory:
  - { id: coat, item: wn-fantasy:armor.buff-coat, equipped: true }
  - { id: staff, item: wn-fantasy:weapons.staff, equipped: true }
  - { id: dagger, item: wn-fantasy:weapons.dagger, equipped: true }
  - { id: backpack, item: wn-fantasy:gear.backpack, equipped: true }
  - { id: lantern, item: wn-fantasy:gear.lantern }
  - { id: oil, item: wn-fantasy:gear.oil, quantity: 2 }
  - { id: writing-kit, item: wn-fantasy:gear.writing-kit }
  - { id: rations, item: wn-fantasy:gear.rations }
  - { id: waterskin, item: wn-fantasy:gear.waterskin }
