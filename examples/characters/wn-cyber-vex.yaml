specVersion: 0.1.0
id: example-wn-cyber-vex
packs:
  - { id: wn-cyber, version: 0.1.0 }
values:
  wn-cyber:attributes.str.base: 14
  wn-cyber:attributes.dex.base: 13
  wn-cyber:attributes.con.base: 12
  wn-cyber:attributes.int.base: 9
  wn-cyber:attributes.wis.base: 10
  wn-cyber:attributes.cha.base: 8
  # Ganger: Any Combat (Stab) free, then Learning picks Any Combat (Stab) and Connect. Killing
  # Blow's combat skill is Shoot, Armsmaster's bonus skill raises nothing new (Stab is level-1),
  # so the player took Exert; the free skill is Notice.
  wn-cyber:skills.stab.base: 1
  wn-cyber:skills.connect.base: 0
  wn-cyber:skills.shoot.base: 0
  wn-cyber:skills.exert.base: 0
  wn-cyber:skills.notice.base: 0
  wn-cyber:hp.rolled: 7
  wn-cyber:hp.current: 7
  wn-cyber:money: 380
  wn-cyber:goal: Pay off the debt that got her brother killed.
choices:
  background:
    - option: wn-cyber:backgrounds.ganger
  edge-1:
    - option: wn-cyber:edges.killing-blow
  edge-2:
    - option: wn-cyber:edges.hard-to-kill
features:
  - { id: armsmaster, item: wn-cyber:foci.armsmaster }
  - id: fixer
    item: wn-cyber:contacts.contact
    state: { label: Marlo, bond: acquaintance, about: A fence who owes her a favor. }
  - id: doc
    item: wn-cyber:contacts.contact
    state: { label: Auntie Seo, bond: acquaintance, about: The street doc two blocks over. }
inventory:
  - { id: knife, item: wn-cyber:weapons.advanced-knife, equipped: true }
  - { id: pistol, item: wn-cyber:weapons.heavy-pistol, equipped: true }
  - { id: leathers, item: wn-cyber:armor.street-leathers, equipped: true }
  - { id: medkit, item: wn-cyber:gear.kit-medkit }
