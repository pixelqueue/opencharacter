# A first-level berserker fury with the Quick Build picks and the Panther kit: Might and Agility 2 and the 2, −1, −1 array, at full
# Stamina (21 + 6 from the kit) with all ten Recoveries.
specVersion: 0.3.0
id: example-draw-steel-khorva
packs:
  - { id: draw-steel-heroes, version: 0.1.0 }
values:
  draw-steel-heroes:characteristics.might.base: 2
  draw-steel-heroes:characteristics.agility.base: 2
  draw-steel-heroes:characteristics.reason.base: 2
  draw-steel-heroes:characteristics.intuition.base: -1
  draw-steel-heroes:characteristics.presence.base: -1
  draw-steel-heroes:stamina.current: 27
features:
  - id: fury
    item: draw-steel-heroes:classes.fury
    state: { level: 1 }
    choices:
      aspect:
        - option: draw-steel-heroes:subclasses.fury.berserker
          choices:
            draw-steel-heroes:features.common.kit/kit: [{ option: draw-steel-heroes:kits.panther }]
      skills:
        - { option: draw-steel-heroes:skills.alertness }
        - { option: draw-steel-heroes:skills.jump }
      signature: [{ option: draw-steel-heroes:abilities.fury.to-the-death }]
      heroic-3: [{ option: draw-steel-heroes:abilities.fury.back }]
      heroic-5: [{ option: draw-steel-heroes:abilities.fury.blood-for-blood }]
