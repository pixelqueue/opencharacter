# An orc-2e character: a 3rd-level rock dwarf witch whose patron is
# the Spinner of Threads, with an acolyte background.
#
# Boosts: her ancestry's Constitution and Wisdom (Charisma flaw) and a free Intelligence, the
# acolyte's Intelligence and a free Constitution, the witch's Intelligence, and four free
# (Intelligence, Constitution, Dexterity, Wisdom): Str +0, Dex +1, Con +3, Int +4, Wis +2, Cha -1.
# Spell attack +9, spell DC 19, 40 Hit Points. Trained skills: Religion and Scribing Lore
# (acolyte), Occultism (her patron), Crafting and Dwarf Lore (Dwarven Lore, Religion's second
# training freeing Thievery) and seven more.
#
# Occult spells, prepared with Intelligence from what her familiar knows: ten cantrips, five
# 1st-rank spells, sure strike (her patron's lesson) and two more at each level. Hexes: nudge fate
# (her patron's hex cantrip), patron's puppet and needle of vengeance (Basic Lesson: the lesson of
# vengeance, which also teaches her familiar phantom pain): two Focus Points.
specVersion: 0.2.0
id: example-orc-morwen
packs:
  - { id: orc-2e, version: 0.2.0 }
values:
  orc-2e:level: 3
  orc-2e:hp.current: 40
  orc-2e:skills.occultism.increases: 1
features:
  - id: ancestry
    item: orc-2e:ancestries.dwarf
    choices:
      heritage:
        - option: orc-2e:heritages.rock-dwarf
      boosts:
        - option: standard
          choices:
            free:
              - option: orc-2e:boosts.int
  - id: background
    item: orc-2e:backgrounds.acolyte
    choices:
      boost:
        - option: orc-2e:boosts.int
      free-boost:
        - option: orc-2e:boosts.con
  - id: class
    item: orc-2e:classes.witch
    choices:
      patron:
        - option: orc-2e:classes.witch.patrons.spinner-of-threads
      hex:
        - option: patrons-puppet
      skills:
        - option: skill.arcana
        - option: skill.medicine
        - option: skill.nature
        - option: skill.society
        - option: skill.stealth
        - option: skill.diplomacy
        - option: skill.lore.academia
      familiar-cantrips:
        - option: orc-2e:spells.figment
        - option: orc-2e:spells.prestidigitation
        - option: orc-2e:spells.telekinetic-projectile
        - option: orc-2e:spells.daze
        - option: orc-2e:spells.read-aura
        - option: orc-2e:spells.guidance
        - option: orc-2e:spells.sigil
        - option: orc-2e:spells.forbidding-ward
        - option: orc-2e:spells.void-warp
        - option: orc-2e:spells.shield
      familiar-spells:
        - option: orc-2e:spells.sanctuary
        - option: orc-2e:spells.fear
        - option: orc-2e:spells.command
        - option: orc-2e:spells.alarm
        - option: orc-2e:spells.mindlink
      familiar-learns-2:
        - option: orc-2e:spells.soothe
        - option: orc-2e:spells.protection
      class-feat-2:
        - option: orc-2e:feats.witch.basic-lesson
          choices:
            lesson:
              - option: orc-2e:classes.witch.lessons.vengeance
      skill-feat-2:
        - option: orc-2e:feats.skill.natural-medicine
      familiar-learns-3:
        - option: orc-2e:spells.blood-vendetta
        - option: orc-2e:spells.paranoia
choices:
  free-boosts:
    - option: orc-2e:boosts.int
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.wis
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.dwarven-lore
  languages:
    - option: orc-2e:languages.elven
    - option: orc-2e:languages.fey
    - option: orc-2e:languages.draconic
    - option: orc-2e:languages.gnomish
  extra-training:
    - option: skill.thievery
  general-feat-3:
    - option: orc-2e:feats.general.toughness
inventory:
  - { id: staff, item: orc-2e:weapons.staff, equipped: true }
  - { id: backpack, item: orc-2e:gear.backpack }
