# An orc-2e character: a 1st-level human monk with an acrobat
# background, unarmored, in no stance yet.
#
# Boosts: two free from her ancestry (Dexterity, Wisdom), the acrobat's Dexterity and a free
# Strength, the monk's Dexterity, and four free (Strength, Dexterity, Constitution, Wisdom):
# Str +2, Dex +4, Con +1, Wis +2. A versatile human takes a general feat (Fleet); Natural
# Ambition gives a second monk feat (Crane Stance). Trained skills: Acrobatics and Circus Lore
# (acrobat) and four more (4 + Intelligence +0).
specVersion: 0.1.0
id: example-orc-ren
packs:
  - { id: orc-2e, version: 0.1.0 }
values:
  orc-2e:hp.current: 19
features:
  - id: ancestry
    item: orc-2e:ancestries.human
    choices:
      heritage:
        - option: orc-2e:heritages.versatile-human
          choices:
            feat:
              - option: orc-2e:feats.general.fleet
      boosts:
        - option: orc-2e:boosts.dex
        - option: orc-2e:boosts.wis
  - id: background
    item: orc-2e:backgrounds.acrobat
    choices:
      boost:
        - option: orc-2e:boosts.dex
      free-boost:
        - option: orc-2e:boosts.str
  - id: class
    item: orc-2e:classes.monk
    choices:
      key-attribute:
        - option: dex
      skills:
        - option: skill.athletics
        - option: skill.stealth
        - option: skill.medicine
        - option: skill.religion
      class-feat-1:
        - option: orc-2e:feats.monk.tiger-stance
inventory:
  - { id: backpack, item: orc-2e:gear.backpack }
  - { id: rations, item: orc-2e:gear.rations, quantity: 2 }
choices:
  free-boosts:
    - option: orc-2e:boosts.str
    - option: orc-2e:boosts.dex
    - option: orc-2e:boosts.con
    - option: orc-2e:boosts.wis
  ancestry-feat-1:
    - option: orc-2e:feats.ancestry.natural-ambition
      choices:
        feat:
          - option: orc-2e:feats.monk.crane-stance
  languages:
    - option: orc-2e:languages.elven
