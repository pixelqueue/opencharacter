# Grub's Ancient Gore-Hound (mork-borg-grub.yaml): a companion's own sheet, made by the pack's
# `companion` creation start. It holds the companion item instead of a class; its attack and
# defense come from the item. It has taken 3 damage.
specVersion: 0.2.0
id: example-mork-borg-grub-hound
packs:
  - { id: mork-borg-core, version: 0.1.1 }
values:
  mork-borg-core:hp.max: 10
  mork-borg-core:hp.current: 7
features:
  - id: companion
    item: mork-borg-core:companions.ancient-gore-hound
