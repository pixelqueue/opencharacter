  5e-srd-5.1:abilities.con.base: 10
  5e-srd-5.1:abilities.int.base: 10
  5e-srd-5.1:abilities.wis.base: 8
  5e-srd-5.1:abilities.cha.base: 8
  5e-srd-5.1:challenge.rating: 0.25
  5e-srd-5.1:creature.size: small
  5e-srd-5.1:creature.type: humanoid
  5e-srd-5.1:combat.speed: 30
  5e-srd-5.1:proficiencies.skills: [skill.stealth]
  5e-srd-5.1:proficiencies.expertise: [skill.stealth]
  5e-srd-5.1:proficiencies.languages: [5e-srd-5.1:languages.common, 5e-srd-5.1:languages.goblin]
  5e-srd-5.1:hp.base: 7
