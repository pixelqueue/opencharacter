# A goblin from the SRD 5.1 stat block, as the `monster` creation start makes it: the stat block's
# item (content/monsters/goblin.yaml) and its numbers as input values. Monsters have no class
# levels, so proficiency comes from the challenge rating. Derived values the engine should compute:
# AC 15 (the stat block's), HP max 7, proficiency +2, Stealth +6; its scimitar and shortbow are
# monster-attack actions (+4, 1d6 + 2).
