# A template setting a field that is neither a template field nor its base
# type's, and a base-type field whose formula reads a typo of `base`.
id: templates.keen
type: template
appliesTo: { type: weapon }
fields:
  rarity: rare
  sharpness: 2
  damage: base.damag
# A template's computed value is an argument of the items of its appliesTo type.
computed:
  edge: { type: integer, formula: 2 }
