id: tricks.hop
type: trick
# An item's own enum state key: its values need names.
state:
  stance: { type: enum, values: [low, high], default: low }
# Prerequisite text is a phrase: the standard text names the owner.
prerequisites:
  - { id: hat, when: 'true' }
  - { id: calm, when: 'true' }
# A values step of its own action: the item's own value text is optional.
actions:
  - id: pick
    steps: [{ id: side, kind: choice, options: { values: [left, right] } }]
