# A 0.1.0 Adventurer, partial Expert and partial High Mage: the partial Mage's tradition, nested
# in the Adventurer's pick, was the inline option `high-mage`. 0.2.0 picks it as tradition content.
pack: wwn-srd
from: 0.1.0
to: 0.2.0
expect:
  - at: /features/1/choices/second/0/choices/tradition
    value: [{ option: wwn-srd:traditions.high-mage }]
character:
  specVersion: 0.1.0
  id: upgrade-wwn-srd-partial-mage
  values:
    wwn-srd:attributes.str.score: 9
    wwn-srd:attributes.dex.score: 11
    wwn-srd:attributes.con.score: 10
    wwn-srd:attributes.int.score: 14
    wwn-srd:attributes.wis.score: 12
    wwn-srd:attributes.cha.score: 7
    wwn-srd:hp.rolled: 6
    wwn-srd:hp.current: 6
  features:
    - id: background
      item: wwn-srd:backgrounds.artisan
    - id: class
      item: wwn-srd:classes.adventurer
      choices:
        first:
          - option: wwn-srd:partials.expert
        second:
          - option: wwn-srd:partials.mage
            choices:
              tradition:
                - option: high-mage
