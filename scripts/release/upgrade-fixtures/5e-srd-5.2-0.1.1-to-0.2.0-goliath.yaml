# A 0.1.1 stone giant goliath fighter who spent two Giant Ancestry uses and is in Large Form: the
# species copy's state. 0.2.0 keeps them on the Giant Ancestry and Large Form traits' grant state,
# and Stone's Endurance has one use left (proficiency bonus 3).
pack: 5e-srd-5.2
from: 0.1.1
to: 0.2.0
expect:
  - at: /features/2/grants
    value:
      5e-srd-5.2:traits.giant-ancestry: { state: { giantAncestryUsed: 2 } }
      5e-srd-5.2:traits.large-form: { state: { largeFormUsed: true, largeFormActive: true } }
  - { at: /features/2/state, absent: true }
values:
  5e-srd-5.2:origins.giantAncestryLeft: 1
  5e-srd-5.2:creature.size: large
character:
  specVersion: 0.1.0
  id: upgrade-5e52-goliath
  features:
    - id: class
      item: 5e-srd-5.2:classes.fighter
      state:
        level: 5
        startingClass: true
      choices:
        skills:
          - option: skill.acrobatics
          - option: skill.animal-handling
        5e-srd-5.2:features.fighter.fighting-style/style:
          - option: 5e-srd-5.2:feats.defense
        5e-srd-5.2:features.fighter.weapon-mastery/weapons:
          - option: 5e-srd-5.2:weapons.greatsword
          - option: 5e-srd-5.2:weapons.flail
          - option: 5e-srd-5.2:weapons.javelin
          - option: 5e-srd-5.2:weapons.longsword
        subclass:
          - option: 5e-srd-5.2:subclasses.champion
        5e-srd-5.2:features.fighter.ability-score-improvement/feat-4:
          - option: 5e-srd-5.2:feats.ability-score-improvement
            choices:
              increase:
                - option: plus-two
                  choices:
                    ability:
                      - option: str
    - id: background
      item: 5e-srd-5.2:backgrounds.soldier
      choices:
        ability-increase:
          - option: two-and-one
            choices:
              plus-two:
                - option: str
              plus-one:
                - option: dex
        gaming-set:
          - option: 5e-srd-5.2:tools.dice
        languages:
          - option: 5e-srd-5.2:languages.common-sign-language
          - option: 5e-srd-5.2:languages.draconic
    - id: species
      item: 5e-srd-5.2:species.goliath
      state: { giantAncestryUsed: 2, largeFormUsed: true, largeFormActive: true }
      choices:
        lineage:
          - option: 5e-srd-5.2:lineages.stone-giant
  values:
    5e-srd-5.2:abilities.str.base: 15
    5e-srd-5.2:abilities.dex.base: 14
    5e-srd-5.2:abilities.con.base: 13
    5e-srd-5.2:abilities.int.base: 8
    5e-srd-5.2:abilities.wis.base: 10
    5e-srd-5.2:abilities.cha.base: 12
    5e-srd-5.2:coins.gp: 718
    5e-srd-5.2:hp.base: 34
    5e-srd-5.2:xp.current: 6500
    5e-srd-5.2:hp.current: 30
  inventory:
    - id: armor-chain-mail-1
      item: 5e-srd-5.2:armor.chain-mail
      equipped: true
    - id: weapons-greatsword-1
      item: 5e-srd-5.2:weapons.greatsword
      equipped: true
    - id: weapons-flail-1
      item: 5e-srd-5.2:weapons.flail
      equipped: true
    - id: weapons-javelin-1
      item: 5e-srd-5.2:weapons.javelin
      equipped: true
      quantity: 8
    - id: gear-dungeoneers-pack-1
      item: 5e-srd-5.2:gear.dungeoneers-pack
    - id: weapons-spear-1
      item: 5e-srd-5.2:weapons.spear
      equipped: true
    - id: weapons-shortbow-1
      item: 5e-srd-5.2:weapons.shortbow
      equipped: true
    - id: gear-arrows-1
      item: 5e-srd-5.2:gear.arrows
      quantity: 20
    - id: gear-healers-kit-1
      item: 5e-srd-5.2:gear.healers-kit
    - id: gear-quiver-1
      item: 5e-srd-5.2:gear.quiver
    - id: gear-travelers-clothes-1
      item: 5e-srd-5.2:gear.travelers-clothes
    - id: tools-dice-1
      item: 5e-srd-5.2:tools.dice
    - id: trinkets-divination-card-1
      item: 5e-srd-5.2:trinkets.divination-card
