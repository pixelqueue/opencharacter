# A 0.3.0 lich: the monster item granted its traits and actions, and Frightening Gaze's spent use
# was saved as grant state. 0.4.0 copies the stat block: each granted trait and action becomes a
# copy right after the monster, in grant order, keeping its state; Spellcasting is a trait now and
# still grants its spells. Legendary Resistance was a copy already and stays as it was.
pack: 5e-srd-5.1
from: 0.3.0
to: 0.4.0
expect:
  - { at: /features/0/item, value: 5e-srd-5.1:monsters.lich }
  - { at: /features/0/grants, absent: true }
  - { at: /features/1/item, value: 5e-srd-5.1:monsters.lich.rejuvenation }
  - { at: /features/2/id, value: monsters-lich-spellcasting-1 }
  - { at: /features/2/item, value: 5e-srd-5.1:monsters.lich.spellcasting }
  - { at: /features/7/item, value: 5e-srd-5.1:monsters.lich.frightening-gaze }
  - { at: /features/7/state, value: { usesLeft: 0 } }
  - { at: /features/8/item, value: 5e-srd-5.1:monsters.lich.disrupt-life }
  - { at: /features/9/id, value: legendary-resistance }
  - { at: /features/9/state, value: { usesLeft: 2 } }
  - { at: /features/10, absent: true }
values:
  5e-srd-5.1:spellcasting.monster.dc: 20
  5e-srd-5.1:spellcasting.monster.attack: 12
  5e-srd-5.1:spellSlots.level9.max: 1
character:
  specVersion: 0.3.0
  id: upgrade-5e-lich
  values:
    5e-srd-5.1:abilities.str.base: 11
    5e-srd-5.1:abilities.dex.base: 16
    5e-srd-5.1:abilities.con.base: 16
    5e-srd-5.1:abilities.int.base: 20
    5e-srd-5.1:abilities.wis.base: 14
    5e-srd-5.1:abilities.cha.base: 16
    5e-srd-5.1:challenge.rating: 21
    5e-srd-5.1:creature.type: undead
    5e-srd-5.1:creature.alignment: any-evil
    5e-srd-5.1:combat.speed: 30
    5e-srd-5.1:hp.base: 135
    5e-srd-5.1:hp.current: 135
  features:
    - id: monster
      item: 5e-srd-5.1:monsters.lich
      grants:
        5e-srd-5.1:monsters.lich.frightening-gaze: { state: { usesLeft: 0 } }
    - id: legendary-resistance
      item: 5e-srd-5.1:monsters.lich.legendary-resistance
      state: { usesLeft: 2 }
