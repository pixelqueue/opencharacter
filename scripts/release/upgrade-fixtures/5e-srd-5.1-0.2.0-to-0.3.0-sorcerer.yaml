# A 0.2.0 sorcerer with Empowered and Quickened Spell and a red dragon ancestor, inline options
# then. 0.3.0 picks them as metamagic and draconic ancestry content.
pack: 5e-srd-5.1
from: 0.2.0
to: 0.3.0
expect:
  - at: /features/0/choices/sorcerous-origin/0/choices/5e-srd-5.1:features.sorcerer.dragon-ancestor~1dragon
    value: [{ option: 5e-srd-5.1:draconic-ancestries.red }]
  - at: /features/0/choices/5e-srd-5.1:features.sorcerer.metamagic~1options
    value:
      - { option: 5e-srd-5.1:metamagic.empowered-spell }
      - { option: 5e-srd-5.1:metamagic.quickened-spell }
character:
  specVersion: 0.1.0
  id: upgrade-5e-empowered-spell
  values:
    5e-srd-5.1:abilities.str.base: 10
    5e-srd-5.1:abilities.dex.base: 12
    5e-srd-5.1:abilities.con.base: 12
    5e-srd-5.1:abilities.int.base: 10
    5e-srd-5.1:abilities.wis.base: 12
    5e-srd-5.1:abilities.cha.base: 10
    5e-srd-5.1:hp.base: 40
    5e-srd-5.1:hp.current: 40
  features:
    - id: sorcerer
      item: 5e-srd-5.1:classes.sorcerer
      state: { level: 6, startingClass: true }
      choices:
        skills: [{ option: skill.arcana }, { option: skill.persuasion }]
        sorcerous-origin:
          - option: 5e-srd-5.1:subclasses.draconic-bloodline
            choices:
              5e-srd-5.1:features.sorcerer.dragon-ancestor/dragon: [{ option: red }]
        5e-srd-5.1:features.sorcerer.spellcasting/cantrips:
          [
            { option: 5e-srd-5.1:spells.fire-bolt },
            { option: 5e-srd-5.1:spells.light },
            { option: 5e-srd-5.1:spells.mage-hand },
            { option: 5e-srd-5.1:spells.prestidigitation },
            { option: 5e-srd-5.1:spells.ray-of-frost },
          ]
        5e-srd-5.1:features.sorcerer.metamagic/options:
          [{ option: empowered-spell }, { option: quickened-spell }]
        5e-srd-5.1:features.ability-score-improvement/improvement-4:
          [
            {
              option: 5e-srd-5.1:improvements.plus-one,
              choices: { abilities: [{ option: con }, { option: dex }] },
            },
          ]
