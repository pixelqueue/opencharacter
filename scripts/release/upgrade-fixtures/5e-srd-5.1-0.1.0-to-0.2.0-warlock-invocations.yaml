# A 0.1.0 12th-level warlock who used each of six once-per-rest invocations: the uses were the
# class copy's state. 0.2.0 keeps each as its invocation pick's `used`.
pack: 5e-srd-5.1
from: 0.1.0
to: 0.2.0
expect:
  - { at: /features/0/state, value: { level: 12, startingClass: true } }
  - at: /features/0/choices/5e-srd-5.1:features.warlock.eldritch-invocations~1invocations
    value:
      - { option: 5e-srd-5.1:invocations.bewitching-whispers, state: { used: true } }
      - { option: 5e-srd-5.1:invocations.dreadful-word, state: { used: true } }
      - { option: 5e-srd-5.1:invocations.minions-of-chaos, state: { used: true } }
      - { option: 5e-srd-5.1:invocations.mire-the-mind, state: { used: true } }
      - { option: 5e-srd-5.1:invocations.sculptor-of-flesh, state: { used: true } }
      - { option: 5e-srd-5.1:invocations.thief-of-five-fates, state: { used: true } }
character:
  specVersion: 0.1.0
  id: upgrade-5e-warlock-invocations
  values:
    5e-srd-5.1:abilities.str.base: 8
    5e-srd-5.1:abilities.dex.base: 14
    5e-srd-5.1:abilities.con.base: 14
    5e-srd-5.1:abilities.int.base: 10
    5e-srd-5.1:abilities.wis.base: 12
    5e-srd-5.1:abilities.cha.base: 20
    5e-srd-5.1:hp.base: 75
    5e-srd-5.1:hp.current: 75
  features:
    - id: warlock
      item: 5e-srd-5.1:classes.warlock
      state:
        level: 12
        startingClass: true
        bewitchingWhispersUsed: true
        dreadfulWordUsed: true
        minionsOfChaosUsed: true
        mireTheMindUsed: true
        sculptorOfFleshUsed: true
        thiefOfFiveFatesUsed: true
      choices:
        5e-srd-5.1:features.warlock.eldritch-invocations/invocations:
          - option: 5e-srd-5.1:invocations.bewitching-whispers
          - option: 5e-srd-5.1:invocations.dreadful-word
          - option: 5e-srd-5.1:invocations.minions-of-chaos
          - option: 5e-srd-5.1:invocations.mire-the-mind
          - option: 5e-srd-5.1:invocations.sculptor-of-flesh
          - option: 5e-srd-5.1:invocations.thief-of-five-fates
