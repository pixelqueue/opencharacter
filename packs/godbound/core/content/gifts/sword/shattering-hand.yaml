id: gifts.sword.shattering-hand
type: gift
fields:
  word: words.sword
  degree: greater
  activation: on-turn
  commit: active
prerequisites:
  - id: word
    when: '@words.sword in words.bound'
effects:
  - target: damage.melee.maximize
    op: atLeast
    value: 1
    when: self.committed > 0
  - target: fray.maximize
    op: atLeast
    value: 1
    when: self.committed > 0
