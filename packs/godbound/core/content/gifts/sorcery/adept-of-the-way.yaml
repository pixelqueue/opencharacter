id: gifts.sorcery.adept-of-the-way
type: gift
fields:
  word: words.sorcery
  degree: greater
  activation: constant
  requires: gifts.sorcery.adept-of-the-gate
prerequisites:
  - id: adept
    when: countCopies(copy.item == @gifts.sorcery.adept-of-the-gate) > 0
  - id: word
    when: '@words.sorcery in words.bound'
choices:
  - id: invocations
    pick: 3
    from:
      type: invocation
      where: item.tier == 'way'
    recommend: options[0]
