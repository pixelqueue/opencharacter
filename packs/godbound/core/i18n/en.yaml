creation.guided.name: Create a hero
creation.guided.description: 'Roll or assign the attributes, choose three Words, spend six points on gifts, then choose armor and a weapon.'
creation.random.name: Random hero
creation.random.description: 'Roll the attributes in order and draw the Words, the gifts, the armor and the weapon.'

constraints.creation-words: A new hero is bound to three Words
constraints.effort-limit: More Effort is committed than the hero has
constraints.influence-limit: More Influence is committed than the hero has
constraints.gift-points: More gift points are spent than the hero has
constraints.effort-of-the-word: Effort of the Word can be taken once for each bound Word
constraints.influence-of-the-word: Influence of the Word can be taken once for each bound Word
constraints.gift-once: This gift can be learned only once
constraints.prepared-spells: No more than two prepared spells per level
constraints.spontaneous-spells: No more spontaneous spells than the level allows before an hour's respite

