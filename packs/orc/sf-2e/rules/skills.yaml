    nameFrom: skills.lore.custom1.subject
  skills.lore.custom2.subject: { type: string, input: true, default: '' }
  skills.lore.custom2.increases:
    type: integer
    input: true
    default: 0
    min: 0
    max: >-
      'skill.lore.custom2' in skills.trained || 'skill.lore.custom2' in skills.chosen
        ? skills.maxRank - 1 : 0
    tags:
      - skill-increase
      - lore
      - formula: "'skill.lore.custom2' in skills.trained || 'skill.lore.custom2' in skills.chosen ? [] : ['untrained']"
    nameFrom: skills.lore.custom2.subject
  skills.lore.custom2.trainedByIncrease:
    {
      type: integer,
      input: true,
      default: 0,
      min: 0,
      max: 1,
      tags: [skill-increase, skill-training, skill.lore.custom2, lore],
      nameFrom: skills.lore.custom2.subject,
    }
  skills.lore.custom2.granted:
    { type: integer, formula: 0, min: 0, tags: [skill-granted, skill.lore.custom2] }
  skills.lore.custom2.rank:
    type: integer
    tags: [skill-rank, lore, skill.lore.custom2]
    formula: >-
      min(4, ('skill.lore.custom2' in skills.trained || 'skill.lore.custom2' in skills.chosen ? 1 : 0) + skills.lore.custom2.increases + skills.lore.custom2.granted)
    nameFrom: skills.lore.custom2.subject
  skills.lore.custom2.mod:
    type: integer
    tags:
      - check
      - skill
      - skill.lore.custom2
      - attr.int
      - lore
      - formula: >-
          skills.lore.custom2.rank == 0 ? ['untrained']
            : [['rank.trained', 'rank.expert', 'rank.master', 'rank.legendary'][min(4, skills.lore.custom2.rank) - 1]]
    formula: >-
