  - skill.lore.custom3
fields:
  # What a choice of any skill offers (class trainings, Skill Training) and of any Lore: an
  # add-on's Lore grants its tag into both.
  skills.offered:
    type: set
    of: tag
    members: { under: [skill], except: [skill.lore] }
    formula: >-
      ['skill.acrobatics', 'skill.arcana', 'skill.athletics', 'skill.computers',
        'skill.crafting', 'skill.deception', 'skill.diplomacy', 'skill.intimidation',
        'skill.medicine', 'skill.nature', 'skill.occultism', 'skill.performance',
        'skill.piloting', 'skill.religion', 'skill.society', 'skill.stealth', 'skill.survival',
        'skill.thievery', 'skill.lore.academia', 'skill.lore.alcohol', 'skill.lore.animal',
        'skill.lore.art', 'skill.lore.augmentation', 'skill.lore.business', 'skill.lore.cooking',
        'skill.lore.corporate', 'skill.lore.games', 'skill.lore.genealogy', 'skill.lore.history',
        'skill.lore.hyperspace', 'skill.lore.infosphere', 'skill.lore.labor', 'skill.lore.legal',
        'skill.lore.life-science', 'skill.lore.media', 'skill.lore.mining',
        'skill.lore.physical-science', 'skill.lore.piracy', 'skill.lore.plant',
        'skill.lore.sports', 'skill.lore.underworld', 'skill.lore.vidgame', 'skill.lore.warfare']
  skills.lores:
    type: set
    of: tag
    members: { under: [skill.lore] }
    formula: >-
      ['skill.lore.academia', 'skill.lore.alcohol', 'skill.lore.android', 'skill.lore.animal',
        'skill.lore.art', 'skill.lore.augmentation', 'skill.lore.barathu', 'skill.lore.borai',
        'skill.lore.business', 'skill.lore.cooking', 'skill.lore.corporate', 'skill.lore.games',
        'skill.lore.genealogy', 'skill.lore.history', 'skill.lore.hyperspace',
        'skill.lore.infosphere', 'skill.lore.kasatha', 'skill.lore.labor', 'skill.lore.lashunta',
        'skill.lore.legal', 'skill.lore.life-science', 'skill.lore.media', 'skill.lore.mining',
        'skill.lore.pahtra', 'skill.lore.physical-science', 'skill.lore.piracy',
        'skill.lore.plant', 'skill.lore.prismeni', 'skill.lore.shirren',
        'skill.lore.skittermander', 'skill.lore.sports', 'skill.lore.underworld',
        'skill.lore.vesk', 'skill.lore.vidgame', 'skill.lore.warfare', 'skill.lore.ysoki']
  skills.trained: { type: set, of: tag, members: { under: [skill], except: [skill.lore] } }
  skills.trainings: { type: integer, formula: 0 }
  skills.chosen: { type: set, of: tag, members: { under: [skill], except: [skill.lore] } }
  skills.acrobatics.increases:
    type: integer
    input: true
    default: 0
    min: 0
    max: >-
      'skill.acrobatics' in skills.trained || 'skill.acrobatics' in skills.chosen
        ? skills.maxRank - 1 : 0
    tags:
      - skill-increase
      - formula: "'skill.acrobatics' in skills.trained || 'skill.acrobatics' in skills.chosen ? [] : ['untrained']"
  skills.acrobatics.trainedByIncrease:
    {
      type: integer,
      input: true,
      default: 0,
      min: 0,
      max: 1,
      tags: [skill-increase, skill-training, skill.acrobatics],
    }
  skills.acrobatics.granted:
    { type: integer, formula: 0, min: 0, tags: [skill-granted, skill.acrobatics] }
  skills.acrobatics.rank:
    type: integer
    tags: [skill-rank, skill.acrobatics]
    formula: >-
      min(4, ('skill.acrobatics' in skills.trained || 'skill.acrobatics' in skills.chosen ? 1 : 0) + skills.acrobatics.increases + skills.acrobatics.granted)
  skills.acrobatics.mod:
    type: integer
    tags:
      - check
      - skill
      - skill.acrobatics
      - attr.dex
      - formula: >-
          skills.acrobatics.rank == 0 ? ['untrained']
            : [['rank.trained', 'rank.expert', 'rank.master', 'rank.legendary'][min(4, skills.acrobatics.rank) - 1]]
    formula: >-
      attributes.dex.mod + (skills.acrobatics.rank > 0 ? 2 * skills.acrobatics.rank + proficiency.level : proficiency.untrained)
