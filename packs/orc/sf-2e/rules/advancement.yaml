fields:
  xp.current: { type: integer, input: true, default: 0, min: 0 }
  skills.increasesPerLevel: { type: integer, formula: 'level >= 3 && level % 2 == 1 ? 1 : 0' }

followUps:
  - id: level-up
    while: xp.current >= 1000 && level < 20
    action: level-up

actions:
  - id: level-up
    tags: [level-up]
    available: '!character.creating && level < 20'
    steps:
      - id: gain
        tags: [level-up.gain]
        kind: changes
        changes:
          - { type: adjust, field: level, by: 1 }
          - { type: adjust, field: xp.current, by: -1000, when: xp.current >= 1000 }
      - id: increase
        kind: allocate
        sheet: proposed
        when: skills.increasesPerLevel > 0
        fields:
          type: field
          where: >-
            'skill-increase' in item.tags && !('untrained' in item.tags)
              && (!('skill-training' in item.tags)
                || countList(item.tags, x in skills.trained || x in skills.chosen) == 0)
        budget: skills.increasesPerLevel
      - id: order
        kind: branch
        cases:
          - when: true
            flags:
              order: >-
                ['orc-sf-2e:boosts.' + class.keyAttribute, @boosts.con, @boosts.dex, @boosts.wis,
                  @boosts.str, @boosts.int, @boosts.cha]
      # What the new level brings: a boost goes to the key attribute, then Constitution, Dexterity,
      # Wisdom, Strength, Intelligence and Charisma (as creation's); any other pick to the first
      # eligible option.
      - id: picks
        kind: choice
        options: { pending: {} }
        recommend: >-
          'standard' in options ? 'standard'
            : countList(options, x in flags.order) > 0
              ? flags.order[minList(options, indexOf(flags.order, x), x in flags.order)]
              : options[0]

display:
  fields:
    skills.increasesPerLevel: { hidden: true }
