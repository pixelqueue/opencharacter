tags:
  - sense.limited-telepathy
  - sense.shortwave
  - damage.precision

fields:
  speed.swim.base: { type: integer, formula: 0, min: 0 }
  speed.swim: { type: integer, formula: speed.swim.base, min: 0, tags: [speed] }

situational:
  - { id: againstForcedMovement, type: boolean, default: false, rolls: [save] }
  - { id: againstUndead, type: boolean, default: false, rolls: [save] }
  - { id: naturalEnvironment, type: boolean, default: false, rolls: [skill] }
  - { id: telepathicContact, type: boolean, default: false, rolls: [skill-action.sense-motive] }

display:
  fields:
    speed.swim: { groups: [summary], priority: 2, unit: ft, showWhen: speed.swim > 0 }
    speed.swim.base: { hidden: true }
