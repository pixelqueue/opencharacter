  - spell
  - spell-attack
  - spell-dc
  - damage.spell
  - damage.critical
  - tradition.arcane
  - tradition.divine
  - tradition.occult
  - tradition.primal
  - rest
  - spell-cost
  - healing
  - trait.uncommon
  - trait.cantrip
  - trait.focus
  - trait.attack
  - trait.auditory
  - trait.visual
  - trait.linguistic
  - trait.olfactory
  - trait.illusion
  - trait.detection
  - trait.prediction
  - trait.revelation
  - trait.scrying
  - trait.summon
  - trait.curse
  - trait.disease
  - trait.poison
  - trait.healing
  - trait.death
  - trait.sleep
  - trait.light
  - trait.darkness
  - trait.subtle
  - trait.aura
  - trait.move
  - trait.extradimensional
  - trait.misfortune
  - trait.sanctified
  - trait.holy
  - trait.unholy
  - trait.acid
  - trait.cold
  - trait.electricity
  - trait.fire
  - trait.force
  - trait.sonic
  - trait.spirit
  - trait.vitality
  - trait.void
  - trait.air
  - trait.earth
  - trait.water
  - trait.wood
