conditions.blinded.description: "You can't see. Perception checks that need sight critically fail; with vision as your only precise sense, –4 status penalty to Perception. Overrides dazzled."
conditions.blinded.name: Blinded
conditions.clumsy.description: 'Status penalty equal to the value to Dexterity-based rolls and DCs, including AC, Reflex saves and ranged attack rolls.'
conditions.clumsy.name: Clumsy
conditions.concealed.description: "You're hard to see: a creature targeting you must succeed at a DC 5 flat check."
conditions.concealed.name: Concealed
conditions.confused.description: "You're off-guard, you don't treat anyone as an ally, and you can't Delay, Ready or use reactions; you attack randomly."
conditions.confused.name: Confused
conditions.controlled.description: Another creature decides your actions.
conditions.controlled.name: Controlled
conditions.dazzled.description: 'Everything is concealed to you: targeting anything needs a DC 5 flat check.'
conditions.dazzled.name: Dazzled
conditions.deafened.description: "You can't hear: auditory Perception checks critically fail, and –2 status penalty to Perception checks."
conditions.deafened.name: Deafened
conditions.doomed.description: "You die at a lower dying value: 4 less your doomed value. It drops by 1 after a full night's rest."
conditions.doomed.name: Doomed
conditions.drained.description: 'Status penalty equal to the value to Constitution-based rolls and DCs (Fortitude), and you lose Hit Points equal to your level times the value, as does your maximum.'
conditions.drained.name: Drained
conditions.dying.description: "You're unconscious and near death. At the start of your turn, make a recovery check (a flat check, DC 10 + the value). You die at dying 4 (less doomed)."
conditions.dying.name: Dying
conditions.encumbered.description: "You're carrying too much: clumsy 1 and a –10-foot penalty to all your Speeds."
conditions.encumbered.name: Encumbered
conditions.enfeebled.description: 'Status penalty equal to the value to Strength-based rolls and DCs: Strength-based attack and damage rolls and Athletics checks.'
conditions.enfeebled.name: Enfeebled
conditions.fascinated.description: "–2 status penalty to Perception and skill checks, and you can't use concentrate actions unrelated to the subject."
conditions.fascinated.name: Fascinated
conditions.fatigued.description: "–1 status penalty to AC and saving throws, and you can't use exploration activities while traveling."
conditions.fatigued.name: Fatigued
conditions.fleeing.description: You must spend your actions trying to escape.
conditions.fleeing.name: Fleeing
conditions.frightened.description: Status penalty equal to the value to all your checks and DCs. It drops by 1 at the end of each of your turns.
conditions.frightened.name: Frightened
conditions.grabbed.description: "You're held in place: off-guard and immobilized."
conditions.grabbed.name: Grabbed
conditions.hidden.description: "A creature knows where you are but can't see you: it must succeed at a DC 11 flat check to target you."
conditions.hidden.name: Hidden
conditions.immobilized.description: "You can't use any action with the move trait."
conditions.immobilized.name: Immobilized
conditions.invisible.description: "You can't be seen: you're undetected to everyone (hidden once found)."
conditions.invisible.name: Invisible
conditions.off-guard.description: –2 circumstance penalty to AC.
conditions.off-guard.name: Off-Guard
conditions.paralyzed.description: "You can't act: off-guard, and you can only Recall Knowledge and use mental actions."
conditions.paralyzed.name: Paralyzed
conditions.persistent-damage.actions.take-persistent-damage.name: Take persistent damage
conditions.persistent-damage.description: 'You take the damage at the end of each of your turns, then attempt a DC 15 flat check to end it.'
conditions.persistent-damage.name: Persistent Damage
conditions.petrified.description: "You've been turned to stone and can't act or sense anything."
conditions.petrified.name: Petrified
conditions.prone.description: "You're lying on the ground: off-guard and –2 circumstance penalty to attack rolls."
conditions.prone.name: Prone
conditions.quickened.description: 'You gain 1 extra action at the start of each turn, usable only as the effect that quickened you allows.'
conditions.quickened.name: Quickened
conditions.restrained.description: "You're tied up or pinned: off-guard and immobilized, and you can't use attack or manipulate actions except to escape."
conditions.restrained.name: Restrained
conditions.sickened.actions.retch.name: Retch
conditions.sickened.actions.retch.params.dc.name: DC
conditions.sickened.description: "Status penalty equal to the value to all checks and DCs, and you can't willingly ingest anything. Retch to try to lower it."
conditions.sickened.name: Sickened
conditions.slowed.description: You regain that many fewer actions at the start of each turn.
conditions.slowed.name: Slowed
conditions.stunned.description: 'You lose that many actions at the start of your turn, and the value drops by the actions lost.'
conditions.stunned.name: Stunned
conditions.stupefied.description: 'Status penalty equal to the value to Intelligence-, Wisdom- and Charisma-based checks and DCs, including Will saves and Perception.'
conditions.stupefied.name: Stupefied
conditions.unconscious.description: "You can't act: –4 status penalty to AC, Perception and Reflex saves, and you're blinded and off-guard."
conditions.unconscious.name: Unconscious
conditions.wounded.description: 'Whenever you gain the dying condition, its value rises by your wounded value.'
conditions.wounded.name: Wounded

