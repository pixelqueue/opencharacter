classes.solarian.name: Solarian
classes.solarian.description: 'A warrior who channels the power of stars into a solar flare, nimbus and weapon, cycling between photon and graviton. Key attribute: Strength or Dexterity. 10 Hit Points plus Constitution per level. Expert in Perception, Reflex and Will; trained in Fortitude, simple and martial weapons, unarmed attacks, light and medium armor, unarmored defense and the solarian class DC. Trained in Athletics and 4 more skills plus Intelligence.'
