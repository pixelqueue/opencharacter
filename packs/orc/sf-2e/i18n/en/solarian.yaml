features.solarian.stellar-attunement.name: Stellar Attunement
features.solarian.stellar-attunement.description: "You're graviton-attuned, photon-attuned or unattuned; many abilities change with your attunement, and some switch it. Attune (1 action, once per round, or free when you roll initiative): become photon- or graviton-attuned and manifest any dormant manifestations you have hands for."
