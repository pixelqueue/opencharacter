features.solarian.stellar-resilience.name: Stellar Resilience
features.solarian.stellar-resilience.description: Your Fortitude proficiency becomes expert. A success on a Fortitude or Will save against a mental or incapacitation effect lets you Attune as a free action.
features.solarian.solar-weapon-expertise.name: Solar Weapon Expertise
features.solarian.solar-weapon-expertise.description: 'Your proficiency with simple and martial weapons and unarmed attacks becomes expert, and you gain the critical specialization effects of your solar flare and solar weapon.'
features.solarian.stellar-senses.name: Stellar Senses
features.solarian.stellar-senses.description: 'Your Perception proficiency becomes master, and you gain a +2 circumstance bonus to initiative rolls (+3 with Incredible Initiative).'
features.solarian.weapon-specialization.name: Weapon Specialization
features.solarian.weapon-specialization.description: "You deal 2 more damage with weapons and unarmed attacks you're an expert with, 3 if you're a master and 4 if legendary."
