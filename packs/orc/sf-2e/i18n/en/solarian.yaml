features.solarian.dedication-solar-weapon.name: Solar Weapon (archetype)
features.solarian.dedication-solar-weapon.description: "You can manifest a solar weapon with the attuned and solarian traits; it can't take additional traits and gains no benefit from your attunement."
features.solarian.dedication-solar-flare.name: Solar Flare (archetype)
features.solarian.dedication-solar-flare.description: 'You can create and maintain a solar flare, without your Strength modifier to its damage or any benefit from your attunement.'
