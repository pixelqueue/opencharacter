classes.solarian.choices.key-attribute.options.dex.name: Dexterity
feats.solarian.binaric-assault.description: Two actions. Make two Strikes against the same target, one with your solar weapon and one with your solar flare, in either order, each using your current multiple attack penalty. After the first Strike that hits, resolve its damage and effects, then swap your current attunement. If both Strikes miss, you become unattuned. This counts as two attacks for your multiple attack penalty.
feats.solarian.hampering-flare.description: Single action. Make a ranged Strike with your solar flare. On a hit, the target is off-guard until the start of your next turn or until it Takes Cover, whichever comes first.
feats.solarian.meditative-analysis.description: Single action. Attempt a check to Recall Knowledge about a creature. On a success, you gain a +1 circumstance bonus to your next Strike with a solar weapon against it this round, and if that Strike hits, you choose which attunement benefit you gain from it. The creature is then immune to Meditative Analysis for 1 day.
feats.solarian.solar-shield.description: |-
  You manifest a small shield of stellar energy that orbits you. It has the attuned and solarian traits and needs no hand. You can Raise a Shield with it for a +1 circumstance bonus to AC until the start of your next turn. You gain the Shield Block general feat.

  While the shield is raised, you can use Shield Block with it. It has Hit Points equal to 5 plus twice your level and Hardness equal to half your level (rounded up). It can't be broken, but if destroyed, you can't manifest a new one for 10 minutes. If it vanishes because you lose attunement, it returns with its previous Hit Points when you Attune. It regains all its Hit Points during your daily preparations and whenever you rest for at least 10 minutes, even if destroyed.

  **Graviton-Attuned** If your shield is destroyed, it releases a shock wave. Adjacent enemies must succeed at a Fortitude save against your class DC or be suppressed for 1 round (2 rounds on a critical failure).

  **Photon-Attuned** If your shield is destroyed, it releases a flash of light. Adjacent enemies must succeed at a Fortitude save against your class DC or be dazzled for 1 round (blinded for 1 round on a critical failure).
feats.solarian.stellar-rush.description: |-
  Two actions. Stride twice, gaining a +10-foot circumstance bonus to your Speed for these moves.

  **Graviton-Attuned** When you finish, enemies within 15 feet of you attempt a Fortitude save against your class DC. On a failure, they're pulled directly toward you, ending in an adjacent square if possible, in an order you choose.

  **Photon-Attuned** When you finish, you create a photon field in a 15-foot burst centered on you. Until the start of your next turn, creatures outside the field are concealed to creatures inside it.
feats.solarian.twin-weapons.description: You have a second solar weapon. When you take this feat or Re-Forge Solar Weapon, choose its traits separately from the first; it can have a different damage type, traits and weapon group. Add the agile and twin traits to the weapon traits you can apply to your solar weapons.
feats.solarian.distant-flare.description: The range increment of your solar flare increases by 15 feet.
feats.solarian.eclipse-strike.description: |-
  Single action. Make a Strike with your solar weapon or solar flare. On a hit, you raise the level of cover you have against your foe by one step until the start of your next turn: lesser cover becomes standard cover, or standard cover becomes greater cover against creatures at least one size larger than you.

  **Graviton-Attuned** For the duration, if you have no cover against an attack targeting you, you gain lesser cover against it.

  **Photon-Attuned** For the duration, if the target you struck provides you cover against an enemy's attack, that enemy takes a -1 circumstance penalty to its attack roll.
feats.solarian.mutable-manifestation.description: When you Attune, you can change the damage type of your solar weapon (not its traits or weapon group), as if you'd Re-Forged Solar Weapon.
feats.solarian.shattering-impact.description: |-
  Two actions. Strike with your solar weapon, dealing one additional weapon damage die. The weapon shatters and must be manifested again to use it.

  **Graviton-Attuned** On a hit, the target takes a -10-foot status penalty to Speed until the start of your next turn.

  **Photon-Attuned** On a hit, you also deal persistent fire damage equal to half your level, rounded up.
feats.solarian.solar-rampart.description: You're trained in heavy armor. Whenever you gain a class feature that grants expert or greater proficiency in medium armor, you gain that proficiency in heavy armor too. You treat armor you wear of 2 Bulk or higher as 1 Bulk lighter (minimum 1 Bulk).
feats.solarian.black-hole.description: |-
  Two actions. Frequency: once per 10 minutes. Requirement: you're graviton-attuned. Choose any number of creatures within 30 feet. Each takes 2d8 bludgeoning damage and attempts a Fortitude save against your class DC.

  **Critical Success** Unaffected.

  **Success** Half damage, and the creature is pulled 5 feet toward you.

  **Failure** Full damage, pulled 15 feet toward you, and off-guard against the next melee attack you attempt against it before the end of your current turn.

  **Critical Failure** Double damage, pulled 30 feet toward you, and knocked prone.

  **Level (+2)** The damage increases by 1d8.
feats.solarian.cosmic-infusion.description: |-
  When you deal fire damage or persistent fire damage from being photon-attuned, you can instead deal vitality damage or persistent vitality damage, which harms creatures with void healing, such as undead.

  While graviton-attuned, your solar weapon Strikes make the target count all squares within 10 feet as difficult terrain, not just adjacent squares.
feats.solarian.nimbus-ward.description: |-
  Reaction or single action. Trigger: you would take damage from an attack, spell or other effect. Requirement: you're aware of the effect and not off-guard. You gain resistance equal to half your level (rounded up) until the start of your next turn, choosing the type by your attunement.

  You can use this as a reaction only when the trigger and requirements are met, or as a 1-action activity without them.

  **Graviton-Attuned** Choose bludgeoning, force, piercing or slashing.

  **Photon-Attuned** Choose acid, cold, electricity, fire or sonic.
feats.solarian.plasma-ejection.description: |-
  Two actions. You hit every creature in a 10-foot emanation or a 30-foot line (your choice). Each takes 3d6 fire damage with a basic Reflex save against your class DC. A creature that critically fails also takes 1d8 persistent electricity damage.

  **Graviton-Attuned** A creature that fails its save is knocked prone.

  **Photon-Attuned** The fire damage dice become d8s.

  **Level (+2)** The damage increases by 1d6 (1d8 if you're photon-attuned).
feats.solarian.supernova.description: |-
  Two actions. Frequency: once per 10 minutes. Requirement: you're photon-attuned. Choose a 15-foot or 30-foot emanation. Each creature in it takes 4d8 fire damage (4d6 for the 30-foot option) and attempts a Reflex save against your class DC.

  **Critical Success** Unaffected.

  **Success** Half damage, and dazzled for 1 round.

  **Failure** Full damage, and blinded for 1 round.

  **Critical Failure** Double damage, and blinded for 1 minute.

  **Level (+1)** The damage increases by 1d8 (1d6 for the 30-foot option).
feats.solarian.constellation-vortex.description: |-
  Single action. You manifest a copy of your solar weapon that circles you in a vortex. A creature that starts its turn adjacent to you takes damage of the amount and type of your solar weapon's weapon damage, with a basic Reflex save against your class DC. If you already have a vortex active when you use this, you add another weapon to it instead, up to 3 at a time; each added weapon increases the vortex's damage by 1. You can Sustain the vortex for up to 1 minute.

  When the vortex ends, it shatters, dealing damage equal to your level plus 1 per weapon in the vortex to all adjacent creatures, of the same type as your solar weapon.

  **Graviton-Attuned** The vortex's damage increases by 2 per weapon (including the first).

  **Photon-Attuned** Add 1 fire damage per weapon (including the first).

  **Level (+3)** The damage from each additional weapon increases by 2, and the extra damage from your attunement effect increases by 1.
feats.solarian.corona.description: |-
  Two actions. You unleash a corona of stellar energy in a 10-foot emanation lasting until the end of your next turn. You can Sustain it for up to 1 minute. If your attunement changes, the corona's attunement effect changes to match. While graviton-attuned it has the darkness trait; while photon-attuned it has the light trait.

  **Graviton-Attuned** The corona is darkness that light can't penetrate, acting as a darkness spell with a spell rank equal to half your level.

  **Photon-Attuned** The corona sheds bright light in the area and dim light for the next 20 feet. Within the bright light, invisible creatures become concealed, and creatures already concealed are no longer concealed.
feats.solarian.nimbus-block.description: When you Shield Block a melee attack with your solar shield, as long as you or the shield take damage from the attack, you can use Nimbus Ward as a free action.
feats.solarian.solar-barrage.description: Two actions. Make three solar flare Strikes against different targets, each with a -2 circumstance penalty. They count toward your multiple attack penalty, but the penalty doesn't increase until after all of them.
feats.solarian.star-brand.description: "Single action. Requirement: your last action was a successful solar flare or solar weapon Strike against a creature. You brand the creature. Against it, your solar flare's range increment increases by 60 feet. If it's or later becomes invisible, it's concealed instead; if it was already concealed for another reason, it's no longer concealed. The brand lasts 10 minutes, ending immediately if the creature is slain or you Star Brand a different creature."
feats.solarian.defy-gravity.description: While graviton-attuned, you gain a fly Speed equal to your Speed.
feats.solarian.flicker-strike.description: |-
  Two actions. Make a Strike with your solar weapon. On a hit, you teleport up to your Speed to an unoccupied square within reach of a different creature and immediately make a solar weapon Strike against it. If the first Strike fails, you don't teleport and the action ends.

  **Graviton-Attuned** The teleport range doubles.

  **Photon-Attuned** If a Strike in this action is a critical success, the target is dazzled until the end of its next turn.
feats.solarian.mindward-shield.description: When you Raise your solar shield, you gain its circumstance bonus to Will saves. While it's raised, you can also Shield Block when you take damage from a failed Will save; if you do, that damage bypasses your solar shield's object immunities.
feats.solarian.momentum.description: |-
  Single action. Requirement: your last action was a successful solar weapon Strike. Step twice.

  **Graviton-Attuned** Each Step moves you 10 feet instead of 5.

  **Photon-Attuned** You leave an afterimage in the square you started in. It lasts until the end of your next turn, ending early if another creature enters its space. It counts as an ally to you and your allies for flanking.
feats.solarian.propulsive-shield.description: |-
  When you make a solar flare Strike while your solar shield is raised, the flare's range increment increases by 10 feet and its damage increases by 1 per weapon damage die.

  **Graviton-Attuned** The additional damage is bludgeoning. You gain a +2 circumstance bonus to the Trip attempt on a critical success.

  **Photon-Attuned** The additional damage is fire. The persistent fire damage on a critical success increases to 1d8.
feats.solarian.solar-wind.description: While photon-attuned, you gain a +10-foot circumstance bonus to Speed and, each time you Stride, can move through the space of one unwilling creature.
feats.solarian.careful-strike.description: |-
  Single action. Make a Strike with your solar flare or solar weapon, with this added failure effect.

  **Failure** The attack deals damage equal to your Strength modifier. It doesn't count as a hit and triggers no other special abilities.
feats.solarian.clinging-flare.description: Single action. Make a solar flare Strike. On a hit, the target is immobilized until the end of its next turn or until it Escapes (against your class DC), whichever comes first. On a critical hit, it's also off-guard while immobilized.
feats.solarian.soul-furnace.description: "Single action. Frequency: once per affliction every 24 hours. Choose a disease or poison afflicting you and lose Hit Points equal to its level. Attempt a new saving throw against it as though at the end of its listed interval. If you fail or critically fail, its stage doesn't increase."
feats.solarian.twin-guard.description: "Reaction. Trigger: a creature within your reach critically hits you with a melee Strike while you're wielding two solar weapons. You gain resistance equal to your level against the triggering attack. One of your solar weapons shatters and is no longer manifested."
feats.solarian.ascended-stability.description: "Reaction. Trigger: you would cycle or become unattuned. You don't, and remain in your current attunement state."
feats.solarian.covering-flare.description: Two actions. Stride twice; at any point during the movement, you can make a solar flare Strike. On a hit, the target is also suppressed until the end of its next turn.
feats.solarian.wormhole.description: |-
  Two actions. Frequency: once per hour. Create two wormholes in unoccupied squares in line of effect within 100 feet, visible to you and at least 15 feet apart. A creature entering a wormhole's space emerges in an unoccupied space of its choice adjacent to the other wormhole. A non-flying creature treats spaces lacking solid ground as occupied. If there's no valid space, both wormholes collapse and the creature stays where it entered. They last 1 round, but you can Sustain them for up to 1 minute. Your attunement when you take this action determines its attuned effects.

  **Graviton-Attuned** A creature that begins its turn adjacent to a wormhole must succeed at a Fortitude save against your class DC or be pulled into it.

  **Photon-Attuned** A creature entering a wormhole becomes concealed until the start of its next turn.
feats.solarian.big-bang.description: |-
  Three actions. Frequency: once per hour. Requirement: you're photon-attuned. You unleash scouring cosmic fire dealing 10d6 fire damage to all creatures in a 30-foot emanation; it overcomes even magical defenses. You and any number of adjacent allies are unaffected. Affected creatures attempt a Reflex save against your class DC.

  **Critical Success** Unaffected.

  **Success** Half damage.

  **Failure** Full damage and 2d6 persistent fire damage.

  **Critical Failure** Double damage and 4d6 persistent fire damage, and you can attempt to counteract a spell on the creature, using half your level (rounded up) as the counteract rank.

  **Level (+1)** The damage increases by 1d6.
feats.solarian.singularity.description: |-
  Three actions. Frequency: once per hour. Requirement: you're graviton-attuned. You manifest the pinpoint center of a black hole in a single 5-foot space within 60 feet. Creatures in that space take 10d8 void damage with a basic Reflex save against your class DC. A creature reduced to 0 Hit Points by this is torn asunder and pulled in, leaving no remains. Until the end of your next turn, light can't pass through the singularity's space and all adjacent squares, shrouding them in darkness that even darkvision and greater darkvision can't see through. A creature that starts its turn in the darkness must succeed at a basic Fortitude save against your class DC or be slowed 1 for that turn.

  **Level (+2)** The damage increases by 2d8.
feats.solarian.stellar-shield-collapse.description: |-
  Free action. Trigger: your solar shield is destroyed while raised. Requirement: you haven't used Black Hole or Supernova in the last 10 minutes.

  **Graviton-Attuned** Immediately use Black Hole as a free action (if you have that feat).

  **Photon-Attuned** Immediately use Supernova as a free action (if you have that feat).
feats.solarian.unstable-flare.description: |-
  Two actions. Make a solar flare Strike with a -2 circumstance penalty against each enemy in a 15-foot burst centered on any point within your solar flare's first range increment. Each attack counts toward your multiple attack penalty, but the penalty doesn't increase until you've made all of them.

  **Graviton-Attuned** Immediately before or after the attacks, you can Stride up to half your Speed once as a free action.

  **Photon-Attuned** You're concealed to each target of this attack until the start of your next turn.
feats.solarian.attuned-blow.description: When you Attune as a single action, you can make a Strike with your solar flare or solar weapon as a free action.
feats.solarian.harmonic-convergence.description: When you use an action with the disharmony trait, you gain temporary Hit Points equal to half your level until the start of your next turn.
feats.solarian.attuned-wards.description: |-
  Creatures that hit you with an attack suffer consequences based on your attunement.

  **Graviton-Attuned** The creature is clumsy 1 and off-guard for 1 round, or clumsy 2 if this is the second time it hit you this turn.

  **Photon-Attuned** The creature takes persistent fire damage equal to half your level.
feats.solarian.homing-mote.description: The range increment of your solar flare triples. When you make a solar flare Strike against a target within the first range increment, you ignore its concealment and cover.
feats.solarian.cosmic-alignment.description: You're permanently quickened. You can use the extra action only to Attune or to make a Strike with your solar flare or solar weapon.
feats.solarian.perfectly-attuned.description: If you would become graviton- or photon-attuned, you become perfectly-attuned instead. While perfectly-attuned, you choose which attunement bonus (graviton or photon) you benefit from whenever you use an ability, and for abilities requiring a specific attunement, being perfectly-attuned counts as your choice of graviton- or photon-attuned.
