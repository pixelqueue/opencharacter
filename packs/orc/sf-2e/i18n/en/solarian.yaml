features.solarian.solarian-expertise.description: Your solarian class DC proficiency becomes expert.
features.solarian.stellar-partition.name: Stellar Partition
features.solarian.stellar-partition.description: 'Your Will proficiency becomes master, and a success on a Will save against a mental or incapacitation effect is a critical success.'
features.solarian.armor-expertise.name: Armor Expertise
features.solarian.armor-expertise.description: Your proficiency with light and medium armor and unarmored defense becomes expert.
features.solarian.solarian-weapon-mastery.name: Solarian Weapon Mastery
features.solarian.solarian-weapon-mastery.description: Your proficiency with simple and martial weapons and unarmed attacks becomes master.
features.solarian.gravitas.name: Gravitas
features.solarian.gravitas.description: 'Your Reflex proficiency becomes master, and a success on a Reflex save is a critical success.'
features.solarian.greater-weapon-specialization.name: Greater Weapon Specialization
features.solarian.greater-weapon-specialization.description: 'Your weapon specialization damage becomes 4 with expert weapons, 6 with master and 8 with legendary.'
features.solarian.armor-mastery.name: Armor Mastery
