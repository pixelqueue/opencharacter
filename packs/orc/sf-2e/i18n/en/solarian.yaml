features.solarian.solar-manifestations.name: Solar Manifestations
features.solarian.solar-manifestations.description: "You maintain a solar flare, a solar nimbus and a solar weapon, which vanish while you're unattuned. Solar flare: a martial ranged brawling weapon that needs no hand, adds your Strength to damage; graviton 1d8 bludgeoning, range 15 feet (a critical hit lets you Trip as a free action); photon 1d6 fire, range 30 feet (a critical hit adds 1d6 persistent fire). Solar nimbus: the Nimbus Surge reaction, a melee Strike outside your multiple attack penalty against a creature that opens itself (a critical hit forces a Fortitude save against your class DC or enfeebled 1 while graviton, clumsy 1 while photon). Solar weapon: a martial melee weapon, 1d8 bludgeoning, piercing or slashing, with two traits of disarm, free-hand, grapple, nonlethal, parry, shove, sweep, trip and versatile (or reach or two-hand d10 alone) and a weapon group; graviton hits make the target's space difficult terrain for it, photon hits deal fire damage equal to half your level."
