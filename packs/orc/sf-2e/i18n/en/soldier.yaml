features.soldier.suppressing-fire.name: Suppressing Fire
features.soldier.suppressing-fire.description: 'Enemies in the area of your area attack (Area Fire or Auto-Fire) that fail their save are suppressed until the start of your next turn: a –1 circumstance penalty to attack rolls and a –10-foot status penalty to their Speeds.'
features.soldier.primary-target.name: Primary Target
features.soldier.primary-target.description: "Before an area attack, you can make a ranged Strike as a free action with the same weapon against one creature in the area (the closest to the burst's center, or to you for a cone or line); it doesn't count toward your multiple attack penalty. On a hit, that target's success against the area attack is a failure (name it as the attack's primary target)."
features.soldier.walking-armory.name: Walking Armory
features.soldier.walking-armory.description: "You can use Constitution in place of Strength for armor's Strength requirement; armor whose requirement you meet has 1 less Bulk (minimum 1). You can carry half your Constitution modifier (rounded up) more Bulk before being encumbered, and your Constitution modifier more at most."
features.soldier.fearsome-bulwark.name: Fearsome Bulwark
features.soldier.fearsome-bulwark.description: 'You can use Constitution instead of Charisma for Intimidation checks to Coerce or Demoralize, and instead of Strength for Athletics checks to Reposition or Shove.'
features.soldier.reflex-expertise.name: Reflex Expertise
features.soldier.reflex-expertise.description: Your Reflex proficiency becomes expert.
features.soldier.perception-expertise.name: Perception Expertise
features.soldier.perception-expertise.description: Your Perception proficiency becomes expert.
features.soldier.soldier-weapon-expertise.name: Soldier Weapon Expertise
features.soldier.soldier-weapon-expertise.description: 'Your proficiency with simple and martial weapons and unarmed attacks becomes expert, and you gain the critical specialization effects of area and automatic weapons.'
features.soldier.armor-expertise.name: Armor Expertise
features.soldier.armor-expertise.description: 'Your proficiency with light, medium and heavy armor and unarmored defense becomes expert, and you gain the specialization effects of medium and heavy armor.'
features.soldier.soldier-expertise.name: Soldier Expertise
features.soldier.soldier-expertise.description: Your soldier class DC proficiency becomes expert.
features.soldier.tough-as-nails.name: Tough as Nails
features.soldier.tough-as-nails.description: 'Your Fortitude proficiency becomes master, and a success on a Fortitude save is a critical success.'
features.soldier.weapon-specialization.name: Weapon Specialization
features.soldier.weapon-specialization.description: "You deal 2 more damage with weapons and unarmed attacks you're an expert with, 3 if you're a master and 4 if legendary."
features.soldier.soldiers-resolution.name: "Soldier's Resolution"
features.soldier.soldiers-resolution.description: 'Your Will proficiency becomes master, and a success on a Will save is a critical success.'
features.soldier.armor-mastery.name: Armor Mastery
features.soldier.armor-mastery.description: 'Your proficiency with light, medium and heavy armor and unarmored defense becomes master.'
features.soldier.soldier-weapon-mastery.name: Soldier Weapon Mastery
features.soldier.soldier-weapon-mastery.description: 'Your soldier class DC proficiency becomes master, and your proficiency with simple and martial weapons and unarmed attacks becomes master.'
features.soldier.unshakable-juggernaut.name: Unshakable Juggernaut
features.soldier.unshakable-juggernaut.description: 'Your Fortitude proficiency becomes legendary. A critical failure on a Fortitude save is a failure, and when you fail a Fortitude save against a damaging effect, you take half the damage.'
features.soldier.legendary-armor.name: Legendary Armor
features.soldier.legendary-armor.description: 'Your proficiency with light, medium and heavy armor and unarmored defense becomes legendary.'
features.soldier.legendary-soldier.name: Legendary Soldier
features.soldier.legendary-soldier.description: Your soldier class DC proficiency becomes legendary.
features.soldier.style.action-hero.name: Action Hero
features.soldier.style.action-hero.description: "A successful ranged Strike with an automatic weapon suppresses the target until the start of your next turn. Your Auto-Fire cone is the weapon's full range increment, and its primary target can be anywhere in the cone."
features.soldier.style.armor-storm.name: Armor Storm
features.soldier.style.armor-storm.description: "You can choose not to count as in the area of your own ranged weapon's attack. You gain resistance equal to half your level (minimum 1) to all damage from attacks by suppressed creatures. You don't need a free hand to Disarm, Grapple, Reposition, Shove or Trip; you gain a +1 status bonus to those checks against suppressed foes, and a success suppresses the target until the start of your next turn."
features.soldier.style.bombard.name: Bombard
features.soldier.style.bombard.description: "When you attack with an area weapon, half your Constitution modifier in allies in the area are unaffected. Enemies that succeed (but don't critically succeed) at their save against your area attack are still suppressed."
features.soldier.style.close-quarters.name: Close Quarters
features.soldier.style.close-quarters.description: "While wielding a two-handed melee weapon you meet soldier feats' requirement for an area weapon, and for them you can treat it as having area (burst 5 feet) centered on a corner of your space, unaffected yourself. You can make a melee Strike in place of a ranged Strike with Primary Target or a soldier feat. You gain the Whirling Swipe feat."
features.soldier.style.erudite-warrior.name: Erudite Warrior
features.soldier.style.erudite-warrior.description: "You're trained in Diplomacy or Society and one Lore; both become expert with armor expertise, master with armor mastery and legendary with legendary armor. You gain the Oppressive Presence action."
features.soldier.style.erudite-warrior.choices.skill.prompt: Diplomacy or Society
features.soldier.style.erudite-warrior.choices.lore.prompt: Lore skill
