effects.bring-it-on.name: 'Bring It On!'
effects.bring-it-on.description: 'A –2 circumstance penalty to AC and resistance to all damage equal to half your level, until the start of your next turn.'
classes.soldier.name: Soldier
classes.soldier.description: 'A master of area weapons, heavy armor and soaking damage, who suppresses foes with withering fire. Key attribute: Constitution. 10 Hit Points plus Constitution per level. Expert in Fortitude and Will; trained in Perception, Reflex, simple and martial weapons, unarmed attacks, all armor, unarmored defense and the soldier class DC. Trained in Intimidation and 3 more skills plus Intelligence.'
classes.soldier.choices.class-feat.prompt: 'Soldier feat (level {slot})'
classes.soldier.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.soldier.choices.skills.prompt: Trained skills (3 plus Intelligence)
classes.soldier.choices.fighting-style.prompt: Fighting style
feats.soldier.burst-of-strength.description: "Reaction. Frequency: once per hour. Trigger: you fail an Athletics check to Disarm, Grapple, Reposition, Shove or Trip. Reroll the triggering check; you must use the new result even if it's worse."
feats.soldier.pin-down.description: "Reaction. Trigger: a creature you're observing succeeds at its saving throw against your Area Fire or Auto-Fire attack. The target must succeed at a Will save against your class DC or become suppressed until the start of your next turn."
feats.soldier.quick-swap.description: "Reaction. Trigger: you're wielding a two-handed weapon and an enemy moves adjacent to you. You stow your current weapon and draw another two-handed weapon. If you have multiple sets of arms, you can instead Switch Hands."
feats.soldier.ready-reload.description: "Single action. Requirements: you're wielding a two-handed ranged weapon with reload 2 or more, and your last action was an attack that expended ammo from it. You Interact to reload the weapon twice. Unlike most Interact actions, you don't need a free hand."
feats.soldier.whirling-swipe.description: "Two actions. Requirement: you're wielding a two-handed melee weapon. Until the end of the turn, your weapon gains the area (burst 5 feet) and unwieldy traits; if it has reach, the burst radius becomes its reach. Area Fire with it, centering the burst on a corner of a square you occupy; you're excluded. With a backswing or sweep weapon, you gain a +1 circumstance bonus to the attack's save DC. If you have the primary target class feature, your primary target Strike is a melee Strike instead of a ranged one."
feats.soldier.menacing-laughter.description: Single action. Attempt an Intimidation check to Demoralize each suppressed creature within 30 feet.
feats.soldier.relentless-endurance.description: 'Reaction. Frequency: once per hour. Trigger: you take damage. You gain 1d8+4 temporary Hit Points for 1 minute. The amount increases by 1d8+4 at 6th level and every 4 levels thereafter.'
feats.soldier.shot-on-the-run.description: "Two actions. Requirement: you're wielding an area or automatic weapon. Stride up to your Speed, then Area Fire or Auto-Fire."
feats.soldier.youll-have-to-go-through-me.description: Two actions. You Area Fire or Auto-Fire. Until the start of your next turn or until you use a move action, whichever comes first, you gain the Living Shield reaction and, if a forced movement effect would move you, you move 10 feet less.
feats.soldier.collateral-witness.description: 'Reaction. Trigger: you reduce your primary target to 0 Hit Points using Auto-Fire. Demoralize a single creature that was in the area of your Auto-Fire, with a +2 circumstance bonus to the check. If you have legendary proficiency in Intimidation, or you have the action hero fighting style and the target is the enemy closest to you, you can use this as a free action with the same trigger.'
feats.soldier.overwhelming-assault.description: Your multiple attack penalty against suppressed targets is -4 (-3 with an agile weapon) on your second attack of the turn instead of -5, and -8 (-6 with an agile weapon) on your third and later attacks instead of -10.
feats.soldier.punishing-salvo.description: "Single action. Requirement: your last action this turn was an Area Fire attack. You make a follow-up Strike against your primary target with the same weapon, ignoring its unwieldy trait. This doesn't make a new area attack and counts as a Strike made using primary target."
feats.soldier.shoving-shot.description: |-
  Two actions. Requirement: you're wielding an area or automatic weapon. You Area Fire or Auto-Fire. Your primary target attempts a Fortitude save against your class DC.

  **Failure** The target is pushed back 10 feet (away from the burst's center if you used an area burst weapon).

  **Critical Failure** As failure, but the target is pushed 15 feet.
feats.soldier.widen-area.description: "Single action. Requirement: you're wielding an area or automatic weapon. If your next action is to Area Fire or Auto-Fire in a burst, cone or line, or to use Whirling Swipe, you increase the attack's area. Add 5 feet to the radius of a burst with a radius of at least 10 feet (smaller bursts are unaffected). Add 5 feet to the length of a cone or line of 15 feet or less, and 10 feet to a longer one."
feats.soldier.covering-fire.description: Single action or two actions. Make a ranged Strike against a target and select one ally within range of the same attack. If the Strike hits, it deals no damage, but the target becomes suppressed and takes a -2 circumstance penalty on attacks against your ally until the end of your next turn. As a 2-action activity, you can instead Area Fire or Auto-Fire, affecting targets that fail their save.
feats.soldier.fog-of-war.description: "Two actions. Requirement: you're wielding an area or automatic weapon. You Area Fire or Auto-Fire, leaving a cloud of smoke and dust in the area until the end of your next turn or until a strong wind disperses it. Creatures in the area are concealed, and all other creatures are concealed to them."
feats.soldier.ill-be-back.description: 'Free action. Frequency: once per day. Trigger: you regain consciousness after being unconscious. You Stand and Interact to draw a weapon or grab an unattended weapon.'
feats.soldier.intimidating-taunt.description: |-
  Single action. Attempt an Intimidation check against the Will DC of one enemy within 60 feet. This action has the auditory or visual trait, depending on how you taunt.

  **Critical Success** Until the start of your next turn, any hostile action the creature takes must include you as a target or in its area; otherwise it takes a -2 circumstance penalty to attack rolls and to its save DC for that action.

  **Success** As critical success, but only the first hostile action it takes is affected.

  **Failure** The creature is unaffected.
feats.soldier.offensive-defense.description: 'Two actions. Requirement: you have a force field upgrade in your armor or are holding a tech shield. You Area Fire using your force field or shield, dealing 2d10 bludgeoning damage in a 5-foot burst (excluding you) centered on a corner of a square you occupy. The attack has the tracking +1 trait and is in the shield weapon group. A creature that fails its save is pushed back 5 feet. If you have the primary target class feature, the primary target Strike uses the force field or shield. If it is superior or better, tracking increases to +2 (+3 if ultimate or better); if elite or better, damage increases to 3d10 (4d10 if paragon).'
feats.soldier.punitive-strike.description: "Reaction. Trigger: a creature within your reach uses a manipulate action, makes a ranged Strike, uses a move action, or leaves a square during a move action. Make a melee Strike against it, ignoring the unwieldy trait on your weapons. This Strike doesn't count toward your multiple attack penalty, and your penalty doesn't apply to it."
feats.soldier.ammo-hoarder.description: "Requirement: you're wielding an automatic weapon. Your Auto-Fire expends ammo equal to the number of targets in the area, instead of that number times 2."
feats.soldier.bring-it-on.description: "Single action. Requirement: you're wielding a two-handed weapon. Until the start of your next turn, you take a -2 circumstance penalty to AC and gain resistance to all damage equal to half your level. If you have the armor storm fighting style, the resistance is doubled against attacks from suppressed creatures."
feats.soldier.concentrated-shot.description: "Two actions. Requirement: you're wielding an automatic weapon. Make a ranged Strike with it, expending three times the ammo and gaining a +4 circumstance bonus to damage, increasing to +6 at 11th level and +8 at 15th."
feats.soldier.overwatch.description: "Reaction. Trigger: a suppressed creature within your weapon's first range increment makes a ranged attack or leaves a square during a move action. Make a ranged Strike against it, ignoring the unwieldy trait of your weapons. On a critical hit, if the triggering action was a move action, you disrupt it."
feats.soldier.run-hot.description: "Three actions. Requirement: you're wielding an area weapon. You Area Fire twice with it, ignoring its unwieldy trait. Creatures in the area of the second attack gain a +2 circumstance bonus to their save. Afterward the weapon must cool off and can't be used until after your next turn or until it takes any amount of cold damage."
feats.soldier.anchoring-impacts.description: When you suppress a target with an attack, the speed penalty of the suppressed condition becomes a -20-foot status penalty for its duration. If the effect that suppressed the target was a critical hit, or the target critically fails its save and becomes suppressed, it is also stunned 1.
feats.soldier.brutal-barrage.description: "Single action. Requirement: you're wielding an area or automatic weapon. If your next action is to Area Fire, Auto-Fire or Whirling Swipe, add two weapon damage dice for targets adjacent to the center of impact or within the first 10 feet of a cone or line."
feats.soldier.come-get-some.description: "Reaction. Frequency: once per day. Trigger: you're reduced to 0 Hit Points and would fall unconscious. Make a Strike with a -2 circumstance penalty, or an Area Fire or Auto-Fire attack ignoring the unwieldy trait and with the save DC decreased by 2. Afterward, you immediately fall unconscious and gain the dying condition."
feats.soldier.dance.description: When you suppress a target with an attack, it is also off-guard until the start of its turn. When you Auto-Fire in a cone that affects only a single target, that target takes a -1 circumstance penalty to Reflex saves against the attack.
feats.soldier.shell-shower.description: 'Free action. Frequency: once per round. After you make an Area Fire or Auto-Fire attack with a weapon, make any number of squares adjacent to you difficult terrain; a square that was already difficult terrain becomes greater difficult terrain. This terrain remains until cleared.'
feats.soldier.bullet-hell.description: "Two actions. Requirement: you're wielding an automatic or area (cone) weapon. Make an Area Fire or Auto-Fire attack. Until the start of your next turn, any creature moving through the attacked area takes 1d4 damage of the weapon's type per square traversed, with a basic Reflex save at the end of each move action it takes through the area. On a failure, it becomes suppressed until the start of your next turn."
feats.soldier.death-blossom.description: "Three actions. Requirement: you're wielding an area or automatic weapon with a full magazine. You Area Fire (even with an automatic weapon), affecting each creature in an emanation around you with a radius equal to the weapon's range, expending the entire magazine. Creatures in the area take a -1 circumstance penalty to Reflex saves against it. You don't designate a primary target."
feats.soldier.hammer-the-nail.description: Shoving Shot pushes creatures 5 feet on a success, 10 feet on a failure and 20 feet on a critical failure. On a critical failure the target is also knocked prone.
feats.soldier.load-bearing-hero.description: "Reaction. Trigger: you and one adjacent ally attempt a Reflex or Fortitude save against the same effect. Your save result becomes one degree worse, and your ally's becomes one degree better."
feats.soldier.rocket-jump.description: "Two actions. Requirement: you're wielding an area (burst) weapon. You Area Fire and then Leap, adding a status bonus to the distance traveled equal to double your weapon's burst. You must be within the attack's area, but you don't save against your own attack. Movement from this action doesn't trigger reactions, though Area Fire still does."
feats.soldier.fan-the-hammer.description: "Single action. Requirement: your last action this turn was an Area Fire or Auto-Fire. You Area Fire or Auto-Fire again, ignoring the weapon's unwieldy trait. You don't designate a primary target, and creatures you damage with this attack don't become suppressed."
feats.soldier.run-cowards.description: An enemy that critically fails a save against your Area Fire or Auto-Fire is fleeing for 1 round.
feats.soldier.scattering-fire.description: When you use Shoving Shot, all creatures in the area attempt the Fortitude save against forced movement, not just your primary target.
feats.soldier.terror-forming.description: "Two actions. Requirement: you're wielding an area or automatic weapon. You Area Fire or Auto-Fire without designating a primary target, and make each square in the area difficult terrain (greater difficult terrain if it already was). This terrain remains and can't be changed without extensive engineering or magic."
feats.soldier.vector-reflector.description: 'Reaction. Trigger: a suppressed creature damages you with a Strike. You gain resistance against the triggering damage equal to half your level (your level if you have the armor storm fighting style). If the creature is within reach, attempt an Athletics check to Shove it.'
feats.soldier.light-em-up.description: "Two actions. Requirement: you're wielding an area or automatic weapon. You Area Fire or Auto-Fire at an unseen enemy's general position. If the primary target is concealed, you needn't attempt a flat check to target it; if hidden, the flat check DC is 5. When you suppress a concealed creature with this attack, no flat check is needed to target it; if it's hidden, the DC is 5 and it can't become undetected. This lasts as long as the creature stays suppressed."
feats.soldier.overkill.description: When you suppress a creature with Area Fire or Auto-Fire and only one creature was in the area, or when you use Concentrated Shot, the target takes 1d10 persistent bleed damage, or 2d10 if you critically hit it with your primary target Strike.
feats.soldier.soldiers-training.description: Choose one soldier class feat you have that grants a reaction. At the start of your turn, you gain an additional reaction usable only for that feat or an action it grants. You can change the choice during daily preparations if the new feat meets the requirements.
feats.soldier.coordinated-fire.description: "Three actions. Requirement: you're wielding an area or automatic weapon. You Area Fire or Auto-Fire without selecting a primary target and give a verbal order: Reload, Strike or Take Cover. Every ally within 30 feet who hears and understands it can perform that action as a reaction."
feats.soldier.saints-grip.description: You can wield two-handed weapons in one hand.
feats.soldier.spread-the-love.description: "Two actions. Requirement: you're wielding an area or automatic weapon. You Area Fire or Auto-Fire, selecting two different primary targets instead of one."
feats.soldier.bullet-typhoon.description: You can use Area Fire or Auto-Fire as a single action. You can never make more than two such attacks in the same round.
feats.soldier.hybrid-technique.description: "Two actions. Requirement: you're wielding an area or automatic weapon. Choose two soldier feats that take 2 actions, require an area or automatic weapon, and include an Area Fire or Auto-Fire attack in their effects. You Area Fire or Auto-Fire once and apply the additional effects and benefits of both feats to the attack."
