classes.mystic.name: Mystic
classes.mystic.description: "A spellcaster bonded to a divine, occult or primal force of the cosmos, who heals allies through a vitality network. Key attribute: Wisdom. 6 Hit Points plus Constitution per level. Expert in Will; trained in Perception, Fortitude, Reflex, simple weapons, unarmed attacks, light armor, unarmored defense, the mystic class DC and spell attack modifier and DC. Trained in your connection's skill and 3 more skills plus Intelligence."
classes.mystic.choices.class-feat.prompt: 'Mystic feat (level {slot})'
classes.mystic.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.mystic.choices.skills.prompt: Trained skills (3 plus Intelligence)
classes.mystic.choices.connection.prompt: Connection
features.spellcasting.archetype-repertoire.name: Archetype spell repertoire
features.spellcasting.archetype-repertoire.description: 'The spells you know through a spellcasting archetype: its cantrips, and one spell for each of its spell slots, of its tradition.'
features.spellcasting.archetype-repertoire.choices.cantrips.prompt: Archetype repertoire cantrips
features.spellcasting.archetype-repertoire.choices.spells.prompt: 'Archetype repertoire spell (rank {slot})'
features.spellcasting.archetype-signature-spells.name: Archetype signature spells
features.spellcasting.archetype-signature-spells.description: 'Spells of your archetype repertoire you can cast heightened from any archetype slot at or above their rank: one from 6th level with the basic spellcasting benefits, a second with the expert benefits, a third with the master.'
features.spellcasting.archetype-signature-spells.choices.signature.prompt: Archetype signature spells
features.spellcasting.repertoire.name: Spell repertoire
features.spellcasting.repertoire.description: 'The spells you know and can cast spontaneously: your cantrips, and for each rank you have slots of as many spells as you have slots of that rank. A spell added at a higher rank than its own is known heightened to that rank.'
features.spellcasting.repertoire.choices.cantrips.prompt: Cantrips in your repertoire
features.spellcasting.repertoire.choices.spells.prompt: '{slot, selectordinal, one {#st} two {#nd} few {#rd} other {#th}}-rank spells in your repertoire'
features.spellcasting.signature-spells.name: Signature spells
features.spellcasting.signature-spells.description: 'For each spell rank you can cast, one spell in your repertoire is a signature spell: you can cast it heightened to any rank you have slots for, from its own up, without learning it at that rank.'
features.spellcasting.signature-spells.choices.signature.prompt: '{slot, selectordinal, one {#st} two {#nd} few {#rd} other {#th}}-rank signature spell'
feats.mystic.divine-bond.description: You become trained in the divine skill listed for your deity and add the listed cleric spells to your spell list and spell repertoire as signature spells. If you were already trained in that skill, you become trained in another skill of your choice. You become bound by your deity's anathema and can receive its divine sanctification.
feats.mystic.reach-spell.description: Single action. If the next action you use is to Cast a Spell that has a range, increase its range by 30 feet. A spell with a range of touch extends to 30 feet.
feats.mystic.widen-spell.description: Single action. If the next action you use is to Cast a Spell with a burst, cone or line area and no duration, increase its area. Add 5 feet to the radius of a burst with a radius of at least 10 feet (smaller bursts are unaffected). Add 5 feet to the length of a cone or line of 15 feet or less, and 10 feet to the length of a larger one.
feats.mystic.xenodruid-bond.description: |-
  You join a primal order of xenodruids with ties to nature and the biodiversity of the universe. Choose one order below. You become trained in the listed skill and add the listed spells to your spell list and spell repertoire as signature spells. If you were already trained in that skill, you become trained in another skill of your choice.

  - **Animal** Skill: Animal Lore. Spells: 1st pest form; 2nd animal form; 5th carcinization.
  - **Plant** Skill: Plant Lore. Spells: 1st summon plant or fungus; 2nd verdant code; 5th plant form.
  - **Viral** Skill: Genealogy Lore. Spells: 1st detect poison; 2nd instant virus; 5th toxic cloud.
feats.mystic.bond-boost.description: 'Reaction. Trigger: a bonded ally within 20 feet is about to roll a saving throw. The ally gains a +1 status bonus to the save. If they succeed on a save against a vitality or void effect, they get a critical success instead.'
feats.mystic.cantrip-expansion.description: Add two additional cantrips from your spell list to your repertoire.
feats.mystic.conceal-spell.description: Single action. If the next action you use is to Cast a Spell, it gains the subtle trait, hiding the runes, sparks and other manifestations that would give away your spellcasting. The trait hides only the casting actions and manifestations, not the effects, so an observer might still see a ray streak out or you vanish.
feats.mystic.eldritch-bond.description: You gain the eldritch bond epiphany spell.
feats.mystic.spot-healing.description: 'Reaction. Trigger: an adjacent bonded ally takes damage. You Transfer Vitality to the triggering ally.'
feats.mystic.wild-bond.description: You gain the wild bond epiphany spell.
feats.mystic.adaptive-defense.description: Single action. If the next action you use is to Cast a Spell that deals damage, whether or not it succeeds in dealing damage, you and one bonded ally gain resistance to that spell's damage type equal to its rank (minimum 1) until the end of your next turn. If it deals more than one type, choose one.
feats.mystic.cloud-storage.description: Your vitality network works as an extradimensional storage space, like a null space chamber. You can Interact to stow an item of 1 Bulk or less in it. A creature in your bond on the same plane can remove an item with an Interact action that takes 2 actions instead of 1. It has a capacity of 12 Bulk, increasing to 25 Bulk at 8th level, 50 Bulk at 12th level and 75 Bulk at 16th level.
feats.mystic.extended-vitality.description: You can Transfer Vitality to any bonded ally on the same planet as you, regardless of range.
feats.mystic.mental-interference.description: |-
  Single action. Attempt a skill check with your connection skill against the Will DC of a foe you can see within 30 feet. It's then immune to Mental Interference for 1 hour.

  **Critical Success** The target takes a -1 status penalty to attack rolls and a -2 status penalty to Will saves for 1 minute. The effect ends early if the target uses a single action with the concentrate trait to shake it off, or immediately after you target it with a hostile action.

  **Success** As a critical success, but the penalty to Will saves is -1.

  **Critical Failure** You become off-guard against the next attack the target attempts against you before the end of your next turn.
feats.mystic.waste-not.description: |-
  Single action. If the next action you use is to Cast a Spell that deals void damage to a living creature, your vitality network gains Hit Points equal to twice the spell's rank.

  **Special** You can use Waste Not without the spellshape trait. If you do and your next action is to Strike with a weapon that deals void damage, your vitality network gains 2 Hit Points per weapon damage die.
feats.mystic.network-shield.description: "Reaction. Trigger: you're hit by an attack. The attack reduces your vitality network's Hit Points instead of yours, up to twice your level. Any damage remaining after the network reaches 0 Hit Points is dealt to you."
feats.mystic.new-epiphany.description: You learn the initial epiphany spell of a connection that grants training in the prerequisite connection skill.
feats.mystic.radiant-bond.description: When you Transfer Vitality, you can select any number of bonded allies, though the total maximum Hit Points you can transfer doesn't increase.
feats.mystic.advanced-epiphany.description: You gain the advanced epiphany spell for your chosen connection.
feats.mystic.tripartite-mind.description: 'Reaction. Trigger: you would gain the confused, controlled, fleeing, frightened or stupefied condition. Attempt to counteract an effect of your choice imposing one of those conditions, using half your level (rounded up) as the counteract rank and your spell attack modifier as the counteract modifier.'
feats.mystic.data-bond.description: "You can speak with computers. Any construct creatures you summon are part of your bond and don't count against its maximum number of creatures. During your daily preparations, choose one of these spells: instant virus, mending, summon construct or summon robot. You add it to your spell repertoire and signature spells until your next daily preparations."
feats.mystic.greater-epiphany.description: You gain the greater epiphany spell for your chosen connection.
feats.mystic.life-bond.description: "You can speak with animals and plants. Any living creature you summon is part of your bond and doesn't count against its maximum number of creatures. During your daily preparations, choose one of these spells: summon animal, summon elemental, summon fey or summon plant or fungus. You add it to your spell repertoire and signature spells until your next daily preparations."
feats.mystic.quickened-casting.description: |-
  Free action. Frequency: once per day. If your next action is to cast a cantrip or a spell at least 2 ranks lower than your highest-rank spell slot, reduce the actions to cast it by 1 (minimum 1 action).

  **Special** This works only on a cantrip or spell from the class that gave you this feat.
feats.mystic.convert-elemental-essence.description: "Reaction. Trigger: an enemy targets a bonded creature with a Strike or spell attack roll that has an elemental trait and the roll fails or critically fails, or you roll a critical success on a save against a foe's harmful elemental spell. Your vitality network regains 2 Hit Points per rank of the triggering spell or 4 Hit Points per weapon die of the triggering Strike."
feats.mystic.convert-illumination.description: "Reaction. Trigger: an area within 60 feet has its light level reduced by magical darkness. Your vitality network regains Hit Points equal to the magical darkness's spell rank if the area was normally dim light, or double that if it was normally bright light. Even if the magical darkness ends, the area stays in nonmagical darkness for 1 minute; this removes light in the area but isn't magical darkness and is automatically overcome by any magical light."
feats.mystic.convert-information.description: Single action. Attempt a Recall Knowledge check against an enemy you're observing. On a success, in addition to the normal benefits, your vitality network regains 10 Hit Points; on a critical success, 20 Hit Points.
feats.mystic.convert-life-force.description: Single action. Sacrifice some of your own Hit Points; your vitality network regains Hit Points equal to the amount you sacrifice.
feats.mystic.convert-tempo.description: 'Single action to three actions. Frequency: once per minute. Stride a number of times equal to the actions you used. Your vitality network regains 10 Hit Points per Stride you took.'
feats.mystic.bond-spell.description: |-
  Reaction. Trigger: an ally within 30 feet Casts a Spell. Empower their spell in one of these ways:

  - If it deals damage or heals Hit Points and has no duration, it gains a status bonus to damage or healing equal to its rank.
  - If it has no spellshape effect applied, apply any one spellshape feat you know that can apply to it and that you're able to use (for example, accounting for limited uses per day).
feats.mystic.infused-spell.description: Single action. Pick a spell and reduce your vitality network's total by twice the spell's rank. If your next action is to cast that spell, one bonded ally you target with it becomes quickened until the end of your next turn and can use the extra action only for Strike and Stride actions.
feats.mystic.effortless-concentration.description: 'Free action. Trigger: your turn begins. You immediately gain the effects of a Sustain action for one of your active mystic spells.'
feats.mystic.syncretic-epiphany.description: You learn the advanced epiphany spell of the connection that grants training in the prerequisite connection skill.
feats.mystic.vitality-web.description: You learn the vitality web epiphany spell.
feats.mystic.network-attunement.description: Single action. Each ally can immediately choose to transfer up to 20 Hit Points from your vitality network into themselves, or up to 20 Hit Points from themselves into the network.
feats.mystic.realized-epiphany.description: 'Single action. Frequency: once per minute. If your next action is to cast an epiphany spell, you can expend 20 Hit Points from your vitality network to cast it instead of spending a Focus Point.'
feats.mystic.enlightenment.description: Your vitality network has a maximum capacity of 200 Hit Points and regains 20 Hit Points at the start of each turn instead of 8. You can bond with any number of willing creatures.
feats.mystic.transcended-existence.description: You gain an additional 10th-rank spell slot.
