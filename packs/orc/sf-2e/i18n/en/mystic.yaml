classes.mystic.connections.akashic.name: Akashic
classes.mystic.connections.akashic.description: 'You keep a permanent psychic link to the akashic record, the repository of all knowledge in the multiverse. Tradition: occult. Connection skill: Occultism. Initial epiphany: akashic fount; advanced: akashic assistant; greater: data drain. Harmony: When you Transfer Vitality, the target can at once Recall Knowledge as a reaction (this triggers nothing that Recall Knowledge would).'
classes.mystic.connections.akashic.perfectHarmony: 'You can open a door (1 minute) to an extradimensional memory palace that works as planar palace, with the same layout each time (adjustable during daily preparations); each phantasmal minion in it works as an akashic assistant.'
classes.mystic.connections.elemental.name: Elemental
classes.mystic.connections.elemental.description: "You channel the primordial elements that make up the universe. You gain the Shield Block general feat. Your wall of fire and absolute zero take the elemental trait and damage type of your active elemental weapon or elemental barrier. Tradition: primal. Connection skill: Nature. Initial epiphany: elemental weapon; advanced: elemental barrier; greater: elemental nova. Harmony: When you Transfer Vitality, choose an element (air, earth, fire, metal, water or wood; the one of your active elemental epiphanies, if any). Until the end of its next turn, the target's next Strike deals a damage type of that element instead: electricity or sonic (air), bludgeoning or piercing (earth), acid or slashing (metal), fire (fire), bludgeoning or cold (water), piercing or poison (wood)."
classes.mystic.connections.elemental.perfectHarmony: 'During daily preparations, choose an element as for your harmony: you gain resistance equal to half your level to both its damage types (and to cold, for fire). A bonded ally you heal with Transfer Vitality gains these resistances until the start of your next turn.'
templates.elemental.air.name: '{base} (air)'
templates.elemental.air.description: 'Your active elemental weapon or elemental barrier is air: the spell takes the air trait and its damage type.'
templates.elemental.earth.name: '{base} (earth)'
templates.elemental.earth.description: 'Your active elemental weapon or elemental barrier is earth: the spell takes the earth trait and its damage type.'
templates.elemental.fire.name: '{base} (fire)'
templates.elemental.fire.description: 'Your active elemental weapon or elemental barrier is fire: the spell takes the fire trait and its damage type.'
templates.elemental.metal.name: '{base} (metal)'
templates.elemental.metal.description: 'Your active elemental weapon or elemental barrier is metal: the spell takes the metal trait and its damage type.'
templates.elemental.water.name: '{base} (water)'
templates.elemental.water.description: 'Your active elemental weapon or elemental barrier is water: the spell takes the water trait and its damage type.'
templates.elemental.wood.name: '{base} (wood)'
templates.elemental.wood.description: 'Your active elemental weapon or elemental barrier is wood: the spell takes the wood trait and its damage type.'
classes.mystic.connections.healing.name: Healing
classes.mystic.connections.healing.description: "You're connected to the vitality and void energy that flow through all living things, healing allies and harming foes. Tradition: divine. Connection skill: Medicine. Initial epiphany: infusion; advanced: vitality nova; greater: vital rebirth. Harmony: When you Transfer Vitality, attempt to counteract one affliction on the target, or one effect giving it blinded, clumsy, dazzled, deafened, enfeebled or sickened."
classes.mystic.connections.healing.perfectHarmony: "Your harmony can also counteract doomed, drained, paralyzed and stunned; an effect you fail to counteract but would have at a counteract rank 2 lower is suppressed until the start of your next turn (its duration doesn't elapse meanwhile)."
classes.mystic.connections.rhythm.name: Rhythm
classes.mystic.connections.rhythm.description: 'You feel the song that moves the stars and channel its cosmic beat through rhythm and vibration. Tradition: primal. Connection skill: Performance. Initial epiphany: anthem; advanced: shuffle repeat; greater: remix. Harmony: When you Transfer Vitality, you can extend the duration of an active rhythm epiphany by 1 round.'
classes.mystic.connections.rhythm.perfectHarmony: 'The first time each round you Transfer Vitality, the healed target can Stride as a free action (traversal).'
classes.mystic.connections.shadow.name: Shadow
classes.mystic.connections.shadow.description: "Every shadow is a doorway to a realm of shadow, and you sculpt its substance into dreadful and wondrous shapes. Tradition: divine. Connection skill: Stealth. Initial epiphany: shadow snap; advanced: cloying shadows; greater: shadow prison. Harmony: When you Transfer Vitality, the target's shadow swells: bright light in a 10-foot emanation around it becomes dim light (magical darkness), and the target is concealed in it and can Hide, until the end of your next turn."
classes.mystic.connections.shadow.perfectHarmony: 'You gain Umbral Stride (1 action, once per round, while in dim light or darkness): teleport up to 30 feet to a spot in dim light or darkness you can see. A target of your Transfer Vitality can use it once before the end of its next turn.'
features.mystic.connection.name: Connection
features.mystic.connection.description: 'Your connection with a cosmic force sets your spell tradition, a trained skill, a spell of each rank added to your repertoire, your epiphany spells and your harmony, a benefit for creatures you heal with your vitality network.'
features.mystic.initial-epiphany.name: Initial Epiphany
features.mystic.initial-epiphany.description: "You learn your connection's initial epiphany spell, a focus spell, and gain a focus pool of 1 Focus Point. Refocus by spending 10 minutes with your bonded allies or pondering your connection."
features.mystic.mystic-bond.name: Mystic Bond
features.mystic.mystic-bond.description: "A 10-minute activity tied to your connection, adjacent to a willing creature, bonds it to you; you can bond up to 10 creatures besides yourself. You always know the general distance and direction to bonded creatures, their Hit Points and whether they're conscious, unconscious, dying or dead (not across planes)."
features.mystic.vitality-network.name: Vitality Network
features.mystic.vitality-network.description: "Your soul holds a network of healing energy with a capacity of 6 plus 4 Hit Points per level. Transfer Vitality (1 action, concentrate, healing): move up to 10 Hit Points (at least 1) from the network into yourself or a bonded creature you can sense within 60 feet (it works on void healing as if void); the amount rises by 10 at 5th, 10th, 15th and 20th level. At the start of each of your turns in combat the network regains 4 Hit Points (6 if you're a master in spell DC, 8 if legendary), and it refills when you Refocus."
features.mystic.vitality-network.actions.transfer-vitality.name: Transfer Vitality
features.mystic.vitality-network.actions.transfer-vitality.params.amount.name: Hit Points to transfer
features.mystic.vitality-network.actions.transfer-vitality.results.transferred.name: Transferred
features.mystic.group-chat.name: Group Chat
features.mystic.group-chat.description: "Bonded creatures can communicate telepathically within 120 feet and stay aware of one another's state, direction and distance while alive on the same plane. Network Spell (1 action, concentrate, spellshape): if your next action is to Cast a Spell with an area, range or targets, it manifests from a bonded ally's space (line of sight and effect from both of you)."
features.mystic.reflex-expertise.name: Reflex Expertise
features.mystic.reflex-expertise.description: Your Reflex proficiency becomes expert.
features.mystic.fortitude-expertise.name: Fortitude Expertise
features.mystic.fortitude-expertise.description: Your Fortitude proficiency becomes expert.
features.mystic.expert-spellcaster.name: Expert Spellcaster
features.mystic.expert-spellcaster.description: Your spell attack modifier and spell DC proficiency become expert.
features.mystic.resilient-soul.name: Resilient Soul
features.mystic.resilient-soul.description: 'Your Will proficiency becomes master, and a success on a Will save is a critical success.'
features.mystic.perception-expertise.name: Perception Expertise
features.mystic.perception-expertise.description: Your Perception proficiency becomes expert.
features.mystic.weapon-expertise.name: Weapon Expertise
features.mystic.weapon-expertise.description: Your proficiency with simple weapons and unarmed attacks becomes expert.
features.mystic.armor-expertise.name: Armor Expertise
features.mystic.armor-expertise.description: Your proficiency with light armor and unarmored defense becomes expert.
features.mystic.weapon-specialization.name: Weapon Specialization
features.mystic.weapon-specialization.description: "You deal 2 more damage with weapons and unarmed attacks you're an expert with, 3 if you're a master and 4 if legendary."
features.mystic.master-spellcaster.name: Master Spellcaster
features.mystic.master-spellcaster.description: Your spell attack modifier and spell DC proficiency become master.
features.mystic.legendary-spellcaster.name: Legendary Spellcaster
features.mystic.legendary-spellcaster.description: Your spell attack modifier and spell DC proficiency become legendary.
features.mystic.perfect-harmony.name: Perfect Harmony
features.mystic.perfect-harmony.description: "You learn your connection's perfect harmony."
features.mystic.transcendence.name: Transcendence
features.mystic.transcendence.description: "Add two common 10th-rank spells of your tradition to your repertoire and gain one 10th-rank spell slot; it can't be used by abilities that cast spells without slots or give more slots, and you don't gain more 10th-rank slots as you level (Transcended Existence gives a second)."
features.mystic.transcendence.choices.spell.prompt: Second 10th-rank spell
