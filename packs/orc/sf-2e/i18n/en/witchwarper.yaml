classes.witchwarper.paradoxes.analyst.name: Analyst
classes.witchwarper.paradoxes.analyst.description: 'A hidden code powers the universe and the realms beyond, and by focusing your intellect you can see its equations. Tradition: arcane. Paradox skill: Computers. Warp spells: initial warp probability, advanced alternate outcome, greater quantum analysis. Quantum field: When you Seek or Recall Knowledge, you can apply the result to two related creatures, hazards, unattended objects or effects in your quantum field. Each time you Sustain the field, you can Seek or Recall Knowledge against a target in it as a free action.'
classes.witchwarper.paradoxes.anomaly.name: Anomaly
classes.witchwarper.paradoxes.anomaly.description: "Your existence defies the normal parameters of this reality: something disrupted your being, or you crossed over from another reality or a twisted timeline. Tradition: arcane. Paradox skill: Deception. Warp spells: initial warp terrain, advanced warp world, greater parallel forms. Quantum field: Images of alternate iterations of your enemies flicker around them. An enemy in the field that uses a concentrate action must succeed at a DC 5 flat check or the action is disrupted; the first time a creature fails, it's immune for 24 hours."
classes.witchwarper.paradoxes.lost-history.name: Lost History
classes.witchwarper.paradoxes.lost-history.description: "The period of lost history shaped you, through long study or personal experience; perhaps you were born in it or lived through it thanks to a great lifespan, stasis technology or time travel. Tradition: occult. Paradox skill: Society. Warp spells: initial warp presence, advanced forget, greater reality wipe. Quantum field: Supernatural static hides you: you're concealed from creatures in your quantum field. A creature in it that hits you with an attack ends this benefit against it until the start of your next turn."
classes.witchwarper.paradoxes.precog.name: Precog
classes.witchwarper.paradoxes.precog.description: 'Some event unstuck you in time: you might come from the distant past, a far future or a forsaken timeline, and you can see and bend time as few others can. Tradition: occult. Paradox skill: Piloting. Warp spells: initial warp time, advanced accelerate, greater time loop. Quantum field: An enemy that uses a move action in your quantum field takes a -5-foot status penalty to its Speed for that action; you and your allies gain a +5-foot status bonus to Speed for move actions used in the field.'
