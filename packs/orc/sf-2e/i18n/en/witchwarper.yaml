classes.witchwarper.anchors.core-memories.name: Core Memories
classes.witchwarper.anchors.core-memories.description: "Precious memories keep you tethered to your own reality. Anchor benefit: during daily preparations, choose a skill you're trained in; you gain Assurance in it, and Automatic Knowledge too if you're an expert in it and it has Recall Knowledge. Anchoring effect: reduce your stupefied condition by 1 (once per round)."
classes.witchwarper.anchors.core-memories.actions.anchoring-effect.name: Anchoring effect (stupefied)
classes.witchwarper.anchors.core-memories.actions.anchoring-effect.results.anchored.name: Anchored
classes.witchwarper.anchors.focal-point.name: Focal Point
classes.witchwarper.anchors.focal-point.description: "Intense focus on one subject makes other things, even paradoxes, fade away. Anchor benefit: if a reaction would disrupt your spellcasting action, attempt a DC 15 flat check; on a success it isn't disrupted. Anchoring effect: reduce your clumsy condition by 1 and ignore the suppressed condition until the start of your next turn (once per round)."
classes.witchwarper.anchors.focal-point.actions.anchoring-effect.name: Anchoring effect (clumsy)
classes.witchwarper.anchors.focal-point.actions.anchoring-effect.results.anchored.name: Anchored
classes.witchwarper.anchors.tangible-object.name: Tangible Object
classes.witchwarper.anchors.tangible-object.description: "A small object you wear or hold grounds you in this reality. Anchor benefit: +1 circumstance bonus to Perception checks and Will saves against illusions and holograms. Anchoring effect: reduce your frightened condition by 1; if you aren't frightened, you instead gain a +1 circumstance bonus to Will saves against fear and +2 to your Will DC against Demoralize until the start of your next turn (once per round)."
classes.witchwarper.anchors.tangible-object.actions.anchoring-effect.name: Anchoring effect (frightened)
classes.witchwarper.anchors.tangible-object.actions.anchoring-effect.results.anchored.name: Anchored
features.witchwarper.paradox.name: Paradox
features.witchwarper.paradox.description: "Your existence runs against the status quo of the universe. Your paradox sets your spell tradition, a trained skill, a spell of each rank added to your repertoire, your warp spells (focus spells; you start with a focus pool of 1 Focus Point) and your quantum field's effect."
features.witchwarper.anchor.name: Anchor
features.witchwarper.anchor.description: 'Something keeps you anchored to reality: an object, memories or loved ones. Your anchor gives a benefit and an anchoring effect, which you gain when you use an action with the anchoring trait.'
features.witchwarper.quantum-field.name: Quantum Field
features.witchwarper.quantum-field.description: "Warp Reality (1 action, concentrate; requires your quantum field to be inactive): your quantum field, a 20-foot burst centered within 100 feet, activates until the end of your next turn or as long as you Sustain it (up to 10 minutes); Sustaining it lets you move it within 100 feet. While it's active you can use anchoring actions; you choose which creatures it affects. It ends if you're knocked out, Dismiss it or move more than 100 feet from it. Quantum Pulse (free action, when you roll initiative): you Warp Reality."
features.witchwarper.quantum-field.actions.warp-reality.name: Warp Reality
features.witchwarper.quantum-field.actions.warp-reality.results.warped.name: Warped
features.witchwarper.quantum-field.actions.dismiss-quantum-field.name: Dismiss quantum field
features.witchwarper.quantum-field.actions.dismiss-quantum-field.results.dismissed.name: Dismissed
features.witchwarper.isolated-spell-matrix.name: Isolated Spell Matrix
features.witchwarper.isolated-spell-matrix.description: "Isolated Spell Matrix (1 action, anchoring, spellshape): if your next action is to Cast a Spell with a range, its range becomes 100 feet, but it affects only targets in your quantum field and its area doesn't extend past the field."
features.witchwarper.reflex-expertise.name: Reflex Expertise
features.witchwarper.reflex-expertise.description: Your Reflex proficiency becomes expert.
features.witchwarper.expert-spellcaster.name: Expert Spellcaster
features.witchwarper.expert-spellcaster.description: 'Your class DC, spell attack modifier and spell DC proficiency become expert.'
features.witchwarper.magical-fortitude.name: Magical Fortitude
features.witchwarper.magical-fortitude.description: Your Fortitude proficiency becomes expert.
features.witchwarper.perception-expertise.name: Perception Expertise
features.witchwarper.perception-expertise.description: Your Perception proficiency becomes expert.
features.witchwarper.weapon-expertise.name: Weapon Expertise
features.witchwarper.weapon-expertise.description: Your proficiency with simple weapons and unarmed attacks becomes expert.
features.witchwarper.quantum-defenses.name: Quantum Defenses
features.witchwarper.quantum-defenses.description: Your proficiency with light armor and unarmored defense becomes expert.
features.witchwarper.weapon-specialization.name: Weapon Specialization
features.witchwarper.weapon-specialization.description: "You deal 2 more damage with weapons and unarmed attacks you're an expert with, 3 if you're a master and 4 if legendary."
features.witchwarper.master-spellcaster.name: Master Spellcaster
features.witchwarper.master-spellcaster.description: 'Your class DC, spell attack modifier and spell DC proficiency become master.'
features.witchwarper.quantum-will.name: Quantum Will
features.witchwarper.quantum-will.description: 'Your Will proficiency becomes master, and a success on a Will save is a critical success.'
features.witchwarper.legendary-spellcaster.name: Legendary Spellcaster
features.witchwarper.legendary-spellcaster.description: Your spell attack modifier and spell DC proficiency become legendary.
features.witchwarper.quantum-thesis.name: Quantum Thesis
features.witchwarper.quantum-thesis.description: "Add two common 10th-rank spells of your tradition to your repertoire and gain one 10th-rank spell slot; it can't be used by abilities that cast spells without slots or give more slots, and you don't gain more 10th-rank slots as you level (Quantum Research gives a second)."
features.witchwarper.quantum-thesis.choices.spell.prompt: Second 10th-rank spell
features.witchwarper.warped-infinities.name: Warped Infinities
features.witchwarper.warped-infinities.description: "Your quantum field's radius becomes 100 feet, and when you activate or Sustain it you can exclude any number of squares from it."
