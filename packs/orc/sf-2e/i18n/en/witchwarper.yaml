classes.witchwarper.name: Witchwarper
classes.witchwarper.description: "A spellcaster who warps reality by drawing on the possibilities of other universes and timelines. Key attribute: Charisma or Intelligence. 8 Hit Points plus Constitution per level. Expert in Will; trained in Perception, Fortitude, Reflex, simple weapons, unarmed attacks, light armor, unarmored defense, the witchwarper class DC and spell attack modifier and DC. Trained in your paradox's skill and 3 more skills plus Intelligence."
classes.witchwarper.choices.class-feat.prompt: 'Witchwarper feat (level {slot})'
classes.witchwarper.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.witchwarper.choices.skills.prompt: Trained skills (3 plus Intelligence)
classes.witchwarper.choices.key-attribute.prompt: Key attribute
classes.witchwarper.choices.key-attribute.options.cha.name: Charisma
classes.witchwarper.choices.key-attribute.options.int.name: Intelligence
classes.witchwarper.choices.paradox.prompt: Paradox
classes.witchwarper.choices.anchor.prompt: Anchor
feats.witchwarper.anchoring-strike.description: |-
  Single action. Requirement: your quantum field is active. Make a Strike with these added effects.

  **Critical Success** The Strike gains the anchoring trait. You can reroll its damage dice but must use the second result, even if it's worse.

  **Success** The Strike gains the anchoring trait.
feats.witchwarper.debris-zone.description: Single action. The area of your quantum field becomes difficult terrain.
feats.witchwarper.otherworldly-spell.description: Single action. If the next action you use is to Cast a Spell, creatures able to cast that spell don't automatically know what it is, and creatures that witness the casting take a -2 circumstance penalty to checks to identify it with Recall Knowledge and to checks to counteract it and its effects.
feats.witchwarper.soothing-anchor.description: 'Single action. Frequency: once every 10 minutes. Requirement: your last action was to Sustain your quantum field or had the anchoring trait. You gain temporary Hit Points equal to your character level for 1 round.'
feats.witchwarper.fundamental-understanding.description: "Reaction. Trigger: a creature, trap or similar object within your quantum field casts a spell not in your spell repertoire, and you're aware of the casting. If the spell is common and you're trained in the skill for its tradition, you automatically identify it (you still roll to try for a critical success but can't get worse than a success). You or a visible ally within 60 feet targeted by the spell gain a +1 circumstance bonus to the saving throw or AC against it (+2 if you rolled a critical success)."
feats.witchwarper.nonlethal-spell.description: Single action. If your next action is to Cast a Spell that deals damage and lacks the death or void trait, it gains the nonlethal trait.
feats.witchwarper.predictive-positioning.description: "Reaction. Trigger: an enemy damages you. Requirement: your quantum field is active. You teleport up to your Speed to a space within your quantum field. This movement doesn't trigger reactions based on movement and ignores hazards and terrain, but can't pass through walls or similar obstructions."
feats.witchwarper.scrub-psyche.description: "Reaction. Trigger: you or an ally fail a save against a mental effect while within your quantum field. The target rerolls the saving throw against the triggering effect and must use the second result, even if it's worse."
feats.witchwarper.warp-wounds.description: 'Reaction. Trigger: an enemy damages you. Requirement: an enemy or willing ally is in your quantum field. You gain resistance to all damage against the triggering attack equal to half your level, and one enemy or willing ally in your quantum field takes damage of the same type equal to the amount prevented, with a basic Fortitude save against your class DC.'
feats.witchwarper.meandering-mind.description: 'Single action. Requirement: your quantum field is active. You gain a +2 status bonus to saving throws against mental effects until the start of your next turn.'
feats.witchwarper.quantum-recycle.description: 'Reaction. Frequency: once per day. Trigger: you cast a 2nd-rank or higher spell that targets a creature or area within your quantum field. You regain an expended spell slot one rank lower than the triggering spell.'
feats.witchwarper.spellsurge-ammo.description: "Free action. Frequency: once per turn. Trigger: you cast a non-cantrip spell. Until the end of your turn, one weapon or grenade you're wielding deals extra force damage equal to the spell's rank and gains the magical trait if it lacked it. If the spell deals damage, the extra damage is of the same type as the spell."
feats.witchwarper.enlarge-quantum-field.description: Single action. Increase your quantum field's radius by 10 feet. Until the field deactivates, once per turn when you Sustain it, increase its radius by an additional 5 feet (to a maximum of 50 additional feet).
feats.witchwarper.predict-outcome.description: |-
  Frequency: once per hour. You spend 10 minutes peering across timelines or analyzing probability simulations, gaining the effects of augury, except you learn only about dangers ahead: results of "good" become "nothing" and "mixed" become "bad."

  If you're legendary in Arcana or Occultism, it takes only 1 minute.
feats.witchwarper.quantum-aura.description: Each time you use Warp Reality to activate your quantum field, you can make it an aura that moves with you. If you do, Warp Reality gains the aura trait and the field is a 10-foot-radius emanation.
feats.witchwarper.advanced-warp.description: You gain the advanced warp spell for your paradox.
feats.witchwarper.danger-zone.description: 'Single action. Your quantum field becomes hazardous terrain that deals 1 damage to an enemy each time it enters a square in the area. Choose the damage type when you use this: acid, bludgeoning, cold, electricity, fire, piercing, slashing or sonic. The damage increases by 1 at 12th, 16th and 20th level.'
feats.witchwarper.quantum-entanglement.description: Single action. Until the start of your next turn, any creature that begins its turn inside your quantum field must succeed at a Will save against your witchwarper class DC to move outside it; on a failure, the action is disrupted. A creature that succeeds is immune to Quantum Entanglement for 24 hours.
feats.witchwarper.greater-warp.description: You gain the greater warp spell for your paradox.
feats.witchwarper.share-quantum-aura.description: Single action. Your quantum field emanates from an ally you can see instead of from you. The ally gains all the benefits of the field, and your warp spells originate from the ally instead of you until the field deactivates. If you cast warp spells at other targets, you must still have line of sight to the target, but the spell originates from the ally for determining range and line of effect.
feats.witchwarper.twisted-dark-zone.description: Single action. The area of your quantum field functions as 2nd-rank darkness. Creatures that begin their turn in the area must succeed at a Will save against your class DC or become confused for 1 round (an incapacitation effect), then become immune for 24 hours. If the darkness is successfully counteracted, the field's other effects remain.
feats.witchwarper.in-another-life.description: During your daily preparations, select one ancestry feat for your ancestry that you meet the prerequisites for and don't already have. You gain it until your next daily preparations.
feats.witchwarper.radiant-zone.description: |-
  Single action. The area of your quantum field becomes bright light. Creatures that begin their turn in it attempt a Fortitude save against your class DC; creatures with light blindness treat their result as one step worse.

  **Success** Unaffected.

  **Failure** Dazzled for 1 round.

  **Critical Failure** Blinded for 1 round, then dazzled for 1 round.
feats.witchwarper.sense-abnormalities.description: You sense magic auras as though always under a 1st-rank detect magic spell, detecting only in your field of vision. When you Seek, you gain the benefits of a 3rd-rank detect magic on things you see, in addition to the normal benefits. You can turn this sense on or off with a free action at the start or end of your turn.
feats.witchwarper.borrow-spell.description: 'Free action. Frequency: once per day. Trigger: you use an action that Sustains your quantum field, and the field is still active. This turn, you can cast one spell from your repertoire without spending a spell slot.'
feats.witchwarper.multiverse-magic.description: You can have one spell in your spell repertoire (not from your paradox's spell list) that isn't from your spellcasting tradition. Select it when you take this feat. You can cast it as a spell of your tradition, and it becomes a signature spell. You can change the spell when you gain a level.
feats.witchwarper.persistent-quantum-field.description: Two actions. You Warp Reality with a duration of 1 minute.
feats.witchwarper.folded-paradoxes.description: During daily preparations, you can replace one of your paradox spells with a spell of another paradox that grants training in the prerequisite paradox skill.
feats.witchwarper.zone-overlap.description: 'Single action. Requirement: your quantum field is active with one zone affecting it. You overlay a second zone, either another zone you can create or the existing zone again with improved effects: Danger Zone deals 1 extra damage, Debris Zone becomes greater difficult terrain, and Twisted Dark Zone ignores the immunity of creatures that previously critically succeeded at the save for 1 round.'
feats.witchwarper.complete-transposition.description: When you use Sustain to move your quantum field, you can teleport any number of creatures within the field's original area to squares of your choice in its new area, along with items they wear or hold. This gives the Sustain action the teleportation trait. Each target can attempt a Will save against your class DC and is unaffected on a success.
feats.witchwarper.infinite-magic.description: Twice per day, you can cast a 9th-rank or lower spell after running out of spell slots of the appropriate rank; the two spells cast with this feat must be of different ranks.
feats.witchwarper.quantum-negation.description: You learn the quantum negation warp spell.
feats.witchwarper.quantum-research.description: You gain an additional 10th-rank spell slot.
