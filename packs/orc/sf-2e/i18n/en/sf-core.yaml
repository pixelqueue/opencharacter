actions.access-infosphere.name: Access Infosphere
actions.access-infosphere.description: 'Search a local network for information on a topic (usually 10 minutes), like Recalling Knowledge; a critical failure finds misleading information.'
actions.access-infosphere.params.dc.name: DC
actions.hack.name: Hack
actions.hack.description: 'With a hacking toolkit, access, control or change a secured system: a success is one success toward access (two on a critical success, leaving no trace); a critical failure triggers security or locks you out for an hour.'
actions.hack.params.dc.name: DC
actions.operate-device.name: Operate Device
actions.operate-device.description: 'Perform a task with a computer or similar device; a failure gives a –2 circumstance penalty to further attempts for a day, a critical failure locks you out for a day.'
actions.operate-device.params.dc.name: DC
actions.navigate.name: Navigate
actions.navigate.description: 'Plan a short journey on foot, by vehicle or in a star system: a success keeps you from getting lost, a critical success gives an excellent sense of where you are.'
actions.navigate.params.dc.name: DC
actions.plot-course.name: Plot Course
actions.plot-course.description: 'Chart a long journey through hyperspace: a critical success halves the travel time, a failure arrives late, a critical failure lands you in an unfamiliar system.'
actions.plot-course.params.dc.name: DC
actions.stunt.name: Stunt
actions.stunt.description: "1 action (manipulate, move, reckless): Drive and perform a stunt; its penalty applies to the stunt's Piloting checks."
actions.stunt.params.dc.name: DC
actions.stunt.steps.stunt.prompt: Stunt
actions.stunt.options.back-off.name: 'Back Off (–1): move half Speed backward'
actions.stunt.options.evade.name: 'Evade (–1): half Speed, +1 status bonus to AC'
actions.stunt.options.flip-and-burn.name: 'Flip and Burn (–1): half Speed, then turn'
actions.stunt.options.barrel-roll.name: 'Barrel Roll (–2): half Speed, +2 status bonus to AC'
actions.stunt.options.flyby.name: "Flyby (–2): half Speed through an enemy's square"
actions.stunt.options.drift.name: 'Drift (–2): half Speed sideways'
actions.stunt.options.turn-in-place.name: 'Turn in Place (–2): turn, then full Speed'
actions.take-cover.name: Take Cover
actions.take-cover.description: '1 action: standard cover becomes greater cover (+4 circumstance bonus to AC, Reflex saves against area effects and Stealth to Hide or Sneak); otherwise you gain standard cover (+2). It lasts until you move, attack or end it.'
actions.take-cover.params.standardCover.name: You already have standard cover
actions.take-cover.results.covered.name: Taking cover
actions.disable-a-device.steps.using.prompt: Skill
actions.disable-a-device.options.thievery.name: Thievery
actions.disable-a-device.options.computers.name: Computers
actions.disable-a-device.options.crafting.name: Crafting
effects.taking-cover.name: Taking cover
effects.taking-cover.description: 'A circumstance bonus to AC, Reflex saves against area effects, and Stealth checks to Hide and Sneak.'
conditions.suppressed.name: Suppressed
conditions.suppressed.description: A –1 circumstance penalty to attack rolls and a –10-foot status penalty to all your Speeds.
conditions.untethered.name: Untethered
conditions.untethered.description: "Floating without support in zero gravity: you can't take move actions that don't work there, drift 5 feet at the end of your turn, and are typically clumsy 1 and off-guard."
conditions.glitching.name: Glitching
conditions.glitching.description: 'A tech creature or item seizes up. At the start of each turn (or when using a glitching item), a DC 5 + value flat check: a critical success lowers the value by 1; a failure gives an item penalty equal to the value to all checks and DCs; a critical failure also stuns you 1 (an item fails to work).'
conditions.glitching.actions.glitch-check.name: Glitching flat check
effects.glitched.name: Glitched
effects.glitched.description: 'An item penalty to all checks and DCs equal to your glitching value, until your next glitching flat check.'
