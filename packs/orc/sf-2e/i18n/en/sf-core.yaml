# Text for the rules this pack adds beside the Second Edition core.
actions.area-fire.name: Area Fire
actions.area-fire.description: "2 actions: fire an area weapon at every creature in its burst, cone or line. Each attempts a basic Reflex save against your class DC plus the weapon's tracking bonus; the weapon spends its Expend."
actions.area-fire.params.primary.name: Primary target hit
actions.area-fire.params.primary.description: 'The participant your Primary Target Strike hit: its success becomes a failure.'
actions.area-fire.results.fired.name: Fired
actions.auto-fire.name: Auto-Fire
actions.auto-fire.description: "2 actions: spray an automatic weapon across a cone of half its range. Each creature attempts a basic Reflex save against your class DC plus the weapon's tracking bonus; it spends 2 rounds or charges per target."
actions.auto-fire.params.primary.name: Primary target hit
actions.auto-fire.results.fired.name: Fired
actions.auto-fire.results.no-ammo.name: Not enough ammunition
actions.boost.name: Boost
actions.boost.description: 'An Interact action: the next damaging attack with this weapon before the end of your next turn adds a boost die per weapon damage die, rolled after doubling.'
actions.boost.results.boosted.name: Boosted
actions.reload.name: Reload
actions.reload.description: "Refill the weapon from a carried battery, chem tank or rounds; a battery or chem tank takes the weapon's old charges."
actions.reload.steps.source.prompt: Load from
actions.reload.results.reloaded.name: Reloaded
actions.recharge.name: Recharge
actions.recharge.description: Recharge a spent battery at a charging station (1 minute).
actions.recharge.results.recharged.name: Recharged
actions.throw-grenade.name: Throw grenade
actions.throw-grenade.description: "1 action (Area Fire): each creature in the burst attempts the grenade's save against your class DC; the grenade is used up."
actions.throw-grenade.results.thrown.name: Thrown
actions.choose-apex.name: Choose apex augmentation
actions.choose-apex.description: 'At daily preparations, choose which apex augmentation raises its attribute today.'
