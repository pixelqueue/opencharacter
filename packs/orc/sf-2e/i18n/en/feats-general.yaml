feats.skill.akashic-sync.description: |-
  Single action. Frequency: once per 10 minutes. You briefly tap into the akashic record and Recall Knowledge using Occultism, as though Occultism applied to any topic.

  **Critical Success** You recall accurately and gain three pieces of information or context.

  **Success** You recall accurately and gain two pieces of information or context plus one piece of erroneous information, with no way to tell which is which.

  **Failure** You gain one piece of information or context and two pieces of erroneous information.

  **Critical Failure** You gain three pieces of erroneous information.
feats.skill.akashic-transcendence.description: You can use Akashic Sync once per round instead of once per 10 minutes.
feats.general.augmented-body.description: |-
  You implant one augmentation whose item level is no higher than your character level. It doesn't count against your implant limit. The first time you take this feat, the augmentation is free if its item level is 1 or lower. When you gain a level, or by spending downtime as though retraining a feat, you can swap it for another augmentation, paying the difference in cost between the old and new one each time.

  **Special** You can take this feat multiple times, choosing a different augmentation each time. Retraining it requires paying the cost of the original augmentation.
feats.general.barricade.description: Single action. You hastily build a barricade from nearby items, junk, or debris. It gives lesser cover to you and one other ally; you can Take Cover to raise that to standard cover. The barricade falls apart at the end of your next turn.
feats.skill.blend-in.description: While in a crowd of at least 10 other creatures, you can roll Society instead of Stealth when you Avoid Notice to see whether enemies notice you. In a settlement, you can use Society instead of Deception to Impersonate a non-specific individual.
feats.skill.combat-hack.description: |-
  Single action. Requirement: you are holding or wearing a hacking toolkit and have a free hand. Attempt a Computers check to Hack an adjacent creature, hazard, or item with the tech trait. The DC is the Fortitude DC of the creature, hazard, or item (or of the creature attending the item). For an unattended item, the GM sets the DC based on the item's level. The target is then temporarily immune to your Combat Hack for 10 minutes.

  **Critical Success** The target becomes glitching 2.

  **Success** The target becomes glitching 1.

  **Critical Failure** If the target is glitching, reduce its glitching value by 1.
feats.skill.crowd-control.description: |-
  You gain a +2 circumstance bonus to Diplomacy checks against crowds. The first time each round you Stride into a square containing a crowd, you can attempt a DC 20 Diplomacy check to make the crowd clear out of your way. The GM can use a different DC, such as when the crowd has a level or set DC to disperse.

  **Critical Success** As success, and the crowd also leaves all squares adjacent to you as you move.

  **Success** The crowd leaves the squares you move into.

  **Failure** The crowd doesn't move, but you can keep moving.

  **Critical Failure** The crowd forcefully resists you and disrupts your Stride.
feats.skill.crowd-surfing.description: You can move at full Speed through crowds. Areas truly packed with people count as difficult terrain instead of greater difficult terrain.
feats.skill.deadlift.description: "Single action. Requirement: you aren't fatigued. For 1 minute, you can carry 4 more Bulk than normal before becoming encumbered. This increases to 6 at expert, 8 at master, and 10 at legendary. When the effect ends, you are fatigued for 10 minutes."
feats.skill.deific-obedience.description: As long as you follow the edicts and anathema of your deity, you gain their granted 1st-rank spell as a divine innate spell you can cast once per day, heightened to 3rd rank (4th if you're legendary in Religion). If you repeatedly break your deity's edicts or perform anathema, you lose this ability until you regain it with an atone ritual.
feats.skill.digital-ambassador.description: While you use a comm unit, datapad, or computer to communicate, when you use a skill action with the linguistic trait on a creature that doesn't understand your language, roll a DC 15 flat check. On a success, the effect works as if the creature understood you. If you're legendary in Society, the DC is 10.
feats.skill.digital-diversion.description: 'Requirement: you are holding or wearing a hacking toolkit and have a free hand. You can Create a Diversion using Computers instead of Deception against an adjacent target carrying, wearing, or wielding a tech item, such as with a sudden comm unit ping or an alarm on an equipment display.'
feats.skill.dive-for-cover.description: Single action. You Leap, land prone, and immediately Take Cover, gaining greater cover against ranged attacks.
feats.skill.electrical-engineer.description: You can recharge battery-powered devices from other sources of power, which takes 1 minute of work with an adjacent source suited to the device. A technological creature or hazard works as a source if it was destroyed within the last 10 minutes, and provides charges equal to twice its level. A facility able to charge a battery makes the device operate as if its battery were always full. If you're a master in Crafting, you can connect a device to a power source as a 3-action activity; if you're legendary, it takes 1 action.
feats.skill.express-driver.description: When you work out your travel Speed for the day while piloting a vehicle, you can attempt a Piloting check to boost its travel Speed for long-term overland or aerial travel. The GM sets the DC, typically the vehicle's piloting DC or a difficulty based on the environment, whichever is harder. On a success, double the vehicle's travel Speed for the day. This has no effect on its movement in encounters or on starships traveling through hyperspace.
feats.skill.face-in-the-crowd.description: You can use cover from crowds to Hide and Sneak. You gain a +2 circumstance bonus to Stealth checks in a crowd of at least 10 creatures, and +4 in a crowd of at least 100. Hidden creatures don't count as part of a crowd. If you're a master in Deception, you need only 5 creatures for these bonuses.
feats.skill.favored-disguise.description: When you Impersonate, you can decide the disguise becomes your favored disguise. If you have a holoskin or can Change Shape, you can always adopt your favored disguise when Impersonating. You still roll Deception, but treat critical failures as failures. You have one favored disguise, plus one more at each of expert, master, and legendary proficiency in Deception.
feats.skill.feign-death.description: "Reaction. Trigger: you take damage. You lie prone and Impersonate a corpse. As long as you take only actions that need nothing but your mind, you appear dead. A creature sees through the ruse only by succeeding at a check against your Deception DC, either by Seeking or Recalling Knowledge. If you're a master in Deception, you can Ready an Action without ending this effect."
feats.skill.fly-anything.description: You can pilot any ship, even one you physiologically couldn't, including ones that require telepathy or other supernatural abilities. You can use Piloting instead of Crafting to Repair a part of a vehicle, starship, or mech, and Piloting instead of Computers to Hack one, each with a -2 circumstance penalty (and for Repair, as long as you have the right parts).
feats.skill.fool-the-camera.description: Whenever you Avoid Notice, Hide, or Sneak, you always count as taking precautions against special senses from tech items, such as scopes and security cameras. You also gain a +2 circumstance bonus to your Stealth DC to Avoid Notice against cameras and technological hazards.
feats.skill.hologram-skeptic.description: Even when you aren't Searching, you always get a check to disbelieve holograms and effects with the illusion and tech traits that would normally require you to Search or Interact with them.
feats.skill.intimidating-shot.description: Single action. You Demoralize a foe by firing your ranged weapon into the air, using ammo equal to the weapon's expend and the weapon's maximum range instead of the usual 30 feet. The check doesn't take the -4 circumstance penalty for a target that shares no language with you.
feats.skill.just-kidding.description: "Reaction. Trigger: an ally critically fails to Coerce, Make an Impression, or Request. You play the misstep off as a joke. Attempt a Performance check against the same DC as your ally's check. On a success, your ally treats the critical failure as a failure."
feats.skill.kiss-it-better.description: "Single action. Requirement: you have a free hand and are adjacent to an ally who isn't at full Hit Points. You convince the ally they've recovered from an injury. Attempt a Deception check against the same DC as Treat Wounds. On a success, the target gains temporary Hit Points equal to half the Hit Points Treat Wounds would restore, lasting 1 round. This doesn't remove the wounded condition. The target is temporarily immune to Kiss It Better for 24 hours."
feats.skill.legendary-troll.description: "Single action. Requirement: you or your target are using a comm unit, datapad, or other computer. Attempt a Deception check against the Will DC of a target within 60 feet. On a success, the target is off-guard for 1 round; on a critical success, it is confused for 1 round. Its reaction gives you information as though you'd Recalled Knowledge with an appropriate skill and got the same result. The target is then temporarily immune to your Legendary Troll for 24 hours."
feats.skill.management-material.description: Anyone who talks with you about a job, workplace, or office skill set assumes you're a professional in that setting unless you present yourself otherwise. You can use Society to Make an Impression on a professional, or to Impersonate a type of professional or a specific individual professional. If you use the normally required skills for those instead, you get a +1 circumstance bonus to the check.
feats.skill.percussive-maintenance.description: |-
  Single action. Requirement: you're holding a tech item that has the glitching condition. You smash it against a hard surface. Attempt a DC 10 flat check.

  **Critical Success** Reduce the glitching condition by 2.

  **Success** Reduce the glitching condition by 1.
feats.skill.predators-eye.description: Your eye magnifies distant targets like a scope. As a single action, you can adjust your sight to Seek a specific creature with a +2 circumstance bonus to your Perception check, or to Seek in a 10-foot square up to 100 feet away for undetected or hidden creatures or objects. You take no penalties for distance unless the target is more than 2 miles away.
feats.skill.phishing-expertise.description: You can Create a Forgery using Computers instead of Society. Digital forgeries are compared against your Computers DC. Using what you gain from a forgery usually needs further checks, including Deception and Society, and casting too wide a net risks a victim figuring out the ruse and reporting you to the authorities.
feats.skill.phreaker.description: |-
  You can use Computers to Disable a Device or Hack a system with any computer, comm unit, or terminal instead of a hacking toolkit. If you're an expert in Computers and the equipment is at least 3rd level, you gain a +1 item bonus to Disable a Device or Hack.

  **Special** If you have the Combat Hack or Digital Diversion skill feat, you can Combat Hack or Create a Diversion without a hacking toolkit.
feats.skill.plant-rumor.description: "Reaction. Trigger: you perceive a creature attempting a check with Deception, Diplomacy, or Intimidation against another creature's Will DC. You subtly damage someone's reputation to weaken their argument. The creature targeted by the triggering check gains a +2 circumstance bonus to its Will DC for that check."
feats.skill.power-slide.description: One to three actions. You Drive with a -2 penalty to your Piloting check, gaining the effects of Drive for the same number of actions you spent on Power Slide. At the end of the movement, if you succeed, you can turn the vehicle up to 90 degrees. On a critical success, you can turn it up to 180 degrees.
feats.skill.push-it.description: Whenever you succeed at a Piloting check, the vehicle you're piloting gains a +10-foot circumstance bonus to all its Speeds until the end of your turn. On a critical success, the bonus is +15 feet.
feats.skill.quick-install.description: You Install an Upgrade in only 1 minute. If you're legendary in Crafting, you can Install an Upgrade as a 3-action activity.
feats.skill.religious-talisman.description: You can build and bless a religious symbol of your deity in 10 minutes. It can take many forms, such as a scrap of paper, body art, a sticker, or a virtual emoji. You can make a talisman only for yourself and only for the deity you worship. As long as you keep to your deity's edicts, you gain a +1 status bonus to initiative rolls. If you violate your deity's anathema, the talisman is destroyed and you take a -1 status penalty to initiative rolls and Perception checks until you complete an _atone_ ritual.
feats.skill.serum-crafting.description: You can Craft serums and medical items with the consumable trait, though some have other requirements. You gain formulas for four common serums of 2nd level or lower.
feats.skill.specialty-crafting.description: |-
  Choose a specialty from the list below. You gain a +1 circumstance bonus to Crafting checks to Craft items of that type, or +2 if you're a master in Crafting. The GM decides when it's unclear whether a specialty applies, and may give only part of the bonus when an item needs more than one specialty (for example, half the bonus for a travel suit that needs both armorsmithing and textiles).

  - Armorsmithing: armor, shields, and upgrades
  - Artistry: fine art, including jewelry and solarian crystals
  - Automotives: vehicles, including spaceships
  - Chemicals: alcohol, ammunition, explosives, and fuel
  - Computer: comm units, datapads, and virtual items
  - Engineering: tech gadgets and accessories
  - Gunsmithing: firearms and firearm upgrades
  - Life Science: biotechnology and some pharmaceuticals
  - Robotics: drones, mechs, and robots
  - Textiles: clothing, leather, and polymer armor
feats.skill.stunt-maneuver.description: You remove the reckless trait when you attempt a Stunt with a -1 penalty. If you're a master in Piloting, you remove it when the penalty is -2 or lower. If you're legendary, you remove it from any Stunt you attempt.
feats.skill.take-the-wheel.description: Single action. You Board and Take Control of an adjacent vehicle.
feats.skill.tech-crafting.description: You can Craft level 1 or higher tech items, though some have other requirements. You gain formulas for four common tech items of 2nd level or lower.
feats.skill.urban-survivalist.description: You can use Survival instead of Society to Subsist in cities, space stations, and other settlements. You can also use Survival instead of Perception to notice hazards there; if you find one this way, you can also use Survival instead of Thievery to Disable the Device.
feats.skill.virtuosic-performer.description: |-
  Choose a specialty from the list below. You gain a +1 circumstance bonus to Performance checks of that type, or +2 if you're a master in Performance. The GM decides when it's unclear whether a specialty applies.

  - Acting: drama, live streams, reality shows
  - Comedy: buffoonery, joke telling, stand-up routines
  - Dance: ballet, ballroom, interpretive, pop, traditional
  - Keyboards: keytar, organ, piano
  - Oratory: epic, ode, poetry, storytelling
  - Percussion: bells, chimes, drum kit, xylophone
  - Singing: ballad, chant, pop, rock, shanty
  - Strings: guitar, singing coil, theremin
  - Synths: synth deck, turn table
  - Winds: horn, flute, pipes
feats.skill.without-a-trace.description: When you use the Cover Tracks exploration activity, anyone tracking you must succeed at a Perception check against your Deception, Stealth, or Underworld Lore DC, whichever is highest. If you spend 10 minutes cleaning up a crime scene, anyone investigating it must succeed at a Perception check against that same DC to uncover hidden evidence.
