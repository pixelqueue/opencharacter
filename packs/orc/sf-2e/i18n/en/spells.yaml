spells.absolute-zero.description: |-
  A vortex flash-freezes the area, dealing 10d8 cold damage. Each creature in the area attempts a Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is slowed 1 until the start of your next turn.

  **Critical Failure** The creature takes double damage, is immobilized by a layer of ice, and is slowed 1 while immobilized. The ice is an object with 50 Hit Points, Hardness 5, immunity to cold damage and vulnerability 10 to fire, plus object immunities. It's destroyed if the target Escapes.

  **Heightened (+1)** The damage increases by 1d8 and the ice's Hit Points by 5.
spells.animal-form.description: |-
  You transform into a Medium animal battle form of your choice from the list below; you can pick the specific animal (lion or snow leopard for cat, say), which doesn't change Size or statistics. You gain the animal trait and can Dismiss the spell. In the form you gain:

  - AC = 16 + your level. Ignore your armor's check penalty and Speed reduction.
  - 5 temporary Hit Points.
  - Low-light vision and imprecise scent 30 feet.
  - Unarmed melee attacks specific to the form, the only attacks you can Strike with; you're trained with them. Attack modifier +9, damage bonus +1. They're Strength-based (for enfeebled, for example). If your own unarmed attack bonus is higher, use it.
  - Athletics +9, unless your own is higher.

  Forms:

  - **Ape** Speed 25 feet, climb 20 feet; fist 2d6 bludgeoning.
  - **Bear** Speed 30 feet; jaws 2d8 piercing; claw (agile) 1d8 slashing.
  - **Bull** Speed 30 feet; horn 2d8 piercing.
  - **Canine** Speed 40 feet; jaws 2d8 piercing.
  - **Cat** Speed 40 feet; jaws 2d6 piercing; claw (agile) 1d10 slashing.
  - **Deer** Speed 50 feet; antler 2d6 piercing.
  - **Frog** Speed 25 feet, swim 25 feet; jaws 2d6 bludgeoning; tongue (reach 15 feet) 2d4 bludgeoning.
  - **Shark** Swim 35 feet; jaws 2d8 piercing; breathes water, not air.
  - **Snake** Speed 20 feet, climb 20 feet, swim 20 feet; fangs 2d4 piercing plus 1d6 poison.

  **Heightened (3rd)** 10 temporary HP, AC = 17 + your level, attack modifier +14, damage bonus +5, Athletics +14.

  **Heightened (4th)** The form is Large and attacks have 10-foot reach. 15 temporary HP, AC = 18 + your level, attack modifier +16, damage bonus +9, Athletics +16.

  **Heightened (5th)** The form is Huge and attacks have 15-foot reach. 20 temporary HP, AC = 18 + your level, attack modifier +18, damage bonus +7 and double the damage dice, Athletics +20.
spells.execute.description: |-
  You invoke the demise of all things: the target takes 70 void damage with a basic Fortitude save. If the target is undead or otherwise has void healing, the spell instead loses the death and void traits, gains the vitality trait, and deals 70 vitality damage with a basic Fortitude save.

  **Heightened (+1)** The damage increases by 10.
spells.explosion-of-rot.description: |-
  A giant pustule explodes, coating the area in life-draining rot. Creatures and plants in the area take 6d6 poison damage and attempt a Reflex save. Foliage and plant matter the spell damages no longer provides cover.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage.

  **Failure** The target takes full damage and is enfeebled 1.

  **Critical Failure** The target takes double damage, 1d6 persistent poison damage, and is enfeebled 2.

  **Heightened (+2)** The initial damage increases by 2d6 and the persistent damage by 1d6.
spells.fabricated-truth.description: |-
  Choose one statement for the targets to believe; it can be narrow, wide-reaching or conceptual. Their experiences color how they react to it. If the statement changes what they perceive, they treat the change as a sudden revelation. The effect depends on each target's Will save. If a target is already affected by _fabricated truth_, your spell tries to counteract it; if that check fails, the target's save outcome can't be worse than a success.

  **Critical Success** The target doesn't believe the statement and knows you tried to trick it.

  **Success** The target doesn't believe the statement or realize you tried to trick it.

  **Failure** The target believes the statement for 1 week.

  **Critical Failure** The target believes the statement indefinitely.
spells.false-vision.description: You create a false image that fools scrying on the area. Any scrying spell sees, hears, smells and otherwise detects whatever you wish within the area instead of what is there. You can Sustain the spell each round to change the illusion, including playing out a complex scene. If the scrying spell is of a higher rank than _false vision_, the scryer can attempt a Perception check to disbelieve the illusion, but even on a success can't learn what is truly happening in the area.
spells.false-vitality.description: |-
  You augment your flesh with energies used to manipulate the undead, gaining 10 temporary Hit Points.

  **Heightened (+1)** The temporary Hit Points increase by 3.
spells.fear.description: |-
  You plant fear in the target, which attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target is frightened 1.

  **Failure** The target is frightened 2.

  **Critical Failure** The target is frightened 3 and fleeing for 1 round.

  **Heightened (3rd)** You can target up to five creatures.
spells.feline-senses.description: |-
  You gain feline senses: darkvision and electromagnetic scent as an imprecise sense out to 30 feet, which detects living and technological creatures.

  **Heightened (4th)** The range is touch and it targets 1 willing creature.

  **Heightened (6th)** As 4th rank, and the duration is until your next daily preparations.
spells.ant-haul.description: You reinforce the target's musculoskeletal system. It can carry 3 more Bulk than normal before becoming encumbered, and up to 6 more Bulk at maximum.
spells.figment.description: You create a simple illusory sound or vision. A sound adds the auditory trait and can't include intelligible words or elaborate music. A vision adds the visual trait, is no larger than a 5-foot cube, and is clearly crude and lacking detail when viewed from within 15 feet. When you Cast or Sustain the Spell, you can attempt to Create a Diversion with the illusion, gaining a +2 circumstance bonus to Deception. If the attempt fails against a creature, it disbelieves the figment.
spells.fire-shield.description: |-
  You create a hovering shield of fire. While it lasts, you gain cold resistance 5 and immunity to mild and severe environmental cold. You can Raise a Shield with it as a normal shield for a +1 circumstance bonus to AC, and use Shield Block with it. It has Hardness 10, 40 HP (no Broken Threshold), is immune to fire, and its Hardness is halved against effects with the water trait. If you Shield Block a melee attack that's unarmed or made by an adjacent attacker, the attacker takes 2d6 fire damage.

  **Heightened (+2)** The cold resistance increases by 5, the HP by 10 and the fire damage by 1d6.
spells.fireball.description: |-
  A roaring blast of fire detonates at a spot you designate, dealing 6d6 fire damage.

  **Heightened (+1)** The damage increases by 2d6.
spells.fleet-step.description: You gain a +30-foot status bonus to your Speed.
spells.flicker.description: |-
  You flicker between your plane and another. You gain resistance 5 to all damage except force. At the end of each of your turns you automatically teleport 10 feet in a random direction chosen by the GM. You can Sustain the spell to teleport this way.

  **Heightened (+2)** The resistance increases by 3.
spells.floating-flame.description: You create a fuel-free fire that moves at your command. It deals 3d6 fire damage (basic Reflex) to each creature in the square where it appears. When you Sustain the spell, you can levitate the flame up to 10 feet; it then deals the same damage and save to each creature whose space it shared at any point in its flight. Roll damage once per Sustain. A creature can take damage from _floating flame_ only once per round.
spells.fly.description: |-
  The target soars through the air with a fly Speed equal to its Speed or 20 feet, whichever is greater.

  **Heightened (7th)** The duration increases to 1 hour.
spells.force-barrage.description: |-
  You fire a shard of solidified magic at a creature you can see. It automatically hits and deals 1d4+1 force damage. Each additional action you spend Casting the Spell adds one shard, up to three shards for 3 actions. You choose each shard's target individually. Shards at the same target combine their damage before bonuses, penalties, resistances, weaknesses and so on.

  **Heightened (+2)** You fire one additional shard per action spent.
spells.foresight.description: You gain a sixth sense warning of danger to the target. If the target is another creature, you create a mental psychic link through which you can warn it. You can't have more than one _foresight_ in effect at a time; casting it again ends the previous one. While it lasts, the target gains a +2 status bonus to initiative rolls and isn't off-guard against undetected creatures or when flanked. You also gain a reaction tied to the spell.
spells.genetic-regeneration.description: |-
  You imbue the target's genetic code with regenerative properties. The target gains regeneration 7, restoring 7 Hit Points at the start of each of its turns. While regenerating, it can't die from damage, and its dying condition can't rise to a value that would kill it (usually stopping at dying 3); if its wounded value reaches 4 or higher, it stays unconscious until its wounds are treated. If it takes acid or fire damage, regeneration deactivates until after the end of its next turn.

  Once during the duration, the creature can forgo that round's healing to regrow one damaged or ruined organ or reattach a severed body part by spending an Interact action to hold the part to where it was severed.

  **Heightened (+1)** The regeneration value increases by 2.
spells.gentle-landing.description: You raise a magical updraft to arrest a fall. The target falls at 60 feet per round, and the portion of the fall during the spell's duration doesn't count toward falling damage. If the target reaches the ground while the spell is active, it takes no fall damage. The spell ends as soon as the target lands.
spells.ghostly-carrier.description: You create a Tiny, semi-corporeal figure of a form you choose that hovers near you. When you Cast a Spell with a range of touch, you can have the carrier move within range, deliver the spell to a creature there, and return to you. If the carrier must make a spell attack roll, it uses your normal bonuses. It has your AC and saves but is destroyed by any damage.
spells.ghost-killer-weapon.description: "The target weapon becomes translucent and ghostly, able to affect material and incorporeal creatures and objects. It gains the effects of the ghost killer weapon upgrade: it becomes magical if it wasn't, is especially effective against incorporeal creatures, and can be wielded by a corporeal or incorporeal creature."
spells.glow-up.description: |-
  You create an illusion making the target appear more charming and genteel to observers, accentuating its appearance, clothing, voice and mannerisms to what each observer finds appealing. Held items are unaffected, and any worn item removed returns to its true appearance. You can Dismiss the spell.

  The target gains a +1 status bonus to Diplomacy checks to Make an Impression, adds its level to Diplomacy checks if untrained, and can Gather Information in only 10 minutes.

  **Heightened (+2)** The bonus increases by 1, to a maximum of +4 at 7th rank.
spells.gravity-field.description: You increase gravity in the area by one step (zero-g becomes low, low becomes standard, standard becomes high, high becomes extreme). All flying creatures in the area descend 40 feet. The area is greater difficult terrain for Flying and Climbing creatures and difficult terrain for creatures on the ground. A creature pulled to the ground by the field takes bludgeoning damage as though it had fallen.
spells.atomic-blast.description: |-
  You split an atom, creating an explosion with radioactive fallout. Creatures in the area take 5d12 bludgeoning and 5d12 fire damage and are exposed to extreme radiation, using your spellcasting DC as the Fortitude DC for radiation sickness. The radiation's onset and frequency is 1 round, and the area stays radioactive for 10 minutes. Each creature attempts a Reflex save.

  **Critical Success** The target is unaffected by the initial damage.

  **Success** The target takes half damage and is dazzled for 1 minute.

  **Failure** The target takes full damage and is blinded for 1 minute.

  **Critical Failure** As failure, but the target takes double damage.
spells.grim-tendrils.description: |-
  Tendrils of darkness race through the line, dealing 2d4 void damage and 1 persistent bleed damage to living creatures in it. Each living creature attempts a Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half the void damage and no persistent bleed damage.

  **Failure** The creature takes full damage.

  **Critical Failure** The creature takes double void damage and double persistent bleed damage.

  **Heightened (+1)** The void damage increases by 2d4 and the persistent bleed damage by 1.
spells.gust-of-wind.description: |-
  A violent wind blows from where you stand to the line's far end. It extinguishes small non-magical fires, disperses fog and mist, blows around objects of light Bulk or less, and pushes larger objects. Large or smaller creatures in the area attempt a Fortitude save, as do those that later move into the gust on entering.

  **Critical Success** The creature is unaffected.

  **Success** The creature can't move against the wind.

  **Failure** The creature is knocked prone. If it was flying, it takes the critical failure effect instead.

  **Critical Failure** The creature is pushed 30 feet in the wind's direction, knocked prone, and takes 2d6 bludgeoning damage.
spells.haste.description: |-
  Magic lets the target act faster. It gains the quickened condition, usable only for Strike and Stride actions.

  **Heightened (7th)** You can target up to 6 creatures.
spells.holographic-memory.description: |-
  You extract a specific memory you have some awareness of (or a random one, chosen by the GM) from the target's mind and project it as a hologram of no more than 5 minutes; a longer memory simply ends there. The hologram has audio and visual components only, usually plays one scene (it can cut between scenes if accurate to the memory and the length allows), and shows the memory exactly as the target experienced it, from its perspective, so it often lacks context.

  The spell can target a living, unconscious or dead sentient creature with an Intelligence modifier of -3 or higher. A corpse can't have been dead longer than 1 week or the spell fails, and once any caster has used the spell on a corpse, later castings on it fail. An unwilling target can attempt a Will save to resist.
spells.honeyed-words.description: Falsehoods pass your lips smoothly. You gain a +4 status bonus to Deception checks to Lie and against Perception checks to discern whether you're telling the truth, and you add your level even if untrained. If the implausibility of your lies would cause a circumstance penalty or DC increase, halve that penalty or increase.
spells.howl.description: |-
  You let out a psychic ululation that compels others who hear it to join in. Other creatures in the area who can hear take 7d12 sonic damage and 1d8 persistent mental damage, and attempt a Will save. The persistent mental damage increases by 1d8 if at least one other creature is howling; calculate it after all saves. A howling creature can't use auditory actions or cast spells (except those with the subtle trait) for 1 round.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage and no persistent mental damage.

  **Failure** The target takes full damage and persistent mental damage, and is compelled to howl as long as it takes that persistent damage.

  **Critical Failure** As failure, but the target takes double the initial and persistent damage.
spells.howling-blizzard.description: |-
  Freezing winds blow out from your hands. Cast with 2 actions, the area is a 60-foot cone; cast with 3 actions, the range is 500 feet and the area a 30-foot burst. Each creature in the area takes 10d6 cold damage with a basic Reflex save. Snowdrifts and icy gales fill the area until the start of your next turn, making it difficult terrain.

  **Heightened (+1)** The damage increases by 2d6.
spells.hydraulic-push.description: |-
  You blast the target with pressurized water. Make a ranged spell attack roll.

  **Critical Success** The target takes 6d6 bludgeoning damage and is knocked back 10 feet.

  **Success** The target takes 3d6 bludgeoning damage and is knocked back 5 feet.

  **Heightened (+1)** The damage increases by 2d6.
spells.hydraulic-torrent.description: |-
  A torrent of water along a line batters creatures and unattended objects in its path, dealing 8d6 bludgeoning damage. Each creature attempts a basic Fortitude save; unattended objects automatically fail. Those that fail are also knocked back 5 feet (10 feet on a critical failure).

  **Heightened (+1)** The damage increases by 2d6.
spells.hypercognition.description: You rapidly collate information relevant to your situation, instantly using up to 6 Recall Knowledge actions as part of Casting this Spell. For these actions you can't use special abilities, reactions or free actions that trigger when you Recall Knowledge.
spells.hypnotize.description: |-
  You create a cloud of mesmerizing patterns and colors. Creatures inside it are dazzled. A creature attempts a Will save if it's in the cloud when you cast the spell, when it enters, when it ends its turn there, or when it uses a Seek or Interact action on the cloud. A creature currently fascinated by _hypnotize_ doesn't attempt new saves.

  **Success** The target is unaffected.

  **Failure** The target is fascinated by the cloud.

  **Critical Failure** The target is fascinated by the cloud and can't use reactions while fascinated.
spells.ignition.description: |-
  You point at a target and it begins to smolder. Make a spell attack roll against its AC, dealing 2d4 fire damage on a hit. If the target is within your melee reach, you can make a melee spell attack instead of a ranged one, which makes all the spell's damage dice d6s.

  **Critical Success** The target takes double damage and 1d4 persistent fire damage.

  **Success** The target takes full damage.

  **Heightened (+1)** The initial damage increases by 1d4 and the persistent fire damage on a critical hit by 1d4.
spells.avatar.description: |-
  You transform into an avatar of your deity, taking a Huge battle form. You have hands and can take manipulate actions. You can Dismiss the spell. Whatever the form, you gain:

  - AC = 25 + your level. Ignore your armor's check penalty and Speed reduction.
  - 30 temporary Hit Points.
  - Darkvision and the cosmic trait.
  - Attacks specific to your deity's form, the only attacks you can Strike with; you're trained with them. Attack modifier +33, using the listed damage. Melee attacks are Strength-based (for enfeebled, for example) unless finesse; ranged attacks are Dexterity-based.
  - Athletics +35, unless your own is higher.

  You also gain the abilities of your deity's form, one of the following (each gives the Speeds and attacks listed):

  - Speed 50 feet, burrow 30 feet, immune to immobilized; ranged crossbolter (range increment 120 feet, reload 1) 6d10+3 piercing.
  - Speed 40 feet, swim 70 feet, immune to immobilized; melee rapier (deadly 3d8, disarm, finesse, reach 15 feet) 6d6+6 piercing; ranged breaching gun (range 120 feet) 6d6+3 piercing.
  - Speed 70 feet, immune to immobilized; melee doshko (reach 15 feet, sweep) 6d12+6 slashing; ranged, two actions, machine gun (analog, automatic, range 80 feet) 6d6+3 piercing.
  - Speed 50 feet, burrow 30 feet, immune to immobilized; melee jaws (reach 15 feet) 6d12+6 piercing; melee disintegration tendril (agile, reach 20 feet, versatile P) 6d8+6 acid.
  - Speed 70 feet, ignore difficult terrain and greater difficult terrain; melee singing spear (reach 20 feet, versatile P) 6d6+3 sonic; ranged singing spear (thrown 40 feet) 3d8+1 piercing plus 3d8+1 sonic.
  - Speed 70 feet, fly 70 feet, thoughtsense (precise) 60 feet; melee talon (reach 15 feet, versatile S) 6d8+6 acid; ranged pacifying buzz (nonlethal, range 60 feet) 6d6+3 mental.
  - Speed 30 feet, fly 70 feet, ignore hazardous terrain; melee inscrutable touch (caster, finesse, reach 15 feet) 6d6+3 fire; ranged plasma blast (range 100 feet) 6d8+3 fire plus 2d8 persistent electricity.
  - Speed 70 feet, fly 70 feet; melee polyglove (powered, professional [Computers], reach 15 feet, tech) 6d8+6 electricity; Area Fire, two actions, polyphonic jolt (30-foot cone, unwieldy) 6d6+3 electricity.
  - Speed 70 feet, climb 70 feet, immune to frightened; melee bite (reach 15 feet) 6d8+6 piercing; Area Fire, two actions, rat swarm (30-foot burst, range 120 feet) 4d6+4 piercing plus 2d6 mental.
  - Speed 70 feet, fly 70 feet, immune to emotion effects; melee whip (disarm, finesse, nonlethal, reach 10 feet, trip) 6d8+6 slashing; ranged aeon rifle (aeon, caster, range 120 feet) 6d6+4 fire.
  - Speed 70 feet, fly 70 feet, immune to slowed and stunned; melee battle ribbon (analog, finesse, reach 20 feet, trip) 6d8+6 slashing; Area Fire, two actions, fury storm (30-foot burst) 6d6+4 electricity.
  - No land Speed, fly 70 feet, immune to mental effects; ranged debris (range 120 feet) 6d10 void.
  - Speed 50 feet, burrow 30 feet, fly 50 feet, swim 50 feet; melee tentacle (agile, finesse, reach 20 feet, versatile S) 6d6 bludgeoning; ranged protoslime (range 120 feet) 6d6+3 poison.
  - Speed 70 feet, fly 70 feet; melee dagger (agile, finesse, reach 15 feet, thrown 40 feet, versatile S) 6d6+6 piercing; ranged spiral blast (damages only undead, range 120 feet) 6d8+3 vitality.
  - Speed 70 feet, fly 70 feet; melee puzzleblade (analog, breakdown, reach 15 feet) 6d6+3 slashing; ranged hearth blaze (fire, range 120 feet) 6d6+3 fire.
  - Speed 70 feet, your character and gear are immune to glitching; melee shock pad (nonlethal, reach 15 feet) 6d6+6 electricity; ranged logic blast (range 120 feet) 6d6+3 mental.
  - Speed 70 feet, fly 70 feet; melee scythe (deadly 3d10, reach 15 feet, trip) 6d10+6 slashing; ranged pallid bolt (range 120 feet) 6d6+3 void.
  - Speed 70 feet, fly 70 feet, immune to immobilized; melee battle glove (agile, free-hand) 6d4+6 bludgeoning; ranged laser rifle (range 100 feet) 6d8+6 fire.
  - Speed 30 feet, fly 70 feet, +4 status bonus to saves against mental effects; melee overwhelming touch (agile) 6d6+4 mental; ranged seeker rifle (range 120 feet) 6d10+2 piercing.
  - Speed 70 feet, fly 70 feet, ignore difficult terrain and greater difficult terrain; melee painglaive (deadly 3d8, reach 20 feet) 6d8+6 slashing; ranged tortured opus (nonlethal, range 120 feet) 3d6+1 sonic plus 3d6+1 mental.
spells.ill-omen.description: |-
  The target is struck with misfortune and attempts a Will save.

  **Success** The target is unaffected.

  **Failure** The first time during the duration the target attempts an attack roll or skill check, it rolls twice and uses the worse result.

  **Critical Failure** Every time during the duration the target attempts an attack roll or skill check, it rolls twice and uses the worse result.
spells.illusory-disguise.description: |-
  You make the target appear as another creature of the same body shape, of roughly similar height (within 6 inches) and weight (within 50 pounds). The disguise typically hides identity but can't impersonate a specific individual. It changes appearance and voice, not mannerisms. You can change how its clothing and worn items look (armor as a dress, say). Held items are unaffected, and a worn item removed returns to its true appearance. You can Dismiss the spell.

  Casting it counts as setting up a disguise for the Impersonate use of Deception; it ignores circumstance penalties for disguising as a dissimilar creature, gives a +4 status bonus to Deception checks to prevent others seeing through the disguise, and lets the target add its level to those checks even if untrained.

  **Heightened (3rd)** The target can appear as any creature of the same size, even a specific individual. You must have seen the individual to copy their appearance and heard them to copy their voice.

  **Heightened (4th)** You can target up to 10 willing creatures, choosing a different disguise for each, none impersonating a specific individual. You can Dismiss each disguise individually or all together.

  **Heightened (7th)** As 4th rank, but disguises can impersonate specific individuals (same seen and heard requirements).
spells.impaling-spike.description: |-
  A cold iron spike thrusts up from the earth beneath the target, dealing 8d6 piercing damage. The target attempts a Reflex save.

  **Critical Success** The target dodges the spike and is unaffected.

  **Success** The target takes half damage.

  **Failure** The target is impaled through a leg or other nonvital part, takes full damage and, if standing on solid ground, is immobilized. It can Escape (DC is your spell DC). While impaled, it takes damage from any weakness to cold iron at the end of each of its turns.

  **Critical Failure** As failure, but the target is impaled through a vital organ or its center of mass, takes double damage, and is off-guard while impaled.

  **Heightened (+1)** The damage increases by 2d6.
spells.implant-data.description: |-
  You reprogram a computer or device to display chosen data when accessed. You can implant one piece of data per spell rank: a simple fact (such as a creature's or object's location or description), an image, or a statement of up to 300 characters. When the target is accessed, the implanted data is the first data the accessing creature gains, whatever it's looking for. It doesn't stop access to other stored information or change how the device works. If the duration ends before the data is accessed, it vanishes.

  **Heightened (3rd)** The duration is one year.

  **Heightened (6th)** The duration is unlimited.
spells.implosion.description: |-
  You crush the target by making it collapse in on itself, dealing 75 damage. The first time each round you Sustain the spell, you choose a new target for the same effect; a creature can't be targeted more than once per casting, and you can't affect more than one creature per turn. You can't target a creature that's incorporeal, gaseous, liquid, or otherwise lacks a solid form.

  **Heightened (+1)** The damage increases by 10.
spells.infuse-vitality.description: |-
  You empower attacks with vital energy. The number of targets equals the actions you spent Casting the Spell. Each target's unarmed and weapon Strikes deal an extra 1d4 vitality damage. If you have the holy trait, you can add it to this spell and to the affected Strikes.

  **Heightened (3rd)** The extra damage is 2d4.

  **Heightened (5th)** The extra damage is 3d4.
spells.inject-nanobots.description: |-
  You inject magical nanobots into a creature. Make a melee spell attack roll. On a hit, the target takes 4d6 acid damage. On a critical hit, it takes double damage and is confused for 1 round as nanobots swarm its biological or mechanical systems.

  **Heightened (+1)** The damage increases by 2d6.
spells.injury-echo.description: |-
  You manifest an injury from the future or past to harm a creature in the present. Choose bludgeoning, piercing or slashing. The target takes 1d8 damage of that type with a basic Will save. If it fails and then takes the same damage type before the end of your next turn, it takes an additional 1d4 persistent bleed damage.

  **Heightened (+2)** The initial damage increases by 1d8 and the persistent damage by 1d4.
spells.insect-form.description: |-
  You transform into a Medium animal battle form of a simple bug; choose a form below. You can pick the specific bug (ladybug or scarab for beetle), which doesn't change Size or statistics. You gain the animal trait and can Dismiss the spell. In any form you gain:

  - AC = 18 + your level. Ignore your armor's check penalty and Speed reduction.
  - 10 temporary Hit Points.
  - Low-light vision.
  - Attacks specific to the form, the only attacks you can Strike with; you're trained with them. Attack modifier +13, damage bonus +2. They're Strength-based (for enfeebled). If your own unarmed attack modifier is higher, use it.
  - Athletics +13, unless your own is higher.

  Forms:

  - **Ant** Speed 30 feet, climb 30 feet; mandibles 2d6 bludgeoning.
  - **Beetle** Speed 25 feet; mandibles 2d10 bludgeoning.
  - **Centipede** Speed 25 feet, climb 25 feet; darkvision; mandibles 1d8 piercing plus 1d4 persistent poison.
  - **Mantis** Speed 40 feet; imprecise scent 30 feet; foreleg 2d8 piercing.
  - **Scorpion** Speed 40 feet; darkvision, imprecise tremorsense 60 feet; stinger 1d8 piercing plus 1d4 persistent poison; pincer (agile) 1d6 bludgeoning.
  - **Spider** Speed 25 feet, climb 25 feet; darkvision; fangs 1d6 piercing plus 1d4 persistent poison; ranged web (range increment 20 feet) immobilizes the target for 1 round or until it Escapes.

  **Heightened (4th)** The form is Large, attacks have 10-foot reach. 15 temporary HP, attack modifier +16, damage bonus +6, Athletics +16.

  **Heightened (5th)** The form is Huge, attacks have 15-foot reach. 20 temporary HP, attack modifier +18, damage bonus +2 and double damage dice (including persistent damage), Athletics +20.
spells.instant-virus.description: |-
  Your touch installs a self-replicating virus that disrupts a technological creature's programming. The target attempts a Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target is glitching 1.

  **Failure** The target is glitching 1 and stunned 1.

  **Critical Failure** The target is glitching 2 and stunned 2.
spells.interplanar-teleport.description: |-
  You and your allies move to another plane of existence. You must know the destination plane exists and use a magic planar key made from material of that plane as a locus. Keys for prominent planes are uncommon, like the spell; obscure planes and demiplanes often have rare or unique keys.

  The spell is highly imprecise: you appear 1d20x25 miles from where one target (your choice) last was the last time it traveled to that plane. If it's the first trip to that plane for all targets, you appear at a random location on it. The spell gives no way back, though casting it again returns you to your previous plane barring extenuating circumstances.
spells.invisibility.description: |-
  Illusions bend light around the target, making it invisible. It's undetected to all creatures, though they can attempt to find it, making it hidden to them instead. If the target uses a hostile action, the spell ends after that action completes.

  **Heightened (4th)** The spell lasts 1 minute and doesn't end when the target uses a hostile action.
spells.irradiate.description: |-
  You destabilize and decay the atoms around you into a burst of magically enhanced mild radiation. Creatures in the area attempt a Fortitude save against mild radiation sickness, using your spell DC in place of the normal Fortitude DC, with immediate onset and 1 round between stages. Technology doesn't gain glitching from this radiation.

  **Heightened (5th)** The radiation is severe.

  **Heightened (7th)** The radiation is extreme.

  **Heightened (9th)** The radiation is incredible.
spells.jump.description: |-
  Your legs surge with strength. You jump 30 feet in any direction without touching the ground. You must land on solid ground within 30 feet of you or fall after using your next action.

  **Heightened (3rd)** The range is touch, the target is one touched creature, and the duration is 1 minute, letting the target jump this way whenever it takes the Leap action.
spells.knock.description: |-
  You make the target door, lock or container easier to open, granting a +4 status bonus to any creature trying to open it with Athletics or Thievery. You can attempt a Thievery check to open it as part of casting _knock_, adding your level even if untrained.

  _Knock_ counteracts _lock_.
spells.laughing-fit.description: |-
  The target is overtaken with uncontrollable laughter and attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target can't use reactions.

  **Failure** The target is slowed 1 and can't use reactions.

  **Critical Failure** The target falls prone and can't use actions or reactions for 1 round, then takes the failure effects.
spells.banishment.description: |-
  You send the target back to its home plane. The target attempts a Will save. You can spend an extra action while Casting the Spell and add a cost to give the creature a -2 circumstance penalty to its save; the cost is a specially gathered object anathema to the creature. The spell fails if you aren't on your home plane when you cast it.

  **Critical Success** The target resists and you are stunned 1.

  **Success** The target resists being banished.

  **Failure** The target is banished.

  **Critical Failure** The target is banished and can't return by any means to the plane it left for 1 week.

  **Heightened (9th)** You can target up to 10 creatures. The extra cost affects targets to which it is anathema.
spells.levitate.description: You defy gravity, levitating the target 5 feet off the ground. You can Sustain the spell to move the target up or down 10 feet. A creature floating from _levitate_ takes a -2 circumstance penalty to attack rolls; it can spend an Interact action to stabilize and negate the penalty for the rest of its turn. If the target is adjacent to a fixed object or terrain of suitable stability, it can move across the surface by climbing (vertical, like a wall) or crawling (horizontal, like a ceiling). The GM decides which surfaces qualify.
spells.life-seal.description: |-
  A shimmering bubble envelops the target, letting it breathe normally in a vacuum or other unsafe environment and protecting it from severe temperatures and radiation.

  **Heightened (7th)** You can target up to 5 additional creatures, protecting them against the environment the triggering creature entered. The spell lasts 8 hours and also protects against extreme temperatures and radiation.

  **Heightened (10th)** You can target up to 10 additional creatures, protecting them against the environment the triggering creature entered. The spell lasts until your next daily preparations and also protects against incredible temperatures and radiation.
spells.light.description: |-
  You create an orb of light in a color you choose that sheds bright light in a 20-foot radius (and dim light for the next 20 feet). If created in the space of a willing creature, you can attach it so it floats near that creature as it moves. You can Sustain the spell to move the light up to 60 feet, attaching or detaching it from a creature as part of that movement. You can Dismiss the spell. If you Cast it while you already have four _light_ spells active, end one of them.

  **Heightened (4th)** The orb sheds light in a 60-foot radius (and dim light for the next 60 feet).
spells.lightning-bolt.description: |-
  A bolt of lightning strikes outward from your hand, dealing 4d12 electricity damage with a basic Reflex save.

  **Heightened (+1)** The damage increases by 1d12.
spells.logic-bomb.description: |-
  You implant a hazard packed with mind-blowing information into the target. The hazard has Stealth and Disable DCs equal to your spell DC and needs one successful Computers check to disable. The first time a creature unsuccessfully tries to access, destroy or otherwise manipulate the target (a failed Computers check, a Strike that misses, and so on), the bomb detonates and the creature takes 6d6 mental damage with a basic Will save. The spell ends when triggered or when the duration ends.

  **Heightened (+1)** The damage increases by 2d6.
spells.mask-of-terror.description: |-
  The target appears gruesome and terrifying, in a way unique to each observer. When a creature attempts a hostile action against the target, it attempts a Will save and is then temporarily immune until the end of its next turn.

  **Success** The creature is unaffected.

  **Failure** The creature becomes frightened 2 before using its action.

  **Critical Failure** The creature becomes frightened 2 and its action fails and is wasted.

  **Heightened (8th)** You can target up to 5 creatures. If a creature uses a hostile action or reaction affecting multiple targets at once, it attempts only one save against _mask of terror_.
spells.battle-sonata.description: |-
  You amplify a dissonant song into a deadly wave dealing 4d10 sonic damage. Each creature attempts a Will save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is deafened for 1 round.

  **Critical Failure** The creature takes double damage, is deafened for 1 minute and is stunned 1.

  **Heightened (+1)** The damage increases by 1d10.
spells.measure.description: |-
  You learn the approximate measurements (length, width, depth, height, weight) of creatures and objects you can observe in the area. If something extends beyond the area you learn only what lies within and nothing about what you can't observe (you can't learn the thickness or weight of a wall you see one side of, or the depth of water extending past the range). Each time you Sustain the spell you learn the exact measurements of one creature or object in the area, including imprecisions or anomalies that suggest structural weakness. Magically altered targets give information reflecting what you observe rather than accurate measurements.

  **Heightened (+1)** The range increases by 100 feet.
spells.mending.description: |-
  You repair the target item, restoring 5 Hit Points per spell rank, possibly removing the broken condition if this repairs it past the Broken Threshold. You can't replace lost pieces or repair a completely destroyed object.

  **Heightened (2nd)** You can target a non-magical object of 1 Bulk or less.

  **Heightened (3rd)** You can target a non-magical object of 2 Bulk or less, or a magical object of 1 Bulk or less.
spells.metamorphosis.description: |-
  You hide forms within forms, transforming into any form you could choose with a polymorph spell in your repertoire, or could prepare, of 8th rank or lower (including heightened versions of spells you know). You gain 40 temporary Hit Points instead of the form's normal amount.

  You can Sustain the spell to enter a new form you haven't used during this _metamorphosis_, which replenishes the temporary Hit Points from this spell.
spells.mind-reading.description: |-
  You attempt to read the target's mind; it attempts a Will save, then is temporarily immune to your mind reading for 1 hour.

  **Critical Success** The target perceives vague surface thoughts from you when you Cast the Spell.

  **Success** You learn whether the target's Intelligence modifier is higher than, equal to or lower than yours.

  **Failure** You perceive vague surface thoughts from the target and learn how its Intelligence compares to yours.

  **Critical Failure** As failure, and for the duration you can Sustain the spell to detect the target's surface thoughts again, with no additional saves for the target.
spells.mind-skewer.description: |-
  You overload a creature's mind with psychic information or divine judgments, dealing 2d6 mental damage. On a critical failure, the target is also stupefied 2 for 1 round.

  **Heightened (+1)** The damage increases by 2d6.
spells.mindlink.description: You link your mind to the target's and instantly impart an amount of information that would otherwise take 10 minutes to communicate.
spells.mislead.description: |-
  You turn invisible and create an illusory duplicate of yourself. When you Sustain the spell, you can mentally dictate your duplicate's course of action that round; it acts as though it had your full number of actions but can't affect anything in the environment. Both the duplicate and your invisibility last for the duration. A hostile action doesn't end the invisibility, as with a 4th-rank _invisibility_. A creature that determines the duplicate is an illusion doesn't necessarily know you're invisible, and one that sees your invisible form doesn't necessarily know the duplicate is an illusion.

  When you Cast a Spell, attack or otherwise interact with a creature, you can attempt a Deception check against observers' Perception DCs to convince them your duplicate took that action. It doesn't fool anyone aware the duplicate is an illusion or work if the action obviously couldn't have come from it (a ray can seem to come from a suitably positioned duplicate, but a sword attack against a target across the room from the duplicate automatically fails).
spells.bind-undead.description: With a word of power you seize control of the target, which gains the minion trait. The spell ends if you or an ally uses any hostile action against the target.
spells.monstrosity-form.description: |-
  You transform into a legendary monster in a Huge battle form: dust manta, nyssholora or space worm. You gain the beast trait and can Dismiss the spell. In any form you gain:

  - AC = 20 + your level. Ignore your armor's check penalty and Speed reduction.
  - 20 temporary Hit Points.
  - Darkvision.
  - Unarmed melee attacks specific to the form, the only attacks you can Strike with; you're trained with them. Attack modifier +28, using the listed damage. They're Strength-based (for enfeebled, for example). If your own unarmed attack modifier is higher, use it.
  - Athletics +30, unless your own is higher.

  Forms:

  - **Dust Manta** Speed 15 feet, burrow 40 feet; stinger (agile, finesse, reach 15 feet) 2d6+12 piercing plus 4d4 persistent poison. **Burrowing Charge** (two actions, move) Burrow up to twice your burrow Speed, then Leap vertically up to 25 feet, making a stinger Strike against a creature at any point in the jump. You then fall, taking no damage if you land on dirt or sand.
  - **Nyssholora** Speed 40 feet; jaws (reach 10 feet) 2d12+20 piercing; phasic blade (razing, reach 15 feet) 2d10+13 sonic; ranged tail scourge discharge (range increment 120 feet) 7d6 electricity. **Phasic Strike** Your phasic blade Strikes treat any object or construct they hit as having half its Hardness. **Phasic Flurry** (three actions, move, traversal) Stride up to your Speed, then make a phasic blade Strike against each creature within reach; each counts toward your multiple attack penalty, which doesn't increase until all have been made.
  - **Space Worm** Speed 40 feet, burrow 40 feet, swim 40 feet; jaws (reach 15 feet) 2d12+20 piercing; tongue (finesse, reach 30 feet) grabs the creature hit. It isn't immobilized but can't move beyond the tongue's reach. A creature can sever the tongue with a Strike against your AC dealing at least 30 slashing damage; this doesn't hurt you but stops tongue Strikes until you regrow it, such as by casting the spell again.

  **Heightened (9th)** AC = 22 + your level, 25 temporary HP, attack modifier +31, damage increases by one die, Athletics +33.
spells.motivating-ringtone.description: |-
  The target comm unit plays a personal theme song specific to its owner. While it keeps playing, the owner regains 1d8+4 Hit Points when you Cast the Spell, and gains a +5-foot status bonus to all Speeds and a +1 status bonus to saves against fear effects.

  **Heightened (+1)** The healing increases by 1d8+4.
spells.mountain-resilience.description: |-
  The target's skin hardens like mountain stone, granting resistance 5 to physical damage except adamantine. Each time a bludgeoning, piercing or slashing attack hits the target, the duration decreases by 1 minute.

  **Heightened (6th)** The resistance is 10.

  **Heightened (8th)** The resistance is 15.

  **Heightened (10th)** The resistance is 20.
spells.mystic-armor.description: |-
  You ward yourself with magical energy, gaining a +1 item bonus to AC and a maximum Dexterity modifier of +5. While wearing mystic armor you use your unarmored proficiency for AC.

  **Heightened (4th)** You gain a +1 item bonus to saving throws.

  **Heightened (6th)** The AC item bonus is +2 and the saving throw item bonus is +1.

  **Heightened (8th)** The AC item bonus is +2 and the saving throw item bonus is +2.

  **Heightened (10th)** The AC item bonus is +3 and the saving throw item bonus is +3.
spells.nature-incarnate.description: |-
  You transform into an incarnation of nature, either a gwereiad queen (Medium, fey trait) or a kyokor (Gargantuan, 30-foot-by-30-foot space, beast trait). You can Dismiss the spell. In either form you gain:

  - AC = 25 + your level. Ignore your armor's check penalty and Speed reduction.
  - 30 temporary Hit Points.
  - Darkvision.
  - Attacks specific to the form, the only attacks you can Strike with; you're trained with them. Attack modifier +34, using the listed damage. They're Strength-based (for enfeebled, for example). If your own unarmed attack modifier is higher, use it.
  - Athletics +36, unless your own is higher.

  Forms:

  - **Gwereiad Queen** Speed 25 feet, fly 40 feet; gravity fist (agile, finesse, magical, reach 30 feet) 6d8+12 bludgeoning plus knockdown; ranged particle jet (range 100 feet) 3d6+3 bludgeoning plus 3d6+3 fire. **Singularity Field** (aura, primal, 60 feet) Enemies that end their turn in the area must succeed at a Reflex save against your spell DC or be pulled 5 feet toward you (10 feet on a critical failure).
  - **Kyokor** Speed 50 feet; resistance 5 to physical damage; jaws (reach 30 feet) 6d10+10 piercing; claws (agile, reach 30 feet) 6d8+8 slashing; foot (agile, reach 15 feet) 6d6+10 bludgeoning. **Unstoppable** You're immune to being immobilized and ignore difficult terrain and greater difficult terrain. **Demolish Structures** Your jaws, claws and foot Strikes deal an additional 6d10 damage to structures.
spells.natures-pathway.description: |-
  You step into a living tree with a trunk big enough to hold you and instantly teleport to any similarly large-trunked tree within 5 miles. After entering the first tree you instantly know the rough locations of other sufficiently large trees in range and can exit from the original tree if you prefer. You can't carry extradimensional spaces with you; if you try, the spell fails.

  **Heightened (6th)** The exit tree can be up to 50 miles away.

  **Heightened (8th)** The exit tree can be up to 500 miles away.

  **Heightened (9th)** The exit tree can be anywhere on the same planet.
spells.never-mind.description: |-
  You drastically reduce the target's mental faculties; it attempts a Will save. Only effects that target curses can remove this curse.

  **Critical Success** The target is unaffected.

  **Success** The target is stupefied 2 for 1 round.

  **Failure** The target is stupefied 4 with unlimited duration.

  **Critical Failure** The target's intellect is permanently reduced below that of an animal; it treats its Charisma, Intelligence and Wisdom modifiers as -5 and loses all class abilities requiring mental faculties, including spellcasting. If the target is a PC, they become an NPC under the GM's control.
spells.new-game.description: |-
  You draw creatures into a vidgame, digitizing their bodies, minds and equipment to play in virtual reality. The genre and effect depend on whom you target. Any creature targeted becomes immune to the spell for 24 hours, whatever genre it experiences.

  - If you target yourself and any number of willing allies, the targets enter a relaxing slice-of-life social simulation where they can perform up to 1 hour of activities during the spell, including Refocusing, Repairing items, or evading an enemy by hiding in the virtual extradimensional space.
  - If you target yourself or one willing ally, plus one enemy, they enter a PvP game and must fight, using their current initiative. For the duration, either creature can manipulate fate once on each of its turns: roll twice and take the higher result on an attack roll or skill check against its opponent (fortune), or force the opponent to roll twice and take the lower result on a saving throw against one of its abilities (misfortune). The GM might add rules or subsystems for other genres. The spell ends if either target becomes unable to act or both agree to stop. Damage and conditions persist afterward. If a player dies in the game, they die in real life.
  - If you target one enemy, it enters a PvE or puzzle game that traps it until it completes the game. Once each turn it can spend 1 action to attempt a Computers or Perception check against your spell DC to escape. Teleportation doesn't help unless it can transport someone into or out of a virtual space. When the spell ends, whether by escape or duration, the target returns to the space it occupied when digitized, or the nearest one if that's now filled. The GM might allow other skill checks for other genres, but only if the target is proficient in the skill.

  **Critical Success** The target completes the game and the spell ends.

  **Success** The target makes progress toward completing the game. If it already made progress, it completes the game and the spell ends.

  **Failure** The target makes no progress.

  **Critical Failure** The target loses the game and starts over, losing all progress.
spells.nightmare.description: |-
  You send disturbing nightmares to the target. The next time it falls asleep, it attempts a Will save. If you know the target only by name and have never met, it gets a +4 circumstance bonus to the save.

  **Critical Success** The target is unaffected and temporarily immune for 1 week.

  **Success** The target has the nightmares with no adverse effects beyond unpleasant memories.

  **Failure** The target has the nightmares and awakens fatigued.

  **Critical Failure** The target has the nightmares, awakens fatigued, and is drained 2 until no longer fatigued.
spells.noise-blast.description: |-
  A cacophonous noise blasts out, dealing 2d10 sonic damage. Each creature attempts a Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is deafened for 1 round.

  **Critical Failure** The creature takes double damage, is deafened for 1 minute and is stunned 1.

  **Heightened (+1)** The damage increases by 1d10.
spells.oaken-resilience.description: |-
  The target's skin becomes tough like bark, granting resistance 2 to bludgeoning and piercing damage and weakness 3 to fire. After the target takes fire damage, it can Dismiss the spell as a free action; this doesn't reduce that fire damage.

  **Heightened (+2)** The resistances increase by 2 and the weakness by 3.
spells.one-with-stone.description: You transform into stone or merge with stone, as for _one with plants_ but with stone. A stone you turn into has AC 23. You can Dismiss the spell.
spells.overheat.description: |-
  You vent heat at a nearby target, dealing 2d6 fire damage. On a failed save, the target's held equipment becomes hot for the next round; unless it drops its held equipment at the start of its turn, it takes 3 fire damage.

  **Heightened (+1)** The damage increases by 2d6 and the damage from touching affected objects by 3.
spells.overload-systems.description: |-
  A wave of electrical interference deals 7d8 electricity damage to creatures in the area. Each creature attempts a Reflex save.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage.

  **Failure** The target takes full damage and its items with the tech trait become glitching 1 for 1 minute or until the condition is removed.

  **Critical Failure** The target takes double damage and its items with the tech trait become glitching 2 for 1 minute or until the condition is removed.

  **Heightened (+1)** The damage increases by 1d8.
spells.paralyze.description: |-
  You block the target's motor impulses, freezing it in place. It attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target is stunned 1.

  **Failure** The target is paralyzed for 1 round.

  **Critical Failure** The target is paralyzed for 4 rounds. At the end of each of its turns it can attempt a new Will save to reduce the remaining duration by 1 round, or end it entirely on a critical success.

  **Heightened (7th)** You can target up to 10 creatures.
spells.peaceful-bubble.description: |-
  An opaque shell of drifting iridescent runes covers the area as a bubble; you can make the burst smaller in 10-foot increments. The runes don't block travel, but those inside and outside can't perceive each other, and detection and scrying effects are blocked.

  Creatures sleeping inside are immune to dreams sent by spells. Those sleeping 8 hours reduce their doomed condition by 2 instead of 1.
spells.peaceful-rest.description: |-
  The target corpse doesn't decay and can't be transformed into an undead. If a spell requires the corpse to have died within a time limit (such as _raise dead_), don't count this spell's duration against it. It also keeps ordinary bugs and pests from consuming the body.

  **Heightened (5th)** The duration is unlimited, but the spell takes one more action to cast and requires embalming fluid worth 60 credits.
spells.personal-gravity.description: You alter gravity's effect on you, treating gravity as one step higher or lower, your choice (in low gravity, standard or zero-g). While active, you reduce the distance of any forced movement affecting you by 5 feet (minimum 0) and ignore being clumsy and untethered because of gravity effects. You can Dismiss the spell.
spells.pest-form.description: |-
  You transform into the battle form of a Tiny animal, such as a cat, insect, lizard or rat; the specific animal doesn't change your Size or statistics. You gain the animal trait, can't make Strikes, and can Dismiss the spell. You gain:

  - AC = 15 + your level. Ignore your armor's check penalty and Speed reduction.
  - Speed 20 feet.
  - Weakness 5 to physical damage (you take 5 additional damage from it).
  - Low-light vision and imprecise scent 30 feet.
  - Acrobatics and Stealth +10, unless your own is higher; Athletics -4.

  **Heightened (4th)** You can turn into a flying creature, such as a bird, gaining a fly Speed of 20 feet.
spells.phantasmagoria.description: |-
  You fill the targets' minds with endless images of colliding dreams and lives, dealing 16d6 mental damage to each target, depending on its Will save.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage and can't use reactions until the start of your next turn.

  **Failure** The target takes full damage and is confused until the start of your next turn.

  **Critical Failure** The target takes double damage and is confused for 1 minute.
spells.phantasmal-calamity.description: |-
  A vision of apocalyptic destruction fills the mind of each creature in the area, dealing 11d6 mental damage (basic Will save). On a critical failure the creature must also succeed at a Reflex save or believe it's trapped (in a fissure, adrift at sea, or some other fate fitting its vision); if it fails that save it's also stunned for 1 minute. It can attempt a new Will save at the end of each of its turns; on a success it disbelieves the illusion and recovers from stunned.

  **Heightened (+1)** The damage increases by 2d6.
spells.phantasmal-fleet.description: "A vision of a hostile starship fleet, apparently 1,000 feet overhead and bombarding the ground with laser fire, fills the mind of each creature in the area, dealing 10d8 mental damage with a basic Will save. On a critical failure the target also believes it's being pursued and moves to take cover: it must spend an action to Take Cover on each of its turns, first moving to a new space or Dropping Prone if needed. It can attempt a new Will save at the end of each of its turns; on a success it disbelieves the phantasm and is no longer forced to Take Cover."
spells.phantasmal-minion.description: You summon a phantasmal minion, roughly humanoid in shape. You can make it invisible or give it an ephemeral appearance, but it's obviously a magical effect, not a real creature.
spells.phantom-pain.description: |-
  Illusory pain wracks the target, dealing 2d4 mental damage and 1d4 persistent mental damage, with a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target takes full initial damage but no persistent damage, and the spell ends immediately.

  **Failure** The target takes full initial and persistent damage and is sickened 1. If it recovers from sickened, the persistent damage and the spell end.

  **Critical Failure** As failure, but the target is sickened 2.

  **Heightened (+1)** The damage increases by 2d4 and the persistent damage by 1d4.
spells.planar-palace.description: |-
  You grow an extradimensional demiplane holding a spacious dwelling with a single entrance. The entrance connects to the plane where you Cast the Spell, appearing anywhere in range as a faint shimmering vertical rectangle 5 feet wide and 10 feet high. You designate who can enter when you Cast the Spell. Once inside, you can shut the entrance, making it invisible; you and those you designated can reopen it at will.

  Inside is a mansion with a magnificent foyer and many opulent chambers, with any floor plan you imagine as you cast, fitting within 40 feet wide, 40 feet deep and 30 feet tall. While the entrance is closed, effects from outside fail to penetrate and vice versa, except _interplanar teleport_, which can be used to enter. You can observe the outside with scrying and similar effects only if they can cross planes.

  A staff of up to 24 servants attends anyone inside, like the servant from _phantasmal minion_ but visible, with an appearance you choose when casting. The mansion is stocked with enough food for a nine-course banquet for 150 people.
spells.plant-form.description: |-
  You transform into a Large plant battle form; choose a form below. You can substitute a similar plant (pitcher plant for flytrap, say), which doesn't change Size or statistics. You gain the plant trait and can Dismiss the spell. In any form you gain:

  - AC = 19 + your level. Ignore your armor's check penalty and Speed reduction.
  - 12 temporary Hit Points.
  - Resistance 10 to poison.
  - Low-light vision.
  - Unarmed melee attacks specific to the form, the only attacks you can Strike with; you're trained with them. Attack modifier +17, damage bonus +11. They're Strength-based (for enfeebled, for example). If your own unarmed attack modifier is higher, use it.
  - Athletics +19, unless your own is higher.

  Forms:

  - **Moonflower** Speed 30 feet; resistance 10 to electricity; bite (reach 15 feet) 2d10 piercing; root (reach 15 feet) 2d8 bludgeoning, and after a hit you can spend an action to Grab the target.
  - **Void Palm** Speed 15 feet; resistance 10 to poison; void frond (reach 10 feet) 2d8 slashing.

  **Heightened (6th)** The form is Huge and attack reach increases by 5 feet. AC = 22 + your level, 24 temporary HP, attack modifier +21, damage bonus +16, Athletics +22.
spells.pocket-vacuum.description: |-
  You create a sudden vacuum, forcing creatures in the area to hold their breath or fall unconscious and start suffocating. The explosive decompression deals 5d12 bludgeoning damage (basic Fortitude save) to each creature in the area when you cast the spell or that enters it during the duration, unless already in a vacuum. Creatures that critically fail are also knocked prone.

  **Heightened (+1)** The damage increases by 1d12.
spells.prestidigitation.description: |-
  The simplest magic does your bidding. For as long as you Sustain the spell, each time you Sustain it you can choose one of four effects. It can't deal damage or cause adverse conditions, and any change to an object (beyond what's noted) lasts only while you Sustain.

  - **Cook** Cool, warm or flavor 1 pound of nonliving material.
  - **Lift** Slowly lift an unattended object of light Bulk or less 1 foot off the ground.
  - **Make** Create a temporary object of negligible Bulk from congealed magical substance. It's crude, artificial and extremely fragile, and can't be used as a tool, weapon, or locus or cost for a spell.
  - **Tidy** Color, clean or soil an object of light Bulk or less. An object of 1 Bulk takes 10 rounds of concentration, and a larger one 1 minute per Bulk.
spells.project-image.description: |-
  You project an illusory image of yourself. You must stay within range of it, and the spell ends if you can't see it. Whenever you Cast a Spell other than one with an emanation area, you can have the effect originate from you or the image. As an illusion, the image can't benefit from spells, though visual manifestations of them appear. It has your AC and saves; if it's hit by an attack or fails a save, the spell ends.

  **Heightened (+2)** The maximum duration you can Sustain the spell increases to 10 minutes.
spells.promession.description: |-
  You flash freeze a target, then send subsonic waves through it, potentially reducing it to fine powder. Make a spell attack against the target. On a hit it takes 6d8 cold damage and attempts a Fortitude save; on a critical hit its save result is one degree worse. A creature reduced to 0 Hit Points is blasted to fine powder; its gear remains.

  **Critical Success** The target is unaffected by further damage.

  **Success** The target takes an additional 3d8 sonic damage.

  **Failure** The target takes an additional 6d8 sonic damage.

  **Critical Failure** The target takes an additional 12d8 sonic damage.

  **Heightened (+1)** The cold and sonic damage each increase by 1d8.
spells.blur.description: The target's form appears blurry, making it concealed. Because its location stays obvious, it can't use this concealment to Hide or Sneak.
spells.pummeling-rubble.description: |-
  A spray of heavy rocks flies in front of you, dealing 2d4 bludgeoning damage to each creature in the area, who each attempt a Reflex save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is pushed 5 feet away from you.

  **Critical Failure** The creature takes double damage and is pushed 10 feet away from you.

  **Heightened (+1)** The damage increases by 2d4.
spells.raise-dead.description: |-
  You call forth a dead creature's soul; its body must be present and relatively intact, and it must have died within the past 3 days. If the GM decides the creature's time has truly come, or it doesn't wish to return, the spell automatically fails and the cost isn't consumed.

  On success the creature returns to life with 1 Hit Point, no prepared spells or spell slots, no points in any pools or other daily resources, and any long-term debilitations of its old body. Its time in the afterlife leaves it clumsy 2, drained 2 and enfeebled 2 for 1 week; these can't be removed or reduced by any means until the week passes. It is also permanently changed by the experience, such as a slight personality shift, a streak of white in the hair or a new birthmark.

  **Heightened (7th)** The maximum target level is 15. The cost is the target's level (minimum 1) x 4,000 credits.

  **Heightened (8th)** The maximum target level is 17. The cost is the target's level (minimum 1) x 8,000 credits.

  **Heightened (9th)** The maximum target level is 19. The cost is the target's level (minimum 1) x 16,000 credits.

  **Heightened (10th)** The maximum target level is 21. The cost is the target's level (minimum 1) x 32,000 credits.
spells.read-aura.description: |-
  You focus on the target object and perceive magical auras. When casting completes, you know whether it's magical. You and anyone you advise about the aura gain a +2 circumstance bonus to Identify Magic on it. If the object is illusory, you detect this only if the effect's rank is lower than your _read aura_'s rank.

  **Heightened (3rd)** You can target up to 10 objects.

  **Heightened (6th)** You can target any number of objects.
spells.recharge-weapon.description: |-
  You touch a weapon with no ammunition left and recharge it with magical energy. Until the end of your next turn it has ammunition or charges equal to its expend, letting its holder make one Strike. It only recharges weapons using ammunition costing 10 credits or less.

  **Heightened (3rd)** It gains double its expend.

  **Heightened (6th)** It gains triple its expend.

  **Heightened (9th)** It gains quadruple its expend.
spells.remake.description: |-
  You fully re-create an object from nothing, even a destroyed one. You must be able to picture it in your mind, and even a tiny remnant (a speck of dust left by disintegration) is enough. The spell fails if your mental image relied on too much guesswork, if the object wouldn't fit in a 5-foot cube, if it still exists and you simply didn't know, or if it's an artifact, has a level over 20, or has similarly vast magical power.

  The item reassembles in perfect condition, even if you pictured it damaged or weathered. A magical object typically regains its constant magical properties but not temporary ones such as charges or one-time uses. An item with charges or daily uses has all of them expended when remade, then replenishes normally.
spells.reorient.description: Using vital energy and acupressure, you help the target regain its footing. It loses the off-guard condition and becomes immune to it until the start of your next turn, even when applied circumstantially such as by flanking or being prone. It is then immune to _reorient_ for 10 minutes.
spells.resist-energy.description: |-
  A shield of elemental energy protects a creature against one energy type you choose: acid, cold, electricity, fire or sonic. The target and its gear gain resistance 5 to it.

  **Heightened (4th)** The resistance is 10 and you can target up to two creatures.

  **Heightened (7th)** The resistance is 15 and you can target up to five creatures.
spells.retrocognition.description: |-
  You open your mind to mental echoes and gain impressions of past events at your location. During the first minute you perceive impressions from the last day, the next minute those from the day before, and so on. They aren't a vision but impressions of emotions and metaphors giving cryptic clues about the past. If you witness a traumatic or turbulent event through an impression, the spell ends unless you succeed at a Will save with a DC of 30 to 50 depending on the event's severity; the GM decides whether an event is traumatic and sets the DC.

  **Heightened (8th)** Each minute covers a year instead of a day, though detail diminishes, making it harder to distinguish impressions from all but major events.

  **Heightened (9th)** Each minute covers a century instead of a day, making it almost impossible to distinguish impressions from all but the most major events.
spells.ricochet.description: |-
  A spinning disk or smooth orb of shimmering steel leaps from target to target, dealing 2d4 bludgeoning or slashing damage (basic Reflex save).

  **Heightened (+1)** The damage increases by 1d4.
spells.rocket-dash.description: |-
  You emit a rocket of flame behind you and blast forward, moving in a straight line up to twice your Speed. You can move through creatures' spaces and the movement doesn't trigger reactions. Creatures in the area take 6d12 fire damage with a basic Reflex save; on a critical failure a creature also takes 2d6 persistent fire damage and is dazzled for 1 round. You reappear at the end of the line.

  **Heightened (+2)** The fire damage increases by 2d12 and the persistent damage by 1d6.
spells.root-of-all-pain.description: |-
  You push a tiny root into the target's body; it grows through the nervous system, feeding on the signals of agonizing pain. The target attempts a Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target takes 2d8 mental damage the first time each round it performs any action other than a purely mental one such as Recall Knowledge (or others per the GM).

  **Failure** As success, but 4d8 mental damage and the target is slowed 1 for the duration.

  **Critical Failure** As success, but 6d8 mental damage and the target is slowed 2 for the duration.
spells.breathe-fire.description: |-
  A gout of flame sprays from your mouth, dealing 2d6 fire damage to creatures in the area with a basic Reflex save.

  **Heightened (+1)** The damage increases by 2d6.
spells.scan-environment.description: |-
  You analyze the natural environment within 1 mile. You forecast the weather for the next hour, including its direction; learn which atmospheres, biomes and gravity are present and the direction and distance to them; and learn whether anything presents an environmental hazard, including cold or heat dangers (and temperature range), radiation (and severity), smoke and underwater conditions. This detects only large effects spanning spaces over 30 feet across, and you get a general sense of where and how far away the dangers are.

  **Heightened (+1)** The scanned radius increases by 1 mile.
spells.seek-the-stars.description: |-
  In your mind's eye you chart a path through the cosmos. You immediately know the direction to the nearest hyperspace beacon.

  **Heightened (7th)** You can instead know the direction to a familiar location, such as a world or way station you've visited.
spells.selective-invisibility.description: |-
  A willing creature you touch becomes invisible to everyone except a second target within range. If the invisible creature uses a hostile action against anyone other than the target who can see it, the spell ends after that action completes.

  **Heightened (5th)** You can make up to 6 willing creatures within 30 feet invisible, all sharing the same target.
spells.shape-stone.description: |-
  You shape stone into a rough form of your choice; the shaping is too crude for intricate parts, fine details or moving pieces. Creatures standing atop the stone when you reshape it each attempt a Reflex save or Acrobatics check.

  **Success** The creature is unaffected.

  **Failure** The creature falls prone atop the stone.

  **Critical Failure** The creature falls off the stone (if applicable) and lands prone.
spells.shape-wood.description: You shape wood into a rough form of your choice; the shaping is too crude for intricate parts, fine details or moving pieces. You can't use it to increase the value of the wooden object.
spells.cairn-form.description: |-
  The target's skin becomes a thick carapace of solid stone, granting resistance 5 to physical damage except adamantine. The target gains a fist unarmed attack dealing 2d6 bludgeoning damage, using its highest weapon or unarmed proficiency and adding weapon specialization or greater weapon specialization damage if it has them. On a critical hit with these attacks, the creature struck must succeed at a Fortitude save against the target's class DC or be stunned 1 for 1 round.

  **Heightened (6th)** The resistance is 10 and the damage 3d6.

  **Heightened (10th)** The resistance is 20 and the damage 4d6.
spells.share-pain.description: |-
  You telepathically share agonizing pain with a creature, which takes 3d12 mental damage and attempts a Will save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is clumsy 1 for 1 minute.

  **Critical Failure** The creature takes full damage and is clumsy 2 for 1 minute.

  **Heightened (6th)** The spell targets up to four creatures and deals 6d12 mental damage.
spells.shatter.description: |-
  A high-frequency sonic attack shatters a nearby object, dealing 2d10 sonic damage to it and ignoring its Hardness if that is 4 or lower.

  **Heightened (+1)** The damage increases by 1d10 and the Hardness ignored by 2.
spells.shield.description: |-
  You raise a magical shield of force. This counts as the Raise a Shield action, giving a +1 circumstance bonus to AC until the start of your next turn, but needs no hand. While the spell lasts you can use Shield Block with the shield, which has Hardness 5. You can use the reaction to reduce damage from any spell or magical effect, even non-physical. After you Shield Block, the spell ends and you can't cast it again for 10 minutes.

  **Heightened (+2)** The shield's Hardness increases by 5.
spells.shifting-surge.description: |-
  A surge of magical energy changes the weapon's damage type. Its next Strike deals your choice of acid, cold, electricity, fire or sonic damage and an additional 1d6 damage of the weapon's normal damage type.

  **Heightened (+2)** The extra damage increases by 1d6.
spells.sift-the-sphere.description: |-
  You ritually sift the local infosphere for insight. While casting, ask about the results of a particular course of action. The spell predicts up to 30 minutes ahead and gives the GM's best guess among these outcomes:

  - **Weal** The results will be good.
  - **Woe** The results will be bad.
  - **Weal and Woe** A mix of good and bad.
  - **Nothing** No particularly good or bad results. The GM rolls a secret DC 6 flat check; on a failure the result is always "nothing," so you can't tell whether "nothing" is accurate. If someone asks about the same topic as the first casting during another casting, the GM reuses the first secret roll. If circumstances change, a different result is possible.

  **Heightened (4th)** The spell predicts up to 1 week ahead.
spells.singularity-seed.description: |-
  A tiny dense particle blossoms into a gravitational singularity that pulls creatures toward it and spatially compresses those moved into it. You create it in an unoccupied 5-foot square. When cast, all creatures and unsecured objects in a 50-foot emanation around it are pulled toward it depending on their Reflex save, closest first, so they may block those pulled later.

  Creatures' spaces can overlap in the singularity's square. A creature or object that enters it or ends its turn there takes 10d10 bludgeoning damage with no save. While in it, a creature can take no actions except to Escape against your spell DC. When the spell ends the singularity disappears and overlapping creatures move to the closest unoccupied space, as the GM determines.

  Squares in the emanation are difficult terrain for creatures moving away from the singularity, and creatures moving toward it move 10 feet for each 5 feet of movement spent.

  A creature attempts a Reflex save if it's in the area when the spell is cast and when it ends its turn there.

  **Critical Success** The creature is unaffected.

  **Success** The creature is pulled 10 feet toward the singularity.

  **Failure** The creature is pulled 20 feet toward it.

  **Critical Failure** The creature is pulled 30 feet toward it.
spells.call-cosmos.description: |-
  You call down a vertical column of burning stars and frozen comet chunks that shrouds the terrain in stardust. It deals 5d12 cold damage and 5d12 fire damage to every creature in the area when you Cast the Spell. For the duration the material reduces visibility and mobility: the area is greater difficult terrain and everything seen within or through it is concealed.

  **Heightened (10th)** The cold and fire damage each increase by 2d12.
spells.skim-data.description: You touch one object and concentrate on a dataset in it, such as a story, message, file, infosphere site, audio recording or video. You grasp its gist and can quickly locate the pages or sections most relevant to your search. The spell fails if the dataset is in a language you don't know, or if you try to gain information from a computer you can't access (such as one with an unknown password). If you Cast it as part of a Research activity, you treat a critical failure as a failure.
spells.fiery-wings.description: |-
  Wings of plasma grow from your body. You gain a fly Speed equal to your Speed or 20 feet, whichever is greater. Your arms (or primary set of arms) become wings that can't hold items or wield weapons, and you drop anything held in them. You gain a wing unarmed attack dealing 1d8 fire damage with the backswing, reach and unarmed traits. On a critical hit, the target takes 2 persistent electricity damage.

  **Heightened (5th)** Wings deal 2d8 fire damage and 4 persistent electricity damage on a critical hit. The duration is 5 minutes.

  **Heightened (7th)** Wings deal 3d8 fire damage and 6 persistent electricity damage on a critical hit. The duration is 1 hour.

  **Heightened (9th)** Wings deal 4d8 fire damage and 8 persistent electricity damage on a critical hit. The duration is 8 hours.
spells.sleep.description: |-
  Each creature in the area becomes drowsy and may nod off. A creature that falls unconscious from the spell doesn't fall prone or release what it holds. The spell doesn't stop creatures waking from a successful Perception check, limiting its use in combat.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes a -1 status penalty to Perception checks for 1 round.

  **Failure** The creature falls unconscious, waking automatically after 1 minute.

  **Critical Failure** The creature falls unconscious, waking automatically after 1 hour.

  **Heightened (4th)** Creatures are unconscious for 1 round on a failure or 1 minute on a critical failure. They fall prone, release what they hold, and can't attempt Perception checks to wake. When the duration ends they're sleeping normally instead of waking automatically.
spells.slice-reality.description: |-
  You slice through reality, forming a chasm of life-draining entropy in a straight line 20 feet high, 120 feet long and 2 inches thick. The chasm provides cover. It deals 7d8 void damage (basic Reflex save) to each creature in its space when created, that tries to pass through, or that ends its turn inside. A creature that succeeds on the save when the chasm is created is pushed to the nearest space on the side of its choice. A creature that critically fails when trying to move through fails to do so, ending its movement next to the chasm.

  **Heightened (+1)** The damage increases by 1d8.
spells.slow.description: |-
  You dilate time around the target, slowing its actions.

  **Critical Success** The target is unaffected.

  **Success** The target is slowed 1 for 1 round.

  **Failure** The target is slowed 1 for 1 minute.

  **Critical Failure** The target is slowed 2 for 1 minute.

  **Heightened (6th)** You can target up to 10 creatures.
spells.sonic-scream.description: |-
  A cathartic scream unleashes a rapid cone of vibrations, dealing 1d8 sonic damage to creatures in the area with a basic Fortitude save. A creature that fails is also sickened 1.

  **Heightened (+1)** The damage increases by 1d8.
spells.soothe.description: |-
  You grace the target's mind, boosting its mental defenses and healing its wounds. It regains 1d10+4 Hit Points when you Cast the Spell and gains a +2 status bonus to saves against mental effects for the duration.

  **Heightened (+1)** The healing increases by 1d10+4.
spells.soul-surge.description: |-
  You channel your life force into a spear of energy. You lose 6 Hit Points or, if you're in a bond with a vitality network that has at least 12 Hit Points, you can reduce the bond's Hit Points by 12 instead. Make a ranged spell attack against the target's AC. On a hit you deal 6d6 spirit damage; on a critical hit the target takes double damage and is drained 1.

  **Heightened (+1)** The damage increases by 2d6 and the Hit Points lost by 2 (or 4 if spent from a vitality network).
spells.sound-body.description: |-
  You send healing energy to restore the target's body. Attempt to counteract an effect of your choice imposing blinded, dazzled, deafened, enfeebled or sickened on the target. If you didn't counteract it but would have if its counteract rank were 2 lower, instead suppress it until the beginning of your next turn; its duration doesn't elapse while suppressed. This can't counteract or suppress curses, diseases, or conditions that are part of the target's normal state.

  **Heightened (4th)** Add drained and slowed to the conditions.

  **Heightened (8th)** Add stunned to the conditions.
spells.speak-with-animals.description: You can ask questions of, receive answers from, and use Diplomacy with animals. The spell doesn't make them friendlier than normal. Cunning animals tend to be terse and evasive, while less intelligent ones often make inane comments.
spells.speak-with-computers.description: |-
  You can ask questions of and receive answers from the synthetic spirits inhabiting a computer. They manifest in its code, often with personalities colored by the device's nature, condition, applications and settings. A computer's perspective and knowledge differ enough from a human's that it doesn't consider the same details important; it can mostly answer questions about creatures that interfaced with it in the past and what information is concealed in its files.

  **Heightened (6th)** The duration is 8 hours.
spells.stumble.description: |-
  A burst of microgravity causes a tremor around the target, pulling it toward the ground. The target attempts a Reflex save.

  **Failure** The target is off-guard for 1 round. If it was flying, swimming or floating, it falls 10 feet downward.

  **Critical Failure** The target falls prone. If it was flying, swimming or floating, it falls 20 feet downward.

  **Heightened (+1)** If the target falls, it falls an additional 5 feet on a failure and 10 feet on a critical failure.
spells.stupefy.description: |-
  You dull the target's mind, depending on its Will save.

  **Critical Success** The target is unaffected.

  **Success** The target is stupefied 1 until the start of your next turn.

  **Failure** The target is stupefied 2 for 1 minute.

  **Critical Failure** The target is stupefied 3 for 1 minute.
spells.carcinization.description: |-
  You manipulate the target's genetic code, pressuring it to become a crab. A willing target fully transforms into a crab, as if it had cast _animal form_ heightened to this spell's rank, with these statistics: Speed 25 feet, swim 15 feet; big claw 2d8 piercing; claw (agile) 2d4 piercing; breathes air and water.

  Unwilling targets attempt a Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target's body gains minor crab features, its appendages becoming claws, and it is clumsy 1.

  **Failure** The target becomes a partial crab-like being, clumsy 1, stupefied 1 and sickened 1.

  **Critical Failure** The target becomes a partial crab-like being, clumsy 2, stupefied 2 and sickened 2.
spells.subconscious-suggestion.description: |-
  You implant a subconscious suggestion for the target to follow when a trigger you specify occurs. The directive must seem a logical course of action to the target and can't be self-destructive or obviously against its self-interest. The target attempts a Will save.

  **Critical Success** The target is unaffected and knows you tried to control it.

  **Success** The target is unaffected and thinks you were just talking to it normally.

  **Failure** The suggestion stays in the target's subconscious until the next time you prepare. If the trigger occurs before then, the target immediately follows it. The effect lasts 1 minute, or until the target completes a finite suggestion or it becomes self-destructive or has other obvious negative effects.

  **Critical Failure** As failure, but the duration is 1 hour.

  **Heightened (9th)** You can target up to 10 creatures.
spells.subjective-reality.description: You convince yourself that another creature or object you can perceive within range is an illusion. For you, it becomes transparent and gives off no sound, smell or other sensory output. You can move through it and it through you. You gain resistance to all damage originating from it equal to your level. If you're targeted by or in the area of one of its abilities or effects, it must succeed at a DC 5 flat check or you're unaffected. You're immune to all its auditory, linguistic and scent-based attacks and effects. Your attacks deal no damage to it, and it's immune to your spells and other effects. You and it can still affect each other indirectly, such as through a minion's Strike or an environment altered by a quantum field. When the spell ends, the target is immune to _subjective reality_ for 24 hours.
spells.suggestion.description: |-
  Your honeyed words are hard to resist. You suggest a course of action to the target, phrased to seem logical to it and not self-destructive or obviously against its self-interest. The target attempts a Will save.

  **Critical Success** The target is unaffected and knows you tried to control it with a spell.

  **Success** The target is unaffected.

  **Failure** The target immediately follows your suggestion. The spell lasts 1 minute, or until the target completes a finite suggestion or it becomes self-destructive or has other obvious negative effects.

  **Critical Failure** As failure, but the base duration is 1 hour.

  **Heightened (8th)** You can target up to 10 creatures.
spells.summon-animal.description: |-
  You summon a creature with the animal trait and a level of -1 to fight for you.

  **Heightened** As listed in the summon trait.
spells.summon-celestial.description: |-
  You summon a creature with the celestial trait and a level of 5 or lower to fight for you. The GM might decide your deity restricts which celestials you can summon.

  **Heightened** As listed in the summon trait.
spells.summon-construct.description: |-
  You summon a creature with the construct trait and a level of -1 to fight for you.

  **Heightened** As listed in the summon trait.
spells.summon-dragon.description: |-
  You summon a creature with the dragon trait and a level of 5 or lower to fight for you. If the dragon has a magical tradition trait (arcane, divine, occult or primal), you can summon it only if you cast the spell using that tradition.

  **Heightened** As listed in the summon trait.
spells.summon-elemental.description: |-
  You summon a creature with the elemental trait and a level of 1 or lower to fight for you.

  **Heightened** As listed in the summon trait.
spells.summon-entity.description: |-
  You summon a creature with the aberration trait and a level of 5 or lower to fight for you.

  **Heightened** As listed in the summon trait.
spells.summon-fey.description: |-
  You summon a creature with the fey trait and a level of -1 to fight for you.

  **Heightened** As listed in the summon trait.
spells.adhere.description: |-
  You create a molecular bond between an unattended object you touch (or hold) and another object or surface it touches. Pulling it free requires a successful Athletics check against your spell DC to Force Open.

  If you instead touch an unoccupied 5-foot square, that surface becomes charged with adhering magic and the space becomes greater difficult terrain.
spells.summon-fiend.description: |-
  You summon a creature with the fiend trait and a level of 5 or lower to fight for you. The GM might decide your deity restricts which fiends you can summon (a patron archdevil might allow devils but not other fiends).

  **Heightened** As listed in the summon trait.
spells.summon-giant.description: |-
  You summon a creature with the giant trait and a level of 5 or lower to fight for you.

  **Heightened** As listed in the summon trait.
spells.summon-monitor.description: |-
  You summon a creature with the monitor trait and a level of 5 or lower to fight for you. The GM might decide your deity restricts which monitors you can summon (a deity might forbid psychopomps, say).

  **Heightened** As listed in the summon trait.
spells.summon-plant-or-fungus.description: |-
  You summon a creature with the plant or fungus trait and a level of -1 to fight for you.

  **Heightened** As listed in the summon trait.
spells.summon-robot.description: |-
  You summon a creature with the tech trait and a level of -1 to fight for you.

  **Heightened** As listed in the summon trait.
spells.summon-undead.description: |-
  You summon a creature with the undead trait and a level of -1 to fight for you.

  **Heightened** As listed in the summon trait.
spells.supercharge-weapon.description: |-
  You condense ambient magical energy to power up a weapon. Its next Strike is supercharged, dealing an additional 1d6 damage of the weapon's normal damage type.

  **Heightened (+2)** The extra damage increases by 1d6.
spells.sure-footing.description: |-
  You free the target's limbs from ailments that impede mobility. Attempt to counteract an effect of your choice imposing clumsy, grabbed or paralyzed on the target. If you didn't counteract it but would have if its counteract rank were 2 lower, instead suppress it until the beginning of your next turn; its duration doesn't elapse while suppressed. This can't counteract or suppress curses, diseases, or conditions that are part of the target's normal state.

  **Heightened (4th)** Add immobilized, restrained and slowed to the conditions.

  **Heightened (6th)** Add petrified.

  **Heightened (8th)** Add stunned.
spells.caustic-blast.description: |-
  You fling a glob of acid that detonates, spraying nearby creatures for 1d8 acid damage with a basic Reflex save; on a critical failure a creature also takes 1 persistent acid damage.

  **Heightened (+2)** The initial damage increases by 1d8 and the persistent damage by 1.
spells.sure-strike.description: A glimpse of the future ensures your next blow strikes true. The next time you make an attack roll before the end of your turn, roll twice and use the better result. The attack ignores circumstance penalties to the attack roll and any flat check required because the target is concealed or hidden. You are then temporarily immune to _sure strike_ for 10 minutes.
spells.synaptic-pulse.description: |-
  A pulsating mental blast penetrates the minds of all enemies in the area, each attempting a Will save.

  **Critical Success** The creature is unaffected.

  **Success** The creature is stunned 1.

  **Failure** The creature is stunned 2.

  **Critical Failure** The creature is stunned for 1 round.
spells.tailwind.description: |-
  You gain a +10-foot status bonus to your Speed.

  **Heightened (2nd)** The duration is 8 hours.
spells.telekinetic-haul.description: You move the target up to 20 feet, possibly suspending it in midair. When you Sustain the spell, you can move it again, or shift your focus to a different eligible target within range and move that instead.
spells.telekinetic-strangulation.description: You telekinetically grip a creature's throat or similar vital anatomy, lifting it a few inches off the ground as it struggles to breathe. Make a ranged spell attack against its AC. On a hit you deal 6d12 bludgeoning damage and the target is immobilized; while so immobilized it must hold its breath or begin suffocating. The first time each round you Sustain the spell, the target takes 1d12 bludgeoning damage, stays immobilized and must keep holding its breath. It can attempt to Escape (DC is your spell DC; the incapacitation trait applies).
spells.caustic-conversion.description: |-
  You launch a torrent of magical nanites that dissolve your target. Make a ranged spell attack. On a hit you deal 3d8 acid damage plus 1d6 persistent acid damage; on a critical hit the initial damage (not the persistent) is doubled.

  **Heightened (+2)** The initial damage increases by 2d8 and the persistent damage by 1d6.
spells.telekinetic-tantrum.description: |-
  You launch a barrage of psychokinetic energy. When you Cast the Spell and the first time each round you Sustain it, choose one effect; you can't choose the same one twice in a row.

  - **Back Off!** Hurl up to 15 objects or creatures up to 40 feet in any direction (including up or down), up to 40 Bulk total per creature or object. Creatures take bludgeoning damage based on the distance moved and land prone, as though they'd taken falling damage. Creatures that succeed on a Fortitude save against the spell aren't moved.
  - **Hard Rain** Pummel all creatures in the area with debris, dealing 5d10 bludgeoning damage with a basic Reflex save.
  - **Psychokinetic Slam** Slam your psychokinetic storm into all creatures in the area. Make a ranged spell attack roll; each target you hit takes 7d6 force damage and is stunned 1.
spells.telepathy.description: |-
  You can communicate telepathically with creatures within 30 feet. Once you establish a connection by communicating with a creature, the communication is two-way. You can communicate only with creatures that share a language with you.

  **Heightened (6th)** You can communicate using shared mental imagery even without a shared language; the spell loses the linguistic trait.
spells.temporal-bullets.description: You rewind time and adjust probability so an attack that just missed still damages its target. Roll damage as though the Strike hit, but the target takes only half. You are then immune to _temporal bullets_ for 10 minutes.
spells.thunderstrike.description: You call down a tendril of lightning that cracks with thunder, dealing 1d12 electricity and 1d4 sonic damage to the target with a basic Reflex save. A target wearing metal armor or made of metal takes a -1 circumstance penalty to its save, and if damaged is clumsy 1 for 1 round.
spells.times-edge.description: |-
  You refract latent temporal energy into your plane as a massive blade, dealing 5d6 slashing damage to all creatures in the area as time races through a thin slice of their bodies. Each attempts a Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is sickened 1.

  **Critical Failure** The creature takes double damage and is sickened 2.

  **Heightened (+1)** The damage increases by 2d6.
spells.toxic-cloud.description: |-
  You conjure a poisonous fog. It works as mist, except the area moves 10 feet away from you each round. A breathing creature that starts its turn in the area takes 6d8 poison damage with a basic Fortitude save. You can Dismiss the spell.

  **Heightened (+1)** The damage increases by 1d8.
spells.translocate.description: |-
  You instantly transport yourself and your worn and held items to an unoccupied space within range you can see. If this would bring another creature along, even one carried in an extradimensional container, the spell is lost.

  **Heightened (5th)** The range is 1 mile. You needn't see the destination if you've been there before and know its relative location and distance. You are then temporarily immune for 1 hour.
spells.true-target.description: You delve into the possible futures of the next few seconds to learn how your foe might avoid harm, then cast that vision to those around you. Designate a creature. The first time each target makes an attack roll against it during the duration, the attacker rolls twice and uses the better result, and ignores circumstance penalties to the roll and any flat check required because the designated creature is concealed or hidden.
spells.cellular-stimulant.description: |-
  You stimulate the target at a cellular level, giving it a burst of energy with an exhausting toll. The target is quickened and can use the extra action to Stride or Strike. After that round ends, it is fatigued until it rests for 10 minutes.

  **Heightened (6th)** You can target up to six creatures by Casting the Spell with 2 actions.
spells.truesight.description: You see things within 60 feet as they really are. The GM rolls a secret counteract check against any illusion, morph or polymorph effect in the area, only to determine whether you see through it (if it succeeds against a polymorph spell you see the creature's true form, but the polymorph doesn't end).
spells.uncontrollable-dance.description: |-
  The target is overcome with an urge to dance. For the duration it is off-guard and can't use reactions, and can't use move actions except to dance, using Stride to move up to half its Speed.

  **Critical Success** The target is unaffected.

  **Success** The duration is 3 rounds and the target must spend at least 1 action each turn dancing.

  **Failure** The duration is 1 minute and the target must spend at least 2 actions each turn dancing.

  **Critical Failure** The duration is 1 minute and the target must spend all its actions each turn dancing.
spells.unfettered-movement.description: You repel hindrances. The target ignores effects that would give it a circumstance penalty to Speed. When it tries to Escape an effect that has it immobilized, grabbed or restrained, it automatically succeeds unless the effect is magical and of a higher rank than _unfettered movement_.
spells.unfettered-pack.description: |-
  You free your travelling companions from environmental hindrances. Targets take no circumstance penalties to Speed from vegetation, rubble, winds or other environmental properties, and ignore difficult terrain from them.

  **Heightened (9th)** The targets also ignore greater difficult terrain from environmental properties.
spells.vapor-form.description: The target becomes amorphous and vaporous. It loses any item bonus to AC and all other effects and bonuses from armor, and uses its proficiency modifier for unarmored defense. It gains resistance 8 to physical damage and immunity to precision damage, a fly Speed of 10 feet, and can slip through tiny cracks. It can't cast spells, activate items, or use actions with the attack or manipulate trait. The target can Dismiss the spell.
spells.veil-of-privacy.description: You erect wards that make the target hard to detect by magic. _Veil of privacy_ attempts to counteract all detection, revelation and scrying effects used against the target or its gear for the duration, counting cantrips as 1st-rank spells. Counteracting a spell that targets an area or multiple targets negates its effects only for the veil's target.
spells.verdant-code.description: Flowering vines or other plant matter burst from an unattended tech object, filling a 20-foot burst. Whenever a creature starts its turn in the area it takes 2d6 piercing damage (basic Reflex save); on a critical failure it is also immobilized for 1 round or until it Escapes against your spell DC. The growth covers the object, so physically accessing it for the duration requires a successful DC 5 flat check.
spells.chain-lightning.description: |-
  You discharge lightning at the target, dealing 8d12 electricity damage (basic Reflex save). It then arcs to another creature within 30 feet of the first, then another within 30 feet of that one, and so on; you can end the chain at any point. You can't target a creature twice and need line of effect to all targets. Roll damage once and apply it to each target, halved or doubled per its save. The chain ends if any target critically succeeds.

  **Heightened (+1)** The damage increases by 1d12.
spells.vibe-check.description: |-
  You psychically project an intense emotion into a creature's mind. The target attempts a Will save. On a failure it experiences your choice of emotion below; if you pick anger or joy the spell gains the incapacitation trait.

  - **Anger** On its next turn, the target spends its first action to attack the nearest creature, even an ally.
  - **Joy** The target can't take hostile actions.
  - **Fear** The target is frightened 2.
  - **Sorrow** The target is slowed 1 and bursts into tears.

  **Heightened (4th)** The spell affects all creatures in a 20-foot burst, all with the same emotion.
spells.vision-of-death.description: |-
  You force the target to see a vision of its own death, dealing 8d6 mental damage with a Will save. If this reduces the target to 0 HP, the vision becomes real and kills it instantly.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage and is frightened 1.

  **Failure** The target takes full damage and is frightened 2.

  **Critical Failure** The target takes double damage, is frightened 4, and is fleeing as long as it's frightened.

  **Heightened (+1)** The damage increases by 2d6.
spells.void-scour.description: |-
  A well of desolate darkness scours all life, dealing 10d10 void damage to all living creatures in the area, each attempting a Reflex save. If it overlaps an area of magical light or affects a creature under magical light, it attempts to counteract the light effect.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and 1d6 persistent void damage, and is drained 1.

  **Critical Failure** The creature takes double damage and 2d6 persistent void damage, and is drained 2.

  **Heightened (+1)** The initial damage increases by 2d10; the persistent damage increases by 1d6 on a failure or 2d6 on a critical failure.
spells.void-seed.description: |-
  You plant a seed of entropy in a creature, which gains void healing. If a non-void effect with the healing trait would heal it, it takes damage instead. An unwilling target can attempt a Will save to negate the effects.

  **Heightened (5th)** You can target up to six living creatures.
spells.void-vessel.description: You let creatures survive in a vacuum. Targets gain the cosmic trait and sprout wings of shimmering energy granting a fly Speed of 30 feet; the wings work only in a vacuum.
spells.void-warp.description: |-
  You call on void energy to harm life force. The target takes 2d4 void damage with a basic Fortitude save; on a critical failure it is also enfeebled 1 until the start of your next turn.

  **Heightened (+1)** The damage increases by 1d4.
spells.void-whispers.description: |-
  The target hears ominous sounds carrying unspeakable mysteries from beyond the stars. It attempts a Will save.

  **Critical Success** The creature is unaffected.

  **Success** The target is stupefied 1 for 1 round.

  **Failure** The target wanders aimlessly, using each action to Step in a random direction by the safest route, never entering hazardous terrain. The spell lasts 1 minute or until a creature uses a hostile action against the target.

  **Critical Failure** As failure, but the target babbles incoherently. A creature that begins its turn within 20 feet of it attempts a Will save; on a failure it must use its first action on its next turn to Step in a random direction and becomes immune to the spell for 24 hours. This is an incapacitation effect.
spells.charm.description: |-
  To the target your words are honey and your visage is bathed in a dreamy haze. It attempts a Will save, with a +4 circumstance bonus if you or your allies recently threatened it or used hostile actions against it. You can Dismiss the spell. If you use hostile actions against the target, the spell ends. The target needn't realize it was charmed when the spell ends unless the friendship or actions clash with its expectations, so you might keep its friendship by mundane means.

  **Critical Success** The target is unaffected and aware you tried to charm it.

  **Success** The target is unaffected but thinks your spell was something harmless, unless it identifies the spell.

  **Failure** The target's attitude becomes friendly (helpful if it was friendly) and it can't use hostile actions against you.

  **Critical Failure** The target's attitude becomes helpful and it can't use hostile actions against you.

  **Heightened (4th)** The duration lasts until your next daily preparations.

  **Heightened (8th)** As 4th rank, and you can target up to 10 creatures.
spells.wall-of-fire.description: |-
  You raise a blazing wall: either a 5-foot-thick straight wall up to 60 feet long and 10 feet high, or a 5-foot-thick ring of 10-foot radius with the same height. It stands vertically and can be shorter or lower if you wish. Everything on each side is concealed from creatures on the other. A creature that crosses the wall or occupies its area at the start of its turn takes 4d6 fire damage.

  **Heightened (+1)** The fire damage increases by 1d6.
spells.wall-of-force.description: |-
  You form an invisible wall of pure force up to 50 feet long and 20 feet high, with no discernible thickness. You must create it in an unbroken open space so its edges don't pass through creatures or objects, or the spell is lost. It has AC 10, Hardness 30 and 60 Hit Points, and is immune to critical hits and precision damage. It blocks physical effects, and as force it blocks incorporeal and ethereal creatures too. Teleportation and visual effects pass through.

  _Wall of force_ is immune to effects of its rank or lower that try to counteract it, and is automatically destroyed by _disintegrate_ of any rank.

  **Heightened (+2)** The wall's Hit Points increase by 20.
spells.wall-of-plasma.description: |-
  You shape a wall of crackling plasma: either a 5-foot-thick straight wall up to 60 feet long and 10 feet high, or a 5-foot-thick ring of 10-foot radius with the same height. It stands vertically and can be shorter or lower if you wish. Everything on each side is concealed from creatures on the other. A creature that crosses the wall or occupies its area at the start of its turn takes 4d6 fire damage and 2d6 persistent electricity damage.

  **Heightened (+1)** The persistent electricity damage increases by 1d6.
spells.wall-of-steel.description: |-
  You shape a 4-inch-thick wall of solid steel up to 120 feet long and 20 feet high. You can shape its path, placing each 5 feet on the border between squares, and it needn't stand vertically (a bridge or stairs, say). You must conjure it in an unbroken open space so its edges don't pass through creatures or objects, or the spell is lost.

  Each 10-foot-by-10-foot section has AC 10, Hardness 18 and 60 Hit Points, and is immune to critical hits and precision damage. A destroyed section can be moved through, but its rubble is difficult terrain.

  **Heightened (+1)** Each section's Hit Points increase by 15.
spells.wall-of-stone.description: |-
  You shape a 1-inch-thick wall of solid stone up to 120 feet long and 20 feet high. You can shape its path, placing each 5 feet on the border between squares, and it needn't stand vertically (a bridge or stairs, say). You must conjure it in an unbroken open space so its edges don't pass through creatures or objects, or the spell is lost.

  Each 10-foot-by-10-foot section has AC 10, Hardness 14 and 50 Hit Points, and is immune to critical hits and precision damage. A destroyed section can be moved through, but its rubble is difficult terrain.

  **Heightened (+2)** Each section's Hit Points increase by 15.
spells.wall-of-thorns.description: |-
  You grow a 5-foot-thick wall of thorny brambles in a straight line up to 60 feet long and 10 feet high, standing vertically (shorter or lower if you wish). You must create it in an unbroken open space so its edges don't pass through creatures or objects, or the spell is lost. Everything on each side has cover from creatures on the other, and the wall's spaces are difficult terrain. For each move action a creature uses to enter at least one of the wall's spaces, it takes 3d4 piercing damage.

  Each 10-foot-by-10-foot section has AC 10, Hardness 10 and 20 Hit Points, and is immune to critical hits and precision damage. A destroyed section can be moved through freely.

  **Heightened (+1)** Each section's Hit Points increase by 5 and the piercing damage by 1d4.
spells.wall-of-wind.description: |-
  You create a barrier of gusting winds 5 feet thick, 60 feet long and 30 feet high. It stands vertically but you can shape its path. It distorts the air but doesn't hamper sight. Effects:

  - Ammunition from physical ranged attacks (bolts, bullets, grenades and similar-size objects) can't pass through. Attacks with bigger ranged weapons, such as thrown spears, take a -2 circumstance penalty to attack rolls if their path crosses the wall. Massive ranged weapons and spell effects that create no physical objects pass through with no penalty.
  - It is difficult terrain for creatures moving overland through it. Gases, including creatures in _vapor form_, can't pass through.
  - A creature that tries to fly through it with a move action attempts a Fortitude save.

  **Critical Success** The creature moves through the wall normally this turn.

  **Success** The flying creature can move through this turn, but the wall is difficult terrain.

  **Failure** The wall stops the flying creature's movement and any remaining movement from that action is wasted.

  **Critical Failure** As failure, and the creature is pushed 10 feet away from the wall.
spells.warp-mind.description: |-
  You scramble a creature's mental faculties and sensory input. The target attempts a Will save and, whatever the result, is then temporarily immune for 10 minutes. The effects happen instantly, so _dispel magic_ and other effects that counteract spells can't counteract them, but wish rituals and abilities that remove non-magical effects can.

  **Critical Success** The target is unaffected.

  **Success** The target spends the first action on its next turn confused.

  **Failure** The target is confused for 1 minute.

  **Critical Failure** The target is confused permanently.
spells.wave-of-despair.description: |-
  You inflict despair on creatures in the area; each attempts a Will save.

  **Critical Success** The creature is unaffected.

  **Success** For 1 round the creature can't use reactions and attempts another save at the start of its turn; on a failure it is slowed 1 for that turn as it sobs uncontrollably.

  **Failure** As success, but the duration is 1 minute.

  **Critical Failure** As failure, and the creature is automatically slowed 1 for 1 minute.

  **Heightened (7th)** The area is a 60-foot cone.
spells.wave-of-warning.description: |-
  You deter enemies with a wave of hostile intent. The target takes 7d8 nonlethal mental damage and attempts a Will save. The psychic energy then arcs to another creature within 30 feet of the first, then another within 30 feet of that one, and so on; you can end it at any point. You can't target a creature twice and need line of effect to all targets. Roll damage once and apply it to each target, halved or doubled per its save.

  **Critical Success** The target is unaffected and the wave ends with it.

  **Success** The target takes half damage.

  **Failure** The target takes full damage and is frightened 1.

  **Critical Failure** The target takes double damage and is frightened 2.

  **Heightened (+1)** The damage increases by 2d8.
spells.weight-of-ages.description: |-
  You burden a creature's body and mind with a lifetime's pains and sorrows, dealing 3d8 bludgeoning and 3d8 mental damage. The target attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage.

  **Failure** The target takes full damage and is encumbered for 1 round.

  **Critical Failure** The target takes double damage and is encumbered for 1 minute.

  **Heightened (+1)** The mental damage increases by 2d8.
spells.wisp-ally.description: |-
  You summon a Tiny bouncing wisp of light near your target. It takes up no space, grants no flanking and has no other creature attributes. It sheds bright light in a 10-foot radius. When you Cast the Spell and each time you Sustain it, the wisp tries to distract the target, which must succeed at a Will save or be off-guard until the start of your next turn. A creature that critically succeeds is immune to _wisp ally_ for 1 hour.

  **Heightened (+1)** You create one additional wisp, each with a different target; all attempt to distract their targets at the same time when you cast or Sustain the spell.
spells.x-ray-vision.description: You see through most materials and walls within 60 feet, in black and white only. Your sight is blocked by 2 feet of wood or plastic, 1 foot of stone, 2 inches of common metal, or any amount of lead or any starmetal.
spells.akashic-fount.description: You open the target's mind to the akashic record, drawing in feelings, memories and knowledge from that astral repository. Choose one Lore skill; the target temporarily gains the same proficiency rank in it as your proficiency rank in Occultism.
spells.akashic-assistant.description: You summon a projection of an etheric librarian-scribe from the akashic record to help the target. It floats next to the target, takes up no space, and prepares to Aid it as though it had its own reaction, using a bonus equal to your Occultism modifier for its Aid rolls whatever the skill. Each of your turns it prepares to Aid again. You can use a free action with the concentrate trait to redirect it to a different creature, changing the spell's target; otherwise it keeps aiding the same creature.
spells.data-drain.description: |-
  You leech memories and conscious thoughts from the target's mind and convert them into astral data you can analyze as if the psyche were laid out in computer code, dealing 10d6 mental damage with a basic Will save.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage and is stupefied 1 until the end of your current turn.

  **Failure** The target takes full damage and is stupefied 1 until the end of your next turn. You Recall Knowledge about the target.

  **Critical Failure** As failure, but the target takes double damage and is stupefied 1 for 1 minute.

  **Heightened (+1)** The mental damage increases by 2d6.
spells.chrono-push.description: |-
  You push a creature across the battlefield so hard it slides through time. Make a ranged spell attack. On a hit, you knock the target back 15 feet in a straight line (30 feet on a critical hit); contact with a solid barrier or another creature ends the movement. At the end it reenters the flow of time with a burst of temporal energy: the target and creatures adjacent to it take 7d8 force damage with a basic Reflex save.

  **Heightened (+1)** The damage increases by 1d8.
spells.elemental-weapon.description: |-
  You create an advanced, martial or simple weapon of elemental energy in the hands of a bonded creature. Choose an elemental trait for it: air, earth, fire, metal, water or wood. The weapon is tactical grade, fully charged and loaded with basic ammunition, and can't be made of special materials. It has one fewer upgrade slot but can take any upgrades you hold as a locus when casting, which are inert until the spell ends. It deals normal damage plus 1d4 of a type set by the trait: electricity (air), bludgeoning (earth), fire (fire), acid (metal), cold (water) or poison (wood).

  **Heightened (2nd)** You can create an advanced weapon.

  **Heightened (5th)** You can create a superior weapon.

  **Heightened (6th)** You can create an elite weapon.

  **Heightened (8th)** You can create an ultimate weapon.

  **Heightened (9th)** You can create a paragon weapon.
spells.elemental-barrier.description: |-
  A barrier of elemental energy surrounds the target. Choose an elemental trait (air, earth, fire, metal, water or wood); the spell gains it. The target gets a +1 circumstance bonus to AC and, while the spell lasts, can use Shield Block as if the barrier were a raised shield.

  The barrier has Hardness 6 and 40 HP, and resistance 2 to a damage type set by the trait: electricity or sonic (air), bludgeoning or piercing (earth), acid or slashing (metal), fire (fire), cold (water), poison (wood). Unlike a normal Shield Block, its reaction works against spells with the chosen elemental trait cast against the creature.

  **Heightened (5th)** The barrier has 48 HP.

  **Heightened (6th)** Hardness 8 and 52 HP.

  **Heightened (7th)** Hardness 8 and 60 HP.

  **Heightened (8th)** Hardness 10 and 68 HP.

  **Heightened (9th)** Hardness 10 and 80 HP.
spells.elemental-nova.description: |-
  A blast of elemental energy erupts around your targets. Choose an elemental trait (air, earth, fire, metal, water or wood); the spell gains it. It deals 11d6 damage of a type set by the trait: electricity or sonic (air), bludgeoning or piercing (earth), acid or slashing (metal), fire (fire), cold (water), poison (wood).

  **Heightened (+1)** The damage increases by 2d6.
spells.infusion.description: |-
  You infuse the target's essence with healing energy. A willing target regains 1d6 Hit Points and is then temporarily immune for 10 minutes. The actions you spend determine targets, range and area.

  - **Single action** Range touch.
  - **Two actions** Range 30 feet. A healed creature regains 6 more Hit Points.
  - **Three actions** You heal all bonded creatures in a 30-foot emanation.

  **Heightened (+1)** The healing increases by 1d6 and the extra healing for 2 actions by 6.
spells.vitality-nova.description: |-
  You release a burst of condensed vitality energy as healing light. Spend any number of Hit Points from your vitality network; all creatures in the area regain 1 Hit Point for every 2 spent. Treat this as a use of Transfer Vitality.

  - Spend 20 or more and cast in magical darkness: the spell attempts to counteract the darkness.
  - Spend 40 or more: healed creatures can attempt a DC 10 flat check to end persistent bleed damage.
  - Spend 60 or more: end all persistent damage on healed creatures.
spells.vital-rebirth.description: Your network catches the soul of a bonded creature before it departs and resuscitates the body with a jolt of energy. You prevent the target from dying and Transfer Vitality to the triggering ally. The target is then immune to _vital rebirth_ for 24 hours. It has no effect if the trigger was _disintegrate_, _promession_ or a death effect. You must have at least 1 Hit Point in your vitality network to cast it.
spells.anthem.description: You compose cosmic melodies into an anthem for your bonded companions. All bonded creatures in the area gain a +1 status bonus to attack and damage rolls and a +1 status bonus to saves against effects that cause fascinated or confused.
spells.shuffle-repeat.description: You repeat one creature's personal anthem to empower it. The target's Strikes deal an additional die of sonic damage, and it gains a +1 status bonus to Will saves and Will DCs.
spells.remix.description: |-
  You remix the cosmic song into a dance beat. The target is quickened and can use the extra action to Interact, Stride or Step.

  **Heightened (7th)** You can target up to 6 bonded creatures.
spells.shadow-snap.description: |-
  You beckon the target's shadow to obey. When you Cast the Spell, and the first time you Sustain it each turn on later rounds, choose to attack or stalk with the shadow.

  - **Attack** Make a spell attack roll against the target's AC, dealing 1d10 cold damage on a hit (double on a critical hit). It uses and counts toward your multiple attack penalty.
  - **Stalk** Until the end of your next turn, the first time the target uses a manipulate or move action, makes a ranged attack, or leaves a square during a move action, make a spell attack roll against its AC, dealing 1d10 cold damage on a hit. On a critical hit, the shadow disrupts that action.

  **Heightened (+1)** The cold damage increases by 1d10.
spells.clairaudience.description: You create an invisible floating ear at a location within range, even outside your line of sight or effect. It can't move, but you hear through it as if using your normal hearing.
spells.cloying-shadows.description: |-
  You command shadows to writhe and rebel against their owners, dealing 6d6 cold damage to each creature in the area, who attempts a save.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage.

  **Failure** The target takes full damage and is sickened 1.

  **Critical Failure** The target takes double damage and is sickened 2.

  **Heightened (+1)** The cold damage increases by 2d6.
spells.shadow-prison.description: |-
  Memories of the target's resentment and regret engorge its shadow until it can swallow the target whole. The target attempts a Will save, then is immune to the spell for 1 minute.

  **Critical Success** The target is unaffected.

  **Success** The target resists before being swallowed, but shadowy tendrils cling to it, leaving it slowed 1 for 1 round.

  **Failure** The target is swallowed by its shadow until the beginning of your next turn. It is invisible and paralyzed, can't experience or interact with the outside world, and can't be targeted by attacks or other effects.

  **Critical Failure** As failure, but the target is swallowed for 1 minute.
spells.eldritch-bond.description: |-
  You channel mysterious power from beyond the known universe to infuse a bonded creature with the essence of an eldritch creature. The target gains up to two of these abilities:

  - Darkvision.
  - Mental resistance equal to half its level (minimum 1).
  - A tentacle unarmed attack dealing 1d8 bludgeoning damage.
  - A stinger unarmed attack dealing 1d6 acid damage, with the agile and finesse traits.
  - A beam ranged unarmed attack, range increment 40 feet, dealing 1d6 mental damage.
  - 10-foot reach on all melee attacks (including the above).
  - Melee Strikes (including the above) affect incorporeal creatures as if they had the ghost killer upgrade.

  **Heightened (3rd)** The attacks' damage is 2 dice.

  **Heightened (4th)** Up to 5 targets; damage is 2 dice.

  **Heightened (6th)** Up to 5 targets; damage is 3 dice.

  **Heightened (9th)** Up to 5 targets; damage is 4 dice.
spells.vitality-web.description: |-
  Your network briefly manifests as a web of vital energy connecting the members of your bond. Each target gains fast healing 8. When you Cast the Spell and the first time each round you Sustain it, the targets gain 16 temporary Hit Points that last 1 round.

  **Heightened (+1)** The number of targets and the fast healing increase by 1, and the temporary Hit Points by 2.
spells.wild-bond.description: |-
  You infuse the target with the essence of another living creature, granting one of these abilities:

  - A burrow Speed of 15 feet.
  - A climb Speed of 20 feet.
  - A fly Speed of 20 feet.
  - A swim Speed of 25 feet.
  - A Speed of 40 feet.
  - A jaw unarmed attack dealing 1d8 piercing damage.
  - A claw unarmed attack dealing 1d6 slashing damage, with the agile and finesse traits.
  - Darkvision.

  **Heightened (3rd)** The attacks' damage is 2 dice.

  **Heightened (5th)** Up to 5 targets; damage is 2 dice.

  **Heightened (6th)** Up to 5 targets; damage is 3 dice.

  **Heightened (9th)** Up to 5 targets; damage is 4 dice.
spells.warp-probability.description: You read the underlying probability of the multiverse. Reroll the failed check and take the better result.
spells.alternate-outcome.description: You reject the outcome for a being in your current existence and replace it with one from a different reality. The target rerolls the triggering saving throw and uses the worse result.
spells.quantum-analysis.description: |-
  You see the probability equations around you, tracing each variable to every possible conclusion. For the duration, creatures you target can't benefit from circumstance bonuses to AC from cover against your attacks. You also ignore circumstance penalties to the attack roll and any flat check required because the creature is concealed, hidden or behind cover. You can cast spells that target creatures within your quantum field even without line of sight to them.

  The first time after casting you make an attack roll against a creature within your quantum field during the duration, roll twice and use the better result. This effect has the fortune trait.
spells.warp-terrain.description: |-
  You materialize terrain features from another reality within your quantum field. Choose one effect, which lasts as long as your quantum field remains active, until you cast _warp terrain_ again, or until you dismiss the spell.

  - The field's area becomes difficult terrain, with an appearance you choose. You and your allies move through it normally and can Take Cover using its features.
  - You suppress terrain in the field, turning difficult or greater difficult terrain to normal. This doesn't apply to effects that make a creature count squares as difficult terrain. To suppress terrain created by a spell or other magical effect, you must successfully counteract it.

  **Heightened (3rd)** You can instead fill the field with fog, smoke or another phenomenon that obscures vision, working as mist, or suppress one of these effects in the field.

  **Heightened (6th)** You can make the field greater difficult terrain, or suppress greater difficult terrain.
spells.warp-world.description: |-
  You recreate a powerful event from another world in your current reality. All creatures in the area attempt a Fortitude save. Roll 1d6 for the damage and effects:

  1. **Supernova** An exploding sun deals 4d12 fire damage and 1d6 persistent electricity damage. On a critical failure, double damage and dazzled for 1 round.
  2. **Earthquake** The ground shakes, dealing 4d12 bludgeoning damage. On a critical failure, double damage and knocked prone.
  3. **Inferno** A volcanic eruption or firestorm deals 4d12 fire damage; everything in the aura is concealed by smoke for 1 round. On a critical failure, double damage and sickened 1.
  4. **Eldritch Storm** A tempest of psychic energy deals 4d12 sonic damage and 1d6 persistent mental damage. On a critical failure, double damage and confused for 1 round.
  5. **Flash Freeze** A storm from an arctic planet deals 4d12 cold damage. On a critical failure, double damage and slowed 1 for 1 round.
  6. **Radioactive Blast** The echo of a nuclear reaction deals 4d12 bludgeoning damage and 1d6 persistent fire damage. On a critical failure, double damage, 1d6 persistent poison damage, and fatigued while the persistent poison lasts.

  **Heightened (+1)** Damage increases by 1d12 and persistent damage by 1d6.
spells.clairvoyance.description: You create an invisible floating eye at a location within range, even outside your line of sight or effect. It can't move, but you see in all directions from that point as if using your normal vision.
spells.parallel-forms.description: |-
  You split into two versions with different fates. Each version Strides from your current space, then takes a single action. If both are attacks, they must target different creatures and use the same multiple attack penalty, counting as one attack toward it. Each round you Sustain the spell, your forms share actions and use the same bonuses and penalties, including multiple attack penalty. Damage to either form applies to your current Hit Points, but damage from the same effect hitting both forms (such as area damage) applies once. For a save affecting both forms, take the worse result for both. When the spell ends, you choose one form as your actual form and the other disappears. The spell ends automatically if you're reduced to 0 Hit Points.

  **Heightened (8th)** Your forms are quickened and can use the extra action to Step, Stride or Strike.
spells.warp-presence.description: |-
  Your presence flickers in the target's mind as though you had disappeared. The triggering creature attempts a Will save.

  **Success** You are concealed against its attacks for 1 round, including the triggering attack. If already concealed, you become undetected instead.

  **Failure** The triggering attack misses. You are undetected to the creature for 1 round; if you use a hostile action, this ends after the action completes.

  **Critical Failure** The triggering attack misses. You are undetected to the creature for 1 minute; if you use a hostile action, this ends after the action completes.
spells.forget.description: |-
  You make creatures temporarily forget the target. It is invisible while within your quantum field and memories of it are erased or rewritten, making it undetected to all creatures.

  The first time an enemy tries to locate the target (such as by Seeking) or uses Recall Knowledge about it, the enemy takes 8d8 mental damage with a basic Will save from migraines and mental static; on a critical failure it is also confused for 1 round.

  **Heightened (+1)** The damage increases by 2d8.
spells.reality-wipe.description: |-
  You reset reality within your quantum field, purging all data. All written information and computer data in the area is subject to _delete_. You attempt to counteract, as _dispel magic_, any spell whose area or targets are in your field; success prevents only the portion inside the field (targets or area outside it are affected normally).

  Creatures in your field take 10d6 spirit damage (basic Will save); those who critically fail are stupefied 2 for 1 minute.

  **Heightened (+1)** The spirit damage increases by 2d6.
spells.warp-time.description: |-
  You alter the timeline within your quantum field. Choose one effect:

  - **Rewind** You rewind your personal timeline to an earlier point in your life cycle, gaining 10 temporary Hit Points for 1 minute.
  - **Fast Forward** You accelerate a creature in your field toward the end of its natural life cycle, dealing 1d10 void damage with a Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage.

  **Failure** The target takes full damage and is enfeebled 1 for 1 round.

  **Critical Failure** The target takes double damage and is enfeebled 1 for 1 minute.

  **Heightened (+2)** The damage increases by 1d10 and the temporary Hit Points by 5.
spells.accelerate.description: You speed up your personal timeline relative to the rest of the universe. You are quickened and can use the extra action each round only to Strike, Stride or Step.
spells.time-loop.description: |-
  You trap a creature in a time loop; it sees and reacts to a repeating loop of events, depending on its Will save.

  **Critical Success** The creature is unaffected.

  **Success** The creature is stunned 1.

  **Failure** The creature is stunned 2.

  **Critical Failure** The creature is stunned 3 and slowed 1 for 1 minute.
spells.quantum-negation.description: |-
  You expose a target to a reality in which it's already dead or never existed. The target becomes temporarily immune for 1 minute once targeted and attempts a basic Will save. The damage has no type and depends on the target's level. If it brings a target of level 16 or lower to 0 Hit Points, the target ceases to exist in this reality; at the GM's discretion it can then be restored only by a deity's intervention, the wish ritual or similar magic. A target of level 17 or higher merely dies instantly.

  - **Level 13 or lower** The target takes 9,999 damage and reduces the degree of success of its Will save by one step.
  - **Level 14 to 16** The target takes 25d10 damage.
  - **Level 17 or higher** The target takes 20d10 damage.
spells.tech-intuition.description: Focusing on a piece of technology, you glimpse its nature and function. You roll the triggering check twice (or the GM does, for Recall Knowledge checks) and use the better result.
spells.commune-with-tech.description: |-
  You briefly connect your mind to a piece of technology to understand or manipulate it. Choose one effect. An unwilling target attempts a Will save and negates the effect on a success.

  - **Understand Tech** You gain deep understanding of the target object or creature. For 1 minute you gain a +2 status bonus to skill checks to hack, use, manipulate, disable, identify, Recall Knowledge about, or otherwise interact with it.
  - **Discharge Creature** A creature with the tech trait is glitching 1 on a failed save, or glitching 2 on a critical failure.
  - **Discharge Object** An object with item level up to your level minus 2 loses all remaining charges; if electrically powered without charges, it loses power for 3 rounds. If its item level is higher, it instead loses a single charge or powers down for 1 round.
  - **Charge Object** An object with item level up to your level minus 2 restores all spent charges; if electrically powered without charges, it is powered for 3 rounds. If its item level is higher, it instead gains a single charge or is powered for 1 round.
spells.clear-mind.description: |-
  You drive mental contamination from the target's mind. Attempt to counteract an effect of your choice imposing fleeing, frightened or stupefied on the target. If you failed but would have succeeded if its counteract rank were 2 lower, instead suppress it until the beginning of your next turn; its duration doesn't elapse while suppressed. This can't counteract or suppress conditions that are part of curses, diseases or the target's natural state.

  **Heightened (4th)** Add confused, controlled and slowed to the conditions.

  **Heightened (6th)** Add doomed.

  **Heightened (8th)** Add stunned.
spells.command.description: |-
  You shout a command that's hard to ignore. You can command the target to approach you, run away (as if fleeing), release what it holds, drop prone, or stand in place. It can't Delay or take reactions until it has obeyed. Effects depend on its Will save.

  **Success** The creature is unaffected.

  **Failure** The creature must spend the first action on its next turn obeying.

  **Critical Failure** The target must use all its actions on its next turn obeying.

  **Heightened (5th)** You can target up to 10 creatures.
spells.confusion.description: |-
  You befuddle your target with strange impulses, causing it to act randomly; effects depend on its Will save. You can Dismiss the spell.

  **Critical Success** The target is unaffected.

  **Success** The target babbles incoherently and is stunned 1.

  **Failure** The target is confused for 1 minute, attempting a new save at the end of each of its turns to end it.

  **Critical Failure** The target is confused for 1 minute with no save to end early.

  **Heightened (8th)** You can target up to 10 creatures.
spells.contingency.description: |-
  You prepare a spell that triggers later. While casting _contingency_, you also cast another spell of 4th rank or lower with a casting time of no more than 3 actions that can affect you. You make all its decisions now (such as the damage type for resist energy). Choose a trigger under the same restrictions as a Ready action trigger. Once cast, you can cause the companion spell to take effect as a reaction with that trigger. It affects only you, even if it would affect more creatures. If you define complicated conditions, as the GM determines, the trigger might fail. Casting _contingency_ again supersedes the older casting.

  **Heightened (8th)** You can choose a spell of 5th rank or lower.

  **Heightened (9th)** You can choose a spell of 6th rank or lower.

  **Heightened (10th)** You can choose a spell of 7th rank or lower.
spells.control-machine.description: |-
  You take control of a technological creature or object and command it telepathically. If you give a sapient target an obviously self-destructive order, it doesn't act until you give a new one. The effect depends on its Will save.

  **Critical Success** The target is unaffected.

  **Success** The target is stunned 1 as it fights off your commands.

  **Failure** You control the target, which gains the controlled condition but can attempt a Will save at the end of each of its turns; on a success the spell ends.

  **Critical Failure** As failure, but the target gets a new save only if it's sapient and you give an order against its nature, such as killing its allies.

  **Heightened (10th)** The duration is unlimited.
spells.corrosive-haze.description: |-
  You unleash a cloud of corrosive nanites. Creatures that start their turn in the area take 6d8 acid damage and 1d6 persistent acid damage with a basic Fortitude save. The nanites also corrode unattended objects in the area for 3d8 acid damage. Each round you Sustain the spell you can move the cloud up to 10 feet in any direction. You can Dismiss the spell.

  **Heightened (+1)** The initial damage increases by 1d8 and the persistent acid damage by 1d6.
spells.cozy-crashpad.description: You shape a metal shack 20 feet on each side and 10 feet high, with the structure trait and the same restrictions as magic items that create structures. It has simple walls, small shuttered windows and one door, with a fastener for a lock but no lock. Inside are three cots, a toilet and a small magic-powered stove, lit by a small magical light you can light or extinguish at will with a Sustain action. The climate is comfortable and lets occupants withstand most hostile weather, but incredible heat or cold, powerful storms and hurricane-force winds destroy the shack. Other creatures can enter and exit freely without damaging it, but if you exit, the spell ends. You can Dismiss the spell.
spells.creation.description: |-
  You conjure a temporary object from magical energy. It must be of earthen or plant-derived matter (wood, paper, brick, stone) and 5 cubic feet or smaller. It can't rely on intricate artistry or complex moving parts, never fulfills a cost, and can't be made of precious materials or materials of uncommon or higher rarity. It's obviously conjured, so it can't be sold or passed off as genuine. The spell gains the trait suited to the item, typically earth, plant or wood.

  **Heightened (5th)** The item can be metal and include common minerals like feldspar or quartz; the spell gains the metal trait if it creates a metal object.
spells.cursed-metamorphosis.description: |-
  You transform the target into a harmless animal appropriate to the area; the effect depends on its Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target gains minor features of the animal; the partial transformation churns its insides, making it sickened 1. When it recovers from sickened, the features revert.

  **Failure** The target transforms for 1 minute but keeps its mind. If it spends all its actions on its turn concentrating on its original form, it can attempt a Will save to end the effect immediately.

  **Critical Failure** The target becomes the chosen harmless animal, body and mind, indefinitely.
spells.daze.description: |-
  You daze the target with a mental jolt dealing 1d6 mental damage with a basic Will save. On a critical failure it is also stunned 1.

  **Heightened (+2)** The damage increases by 1d6.
spells.death-sentence.description: |-
  You condemn the target as unfit to exist, dealing 11d10 spirit damage with a basic Will save. On a failure the creature also believes it has been imprisoned awaiting punishment and is paralyzed for 1 round (2 rounds on a critical failure).

  **Heightened (+1)** The damage increases by 1d10.
spells.delete.description: |-
  You delete data from a device or object, handwritten, printed or digital: up to 1,500 words of text, one page of content, or one screen of text or other visual information. Non-magical writing on an unattended or held object is automatically deleted; attempt a counteract check for digital or magical writing. If you fail to delete writing that's part of a hazard, you trigger it. It can't delete a spellbook's contents or similar stores of magical formulas or spells.

  If you target an attended tech item with the tracking trait, attempt a counteract check; on a success it is glitching 1. A creature holding it can Interact to restart the software, reducing the glitching value by 1.

  **Heightened (7th)** You can delete all data stored locally on one device or book, or all data on it related to a specific name, topic or category.
spells.akashic-download.description: |-
  You psychically search the akashic record on a topic and transfer the data to your comm unit or computer. When you Cast the Spell, choose a skill you're trained in that has Recall Knowledge.

  Any time during the duration you can consult your comm unit (you must hold it) as part of a Recall Knowledge action with that skill, gaining a +1 status bonus as it compiles relevant media snippets. A critical failure becomes a failure. If you succeed and the subject is a creature, you gain additional information or context about it. Once you reference the comm unit, the spell ends; the downloaded information returns to the akashic record.

  **Heightened (3rd)** You can reference your comm unit three times before the spell ends.
spells.detect-scrying.description: |-
  By reading trace auras, you detect scrying effects in the area. If _detect scrying_ is a higher rank than a scrying effect, you glimpse the scrying creature and learn its approximate distance and direction.

  **Heightened (6th)** The duration is until your next daily preparations.
spells.detect-thoughts.description: |-
  You sense the presence or absence of thoughts from conscious creatures with Intelligence modifiers of -3 or higher around you. You can ignore the thoughts of creatures you're familiar with. The spell is blocked by 3 feet of dirt or wood, 1 foot of stone, 1 inch of metal, a thin sheet of lead, or any force barrier. Creatures immune to mental effects can't be detected.

  **Heightened (4th)** You detect the number of thinking minds and whether they're telepathic. Telepathic creatures have louder thoughts and, at the GM's discretion, might sense your intrusion.
spells.disappearance.description: You shroud a creature from others' senses. The target is undetected to all senses, not just sight, counting as invisible whatever precise and imprecise senses an observer has. A creature can still find it by Seeking, looking for disturbed dust, hearing gaps in the sound, or some other way of discovering an otherwise undetectable creature.
spells.discharge.description: |-
  You ignite a spark of electricity that surges into a technological creature or object, de-energizing an item with the tech trait or disrupting a creature with the tech trait.

  - **Creature** A target creature with the tech trait attempts a Will save. On a failure it is glitching 1; on a critical failure, glitching 2.
  - **Object** If you target an attended object, its holder attempts a Will save; on a success the object loses half its maximum charges. On a failure, or if the object is unattended, it loses all remaining charges.
spells.disguise-magic.description: |-
  You alter how an item's or spell's magical aura appears to effects like _detect magic_. You can hide the auras entirely, make an item register as a common item of lower level, or make a spell register as a common spell of the same or lower rank. You can Dismiss the spell.

  A caster using _detect magic_ or _read aura_ of a higher rank than _disguise magic_ can attempt to disbelieve the illusion with the skill matching the tradition of the spell (Arcana for arcane, Religion for divine, Occultism for occult, Nature for primal). Further attempts by the same caster get the same result.

  **Heightened (2nd)** You can Cast the Spell on a creature, disguising all items and spell effects on it.
spells.disintegrate.description: |-
  A black tracer bolt flies toward the target and intensifies into a destructive beam. Make a spell attack against the target. If you hit an object or force construct (such as a _wall of force_), it's destroyed with no save unless it's an artifact or similarly powerful; one casting destroys no more than a 10-foot cube of matter.

  If you hit a creature, it takes 12d10 damage (no damage type) with a basic Fortitude save. On a critical hit its save result is one degree worse. A creature reduced to 0 HP is blasted to fine powder; its gear remains.

  **Heightened (+1)** The damage increases by 2d10.
spells.dispel-magic.description: You unravel the magic behind a spell or effect. Attempt a counteract check against the target. If you counteract a magic item, it becomes a mundane item of its type for 10 minutes, without changing its non-magical properties. If the target is an artifact or similar item, you automatically fail.
spells.akashic-revival.description: |-
  You send perfect documentation of the target's physical body to the akashic record so it can later recall it and reconstruct its body as it was when you cast the spell, including current Hit Points, augmentations, attribute modifiers, and any afflictions or conditions.

  If the target dies of anything other than old age, it can recall its recorded body. This takes 1 minute, after which its corpse disappears and it instantly reappears in the recorded body, standing, in the corpse's space (or as close as possible) with worn equipment. It can pick up dropped equipment still there. It keeps its mind as at death, so it regains no expended spells, Focus Points or uses of special abilities, and mental effects on it at death persist.

  Recalling the body or the duration expiring removes the stored information, requiring a new casting. Casting replaces any previous record; you can store only one copy of any creature.
spells.dizzying-colors.description: |-
  You unleash swirling colors that overwhelm creatures, depending on their Will saves.

  **Critical Success** The creature is unaffected.

  **Success** The creature is dazzled for 1 round.

  **Failure** The creature is stunned 1, blinded for 1 round and dazzled for 1 minute.

  **Critical Failure** The creature is stunned for 1 round and blinded for 1 minute.
spells.doom-scroll.description: |-
  You broadcast grim news onto nearby devices, holo projectors, screens and other displays (including armor comm units). Creatures in the area who can see a display attempt a Will save.

  **Critical Success** The creature is unaffected.

  **Success** The creature is fascinated by the display.

  **Failure** The creature is fascinated by the display and frightened 2 (even if the fascination ends).

  **Critical Failure** The creature is fascinated by the display, frightened 3 and doomed 1 (even if the fascination ends).
spells.dragon-form.description: |-
  You gain a Large dragon battle form. Choose a type of common dragon or another your GM allows (table below for the listed dragons). You gain the dragon trait, have hands and can take manipulate actions, and can Dismiss the spell. In any form you gain:

  - AC = 18 + your level. Ignore your armor's check penalty and Speed reduction.
  - Speed 40 feet, fly 100 feet. You also gain any of these Speeds the chosen dragon has, at the listed amount: burrow 20 feet, climb 40 feet, swim 60 feet.
  - Resistance 10 to your Dragon Breath's damage type.
  - Darkvision and imprecise scent 60 feet.
  - Unarmed melee attacks, the only attacks you can Strike with; you're trained with them. Attack modifier +22, damage bonus +6. They're Strength-based (for enfeebled, for example). If your own unarmed attack modifier is higher, use it. Jaws 2d12 piercing plus 2d6 of your Dragon Breath's damage type; claw (agile) 3d10 slashing; tail (reach 10 feet) 3d10 bludgeoning.
  - Athletics +23, unless your own is higher.
  - **Dragon Breath** (two actions) You exhale magical energy, dealing 10d6 damage to each creature in the area with a basic save against your spell DC. The shape, damage type and save match the chosen dragon's breath; if it can deal more than one damage type, choose one when casting. The shape is a 30-foot cone or 100-foot line. It can't be used again for 1d4 rounds. It has the tradition trait of the dragon type and the damage trait of its damage type.
  - **Tradition Resistance** If the dragon's tradition matches that of your _dragon form_, you gain: arcane, resistance 5 to damage from spells; divine, resistance 10 to spirit, vitality and void; occult, resistance 10 to mental; primal, resistance 5 to physical damage.

  **Heightened (8th)** The form is Huge, you gain a +20-foot status bonus to fly Speed, and attack reach is 10 feet (15 if it was 10). AC = 21 + your level, 15 temporary HP, attack modifier +28, damage bonus +12, Athletics +28. Dragon Breath deals an additional 4d6 damage.

  Dragon types (tradition, extra Speeds, breath):

  - **Abysium** Arcane; cone of poison (Fortitude).
  - **Akashic** Occult; cone of mental (Will).
  - **Cosmic** Divine; cone of spirit (Will).
  - **Host** Primal; climb; cone of piercing (Reflex).
spells.dream-of-home.description: You draw on a creature's thoughts of home and the comfort it finds in that concept, overwhelming it with wistful memories. The target must succeed at a Will save or be fascinated by the memories.
spells.alarm.description: |-
  You ward an area to alert you when creatures enter without permission. Choose a password when you cast it. Whenever a Small or larger corporeal creature enters the area without speaking the password, _alarm_ sends your choice of a mental alert (the spell gains the mental trait) or an audible alarm with the sound and volume of a hand bell (the spell gains the auditory trait). Either option automatically awakens you, and the bell lets each creature in the area attempt a DC 15 Perception check to wake. A creature aware of the _alarm_ must succeed at a Stealth check against the spell's DC or trigger it when moving into the area.

  **Heightened (3rd)** You can specify a trigger for which types of creatures sound the alarm.
spells.dreaming-potential.description: You draw the target into a lucid dream where it explores the endless possibilities of its own potential. If it sleeps the full 8 hours uninterrupted, on waking it counts as having spent a day of downtime retraining, though it can't retrain anything requiring an instructor or specialized knowledge it can't access within the dream.
spells.earthbind.description: |-
  Using the weight of earth, you hamper a target's flight; effects depend on its Fortitude save. If the creature reaches the ground safely, it takes no falling damage.

  **Critical Success** The target is unaffected.

  **Success** The target falls safely up to 120 feet.

  **Failure** The target falls safely up to 120 feet. If it hits the ground, it can't Fly, levitate or otherwise leave the ground for 1 round.

  **Critical Failure** As failure, but for 1 minute.
spells.earthquake.description: |-
  You shake the ground, topple creatures into fissures and collapse structures. The GM might add effects in certain areas, such as collapsing cliffs or a lake draining through fissures into a morass of quicksand.

  - **Shaking Ground** The ground is difficult terrain, and creatures on it take a -2 circumstance penalty to attack rolls, AC and skill checks.
  - **Fissures** Each creature on the ground attempts a Reflex save at the start of its turn to keep its footing and avoid falling into 40-foot-deep fissures that open beneath it. The fissures are permanent, and climbing their sides requires a DC 15 Athletics check.
  - **Collapse Structures** Structures and ceilings might collapse. The GM rolls a flat check for each (DC 16 sturdy, DC 14 average and most natural formations, DC 9 shoddy, adjusted as the GM sees fit). A collapse deals 11d6 bludgeoning damage to each creature caught in it with a basic Reflex save. A creature falls prone unless it critically succeeds, and falls into a fissure if it critically fails.

  **Heightened (10th)** You create a massive earthquake that can devastate a settlement. The range is half a mile and the area a quarter-mile burst.
spells.eldritch-lance.description: |-
  You condense a beam of mind-assaulting eldritch energy from the dark between the stars and fire it at a target. Make a ranged spell attack roll against its AC. On a hit you deal 2d6 mental damage, doubled on a critical hit.

  **Heightened (+1)** The damage increases by 1d6.
spells.eldritch-wrath.description: |-
  You channel bizarre powers from beyond the universe's outer reaches, dealing 3d12 mental damage to each creature in the area as phantasmal claws, jaws and tentacles lash out. Each attempts a Will save. The area is difficult terrain for any creature sickened by the spell.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is sickened 1.

  **Critical Failure** The creature takes double damage and is sickened 2.

  **Heightened (+1)** The damage increases by 1d12.
spells.electrotether.description: |-
  You supercharge the targets' electromagnetism and pull them with a tether of lightning. Make a ranged spell attack against each target; if you attack two, both count toward your multiple attack penalty, which doesn't increase until after both. Each target takes 4d8 electricity damage and is pulled 5 feet closer to you (10 feet on a critical hit). If both attacks hit, you can instead move the creatures closer to each other. A target stops before entering a space with a barrier, creature or obstacle.

  **Heightened (+1)** The damage increases by 1d8.
spells.analyze-target.description: |-
  You focus on the target as magical holograms display information. When casting completes, you learn its biometric information, including fingerprints, medical conditions and other basic physiology. You and anyone you advise gain a +1 status bonus to checks to Impersonate the creature, Treat Wounds on it and Recall Knowledge about it. If the target is illusory or under illusion magic, you detect this only if the effect's rank is lower than your _analyze target_'s rank.

  **Heightened (3rd)** The status bonus is +2 and you can target up to 10 creatures.

  **Heightened (6th)** The status bonus is +3 and you can target any number of creatures.
spells.energy-aegis.description: |-
  You protect the target with a long-lasting energy barrier, granting resistance 5 to acid, cold, electricity, fire, force, sonic, vitality and void damage.

  **Heightened (9th)** The resistances are 10.
spells.enfeeble.description: |-
  You sap the target's strength, depending on its Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target is enfeebled 1 until the start of your next turn.

  **Failure** The target is enfeebled 2 for 1 minute.

  **Critical Failure** The target is enfeebled 3 for 1 minute.
spells.enhance-body.description: |-
  You infuse the target's body with magic. All its unarmed attacks gain the tracking +1 trait and have two weapon damage dice.

  **Heightened (6th)** Tracking +2 and three weapon damage dice.

  **Heightened (9th)** Tracking +3 and four weapon damage dice.
spells.enhance-weapon.description: |-
  You infuse the weapon so it can operate safely beyond its normal parameters. A commercial or tactical weapon becomes an advanced weapon, gaining a +1 item bonus to attack rolls and two weapon damage dice.

  **Heightened (6th)** A commercial, tactical, advanced or superior weapon becomes an elite weapon: +2 item bonus to attack rolls and three weapon damage dice.

  **Heightened (9th)** The target becomes a paragon weapon: +3 item bonus to attack rolls and four weapon damage dice.
spells.enlarge.description: |-
  Bolstered by magic, the target grows to Large. Its equipment grows with it but returns to natural size if removed. The creature is clumsy 1, its reach increases by 5 feet (10 feet if it started Tiny), and it gains a +2 status bonus to melee damage. No effect on a Large or larger creature.

  **Heightened (4th)** The creature grows to Huge instead. The melee damage bonus is +4 and reach increases by 10 feet (15 feet if it started Tiny). No effect on a Huge or larger creature.

  **Heightened (6th)** Choose the 2nd-rank or 4th-rank version and apply it to up to 10 willing creatures.
spells.entangling-flora.description: Plants and fungi burst out or quickly grow, entangling creatures. All surfaces in the area are difficult terrain. Each round a creature starts its turn in the area it attempts a Reflex save. On a failure it takes a -10-foot circumstance penalty to its Speeds until it leaves the area; on a critical failure it is also immobilized for 1 round. Creatures can attempt to Escape to remove these effects.
spells.enthrall.description: |-
  Your words fascinate your targets. You must speak or sing without interruption throughout the casting and duration. Targets who notice might give undivided attention and each attempts a Will save. The GM might grant a circumstance bonus (maximum +4) if the target is of an opposing religion, ancestry or political leaning or otherwise unlikely to agree with you. Each creature that comes within range attempts a save when you Sustain the spell. If you're speaking, the spell gains the linguistic trait.

  **Critical Success** The target is unaffected and notices you tried to use magic.

  **Success** The target needn't pay attention and doesn't notice you used magic (it might notice others are enthralled).

  **Failure** The target is fascinated with you. If it witnesses actions or speech it disagrees with, it can attempt another Will save; on a success it's no longer fascinated and is temporarily immune for 1 hour. The fascination ends immediately if the target is subject to a hostile act or another creature succeeds at a Diplomacy or Intimidation check against it.

  **Critical Failure** As failure, but the target can't attempt a save to end the fascination if it disagrees.
spells.entropy-strike.description: |-
  You unleash a ray of entropy that rapidly decays matter. Make a ranged spell attack against the target's AC. On a hit it takes 5d8 void damage, or, if it has the tech trait, 2d6 persistent acid damage and it is glitching 1. On a critical hit, double the damage, and a tech-trait creature is glitching 2 and stunned 1.

  **Heightened (+1)** The damage increases by 1 die.
spells.environmental-endurance.description: |-
  You shield the target against dangerous temperatures. Choose severe cold or severe heat; the target is protected from it (but not from extreme cold or heat).

  **Heightened (3rd)** The target is protected from severe cold and severe heat.

  **Heightened (5th)** The target is protected from severe and extreme cold and heat.
spells.event-horizon.description: |-
  You unleash the power of a supermassive black hole. All creatures in the area take 6d10 bludgeoning and 6d10 void damage. The spell ignores up to 10 of their resistance to bludgeoning and up to 10 to void. Each creature attempts a Reflex save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage and is slowed 1 until the end of its next turn.

  **Failure** The creature takes full damage, is slowed 3 until the end of its next turn and slowed 1 for 1 minute.

  **Critical Failure** The creature takes double damage, is slowed 3 until the end of its next turn and slowed 2 for 1 minute.
