spells.absolute-zero.name: Absolute Zero
spells.animal-form.name: Animal Form
spells.everlight.description: 'The gemstone you touch glows in a color of your choice, bright light in a 20-foot radius and dim light 20 feet beyond, until it breaks.'
spells.everlight.name: Everlight
spells.execute.name: Execute
spells.explosion-of-rot.name: Explosion of Rot
spells.fabricated-truth.name: Fabricated Truth
spells.falling-stars.description: |-
  Four stars fall within range, in 40-foot bursts whose central 10-foot bursts can't overlap. Choose airbursts (sonic), asteroids (fire), comets (cold) or plasma (electricity); the spell gains that trait. Each star deals 6d10 bludgeoning damage to creatures in its central burst, then 14d6 damage of the chosen type to creatures in its whole burst. A creature attempts one basic Reflex save however many areas it is in, and takes each type of damage only once.

  **Heightened (+1)** The bludgeoning damage increases by 1d10 and the energy damage by 2d6.
spells.falling-stars.name: Falling Stars
spells.false-vision.name: False Vision
spells.false-vitality.name: False Vitality
spells.fear.name: Fear
spells.feline-senses.name: Feline Senses
spells.field-of-life.description: |-
  Life energy fills the area. Each living creature that starts its turn there regains 1d8 Hit Points, and each undead creature that starts its turn there takes 1d8 vitality damage.

  **Heightened (8th)** 1d10.

  **Heightened (9th)** 1d12.
spells.field-of-life.name: Field of Life
spells.ant-haul.name: Ant Haul
spells.figment.name: Figment
spells.fire-shield.name: Fire Shield
spells.fireball.name: Fireball
spells.fleet-step.name: Fleet Step
spells.flicker.name: Flicker
spells.floating-flame.name: Floating Flame
spells.fly.name: Fly
spells.forbidding-ward.description: |-
  You ward an ally against one enemy (the target). The ally gains a +1 status bonus to AC and saving throws against that enemy's attacks, spells and other effects.

  **Heightened (6th)** The bonus increases to +2.
spells.forbidding-ward.name: Forbidding Ward
spells.force-barrage.name: Force Barrage
spells.foresight.name: Foresight
spells.arctic-rift.description: |-
  A jagged rift opens in the air along the line, drawing away warmth: 12d8 cold damage by each creature's Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage, and slowed 1 until the start of your next turn.

  **Critical Failure** Double damage; ice immobilizes it, and it is slowed 1 while immobilized. The ice is an object with 60 HP, Hardness 5, immunity to cold and weakness 10 to fire, destroyed if the creature Escapes.

  **Heightened (+1)** The damage increases by 1d8 and the ice's HP by 5.
spells.arctic-rift.name: Arctic Rift
spells.freeze-time.description: "You stop time for everything but yourself. Right after casting, you can use up to 9 actions in 3 sets of up to 3; after each set, 1 round passes, but only for you, effects targeting or affecting you, and effects you create during the stop. Every other creature and object is invulnerable to you, and you can't target or affect them. When you finish, time flows again; an effect you created that lasts beyond the stop, such as wall of fire, affects others again at once, without the effects that happen only when it is cast."
spells.freeze-time.name: Freeze Time
spells.frostbite.description: |-
  Biting cold closes around the target, dealing 2d4 cold damage with a basic Fortitude save. On a critical failure, it also gains weakness 1 to bludgeoning until the start of your next turn.

  **Heightened (+1)** The damage increases by 1d4 and the weakness by 1.
spells.frostbite.name: Frostbite
spells.gate.description: 'You tear open a vertical, circular portal of 40-foot radius to another plane, which creatures can cross both ways. It opens where you choose on the destination plane, if you know clearly where that place is and what it looks like. A deity or similarly powerful being can keep a gate from opening into or out of its realm.'
spells.gate.name: Gate
spells.genetic-regeneration.name: Genetic Regeneration
spells.gentle-landing.name: Gentle Landing
spells.ghostly-carrier.name: Ghostly Carrier
spells.ghost-killer-weapon.name: Ghost Killer Weapon
spells.glow-up.name: Glow Up
spells.gouging-claw.description: |-
  Your limb becomes a claw for an instant. Make a melee spell attack against the target's AC. A hit deals your choice of 2d6 slashing or 2d6 piercing damage plus 2 persistent bleed damage; a critical hit doubles both.

  **Heightened (+1)** The damage increases by 1d6 and the persistent bleed damage by 1.
spells.gouging-claw.name: Gouging Claw
spells.gravity-field.name: Gravity Field
spells.atomic-blast.name: Atomic Blast
spells.grease.description: |-
  You cover an area or an object with grease.

  - **Area:** each creature standing on the 4 squares must succeed at a Reflex save or an Acrobatics check against your spell DC or fall prone, and one using an action to move onto it must save or Balance (not when it Steps or Crawls).
  - **Object:** anyone picking up the unattended object must succeed at an Acrobatics check or Reflex save against your spell DC. A creature holding it must attempt one: on a failure it takes a –2 circumstance penalty to checks using the object, on a critical failure it drops it. A greased worn object gives its wearer a +2 circumstance bonus to Fortitude saves against being grappled.
spells.grease.name: Grease
spells.grim-tendrils.name: Grim Tendrils
spells.guidance.description: 'The target gains a +1 status bonus to one attack roll, Perception check, saving throw or skill check it attempts before the spell ends, chosen before rolling; using it ends the spell. Either way, it is then temporarily immune for 1 hour.'
spells.guidance.name: Guidance
spells.gust-of-wind.name: Gust of Wind
spells.hallucination.description: |-
  The target perceives one thing as another, fails to perceive something that is there, or perceives something that isn't, as you choose and detail. Its beliefs don't change. It can attempt a Will save when you cast the spell, and again to disbelieve each time it Seeks or directly interacts with the hallucination (with a large circumstance bonus where the GM sees fit).

  **Critical Success** The creature is unaffected.

  **Success** It perceives what you chose until it disbelieves, but knows it is a hallucination.

  **Failure** It perceives what you chose until it disbelieves.

  **Critical Failure** As failure, and it trusts its false senses, taking a –4 circumstance penalty to saves to disbelieve.

  **Heightened (6th)** Either target up to 10 creatures, or make the duration until your next daily preparations.

  **Heightened (8th)** Either target any number of creatures, or make the duration unlimited.
spells.hallucination.name: Hallucination
spells.harm.description: |-
  You channel void energy, dealing 1d8 void damage to a living target (a basic Fortitude save) or restoring that many Hit Points to a willing undead one. The actions you spend decide the rest:

  - **1 action** (manipulate): range touch, one target.
  - **2 actions** (concentrate, manipulate): range 30 feet, one target; healing an undead creature restores 8 more Hit Points.
  - **3 actions** (concentrate, manipulate): every living and undead creature in a 30-foot emanation.

  **Heightened (+1)** The damage or healing increases by 1d8, and the 2-action version's extra healing by 8.
spells.harm.name: Harm
spells.haste.name: Haste
spells.heal.description: |-
  You channel vital energy, restoring 1d8 Hit Points to a willing living target, or dealing that much vitality damage to an undead one (a basic Fortitude save). The actions you spend decide the rest:

  - **1 action** (manipulate): range touch, one target.
  - **2 actions** (concentrate, manipulate): range 30 feet, one target; healing a living creature restores 8 more Hit Points.
  - **3 actions** (concentrate, manipulate): every living and undead creature in a 30-foot emanation.

  **Heightened (+1)** The healing or damage increases by 1d8, and the 2-action version's extra healing by 8.
spells.heal.name: Heal
spells.heroism.description: |-
  The target gains a +1 status bonus to attack rolls, Perception checks, saving throws and skill checks.

  **Heightened (6th)** The bonus is +2.

  **Heightened (9th)** The bonus is +3.
spells.heroism.name: Heroism
spells.holographic-memory.name: Holographic Memory
spells.augury.description: 'You ask about a course of action up to 30 minutes ahead and learn the GM''s best guess: good, bad, mixed or nothing. The GM rolls a secret DC 6 flat check; on a failure the answer is always nothing, so a "nothing" can''t be trusted. Asking again about the same topic reuses the first roll unless circumstances change.'
spells.augury.name: Augury
spells.holy-light.description: |-
  A ray of blazing, holy light: make a ranged spell attack. It deals 5d6 fire damage, plus 5d6 spirit damage if the target has the unholy trait.

  **Critical Success** The target takes double damage.

  **Success** The target takes full damage.

  If the light passes through magical darkness or targets a creature affected by it, it attempts to counteract the darkness.

  **Heightened (+1)** The fire damage increases by 2d6, and the spirit damage against unholy creatures by 2d6.
spells.holy-light.name: Holy Light
spells.honeyed-words.name: Honeyed Words
spells.howl.name: Howl
spells.howling-blizzard.name: Howling Blizzard
spells.humanoid-form.description: |-
  You look like a Small or Medium humanoid, such as a dwarf, elf, goblin, halfling, human or orc, gaining the humanoid trait and its kind's trait; a smaller form shrinks your reach. Your statistics and gear are unchanged and you gain none of its abilities. You gain a +4 status bonus to Deception checks to pass as a typical member of that ancestry, adding your level even if untrained, but you can't look like a specific person. You can Dismiss the spell.

  **Heightened (3rd)** You gain darkvision or low-light vision if the form has it.

  **Heightened (5th)** You can look like a Large humanoid, and gain enlarge's effects if you grow.
spells.humanoid-form.name: Humanoid Form
spells.hydraulic-push.name: Hydraulic Push
spells.hydraulic-torrent.name: Hydraulic Torrent
spells.hypercognition.name: Hypercognition
spells.hypnotize.name: Hypnotize
spells.ignition.name: Ignition
spells.avatar.name: Avatar
spells.ill-omen.name: Ill Omen
spells.illusory-creature.description: |-
  You create an illusion of a Large or smaller creature that sounds, smells and feels real; it ends if it is ever more than 500 feet from you. You can speak through it (a Deception or Performance check may be needed). In combat it acts with 2 actions when you Sustain the spell, using your spell attack modifier to attack and your spell DC as its AC, with saves at your spell DC – 10; it can flank. It ends if hit or if it fails a save. Its Strikes deal 3d4 nonlethal mental damage to a creature that believes it, and resistances apply as the target thinks they would. A creature that touches it or Seeks to examine it can disbelieve it, recovering half the damage it took.

  **Heightened (+1)** The damage increases by 1d4, and the creature can be one size larger (up to Gargantuan).
spells.illusory-creature.name: Illusory Creature
spells.illusory-disguise.name: Illusory Disguise
spells.illusory-object.description: |-
  You create a silent, scentless image of a stationary object that fits in the area; it can move naturally (water pouring down a waterfall). A creature that touches it or Seeks to examine it can attempt to disbelieve it.

  **Heightened (2nd)** The image makes sounds and smells and feels right to the touch (the auditory and olfactory traits), and lasts 1 hour.

  **Heightened (5th)** As 2nd, and it lasts indefinitely.
spells.illusory-object.name: Illusory Object
spells.illusory-scene.description: |-
  You create a scene of up to 10 creatures or objects within the area, with fitting sounds, smells and textures. They can't speak and have no combat abilities, and the scene doesn't change the surrounding environment. The scene can be static (with natural movement such as rustling) or follow a program up to 1 minute long that repeats; anyone watching for more than a few minutes almost always notices the loop, and you can't change the program later. A creature that touches part of it or Seeks to examine it can attempt to disbelieve that part, and disbelieves the whole scene only on a critical success.

  **Heightened (6th)** The scene's figures can speak lines you set when you create the program, in voices not your own.

  **Heightened (8th)** As 6th rank, and the duration is unlimited.
spells.illusory-scene.name: Illusory Scene
spells.impaling-spike.name: Impaling Spike
spells.implant-data.name: Implant Data
spells.implosion.name: Implosion
spells.indestructibility.description: 'You step outside cause and effect. Until the spell ends, no effect or damage can harm you, except from artifacts, deific power and the like. You can let anything you are willing to have affect you do so.'
spells.indestructibility.name: Indestructibility
spells.infuse-vitality.name: Infuse Vitality
spells.bane.description: "Doubt fills your enemies' minds. Each enemy in the area must succeed at a Will save or take a –1 status penalty to attack rolls while it stays in the area. Once per round on later turns, you can Sustain the spell to widen the emanation by 10 feet, and enemies in it not yet affected must save. Bane can counteract bless."
spells.bane.name: Bane
spells.inject-nanobots.name: Inject Nanobots
spells.injury-echo.name: Injury Echo
spells.insect-form.name: Insect Form
spells.instant-virus.name: Instant Virus
spells.interplanar-teleport.name: Interplanar Teleport
spells.invisibility.name: Invisibility
spells.irradiate.name: Irradiate
spells.jump.name: Jump
spells.knock.name: Knock
spells.laughing-fit.name: Laughing Fit
spells.banishment.name: Banishment
spells.levitate.name: Levitate
spells.life-seal.name: Life Seal
spells.light.name: Light
spells.lightning-bolt.name: Lightning Bolt
spells.locate.description: |-
  You learn the direction to the target object, or to the nearest of a type of object. A specific object must be one you have observed directly; a type needs an accurate mental image. Lead or running water between you blocks the spell, so a farther one may be found instead.

  **Heightened (5th)** You can target a specific creature or ancestry you have met or seen up close.
spells.locate.name: Locate
spells.lock.description: |-
  The target's latch magically locks. The Athletics and Thievery DC to open it is your spell DC or its own DC with a +4 status bonus, whichever is higher. Its key or combination no longer opens it, but gives a +4 circumstance bonus to checks to open it. Opening it ends the spell; you can unlock and open it with an Interact while touching it without ending the spell, and Dismiss the spell from any distance.

  **Heightened (2nd)** It lasts indefinitely, at an additional cost of 6 gp of precious metals.
spells.lock.name: Lock
spells.logic-bomb.name: Logic Bomb
spells.magic-passage.description: |-
  You open a visible tunnel through a wooden, plaster or stone wall, up to 10 feet deep. Even a thin layer of metal stops the spell. The structure stays sound, and anyone inside when the spell ends is shunted to the nearest exit.

  **Heightened (7th)** The tunnel can be 20 feet deep, and its entrance looks like ordinary wall (unless seen through truesight or the like) and acts as one, though you can set a password or trigger to let creatures in.
spells.magic-passage.name: Magic Passage
spells.manifestation.description: 'You shape the fundaments of magic into the effect of another spell: a spell of 9th rank or lower of the tradition you cast manifestation from, or of 7th rank or lower from any tradition. Normally it must be common or one you have access to, though the GM may allow more.'
spells.manifestation.name: Manifestation
spells.mask-of-terror.name: Mask of Terror
spells.battle-sonata.name: Battle Sonata
spells.massacre.description: |-
  A wave of death sweeps the line. Each living creature of 17th level or lower in it attempts a Fortitude save; a creature this damage reduces to 0 HP dies at once. If massacre kills no one, the void energy turns back, dealing 30 more void damage to every living creature in the line (whatever its level) and 30 void damage to you.

  **Critical Success** The creature is unaffected.

  **Success** 9d6 void damage.

  **Failure** 100 void damage.

  **Critical Failure** The creature dies.

  **Heightened (10th)** Living creatures up to 19th level; 10d6 on a success and 115 on a failure.
spells.massacre.name: Massacre
spells.measure.name: Measure
spells.mending.name: Mending
spells.message.description: |-
  You mouth words that the target hears as though you stood beside it. It can answer briefly as a reaction, or as a free action on its next turn, if it can see you and you are within range.

  **Heightened (3rd)** The range increases to 500 feet.
spells.message.name: Message
spells.metamorphosis.name: Metamorphosis
spells.mind-probe.description: |-
  You sift through the target's memories and knowledge unless it fends you off with a Will save.

  **Success** The target is unaffected.

  **Failure** Each round, you can Sustain the spell to ask a new question. The target attempts a Deception check against your spell DC: on a success you don't learn the answer, and on a critical success it gives a false answer you believe. Asking the same question again, even in another casting, gets the same result.

  **Critical Failure** As failure, and the target takes a –4 circumstance penalty to its Deception checks against your questions.
spells.mind-probe.name: Mind Probe
spells.mind-reading.name: Mind Reading
spells.mind-skewer.name: Mind Skewer
spells.mindlink.name: Mindlink
spells.mislead.name: Mislead
spells.bind-undead.name: Bind Undead
spells.mist.description: 'A cloud of mist fills the area: creatures inside are concealed, and creatures outside are concealed to those inside. You can Dismiss it.'
spells.mist.name: Mist
spells.moment-of-renewal.description: "The targets get a day's recovery in an instant. Harmful effects that would end within 24 hours end (spells on them keep their durations), and they regain Hit Points and recover from conditions as after 24 hours of rest, without new daily preparations or other benefits of rest. They are then temporarily immune for 1 day."
spells.moment-of-renewal.name: Moment of Renewal
spells.monstrosity-form.name: Monstrosity Form
spells.motivating-ringtone.name: Motivating Ringtone
spells.mountain-resilience.name: Mountain Resilience
spells.mystic-armor.name: Mystic Armor
spells.nature-incarnate.name: Nature Incarnate
spells.natures-pathway.name: "Nature's Pathway"
spells.never-mind.name: Never Mind
spells.new-game.name: New Game
spells.acid-grip.description: |-
  A ghostly taloned hand grips the target, dealing 2d8 acid damage plus 1d6 persistent acid damage by its Reflex save. While it takes this persistent damage, it has a –10-foot status penalty to its Speeds.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage and no persistent damage, and the claw moves it up to 5 feet in a direction you choose.

  **Failure** The creature takes full damage and the persistent damage, and is moved up to 10 feet.

  **Critical Failure** The creature takes double damage and the full persistent damage, and is moved up to 20 feet.

  **Heightened (+2)** The initial damage increases by 2d8 and the persistent damage by 1d6.
spells.acid-grip.name: Acid Grip
spells.blazing-bolt.description: |-
  You fire a ray of heat and flame: make a spell attack against one creature, dealing 2d6 fire damage on a hit and double on a critical hit. Each additional action fires another ray at a different target, up to three for 3 actions; each attack adds to your multiple attack penalty, but only after all of them. With 2 or more actions, each ray deals 4d6 fire damage.

  **Heightened (+1)** The damage increases by 1d6 for 1 action, or 2d6 for 2 or 3 actions.
spells.blazing-bolt.name: Blazing Bolt
spells.nightmare.name: Nightmare
spells.noise-blast.name: Noise Blast
spells.oaken-resilience.name: Oaken Resilience
spells.one-with-plants.description: |-
  You become a plant or merge into one, and can Dismiss the spell. Either way you can't move or affect anything outside it, but can cast spells that need no line of effect beyond it.

  - **Merge with plants** (10 minutes): you must touch a plant big enough to hold you and your gear. You hear but can't see outside. Damage to the plant expels you and deals you 10d6 damage; the spell ends if you leave.
  - **Turn into a plant** (8 hours): you become a Large plant, typically a tree. Perception doesn't reveal you, but a Nature or Survival check against your spell DC shows you are a plant new to the area. You perceive normally. Your AC is 20, only status and circumstance bonuses and penalties affect you, and successes on Reflex saves are failures.
spells.one-with-plants.name: One with Plants
spells.one-with-stone.name: One with Stone
spells.outcasts-curse.description: |-
  You curse the target with an off-putting, abrasive presence.

  **Critical Success** The target is unaffected.

  **Success** For 10 minutes, the target rolls twice and takes the worse result on Deception, Diplomacy, Intimidation and Performance checks, and creatures it meets start one attitude step worse toward it.

  **Failure** As success, but permanent.

  **Critical Failure** As failure, and new creatures start two attitude steps worse toward it.
spells.outcasts-curse.name: "Outcast's Curse"
spells.overheat.name: Overheat
spells.overload-systems.name: Overload Systems
spells.paralyze.name: Paralyze
spells.paranoia.description: |-
  The target sees every creature as a threat; it attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target becomes unfriendly to everyone it wasn't already hostile to, allies included, and treats no one as an ally, for 1 round.

  **Failure** As success, for 1 minute.

  **Critical Failure** As failure, and it sees everyone as a mortal enemy, using its reactions and free actions against anyone, though it otherwise acts rationally and prefers foes that are harming it.

  **Heightened (6th)** You can target up to 5 creatures.
spells.paranoia.name: Paranoia
spells.bless.description: 'You and your allies gain a +1 status bonus to attack rolls while within the emanation. Once per round on later turns, you can Sustain the spell to widen it by 10 feet. Bless can counteract bane.'
spells.bless.name: Bless
spells.peaceful-bubble.name: Peaceful Bubble
spells.peaceful-rest.name: Peaceful Rest
spells.personal-gravity.name: Personal Gravity
spells.pest-form.name: Pest Form
spells.petrify.description: |-
  The target's body begins to turn to stone.

  **Critical Success** The target is unaffected.

  **Success** Slowed 1 for 1 round.

  **Failure** Slowed 1, and it attempts a Fortitude save (with the incapacitation trait) at the end of each of its turns: a failure raises slowed by 1 (2 on a critical failure), a success lowers it by 1. When the slowed condition leaves it unable to act, it becomes a statue, permanently petrified; if the slowed condition is removed, the stone flakes off and the spell ends.

  **Critical Failure** As failure, but initially slowed 2.
spells.petrify.name: Petrify
spells.phantasmagoria.name: Phantasmagoria
spells.phantasmal-calamity.name: Phantasmal Calamity
spells.phantasmal-fleet.name: Phantasmal Fleet
spells.phantasmal-minion.name: Phantasmal Minion
spells.phantom-pain.name: Phantom Pain
spells.blindness.description: |-
  You blind the target by its Fortitude save; it is then temporarily immune for 1 minute.

  **Critical Success** The target is unaffected.

  **Success** The target is blinded until its next turn begins.

  **Failure** The target is blinded for 1 minute.

  **Critical Failure** The target is blinded permanently.
spells.blindness.name: Blindness
spells.pinpoint.description: "You learn exactly where the target is (building, community and country) and on which plane. You can target a creature only if you've seen it in person or have one of its significant belongings or a piece of its body, and an object only if you've touched it or have a fragment of it. The spell automatically overcomes protections against detection of lower rank."
spells.pinpoint.name: Pinpoint
spells.planar-palace.name: Planar Palace
spells.planar-seal.description: 'A visible barrier tries to counteract teleportation and planar travel into or out of the area, items that reach extradimensional spaces included, and any attempt to summon a creature into it (though a summoned creature can still leave when the summoning ends).'
spells.planar-seal.name: Planar Seal
spells.planar-tether.description: |-
  You bind the target to its current plane. While the spell lasts, it tries to counteract any teleportation or planar travel that would move the target. Its duration depends on the target's Will save.

  **Critical Success** The target is unaffected.

  **Success** 1 minute.

  **Failure** 10 minutes.

  **Critical Failure** 1 hour.
spells.planar-tether.name: Planar Tether
spells.plant-form.name: Plant Form
spells.pocket-vacuum.name: Pocket Vacuum
spells.possession.description: |-
  You send your mind and soul into the target's body to take control. You can choose a result more favorable to the target than its save. While you possess it, your own body is unconscious and can't wake normally, and you sense everything the target does. You can Dismiss the spell. If the possessed body dies, the spell ends and you must succeed at a Fortitude save against your spell DC or be paralyzed for 1 hour (24 hours on a critical failure). If the spell ends in an encounter, you act just before the target.

  **Critical Success** The target is unaffected.

  **Success** You ride along in its body without control.

  **Failure** You take partial control and have no turn of your own. At the start of each of its turns it saves again: on a failure you control it that turn, on a success it acts freely, and on a critical success it forces you out and the spell ends.

  **Critical Failure** You possess it fully; it is controlled by you and can only watch.

  **Heightened (9th)** The duration is 10 minutes, and your body can enter the creature's with you, protected while the spell lasts.
spells.possession.name: Possession
spells.prestidigitation.name: Prestidigitation
spells.project-image.name: Project Image
spells.promession.name: Promession
spells.blur.name: Blur
spells.protection.description: |-
  The target gains a +1 status bonus to AC and saving throws.

  **Heightened (3rd)** You can also extend the benefits to all your allies in a 10-foot emanation around the target.
spells.protection.name: Protection
spells.pummeling-rubble.name: Pummeling Rubble
spells.punishing-winds.description: 'A cyclone of violent winds and downdrafts fills the area. Flying creatures in it drop 40 feet, and any that ends its turn flying there drops 20 more. The area is greater difficult terrain for flying creatures and difficult terrain for those on the ground or climbing. A creature pushed into a surface by the winds takes falling damage. The outer edge of the cylinder is greater difficult terrain that holds creatures in: to cross it, a creature must succeed at an Athletics check or an Acrobatics check to Maneuver in Flight against your spell DC, and a failure ends its action (it can try again).'
spells.punishing-winds.name: Punishing Winds
spells.raise-dead.name: Raise Dead
spells.read-aura.name: Read Aura
spells.read-omens.description: 'Choose a goal, activity or event you expect within the next week. You receive a cryptic clue or piece of advice about it, often a rhyme or an omen.'
spells.read-omens.name: Read Omens
spells.recharge-weapon.name: Recharge Weapon
spells.regenerate.description: |-
  The target gains regeneration 15, regaining 15 Hit Points at the start of each of its turns. While it has regeneration, Hit Point damage can't kill it and its dying condition can't rise to the value that would (most creatures stop at dying 3), though with wounded 4 or more it stays unconscious until its wounds are treated. Acid or fire damage turns the regeneration off until after the end of its next turn. Each time the regeneration heals it, it regrows one damaged or ruined organ, and while the spell lasts it can reattach a severed body part by holding it in place with an Interact action.

  **Heightened (9th)** Regeneration 20.
spells.regenerate.name: Regenerate
spells.remake.name: Remake
spells.reorient.name: Reorient
spells.breath-of-life.texts.trigger: a living creature within range would die
spells.breath-of-life.description: |-
  You keep the target from dying and restore 5d8 Hit Points to it. You can't use this against a death effect or an effect that leaves no remains.

  **Heightened (+2)** The healing increases by 1d8.
spells.breath-of-life.name: Breath of Life
spells.repulsion.description: |-
  An aura of any radius up to 40 feet keeps creatures back. A creature in it when you cast the spell, or that enters it, attempts a Will save once, keeping that result for this casting. The limits apply only when it moves toward you voluntarily; you moving closer doesn't make it move away.

  **Critical Success** Its movement isn't limited.

  **Success** Squares in the area are difficult terrain for it when it moves closer to you.

  **Failure** It can't move closer to you within the area.
spells.repulsion.name: Repulsion
spells.resist-energy.name: Resist Energy
spells.retrocognition.name: Retrocognition
spells.revealing-light.description: |-
  Magical light of the look you choose washes over the area. An affected creature is dazzled; an invisible one becomes concealed instead, and one concealed for any other reason no longer is. Each creature attempts a Reflex save.

  **Critical Success** The creature is unaffected.

  **Success** The light affects it for 2 rounds.

  **Failure** The light affects it for 1 minute.

  **Critical Failure** The light affects it for 10 minutes.
spells.revealing-light.name: Revealing Light
spells.revival.description: "A burst of healing soothes the living and briefly rouses the recently slain. Living targets regain 10d8+40 Hit Points. Dead targets return to life temporarily, with raise dead's effects and limits, and with temporary Hit Points equal to the healing the living received but no normal Hit Points. They can't regain Hit Points or gain temporary Hit Points any other way, and when the spell ends they lose these and die. Revival can't revive creatures killed by disintegrate or a death effect, and doesn't affect undead."
spells.revival.name: Revival
spells.rewrite-memory.description: |-
  You change the target's memories: erase one, sharpen one, alter one or add a false one.

  **Critical Success** The target is unaffected and realizes you tried to alter its memory.

  **Success** The target is unaffected and thinks the spell was something harmless, unless it identifies it.

  **Failure** For the first 5 minutes, you can Sustain the spell once a round to change up to 6 seconds of memory, up to 5 continuous minutes in all. The changes last while the spell does; if the target leaves the range, you can't change more.

  **Heightened (6th)** You can cast it on a willing target to permanently suppress all memory of one topic (described in 50 words or fewer), the gap filled with a vague haze.
spells.rewrite-memory.name: Rewrite Memory
spells.ricochet.name: Ricochet
spells.rocket-dash.name: Rocket Dash
spells.root-of-all-pain.name: Root of All Pain
spells.sanctuary.description: |-
  A protective ward deters attacks on the target. A creature must attempt a Will save each time it tries to attack the target. If the target uses a hostile action, the spell ends.

  **Critical Success** The spell ends.

  **Success** The creature can make its attack, and any others against the target this turn.

  **Failure** The creature can't attack the target, wastes the action, and can't attack it again this turn.

  **Critical Failure** The creature wastes the action and can't attack the target for the rest of the spell.
spells.sanctuary.name: Sanctuary
spells.breathe-fire.name: Breathe Fire
spells.scan-environment.name: Scan Environment
spells.scouting-eye.description: 'You create an invisible floating eye, an inch across, at a spot you can see within 500 feet. It sees in all directions with your normal vision and shows you what it sees. The first time you Sustain the spell each round, you can move the eye 30 feet, seeing only ahead, or 10 feet, seeing all around. It can go any distance from you, but the spell ends if you and it are on different planes. You can Seek through it. Any damage destroys it and ends the spell.'
spells.scouting-eye.name: Scouting Eye
spells.scrying.description: |-
  You spy on a creature as with clairvoyance, but the eye appears just above the target, and the view is too imprecise for teleport and the like. You choose the target by name or by touching one of its possessions or a piece of its body. The DC is 2 lower if you have never met it and 10 lower if you don't know who it is.

  **Critical Success** The spell fails, and the target is temporarily immune for 1 week; it also glimpses you and learns your rough distance and direction.

  **Success** The spell fails, and the target is temporarily immune for 1 day.

  **Failure** The spell succeeds.

  **Critical Failure** The spell succeeds, and the eye follows the target up to 60 feet per round.
spells.scrying.name: Scrying
spells.see-the-unseen.description: |-
  You see invisible creatures as blurred shapes, concealed and hard to identify, and incorporeal creatures within 10 feet of an object's surface through it. You also gain a +2 status bonus to checks to disbelieve illusions.

  **Heightened (5th)** It lasts 8 hours.
spells.see-the-unseen.name: See the Unseen
spells.seek-the-stars.name: Seek the Stars
spells.selective-invisibility.name: Selective Invisibility
spells.sending.description: 'You send a creature you know well a mental message of 25 words or fewer, and it can answer at once with a message of its own of 25 words or fewer.'
spells.sending.name: Sending
spells.shadow-blast.description: |-
  You shape shadow-stuff into a blast of acid, bludgeoning, cold, electricity, fire, force, piercing, slashing, sonic or spirit damage (your choice), in a 30-foot cone, a 15-foot burst within 120 feet or a 50-foot line. Each creature in the area takes 6d8 damage of that type, with a basic Reflex or Will save (its choice).

  **Heightened (+1)** The damage increases by 1d8.
spells.shadow-blast.name: Shadow Blast
spells.shape-stone.name: Shape Stone
spells.shape-wood.name: Shape Wood
spells.cairn-form.name: Cairn Form
spells.share-life.description: 'The target takes half the Hit Point damage from every effect, and you take the rest, with none of your resistances, weaknesses or other abilities applied. The spell ends if the target is more than 30 feet away, or once either of you reaches 0 Hit Points (after that damage is resolved).'
spells.share-life.name: Share Life
spells.share-pain.name: Share Pain
spells.shatter.name: Shatter
spells.shield.name: Shield
spells.shifting-surge.name: Shifting Surge
spells.shrink.description: |-
  The target shrinks to Tiny, with its equipment (an item it removes returns to normal size). Its reach becomes 0 feet. A Tiny creature is unaffected.

  **Heightened (6th)** You can target up to 10 creatures.
spells.shrink.name: Shrink
spells.sift-the-sphere.name: Sift the Sphere
spells.sigil.description: |-
  You place your harmless personal mark, about a square inch, on a creature or object, visible or invisible (an Interact to switch). It can be scrubbed off with 5 minutes of work; on a creature it fades after a week.

  **Heightened (3rd)** It fades after a month.

  **Heightened (5th)** It fades after a year.

  **Heightened (7th)** It never fades.
spells.sigil.name: Sigil
spells.silence.description: |-
  The target makes no sound: it can't be noticed by hearing alone, can't use sonic attacks or auditory actions, and can't cast spells other than subtle ones.

  **Heightened (4th)** A 10-foot emanation around the touched creature silences all sound in it or passing through, with the same effects on creatures inside.
spells.silence.name: Silence
spells.singularity-seed.name: Singularity Seed
spells.call-cosmos.name: Call Cosmos
spells.skim-data.name: Skim Data
spells.fiery-wings.name: Fiery Wings
spells.sleep.name: Sleep
spells.slice-reality.name: Slice Reality
spells.slow.name: Slow
spells.sonic-scream.name: Sonic Scream
spells.soothe.name: Soothe
spells.soul-surge.name: Soul Surge
spells.sound-body.name: Sound Body
spells.speak-with-animals.name: Speak with Animals
spells.calm.description: |-
  You soothe creatures in the area into a nonviolent state; each attempts a Will save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes a –1 status penalty to attack rolls.

  **Failure** Emotion effects on the creature are suppressed and it can't use hostile actions. If anyone is hostile to it, the spell no longer affects it.

  **Critical Failure** As failure, but hostility doesn't end the effect.
spells.calm.name: Calm
spells.speak-with-computers.name: Speak with Computers
spells.speak-with-plants.description: |-
  You can ask plants and fungi questions and understand their answers, though they are no friendlier or wiser than usual: they know little beyond their surroundings, and clever plant monsters are terse and evasive.

  **Heightened (4th)** It lasts 8 hours.
spells.speak-with-plants.name: Speak with Plants
spells.speak-with-stones.description: |-
  You can question natural or worked stone and hear its answers, speaking with the spirits within it. Their outlook is colored by the stone's kind and the structure it belongs to, and differs enough from a human's that they notice different things; they best know who has touched them and what lies under or behind them.

  **Heightened (6th)** The duration is 8 hours.
spells.speak-with-stones.name: Speak with Stones
spells.spirit-blast.description: |-
  You strike the target's spirit with ethereal energy for 16d6 spirit damage with a basic Fortitude save.

  **Heightened (+1)** The damage increases by 2d6.
spells.spirit-blast.name: Spirit Blast
spells.spirit-link.description: |-
  You take on another creature's pain. When you cast the spell and at the start of each of your turns, if the target is below its maximum Hit Points it regains 2 Hit Points (or up to its maximum), and you lose as many. Nothing changes the amount, temporary Hit Points are ignored, and it works on undead too. Meanwhile you gain nothing from regeneration or fast healing. You can Dismiss it; it ends if you reach 0 Hit Points.

  **Heightened (+1)** The Hit Points transferred increase by 2.
spells.spirit-link.name: Spirit Link
spells.spiritual-armament.description: |-
  You fling a ghostly echo of a weapon you wield or wear: a spell attack against the target's AC, dealing 2d8 damage of the weapon's type (or spirit damage, if that would be worse for the target) on a hit, double on a critical hit. It uses and adds to your multiple attack penalty. Each time you Sustain the spell, you can attack again any creature within 120 feet. If you sanctify the spell, the attacks are sanctified.

  **Heightened (+2)** The damage increases by 1d8.
spells.spiritual-armament.name: Spiritual Armament
spells.stabilize.description: 'The target loses the dying condition, though it stays unconscious at 0 Hit Points.'
spells.stabilize.name: Stabilize
spells.status.description: |-
  While you and the target are on the same plane and alive, you know its direction and distance from you and the conditions affecting it.

  **Heightened (4th)** The range is 30 feet, and you can target up to 10 creatures.
spells.status.name: Status
spells.stumble.name: Stumble
spells.stupefy.name: Stupefy
spells.carcinization.name: Carcinization
spells.subconscious-suggestion.name: Subconscious Suggestion
spells.subjective-reality.name: Subjective Reality
spells.suggestion.name: Suggestion
spells.summon-animal.name: Summon Animal
spells.summon-celestial.name: Summon Celestial
spells.summon-construct.name: Summon Construct
spells.summon-dragon.name: Summon Dragon
spells.summon-elemental.name: Summon Elemental
spells.summon-entity.name: Summon Entity
spells.summon-fey.name: Summon Fey
spells.adhere.name: Adhere
spells.cataclysm.description: 'You bring down a piece of every world-ending catastrophe at once on all creatures in the area, treating their resistances as 10 lower against it. Each attempts one basic Reflex save against all of it: acid rain (3d10 acid), an earthquake (3d10 bludgeoning to creatures on the ground), freezing wind (3d10 cold), lightning (3d10 electricity), beating winds (3d10 bludgeoning to flying creatures), a tsunami (3d10 bludgeoning, doubled for swimming creatures) and a wildfire (3d10 fire).'
spells.cataclysm.name: Cataclysm
spells.summon-fiend.name: Summon Fiend
spells.summon-giant.name: Summon Giant
spells.summon-instrument.description: |-
  A handheld musical instrument of your choice appears in your hand, playable only by you. It vanishes when the spell ends or when you cast it again.

  **Heightened (5th)** The instrument is a virtuoso instrument.
spells.summon-instrument.name: Summon Instrument
spells.summon-monitor.name: Summon Monitor
spells.summon-plant-or-fungus.name: Summon Plant or Fungus
spells.summon-robot.name: Summon Robot
spells.summon-undead.name: Summon Undead
spells.sunburst.description: |-
  A globe of searing sunlight bursts in the area: 8d10 fire damage to every creature, plus 8d10 vitality damage to undead, by their Reflex saves. It tries to counteract magical darkness it overlaps.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage.

  **Critical Failure** Full damage, and permanently blinded.

  **Heightened (+1)** The fire damage and the vitality damage to undead each increase by 1d10.
spells.sunburst.name: Sunburst
spells.supercharge-weapon.name: Supercharge Weapon
spells.sure-footing.name: Sure Footing
spells.caustic-blast.name: Caustic Blast
spells.sure-strike.name: Sure Strike
spells.synaptic-pulse.name: Synaptic Pulse
spells.tailwind.name: Tailwind
spells.talking-corpse.description: |-
  The target corpse gains enough semblance of life to answer three questions from its body's memories (not its spirit). It must be mostly intact, with a mouth and throat; the more damaged it is, the more patchy its answers. The spell fails if it was cast on the corpse in the last week. The corpse can resist with a Will save using its statistics at death.

  **Critical Success** It can lie or refuse, and its spirit haunts you for 24 hours, keeping you from resting.

  **Success** It can give false answers or refuse.

  **Failure** It must answer truthfully, though briefly, cryptically and repetitively, and can stall to run out the clock.

  **Critical Failure** As failure, but its answers are more direct, and it takes a –2 status penalty to Deception checks to mislead you.
spells.talking-corpse.name: Talking Corpse
spells.tangle-vine.description: |-
  A vine lashes out at the target. Make a spell attack against it.

  **Critical Success** The target is immobilized and takes a –10-foot circumstance penalty to its Speeds for 1 round. It can Escape against your spell DC to end both.

  **Success** The target takes a –10-foot circumstance penalty to its Speeds for 1 round. It can Escape against your spell DC to end it.

  **Failure** The target is unaffected.

  **Heightened (2nd)** The effects last 2 rounds.

  **Heightened (4th)** The effects last 1 minute.
spells.tangle-vine.name: Tangle Vine
spells.telekinetic-hand.description: |-
  An invisible or ghostly hand lifts the target object and moves it slowly up to 20 feet; Sustaining the spell moves it 20 feet more. It falls when the spell ends.

  **Heightened (3rd)** You can target an unattended object of 1 Bulk or less.

  **Heightened (5th)** The range is 60 feet, and you can target an unattended object of 1 Bulk or less.

  **Heightened (7th)** The range is 60 feet, and you can target an unattended object of 2 Bulk or less.
spells.telekinetic-hand.name: Telekinetic Hand
spells.telekinetic-haul.name: Telekinetic Haul
spells.telekinetic-maneuver.description: 'You telekinetically Disarm, Reposition, Shove or Trip the target, rolling a spell attack instead of an Athletics check.'
spells.telekinetic-maneuver.name: Telekinetic Maneuver
spells.telekinetic-projectile.description: |-
  You hurl a loose unattended object of 1 Bulk or less at the target. Make a spell attack against its AC: a hit deals 2d6 bludgeoning, piercing or slashing damage, as fits the object, and a critical hit double damage. The object's own traits and magic don't apply.

  **Heightened (+1)** The damage increases by 1d6.
spells.telekinetic-projectile.name: Telekinetic Projectile
spells.telekinetic-strangulation.name: Telekinetic Strangulation
spells.caustic-conversion.name: Caustic Conversion
spells.telekinetic-tantrum.name: Telekinetic Tantrum
spells.telepathy.name: Telepathy
spells.teleport.description: |-
  You and the targets are carried instantly to any place within 100 miles that you can identify precisely, by where it lies from you and by how it looks. False knowledge of its appearance usually makes the spell fail, or may lead to a mishap or an unwanted destination as the GM decides. You arrive about 1 percent of the distance traveled off target, in a direction the GM chooses.

  **Heightened (7th)** Anywhere within 1,000 miles.

  **Heightened (8th)** Anywhere on the same planet; past 1,000 miles, you arrive only 10 miles off target.

  **Heightened (9th)** Anywhere on another planet in the same solar system; with accurate knowledge of the place, you arrive 100 miles off target.

  **Heightened (10th)** As 9th rank, but any planet in the same galaxy.
spells.teleport.name: Teleport
spells.temporal-bullets.name: Temporal Bullets
spells.thunderstrike.name: Thunderstrike
spells.times-edge.name: "Time's Edge"
spells.toxic-cloud.name: Toxic Cloud
spells.translate.description: |-
  The target understands the meaning of one language it hears or reads when you cast the spell (not codes or heavy metaphor). If it hears several, it chooses one if it knows they are there, otherwise one at random.

  **Heightened (3rd)** The target can also speak the language.

  **Heightened (4th)** You can target up to 10 creatures, and they can speak the language.
spells.translate.name: Translate
spells.translocate.name: Translocate
spells.true-target.name: True Target
spells.cellular-stimulant.name: Cellular Stimulant
spells.truesight.name: Truesight
spells.truespeech.description: |-
  The target understands all words in any language and can speak other creatures' languages: each time it speaks, it can choose a creature and speak in a language that creature understands, even without knowing which language it is.

  **Heightened (7th)** The duration is 8 hours.
spells.truespeech.name: Truespeech
spells.uncontrollable-dance.name: Uncontrollable Dance
spells.unfettered-movement.name: Unfettered Movement
spells.unfettered-pack.name: Unfettered Pack
spells.vampiric-exsanguination.description: |-
  You draw in the blood and life of living creatures in the area: 12d6 void damage with a basic Fortitude save. You gain temporary Hit Points equal to half the damage taken by the creature that took the most; you lose any left after 1 minute.

  **Heightened (+1)** The damage increases by 2d6.
spells.vampiric-exsanguination.name: Vampiric Exsanguination
spells.vampiric-feast.description: |-
  Your touch drains the target's life: 6d6 void damage with a basic Fortitude save. You gain temporary Hit Points equal to half the damage it takes (after resistances and the like), which last 1 minute.

  **Heightened (+1)** The damage increases by 2d6.
spells.vampiric-feast.name: Vampiric Feast
spells.vapor-form.name: Vapor Form
spells.veil-of-privacy.name: Veil of Privacy
spells.verdant-code.name: Verdant Code
spells.chain-lightning.name: Chain Lightning
spells.vibe-check.name: Vibe Check
spells.vibrant-pattern.description: |-
  A pattern of pulsing lights dazzles every creature inside it. A creature attempts a Will save when it is inside the pattern as you cast it, enters it, ends its turn in it, or Seeks or Interacts with it; a creature the pattern has blinded doesn't save again.

  **Success** The creature is unaffected.

  **Failure** It is blinded by the pattern. Once outside, it can attempt a new save at the end of each of its turns to recover, for at most 1 minute.

  **Critical Failure** It is blinded for 1 minute.
spells.vibrant-pattern.name: Vibrant Pattern
spells.vision-of-death.name: Vision of Death
spells.vital-beacon.description: |-
  Vitality radiates from you. Once per round, you or an ally can Interact to lay hands on you and regain Hit Points: 4d10 for the first creature, 4d8 for the second, 4d6 for the third and 4d4 for the fourth, after which the spell ends. You can have only one vital beacon at a time.

  **Heightened (+1)** Each healing gains one more die of its size.
spells.vital-beacon.name: Vital Beacon
spells.vitality-lash.description: |-
  Vital energy strikes at the target's corrupted essence: 2d6 vitality damage with a basic Fortitude save. On a critical failure, it is also enfeebled 1 until the start of your next turn.

  **Heightened (+1)** The damage increases by 1d6.
spells.vitality-lash.name: Vitality Lash
spells.void-scour.name: Void Scour
spells.void-seed.name: Void Seed
spells.void-vessel.name: Void Vessel
spells.void-warp.name: Void Warp
spells.void-whispers.name: Void Whispers
spells.charm.name: Charm
spells.wails-of-the-damned.description: |-
  You howl the lament of damned souls. Each living enemy in the area takes 8d10 void damage by its Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** Full damage.

  **Failure** Full damage, and drained 1d4.

  **Critical Failure** Double damage, and drained 4.
spells.wails-of-the-damned.name: Wails of the Damned
spells.wall-of-fire.name: Wall of Fire
spells.wall-of-force.name: Wall of Force
spells.wall-of-ice.description: |-
  You raise an opaque ice barrier 1 foot thick: a line up to 60 feet long and 10 feet high, anchored at both ends but not necessarily vertical, or a hemisphere of 10-foot radius (smaller if you like). It must form in open space, its edges passing through no creature or object, or the spell is lost. Each 10-foot section has AC 10, Hardness 10, 40 HP, weakness 15 to fire, and immunity to critical hits, cold and precision damage. A section destroyed by fire melts away; one destroyed otherwise leaves chilling ice that is difficult terrain and deals 2d6 cold damage to a creature moving through it.

  **Heightened (+2)** Each section has 10 more HP, and the cold damage increases by 1d6.
spells.wall-of-ice.name: Wall of Ice
spells.wall-of-plasma.name: Wall of Plasma
spells.wall-of-steel.name: Wall of Steel
spells.wall-of-stone.name: Wall of Stone
spells.wall-of-thorns.name: Wall of Thorns
spells.wall-of-wind.name: Wall of Wind
spells.warp-mind.name: Warp Mind
spells.chilling-darkness.description: |-
  A ray of unholy, freezing darkness: make a ranged spell attack. It deals 5d6 cold damage, plus 5d6 spirit damage if the target has the holy trait.

  **Critical Success** The target takes double damage.

  **Success** The target takes full damage.

  If the ray passes through magical light or targets a creature affected by it, it attempts to counteract the light.

  **Heightened (+1)** The cold damage increases by 2d6, and the spirit damage against holy creatures by 2d6.
spells.chilling-darkness.name: Chilling Darkness
spells.water-breathing.description: |-
  The targets can breathe underwater.

  **Heightened (3rd)** It lasts 8 hours.

  **Heightened (4th)** It lasts until your next daily preparations.
spells.water-breathing.name: Water Breathing
spells.water-walk.description: |-
  The target walks on water and other liquids without sinking. It can go under if it wishes, then Swims normally; it can't breathe underwater.

  **Heightened (4th)** The range is 30 feet, it lasts 1 hour, and you can target up to 10 creatures.
spells.water-walk.name: Water Walk
spells.wave-of-despair.name: Wave of Despair
spells.wave-of-warning.name: Wave of Warning
spells.weight-of-ages.name: Weight of Ages
spells.wisp-ally.name: Wisp Ally
spells.x-ray-vision.name: X-Ray Vision
spells.akashic-fount.name: Akashic Fount
spells.akashic-assistant.name: Akashic Assistant
spells.data-drain.name: Data Drain
spells.chrono-push.name: Chrono Push
spells.elemental-weapon.name: Elemental Weapon
spells.elemental-barrier.name: Elemental Barrier
spells.elemental-nova.name: Elemental Nova
spells.infusion.name: Infusion
spells.vitality-nova.name: Vitality Nova
spells.vital-rebirth.name: Vital Rebirth
spells.anthem.name: Anthem
spells.shuffle-repeat.name: Shuffle Repeat
spells.remix.name: Remix
spells.shadow-snap.name: Shadow Snap
spells.clairaudience.name: Clairaudience
spells.cloying-shadows.name: Cloying Shadows
spells.shadow-prison.name: Shadow Prison
spells.eldritch-bond.name: Eldritch Bond
spells.vitality-web.name: Vitality Web
spells.wild-bond.name: Wild Bond
spells.warp-probability.name: Warp Probability
spells.alternate-outcome.name: Alternate Outcome
spells.quantum-analysis.name: Quantum Analysis
spells.warp-terrain.name: Warp Terrain
spells.warp-world.name: Warp World
spells.clairvoyance.name: Clairvoyance
spells.parallel-forms.name: Parallel Forms
spells.warp-presence.name: Warp Presence
spells.forget.name: Forget
spells.reality-wipe.name: Reality Wipe
spells.warp-time.name: Warp Time
spells.accelerate.name: Accelerate
spells.time-loop.name: Time Loop
spells.quantum-negation.name: Quantum Negation
spells.tech-intuition.name: Tech Intuition
spells.commune-with-tech.name: Commune With Tech
spells.aerial-form.description: |-
  You take a Medium flying animal battle form of your choice (bat, bird, pterosaur or wasp) and gain the animal trait. You can Dismiss the spell. In the form you have AC 18 + your level (ignoring your armor's check penalty and Speed reduction), 5 temporary Hit Points, low-light vision, an Acrobatics modifier of +16 unless yours is higher, and the form's unarmed attacks, which are the only ones you can Strike with: trained, Dexterity-based, attack modifier +16 and damage bonus +5 (or your own Dexterity unarmed attack modifier if higher).

  - **Bat** Speed 20 feet, fly 30 feet, precise echolocation 40 feet; fangs 2d8 piercing; wing (agile) 2d6 bludgeoning.
  - **Bird** Speed 10 feet, fly 50 feet; beak 2d8 piercing; talon (agile) 1d10 slashing.
  - **Pterosaur** Speed 10 feet, fly 40 feet, imprecise scent 30 feet; beak 3d6 piercing.
  - **Wasp** Speed 20 feet, fly 40 feet; stinger 1d8 piercing plus 1d6 persistent poison.

  **Heightened (5th)** Large, with a +10-foot status bonus to your fly Speed; 10 temporary HP, attack +18, damage +8, Acrobatics +20.

  **Heightened (6th)** Huge, with a +15-foot status bonus to your fly Speed and 10-foot reach; AC 21 + your level, 15 temporary HP, attack +21, damage +4 with double the damage dice (persistent damage included), Acrobatics +23.
spells.aerial-form.name: Aerial Form
spells.cleanse-affliction.description: |-
  Choose an affliction on the target, such as a curse, disease or poison. If it is past stage 1, it goes down one stage; this can happen only once for a given case.

  **Heightened (3rd)** You also attempt to counteract it, if it is a disease or poison.

  **Heightened (4th)** You also attempt to counteract it, if it is a curse, disease or poison.
spells.cleanse-affliction.name: Cleanse Affliction
spells.cleanse-cuisine.description: |-
  The food and drink in the area become delicious (water into wine or another fine drink, plain fare into a gourmet treat), and you can remove all toxins and contamination from it. It doesn't prevent later spoilage, nor make the food more nourishing.

  **Heightened (+2)** Add another contiguous cubic foot to the area.
spells.cleanse-cuisine.name: Cleanse Cuisine
spells.clear-mind.name: Clear Mind
spells.command.name: Command
spells.confusion.name: Confusion
spells.contingency.name: Contingency
spells.control-machine.name: Control Machine
spells.corrosive-haze.name: Corrosive Haze
spells.cozy-crashpad.name: Cozy Crashpad
spells.create-food.description: |-
  You create bland but nourishing food for six Medium creatures for a day; uneaten, it spoils after a day. A Small creature eats a quarter as much as a Medium one (a Tiny one a sixteenth), a Large one ten times as much (Huge, a hundred times).

  **Heightened (4th)** Food for 12 Medium creatures.

  **Heightened (6th)** Food for 50 Medium creatures.

  **Heightened (8th)** Food for 200 Medium creatures.
spells.create-food.name: Create Food
spells.air-bubble.description: "A bubble of air forms around the target's head, letting it breathe normally. It ends as soon as the target is back where it can breathe."
spells.air-bubble.texts.trigger: "a creature within range enters an environment where it can't breathe"
spells.air-bubble.name: Air Bubble
spells.create-water.description: 'Water flows from your cupped hands: 2 gallons, which evaporate after a day if no one drinks them.'
spells.create-water.name: Create Water
spells.creation.name: Creation
spells.crisis-of-faith.description: |-
  You assail the target's faith with doubt: 6d6 mental damage, or 6d8 if it can cast divine spells, by its Will save. Casting it on a follower of your own deity without good cause is anathema to many deities.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage.

  **Failure** The target takes full damage; a divine caster is also stupefied 1 for 1 round.

  **Critical Failure** The target takes double damage, is stupefied 1 for 1 round, and can't cast divine spells for 1 round.

  **Heightened (+1)** The damage increases by 2d6 (2d8 against a divine spellcaster).
spells.crisis-of-faith.name: Crisis of Faith
spells.cursed-metamorphosis.name: Cursed Metamorphosis
spells.darkness.description: |-
  Light can't enter the area or shine within it: non-magical light sources inside give no light, and magical light of this spell's rank or lower is suppressed. Creatures inside can't see out, and from outside it looks like a globe of darkness.

  **Heightened (4th)** Even creatures with darkvision (but not greater darkvision) barely see through it: targets seen through it are concealed to them.
spells.darkness.name: Darkness
spells.darkvision.description: |-
  You gain darkvision.

  **Heightened (3rd)** The range is touch and the target one willing creature.

  **Heightened (5th)** As 3rd, and it lasts until your next daily preparations.
spells.darkvision.name: Darkvision
spells.daze.name: Daze
spells.deafness.description: |-
  The target loses its hearing by its Fortitude save, and is then temporarily immune for 1 minute.

  **Critical Success** The target is unaffected.

  **Success** The target is deafened for 1 round.

  **Failure** The target is deafened for 10 minutes.

  **Critical Failure** The target is deafened permanently.
spells.deafness.name: Deafness
spells.death-sentence.name: Death Sentence
spells.delete.name: Delete
spells.akashic-download.name: Akashic Download
spells.desiccate.description: |-
  You draw the moisture from the targets' bodies: 10d10 void damage with a basic Fortitude save. Creatures made of water and plant creatures take the result one degree worse than their save; creatures with no real moisture in them, such as earth elementals, are immune.

  **Heightened (+1)** The damage increases by 1d10.
spells.desiccate.name: Desiccate
spells.detect-magic.description: |-
  A pulse tells you whether magic is present in the area, and nothing more. You can ignore magic you're fully aware of, such as your allies' magic items and spells. Illusion magic is detected only if its rank is lower than this spell's (though items with an illusion aura that aren't deceptive in appearance are usually detected normally).

  **Heightened (3rd)** You also learn the rank or level of the most powerful magic the spell detects, as the GM decides.

  **Heightened (4th)** As 3rd rank, and you also narrow the source of the highest-rank magic down to a 5-foot cube (or the nearest larger area), as an imprecise sense would.
spells.detect-magic.name: Detect Magic
spells.detect-poison.description: |-
  You learn whether the target creature is venomous or poisonous, or whether the target object is poison or has been poisoned, but not the kind or how many. Some substances, such as lead and alcohol, are poisons and mask others.

  **Heightened (2nd)** You learn the number and types of poison.
spells.detect-poison.name: Detect Poison
spells.detect-scrying.name: Detect Scrying
spells.detect-thoughts.name: Detect Thoughts
spells.disappearance.name: Disappearance
spells.discharge.name: Discharge
spells.disguise-magic.name: Disguise Magic
spells.disintegrate.name: Disintegrate
spells.dispel-magic.name: Dispel Magic
spells.akashic-revival.name: Akashic Revival
spells.dispelling-globe.description: 'An immobile globe surrounds you. It tries to counteract every spell from outside whose area or targets enter it, as dispel magic of 1 rank lower than this spell. A success stops only the part of the spell that would enter the globe. The globe must form in open space, its edges passing through no creature or object, or the spell is lost; creatures can enter it afterward.'
spells.dispelling-globe.name: Dispelling Globe
spells.divine-immolation.description: |-
  Divine flames scour the area for 6d6 fire damage and 2d6 persistent fire damage, by each creature's Reflex save. A creature takes spirit damage instead of fire if that would be worse for it, as the GM decides.

  **Critical Success** The creature is unaffected.

  **Success** Half damage and no persistent damage.

  **Failure** Full damage and the persistent damage.

  **Critical Failure** Double damage and double persistent damage.

  **Heightened (+1)** The damage increases by 1d6 and the persistent damage by 1d6.
spells.divine-immolation.name: Divine Immolation
spells.divine-inspiration.description: You fill the target with spiritual energy. A prepared caster recovers one spell of 6th rank or lower it cast today and can cast it again; a spontaneous caster recovers one spell slot of 6th rank or lower; and a creature with a focus pool regains its Focus Points as if it had Refocused.
spells.divine-inspiration.name: Divine Inspiration
spells.divine-lance.description: |-
  A beam of divine energy flies at the target. Make a ranged spell attack against its AC: a hit deals 2d4 spirit damage, a critical hit double damage.

  **Heightened (+1)** The damage increases by 1d4.
spells.divine-lance.name: Divine Lance
spells.divine-wrath.description: |-
  Divine fury strikes the enemies in the area for 4d10 spirit damage, by their Fortitude saves.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is sickened 1.

  **Critical Failure** The creature takes full damage and is sickened 2, and is slowed 1 while it is sickened.

  **Heightened (+1)** The damage increases by 1d10.
spells.divine-wrath.name: Divine Wrath
spells.dizzying-colors.name: Dizzying Colors
spells.dominate.description: |-
  You take command of the target. If you give a plainly self-destructive order, it does nothing until you give another.

  **Critical Success** The target is unaffected.

  **Success** The target is stunned 1 as it fights off your commands.

  **Failure** The target is controlled by you, but it can attempt a Will save at the end of each of its turns, ending the spell on a success.

  **Critical Failure** As failure, but it gets a new save only when you order it to do something against its nature, such as killing its allies.

  **Heightened (10th)** The duration is unlimited.
spells.dominate.name: Dominate
spells.doom-scroll.name: Doom Scroll
spells.dragon-form.name: Dragon Form
spells.dream-of-home.name: Dream of Home
spells.alarm.name: Alarm
spells.dreaming-potential.name: Dreaming Potential
spells.earthbind.name: Earthbind
spells.earthquake.name: Earthquake
spells.eclipse-burst.description: |-
  A globe of freezing darkness bursts in the area: 8d10 cold damage to every creature, plus 8d4 void damage to living ones, by their Reflex saves. It tries to counteract magical light in the area or on a creature in it.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage.

  **Critical Failure** Double damage, and blinded for an unlimited duration.

  **Heightened (+1)** The cold damage increases by 1d10 and the void damage by 1d4.
spells.eclipse-burst.name: Eclipse Burst
spells.eldritch-lance.name: Eldritch Lance
spells.eldritch-wrath.name: Eldritch Wrath
spells.electric-arc.description: |-
  Lightning leaps between one or two targets. Each takes 2d4 electricity damage with a basic Reflex save.

  **Heightened (+1)** The damage increases by 1d4.
spells.electric-arc.name: Electric Arc
spells.electrotether.name: Electrotether
spells.elemental-form.description: |-
  You take a Medium elemental battle form of the element you choose, gaining its trait and the elemental trait; you have hands and can use manipulate actions. You can Dismiss the spell. In the form you have AC 19 + your level (ignoring your armor's check penalty and Speed reduction), 10 temporary Hit Points, darkvision, Acrobatics (air, fire, metal) or Athletics (earth, water, wood) +20 unless yours is higher, and the form's unarmed attacks, the only ones you can Strike with: trained, attack modifier +18 and damage bonus +9, Dexterity-based for air, fire and metal and Strength-based otherwise (or your own unarmed attack modifier if higher).

  - **Air** fly 80 feet, and your movement doesn't trigger reactions; gust 1d4 bludgeoning.
  - **Earth** Speed 20 feet, burrow 20 feet; boulder 2d10 bludgeoning.
  - **Fire** Speed 50 feet; fire resistance 10, weakness 5 to cold and to water; tendril 1d8 fire plus 1d4 persistent fire.
  - **Metal** Speed 40 feet, fly 20 feet; blade (versatile piercing) 1d8 slashing plus 1d4 electricity.
  - **Water** Speed 20 feet, swim 60 feet; fire resistance 5; wave 1d12 bludgeoning, and after a hit you can spend an action to push the target 5 feet as a successful Shove.
  - **Wood** Speed 20 feet, climb 30 feet; branch 2d10 bludgeoning.

  **Heightened (6th)** Large, with 10-foot reach; AC 22 + your level, 15 temporary HP, attack +23, damage +13, skill +23.

  **Heightened (7th)** Huge, with 15-foot reach; AC 22 + your level, 20 temporary HP, attack +25, damage +11 with double the damage dice (persistent damage included), skill +25.
spells.elemental-form.name: Elemental Form
spells.embed-message.description: |-
  You set a trigger and a message of up to 25 words. When the trigger happens within 30 feet of the target, illusory text circles it and a disembodied voice speaks the message, in a language you know and a voice you choose. The spell then ends.

  **Heightened (4th)** You can add a simple, obviously illusory sensory flourish (a smell, a visual effect, a sensation) that lasts while the message plays.

  **Heightened (6th)** As 4th, and you choose how many times the message repeats before the spell ends, without limit.
spells.embed-message.name: Embed Message
spells.analyze-target.name: Analyze Target
spells.energy-aegis.name: Energy Aegis
spells.enfeeble.name: Enfeeble
spells.enhance-body.name: Enhance Body
spells.enhance-weapon.name: Enhance Weapon
spells.enlarge.name: Enlarge
spells.entangling-flora.name: Entangling Flora
spells.enthrall.name: Enthrall
spells.entropy-strike.name: Entropy Strike
spells.environmental-endurance.name: Environmental Endurance
spells.event-horizon.name: Event Horizon
spells.unfathomable-song.name: Unfathomable Song
spells.unfathomable-song.description: |-
  A strange, unnatural song overtakes the targets' minds. Each attempts a Will save when you cast the spell and the first time you Sustain it each round (once a round at most); the targets stay the same.

  **Critical Success** The target is unaffected, can't be affected later, and is temporarily immune for 1 minute.

  **Success** Unaffected this round.

  **Failure** Roll 1d4 on the table.

  **Critical Failure** Roll 1d4+1 on the table.

  **1** Frightened 2. **2** Confused for 1 round. **3** Stupefied 4 for 1 round. **4** Blinded for 1 round. **5** Stunned for 1 round, and stupefied 1 for an unlimited duration.
