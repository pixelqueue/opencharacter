consumables.silver-ammunition-low-grade.description: 'Silver ammunition deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. Low-grade. Craft requirement: 2 credits of silver. Level 2, 40 credits.'
consumables.silver-grenade-missile-low-grade.description: 'A silver grenade or missile deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. Low-grade. Craft requirement: 6 credits of silver. Level 2, 120 credits.'
materials.silver-weapon-low-grade.description: 'A silver weapon deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. Low-grade. Price is 400 credits plus 40 credits per Bulk. Craft requirement: 20 credits of silver plus 2 credits per Bulk. Level 2, 400 credits.'
consumables.silver-ammunition-standard-grade.description: 'Silver ammunition deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. Standard-grade. Craft requirement: 110 credits of silver. Level 10, 880 credits.'
consumables.silver-grenade-missile-standard-grade.description: 'A silver grenade or missile deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. Standard-grade. Craft requirement: 330 credits of silver. Level 10, 2,640 credits.'
materials.silver-weapon-standard-grade.description: 'A silver weapon deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. Standard-grade. Price is 8,800 credits plus 880 credits per Bulk. Craft requirement: 1,100 credits of silver plus 110 credits per Bulk. Level 10, 8,800 credits.'
consumables.silver-ammunition-high-grade.description: 'Silver ammunition deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. High-grade. Craft requirement: 4,500 credits of silver. Level 16, 9,000 credits.'
consumables.silver-grenade-missile-high-grade.description: 'A silver grenade or missile deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. High-grade. Craft requirement: 13,500 credits of silver. Level 16, 27,000 credits.'
materials.silver-weapon-high-grade.description: 'A silver weapon deals additional damage to creatures with a weakness to silver and ignores the resistance of creatures such as devils. High-grade. Price is 90,000 credits plus 9,000 credits per Bulk. Craft requirement: 45,000 credits of silver plus 4,500 credits per Bulk. Level 16, 90,000 credits.'
consumables.abysium-ammunition-standard-grade.description: "Abysium is a blue-green metal with a green luminescence that damages creatures' immune systems. Abysium ammunition must be loaded into an empty upgrade slot of the weapon, reducing the weapon's available upgrades by one. On a successful Strike it deals an extra 1d4 poison damage, and on a critical hit the target is sickened 1. Standard-grade. Craft requirement: 250 credits of abysium. Level 11, 2,000 credits."
consumables.abysium-grenade-missile-standard-grade.description: "Abysium is a blue-green metal with a green luminescence that damages creatures' immune systems. It is safely contained in an outer shell. A grenade or missile of it deals an extra 1d4 poison damage on a successful Strike, and on a critical hit the target is sickened 1. Standard-grade. Craft requirement: 750 credits of abysium. Level 11, 6,000 credits."
materials.abysium-weapon-standard-grade.description: "Abysium is a blue-green metal with a green luminescence that damages creatures' immune systems. An abysium weapon is safely contained in an outer shell but has one fewer upgrade slot. It deals an extra 1d4 poison damage on a successful Strike, and on a critical hit the target is sickened 1. Standard-grade. Price is 20,000 credits plus 2,000 credits per Bulk. Craft requirement: 2,500 credits of abysium plus 250 credits per Bulk. Level 11, 20,000 credits."
consumables.abysium-ammunition-high-grade.description: "Abysium is a blue-green metal with a green luminescence that damages creatures' immune systems. Abysium ammunition must be loaded into an empty upgrade slot of the weapon, reducing the weapon's available upgrades by one. On a successful Strike it deals an extra 1d4 poison damage, and on a critical hit the target is sickened 2. High-grade. Craft requirement: 12,000 credits of abysium. Level 17, 24,000 credits."
consumables.abysium-grenade-missile-high-grade.description: "Abysium is a blue-green metal with a green luminescence that damages creatures' immune systems. It is safely contained in an outer shell. A grenade or missile of it deals an extra 1d4 poison damage on a successful Strike, and on a critical hit the target is sickened 2. High-grade. Craft requirement: 36,000 credits of abysium. Level 17, 72,000 credits."
materials.abysium-weapon-high-grade.description: "Abysium is a blue-green metal with a green luminescence that damages creatures' immune systems. An abysium weapon is safely contained in an outer shell but has one fewer upgrade slot. It deals an extra 1d4 poison damage on a successful Strike, and on a critical hit the target is sickened 2. High-grade. Price is 240,000 credits plus 24,000 credits per Bulk. Craft requirement: 120,000 credits of abysium plus 12,000 credits per Bulk. Level 17, 240,000 credits."
consumables.adamantine-ammunition-standard-grade.description: "Shiny black adamantine ammunition blasts through obstacles. It treats any object it hits as having half its usual Hardness, unless the object's Hardness is higher than 5. Standard-grade. Craft requirement: 175 credits of adamantine. Level 11, 1,400 credits."
consumables.adamantine-grenade-missile-standard-grade.description: "Shiny black adamantine grenades and missiles blast through obstacles. They treat any object they hit as having half its usual Hardness, unless the object's Hardness is higher than 5. Standard-grade. Craft requirement: 525 credits of adamantine. Level 11, 4,200 credits."
materials.adamantine-weapon-standard-grade.description: "A shiny black adamantine weapon blasts through obstacles. It treats any object it hits as having half its usual Hardness, unless the object's Hardness is higher than 5. Standard-grade. Price is 14,000 credits plus 1,400 credits per Bulk. Craft requirement: 1,750 credits of adamantine plus 175 credits per Bulk. Level 11, 14,000 credits."
consumables.adamantine-ammunition-high-grade.description: "Shiny black adamantine ammunition blasts through obstacles. It treats any object it hits as having half its usual Hardness, unless the object's Hardness is higher than 8. High-grade. Craft requirement: 6,750 credits of adamantine. Level 17, 13,500 credits."
consumables.adamantine-grenade-missile-high-grade.description: "Shiny black adamantine grenades and missiles blast through obstacles. They treat any object they hit as having half its usual Hardness, unless the object's Hardness is higher than 8. High-grade. Craft requirement: 20,250 credits of adamantine. Level 17, 40,500 credits."
materials.adamantine-weapon-high-grade.description: "A shiny black adamantine weapon blasts through obstacles. It treats any object it hits as having half its usual Hardness, unless the object's Hardness is higher than 8. High-grade. Price is 135,000 credits plus 13,500 credits per Bulk. Craft requirement: 67,500 credits of adamantine plus 6,750 credits per Bulk. Level 17, 135,000 credits."
consumables.dull-yellow-ore-ammunition-standard-grade.description: 'Dull yellow ore is the dull yellow remains of a planet, often found in a crescent shape. Weapons made of it gain the critical (mental) trait. Standard-grade. Craft requirement: 115 credits of dull yellow ore. Level 11, 920 credits.'
materials.dull-yellow-ore-weapon-standard-grade.description: "Dull yellow ore is the dull yellow remains of a planet, often found in a crescent shape; a basic chakram of it is made from unrefined ore unsuitable for any other weapon. Weapons made of it gain the critical (mental) trait. A standard-grade chakram applies the mental critical weapon specialization in addition to its group's normal critical specialization effect. Price is 9,200 credits plus 920 credits per Bulk. Craft requirement: 1,150 credits of dull yellow ore plus 115 credits per Bulk. Level 11, 9,200 credits."
consumables.dull-yellow-ore-grenade-missile-standard-grade.description: 'Dull yellow ore is the dull yellow remains of a planet, often found in a crescent shape. Weapons made of it gain the critical (mental) trait. Standard-grade. Craft requirement: 345 credits of dull yellow ore. Level 11, 2,760 credits.'
consumables.dull-yellow-ore-ammunition-high-grade.description: "Dull yellow ore is the dull yellow remains of a planet, often found in a crescent shape. Weapons made of it gain the critical (mental) trait, and high-grade versions apply the mental critical weapon specialization in addition to the group's normal critical specialization effect. High-grade. Craft requirement: 4,800 credits of dull yellow ore. Level 17, 9,600 credits."
consumables.dull-yellow-ore-grenade-missile-high-grade.description: "Dull yellow ore is the dull yellow remains of a planet, often found in a crescent shape. Weapons made of it gain the critical (mental) trait, and high-grade versions apply the mental critical weapon specialization in addition to the group's normal critical specialization effect. High-grade. Craft requirement: 14,400 credits of dull yellow ore. Level 17, 28,800 credits."
materials.dull-yellow-ore-weapon-high-grade.description: "Dull yellow ore is the dull yellow remains of a planet, often found in a crescent shape; a basic chakram of it is made from unrefined ore unsuitable for any other weapon. Weapons made of it gain the critical (mental) trait, and high-grade ones apply the mental critical weapon specialization in addition to the group's normal critical specialization effect. You can craft, buy or improve a _fear projector_ upgrade permanently installed in a high-grade chakram of it for half the normal price, without using an upgrade slot. Price is 96,000 credits plus 9,600 credits per Bulk. Craft requirement: 48,000 credits of dull yellow ore plus 4,800 credits per Bulk. Level 17, 96,000 credits."
consumables.cold-iron-ammunition-low-grade.description: 'Cold iron ammunition deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. Low-grade. Craft requirement: 2 credits of cold iron. Level 2, 40 credits.'
consumables.cold-iron-grenade-missile-low-grade.description: 'A cold iron grenade or missile deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. Low-grade. Craft requirement: 6 credits of cold iron. Level 2, 120 credits.'
materials.cold-iron-weapon-low-grade.description: 'A cold iron weapon deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. Low-grade. Price is 400 credits plus 40 credits per Bulk. Craft requirement: 20 credits of cold iron plus 2 credits per Bulk. Level 2, 400 credits.'
consumables.cold-iron-ammunition-standard-grade.description: 'Cold iron ammunition deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. Standard-grade. Craft requirement: 110 credits of cold iron. Level 10, 880 credits.'
consumables.cold-iron-grenade-missile-standard-grade.description: 'A cold iron grenade or missile deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. Standard-grade. Craft requirement: 330 credits of cold iron. Level 10, 2,640 credits.'
materials.cold-iron-weapon-standard-grade.description: 'A cold iron weapon deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. Standard-grade. Price is 8,800 credits plus 880 credits per Bulk. Craft requirement: 1,100 credits of cold iron plus 110 credits per Bulk. Level 10, 8,800 credits.'
consumables.cold-iron-ammunition-high-grade.description: 'Cold iron ammunition deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. High-grade. Craft requirement: 4,500 credits of cold iron. Level 16, 9,000 credits.'
consumables.cold-iron-grenade-missile-high-grade.description: 'A cold iron grenade or missile deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. High-grade. Craft requirement: 13,500 credits of cold iron. Level 16, 27,000 credits.'
materials.cold-iron-weapon-high-grade.description: 'A cold iron weapon deals additional damage to creatures with a weakness to cold iron, such as devils and gremlins. High-grade. Price is 90,000 credits plus 9,000 credits per Bulk. Craft requirement: 45,000 credits of cold iron plus 4,500 credits per Bulk. Level 16, 90,000 credits.'
consumables.djezet-ammunition-standard-grade.description: Ammunition made of djezet, a rust red metal that is liquid at room temperature and highly reactive to magic. A critical hit against a prepared or spontaneous spellcaster makes the target lose one prepared spell or one spontaneous spell slot unless it succeeds at a Will save (DC 30). The slot is chosen at random from the caster's three highest spell ranks (then from the spells prepared in that rank, for a prepared caster). Standard grade. Level 12, 1,800 credits.
consumables.djezet-grenade-missile-standard-grade.description: Grenade or missile made of djezet, a rust red metal that is liquid at room temperature and highly reactive to magic. A critical hit against a prepared or spontaneous spellcaster makes the target lose one prepared spell or one spontaneous spell slot unless it succeeds at a Will save (DC 30). The slot is chosen at random from the caster's three highest spell ranks (then from the spells prepared in that rank, for a prepared caster). Standard grade. Level 12, 5,400 credits.
materials.djezet-weapon-standard-grade.description: Weapon made of djezet, a rust red metal that is liquid at room temperature and highly reactive to magic. A critical hit against a prepared or spontaneous spellcaster makes the target lose one prepared spell or one spontaneous spell slot unless it succeeds at a Will save (DC 30). The slot is chosen at random from the caster's three highest spell ranks (then from the spells prepared in that rank, for a prepared caster). Standard grade. Level 12, 18,000 credits plus 1,800 credits per Bulk.
consumables.djezet-ammunition-high-grade.description: Ammunition made of djezet, a rust red metal that is liquid at room temperature and highly reactive to magic. A critical hit against a prepared or spontaneous spellcaster makes the target lose one prepared spell or one spontaneous spell slot unless it succeeds at a Will save (DC 40). The slot is chosen at random from the caster's three highest spell ranks (then from the spells prepared in that rank, for a prepared caster). High grade. Level 18, 22,000 credits.
consumables.djezet-grenade-missile-high-grade.description: Grenade or missile made of djezet, a rust red metal that is liquid at room temperature and highly reactive to magic. A critical hit against a prepared or spontaneous spellcaster makes the target lose one prepared spell or one spontaneous spell slot unless it succeeds at a Will save (DC 40). The slot is chosen at random from the caster's three highest spell ranks (then from the spells prepared in that rank, for a prepared caster). High grade. Level 18, 66,000 credits.
materials.djezet-weapon-high-grade.description: Weapon made of djezet, a rust red metal that is liquid at room temperature and highly reactive to magic. A critical hit against a prepared or spontaneous spellcaster makes the target lose one prepared spell or one spontaneous spell slot unless it succeeds at a Will save (DC 40). The slot is chosen at random from the caster's three highest spell ranks (then from the spells prepared in that rank, for a prepared caster). High grade. Level 18, 220,000 credits plus 22,000 credits per Bulk.
consumables.noqual-ammunition-standard-grade.description: Ammunition made of noqual, a light, strong metal that breaks the bonds of magic. Against summoned creatures and spell effects that can be damaged by physical attacks, a Strike gains a circumstance bonus to damage equal to twice the number of weapon damage dice. On a critical hit, the target spellcaster's concentration is disrupted and it becomes stupefied 1 for 1 round. Standard grade. Level 12, 1,600 credits.
consumables.noqual-grenade-missile-standard-grade.description: Grenade or missile made of noqual, a light, strong metal that breaks the bonds of magic. Against summoned creatures and spell effects that can be damaged by physical attacks, a Strike gains a circumstance bonus to damage equal to twice the number of weapon damage dice. On a critical hit, the target spellcaster's concentration is disrupted and it becomes stupefied 1 for 1 round. Standard grade. Level 12, 4,800 credits.
materials.noqual-weapon-standard-grade.description: Weapon made of noqual, a light, strong metal that breaks the bonds of magic. Against summoned creatures and spell effects that can be damaged by physical attacks, a Strike gains a circumstance bonus to damage equal to twice the number of weapon damage dice. On a critical hit, the target spellcaster's concentration is disrupted and it becomes stupefied 1 for 1 round. Standard grade. Level 12, 16,000 credits plus 1,600 credits per Bulk.
consumables.noqual-ammunition-high-grade.description: Ammunition made of noqual, a light, strong metal that breaks the bonds of magic. Against summoned creatures and spell effects that can be damaged by physical attacks, a Strike gains a circumstance bonus to damage equal to twice the number of weapon damage dice. On a critical hit, the target spellcaster's concentration is disrupted and it becomes stupefied 1 for 1 round. High grade. Level 18, 24,000 credits.
consumables.noqual-grenade-missile-high-grade.description: Grenade or missile made of noqual, a light, strong metal that breaks the bonds of magic. Against summoned creatures and spell effects that can be damaged by physical attacks, a Strike gains a circumstance bonus to damage equal to twice the number of weapon damage dice. On a critical hit, the target spellcaster's concentration is disrupted and it becomes stupefied 1 for 1 round. High grade. Level 18, 72,000 credits.
materials.noqual-weapon-high-grade.description: Weapon made of noqual, a light, strong metal that breaks the bonds of magic. Against summoned creatures and spell effects that can be damaged by physical attacks, a Strike gains a circumstance bonus to damage equal to twice the number of weapon damage dice. On a critical hit, the target spellcaster's concentration is disrupted and it becomes stupefied 1 for 1 round. High grade. Level 18, 240,000 credits plus 24,000 credits per Bulk.
consumables.orichalcum-ammunition-high-grade.description: Ammunition made of orichalcum. Because of its temporal properties, you can buy and install a _quicklock_ weapon upgrade that works only with orichalcum ammunition and weapons for half the normal price. Orichalcum weapons have an extra upgrade slot. High grade. Level 18, 22,500 credits.
consumables.orichalcum-grenade-missile-high-grade.description: Grenade or missile made of orichalcum. Because of its temporal properties, you can buy and install a _quicklock_ weapon upgrade that works only with orichalcum ammunition and weapons for half the normal price. Orichalcum weapons have an extra upgrade slot. High grade. Level 18, 67,500 credits.
materials.orichalcum-weapon-high-grade.description: Weapon made of orichalcum. It has an extra upgrade slot. Because of orichalcum's temporal properties, you can buy and install a _quicklock_ weapon upgrade that works only with orichalcum ammunition and weapons for half the normal price. High grade. Level 18, 225,000 credits plus 22,500 credits per Bulk.
consumables.shimmerstone-ammunition-standard-grade.description: Ammunition made of shimmerstone, a psychically active but brittle crystalline ore that radiates a calming aura. Shimmerstone weapons gain the caster trait. Mental spells cast by a character wielding a shimmerstone weapon or a weapon loaded with shimmerstone ammunition make the weapon deal mental damage until the end of your next turn or until you cast another spell. You can buy and install a _merciful_ weapon upgrade that works only with high-grade shimmerstone ammunition and weapons for half the normal price, without using an upgrade slot. Standard grade. Level 12, 920 credits.
consumables.shimmerstone-grenade-missile-standard-grade.description: Grenade or missile made of shimmerstone, a psychically active but brittle crystalline ore that radiates a calming aura. Shimmerstone weapons gain the caster trait. Mental spells cast by a character wielding a shimmerstone weapon or a weapon loaded with shimmerstone ammunition make the weapon deal mental damage until the end of your next turn or until you cast another spell. You can buy and install a _merciful_ weapon upgrade that works only with high-grade shimmerstone ammunition and weapons for half the normal price, without using an upgrade slot. Standard grade. Level 12, 2,760 credits.
materials.shimmerstone-weapon-standard-grade.description: Weapon made of shimmerstone, a psychically active but brittle crystalline ore that radiates a calming aura. Shimmerstone weapons gain the caster trait. Mental spells cast by a character wielding a shimmerstone weapon or a weapon loaded with shimmerstone ammunition make the weapon deal mental damage until the end of your next turn or until you cast another spell. You can buy and install a _merciful_ weapon upgrade that works only with high-grade shimmerstone ammunition and weapons for half the normal price, without using an upgrade slot. Standard grade. Level 12, 9,200 credits plus 920 credits per Bulk.
consumables.shimmerstone-ammunition-high-grade.description: Ammunition made of shimmerstone, a psychically active but brittle crystalline ore that radiates a calming aura. Shimmerstone weapons gain the caster trait. Mental spells cast by a character wielding a shimmerstone weapon or a weapon loaded with shimmerstone ammunition make the weapon deal mental damage until the end of your next turn or until you cast another spell. You can buy and install a _merciful_ weapon upgrade that works only with high-grade shimmerstone ammunition and weapons for half the normal price, without using an upgrade slot. High grade. Level 18, 9,600 credits.
consumables.shimmerstone-grenade-missile-high-grade.description: Grenade or missile made of shimmerstone, a psychically active but brittle crystalline ore that radiates a calming aura. Shimmerstone weapons gain the caster trait. Mental spells cast by a character wielding a shimmerstone weapon or a weapon loaded with shimmerstone ammunition make the weapon deal mental damage until the end of your next turn or until you cast another spell. You can buy and install a _merciful_ weapon upgrade that works only with high-grade shimmerstone ammunition and weapons for half the normal price, without using an upgrade slot. High grade. Level 18, 28,800 credits.
materials.shimmerstone-weapon-high-grade.description: Weapon made of shimmerstone, a psychically active but brittle crystalline ore that radiates a calming aura. Shimmerstone weapons gain the caster trait. Mental spells cast by a character wielding a shimmerstone weapon or a weapon loaded with shimmerstone ammunition make the weapon deal mental damage until the end of your next turn or until you cast another spell. You can buy and install a _merciful_ weapon upgrade that works only with high-grade shimmerstone ammunition and weapons for half the normal price, without using an upgrade slot. High grade. Level 18, 96,000 credits plus 9,600 credits per Bulk.
consumables.siccatite-ammunition-standard-grade.description: Ammunition made of siccatite, which is constantly surrounded by shimmering heat (hot siccatite) or a corona of rime (cold siccatite). It automatically gains a _flaming module_ (hot) or _frost module_ (cold) weapon upgrade that deals 1d8 damage instead of 1d6. Standard grade. Level 11, 1,400 credits.
consumables.siccatite-grenade-missile-standard-grade.description: Grenade or missile made of siccatite, which is constantly surrounded by shimmering heat (hot siccatite) or a corona of rime (cold siccatite). It automatically gains a _flaming module_ (hot) or _frost module_ (cold) weapon upgrade that deals 1d8 damage instead of 1d6. Standard grade. Level 11, 4,200 credits.
materials.siccatite-weapon-standard-grade.description: Weapon made of siccatite, which is constantly surrounded by shimmering heat (hot siccatite) or a corona of rime (cold siccatite). It automatically gains a _flaming module_ (hot) or _frost module_ (cold) weapon upgrade that deals 1d8 damage instead of 1d6. A thermal dynafan's design makes siccatite easy to use in its heatsink; you can buy or craft a pair of connected thermal dynafans as if it were a single weapon with 2 Bulk. Standard grade. Level 11, 14,000 credits plus 1,400 credits per Bulk.
consumables.siccatite-ammunition-high-grade.description: Ammunition made of siccatite, which is constantly surrounded by shimmering heat (hot siccatite) or a corona of rime (cold siccatite). It automatically gains a _tactical flaming module_ (hot) or _tactical frost module_ (cold) weapon upgrade that deals 1d8 damage instead of 1d6. High grade. Level 17, 15,000 credits.
consumables.siccatite-grenade-missile-high-grade.description: Grenade or missile made of siccatite, which is constantly surrounded by shimmering heat (hot siccatite) or a corona of rime (cold siccatite). It automatically gains a _tactical flaming module_ (hot) or _tactical frost module_ (cold) weapon upgrade that deals 1d8 damage instead of 1d6. High grade. Level 17, 45,000 credits.
materials.siccatite-weapon-high-grade.description: Weapon made of siccatite, which is constantly surrounded by shimmering heat (hot siccatite) or a corona of rime (cold siccatite). It automatically gains a _tactical flaming module_ (hot) or _tactical frost module_ (cold) weapon upgrade that deals 1d8 damage instead of 1d6. A thermal dynafan's design makes siccatite easy to use in its heatsink; you can buy or craft a pair of connected thermal dynafans as if it were a single weapon with 2 Bulk. High grade. Level 17, 150,000 credits plus 15,000 credits per Bulk.
rituals.forge-hyperspace-beacon.description: "Cast 7 days. Cost: UPBs and offerings worth 100,000 credits in total. Secondary casters: 2. Primary check: Computers. Secondary checks: Crafting, Religion, Technology Lore. Range 40 feet. Target: 1 constructed space station. You consecrate the station by installing sacred hardware and syncing it to hyperspace, turning it into a hyperspace beacon that allows swifter travel to the surrounding region of space. The ritual requires at least 3 casters, and as many as 12 are known to perform it regularly. If the number of casters isn't a multiple of 3, the ritual automatically fails."
rituals.awaken-computer.description: 'Cast 1 day. Cost: UPBs or digital media worth 1/5 the value on the Creature Creation Rituals table. Secondary casters: 3. Primary check: Computers (master). Secondary checks: Lore (any), Society, Survival. Range 10 feet. Target: 1 computer or tech creature of up to the level on the table. You grant the target intelligence, transforming it into a free-willed creature with the tech trait. If it was a minion, it can no longer serve as one, and it is freed from all orders and programming it had. Offering digital media instead of UPBs creates a virtual creature.'
