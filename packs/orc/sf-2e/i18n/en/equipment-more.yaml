rituals.animate-object.name: Animate Object
rituals.animate-object.texts.cost: rare oils (see the creature creation table)
rituals.animate-object.texts.secondaryChecks: Crafting
rituals.animate-object.description: |-
  Cast 1 day. Cost: rare oils (see the Creature Creation Rituals table). Secondary casters: 1. Primary check: Arcana (expert). Secondary check: Crafting. Range 10 feet. Target: 1 object. You transform the target into an animated object of a level up to the maximum the Creature Creation Rituals table allows, with a type matching the object (a fire extinguisher becomes an animated fire extinguisher).
rituals.consecrate.name: Consecrate
rituals.consecrate.texts.cost: rare incense and offerings worth 20 gp × the rank
rituals.consecrate.texts.secondaryChecks: 'Crafting, Performance (the secondary casters must worship your deity)'
rituals.consecrate.description: |-
  Cast 3 days. Cost: rare incense and offerings worth 200 credits × the spell rank. Secondary casters: 2, who must be worshippers of your religion. Primary check: Religion. Secondary checks: Crafting, Performance. Area: 40-foot-radius burst around an immobile altar, shrine or fixture of your deity. Range 40 feet. Duration 1 year.

  You consecrate a site to your deity. While within the area, worshippers of your deity gain a +1 status bonus to attack rolls, skill checks, saving throws and Perception checks, and creatures anathema to your deity (such as undead) take a –1 status penalty to those rolls. If your deity's divine sanctification lets you choose holy or unholy, you can choose which the site is; if it must be holy or unholy, the site matches it. Strikes by worshippers of your deity within the area gain the site's sanctification trait, if any.

  **Heightened (7th)** The area also gains the effects of the _planar seal_ spell, but it doesn't attempt to counteract teleportation by worshippers of your deity. The cost increases to 2,000 credits × the spell rank.
rituals.control-weather.name: Control Weather
rituals.control-weather.texts.secondaryChecks: Survival
rituals.control-weather.description: |-
  Cast 1 day. Secondary casters: 1. Primary check: Nature (master). Secondary check: Survival. Area: 2-mile-radius circle centered on you. Duration 4d12 hours.

  You alter the weather, making it calm and normal for the season or choosing up to two effects from the season's list. You can't control details such as a tornado's exact path or lightning's targets.

  - **Spring** drizzle, heat, hurricane, sleet, thunderstorm, tornado
  - **Summer** downpour, drizzle, extreme heat, hail, heat
  - **Autumn** cold weather, fog, mild heat, sleet
  - **Winter** blizzard, mild cold, extreme cold, thaw

  **Heightened (9th)** You can create unseasonable and contradictory weather, such as extreme cold and a hurricane. You can make the weather calm and normal for a different season or choose effects from any season's list.
rituals.create-undead.name: Create Undead
rituals.create-undead.texts.cost: black onyx (see the creature creation table)
rituals.create-undead.texts.secondaryChecks: Religion
rituals.create-undead.description: |-
  Cast 1 day. Cost: black onyx (see the Creature Creation Rituals table). Secondary casters: 1. Primary check: Arcana (expert), Occultism (expert) or Religion (expert). Secondary check: Religion. Range 10 feet. Target: 1 dead creature. You transform the target into an undead creature of a level up to the maximum the Creature Creation Rituals table allows. Each type of undead has its own version of the ritual (one for all zombies, one for corpsefolk, one for nihili and so on), and versions that create rare undead are also rare. Some undead, such as necrovites, form by their own methods and can't be created this way.
rituals.forge-hyperspace-beacon.name: Forge Hyperspace Beacon
rituals.planar-displacement.name: Planar Displacement
rituals.planar-displacement.texts.requirements: 'a planar key for the destination plane, used as a locus'
rituals.planar-displacement.texts.cost: 'rare incense, precious metals and purified chalk worth 500 gp'
rituals.planar-displacement.texts.secondaryChecks: 'Lore about the destination plane, Survival'
rituals.planar-displacement.description: |-
  Cast 1 day. Cost: rare incense, precious metals and purified chalk worth 5,000 credits. Secondary casters: 2. Primary check: Arcana (master), Nature (master), Occultism (master) or Religion (master). Secondary checks: a Lore related to the destination plane, Survival. Area: 20-foot burst. Range 20 feet. Requirement: a planar key for the destination plane, used as a locus.

  You draw a ritual circle and, when the ritual completes, shift all creatures in the area to a different plane of existence. The skill for the primary check must be one that can Recall Knowledge about the destination, such as Arcana or Nature for the destination plane. A secondary caster can be at the destination site instead of with you; if that caster succeeds at its check and you roll a success, the ritual is a critical success instead.
rituals.planar-servitor.name: Planar Servitor
rituals.planar-servitor.texts.cost: "rare incense and offerings worth 2 gp × the rank × the servitor's level"
rituals.planar-servitor.texts.secondaryChecks: Diplomacy
rituals.planar-servitor.description: |-
  Cast 1 day. Cost: rare incense and offerings worth 20 credits × the spell rank × the target's level (see below). Secondary casters: 2. Primary check: Religion (expert). Secondary check: Diplomacy. Duration: see below.

  You call on a deity (or other divine power) for aid in the form of a divine servitor of the deity's choice, with a level no greater than double the ritual's spell rank. The secondary casters explain what help you need and why; if the task is very fitting for the deity, the GM can grant a circumstance bonus to the secondary Diplomacy check or make it an automatic critical success. Using the ritual without good reason is an automatic critical failure.

  On a success, you must pay the servitor according to the task's duration and danger. Payment costs at least as much as a consumable item of the creature's level, and often as much as a permanent magic item of its level to persuade it to fight beside you. Offerings should suit the deity's tastes. You can instead name a being native to the deity's realm that you know personally, with the same level limit; it might ask for something it personally wants as payment.
rituals.plant-growth.name: Plant Growth
rituals.plant-growth.texts.secondaryChecks: Farming Lore or Survival
rituals.plant-growth.description: |-
  Cast 1 day. Secondary casters: 1. Primary check: Nature (expert). Secondary check: Farming Lore or Survival. Area: 1/2-mile-radius circle centered on you. Duration 1 year. You make plants in the area healthier and more fruitful, which increases farm crop yield depending on your degree of success. If cast in the area of a blight, it attempts to counteract the blight instead.
rituals.primal-call.name: Primal Call
rituals.primal-call.texts.cost: "faerie circle ingredients worth 1 gp × the rank × the creature's level"
rituals.primal-call.texts.secondaryChecks: 'Crafting, Diplomacy, Survival'
rituals.primal-call.description: "Cast 1 day. Cost: faerie circle ingredients worth 10 credits × the spell rank × the target's level. Secondary casters: 4. Primary check: Nature (master). Secondary checks: Crafting, Diplomacy, Survival. Range 100 miles. Target: 1 animal, beast, fey, fungus or plant. Duration: see _planar servitor_. This works like _planar servitor_, except you craft a faerie circle and call an animal, beast, fey, fungus or plant from within 100 miles."
rituals.resurrect.name: Resurrect
rituals.resurrect.texts.cost: "gems worth 75 gp × the target's level"
rituals.resurrect.texts.secondaryChecks: 'Medicine, Society'
rituals.resurrect.description: |-
  Cast 1 day. Cost: gemstones worth 750 credits × the target's level. Secondary casters: 2. Primary check: Religion (expert). Secondary checks: Medicine, Society. Range 10 feet. Target: 1 dead creature of up to 10th level.

  You call the target's soul back to its body. The body must be present and relatively intact, and the target must have died within the past year. If a deity has decided the target's time has come, or the target doesn't wish to return, the ritual automatically fails; you learn this after the successful Religion check and can end the ritual without paying the cost.

  **Heightened (6th)** The target can be up to 12th level, and the base cost is 1,250 credits.

  **Heightened (7th)** Even a small portion of the body suffices; on a success or critical success the ritual creates a new body. The target must have died within the past decade. It needs four secondary casters, each at least half the target's level. The target can be up to 14th level, and the base cost is 2,000 credits.

  **Heightened (8th)** As 7th rank, but the target can be up to 16th level and the base cost is 3,000 credits.

  **Heightened (9th)** No body is needed if you know the target's name and have touched a portion of its body at any time. The target must have died within the past century, and on a success it doesn't gain the negative conditions. It needs eight secondary casters, each at least half the target's level. The target can be up to 18th level, and the base cost is 6,000 credits.

  **Heightened (10th)** As 9th rank, but it doesn't matter how long ago the target died. It needs 16 secondary casters, each at least half the target's level. The target can be up to 20th level, and the base cost is 10,000 credits.
rituals.wish.name: Wish
rituals.wish.texts.cost: 'fine ash, imbued pigments and a marquise-cut gem worth 100,000 gp in all'
rituals.wish.texts.secondaryChecks: 'Crafting, Diplomacy'
rituals.wish.description: |-
  Cast 1 day. Cost: fine ash, magically imbued pigments and a marquise-cut gem worth 1,000,000 credits in total. Secondary casters: 2. Primary check: Arcana (legendary), Nature (legendary), Occultism (legendary) or Religion (legendary). Secondary checks: Crafting, Diplomacy. Range 10 feet. Target: 1 creature. You weave reality itself to grant the target's greatest desire. The target states the wish aloud at the start of the ritual and again at the end. The wish can be anything, from vast riches or casting a certain spell or ritual to destroying a whole civilization or ascending to divinity. The GM might decide the wish draws the attention of deities or other powerful creatures, who may interfere with the ritual or try to undo the wish. Even deities can't outright undo it, but they can react, for example by sending servitors to take away newly acquired riches.
rituals.atone.name: Atone
rituals.atone.texts.cost: "rare incense and offerings worth 20 gp × the target's level"
rituals.atone.texts.secondaryChecks: 'Nature or Religion, whichever the primary check uses (by the target, the secondary caster)'
rituals.atone.description: |-
  Cast 1 day. Cost: rare incense and offerings worth 200 credits × the target's level. Secondary casters: 1, who must be the ritual's target. Primary check: Nature or Religion (expert). Secondary check: Nature or Religion, whichever the primary check uses. Range 10 feet. Target: another creature of up to 8th level who worships the same deity or philosophy as you.

  You help a truly penitent creature atone for misdeeds, typically actions anathema to your deity. If the creature isn't truly penitent, the outcome is always a critical failure. The ritual uses Nature if the target is naturally inclined and Religion otherwise.

  **Heightened (+1)** The maximum target level increases by 2 and the base cost by 200 credits.
rituals.awaken-animal.name: Awaken Animal
rituals.awaken-animal.texts.cost: "herbs worth 1/5 of the creature creation table's cost"
rituals.awaken-animal.texts.secondaryChecks: 'Lore (any), Society, Survival'
rituals.awaken-animal.description: |-
  Cast 1 day. Cost: herbs worth 1/5 the value on the Creature Creation Rituals table. Secondary casters: 3. Primary check: Nature (master). Secondary checks: Lore (any), Society, Survival. Range 10 feet. Target: 1 animal of up to the level on the table. You grant the target intelligence, transforming it into a beast. If it was an animal companion or minion, it can no longer serve as one.
rituals.awaken-computer.name: Awaken Computer
rituals.binding-circle.name: Binding Circle
rituals.binding-circle.texts.cost: "warding circle ingredients worth 2 gp × the rank × the creature's level"
rituals.binding-circle.texts.secondaryChecks: "Diplomacy or Intimidation; Arcana or Occultism, whichever the primary check doesn't use"
rituals.binding-circle.description: |-
  Cast 1 day. Cost: warding circle ingredients worth 20 credits × the spell rank × the target's level. Secondary casters: 3. Primary check: Arcana (master) or Occultism (master). Secondary checks: Diplomacy or Intimidation; Arcana or Occultism (whichever the primary check doesn't use); Computers (master). Range: interplanar. Target: 1 extraplanar creature. Duration varies.

  You call an extraplanar creature of a level no greater than double the ritual's rank into your circle and bargain with it, usually for a task in exchange for payment. A creature that doesn't wish to negotiate can attempt a Will save to stay on its home plane. Most demand a significant gift, especially for risky tasks; fiends and similarly wicked creatures accept lower prices if the task lets them cause havoc or evil. Money prices range from a consumable item of the creature's level for a short, simple task to a permanent magic item of its level or more to fight beside you. Some want other payment, such as permission to cast a _geas_ on you for a later favor or ownership of your soul via an infernal contract.

  An additional secondary caster can create a warding circle (Crafting, same DC as a secondary check) that stops the creature from attacking or leaving the circle during the bargain. The protection ends if you take a hostile action against the creature or the circle breaks.

  If a secondary caster uses Computers, you can contact and negotiate with an extraplanar creature through a computer and the infosphere. Some creatures, such as civusdaemons, answer only digital queries.
rituals.blight.name: Blight
rituals.blight.texts.secondaryChecks: Survival
rituals.blight.description: |-
  Cast 1 day. Secondary casters: 1. Primary check: Nature (expert). Secondary check: Survival. Area: 1/2-mile-radius circle centered on you. Duration 1 year. You twist and stunt plants in the area so they wither, which also decreases farm crop yield. If cast in an area affected by _plant growth_, it attempts to counteract that ritual instead.
rituals.call-spirit.name: Call Spirit
rituals.call-spirit.texts.cost: rare candles and incense worth 50 gp
rituals.call-spirit.texts.secondaryChecks: "Occultism or Religion, whichever the primary check doesn't use"
rituals.call-spirit.description: |-
  Cast 1 hour. Cost: rare candles and incense worth 500 credits in total. Secondary casters: 1. Primary check: Occultism (expert) or Religion (expert). Secondary check: Occultism or Religion, whichever the primary check doesn't use. Duration up to 10 minutes. You tear the veil to the afterlife and call a spirit from its final resting place. You must call it by name and provide a connection, such as a possession, a garment or a piece of its corpse. An unwilling spirit can attempt a Will save to avoid the call; on a critical success, a trickster spirit Impersonates the spirit you meant to call. The save DC is 2 lower if you never met the spirit in life. The spirit appears as a wispy form. Each minute of the duration you can ask it one question, and it can answer as it pleases or refuse. If the spirit isn't in the afterlife (such as an undead), every result except a critical failure uses the failure effect.
rituals.collective-memories.name: Collective Memories
rituals.collective-memories.texts.cost: rare incense worth 300 gp
rituals.collective-memories.texts.secondaryChecks: 'Performance, Society'
rituals.collective-memories.description: |-
  Cast 1 day. Cost: rare incense worth 3,000 credits in total. Secondary casters: 2. Primary check: Occultism (master). Secondary checks: Performance, Society. You tap into mortalkind's collective memories, knowledge, legends and lore about an important person, place or thing. If the subject is present, increase the degree of success of your primary check by one step. If you have only vague information about the subject beforehand, decrease it by one step. These cancel out if the subject is present but you have little to no baseline information.
rituals.commune.name: Commune
rituals.commune.texts.cost: rare incense worth 150 gp
rituals.commune.texts.secondaryChecks: 'Nature, Occultism or Religion, whichever the primary check uses'
rituals.commune.description: |-
  Cast 1 day. Cost: rare incense worth 1,500 credits in total. Secondary casters: 1. Primary check: Computers (master), Nature (master), Occultism (master) or Religion (master). Secondary check: the same skill as the primary check (Computers, Nature, Occultism or Religion). Duration up to 10 minutes.

  You call on an unknown, powerful being to answer up to seven yes-or-no questions. It answers in single words such as "Yes," "No," "Likely" and "Unknown," though its answers reflect its own agenda and could be deceptive. The being depends on the primary check skill:

  - **Computers** Machine spirits, glitch gremlins and virtual artificial intelligences.
  - **Nature** Primal spirits of nature, who know about animals, beasts, fey, fungi, plants, topography and natural resources within 3 miles.
  - **Occultism** Planar and mysterious entities such as elementals, forgotten spirits and monitors, who know forgotten knowledge, the planes, obscure secrets and other esoterica.
  - **Religion** Divine beings such as celestials and fiends, who know about the gods they serve and those gods' purviews; typically a servitor of your deity if you have one.
upgrades.basic-environmental-protection.description: Installed in armor with the exposed trait; Bulk L. Protects the wearer against the effects of space and of thick and thin atmospheres. The armor loses the exposed trait while this upgrade is installed. 10 credits.
upgrades.filtered-rebreather-commercial.description: Installed in armor; Bulk L. Supplements the armor's environmental protections and filters out common contaminants, protecting you from most toxic atmospheres. This grade grants no save bonus. Level 0, 5 credits.
upgrades.filtered-rebreather-tactical.description: Installed in armor; Bulk L. Supplements the armor's environmental protections and filters out common contaminants, protecting you from most toxic atmospheres. You gain a +1 status bonus to Fortitude saves against inhaled effects. Level 1, 150 credits.
upgrades.filtered-rebreather-advanced.description: Installed in armor; Bulk L. Supplements the armor's environmental protections and filters out common contaminants, protecting you from most toxic atmospheres. You gain a +2 status bonus to Fortitude saves against inhaled effects. Level 6, 2,550 credits.
upgrades.filtered-rebreather-superior.description: Installed in armor; Bulk L. Supplements the armor's environmental protections and filters out common contaminants, protecting you from most toxic atmospheres. You gain a +3 status bonus to Fortitude saves against inhaled effects. Level 10, 24,100 credits.
upgrades.filtered-rebreather-elite.description: Installed in armor; Bulk L. Supplements the armor's environmental protections and filters out common contaminants, protecting you from most toxic atmospheres. You gain a +4 status bonus to Fortitude saves against inhaled effects. Level 14, 40,000 credits.
upgrades.radiation-buffer-commercial.description: Installed in armor; Bulk 1. A treated lead lining with integrated radiation sensors networked to your comm unit. While you wear the armor, you gain resistance 2 to poison damage from radiation effects and a +1 status bonus to Fortitude saves against radiation. Level 1, 130 credits.
upgrades.radiation-buffer-tactical.description: Installed in armor; Bulk 1. A treated lead lining with integrated radiation sensors networked to your comm unit. While you wear the armor, you gain resistance 4 to poison damage from radiation effects and a +2 status bonus to Fortitude saves against radiation. Level 6, 2,150 credits.
upgrades.radiation-buffer-advanced.description: Installed in armor; Bulk 1. A treated lead lining with integrated radiation sensors networked to your comm unit. While you wear the armor, you gain resistance 8 to poison damage from radiation effects and a +3 status bonus to Fortitude saves against radiation. Level 10, 22,100 credits.
upgrades.radiation-buffer-superior.description: Installed in armor; Bulk 1. A treated lead lining with integrated radiation sensors networked to your comm unit. While you wear the armor, you gain resistance 12 to poison damage from radiation effects and a +4 status bonus to Fortitude saves against radiation. Level 14, 35,000 credits.
upgrades.thermal-capacitor-commercial.description: Installed in armor; Bulk L. Regulates heat to protect you from extreme temperatures. You're protected from mild cold and mild heat. Level 1, 120 credits.
upgrades.thermal-capacitor-tactical.description: Installed in armor; Bulk L. Regulates heat to protect you from extreme temperatures. You're protected from severe cold and severe heat. Level 6, 1,800 credits.
upgrades.thermal-capacitor-advanced.description: Installed in armor; Bulk L. Regulates heat to protect you from extreme temperatures. You're protected from extreme cold and extreme heat. Level 10, 21,300 credits.
upgrades.thermal-capacitor-superior.description: Installed in armor; Bulk L. Regulates heat to protect you from extreme temperatures. You're protected from incredible cold and incredible heat. Level 14, 37,800 credits.
upgrades.active-camouflage-commercial.description: Installed in armor; Bulk L. Hardlight projectors shift the armor's colors and patterns to match your surroundings. You gain a +1 item bonus to Stealth checks while wearing the armor. Level 5, 500 credits.
upgrades.active-camouflage-tactical.description: Installed in armor; Bulk L. Hardlight projectors shift the armor's colors and patterns to match your surroundings. You gain a +2 item bonus to Stealth checks while wearing the armor. Level 9, 6,500 credits.
upgrades.active-camouflage-advanced.description: Installed in armor; Bulk L. Hardlight projectors shift the armor's colors and patterns to match your surroundings. You gain a +3 item bonus to Stealth checks while wearing the armor. Level 17, 140,000 credits.
upgrades.adaptive-energy-shielding.description: Installed in armor with the energy shielding upgrade; Bulk L. Changes the chemical composition of the armor's insulation so it reacts to different types of energy. 22,500 credits.
upgrades.auto-cpr-unit.description: Installed in armor; Bulk L. Monitors your vital signs and automatically administers aid. While you have the dying condition in this armor, the DC of your recovery checks is 8 + your dying value instead of 10 + your dying value. 200 credits.
upgrades.cloaking-device-commercial.description: Installed in armor; Bulk L. A projector that bends light around your body. Usable once per day. Level 8, 5,000 credits.
upgrades.cloaking-device-tactical.description: Installed in armor; Bulk L. A projector that bends light around your body. Its frequency is three times per day. Level 10, 10,000 credits.
upgrades.darkvision-visor.description: Installed in armor; Bulk L. A visor that wraps around your visual organs and enhances your natural senses, granting you darkvision. 150 credits.
upgrades.energy-shielding-commercial.description: 'Installed in armor; Bulk L. Insulation protects against one damage type: you gain resistance 5 to acid, cold, electricity, or fire, chosen by the crafter when the upgrade is made. An armor can hold several energy shielding upgrades, each for a different damage type. Level 8, 4,200 credits.'
upgrades.energy-shielding-tactical.description: 'Installed in armor; Bulk L. Insulation protects against one damage type: you gain resistance 10 to acid, cold, electricity, or fire, chosen by the crafter when the upgrade is made. An armor can hold several energy shielding upgrades, each for a different damage type. Level 12, 16,200 credits.'
upgrades.energy-shielding-advanced.description: 'Installed in armor; Bulk L. Insulation protects against one damage type: you gain resistance 15 to acid, cold, electricity, or fire, chosen by the crafter when the upgrade is made. An armor can hold several energy shielding upgrades, each for a different damage type. Level 18, 202,200 credits.'
upgrades.explosive-defense-unit.description: Installed in armor; Bulk L. Reinforced armor plates generate a containment field that gives you resistance 2 to area damage (acid, cold, electricity and fire damage only). You can also store a grenade in the unit and detonate it without harming yourself. 4,200 credits.
upgrades.force-field-commercial.description: Installed in armor; Bulk varies. Force fields absorb damage. While your force field is active, physical or energy damage you would take is applied to its Hit Points before yours (including temporary Hit Points). If you have a shield raised, the force field and the shield both take damage. If damage reduces the force field to 0 Hit Points, you take any excess damage, the force field deactivates, and it can't be activated again for 10 minutes. While active, it replenishes Hit Points at the start of each of your turns. This grade has 6 Hit Points and replenishes 2 per turn. Level 1, 200 credits.
upgrades.force-field-tactical.description: Installed in armor; Bulk varies. Force fields absorb damage. While your force field is active, physical or energy damage you would take is applied to its Hit Points before yours (including temporary Hit Points). If you have a shield raised, the force field and the shield both take damage. If damage reduces the force field to 0 Hit Points, you take any excess damage, the force field deactivates, and it can't be activated again for 10 minutes. While active, it replenishes Hit Points at the start of each of your turns. This grade has 14 Hit Points and replenishes 3 per turn. It also protects against critical hits (flat check DC 20). Each time you're critically hit while it's active, attempt a flat check against the DC; on a success, the hit is a normal hit instead. Level 4, 1,000 credits.
upgrades.force-field-advanced.description: Installed in armor; Bulk varies. Force fields absorb damage. While your force field is active, physical or energy damage you would take is applied to its Hit Points before yours (including temporary Hit Points). If you have a shield raised, the force field and the shield both take damage. If damage reduces the force field to 0 Hit Points, you take any excess damage, the force field deactivates, and it can't be activated again for 10 minutes. While active, it replenishes Hit Points at the start of each of your turns. This grade has 20 Hit Points and replenishes 4 per turn. It also protects against critical hits (flat check DC 19). Each time you're critically hit while it's active, attempt a flat check against the DC; on a success, the hit is a normal hit instead. Level 7, 3,600 credits.
upgrades.force-field-superior.description: Installed in armor; Bulk varies. Force fields absorb damage. While your force field is active, physical or energy damage you would take is applied to its Hit Points before yours (including temporary Hit Points). If you have a shield raised, the force field and the shield both take damage. If damage reduces the force field to 0 Hit Points, you take any excess damage, the force field deactivates, and it can't be activated again for 10 minutes. While active, it replenishes Hit Points at the start of each of your turns. This grade has 26 Hit Points and replenishes 5 per turn. It also protects against critical hits (flat check DC 18). Each time you're critically hit while it's active, attempt a flat check against the DC; on a success, the hit is a normal hit instead. Level 10, 10,000 credits.
upgrades.force-field-elite.description: Installed in armor; Bulk varies. Force fields absorb damage. While your force field is active, physical or energy damage you would take is applied to its Hit Points before yours (including temporary Hit Points). If you have a shield raised, the force field and the shield both take damage. If damage reduces the force field to 0 Hit Points, you take any excess damage, the force field deactivates, and it can't be activated again for 10 minutes. While active, it replenishes Hit Points at the start of each of your turns. This grade has 32 Hit Points and replenishes 6 per turn. It also protects against critical hits (flat check DC 17). Each time you're critically hit while it's active, attempt a flat check against the DC; on a success, the hit is a normal hit instead. Level 13, 30,000 credits.
upgrades.force-field-ultimate.description: Installed in armor; Bulk varies. Force fields absorb damage. While your force field is active, physical or energy damage you would take is applied to its Hit Points before yours (including temporary Hit Points). If you have a shield raised, the force field and the shield both take damage. If damage reduces the force field to 0 Hit Points, you take any excess damage, the force field deactivates, and it can't be activated again for 10 minutes. While active, it replenishes Hit Points at the start of each of your turns. This grade has 37 Hit Points and replenishes 7 per turn. It also protects against critical hits (flat check DC 16). Each time you're critically hit while it's active, attempt a flat check against the DC; on a success, the hit is a normal hit instead. Level 16, 100,000 credits.
upgrades.force-field-paragon.description: Installed in armor; Bulk varies. Force fields absorb damage. While your force field is active, physical or energy damage you would take is applied to its Hit Points before yours (including temporary Hit Points). If you have a shield raised, the force field and the shield both take damage. If damage reduces the force field to 0 Hit Points, you take any excess damage, the force field deactivates, and it can't be activated again for 10 minutes. While active, it replenishes Hit Points at the start of each of your turns. This grade has 42 Hit Points and replenishes 8 per turn. It also protects against critical hits (flat check DC 15). Each time you're critically hit while it's active, attempt a flat check against the DC; on a success, the hit is a normal hit instead. Level 19, 400,000 credits.
upgrades.glamer-projector.description: Installed in armor; Bulk L. Adjustable rings project magical holograms over your armor, changing its look to suit your style or the occasion. It comes with presets such as casual, corporate and fashion, and you can customize it with a computer such as the one in your comm unit. 100 credits.
upgrades.jetpack-commercial.description: Installed in armor; Bulk L. Boosters on your armor let you fly. They work in vacuum, including space; in zero gravity, using them removes the untethered condition and moves you in that direction at that Speed. This grade increases the jetpack's fly Speed to 40 feet, and you aren't off-guard while hovering in place. Level 5, 1,600 credits.
upgrades.jetpack-tactical.description: Installed in armor; Bulk L. Boosters on your armor let you fly. They work in vacuum, including space; in zero gravity, using them removes the untethered condition and moves you in that direction at that Speed. This grade increases the jetpack's fly Speed to 40 feet, and you aren't off-guard while hovering in place. Level 19, 350,000 credits.
upgrades.jump-jets.description: Installed in armor; Bulk L. Boosters on your armor supercharge your leaps. They work in vacuum, including space; in zero gravity, using them removes the untethered condition and moves you in that direction at that Speed. 550 credits.
upgrades.load-lifter-commercial.description: Installed in armor; Bulk L. Support braces let you carry more. You can carry Bulk equal to 7 + your Strength modifier without becoming encumbered, and hold and carry up to 12 + your Strength modifier total. Level 2, 550 credits.
upgrades.load-lifter-tactical.description: Installed in armor; Bulk L. Support braces let you carry more. You can carry Bulk equal to 7 + your Strength modifier without becoming encumbered, and hold and carry up to 12 + your Strength modifier total. Level 4, 750 credits.
upgrades.load-lifter-advanced.description: Installed in armor; Bulk L. Support braces let you carry more. You can carry Bulk equal to 8 + your Strength modifier without becoming encumbered, and hold and carry up to 13 + your Strength modifier total. Level 6, 2,100 credits.
upgrades.maneuvering-unit-commercial.description: Installed in armor; Bulk L. Internal stabilizers and jets synchronize your movements in zero gravity. You aren't off-guard or clumsy while untethered. Level 4, 800 credits.
upgrades.maneuvering-unit-tactical.description: Installed in armor; Bulk L. Internal stabilizers and jets synchronize your movements in zero gravity. You aren't off-guard or clumsy while untethered. When you Thrust, you move 10 feet in the chosen direction. Level 7, 3,200 credits.
upgrades.maneuvering-unit-advanced.description: Installed in armor; Bulk L. Internal stabilizers and jets synchronize your movements in zero gravity. You aren't off-guard or clumsy while untethered. When you Thrust, you move 15 feet in the chosen direction. Level 11, 13,400 credits.
upgrades.maneuvering-unit-superior.description: Installed in armor; Bulk L. Internal stabilizers and jets synchronize your movements in zero gravity. You aren't off-guard or clumsy while untethered. When you Thrust, you move 30 feet in the chosen direction. Level 15, 64,400 credits.
upgrades.mobility-enhancer.description: Installed in armor; Bulk L. Automated braces help you move faster in bulky armor, reducing the armor's Speed penalty by 5 feet.
upgrades.animated-intelligence-commercial.description: Installed in a weapon. Magical circuitry generates a virtual intelligence with a customizable personality and no free will. This weapon can act on its own when activated, with the activation ending on a failed flat check (DC 6). Level 12, 20,000 credits.
upgrades.animated-intelligence-tactical.description: Installed in a weapon. Magical circuitry generates a virtual intelligence with a customizable personality and no free will. The weapon has a fly Speed of 50 feet and makes Strikes with an attack modifier of +27 plus its item bonus to attack rolls. The flat check to determine whether the activation ends is DC 5 instead of DC 6. Level 16, 80,950 credits.
upgrades.animated-intelligence-advanced.description: Installed in a weapon. Magical circuitry generates a virtual intelligence with a customizable personality and no free will. The weapon has a fly Speed of 60 feet and makes Strikes with an attack modifier of +32 plus its item bonus to attack rolls, and it provides flanking. The flat check to determine whether the activation ends is DC 4 instead of DC 6. Level 20, 700,000 credits.
upgrades.bipod-commercial.description: Installed in a weapon with the kickback trait; Bulk 1. You set up the bipod in your square with a single Interact action using one appendage. While it's set up, you don't take the -2 penalty for firing a kickback weapon, even if your Strength is too low to avoid it. To move the weapon to a different position, you must first spend a single Interact action to retrieve the bipod. Deploying or retrieving it doesn't make you observed, as Interact normally would, as long as creatures can't see the spot where you do it. Level 0, 2 credits.
upgrades.bipod-tactical.description: Installed in a weapon with the kickback trait. Bulk 1. A bipod lets weaker wielders use powerful weapons at the cost of mobility. Set it up in your square with a single Interact action using one appendage. While it is set up, you don't take the –2 penalty for firing a kickback weapon, even if your Strength is too low to avoid it. To move the weapon to a different position you must first spend a single Interact action to retrieve the bipod. Deploying or retrieving it doesn't automatically make you observed, as long as you don't do so where creatures can see it. This quick-folding grade lets you retrieve the bipod as a free action instead. Level 1, 100 credits.
upgrades.bipod-advanced.description: Installed in a weapon with the kickback trait. Bulk 1. A bipod lets weaker wielders use powerful weapons at the cost of mobility. Set it up in your square with a single Interact action using one appendage. While it is set up, you don't take the –2 penalty for firing a kickback weapon, even if your Strength is too low to avoid it. To move the weapon to a different position you must first spend a single Interact action to retrieve the bipod. Deploying or retrieving it doesn't automatically make you observed, as long as you don't do so where creatures can see it. This automatic grade lets you deploy or retrieve the bipod as a free action instead. Level 2, 450 credits.
upgrades.entropic-destabilizer-commercial.description: Installed in a weapon. Tendrils of dark energy coat the weapon and its ammunition. When you hit with the weapon, add 1d4 void damage. On a critical hit, the target also takes 2d4 persistent void damage; if the target has a shield raised, the shield takes the same persistent damage (its wielder rolls the flat check to end it, or the GM does if no one holds the shield). Unlike normal void damage, this void damage erodes objects, constructs and the like. Level 8, 5,000 credits.
upgrades.entropic-destabilizer-tactical.description: Installed in a weapon. Tendrils of dark energy coat the weapon and its ammunition. When you hit with the weapon, add 1d4 void damage. On a critical hit, the target also takes persistent void damage (4d4 at this grade); if the target has a shield raised, the shield takes the same persistent damage (its wielder rolls the flat check to end it, or the GM does if no one holds the shield). Unlike normal void damage, this void damage erodes objects, constructs and the like. At this grade the weapon's void damage ignores the target's void resistance or immunity. Level 15, 65,000 credits.
upgrades.fear-projector-commercial.description: Installed in a weapon. An integrated hologram projector makes the weapon's wounds look worse than they are. When you critically hit with the weapon, the target becomes frightened 1. Level 5, 1,600 credits.
upgrades.fear-projector-tactical.description: Installed in a weapon. An integrated hologram projector makes the weapon's wounds look worse than they are. When you critically hit with the weapon, the target becomes frightened 2. Level 12, 20,000 credits.
upgrades.fireburst-chamber.description: Installed in a grenade launcher or a two-handed weapon with an undermounted grenade launcher. Bulk L. It lets you direct the detonation of a grenade inside the launcher. Price 750 credits.
upgrades.flaming-module-commercial.description: Installed in a weapon. The module overheats the weapon's striking edge and ammunition, dealing an additional 1d6 fire damage, plus 1d10 persistent fire damage on a critical hit. Level 8, 5,000 credits.
upgrades.flaming-module-tactical.description: Installed in a weapon. The module overheats the weapon's striking edge and ammunition, dealing an additional 1d6 fire damage, plus 2d10 persistent fire damage on a critical hit. Fire damage from the weapon, including the persistent damage, ignores the target's fire resistance. Level 15, 65,000 credits.
upgrades.frost-module-commercial.description: Installed in a weapon. The module siphons heat from the weapon's striking edge and ammunition, dealing an additional 1d6 cold damage. On a critical hit, the target is also slowed 1 until the end of your next turn unless it succeeds at a DC 24 Fortitude save. Level 8, 5,000 credits.
upgrades.frost-module-tactical.description: Installed in a weapon. The module siphons heat from the weapon's striking edge and ammunition, dealing an additional 1d6 cold damage. On a critical hit, the target is also slowed 1 until the end of your next turn unless it succeeds at a DC 34 Fortitude save. Cold damage from the weapon ignores the target's cold resistance. Level 15, 65,000 credits.
upgrades.ghost-killer.description: Installed in a weapon. Lets the weapon harm creatures without physical form; incorporeal creatures almost always have a specific vulnerability to ghost killer weapons. Incorporeal creatures can touch, hold and wield ghost killer weapons, unlike most physical objects. Price 750 credits.
upgrades.holy-module-commercial.description: Installed in a weapon. The module channels celestial power, dealing an additional 1d4 spirit damage, or an extra 2d4 against an unholy target. If you are unholy, you are enfeebled 2 while carrying or wielding the weapon. On a critical hit, the target is also dazzled (blinded if unholy) until the end of your next turn unless it succeeds at a DC 28 Fortitude save. Level 11, 14,000 credits.
upgrades.holy-module-tactical.description: Installed in a weapon. The module channels celestial power, dealing an additional 1d4 spirit damage, or an extra 2d4 against an unholy target. If you are unholy, you are enfeebled 2 while carrying or wielding the weapon. On a critical hit, the target is also dazzled (blinded if unholy) until the end of your next turn unless it succeeds at a DC 35 Fortitude save. Level 16, 80,000 credits.
upgrades.loudener-commercial.description: Installed on a weapon without a silencer. Bulk L. A cone fitted over the muzzle or hilt uses acoustic pulses to amplify the weapon's attacks, dealing an extra 1d6 sonic damage. On a critical hit, the target must succeed at a DC 24 Fortitude save or be deafened for 1 minute (1 hour on a critical failure). Level 8, 5,000 credits.
upgrades.loudener-tactical.description: Installed on a weapon without a silencer. Bulk L. A cone fitted over the muzzle or hilt uses acoustic pulses to amplify the weapon's attacks, dealing an extra 1d6 sonic damage. On a critical hit, the target must succeed at a DC 34 Fortitude save or be deafened for 1 minute (permanently on a critical failure). Sonic damage from the weapon ignores the target's sonic resistance. Level 15, 65,000 credits.
upgrades.merciful.description: Installed in a weapon. The weapon gains the nonlethal trait and can't make lethal attacks; any persistent damage it would deal is negated. On a critical hit, the target becomes fascinated with the wielder for 1 minute, flooded with guilt and remorse (a mental effect). If you have the weapon's critical specialization effect, you choose whether to use it or this effect. Price 700 credits.
upgrades.quicklock.description: Installed in a weapon. Bulk L. Multiple tracking devices and extra processors speed up the weapon's targeting. While wielding it, you are quickened, but you can use the extra action only to make a Strike with the weapon. Price 100,000 credits.
upgrades.retrieval-boosters.description: Installed in a thrown weapon. After you make a thrown Strike with the weapon, stabilizers and boosters propel it back into your free hand (or other appendage). If your hands are full when it returns, it falls to the ground in your space. Price 550 credits.
upgrades.shock-module-commercial.description: Installed in a weapon. The circuit safely courses electricity through the weapon, dealing an extra 1d6 electricity damage. On a critical hit, electricity arcs out to deal the same amount of electricity damage to up to two other creatures of your choice within 10 feet of the target. Level 8, 5,000 credits.
upgrades.shock-module-tactical.description: Installed in a weapon. The circuit safely courses electricity through the weapon, dealing an extra 1d6 electricity damage. On a critical hit, electricity arcs out to deal 2d10 electricity damage to the target and to up to two other creatures of your choice within 10 feet of it. Electricity damage from the weapon ignores resistance to electricity (including the other creatures' on a critical hit). Level 15, 65,000 credits.
upgrades.silencer-commercial.description: Installed in a ranged weapon without a loudener. Bulk L. A cylinder of internal sound baffles keeps the weapon from making a loud noise when fired, though creatures it hits might still cry out. Level 0, 10 credits.
upgrades.silencer-tactical.description: "Installed in a ranged weapon without a loudener. Bulk L. A cylinder of internal sound baffles keeps the weapon from making a loud noise when fired, though creatures it hits might still cry out. This grade is a hybrid item with the magical and tech traits: shots magically dampen sound around them. On a critically successful Strike, the target becomes unable to make sound; it can't use sonic attacks or actions with the auditory trait, and can't cast spells that need incantations or sounds, except subtle spells. The target can resist with a successful DC 27 Will save. Level 9, 7,500 credits."
upgrades.smugglers-grip-commercial.description: Installed in a one-handed weapon (grip). The grip makes the weapon easy to conceal; it gains the concealed trait. Level 2, 400 credits.
upgrades.smugglers-grip-tactical.description: "Installed in a one-handed weapon (grip). The weapon gains the concealed trait. This grade is a hybrid item with the extradimensional, magical and tech traits: as an Interact action you can pull the weapon into an extradimensional space, leaving a palm-sized disk behind and gaining a +4 item bonus to your Stealth check to Conceal the Object. You can't draw the weapon while it is stored, but you can retrieve it with an Interact action. Level 6, 2,600 credits."
upgrades.snipers-scope-commercial.description: Installed in a weapon (sight). Bulk L. A telescopic sight helps you view distant targets. Level 1, 150 credits.
upgrades.snipers-scope-tactical.description: Installed in a weapon (sight). Bulk L. A telescopic sight helps you view distant targets. It grants a +1 item bonus to visual Perception checks to Seek creatures through the scope. Level 3, 700 credits.
upgrades.snipers-scope-advanced.description: Installed in a weapon (sight). Bulk L. A telescopic sight helps you view distant targets. It grants a +2 item bonus to visual Perception checks to Seek creatures through the scope, and Adjust Sight increases the weapon's range increment by 20 feet or 40 feet, depending on the weapon's range. Level 9, 8,000 credits.
upgrades.snipers-scope-superior.description: Installed in a weapon (sight). Bulk L. A telescopic sight helps you view distant targets. It grants a +3 item bonus to visual Perception checks to Seek creatures through the scope, and Adjust Sight increases the weapon's range increment by 40 feet or 80 feet, depending on the weapon's range. Level 17, 160,000 credits.
upgrades.truesight-sight-commercial.description: Installed in a weapon (sight). Crystal lenses infused with spells as they are cut sit in an autofocusing sight. You gain a +1 item bonus to visual Perception checks to Seek when looking through the scope. Level 8, 8,000 credits.
upgrades.truesight-sight-tactical.description: Installed in a weapon (sight). Crystal lenses infused with spells as they are cut sit in an autofocusing sight. You gain a +2 item bonus to visual Perception checks to Seek when looking through the scope. When you activate See the Truth, the GM secretly rolls a counteract check with a +20 counteract modifier and counteract rank 7 against each illusion, morph or polymorph effect in the area, only to determine whether you see through it, not to end the effect. Level 13, 30,000 credits.
upgrades.undermounted-grenade-launcher-commercial.description: Installed in a two-handed weapon. Bulk 1. A bracket-mounted grenade launcher, usually used for fragmentation grenades but also good for smoke grenades, flashbangs and similar. Unlike a dedicated launcher, loading it takes 10 minutes, as the grenade is reassembled into ammunition on a reusable firing cap; a loaded grenade can be removed only by disassembling it, which destroys it. This grade has a range of 20 feet. Level 0, 50 credits.
upgrades.undermounted-grenade-launcher-tactical.description: Installed in a two-handed weapon. Bulk 1. A bracket-mounted grenade launcher, usually used for fragmentation grenades but also good for smoke grenades, flashbangs and similar. Unlike a dedicated launcher, loading it takes 10 minutes, as the grenade is reassembled into ammunition on a reusable firing cap; a loaded grenade can be removed only by disassembling it, which destroys it. This grade has a range of 30 feet and the tracking +1 trait. Level 2, 250 credits.
upgrades.undermounted-grenade-launcher-advanced.description: Installed in a two-handed weapon. Bulk 1. A bracket-mounted grenade launcher, usually used for fragmentation grenades but also good for smoke grenades, flashbangs and similar. Unlike a dedicated launcher, loading it takes 10 minutes, as the grenade is reassembled into ammunition on a reusable firing cap; a loaded grenade can be removed only by disassembling it, which destroys it. This grade has a range of 40 feet and the tracking +2 trait. Level 10, 8,200 credits.
upgrades.undermounted-grenade-launcher-superior.description: Installed in a two-handed weapon. Bulk 1. A bracket-mounted grenade launcher, usually used for fragmentation grenades but also good for smoke grenades, flashbangs and similar. Unlike a dedicated launcher, loading it takes 10 minutes, as the grenade is reassembled into ammunition on a reusable firing cap; a loaded grenade can be removed only by disassembling it, which destroys it. This grade has a range of 50 feet and the tracking +3 trait. Level 16, 79,000 credits.
upgrades.uniclamp.description: Installed in a weapon. Bulk L. An all-purpose clamp for holding gear such as a fire extinguisher, flashlight, musical instrument or comm unit. When you install it, you securely attach one piece of non-magical tech gear of up to 1 Bulk. You can activate the attached item using the same hands you use to wield the weapon, while still wielding it. It doesn't work with weapons or shields, and the GM may rule that some items don't fit certain weapons. Price 100 credits.
augmentations.dragon-gland-commercial.description: "A magical gland, modified for a creature of your ancestry, is implanted at the back of your throat. When it is biocrafted, choose your breath weapon's damage type: acid, cold, electricity, fire or sonic. It grants a breath weapon activation. At this grade the damage is 1d6 and the DC is 15. Level 1, 150 credits."
augmentations.dragon-gland-tactical.description: "A magical gland, modified for a creature of your ancestry, is implanted at the back of your throat. When it is biocrafted, choose your breath weapon's damage type: acid, cold, electricity, fire or sonic. It grants a breath weapon activation. At this grade the damage is 2d6 and the DC is 16. Level 2, 300 credits."
augmentations.dragon-gland-advanced.description: "A magical gland, modified for a creature of your ancestry, is implanted at the back of your throat. When it is biocrafted, choose your breath weapon's damage type: acid, cold, electricity, fire or sonic. It grants a breath weapon activation. At this grade the damage is 4d6 and the DC is 23. Level 7, 3,300 credits."
augmentations.dragon-gland-superior.description: "A magical gland, modified for a creature of your ancestry, is implanted at the back of your throat. When it is biocrafted, choose your breath weapon's damage type: acid, cold, electricity, fire or sonic. It grants a breath weapon activation. At this grade the damage is 6d6 and the DC is 29. Level 12, 18,200 credits."
augmentations.dragon-gland-elite.description: "A magical gland, modified for a creature of your ancestry, is implanted at the back of your throat. When it is biocrafted, choose your breath weapon's damage type: acid, cold, electricity, fire or sonic. It grants a breath weapon activation. At this grade the damage is 10d6 and the DC is 37. Level 17, 135,000 credits."
augmentations.dragon-gland-ultimate.description: "A magical gland, modified for a creature of your ancestry, is implanted at the back of your throat. When it is biocrafted, choose your breath weapon's damage type: acid, cold, electricity, fire or sonic. It grants a breath weapon activation. At this grade the damage is 14d6 and the DC is 43. Level 20, 610,000 credits."
augmentations.gill-sheath.description: Oxygen-filtering nodules line the outside of your lungs. If you breathe in water, the sheath filters oxygen into your lungs, letting you breathe underwater or in air. Price 200 credits.
augmentations.laser-eye.description: A laser eye taken from an akashic dragon (or other creature) is implanted in your body. You gain a laser eye unarmed attack that deals 1d4 fire damage with a range increment of 60 feet. It is in the laser group and has the agile, concealable, fire, tech and unarmed traits. Price 770 credits.
augmentations.photosynthetic-skin.description: Specialized nanites in your surface cells convert solar radiation into nourishment. You don't need to eat, and you're never fatigued from hunger or starvation, as long as you spend at least 1 hour per day basking in direct sunlight; you can bask during a normal 8-hour rest. Price 300 credits.
augmentations.shielding-skin-commercial.description: Your skin is biologically engineered to protect your whole body, brain included, from harmful effects. You gain a +1 item bonus to saving throws. The bonus doesn't stack with armor; it is meant for unarmored characters. Level 8, 3,450 credits.
augmentations.shielding-skin-tactical.description: Your skin is biologically engineered to protect your whole body, brain included, from harmful effects. You gain a +2 item bonus to saving throws. The bonus doesn't stack with armor; it is meant for unarmored characters. Level 14, 35,000 credits.
augmentations.shielding-skin-advanced.description: Your skin is biologically engineered to protect your whole body, brain included, from harmful effects. You gain a +3 item bonus to saving throws. The bonus doesn't stack with armor; it is meant for unarmored characters. Level 20, 495,000 credits.
augmentations.ultralight-wings-commercial.description: Foldable wings attached to your shoulder blades or similar let you lift your weight and assist flight. Deploy them with an Interact action; you can't deploy or use them while wearing more than light armor. While they are deployed and you aren't encumbered, you gain a fly Speed of 20 feet and a +1 item bonus to Acrobatics checks to Maneuver in Flight. Level 3, 600 credits.
augmentations.ultralight-wings-tactical.description: Foldable wings attached to your shoulder blades or a similar spot lift your weight and aid flight. Deploy them with an Interact action; you can't deploy or use them while wearing more than light armor. While deployed and you're not encumbered, you gain a fly Speed of 30 feet and a +1 item bonus to Acrobatics checks to Maneuver in Flight. Level 6, 2,500 credits.
augmentations.ultralight-wings-advanced.description: Foldable wings attached to your shoulder blades or a similar spot lift your weight and aid flight. Deploy them with an Interact action; you can't deploy or use them while wearing more than light armor. While deployed and you're not encumbered, you gain a fly Speed of 40 feet and a +2 item bonus to Acrobatics checks to Maneuver in Flight. Level 9, 7,000 credits.
augmentations.ultralight-wings-superior.description: Foldable wings attached to your shoulder blades or a similar spot lift your weight and aid flight. Deploy them with an Interact action; you can't deploy or use them while wearing more than light armor. While deployed and you're not encumbered, you gain a fly Speed of 60 feet and a +2 item bonus to Acrobatics checks to Maneuver in Flight. Level 12, 20,000 credits.
augmentations.venom-spur.description: A retractable spur on one of your appendages delivers a poisonous sting. You gain a venom spur unarmed attack that deals 1d6 piercing plus 1d4 persistent poison damage. It is in the brawling group and has the finesse, poison and unarmed traits. 320 credits.
augmentations.wildwise-graft.description: A soft purple fungus attaches to your vocal cords and sends fine filaments into your brain. You can ask questions of, receive answers from, and use Diplomacy with animals, plants and fungi. The communication is rudimentary and yields only basic responses such as "hungry," "over there" or "frightened." 250 credits.
augmentations.autodreamer.description: A microchip in your nervous system activates when you sleep, immersing you in constant lucid dreams unless you choose to sleep normally. Once per day, when you awaken after a full 8 hours of sleep, you count as having spent a day of downtime retraining. The dreams draw only on your own experiences, so they can't be used for retraining that needs an instructor or specialized knowledge. 13,000 credits.
augmentations.autorecognition-lens.description: An artificial eye lens wired into your brain tracks a database of names and faces as you meet people. Once you've learned someone's name and appearance, a tiny HUD shows you their name whenever you look at them, as long as you're aware of their presence and their appearance hasn't changed dramatically (GM's discretion). It doesn't help you see or identify people who are hiding or disguising themselves. It doesn't count toward your implant limit. 5 credits.
augmentations.cardiac-accelerator.description: An implant integrated into your heart. You can trigger it to briefly overclock your cardiovascular system. 1,300 credits.
augmentations.darkvision-capacitors-commercial.description: Replacement cybernetic eyes that grant you darkvision. They work by emitting low-powered ultraviolet lasers that their receptors detect; creatures that can see ultraviolet light can see these lasers. Level 3, 600 credits.
augmentations.darkvision-capacitors-tactical.description: Replacement cybernetic eyes that grant you darkvision. They include a wide-spectrum ocular implant that lets you see infrared and ultraviolet light, including the lasers of other darkvision capacitors. You gain darkvision and a +2 item bonus to Perception checks to Seek if they involve sight. Level 5, 1,600 credits.
augmentations.datajack-commercial.description: A programmable data port installed in your body for accessing computers and digital storage devices. Any handheld computer can connect to it; larger systems usually need an adapter cable. You need no interface to access the system, since it connects directly to your nervous system, but you still attempt any skill checks for operating it, such as Computers to access a system. Some closed systems allow no direct data access. Level 1, 100 credits.
augmentations.datajack-tactical.description: A programmable data port installed in your body for accessing computers and digital storage devices. Any handheld computer can connect to it; larger systems usually need an adapter cable. You need no interface to access the system, since it connects directly to your nervous system, but you still attempt any skill checks for operating it, such as Computers to access a system. Some closed systems allow no direct data access. You gain a +1 item bonus to Computers checks when accessing a system through it. Level 4, 750 credits.
augmentations.datajack-advanced.description: A programmable data port installed in your body for accessing computers and digital storage devices. Any handheld computer can connect to it; larger systems usually need an adapter cable. You need no interface to access the system, since it connects directly to your nervous system, but you still attempt any skill checks for operating it, such as Computers to access a system. Some closed systems allow no direct data access. You gain a +2 item bonus to Computers checks when accessing a system through it. Level 8, 4,200 credits.
augmentations.dermal-plating-commercial.description: "Hardened plates protect your skin. A limb with dermal plating functions as a shield: you can Raise a Shield with it for a +1 circumstance bonus to AC until the start of your next turn without needing a hand, and you can use the Shield Block reaction with it. This grade has Hardness 5. After you use Shield Block, the plating is damaged and can't be used for 24 hours while nanites repair it. Level 1, 180 credits."
augmentations.dermal-plating-tactical.description: "Hardened plates protect your skin. A limb with dermal plating functions as a shield: you can Raise a Shield with it for a +1 circumstance bonus to AC until the start of your next turn without needing a hand, and you can use the Shield Block reaction with it. This grade has Hardness 10. After you use Shield Block, the plating is damaged and can't be used for 24 hours while nanites repair it. Level 4, 900 credits."
augmentations.dermal-plating-advanced.description: "Hardened plates protect your skin. A limb with dermal plating functions as a shield: you can Raise a Shield with it for a +1 circumstance bonus to AC until the start of your next turn without needing a hand, and you can use the Shield Block reaction with it. This grade has Hardness 15. After you use Shield Block, the plating is damaged and can't be used for 24 hours while nanites repair it. Level 7, 3,240 credits."
augmentations.dermal-plating-superior.description: "Hardened plates protect your skin. A limb with dermal plating functions as a shield: you can Raise a Shield with it for a +1 circumstance bonus to AC until the start of your next turn without needing a hand, and you can use the Shield Block reaction with it. This grade has Hardness 20. After you use Shield Block, the plating is damaged and can't be used for 24 hours while nanites repair it. Level 10, 9,000 credits."
augmentations.dermal-plating-elite.description: "Hardened plates protect your skin. A limb with dermal plating functions as a shield: you can Raise a Shield with it for a +1 circumstance bonus to AC until the start of your next turn without needing a hand, and you can use the Shield Block reaction with it. This grade has Hardness 25. After you use Shield Block, the plating is damaged and can't be used for 24 hours while nanites repair it. Level 13, 27,000 credits."
augmentations.dermal-plating-ultimate.description: "Hardened plates protect your skin. A limb with dermal plating functions as a shield: you can Raise a Shield with it for a +1 circumstance bonus to AC until the start of your next turn without needing a hand, and you can use the Shield Block reaction with it. This grade has Hardness 30. After you use Shield Block, the plating is damaged and can't be used for 24 hours while nanites repair it. Level 16, 90,000 credits."
augmentations.dermal-plating-paragon.description: "Hardened plates protect your skin. A limb with dermal plating functions as a shield: you can Raise a Shield with it for a +1 circumstance bonus to AC until the start of your next turn without needing a hand, and you can use the Shield Block reaction with it. This grade has Hardness 35. After you use Shield Block, the plating is damaged and can't be used for 24 hours while nanites repair it. Level 19, 360,000 credits."
augmentations.hearing-aid.description: A device that fits into your ear canal or another suitable auditory organ. Commonly available at printing kiosks, it restores or enhances hearing. It doesn't count toward your implant limit. 5 credits.
augmentations.hideaway-limb-commercial.description: A hidden compartment in one of your limbs (arm, leg, tail or similar), protected by a passcode. It holds items of negligible Bulk and light Bulk items small enough to fit or that can be folded or contracted to fit; a leg typically holds more than an arm, and your size adjusts capacity at the GM's discretion. When closed, the seam is hard to detect, giving you a +1 item bonus to Stealth checks to Conceal an Object in it. It can foil a cursory pat down, but many security checkpoints scan for such devices. Level 1, 140 credits.
augmentations.hideaway-limb-tactical.description: A hidden compartment in one of your limbs (arm, leg, tail or similar), protected by a passcode. It holds items of negligible Bulk and light Bulk items small enough to fit or that can be folded or contracted to fit; a leg typically holds more than an arm, and your size adjusts capacity at the GM's discretion. When closed, the seam is hard to detect, giving you a +1 item bonus to Stealth checks to Conceal an Object in it. It can foil a cursory pat down, but many security checkpoints scan for such devices. When you Draw an item from it that can be activated or used with a single action, you can use it as part of the same action (for example, draw a weapon, then Strike with it). Level 5, 1,400 credits.
augmentations.nano-optics-node.description: A crystalline nanocarbon node implanted in your occipital lobe, linked to your optic nerves by microscopic fibers. You can activate it to overlay your normal vision with X-ray data. Deactivating the overlay is a single action with the concentrate trait. 12,000 credits.
augmentations.prosthetic-limb.description: A prosthesis that replaces a missing or damaged limb; common, available at printing kiosks on many worlds, in many materials and sizes. It restores function, including the ability to install other augmentations in it, but is no more durable than and works no differently from the limb it replaces. It can replace a lost limb, or you can have a limb removed to replace it. It doesn't count toward your implant limit. 5 credits.
augmentations.retinal-reflectors.description: Sheets of reflective material implanted in your visual organs enhance your vision without changing your appearance. You gain low-light vision and a +1 item bonus to Perception checks to Seek if they involve sight. 200 credits.
augmentations.speed-suspension-commercial.description: High-performance cybernetics replace the joints and tendons in your legs, giving you a +5-foot item bonus to your land Speed. Level 4, 800 credits.
augmentations.speed-suspension-tactical.description: High-performance cybernetics replace the joints and tendons in your legs, giving you a +10-foot item bonus to your land Speed. Level 8, 4,000 credits.
augmentations.speed-suspension-advanced.description: High-performance cybernetics replace the joints and tendons in your legs, giving you a +15-foot item bonus to your land Speed. Level 12, 16,000 credits.
augmentations.vocal-modulator.description: Miniature actuators and hyper-resonant chambers reshape your voice box, letting you change the pitch, timbre and tone of your voice to imitate accents or pronounce alien languages. When you use Deception to Impersonate, you gain a +1 item bonus if the change in your voice also helps your disguise (GM's discretion). 90 credits.
augmentations.voice-amplifier.description: Greatly increases the volume of your voice. Switching it on or off takes an action with the concentrate trait. While active, it grants a +1 item bonus to Intimidation checks and lowers the DCs of Perception checks to hear you speak by 5. 500 credits.
augmentations.cloaking-skin-commercial.description: Many of your pores are replaced with magically regulated holographic projectors that sync when activated to match your surroundings, rendering you invisible. Level 8, 5,000 credits.
augmentations.cloaking-skin-tactical.description: Many of your pores are replaced with magically regulated holographic projectors that sync when activated to match your surroundings, rendering you invisible. You can activate the _cloaking skin_ up to three times per day. Level 10, 10,000 credits.
augmentations.cloaking-skin-advanced.description: Many of your pores are replaced with magically regulated holographic projectors that sync when activated to match your surroundings, rendering you invisible. You can activate the _cloaking skin_ up to three times per day, and you gain the effects of 4th-rank _invisibility_. Level 12, 20,000 credits.
augmentations.moodskin.description: Magically infused nanites in your skin react to your mood by changing your pigmentation. The change is gradual, typically taking at least 30 seconds to shift fully from one color to another. The colors for each mood can be customized at installation. It doesn't count toward your implant limit. 35 credits.
augmentations.psychoactive-eyes-commercial.description: Your irises are injected with psychoactive dyes that create a kaleidoscopic effect, or your eyes are replaced with delicate magitech devices. You can activate them to enthrall those you look upon, with effects that vary by the item's type. Level 3, 500 credits.
augmentations.psychoactive-eyes-tactical.description: Your irises are injected with psychoactive dyes that create a kaleidoscopic effect, or your eyes are replaced with delicate magitech devices. You can activate them to enthrall those you look upon, with effects that vary by the item's type. Level 6, 2,250 credits.
augmentations.regenerative-rune-splice.description: Your genes are enchanted with microscopic runes that you can activate to recover from traumatic injury. 6,500 credits.
augmentations.telepathy-node.description: "A pebble-sized, rune-carved device of treated alloys and crystal implanted in your brain's communication center. You gain limited telepathy with a range of 30 feet: you can communicate mentally with creatures within 30 feet that share a language with you. It gives no access to their thoughts and conveys no more than normal speech would. 200 credits."
augmentations.artificial-immortalizer.description: An extra organ that merges with and enhances your circulatory and immune systems. When you succeed at a Fortitude save against an ongoing disease or poison, you recover completely, regardless of its current stage. When you get this augmentation, you either increase your Constitution modifier by 1 or increase it to +4, whichever gives the higher value. 150,000 credits.
augmentations.cognition-accelerator.description: A miniature supercomputer augments your brain's processing. You gain a +3 item bonus to checks to Recall Knowledge with any skill. When you get this augmentation, you either increase your Intelligence modifier by 1 or increase it to +4, whichever gives the higher value; this grants additional trained skills and languages as normal for raising Intelligence. You choose them when the augmentation is installed, and they can't be changed. 150,000 credits.
augmentations.cosmic-connector.description: Opens your mind to the underlying truths of the universe. When you get this augmentation, you either increase your Wisdom modifier by 1 or increase it to +4, whichever gives the higher value. 150,000 credits.
augmentations.hypernerves.description: Enhances your muscles and nervous system for dramatically better flexibility and reaction time. You gain a +3 item bonus to Acrobatics checks. When you get this augmentation, you either increase your Dexterity modifier by 1 or increase it to +4, whichever gives the higher value. 150,000 credits.
augmentations.muscle-invigorator.description: Keeps your muscles in peak condition. You gain a +3 item bonus to Athletics checks. When you get this augmentation, you either increase your Strength modifier by 1 or increase it to +4, whichever gives the higher value. 150,000 credits.
augmentations.presence-intensifier.description: Strengthens your personality, intensifying the parts of you that form the core of your identity. You gain a +2 item bonus to Diplomacy and Intimidation checks. When you get this augmentation, you either increase your Charisma modifier by 1 or increase it to +4, whichever gives the higher value. 150,000 credits.
worn.aeon-stone-guiding.description: Worn. A precisely shaped crystal that, when invested, orbits your head (or another visible body part if you have no head) rather than being worn. You can stow an _aeon stone_ with an Interact action; an orbiting stone can be snatched from the air with a successful Disarm against you. A stowed or removed stone stays invested, but its effects are suppressed until it orbits you again. Each stone also has a resonant power when slotted into specific items, such as weapons with the aeon trait. This gold star's resonant power lets you cast _guidance_ as an occult innate cantrip. Level 15, 61,000 credits.
worn.aeon-stone-life-giving.description: Worn. A precisely shaped crystal that, when invested, orbits your head (or another visible body part if you have no head) rather than being worn. You can stow an _aeon stone_ with an Interact action; an orbiting stone can be snatched from the air with a successful Disarm against you. A stowed or removed stone stays invested, but its effects are suppressed until it orbits you again. Each stone also has a resonant power when slotted into specific items, such as weapons with the aeon trait. This nacreous tapered cylinder lets you hold your breath twice as long and grants a +1 item bonus to saves against inhaled poisons; its resonant power lets you cast _life seal_ as a divine innate spell once per day. Level 7, 3,500 credits.
worn.aeon-stone-navigating.description: Worn. A precisely shaped crystal that, when invested, orbits your head (or another visible body part if you have no head) rather than being worn. You can stow an _aeon stone_ with an Interact action; an orbiting stone can be snatched from the air with a successful Disarm against you. A stowed or removed stone stays invested, but its effects are suppressed until it orbits you again. Each stone also has a resonant power when slotted into specific items, such as weapons with the aeon trait. This deep purple helicoid prism gives you a +2 item bonus to Piloting checks to Navigate; its resonant power lets you cast _seek the stars_ as a divine innate cantrip. Level 16, 95,000 credits.
worn.aeon-stone-projecting.description: Worn. A precisely shaped crystal that, when invested, orbits your head (or another visible body part if you have no head) rather than being worn. You can stow an _aeon stone_ with an Interact action; an orbiting stone can be snatched from the air with a successful Disarm against you. A stowed or removed stone stays invested, but its effects are suppressed until it orbits you again. Each stone also has a resonant power when slotted into specific items, such as weapons with the aeon trait. This opalescent sapphire cone projects empathy to 100 feet that creatures understand regardless of language, conveying a type and intensity of emotion such as "mild anger" or "deep sadness." When you Sense the Motive of a creature within 30 feet, you detect the presence or absence of its thoughts as though you cast the 1-action version of _detect thoughts_. Its resonant power lets you cast _mind skewer_ as a 1st-rank occult innate spell once per day. Level 13, 22,000 credits.
worn.aeon-stone-uplifting.description: Worn (invested). A precisely shaped crystal that orbits your head (or another visible body part if you have no head) instead of being worn. You can stow it with an Interact action; an orbiting stone can be snatched out of the air with a successful Disarm against you. A stowed or removed stone stays invested but its effects are suppressed until it orbits you again. This deep-blue prism with cloudy inclusions is light as a feather. Its resonant power (when slotted into a suitable item) gives you a +1 item bonus to Acrobatics checks. Level 5, 1,600 credits.
worn.akashic-lens-commercial.description: Worn eyepiece. Contact lens, spectacles or other eyewear that projects a data display, cycling through information with virtual intelligence and eye tracking. You gain a +1 item bonus to Recall Knowledge checks with the skill chosen when you use Database Scan. Level 3, 555 credits.
worn.akashic-lens-tactical.description: Worn eyepiece. Contact lens, spectacles or other eyewear that projects a data display, cycling through information with virtual intelligence and eye tracking. You gain a +1 item bonus to Recall Knowledge checks with the skill chosen when you use Database Scan. This grade's _akashic download_ spell is 4th rank. Level 9, 5,555 credits.
worn.akashic-lens-advanced.description: Worn eyepiece. Contact lens, spectacles or other eyewear that projects a data display, cycling through information with virtual intelligence and eye tracking. This grade's item bonus to Recall Knowledge checks with the skill chosen when you use Database Scan is +2, and its _akashic download_ spell is 4th rank. Level 15, 55,555 credits.
worn.antigrav-harness-commercial.description: Worn garment, Bulk 1. A web of synthweave straps useful in extreme environments. You gain a +1 item bonus to Acrobatics checks, and you aren't off-guard or clumsy while untethered in zero-g. Level 6, 2,100 credits.
worn.antigrav-harness-tactical.description: Worn garment, Bulk 1. A web of synthweave straps useful in extreme environments. You aren't off-guard or clumsy while untethered in zero-g. This grade's item bonus to Acrobatics checks is +2, and Gravity Alteration lasts 1 minute. Level 12, 16,500 credits.
worn.antigrav-harness-advanced.description: Worn garment, Bulk 1. A web of synthweave straps useful in extreme environments. You aren't off-guard or clumsy while untethered in zero-g. This grade's item bonus to Acrobatics checks is +3, and Gravity Alteration lasts 1 minute and can lower or raise the gravity level by up to two steps. Level 18, 220,600 credits.
held.divas-microphone-commercial.description: Held in 1 hand, Bulk L. A crystal microphone and speaker that amplifies your voice so all listeners within 500 feet hear you clearly, even over ambient noise. It doesn't extend the range or area of other auditory or linguistic effects, and physical barriers still block or muffle your voice. It grants a +1 item bonus to Performance checks attempted with it. Level 4, 750 credits.
held.divas-microphone-tactical.description: Held in 1 hand, Bulk L. A crystal microphone and speaker that amplifies your voice so all listeners within 500 feet hear you clearly, even over ambient noise. It doesn't extend the range or area of other auditory or linguistic effects, and physical barriers still block or muffle your voice. This grade's item bonus to Performance checks attempted with it is +2, and its _sonic scream_ spell is 4th rank (DC 27). Level 10, 9,500 credits.
held.divas-microphone-advanced.description: Held in 1 hand, Bulk L. A crystal microphone and speaker that amplifies your voice so all listeners within 500 feet hear you clearly, even over ambient noise. It doesn't extend the range or area of other auditory or linguistic effects, and physical barriers still block or muffle your voice. This grade's item bonus to Performance checks attempted with it is +3, and its _sonic scream_ spell is 8th rank (DC 38). Level 18, 190,400 credits.
worn.duo-enhancers.description: Worn armbands or gloves, Bulk L. A linked pair of bracers, wristbands, gloves or similar garments fitted to the limb you wield weapons with. One has a screen showing data on your weapons; the other holds magical crystals. When you wield a weapon in the hand wearing the display, that weapon's grade (such as tactical) is replicated onto the weapon wielded in the crystal hand, but only for its extra damage dice and tracking trait (an item bonus to attack rolls). Other properties, such as damage type, ammo or upgrades, aren't replicated. It works only if you wear both enhancers and ends as soon as you stop wielding a weapon in one of those hands, so it doesn't apply to thrown attacks or to a weapon you hold but don't wield (for example, a two-handed weapon held in one hand). 500 credits.
worn.hardlight-handwraps-commercial.description: Worn gloves. Handwraps of hardlight, adjustable to any visible color and wearable on other body parts. They enhance your unarmed attacks as if they were manufactured weapons, letting you add an upgrade to them; treat the handwraps as melee weapons in the brawling group with light Bulk for this purpose. This grade has 1 upgrade slot. Level 0, 5 credits.
worn.hardlight-handwraps-tactical.description: Worn gloves. Handwraps of hardlight that enhance your unarmed attacks as if they were manufactured weapons, letting you add an upgrade to them; treat the handwraps as melee weapons in the brawling group with light Bulk for this purpose. This grade has 1 upgrade slot, and your unarmed attacks gain the tracking +1 trait. Level 2, 355 credits.
worn.hardlight-handwraps-advanced.description: Worn gloves. Handwraps of hardlight that enhance your unarmed attacks as if they were manufactured weapons, letting you add an upgrade to them; treat the handwraps as melee weapons in the brawling group with light Bulk for this purpose. This grade has 2 upgrade slots, your unarmed attacks gain the tracking +1 trait, and their damage increases to two dice (normally 2d4 instead of 1d4; if your fists use a different die or you have other unarmed attacks, use two of that die size). Level 4, 1,005 credits.
worn.hardlight-handwraps-superior.description: Worn gloves. Handwraps of hardlight that enhance your unarmed attacks as if they were manufactured weapons, letting you add an upgrade to them; treat the handwraps as melee weapons in the brawling group with light Bulk for this purpose. This grade has 2 upgrade slots, your unarmed attacks gain the tracking +2 trait, and their damage increases to two dice (use two of the attack's damage die size). Level 10, 10,005 credits.
worn.hardlight-handwraps-elite.description: Worn gloves. Handwraps of hardlight that enhance your unarmed attacks as if they were manufactured weapons, letting you add an upgrade to them; treat the handwraps as melee weapons in the brawling group with light Bulk for this purpose. This grade has 3 upgrade slots, your unarmed attacks gain the tracking +2 trait, and their damage increases to three dice (use three of the attack's damage die size). Level 12, 20,005 credits.
worn.hardlight-handwraps-ultimate.description: Worn gloves. Handwraps of hardlight that enhance your unarmed attacks as if they were manufactured weapons, letting you add an upgrade to them; treat the handwraps as melee weapons in the brawling group with light Bulk for this purpose. This grade has 3 upgrade slots, your unarmed attacks gain the tracking +3 trait, and their damage increases to three dice (use three of the attack's damage die size). Level 16, 100,005 credits.
worn.hardlight-handwraps-paragon.description: Worn gloves. Handwraps of hardlight that enhance your unarmed attacks as if they were manufactured weapons, letting you add an upgrade to them; treat the handwraps as melee weapons in the brawling group with light Bulk for this purpose. This grade has 4 upgrade slots, your unarmed attacks gain the tracking +3 trait, and their damage increases to four dice (use four of the attack's damage die size). Level 19, 400,005 credits.
worn.null-space-chamber-commercial.description: Worn. A sleek black device that clips to a backpack, purse or key ring; a button press opens a circular portal to an extradimensional pocket space. You Interact with it to stow or remove items. It can be opened and closed only from the outside. When opened in an atmosphere with air, it fills with 10 minutes' worth of air for every Bulk of capacity left. Stored items give no benefits until retrieved. Connected to a computer, it displays a readout of its contents. This grade holds 25 Bulk. Level 4, 750 credits.
worn.null-space-chamber-tactical.description: Worn. A sleek black device that clips to a backpack, purse or key ring; a button press opens a circular portal to an extradimensional pocket space. You Interact with it to stow or remove items. It can be opened and closed only from the outside. When opened in an atmosphere with air, it fills with 10 minutes' worth of air for every Bulk of capacity left. Stored items give no benefits until retrieved. Connected to a computer, it displays a readout of its contents. This grade holds 50 Bulk. Level 7, 3,000 credits.
worn.null-space-chamber-advanced.description: Worn. A sleek black device that clips to a backpack, purse or key ring; a button press opens a circular portal to an extradimensional pocket space. You Interact with it to stow or remove items. It can be opened and closed only from the outside. When opened in an atmosphere with air, it fills with 10 minutes' worth of air for every Bulk of capacity left. Stored items give no benefits until retrieved. Connected to a computer, it displays a readout of its contents. This grade holds 100 Bulk. Level 11, 12,000 credits.
worn.null-space-chamber-superior.description: Worn. A sleek black device that clips to a backpack, purse or key ring; a button press opens a circular portal to an extradimensional pocket space. You Interact with it to stow or remove items. It can be opened and closed only from the outside. When opened in an atmosphere with air, it fills with 10 minutes' worth of air for every Bulk of capacity left. Stored items give no benefits until retrieved. Connected to a computer, it displays a readout of its contents. This grade holds 150 Bulk. Level 13, 24,000 credits.
held.pain-journal-commercial.description: Held in 2 hands, Bulk L. A synthetic leather journal powered by your raw emotions. After spending 1 day writing in it, select Diplomacy, Intimidation or Performance; the choice can't be changed. Reading directly from the journal projects your painful memories and gives you a +1 item bonus to checks using the selected skill. Level 7, 3,333 credits.
held.pain-journal-tactical.description: Held in 2 hands, Bulk L. A synthetic leather journal powered by your raw emotions. After spending 1 day writing in it, select Diplomacy, Intimidation or Performance; the choice can't be changed. Reading directly from the journal projects your painful memories. This grade's item bonus to checks using the selected skill is +2, and its _share pain_ spell is 7th rank (DC 34). Level 15, 66,666 credits.
held.programmers-plushie-commercial.description: Held, stowed, or within arm's reach, Bulk L. A miniature plush, often resembling a programmer's avatar or a popular media character, that helps organize your thoughts. You gain a +1 item bonus to Computers checks. Level 3, 550 credits.
held.programmers-plushie-tactical.description: Held, stowed, or within arm's reach, Bulk L. A miniature plush that helps organize your thoughts. This grade's item bonus to Computers checks is +2, and its _lock_ spell is 3rd rank (DC 25). Level 8, 4,550 credits.
held.programmers-plushie-advanced.description: Held, stowed, or within arm's reach, Bulk L. A miniature plush that helps organize your thoughts. This grade's item bonus to Computers checks is +3, and its _lock_ spell is 7th rank (DC 35). Level 14, 38,550 credits.
held.reusable-grenade-shell.description: Held in 1 hand, Bulk 1. A reusable shell housing an installed grenade. You throw the shell to explode the grenade, using the grenade's range, damage and other effects. The shell remains and repairs the grenade over 24 hours, during which you can't install another grenade. The shell is too large for a grenade launcher. 80 credits.
consumables.cellular-stimulant-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 1st-rank _cellular stimulant_ spell (DC 15). Level 1, 30 credits.'
consumables.commercial-glow-up-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 1st-rank _glow up_ spell. Level 1, 50 credits.'
consumables.jump-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 1st-rank _jump_ spell. Level 2, 60 credits.'
consumables.shrink-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 2nd-rank _shrink_ spell. Level 3, 120 credits.'
consumables.invisibility-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 2nd-rank _invisibility_ spell. Level 4, 200 credits.'
consumables.tactical-glow-up-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 3rd-rank _glow up_ spell. Level 5, 210 credits.'
consumables.fly-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 4th-rank _fly_ spell. Level 5, 250 credits.'
consumables.commercial-resist-energy-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 2nd-rank _resist energy_ spell. Level 6, 450 credits.'
consumables.feline-senses-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 3rd-rank _feline senses_ spell. Level 7, 530 credits.'
consumables.commercial-cairn-form-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 4th-rank _cairn form_ spell. Level 7, 720 credits.'
consumables.haste-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 3rd-rank _haste_ spell. Level 8, 900 credits.'
consumables.advanced-glow-up-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 5th-rank _glow up_ spell. Level 9, 1,100 credits.'
consumables.tactical-resist-energy-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 4th-rank _resist energy_ spell. Level 10, 1,800 credits.'
consumables.tactical-cairn-form-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 6th-rank _cairn form_ spell. Level 11, 3,200 credits.'
consumables.advanced-resist-energy-spell-amp.description: 'Held in 1 hand, Bulk L. A spell ampoule: a ready-to-use magic injection that confers the benefits of a spell of the specified rank. This one confers a 7th-rank _resist energy_ spell. Level 14, 5,850 credits.'
held.1st-rank-spell-chip.description: "Installed in a computer or comm unit. Lets the device cast one 1st-rank spell; a device holds only one spell chip. Casting uses a Cast a Spell activity with the spell's normal actions while you hold the device in one hand. The spell must be on your spell list and of your tradition; you use your spell attack modifier and spell DC, and must still have any locus the spell requires. It can't hold cantrips or rituals, and its traits vary with the spell. Activate: Cast a Spell; Frequency once per day, plus overclock. Overclocking is using it again the same day: Cast the Spell, then roll a DC 10 flat check; on a success the chip is broken, on a failure it is destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast. Level 3, 600 credits."
held.2nd-rank-spell-chip.description: "Installed in a computer or comm unit. Lets the device cast one 2nd-rank spell; a device holds only one spell chip. Casting uses a Cast a Spell activity with the spell's normal actions while you hold the device in one hand. The spell must be on your spell list and of your tradition; you use your spell attack modifier and spell DC, and must still have any locus the spell requires. It can't hold cantrips or rituals, and its traits vary with the spell. Activate: Cast a Spell; Frequency once per day, plus overclock. Overclocking is using it again the same day: Cast the Spell, then roll a DC 10 flat check; on a success the chip is broken, on a failure it is destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast. Level 5, 1,600 credits."
held.3rd-rank-spell-chip.description: "Installed in a computer or comm unit. Lets the device cast one 3rd-rank spell; a device holds only one spell chip. Casting uses a Cast a Spell activity with the spell's normal actions while you hold the device in one hand. The spell must be on your spell list and of your tradition; you use your spell attack modifier and spell DC, and must still have any locus the spell requires. It can't hold cantrips or rituals, and its traits vary with the spell. Activate: Cast a Spell; Frequency once per day, plus overclock. Overclocking is using it again the same day: Cast the Spell, then roll a DC 10 flat check; on a success the chip is broken, on a failure it is destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast. Level 7, 3,600 credits."
held.4th-rank-spell-chip.description: "Installed in a computer or comm unit. Lets the device cast one 4th-rank spell; a device holds only one spell chip. Casting uses a Cast a Spell activity with the spell's normal actions while you hold the device in one hand. The spell must be on your spell list and of your tradition; you use your spell attack modifier and spell DC, and must still have any locus the spell requires. It can't hold cantrips or rituals, and its traits vary with the spell. Activate: Cast a Spell; Frequency once per day, plus overclock. Overclocking is using it again the same day: Cast the Spell, then roll a DC 10 flat check; on a success the chip is broken, on a failure it is destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast. Level 9, 7,000 credits."
held.5th-rank-spell-chip.description: "Installed in a computer or comm unit. Lets the device cast one 5th-rank spell; a device holds only one spell chip. Casting uses a Cast a Spell activity with the spell's normal actions while you hold the device in one hand. The spell must be on your spell list and of your tradition; you use your spell attack modifier and spell DC, and must still have any locus the spell requires. It can't hold cantrips or rituals, and its traits vary with the spell. Activate: Cast a Spell; Frequency once per day, plus overclock. Overclocking is using it again the same day: Cast the Spell, then roll a DC 10 flat check; on a success the chip is broken, on a failure it is destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast. Level 11, 15,000 credits."
held.6th-rank-spell-chip.description: "Installed in a computer or comm unit. Lets the device cast one 6th-rank spell; a device holds only one spell chip. Casting uses a Cast a Spell activity with the spell's normal actions while you hold the device in one hand. The spell must be on your spell list and of your tradition; you use your spell attack modifier and spell DC, and must still have any locus the spell requires. It can't hold cantrips or rituals, and its traits vary with the spell. Activate: Cast a Spell; Frequency once per day, plus overclock. Overclocking is using it again the same day: Cast the Spell, then roll a DC 10 flat check; on a success the chip is broken, on a failure it is destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast. Level 13, 30,000 credits."
held.7th-rank-spell-chip.description: |-
  Installed in a computer or comm unit; each device holds only one spell chip. It lets the device cast one spell of 7th rank. Hold the device in one hand and Cast a Spell with the normal number of actions. The spell must be on your spell list and of your tradition, and you use your spell attack modifier and spell DC. If the spell has a locus, you must still have that locus. A chip can't hold cantrips or rituals; its traits match the spell inside.

  **Activate** Cast a Spell; **Frequency** once per day, plus overclock. Using the chip more than once per day requires overclocking: Cast the Spell again, then roll a DC 10 flat check. On a success the chip is broken; on a failure it's destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast.

  Level 15, 65,000 credits.
held.8th-rank-spell-chip.description: |-
  Installed in a computer or comm unit; each device holds only one spell chip. It lets the device cast one spell of 8th rank. Hold the device in one hand and Cast a Spell with the normal number of actions. The spell must be on your spell list and of your tradition, and you use your spell attack modifier and spell DC. If the spell has a locus, you must still have that locus. A chip can't hold cantrips or rituals; its traits match the spell inside.

  **Activate** Cast a Spell; **Frequency** once per day, plus overclock. Using the chip more than once per day requires overclocking: Cast the Spell again, then roll a DC 10 flat check. On a success the chip is broken; on a failure it's destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast.

  Level 17, 150,000 credits.
held.9th-rank-spell-chip.description: |-
  Installed in a computer or comm unit; each device holds only one spell chip. It lets the device cast one spell of 9th rank. Hold the device in one hand and Cast a Spell with the normal number of actions. The spell must be on your spell list and of your tradition, and you use your spell attack modifier and spell DC. If the spell has a locus, you must still have that locus. A chip can't hold cantrips or rituals; its traits match the spell inside.

  **Activate** Cast a Spell; **Frequency** once per day, plus overclock. Using the chip more than once per day requires overclocking: Cast the Spell again, then roll a DC 10 flat check. On a success the chip is broken; on a failure it's destroyed. Overclocking a chip already overclocked that day destroys it automatically (even if repaired) and no spell is cast.

  Level 19, 400,000 credits.
consumables.1st-rank-spell-gem.description: Held in 1 hand, light Bulk. A latticed gemstone in a silicon casing, encoded with one specific spell of 1st rank. Hold it in one hand and Cast a Spell with the normal number of actions. The spell must be on your spell list and of your tradition, and you use your spell attack modifier and spell DC. The gem can be used once and is destroyed as part of the casting. It can't hold cantrips or rituals; its traits match the spell inside. Level 1, 40 credits.
consumables.2nd-rank-spell-gem.description: Held in 1 hand, light Bulk. A latticed gemstone in a silicon casing, encoded with one specific spell of 2nd rank. Hold it in one hand and Cast a Spell with the normal number of actions. The spell must be on your spell list and of your tradition, and you use your spell attack modifier and spell DC. The gem can be used once and is destroyed as part of the casting. It can't hold cantrips or rituals; its traits match the spell inside. Level 3, 120 credits.
