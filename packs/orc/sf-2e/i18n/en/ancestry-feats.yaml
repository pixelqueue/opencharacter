situational.naniteSurge.name: Nanite Surge
situational.protectiveSubroutine.name: Nanite Surge (Protective Subroutine)
situational.offensiveSubroutine.name: Nanite Surge (Offensive Subroutine)
situational.againstSonic.name: Against a sonic effect
feats.ancestry.android-lore.description: You become trained in Crafting and Thievery. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Android Lore.
feats.ancestry.emotionless.description: You gain a +1 circumstance bonus to saving throws against emotion effects. When you succeed on such a save, you get a critical success instead.
feats.ancestry.internal-compartment.description: You can hide an object of up to light Bulk in a hollow cavity in a forearm. Storing it takes 3 Interact actions. Others take a +4 circumstance bonus to the DCs of checks to Seek or Steal the stored object. If it is a weapon, you can use a single Interact action to draw it into the matching hand and then Strike with it.
feats.ancestry.memory-recovery.description: During your daily preparations, you tap archived memories to become trained in one skill of your choice until you next prepare. Because it is temporary, you can't use this proficiency as a prerequisite for a skill increase or a permanent character option such as a feat.
feats.ancestry.nanite-surge.description: 'Reaction. Frequency: once per hour. Trigger: you attempt a skill action that takes 3 or fewer actions. You gain a +2 status bonus to the triggering skill check. Your circuitry also glows, shedding dim light in a 10-foot emanation for 1 round.'
feats.ancestry.nightvision-adaptation.description: You gain darkvision.
feats.ancestry.quickened-processor.description: You gain a +1 circumstance bonus to Perception checks for initiative and a +2 circumstance bonus to Piloting checks for initiative.
feats.ancestry.advanced-targeting-system.description: You can cast _sure strike_ once per day as a 1st-rank arcane innate spell.
feats.ancestry.machine-saboteur.description: When you roll a critical hit against a creature with the tech trait, the target becomes glitching 1.
feats.ancestry.protective-subroutine.description: You can activate Nanite Surge when you attempt a saving throw instead of a skill action. If you do, you gain a +2 status bonus to the triggering saving throw.
feats.ancestry.internal-respirator.description: You can hold your breath for an additional hour by rebreathing from internal air reservoirs, which are then expended. Refilling them takes 10 minutes of exposure to breathable air.
feats.ancestry.offensive-subroutine.description: You can activate Nanite Surge when you attempt an attack roll instead of a skill action. If you do, you gain a +1 status bonus to the triggering attack roll.
feats.ancestry.repair-module.description: 'Single action. Frequency: once per day. You gain fast healing equal to half your level for 1 minute. If you use Nanite Surge or Nanite Form while it is active, the fast healing ends.'
feats.ancestry.consistent-surge.description: You can use Nanite Surge once per 10 minutes instead of once per hour.
feats.ancestry.revivification-protocol.description: 'Free action. Frequency: once per day. Trigger: you have the dying condition and are about to attempt a recovery check. You are restored to 1 Hit Point, lose the dying and unconscious conditions, and can act normally this turn. You gain or increase the wounded condition as normal for losing dying this way.'
feats.ancestry.synthetic-speech.description: You can cast _speak with computers_ once per day as a 4th-rank arcane innate spell.
feats.ancestry.memory-matrix.description: When you attempt a Will save against a spell or effect that would give you the confused or controlled condition, roll twice and use the higher result (a fortune effect). If you would start your turn confused or controlled, you can attempt a DC 5 flat check. On a success, you fight the control and are paralyzed until the end of your turn rather than acting against your will. On a natural 20, the confused or controlled condition ends immediately.
feats.ancestry.nanite-form.description: |-
  Two actions. Frequency: once per day. You become a swarm of nanites for up to 1 minute or until you spend a single action to return to normal. You become Huge, gain the swarm trait and gain a fly Speed of 40 feet. As a swarm:

  - You're immune to the grabbed, prone and restrained conditions.
  - You have weakness 5 to area and splash damage.
  - You can occupy the same space as other creatures, and must to use your damaging ability.
  - As a 2-action activity, you deal 10d6 acid damage to all creatures sharing your space (basic Reflex save against the higher of your class DC or spell DC).
  - You can't speak, Cast Spells, use manipulate actions requiring hands, Activate magic items or make Strikes with your normal body.
  - You don't gain the swarm mind ability, so mental effects affect you normally.
feats.ancestry.adaptable-limbs.description: Your Speed becomes 20 feet. You also gain the Adaptive Locomotion action.
feats.ancestry.barathu-lore.description: You become trained in Crafting and Medicine. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Barathu Lore.
feats.ancestry.darkvision-adaptation.description: You gain darkvision.
feats.ancestry.dermal-spikes.description: Your Fortitude DC against Athletics checks to Grapple or Shove you increases by 1. You also gain the Piercing Spikes reaction.
feats.ancestry.grasping-tendrils.description: You gain two more arms. One pair of hands is designated your active hands at any time, and you can switch the designation to another pair with the Switch Hands action (1 action). You can wield items only with your active hands. You can take this feat multiple times.
feats.ancestry.metabolic-manipulation.description: You gain the Fast Recovery skill feat and the Targeted Immunization action. You can take this feat multiple times.
feats.ancestry.tentacle-whip.description: You gain a tentacle unarmed attack that deals 1d6 bludgeoning damage. It is in the brawling weapon group and has the barathu, finesse, reach and unarmed traits.
feats.ancestry.fluid-anatomy.description: "Reaction. Frequency: once per hour. Trigger: an enemy scores a critical hit against you with a Strike. The triggering attack deals only the damage it would on a hit (typically normal instead of double damage). Other critical-hit effects, such as critical specialization effects, still apply. Until the start of your next turn, you're off-guard against the triggering enemy."
feats.ancestry.molecular-modification.description: You gain resistance equal to half your level to one of acid, bludgeoning, cold, electricity, fire, piercing, poison, slashing or sonic damage. You can take this feat multiple times, choosing a different damage type each time.
feats.ancestry.vent-gas.description: 'Single action. Frequency: once per hour. All squares in a 5-foot emanation fill with gas. Creatures in the gas are concealed, and creatures outside it are concealed to creatures within it. The gas disperses at the start of your next turn. You gain a +10-foot circumstance bonus to all your Speeds until the start of your next turn, then you Stride.'
feats.ancestry.convergent-evolution.description: Choose up to three ancestries you've had significant contact with. You can select ancestry feats from those ancestries as well as barathu ones. You also gain one ancestry feat of 5th level or lower you qualify for from one of the chosen ancestries, which you can retrain once per day during your daily preparations.
feats.ancestry.expansive-verse.description: During your daily preparations, choose one common 2nd-rank spell from the occult spell list. You can cast it once as an occult innate spell before your next daily preparations.
feats.ancestry.corrosive-venting.description: 'When you Vent Gas, its emanation increases to 10 feet. You can make the gas caustic: any non-barathu creature that enters the emanation or starts its turn in it takes 3d6 acid damage (basic Reflex save against the higher of your class DC or spell DC). On a critical failure it also takes 1d4 persistent acid damage. At 17th level the acid damage increases by 2d6 and the persistent damage by 1d4.'
feats.ancestry.internal-chemistry.description: When you restore Hit Points to yourself with a consumable item with the healing trait, you regain additional Hit Points equal to half your level.
feats.ancestry.combine.description: |-
  Two actions. Frequency: once per day. You merge with an adjacent willing creature, overlaying yourself on them, for 10 minutes. You can Dismiss the effect, emerging in a space adjacent to the target. While combined, you and the target take your own turns and are targeted separately, and:

  - If the target is Medium or smaller, it becomes Large with 10-foot reach.
  - You occupy the target's space and can't take actions with the move trait; if the target moves, you move with it.
  - For each Speed you have, if yours is faster or the target lacks it, the target gains your Speed.
  - Your body gives the target greater cover; you gain no cover. It doesn't obscure the target's vision or block line of sight.
feats.ancestry.manifold-evolution.description: The number of ancestries you can choose with Convergent Evolution increases to six. You gain two additional ancestry feats of 13th level or lower you qualify for from those ancestries, and can retrain one or both once per day during your daily preparations.
feats.ancestry.adapted-augmentations.description: Choose one common augmentation of item level 1 or lower. You begin with it already installed, without paying its price, and it doesn't count toward your implant limit.
feats.ancestry.adapted-cantrip.description: Choose one cantrip from a magical tradition other than your own. If you prepare spells, you can pick it when preparing cantrips, in addition to your other options. If you have a spell repertoire, it replaces one of your cantrips known. You cast it as a spell of your class's tradition. If you later swap or retrain it, you can choose its replacement from the same alternate tradition or a different one.
feats.ancestry.cooperative-nature.description: You gain a +4 circumstance bonus on checks to Aid.
feats.ancestry.general-training.description: You gain a 1st-level general feat. You must meet its prerequisites, but if you take this feat at character creation you can choose the general feat later in the process to determine which prerequisites you meet. You can take this feat multiple times, choosing a different feat each time.
feats.ancestry.natural-ambition.description: You gain a 1st-level class feat for your class. You must meet its prerequisites, but you can choose it later in character creation to determine which prerequisites you meet.
feats.ancestry.natural-skill.description: You become trained in two skills of your choice.
feats.ancestry.unconventional-weaponry.description: Choose an uncommon simple or martial weapon with an ancestry trait (such as kasatha, vesk or ysoki) or that is common in another culture. You gain access to it and treat it as a simple weapon for proficiency. If you're trained in all martial weapons, you can instead choose an uncommon advanced weapon with an ancestry trait or common in another culture; you gain access to it and familiarity with it, and treat it as a martial weapon for proficiency.
feats.ancestry.adaptive-adept.description: "Choose a cantrip or 1st-rank spell from the same tradition as your Adapted Cantrip cantrip. You gain it, adding it to your spell options just like that cantrip, and cast it as a spell of your class's tradition. If you choose a 1st-rank spell, you don't gain its heightened versions: you can't prepare it heightened, learn it heightened, or select it as a signature spell."
feats.ancestry.clever-improviser.description: You gain the Untrained Improvisation general feat. You can also attempt skill actions that normally require training even if you're untrained.
feats.ancestry.confident-actualization.description: "Free action. Frequency: once per day. Trigger: you're about to attempt a saving throw or skill check. Roll the triggering check or save twice and use the better result."
feats.ancestry.cooperative-soul.description: If you're at least an expert in the skill you're Aiding, a failure or critical failure on your Aid check becomes a success.
feats.ancestry.incredible-improvisation.description: "Free action. Frequency: once per day. Trigger: you attempt a check with a skill you're untrained in. You gain a +4 circumstance bonus to the triggering check."
feats.ancestry.multitalented.description: You gain a 2nd-level multiclass dedication feat, even if you normally couldn't take another dedication feat until you take more feats from your current archetype.
feats.ancestry.advanced-general-training.description: You gain a general feat of 7th level or lower. You must meet its prerequisites. You can take this feat multiple times, choosing a different feat each time.
feats.ancestry.inner-wellspring.description: 'Single action. Frequency: once per day. You draw on inner reserves of power and regain 1 Focus Point.'
feats.ancestry.stubborn-persistence.description: When you would become fatigued, attempt a DC 17 flat check. On a success, you aren't fatigued. If the fatigue has an underlying cause you don't address, such as lack of rest, you must repeat the check at an interval the GM sets until you fail it or address the cause.
feats.ancestry.persistent-confidence.description: You can use Confident Actualization once per hour instead of once per day.
feats.ancestry.too-stubborn-to-die.description: "Reaction. Frequency: once per day. Trigger: you would die. You haul yourself back from the brink. You lose the dying and unconscious conditions, and if you're at 0 Hit Points you have 1 Hit Point. Increase your wounded and doomed conditions by 1. You can use this reaction while unconscious."
feats.ancestry.calm-before-the-storm.description: When you're frightened, at the end of your turn you reduce the frightened condition by 2 instead of 1.
feats.ancestry.crew-member.description: "Reaction. Trigger: an ally within 30 feet attempts to Aid and rolls a failure. Attempt a skill check or attack roll of the same type as your ally's and replace the failed Aid's result with yours, even if you didn't prepare to help."
feats.ancestry.kasatha-lore.description: You become trained in Diplomacy and Society. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Kasatha Lore.
feats.ancestry.kasathan-weapon-familiarity.description: You gain access to all uncommon weapons with the kasatha trait. You have familiarity with weapons with the kasatha trait plus the dueling sword, plasma sword, shock truncheon and singing spear; for proficiency, you treat any of these that are martial as simple and any that are advanced as martial. At 5th level, when you get a critical hit with one of these weapons, you get its critical specialization effect.
feats.ancestry.natural-grace.description: "Free action. Frequency: once per day. Trigger: you fail an Acrobatics check or Reflex saving throw. Reroll the triggering check or save and use the second result even if it's worse."
feats.ancestry.double-draw.description: Single action. You Interact twice to draw, stow or swap items, up to two items each.
feats.ancestry.historian.description: You become trained in a Lore skill of your choice. You can spend 10 minutes checking your notes or research materials to Recall Knowledge about a piece of history with any Lore skill you aren't trained in, using your highest Lore modifier instead of your modifier with that skill.
feats.ancestry.kasatha-weapon-elegance.description: When you wield a weapon you aren't proficient with, your level is your proficiency bonus. At 11th level, you become trained in all weapons.
feats.ancestry.masked.description: While your mouth is covered, the DC of Perception checks to Sense Motive against you increases by 2. You gain a +1 circumstance bonus to Lie, Make a Request and Make an Impression.
feats.ancestry.all-hands-on-deck.description: 'Free action. Frequency: once per day. Until the start of your next turn, one additional pair of hands counts as your active hands. At the start of your next turn, choose which set of active hands remains active.'
feats.ancestry.history-buff.description: You can cast _hypercognition_ once per day as a 3rd-rank occult innate spell. When casting it, you can use your modifier for the Lore skill you chose for Historian in place of any other skill modifier on Recall Knowledge checks.
feats.ancestry.uncanny-awareness.description: You gain a +2 circumstance bonus to Perception checks for initiative. If your initiative ties with an opponent's, you go first, whether or not you rolled Perception. The first time each day you roll Perception for initiative, roll twice and use the higher result.
feats.ancestry.cosmic-disciple.description: You gain _entropy strike_ and _skyfire wings_ as 3rd-rank occult innate spells, each castable once per day.
feats.ancestry.perfectly-balanced.description: You gain resistance 5 to cold and fire. You also gain the Redirect Energy reaction.
feats.ancestry.cleanse-spirit.description: You gain _cleanse affliction_ and _sound body_ as 4th-rank occult innate spells, each castable once per day.
feats.ancestry.reliable-grace.description: You can use Natural Grace once per hour instead of once per day.
feats.ancestry.alluring-pheromones.description: You can use Diplomacy to Make an Impression on creatures you share no language with, and to make simple Requests of them (such as asking directions or having them pick a specific individual out of a crowd). When you do, Make an Impression and Request lose the linguistic trait and gain the olfactory trait.
feats.ancestry.center-thoughts.description: 'Free action. Frequency: once per day. Trigger: you fail a Will saving throw against a mental effect. Reroll the triggering save and use the better result.'
feats.ancestry.commanding-pheromones.description: When you Coerce a creature and it would become unfriendly (and isn't already unfriendly or hostile), it becomes indifferent instead.
feats.ancestry.distant-telepath.description: Your limited telepathy range increases by 15 feet. You can take this feat more than once.
feats.ancestry.lashunta-lore.description: You become trained in Occultism and Society. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Lashunta Lore.
feats.ancestry.psychic-talent.description: Choose one cantrip from the occult spell list. You can cast it at will as an occult innate spell, heightened to half your level rounded up.
feats.ancestry.psychic-bully.description: You can cast _command_ and _fear_ as 1st-rank occult innate spells, each once per day.
feats.ancestry.psychic-scholar.description: You can cast _mindlink_ twice per day as a 1st-rank occult innate spell.
feats.ancestry.sensitive-antennae.description: You gain thoughtsense as a vague sense with a range of 30 feet, letting your antennae tell whether a creature is in range. It detects only thinking creatures; unthinking creatures or those immune to mental effects can't be perceived, and it doesn't let you read their thoughts. At 9th level, it becomes an imprecise sense.
feats.ancestry.telepathic-conduit.description: When you use limited telepathy to communicate with a creature, it can briefly respond to you, either as a reaction or as a free action at the start of its next turn, as long as it stays within range of your telepathy.
feats.ancestry.guarded-thoughts.description: An effect that specifically tries to read your mind to gain information must succeed at a counteract check against the higher of your class DC or spell DC, or it gains no information. The counteract rank is half your level rounded up.
feats.ancestry.psychic-mastery.description: Choose one common 2nd-rank spell from the occult spell list. You can cast it once per day as an occult innate spell.
feats.ancestry.focus-pheromones.description: 'Single action. Frequency: once per hour. If your next action is a Deception check to Create a Diversion, a Diplomacy check to Request, or an Intimidation check to Demoralize, roll the check twice and use the better result.'
feats.ancestry.psychic-investigator.description: You can cast _hypercognition_ and _mind reading_ as 3rd-rank occult innate spells, each once per day.
feats.ancestry.centered-mind.description: You can use Center Thoughts once per hour instead of once per day.
feats.ancestry.mental-deflection.description: "Reaction. Trigger: a creature Casts a Spell with the mental trait. Requirement: you have at least 1 Focus Point. When you can see or otherwise detect the spell's manifestations, you expend 1 Focus Point and attempt to counteract it, using your spellcasting attribute modifier plus your spellcasting proficiency bonus as the counteract modifier and half your level rounded up as the counteract rank."
feats.ancestry.psychic-paragon.description: Choose one common 6th-rank spell from the occult spell list. You can cast it once per day as an occult innate spell.
feats.ancestry.competitive-spirit.description: "Reaction. Frequency: once per hour. Trigger: an ally attempts a skill check with a skill you're trained or better in. Until the end of your next turn, you can attempt the same skill check to perform the same action or activity the ally performed, with a +2 circumstance bonus. If you get at least one degree of success better than the ally, this use doesn't count toward the frequency. On a critical failure, you take a -1 circumstance penalty to all checks with that skill for 1 hour."
feats.ancestry.harmonic-sensitivity.description: You become trained in Performance, or gain the Assurance skill feat with Performance if you're already trained. You can accurately recall a melody or lyrics heard within the last week, gaining a +2 circumstance bonus to Deception and Performance checks that involve mimicking speech or a specific sound.
feats.ancestry.long-whiskered.description: At the end of each round in which you're untethered, attempt a DC 15 flat check. On a success, you ignore the clumsy and off-guard conditions from zero-g for 1 minute.
feats.ancestry.pahtra-lore.description: You become trained in Acrobatics and Performance. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Pahtra Lore.
feats.ancestry.predatory.description: Choose a claw or jaws unarmed attack, both in the brawling weapon group. A claw deals 1d6 slashing damage and has the agile, finesse, pahtra and unarmed traits. A jaws attack deals 1d6 piercing damage and has the finesse, grapple, pahtra and unarmed traits. At 5th level, when you get a critical hit with one of these attacks, you get its critical specialization effect. You can take this feat a second time to select the other attack.
feats.ancestry.battleblessed.description: You can cast _tailwind_ once per day as a 1st-rank primal innate spell.
feats.ancestry.climbing-claws.description: You gain a climb Speed equal to your land Speed.
feats.ancestry.electromagnetic-whiskers.description: You gain electromagnetic sense as an imprecise sense out to 15 feet, detecting nearby living and technological creatures. In places with too much electromagnetic radiation, such as a spaceship engine room or near a powerful radio source, you might need to Seek to find an undetected creature.
feats.ancestry.harmonic-shielding.description: You gain sonic resistance equal to half your level. When you succeed on a saving throw against a sonic effect, you get a critical success instead.
feats.ancestry.melodic-adaptation.description: You detect magic as though always using a 1st-rank _detect magic_ spell in a 30-foot emanation. At 13th level the rank becomes 3rd, and at 17th level 4th.
feats.ancestry.divine-rhythm.description: You gain a +2 status bonus to Performance checks. You can use Performance to Create a Diversion, Demoralize or Make an Impression. If you listen to music while resting, you regain additional Hit Points equal to your level.
feats.ancestry.remix-worlds-rhythm.description: You gain _haste_ and _slow_ as 3rd-rank primal innate spells, each castable once per day.
feats.ancestry.scrupulous-stalker.description: 'Free action. Frequency: once per round. You Seek. If you use electromagnetic sense, you gain a +2 circumstance bonus to the check.'
feats.ancestry.boundless-brachiator.description: You can Leap up to 30 feet in any direction without touching the ground and without an Athletics check. You must land on a surface you can Climb or adjacent to an Edge you can Grab within 30 feet of you, or you fall after your next action. You can exceed your normal Speed while Leaping.
feats.ancestry.song-of-my-people.description: You can cast _breath of life_ once per day as a 7th-rank primal innate spell. It gains the auditory trait.
feats.ancestry.communalism.description: 'Reaction. Frequency: once per day. Trigger: an ally within 10 feet fails a skill check that requires 3 actions or fewer. The ally rerolls the triggering check and takes the better result.'
feats.ancestry.linguistic-prodigy.description: You gain two additional languages of your choice from the common and uncommon languages available to you. Each time you take the Multilingual feat, you gain another new language in addition to the two it gives.
feats.ancestry.shirren-lore.description: You become trained in Diplomacy and Society. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Shirren Lore.
feats.ancestry.eager-assistant.description: At the start of your turn, you gain one additional reaction, usable only to Aid.
feats.ancestry.learning-experience.description: Before you roll damage from a persistent effect, you can choose to take half damage from it. If you do, you automatically fail the flat check to end the persistent damage, and you can immediately Recall Knowledge as a free action about the source of the damage. Abilities or free actions that normally trigger when you Recall Knowledge can't be used with this action.
feats.ancestry.telepathic-conduit-shirren.description: When you use limited telepathy to communicate with a creature, it can give you a brief response as a reaction, or as a free action at the start of its next turn.
feats.ancestry.basic-insectile-flight.description: You grow a pair of insectile wings that give you a fly Speed of 20 feet, and you take no damage when you fall. If you're a winged shirren, you instead grow a second set of wings or your wings morph into a stronger set, and your fly Speed is 25 feet.
feats.ancestry.psychic-master.description: Choose one common 2nd-rank spell from the occult spell list. You can cast it once per day as an occult innate spell.
feats.ancestry.consistent-communalism.description: You can use Communalism once per hour instead of once per day.
feats.ancestry.linguistic-master.description: You can cast _truespeech_ once per day as a 5th-rank occult innate spell, on yourself only. For its duration, you gain a +1 status bonus to Diplomacy checks when speaking to creatures you already shared a language with before Casting the Spell.
feats.ancestry.unconventional-expertise.description: When you gain a class feature that grants expert or greater proficiency in certain weapons, you also gain that proficiency in the weapon you chose for Unconventional Weaponry.
feats.ancestry.scatter-thoughts.description: "Reaction. Frequency: once per day. Trigger: you're targeted by a mental effect. You scatter your thoughts to block the intrusion, becoming immune to the triggering mental effect for 1 minute."
feats.ancestry.glorious-evolution.description: You gain a +2 status bonus to saves against fear and acid resistance equal to half your level. You can cast _mask of terror_ once per day as a 7th-rank primal innate spell.
feats.ancestry.clinging-bite.description: Your jaws unarmed attack gains the grapple trait. When you critically hit with it, you can use your next action to attempt to Grapple that creature with your jaws, or to automatically extend the grabbed condition on a creature you're restraining with your jaws. This attempt doesn't apply or count toward your multiple attack penalty.
feats.ancestry.dauntless.description: You gain a +1 circumstance bonus to saves against fear and to your Will DC against attempts to Demoralize you. When you succeed on a save against a fear effect, you get a critical success instead.
feats.ancestry.fixation.description: Choose a topic you're fascinated with. You gain the Additional Lore feat and the Assurance feat for that Lore.
feats.ancestry.hug-master.description: You gain the Titan Wrestler skill feat, a +1 circumstance bonus to Athletics checks to Grapple, and a +1 circumstance bonus to your Fortitude DC to avoid being Grappled.
feats.ancestry.hyper.description: Your Speed increases by 5 feet.
feats.ancestry.skittermander-lore.description: You become trained in Diplomacy and Society. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Skittermander Lore, and you learn the original skittermander language.
feats.ancestry.helping-hand.description: "Free action. Frequency: once every 10 minutes. This counts as preparing to help an ally for using the Aid reaction. You must still explain to the GM how you're helping."
feats.ancestry.lucky-improviser.description: You gain the Untrained Improvisation general feat and the Beginner's Luck action.
feats.ancestry.all-hands-on-deck-skittermander.description: 'Free action. Frequency: once per day. Until the start of your next turn, two additional pairs of hands count as your active hands. At the start of your next turn, choose which set of active hands remains active.'
feats.ancestry.hush.description: 'Single action. Frequency: once per day. You Recall Knowledge with a +2 circumstance bonus. A critical failure becomes a failure, and a success becomes a critical success.'
feats.ancestry.secrete-numbing-saliva.description: |-
  Single action. Frequency: once per hour. Requirement: your last action was a successful Strike with your stomach-mouth jaws unarmed attack. Your target is exposed to numbing saliva.

  **Numbing Saliva** (injury, poison). Saving Throw Fortitude (the higher of your class DC or spell DC); Maximum Duration 6 rounds; Stage 1 clumsy 1 (1 round); Stage 2 clumsy 1 and suppressed (1 round); Stage 3 clumsy 2 and suppressed (1 round).
feats.ancestry.zoomies.description: 'Single action. Frequency: once per day. You become quickened for 4 rounds, and can use the extra action each round only to Stride.'
feats.ancestry.chattermander.description: You gain _speak with animals_ as a 2nd-rank primal innate spell, and _speak with plants_ and _translate_ as 3rd-rank primal innate spells, each castable once per day.
feats.ancestry.opportunistic-hug.description: "Reaction. Trigger: a creature critically fails a melee Strike against you. Requirements: the creature is within your reach, you have a free active hand, and it's no more than one size larger than you. You attempt an Athletics check to Grapple the creature. If you have the Titan Wrestler skill feat, you can use this against creatures up to two sizes larger than you, or three if you're legendary in Athletics."
feats.ancestry.supersonic-speed.description: When you Stride while quickened from Zoomies, you gain concealment until the start of your next turn. As usual for concealment from an obvious visual manifestation, you can't use it to Hide.
feats.ancestry.allsix.description: "Single action. Frequency: once per day. Requirement: you aren't holding any items except in your active hands. You put all six hands (three sets of arms) into the task. The next time you roll an attack roll or skill check, roll it three times and use the highest result."
feats.ancestry.boundless-energy.description: You can use Zoomies once per hour instead of once per day.
feats.ancestry.armor-ace.description: When donning armor, you can give it the bulwark trait until you remove it. When wearing armor that already has the bulwark trait, the Reflex save modifier it grants against damaging effects increases to +4 instead of +3.
feats.ancestry.brutal-anatomy.description: Choose a claw, jaws or tail unarmed attack, all in the brawling weapon group. A claw deals 1d6 slashing damage and has the agile, finesse, unarmed and vesk traits. A jaws attack deals 1d6 piercing damage and has the grapple, unarmed and vesk traits. A tail deals 1d6 bludgeoning damage and has the sweep, trip, unarmed and vesk traits. At 5th level, when you get a critical hit with one of these attacks, you get its critical specialization effect. You can take this feat three times, selecting a different attack each time.
feats.ancestry.command-tactics.description: 'When an ally selects you as the target of their Follow the Expert, the circumstance bonus they receive increases by an additional +1, or +2 if you have master proficiency or higher (totals: +3 for expert, +5 for master, +6 for legendary).'
feats.ancestry.fearless.description: When you succeed on a saving throw against a fear effect, you get a critical success instead.
feats.ancestry.vesk-weapon-familiarity.description: You're trained with all doshkos. You gain access to all uncommon weapons with the vesk trait. For proficiency, you treat any of these that are martial as simple and any that are advanced as martial. At 5th level, when you get a critical hit with one of these weapons, you get its critical specialization effect.
feats.ancestry.blood-sense.description: You gain blood sense as an imprecise sense with a range of 30 feet, letting you smell the exact location of a living creature that isn't at full Hit Points. Creatures without blood, such as oozes and most constructs, can't be detected this way.
feats.ancestry.menacing-snarl.description: 'Free action. Frequency: once per hour. Trigger: you frighten a creature. You verbally menace the creature, increasing the value of its frightened condition by 1 (maximum 3).'
feats.ancestry.terrifying-bravado.description: 'Reaction. Trigger: you critically succeed on a save against a fear effect from a creature, or a creature fails or critically fails an Intimidation check to Demoralize you. You attempt an Intimidation check to Demoralize the triggering creature.'
feats.ancestry.eager-combatant.description: 'Free action. Trigger: you roll Athletics or Intimidation for initiative. You Stride in a straight line directly toward an enemy.'
feats.ancestry.opening-roar.description: At the start of a combat encounter, if you're aware of your foes and aren't attempting to Sneak or Hide, you can roll Intimidation for initiative and use the result to Demoralize one observed foe.
feats.ancestry.plated-deflection.description: You gain the Plate Deflection reaction.
feats.ancestry.advantageous-assault.description: When you successfully Strike a creature that has the frightened or persistent bleed condition with a melee or ranged weapon, you gain a circumstance bonus to the damage roll equal to the number of weapon damage dice of the weapon used.
feats.ancestry.battle-blessing.description: "Single action. Frequency: once per day. Requirement: you're engaged in combat. You pray to your deity (or a battle saint) for a blessing in the heat of battle and regain 1 Focus Point, up to your usual maximum."
feats.ancestry.overcome-shame.description: 'Free action. Frequency: once per 10 minutes. Trigger: you critically fail a Strike against an enemy. The next time before the end of your turn that you Strike with the same weapon against the same target, roll the attack twice and use the higher result. If that attack misses, you become off-guard until the end of your next turn.'
feats.ancestry.battle-saint.description: You can cast _rocket dash_ and _haste_ as 7th-rank divine innate spells, each once per day.
feats.ancestry.bolstered-by-battle.description: 'Free action. Frequency: once per hour. Trigger: you deal the killing blow to an enemy. You gain temporary Hit Points equal to your level, lasting 1 minute or until the encounter ends, whichever comes first.'
feats.ancestry.cheek-pouches.description: You can store up to four items of light Bulk or less, none with a dimension over 1 foot, in your cheek pouches. While any item is stored, your speech is hard to understand. Placing an item in or retrieving one is an Interact action. With a single action you can empty your mouth, dropping everything stored into your square.
feats.ancestry.extra-devotion.description: You become trained in Deception and Thievery. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for your deity's Lore.
feats.ancestry.nimble-tail.description: You can use your tail to Push Off in zero-g without needing a free hand. You also ignore the clumsy and off-guard penalties while untethered in zero gravity.
feats.ancestry.tinkering-fingers.description: You become trained in Crafting; if you're already trained from another source (such as your background or class), you become trained in a skill of your choice instead. You can Repair an item without a repair toolkit and without the -2 circumstance penalty, improvising tools. You gain a +1 circumstance bonus to Crafting checks to Repair an item when you have a repair toolkit.
feats.ancestry.ysoki-lore.description: You become trained in Acrobatics and Stealth. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Ysoki Lore.
feats.ancestry.cornered-fury.description: If a foe larger than you critically hits and damages you, that foe is off-guard to you for 1 round.
feats.ancestry.prehensile-tail.description: You can hold one extra hand's worth of equipment with your tail and use it to perform Interact actions. Your tail counts as one pair of hands for designating active hands with the Switch Hands action.
feats.ancestry.quick-stow.description: 'Free action. Frequency: once per round. You Interact to store one held item in your cheek pouches, provided it fits.'
feats.ancestry.big-mouth.description: Your cheek pouches can hold up to 1 Bulk of items instead of four items of light Bulk. The maximum size of a single item is unchanged.
feats.ancestry.overcrowd.description: While you're Small, you can end your movement in the same square as a Small ally. No more than two creatures can share a space using this ability or a similar one.
feats.ancestry.underfoot.description: While you're Small, you can end a successful Tumble Through in a Medium or larger enemy's space. The GM decides whether the enemy has limbs or leaves enough room for this (you couldn't occupy the space of an ooze that fills the whole square). While you occupy an enemy's space, that enemy is off-guard to you.
feats.ancestry.explosive-surprise.description: Preparing a grenade and storing it in your cheek pouch takes 10 minutes. As a single action, you can draw and throw that prepared grenade with your mouth, without needing a free hand.
feats.ancestry.skulking-strike.description: "Reaction. Trigger: an enemy occupying your space uses a manipulate or move action, makes a ranged attack, or leaves a square during a move action. Make a melee Strike against the triggering creature. If it's a critical hit and the trigger was a manipulate action, you disrupt that action. This Strike doesn't count toward your multiple attack penalty, and your penalty doesn't apply to it."
feats.ancestry.steadfast-faith.description: You gain _divine decree_ once per day as a 7th-rank divine innate spell. Also, once per month, when you would die, your body instead turns into a swarm of dispersing rats. After 1d6 days the rats gather in a safe space of the GM's choosing (a site dedicated to your deity, if possible) and reform your body, returning you to life at maximum Hit Points.
feats.ancestry.slip-from-sight.description: 'Free action. Frequency: once per hour. Trigger: you successfully Hide with Stealth and become hidden from all current foes, or Sneak and become undetected to all current foes. You become invisible for 1 minute or until you take a hostile action, whichever comes first.'
feats.ancestry.etheric.description: You gain the Soul Shield reaction.
feats.ancestry.headstrong.description: You gain a +1 circumstance bonus to Will saves against fear and against effects that would make you confused or controlled, and to your Will DC against attempts to Demoralize you.
feats.ancestry.necrotized.description: You gain the Diehard feat, and death effects don't kill you if they reduce you to 0 Hit Points. This prevents automatic death or automatic reduction of your dying value, but not other parts of the effect (a _vision of death_ spell still deals mental damage and frightens you; you just don't die instantly).
feats.ancestry.baleful-gaze.description: "Single action. Frequency: once per minute. Focus your ill intent on one living creature within 30 feet. It must succeed at a Will save against the higher of your class DC or spell DC or become frightened 1 (frightened 2 on a critical failure) and stupefied 1 as long as it's frightened. A creature you've used Baleful Gaze on is temporarily immune for 24 hours."
feats.ancestry.borai-lore.description: You become trained in Intimidation and Religion. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Borai Lore.
feats.ancestry.death-touched-caster.description: Choose _vitality lash_ or _void warp_. You can cast it at will as a divine innate spell, heightened to half your level rounded up. You can take this feat twice, choosing a different cantrip each time.
feats.ancestry.only-slightly-dead.description: You don't need to roll Deception against a creature's Perception DC, or use a disguise kit, to Impersonate a living member of your ancestry or hide your borai heritage. This is non-magical and doesn't protect against detection, revelation or scrying. When a creature actively attempts a Perception check against you, you gain a +4 circumstance bonus to your Deception DC, only for seeing through such an Impersonation.
feats.ancestry.deathly-constitution.description: You gain a +1 circumstance bonus to Fortitude saves against disease and poison.
feats.ancestry.soul-sustenance.description: You don't need to eat or drink, and you count your Constitution modifier as one higher when determining how much you heal from resting.
feats.ancestry.unliving-memories.description: You become trained in Religion; if already trained, you become trained in another skill of your choice. You gain the Additional Lore feat for a Lore subcategory about a specific plane tied to your afterlife.
feats.ancestry.void-blood.description: You gain void resistance equal to half your level.
feats.ancestry.resonant-weapon.description: Single action. Until the start of your next turn, one weapon you're holding gains the effects of the ghost killer weapon fusion. At 17th level, it deals an additional 1d6 spirit damage.
feats.ancestry.shroud-of-shattered-spirits.description: "Reaction. Frequency: once per day. Trigger: an enemy's Strike or targeted effect would hit you, and you weren't already concealed, hidden or undetected to that enemy. You become concealed until the start of your next turn, and the flat check for concealment applies to the triggering Strike or effect. If the flat check fails, it misses you."
feats.ancestry.unleash-pneuma.description: 'Two actions. Frequency: once per day. You unleash your spiritual essence in a burst, dealing 5d6 damage of your chosen type to all adjacent creatures (basic Reflex save against the higher of your class DC or spell DC). At 11th level and every 2 levels thereafter, the damage increases by 1d6. When you take this feat, choose vitality or void permanently; Unleash Pneuma deals that damage type and gains that trait. You can take this feat twice, choosing a different type each time, in which case its frequency is once per day per damage type.'
feats.ancestry.intuitive-talent.description: "Free action. Frequency: once per hour. Choose a skill you're untrained in. Until the start of your next turn, you're trained in it."
feats.ancestry.stubborn-corpse.description: When you critically fail a saving throw against a mental effect, you get a failure instead. You also gain the Deny Failure reaction.
feats.ancestry.baleful-presence.description: You can use Baleful Gaze as a 2-action activity. If you do, it gains the divine trait, loses the visual trait, and affects each living creature in a 30-foot emanation instead of a single creature.
feats.ancestry.undying.description: 'Reaction. Frequency: once per hour. Trigger: you have the dying condition and are about to attempt a recovery check. You are restored to 1 Hit Point, lose the dying and unconscious conditions, and can act normally this turn. You increase your wounded condition as normal.'
feats.ancestry.hyperspace-touched.description: 'Single action. Frequency: once per day. You conjure a straight, vertical, intangible barrier of colorful light, up to 10 feet long and 10 feet high, within 30 feet. Creatures targeted through it have concealment. It sheds bright light for 10 feet on each side and dim light for the next 10 feet. You can ignore the concealment it grants. It lasts 5 rounds.'
feats.ancestry.spectrasoul.description: You can communicate mentally with spectra and with intelligent constructs with the tech trait within 30 feet, without sharing a language. This gives no special access to their thoughts and conveys no more than normal speech would.
feats.ancestry.chosen-prismeni.description: You become trained in Religion and your deity's Lore. You have familiarity with the pulse gauntlet, which you treat as a simple weapon for proficiency. When you gain a class feature that grants expert or greater proficiency in simple weapons, you also gain that proficiency in the pulse gauntlet.
feats.ancestry.data-jockey.description: You can cast the _implant data_ cantrip at will as a divine innate spell, heightened to half your level rounded up.
feats.ancestry.living-battery.description: You can cast the _electric arc_ cantrip at will as a divine innate spell, heightened to half your level rounded up. When you cast it, you can also target batteries or battery-powered tech items (in any combination). Such a target isn't damaged; it regains 2 charges per spell rank. A tech item that needs a battery but has none is treated as having a battery with 2 charges per spell rank for 1 minute.
feats.ancestry.prismeni-lore.description: You become trained in Piloting and Stealth. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead. You also gain the Additional Lore general feat for Prismeni Lore.
feats.ancestry.tech-familiarity.description: You become trained in Computers and Crafting. For any of those you would automatically be trained in already (from your background or class, say), you become trained in a skill of your choice instead.
feats.ancestry.hyperspace-hop.description: "Single action. Frequency: once per day. You teleport up to your Speed within your line of sight. If you're in hyperspace, the distance is doubled."
feats.ancestry.electrical-shielding.description: You gain electricity resistance equal to half your level. You also gain the Redirect Current reaction.
feats.ancestry.spectra-transmission.description: "Single action. Frequency: once per hour. Choose an unsecured technological device within 100 feet. For 1 minute, you can transmit what you say through that device, as audio, text or both (for example from an intercom or as text on a vidscreen), instead of aloud. Switching to another output device takes a single action and doesn't extend the duration."
feats.ancestry.tech-caster.description: You gain _delete_ and _supercharge weapon_ as 1st-rank divine innate spells, each castable once per day.
feats.ancestry.cosmic-traveler.description: While you're in hyperspace, you gain the cosmic trait and don't need to eat or drink. While you're in hyperspace or a vacuum, you gain a fly Speed equal to your land Speed.
feats.ancestry.remote-access.description: You can communicate wirelessly with technological devices within 10 feet, attempting Computers checks on them without a user interface or hacking toolkit. If you can already attempt Computers checks at range, that range increases by 10 feet.
feats.ancestry.revitalized-by-hyperspace.description: If you rest for 10 minutes in hyperspace, you gain Hit Points equal to your Constitution modifier times your level, cumulative with Treat Wounds. Once per hour you can instead meditate on your connection to hyperspace, a 10-minute activity with the concentrate and exploration traits; you're treated as having rested for 10 minutes in hyperspace, but the Hit Points regained from this feat are halved.
feats.ancestry.hyperspace-blink.description: "Reaction. Frequency: once per minute. Trigger: an enemy's Strike would hit you, and you weren't already concealed, hidden or undetected to that enemy. You slip into hyperspace and become concealed against the triggering Strike; if the flat check fails, the Strike misses. After it resolves, you reemerge in an unoccupied space adjacent to your original square."
feats.ancestry.encode-presence.description: "Two actions. Frequency: once per hour. You become concealed to all technological visual sensors, such as security cameras, ocular cybernetic augmentations and the visual processors of technological constructs, for 1 minute. Your location stays obvious, so you can't use this concealment to Hide or Sneak."
feats.ancestry.frequent-hyperspace-traveler.description: The frequency of Hyperspace Hop becomes once per hour.
feats.ancestry.scramble-tech.description: You can cast _discharge_ twice per day as a 3rd-rank divine innate spell.
feats.ancestry.hyperspace-strike.description: |-
  Single action. Frequency: once every 10 minutes. Requirement: your last action was a melee Strike that critically hit a creature. You launch that creature into hyperspace and reposition it, teleporting it up to 20 feet from where it started to a location of your choice in your line of sight (doubled if you're in hyperspace). The destination must be unoccupied and fit the creature. The creature attempts a Will save.

  **Critical Success** The creature is unaffected.

  **Success** The teleport distance is halved, and the creature can't be moved somewhere hazardous or that would cause a fall.

  **Failure** You teleport the creature up to the stated distance.

  **Critical Failure** As failure, but the distance is doubled.
feats.ancestry.spectra-ascendant.description: You cease aging. You gain darkvision, the cosmic trait, and a fly Speed equal to your land Speed (double your land Speed while in hyperspace). You also gain the Cosmic Blast action.
