ancestries.android.name: Android
ancestries.android.description: 'Synthetic people with organic-seeming bodies and true souls. 8 Hit Points, Medium, 25 feet. Boosts: Dexterity, Intelligence, free; flaw: Charisma. Low-light vision. Constructed: +1 circumstance bonus to saves against diseases, poisons and radiation, and you always have basic environmental protections. One more language.'
