weapons.ysoki-jaws.name: Jaws
weapons.ysoki-jaws.description: 'Your prominent incisors: 1d4 piercing, brawling group, agile and finesse.'
heritages.desert-world-kasatha.name: Desert World Kasatha
heritages.desert-world-kasatha.description: "You gain the Quick Jump feat, and sand isn't uneven ground for you."
heritages.dying-world-survivalist.name: Dying World Survivalist
heritages.dying-world-survivalist.description: 'You can Hustle twice as long while exploring, and a group you Hustle with can Hustle 10 more minutes (20 from 13th level). You gain the Feather Step feat.'
heritages.shipborn-kasatha.name: Shipborn Kasatha
heritages.shipborn-kasatha.description: A success on a saving throw against an emotion effect is a critical success.
heritages.stellar-nomad-kasatha.name: Stellar Nomad Kasatha
heritages.stellar-nomad-kasatha.description: "During daily preparations you can learn an edict or anathema of an ancestry, philosophy or faith; while you follow it you're trained in the related Lore until you prepare again (not for prerequisites)."
heritages.coming-of-age-kasatha.name: Coming-of-Age Kasatha
heritages.coming-of-age-kasatha.description: "You're trained in Society and gain the Streetwise feat."
heritages.damaya-lashunta.name: Damaya Lashunta
heritages.damaya-lashunta.description: "An Intelligence boost and a Constitution flaw (your free ancestry boost can't be Intelligence). You're trained in Diplomacy and gain the Additional Lore feat."
heritages.korasha-lashunta.name: Korasha Lashunta
heritages.korasha-lashunta.description: "A Strength boost and a Wisdom flaw (your free ancestry boost can't be Strength). 8 Hit Points from your ancestry instead of 6, and a +1 circumstance bonus to Athletics checks to Shove or Trip."
heritages.unbound-lashunta.name: Unbound Lashunta
heritages.unbound-lashunta.description: You gain the Unbound Mind reaction.
heritages.hunter-stalker-pahtra.name: Hunter-Stalker Pahtra
heritages.hunter-stalker-pahtra.description: 'In a natural, undeveloped environment, a +2 circumstance bonus to Stealth checks to Hide and Sneak, Survival checks to Subsist, and your Survival DC to Cover Tracks.'
heritages.chosen-pahtra.name: Chosen Pahtra
heritages.chosen-pahtra.description: 'The first time each day you critically fail a saving throw, you reroll it as a free action (a fortune effect).'
heritages.rime-walker-pahtra.name: Rime Walker Pahtra
heritages.rime-walker-pahtra.description: 'Cold resistance equal to half your level (minimum 1), and environmental cold is one step less extreme for you.'
heritages.sand-roamer.name: Sand Roamer
heritages.sand-roamer.description: "You're Small. You ignore difficult terrain and uneven ground from sand, and gain fire resistance equal to half your level (minimum 1)."
heritages.courtier-shirren.name: Courtier Shirren
heritages.courtier-shirren.description: 'Your limited telepathy carries emotions too, and you gain a +2 circumstance bonus to Sense Motive against a creature communicating with you telepathically.'
heritages.defiant-shirren.name: Defiant Shirren
heritages.defiant-shirren.description: 'A success on a Will save against an effect of a hive-mind creature, its allies, or a creature under a controlling effect is a critical success. You gain the Rebellious Defiance action.'
heritages.iridescent-shirren.name: Iridescent Shirren
heritages.iridescent-shirren.description: 'You can Feint a target within 10 feet, and you gain the Shimmering Dazzle action.'
heritages.castaway-shirren.name: Castaway Shirren
heritages.castaway-shirren.description: 'A bio-cannon ranged unarmed attack: 1d6 acid, range increment 20 feet, corrosive group, from an arm, a shoulder or your mouth.'
heritages.winged-shirren.name: Winged Shirren
heritages.winged-shirren.description: Wings give you a fly Speed of 15 feet.
heritages.everwhelp-skittermander.name: Everwhelp Skittermander
heritages.everwhelp-skittermander.description: 'You keep your stomachmouth: a jaws unarmed attack, 1d6 piercing, brawling group, finesse.'
heritages.subterranean-skittermander.name: Subterranean Skittermander
heritages.subterranean-skittermander.description: You gain darkvision.
heritages.scrabbler-skittermander.name: Scrabbler Skittermander
heritages.scrabbler-skittermander.description: 'Four arms and four legs: a climb Speed equal to your land Speed, climbing with your feet so your arms stay free.'
heritages.skitter-raised.name: Skitter Raised
heritages.skitter-raised.description: "You gain the Group Impression feat and a +2 circumstance bonus to Aid an ally's skill check that doesn't have the attack trait."
heritages.briskwander-vesk.name: Briskwander Vesk
heritages.briskwander-vesk.description: Your Speed increases by 5 feet.
heritages.nightstalker-vesk.name: Nightstalker Vesk
heritages.nightstalker-vesk.description: You gain darkvision.
heritages.plated-vesk.name: Plated Vesk
heritages.plated-vesk.description: "Your scales are medium plate armor: +3 item bonus to AC (+4 from 5th level), Dex cap +1, check penalty –2, Strength +3, comfort and exposed. You can wear a flight suit but no other armor, and can't install armor upgrades in the scales."
heritages.venomthought-vesk.name: Venomthought Vesk
heritages.venomthought-vesk.description: 'You can cast daze as an occult innate cantrip at will, and gain a +1 circumstance bonus to Occultism checks to Recall Knowledge about psychic traditions.'
heritages.warblood-vesk.name: Warblood Vesk
heritages.warblood-vesk.description: You gain the Brutal Anatomy ancestry feat twice.
heritages.scrapper-ysoki.name: Scrapper Ysoki
heritages.scrapper-ysoki.description: "You're trained in Crafting and can use it instead of Thievery to Disable a Device; if you were already trained in Crafting, you gain Quick Repair instead."
heritages.deep-ysoki.name: Deep Ysoki
heritages.deep-ysoki.description: You gain darkvision.
heritages.longsnout-ysoki.name: Longsnout Ysoki
heritages.longsnout-ysoki.description: 'Imprecise scent, 30 feet, and a +2 circumstance bonus to Seek a creature or object within its range.'
heritages.shipborn-ysoki.name: Shipborn Ysoki
heritages.shipborn-ysoki.description: "You're trained in Piloting, and a success to Navigate or Plot Course is a critical success. +1 circumstance bonus to Tumble Through Medium or larger enemies, whose spaces aren't difficult terrain for you."
heritages.tunnel-ysoki.name: Tunnel Ysoki
heritages.tunnel-ysoki.description: "You gain Quick Squeeze even if you aren't trained in Acrobatics, and tight spaces that don't need Squeeze aren't difficult terrain."
heritages.artificial-scion-android.name: Artificial Scion Android
heritages.artificial-scion-android.description: "You're trained in Computers and gain the Phreaker feat."
heritages.mod-fanatic-android.name: Mod Fanatic Android
heritages.mod-fanatic-android.description: 'Your body has one armor upgrade slot of its own, which starts with a common armor upgrade of 1st level or lower for free.'
heritages.networked-android.name: Networked Android
heritages.networked-android.description: 'Shortwave communication with creatures within 30 feet that have shortwave or are tech constructs. You can Hack, Combat Hack, make a Digital Diversion, Disable a Device or Pick a Lock without a toolkit or free hand at 30 feet.'
heritages.renewed-android.name: Renewed Android
heritages.renewed-android.description: "The first time each day you lose the dying condition, you don't gain wounded. You're trained in a skill of your choice with the Recall Knowledge action and gain Dubious Knowledge."
heritages.renewed-android.choices.skill.prompt: Skill to train
heritages.dreamer-barathu.name: Dreamer Barathu
heritages.dreamer-barathu.description: 'Choose an occult cantrip: you can cast it as an occult innate spell at will. Once a day, a 10-minute concentrate activity changes the cantrip.'
heritages.dreamer-barathu.choices.cantrip.prompt: Occult cantrip
heritages.early-stage-barathu.name: Early Stage Barathu
heritages.early-stage-barathu.description: "You're Small, gain Quick Squeeze, and resist precision damage equal to half your level (minimum 1)."
heritages.manufacturer-barathu.name: Manufacturer Barathu
heritages.manufacturer-barathu.description: "You're trained in Crafting and gain the Serum Crafting feat."
heritages.merged-barathu.name: Merged Barathu
heritages.merged-barathu.description: "You're Large, gain 10 Hit Points from your ancestry instead of 8, and a +1 circumstance bonus to saves against emotion effects."
heritages.lost-planet-survivor-human.name: Lost Planet Survivor Human
heritages.lost-planet-survivor-human.description: "You're trained in a Lore of the lost planet your ancestors lived on (a Lore of your choice) and learn one more language. For proficiency, you treat one archaic weapon as a category simpler."
heritages.skilled-human.name: Skilled Human
heritages.skilled-human.description: 'You become trained in one skill of your choice, and an expert in it at 5th level.'
heritages.skilled-human.choices.skill.prompt: Skill to train (expert at 5th level)
heritages.urbanite-human.name: Urbanite Human
heritages.urbanite-human.description: "You ignore difficult terrain and lesser cover from crowds, and you're trained in a Lore of one city of your choice."
heritages.versatile-human.name: Versatile Human
heritages.versatile-human.description: You gain a general feat of your choice that you meet the prerequisites for.
heritages.versatile-human.choices.feat.prompt: General feat
heritages.borai.name: Borai
heritages.borai.description: "You're living and undead at once: the borai and undead traits, but vitality heals you and void damage harms you, and you can be stabilized, healed and revived as a living creature. Low-light vision, or darkvision if your ancestry has low-light vision. Borai feats are open to you as ancestry feats."
heritages.prismeni.name: Prismeni
heritages.prismeni.description: 'You carry a fragment of hyperspace: the prismeni trait. In hyperspace you pinpoint related technology within 100 miles; you can let a starship you pilot enter or leave hyperspace without an engine for it (1 minute), and a critical failure to Navigate or Plot Course there is a failure. Low-light vision, or darkvision if your ancestry has low-light vision. Prismeni feats are open to you as ancestry feats.'
weapons.bio-cannon.name: Bio-cannon
weapons.bio-cannon.description: 'A ranged unarmed attack: 1d6 acid, range increment 20 feet, corrosive group.'
weapons.stomachmouth-jaws.name: Stomachmouth jaws
weapons.stomachmouth-jaws.description: 'Jaws unarmed attack: 1d6 piercing, brawling group, finesse.'
armor.vesk-scales.name: Plated scales
armor.vesk-scales.description: 'Your scales: medium plate armor, +3 item bonus to AC (+4 from 5th level), Dex cap +1, check penalty –2, Strength +3, comfort and exposed.'
