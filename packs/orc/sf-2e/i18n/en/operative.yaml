classes.operative.name: Operative
classes.operative.description: "A sharpshooter and specialist who Aims at a mark for precise, devastating shots. Key attribute: Dexterity. 8 Hit Points plus Constitution per level. Expert in Perception, Reflex, Will, and simple and martial guns; trained in Fortitude, advanced guns, simple and martial weapons, unarmed attacks, light armor, unarmored defense and the operative class DC. Trained in your specialization's skill and 3 more skills plus Intelligence."
classes.operative.choices.class-feat.prompt: 'Operative feat (level {slot})'
classes.operative.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.operative.choices.skills.prompt: Trained skills (3 plus Intelligence)
classes.operative.choices.specialization.prompt: "Operative's specialization"
classes.operative.choices.specialized-skill-set.prompt: "Specialized skill set: a skill feat for your specialization's skill (level {slot})"
feats.operative.elusive-target.description: 'Reaction. Trigger: a Strike targeting you fails. You Step.'
feats.operative.instinctive-aim.description: Single action. You Interact to draw a ranged weapon or Switch Hands, then Aim with that weapon.
feats.operative.keep-them-in-your-sights.description: When you Aim, the benefits apply if your mark is within the first or second range increment of your weapon, not only the first.
feats.operative.mobile-aim.description: Single action. You Stride, then Aim with a gun you're wielding.
feats.operative.scope-sight.description: Whenever you Aim, you can Interact to Activate a sight weapon upgrade.
feats.operative.tactical-advance.description: "Single action. Requirement: you aren't encumbered. Stride up to your Speed. This movement doesn't trigger reactions."
feats.operative.weakening-shot.description: "Two actions. Requirement: you're wielding a gun. You Aim, then make a ranged Strike against your mark. On a hit, the target becomes your choice of clumsy 1 or enfeebled 1 until the end of your next turn (clumsy 2 or enfeebled 2 on a critical hit)."
feats.operative.danger-awareness.description: You gain a +1 circumstance bonus to Perception checks to find traps and hidden, undetected or unnoticed creatures, to AC against attacks from traps and from such creatures, and to saves against traps. Even if you aren't Searching, you get a check to find traps that normally require Searching, though you must still meet any other requirements to find the trap. If your initiative result ties with an opponent's, you always go first.
feats.operative.defensive-gunner.description: Guns you wield gain the parry trait. If a weapon already has the parry trait, the circumstance bonus to AC it grants when you parry with it increases from +1 to +2.
feats.operative.double-tap.description: "Two actions. Requirement: you're wielding a gun. You Aim, then make two Strikes against your mark, applying the multiple attack penalty normally. If both hit, combine their damage. You add any precision damage only once, to the attack of your choice, and apply the target's resistances and weaknesses only once."
feats.operative.kill-steal.description: |-
  Reaction. Trigger: an ally ends their turn after hitting a creature two or more times or critically hitting it. Requirement: you're wielding a gun. You Aim at the creature your ally hit, then make a ranged Strike against it.

  Creatures that fail or critically fail the save against an Area Fire or Auto-Fire action count as "hit" for reactions such as this one.
feats.operative.peek.description: Single action. Make a ranged Strike, then Take Cover.
feats.operative.swift-reposition.description: "Reaction. Trigger: you're about to roll a Reflex save but haven't rolled yet. You Step or Leap and gain a +2 circumstance bonus to the Reflex save. You must still roll the save even if this moves you out of range of the triggering effect."
feats.operative.bloody-wounds.description: When you critically hit your mark, you deal persistent bleed damage to it equal to your number of Aim damage dice.
feats.operative.devastating-aim.description: When you Aim, the precision damage dice increase from d4s to d6s.
feats.operative.hampering-shot.description: "Two actions. Requirement: you're wielding a gun. You Aim, then make a ranged Strike against your mark. On a hit, the creature becomes off-guard until the end of your next turn."
feats.operative.stop-them-in-their-tracks.description: Single action. You Demoralize your mark. The check doesn't take the -4 circumstance penalty for not sharing a language with the target. On a critical success, the mark is also immobilized for 1 round.
feats.operative.switch-target.description: "Free action. Trigger: the creature you've currently Aimed at gains the dying or unconscious condition. Requirement: you're wielding a gun. You Aim at a different creature."
feats.operative.twin-draw.description: 'Single action. Requirement: you have two free hands. Draw up to two one-handed weapons and Aim.'
feats.operative.destructive-dash.description: "Two actions. Requirement: you're in an environment with suitable material to tear up, such as an urban one. Stride up to your Speed. The squares you move through become difficult terrain. A creature within reach of an affected square can Interact to clear it, removing the difficult terrain you created there."
feats.operative.disarming-shot.description: "Two actions. Requirement: you're wielding a gun. You Aim, then make a ranged Strike against your mark. On a hit, you attempt to Disarm the target using the same attack roll against its Reflex DC instead of an Athletics check. This counts as two attacks for your multiple attack penalty, but the penalty doesn't increase until after you use it."
feats.operative.hair-trigger.description: "Reaction. Trigger: the last creature you Aimed at since the start of your last turn uses a manipulate or move action, makes a ranged attack, or leaves a square during a move action. Requirement: you're wielding a gun. You make a ranged Strike against the triggering creature. This Strike doesn't count toward your multiple attack penalty, and that penalty doesn't apply to it."
feats.operative.kick-it-into-overdrive.description: |-
  Free action. Frequency: once per hour. Trigger: your turn begins. You become quickened until the end of your turn, and you can use the extra action only to Stride.

  Alternatively, you become quickened until the end of your next turn (still only to Stride), but at the end of that duration you become fatigued for 2 rounds.
feats.operative.skirmish-strike.description: Single action. Either Step and then Strike, or Strike and then Step.
feats.operative.tactical-swap.description: 'Single action. Frequency: once per round. Requirement: your last ranged Strike this turn missed, or hit and failed to damage the target. You Switch Hands or Interact to swap your current weapon for another, then Strike the same target with the newly drawn weapon.'
feats.operative.unhindered-advance.description: When you use Tactical Advance, you ignore difficult terrain and greater difficult terrain.
feats.operative.opening-volley.description: "Single action. Requirement: you're wielding a gun and a melee weapon. Make a ranged Strike with the gun. If it succeeds, your next melee attack this round against the same target gains a +2 circumstance bonus to the attack roll."
feats.operative.parkour.description: Single action. Stride and Long Jump or High Jump, in any order. You must start on a horizontal surface. During this movement you ignore difficult terrain and can run up vertical surfaces at your full Speed. If you end the Stride off the ground, you fall after your next action or when your turn ends, whichever comes first (you can Grab an Edge, if applicable).
feats.operative.toppling-shot.description: "Two actions. Requirement: you're wielding a gun. You Aim, then make a ranged Strike against your mark. On a hit, the target is knocked back 5 feet. If this forced movement makes it collide with a creature or object, both the target and that creature (if any) take bludgeoning damage equal to your Aim damage. On a critical hit, the target is also knocked prone."
feats.operative.twin-shooter.description: While you're wielding two simple guns, both gain the agile trait.
feats.operative.impeding-shot.description: "Two actions. Requirement: you're wielding a gun. You Aim, then make a ranged Strike against your mark. On a hit, the target is slowed 1 until the end of its next turn. If it's flying, it also falls 10 feet."
feats.operative.muzzle-flash.description: "Two actions. Requirement: you're wielding a gun. You Aim, then make a ranged Strike against your mark. On a hit, the creature becomes dazzled until the end of your next turn if it's within your first range increment."
feats.operative.opportune-retort.description: 'Reaction. Trigger: a creature critically fails a melee attack roll against you. Make a ranged Strike against the triggering creature.'
feats.operative.practiced-escape.description: 'Reaction. Trigger: a creature grabs, immobilizes or restrains you. You attempt to Escape. If you succeed or critically succeed, you can also Stand or Step.'
feats.operative.sprint.description: Two actions or three actions. Stride up to four times. If you spend 3 actions, you can instead Stride up to six times.
feats.operative.dual-aim.description: You can have two marks at a time instead of one. When you Aim, you can select two marks.
feats.operative.grazing-shot.description: |-
  Two actions. Requirement: you have a mark. Make a ranged Strike with your gun against your mark, with this added failure effect.

  **Failure** The attack deals minimum damage (calculated as if every die you would roll shows a 1).
feats.operative.line-em-up.description: "Two actions. Requirement: you're wielding a gun. Make a ranged Strike with your gun against a target within your first range increment, applying the attack against every creature in a straight line between you and the target. It ignores any lesser cover the targets give one another. Roll damage once and apply it to each creature you hit. This counts as two attacks for your multiple attack penalty."
feats.operative.overwhelming-shot.description: "Two actions. You Aim, then make a Strike against your mark. Choose one damage type: acid, bludgeoning, cold, electricity, fire, mental, piercing, poison, slashing or sonic. The shot ignores an amount of the target's resistance to that type equal to your level. If the target has a weakness to that type, it increases by half your level. Immunities are unaffected."
feats.operative.running-shot.description: "Two actions. Requirement: you're wielding a gun. Aim, then Stride up to your Speed. At any point during the movement, you can make a ranged Strike with the gun you're wielding."
feats.operative.360-no-scope.description: "Two actions. Requirement: you're wielding a gun. You Parkour. During that movement, including while falling, you can Aim and then make a ranged Strike with the gun you're wielding."
feats.operative.bullet-fever.description: |-
  Reaction. Frequency: once per hour. Trigger: you take damage that would reduce you to 0 Hit Points. Instead of being knocked out, you're reduced to 1 Hit Point, gain temporary Hit Points equal to half your level for 1 minute, increase your wounded value by 1, and enter a frenzy for 1 minute. You can't end the frenzy voluntarily. While in it:

  - You automatically apply precision damage to all targets as though you were Aiming.
  - You take a -1 circumstance penalty to AC.
  - You take a -1 circumstance penalty to Will saves.
  - You can't take actions without the attack or move trait, except to Reload your weapons.

  When the frenzy ends, you lose any remaining temporary Hit Points from Bullet Fever.
feats.operative.clustered-shots.description: "Two actions. Requirement: you're wielding a gun with at least 3 expend worth of ammunition. You Aim, make a ranged Strike against your mark, and subtract three times the weapon's expend from its magazine. Roll the attack twice and use the better result. The attack ignores circumstance penalties to the attack roll and any flat check required because the target is concealed or hidden."
feats.operative.fish-in-a-barrel.description: Two actions. You Aim, then make a ranged Strike against a prone or immobilized creature that isn't benefiting from cover. Treat a success as a critical success. If you roll a critical success, the creature is off-guard and suppressed until the start of your next turn.
feats.operative.follow-up-fire.description: "Free action. Frequency: once per round. Requirement: you're wielding two guns and your last action was a ranged Strike that missed. Make a ranged Strike with the gun you didn't fire. It doesn't take the multiple attack penalty from the prior attack but counts toward future multiple attack penalties."
feats.operative.burst-fire.description: If you make your second Strike from Double Tap with the same gun, Double Tap counts as one attack for your multiple attack penalty, and you apply your precision damage from Aim to both Strikes.
feats.operative.cloaking-field.description: "Two actions. Frequency: once per hour. You become invisible for 10 minutes, which makes you undetected to all creatures, though they can attempt to find you, making you hidden instead. If you use a hostile action, the effect ends once that action is completed. While it's active, security cameras, sentries and other surveillance don't detect you unless they have special senses that see through invisibility."
feats.operative.explosive-deflection.description: "Reaction. Trigger: you're in the area of a grenade explosion. Requirement: you're aware of the attack, wielding a gun and not off-guard. You expend ammunition from your gun equal to its usage, as if you'd fired it, and gain a +4 circumstance bonus to your Reflex save against the grenade. Determine whether you succeed before rolling for anyone else in the area. If you succeed, the grenade explodes prematurely in a space of your choice directly between you and the attacker, and you needn't save again if you're in the new explosion area."
feats.operative.extreme-accuracy.description: When you Aim, the benefits apply if your mark is within range up to your weapon's fourth range increment. You also ignore the penalty for attacking your mark up to four range increments away.
feats.operative.bullet-dance.description: "Three actions. Requirement: you're wielding a gun. Stride up to twice. During this movement you can make up to three ranged Strikes, each against a different creature within your first range increment (measured from where you make that attack). Each attack counts toward your multiple attack penalty, but the penalty doesn't increase until you've made all of them."
feats.operative.kill-shot.description: |-
  Two actions or three actions. Requirement: you're wielding a gun. You Aim, then make a ranged Strike against your mark. On a success (not a critical success), you deal maximum damage (calculated as if every die shows its maximum). On a critical success, roll normally, but if the doubled damage would be less than the maximum damage of a normal success, use that maximum instead.

  If you spent 3 actions and critically succeed, you deal maximum damage and double it as normal.
feats.operative.relentless-aim.description: When determining line of effect to a target you've Aimed at, you can choose one solid surface within your weapon's first range increment to ricochet the shot off; determine line of effect from that surface instead of your location. If the creature is undetected, the GM still secretly rolls a flat check to see if you missed, but it's DC 5.
feats.operative.combat-reflexes.description: At the start of each enemy's turn, you gain an additional reaction during that turn that you can use only for an operative reaction.
feats.operative.infinite-aim.description: You can Aim as a free action.
