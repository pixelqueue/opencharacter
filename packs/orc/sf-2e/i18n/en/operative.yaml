# The operative: class, features and feats.
features.operative.sharpshooter.name: Sharpshooter
features.operative.sharpshooter.description: "You gain the Aim action (1 action, concentrate; you're wielding a ranged weapon without the area trait): a creature you're aware of is your mark until your next turn. Your ranged Strikes against it with that weapon, in its first range increment, deal 1d4 more precision damage (2d4 at 5th, 3d4 at 11th, 4d4 at 17th level) and reduce its cover's circumstance bonus to AC by 1 (2 at 11th, 4 at 17th). You have one mark at a time."
features.operative.sharpshooter.actions.aim.name: Aim
features.operative.sharpshooter.actions.aim.participants.target.name: Mark
features.operative.sharpshooter.actions.aim.results.aiming.name: Aiming
features.operative.focused.name: Focused
features.operative.focused.description: A success on a Reflex or Will save against your mark is a critical success.
features.operative.master-gunner.name: Master Gunner
features.operative.master-gunner.description: "Your proficiency with simple and martial guns becomes master, and with advanced guns expert. You gain the critical specialization effects of weapons you're an expert with."
features.operative.urban-operator.name: Urban Operator
features.operative.urban-operator.description: 'You ignore difficult terrain in urban environments, and their greater difficult terrain is only difficult terrain for you.'
features.operative.operatives-edge.name: "Operative's Edge"
features.operative.operatives-edge.description: 'Your Perception proficiency becomes master, and you gain a +2 circumstance bonus to initiative rolls (+3 with Incredible Initiative).'
features.operative.reflex-mastery.name: Reflex Mastery
features.operative.reflex-mastery.description: 'Your Reflex proficiency becomes master, and a success on a Reflex save is a critical success.'
features.operative.weapon-specialization.name: Weapon Specialization
features.operative.weapon-specialization.description: "You deal 2 more damage with weapons and unarmed attacks you're an expert with, 3 if you're a master and 4 if legendary."
features.operative.operative-resilience.name: Operative Resilience
features.operative.operative-resilience.description: Your Fortitude proficiency becomes expert.
features.operative.on-the-move.name: On the Move
features.operative.on-the-move.description: A +5-foot status bonus to your Speed (+10 feet from 16th level).
features.operative.operative-expertise.name: Operative Expertise
features.operative.operative-expertise.description: Your operative class DC proficiency becomes expert.
features.operative.legendary-gunner.name: Legendary Gunner
features.operative.legendary-gunner.description: Your proficiency with simple and martial guns becomes legendary and with advanced guns master; simple and martial weapons and unarmed attacks become expert.
features.operative.light-armor-expertise.name: Light Armor Expertise
features.operative.light-armor-expertise.description: Your proficiency with light armor and unarmored defense becomes expert.
features.operative.critical-aim.name: Critical Aim
features.operative.critical-aim.description: "The first time each round you Aim and hit your mark with a ranged Strike, you add the weapon's critical specialization effect even without a critical hit."
features.operative.greater-weapon-specialization.name: Greater Weapon Specialization
features.operative.greater-weapon-specialization.description: 'Your weapon specialization damage becomes 4 with expert weapons, 6 with master and 8 with legendary.'
features.operative.resolve.name: Resolve
features.operative.resolve.description: 'Your Will proficiency becomes master, and a success on a Will save is a critical success.'
features.operative.tactical-barrage.name: Tactical Barrage
features.operative.tactical-barrage.description: Your multiple attack penalty against your mark is –3 (–2 agile) on your second attack and –6 (–4 agile) on later ones.
features.operative.galaxy-renowned.name: Galaxy Renowned
features.operative.galaxy-renowned.description: 'Your proficiency with advanced guns becomes legendary, and your operative class DC proficiency master.'
features.operative.incredible-senses.name: Incredible Senses
features.operative.incredible-senses.description: Your Perception proficiency becomes legendary.
features.operative.light-armor-mastery.name: Light Armor Mastery
features.operative.light-armor-mastery.description: Your proficiency with light armor and unarmored defense becomes master.
features.operative.exploit.ghost.name: Ghost Exploit
features.operative.exploit.ghost.description: "You can Aim at a target you're undetected by as a free action."
features.operative.enhanced-exploit.ghost.name: Ghost Enhanced Exploit
features.operative.enhanced-exploit.ghost.description: 'You gain the Ghost Tap action: after a successful Strike against a target you were hidden from or undetected by, a Deception check against its Will DC makes you hidden from it (undetected on a critical success).'
classes.operative.choices.specialization.options.ghost.name: Ghost
classes.operative.choices.specialization.options.ghost.choices.skill-feat.prompt: Deception skill feat
features.operative.exploit.infiltrator.name: Infiltrator Exploit
features.operative.exploit.infiltrator.description: "You gain the Sabotage action: a Computers check against a tech creature's Fortitude DC (or a tech item's DC or its holder's Reflex DC) within 15 feet (30, 45, 60 feet as an expert, master, legend) makes it glitching 1 for 2 rounds (1 minute on a critical success)."
features.operative.enhanced-exploit.infiltrator.name: Infiltrator Enhanced Exploit
features.operative.enhanced-exploit.infiltrator.description: 'You can Sabotage as a free action when you critically hit a tech creature, and as a reaction when a tech creature or a creature with a tech weapon critically fails a melee attack against you.'
classes.operative.choices.specialization.options.infiltrator.name: Infiltrator
classes.operative.choices.specialization.options.infiltrator.choices.skill-feat.prompt: Computers skill feat
features.operative.exploit.skirmisher.name: Skirmisher Exploit
features.operative.exploit.skirmisher.description: "Your ranged Strikes with one-handed ranged weapons don't trigger reactions triggered by ranged attacks."
features.operative.enhanced-exploit.skirmisher.name: Skirmisher Enhanced Exploit
features.operative.enhanced-exploit.skirmisher.description: A successful Strike against an adjacent enemy with a one-handed ranged weapon treats its lowest weapon damage die as its maximum (the two lowest from 17th level).
classes.operative.choices.specialization.options.skirmisher.name: Skirmisher
classes.operative.choices.specialization.options.skirmisher.choices.skill-feat.prompt: Acrobatics skill feat
features.operative.exploit.sniper.name: Sniper Exploit
features.operative.exploit.sniper.description: 'You ignore the unwieldy and volley traits of sniper guns you wield, and gain Keep Them in Your Sights or Scope Sight as a bonus feat.'
features.operative.enhanced-exploit.sniper.name: Sniper Enhanced Exploit
features.operative.enhanced-exploit.sniper.description: "Your first failed ranged Strike against your mark with a sniper weapon each turn doesn't count toward your multiple attack penalty, and you can reload a sniper weapon as a free action once per turn."
classes.operative.choices.specialization.options.sniper.name: Sniper
classes.operative.choices.specialization.options.sniper.choices.skill-feat.prompt: Stealth skill feat
classes.operative.choices.specialization.options.sniper.choices.bonus-feat.prompt: Bonus operative feat
features.operative.exploit.striker.name: Striker Exploit
features.operative.exploit.striker.description: "You're an expert with one-handed agile or finesse melee weapons and agile or finesse unarmed attacks instead of martial guns, and their increases go to those and simple guns instead. You can Aim with such a weapon, which counts as a gun for operative feats. You gain the Reactive Step reaction."
features.operative.enhanced-exploit.striker.name: Striker Enhanced Exploit
features.operative.enhanced-exploit.striker.description: 'You gain the Overwhelming Strike free action: when your Strike hits your mark and deals damage, it becomes enfeebled 1, off-guard or suppressed (your choice) until the end of your next turn, then is immune for a turn.'
classes.operative.choices.specialization.options.striker.name: Striker
classes.operative.choices.specialization.options.striker.choices.skill-feat.prompt: Athletics skill feat
