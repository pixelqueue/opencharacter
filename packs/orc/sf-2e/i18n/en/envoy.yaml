# The envoy: class, features and feats.
features.envoy.envoy-directives.name: Envoy Directives
features.envoy.envoy-directives.description: "You issue directives, orders that benefit allies who follow them (auditory or visual), one a round; each lasts until the start of your next turn unless it says otherwise. Spending 2 actions adds its Lead by Example. You gain the Get 'Em! directive: 1 to 2 actions, an enemy within 60 feet you can see; you and your allies gain a +1 status bonus to attack rolls against it until the start of your next turn. Lead by Example: Strike it with a status bonus to damage equal to your Charisma modifier; hit or miss, you and your allies gain a +1 status bonus to damage on later Strikes against it (+1 more at 5th, 10th, 15th and 20th level)."
features.envoy.envoy-directives.actions.get-em.name: "Get 'Em!"
features.envoy.envoy-directives.actions.get-em.params.actions.name: Actions spent (2 to Lead by Example)
features.envoy.envoy-directives.actions.get-em.participants.target.name: Enemy
features.envoy.envoy-directives.actions.get-em.participants.ally.name: Allies
features.envoy.envoy-directives.actions.get-em.steps.weapon.prompt: Weapon to Strike with
effects.get-em.name: "Get 'Em!"
effects.get-em.description: "A +1 status bonus to attack rolls against the envoy's target (and, after Lead by Example, a status bonus to damage on Strikes against it) until the start of the envoy's next turn."
features.envoy.adaptive-talent.name: Adaptive Talent
features.envoy.adaptive-talent.description: "During daily preparations, choose a skill feat you meet the prerequisites for; you have it until you prepare again (not for permanent options' prerequisites). Two feats from 9th level, three from 15th."
features.envoy.adaptive-talent.choices.feats.prompt: "Today's skill feats"
features.envoy.wise-to-the-game.name: Wise to the Game
features.envoy.wise-to-the-game.description: 'A +1 status bonus to your Perception DC against Feint, Lie and Create a Diversion, and to your Will DC against emotion effects.'
features.envoy.improvised-mastery.name: Improvised Mastery
features.envoy.improvised-mastery.description: "Once per day (twice from 11th level), free action before a skill check with a skill you aren't a master in: you're a master in it for that check (legendary, in any skill you aren't legendary in, from 15th level)."
features.envoy.perception-expertise.name: Perception Expertise
features.envoy.perception-expertise.description: Your Perception proficiency becomes expert.
features.envoy.weapon-expertise.name: Weapon Expertise
features.envoy.weapon-expertise.description: "Your proficiency with simple and martial weapons and unarmed attacks becomes expert, and you gain their critical specialization effects against the target of your Get 'Em!."
features.envoy.fortitude-expertise.name: Fortitude Expertise
features.envoy.fortitude-expertise.description: Your Fortitude proficiency becomes expert.
features.envoy.leaders-confidence.name: "Leader's Confidence"
features.envoy.leaders-confidence.description: 'You gain the Steel Yourselves! directive (1 to 2 actions, healing, once per hour): allies within 60 feet can spend an action to Brace for Impact, gaining temporary Hit Points equal to your Charisma modifier + half your level for 1 minute. Lead by Example: you Brace too, and everyone who Braces before your next turn gains a +1 status bonus to saves against damaging effects for 1 minute.'
features.envoy.weapon-specialization.name: Weapon Specialization
features.envoy.weapon-specialization.description: "You deal 2 more damage with weapons and unarmed attacks you're an expert with, 3 if you're a master and 4 if legendary."
features.envoy.envoy-expertise.name: Envoy Expertise
features.envoy.envoy-expertise.description: Your envoy class DC proficiency becomes expert.
features.envoy.hidden-agenda.name: Hidden Agenda
features.envoy.hidden-agenda.description: "A creature's critical success to Sense Motive against you, or to Gather Information or Recall Knowledge about your secrets, is a success; your critical failure on a save against an effect that would read your thoughts or intentions is a failure."
features.envoy.perception-mastery.name: Perception Mastery
features.envoy.perception-mastery.description: Your Perception proficiency becomes master.
features.envoy.resolve.name: Resolve
features.envoy.resolve.description: 'Your Will proficiency becomes master, and a success on a Will save is a critical success.'
features.envoy.savvy-improviser.name: Savvy Improviser
features.envoy.savvy-improviser.description: "You can use Improvised Mastery twice a day, and the first natural 1 each day on a Deception, Diplomacy or Intimidation check doesn't lower your degree of success."
features.envoy.light-armor-expertise.name: Light Armor Expertise
features.envoy.light-armor-expertise.description: Your proficiency with light armor and unarmored defense becomes expert.
features.envoy.tactician.name: Tactician
features.envoy.tactician.description: 'At the end of each of your turns you gain an extra reaction, for an envoy reaction before your next turn.'
features.envoy.weapon-mastery.name: Weapon Mastery
features.envoy.weapon-mastery.description: Your proficiency with simple and martial weapons and unarmed attacks becomes master.
features.envoy.greater-weapon-specialization.name: Greater Weapon Specialization
features.envoy.greater-weapon-specialization.description: 'Your weapon specialization damage becomes 4 with expert weapons, 6 with master and 8 with legendary.'
features.envoy.legendary-improvisation.name: Legendary Improvisation
features.envoy.legendary-improvisation.description: "Improvised Mastery works with any skill you aren't legendary in, and makes you legendary for the check."
features.envoy.reflex-mastery.name: Reflex Mastery
features.envoy.reflex-mastery.description: 'Your Reflex proficiency becomes master, and a success on a Reflex save is a critical success.'
features.envoy.greater-resolve.name: Greater Resolve
features.envoy.greater-resolve.description: 'Your Will proficiency becomes legendary. A success on a Will save is a critical success, a critical failure a failure, and a failed Will save against a damaging effect deals half damage.'
features.envoy.incredible-senses.name: Incredible Senses
features.envoy.incredible-senses.description: Your Perception proficiency becomes legendary.
features.envoy.inscrutable.name: Inscrutable
features.envoy.inscrutable.description: "A creature's success or critical success to Sense Motive against you, or to Gather Information or Recall Knowledge about your secrets, is a failure; your failure or critical failure on a save against an effect that would read your thoughts or intentions is a success."
features.envoy.light-armor-mastery.name: Light Armor Mastery
features.envoy.light-armor-mastery.description: Your proficiency with light armor and unarmored defense becomes master.
features.envoy.silver-tongue.name: Silver Tongue
features.envoy.silver-tongue.description: "Your envoy class DC proficiency becomes master. You gain Silver Tongue (free action, fortune, once a day per skill): reroll a Deception, Diplomacy, Intimidation or leadership-skill check you're legendary in and use the better result."
features.envoy.style.from-the-front.name: From the Front
features.envoy.style.from-the-front.description: "You're trained in medium armor (expert with light armor expertise, master with light armor mastery). Directive: Into Position! (1 to 2 actions): name an enemy within 60 feet; allies in its reach can Step as a reaction, allies within 30 feet of you and not adjacent to it can Stride toward it as a reaction. Lead by Example: Strike it, and it takes a –1 circumstance penalty to attacks against others until your next turn."
features.envoy.style.from-the-shadows.name: From the Shadows
features.envoy.style.from-the-shadows.description: "You gain Assurance (Stealth). Directive: Coordinate Ambush (1 to 2 actions): name an enemy and an ally within 60 feet; if the ally is hidden, undetected or unnoticed by it at the start of their turn, it's off-guard to them until the end of their turn. Lead by Example: Hide or Sneak, and you can Strike the enemy as a reaction the first time the ally attacks it before your next turn."
features.envoy.style.guns-blazing.name: Guns Blazing
features.envoy.style.guns-blazing.description: 'You gain Incredible Initiative. Directive: Ready Arms! (1 to 2 actions): you and allies within 30 feet can draw, Switch Hands or swap weapons as a free action. Lead by Example: Strike, Area Fire or Auto-Fire with a weapon you drew or swapped to; if it hits (or a target fails its save), one ally can Strike that target as a reaction.'
features.envoy.style.in-the-spotlight.name: In the Spotlight
features.envoy.style.in-the-spotlight.description: "You gain Impressive Performance. Directive: Dance Partner! (1 to 2 actions): you and an ally within 10 feet each Stride or Step (the ally as a reaction, ending no farther from you). Lead by Example: enemies within your ally's reach are off-guard to your Strikes and vice versa, and your ally is concealed against ranged Strikes from within 10 feet, until your next turn."
features.envoy.style.infosphere-director.name: Infosphere Director
features.envoy.style.infosphere-director.description: 'You gain Digital Diversion. Directive: Digital Assessment! (1 to 2 actions): Recall Knowledge about a creature within 100 feet; identifying it also reveals a resistance or immunity. Lead by Example: Strike it; you and your allies gain a +1 circumstance bonus to AC against it until your next turn, and a tech target fails a Fortitude save against your class DC to become glitching 1 (then immune for an hour).'
features.envoy.style.through-desperate-times.name: Through Desperate Times
features.envoy.style.through-desperate-times.description: 'You gain Battle Medicine. Directive: Keep on Keeping On! (1 to 2 actions): an ally within 30 feet increases the next healing they receive before your next turn by your Charisma modifier + half your level. Lead by Example: you use Battle Medicine on them, and their immunity to it lasts 10 minutes instead of a day.'
