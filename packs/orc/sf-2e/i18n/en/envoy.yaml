classes.envoy.name: Envoy
classes.envoy.description: 'A leader and talker who issues directives that turn allies into a team. Key attribute: Charisma. 8 Hit Points plus Constitution per level. Expert in Reflex and Will; trained in Perception, Fortitude, simple and martial weapons, unarmed attacks, light armor, unarmored defense and the envoy class DC. Trained in Deception, Diplomacy or Intimidation, your leadership skill, and 6 more skills plus Intelligence. A skill increase at every level from 2nd.'
classes.envoy.choices.class-feat.prompt: 'Envoy feat (level {slot})'
classes.envoy.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.envoy.choices.skills.prompt: Trained skills (6 plus Intelligence)
classes.envoy.choices.class-skill.prompt: 'Deception, Diplomacy or Intimidation'
classes.envoy.choices.leadership-style.prompt: Leadership style
feats.envoy.go-to-ground.description: |-
  Single action to two actions. You and all allies within 60 feet treat any lesser cover as standard cover until the start of your next turn.

  **Lead by Example** If you used two actions, you Take Cover. Allies within 60 feet can Take Cover as a reaction.
feats.envoy.pardon-me.description: You can use Deception instead of Acrobatics to Tumble Through, against the target's Will DC instead of its Reflex DC. When you succeed at Tumbling Through this way, the foe whose space you passed through is suppressed until the end of its next turn.
feats.envoy.quip.description: "Reaction. Trigger: a creature within 30 feet is damaged by an ally's Strike. Attempt to Demoralize the triggering creature."
feats.envoy.size-up.description: |-
  Frequency: once per hour. You spend 1 minute observing a specific individual, 10 minutes researching one on the infosphere, or 1 hour networking and gathering information. That subject becomes your asset. Assessing by observation doesn't require knowing their identity; research or networking does, which takes at least two relevant pieces of information about them (such as name, origin, residence, a relative or partner, employer or affiliation), as the GM determines.

  You gain a +1 circumstance bonus to Deception, Diplomacy, Intimidation and Perception checks against or relating to your asset, and to Recall Knowledge about it.

  When you use 1-action Get 'Em! on an asset, you gain the benefits of the 2-action version.

  You can maintain a number of assets equal to your Charisma modifier. Sizing up another replaces a previous asset.
feats.envoy.take-em-alive.description: |-
  Single action to two actions. Until the start of your next turn, you and your allies can add the nonlethal trait to weapon attacks (without the normal penalty) and to damaging spells that lack the death or void trait.

  **Lead by Example** If you used two actions, Strike a target with a nonlethal attack. On a success, you gain a status bonus to damage equal to your Charisma modifier. On a critical success, an ally within 30 feet can also Strike the target as a reaction with a nonlethal attack.
feats.envoy.watch-out.description: 'Reaction. Trigger: a creature targets an ally within 60 feet with an attack, and you can see both the attacker and the ally. The ally gains a +2 circumstance bonus to AC against the triggering attack.'
feats.envoy.acquire-asset.description: Single action. Make a melee or ranged Strike against a creature that isn't your asset. On a hit, the target becomes your asset as if you'd used Size Up. On a critical hit, you can also immediately attempt a check to Recall Knowledge about it.
feats.envoy.change-of-plans.description: "Reaction. Trigger: the target of your Get 'Em! is reduced to 0 Hit Points. Requirement: you used Get 'Em! against a creature on your last turn. You use Get 'Em! against a new target, following the normal targeting restrictions. You don't count as leading by example against this new target."
feats.envoy.dont-you-die-on-me.description: Single action. Choose an adjacent dying ally and reduce their dying value by 1. If this reduces it to 0, they lose the dying condition, don't increase their wounded condition, and remain unconscious. The ally is then temporarily immune to Don't You Die on Me for 1 hour.
feats.envoy.get-in-there.description: |-
  Single action to two actions. Until the start of your next turn, you and your allies within 100 feet who can sense you gain a +5-foot status bonus to Speed, increasing by 5 feet at 7th, 12th and 17th level.

  **Lead by Example** If you used two actions, you Step or Stride. Each ally within 100 feet who can sense you can immediately Step or Stride up to half their Speed (rounded down to a multiple of 5 feet) as a reaction.
feats.envoy.search-high-and-low.description: |-
  Single action to two actions. Until the start of your next turn, you and your allies gain a +2 circumstance bonus to Perception checks to Seek, increasing to +3 at 7th level, +4 at 12th and +5 at 17th.

  **Lead by Example** If you used two actions, you Seek. Each ally within 100 feet who can sense you can also immediately Seek as a reaction.
feats.envoy.diverse-schemes.description: You can maintain twice your Charisma modifier in assets.
feats.envoy.influence.description: "Reaction. Frequency: once per day. Trigger: you're about to roll a Deception, Diplomacy or Intimidation check. Roll the check twice and use the higher result."
feats.envoy.not-in-the-face.description: |-
  Reaction. Trigger: a creature targets you with a melee attack. Attempt a Deception check against the triggering creature's Will DC. It's then immune to Not in the Face for 1 hour.

  **Critical Success** The attacker is thrown off, taking a -2 status penalty to attack and damage rolls against you until the start of its next turn.

  **Success** The attacker takes a -1 status penalty to attack rolls against you until the start of its next turn.

  **Failure** The attacker takes a -1 status penalty to the triggering attack roll.

  **Critical Failure** The attacker is unaffected.
feats.envoy.saw-it-coming.description: "Free action. Trigger: you're about to roll initiative. You gain a +1 circumstance bonus to the initiative roll, and you can immediately Interact to draw a weapon, Step or Stride."
feats.envoy.dirty-retort.description: 'Reaction. Trigger: a creature misses you with a melee Strike. The triggering creature becomes your choice of clumsy 1 or enfeebled 1 until the end of its next turn.'
feats.envoy.distant-feint.description: If you're wielding a ranged weapon, you can Feint against an opponent up to 100 feet away, not only within melee reach. On a success, the opponent is off-guard against your melee and ranged attacks, not only your melee attacks.
feats.envoy.hang-in-there.description: |-
  Single action. Choose yourself or an ally within 30 feet and attempt a DC 20 Diplomacy check. With master proficiency in Diplomacy, you can instead attempt a DC 30 check to increase the temporary Hit Points gained on a success by 5; with legendary proficiency, a DC 40 check to increase them by 10. The temporary Hit Points last 1 minute. The target is then immune to Hang in There for 1 day.

  **Critical Success** The target gains temporary Hit Points equal to double their level plus your Charisma modifier.

  **Success** The target gains temporary Hit Points equal to their level plus your Charisma modifier.

  **Failure** The target is unaffected, and you can't use Hang in There again for 1 minute.

  **Critical Failure** The target is unaffected, and you can't use Hang in There again for 1 hour.
feats.envoy.hurry.description: Single action. One ally within 30 feet who can sense you becomes quickened for 1 round and can use the extra action to Interact, Step or Stride. The ally is then immune to Hurry for 10 minutes.
feats.envoy.cheer-up.description: 'Single action. An adjacent ally reduces the value of one of these conditions of their choice by 2: clumsy, enfeebled, frightened, sickened, stupefied. The ally is then immune to Cheer Up for 1 day.'
feats.envoy.confounding-disquisition.description: |-
  Two actions. Attempt a Deception or Diplomacy check against the Will DC of a creature within 30 feet. It's then immune to Confounding Disquisition for 1 day.

  **Critical Success** The target is stunned 1 and stupefied 1 for 1 round.

  **Success** The target is stupefied 1 for 1 round.

  **Failure** The target takes a -1 status penalty to Perception checks and Will saves for 1 round.

  **Critical Failure** The target is unaffected.
feats.envoy.look-alive.description: |-
  You can use Watch Out also when an ally in range is about to attempt a Reflex save; if you do, the circumstance bonus applies to their Reflex save against the triggering effect.

  When you use Watch Out and the triggering attack fails or critically fails, or the ally succeeds or critically succeeds at the save, the ally can also Stride up to 10 feet as a free action.
feats.envoy.sidestep.description: "Reaction. Trigger: the attack roll for a Strike targeting you fails. You redirect the attack to a creature of your choice adjacent to you and within the attack's range or reach. The attacker rerolls the attack roll against the new target."
feats.envoy.cut-em-deep.description: |-
  When you roll a failure on a Demoralize action, you get a success instead. You can still critically fail.

  When you successfully Demoralize the target of your Get 'Em!, it doesn't become immune to your further attempts to Demoralize it.
feats.envoy.got-em.description: "Free action. Frequency: once per round. Trigger: an ally's Strike hits the target of your Get 'Em! The ally gains a status bonus to damage equal to your Charisma modifier."
feats.envoy.smooth-diversions.description: |-
  When you succeed at Creating a Diversion, you can immediately Sneak or Step as a free action.

  Creatures become aware you were trying to trick them only if you critically fail to Create a Diversion; otherwise they assume it was part of your regular bravado.
feats.envoy.tag-team.description: "Reaction. Trigger: the target of your Get 'Em! is critically hit by an ally's attack, or critically fails a Reflex save against an ally's attack or spell. Make a Strike against the triggering creature; a ranged Strike must be within your weapon's first range increment. This Strike doesn't count toward your multiple attack penalty, and that penalty doesn't apply to it."
feats.envoy.secondary-directive.description: "Single action. Requirement: your last action this turn was issuing a 2-action directive. Make a Strike. On a hit, the target is affected by a 1-action Get 'Em!"
feats.envoy.situational-awareness.description: Two actions. You Ready a directive. If the trigger you designated occurs before the start of your next turn, you can use the 2-action version of the directive instead of the 1-action version.
feats.envoy.thatll-show-em.description: The first time each round you use your Watch Out reaction, you can make a melee or ranged Strike against the triggering creature. This Strike doesn't count toward your multiple attack penalty, and that penalty doesn't apply to it. If you hit, the target is suppressed until the start of its next turn.
feats.envoy.unstoppable-directives.description: When you use a directive that grants temporary Hit Points, they increase by your level. When you use a directive that doesn't grant temporary Hit Points, you can grant one ally affected by it temporary Hit Points equal to half your level. These last 1 minute.
feats.envoy.down-to-the-wire.description: 'Reaction. Trigger: the final action on your turn is a 1-action directive. Resolve the directive you just issued as though it were the 2-action version.'
feats.envoy.master-plan.description: During your daily preparations, you can review stratagems with up to five allies. Later, you can quickly advise each of them using the reaction below.
feats.envoy.ready-to-roll.description: 'Free action. Trigger: you roll initiative. Issue a 1-action directive.'
feats.envoy.you-can-do-it.description: "Single action. Requirement: your last action was a 1-action directive. An ally within 60 feet can immediately, as a free action, perform the lead by example actions of that directive, gaining its benefits and using its abilities as if you'd issued it with two actions. Use your Charisma modifier instead of the ally's for relevant benefits, such as the status bonus to damage from Get 'Em!"
feats.envoy.effortless-influencer.description: You gain the Assurance skill feat three times, for Deception, Diplomacy and Intimidation. When you succeed at a Deception, Diplomacy or Intimidation check, allies within 60 feet who witnessed it gain a +1 status bonus to the next check they attempt with that skill within 1 minute (+2 if your check was a critical success).
feats.envoy.extend-directive.description: 'Free action. Trigger: your turn begins, and you issued a 2-action directive on your last turn. You immediately issue the 1-action version of that directive.'
feats.envoy.get-them.description: When you use Get 'Em!, you can choose any number of enemies within range instead of a single target (if you spent 2 actions, you still Strike only one target).
feats.envoy.fast-synergy.description: Each ally who starts their turn within 100 feet of you and can perceive you gains a second reaction, usable only for directives you issue.
feats.envoy.improvised-legend.description: Free action. You can use Improvised Mastery once per hour instead of twice per day.
feats.envoy.endlessly-adaptive.description: When you gain skill feats with adaptive talent, you gain two additional skill feats. You can also spend 10 minutes planning to reselect the feats chosen with adaptive talent, as if you'd made your daily preparations. You can't trade out feats with limited-use abilities you've already used that day.
feats.envoy.true-leader.description: Once per turn, you can issue a 1-action envoy directive as a free action. It doesn't count toward your total number of directives issued this turn.
