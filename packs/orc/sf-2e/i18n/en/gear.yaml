consumables.medpatch-commercial.name: Medpatch (Commercial)
consumables.medpatch-commercial.description: You regain 1d6 Hit Points and gain a +1 item bonus to saves against diseases and poisons for 10 minutes.
consumables.medpatch-tactical.name: Medpatch (Tactical)
consumables.medpatch-tactical.description: You regain 3d6+6 Hit Points and gain a +1 item bonus to saves against diseases and poisons for 10 minutes.
consumables.medpatch-advanced.name: Medpatch (Advanced)
consumables.medpatch-advanced.description: You regain 5d6+12 Hit Points and gain a +2 item bonus to saves against diseases and poisons for 10 minutes.
consumables.medpatch-superior.name: Medpatch (Superior)
consumables.medpatch-superior.description: You regain 7d6+18 Hit Points and gain a +2 item bonus to saves against diseases and poisons for 10 minutes.
consumables.medpatch-elite.name: Medpatch (Elite)
consumables.medpatch-elite.description: You regain 8d6+21 Hit Points and gain a +3 item bonus to saves against diseases and poisons for 10 minutes.
consumables.medpatch-ultimate.name: Medpatch (Ultimate)
consumables.medpatch-ultimate.description: You regain 10d6+27 Hit Points and gain a +4 item bonus to saves against diseases and poisons for 10 minutes.
