gear.archaic-text.description: 'A book of some kind: a religious text, a collection of ancient recipes, a romance novel or vintage mechanical schematics.'
gear.datapad.description: A ubiquitous handheld computer with a comm unit, microphone, speaker, camera, infosphere browser and data storage. It stores thousands of hours of recordings, plays games, and performs simple computing such as time tracking, notifications, word processing, calculations, data processing, media streaming and broadcasting emergency alerts from local governments. Commercial datapads are flimsy and made to wear out; higher-end ones are sturdier and have extra functions.
gear.grenade-launcher-commercial.description: Held in 2 hands. An automatic breechloading launcher with a rotating barrel holding up to six grenades of any variety; smart loading lets the wielder choose a different grenade each shot. It is a martial ranged weapon with reload 2 and range 280 feet.
gear.grenade-launcher-tactical.description: Held in 2 hands. An automatic breechloading launcher with a rotating barrel holding up to six grenades of any variety; smart loading lets the wielder choose a different grenade each shot. It is a martial ranged weapon with reload 2. This grade has the tracking +1 trait, 1 upgrade slot and range 350 feet.
gear.grenade-launcher-superior.description: Held in 2 hands. An automatic breechloading launcher with a rotating barrel holding up to six grenades of any variety; smart loading lets the wielder choose a different grenade each shot. It is a martial ranged weapon with reload 2. This grade has the tracking +2 trait, 2 upgrade slots and range 420 feet.
gear.grenade-launcher-ultimate.description: Held in 2 hands. An automatic breechloading launcher with a rotating barrel holding up to six grenades of any variety; smart loading lets the wielder choose a different grenade each shot. It is a martial ranged weapon with reload 2. This grade has the tracking +3 trait, 3 upgrade slots and range 490 feet.
gear.emergency-beacon.description: Requires a battery to operate. When activated, this small pod-shaped device transmits its location and flashes bright red light once per round, consuming 1 charge per day. Any device that can receive signals can pick it up, and it can be traced with a successful DC 15 Computers or Survival check. Its transmissions reach 100 miles over flat terrain, 50 miles in forests or hills, and 25 miles in mountains or underwater. It can instead be installed in a starship's or vehicle's communications system, using that array's range and consuming 1 charge per hour.
gear.explorers-canteen.description: Held in 2 hands. A thermos with two compartments. The upper one holds nanomachines and filters that make most food and water safe, granting a +1 item bonus to saves against poisons or diseases in the food or water. The lower one converts inserted UPBs into edible nutri-paste at 2 UPBs per day of nourishment.
gear.field-scientists-toolkit-commercial.description: Held in 1 hand. Contains a chemalyzer, microscope, recording tools and specimen bags.
gear.field-scientists-toolkit-tactical.description: Held in 1 hand. Contains a chemalyzer, microscope, recording tools and specimen bags. It grants a +1 item bonus on Recall Knowledge checks using Nature or an appropriate Lore skill.
gear.fire-extinguisher-commercial.description: Held in 1 hand. Sprays foam in a 15-foot cone, automatically putting out non-magical fires and attempting to counteract magical fire effects at 2nd rank with a +7 counteract modifier. Each use expends one chem, from a chem tank of up to the extinguisher's grade (commercial, tactical or advanced).
gear.fire-extinguisher-tactical.description: Held in 1 hand. Sprays foam in a 15-foot cone, automatically putting out non-magical fires. It counteracts magical fire effects at 4th rank with a +14 counteract modifier. Each use expends one chem, from a chem tank of up to the extinguisher's grade (commercial, tactical or advanced).
gear.fire-extinguisher-advanced.description: Held in 1 hand. Sprays foam in a 15-foot cone, automatically putting out non-magical fires. It counteracts magical fire effects at 6th rank with a +19 counteract modifier. Each use expends one chem, from a chem tank of up to the extinguisher's grade (commercial, tactical or advanced).
gear.flashlight-commercial.description: Held in 1 hand. Emits bright light in a 30-foot emanation and dim light in the next 30 feet.
gear.flashlight-tactical.description: Held in 1 hand. Emits bright light in a 60-foot radius and dim light in the next 60 feet. It has filters that block or dim the light, activated with an Interact action.
gear.hacking-toolkit-commercial.description: Held in 1 hand. Required for Computers checks to Hack computers. You can use it to access a computer without a user interface, but this requires physical contact or a link via an infosphere or similar network.
gear.hacking-toolkit-tactical.description: Held in 1 hand. Required for Computers checks to Hack computers. You can use it to access a computer without a user interface, but this requires physical contact or a link via an infosphere or similar network. It adds a +1 item bonus to checks made with it.
gear.hacking-toolkit-advanced.description: Held in 1 hand. Required for Computers checks to Hack computers. You can use it to access a computer without a user interface via physical contact or a link via an infosphere or similar network. It adds a +1 item bonus to checks made with it and lets you access computers at 30 feet, unless you're in a radioactive environment.
gear.holoskin-commercial.description: A holographic projector on a belt or limb strap, activated with an Interact action. It can be programmed to project the appearance of another creature of your size category, hiding your true appearance. It doesn't change your voice, scent or mannerisms, nor the appearance of held and worn items. You usually need a holoskin to set up a disguise to Impersonate someone with Deception.
gear.holoskin-tactical.description: A holographic projector on a belt or limb strap, activated with an Interact action. It can be programmed to project the appearance of another creature of your size category, hiding your true appearance. It doesn't change your voice, scent or mannerisms, nor the appearance of held and worn items. You usually need a holoskin to set up a disguise to Impersonate someone with Deception. It adds a +1 item bonus to relevant checks.
gear.holospark.description: A tiny holoprojector, often disguised as an earring, lapel pin or pendant. It stores a simple visual projection of personal flair, such as a halo or wings, with a short audio clip such as a song snippet or sound effect. It can be programmed with a computer, such as the one in your comm unit.
gear.hygiene-kit.description: Held in 2 hands. Contains the tools and products for good grooming and hygiene. Kits made for specific creatures include supplies (such as scale-care products for vesk or antennae grooming oil for lashuntas or shirrens) that are of less use to others.
gear.autograppler-commercial.description: You attach this anchoring device to a cable line with an Interact action; clamps slide from its base along the cable so it can be climbed like a knotted rope. You can throw it to attach to a solid surface with a ranged attack roll using your simple weapon proficiency against a DC set by the target, typically at least DC 20. The attack has the secret trait. On a success it holds firm; on a critical failure it seems to hold but detaches when you're partway up.
gear.autograppler-tactical.description: You attach this anchoring device to a cable line with an Interact action; clamps slide from its base along the cable so it can be climbed like a knotted rope. You can throw it to attach to a solid surface with a ranged attack roll using your simple weapon proficiency against a DC set by the target, typically at least DC 20. The attack has the secret trait. On a success it holds firm; on a critical failure it seems to hold but detaches when you're partway up. A sensor detects whether it has a firm hold, so it automatically retracts if you critically fail the attack to attach it.
gear.infiltrators-toolkit-commercial.description: Held in 2 hands. Needed to Pick Locks or Disable Devices (of some types) with Thievery.
gear.infiltrators-toolkit-tactical.description: Held in 2 hands. Needed to Pick Locks or Disable Devices (of some types) with Thievery. It adds a +1 item bonus to checks to Pick Locks or Disable Devices.
gear.infinity-deck.description: 'A replica of an ancient artifact: a deck of playing cards used to play countless games.'
gear.lock-commercial.description: Picking a commercial lock requires two successful DC 15 Thievery checks. Held in 2 hands.
gear.lock-tactical.description: Picking a tactical lock requires two successful DC 20 Thievery checks. Held in 2 hands.
gear.lock-advanced.description: Picking an advanced lock requires four successful DC 25 Thievery checks. Held in 2 hands.
gear.lock-superior.description: Picking a superior lock requires five successful DC 30 Thievery checks. Held in 2 hands.
gear.lock-elite.description: Picking an elite lock requires six successful DC 40 Thievery checks. Held in 2 hands.
gear.magboots.description: Activated or deactivated with an Interact action. While active, they grant a +1 item bonus to Athletics checks to Climb metal surfaces and a +1 item bonus to your Fortitude or Reflex DC against attempts to Reposition, Shove or Trip you while you stand on a metal surface. In zero gravity, you can move your Speed across metal surfaces and don't gain the untethered condition.
gear.makers-app.description: A comm unit app containing formulas for Crafting the common items in this section.
gear.makers-toolkit-commercial.description: Needed to create items from UPBs with Crafting.
gear.makers-toolkit-tactical.description: Needed to create items from UPBs with Crafting. It gives a +1 item bonus to the check.
gear.medkit-commercial.description: Contains analgesics, bandages, sterile gauze and suturing tools, needed for Medicine checks to Administer First Aid, Treat Disease, Treat Poison or Treat Wounds. A medkit is a toolkit.
gear.medkit-tactical.description: Contains analgesics, bandages, sterile gauze and suturing tools, needed for Medicine checks to Administer First Aid, Treat Disease, Treat Poison or Treat Wounds. It gives a +1 item bonus to such checks. A medkit is a toolkit.
gear.microgoggles.description: Bulky goggles with adjustable magnifying lenses and lights, granting a +2 item bonus to skill checks that benefit from exceedingly close vision, such as spotting complicated forgeries, identifying pathogens in blood samples, or crafting drugs or medicinals.
gear.microphone.description: A cordless handheld device that records and transmits audio, typically to a speaker or computer.
gear.musical-instrument-commercial-handheld.description: Most instruments use modern technology to amplify their sound, provide accompaniment or connect wirelessly to other instruments; some have the tech trait. Handheld instruments include autohorns, guitars, psychoactive wave plates, digital synth decks and holoflutes. The GM might give an especially large handheld instrument greater Bulk.
gear.musical-instrument-tactical-handheld.description: Most instruments use modern technology to amplify their sound, provide accompaniment or connect wirelessly to other instruments; some have the tech trait. Handheld instruments include autohorns, guitars, psychoactive wave plates, digital synth decks and holoflutes. The GM might give an especially large handheld instrument greater Bulk. It gives a +1 item bonus to Performance checks using that instrument.
gear.musical-instrument-commercial-heavy.description: Most instruments use modern technology to amplify their sound, provide accompaniment or connect wirelessly to other instruments; some have the tech trait. Heavy instruments, such as drumdecks and theremins, are less portable and generally must be stationary while played.
gear.musical-instrument-tactical-heavy.description: Most instruments use modern technology to amplify their sound, provide accompaniment or connect wirelessly to other instruments; some have the tech trait. Heavy instruments, such as drumdecks and theremins, are less portable and generally must be stationary while played. It gives a +1 item bonus to Performance checks using that instrument.
gear.cable-line-commercial.description: Industrial cable, typically high-durability plastic coated in metal. This grade is coated in titanium alloy.
gear.cable-line-tactical.description: Industrial cable, typically high-durability plastic coated in metal. This grade is coated in adamantine alloy.
gear.portable-amp.description: A small device synced to an instrument, microphone or datapad audio playback. It amplifies the audio, reducing the DC of Perception checks to hear it by 5.
gear.radiation-sweeper.description: A handheld detector for radiation within 120 feet. When you Interact with it, it pings in different tones for low, medium, high or severe radiation and shows the irradiated areas on a simple screen. It updates automatically as you move until the start of your next turn; then you must Interact again for another sweep. It can't detect radiation through 3 feet of dirt or wood, 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or any force field. It is immune to radiation's effects.
gear.repair-toolkit-commercial.description: Contains delicate tools and supplies for simple repairs while traveling. You can use it to Repair items with Crafting, and can draw and replace a worn one as part of the action that uses it.
gear.repair-toolkit-tactical.description: Contains delicate tools and supplies for simple repairs while traveling. You can use it to Repair items with Crafting, and can draw and replace a worn one as part of the action that uses it. It gives a +1 item bonus to the check.
gear.sunshades-commercial.description: Sunshades that make everyone look cooler.
gear.sunshades-tactical.description: Sunshades that make everyone look cooler. While you wear them, you gain a +1 item bonus to saves against effects that cause the blinded or dazzled condition.
gear.wheelchair.description: Wheelchairs come in sizes and styles for countless alien body types, including hoverchairs. Automated mechanisms let them traverse stairs, ladders and uneven ground without extra difficulty (difficult terrain still affects your Speed).
consumables.hypopen-commercial.description: A tiny cylinder of specialized nanites; each type has different effects. This one removes the fatigued condition or decreases the value of the clumsy or sickened condition by 1.
consumables.hypopen-tactical.description: A tiny cylinder of specialized nanites; each type has different effects. This one produces the effects of a lower-level hypopen or removes the paralyzed condition.
consumables.hypopen-advanced.description: A tiny cylinder of specialized nanites; each type has different effects. This one produces the effects of a lower-level hypopen or lets you attempt a counteract check against one poison or disease afflicting the target, using your Medicine modifier as the counteract modifier and half the hypopen's level (rounded up) as the counteract rank.
consumables.hypopen-superior.description: A tiny cylinder of specialized nanites; each type has different effects. This one produces the effects of a lower-level hypopen or lets you attempt a flat check to end persistent poison or bleed damage, with the DC reduced from 15 to 10.
consumables.hypopen-elite.description: A tiny cylinder of specialized nanites; each type has different effects. This one produces the effects of a lower-level hypopen or makes you quickened for 1 minute; you can use the extra action to Step, Stride or Strike.
consumables.hypopen-ultimate.description: A tiny cylinder of specialized nanites; each type has different effects. This one produces the effects of a lower-level hypopen or gives you fast healing 10 for 1 minute. If you have the drained condition, you instead decrease its value by 1.
consumables.bone-serum.description: A black sludge distilled from elebrian bone matter that tastes like mint. Drinking it gives you void healing for 1 hour.
consumables.celebrity-serum.description: A fizzy pink, mildly intoxicating concoction that grants a +1 item bonus to Performance checks for 1 hour.
consumables.commando-serum.description: A tangy crimson elixir that grants 1d10+5 temporary Hit Points and a +5-foot item bonus to all your Speeds for 1 minute. Your veins protrude and your eyes take a reddish tinge.
gear.camping-kit.description: Contains a weatherproof tent for four Medium or two Large creatures, bedrolls, a fire igniter, 1 week of rations and a survival knife.
consumables.infiltrator-serum.description: An oily serum that grants a +1 item bonus to checks to Sneak and Disable a Device for 10 minutes.
consumables.shimmerstone-serum.description: A blue tincture distilled from shimmerstone. For 10 minutes you gain a +1 item bonus to saves against mental effects and a +2 item bonus to checks to Recall Knowledge.
consumables.sharpshooter-serum-commercial.description: A smoky orange liquid that sharpens your senses. For 5 minutes it reduces the circumstance bonus to AC your targets gain from cover against your ranged Strikes by 1.
consumables.sharpshooter-serum-tactical.description: A smoky orange liquid that sharpens your senses. For 5 minutes it reduces the circumstance bonus to AC your targets gain from cover against your ranged Strikes by 2.
consumables.sprayflesh.description: A canister that sprays neutral biomass into a wound or area of concern (such as a clearly diseased or poisoned part of the body). For 1 hour, or until the creature fully recovers its maximum Hit Points, you can attempt Medicine checks to Treat Wounds on it even if it is temporarily immune to Treat Wounds.
gear.chemalyzer.description: A handheld sampling unit that grants a +1 circumstance bonus to skill checks to identify an unknown drug, medicinal, poison or other chemical substance.
gear.climbing-kit-commercial.description: Includes 50 feet of cable line, a grappling hook, harnesses, pulleys, pitons, a hammer and crampons. It lets you attach yourself to the wall you're Climbing, moving half as fast as usual (minimum 5 feet), and whenever you critically fail you can attempt a DC 5 flat check to prevent a fall. A kit has materials for only one climber; each climber needs their own.
gear.climbing-kit-tactical.description: Includes 50 feet of cable line, a grappling hook, harnesses, pulleys, pitons, a hammer and crampons. It lets you attach yourself to the wall you're Climbing, moving half as fast as usual (minimum 5 feet), and whenever you critically fail you can attempt a DC 5 flat check to prevent a fall. A kit has materials for only one climber; each climber needs their own. It gives a +1 item bonus to Athletics checks to Climb.
gear.comm-unit.description: |-
  A pocket-sized device combining a minor portable computer and a cellular communicator, allowing instant wireless audio and text communication with other comm units at planetary range. It also includes a calculator, a flashlight (bright light in a 5-foot radius and dim light in the next 5 feet), a browser for local infospheres and entertainment options such as games.

  Comm units integrated into armor have voice-activated capabilities: you can communicate with other comm units by audio and receive responses without a free hand, but typing a message, browsing the infosphere or using an app needs at least one hand.

  Longer-range comm units are less portable; they have built-in generators and rely on active hyperspace beacons to communicate. Short-term use of these is available in most major settlements.
gear.container-ordinary.description: Containers include backpacks, briefcases, duffel bags and handbags. A container holds up to 4 Bulk, and the first 2 Bulk of those items don't count against your Bulk limits. If you carry or stow the container instead of wearing it, its Bulk is light instead of negligible.
gear.container-designer.description: Containers include backpacks, briefcases, duffel bags and handbags. A container holds up to 4 Bulk, and the first 2 Bulk of those items don't count against your Bulk limits. If you carry or stow the container instead of wearing it, its Bulk is light instead of negligible. While you carry a designer container, you gain a +1 item bonus to checks to Make an Impression on high society individuals.
gear.data-chip.description: Holds enough memory for a religious text, photo album, personal journal or the like. You can view it with a computer, such as the one in your comm unit.
