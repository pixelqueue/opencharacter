feats.archetype.envoy.envoy-dedication.description: You gain the envoy directives class feature, but not the Lead by Example benefits of the Get 'Em! directive. You become trained in Deception, Diplomacy or Intimidation plus another skill of your choice; if you were already trained in all three, you become trained in an additional skill of your choice. You also become trained in the envoy class DC.
feats.archetype.envoy.basic-leadership.description: You gain a 1st- or 2nd-level envoy feat of your choice.
feats.archetype.envoy.adaptive-talent.description: You gain the adaptive talent class feature, but you don't gain additional skill feats at higher levels.
feats.archetype.envoy.advanced-leadership.description: You gain one envoy feat. For meeting its prerequisites, your envoy level is half your character level. You can select this feat more than once; each time, you gain another envoy feat.
feats.archetype.envoy.really-get-em.description: You gain the Lead by Example benefit of your Get 'Em! directive, except that you and your allies get a +2 status bonus to damage on both the initial and the subsequent Strikes.
feats.archetype.envoy.leaders-confidence.description: You gain the leader's confidence class feature.
feats.archetype.mystic.mystic-dedication.description: |-
  Choose a connection. You become trained in the connection's skill, or in a skill of your choice if you were already trained. You gain no other abilities from the connection. You gain the mystic bond class feature.

  You cast spells like a mystic and gain the Cast a Spell activity. You gain a spell repertoire with two common cantrips from your connection's spell list, from the spells your connection grants, or from any other cantrips of that tradition you learn or discover. You're trained in spell attack modifier and spell DC. Your key spellcasting attribute for mystic archetype spells is Wisdom, and they are mystic spells of your connection's tradition.
feats.archetype.mystic.vitality-network.description: You gain a vitality network with 10 Hit Points and can use Transfer Vitality to transfer up to 10 HP. The network's maximum capacity increases by 10 at 10th, 15th and 20th level. The amount you can transfer increases by 5 at 5th, 10th, 15th and 20th level.
feats.archetype.mystic.basic-mystic-spellcasting.description: "You gain the basic spellcasting benefits. Each time you gain a spell slot of a new rank from the mystic archetype, add a spell of that rank to your repertoire: a common spell of your connection's tradition, or one of your connection's granted spells."
feats.archetype.mystic.basic-mysticism.description: You gain a 1st- or 2nd-level mystic feat.
feats.archetype.mystic.advanced-mysticism.description: You gain one mystic feat. For meeting its prerequisites, your mystic level is half your character level. You can select this feat more than once; each time, you gain another mystic feat.
feats.archetype.mystic.basic-epiphany.description: You gain your connection's initial epiphany spell. If you don't already have a focus pool, you gain one with 1 Focus Point, which you can Refocus by reflecting on your connection.
feats.archetype.mystic.expanded-connection.description: Increase the number of spells in your repertoire, and the number of spell slots you gain from mystic archetype feats, by 1 for each spell rank other than your two highest mystic spell slots.
feats.archetype.mystic.expert-mystic-spellcasting.description: You gain the expert spellcasting benefits.
feats.archetype.mystic.master-mystic-spellcasting.description: You gain the master spellcasting benefits.
feats.archetype.operative.operative-dedication.description: You become trained in simple and martial guns and in the operative class DC. You gain the Aim action; it deals no additional damage, but still reduces the bonus to AC your mark gains from cover (this doesn't increase as you gain levels).
feats.archetype.operative.basic-gunner.description: You gain a 1st- or 2nd-level operative feat.
feats.archetype.operative.sharpshooter.description: Your ranged Strikes with the required ranged weapon against the target of your Aim deal an additional 1d4 precision damage until the end of your turn. The damage increases to 2d4 at 6th level.
feats.archetype.operative.specialized-operative.description: Choose a specialization. You become trained in one skill determined by it, or in another skill of your choice if you were already trained in that skill. You gain a skill feat associated with that skill. You gain no other benefits from the specialization.
feats.archetype.operative.operative-resiliency.description: You gain 3 additional Hit Points for each operative archetype class feat you have, and keep gaining them as you select more.
feats.archetype.operative.advanced-gunner.description: You gain one operative feat. For meeting its prerequisites, your operative level is half your character level. You can select this feat more than once; each time, you gain another operative feat.
feats.archetype.operative.operative-exploit.description: You gain the exploit of your chosen specialization.
feats.archetype.operative.gun-expert.description: Your proficiency ranks for simple and martial guns increase to expert.
feats.archetype.operative.master-spy.description: Your proficiency rank for Perception increases to master.
feats.archetype.solarian.solarian-dedication.description: |-
  You gain the stellar attunement class feature, but you don't Attune as a free action when you roll initiative. You become trained in solar flare, solar weapon and the solarian class DC.

  You can manifest a solar weapon. It has the attuned and solarian traits, but you can't select additional traits for it and it gains no benefits based on your attunement. You gain the Re-Forge Solar Weapon action.
feats.archetype.solarian.basic-stellar-attunement.description: You gain a 1st- or 2nd-level solarian feat.
feats.archetype.solarian.solar-weapon-customization.description: You can select one trait from the solar weapon trait list for your solar weapon. At 6th level, you can choose a second trait, or the reach or two-hand 1d10 trait instead of two traits.
feats.archetype.solarian.solarians-resiliency.description: You gain 3 additional Hit Points for each solarian archetype class feat you have, and keep gaining them as you select more.
feats.archetype.solarian.advanced-stellar-attunement.description: You gain one solarian feat. For meeting its prerequisites, your solarian level is half your character level. You can select this feat more than once; each time, you gain another solarian feat.
feats.archetype.solarian.solar-flare.description: You can create and maintain a solar flare, but you don't add your Strength modifier to its damage rolls and gain no benefits based on your attunement.
feats.archetype.solarian.solar-nimbus.description: You gain the Nimbus Surge reaction, but none of its additional benefits based on your attunement.
feats.archetype.solarian.solar-manifestation-expert.description: Your proficiency ranks for solar flare, solar weapon and your solarian class DC increase to expert.
feats.archetype.soldier.soldier-dedication.description: |-
  You become trained in Intimidation, or in a skill of your choice if you were already trained. Increase your maximum and encumbered Bulk limits by 2. You become trained in the soldier class DC.

  You become trained in light armor and medium armor; if you already were, you gain training in heavy armor too. Whenever you gain a class feature that grants expert or greater proficiency in any type of armor (but not unarmored defense), you also gain that proficiency in the armor types this feat grants. If a class feature gives you expert proficiency in unarmored defense and you're 13th level or higher, you also become an expert in the armor types this feat grants.
feats.archetype.soldier.basic-soldier-training.description: You gain a 1st- or 2nd-level soldier feat.
feats.archetype.soldier.soldiers-resiliency.description: You gain 3 additional Hit Points for each soldier archetype class feat you have, and keep gaining them as you select more.
feats.archetype.soldier.advanced-soldier-training.description: You gain one soldier feat. For meeting its prerequisites, your soldier level is half your character level. You can select this feat more than once; each time, you gain another soldier feat.
feats.archetype.soldier.suppressing-fire.description: You gain the suppressing fire class feature.
feats.archetype.soldier.primary-target.description: You gain the primary target class feature.
feats.archetype.soldier.soldiers-toughness.description: Your proficiency rank in Fortitude saves increases to master.
feats.archetype.witchwarper.witchwarper-dedication.description: |-
  Choose a paradox. You become trained in the paradox's skill, or in a skill of your choice if you were already trained. You gain no other abilities from the paradox. You gain the Warp Reality action, but your quantum field is a 10-foot-radius burst.

  You cast spells like a witchwarper and gain the Cast a Spell activity. You gain a spell repertoire with two common cantrips from your paradox's spell list, from the spells your paradox grants, or from any other cantrips of that tradition you learn or discover. You're trained in spell attack modifier and spell DC. Your key spellcasting attribute for witchwarper archetype spells is your choice of Intelligence or Charisma, and they are witchwarper spells of your paradox's tradition.
feats.archetype.witchwarper.basic-distortion.description: You gain a 1st- or 2nd-level witchwarper feat.
feats.archetype.witchwarper.basic-quantum-field.description: Your quantum field gains the effect of your chosen paradox.
feats.archetype.witchwarper.basic-warp-spell.description: You gain your paradox's initial warp spell. If you don't already have a focus pool, you gain one with 1 Focus Point, which you can Refocus by contemplating infinite worlds.
feats.archetype.witchwarper.basic-witchwarper-spellcasting.description: "You gain the basic spellcasting benefits. Each time you gain a spell slot of a new rank from the witchwarper archetype, add a spell of that rank to your repertoire: a common spell of your paradox's tradition, or one of your paradox's granted spells."
feats.archetype.witchwarper.advanced-distortion.description: You gain one witchwarper feat. For meeting its prerequisites, your witchwarper level is half your character level. You can select this feat more than once; each time, you gain another witchwarper feat.
feats.archetype.witchwarper.quantum-breadth.description: Increase the number of spells in your repertoire, and the number of spell slots you gain from witchwarper archetype feats, by 1 for each spell rank other than your two highest witchwarper spell slots.
feats.archetype.witchwarper.expert-witchwarper-spellcasting.description: You gain the expert spellcasting benefits.
feats.archetype.witchwarper.master-witchwarper-spellcasting.description: You gain the master spellcasting benefits.
