pack: orc-sf-2e
from: 0.2.0
to: 0.3.0
steps:
  # Fixation's topic presets nothing now: its granted Additional Lore asks the Lore itself, with
  # the same values, and Assurance follows that pick.
  - op: renameChoice
    owner: feats.ancestry.fixation
    from: topic
    to: orc-sf-2e:feats.skill.additional-lore/lore
  # Harmonic Sensitivity asks whether it trains Performance or gives Assurance in it.
  - { op: requireChoice, owner: feats.ancestry.harmonic-sensitivity, choice: harmonic }
