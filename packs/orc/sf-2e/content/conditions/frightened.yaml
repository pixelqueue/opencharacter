id: conditions.frightened
type: condition
# Bravery lowers a new value by 1 (`fear.reduction`): the entry keeps the value gained, so keeping
# the higher on gaining it again and lowering both by 1 give the same numbers.
effects:
  - target: { fields: { where: "'check' in item.tags || 'dc' in item.tags" } }
    op: add
    value: -max(0, self.value - fear.reduction)
    stackKey: status-penalty
    scope: applied
  - target: conditions.frightened
    op: atLeast
    value: max(0, self.value - fear.reduction)
    scope: applied
