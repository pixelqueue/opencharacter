id: feats.ancestry.lashunta-lore
type: feat
tags: [trait.lashunta]
fields: { level: 1, category: ancestry, ancestry: ancestries.lashunta }
# Its Additional Lore can't repeat one the character already took for Lashunta Lore.
prerequisites:
  - id: lore
    when: >-
      countList(picksOf('feats.skill.additional-lore', 'lore'), x == 'lashunta')
        <= (@feats.ancestry.lashunta-lore in feats.held ? 1 : 0)
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.occultism }
    when: "!('skill.occultism' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - target: skills.trained
    op: grant
    value: { tag: skill.society }
    when: "!('skill.society' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
grants:
  - item: feats.skill.additional-lore
    waivePrerequisites: true
    choices: { lore: [{ option: lashunta }] }
