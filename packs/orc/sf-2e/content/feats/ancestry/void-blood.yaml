id: feats.ancestry.void-blood
type: feat
tags: [trait.borai]
fields: { level: 5, category: ancestry, heritage: heritages.borai }
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.void] } }
    op: add
    stackKey: resistance
    value: 'min(-incoming.amount, max(1, floor(level / 2)))'
    when: incoming.amount < 0
