id: feats.ancestry.center-thoughts
type: feat
tags: [trait.fortune, trait.lashunta, trait.mental]
fields: { level: 1, category: ancestry, ancestry: ancestries.lashunta }
state:
  used: { type: boolean, default: false }
# Once a day, a failed Will save (against a mental effect: the player's to say) is rerolled on the
# check's `check.reroll` step; the better result stands. Daily preparations reset `used`.
effects:
  - target: { choices: [check.reroll] }
    op: option
    when: "!self.used && 'save.will' in params.check.tags"
    value:
      id: center-thoughts
      flags: { reroll: 2 }
      changes: [{ type: setState, pick: owner, key: used, value: true }]
