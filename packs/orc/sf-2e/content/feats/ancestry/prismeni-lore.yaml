id: feats.ancestry.prismeni-lore
type: feat
tags: [trait.prismeni]
fields: { level: 1, category: ancestry, heritage: heritages.prismeni }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.piloting }
    when: "!('skill.piloting' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - target: skills.trained
    op: grant
    value: { tag: skill.stealth }
    when: "!('skill.stealth' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
grants:
  - item: feats.skill.additional-lore
    waivePrerequisites: true
    choices: { lore: [{ option: prismeni }] }
