id: feats.ancestry.natural-grace
type: feat
tags: [trait.fortune, trait.kasatha]
fields: { level: 1, category: ancestry, ancestry: ancestries.kasatha }
state:
  used: { type: boolean, default: false }
# Once a day, a failed Acrobatics check or Reflex save is rerolled on the check's `check.reroll`
# step; the new result stands. Daily preparations reset `used`.
effects:
  - target: { choices: [check.reroll] }
    op: option
    when: >-
      !self.used && ('skill.acrobatics' in params.check.tags || 'save.reflex' in params.check.tags)
    value:
      id: natural-grace
      flags: { reroll: 1 }
      changes: [{ type: setState, pick: owner, key: used, value: true }]
