id: feats.ancestry.shirren-lore
type: feat
tags: [trait.shirren]
fields: { level: 1, category: ancestry, ancestry: ancestries.shirren }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.diplomacy }
    when: "!('skill.diplomacy' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - target: skills.trained
    op: grant
    value: { tag: skill.society }
    when: "!('skill.society' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.shirren }
    when: "!('skill.lore.shirren' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - target: skills.lore.shirren.granted
    op: add
    value: '(level >= 3 ? 1 : 0) + (level >= 7 ? 1 : 0) + (level >= 15 ? 1 : 0)'
