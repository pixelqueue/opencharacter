id: feats.ancestry.natural-skill
type: feat
tags: [trait.human]
fields: { level: 1, category: ancestry, ancestry: ancestries.human }
choices:
  - id: skills
    pick: 2
    unique: skill-training
    from:
      values:
        - skill.acrobatics
        - skill.arcana
        - skill.athletics
        - skill.computers
        - skill.crafting
        - skill.deception
        - skill.diplomacy
        - skill.intimidation
        - skill.medicine
        - skill.nature
        - skill.occultism
        - skill.performance
        - skill.piloting
        - skill.religion
        - skill.society
        - skill.stealth
        - skill.survival
        - skill.thievery
      where: '!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks'
    effects: [{ target: skills.chosen, op: grant, value: { formula: pick.value } }]
