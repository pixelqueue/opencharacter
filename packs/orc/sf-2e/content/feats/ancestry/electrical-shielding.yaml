id: feats.ancestry.electrical-shielding
type: feat
tags: [trait.prismeni]
fields: { level: 5, category: ancestry, heritage: heritages.prismeni }
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.electricity] } }
    op: add
    stackKey: resistance
    value: 'min(-incoming.amount, max(1, floor(level / 2)))'
    when: incoming.amount < 0
