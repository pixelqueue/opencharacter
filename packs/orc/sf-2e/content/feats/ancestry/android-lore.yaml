id: feats.ancestry.android-lore
type: feat
tags: [trait.android]
fields: { level: 1, category: ancestry, ancestry: ancestries.android }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.crafting }
    when: "!('skill.crafting' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - target: skills.trained
    op: grant
    value: { tag: skill.thievery }
    when: "!('skill.thievery' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
grants:
  - item: feats.skill.additional-lore
    waivePrerequisites: true
    choices: { lore: [{ option: android }] }
