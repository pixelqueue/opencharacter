id: feats.ancestry.ysoki-lore
type: feat
tags: [trait.ysoki]
fields: { level: 1, category: ancestry, ancestry: ancestries.ysoki }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.acrobatics }
    when: "!('skill.acrobatics' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - target: skills.trained
    op: grant
    value: { tag: skill.stealth }
    when: "!('skill.stealth' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
grants:
  - item: feats.skill.additional-lore
    waivePrerequisites: true
    choices: { lore: [{ option: ysoki }] }
