id: feats.skill.skill-training
type: feat
fields: { level: 1, category: skill, skills: [skill] }
repeatable: true

prerequisites:
  - id: int
    when: 'attributes.int.mod >= 1'
choices:
  - id: skill
    unique: skill-training
    from:
      values:
        [
          skill.acrobatics,
          skill.arcana,
          skill.athletics,
          skill.computers,
          skill.crafting,
          skill.deception,
          skill.diplomacy,
          skill.intimidation,
          skill.medicine,
          skill.nature,
          skill.occultism,
          skill.performance,
          skill.piloting,
          skill.religion,
          skill.society,
          skill.stealth,
          skill.survival,
          skill.thievery,
          skill.lore.academia,
          skill.lore.circus,
          skill.lore.farming,
          skill.lore.legal,
          skill.lore.scribing,
          skill.lore.underworld,
          skill.lore.warfare,
          skill.lore.alcohol,
          skill.lore.art,
          skill.lore.cooking,
          skill.lore.engineering,
          skill.lore.fortune-telling,
          skill.lore.games,
          skill.lore.genealogy,
          skill.lore.gladiatorial,
          skill.lore.guild,
          skill.lore.heraldry,
          skill.lore.herbalism,
          skill.lore.labor,
          skill.lore.mercantile,
          skill.lore.mining,
          skill.lore.sailing,
          skill.lore.tanning,
          skill.lore.theater,
          skill.lore.cave,
          skill.lore.desert,
          skill.lore.forest,
          skill.lore.mountain,
          skill.lore.plains,
          skill.lore.swamp,
          skill.lore.dwarf,
          skill.lore.elf,
          skill.lore.goblin,
          skill.lore.halfling,
          skill.lore.leshy,
          skill.lore.orc,
        ]
      where: '!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks'
    effects:
      - { target: skills.chosen, op: grant, value: { formula: pick.value } }
