id: feats.skill.unmistakable-lore
type: feat
fields: { level: 2, category: skill, skills: [skill.lore] }

prerequisites:
  - id: expert
    when: "maxFields(f.value, 'lore' in f.tags && 'skill-rank' in f.tags) >= 2"
effects:
  - target: { rolls: [lore], tally: critFailToFail }
    op: add
    value: 1
    when: "'skill-action.recall-knowledge' in roll.tags && !('untrained' in roll.tags)"
