id: feats.skill.student-of-the-canon
type: feat
fields: { level: 1, category: skill, skills: [skill.religion] }

prerequisites:
  - id: trained
    when: 'skills.religion.rank >= 1'
effects:
  - target: { rolls: [skill.religion], tally: critFailToFail }
    op: add
    value: 1
    when: "'skill-action.recall-knowledge' in roll.tags || 'skill-action.decipher-writing' in roll.tags"
