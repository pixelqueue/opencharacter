id: feats.skill.additional-lore
type: feat
fields: { level: 1, category: skill, skills: [skill.lore] }
repeatable: true
choices:
  - id: lore
    unique: additional-lore
    from:
      values:
        [
          academia,
          alcohol,
          android,
          animal,
          art,
          augmentation,
          barathu,
          borai,
          business,
          cooking,
          corporate,
          games,
          genealogy,
          history,
          hyperspace,
          infosphere,
          kasatha,
          labor,
          lashunta,
          legal,
          life-science,
          media,
          mining,
          pahtra,
          physical-science,
          piracy,
          plant,
          prismeni,
          shirren,
          skittermander,
          sports,
          underworld,
          vesk,
          vidgame,
          warfare,
          ysoki,
          custom1,
          custom2,
          custom3,
        ]
    effects:
      - target: skills.trained
        op: grant
        value: { formula: "'skill.lore.' + pick.value" }
        when: "!(('skill.lore.' + pick.value) in skills.chosen)"
      - { target: skills.trainings, op: add, value: 1 }
      - target:
          formula: >-
            'skills.lore.' + (pick.value == 'life-science' ? 'lifeScience'
              : pick.value == 'physical-science' ? 'physicalScience' : pick.value) + '.granted'
        op: add
        value: '(level >= 3 ? 1 : 0) + (level >= 7 ? 1 : 0) + (level >= 15 ? 1 : 0)'
