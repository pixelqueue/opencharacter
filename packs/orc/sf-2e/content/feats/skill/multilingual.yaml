id: feats.skill.multilingual
type: feat
fields: { level: 1, category: skill, skills: [skill.society] }
repeatable: true

prerequisites:
  - id: trained
    when: 'skills.society.rank >= 1'
effects:
  - target: languages.extra
    op: add
    value: '2 + (skills.society.rank >= 3 ? 1 : 0) + (skills.society.rank >= 4 ? 1 : 0)'
