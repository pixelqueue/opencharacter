id: feats.skill.assurance
type: feat
tags: [trait.fortune]
fields: { level: 1, category: skill, skills: [skill] }
repeatable: true

choices:
  - id: skill
    from:
      values:
        - skill.acrobatics
        - skill.arcana
        - skill.athletics
        - skill.computers
        - skill.crafting
        - skill.deception
        - skill.diplomacy
        - skill.intimidation
        - skill.medicine
        - skill.nature
        - skill.occultism
        - skill.performance
        - skill.piloting
        - skill.religion
        - skill.society
        - skill.stealth
        - skill.survival
        - skill.thievery
        - skill.lore.academia
        - skill.lore.alcohol
        - skill.lore.android
        - skill.lore.animal
        - skill.lore.art
        - skill.lore.augmentation
        - skill.lore.barathu
        - skill.lore.borai
        - skill.lore.business
        - skill.lore.cooking
        - skill.lore.corporate
        - skill.lore.games
        - skill.lore.genealogy
        - skill.lore.history
        - skill.lore.hyperspace
        - skill.lore.infosphere
        - skill.lore.kasatha
        - skill.lore.labor
        - skill.lore.lashunta
        - skill.lore.legal
        - skill.lore.life-science
        - skill.lore.media
        - skill.lore.mining
        - skill.lore.pahtra
        - skill.lore.physical-science
        - skill.lore.piracy
        - skill.lore.plant
        - skill.lore.prismeni
        - skill.lore.shirren
        - skill.lore.skittermander
        - skill.lore.sports
        - skill.lore.underworld
        - skill.lore.vesk
        - skill.lore.vidgame
        - skill.lore.warfare
        - skill.lore.ysoki
        - skill.lore.custom1
        - skill.lore.custom2
        - skill.lore.custom3
    effects:
      - { target: assurance.skills, op: grant, value: { formula: pick.value } }

actions:
  - id: assurance
    tags: [check, assurance]
    params:
      skill: { type: id, of: field, where: "'skill-rank' in item.tags" }
      dc: { type: integer, optional: true }
    results: { bands: degree }
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags: { dc: 'has(params.dc) ? params.dc : -1' }
      - id: fixed
        kind: roll
        when: countList(params.skill.tags, x in assurance.skills) > 0
        tags: [assurance]
        bands: degree
        parts:
          - value: '10 + (params.skill.value > 0 ? 2 * params.skill.value + proficiency.level : proficiency.untrained)'
      - id: result
        kind: outcome
        result: "has(steps.fixed) ? steps.fixed.band : 'failure'"
        data:
          total: 'has(steps.fixed) ? steps.fixed.total : 0'
          dc: flags.dc
