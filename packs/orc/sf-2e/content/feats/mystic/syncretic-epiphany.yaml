id: feats.mystic.syncretic-epiphany
type: feat
tags: [trait.mystic]
fields: { level: 16, category: class, class: classes.mystic }
prerequisites:
  - id: master
    when: mystic.otherMasterEpiphanies > 0
effects: [{ target: focus.points, op: add, value: 1 }]
choices:
  - id: spell
    from:
      options:
        - id: akashic
          prerequisites:
            - id: connection
              when: "mystic.connection != 'akashic' && skills.occultism.rank >= 3 && countCopies(copy.item == @spells.akashic-fount) > 0"
          grants: [{ item: spells.akashic-assistant }]
        - id: elemental
          prerequisites:
            - id: connection
              when: "mystic.connection != 'elemental' && skills.nature.rank >= 3 && countCopies(copy.item == @spells.elemental-weapon) > 0"
          grants: [{ item: spells.elemental-barrier }]
        - id: healing
          prerequisites:
            - id: connection
              when: "mystic.connection != 'healing' && skills.medicine.rank >= 3 && countCopies(copy.item == @spells.infusion) > 0"
          grants: [{ item: spells.vitality-nova }]
        - id: rhythm
          prerequisites:
            - id: connection
              when: "mystic.connection != 'rhythm' && skills.performance.rank >= 3 && countCopies(copy.item == @spells.anthem) > 0"
          grants: [{ item: spells.shuffle-repeat }]
        - id: shadow
          prerequisites:
            - id: connection
              when: "mystic.connection != 'shadow' && skills.stealth.rank >= 3 && countCopies(copy.item == @spells.shadow-snap) > 0"
          grants: [{ item: spells.cloying-shadows }]
