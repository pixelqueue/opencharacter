id: feats.solarian.hampering-flare
type: feat
tags: [trait.attuned, trait.cycle, trait.flourish, trait.solarian]
fields: { level: 1, category: class, class: classes.solarian }
actions:
  - id: hampering-flare
    tags: [strike, feat-action]
    available: "solarian.attunement != 'unattuned' && countCopies(copy.type == 'weapon' && 'solar-flare' in copy.tags) > 0"
    participants: { target: { min: 1, max: 1 } }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: 'options[0]'
        options:
          copies:
            type: weapon
            where: "'solar-flare' in item.tags && (!('solar' in item.tags) || solarian.attunement != 'unattuned') && (!('attuned.photon' in item.tags) || solarian.attunement in ['photon', 'perfect']) && (!('attuned.graviton' in item.tags) || solarian.attunement == 'graviton') && (item.magazine == 0 || self.ammo >= item.expend)"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: rider
        kind: changes
        when: "steps.strike.result in ['success', 'critical-success']"
        to: target
        changes: [{ type: applyEffect, source: "'conditions.off-guard'" }]
      - { id: result, kind: outcome, result: steps.strike.result }
