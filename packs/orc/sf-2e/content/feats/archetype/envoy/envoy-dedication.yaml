id: feats.archetype.envoy.envoy-dedication
type: feat
tags: [trait.archetype, archetype-feat, trait.dedication, trait.multiclass]
fields: { level: 2, category: class, archetype: archetypes.envoy }
prerequisites:
  - { id: attribute, when: 'attributes.cha.mod >= 2' }
  - { id: requirement, when: 'countCopies(copy.item == @classes.envoy) == 0' }
effects: [{ target: classDc.envoy.rank, op: atLeast, value: 1 }]
grants: [{ item: features.envoy.envoy-directives }]
choices:
  - id: skill
    from:
      values:
        - skill.acrobatics
        - skill.arcana
        - skill.athletics
        - skill.computers
        - skill.crafting
