id: feats.archetype.envoy.envoy-dedication
type: feat
tags: [trait.archetype, archetype-feat, trait.dedication, trait.multiclass]
fields: { level: 2, category: class, archetype: archetypes.envoy }
prerequisites:
  - { id: attribute, when: 'attributes.cha.mod >= 2' }
  - { id: requirement, when: 'countCopies(copy.item == @classes.envoy) == 0' }
effects: [{ target: classDc.envoy.rank, op: atLeast, value: 1 }]
grants: [{ item: features.envoy.envoy-directives }]
choices:
  - id: skill
    from:
      values: { formula: skills.offered }
      where: "(!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks) && (value in ['skill.deception', 'skill.diplomacy', 'skill.intimidation'] || countList(['skill.deception', 'skill.diplomacy', 'skill.intimidation'], (x in skills.trained || x in skills.chosen) && !(x in choice.picks)) == 3)"
    effects:
      - target: skills.trained
        op: grant
        value: { formula: pick.value }
        when: '!(pick.value in skills.chosen)'
      - { target: skills.trainings, op: add, value: 1 }
  - id: other
    from:
      values: { formula: skills.offered }
      where: '!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks'
    effects:
      - target: skills.trained
        op: grant
        value: { formula: pick.value }
        when: '!(pick.value in skills.chosen)'
      - { target: skills.trainings, op: add, value: 1 }
