        - skill.religion
        - skill.society
        - skill.stealth
        - skill.survival
        - skill.thievery
        - skill.lore.academia
        - skill.lore.alcohol
        - skill.lore.animal
        - skill.lore.art
        - skill.lore.augmentation
        - skill.lore.business
        - skill.lore.cooking
        - skill.lore.corporate
        - skill.lore.games
        - skill.lore.genealogy
        - skill.lore.history
        - skill.lore.hyperspace
        - skill.lore.infosphere
