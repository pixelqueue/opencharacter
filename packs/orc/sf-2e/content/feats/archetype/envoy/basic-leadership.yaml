id: feats.archetype.envoy.basic-leadership
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.envoy }
prerequisites: [{ id: feat, when: '@feats.archetype.envoy.envoy-dedication in feats.held' }]
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && !('trait.archetype' in item.tags) && (has(item.class) && item.class == @classes.envoy || 'trait.envoy' in item.tags)"
    eligible: item.level <= 2
