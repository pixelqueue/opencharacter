id: feats.archetype.envoy.advanced-leadership
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.envoy }
prerequisites: [{ id: feat, when: '@feats.archetype.envoy.basic-leadership in feats.held' }]
effects: [{ target: archetypes.envoy.repeats, op: add, value: 1 }]
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && !('trait.archetype' in item.tags) && (has(item.class) && item.class == @classes.envoy || 'trait.envoy' in item.tags)"
    eligible: item.level <= floor(level / 2)
repeatable: true
