id: feats.archetype.soldier.basic-soldier-training
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.soldier }
prerequisites: [{ id: feat, when: '@feats.archetype.soldier.soldier-dedication in feats.held' }]
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && !('trait.archetype' in item.tags) && (has(item.class) && item.class == @classes.soldier || 'trait.soldier' in item.tags)"
    eligible: item.level <= 2
