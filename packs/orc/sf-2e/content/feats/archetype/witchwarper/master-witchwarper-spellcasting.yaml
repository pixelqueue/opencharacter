id: feats.archetype.witchwarper.master-witchwarper-spellcasting
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 18, category: class, archetype: archetypes.witchwarper }
prerequisites:
  - id: expert
    when: '@feats.archetype.witchwarper.expert-witchwarper-spellcasting in feats.held'
  - id: legendary
    when: "[skills.arcana.rank, skills.religion.rank, skills.occultism.rank, skills.nature.rank][indexOf(['arcane', 'divine', 'occult', 'primal'], spellcasting.archetype.witchwarper.tradition)] >= 4"
effects:
  - { target: spellcasting.archetype.witchwarper.benefits, op: atLeast, value: 3 }
  - { target: spellcasting.archetype.witchwarper.rank, op: atLeast, value: 3 }
