id: feats.archetype.witchwarper.advanced-distortion
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.witchwarper }
prerequisites: [{ id: feat, when: '@feats.archetype.witchwarper.basic-distortion in feats.held' }]
effects: [{ target: archetypes.witchwarper.repeats, op: add, value: 1 }]
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && !('trait.archetype' in item.tags) && (has(item.class) && item.class == @classes.witchwarper || 'trait.witchwarper' in item.tags)"
    eligible: item.level <= floor(level / 2)
repeatable: true
