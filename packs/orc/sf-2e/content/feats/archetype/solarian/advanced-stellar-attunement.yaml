id: feats.archetype.solarian.advanced-stellar-attunement
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.solarian }
prerequisites:
  - { id: feat, when: '@feats.archetype.solarian.basic-stellar-attunement in feats.held' }
effects: [{ target: archetypes.solarian.repeats, op: add, value: 1 }]
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && !('trait.archetype' in item.tags) && (has(item.class) && item.class == @classes.solarian || 'trait.solarian' in item.tags)"
    eligible: item.level <= floor(level / 2)
repeatable: true
