id: feats.archetype.operative.basic-gunner
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.operative }
prerequisites:
  - { id: feat, when: '@feats.archetype.operative.operative-dedication in feats.held' }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && !('trait.archetype' in item.tags) && (has(item.class) && item.class == @classes.operative || 'trait.operative' in item.tags)"
    eligible: item.level <= 2
