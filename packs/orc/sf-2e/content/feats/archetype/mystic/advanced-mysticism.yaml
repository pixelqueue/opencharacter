id: feats.archetype.mystic.advanced-mysticism
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.mystic }
prerequisites: [{ id: feat, when: '@feats.archetype.mystic.basic-mysticism in feats.held' }]
effects: [{ target: archetypes.mystic.repeats, op: add, value: 1 }]
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && !('trait.archetype' in item.tags) && (has(item.class) && item.class == @classes.mystic || 'trait.mystic' in item.tags)"
    eligible: item.level <= floor(level / 2)
repeatable: true
