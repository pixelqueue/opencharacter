id: feats.archetype.mystic.basic-mysticism
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.mystic }
prerequisites: [{ id: feat, when: '@feats.archetype.mystic.mystic-dedication in feats.held' }]
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && !('trait.archetype' in item.tags) && (has(item.class) && item.class == @classes.mystic || 'trait.mystic' in item.tags)"
    eligible: item.level <= 2
