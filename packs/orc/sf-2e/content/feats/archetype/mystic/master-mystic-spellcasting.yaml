id: feats.archetype.mystic.master-mystic-spellcasting
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 18, category: class, archetype: archetypes.mystic }
prerequisites:
  - { id: expert, when: '@feats.archetype.mystic.expert-mystic-spellcasting in feats.held' }
  - id: legendary
    when: "mystic.connection == 'akashic' && skills.occultism.rank >= 4 || mystic.connection == 'elemental' && skills.nature.rank >= 4 || mystic.connection == 'healing' && skills.medicine.rank >= 4 || mystic.connection == 'rhythm' && skills.performance.rank >= 4 || mystic.connection == 'shadow' && skills.stealth.rank >= 4"
effects:
  - { target: spellcasting.archetype.mystic.benefits, op: atLeast, value: 3 }
  - { target: spellcasting.archetype.mystic.rank, op: atLeast, value: 3 }
