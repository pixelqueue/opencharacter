id: grades.weapon-superior
type: template
tags: [grade]
appliesTo: { type: weapon, where: "item.category != 'unarmed' && !('natural' in item.tags)" }
fields:
  potency: 2
  dice: 2
  upgradeSlots: prior.upgradeSlots + 1
  level: 'max(prior.level, 10)'
  price: '(has(prior.price) ? prior.price : 0) + 10000'
