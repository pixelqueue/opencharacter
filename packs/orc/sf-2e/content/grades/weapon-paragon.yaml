id: grades.weapon-paragon
type: template
tags: [grade]
appliesTo: { type: weapon, where: "item.category != 'unarmed' && !('natural' in item.tags)" }
fields:
  potency: 3
  dice: 4
  upgradeSlots: prior.upgradeSlots + 3
  level: 'max(prior.level, 19)'
  price: '(has(prior.price) ? prior.price : 0) + 400000'
