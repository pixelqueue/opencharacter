id: grades.weapon-elite
type: template
tags: [grade]
appliesTo: { type: weapon, where: "item.category != 'unarmed' && !('natural' in item.tags)" }
fields:
  potency: 2
  dice: 3
  upgradeSlots: prior.upgradeSlots + 2
  level: 'max(prior.level, 12)'
  price: '(has(prior.price) ? prior.price : 0) + 20000'
