id: grades.weapon-advanced
type: template
tags: [grade]
appliesTo: { type: weapon, where: "item.category != 'unarmed' && !('natural' in item.tags)" }
fields:
  potency: 1
  dice: 2
  upgradeSlots: prior.upgradeSlots + 1
  level: 'max(prior.level, 4)'
  price: '(has(prior.price) ? prior.price : 0) + 1000'
