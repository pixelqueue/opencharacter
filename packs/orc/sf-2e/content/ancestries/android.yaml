id: ancestries.android
type: ancestry
tags: [trait.android, trait.humanoid, sense.low-light-vision]
fields: { hp: 8, size: medium, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.android } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
  - { target: languages.extra, op: add, value: 1 }
  - target: { rolls: [save] }
    op: add
    value: 1
    stackKey: circumstance-bonus
    when: 'situational.againstDisease || situational.againstPoison || situational.againstRadiation'
choices:
  - id: heritage
    from: { type: heritage, where: 'item.versatile || item.ancestry == @ancestries.android' }
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.dex.boosts, op: add, value: 1 }
            - { target: attributes.int.boosts, op: add, value: 1 }
            - { target: attributes.cha.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['dex', 'int'])" }
        - { id: alternate, choices: [{ id: free, pick: 2, from: { type: boost } }] }
