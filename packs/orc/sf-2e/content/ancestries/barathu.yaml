id: ancestries.barathu
type: ancestry
tags: [trait.barathu, trait.aberration]
fields: { hp: 8, size: medium, speed: 5 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.barathu } }
  - { target: senses, op: grant, value: { tag: sense.limited-telepathy } }
  - { target: traits, op: grant, value: { tag: trait.barathu } }
  - { target: traits, op: grant, value: { tag: trait.aberration } }
choices:
  - id: heritage
    from: { type: heritage, where: 'item.versatile || item.ancestry == @ancestries.barathu' }
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.con.boosts, op: add, value: 1 }
            - { target: attributes.wis.boosts, op: add, value: 1 }
            - { target: attributes.dex.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['con', 'wis'])" }
        - { id: alternate, choices: [{ id: free, pick: 2, from: { type: boost } }] }
