id: ancestries.skittermander
type: ancestry
tags: [trait.skittermander, trait.humanoid, sense.low-light-vision]
fields: { hp: 6, size: small, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.vesk } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.skittermander } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
  - { target: languages.extra, op: add, value: 1 }
choices:
  - id: heritage
    from:
      type: heritage
      where: 'item.versatile || item.ancestry == @ancestries.skittermander'
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.cha.boosts, op: add, value: 1 }
            - { target: attributes.dex.boosts, op: add, value: 1 }
            - { target: attributes.wis.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['cha', 'dex'])" }
        - { id: alternate, choices: [{ id: free, pick: 2, from: { type: boost } }] }
