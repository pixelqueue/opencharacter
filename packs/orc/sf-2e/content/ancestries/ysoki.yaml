id: ancestries.ysoki
type: ancestry
tags: [trait.ysoki, trait.humanoid, sense.low-light-vision]
fields: { hp: 6, size: small, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.ysoki } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.ysoki } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
  - { target: languages.extra, op: add, value: 1 }
standardCopies: [{ type: weapon, where: 'item.id == @weapons.ysoki-jaws' }]
choices:
  - id: heritage
    from: { type: heritage, where: 'item.versatile || item.ancestry == @ancestries.ysoki' }
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.dex.boosts, op: add, value: 1 }
            - { target: attributes.int.boosts, op: add, value: 1 }
            - { target: attributes.str.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['dex', 'int'])" }
        - { id: alternate, choices: [{ id: free, pick: 2, from: { type: boost } }] }
