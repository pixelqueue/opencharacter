id: ancestries.vesk
type: ancestry
tags: [trait.vesk, trait.humanoid, sense.low-light-vision]
fields: { hp: 10, size: medium, speed: 20 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.vesk } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.vesk } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
  - { target: languages.extra, op: add, value: 1 }
choices:
  - id: heritage
    from: { type: heritage, where: 'item.versatile || item.ancestry == @ancestries.vesk' }
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.con.boosts, op: add, value: 1 }
            - { target: attributes.str.boosts, op: add, value: 1 }
            - { target: attributes.wis.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['con', 'str'])" }
        - { id: alternate, choices: [{ id: free, pick: 2, from: { type: boost } }] }
