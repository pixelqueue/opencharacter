id: ancestries.pahtra
type: ancestry
tags: [trait.pahtra, trait.humanoid, sense.darkvision]
fields: { hp: 8, size: medium, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.pahtra } }
  - { target: languages, op: grant, value: { item: languages.vesk } }
  - { target: senses, op: grant, value: { tag: sense.darkvision } }
  - { target: traits, op: grant, value: { tag: trait.pahtra } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
choices:
  - id: heritage
    from: { type: heritage, where: 'item.versatile || item.ancestry == @ancestries.pahtra' }
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.cha.boosts, op: add, value: 1 }
            - { target: attributes.dex.boosts, op: add, value: 1 }
            - { target: attributes.con.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['cha', 'dex'])" }
        - { id: alternate, choices: [{ id: free, pick: 2, from: { type: boost } }] }
