id: backgrounds.hacker
type: background
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.computers }
    when: "!('skill.computers' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.infosphere }
    when: "!('skill.lore.infosphere' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
grants: [{ item: feats.skill.phreaker }]
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['dex', 'int']" }
  - { id: free-boost, unique: background-boosts, from: { type: boost } }
