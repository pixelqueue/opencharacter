id: backgrounds.outlaw
type: background
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.intimidation }
    when: "!('skill.intimidation' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.underworld }
    when: "!('skill.lore.underworld' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
grants: [{ item: feats.skill.intimidating-shot }]
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['str', 'cha']" }
  - { id: free-boost, unique: background-boosts, from: { type: boost } }
