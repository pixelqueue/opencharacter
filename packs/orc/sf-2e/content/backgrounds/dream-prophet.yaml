id: backgrounds.dream-prophet
type: background
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.occultism }
    when: "!('skill.occultism' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.custom1 }
    when: "!('skill.lore.custom1' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
grants: [{ item: feats.skill.schooled-in-secrets }]
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['wis', 'cha']" }
  - { id: free-boost, unique: background-boosts, from: { type: boost } }
