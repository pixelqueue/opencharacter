id: backgrounds.trooper
type: background
tags: [trait.uncommon]
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.athletics }
    when: "!('skill.athletics' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.warfare }
    when: "!('skill.lore.warfare' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
grants: [{ item: feats.general.barricade }]
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['str', 'con']" }
  - { id: free-boost, unique: background-boosts, from: { type: boost } }
