id: backgrounds.scientist
type: background
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.crafting }
    when: "!('skill.crafting' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.custom1 }
    when: "!('skill.lore.custom1' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
grants: [{ item: feats.skill.assurance }]
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['int', 'wis']" }
  - { id: free-boost, unique: background-boosts, from: { type: boost } }
