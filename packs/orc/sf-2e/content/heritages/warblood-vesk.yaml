id: heritages.warblood-vesk
type: heritage
fields: { ancestry: ancestries.vesk }
choices:
  - id: attacks
    pick: 2
    activate: false
    from:
      items:
        - features.ancestry.vesk-claw
        - features.ancestry.vesk-jaws
        - features.ancestry.vesk-tail
grants:
  - item: feats.ancestry.brutal-anatomy
    when: size(picksOf('attacks')) > 0
    waivePrerequisites: true
    choices: { attack: [{ option: { formula: "picksOf('attacks')[0]" } }] }
  - item: feats.ancestry.brutal-anatomy
    when: size(picksOf('attacks')) > 1
    waivePrerequisites: true
    choices: { attack: [{ option: { formula: "picksOf('attacks')[1]" } }] }
