id: forms.aerial-form.bat
type: effect
standardCopies:
  - {
      type: weapon,
      where: 'item.id == @weapons.forms.aerial-form.bat-fangs || item.id == @weapons.forms.aerial-form.bat-wing',
    }
effects:
  - { target: battleForm.speed, op: set, value: 20, scope: applied }
  - { target: speed.fly, op: atLeast, value: 30, scope: applied }
