id: classes.mystic.connections.elemental
type: feature
fields: { level: 1, classOption: mystic.connection }
effects:
  - { target: mystic.connection, op: set, value: "'elemental'" }
  - { target: spellcasting.tradition, op: set, value: "'primal'" }
  - target: skills.trained
    op: grant
    value: { tag: skill.nature }
    when: "!('skill.nature' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.recharge-weapon } }
  - { target: spells.granted.cantrips, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.shifting-surge } }
  - { target: spells.repertoire.rank1, op: grant, value: { item: spells.shifting-surge } }
  - { target: spells.granted.rank1, op: add, value: 1 }
  - target: spells.repertoire
    op: grant
    value: { item: spells.resist-energy }
    when: 'level >= 3'
  - target: spells.repertoire.rank2
    op: grant
    value: { item: spells.resist-energy }
    when: 'level >= 3'
  - { target: spells.granted.rank2, op: add, value: 1, when: 'level >= 3' }
  - target: spells.repertoire
    op: grant
    value: { item: spells.levitate }
    when: 'level >= 5'
  - target: spells.repertoire.rank3
    op: grant
    value: { item: spells.levitate }
    when: 'level >= 5'
  - { target: spells.granted.rank3, op: add, value: 1, when: 'level >= 5' }
  - target: spells.repertoire
    op: grant
    value: { item: spells.wall-of-fire }
    when: 'level >= 7'
  - target: spells.repertoire.rank4
    op: grant
    value: { item: spells.wall-of-fire }
    when: 'level >= 7'
  - { target: spells.granted.rank4, op: add, value: 1, when: 'level >= 7' }
  - target: spells.repertoire
    op: grant
    value: { item: spells.elemental-form }
    when: 'level >= 9'
  - target: spells.repertoire.rank5
    op: grant
    value: { item: spells.elemental-form }
    when: 'level >= 9'
  - { target: spells.granted.rank5, op: add, value: 1, when: 'level >= 9' }
  - target: spells.repertoire
    op: grant
    value: { item: spells.promession }
    when: 'level >= 11'
  - target: spells.repertoire.rank6
    op: grant
    value: { item: spells.promession }
    when: 'level >= 11'
  - { target: spells.granted.rank6, op: add, value: 1, when: 'level >= 11' }
  - target: spells.repertoire
    op: grant
    value: { item: spells.absolute-zero }
    when: 'level >= 13'
  - target: spells.repertoire.rank7
    op: grant
    value: { item: spells.absolute-zero }
    when: 'level >= 13'
  - { target: spells.granted.rank7, op: add, value: 1, when: 'level >= 13' }
  - target: spells.repertoire
    op: grant
    value: { item: spells.earthquake }
    when: 'level >= 15'
  - target: spells.repertoire.rank8
    op: grant
    value: { item: spells.earthquake }
    when: 'level >= 15'
  - { target: spells.granted.rank8, op: add, value: 1, when: 'level >= 15' }
  - target: spells.repertoire
    op: grant
    value: { item: spells.falling-stars }
    when: 'level >= 17'
  - target: spells.repertoire.rank9
    op: grant
    value: { item: spells.falling-stars }
    when: 'level >= 17'
  - { target: spells.granted.rank9, op: add, value: 1, when: 'level >= 17' }
  - { target: focus.points, op: add, value: 1 }
grants:
  - { item: spells.recharge-weapon }
  - { item: spells.shifting-surge }
  - { item: spells.resist-energy, when: 'level >= 3' }
  - { item: spells.levitate, when: 'level >= 5' }
  - { item: spells.wall-of-fire, when: 'level >= 7' }
  - { item: spells.elemental-form, when: 'level >= 9' }
  - { item: spells.promession, when: 'level >= 11' }
  - { item: spells.absolute-zero, when: 'level >= 13' }
  - { item: spells.earthquake, when: 'level >= 15' }
  - { item: spells.falling-stars, when: 'level >= 17' }
  - { item: spells.elemental-weapon }
  - { item: feats.general.shield-block, waivePrerequisites: true }
keepsTemplates:
  - template: templates.elemental.air
    content:
      type: spell
      where: item.id == @spells.wall-of-fire || item.id == @spells.absolute-zero
    when: >-
      countList(character.applied, x.active
        && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier)) > 0
        && filterList(character.applied, x.active
          && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier))[0]
          .state.element == 'air'
  - template: templates.elemental.earth
    content:
      type: spell
      where: item.id == @spells.wall-of-fire || item.id == @spells.absolute-zero
    when: >-
      countList(character.applied, x.active
        && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier)) > 0
        && filterList(character.applied, x.active
          && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier))[0]
          .state.element == 'earth'
  - template: templates.elemental.fire
    content:
      type: spell
      where: item.id == @spells.wall-of-fire || item.id == @spells.absolute-zero
    when: >-
      countList(character.applied, x.active
        && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier)) > 0
        && filterList(character.applied, x.active
          && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier))[0]
          .state.element == 'fire'
  - template: templates.elemental.metal
    content:
      type: spell
      where: item.id == @spells.wall-of-fire || item.id == @spells.absolute-zero
    when: >-
      countList(character.applied, x.active
        && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier)) > 0
        && filterList(character.applied, x.active
          && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier))[0]
          .state.element == 'metal'
  - template: templates.elemental.water
    content:
      type: spell
      where: item.id == @spells.wall-of-fire || item.id == @spells.absolute-zero
    when: >-
      countList(character.applied, x.active
        && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier)) > 0
        && filterList(character.applied, x.active
          && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier))[0]
          .state.element == 'water'
  - template: templates.elemental.wood
    content:
      type: spell
      where: item.id == @spells.wall-of-fire || item.id == @spells.absolute-zero
    when: >-
      countList(character.applied, x.active
        && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier)) > 0
        && filterList(character.applied, x.active
          && (x.source == @spells.elemental-weapon || x.source == @spells.elemental-barrier))[0]
          .state.element == 'wood'
