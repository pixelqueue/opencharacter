id: classes.witchwarper.anchors.core-memories
type: feature
fields: { level: 1 }
state: { used: { type: boolean, default: false } }
effects:
  - target: { steps: [turn.start] }
    op: changes
    when: self.used
    value:
      changes:
        - type: setState
          picks: { where: 'item.id == @classes.witchwarper.anchors.core-memories && self.used' }
          key: used
          value: false
actions:
  - id: anchoring-effect
    tags: [class-action]
    available: '!self.used && countList(character.applied, x.active && x.source == @conditions.stupefied) > 0'
    results: [anchored]
    steps:
      - id: reduce
        kind: changes
        changes:
          - type: adjustState
            applied: { where: 'item.id == @conditions.stupefied' }
            key: value
            by: -1
          - type: removeEffect
            applied: { where: 'item.id == @conditions.stupefied && self.value <= 1' }
          - { type: setState, pick: self, key: used, value: true }
      - { id: result, kind: outcome, result: "'anchored'" }
  - id: core-memory
    tags: [class-action, exploration-action]
    results: [chosen]
    steps:
      - id: skill
        kind: choice
        recommend: 'options[0]'
        options:
          - id: acrobatics
            when: "'skill.acrobatics' in skills.trained || 'skill.acrobatics' in skills.chosen"
            changes:
              - { type: set, field: witchwarper.memorySkill, value: "'skill.acrobatics'" }
          - id: arcana
            when: "'skill.arcana' in skills.trained || 'skill.arcana' in skills.chosen"
            changes: [{ type: set, field: witchwarper.memorySkill, value: "'skill.arcana'" }]
          - id: athletics
