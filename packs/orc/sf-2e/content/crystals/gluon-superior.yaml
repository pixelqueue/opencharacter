id: crystals.gluon-superior
type: template
tags: [crystal.orbital, trait.magical]
appliesTo: { type: weapon, where: "'solar' in item.tags" }
fields: { price: '(has(prior.price) ? prior.price : 0) + 61400', level: 'max(prior.level, 15)' }
effects:
  - target: { steps: [strike.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: "'conditions.persistent-damage'"
          state: { damage: '1d10', damageType: "'bleed'" }
