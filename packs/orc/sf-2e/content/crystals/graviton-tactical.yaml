id: crystals.graviton-tactical
type: template
tags: [crystal.orbital, trait.magical]
appliesTo: { type: weapon, where: "'solar' in item.tags" }
fields: { price: '(has(prior.price) ? prior.price : 0) + 45000', level: 'max(prior.level, 14)' }
effects:
  - target: { rolls: [damage.strike], from: self }
    op: add
    value: 'dieOf(1d6, 1)'
    tags: [{ formula: "'damage.' + roll.item.damageType" }]
    when: "solarian.attunement in ['graviton', 'perfect']"
