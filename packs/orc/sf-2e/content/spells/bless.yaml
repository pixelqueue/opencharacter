id: spells.bless
type: spell
tags:
  - tradition.divine
  - tradition.occult
  - trait.aura
  - trait.concentrate
  - trait.manipulate
  - trait.mental
# Cast on yourself: each cast projects its emanation, which the app places on allies inside.
# Sustaining the spell to widen it is `widen`.
fields:
  rank: 1
  cast: two
  area: emanation
  areaSize: 15
  duration: minutes
  durationAmount: 1
  applyTo: self
state:
  widened: { type: integer, default: 0, min: 0 }
effects:
  - target: { fields: { where: "'attack' in item.tags" } }
    op: add
    value: 1
    stackKey: status-bonus
    scope: applied
auras:
  - id: blessing
    scope: applied
    size: item.areaSize + 10 * self.widened
    affects: allies
    effects:
      - target: { fields: { where: "'attack' in item.tags" } }
        op: add
        value: 1
        stackKey: status-bonus
        scope: applied
actions:
  - id: widen
    tags: [spell]
    scope: applied
    available: self.appliedBy == '' || self.appliedBy == character.id
    steps:
      - id: widen
        kind: changes
        changes: [{ type: adjustState, entry: self, key: widened, by: 1 }]
