id: spells.gouging-claw
type: spell
tags:
  - tradition.arcane
  - tradition.primal
  - trait.attack
  - trait.cantrip
  - trait.concentrate
  - trait.manipulate
  - trait.morph
fields:
  rank: 1
  cast: two
  range: 0
  targets: 1
  defense: ac
  damage: '2d6'
  damageType: slashing
  heighten: 1
  heightenDice: 1
  persistentBonus: 2
  heightenPersistentBonus: 1
  persistentType: bleed
  persistentScales: true
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell-cast], from: self }
    op: params
    value:
      damageType: { type: enum, values: [piercing, slashing], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.damageType) ? params.damageType : item.damageType' } }
