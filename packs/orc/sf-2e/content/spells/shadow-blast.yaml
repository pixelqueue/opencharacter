id: spells.shadow-blast
type: spell
tags: [tradition.divine, tradition.occult, trait.concentrate, trait.manipulate, trait.shadow]
fields:
  rank: 5
  cast: two
  defense: will
  basic: true
  damage: '6d8'
  damageType: force
  heighten: 1
  heightenDice: 1
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell-cast], from: self }
    op: params
    value:
      damageType:
        {
          type: enum,
          values:
            [acid, bludgeoning, cold, electricity, fire, force, piercing, slashing, sonic, spirit],
          optional: true,
        }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.damageType) ? params.damageType : item.damageType' } }
