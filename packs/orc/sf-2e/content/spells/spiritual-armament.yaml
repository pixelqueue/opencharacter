id: spells.spiritual-armament
type: spell
tags:
  - tradition.divine
  - tradition.occult
  - trait.concentrate
  - trait.manipulate
  - trait.sanctified
  - trait.spirit
fields:
  rank: 2
  cast: two
  range: 120
  targets: 1
  defense: ac
  sustained: true
  duration: minutes
  durationAmount: 1
  damage: '2d8'
  damageType: slashing
  heighten: 2
  heightenDice: 1
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell-cast], from: self }
    op: params
    value:
      damageType: { type: enum, values: [bludgeoning, piercing, slashing, spirit], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.damageType) ? params.damageType : item.damageType' } }
