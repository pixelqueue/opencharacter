id: spells.enlarge
type: spell
tags: [tradition.arcane, tradition.primal, trait.concentrate, trait.manipulate, trait.polymorph]
fields:
  rank: 2
  cast: two
  range: 30
  targets: 1
  duration: minutes
  durationAmount: 5
  applyTo: ally
effects:
  - target: creature.size
    op: set
    value: "self.rank >= 4 ? 'huge' : 'large'"
    scope: applied
  - target: { rolls: [damage.strike] }
    op: add
    value: 'self.rank >= 4 ? 4 : 2'
    stackKey: status-bonus
    tags: [{ formula: "'damage.' + roll.item.damageType" }]
    when: roll.item.range == 0
    scope: applied
grants: [{ item: conditions.clumsy, scope: applied }]
