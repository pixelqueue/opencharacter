id: spells.resist-energy
type: spell
tags:
  - tradition.arcane
  - tradition.divine
  - tradition.occult
  - tradition.primal
  - trait.concentrate
  - trait.manipulate
fields:
  rank: 2
  cast: two
  range: 0
  targets: 1
  duration: minutes
  durationAmount: 10
  applyTo: ally
  damageType: fire
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell], from: self }
    op: params
    value:
      resistType: { type: enum, values: [acid, cold, electricity, fire, sonic], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.resistType) ? params.resistType : item.damageType' } }
  - target: { incoming: { fields: [hp.current] } }
    op: add
    stackKey: resistance
    value: 'min(-incoming.amount, self.rank >= 7 ? 15 : self.rank >= 4 ? 10 : 5)'
    when: "incoming.amount < 0 && ('damage.' + self.damageType) in incoming.tags"
    scope: applied
