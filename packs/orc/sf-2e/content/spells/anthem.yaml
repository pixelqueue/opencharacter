id: spells.anthem
type: spell
tags:
  - trait.concentrate
  - trait.emotion
  - trait.focus
  - trait.manipulate
  - trait.mental
  - trait.mystic
  - trait.uncommon
# Pass the bonded creatures in the area as allies (yourself too, when bonded).
fields:
  rank: 1
  cast: one
  area: emanation
  areaSize: 60
  sustained: true
  duration: minutes
  durationAmount: 1
  applyTo: ally
effects:
  - target: { fields: { where: "'attack' in item.tags || 'damage' in item.tags" } }
    op: add
    value: 1
    stackKey: status-bonus
    scope: applied
  - target: { rolls: [save] }
    op: add
    value: 1
    stackKey: status-bonus
    when: situational.againstFascinatedOrConfused
    scope: applied
