id: features.envoy.style.through-desperate-times
type: feature
fields: { level: 1 }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.medicine }
    when: "!('skill.medicine' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
grants: [{ item: feats.skill.battle-medicine, waivePrerequisites: true }]
