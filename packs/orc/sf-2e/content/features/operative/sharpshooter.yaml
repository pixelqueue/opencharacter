id: features.operative.sharpshooter
type: feature
fields: { level: 1 }
effects:
  - target: operative.aimDice
    op: set
    value: 'level >= 17 ? 4 : level >= 11 ? 3 : level >= 5 ? 2 : 1'
    when: class.has.operative
  - id: aim
    target: { rolls: [damage.strike] }
    op: add
    value: 'dieOf(operative.aimDie == 6 ? 1d6 : 1d4, operative.aimDice)'
    tags: [precision, { formula: "'damage.' + roll.item.damageType" }]
    when: "(situational.markedTarget || (size(participants.target) > 0 && participants.target[0].id != '' && participants.target[0].id in [operative.mark, operative.mark2])) && (roll.item.range > 0 && roll.item.area == 'none' || operative.striker && roll.item.range == 0 && ('trait.agile' in roll.item.tags || 'trait.finesse' in roll.item.tags) && (roll.item.hands == 1 || roll.item.category == 'unarmed')) && situational.rangeIncrement <= operative.aimRange"
  - target: { steps: [turn.start] }
    op: changes
    when: "operative.mark != '' || operative.mark2 != ''"
    value:
      changes:
        - { type: set, when: "operative.mark != ''", field: operative.mark, value: "''" }
        - { type: set, when: "operative.mark2 != ''", field: operative.mark2, value: "''" }
actions:
  - id: aim
    tags: [aim, class-action, trait.concentrate]
    available: "countCopies(copy.type == 'weapon' && (copy.equipped || 'standard' in copy.tags) && (has(copy.fields.range) && copy.fields.range > 0 && copy.fields.area == 'none' || operative.striker && copy.fields.range == 0 && ('trait.agile' in copy.tags || 'trait.finesse' in copy.tags)) && (!has(copy.fields.magazine) || copy.fields.magazine == 0 || has(copy.state.ammo) && copy.state.ammo >= copy.fields.expend) && (!('solar' in copy.tags) || solarian.attunement != 'unattuned') && (!('attuned.photon' in copy.tags) || solarian.attunement in ['photon', 'perfect']) && (!('attuned.graviton' in copy.tags) || solarian.attunement == 'graviton')) > 0"
    participants: { target: { min: 1, max: 2 } }
    results: [aiming]
    steps:
      - id: designate
        kind: changes
        changes:
          - { type: set, field: operative.mark, value: 'participants.target[0].id' }
          - type: set
            when: 'size(participants.target) > 1 && @feats.operative.dual-aim in feats.held'
            field: operative.mark2
            value: 'participants.target[1].id'
      - { id: result, kind: outcome, result: "'aiming'", data: { dice: operative.aimDice } }
