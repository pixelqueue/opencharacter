id: features.spellcasting.archetype-repertoire
type: feature
fields: { level: 2 }
state:
  source: { type: string, default: mystic }
choices:
  - id: cantrips
    pick: "fieldOf('spellcasting.archetype.{archetypeSource}.cantrips', self.source)"
    from:
      type: spell
      where: >-
        'trait.cantrip' in item.tags && !('trait.focus' in item.tags)
          && ('tradition.' + fieldOf('spellcasting.archetype.{archetypeSource}.tradition', self.source)) in item.tags
          && (!('trait.uncommon' in item.tags) || item.id in spells.access)
    effects:
      - {
          target: spells.archetype.mystic.repertoire,
          op: grant,
          value: { formula: pick.id },
          when: "self.source == 'mystic'",
        }
      - {
          target: spells.archetype.witchwarper.repertoire,
          op: grant,
          value: { formula: pick.id },
          when: "self.source == 'witchwarper'",
        }
  - id: spells
    slots: [1, 2, 3, 4, 5, 6, 7, 8]
    when: level >= [4, 6, 8, 12, 14, 16, 18, 20][slot - 1]
    pick: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', self.source, slot)"
    from:
      type: spell
      where: >-
        !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= slot
          && ('tradition.' + fieldOf('spellcasting.archetype.{archetypeSource}.tradition', self.source)) in item.tags
          && (!('trait.uncommon' in item.tags) || item.id in spells.access)
    effects:
      - {
          target: spells.archetype.mystic.repertoire,
          op: grant,
          value: { formula: pick.id },
          when: "self.source == 'mystic'",
        }
      - {
          target: spells.archetype.witchwarper.repertoire,
          op: grant,
          value: { formula: pick.id },
          when: "self.source == 'witchwarper'",
        }
      - target:
          {
            fields:
              {
                where: "item.id == 'orc-sf-2e:spells.archetype.mystic.repertoire.rank' + string(slot)",
              },
          }
        op: grant
        value: { formula: pick.id }
        when: "self.source == 'mystic'"
      - target:
          {
            fields:
              {
                where: "item.id == 'orc-sf-2e:spells.archetype.witchwarper.repertoire.rank' + string(slot)",
              },
          }
        op: grant
        value: { formula: pick.id }
        when: "self.source == 'witchwarper'"
