id: features.solarian.re-forge-solar-weapon
type: feature
fields: { level: 1 }
actions:
  - id: re-forge-solar-weapon
    tags: [class-action, exploration-action]
    results: [re-forged]
    steps:
      - id: weapon
        kind: choice
        recommend: 'options[0]'
        options: { copies: { type: weapon, where: "'solar-weapon' in item.tags" } }
      - id: group
        kind: choice
        recommend: "'sword'"
        options:
          - { id: axe }
          - { id: brawling }
          - { id: club }
          - { id: flail }
          - { id: hammer }
          - { id: knife }
          - { id: pick }
          - { id: polearm }
          - { id: spear }
          - { id: sword }
      - id: type
        kind: choice
        recommend: "'slashing'"
        options: [{ id: bludgeoning }, { id: piercing }, { id: slashing }]
      - id: traits
        kind: choice
        repeat: { max: 2, min: 0 }
        recommend: "'#done'"
        options:
          values:
            - disarm
            - free-hand
            - grapple
            - nonlethal
            - parry
            - shove
            - sweep
            - trip
            - versatile
            - reach
            - two-hand
            - agile
            - twin
          where: >-
            picks == 0
              && (!(value in ['agile', 'twin']) || @feats.solarian.twin-weapons in feats.held)
              && (value in ['reach', 'two-hand'] ? size(steps.traits.picked) == 0
                : countList(steps.traits.picked, x in ['reach', 'two-hand']) == 0)
      - id: apply
        kind: changes
        changes:
          - type: removeTemplate
            forEach: 'filterList(steps.weapon.self.templates, x in solarian.forms)'
            entry: { formula: steps.weapon.picked }
            template: x
          - type: applyTemplate
            entry: { formula: steps.weapon.picked }
            template: "'templates.solar.group-' + steps.group.picked"
          - type: applyTemplate
            entry: { formula: steps.weapon.picked }
            template: "'templates.solar.type-' + steps.type.picked"
          - type: applyTemplate
            forEach: steps.traits.picked
            entry: { formula: steps.weapon.picked }
            template: "'templates.solar.trait-' + x"
      - { id: result, kind: outcome, result: "'re-forged'" }
