id: features.solarian.solar-manifestations
type: feature
fields: { level: 1 }
effects:
  - target: { rolls: [damage.strike] }
    op: add
    value: ceil(level / 2)
    tags: [damage.fire]
    when: "'solar-weapon' in roll.item.tags && solarian.attunement in ['photon', 'perfect']"
  - target: { steps: [strike.hit.critical] }
    op: changes
    when: "'solar-flare' in action.item.tags && solarian.attunement in ['photon', 'perfect']"
    value:
      changes:
        - type: applyEffect
          source: "'conditions.persistent-damage'"
          state: { damage: '1d6', damageType: "'fire'" }
actions:
  - id: nimbus-surge
    tags: [reaction, class-action]
    available: "solarian.attunement != 'unattuned'"
    participants: { target: { min: 1, max: 1 } }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: 'options[0]'
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0 && item.area == 'none' && (!('solar' in item.tags) || solarian.attunement != 'unattuned') && (!('attuned.photon' in item.tags) || solarian.attunement in ['photon', 'perfect']) && (!('attuned.graviton' in item.tags) || solarian.attunement == 'graviton') && (item.magazine == 0 || self.ammo >= item.expend)"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
        params: { reaction: true }
      - id: result
        kind: outcome
        result: steps.strike.result
        data: { damage: steps.strike.data.damage }
standardCopies:
  - type: weapon
    where: "'solar' in item.tags && !('solar-flare-dedication' in item.tags)"
