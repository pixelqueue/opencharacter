id: features.solarian.dedication-solar-nimbus
type: feature
fields: { level: 6 }
actions:
  - id: nimbus-surge
    tags: [reaction, class-action]
    available: "solarian.attunement != 'unattuned'"
    participants: { target: { min: 1, max: 1 } }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: 'options[0]'
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0 && item.area == 'none' && (!('solar' in item.tags) || solarian.attunement != 'unattuned') && (!('attuned.photon' in item.tags) || solarian.attunement in ['photon', 'perfect']) && (!('attuned.graviton' in item.tags) || solarian.attunement == 'graviton') && (item.magazine == 0 || self.ammo >= item.expend)"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
        params: { reaction: true }
      - id: result
        kind: outcome
        result: steps.strike.result
        data: { damage: steps.strike.data.damage }
