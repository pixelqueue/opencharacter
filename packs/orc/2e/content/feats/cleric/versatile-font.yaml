id: feats.cleric.versatile-font
type: feat
fields: { level: 2, category: class, class: classes.cleric }
prerequisites:
  - { id: font, when: "spellcasting.font != 'none'" }
# The deity is the player's own, so taking this allows both heal and harm in the font's slots.
effects:
  - { target: spellcasting.fontEither, op: set, value: true }
