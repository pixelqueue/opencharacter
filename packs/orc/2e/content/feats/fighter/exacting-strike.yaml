id: feats.fighter.exacting-strike
type: feat
tags: [trait.press]
fields: { level: 1, category: class, class: classes.fighter }

# The feat holds the Strike's changes and releases its attack count only if the Strike didn't fail.
actions:
  - id: exacting-strike
    tags: [strike]
    available: turn.attacks > 0
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        # The first weapon that fits, in sheet order, so an automatic run strikes.
        recommend: options[0]
        options: { copies: { type: weapon, where: "self.equipped || 'standard' in item.tags" } }
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        hold: true
        participants: { target: participants.target }
      - id: pass
        kind: changes
        release:
          steps: [strike]
          where: "steps.strike.result != 'failure' || !('attack-count' in change.tags)"
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
