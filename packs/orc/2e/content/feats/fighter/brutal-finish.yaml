id: feats.fighter.brutal-finish
type: feat
tags: [trait.press, archetype-feat]
fields: { level: 12, category: class, class: classes.fighter }
actions:
  - id: brutal-finish
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        tags: [strike.brutal-finish]
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
effects:
  - target: { rolls: [strike.brutal-finish] }
    op: add
    value: 'dieOf(roll.item.damage, level >= 18 ? 2 : 1)'
    tags: [{ formula: "'damage.' + roll.item.damageType" }]
    when: "'damage' in roll.tags"
