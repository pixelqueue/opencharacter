id: feats.fighter.snagging-strike
type: feat
tags: [archetype-feat]
fields: { level: 1, category: class, class: classes.fighter }

actions:
  - id: snagging-strike
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        # The first weapon that fits, in sheet order, so an automatic run strikes.
        recommend: options[0]
        options: { copies: { type: weapon, where: "self.equipped || 'standard' in item.tags" } }
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: snag
        kind: changes
        when: "steps.strike.result in ['success', 'critical-success']"
        to: target
        changes:
          - { type: applyEffect, source: "'conditions.off-guard'" }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
