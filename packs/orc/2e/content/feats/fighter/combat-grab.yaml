id: feats.fighter.combat-grab
type: feat
tags: [trait.press, archetype-feat]
fields: { level: 2, category: class, class: classes.fighter }
actions:
  - id: combat-grab
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: grab
        kind: changes
        when: "steps.strike.result in ['success', 'critical-success'] && size(participants.target) > 0"
        to: target
        changes:
          - { type: applyEffect, source: "'conditions.grabbed'" }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
