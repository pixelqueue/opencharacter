id: feats.fighter.double-slice
type: feat
fields: { level: 1, category: class, class: classes.fighter }

# Both Strikes count toward the multiple attack penalty, but it doesn't rise until after the second.
# Both hit the one target, so their changes are held and released together: each damage type is one
# change for resistances and weaknesses, and the two counts are one adjust of 2.
actions:
  - id: double-slice
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    available: >-
      countCopies(copy.type == 'weapon' && copy.equipped && copy.fields.range == 0) > 0
    steps:
      - id: first
        kind: choice
        # The first weapon that fits, in sheet order, so an automatic run strikes.
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0"
      - id: second
        kind: choice
        # The first weapon that fits, in sheet order, so an automatic run strikes.
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: >-
              (self.equipped || 'standard' in item.tags) && item.range == 0
                && self.id != steps.first.picked
      - id: strike1
        kind: action
        use: strike
        entry: steps.first.picked
        hold: true
        participants: { target: participants.target }
      - id: strike2
        kind: action
        use: strike
        entry: steps.second.picked
        hold: true
        tags: [strike.double-slice]
        params: { attack: 'min(3, turn.attacks + 1)' }
        participants: { target: participants.target }
      - id: deal
        kind: changes
        release: { steps: [strike1, strike2], combine: true }
      - id: result
        kind: outcome
        result: steps.strike2.result
        data:
          first: steps.strike1.result
          damage: steps.strike1.data.damage + steps.strike2.data.damage

effects:
  - target: { rolls: [strike.double-slice] }
    op: add
    value: -2
    when: "'attack' in roll.tags && !('trait.agile' in roll.item.tags)"
