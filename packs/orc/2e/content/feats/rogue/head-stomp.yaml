id: feats.rogue.head-stomp
type: feat
fields: { level: 4, category: class, class: classes.rogue }

actions:
  - id: head-stomp
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        # The first weapon that fits, in sheet order, so an automatic run strikes.
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.category == 'unarmed' && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: stomp
        kind: changes
        when: "steps.strike.result in ['success', 'critical-success']"
        to: target
        changes:
          - type: applyEffect
            source: "'conditions.stupefied'"
            state: { value: "steps.strike.result == 'critical-success' ? 2 : 1" }
          - { type: applyEffect, source: "'conditions.off-guard'" }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
