id: feats.rogue.tactical-debilitations
type: feat
fields: { level: 10, category: class, class: classes.rogue }
prerequisites:
  - { id: racket, when: "rogue.racket == 'scoundrel'" }
  - { id: debilitating, when: 'classLevel.rogue >= 9' }
effects:
  - target: { choices: [debilitation] }
    op: option
    value:
      id: no-reactions
      to: target
      changes:
        - { type: applyEffect, source: "'classes.rogue.debilitations.no-reactions'" }
  - target: { choices: [debilitation] }
    op: option
    value:
      id: no-flanking-tactical
      to: target
      changes:
        - { type: applyEffect, source: "'classes.rogue.debilitations.no-flanking'" }
