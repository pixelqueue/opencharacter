id: feats.rogue.vicious-debilitations
type: feat
fields: { level: 10, category: class, class: classes.rogue }
prerequisites:
  - { id: racket, when: "rogue.racket == 'ruffian'" }
  - { id: debilitating, when: 'classLevel.rogue >= 9' }
effects:
  - target: { choices: [debilitation] }
    op: option
    value:
      id: weakness
      to: target
      changes:
        - {
            type: applyEffect,
            source: "'classes.rogue.debilitations.weakness'",
            state: { debilitation: true, duration: "'next-end'" },
          }
  - target: { choices: [debilitation] }
    op: option
    value:
      id: clumsy
      to: target
      changes:
        - {
            type: applyEffect,
            source: "'conditions.clumsy'",
            state: { value: 1, debilitation: true, duration: "'next-end'" },
          }
