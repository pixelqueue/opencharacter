id: feats.druid.wind-caller
type: feat
fields: { level: 8, category: class, class: classes.druid }
prerequisites:
  - id: storm-order
    when: "'druid-order.storm' in druid.orders"
effects:
  - { target: focus.points, op: add, value: 1 }
  - { target: druid.orderSpells, op: grant, value: { item: spells.stormwind-flight } }
grants:
  - item: spells.stormwind-flight
