id: feats.ancestry.otherworldly-acumen
type: feat
fields: { level: 9, category: ancestry, ancestry: ancestries.elf }
prerequisites:
  - id: innate
    when: '@feats.ancestry.otherworldly-magic in feats.held'
choices:
  - id: spell
    from:
      {
        type: spell,
        where: "item.rank == 2 && 'tradition.arcane' in item.tags && !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)",
      }
    effects:
      - { target: spells.innate, op: grant, value: { formula: pick.id } }
