id: feats.ancestry.sure-feet
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.halfling }
effects:
  - target: { rolls: [skill.acrobatics], tally: successToCrit }
    op: add
    value: 1
    when: "'skill-action.balance' in roll.tags"
  - target: { rolls: [skill.athletics], tally: successToCrit }
    op: add
    value: 1
    when: "'skill-action.climb' in roll.tags"
