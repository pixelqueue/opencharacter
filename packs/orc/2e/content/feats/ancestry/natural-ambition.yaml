id: feats.ancestry.natural-ambition
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.human }

choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: "item.category == 'class' && item.level <= 1 && !('trait.archetype' in item.tags)"
    eligible: >-
      countCopies(copy.type == 'class' && has(item.class) && copy.item == item.class) > 0
        || countList(item.tags, x in class.traits) > 0
