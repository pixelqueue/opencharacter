id: feats.ancestry.catfolk-lore
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.catfolk }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.acrobatics }
    when: "!('skill.acrobatics' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.survival }
    when: "!('skill.survival' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.catfolk }
    when: "!('skill.lore.catfolk' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 3 }
  - target: skills.lore.catfolk.rank
    op: atLeast
    value: 'level >= 15 ? 4 : level >= 7 ? 3 : level >= 3 ? 2 : 1'
