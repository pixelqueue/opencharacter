            - item: spells.humanoid-form
        - id: revealing-light
          effects:
            - { target: spells.innate, op: grant, value: { item: spells.revealing-light } }
          grants:
            - item: spells.revealing-light
        - id: share-life
          effects:
            - { target: spells.innate, op: grant, value: { item: spells.share-life } }
