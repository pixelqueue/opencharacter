id: feats.ancestry.aggravating-scratch
type: feat
tags: [trait.disease]
fields: { level: 9, category: ancestry, ancestry: ancestries.catfolk }
prerequisites:
  - {
      id: claws,
      when: 'countCopies(copy.item in [@weapons.catfolk-claw, @weapons.lizardfolk-claw, @weapons.hag-claw, @weapons.slag-claw, @weapons.bestial-claw]) > 0',
    }
effects:
  - target: { steps: [strike.hit.critical] }
    op: changes
    when: 'action.item.id in [@weapons.catfolk-claw, @weapons.lizardfolk-claw, @weapons.hag-claw, @weapons.slag-claw, @weapons.bestial-claw]'
    value:
      changes:
        - type: applyEffect
          source: "'conditions.persistent-damage'"
          state: { damage: 1d4, damageType: "'poison'" }
