id: feats.ancestry.divine-dragonblood
type: feat
tags: [trait.lineage]
fields: { level: 1, category: ancestry, heritage: heritages.dragonblood }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.religion }
    when: "!('skill.religion' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 1 }
  - target: { rolls: [perception] }
    op: add
    value: 1
    stackKey: circumstance-bonus
    when: situational.initiative
