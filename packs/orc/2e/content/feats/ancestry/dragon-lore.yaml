id: feats.ancestry.dragon-lore
type: feat
fields: { level: 1, category: ancestry, heritage: heritages.dragonblood }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.diplomacy }
    when: "!('skill.diplomacy' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.intimidation }
    when: "!('skill.intimidation' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.dragon }
    when: "!('skill.lore.dragon' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 3 }
  - target: skills.lore.dragon.rank
    op: atLeast
    value: 'level >= 15 ? 4 : level >= 7 ? 3 : level >= 3 ? 2 : 1'
