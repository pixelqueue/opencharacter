id: feats.ancestry.earned-glory
type: feat
fields: { level: 1, category: ancestry, heritage: heritages.aiuvarin }
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.performance },
      when: "!('skill.performance' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
grants:
  - { item: feats.skill.impressive-performance, waivePrerequisites: true }
