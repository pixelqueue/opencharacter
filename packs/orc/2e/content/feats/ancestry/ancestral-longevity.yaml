# The skill is a pick the app changes at daily preparations; a rank doesn't say where its training
# came from, so the rule that it can't count for prerequisites isn't enforced.
id: feats.ancestry.ancestral-longevity
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.elf }
choices:
  - id: skill
    unique: skill-training
    from:
      values:
        [
          skill.acrobatics,
          skill.arcana,
          skill.athletics,
          skill.crafting,
          skill.deception,
          skill.diplomacy,
          skill.intimidation,
          skill.medicine,
          skill.nature,
          skill.occultism,
          skill.performance,
          skill.religion,
          skill.society,
          skill.stealth,
          skill.survival,
          skill.thievery,
        ]
      where: '!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks'
    effects:
      - { target: skills.chosen, op: grant, value: { formula: pick.value } }
