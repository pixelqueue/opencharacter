id: feats.ancestry.evolved-spellhorn
type: feat
fields: { level: 9, category: ancestry, ancestry: ancestries.kobold }
prerequisites:
  - { id: spellhorn, when: '@heritages.spellhorn-kobold in heritages.held' }
choices:
  - id: rank1
    from:
      type: spell
      where: >-
        !('trait.cantrip' in item.tags) && item.rank == 1 && 'tradition.arcane' in item.tags
          && !('trait.uncommon' in item.tags) && !('trait.rare' in item.tags) && !('trait.unique' in item.tags) && !('trait.focus' in item.tags)
    effects:
      - { target: spells.innate, op: grant, value: { formula: pick.id } }
  - id: rank2
    from:
      type: spell
      where: >-
        !('trait.cantrip' in item.tags) && item.rank == 2 && 'tradition.arcane' in item.tags
          && !('trait.uncommon' in item.tags) && !('trait.rare' in item.tags) && !('trait.unique' in item.tags) && !('trait.focus' in item.tags)
    effects:
      - { target: spells.innate, op: grant, value: { formula: pick.id } }
