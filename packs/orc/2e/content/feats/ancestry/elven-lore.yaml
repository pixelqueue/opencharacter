id: feats.ancestry.elven-lore
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.elf }
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.arcana },
      when: "!('skill.arcana' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.nature },
      when: "!('skill.nature' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.lore.elf },
      when: "!('skill.lore.elf' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 3 }
  - target: skills.lore.elf.rank
    op: atLeast
    value: 'level >= 15 ? 4 : level >= 7 ? 3 : level >= 3 ? 2 : 1'
