id: feats.ancestry.gnome-obsession
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.gnome }
choices:
  - id: lore
    from:
      values:
        [
          skill.lore.academia,
          skill.lore.circus,
          skill.lore.farming,
          skill.lore.legal,
          skill.lore.scribing,
          skill.lore.underworld,
          skill.lore.warfare,
          skill.lore.alcohol,
          skill.lore.art,
          skill.lore.cooking,
          skill.lore.engineering,
          skill.lore.fortune-telling,
          skill.lore.games,
          skill.lore.genealogy,
          skill.lore.gladiatorial,
          skill.lore.guild,
          skill.lore.heraldry,
          skill.lore.herbalism,
          skill.lore.labor,
          skill.lore.mercantile,
          skill.lore.mining,
          skill.lore.sailing,
          skill.lore.tanning,
          skill.lore.theater,
          skill.lore.cave,
          skill.lore.desert,
          skill.lore.forest,
          skill.lore.mountain,
          skill.lore.plains,
          skill.lore.swamp,
          skill.lore.dwarf,
          skill.lore.elf,
          skill.lore.goblin,
          skill.lore.halfling,
          skill.lore.leshy,
          skill.lore.orc,
        ]
    effects:
      - {
          target: skills.trained,
          op: grant,
          value: { formula: pick.value },
          when: '!(pick.value in skills.chosen)',
        }
      - { target: skills.trainings, op: add, value: 1 }
      - { target: assurance.skills, op: grant, value: { formula: pick.value } }
      - target: { fields: { where: "'skill-rank' in item.tags && pick.value in item.tags" } }
        op: atLeast
        value: 'level >= 15 ? 4 : level >= 7 ? 3 : 2'
        when: level >= 3
