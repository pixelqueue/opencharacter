id: feats.ancestry.gnome-obsession
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.gnome }
choices:
  - id: lore
    from:
      values: { formula: skills.lores }
    effects:
      - {
          target: skills.trained,
          op: grant,
          value: { formula: pick.value },
          when: '!(pick.value in skills.chosen)',
        }
      - { target: skills.trainings, op: add, value: 1 }
      - { target: assurance.skills, op: grant, value: { formula: pick.value } }
      - target: { fields: { where: "'skill-rank' in item.tags && pick.value in item.tags" } }
        op: atLeast
        value: 'level >= 15 ? 4 : level >= 7 ? 3 : 2'
        when: level >= 3
