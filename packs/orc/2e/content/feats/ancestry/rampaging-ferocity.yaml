id: feats.ancestry.rampaging-ferocity
type: feat
fields: { level: 17, category: ancestry, ancestry: ancestries.orc }
prerequisites:
  - id: orc-ferocity
    when: '@feats.ancestry.orc-ferocity in feats.held'
actions:
  - id: rampaging-ferocity
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
