id: feats.ancestry.solar-rejuvenation
type: feat
fields: { level: 9, category: ancestry, ancestry: ancestries.leshy }
actions:
  - id: solar-rest
    tags: [feat-action]
    steps:
      - id: heal
        kind: changes
        changes:
          - type: adjust
            field: hp.current
            by: 'max(0, attributes.con.mod * floor(level / 2))'
            tags: [healing]
