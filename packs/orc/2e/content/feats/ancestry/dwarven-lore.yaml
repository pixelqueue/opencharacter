id: feats.ancestry.dwarven-lore
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.dwarf }
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.crafting },
      when: "!('skill.crafting' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.religion },
      when: "!('skill.religion' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.lore.dwarf },
      when: "!('skill.lore.dwarf' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 3 }
  - target: skills.lore.dwarf.rank
    op: atLeast
    value: 'level >= 15 ? 4 : level >= 7 ? 3 : level >= 3 ? 2 : 1'
