id: feats.ancestry.duskwalker-lore
type: feat
fields: { level: 1, category: ancestry, heritage: heritages.duskwalker }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.medicine }
    when: "!('skill.medicine' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.religion }
    when: "!('skill.religion' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.afterlife }
    when: "!('skill.lore.afterlife' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 3 }
  - target: skills.lore.afterlife.rank
    op: atLeast
    value: 'level >= 15 ? 4 : level >= 7 ? 3 : level >= 3 ? 2 : 1'
