id: feats.ancestry.hobgoblin-lore
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.hobgoblin }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.athletics }
    when: "!('skill.athletics' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.crafting }
    when: "!('skill.crafting' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.hobgoblin }
    when: "!('skill.lore.hobgoblin' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 3 }
  - target: skills.lore.hobgoblin.rank
    op: atLeast
    value: 'level >= 15 ? 4 : level >= 7 ? 3 : level >= 3 ? 2 : 1'
