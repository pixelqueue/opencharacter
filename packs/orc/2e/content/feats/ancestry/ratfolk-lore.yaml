id: feats.ancestry.ratfolk-lore
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.ratfolk }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.acrobatics }
    when: "!('skill.acrobatics' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.stealth }
    when: "!('skill.stealth' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.ratfolk }
    when: "!('skill.lore.ratfolk' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 3 }
  - target: skills.lore.ratfolk.rank
    op: atLeast
    value: 'level >= 15 ? 4 : level >= 7 ? 3 : level >= 3 ? 2 : 1'
