id: feats.ancestry.beast-trainer
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.orc }
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.nature },
      when: "!('skill.nature' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from: { items: [feats.general.pet, feats.skill.train-animal] }
