id: feats.ancestry.avenge-ally
type: feat
tags: [trait.fortune]
fields: { level: 13, category: ancestry, ancestry: ancestries.elf }
actions:
  - id: avenge-ally
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "self.equipped || 'standard' in item.tags"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        situational: { fortune: true }
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
