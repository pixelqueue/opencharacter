id: feats.ancestry.nephilim-resistance
type: feat
fields: { level: 5, category: ancestry, heritage: heritages.nephilim }
choices:
  - id: type
    from:
      options:
        - id: acid
          effects:
            - target: { incoming: { fields: [hp.current], tags: [damage.acid] } }
              op: add
              stackKey: resistance
              value: min(-incoming.amount, 5)
              when: incoming.amount < 0
        - id: cold
