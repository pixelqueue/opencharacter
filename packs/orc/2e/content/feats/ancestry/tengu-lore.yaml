id: feats.ancestry.tengu-lore
type: feat
fields: { level: 1, category: ancestry, ancestry: ancestries.tengu }
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.society }
    when: "!('skill.society' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.survival }
    when: "!('skill.survival' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.tengu }
    when: "!('skill.lore.tengu' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 3 }
  - target: skills.lore.tengu.rank
    op: atLeast
    value: 'level >= 15 ? 4 : level >= 7 ? 3 : level >= 3 ? 2 : 1'
