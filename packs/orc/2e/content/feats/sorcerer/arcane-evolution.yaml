id: feats.sorcerer.arcane-evolution
type: feat
fields: { level: 4, category: class, class: classes.sorcerer }
prerequisites:
  - { id: tradition, when: "spellcasting.tradition == 'arcane'" }
effects:
  - target: spells.signature
    op: grant
    value: { formula: sorcerer.evolutionSignature }
    when: sorcerer.evolutionSignature != ''
  - target: spells.repertoire
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != ''
  - target: spells.repertoire.rank1
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 1
  - target: spells.repertoire.rank2
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 2
  - target: spells.repertoire.rank3
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 3
  - target: spells.repertoire.rank4
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 4
  - target: spells.repertoire.rank5
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 5
  - target: spells.repertoire.rank6
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 6
  - target: spells.repertoire.rank7
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 7
  - target: spells.repertoire.rank8
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 8
  - target: spells.repertoire.rank9
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 9
  - target: spells.repertoire.rank10
    op: grant
    value: { formula: sorcerer.evolutionSpell }
    when: sorcerer.evolutionSpell != '' && sorcerer.evolutionRank == 10
# The day's spell, granted so it can be cast.
grants:
  - { item: { formula: sorcerer.evolutionSpell }, when: "sorcerer.evolutionSpell != ''" }
actions:
  - id: add-spell
    tags: [spell]
    available: sorcerer.evolutionSpell == ''
    results: [added]
    steps:
      - id: spell
        kind: choice
        options:
          content:
            type: spell
            where: >-
              'tradition.arcane' in item.tags && !('trait.cantrip' in item.tags)
                && !('trait.focus' in item.tags) && !(item.id in spells.repertoire)
                && item.rank <= spellcasting.maxRank
                && (!('trait.uncommon' in item.tags) || item.id in spells.access)
        changes:
          - { type: set, field: sorcerer.evolutionSpell, value: picked.id }
          - { type: set, field: sorcerer.evolutionRank, value: picked.item.rank }
      - id: result
        kind: outcome
        result: "'added'"
choices:
  - id: skill
    unique: skill-training
    from:
      values: { formula: skills.offered }
      where: '!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks'
    effects:
      - { target: skills.chosen, op: grant, value: { formula: pick.value } }
