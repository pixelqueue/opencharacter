id: feats.monk.stumbling-stance
type: feat
tags: [trait.stance, archetype-feat]
fields: { level: 1, category: class, class: classes.monk }
prerequisites:
  - { id: deception, when: 'skills.deception.rank >= 1' }
actions:
  - id: stumbling-stance
    tags: [stance]
    steps:
      - id: enter
        kind: changes
        changes:
          - type: removeEffect
            applied: { where: "'trait.stance' in item.tags" }
          - { type: applyEffect, source: "'effects.stumbling-stance'" }
