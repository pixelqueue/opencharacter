id: feats.monk.master-qi-spells
type: feat
fields: { level: 16, category: class, class: classes.monk }
repeatable: true
prerequisites:
  - id: qi-spells
    when: '@feats.monk.qi-spells in feats.held'
effects:
  - { target: focus.points, op: add, value: 1 }
choices:
  - id: spell
    unique: qi-spells
    requiresOption: true
    from:
      options:
        - id: medusas-wrath
          grants:
            - item: spells.medusas-wrath
        - id: touch-of-death
          grants:
            - item: spells.touch-of-death
