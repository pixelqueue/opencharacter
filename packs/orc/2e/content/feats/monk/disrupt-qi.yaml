id: feats.monk.disrupt-qi
type: feat
tags: [trait.void]
fields: { level: 12, category: class, class: classes.monk }
actions:
  - id: disrupt-qi
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "'unarmed' in item.tags || item.category == 'unarmed'"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: disrupt
        kind: changes
        when: "steps.strike.result in ['success', 'critical-success'] && size(participants.target) > 0"
        to: target
        changes:
          - type: applyEffect
            source: "'conditions.persistent-damage'"
            state: { damage: 'level >= 18 ? 3d6 : 2d6', damageType: "'void'" }
          - { type: applyEffect, source: "'conditions.enfeebled'", state: { value: 1 } }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
