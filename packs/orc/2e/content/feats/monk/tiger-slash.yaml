id: feats.monk.tiger-slash
type: feat
tags: [archetype-feat]
fields: { level: 6, category: class, class: classes.monk }
prerequisites:
  - { id: tiger-stance, when: '@feats.monk.tiger-stance in feats.held' }
actions:
  - id: tiger-slash
    tags: [strike]
    available: stance.current == 'tiger'
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        # The first weapon that fits, in sheet order, so an automatic run strikes.
        recommend: options[0]
        options:
          copies: { type: weapon, where: 'item.id == @weapons.unarmed.tiger-claw' }
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        tags: [strike.tiger-slash]
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
effects:
  - target: { rolls: [strike.tiger-slash] }
    op: add
    value: 'dieOf(roll.item.damage, level >= 14 ? 3 : 2)'
    tags: [{ formula: "'damage.' + roll.item.damageType" }]
    when: "'damage' in roll.tags"
