id: feats.monk.one-inch-punch
type: feat
fields: { level: 6, category: class, class: classes.monk }
prerequisites:
  - { id: expert-strikes, when: attacks.unarmed.rank >= 2 }
actions:
  - id: one-inch-punch
    tags: [strike]
    params:
      actions: { type: integer, optional: true, min: 2, max: 3 }
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        # The first weapon that fits, in sheet order, so an automatic run strikes.
        recommend: options[0]
        options: { copies: { type: weapon, where: "'unarmed' in item.tags" } }
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        tags:
          - formula: >-
              has(params.actions) && params.actions == 3 ? 'strike.one-inch-punch.three'
                : 'strike.one-inch-punch'
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
effects:
  - target: { rolls: [strike.one-inch-punch] }
    op: add
    value: >-
      dieOf(roll.item.damage, ('strike.one-inch-punch.three' in roll.tags ? 2 : 1)
        * (level >= 18 ? 3 : level >= 10 ? 2 : 1))
    tags: [{ formula: "'damage.' + roll.item.damageType" }]
    when: "'damage' in roll.tags"
