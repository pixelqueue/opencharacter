id: feats.witch.sympathetic-strike
type: feat
fields: { level: 4, category: class, class: classes.witch }
prerequisites:
  - { id: armaments, when: '@feats.witch.witchs-armaments in feats.held' }
actions:
  - id: sympathetic-strike
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: 'item.id in [@weapons.witch-eldritch-nails, @weapons.witch-iron-teeth, @weapons.witch-living-hair]'
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
          hexPenalty: "steps.strike.result == 'critical-success' ? 2 : steps.strike.result == 'success' ? 1 : 0"
