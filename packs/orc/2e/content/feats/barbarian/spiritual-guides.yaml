id: feats.barbarian.spiritual-guides
type: feat
tags: [trait.fortune, trait.reaction]
fields: { level: 4, category: class, class: classes.barbarian }

prerequisites:
  - { id: instinct, when: "barbarian.instinct == 'spirit'" }
state:
  used: { type: boolean, default: false }
# Once a day, a failed (not critically) Perception or skill check is rerolled on the check's
# `check.reroll` step; the new result stands. Daily preparations reset `used`.
effects:
  - target: { choices: [check.reroll] }
    op: option
    when: >-
      !self.used && steps.roll.band == 'failure'
        && ('skill' in params.check.tags || 'perception' in params.check.tags)
    value:
      id: spiritual-guides
      flags: { reroll: 1 }
      changes: [{ type: setState, pick: owner, key: used, value: true }]
