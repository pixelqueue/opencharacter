id: feats.barbarian.draconic-arrogance
type: feat
tags: [trait.rage]
fields: { level: 1, category: class, class: classes.barbarian }

prerequisites:
  - { id: instinct, when: "barbarian.instinct == 'dragon'" }
effects:
  - target: { rolls: [save] }
    op: add
    value: 2
    stackKey: status-bonus
    when: rage.active && (situational.againstEmotion || situational.againstFear)
