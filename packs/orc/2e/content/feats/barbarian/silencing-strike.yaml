id: feats.barbarian.silencing-strike
type: feat
tags: [trait.incapacitation, trait.rage]
fields: { level: 10, category: class, class: classes.barbarian }
actions:
  - id: silencing-strike
    tags: [strike]
    available: rage.active
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
          dc: classDc.barbarian.value
