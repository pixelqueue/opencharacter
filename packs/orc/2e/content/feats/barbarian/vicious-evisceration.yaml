id: feats.barbarian.vicious-evisceration
type: feat
tags: [trait.rage]
fields: { level: 18, category: class, class: classes.barbarian }
actions:
  - id: vicious-evisceration
    tags: [strike]
    available: rage.active
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: drain
        kind: changes
        when: "steps.strike.result in ['success', 'critical-success'] && size(participants.target) > 0"
        to: target
        changes:
          - type: applyEffect
            source: "'conditions.drained'"
            state: { value: "steps.strike.result == 'critical-success' ? 2 : 1" }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
