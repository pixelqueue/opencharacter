id: feats.oracle.trial-by-skyfire
type: feat
tags: [trait.cursebound, trait.fire]
fields: { level: 10, category: class, class: classes.oracle }
prerequisites:
  - { id: mystery, when: "oracle.mystery == 'cosmos' || oracle.mystery == 'flames'" }
actions:
  - id: trial-by-skyfire
    tags: [class-action]
    available: oracle.cursebound < oracle.curseMax
    results: [used]
    steps:
      - id: curse
        kind: changes
        changes:
          - { type: adjust, field: oracle.cursebound, by: 1 }
      - id: result
        kind: outcome
        result: "'used'"
