id: feats.oracle.domain-acumen
type: feat
fields: { level: 2, category: class, class: classes.oracle }
repeatable: true
choices:
  - id: domain
    unique: initial-domains
    requiresOption: true
    from:
      options:
        - id: air
          prerequisites:
            - { id: mystery, when: "oracle.mystery == 'tempest'" }
          effects:
            - { target: focus.points, op: add, value: 1 }
          grants:
            - item: spells.pushing-gust
        - id: darkness
          prerequisites:
            - { id: mystery, when: "oracle.mystery == 'cosmos'" }
          effects:
            - { target: focus.points, op: add, value: 1 }
          grants:
            - item: spells.cloak-of-shadow
        - id: death
          prerequisites:
            - {
                id: mystery,
                when: "oracle.mystery == 'ancestors' || oracle.mystery == 'bones' || oracle.mystery == 'life'",
              }
          effects:
            - { target: focus.points, op: add, value: 1 }
          grants:
            - item: spells.deaths-call
        - id: destruction
          prerequisites:
            - { id: mystery, when: "oracle.mystery == 'battle'" }
          effects:
            - { target: focus.points, op: add, value: 1 }
          grants:
