id: feats.oracle.thousand-visions
type: feat
tags: [trait.cursebound, trait.prediction]
fields: { level: 4, category: class, class: classes.oracle }
actions:
  - id: thousand-visions
    tags: [class-action]
    available: oracle.cursebound < oracle.curseMax
    results: [used]
    steps:
      - id: curse
        kind: changes
        changes:
          - { type: adjust, field: oracle.cursebound, by: 1 }
      - id: result
        kind: outcome
        result: "'used'"
