id: feats.ranger.perfect-shot
type: feat
tags: [trait.flourish]
fields: { level: 18, category: class, class: classes.ranger }
actions:
  - id: perfect-shot
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    available: >-
      countCopies(copy.type == 'weapon' && copy.equipped && copy.fields.range > 0) > 0
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: 'self.equipped && item.range > 0'
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        participants: { target: participants.target }
      - id: count
        kind: changes
        changes:
          - { type: adjust, field: turn.flourishes, by: 1 }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
