id: feats.ranger.disrupt-prey
type: feat
tags: [trait.reaction]
fields: { level: 4, category: class, class: classes.ranger }

actions:
  - id: disrupt-prey
    tags: [strike, reaction]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        # The first weapon that fits, in sheet order, so an automatic run strikes.
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        params: { reaction: true }
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
