        - id: animal-feature
          grants:
            - item: spells.animal-feature
        - id: enlarge-companion
          grants:
            - item: spells.enlarge-companion
        - id: hunters-luck
          grants:
            - item: spells.hunters-luck
        - id: soothing-mist
          grants:
            - item: spells.soothing-mist
        - id: ephemeral-tracking
          grants:
            - item: spells.ephemeral-tracking
        - id: rangers-bramble
          grants:
            - item: spells.rangers-bramble
