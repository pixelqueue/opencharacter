id: feats.champion.aura-of-life
type: feat
fields: { level: 14, category: class, class: classes.champion }
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.void] } }
    op: add
    stackKey: resistance
    value: min(-incoming.amount, 5)
    when: incoming.amount < 0
  - target: { rolls: [save] }
    op: add
    value: 1
    stackKey: status-bonus
    when: situational.againstVoid
auras:
  - id: life
    # The champion's aura ends while the champion is unconscious.
    when: countList(character.applied, x.active && x.source == @conditions.unconscious) == 0
    size: champion.auraSize
    affects: allies
    effects:
      - target: { incoming: { fields: [hp.current], tags: [damage.void] } }
        op: add
        stackKey: resistance
        value: min(-incoming.amount, 5)
        when: incoming.amount < 0
        scope: applied
      - target: { rolls: [save] }
        op: add
        value: 1
        stackKey: status-bonus
        when: situational.againstVoid
        scope: applied
