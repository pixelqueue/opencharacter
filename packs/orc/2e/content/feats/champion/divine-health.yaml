id: feats.champion.divine-health
type: feat
fields: { level: 2, category: class, class: classes.champion }
effects:
  - target: { rolls: [save] }
    op: add
    value: 2
    stackKey: status-bonus
    when: situational.againstPoison || situational.againstDisease
  - target: { rolls: [save], tally: successToCrit }
    op: add
    value: 1
    when: situational.againstPoison || situational.againstDisease
  - target: { rolls: [save], tally: critFailToFail }
    op: add
    value: 1
    when: level >= 9 && (situational.againstPoison || situational.againstDisease)
