id: feats.bard.reflexive-courage
type: feat
tags: [trait.auditory, trait.concentrate]
fields: { level: 8, category: class, class: classes.bard }
prerequisites:
  - { id: warrior, when: "'muse.warrior' in bard.muses" }
actions:
  - id: reflexive-courage
    tags: [reaction]
    available: >-
      countList(character.applied, x.active && x.source == @spells.courageous-anthem) > 0
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "(self.equipped || 'standard' in item.tags) && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        params: { reaction: true }
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
