id: feats.skill.specialty-crafting
type: feat
fields: { level: 1, category: skill, skills: [skill.crafting] }
repeatable: true

prerequisites:
  - id: trained
    when: 'skills.crafting.rank >= 1'
choices:
  - id: specialty
    from:
      {
        values:
          [
            alchemy,
            artistry,
            blacksmithing,
            bookmaking,
            glassmaking,
            leatherworking,
            pottery,
            shipbuilding,
            stonemasonry,
            tailoring,
            weaving,
            woodworking,
          ],
      }
