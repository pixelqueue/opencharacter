id: feats.skill.skill-training
type: feat
fields: { level: 1, category: skill, skills: [skill] }
repeatable: true

prerequisites:
  - id: int
    when: 'attributes.int.mod >= 1'
choices:
  - id: skill
    unique: skill-training
    from:
      values: { formula: skills.offered + skills.lores }
      where: '!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks'
    effects:
      - { target: skills.chosen, op: grant, value: { formula: pick.value } }
