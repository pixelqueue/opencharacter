id: feats.skill.assurance
type: feat
tags: [trait.fortune]
fields: { level: 1, category: skill, skills: [skill] }
repeatable: true

# Any skill, or a Lore the character is trained in. Content that grants Assurance for a skill it
# names presets the choice.
choices:
  - id: skill
    from:
      values:
        formula: >-
          ['skill.acrobatics', 'skill.arcana', 'skill.athletics', 'skill.crafting',
            'skill.deception', 'skill.diplomacy', 'skill.intimidation', 'skill.medicine',
            'skill.nature', 'skill.occultism', 'skill.performance', 'skill.religion',
            'skill.society', 'skill.stealth', 'skill.survival', 'skill.thievery']
            + sortList(skills.trained + skills.chosen)
    effects:
      - { target: assurance.skills, op: grant, value: { formula: pick.value } }

# Assurance reads only the skill's rank field. A roll step with no dice isn't a checkpoint, and the
# `degree` bands read its total against the DC with no natural 20 or 1; the step's only tag is
# `assurance`, so no check effect applies. A skill without Assurance gets no result: the step is
# skipped and the check fails.
actions:
  - id: assurance
    tags: [check, assurance]
    params:
      skill: { type: id, of: field, where: "'skill-rank' in item.tags" }
      dc: { type: integer, optional: true }
    results: { bands: degree }
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags: { dc: 'has(params.dc) ? params.dc : -1' }
      - id: fixed
        kind: roll
        when: countList(params.skill.tags, x in assurance.skills) > 0
        tags: [assurance]
        bands: degree
        parts:
          - value: '10 + (params.skill.value > 0 ? 2 * params.skill.value + proficiency.level : proficiency.untrained)'
      - id: result
        kind: outcome
        result: "has(steps.fixed) ? steps.fixed.band : 'failure'"
        data:
          total: 'has(steps.fixed) ? steps.fixed.total : 0'
          dc: flags.dc
