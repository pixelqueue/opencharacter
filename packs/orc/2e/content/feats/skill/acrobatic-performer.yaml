id: feats.skill.acrobatic-performer
type: feat
fields: { level: 1, category: skill, skills: [skill.acrobatics] }

prerequisites:
  - { id: trained, when: 'skills.acrobatics.rank >= 1' }
effects:
  - target: { rolls: [skill-action.perform] }
    op: add
    value: 1
    stackKey: circumstance-bonus
    when: "'skill.acrobatics' in roll.tags && skills.performance.rank >= 1"
