id: feats.alchemist.regurgitate-mutagen
type: feat
tags: [trait.manipulate]
fields: { level: 4, category: class, class: classes.alchemist }
actions:
  - id: regurgitate-mutagen
    tags: [class-action]
    available: 'countList(character.applied, x.active && x.source in [@consumables.bestial-mutagen-lesser, @consumables.bestial-mutagen-moderate, @consumables.bestial-mutagen-greater, @consumables.bestial-mutagen-major, @consumables.cognitive-mutagen-lesser, @consumables.cognitive-mutagen-moderate, @consumables.cognitive-mutagen-greater, @consumables.cognitive-mutagen-major, @consumables.juggernaut-mutagen-lesser, @consumables.juggernaut-mutagen-moderate, @consumables.juggernaut-mutagen-greater, @consumables.juggernaut-mutagen-major, @consumables.quicksilver-mutagen-lesser, @consumables.quicksilver-mutagen-moderate, @consumables.quicksilver-mutagen-greater, @consumables.quicksilver-mutagen-major, @consumables.serene-mutagen-lesser, @consumables.serene-mutagen-moderate, @consumables.serene-mutagen-greater, @consumables.serene-mutagen-major, @consumables.silvertongue-mutagen-lesser, @consumables.silvertongue-mutagen-moderate, @consumables.silvertongue-mutagen-greater, @consumables.silvertongue-mutagen-major, @consumables.drakeheart-mutagen-lesser, @consumables.drakeheart-mutagen-moderate, @consumables.drakeheart-mutagen-greater, @consumables.drakeheart-mutagen-major]) > 0'
    results: [spat]
    steps:
      - id: damage
        kind: roll
        tags: [damage, damage.acid]
        parts: [{ dice: 'dieOf(1d6, max(1, floor(level / 2)))' }]
      - id: end
        kind: changes
        changes:
          - type: removeEffect
            applied: { where: "'trait.mutagen' in item.tags" }
      - id: result
        kind: outcome
        result: "'spat'"
        data: { damage: steps.damage.total, dc: classDc.alchemist.value }
