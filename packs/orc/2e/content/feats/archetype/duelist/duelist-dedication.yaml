    value: { item: feats.fighter.dueling-parry }
  - target: { fields: { where: "'archetype-extra.at8' in item.tags" } }
    op: grant
    value: { item: feats.fighter.disarming-stance }
  - target: { fields: { where: "'archetype-extra.at10' in item.tags" } }
    op: grant
    value: { item: feats.fighter.dueling-riposte }
  - target: { fields: { where: "'archetype-extra.at12' in item.tags" } }
    op: grant
    value: { item: feats.fighter.disarming-twist }
  - target: { fields: { where: "'archetype-extra.at14' in item.tags" } }
    op: grant
    value: { item: feats.fighter.dueling-dance-fighter }
  - target: { fields: { where: "'archetype-extra.at14' in item.tags" } }
    op: grant
    value: { item: feats.fighter.improved-dueling-riposte }
  - target: { fields: { where: "'archetype-extra.at16' in item.tags" } }
