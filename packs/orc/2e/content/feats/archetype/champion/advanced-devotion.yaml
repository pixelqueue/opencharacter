id: feats.archetype.champion.advanced-devotion
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.champion }
repeatable: true

prerequisites:
  - { id: basic-devotion, when: '@feats.archetype.champion.basic-devotion in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.champion.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.champion || 'trait.champion' in item.tags)
    eligible: item.level <= floor(level / 2)
