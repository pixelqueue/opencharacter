id: feats.archetype.champion.basic-devotion
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.champion }
prerequisites:
  - { id: champion-dedication, when: '@feats.archetype.champion.champion-dedication in feats.held' }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.champion || 'trait.champion' in item.tags)
    eligible: item.level <= 2
