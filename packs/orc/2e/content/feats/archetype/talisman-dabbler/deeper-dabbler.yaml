id: feats.archetype.talisman-dabbler.deeper-dabbler
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 8, category: class, archetype: archetypes.talisman-dabbler }
repeatable: true

prerequisites:
  - {
      id: talisman-dabbler-dedication,
      when: '@feats.archetype.talisman-dabbler.talisman-dabbler-dedication in feats.held',
    }
  - id: retake-level
    when: 'archetypes.talismanDabbler.deeperDabblers <= (level >= 14 ? 2 : 1)'
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.talismanDabbler.deeperDabblers, op: add, value: 1 }
