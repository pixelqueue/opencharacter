id: feats.archetype.eldritch-archer.enchanting-shot
type: feat
tags: [trait.archetype, trait.magical, archetype-feat]
fields: { level: 8, category: class, archetype: archetypes.eldritch-archer }
prerequisites:
  - {
      id: eldritch-archer-dedication,
      when: '@feats.archetype.eldritch-archer.eldritch-archer-dedication in feats.held',
    }
actions:
  - id: enchanting-shot
    tags: [strike]
    available: "countCopies(copy.type == 'weapon' && copy.equipped && has(copy.fields.group) && copy.fields.group in ['bow', 'crossbow']) > 0"
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "self.equipped && item.group in ['bow', 'crossbow']"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        tags: [strike.enchanting-shot]
        participants: { target: participants.target }
      - id: hit
        kind: changes
        when: "steps.strike.result in ['success', 'critical-success'] && size(participants.target) > 0"
        to: target
        changes:
          - type: applyEffect
            when: "steps.strike.result == 'critical-success'"
            source: "'conditions.stunned'"
            state: { value: 1 }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
effects:
  - target: { rolls: [strike.enchanting-shot] }
    op: add
    value: 'dieOf(1d6, roll.item.dice >= 4 ? 4 : roll.item.dice >= 3 ? 3 : 2)'
    tags: [damage.mental]
    when: "'damage' in roll.tags"
