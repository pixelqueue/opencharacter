id: feats.archetype.barbarian.advanced-fury
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.barbarian }
repeatable: true

prerequisites:
  - { id: basic-fury, when: '@feats.archetype.barbarian.basic-fury in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.barbarian.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.barbarian || 'trait.barbarian' in item.tags)
    eligible: item.level <= floor(level / 2)
