id: feats.archetype.fighter.advanced-maneuver
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.fighter }
repeatable: true

prerequisites:
  - { id: basic-maneuver, when: '@feats.archetype.fighter.basic-maneuver in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.fighter.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.fighter || 'trait.fighter' in item.tags)
    eligible: item.level <= floor(level / 2)
