id: feats.archetype.fighter.basic-maneuver
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.fighter }
prerequisites:
  - { id: fighter-dedication, when: '@feats.archetype.fighter.fighter-dedication in feats.held' }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.fighter || 'trait.fighter' in item.tags)
    eligible: item.level <= 2
