id: feats.archetype.fighter.diverse-weapon-expert
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 12, category: class, archetype: archetypes.fighter }
prerequisites:
  - { id: fighter-dedication, when: '@feats.archetype.fighter.fighter-dedication in feats.held' }
  - {
      id: weapon-expert,
      when: 'attacks.simple.rank >= 2 || attacks.martial.rank >= 2 || attacks.advanced.rank >= 2 || attacks.unarmed.rank >= 2',
    }
effects:
  - { target: attacks.simple.rank, op: atLeast, value: 2 }
  - { target: attacks.martial.rank, op: atLeast, value: 2 }
  - { target: attacks.advanced.rank, op: atLeast, value: 1 }
