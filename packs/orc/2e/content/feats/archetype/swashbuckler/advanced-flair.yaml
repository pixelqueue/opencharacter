id: feats.archetype.swashbuckler.advanced-flair
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.swashbuckler }
repeatable: true

prerequisites:
  - { id: basic-flair, when: '@feats.archetype.swashbuckler.basic-flair in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.swashbuckler.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.swashbuckler || 'trait.swashbuckler' in item.tags)
    eligible: item.level <= floor(level / 2)
