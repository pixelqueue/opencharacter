id: feats.archetype.swashbuckler.finishing-precision
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.swashbuckler }

# Precise strike stays at 1: the class's increases by level aren't granted.
prerequisites:
  - {
      id: swashbuckler-dedication,
      when: '@feats.archetype.swashbuckler.swashbuckler-dedication in feats.held',
    }
effects:
  - { target: swashbuckler.preciseStrike, op: atLeast, value: 1 }
grants:
  - item: features.swashbuckler.precise-strike
