id: feats.archetype.martial-artist.grievous-blow
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 8, category: class, archetype: archetypes.martial-artist }

prerequisites:
  - {
      id: martial-artist-dedication,
      when: '@feats.archetype.martial-artist.martial-artist-dedication in feats.held',
    }
actions:
  - id: grievous-blow
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "'unarmed' in item.tags && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        tags: [strike.grievous-blow]
        participants: { target: participants.target }
      - id: count
        kind: changes
        changes:
          - { type: adjust, field: turn.attacks, by: 1 }
          - { type: adjust, field: turn.flourishes, by: 1 }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
effects:
  - target: { rolls: [strike.grievous-blow] }
    op: add
    value: 'dieOf(roll.item.damage, level >= 18 ? 3 : 2)'
    tags: [{ formula: "'damage.' + roll.item.damageType" }]
    when: "'damage' in roll.tags"
