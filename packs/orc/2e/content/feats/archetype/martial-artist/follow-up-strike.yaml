id: feats.archetype.martial-artist.follow-up-strike
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.martial-artist }

prerequisites:
  - {
      id: martial-artist-dedication,
      when: '@feats.archetype.martial-artist.martial-artist-dedication in feats.held',
    }
actions:
  - id: follow-up-strike
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "'unarmed' in item.tags && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        params: { attack: 'max(1, turn.attacks)' }
        participants: { target: participants.target }
      - id: count
        kind: changes
        changes:
          - { type: adjust, field: turn.flourishes, by: 1 }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
