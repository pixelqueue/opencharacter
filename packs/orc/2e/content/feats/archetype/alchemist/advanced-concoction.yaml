id: feats.archetype.alchemist.advanced-concoction
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.alchemist }
repeatable: true

prerequisites:
  - { id: basic-concoction, when: '@feats.archetype.alchemist.basic-concoction in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.alchemist.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.alchemist || 'trait.alchemist' in item.tags)
    eligible: item.level <= floor(level / 2)
