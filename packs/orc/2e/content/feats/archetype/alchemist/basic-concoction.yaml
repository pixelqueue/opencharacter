id: feats.archetype.alchemist.basic-concoction
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.alchemist }
prerequisites:
  - {
      id: alchemist-dedication,
      when: '@feats.archetype.alchemist.alchemist-dedication in feats.held',
    }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.alchemist || 'trait.alchemist' in item.tags)
    eligible: item.level <= 2
