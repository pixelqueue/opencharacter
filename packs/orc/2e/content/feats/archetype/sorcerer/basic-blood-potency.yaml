id: feats.archetype.sorcerer.basic-blood-potency
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.sorcerer }
prerequisites:
  - { id: sorcerer-dedication, when: '@feats.archetype.sorcerer.sorcerer-dedication in feats.held' }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.sorcerer || 'trait.sorcerer' in item.tags)
    eligible: item.level <= 2
