id: feats.archetype.sorcerer.advanced-blood-potency
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.sorcerer }
repeatable: true

prerequisites:
  - { id: basic-blood-potency, when: '@feats.archetype.sorcerer.basic-blood-potency in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.sorcerer.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.sorcerer || 'trait.sorcerer' in item.tags)
    eligible: item.level <= floor(level / 2)
