id: feats.archetype.sorcerer.basic-bloodline-spell
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.sorcerer }
prerequisites:
  - { id: sorcerer-dedication, when: '@feats.archetype.sorcerer.sorcerer-dedication in feats.held' }
effects:
  - { target: focus.points, op: add, value: 1 }
choices:
  - id: spell
    from:
      options:
        - id: aberrant
          prerequisites: [{ id: bloodline, when: "sorcerer.bloodline == 'aberrant'" }]
          effects:
            - {
                target: spells.archetype.sorcerer.spells,
                op: grant,
                value: { item: spells.tentacular-limbs },
              }
          grants:
            - item: spells.tentacular-limbs
        - id: angelic
          prerequisites: [{ id: bloodline, when: "sorcerer.bloodline == 'angelic'" }]
          effects:
            - {
                target: spells.archetype.sorcerer.spells,
                op: grant,
                value: { item: spells.angelic-halo },
              }
          grants:
            - item: spells.angelic-halo
        - id: demonic
          prerequisites: [{ id: bloodline, when: "sorcerer.bloodline == 'demonic'" }]
          effects:
            - {
                target: spells.archetype.sorcerer.spells,
                op: grant,
                value: { item: spells.gluttons-jaws },
              }
          grants:
