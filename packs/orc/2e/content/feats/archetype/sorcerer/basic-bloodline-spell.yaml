          grants:
            - item: spells.flurry-of-claws
        - id: elemental
          prerequisites: [{ id: bloodline, when: "sorcerer.bloodline == 'elemental'" }]
          effects:
            - {
                target: spells.archetype.sorcerer.spells,
                op: grant,
                value: { item: spells.elemental-toss },
