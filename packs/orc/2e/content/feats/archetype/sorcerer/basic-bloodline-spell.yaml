        - id: imperial
          prerequisites: [{ id: bloodline, when: "sorcerer.bloodline == 'imperial'" }]
          effects:
            - {
                target: spells.archetype.sorcerer.spells,
                op: grant,
                value: { item: spells.ancestral-memories },
              }
          grants:
            - item: spells.ancestral-memories
        - id: undead
