id: feats.archetype.druid.basic-wilding
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.druid }
prerequisites:
  - { id: druid-dedication, when: '@feats.archetype.druid.druid-dedication in feats.held' }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.druid || 'trait.druid' in item.tags)
    eligible: item.level <= 2
