id: feats.archetype.rogue.basic-trickery
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.rogue }
prerequisites:
  - { id: rogue-dedication, when: '@feats.archetype.rogue.rogue-dedication in feats.held' }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.rogue || 'trait.rogue' in item.tags)
    eligible: item.level <= 2
