id: feats.archetype.ranger.basic-hunters-trick
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.ranger }
prerequisites:
  - { id: ranger-dedication, when: '@feats.archetype.ranger.ranger-dedication in feats.held' }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.ranger || 'trait.ranger' in item.tags)
    eligible: item.level <= 2
