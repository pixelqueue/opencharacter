id: feats.archetype.familiar-master.familiar-conduit
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.familiar-master }

prerequisites:
  - {
      id: familiar-master-dedication,
      when: '@feats.archetype.familiar-master.familiar-master-dedication in feats.held',
    }
  - {
      id: spellcaster,
      when: "spellcasting.tradition != 'none' || spellcasting.archetype.any || size(spells.innate) > 0 || focus.points > 0",
    }
