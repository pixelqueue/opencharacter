id: feats.archetype.wrestler.suplex
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.wrestler }

# The critical 2d6 isn't doubled.
prerequisites:
  - { id: wrestler-dedication, when: '@feats.archetype.wrestler.wrestler-dedication in feats.held' }
actions:
  - id: suplex
    tags: [strike]
    participants:
      target: { max: 1 }
    results: { bands: degree }
    steps:
      - id: weapon
        kind: choice
        recommend: options[0]
        options:
          copies:
            type: weapon
            where: "'unarmed' in item.tags && item.range == 0"
      - id: strike
        kind: action
        use: strike
        entry: steps.weapon.picked
        tags: [strike.suplex]
        participants: { target: participants.target }
      - id: hit
        kind: changes
        when: "steps.strike.result in ['success', 'critical-success'] && size(participants.target) > 0"
        to: target
        changes:
          - { type: applyEffect, source: "'conditions.prone'" }
      - id: result
        kind: outcome
        result: steps.strike.result
        data:
          damage: steps.strike.data.damage
effects:
  - target: { rolls: [strike.suplex] }
    op: add
    value: 2d6
    tags: [damage.bludgeoning]
    multiplied: false
    when: "'damage' in roll.tags && flags.crit"
