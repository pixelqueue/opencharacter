id: feats.archetype.investigator.investigator-dedication
type: feat
tags: [trait.archetype, trait.dedication, trait.multiclass, archetype-feat]
fields: { level: 2, category: class, archetype: archetypes.investigator }
prerequisites:
  - { id: int, when: 'attributes.int.mod >= 2' }
  - { id: not-investigator, when: 'countCopies(copy.item == @classes.investigator) == 0' }
effects:
  - { target: classDc.investigator.rank, op: atLeast, value: 1 }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.society },
      when: "!('skill.society' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
grants:
  - item: features.investigator.on-the-case
choices:
  - id: free-skill
    unique: skill-training
    pick: 1
    from:
      values:
        [
          skill.acrobatics,
          skill.arcana,
          skill.athletics,
          skill.crafting,
          skill.deception,
          skill.diplomacy,
          skill.intimidation,
          skill.medicine,
          skill.nature,
          skill.occultism,
          skill.performance,
          skill.religion,
          skill.society,
          skill.stealth,
          skill.survival,
          skill.thievery,
        ]
      where: '!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks'
    effects:
      - { target: skills.chosen, op: grant, value: { formula: pick.value } }
