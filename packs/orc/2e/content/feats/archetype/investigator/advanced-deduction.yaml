id: feats.archetype.investigator.advanced-deduction
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.investigator }
repeatable: true

prerequisites:
  - { id: basic-deduction, when: '@feats.archetype.investigator.basic-deduction in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.investigator.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.investigator || 'trait.investigator' in item.tags)
    eligible: item.level <= floor(level / 2)
