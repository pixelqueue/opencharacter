id: feats.archetype.investigator.basic-deduction
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.investigator }
prerequisites:
  - {
      id: investigator-dedication,
      when: '@feats.archetype.investigator.investigator-dedication in feats.held',
    }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.investigator || 'trait.investigator' in item.tags)
    eligible: item.level <= 2
