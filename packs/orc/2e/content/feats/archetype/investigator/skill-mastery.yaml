id: feats.archetype.investigator.skill-mastery
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 8, category: class, archetype: archetypes.investigator }
repeatable: true

# The two picks differ within one taking; taking the feat again may raise the same skills.
prerequisites:
  - {
      id: investigator-dedication,
      when: '@feats.archetype.investigator.investigator-dedication in feats.held',
    }
  - { id: skills, when: "sumFields(f.value >= 2 ? 1 : 0, 'skill-rank' in f.tags) >= 1" }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.investigator.repeats, op: add, value: 1 }
choices:
  - id: to-master
    unique: mastery
    uniqueScope: owner
    from: { values: { formula: skills.offered } }
    eligible: "maxFields(value in f.tags ? f.value : 0, 'skill-rank' in f.tags) == 2 || value in choice.picks"
    effects:
      - target: { fields: { where: "'skill-granted' in item.tags && pick.value in item.tags" } }
        op: add
        value: 1
  - id: to-expert
    unique: mastery
    uniqueScope: owner
    from: { values: { formula: skills.offered } }
    eligible: "maxFields(value in f.tags ? f.value : 0, 'skill-rank' in f.tags) == 1 || value in choice.picks"
    effects:
      - target: { fields: { where: "'skill-granted' in item.tags && pick.value in item.tags" } }
        op: add
        value: 1
  - id: skill-feat
    unique: feats
    from: { type: feat, where: "item.category == 'skill'" }
    eligible: item.level <= level
