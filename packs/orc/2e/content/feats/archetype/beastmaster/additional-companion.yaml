id: feats.archetype.beastmaster.additional-companion
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.beastmaster }
repeatable: true

prerequisites:
  - {
      id: beastmaster-dedication,
      when: '@feats.archetype.beastmaster.beastmaster-dedication in feats.held',
    }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.beastmaster.repeats, op: add, value: 1 }
