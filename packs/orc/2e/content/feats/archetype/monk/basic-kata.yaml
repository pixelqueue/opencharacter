id: feats.archetype.monk.basic-kata
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.monk }
prerequisites:
  - { id: monk-dedication, when: '@feats.archetype.monk.monk-dedication in feats.held' }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.monk || 'trait.monk' in item.tags)
    eligible: item.level <= 2
