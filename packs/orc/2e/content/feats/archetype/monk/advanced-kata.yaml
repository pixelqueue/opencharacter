id: feats.archetype.monk.advanced-kata
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.monk }
repeatable: true

prerequisites:
  - { id: basic-kata, when: '@feats.archetype.monk.basic-kata in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.monk.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.monk || 'trait.monk' in item.tags)
    eligible: item.level <= floor(level / 2)
