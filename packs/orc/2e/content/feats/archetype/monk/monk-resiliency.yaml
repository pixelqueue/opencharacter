id: feats.archetype.monk.monk-resiliency
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 4, category: class, archetype: archetypes.monk }

prerequisites:
  - { id: monk-dedication, when: '@feats.archetype.monk.monk-dedication in feats.held' }
  - { id: class-hp, when: 'hp.class <= 8' }
effects:
  - { target: hp.max, op: add, value: '3 * archetypes.monk.feats' }
