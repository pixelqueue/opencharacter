id: feats.archetype.cleric.advanced-dogma
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.cleric }
repeatable: true

prerequisites:
  - { id: basic-dogma, when: '@feats.archetype.cleric.basic-dogma in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.cleric.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.cleric || 'trait.cleric' in item.tags)
    eligible: item.level <= floor(level / 2)
