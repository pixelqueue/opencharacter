id: feats.archetype.witch.master-witch-spellcasting
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 18, category: class, archetype: archetypes.witch }
prerequisites:
  - { id: expert, when: '@feats.archetype.witch.expert-witch-spellcasting in feats.held' }
  - {
      id: tradition-skill,
      when: "[skills.arcana.rank, skills.religion.rank, skills.occultism.rank, skills.nature.rank][indexOf(['arcane', 'divine', 'occult', 'primal'], spellcasting.archetype.witch.tradition)] >= 4",
    }
effects:
  - { target: spellcasting.archetype.witch.benefits, op: atLeast, value: 3 }
  - { target: spellcasting.archetype.witch.rank, op: atLeast, value: 3 }
