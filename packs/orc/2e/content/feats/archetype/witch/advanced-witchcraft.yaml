id: feats.archetype.witch.advanced-witchcraft
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.witch }
repeatable: true

prerequisites:
  - { id: basic-witchcraft, when: '@feats.archetype.witch.basic-witchcraft in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.witch.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.witch || 'trait.witch' in item.tags)
    eligible: item.level <= floor(level / 2)
