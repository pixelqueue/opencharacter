id: feats.archetype.oracle.advanced-mysteries
type: feat
tags: [trait.archetype, archetype-feat]
fields: { level: 6, category: class, archetype: archetypes.oracle }
repeatable: true

prerequisites:
  - { id: basic-mysteries, when: '@feats.archetype.oracle.basic-mysteries in feats.held' }
effects:
  # Each time it is taken, it counts as another feat of the archetype.
  - { target: archetypes.oracle.repeats, op: add, value: 1 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && !('trait.archetype' in item.tags)
          && (has(item.class) && item.class == @classes.oracle || 'trait.oracle' in item.tags)
    eligible: item.level <= floor(level / 2)
