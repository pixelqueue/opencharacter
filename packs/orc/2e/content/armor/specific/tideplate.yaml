id: armor.specific.tideplate
type: armor
extends: armor.full-plate
tags: [trait.bulwark, trait.invested, trait.magical]
fields:
  price: 1000
grants:
  - { item: spells.water-walk, when: 'self.equipped && self.invested' }
effects:
  - target: { rolls: [skill-action.swim] }
    op: add
    value: 2
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.water-walk'
    value:
      id: water-walk
      flags: { itemPaid: true, rank: 2 }
keepsFields: [price]
keepsTemplates:
  - template: runes.armor-potency-1
    copies: { type: armor, where: 'item.id == @armor.specific.tideplate' }
  - template: runes.resilient
    copies: { type: armor, where: 'item.id == @armor.specific.tideplate' }
