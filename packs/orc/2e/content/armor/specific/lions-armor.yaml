id: armor.specific.lions-armor
type: armor
extends: armor.half-plate
tags: [trait.invested, trait.magical]
fields:
  price: 2000
effects:
  - target: skills.intimidation.mod
    op: add
    value: 2
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
keepsFields: [price]
keepsTemplates:
  - template: runes.armor-potency-2
    copies: { type: armor, where: 'item.id == @armor.specific.lions-armor' }
  - template: runes.resilient
    copies: { type: armor, where: 'item.id == @armor.specific.lions-armor' }
