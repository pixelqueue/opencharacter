id: armor.specific.life-saver-mail
type: armor
extends: armor.splint-mail
tags: [trait.invested, trait.magical]
fields:
  price: 4000
grants:
  - { item: spells.shield, when: 'self.equipped && self.invested' }
  - { item: spells.breath-of-life, when: 'self.equipped && self.invested' }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.shield'
    value:
      id: shield
      flags: { itemPaid: true, rank: 5 }
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.breath-of-life && self.used < 1'
    value:
      id: breath-of-life
      flags: { itemPaid: true, rank: 5 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
keepsFields: [price]
keepsTemplates:
  - template: runes.armor-potency-2
    copies: { type: armor, where: 'item.id == @armor.specific.life-saver-mail' }
  - template: runes.resilient
    copies: { type: armor, where: 'item.id == @armor.specific.life-saver-mail' }
  - template: runes.fortification
    copies: { type: armor, where: 'item.id == @armor.specific.life-saver-mail' }
