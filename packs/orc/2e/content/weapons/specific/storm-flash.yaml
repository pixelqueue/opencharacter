id: weapons.specific.storm-flash
type: weapon
extends: weapons.rapier
tags: [trait.deadly, trait.disarm, trait.electricity, trait.finesse, trait.magical]
fields:
  price: 4000
  bulk: 1
grants:
  - { item: spells.lightning-bolt, when: 'self.equipped' }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.lightning-bolt && self.used < 1'
    value:
      id: lightning-bolt
      flags: { itemPaid: true, rank: 6, dc: 33 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
keepsFields: [price]
keepsTemplates:
  - template: runes.weapon-potency-2
    copies: { type: weapon, where: 'item.id == @weapons.specific.storm-flash' }
  - template: runes.greater-striking
    copies: { type: weapon, where: 'item.id == @weapons.specific.storm-flash' }
  - template: runes.shock
    copies: { type: weapon, where: 'item.id == @weapons.specific.storm-flash' }
