id: materials.silver-shield-high
type: template
tags: [trait.precious, material.silver]
appliesTo:
  {
    type: shield,
    where: 'item.id in [@shields.buckler, @shields.steel-shield, @shields.wooden-shield]',
  }
fields:
  price: '(has(prior.price) ? prior.price : 0) + (base.acBonus == 1 ? 5000 : 5500)'
  hardness: 'base.acBonus == 1 ? 6 : 8'
  hp: 'base.acBonus == 1 ? 24 : 32'
  bt: 'base.acBonus == 1 ? 12 : 16'
