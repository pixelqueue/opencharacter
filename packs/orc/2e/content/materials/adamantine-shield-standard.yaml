id: materials.adamantine-shield-standard
type: template
tags: [trait.precious, material.adamantine, trait.uncommon]
appliesTo:
  {
    type: shield,
    where: 'item.id in [@shields.buckler, @shields.steel-shield, @shields.wooden-shield]',
  }
fields:
  price: '(has(prior.price) ? prior.price : 0) + (base.acBonus == 1 ? 400 : 440)'
  hardness: 'base.acBonus == 1 ? 8 : 10'
  hp: 'base.acBonus == 1 ? 32 : 40'
  bt: 'base.acBonus == 1 ? 16 : 20'
