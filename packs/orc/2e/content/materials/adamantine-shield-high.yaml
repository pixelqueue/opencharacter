id: materials.adamantine-shield-high
type: template
tags: [trait.precious, material.adamantine, trait.uncommon]
appliesTo:
  {
    type: shield,
    where: 'item.id in [@shields.buckler, @shields.steel-shield, @shields.wooden-shield]',
  }
fields:
  price: '(has(prior.price) ? prior.price : 0) + (base.acBonus == 1 ? 8000 : 8800)'
  hardness: 'base.acBonus == 1 ? 11 : 13'
  hp: 'base.acBonus == 1 ? 44 : 52'
  bt: 'base.acBonus == 1 ? 22 : 26'
