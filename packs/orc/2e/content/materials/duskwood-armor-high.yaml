id: materials.duskwood-armor-high
type: template
tags: [trait.precious, material.duskwood, trait.uncommon]
appliesTo: { type: armor }
fields:
  price: '(has(prior.price) ? prior.price : 0) + 32000 + 3200 * max(1, floor(base.bulk))'
  bulk: 'base.bulk >= 2 ? base.bulk - 1 : base.bulk >= 1 ? 0.1 : base.bulk'
  strength: 'has(base.strength) ? max(0, base.strength - 1) : 0'
  speedPenalty: max(0, base.speedPenalty - 5)
