id: materials.cold-iron-shield-standard
type: template
tags: [trait.precious, material.cold-iron]
appliesTo:
  {
    type: shield,
    where: 'item.id in [@shields.buckler, @shields.steel-shield, @shields.wooden-shield]',
  }
fields:
  price: '(has(prior.price) ? prior.price : 0) + (base.acBonus == 1 ? 300 : 340)'
  hardness: 'base.acBonus == 1 ? 5 : 7'
  hp: 'base.acBonus == 1 ? 20 : 28'
  bt: 'base.acBonus == 1 ? 10 : 14'
