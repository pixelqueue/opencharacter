id: materials.orichalcum-shield-high
type: template
tags: [trait.precious, material.orichalcum, trait.rare]
appliesTo:
  {
    type: shield,
    where: 'item.id in [@shields.buckler, @shields.steel-shield, @shields.wooden-shield]',
  }
fields:
  price: '(has(prior.price) ? prior.price : 0) + (base.acBonus == 1 ? 12000 : 13200)'
  hardness: 'base.acBonus == 1 ? 14 : 16'
  hp: 'base.acBonus == 1 ? 56 : 64'
  bt: 'base.acBonus == 1 ? 28 : 32'
