id: materials.dawnsilver-weapon-high
type: template
tags: [trait.precious, material.dawnsilver, trait.uncommon]
appliesTo: { type: weapon }
fields:
  price: '(has(prior.price) ? prior.price : 0) + 13500 + 1350 * max(1, floor(base.bulk))'
  bulk: 'base.bulk >= 2 ? base.bulk - 1 : base.bulk >= 1 ? 0.1 : base.bulk'
