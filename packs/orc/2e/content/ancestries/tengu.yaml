id: ancestries.tengu
type: ancestry
tags: [trait.tengu, trait.humanoid, trait.uncommon, sense.low-light-vision]
fields: { hp: 6, size: medium, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.tengu } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.tengu } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
standardCopies:
  - { type: weapon, where: 'item.id == @weapons.tengu-beak' }
choices:
  - id: heritage
    from:
      type: heritage
      where: 'item.versatile || item.ancestry == @ancestries.tengu'
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.dex.boosts, op: add, value: 1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['dex'])" }
        - id: alternate
          choices:
            - id: free
              pick: 2
              from: { type: boost }
