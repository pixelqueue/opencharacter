id: ancestries.kobold
type: ancestry
tags: [trait.kobold, trait.humanoid, trait.uncommon]
fields: { hp: 6, size: small, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: senses, op: grant, value: { tag: sense.darkvision } }
  - { target: traits, op: grant, value: { tag: trait.kobold } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
  - { target: languages.extra, op: add, value: 1 }
choices:
  - id: heritage
    from:
      type: heritage
      where: 'item.versatile || item.ancestry == @ancestries.kobold'
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.dex.boosts, op: add, value: 1 }
            - { target: attributes.cha.boosts, op: add, value: 1 }
            - { target: attributes.con.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['dex', 'cha'])" }
        - id: alternate
          choices:
            - id: free
              pick: 2
              from: { type: boost }
