id: ancestries.leshy
type: ancestry
tags: [trait.leshy, trait.plant, sense.low-light-vision]
fields: { hp: 8, size: small, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.fey } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.leshy } }
  - target: traits
    op: grant
    value: { tag: trait.plant }
    when: '!(@heritages.fungus-leshy in heritages.held)'
choices:
  - id: heritage
    from:
      type: heritage
      where: 'item.versatile || item.ancestry == @ancestries.leshy'
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.con.boosts, op: add, value: 1 }
            - { target: attributes.wis.boosts, op: add, value: 1 }
            - { target: attributes.int.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['con', 'wis'])" }
        - id: alternate
          choices:
            - id: free
              pick: 2
              from: { type: boost }
