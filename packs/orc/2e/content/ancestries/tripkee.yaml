id: ancestries.tripkee
type: ancestry
tags: [trait.tripkee, trait.humanoid, trait.uncommon, sense.low-light-vision]
fields: { hp: 6, size: small, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.tripkee } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.tripkee } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
  - target: { rolls: [skill-action.climb] }
    op: add
    value: 2
    stackKey: circumstance-bonus
    when: 'true'
choices:
  - id: heritage
    from:
      type: heritage
      where: 'item.versatile || item.ancestry == @ancestries.tripkee'
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.dex.boosts, op: add, value: 1 }
            - { target: attributes.wis.boosts, op: add, value: 1 }
            - { target: attributes.str.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['dex', 'wis'])" }
        - id: alternate
          choices:
            - id: free
              pick: 2
              from: { type: boost }
