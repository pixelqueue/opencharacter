id: ancestries.elf
type: ancestry
tags: [trait.elf, trait.humanoid, sense.low-light-vision]
fields: { hp: 6, size: medium, speed: 30 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.elven } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.elf } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
choices:
  - id: heritage
    from:
      type: heritage
      where: 'item.versatile || item.ancestry == @ancestries.elf'
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.dex.boosts, op: add, value: 1 }
            - { target: attributes.int.boosts, op: add, value: 1 }
            - { target: attributes.con.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['dex', 'int'])" }
        - id: alternate
          choices:
            - id: free
              pick: 2
              from: { type: boost }
