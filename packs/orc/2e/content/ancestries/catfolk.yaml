id: ancestries.catfolk
type: ancestry
tags: [trait.catfolk, trait.humanoid, trait.uncommon, sense.low-light-vision]
fields: { hp: 8, size: medium, speed: 25 }
effects:
  - { target: languages, op: grant, value: { item: languages.common } }
  - { target: languages, op: grant, value: { item: languages.catfolk } }
  - { target: senses, op: grant, value: { tag: sense.low-light-vision } }
  - { target: traits, op: grant, value: { tag: trait.catfolk } }
  - { target: traits, op: grant, value: { tag: trait.humanoid } }
choices:
  - id: heritage
    from:
      type: heritage
      where: 'item.versatile || item.ancestry == @ancestries.catfolk'
  - id: boosts
    recommend: "'standard'"
    from:
      options:
        - id: standard
          effects:
            - { target: attributes.dex.boosts, op: add, value: 1 }
            - { target: attributes.cha.boosts, op: add, value: 1 }
            - { target: attributes.wis.boosts, op: add, value: -1 }
          choices:
            - id: free
              from: { type: boost, where: "!(item.attribute in ['dex', 'cha'])" }
        - id: alternate
          choices:
            - id: free
              pick: 2
              from: { type: boost }
