id: held.skeleton-key
type: held
tags: [trait.magical]
fields:
  level: 5
  price: 125
  activation: free
  frequency: once-per-day
grants:
  - { item: spells.knock, when: 'self.equipped' }
effects:
  - target: { rolls: [skill-action.pick-a-lock] }
    op: add
    value: 1
    stackKey: item-bonus
    when: 'self.equipped'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.knock && self.used < 1'
    value:
      id: knock
      flags: { itemPaid: true, rank: 2 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
