id: worn.whisper-of-the-first-lie
type: worn
tags: [trait.invested, trait.magical, trait.rare]
fields:
  level: 20
  price: 60000
  activation: three
grants:
  - { item: spells.fabricated-truth, when: 'self.equipped && self.invested' }
effects:
  - target: skills.deception.mod
    op: add
    value: 3
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.fabricated-truth && self.used < 1'
    value:
      id: fabricated-truth
      flags: { itemPaid: true, rank: 10, dc: 47 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
