id: worn.cloak-of-illusions-greater
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 12
  price: 1750
  bulk: 0.1
  usage: cloak
  activation: two
  frequency: once-per-day
grants:
  - { item: spells.figment, when: 'self.equipped && self.invested' }
  - { item: spells.invisibility, when: 'self.equipped && self.invested' }
effects:
  - target: skills.stealth.mod
    op: add
    value: 2
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - {
      target: spells.innate,
      op: grant,
      value: { item: spells.figment },
      when: 'self.equipped && self.invested',
    }
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.invisibility && self.used < 1'
    value:
      id: invisibility
      flags: { itemPaid: true, rank: 4 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
