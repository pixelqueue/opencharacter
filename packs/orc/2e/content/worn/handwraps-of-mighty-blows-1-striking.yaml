# The handwraps keep their runes on every unarmed attack; runes the player etches go on the attacks
# themselves.
id: worn.handwraps-of-mighty-blows-1-striking
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 4
  price: 100
  usage: gloves
keepsTemplates:
  - template: runes.weapon-potency-1
    copies: { type: weapon, where: "item.category == 'unarmed'" }
    when: 'self.equipped && self.invested'
  - template: runes.striking
    copies: { type: weapon, where: "item.category == 'unarmed'" }
    when: 'self.equipped && self.invested'
