id: worn.charm-of-resistance-greater
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 10
  price: 975
choices:
  - id: damage-type
    from: { values: [acid, cold, electricity, fire, sonic] }
    effects:
      - target: { incoming: { fields: [hp.current], tags: [damage] } }
        op: add
        stackKey: resistance
        value: 'min(-incoming.amount, 10)'
        when: "self.equipped && self.invested && incoming.amount < 0 && ('damage.' + pick.value) in incoming.tags"
