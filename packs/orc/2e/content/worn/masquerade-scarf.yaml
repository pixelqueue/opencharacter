id: worn.masquerade-scarf
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 2
  price: 30
  activation: one-minute
  frequency: once-per-day
grants:
  - { item: spells.illusory-disguise, when: 'self.equipped && self.invested' }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.illusory-disguise && self.used < 1'
    value:
      id: illusory-disguise
      flags: { itemPaid: true, rank: 1 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
