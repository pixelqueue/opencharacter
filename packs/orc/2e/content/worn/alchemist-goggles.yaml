# The bonus is on every Craft check: the item crafted isn't known to the roll.
id: worn.alchemist-goggles
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 4
  price: 100
  usage: eyepiece
effects:
  - target: { rolls: [skill-action.craft] }
    op: add
    value: 1
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
