id: worn.ventriloquists-ring
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 3
  price: 60
  activation: two
  frequency: once-per-day
grants:
  - { item: spells.ventriloquism, when: 'self.equipped && self.invested' }
effects:
  - target: skills.deception.mod
    op: add
    value: 1
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.ventriloquism && self.used < 1'
    value:
      id: ventriloquism
      flags: { itemPaid: true, rank: 1, dc: 19 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
