id: worn.crown-of-intellect
type: worn
tags: [trait.apex, trait.invested, trait.magical]
fields:
  level: 17
  price: 15000
  usage: circlet
  activation: one
  frequency: once-per-hour
grants:
  - { item: spells.hypercognition, when: 'self.equipped && self.invested' }
effects:
  - {
      target: attributes.int.mod,
      op: add,
      value: 1,
      when: 'self.equipped && self.invested && self.apex',
    }
  - {
      target: attributes.int.mod,
      op: atLeast,
      value: 4,
      when: 'self.equipped && self.invested && self.apex',
    }
  - target: { rolls: [skill-action.recall-knowledge] }
    op: add
    value: 3
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.hypercognition'
    value:
      id: hypercognition
      flags: { itemPaid: true, rank: 3 }
