id: worn.entertainers-cincture
type: worn
tags: [trait.focused, trait.invested, trait.occult]
fields:
  level: 10
  price: 1000
  usage: belt
  activation: free
  frequency: once-per-day
choices:
  - id: skill
    from: { values: [deception, diplomacy, intimidation, performance] }
    effects:
      - target: skills.deception.mod
        op: add
        value: 2
        stackKey: item-bonus
        when: "self.equipped && self.invested && pick.value == 'deception'"
      - target: skills.diplomacy.mod
        op: add
        value: 2
        stackKey: item-bonus
        when: "self.equipped && self.invested && pick.value == 'diplomacy'"
      - target: skills.intimidation.mod
        op: add
        value: 2
        stackKey: item-bonus
        when: "self.equipped && self.invested && pick.value == 'intimidation'"
      - target: skills.performance.mod
        op: add
        value: 2
        stackKey: item-bonus
        when: "self.equipped && self.invested && pick.value == 'performance'"
