id: worn.crafters-eyepiece-greater
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 11
  price: 1200
  usage: eyepiece
  activation: one-minute
  frequency: once-per-day
grants:
  - { item: spells.creation, when: 'self.equipped && self.invested' }
effects:
  - target: skills.crafting.mod
    op: add
    value: 2
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.creation && self.used < 1'
    value:
      id: creation
      flags: { itemPaid: true, rank: 5 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
