id: worn.primeval-mistletoe
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 6
  price: 230
  activation: two
  frequency: once-per-ten-minutes
grants:
  - { item: spells.runic-weapon, when: 'self.equipped && self.invested' }
  - { item: spells.runic-body, when: 'self.equipped && self.invested' }
  - { item: spells.one-with-plants, when: 'self.equipped && self.invested' }
effects:
  - target: skills.nature.mod
    op: add
    value: 1
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.runic-weapon'
    value:
      id: runic-weapon
      flags: { itemPaid: true, rank: 1 }
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.runic-body'
    value:
      id: runic-body
      flags: { itemPaid: true, rank: 1 }
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.one-with-plants && self.used < 1'
    value:
      id: one-with-plants
      flags: { itemPaid: true, rank: 2 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
