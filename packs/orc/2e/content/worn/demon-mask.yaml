id: worn.demon-mask
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 4
  price: 85
  bulk: 0.1
  usage: mask
  activation: two
  frequency: once-per-day
grants:
  - { item: spells.fear, when: 'self.equipped && self.invested' }
effects:
  - target: skills.intimidation.mod
    op: add
    value: 1
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.fear && self.used < 1'
    value:
      id: fear
      flags: { itemPaid: true, rank: 1, dc: 20 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
