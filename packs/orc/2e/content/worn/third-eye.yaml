id: worn.third-eye
type: worn
tags: [trait.invested, trait.magical]
fields:
  level: 19
  price: 40000
  activation: two
  frequency: once-per-day
grants:
  - { item: spells.truesight, when: 'self.equipped && self.invested' }
effects:
  - target: perception.mod
    op: add
    value: 3
    stackKey: item-bonus
    when: 'self.equipped && self.invested'
  - target: { choices: [spell-cost] }
    op: option
    when: 'action.self.id == self.id && action.item.id == @spells.truesight && self.used < 1'
    value:
      id: truesight
      flags: { itemPaid: true, rank: 8 }
      changes:
        - { type: adjustState, entry: self, key: used, by: 1 }
