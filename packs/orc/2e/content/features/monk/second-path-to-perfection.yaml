id: features.monk.second-path-to-perfection
type: feature
fields: { level: 11 }
choices:
  - id: save
    unique: path-to-perfection
    from: { values: [save.fortitude, save.reflex, save.will] }
    effects:
      - { target: monk.paths, op: grant, value: { formula: pick.value } }
      - target: saves.fortitude.rank
        op: atLeast
        value: 3
        when: "pick.value == 'save.fortitude'"
      - target: saves.reflex.rank
        op: atLeast
        value: 3
        when: "pick.value == 'save.reflex'"
      - target: saves.will.rank
        op: atLeast
        value: 3
        when: "pick.value == 'save.will'"
      - target: { rolls: [save.fortitude], tally: successToCrit }
        op: add
        value: 1
        when: "pick.value == 'save.fortitude'"
      - target: { rolls: [save.reflex], tally: successToCrit }
        op: add
        value: 1
        when: "pick.value == 'save.reflex'"
      - target: { rolls: [save.will], tally: successToCrit }
        op: add
        value: 1
        when: "pick.value == 'save.will'"
