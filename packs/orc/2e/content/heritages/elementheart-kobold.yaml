id: heritages.elementheart-kobold
type: heritage
fields: { ancestry: ancestries.kobold }
choices:
  - id: element
    from:
      options:
        - id: air
          effects:
            - target: { incoming: { fields: [hp.current], tags: [damage.cold] } }
              op: add
              stackKey: resistance
              value: min(-incoming.amount, max(1, floor(level / 2)))
              when: incoming.amount < 0
