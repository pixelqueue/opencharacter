id: runes.greater-flaming
type: template
tags: [trait.magical, rune.property]
appliesTo: { type: weapon }
fields:
  price: '(has(prior.price) ? prior.price : 0) + 6500'
effects:
  - target: { rolls: [damage.strike], from: self }
    op: add
    value: 1d6
    tags: [damage.fire]
  - target: { steps: [strike.hit.critical], from: self }
    op: changes
    value:
      changes:
        - {
            type: applyEffect,
            source: "'conditions.persistent-damage'",
            state: { damage: 2d10, damageType: "'fire'" },
          }
