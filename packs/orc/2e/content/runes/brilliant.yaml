id: runes.brilliant
type: template
tags: [trait.magical, rune.property]
appliesTo: { type: weapon }
fields:
  price: '(has(prior.price) ? prior.price : 0) + 2000'
effects:
  - target: { rolls: [damage.strike], from: self }
    op: add
    value: 1d4
    tags: [damage.fire]
  - target: { rolls: [damage.strike], from: self }
    op: add
    value: 1d4
    tags: [damage.vitality]
    when: situational.undeadTarget
