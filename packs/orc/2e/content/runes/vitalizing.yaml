id: runes.vitalizing
type: template
tags: [trait.magical, rune.property]
appliesTo: { type: weapon }
fields: { price: '(has(prior.price) ? prior.price : 0) + 150' }
effects:
  - target: { steps: [strike.hit], from: self }
    op: changes
    when: situational.undeadTarget
    value:
      changes:
        - type: applyEffect
          source: "'conditions.persistent-damage'"
          state: { damage: 1d6, damageType: "'vitality'" }
        - type: applyEffect
          when: "'strike.hit.critical' in action.step.tags"
          source: "'conditions.enfeebled'"
          state: { value: 1 }
