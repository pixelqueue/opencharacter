id: backgrounds.herbalist
type: background
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.nature },
      when: "!('skill.nature' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.lore.herbalism },
      when: "!('skill.lore.herbalism' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 2 }
grants:
  - item: feats.skill.natural-medicine
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['con', 'wis']" }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
