id: backgrounds.tax-collector
type: background
# The Lore of the settlement that employed you is the first custom Lore (`skills.lore.custom1`), its
# subject named by the player.
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.intimidation }
    when: "!('skill.intimidation' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.custom1 }
    when: "!('skill.lore.custom1' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
grants:
  - item: feats.skill.quick-coercion
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['str', 'cha']" }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
