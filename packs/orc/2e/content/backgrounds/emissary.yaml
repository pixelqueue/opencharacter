id: backgrounds.emissary
type: background
# The Lore of a city you often visited is the first custom Lore (`skills.lore.custom1`), its subject
# named by the player.
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.society },
      when: "!('skill.society' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.lore.custom1 },
      when: "!('skill.lore.custom1' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 2 }
grants:
  - item: feats.skill.multilingual
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['int', 'cha']" }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
