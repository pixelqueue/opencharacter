id: backgrounds.feral-child
type: background
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.nature }
    when: "!('skill.nature' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.survival }
    when: "!('skill.survival' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
  - target: senses
    op: grant
    value: { tag: sense.low-light-vision }
    when: countCopies(copy.type == 'ancestry' && 'sense.low-light-vision' in copy.tags) == 0
  - target: senses
    op: grant
    value: { tag: sense.darkvision }
    when: countCopies(copy.type == 'ancestry' && 'sense.low-light-vision' in copy.tags) > 0
  - { target: senses, op: grant, value: { tag: sense.scent } }
grants:
  - item: feats.skill.forager
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['str', 'dex', 'con']" }
