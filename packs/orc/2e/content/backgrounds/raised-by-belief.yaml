id: backgrounds.raised-by-belief
type: background
# With no deities in the pack, the boost can go to any attribute. The deity's Lore is the first
# custom Lore (`skills.lore.custom1`), its subject named by the player.
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.lore.custom1 },
      when: "!('skill.lore.custom1' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
  - id: skill
    from:
      options:
        - id: acrobatics
          effects:
            - target: skills.trained
              op: grant
              value: { tag: skill.acrobatics }
              when: "!('skill.acrobatics' in skills.chosen)"
            - { target: skills.trainings, op: add, value: 1 }
          grants:
            - { item: feats.skill.assurance, choices: { skill: [{ option: skill.acrobatics }] } }
        - id: arcana
          effects:
            - target: skills.trained
              op: grant
              value: { tag: skill.arcana }
              when: "!('skill.arcana' in skills.chosen)"
            - { target: skills.trainings, op: add, value: 1 }
