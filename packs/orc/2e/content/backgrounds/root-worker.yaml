id: backgrounds.root-worker
type: background
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.occultism }
    when: "!('skill.occultism' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.herbalism }
    when: "!('skill.lore.herbalism' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
grants:
  - item: feats.skill.root-magic
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['int', 'wis']" }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
