id: backgrounds.ward
type: background
effects:
  - target: skills.trained
    op: grant
    value: { tag: skill.performance }
    when: "!('skill.performance' in skills.chosen)"
  - target: skills.trained
    op: grant
    value: { tag: skill.lore.genealogy }
    when: "!('skill.lore.genealogy' in skills.chosen)"
  - { target: skills.trainings, op: add, value: 2 }
grants:
  - item: feats.skill.fascinating-performance
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['con', 'cha']" }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
