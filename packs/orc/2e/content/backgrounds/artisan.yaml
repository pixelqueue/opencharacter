id: backgrounds.artisan
type: background
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.crafting },
      when: "!('skill.crafting' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.lore.guild },
      when: "!('skill.lore.guild' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 2 }
grants:
  - item: feats.skill.specialty-crafting
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['str', 'int']" }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
