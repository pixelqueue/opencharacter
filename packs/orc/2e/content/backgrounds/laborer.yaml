id: backgrounds.laborer
type: background
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.athletics },
      when: "!('skill.athletics' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.lore.labor },
      when: "!('skill.lore.labor' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 2 }
grants:
  - item: feats.skill.hefty-hauler
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['str', 'con']" }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
