id: backgrounds.criminal
type: background
effects:
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.stealth },
      when: "!('skill.stealth' in skills.chosen)",
    }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.lore.underworld },
      when: "!('skill.lore.underworld' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 2 }
grants:
  - item: feats.skill.experienced-smuggler
choices:
  - id: boost
    unique: background-boosts
    from: { type: boost, where: "item.attribute in ['dex', 'int']" }
  - id: free-boost
    unique: background-boosts
    from: { type: boost }
