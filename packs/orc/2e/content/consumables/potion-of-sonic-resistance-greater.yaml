id: consumables.potion-of-sonic-resistance-greater
type: consumable
tags: [trait.magical, trait.potion]
fields:
  level: 14
  price: 850
  bulk: 0.1
  category: potion
  lasting: true
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: add
    stackKey: resistance
    value: 'min(-incoming.amount, 15)'
    scope: applied
    duration: { amount: 1, unit: hour }
    when: "incoming.amount < 0 && 'damage.sonic' in incoming.tags"
