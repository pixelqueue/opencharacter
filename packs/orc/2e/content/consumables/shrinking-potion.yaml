id: consumables.shrinking-potion
type: consumable
tags: [trait.magical, trait.potion]
fields:
  level: 4
  price: 15
  bulk: 0.1
  category: potion
effects:
  - target: { steps: [consumable.drink] }
    op: changes
    when: action.self.id == self.id
    value:
      changes:
        - { type: applyEffect, source: "'spells.shrink'", state: { rank: 2 } }
