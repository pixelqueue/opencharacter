id: consumables.quicksilver-mutagen-moderate
type: consumable
tags: [trait.alchemical, trait.elixir, trait.mutagen, trait.polymorph]
fields:
  category: mutagen
  level: 3
  price: 12
  bulk: 0.1
  lasting: true
  family: consumables.quicksilver-mutagen-lesser
effects:
