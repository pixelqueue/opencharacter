      {
        fields:
          {
            where: "'skill' in item.tags && ('skill.acrobatics' in item.tags || 'skill.stealth' in item.tags || 'skill.thievery' in item.tags)",
          },
      }
    op: add
    value: 2
    stackKey: item-bonus
    scope: applied
    duration: { amount: 10, unit: minute }
  - target: saves.reflex.mod
    op: add
    value: 2
    stackKey: item-bonus
    scope: applied
    duration: { amount: 10, unit: minute }
  - target: attacks.dex.mod
    op: add
    value: 2
    stackKey: item-bonus
    scope: applied
    duration: { amount: 10, unit: minute }
  - target: speed.land
    op: add
    value: 10
    stackKey: status-bonus
    scope: applied
    duration: { amount: 10, unit: minute }
