# The item it was put on is `activate`'s `copy`, kept in the applied entry.
id: consumables.oil-of-potency-greater
type: consumable
tags: [trait.magical, trait.oil]
fields:
  level: 12
  price: 400
  bulk: 0.1
  category: oil
  lasting: true
effects:
  - target: { rolls: [strike] }
    op: add
    value: 2
    stackKey: item-bonus
    when: action.self.id == self.copy
    scope: applied
  - target: { rolls: [damage.strike] }
    op: add
    value: dieOf(action.item.damage, max(0, 3 - action.item.dice))
    when: action.self.id == self.copy
    scope: applied
  - target: { fields: { where: "'ac' in item.tags" } }
    op: add
    value: maxCopies(copy.fields.acBonus, copy.id == self.copy && copy.type == 'armor') + 2
    stackKey: item-bonus
    when: countCopies(copy.id == self.copy && copy.type == 'armor' && copy.equipped) > 0
    scope: applied
  - target: { fields: { where: "'save' in item.tags" } }
    op: add
    value: 2
    stackKey: item-bonus
    when: countCopies(copy.id == self.copy && copy.type == 'armor' && copy.equipped) > 0
    scope: applied
