id: consumables.bestial-mutagen-moderate
type: consumable
tags: [trait.alchemical, trait.elixir, trait.mutagen, trait.polymorph]
fields:
  category: mutagen
  level: 3
  price: 12
  bulk: 0.1
  lasting: true
  family: consumables.bestial-mutagen-lesser
# An applied grant, so carrying the mutagen gives no attacks.
grants:
  - { item: effects.bestial-mutagen-moderate, scope: applied }
effects:
  - target: { rolls: [strike] }
    op: add
    value: 2
    stackKey: item-bonus
    when: "'attack' in roll.tags && action.item.category == 'unarmed'"
    scope: applied
  - target: { fields: { where: "'skill' in item.tags && ('skill.athletics' in item.tags)" } }
    op: add
    value: 2
    stackKey: item-bonus
    scope: applied
    duration: { amount: 10, unit: minute }
  - target: saves.reflex.mod
    op: add
    value: -2
    scope: applied
    duration: { amount: 10, unit: minute }
  - target:
      {
        fields:
          {
            where: "'skill' in item.tags && ('skill.acrobatics' in item.tags || 'skill.stealth' in item.tags)",
          },
      }
    op: add
    value: -2
    scope: applied
    duration: { amount: 10, unit: minute }
  - target: { fields: { where: "'ac' in item.tags" } }
    op: add
    value: -1
    scope: applied
    duration: { amount: 10, unit: minute }
