      {
        fields:
          {
            where: "'skill' in item.tags && ('skill.acrobatics' in item.tags || 'skill.stealth' in item.tags || 'skill.thievery' in item.tags)",
          },
      }
    op: add
    value: 3
    stackKey: item-bonus
    scope: applied
    duration: { amount: 1, unit: hour }
  - target: saves.reflex.mod
    op: add
    value: 3
    stackKey: item-bonus
    scope: applied
    duration: { amount: 1, unit: hour }
  - target: attacks.dex.mod
    op: add
    value: 3
    stackKey: item-bonus
    scope: applied
    duration: { amount: 1, unit: hour }
  - target: speed.land
    op: add
    value: 15
    stackKey: status-bonus
    scope: applied
    duration: { amount: 1, unit: hour }
