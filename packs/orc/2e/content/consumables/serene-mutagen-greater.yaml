id: consumables.serene-mutagen-greater
type: consumable
tags: [trait.alchemical, trait.elixir, trait.mutagen, trait.polymorph]
fields:
  category: mutagen
  level: 11
  price: 300
  bulk: 0.1
  lasting: true
  family: consumables.serene-mutagen-lesser
effects:
  - target: saves.will.mod
    op: add
    value: 3
    stackKey: item-bonus
    scope: applied
    duration: { amount: 1, unit: hour }
  - target: perception.mod
    op: add
    value: 3
    stackKey: item-bonus
    scope: applied
    duration: { amount: 1, unit: hour }
  - target:
      {
        fields:
          {
            where: "'skill' in item.tags && ('skill.medicine' in item.tags || 'skill.nature' in item.tags || 'skill.religion' in item.tags || 'skill.survival' in item.tags)",
          },
      }
    op: add
    value: 3
    stackKey: item-bonus
    scope: applied
    duration: { amount: 1, unit: hour }
  - target: { fields: { where: "'attack' in item.tags" } }
    op: add
    value: -1
    scope: applied
    duration: { amount: 1, unit: hour }
