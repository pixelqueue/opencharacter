id: forms.nature-incarnate.green-man
type: effect
standardCopies:
  - {
      type: weapon,
      where: 'item.id == @weapons.forms.nature-incarnate.green-man-vines || item.id == @weapons.forms.nature-incarnate.green-man-thorns',
    }
effects:
  - { target: battleForm.speed, op: set, value: 40, scope: applied }
  - { target: speed.climb.base, op: atLeast, value: 40, scope: applied }
