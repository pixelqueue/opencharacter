id: forms.monstrosity-form.phoenix
type: effect
standardCopies:
  - {
      type: weapon,
      where: 'item.id == @weapons.forms.monstrosity-form.phoenix-beak || item.id == @weapons.forms.monstrosity-form.phoenix-talon',
    }
effects:
  - { target: battleForm.speed, op: set, value: 30, scope: applied }
  - { target: speed.fly, op: atLeast, value: 90, scope: applied }
