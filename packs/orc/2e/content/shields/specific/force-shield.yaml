id: shields.specific.force-shield
type: shield
extends: shields.steel-shield
tags: [trait.force, trait.magical, trait.uncommon]
fields:
  price: 650
  hardness: 8
  hp: 32
  bt: 16
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: add
    stackKey: resistance
    value: 'min(-incoming.amount, 5)'
    scope: applied
    duration: { amount: 1, unit: minute }
    when: "incoming.amount < 0 && 'damage.bludgeoning' in incoming.tags"
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: add
    stackKey: resistance
    value: 'min(-incoming.amount, 5)'
    scope: applied
    duration: { amount: 1, unit: minute }
    when: "incoming.amount < 0 && 'damage.piercing' in incoming.tags"
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: add
    stackKey: resistance
    value: 'min(-incoming.amount, 5)'
    scope: applied
    duration: { amount: 1, unit: minute }
    when: "incoming.amount < 0 && 'damage.slashing' in incoming.tags"
actions:
  - id: force-bubble
    tags: [activation]
    available: 'self.equipped && self.used < 1'
    steps:
      - id: activate
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: used, by: 1 }
          - { type: applyEffect, source: item.id }
