id: classes.ranger.hunt-prey
type: feature
fields: { level: 1 }
# The prey's participant ID goes into `prey.target`, which roll effects compare with a Strike's
# target. A check has no target, so its prey bonuses are the situational choice `huntedPrey`.
actions:
  - id: hunt-prey
    tags: [hunt-prey]
    participants:
      target: { min: 1, max: 1 }
    results: [hunting]
    steps:
      - id: designate
        kind: changes
        changes:
          - { type: set, field: prey.target, value: 'participants.target[0].id' }
      - id: result
        kind: outcome
        result: "'hunting'"
