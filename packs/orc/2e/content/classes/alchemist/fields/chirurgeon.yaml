id: classes.alchemist.fields.chirurgeon
type: feature
fields: { level: 1 }
# Medicine checks use Crafting's modifier through an `atLeast` on Medicine's.
effects:
  - { target: alchemist.field, op: set, value: "'chirurgeon'" }
  - target: skills.medicine.mod
    op: atLeast
    value: skills.crafting.mod
choices:
  - id: formulas
    unique: formulas
    pick: 2
    activate: false
    from:
      type: consumable
      where: "'trait.alchemical' in item.tags && has(item.family) && item.family == item.id && !('trait.uncommon' in item.tags) && item.level <= 1 && 'trait.elixir' in item.tags && 'healing' in item.tags"
    effects:
      - { target: alchemist.formulas, op: grant, value: { formula: pick.id } }
