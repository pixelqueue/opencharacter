id: classes.alchemist.fields.bomber
type: feature
fields: { level: 1 }
effects:
  - { target: alchemist.field, op: set, value: "'bomber'" }
choices:
  - id: formulas
    unique: formulas
    pick: 2
    activate: false
    from:
      type: consumable
      where: "'trait.alchemical' in item.tags && has(item.family) && item.family == item.id && !('trait.uncommon' in item.tags) && item.level <= 1 && 'trait.bomb' in item.tags"
    effects:
      - { target: alchemist.formulas, op: grant, value: { formula: pick.id } }
