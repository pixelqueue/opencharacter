id: classes.witch.patrons.spinner-of-threads
type: feature
fields: { level: 1, classOption: witch.patron }
effects:
  - { target: witch.patron, op: set, value: "'spinner-of-threads'" }
  - { target: spellcasting.tradition, op: set, value: "'occult'" }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.occultism },
      when: "!('skill.occultism' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - { target: spells.book, op: grant, value: { item: spells.sure-strike } }
grants:
  - item: spells.nudge-fate
