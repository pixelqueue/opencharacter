id: classes.witch.patrons.starless-shadow
type: feature
fields: { level: 1 }
effects:
  - { target: witch.patron, op: set, value: "'starless-shadow'" }
  - { target: spellcasting.tradition, op: set, value: "'occult'" }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.occultism },
      when: "!('skill.occultism' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - { target: spells.book, op: grant, value: { item: spells.fear } }
grants:
  - item: spells.shroud-of-night
