id: classes.druid.orders.leaf
type: feature
fields: { level: 1, classOption: druid.order }
effects:
  - { target: druid.order, op: set, value: "'leaf'" }
  - { target: druid.orders, op: grant, value: { tag: druid-order.leaf } }
  - { target: druid.orderSpells, op: grant, value: { item: spells.cornucopia } }
  - { target: druid.grantedFeats, op: grant, value: { item: feats.druid.leshy-familiar } }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.diplomacy },
      when: "!('skill.diplomacy' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - { target: focus.points, op: add, value: 1 }
grants:
  - item: feats.druid.leshy-familiar
  - item: spells.cornucopia
