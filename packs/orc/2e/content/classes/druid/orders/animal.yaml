id: classes.druid.orders.animal
type: feature
fields: { level: 1 }
effects:
  - { target: druid.order, op: set, value: "'animal'" }
  - { target: druid.orders, op: grant, value: { tag: druid-order.animal } }
  - { target: druid.orderSpells, op: grant, value: { item: spells.heal-animal } }
  - { target: druid.grantedFeats, op: grant, value: { item: feats.druid.animal-companion } }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.athletics },
      when: "!('skill.athletics' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - { target: focus.points, op: add, value: 1 }
grants:
  - item: feats.druid.animal-companion
  - item: spells.heal-animal
