id: classes.barbarian.instincts.fury
type: feature
fields: { level: 1 }
effects:
  - { target: rage.damage, op: set, value: 'level >= 15 ? 13 : level >= 7 ? 7 : 3' }
  - { target: rage.resists, op: grant, value: { tag: damage.bludgeoning }, when: level >= 9 }
  - { target: rage.resists, op: grant, value: { tag: damage.piercing }, when: level >= 9 }
  - { target: rage.resists, op: grant, value: { tag: damage.slashing }, when: level >= 9 }
choices:
  - id: feat
    unique: feats
    from:
      type: feat
      where: >-
        item.category == 'class' && item.level <= 1
          && (item.class == @classes.barbarian
            || item.id == @feats.fighter.sudden-charge)
