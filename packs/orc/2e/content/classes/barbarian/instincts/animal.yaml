id: classes.barbarian.instincts.animal
type: feature
fields: { level: 1 }
effects:
  - { target: rage.animalDamage, op: set, value: 'level >= 15 ? 12 : level >= 7 ? 5 : 2' }
  - { target: rage.resists, op: grant, value: { tag: damage.piercing }, when: level >= 9 }
  - { target: rage.resists, op: grant, value: { tag: damage.slashing }, when: level >= 9 }
choices:
  - id: animal
    from:
      items:
        [
          classes.barbarian.animals.ape,
          classes.barbarian.animals.bear,
          classes.barbarian.animals.bull,
          classes.barbarian.animals.cat,
          classes.barbarian.animals.deer,
          classes.barbarian.animals.frog,
          classes.barbarian.animals.shark,
          classes.barbarian.animals.snake,
          classes.barbarian.animals.wolf,
        ]
