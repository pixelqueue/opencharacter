id: classes.barbarian.instincts.superstition
type: feature
fields: { level: 1, classOption: barbarian.instinct }
effects:
  - { target: rage.damage, op: set, value: 'level >= 15 ? 13 : level >= 7 ? 7 : 3' }
choices:
  # The player applies this resistance, since a spell's damage carries no tradition.
  - id: traditions
    when: level >= 9
    from: { values: [arcane-occult, arcane-primal, divine-occult, divine-primal] }
