id: classes.wizard.schools.protean-form
type: feature
fields: { level: 1 }
effects:
  - { target: wizard.school, op: set, value: "'protean-form'" }
  - { target: spellcasting.extraSlots, op: add, value: 1 }
  - { target: spellcasting.extraCantrips, op: add, value: 1 }
  - { target: focus.points, op: add, value: 1 }
  - target: spells.curriculum
    op: grant
    value:
      query:
        type: spell
        where: >-
          item.id in [
            @spells.gouging-claw,
            @spells.tangle-vine,
            @spells.jump,
            @spells.pest-form,
            @spells.spider-sting,
            @spells.enlarge,
            @spells.humanoid-form,
            @spells.feet-to-fins,
            @spells.vampiric-feast,
            @spells.mountain-resilience,
            @spells.vapor-form,
            @spells.elemental-form,
            @spells.toxic-cloud,
            @spells.cursed-metamorphosis,
            @spells.petrify,
            @spells.duplicate-foe,
            @spells.fiery-body,
            @spells.desiccate,
            @spells.monstrosity-form,
            @spells.metamorphosis
          ]
grants:
  - item: spells.scramble-body
