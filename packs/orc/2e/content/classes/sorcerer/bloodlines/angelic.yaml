id: classes.sorcerer.bloodlines.angelic
type: feature
fields: { level: 1 }
effects:
  - { target: sorcerer.bloodline, op: set, value: "'angelic'" }
  - { target: spellcasting.tradition, op: set, value: "'divine'" }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.diplomacy },
      when: "!('skill.diplomacy' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.religion },
      when: "!('skill.religion' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.light } }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.light } }
  - { target: spells.granted.cantrips, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.heal } }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.heal } }
  - { target: spells.repertoire.rank1, op: grant, value: { item: spells.heal } }
  - { target: spells.granted.rank1, op: add, value: 1 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.spiritual-armament },
      when: level >= 3,
    }
  - {
      target: sorcerer.gifts,
      op: grant,
      value: { item: spells.spiritual-armament },
      when: level >= 3,
    }
  - {
      target: spells.repertoire.rank2,
      op: grant,
      value: { item: spells.spiritual-armament },
      when: level >= 3,
    }
  - { target: spells.granted.rank2, op: add, value: 1, when: level >= 3 }
  - { target: spells.repertoire, op: grant, value: { item: spells.holy-light }, when: level >= 5 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.holy-light }, when: level >= 5 }
  - {
      target: spells.repertoire.rank3,
      op: grant,
      value: { item: spells.holy-light },
      when: level >= 5,
    }
  - { target: spells.granted.rank3, op: add, value: 1, when: level >= 5 }
  - { target: spells.repertoire, op: grant, value: { item: spells.divine-wrath }, when: level >= 7 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.divine-wrath }, when: level >= 7 }
  - target: spells.repertoire.rank4
    op: grant
    value: { item: spells.divine-wrath }
    when: level >= 7
  - { target: spells.granted.rank4, op: add, value: 1, when: level >= 7 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.divine-immolation },
      when: level >= 9,
    }
  - {
      target: sorcerer.gifts,
      op: grant,
      value: { item: spells.divine-immolation },
      when: level >= 9,
    }
  - target: spells.repertoire.rank5
    op: grant
    value: { item: spells.divine-immolation }
    when: level >= 9
  - { target: spells.granted.rank5, op: add, value: 1, when: level >= 9 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.blessed-boundary },
      when: level >= 11,
    }
  - {
      target: sorcerer.gifts,
      op: grant,
      value: { item: spells.blessed-boundary },
      when: level >= 11,
    }
  - target: spells.repertoire.rank6
    op: grant
    value: { item: spells.blessed-boundary }
    when: level >= 11
  - { target: spells.granted.rank6, op: add, value: 1, when: level >= 11 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.divine-decree },
      when: level >= 13,
    }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.divine-decree }, when: level >= 13 }
  - target: spells.repertoire.rank7
    op: grant
    value: { item: spells.divine-decree }
    when: level >= 13
  - { target: spells.granted.rank7, op: add, value: 1, when: level >= 13 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.moment-of-renewal },
      when: level >= 15,
    }
  - {
      target: sorcerer.gifts,
      op: grant,
      value: { item: spells.moment-of-renewal },
      when: level >= 15,
    }
  - target: spells.repertoire.rank8
    op: grant
    value: { item: spells.moment-of-renewal }
    when: level >= 15
  - { target: spells.granted.rank8, op: add, value: 1, when: level >= 15 }
  - { target: spells.repertoire, op: grant, value: { item: spells.foresight }, when: level >= 17 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.foresight }, when: level >= 17 }
  - target: spells.repertoire.rank9
    op: grant
    value: { item: spells.foresight }
    when: level >= 17
  - { target: spells.granted.rank9, op: add, value: 1, when: level >= 17 }
  - { target: focus.points, op: add, value: 1 }
  - target: { choices: [blood-magic] }
    op: option
    value:
      id: aura-self
      changes:
        - type: removeEffect
          applied: { where: "'blood-magic' in item.tags" }
        - {
            type: applyEffect,
            source: "'classes.sorcerer.blood-magic.divine-aura'",
            state: { rank: flags.rank },
          }
  - target: { choices: [blood-magic] }
    op: option
    when: flags.hasTarget
    value:
      id: aura-target
      to: target
      changes:
        - {
            type: applyEffect,
            source: "'classes.sorcerer.blood-magic.divine-aura'",
            state: { rank: flags.rank },
          }
grants:
  - { item: spells.divine-wrath, when: level >= 7 }
  - { item: spells.divine-immolation, when: level >= 9 }
  - { item: spells.blessed-boundary, when: level >= 11 }
  - { item: spells.divine-decree, when: level >= 13 }
  - { item: spells.moment-of-renewal, when: level >= 15 }
  - { item: spells.foresight, when: level >= 17 }
  - { item: spells.light }
  - { item: spells.heal }
  - { item: spells.spiritual-armament, when: level >= 3 }
  - { item: spells.holy-light, when: level >= 5 }
  - item: spells.angelic-halo
