    op: option
    value:
      id: fury-self
      changes:
        - type: removeEffect
          applied: { where: "'blood-magic' in item.tags" }
        - {
            type: applyEffect,
            source: "'classes.sorcerer.blood-magic.elemental-fury'",
            state: { rank: flags.rank },
          }
