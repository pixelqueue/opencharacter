            - target: spells.repertoire.rank8
              op: grant
              value: { item: spells.quandary }
              when: level >= 15
            - { target: spells.granted.rank8, op: add, value: 1, when: level >= 15 }
          grants:
            - { item: spells.quandary, when: level >= 15 }
            - { item: spells.subconscious-suggestion, when: level >= 9 }
