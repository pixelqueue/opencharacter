id: classes.sorcerer.bloodlines.draconic
type: feature
fields: { level: 1 }
effects:
  - { target: sorcerer.bloodline, op: set, value: "'draconic'" }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.intimidation },
      when: "!('skill.intimidation' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.shield } }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.shield } }
  - { target: spells.granted.cantrips, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.fear } }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.fear } }
  - { target: spells.repertoire.rank1, op: grant, value: { item: spells.fear } }
  - { target: spells.granted.rank1, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.haste }, when: level >= 5 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.haste }, when: level >= 5 }
  - { target: spells.repertoire.rank3, op: grant, value: { item: spells.haste }, when: level >= 5 }
  - { target: spells.granted.rank3, op: add, value: 1, when: level >= 5 }
  - { target: spells.repertoire, op: grant, value: { item: spells.fly }, when: level >= 7 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.fly }, when: level >= 7 }
  - target: spells.repertoire.rank4
    op: grant
    value: { item: spells.fly }
    when: level >= 7
  - { target: spells.granted.rank4, op: add, value: 1, when: level >= 7 }
  - { target: spells.repertoire, op: grant, value: { item: spells.dragon-form }, when: level >= 11 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.dragon-form }, when: level >= 11 }
  - target: spells.repertoire.rank6
    op: grant
    value: { item: spells.dragon-form }
    when: level >= 11
  - { target: spells.granted.rank6, op: add, value: 1, when: level >= 11 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.mask-of-terror },
      when: level >= 13,
    }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.mask-of-terror }, when: level >= 13 }
  - target: spells.repertoire.rank7
    op: grant
    value: { item: spells.mask-of-terror }
    when: level >= 13
  - { target: spells.granted.rank7, op: add, value: 1, when: level >= 13 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.overwhelming-presence },
      when: level >= 17,
    }
  - {
      target: sorcerer.gifts,
      op: grant,
      value: { item: spells.overwhelming-presence },
      when: level >= 17,
    }
  - target: spells.repertoire.rank9
    op: grant
    value: { item: spells.overwhelming-presence }
    when: level >= 17
  - { target: spells.granted.rank9, op: add, value: 1, when: level >= 17 }
  - { target: focus.points, op: add, value: 1 }
  - target: { choices: [blood-magic] }
    op: option
    value:
      id: scales-self
      changes:
        - type: removeEffect
          applied: { where: "'blood-magic' in item.tags" }
        - {
            type: applyEffect,
            source: "'classes.sorcerer.blood-magic.scaly-hide'",
            state: { rank: flags.rank },
          }
  - target: { choices: [blood-magic] }
    op: option
    when: flags.hasTarget
    value:
      id: scales-target
      to: target
      changes:
        - {
            type: applyEffect,
            source: "'classes.sorcerer.blood-magic.scaly-hide'",
            state: { rank: flags.rank },
          }
grants:
  - { item: spells.fly, when: level >= 7 }
  - { item: spells.dragon-form, when: level >= 11 }
  - { item: spells.mask-of-terror, when: level >= 13 }
  - { item: spells.overwhelming-presence, when: level >= 17 }
  - { item: spells.shield }
  - { item: spells.fear }
  - { item: spells.haste, when: level >= 5 }
  - item: spells.flurry-of-claws
choices:
  # Asked right after the bloodline, before the class's free skills.
  - id: exemplar
    from:
      options:
        - id: arcane
          effects:
            - { target: spellcasting.tradition, op: set, value: "'arcane'" }
            - {
                target: skills.trained,
