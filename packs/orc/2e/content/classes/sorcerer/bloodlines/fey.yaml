id: classes.sorcerer.bloodlines.fey
type: feature
fields: { level: 1 }
effects:
  - { target: sorcerer.bloodline, op: set, value: "'fey'" }
  - { target: spellcasting.tradition, op: set, value: "'primal'" }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.deception },
      when: "!('skill.deception' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - {
      target: skills.trained,
      op: grant,
      value: { tag: skill.nature },
      when: "!('skill.nature' in skills.chosen)",
    }
  - { target: skills.trainings, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.figment } }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.figment } }
  - { target: spells.granted.cantrips, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.charm } }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.charm } }
  - { target: spells.repertoire.rank1, op: grant, value: { item: spells.charm } }
  - { target: spells.granted.rank1, op: add, value: 1 }
  - { target: spells.repertoire, op: grant, value: { item: spells.laughing-fit }, when: level >= 3 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.laughing-fit }, when: level >= 3 }
  - {
      target: spells.repertoire.rank2,
      op: grant,
      value: { item: spells.laughing-fit },
      when: level >= 3,
    }
  - { target: spells.granted.rank2, op: add, value: 1, when: level >= 3 }
  - { target: spells.repertoire, op: grant, value: { item: spells.enthrall }, when: level >= 5 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.enthrall }, when: level >= 5 }
  - {
      target: spells.repertoire.rank3,
      op: grant,
      value: { item: spells.enthrall },
      when: level >= 5,
    }
  - { target: spells.granted.rank3, op: add, value: 1, when: level >= 5 }
  - { target: spells.repertoire, op: grant, value: { item: spells.suggestion }, when: level >= 7 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.suggestion }, when: level >= 7 }
  - target: spells.repertoire.rank4
    op: grant
    value: { item: spells.suggestion }
    when: level >= 7
  - { target: spells.granted.rank4, op: add, value: 1, when: level >= 7 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.hallucination },
      when: level >= 9,
    }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.hallucination }, when: level >= 9 }
  - target: spells.repertoire.rank5
    op: grant
    value: { item: spells.hallucination }
    when: level >= 9
  - { target: spells.granted.rank5, op: add, value: 1, when: level >= 9 }
  - { target: spells.repertoire, op: grant, value: { item: spells.mislead }, when: level >= 11 }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.mislead }, when: level >= 11 }
  - target: spells.repertoire.rank6
    op: grant
    value: { item: spells.mislead }
    when: level >= 11
  - { target: spells.granted.rank6, op: add, value: 1, when: level >= 11 }
  - target: spells.repertoire
    op: grant
    value: { item: spells.visions-of-danger }
    when: level >= 13
  - target: sorcerer.gifts
    op: grant
    value: { item: spells.visions-of-danger }
    when: level >= 13
  - target: spells.repertoire.rank7
    op: grant
    value: { item: spells.visions-of-danger }
    when: level >= 13
  - { target: spells.granted.rank7, op: add, value: 1, when: level >= 13 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.uncontrollable-dance },
      when: level >= 15,
    }
  - {
      target: sorcerer.gifts,
      op: grant,
      value: { item: spells.uncontrollable-dance },
      when: level >= 15,
    }
  - target: spells.repertoire.rank8
    op: grant
    value: { item: spells.uncontrollable-dance }
    when: level >= 15
  - { target: spells.granted.rank8, op: add, value: 1, when: level >= 15 }
  - {
      target: spells.repertoire,
      op: grant,
      value: { item: spells.metamorphosis },
      when: level >= 17,
    }
  - { target: sorcerer.gifts, op: grant, value: { item: spells.metamorphosis }, when: level >= 17 }
  - target: spells.repertoire.rank9
    op: grant
    value: { item: spells.metamorphosis }
    when: level >= 17
  - { target: spells.granted.rank9, op: add, value: 1, when: level >= 17 }
  - { target: focus.points, op: add, value: 1 }
  - target: { choices: [blood-magic] }
    op: option
    value:
      id: ribbons-performance
      changes:
        - type: removeEffect
          applied: { where: "'blood-magic' in item.tags" }
        - {
            type: applyEffect,
            source: "'classes.sorcerer.blood-magic.cloak-of-ribbons'",
            state: { rank: flags.rank },
          }
  - target: { choices: [blood-magic] }
    op: option
    value:
      id: ribbons-concealed
      changes:
        - type: removeEffect
          applied: { where: "'blood-magic' in item.tags" }
        - { type: applyEffect, source: "'conditions.concealed'" }
grants:
  - { item: spells.visions-of-danger, when: level >= 13 }
  - { item: spells.suggestion, when: level >= 7 }
  - { item: spells.hallucination, when: level >= 9 }
  - { item: spells.mislead, when: level >= 11 }
  - { item: spells.uncontrollable-dance, when: level >= 15 }
  - { item: spells.metamorphosis, when: level >= 17 }
  - { item: spells.figment }
  - { item: spells.charm }
  - { item: spells.laughing-fit, when: level >= 3 }
  - { item: spells.enthrall, when: level >= 5 }
  - item: spells.faerie-dust
