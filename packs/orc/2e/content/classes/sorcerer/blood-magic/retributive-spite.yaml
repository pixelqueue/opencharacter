id: classes.sorcerer.blood-magic.retributive-spite
type: effect
tags: [blood-magic]
state:
  rank: { type: integer, default: 1, min: 1, max: 10 }
actions:
  - id: retaliate
    scope: applied
    tags: [class-action]
    participants:
      target: { max: 1 }
    results: [retaliated]
    steps:
      - id: save
        kind: action
        each: target
        as: participant
        use: check
        params:
          check: "'saves.will.mod'"
          dc: spellcasting.dc
      - id: burn
        kind: changes
        each: target
        to: target
        changes:
          - type: adjust
            field: hp.current
            by: >-
              -floor(4 * self.rank * [2, 1, 0.5, 0][indexOf(['critical-failure', 'failure',
                'success', 'critical-success'], steps.save.result)])
            tags: [damage, damage.mental]
      - id: end
        kind: changes
        changes:
          - type: removeEffect
            applied: { where: 'item.id == @classes.sorcerer.blood-magic.retributive-spite' }
      - id: result
        kind: outcome
        result: "'retaliated'"
        data:
          damage: 4 * self.rank
  - id: consume
    scope: applied
    tags: [class-action]
    results: [consumed]
    steps:
      - id: gain
        kind: changes
        changes:
          - { type: set, when: self.rank > hp.temp, field: hp.temp, value: self.rank }
          - type: removeEffect
            applied: { where: 'item.id == @classes.sorcerer.blood-magic.retributive-spite' }
      - id: result
        kind: outcome
        result: "'consumed'"
