id: spells.runic-weapon
type: spell
tags:
  [
    trait.concentrate,
    trait.manipulate,
    tradition.arcane,
    tradition.divine,
    tradition.occult,
    tradition.primal,
  ]
# `cast-spell` applies the template to the copy the `copy` parameter names on the ally's sheet. The
# spell is applied to the ally too; when it ends, the app removes the template with it.
fields:
  rank: 1
  cast: two
  range: 0
  targets: 1
  duration: minutes
  durationAmount: 1
  applyTo: ally
  copyTemplates: [templates.runic, templates.runic-greater, templates.runic-major]
