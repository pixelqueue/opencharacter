id: spells.flicker
type: spell
tags: [trait.concentrate, trait.manipulate, trait.teleportation, tradition.arcane, tradition.occult]
fields:
  rank: 4
  cast: two
  duration: minutes
  durationAmount: 1
  applyTo: self
effects:
  - target:
      incoming:
        fields: [hp.current]
        tags: [damage]
    op: add
    stackKey: resistance
    value: min(-incoming.amount, 5 + 3 * floor((self.rank - 4) / 2))
    when: incoming.amount < 0 && !('damage.force' in incoming.tags)
    scope: applied
