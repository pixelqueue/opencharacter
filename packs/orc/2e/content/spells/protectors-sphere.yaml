# Cast on yourself: each cast projects its emanation, which the app places on allies inside. The
# cast's resistance (by its rank) reaches them through the caster's `spells.sphereResistance`.
id: spells.protectors-sphere
type: spell
tags: [trait.aura, trait.cleric, trait.concentrate, trait.focus, trait.manipulate, trait.uncommon]
fields:
  rank: 4
  cast: two
  area: emanation
  areaSize: 15
  duration: minutes
  durationAmount: 1
  sustained: true
  applyTo: self
effects:
  - target:
      incoming:
        fields: [hp.current]
        tags: [damage]
    op: add
    stackKey: resistance
    value: min(-incoming.amount, 3 + (self.rank - 4))
    when: incoming.amount < 0
    scope: applied
  - { target: spells.sphereResistance, op: atLeast, value: 3 + (self.rank - 4), scope: applied }
auras:
  - id: sphere
    scope: applied
    size: item.areaSize
    affects: allies
    fields:
      spells.sphereResistance: { type: integer, default: 3 }
    effects:
      - target:
          incoming:
            fields: [hp.current]
            tags: [damage]
        op: add
        stackKey: resistance
        value: min(-incoming.amount, applier.spells.sphereResistance)
        when: incoming.amount < 0
        scope: applied
