id: spells.nature-incarnate
type: spell
tags: [trait.concentrate, trait.manipulate, trait.polymorph, tradition.primal]
fields:
  rank: 10
  cast: two
  duration: minutes
  durationAmount: 1
  applyTo: self
  tempHp: 30
effects:
  # The battle form is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell], from: self }
    op: params
    value:
      incarnation: { type: enum, values: [green-man, kaiju], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { form: "has(params.incarnation) ? params.incarnation : ''" } }
  - { target: battleForm.active, op: set, value: true, scope: applied }
  - { target: battleForm.acBase, op: set, value: '25', scope: applied }
  - { target: battleForm.formAttacks, op: set, value: true, scope: applied }
  - { target: battleForm.attack, op: set, value: '34', scope: applied }
  - { target: skills.athletics.mod, op: atLeast, value: 36, scope: applied }
grants:
  - { item: forms.nature-incarnate.green-man, scope: applied, when: "self.form == 'green-man'" }
  - { item: forms.nature-incarnate.kaiju, scope: applied, when: "self.form == 'kaiju'" }
