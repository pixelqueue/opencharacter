id: spells.falling-stars
type: spell
tags: [trait.concentrate, trait.manipulate, tradition.arcane, tradition.primal]
fields:
  rank: 9
  cast: two
  range: 500
  area: burst
  areaSize: 40
  defense: reflex
  basic: true
  damage: 14d6
  damageType: fire
  heighten: 1
  heightenDice: 2
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell-cast], from: self }
    op: params
    value:
      damageType: { type: enum, values: [cold, electricity, fire, sonic], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.damageType) ? params.damageType : item.damageType' } }
