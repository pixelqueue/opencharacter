id: spells.dragon-breath
type: spell
tags: [trait.concentrate, trait.focus, trait.manipulate, trait.sorcerer, trait.uncommon]
fields:
  rank: 3
  cast: two
  area: cone
  areaSize: 30
  defense: reflex
  basic: true
  damage: 5d6
  damageType: fire
  heighten: 1
  heightenDice: 2
effects:
  # The exemplar's type follows its tradition (the draconic exemplar sets the spellcasting
  # tradition): force (arcane), spirit (divine), mental (occult) or fire (primal). A parameter
  # the spell adds to its cast names another, for an exemplar the sheet doesn't hold.
  - target: { actions: [spell-cast], from: self }
    op: params
    value:
      damageType: { type: enum, values: [fire, force, mental, spirit], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value:
      flags:
        damageType: >-
          has(params.damageType) ? params.damageType
            : spellcasting.tradition == 'arcane' ? 'force'
            : spellcasting.tradition == 'divine' ? 'spirit'
            : spellcasting.tradition == 'occult' ? 'mental'
            : spellcasting.tradition == 'primal' ? 'fire' : item.damageType
