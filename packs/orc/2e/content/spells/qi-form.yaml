id: spells.qi-form
type: spell
tags: [trait.concentrate, trait.focus, trait.monk, trait.polymorph, trait.uncommon]
fields:
  rank: 9
  cast: one
  duration: minutes
  durationAmount: 1
  applyTo: self
  damageType: force
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell], from: self }
    op: params
    value:
      qiType: { type: enum, values: [force, spirit, vitality, void], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.qiType) ? params.qiType : item.damageType' } }
  - { target: speed.fly, op: atLeast, value: speed.land, scope: applied }
  - target:
      rolls: [damage.strike]
    op: add
    value: 1d6
    tags:
      - { formula: "'damage.' + self.damageType" }
    scope: applied
