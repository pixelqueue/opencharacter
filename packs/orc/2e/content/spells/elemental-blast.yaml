id: spells.elemental-blast
type: spell
tags: [trait.concentrate, trait.focus, trait.manipulate, trait.sorcerer, trait.uncommon]
fields:
  rank: 5
  cast: two
  area: other
  defense: reflex
  basic: true
  damage: 8d6
  damageType: fire
  heighten: 1
  heightenDice: 2
effects:
  # The damage is of the elemental influence's type.
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value:
      flags:
        damageType: "sorcerer.elementDamage != 'none' ? sorcerer.elementDamage : item.damageType"
