id: spells.inner-upheaval
type: spell
tags: [trait.concentrate, trait.focus, trait.monk, trait.uncommon]
fields:
  rank: 1
  cast: one
  duration: until-end-of-turn
  applyTo: self
  damageType: force
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell], from: self }
    op: params
    value:
      qiType: { type: enum, values: [force, spirit, vitality, void], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.qiType) ? params.qiType : item.damageType' } }
  - target:
      rolls: [attack]
    op: add
    value: 1
    stackKey: status-bonus
    when: has(roll.item) && has(roll.item.category) && roll.item.category == 'unarmed'
    scope: applied
  - target:
      rolls: [damage.strike]
    op: add
    value: dieOf(1d6, 1 + floor((self.rank - 1) / 4))
    tags:
      - { formula: "'damage.' + self.damageType" }
    when: has(roll.item) && has(roll.item.category) && roll.item.category == 'unarmed'
    scope: applied
