id: spells.elemental-form
type: spell
tags: [trait.concentrate, trait.manipulate, trait.polymorph, tradition.arcane, tradition.primal]
fields:
  rank: 5
  cast: two
  duration: minutes
  durationAmount: 1
  applyTo: self
  tempHp: 10
  heighten: 1
  heightenTempHp: 5
effects:
  - { target: battleForm.active, op: set, value: true, scope: applied }
  - {
      target: battleForm.acBase,
      op: set,
      value: 'self.rank >= 7 ? 22 : self.rank >= 6 ? 22 : 19',
      scope: applied,
    }
  - { target: battleForm.formAttacks, op: set, value: true, scope: applied }
  - {
      target: battleForm.attack,
      op: set,
      value: 'self.rank >= 7 ? 25 : self.rank >= 6 ? 23 : 18',
      scope: applied,
    }
  - {
      target: battleForm.damage,
      op: set,
      value: 'self.rank >= 7 ? 11 : self.rank >= 6 ? 13 : 9',
      scope: applied,
    }
  - {
      target: battleForm.diceMultiplier,
      op: set,
      value: 'self.rank >= 7 ? 2 : self.rank >= 6 ? 1 : 1',
      scope: applied,
    }
grants:
  - { item: forms.elemental-form.air, scope: applied, when: "self.form == 'air'" }
  - { item: forms.elemental-form.earth, scope: applied, when: "self.form == 'earth'" }
  - { item: forms.elemental-form.fire, scope: applied, when: "self.form == 'fire'" }
  - { item: forms.elemental-form.metal, scope: applied, when: "self.form == 'metal'" }
  - { item: forms.elemental-form.water, scope: applied, when: "self.form == 'water'" }
  - { item: forms.elemental-form.wood, scope: applied, when: "self.form == 'wood'" }
