id: spells.protective-wards
type: spell
tags: [trait.uncommon, trait.aura, trait.focus, trait.manipulate, trait.wizard]
# Cast on yourself: each cast projects its emanation, which the app places on allies inside.
# Sustaining the spell to widen it is `widen`.
fields:
  rank: 1
  cast: one
  area: emanation
  areaSize: 5
  duration: sustained
  sustained: true
  applyTo: self
state:
  widened: { type: integer, default: 0, min: 0, max: 5 }
effects:
  - {
      target: { fields: { where: "'ac' in item.tags" } },
      op: add,
      value: 1,
      stackKey: status-bonus,
      scope: applied,
    }
auras:
  - id: wards
    scope: applied
    size: item.areaSize + 5 * self.widened
    affects: allies
    effects:
      - {
          target: { fields: { where: "'ac' in item.tags" } },
          op: add,
          value: 1,
          stackKey: status-bonus,
          scope: applied,
        }
actions:
  - id: widen
    tags: [spell]
    scope: applied
    available: (self.appliedBy == '' || self.appliedBy == character.id) && self.widened < 5
    steps:
      - id: widen
        kind: changes
        changes: [{ type: adjustState, entry: self, key: widened, by: 1 }]
