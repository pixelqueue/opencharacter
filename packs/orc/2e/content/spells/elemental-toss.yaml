id: spells.elemental-toss
type: spell
tags: [trait.attack, trait.focus, trait.manipulate, trait.sorcerer, trait.uncommon]
fields:
  rank: 1
  cast: one
  range: 30
  targets: 1
  defense: ac
  damage: 1d8
  damageType: bludgeoning
  heighten: 1
  heightenDice: 1
effects:
  # The damage is of the elemental influence's type.
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value:
      flags:
        damageType: "sorcerer.elementDamage != 'none' ? sorcerer.elementDamage : item.damageType"
