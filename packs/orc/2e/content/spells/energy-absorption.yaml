id: spells.energy-absorption
type: spell
tags: [trait.focus, trait.uncommon, trait.wizard]
fields:
  rank: 4
  cast: reaction
  applyTo: self
  damageType: fire
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell-cast], from: self }
    op: params
    value:
      damageType: { type: enum, values: [acid, cold, electricity, fire], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.damageType) ? params.damageType : item.damageType' } }
  - target:
      incoming:
        fields: [hp.current]
    op: add
    stackKey: resistance
    value: min(-incoming.amount, 15 + 5 * (self.rank - 4))
    when: incoming.amount < 0 && ('damage.' + self.damageType) in incoming.tags
    scope: applied
    then:
      - { type: removeEffect, entry: self }
