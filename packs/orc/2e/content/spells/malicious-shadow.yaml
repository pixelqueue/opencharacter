id: spells.malicious-shadow
type: spell
tags:
  [
    trait.concentrate,
    trait.focus,
    trait.hex,
    trait.manipulate,
    trait.shadow,
    trait.uncommon,
    trait.witch,
  ]
fields:
  rank: 3
  cast: two
  range: 30
  targets: 1
  duration: sustained
  defense: ac
  damage: 2d10
  damageType: slashing
  heighten: 2
  heightenDice: 1
effects:
  # The damage type is chosen on each cast: a parameter the spell adds to its own cast.
  - target: { actions: [spell-cast], from: self }
    op: params
    value:
      damageType: { type: enum, values: [bludgeoning, piercing, slashing], optional: true }
  - target: { steps: [spell.chosen], from: self }
    op: changes
    value: { flags: { damageType: 'has(params.damageType) ? params.damageType : item.damageType' } }
