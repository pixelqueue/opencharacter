id: spells.rallying-anthem
type: spell
tags:
  [
    trait.bard,
    trait.cantrip,
    trait.composition,
    trait.concentrate,
    trait.emotion,
    trait.mental,
    trait.uncommon,
  ]
# Pass yourself as an ally too. Its status bonus is the entry's `value` when Fortissimo Composition
# raised it.
fields:
  rank: 2
  cast: one
  area: emanation
  areaSize: 60
  duration: rounds
  durationAmount: 1
  applyTo: ally
effects:
  - target:
      fields:
        where: item.id == @defenses.ac || 'save' in item.tags
    op: add
    value: max(1, self.value)
    stackKey: status-bonus
    scope: applied
  - target:
      incoming:
        fields: [hp.current]
        tags: [damage.bludgeoning, damage.piercing, damage.slashing]
    op: add
    stackKey: resistance
    value: min(-incoming.amount, floor(self.rank / 2))
    when: incoming.amount < 0
    scope: applied
