id: spells.ancestral-form
type: spell
tags: [trait.concentrate, trait.focus, trait.manipulate, trait.oracle, trait.uncommon]
fields:
  rank: 6
  cast: two
  duration: sustained
  applyTo: self
effects:
  - target: { incoming: { fields: [hp.current] } }
    op: add
    stackKey: resistance
    value: min(-incoming.amount, 10 + 5 * floor((self.rank - 6) / 2))
    when: >-
      incoming.amount < 0 && 'damage' in incoming.tags && !('damage.force' in incoming.tags)
        && !('damage.spirit' in incoming.tags)
    scope: applied
