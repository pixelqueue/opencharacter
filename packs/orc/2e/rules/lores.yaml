  - skill.lore.custom2
  - skill.lore.custom3
fields:
  skills.lore.alcohol.increases:
    type: integer
    input: true
    default: 0
    min: 0
    max: >-
      'skill.lore.alcohol' in skills.trained || 'skill.lore.alcohol' in skills.chosen
        ? skills.maxRank - 1 : 0
    tags:
      - skill-increase
      - lore
      - formula: "'skill.lore.alcohol' in skills.trained || 'skill.lore.alcohol' in skills.chosen ? [] : ['untrained']"
  skills.lore.alcohol.trainedByIncrease:
    {
      type: integer,
      input: true,
      default: 0,
      min: 0,
      max: 1,
      tags: [skill-increase, skill-training, skill.lore.alcohol, lore],
    }
  skills.lore.alcohol.rank:
    type: integer
    tags: [skill-rank, lore, skill.lore.alcohol]
    formula: "('skill.lore.alcohol' in skills.trained || 'skill.lore.alcohol' in skills.chosen ? 1 : 0) + skills.lore.alcohol.increases"
  skills.lore.alcohol.mod:
    type: integer
    tags:
      - check
      - skill
      - skill.lore.alcohol
      - attr.int
      - lore
      - formula: >-
          skills.lore.alcohol.rank == 0 ? ['untrained']
            : [['rank.trained', 'rank.expert', 'rank.master', 'rank.legendary'][min(4, skills.lore.alcohol.rank) - 1]]
    formula: 'attributes.int.mod + (skills.lore.alcohol.rank > 0 ? 2 * skills.lore.alcohol.rank + proficiency.level : proficiency.untrained)'
