# A Lore of a city or a deity is the player's: three Lores of their choice (`skills.lore.custom1` to
# `custom3`), each named by the subject the player writes.
tags:
  - skill.lore.alcohol
  - skill.lore.art
  - skill.lore.cooking
  - skill.lore.engineering
  - skill.lore.fortune-telling
  - skill.lore.games
  - skill.lore.genealogy
  - skill.lore.gladiatorial
  - skill.lore.guild
  - skill.lore.heraldry
  - skill.lore.herbalism
  - skill.lore.labor
  - skill.lore.mercantile
  - skill.lore.mining
