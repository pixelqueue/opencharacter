fields:
  skills.lore.accounting.increases:
    type: integer
    input: true
    default: 0
    min: 0
    max: >-
      'skill.lore.accounting' in skills.trained || 'skill.lore.accounting' in skills.chosen
        ? skills.maxRank - 1 : 0
    tags:
      - skill-increase
      - lore
      - formula: "'skill.lore.accounting' in skills.trained || 'skill.lore.accounting' in skills.chosen ? [] : ['untrained']"
  skills.lore.accounting.trainedByIncrease:
    {
      type: integer,
      input: true,
      default: 0,
      min: 0,
      max: 1,
      tags: [skill-increase, skill-training, skill.lore.accounting, lore],
    }
  skills.lore.accounting.rank:
    type: integer
    tags: [skill-rank, lore, skill.lore.accounting]
    formula: "('skill.lore.accounting' in skills.trained || 'skill.lore.accounting' in skills.chosen ? 1 : 0) + skills.lore.accounting.increases"
  skills.lore.accounting.mod:
    type: integer
    tags:
      - check
      - skill
      - skill.lore.accounting
      - attr.int
      - lore
      - formula: >-
          skills.lore.accounting.rank == 0 ? ['untrained']
            : [['rank.trained', 'rank.expert', 'rank.master', 'rank.legendary'][min(4, skills.lore.accounting.rank) - 1]]
    formula: 'attributes.int.mod + (skills.lore.accounting.rank > 0 ? 2 * skills.lore.accounting.rank + proficiency.level : proficiency.untrained)'
