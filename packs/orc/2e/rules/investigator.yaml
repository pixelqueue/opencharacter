fields:
  investigator.leadBonus: { type: integer, formula: 0, min: 0 }
  investigator.methodology:
    type: enum
    values: [none, alchemical-sciences, empiricism, forensic-medicine, interrogation]
    formula: "'none'"

situational:
  - id: investigating
    type: boolean
    default: false
    rolls: [perception, skill, save]
    available: investigator.leadBonus > 0
    effects:
      - target: { rolls: [perception, skill, save] }
        op: add
        value: investigator.leadBonus
        stackKey: circumstance-bonus
        when: >-
          situational.investigating && (!('save' in roll.tags)
            || @feats.investigator.detectives-readiness in feats.held)

tags:
  - stratagem
  - stratagem-roll

display:
  fields:
    investigator.leadBonus:
      {
        groups: [proficiencies],
        priority: 2,
        showWhen: 'countCopies(copy.item == @classes.investigator) > 0',
      }
    investigator.methodology:
      {
        groups: [summary],
        priority: 2,
        showWhen: 'countCopies(copy.item == @classes.investigator) > 0',
      }
