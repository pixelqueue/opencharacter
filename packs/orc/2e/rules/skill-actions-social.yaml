              ? mapList(steps.against, x.band) : []

  - id: gather-information
    tags: [exploration-action]
    params:
      dc: { type: integer, optional: true }
    results: { bands: degree }
    steps:
      - id: using
        kind: choice
        recommend: "'diplomacy'"
        options:
          - { id: diplomacy }
          - { id: society, when: '@feats.skill.streetwise in feats.held' }
          - id: occultism
            when: '@feats.skill.schooled-in-secrets in feats.held'
      - id: check
        kind: action
        use: check
        tags: [skill-action.gather-information]
        params:
          check: "'skills.' + steps.using.picked + '.mod'"
          dc: 'has(params.dc) ? params.dc : null'
      - id: result
        kind: outcome
        result: steps.check.result
        data: { total: steps.check.data.total, dc: steps.check.data.dc }

  - id: perform
    tags: [skill-action]
    params:
      dc: { type: integer, optional: true }
      combat: { type: boolean, optional: true }
    participants:
      audience:
        fields:
          saves.will.dc: { type: integer }
    results: { bands: degree }
    steps:
      - id: using
        kind: choice
        recommend: >-
          @feats.skill.acrobatic-performer in feats.held
            && skills.acrobatics.mod > skills.performance.mod ? 'acrobatics' : 'performance'
        options:
          - { id: performance }
          - id: acrobatics
            when: '@feats.skill.acrobatic-performer in feats.held'
      - id: check
        kind: action
        use: check
        tags: [skill-action.perform]
        params:
          check: "'skills.' + steps.using.picked + '.mod'"
          dc: >-
            size(participants.audience) == 1 && has(participants.audience[0].saves.will.dc)
              ? participants.audience[0].saves.will.dc : has(params.dc) ? params.dc : null
      - id: dcs
        kind: branch
        each: audience
        cases:
          - when: true
            flags:
              dc: 'has(participant.saves.will.dc) ? participant.saves.will.dc : has(params.dc) ? params.dc : -1'
      - id: against
        kind: roll
        each: audience
        of: check/roll
        bands: degree
      - id: fascinate
        kind: changes
        each: audience
        when: >-
          @feats.skill.fascinating-performance in feats.held
            && indexOf(['critical-failure', 'failure', 'success', 'critical-success'], steps.against.band) >= (has(params.combat) && params.combat ? 3 : 2)
        to: audience
        changes:
          - { type: applyEffect, source: "'conditions.fascinated'" }
      - id: result
        kind: outcome
        result: >-
          size(participants.audience) > 1
            ? ['critical-failure', 'failure', 'success', 'critical-success'][minList(mapList(steps.against, indexOf(['critical-failure', 'failure', 'success', 'critical-success'], x.band)), x)]
            : steps.check.result
        data:
          total: steps.check.data.total
          dc: steps.check.data.dc
          degrees: >-
            size(participants.audience) > 0
              ? mapList(steps.against, x.band) : []

  - id: command-an-animal
    tags: [skill-action]
    params:
      dc: { type: integer, optional: true }
      attitude:
        type: enum
        values: [hostile, unfriendly, indifferent, friendly, helpful]
        optional: true
    participants:
      target:
        max: 1
        fields:
          saves.will.dc: { type: integer }
    results: { bands: degree }
    steps:
      - id: refuse
        kind: outcome
        when: "has(params.attitude) && params.attitude in ['hostile', 'unfriendly']"
        result: "'failure'"
        data: { total: 0, dc: 0 }
      - id: check
        kind: action
        use: check
        tags: [skill-action.command-an-animal]
        situational: { helpfulAnimal: "has(params.attitude) && params.attitude == 'helpful'" }
        params:
          check: "'skills.nature.mod'"
          dc: >-
            size(participants.target) > 0 && has(participants.target[0].saves.will.dc)
              ? participants.target[0].saves.will.dc : has(params.dc) ? params.dc : null
      - id: result
        kind: outcome
        result: steps.check.result
        data: { total: steps.check.data.total, dc: steps.check.data.dc }
