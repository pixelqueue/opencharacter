actions:
  - id: demoralize
    tags: [skill-action]
    params:
      dc: { type: integer, optional: true }
    participants:
      target:
        max: 1
        fields:
          saves.will.dc: { type: integer }
          level: { type: integer }
    results: { bands: degree }
    steps:
      - id: check
        kind: action
        use: check
        tags: [skill-action.demoralize]
        params:
          check: "'skills.intimidation.mod'"
          dc: >-
            size(participants.target) > 0 && has(participants.target[0].saves.will.dc)
              ? participants.target[0].saves.will.dc : has(params.dc) ? params.dc : null
      - id: frighten
        kind: changes
        when: "steps.check.result in ['success', 'critical-success']"
        to: target
        changes:
          - type: applyEffect
            source: "'conditions.frightened'"
            state: { value: "steps.check.result == 'critical-success' ? 2 : 1" }
          - type: applyEffect
            when: >-
              steps.check.result == 'critical-success'
                && @feats.skill.terrified-retreat in feats.held
                && size(participants.target) > 0 && has(participants.target[0].level)
                && participants.target[0].level < level
            source: "'conditions.fleeing'"
      - id: result
        kind: outcome
        result: steps.check.result
        data: { total: steps.check.data.total, dc: steps.check.data.dc }

  - id: feint
    tags: [skill-action]
    available: skills.deception.rank >= 1
    params:
      dc: { type: integer, optional: true }
    participants:
      target:
        max: 1
        fields:
          perception.dc: { type: integer }
    results: { bands: degree }
    steps:
      - id: check
        kind: action
        use: check
        tags: [skill-action.feint]
        params:
          check: "'skills.deception.mod'"
          dc: >-
            size(participants.target) > 0 && has(participants.target[0].perception.dc)
              ? participants.target[0].perception.dc : has(params.dc) ? params.dc : null
      - id: mark
        kind: changes
        when: "size(participants.target) > 0 && steps.check.result in ['success', 'critical-success']"
        changes:
          - { type: set, field: feint.target, value: 'participants.target[0].id' }
          - { type: set, field: feint.next, value: "steps.check.result == 'success'" }
          - {
              type: set,
              field: feint.turns,
              value: "steps.check.result == 'critical-success' ? 2 : 1",
            }
      - id: result
        kind: outcome
        result: steps.check.result
        data: { total: steps.check.data.total, dc: steps.check.data.dc }

  - id: create-a-diversion
    tags: [skill-action]
    params:
      dc: { type: integer, optional: true }
    participants:
      observer:
        fields:
          perception.dc: { type: integer }
    results: { bands: degree }
    steps:
      - id: using
        kind: choice
        recommend: "'deception'"
        options:
          - { id: deception }
          - id: performance
            when: '@feats.skill.distracting-performance in feats.held'
      - id: check
        kind: action
        use: check
        tags: [skill-action.create-a-diversion]
        params:
          check: "'skills.' + steps.using.picked + '.mod'"
          dc: >-
            size(participants.observer) == 1 && has(participants.observer[0].perception.dc)
              ? participants.observer[0].perception.dc : has(params.dc) ? params.dc : null
      - id: dcs
        kind: branch
        each: observer
        cases:
          - when: true
            flags:
              dc: 'has(participant.perception.dc) ? participant.perception.dc : has(params.dc) ? params.dc : -1'
      - id: against
        kind: roll
        each: observer
        of: check/roll
        bands: degree
      - id: result
        kind: outcome
        result: >-
          size(participants.observer) > 1
            ? ['critical-failure', 'failure', 'success', 'critical-success'][minList(mapList(steps.against, indexOf(['critical-failure', 'failure', 'success', 'critical-success'], x.band)), x)]
            : steps.check.result
        data:
          total: steps.check.data.total
          dc: steps.check.data.dc
          degrees: >-
            size(participants.observer) > 0
              ? mapList(steps.against, x.band) : []

