  - id: make-an-impression
    tags: [exploration-action]
    params:
      dc: { type: integer, optional: true }
    participants:
      target:
        fields:
          saves.will.dc: { type: integer }
    results: { bands: degree }
    steps:
      - id: using
        kind: choice
        recommend: "'diplomacy'"
        options:
          - { id: diplomacy }
          - id: performance
            when: '@feats.skill.impressive-performance in feats.held'
          - { id: society, when: '@feats.skill.courtly-graces in feats.held' }
      - id: check
        kind: action
        use: check
        tags: [skill-action.make-an-impression]
        situational:
          penalty: >-
            situational.penalty + (size(participants.target) > 1
              && !(@feats.skill.group-impression in feats.held)
              && !(steps.using.picked == 'performance') ? 2 : 0)
        params:
          check: "'skills.' + steps.using.picked + '.mod'"
          dc: >-
            size(participants.target) == 1 && has(participants.target[0].saves.will.dc)
              ? participants.target[0].saves.will.dc : has(params.dc) ? params.dc : null
      - id: dcs
        kind: branch
        each: target
        cases:
          - when: true
            flags:
              dc: 'has(participant.saves.will.dc) ? participant.saves.will.dc : has(params.dc) ? params.dc : -1'
      - id: against
        kind: roll
        each: target
        of: check/roll
        bands: degree
      - id: result
        kind: outcome
        result: >-
          size(participants.target) > 1
            ? ['critical-failure', 'failure', 'success', 'critical-success'][minList(mapList(steps.against, indexOf(['critical-failure', 'failure', 'success', 'critical-success'], x.band)), x)]
            : steps.check.result
        data:
          total: steps.check.data.total
          dc: steps.check.data.dc
          degrees: >-
