# Entering a stance removes every applied stance before applying its own. A stance's unarmed attacks
# are its standard copies, so they exist only while the stance is applied.
contentTypes:
  effect:
    state:
      value: { type: integer, default: 0, min: 0 }
      # How long it lasts on another creature, by its applier's turns (`turn-boundary`): until
      # the start of the applier's next turn, the end of its next turn, or the end of its
      # current turn (the next turn has begun). `none`: as the rules or the app end it.
      duration: { type: enum, values: [none, next-start, next-end, end], default: none }
      # Put on by a rogue's Debilitating Strike: a new debilitation ends it.
      debilitation: { type: boolean, default: false }

tags:
  - class-action
  - stance
  - feat-action
  - trait.backswing
  - trait.backstabber
  - trait.bravado
  - trait.finisher
  - trait.incapacitation
  - trait.monk
  - trait.venomous

display:
  groups:
    - id: effects
      kind: content
      priority: 0
      members: { type: effect, from: applied }
    - id: class-actions
      kind: actions
      priority: 0
      members:
        type: action
        where: >-
          'class-action' in item.tags || 'stance' in item.tags || 'feat-action' in item.tags
            || 'hunt-prey' in item.tags
  types:
    effect: { quantity: { hidden: true } }
