            changes: [{ type: adjust, field: spellBlending.rank6.cantrips, by: 1 }]
          - id: rank7-up1
            when: flags.base7 >= 2 && 8 <= spellcasting.maxRank
            flags: { base7: flags.base7 - 2, slots7: flags.slots7 - 2, slots8: flags.slots8 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank7.up1, by: 1 }]
