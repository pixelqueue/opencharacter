            changes: [{ type: adjust, field: spellBlending.rank2.cantrips, by: 1 }]
          - id: rank3-up1
            when: flags.base3 >= 2 && 4 <= spellcasting.maxRank
            flags: { base3: flags.base3 - 2, slots3: flags.slots3 - 2, slots4: flags.slots4 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank3.up1, by: 1 }]
