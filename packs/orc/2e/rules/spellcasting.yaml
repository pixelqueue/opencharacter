            changes: [{ type: adjust, field: spellBlending.rank9.cantrips, by: 1 }]
      - id: cantrips
        kind: choice
        when: flags.cantrips > 0
        options:
          content:
            type: spell
            where: >-
              'trait.cantrip' in item.tags && !('trait.focus' in item.tags)
                && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
                && picks == 0
        repeat: { max: flags.cantrips + spellcasting.extraCantrips }
        changes:
          - { type: addItem, entry: { item: picked.id } }
      - id: rank1
        kind: choice
        when: flags.slots1 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)
                && item.rank <= 1 && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.slots1 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 1 } } }
      - id: rank2
        kind: choice
        when: flags.slots2 > 0
