                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.slots4 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 4 } } }
      - id: rank5
        kind: choice
        when: flags.slots5 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)
                && item.rank <= 5 && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.slots5 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 5 } } }
      - id: rank6
        kind: choice
        when: flags.slots6 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)
                && item.rank <= 6 && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.slots6 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 6 } } }
      - id: rank7
        kind: choice
        when: flags.slots7 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)
                && item.rank <= 7 && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.slots7 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 7 } } }
      - id: rank8
        kind: choice
        when: flags.slots8 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)
                && item.rank <= 8 && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.slots8 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 8 } } }
      - id: rank9
        kind: choice
        when: flags.slots9 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)
                && item.rank <= 9 && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.slots9 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 9 } } }
      - id: rank10
        kind: choice
        when: spellSlots.rank10.max > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)
                && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: spellSlots.rank10.max }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 10 } } }
      - id: splitSlot
        kind: choice
        when: '@feats.wizard.split-slot in feats.held'
        options: [{ id: none }, { id: split }]
        recommend: "'none'"
      - id: splitWith
        kind: choice
        sheet: proposed
        when: has(steps.splitSlot) && steps.splitSlot.picked == 'split'
        options:
          copies:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !self.font && self.split == ''
                && self.rank < spellcasting.maxRank
      - id: splitSpell
        kind: choice
        when: has(steps.splitWith)
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags)
                && item.rank <= steps.splitWith.self.rank
                && ('tradition.' + spellcasting.tradition) in item.tags
                && (spellcasting.fromBook ? item.id in spells.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        changes:
          - type: addItem
            entry:
              item: picked.id
              state: { rank: steps.splitWith.self.rank, split: steps.splitWith.picked }
      - id: font
        kind: changes
        when: spellcasting.fontSlots > 0 && spellcasting.font != 'none'
        changes:
          - type: addItem
            forEach: '[1, 2, 3, 4, 5, 6]'
            when: x <= spellcasting.fontSlots
            entry:
              item: "'orc-2e:spells.' + spellcasting.font"
              state: { rank: spellcasting.fontRank, font: true }
      - id: result
        kind: outcome
        result: "'prepared'"

display:
  groups:
    - id: spellcasting
      priority: 1
      showWhen: >-
        spellcasting.tradition != 'none' || spellcasting.archetype.any
          || focus.points > 0 || size(spells.innate) > 0
    - id: spell-slots
      priority: 2
      showWhen: spellcasting.slotsPerRank > 0
    - id: spell-actions
      kind: actions
      priority: 1
      showWhen: >-
        spellcasting.tradition != 'none' || spellcasting.archetype.any
          || focus.points > 0 || size(spells.innate) > 0
      members: { type: action, where: "'spell' in item.tags" }
    - id: spells
      kind: content
      priority: 1
      showWhen: >-
        spellcasting.tradition != 'none' || spellcasting.archetype.any
          || focus.points > 0 || size(spells.innate) > 0
      members: { type: spell }
      sortBy: item.rank
    - id: spell-effects
      kind: content
      priority: 0
      members: { type: spell, from: applied }
  fields:
    spellcasting.tradition:
      { groups: [spellcasting], priority: 0, showWhen: "spellcasting.tradition != 'none'" }
    spellcasting.kind:
      { groups: [spellcasting], priority: 1, showWhen: "spellcasting.tradition != 'none'" }
    spellcasting.attack:
      {
        groups: [spellcasting],
        priority: 0,
        format: signed,
        showWhen: "spellcasting.tradition != 'none'",
        rolls: [{ action: spell-attack, params: { field: spellcasting.attack } }],
      }
    spellcasting.dc:
      { groups: [spellcasting], priority: 0, showWhen: "spellcasting.tradition != 'none'" }
    spellcasting.rank:
      {
        groups: [spellcasting, proficiencies],
        priority: 1,
        format: { bands: rank },
        showWhen: spellcasting.rank > 0,
      }
    spellcasting.innate.attack:
      {
        groups: [spellcasting],
        priority: 2,
        format: signed,
        showWhen: size(spells.innate) > 0,
        rolls: [{ action: spell-attack, params: { field: spellcasting.innate.attack } }],
      }
    spellcasting.innate.dc:
      { groups: [spellcasting], priority: 2, showWhen: size(spells.innate) > 0 }
    focus.points: { groups: [spellcasting], priority: 0, showWhen: focus.points > 0 }
    focus.spent:
      {
        groups: [spellcasting],
        priority: 0,
        showWhen: focus.points > 0,
        with: [{ field: focus.points, as: max }],
      }
    spells.autoRank: { groups: [spellcasting], priority: 2 }
    spellcasting.maxRank: { groups: [spell-slots], priority: 1 }
    spellcasting.font:
      { groups: [spellcasting], priority: 1, showWhen: "spellcasting.font != 'none'" }
    spellcasting.fontSlots:
      { groups: [spell-slots], priority: 1, showWhen: spellcasting.fontSlots > 0 }
    spellcasting.fontRank:
      { groups: [spell-slots], priority: 1, showWhen: spellcasting.fontSlots > 0 }
    spellSlots.rank1.max: { groups: [spell-slots], priority: 0, showWhen: spellSlots.rank1.max > 0 }
    spellSlots.rank1.used:
      {
        groups: [spell-slots],
        priority: 0,
        showWhen: spellSlots.rank1.max > 0,
        with: [{ field: spellSlots.rank1.max, as: max }],
      }
    spellSlots.rank2.max: { groups: [spell-slots], priority: 0, showWhen: spellSlots.rank2.max > 0 }
