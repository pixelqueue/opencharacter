          - id: rank5-up1
            when: flags.base5 >= 2 && 6 <= spellcasting.maxRank
            flags: { base5: flags.base5 - 2, slots5: flags.slots5 - 2, slots6: flags.slots6 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank5.up1, by: 1 }]
          - id: rank5-up2
            when: flags.base5 >= 2 && 7 <= spellcasting.maxRank
            flags: { base5: flags.base5 - 2, slots5: flags.slots5 - 2, slots7: flags.slots7 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank5.up2, by: 1 }]
          - id: rank5-cantrips
            when: flags.base5 >= 1
            flags:
