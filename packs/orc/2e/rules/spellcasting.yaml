              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank4.cantrips > 0,
              field: spellBlending.rank4.cantrips,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank5.up1 > 0,
              field: spellBlending.rank5.up1,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank5.up2 > 0,
              field: spellBlending.rank5.up2,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank5.cantrips > 0,
              field: spellBlending.rank5.cantrips,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank6.up1 > 0,
              field: spellBlending.rank6.up1,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank6.up2 > 0,
              field: spellBlending.rank6.up2,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank6.cantrips > 0,
              field: spellBlending.rank6.cantrips,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank7.up1 > 0,
              field: spellBlending.rank7.up1,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank7.up2 > 0,
              field: spellBlending.rank7.up2,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank7.cantrips > 0,
              field: spellBlending.rank7.cantrips,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank8.up1 > 0,
              field: spellBlending.rank8.up1,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank8.cantrips > 0,
              field: spellBlending.rank8.cantrips,
              value: 0,
            }
          - {
              type: set,
              when: spellBlending.rank9.cantrips > 0,
              field: spellBlending.rank9.cantrips,
              value: 0,
            }
      - id: slots
        kind: branch
        cases:
          - when: true
            flags:
              base1: spellSlots.rank1.max - spellBlending.rank1.net
              slots1: spellSlots.rank1.max - spellBlending.rank1.net
              base2: spellSlots.rank2.max - spellBlending.rank2.net
              slots2: spellSlots.rank2.max - spellBlending.rank2.net
              base3: spellSlots.rank3.max - spellBlending.rank3.net
              slots3: spellSlots.rank3.max - spellBlending.rank3.net
              base4: spellSlots.rank4.max - spellBlending.rank4.net
              slots4: spellSlots.rank4.max - spellBlending.rank4.net
              base5: spellSlots.rank5.max - spellBlending.rank5.net
              slots5: spellSlots.rank5.max - spellBlending.rank5.net
              base6: spellSlots.rank6.max - spellBlending.rank6.net
              slots6: spellSlots.rank6.max - spellBlending.rank6.net
              base7: spellSlots.rank7.max - spellBlending.rank7.net
              slots7: spellSlots.rank7.max - spellBlending.rank7.net
              base8: spellSlots.rank8.max - spellBlending.rank8.net
              slots8: spellSlots.rank8.max - spellBlending.rank8.net
              base9: spellSlots.rank9.max - spellBlending.rank9.net
              slots9: spellSlots.rank9.max - spellBlending.rank9.net
              cantrips: spellcasting.cantrips - spellBlending.cantrips
      - id: blend
        kind: choice
        when: wizard.thesis == 'spell-blending'
        repeat: { max: 40 }
        options:
          - id: rank1-up1
            when: flags.base1 >= 2 && 2 <= spellcasting.maxRank
            flags: { base1: flags.base1 - 2, slots1: flags.slots1 - 2, slots2: flags.slots2 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank1.up1, by: 1 }]
          - id: rank1-up2
            when: flags.base1 >= 2 && 3 <= spellcasting.maxRank
            flags: { base1: flags.base1 - 2, slots1: flags.slots1 - 2, slots3: flags.slots3 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank1.up2, by: 1 }]
          - id: rank1-cantrips
            when: flags.base1 >= 1
            flags:
              { base1: flags.base1 - 1, slots1: flags.slots1 - 1, cantrips: flags.cantrips + 2 }
            changes: [{ type: adjust, field: spellBlending.rank1.cantrips, by: 1 }]
          - id: rank2-up1
            when: flags.base2 >= 2 && 3 <= spellcasting.maxRank
            flags: { base2: flags.base2 - 2, slots2: flags.slots2 - 2, slots3: flags.slots3 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank2.up1, by: 1 }]
          - id: rank2-up2
            when: flags.base2 >= 2 && 4 <= spellcasting.maxRank
            flags: { base2: flags.base2 - 2, slots2: flags.slots2 - 2, slots4: flags.slots4 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank2.up2, by: 1 }]
          - id: rank2-cantrips
            when: flags.base2 >= 1
            flags:
