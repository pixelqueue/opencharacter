            when: flags.base6 >= 2 && 8 <= spellcasting.maxRank
            flags: { base6: flags.base6 - 2, slots6: flags.slots6 - 2, slots8: flags.slots8 + 1 }
            changes: [{ type: adjust, field: spellBlending.rank6.up2, by: 1 }]
          - id: rank6-cantrips
            when: flags.base6 >= 1
            flags:
