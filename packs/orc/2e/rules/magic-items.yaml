    state:
      charges: { type: integer, default: 0, min: 0 }
      prepared: { type: boolean, default: false }
      container: { type: string, default: '' }
    actions:
      - use: prepare-staff
      - use: sell
      - use: store
      - use: retrieve

  wand:
    carried: true
    equippable: true
    fields:
      level: { type: integer, required: true, min: 0, max: 30 }
      price: { type: decimal, min: 0 }
      bulk: { type: decimal, default: 0.1, min: 0 }
      spellRank: { type: integer, required: true, min: 1, max: 10 }
    effects:
      - target: { choices: [spell-cost] }
        op: option
        when: >-
          action.self.id == self.id && self.equipped && !self.broken && !self.castToday
            && countList(keysOf('tradition'), ('tradition.' + x) in action.item.tags && fieldOf('spellcasting.casts.{tradition}', x)) > 0
        value:
          id: cast
          flags: { itemPaid: true, rank: item.spellRank }
          changes:
            - { type: setState, entry: self, key: castToday, value: true }
      - target: { choices: [spell-cost] }
        op: option
        when: >-
          action.self.id == self.id && self.equipped && !self.broken && self.castToday
            && !self.overcharged && countList(keysOf('tradition'), ('tradition.' + x) in action.item.tags && fieldOf('spellcasting.casts.{tradition}', x)) > 0
        value:
          id: overcharge
          flags: { itemPaid: true, rank: item.spellRank, overcharge: true }
          changes:
            - { type: setState, entry: self, key: overcharged, value: true }
    state:
      castToday: { type: boolean, default: false }
      overcharged: { type: boolean, default: false }
      broken: { type: boolean, default: false }
      container: { type: string, default: '' }
    actions:
      - use: sell
      - use: store
      - use: retrieve

situational:
  - { id: usingSight, type: boolean, default: false, rolls: [perception] }

constraints:
  - id: one-prepared-staff
    check: "countCopies(copy.type == 'staff' && copy.state.prepared) <= 1"

actions:
  - id: prepare-staff
    tags: [inventory, spell, rest]
    available: '!self.prepared && spellcasting.maxRankAny > 0'
    params:
      expend: { type: string, optional: true }
    results: [prepared]
    steps:
      - id: extra
        kind: branch
        cases:
          - when: >-
              has(params.expend)
                && countCopies(copy.id == params.expend && copy.type == 'spell'
                  && !copy.state.expended && !('trait.cantrip' in copy.tags)) > 0
            flags:
              extra: "sumCopies(copy.state.rank, copy.id == params.expend && copy.type == 'spell')"
          - when: true
            flags: { extra: 0 }
      - id: prepare
        kind: changes
        changes:
          - type: setState
            when: "countCopies(copy.type == 'staff' && copy.state.prepared) > 0"
            copies: { type: staff, where: self.prepared }
            key: charges
            value: 0
          - type: setState
            when: "countCopies(copy.type == 'staff' && copy.state.prepared) > 0"
            copies: { type: staff, where: self.prepared }
            key: prepared
            value: false
          - { type: setState, entry: self, key: prepared, value: true }
          - type: setState
            entry: self
            key: charges
            value: spellcasting.maxRankAny + flags.extra
          - type: setState
            when: flags.extra > 0
            entry: { formula: params.expend }
            key: expended
            value: true
      - id: result
        kind: outcome
        result: "'prepared'"
        data: { charges: spellcasting.maxRankAny + flags.extra }

display:
  groups:
    - id: worn-items
      kind: content
      priority: 1
      members: { type: worn }
      sortBy: item.level
    - id: held-items
      kind: content
      priority: 1
      members: { type: held }
      sortBy: item.level
    - id: staves
      kind: content
      priority: 1
      members: { type: staff }
    - id: wands
      kind: content
      priority: 1
      members: { type: wand }
  types:
    worn:
      state:
        invested: { priority: 0 }
        used: { priority: 1 }
        apex: { hidden: true }
        container: { hidden: true }
      quantity: { hidden: true }
    held:
      state:
        invested: { priority: 0, showWhen: "'trait.invested' in item.tags" }
        used: { priority: 1 }
        container: { hidden: true }
    staff:
      state:
        charges: { priority: 0 }
        prepared: { priority: 0 }
        container: { hidden: true }
      quantity: { hidden: true }
    wand:
      state:
        castToday: { priority: 0 }
        overcharged: { priority: 1 }
        broken: { priority: 0 }
        container: { hidden: true }

tags:
  - activation
  - trait.arcane
  - trait.unique
  - trait.scroll
  - trait.precious
  - material
  - material.adamantine
  - material.cold-iron
  - material.dawnsilver
  - material.duskwood
  - material.orichalcum
  - material.silver
  - material.dragonhide
  - trait.expandable
  - trait.kobold
  - trait.mechanical
  - trait.oil
  - trait.snare
  - trait.talisman
  - trait.trap
  - trait.staff
  - trait.wand
  - trait.focused
  - trait.companion
  - trait.cursed
  - trait.intelligent
  - trait.artifact
  - trait.structure
