# An activation that casts a spell grants the spell while the item works and adds an option to
# `cast-spell`'s `spell-cost` step that pays for it (a daily use, a staff's charges, a wand's daily
# cast or overcharge), so item spells are cast through `cast-spell` like any other.
contentTypes:
  worn:
    carried: true
    equippable: true
    texts: [activation]
    fields:
      level: { type: integer, required: true, min: 0, max: 30 }
      price: { type: decimal, min: 0 }
      bulk: { type: decimal, default: 0, min: 0 }
      usage:
        type: enum
        values:
          [
            worn,
            amulet,
            anklets,
            armbands,
            backpack,
            belt,
            bracelet,
            bracers,
            circlet,
            cloak,
            collar,
            eyepiece,
            garment,
            gloves,
            headwear,
            horseshoes,
            barding,
            mask,
            necklace,
            ring,
            shoes,
          ]
        default: worn
      activation:
        type: enum
        values: [none, free, reaction, one, two, three, cast, one-minute, ten-minutes, one-hour]
        default: none
      frequency:
        type: enum
        values:
          [none, once-per-round, once-per-minute, once-per-ten-minutes, once-per-hour, once-per-day]
        default: none
      capacity: { type: decimal, min: 0 }
      capacityItems: { type: integer, min: 1 }
    state:
      invested: { type: boolean, default: false }
      # Only the first apex item invested raises its attribute.
      apex: { type: boolean, default: false }
      used: { type: integer, default: 0, min: 0 }
      container: { type: string, default: '' }
    actions:
      - use: invest
      - use: divest
      - use: sell
      - use: store
      - use: retrieve

  held:
    carried: true
    equippable: true
    texts: [activation]
    fields:
      level: { type: integer, required: true, min: 0, max: 30 }
      price: { type: decimal, min: 0 }
      bulk: { type: decimal, default: 0, min: 0 }
      hands: { type: integer, default: 1, min: 0, max: 2 }
      activation:
        type: enum
        values: [none, free, reaction, one, two, three, cast, one-minute, ten-minutes, one-hour]
        default: none
      frequency:
        type: enum
        values:
          [none, once-per-round, once-per-minute, once-per-ten-minutes, once-per-hour, once-per-day]
        default: none
      capacity: { type: decimal, min: 0 }
      capacityItems: { type: integer, min: 1 }
    state:
      invested: { type: boolean, default: false }
      used: { type: integer, default: 0, min: 0 }
      container: { type: string, default: '' }
    actions:
      - use: invest
      - use: divest
      - use: sell
      - use: store
      - use: retrieve

  staff:
    carried: true
    equippable: true
    fields:
      level: { type: integer, required: true, min: 0, max: 30 }
      price: { type: decimal, min: 0 }
      bulk: { type: decimal, default: 1, min: 0 }
      tradition: { type: enum, values: [any, arcane, divine, occult, primal], default: any }
      'rank{rank}': { type: set, of: spell, default: [] }
    effects:
      - target: { choices: [spell-cost] }
        op: option
        when: >-
          action.self.id == self.id && self.equipped && self.prepared && action.item.id in item.rank1 && countList(keysOf('tradition'), ('tradition.' + x) in action.item.tags && fieldOf('spellcasting.maxRankFor.{tradition}', x) >= 1) > 0 && self.charges >= 1
        value:
          id: rank1
          flags: { itemPaid: true, rank: 1 }
          changes:
            - { type: adjustState, entry: self, key: charges, by: -1 }
      - target: { choices: [spell-cost] }
        op: option
        when: >-
          action.self.id == self.id && self.equipped && self.prepared && action.item.id in item.rank1 && countList(keysOf('tradition'), ('tradition.' + x) in action.item.tags && fieldOf('spellcasting.maxRankFor.{tradition}', x) >= 1) > 0 && self.charges >= 1 && ((spellcasting.kind == 'spontaneous' && ('tradition.' + spellcasting.tradition) in action.item.tags && spellSlots.rank1.used < spellSlots.rank1.max) || size(filterList(keysOf('archetypeSource'), fieldOf('spellcasting.archetype.{archetypeSource}.kind', x) == 'spontaneous' && ('tradition.' + fieldOf('spellcasting.archetype.{archetypeSource}.tradition', x)) in action.item.tags && fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.used', x, 1) < fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', x, 1))) > 0)
        value:
          id: rank1-slot
          flags: { itemPaid: true, rank: 1 }
          changes:
            - { type: adjustState, entry: self, key: charges, by: -1 }
            - type: adjust
              field:
                formula: >-
                  spellcasting.kind == 'spontaneous' && ('tradition.' + spellcasting.tradition) in action.item.tags && spellSlots.rank1.used < spellSlots.rank1.max ? 'spellSlots.rank1.used' : 'spellSlots.archetype.' + filterList(keysOf('archetypeSource'), fieldOf('spellcasting.archetype.{archetypeSource}.kind', x) == 'spontaneous' && ('tradition.' + fieldOf('spellcasting.archetype.{archetypeSource}.tradition', x)) in action.item.tags && fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.used', x, 1) < fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', x, 1))[0] + '.rank1.used'
