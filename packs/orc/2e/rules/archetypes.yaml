# A dedication can't be taken while another archetype's dedication is open (held with fewer than two
# other feats of its archetype). An archetype's additional feats are granted into
# `archetypes.extra.level<N>` from its archetype level on, carry `archetype-feat` so class feat
# choices offer them, and count toward the archetype's feats.
tags:
  - trait.archetype
  - trait.dedication
  - trait.multiclass
  - trait.vigilante
  - archetype-feat
  - archetype-feats
  - archetype-extra.at2
  - archetype-extra.at4
  - archetype-extra.at6
  - archetype-extra.at8
  - archetype-extra.at10
  - archetype-extra.at12
  - archetype-extra.at14
  - archetype-extra.at16
  - archetype-extra.at18
  - archetype-extra.at20
  - strike.archers-aim
  - strike.enchanting-shot
  - strike.fatal-shot
  - strike.grievous-blow
  - strike.suplex
  - strike.strangle
  - strike.aerial-piledriver

contentTypes:
  archetype:
    copies: { max: 0 }
    fields:
      dedication: { type: id, of: feat, required: true }
      multiclass: { type: id, of: class }

fields:
  archetypes.dedications: { type: set, of: feat }
  archetypes.open:
    type: integer
    formula: "sumFields(f.value > 0 && f.value < 3 ? 1 : 0, 'archetype-feats' in f.tags)"
  archetypes.openAllowance: { type: integer, formula: 0, min: 0 }
  archetypes.extra.level2: { type: set, of: feat, tags: [archetype-extra.at2] }
  archetypes.extra.level4: { type: set, of: feat, tags: [archetype-extra.at2, archetype-extra.at4] }
  archetypes.extra.level6:
    type: set
    of: feat
    tags: [archetype-extra.at2, archetype-extra.at4, archetype-extra.at6]
  archetypes.extra.level8:
