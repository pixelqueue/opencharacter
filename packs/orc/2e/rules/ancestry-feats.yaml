tags:
  - skill.lore.dwarf
  - skill.lore.elf
  - skill.lore.goblin
  - skill.lore.halfling
  - skill.lore.leshy
  - skill.lore.orc
  - sense.greater-darkvision

fields:
  attacks.familiar: { type: set, of: string }
  # Once-a-day feats keep their daily use in their pick's `used` state.
  bounceBack.ready: { type: boolean, formula: false }
  conditions.mistChild: { type: boolean, formula: false }
  conditions.obfuscated: { type: boolean, formula: false }

  skills.lore.dwarf.increases:
    type: integer
    input: true
    default: 0
    min: 0
    max: >-
      'skill.lore.dwarf' in skills.trained || 'skill.lore.dwarf' in skills.chosen
        ? skills.maxRank - 1 : 0
    tags:
      - skill-increase
      - lore
      - formula: "'skill.lore.dwarf' in skills.trained || 'skill.lore.dwarf' in skills.chosen ? [] : ['untrained']"
  skills.lore.dwarf.trainedByIncrease:
    {
      type: integer,
      input: true,
      default: 0,
      min: 0,
      max: 1,
      tags: [skill-increase, skill-training, skill.lore.dwarf, lore],
    }
  skills.lore.dwarf.rank:
    type: integer
    tags: [skill-rank, lore, skill.lore.dwarf]
    formula: "('skill.lore.dwarf' in skills.trained || 'skill.lore.dwarf' in skills.chosen ? 1 : 0) + skills.lore.dwarf.increases"
  skills.lore.dwarf.mod:
    type: integer
    tags:
      - check
      - skill
      - skill.lore.dwarf
      - attr.int
      - lore
      - formula: >-
          skills.lore.dwarf.rank == 0 ? ['untrained']
            : [['rank.trained', 'rank.expert', 'rank.master', 'rank.legendary'][min(4, skills.lore.dwarf.rank) - 1]]
    formula: 'attributes.int.mod + (skills.lore.dwarf.rank > 0 ? 2 * skills.lore.dwarf.rank + proficiency.level : proficiency.untrained)'
