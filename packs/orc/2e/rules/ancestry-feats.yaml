situational:
  - { id: againstOccult, type: boolean, default: false, rolls: [save] }
  - { id: againstDivine, type: boolean, default: false, rolls: [save] }
  - id: sameGround
    type: boolean
    default: false
    rolls: [strike]
    available: '@feats.ancestry.telluric-power in feats.held'
    effects:
      - target: { rolls: [damage.strike] }
        op: add
        value: roll.item.dice
        stackKey: circumstance-bonus
        tags: [{ formula: "'damage.' + roll.item.damageType" }]
        when: situational.sameGround && roll.item.range == 0
  - id: marginalized
    type: boolean
    default: false
    rolls: [skill.diplomacy, perception]
    available: '@feats.ancestry.monstrous-peacemaker in feats.held'
    effects:
      - target: { rolls: [skill.diplomacy, skill-action.sense-motive] }
        op: add
        value: 1
        stackKey: circumstance-bonus
        when: situational.marginalized
  - id: incredibleImprovisation
    type: boolean
    default: false
    rolls: [skill]
    available: '@feats.ancestry.incredible-improvisation in feats.held'
    effects:
      - target: { rolls: [untrained] }
        op: add
        value: 4
        stackKey: circumstance-bonus
        when: situational.incredibleImprovisation
  - { id: againstControl, type: boolean, default: false, rolls: [save, perception] }
  - { id: againstSleep, type: boolean, default: false, rolls: [save] }
  - { id: twiceAsLong, type: boolean, default: false, rolls: [skill, perception] }
  - { id: againstVoid, type: boolean, default: false, rolls: [save] }
  - { id: againstFey, type: boolean, default: false, rolls: [save, perception] }
  - { id: againstIllusion, type: boolean, default: false, rolls: [save.will, perception] }
  - id: againstRestraint
    type: boolean
    default: false
    rolls: [save]
  - id: ancestralFoe
    type: boolean
    default: false
    rolls: [strike]
    available: '@feats.ancestry.mountain-strategy in feats.held'
    effects:
      - target: { rolls: [damage.strike] }
        op: add
        value: roll.item.dice
        stackKey: circumstance-bonus
        tags: [{ formula: "'damage.' + roll.item.damageType" }]
        when: situational.ancestralFoe
  - id: superstition
    type: boolean
    default: false
    rolls: [save]
    available: >-
      @feats.ancestry.leshy-superstition in feats.held
        || @feats.ancestry.orc-superstition in feats.held
    effects:
      - target: { rolls: [save] }
        op: add
        value: 1
        stackKey: circumstance-bonus
        when: situational.superstition
# A skill trained by a skill increase counts as a training the player chose.
effects:
  - {
      target: skills.chosen,
      op: grant,
      value: { tag: skill.lore.dwarf },
      when: skills.lore.dwarf.trainedByIncrease > 0,
    }
  - {
      target: skills.chosen,
      op: grant,
      value: { tag: skill.lore.elf },
      when: skills.lore.elf.trainedByIncrease > 0,
    }
  - {
      target: skills.chosen,
      op: grant,
      value: { tag: skill.lore.goblin },
      when: skills.lore.goblin.trainedByIncrease > 0,
    }
  - {
      target: skills.chosen,
      op: grant,
      value: { tag: skill.lore.halfling },
      when: skills.lore.halfling.trainedByIncrease > 0,
    }
  - {
      target: skills.chosen,
      op: grant,
      value: { tag: skill.lore.leshy },
      when: skills.lore.leshy.trainedByIncrease > 0,
    }
  - {
      target: skills.chosen,
      op: grant,
      value: { tag: skill.lore.orc },
      when: skills.lore.orc.trainedByIncrease > 0,
    }

display:
  fields:
    attacks.familiar: { groups: [proficiencies], priority: 2, showWhen: size(attacks.familiar) > 0 }
    conditions.mistChild: { hidden: true }
    conditions.obfuscated: { hidden: true }
    bounceBack.ready: { hidden: true }
    skills.lore.dwarf.rank: { format: { bands: rank }, showWhen: skills.lore.dwarf.rank > 0 }
    skills.lore.dwarf.mod:
      {
        format: signed,
        rolls: [{ action: check, params: { check: skills.lore.dwarf.mod } }],
        with: [{ field: skills.lore.dwarf.rank, as: detail }],
        showWhen: skills.lore.dwarf.rank > 0,
      }
    skills.lore.elf.rank: { format: { bands: rank }, showWhen: skills.lore.elf.rank > 0 }
    skills.lore.elf.mod:
      {
        format: signed,
        rolls: [{ action: check, params: { check: skills.lore.elf.mod } }],
        with: [{ field: skills.lore.elf.rank, as: detail }],
        showWhen: skills.lore.elf.rank > 0,
      }
    skills.lore.goblin.rank: { format: { bands: rank }, showWhen: skills.lore.goblin.rank > 0 }
    skills.lore.goblin.mod:
      {
        format: signed,
        rolls: [{ action: check, params: { check: skills.lore.goblin.mod } }],
        with: [{ field: skills.lore.goblin.rank, as: detail }],
        showWhen: skills.lore.goblin.rank > 0,
      }
    skills.lore.halfling.rank: { format: { bands: rank }, showWhen: skills.lore.halfling.rank > 0 }
    skills.lore.halfling.mod:
      {
        format: signed,
        rolls: [{ action: check, params: { check: skills.lore.halfling.mod } }],
        with: [{ field: skills.lore.halfling.rank, as: detail }],
        showWhen: skills.lore.halfling.rank > 0,
      }
    skills.lore.leshy.rank: { format: { bands: rank }, showWhen: skills.lore.leshy.rank > 0 }
    skills.lore.leshy.mod:
      {
        format: signed,
        rolls: [{ action: check, params: { check: skills.lore.leshy.mod } }],
        with: [{ field: skills.lore.leshy.rank, as: detail }],
        showWhen: skills.lore.leshy.rank > 0,
      }
    skills.lore.orc.rank: { format: { bands: rank }, showWhen: skills.lore.orc.rank > 0 }
    skills.lore.orc.mod:
      {
        format: signed,
        rolls: [{ action: check, params: { check: skills.lore.orc.mod } }],
        with: [{ field: skills.lore.orc.rank, as: detail }],
        showWhen: skills.lore.orc.rank > 0,
      }
