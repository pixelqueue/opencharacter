# A skill's proficiency rank is derived: 1 when trained, plus the increases spent on it. Content
# that trains a skill grants its tag into `skills.trained` and adds 1 to `skills.trainings`; the
# player's training choices grant into `skills.chosen`. The increases input's `max` is the level's
# highest rank less the training, 0 while untrained; an untrained skill's increases input carries
# the computed tag `untrained`, so level-up leaves it out.
fields:
  # A skill trained twice counts once in the set, so the difference is trainings to spend elsewhere.
  skills.trained: { type: set, of: tag, members: { under: [skill], except: [skill.lore] } }
  skills.trainings: { type: integer, formula: 0 }
  skills.chosen: { type: set, of: tag, members: { under: [skill], except: [skill.lore] } }
  skills.acrobatics.increases:
    type: integer
    input: true
    default: 0
    min: 0
    max: >-
      'skill.acrobatics' in skills.trained || 'skill.acrobatics' in skills.chosen
        ? skills.maxRank - 1 - skills.acrobatics.granted : 0
    tags:
      - skill-increase
      - formula: "'skill.acrobatics' in skills.trained || 'skill.acrobatics' in skills.chosen ? [] : ['untrained']"
  skills.acrobatics.trainedByIncrease:
    {
      type: integer,
      input: true,
      default: 0,
      min: 0,
      max: 1,
      tags: [skill-increase, skill-training, skill.acrobatics],
    }
  skills.acrobatics.granted:
    { type: integer, formula: 0, min: 0, tags: [skill-granted, skill.acrobatics] }
  skills.acrobatics.rank:
    type: integer
    tags: [skill-rank, skill.acrobatics]
    formula: >-
      ('skill.acrobatics' in skills.trained || 'skill.acrobatics' in skills.chosen ? 1 : 0) +
      skills.acrobatics.increases + skills.acrobatics.granted
  skills.acrobatics.mod:
    type: integer
    tags:
      - check
      - skill
      - skill.acrobatics
      - attr.dex
      - formula: >-
          skills.acrobatics.rank == 0 ? ['untrained']
            : [['rank.trained', 'rank.expert', 'rank.master', 'rank.legendary'][min(4, skills.acrobatics.rank) - 1]]
    formula: >-
      attributes.dex.mod + (skills.acrobatics.rank > 0 ? 2 * skills.acrobatics.rank + proficiency.level : proficiency.untrained)
  skills.arcana.increases:
    type: integer
    input: true
    default: 0
