# A skill content trains twice, or content trains a skill the player already trained, frees a
# training in another skill of the player's choice, one not trained yet: content's trainings less
# the skills only content trains.
choices:
  - id: extra-training
    unique: skill-training
    pick: max(0, skills.trainings - countList(skills.trained, !(x in skills.chosen)))
    from:
      values:
        [
          skill.acrobatics,
          skill.arcana,
          skill.athletics,
          skill.crafting,
          skill.deception,
          skill.diplomacy,
          skill.intimidation,
          skill.medicine,
          skill.nature,
          skill.occultism,
          skill.performance,
          skill.religion,
          skill.society,
          skill.stealth,
          skill.survival,
          skill.thievery,
          skill.lore.academia,
          skill.lore.circus,
          skill.lore.farming,
          skill.lore.legal,
          skill.lore.scribing,
          skill.lore.underworld,
          skill.lore.warfare,
        ]
      where: '!(value in skills.trained) && !(value in skills.chosen) || value in choice.picks'
    effects:
      - { target: skills.chosen, op: grant, value: { formula: pick.value } }

# A skill trained by a skill increase counts as a training the player chose.
effects:
  - {
      target: skills.chosen,
      op: grant,
      value: { tag: skill.acrobatics },
      when: skills.acrobatics.trainedByIncrease > 0,
