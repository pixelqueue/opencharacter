# Each archetype that gives spellcasting is a spellcasting source of its own (a value of the
# `archetypeSource` family), with its own tradition, numbers, slots and spells, so two spellcasting
# dedications are two sources. `cast-spell` finds a spell's source from a prepared copy's `source`
# state, the repertoire that knows it, the source whose `spells` hold a focus spell, or the
# tradition of a scroll or wand the class can't cast.
families:
  archetypeSource:
    [
      bard,
      cleric,
      druid,
      oracle,
      sorcerer,
      witch,
      wizard,
      eldritchArcher,
      champion,
      blessedOne,
      monk,
    ]
  archetypeRank: [1, 2, 3, 4, 5, 6, 7, 8]
  tradition: [arcane, divine, occult, primal]

fields:
  'spellcasting.archetype.{archetypeSource}.tradition':
    { type: enum, values: [none, arcane, divine, occult, primal], formula: "'none'" }
  'spellcasting.archetype.{archetypeSource}.kind':
    { type: enum, values: [none, prepared, spontaneous], formula: "'none'" }
  'spellcasting.archetype.{archetypeSource}.attribute':
    { type: enum, values: [none, int, wis, cha], formula: "'none'" }
  'spellcasting.archetype.{archetypeSource}.rank': { type: integer, formula: 0, min: 0, max: 4 }
  'spellcasting.archetype.{archetypeSource}.proficiency':
    type: integer
    formula: >-
      spellcasting.archetype.{archetypeSource}.rank > 0
        ? 2 * spellcasting.archetype.{archetypeSource}.rank + proficiency.level : proficiency.untrained
  'spellcasting.archetype.{archetypeSource}.attributeMod':
    type: integer
    formula: >-
      spellcasting.archetype.{archetypeSource}.attribute == 'none' ? 0
        : fieldOf('attributes.{attribute}.mod', spellcasting.archetype.{archetypeSource}.attribute)
  'spellcasting.archetype.{archetypeSource}.attack':
    type: integer
    tags:
      - check
      - attack
      - spell-attack
      - formula: >-
          spellcasting.archetype.{archetypeSource}.attribute == 'none' ? []
            : ['attr.' + spellcasting.archetype.{archetypeSource}.attribute]
    formula: >-
      spellcasting.archetype.{archetypeSource}.attributeMod
        + spellcasting.archetype.{archetypeSource}.proficiency
  'spellcasting.archetype.{archetypeSource}.dc':
    type: integer
    tags:
      - dc
      - spell-dc
      - formula: >-
          spellcasting.archetype.{archetypeSource}.attribute == 'none' ? []
            : ['attr.' + spellcasting.archetype.{archetypeSource}.attribute]
    formula: >-
      10 + spellcasting.archetype.{archetypeSource}.attributeMod
        + spellcasting.archetype.{archetypeSource}.proficiency
  'spellcasting.archetype.{archetypeSource}.cantrips': { type: integer, formula: 0, min: 0 }
  'spellcasting.archetype.{archetypeSource}.bookCantrips': { type: integer, formula: 0, min: 0 }
  'spellcasting.archetype.{archetypeSource}.fromBook': { type: boolean, formula: false }
  'spellcasting.archetype.{archetypeSource}.benefits': { type: integer, formula: 0, min: 0, max: 3 }
  'spellcasting.archetype.{archetypeSource}.breadth': { type: boolean, formula: false }
  'spellcasting.archetype.{archetypeSource}.maxRank':
    type: integer
    formula: >-
      spellcasting.archetype.{archetypeSource}.benefits >= 3 && level >= 20 ? 8
        : spellcasting.archetype.{archetypeSource}.benefits >= 3 && level >= 18 ? 7
        : spellcasting.archetype.{archetypeSource}.benefits >= 2 && level >= 16 ? 6
        : spellcasting.archetype.{archetypeSource}.benefits >= 2 && level >= 14 ? 5
        : spellcasting.archetype.{archetypeSource}.benefits >= 2 && level >= 12 ? 4
        : spellcasting.archetype.{archetypeSource}.benefits >= 1 && level >= 8 ? 3
        : spellcasting.archetype.{archetypeSource}.benefits >= 1 && level >= 6 ? 2
        : spellcasting.archetype.{archetypeSource}.benefits >= 1 && level >= 4 ? 1 : 0
  'spellcasting.archetype.{archetypeSource}.signatures':
    type: integer
    formula: >-
      spellcasting.archetype.{archetypeSource}.kind != 'spontaneous' ? 0
        : (spellcasting.archetype.{archetypeSource}.benefits >= 1 && level >= 6 ? 1 : 0)
          + (spellcasting.archetype.{archetypeSource}.benefits >= 2 ? 1 : 0)
          + (spellcasting.archetype.{archetypeSource}.benefits >= 3 ? 1 : 0)
  'spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max':
    type: integer
    formula: >-
      spellcasting.archetype.{archetypeSource}.maxRank < {archetypeRank} ? 0
        : 1 + (spellcasting.archetype.{archetypeSource}.breadth
          && {archetypeRank} <= spellcasting.archetype.{archetypeSource}.maxRank - 2 ? 1 : 0)
  'spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.used':
    {
      type: integer,
      input: true,
      default: 0,
      min: 0,
      max: 'spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max',
    }
  'spells.archetype.{archetypeSource}.book': { type: set, of: spell }
  'spells.archetype.{archetypeSource}.repertoire': { type: set, of: spell }
  'spells.archetype.{archetypeSource}.repertoire.rank{archetypeRank}': { type: set, of: spell }
  'spells.archetype.{archetypeSource}.signature': { type: set, of: spell }
  'spells.archetype.{archetypeSource}.spells': { type: set, of: spell }
  spellcasting.archetype.any:
    type: boolean
    formula: >-
      countList(keysOf('archetypeSource'),
        fieldOf('spellcasting.archetype.{archetypeSource}.tradition', x) != 'none') > 0
  'spellcasting.casts.{tradition}':
    type: boolean
    formula: >-
      spellcasting.tradition == '{tradition}' || countList(keysOf('archetypeSource'),
        fieldOf('spellcasting.archetype.{archetypeSource}.tradition', x) == '{tradition}') > 0
  'spellcasting.maxRankFor.{tradition}':
    type: integer
    formula: >-
      max(spellcasting.tradition == '{tradition}' ? spellcasting.maxRank : 0,
        maxList(keysOf('archetypeSource'),
          fieldOf('spellcasting.archetype.{archetypeSource}.tradition', x) == '{tradition}'
            ? fieldOf('spellcasting.archetype.{archetypeSource}.maxRank', x) : 0))
  spellcasting.maxRankAny:
    type: integer
    formula: >-
      max(spellcasting.maxRank, maxList(keysOf('archetypeSource'),
        fieldOf('spellcasting.archetype.{archetypeSource}.maxRank', x)))

constraints:
  # Each rank is written out because an aggregate can't nest in a list function.
  - id: archetype-prepared-slots-cleric
    check: >-
      countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 1) <= spellSlots.archetype.cleric.rank1.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 2) <= spellSlots.archetype.cleric.rank2.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 3) <= spellSlots.archetype.cleric.rank3.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 4) <= spellSlots.archetype.cleric.rank4.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 5) <= spellSlots.archetype.cleric.rank5.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 6) <= spellSlots.archetype.cleric.rank6.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 7) <= spellSlots.archetype.cleric.rank7.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 8) <= spellSlots.archetype.cleric.rank8.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'cleric'
        && 'trait.cantrip' in copy.tags) <= spellcasting.archetype.cleric.cantrips
  - id: archetype-prepared-slots-druid
    check: >-
      countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 1) <= spellSlots.archetype.druid.rank1.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 2) <= spellSlots.archetype.druid.rank2.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 3) <= spellSlots.archetype.druid.rank3.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 4) <= spellSlots.archetype.druid.rank4.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 5) <= spellSlots.archetype.druid.rank5.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 6) <= spellSlots.archetype.druid.rank6.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 7) <= spellSlots.archetype.druid.rank7.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 8) <= spellSlots.archetype.druid.rank8.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'druid'
        && 'trait.cantrip' in copy.tags) <= spellcasting.archetype.druid.cantrips
  - id: archetype-prepared-slots-witch
    check: >-
      countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 1) <= spellSlots.archetype.witch.rank1.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 2) <= spellSlots.archetype.witch.rank2.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 3) <= spellSlots.archetype.witch.rank3.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 4) <= spellSlots.archetype.witch.rank4.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 5) <= spellSlots.archetype.witch.rank5.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 6) <= spellSlots.archetype.witch.rank6.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 7) <= spellSlots.archetype.witch.rank7.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 8) <= spellSlots.archetype.witch.rank8.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'witch'
        && 'trait.cantrip' in copy.tags) <= spellcasting.archetype.witch.cantrips
  - id: archetype-prepared-slots-wizard
    check: >-
      countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 1) <= spellSlots.archetype.wizard.rank1.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 2) <= spellSlots.archetype.wizard.rank2.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 3) <= spellSlots.archetype.wizard.rank3.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 4) <= spellSlots.archetype.wizard.rank4.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 5) <= spellSlots.archetype.wizard.rank5.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 6) <= spellSlots.archetype.wizard.rank6.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 7) <= spellSlots.archetype.wizard.rank7.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && !('trait.cantrip' in copy.tags) && copy.state.rank == 8) <= spellSlots.archetype.wizard.rank8.max
      && countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == 'wizard'
        && 'trait.cantrip' in copy.tags) <= spellcasting.archetype.wizard.cantrips
  - id: archetype-prepared-none
    check: >-
      countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source != ''
        && (!(copy.state.source in keysOf('archetypeSource'))
          || fieldOf('spellcasting.archetype.{archetypeSource}.kind', copy.state.source) != 'prepared')) == 0

actions:
  - id: prepare-archetype-spells
    tags: [spell, rest]
    available: >-
      countList(keysOf('archetypeSource'),
        fieldOf('spellcasting.archetype.{archetypeSource}.kind', x) == 'prepared') > 0
    params:
      source: { type: string, optional: true }
    results: [prepared, not-prepared]
    steps:
      - id: source
        kind: branch
        cases:
          - when: true
            flags:
              src: >-
                has(params.source) ? params.source
                  : filterList(keysOf('archetypeSource'), fieldOf('spellcasting.archetype.{archetypeSource}.kind', x) == 'prepared')[0]
      - id: notPrepared
        kind: outcome
        when: >-
          !(flags.src in keysOf('archetypeSource'))
            || fieldOf('spellcasting.archetype.{archetypeSource}.kind', flags.src) != 'prepared'
        result: "'not-prepared'"
      - id: numbers
        kind: branch
        cases:
          - when: true
            flags:
              tradition: "fieldOf('spellcasting.archetype.{archetypeSource}.tradition', flags.src)"
              fromBook: "fieldOf('spellcasting.archetype.{archetypeSource}.fromBook', flags.src)"
              book: "fieldOf('spells.archetype.{archetypeSource}.book', flags.src)"
              cantrips: "fieldOf('spellcasting.archetype.{archetypeSource}.cantrips', flags.src)"
              rank1: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', flags.src, 1)"
              rank2: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', flags.src, 2)"
              rank3: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', flags.src, 3)"
              rank4: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', flags.src, 4)"
              rank5: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', flags.src, 5)"
              rank6: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', flags.src, 6)"
              rank7: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', flags.src, 7)"
              rank8: "fieldOf('spellSlots.archetype.{archetypeSource}.rank{archetypeRank}.max', flags.src, 8)"
      - id: clear
        kind: changes
        changes:
          - type: removeItem
            when: >-
              countCopies(copy.type == 'spell' && has(copy.state.source) && copy.state.source == flags.src) > 0
            copies: { type: spell, where: self.source == flags.src }
      - id: cantrips
        kind: choice
        when: flags.cantrips > 0
        options:
          content:
            type: spell
            where: >-
              'trait.cantrip' in item.tags && !('trait.focus' in item.tags)
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
                && picks == 0
        repeat: { max: flags.cantrips }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { source: flags.src } } }
      - id: rank1
        kind: choice
        when: flags.rank1 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= 1
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.rank1 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 1, source: flags.src } } }
      - id: rank2
        kind: choice
        when: flags.rank2 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= 2
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.rank2 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 2, source: flags.src } } }
      - id: rank3
        kind: choice
        when: flags.rank3 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= 3
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.rank3 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 3, source: flags.src } } }
      - id: rank4
        kind: choice
        when: flags.rank4 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= 4
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.rank4 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 4, source: flags.src } } }
      - id: rank5
        kind: choice
        when: flags.rank5 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= 5
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.rank5 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 5, source: flags.src } } }
      - id: rank6
        kind: choice
        when: flags.rank6 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= 6
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.rank6 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 6, source: flags.src } } }
      - id: rank7
        kind: choice
        when: flags.rank7 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= 7
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.rank7 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 7, source: flags.src } } }
      - id: rank8
        kind: choice
        when: flags.rank8 > 0
        options:
          content:
            type: spell
            where: >-
              !('trait.cantrip' in item.tags) && !('trait.focus' in item.tags) && item.rank <= 8
                && ('tradition.' + flags.tradition) in item.tags
                && (flags.fromBook ? item.id in flags.book
                  : !('trait.uncommon' in item.tags) || item.id in spells.access)
        repeat: { max: flags.rank8 }
        changes:
          - { type: addItem, entry: { item: picked.id, state: { rank: 8, source: flags.src } } }
      - id: result
        kind: outcome
        result: "'prepared'"

display:
  groups:
    - id: archetype-spellcasting
      priority: 1
      showWhen: spellcasting.archetype.any
    - id: archetype-spell-slots
      priority: 2
      showWhen: >-
        countList(keysOf('archetypeSource'),
          fieldOf('spellcasting.archetype.{archetypeSource}.maxRank', x) > 0) > 0
  fields:
    'spellcasting.archetype.{archetypeSource}.tradition':
      {
        groups: [archetype-spellcasting],
        priority: 0,
        showWhen: "spellcasting.archetype.{archetypeSource}.tradition != 'none'",
      }
    'spellcasting.archetype.{archetypeSource}.kind':
      {
        groups: [archetype-spellcasting],
        priority: 1,
        showWhen: "spellcasting.archetype.{archetypeSource}.kind != 'none'",
      }
    'spellcasting.archetype.{archetypeSource}.attack':
      {
