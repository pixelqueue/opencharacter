classes.fighter.description: 'A master of weapons and armor. Key attribute: Strength or Dexterity. 10 Hit Points plus Constitution per level. Expert in Perception, Fortitude, Reflex, and simple and martial weapons and unarmed attacks; trained in Will, advanced weapons, all armor, unarmored defense and the fighter class DC. Trained in Acrobatics or Athletics and 3 more skills plus Intelligence.'
classes.fighter.name: Fighter

conditions.blinded.description: "You can't see. Perception checks that need sight critically fail; with vision as your only precise sense, –4 status penalty to Perception. Overrides dazzled."
conditions.blinded.name: Blinded
conditions.clumsy.description: 'Status penalty equal to the value to Dexterity-based rolls and DCs, including AC, Reflex saves and ranged attack rolls.'
conditions.clumsy.name: Clumsy
conditions.concealed.description: "You're hard to see: a creature targeting you must succeed at a DC 5 flat check."
conditions.concealed.name: Concealed
conditions.confused.description: "You're off-guard, you don't treat anyone as an ally, and you can't Delay, Ready or use reactions; you attack randomly."
conditions.confused.name: Confused
conditions.controlled.description: Another creature decides your actions.
conditions.controlled.name: Controlled
conditions.dazzled.description: 'Everything is concealed to you: targeting anything needs a DC 5 flat check.'
conditions.dazzled.name: Dazzled
conditions.deafened.description: "You can't hear: auditory Perception checks critically fail, and –2 status penalty to Perception checks."
conditions.deafened.name: Deafened
conditions.doomed.description: "You die at a lower dying value: 4 less your doomed value. It drops by 1 after a full night's rest."
conditions.doomed.name: Doomed
conditions.drained.description: 'Status penalty equal to the value to Constitution-based rolls and DCs (Fortitude), and you lose Hit Points equal to your level times the value, as does your maximum.'
conditions.drained.name: Drained
conditions.dying.description: "You're unconscious and near death. At the start of your turn, make a recovery check (a flat check, DC 10 + the value). You die at dying 4 (less doomed)."
conditions.dying.name: Dying
conditions.encumbered.description: "You're carrying too much: clumsy 1 and a –10-foot penalty to all your Speeds."
conditions.encumbered.name: Encumbered
conditions.enfeebled.description: 'Status penalty equal to the value to Strength-based rolls and DCs: Strength-based attack and damage rolls and Athletics checks.'
conditions.enfeebled.name: Enfeebled
conditions.fascinated.description: "–2 status penalty to Perception and skill checks, and you can't use concentrate actions unrelated to the subject."
conditions.fascinated.name: Fascinated
conditions.fatigued.description: "–1 status penalty to AC and saving throws, and you can't use exploration activities while traveling."
conditions.fatigued.name: Fatigued
conditions.fleeing.description: You must spend your actions trying to escape.
conditions.fleeing.name: Fleeing
conditions.frightened.description: Status penalty equal to the value to all your checks and DCs. It drops by 1 at the end of each of your turns.
conditions.frightened.name: Frightened
conditions.grabbed.description: "You're held in place: off-guard and immobilized."
conditions.grabbed.name: Grabbed
conditions.hidden.description: "A creature knows where you are but can't see you: it must succeed at a DC 11 flat check to target you."
conditions.hidden.name: Hidden
conditions.immobilized.description: "You can't use any action with the move trait."
conditions.immobilized.name: Immobilized
conditions.invisible.description: "You can't be seen: you're undetected to everyone (hidden once found)."
conditions.invisible.name: Invisible
conditions.off-guard.description: –2 circumstance penalty to AC.
conditions.off-guard.name: Off-Guard
conditions.paralyzed.description: "You can't act: off-guard, and you can only Recall Knowledge and use mental actions."
conditions.paralyzed.name: Paralyzed
conditions.persistent-damage.actions.take-persistent-damage.name: Take persistent damage
conditions.persistent-damage.description: 'You take the damage at the end of each of your turns, then attempt a DC 15 flat check to end it.'
conditions.persistent-damage.name: Persistent Damage
conditions.petrified.description: "You've been turned to stone and can't act or sense anything."
conditions.petrified.name: Petrified
conditions.prone.description: "You're lying on the ground: off-guard and –2 circumstance penalty to attack rolls."
conditions.prone.name: Prone
conditions.quickened.description: 'You gain 1 extra action at the start of each turn, usable only as the effect that quickened you allows.'
conditions.quickened.name: Quickened
conditions.restrained.description: "You're tied up or pinned: off-guard and immobilized, and you can't use attack or manipulate actions except to escape."
conditions.restrained.name: Restrained
conditions.sickened.actions.retch.name: Retch
conditions.sickened.actions.retch.params.dc.name: DC
conditions.sickened.description: "Status penalty equal to the value to all checks and DCs, and you can't willingly ingest anything. Retch to try to lower it."
conditions.sickened.name: Sickened
conditions.slowed.description: You regain that many fewer actions at the start of each turn.
conditions.slowed.name: Slowed
conditions.stunned.description: 'You lose that many actions at the start of your turn, and the value drops by the actions lost.'
conditions.stunned.name: Stunned
conditions.stupefied.description: 'Status penalty equal to the value to Intelligence-, Wisdom- and Charisma-based checks and DCs, including Will saves and Perception.'
conditions.stupefied.name: Stupefied
conditions.unconscious.description: "You can't act: –4 status penalty to AC, Perception and Reflex saves, and you're blinded and off-guard."
conditions.unconscious.name: Unconscious
conditions.wounded.description: 'Whenever you gain the dying condition, its value rises by your wounded value.'
conditions.wounded.name: Wounded

constraints.alive: 'Dying has reached its maximum: the character is dead.'
constraints.bulk-limit: More Bulk than the character can carry.
constraints.creation-ancestry-background-class: 'A new character needs an ancestry, a background and a class.'
constraints.one-flourish: Only one action with the flourish trait each turn.

creation.standard.description: 'Choose an ancestry and heritage, a background and a class, then the attribute boosts, feats, languages and skills they bring.'
creation.standard.name: Build a character
creation.random.description: 'A random class, ancestry, heritage and background, with every boost, skill, feat and language they bring picked for you.'
creation.random.name: A random character

feats.fighter.double-slice.actions.double-slice.name: Double Slice
feats.fighter.double-slice.actions.double-slice.steps.first.prompt: 'First Strike: choose a melee weapon'
feats.fighter.double-slice.actions.double-slice.steps.second.prompt: 'Second Strike: choose your other melee weapon'
feats.fighter.double-slice.description: 'Two actions. With a melee weapon in each hand, Strike with each, both at your current multiple attack penalty. The second Strike takes a –2 penalty unless its weapon is agile. If both hit the same creature, combine their damage.'
feats.fighter.double-slice.name: Double Slice
feats.fighter.dueling-parry.actions.parry.name: Dueling Parry
feats.fighter.dueling-parry.description: 'Wielding a one-handed melee weapon with your other hand free: a +2 circumstance bonus to AC until the start of your next turn.'
feats.fighter.dueling-parry.name: Dueling Parry
feats.fighter.exacting-strike.actions.exacting-strike.name: Exacting Strike
feats.fighter.exacting-strike.actions.exacting-strike.steps.weapon.prompt: Choose a weapon
feats.fighter.exacting-strike.description: "Press. Strike; if it fails, it doesn't count toward your multiple attack penalty."
feats.fighter.exacting-strike.name: Exacting Strike
feats.fighter.intimidating-strike.actions.intimidating-strike.name: Intimidating Strike
feats.fighter.intimidating-strike.actions.intimidating-strike.steps.weapon.prompt: Choose a melee weapon
feats.fighter.intimidating-strike.description: 'Two actions: Strike; on a hit, the target is frightened 1 (frightened 2 on a critical hit).'
feats.fighter.intimidating-strike.name: Intimidating Strike
feats.fighter.lunge.actions.lunge.name: Lunge
feats.fighter.lunge.actions.lunge.steps.weapon.prompt: Choose a melee weapon
feats.fighter.lunge.description: 'Strike with a melee weapon, with 5 more feet of reach for this Strike.'
feats.fighter.lunge.name: Lunge
feats.fighter.point-blank-stance.description: 'Stance. Your ranged Strikes ignore the volley trait, and you gain a +2 circumstance bonus to damage with ranged weapons within their first range increment.'
feats.fighter.point-blank-stance.name: Point-Blank Stance
feats.fighter.reactive-shield.actions.reactive-shield.name: Reactive Shield
feats.fighter.reactive-shield.description: 'Reaction, when an enemy hits you with a melee Strike: Raise a Shield, possibly turning the hit into a miss.'
feats.fighter.reactive-shield.name: Reactive Shield
feats.fighter.snagging-strike.actions.snagging-strike.name: Snagging Strike
feats.fighter.snagging-strike.actions.snagging-strike.steps.weapon.prompt: Choose a weapon
feats.fighter.snagging-strike.description: 'Strike with one hand free; on a hit, the target is off-guard until the start of your next turn.'
feats.fighter.snagging-strike.name: Snagging Strike
feats.fighter.sudden-charge.actions.sudden-charge.name: Sudden Charge
feats.fighter.sudden-charge.actions.sudden-charge.steps.weapon.prompt: Choose a melee weapon
feats.fighter.sudden-charge.description: 'Flourish, open. Two actions: Stride twice, then make a melee Strike.'
feats.fighter.sudden-charge.name: Sudden Charge
feats.fighter.vicious-swing.actions.vicious-swing.name: Vicious Swing
feats.fighter.vicious-swing.actions.vicious-swing.steps.weapon.prompt: Choose a melee weapon
feats.fighter.vicious-swing.description: 'Flourish. Two actions: a melee Strike that counts as two attacks for your multiple attack penalty and deals an extra weapon damage die (two at 10th level, three at 18th).'
feats.fighter.vicious-swing.name: Vicious Swing

features.fighter.armor-expertise.description: 'Expert in light, medium and heavy armor and unarmored defense. You gain the armor specialization effects of medium and heavy armor.'
features.fighter.armor-expertise.name: Armor Expertise
features.fighter.armor-mastery.description: 'Master in light, medium and heavy armor and unarmored defense.'
features.fighter.armor-mastery.name: Armor Mastery
features.fighter.battle-hardened.description: Your Fortitude proficiency becomes master. A success on a Fortitude save is a critical success.
features.fighter.battle-hardened.name: Battle Hardened
features.fighter.battlefield-surveyor.description: 'Your Perception proficiency becomes master, and you gain a +2 circumstance bonus to Perception checks for initiative.'
features.fighter.battlefield-surveyor.name: Battlefield Surveyor
features.fighter.bravery.description: 'Your Will proficiency becomes expert. A success on a Will save against fear is a critical success, and whenever you gain the frightened condition, reduce its value by 1.'
features.fighter.bravery.name: Bravery
features.fighter.combat-flexibility.choices.feat.prompt: Feat
features.fighter.combat-flexibility.description: "At your daily preparations, gain a fighter feat of 8th level or lower that you don't have, until your next preparations."
features.fighter.combat-flexibility.name: Combat Flexibility
features.fighter.fighter-expertise.description: Your fighter class DC proficiency becomes expert.
features.fighter.fighter-expertise.name: Fighter Expertise
features.fighter.greater-weapon-specialization.description: 'Weapon specialization damage becomes +4 at expert, +6 at master and +8 at legendary.'
features.fighter.greater-weapon-specialization.name: Greater Weapon Specialization
features.fighter.improved-flexibility.choices.feat.prompt: Feat
features.fighter.improved-flexibility.description: 'Combat Flexibility gives a second fighter feat, of 14th level or lower.'
features.fighter.improved-flexibility.name: Improved Flexibility
features.fighter.reactive-strike.actions.reactive-strike.name: Reactive Strike
features.fighter.reactive-strike.actions.reactive-strike.steps.weapon.prompt: Choose a melee weapon
features.fighter.reactive-strike.description: "Reaction. When a creature within your reach uses a manipulate or move action, makes a ranged attack or leaves a square during a move action, make a melee Strike against it. A critical hit on a manipulate action disrupts it. This Strike doesn't count toward or take your multiple attack penalty."
features.fighter.reactive-strike.name: Reactive Strike
features.fighter.shield-block.description: You gain the Shield Block general feat.
features.fighter.shield-block.name: Shield Block
features.fighter.tempered-reflexes.description: Your Reflex proficiency becomes master. A success on a Reflex save is a critical success.
features.fighter.tempered-reflexes.name: Tempered Reflexes
features.fighter.versatile-legend.description: 'Legendary in simple and martial weapons and unarmed attacks, master in advanced weapons and in the fighter class DC.'
features.fighter.versatile-legend.name: Versatile Legend
features.fighter.weapon-legend.choices.group.prompt: Weapon group
features.fighter.weapon-legend.description: 'Master in simple and martial weapons and unarmed attacks, expert in advanced weapons. Choose a weapon group: legendary in its simple and martial weapons and unarmed attacks, master in its advanced weapons.'
features.fighter.weapon-legend.name: Weapon Legend
features.fighter.weapon-mastery.choices.group.prompt: Weapon group
features.fighter.weapon-mastery.description: 'Choose a weapon group: master in its simple and martial weapons and unarmed attacks, expert in its advanced weapons. You gain critical specialization effects with weapons you are master in.'
features.fighter.weapon-mastery.name: Weapon Mastery
features.fighter.weapon-specialization.description: '+2 damage with weapons and unarmed attacks you are expert in, +3 if master, +4 if legendary.'
features.fighter.weapon-specialization.name: Weapon Specialization

