# Player Core 2's rituals: names, texts and short rules text, paraphrased.
rituals.astral-projection.name: 'Astral Projection'
rituals.astral-projection.texts.cost: "a gem worth the target's level (minimum 1) × 5 gp for each target"
rituals.astral-projection.texts.secondaryChecks: "Arcana or Occultism (the one the primary check doesn't use), Survival"
rituals.astral-projection.description: |-
  You and up to five willing casters, in a circle, project your spirits into the Astral Plane, leaving your bodies unconscious in stasis. Each astral form carries copies of the target's gear (what happens to a copy happens to the item). Any target can Dismiss its form to return; you can return everyone at once. A silver cord links each form to its body: if it's severed, both die. A target whose astral form is slain returns and attempts a Fortitude save against the primary check's DC: it dies on a failure, and on a success is clumsy 2, drained 2, doomed 2 and enfeebled 2 for 1 week, which nothing removes.
rituals.clone.name: 'Clone'
rituals.clone.texts.cost: "rare laboratory supplies worth the target's level (minimum 1) × 100 gp"
rituals.clone.texts.secondaryChecks: 'Arcana, Medicine, Occultism'
rituals.clone.description: |-
  From samples of a willing living creature of up to 20th level, you grow a duplicate body in an expanded alchemist's lab over 2d4 months. When the original dies, its soul enters the clone if it's free and willing (and fate allows).

  **Critical Success** The soul arrives clumsy 1, drained 1, doomed 1 and enfeebled 1 for 1 week, which nothing removes.

  **Success** As critical success, but each value is 2.

  **Failure** No clone forms.

  **Critical Failure** The clone seems fine, but it houses something malevolent instead of the soul.
rituals.fantastic-facade.name: 'Fantastic Facade'
rituals.fantastic-facade.texts.cost: 'mystical paint, veils and powdered minerals worth 20,000 gp'
rituals.fantastic-facade.texts.secondaryChecks: 'Deception; Society or Survival; Stealth'
rituals.fantastic-facade.description: |-
  You cloak a settlement up to a 1-mile radius around you in permanent, harmless illusions of your design: buildings, terrain and creatures can look, sound and smell as you choose, with simple repeating programs, and residents can be disguised as by a 3rd-rank illusory disguise. A creature interacting with it in a revealing way can try to disbelieve.

  **Critical Success** As success, and you can spend a day to reprogram it.

  **Success** You create the facade.

  **Failure** Nothing happens.

  **Critical Failure** Uncontrolled illusions (shifting colors, bad smells, skeletal-looking creatures) last a month.

  **Heightened (10th)** Cost 100,000 gp; radius up to 5 miles.
rituals.fortifying-brew.name: 'Fortifying Brew'
rituals.fortifying-brew.texts.cost: 'ingredients and brewing equipment worth 25 gp'
rituals.fortifying-brew.texts.secondaryChecks: 'Alcohol Lore (or a related Lore), Crafting, Society'
rituals.fortifying-brew.description: |-
  You brew a restorative drink for up to ten people, drunk over the ritual's last hour.

  **Critical Success** Each drinker benefits from 4th-rank cleanse affliction, clear mind and sound body (your primary check's modifier counteracts), and gains 20 temporary Hit Points and a +2 status bonus to saves against diseases and poisons for 12 hours.

  **Success** As critical success, but 10 temporary Hit Points and no bonus to saves.

  **Failure** A sour taste, nothing more.

  **Critical Failure** The drinkers become sickened 4 and can't reduce it for 12 hours.

  **Heightened (+1)** The temporary Hit Points increase by 2 (4 on a critical success).
rituals.gathering-call.name: 'Gathering Call'
rituals.gathering-call.texts.cost: 'rare oils and powdered minerals worth 5,000 gp'
rituals.gathering-call.texts.secondaryChecks: "Arcana or Occultism (the one the primary check doesn't use), Society"
rituals.gathering-call.description: |-
  You bind yourself and up to seven willing creatures of 14th level or lower to the place where you cast it, for 1 year. The primary check is secret.

  **Success** Any participant can Dismiss the ritual: each participant who chooses to returns to the spot where it stood during the casting, from anywhere on the same plane. The ritual then ends.

  **Failure** No connection forms, and you know it.

  **Critical Failure** The connection forms with a place on another plane, unbeknownst to you.

  **Heightened (+1)** Cost +5,000 gp, one more target, and the maximum level rises by 2.
rituals.heartbond.name: 'Heartbond'
rituals.heartbond.texts.cost: 'beverages and matching tokens worth 20 gp per secondary caster'
rituals.heartbond.texts.secondaryChecks: 'Diplomacy, Society'
rituals.heartbond.description: |-
  You bind two or more willing creatures who share genuine affection (the secondary casters), each given a token they must wear; destroying a token breaks the bond.

  **Critical Success** Once a day, each bonded creature can use a 2-action activity to learn another's direction, distance and conditions, and each can cast message at will as a divine innate spell targeting only another participant.

  **Success** As critical success, without message.

  **Failure** Nothing happens.

  **Critical Failure** For 1 week, each secondary caster is clumsy 2 and stupefied 2 within 30 feet of another.

  **Heightened (6th)** Cost 300 gp per secondary caster; on a success they also gain 6th-rank telepathy with each other, permanently.
rituals.inveigle.name: 'Inveigle'
rituals.inveigle.texts.cost: "rare oils worth 10 gp × the target's level"
rituals.inveigle.description: |-
  A creature of up to twice the ritual's rank in level becomes helpful toward you for 1 year or until you Dismiss it, seeing your suggestions as reasonable; a request against its nature lets it attempt a Will save to end the effect. An unwilling target can attempt a Will save to negate it.

  **Critical Success** As success, and it takes a -4 status penalty to Will saves to end the effect.

  **Success** The ritual works.

  **Failure** Nothing happens.

  **Critical Failure** The target becomes hostile to you for the duration.

  **Heightened (6th)** With a piece of the creature's body, you can cast it on a creature up to 1 mile away; the cost is 100 gp, and it lasts 1 week (blood, hair) or 1 month (a hand or the like).
rituals.phantasmal-custodians.name: 'Phantasmal Custodians'
rituals.phantasmal-custodians.texts.cost: 'rare oils, salts and herbs worth 15 gp'
rituals.phantasmal-custodians.texts.secondaryChecks: "Arcana or Occultism (the one the primary check doesn't use), Diplomacy"
rituals.phantasmal-custodians.description: |-
  Phantasmal minions tend a 100-by-100-foot area, up to 20 feet high, for 1 year. You command one with a single action (concentrate) to perform a basic task, which it keeps doing until commanded again; they aren't summoned and need no concentration.

  **Critical Success** Six minions.

  **Success** Three minions.

  **Failure** None.

  **Critical Failure** Six hostile minions that attack you and your allies (your primary check's modifier to hit, 1d6 force damage) and break your belongings in the area.

  **Heightened (6th)** Destroyed minions reform the next morning; the cost is 30 gp.
rituals.reincarnate.name: 'Reincarnate'
rituals.reincarnate.texts.cost: "rare herbs worth the target's level (minimum 1) × 25 gp"
rituals.reincarnate.texts.secondaryChecks: 'Occultism, Religion'
rituals.reincarnate.description: |-
  A creature of up to 8th level that died within the past week returns in a new body of a random ancestry (1d20: 1-14 a common one, 15-20 an uncommon or rare one, chosen by the GM). It takes the new ancestry's Hit Points, size, Speeds, boosts, flaws and traits, and replaces its heritage and ancestry feats; its background, class and languages stay. It fails if the soul can't or won't return.

  **Critical Success** A new adult body with full Hit Points and its spells prepared.

  **Success** As critical success, but 1 Hit Point and no spells prepared, and clumsy 2, drained 2 and enfeebled 2 for 1 week, which nothing removes.

  **Failure** Nothing happens.

  **Critical Failure** The soul is trapped in an unintelligent animal of up to half its level.

  **Heightened (4th to 10th)** Higher levels of target (10 at 4th up to 20 at 10th), higher costs, and from 6th a death within the past month.
rituals.rest-eternal.name: 'Rest Eternal'
rituals.rest-eternal.texts.cost: "oils worth the target's level (minimum 1) × 25 gp"
rituals.rest-eternal.texts.secondaryChecks: 'Occultism, Religion'
rituals.rest-eternal.description: |-
  You bar a dead creature's spirit from ever returning; an unwilling spirit can attempt a Will save (on a critical success it fools you). It has no effect on undead or a spirit not in the afterlife.

  **Critical Success** Attempts to speak with, revive, raise as undead or disturb it fail unless their counteract rank is at least 2 higher than this ritual's, or they come from an artifact or a deity. Returning it to life ends the ritual.

  **Success** As critical success, but an effect of a higher counteract rank works.

  **Failure** Nothing happens.

  **Critical Failure** The angered spirits make every caster doomed 1 for 1 week.
rituals.shadow-double.name: 'Shadow Double'
rituals.shadow-double.texts.cost: 'an item personal to the creature, plus oils and pigments worth 300 gp'
rituals.shadow-double.texts.secondaryChecks: 'the skill to Recall Knowledge about the creature; Crafting; Deception'
rituals.shadow-double.description: |-
  You shape a 4th-level illusory double of a living creature from shadow, with a monster's moderate numbers and no special abilities (they seem to fail). It can Impersonate the creature with the Deception modifier of the secondary caster who rolled Deception, +4 status bonus; a creature can disbelieve with Perception against that caster's Deception DC. The primary check is secret.

  **Critical Success** It's your minion, commanded through a mental link at any distance.

  **Success** As critical success, without the link: you command it in person.

  **Failure** Nothing happens.

  **Critical Failure** It's created hostile to the casters and plots their deaths.
rituals.teleportation-circle.name: 'Teleportation Circle'
rituals.teleportation-circle.texts.cost: 'rare incense, metals and chalk worth 500 gp'
rituals.teleportation-circle.texts.secondaryChecks: 'Crafting, Survival'
rituals.teleportation-circle.description: |-
  A 10-foot circle teleports any creature that moves fully into it to a fixed destination you can precisely identify within 1,000 miles on the same plane, for 1 day (an unwilling creature attempts a Will save each turn it stays). It works one way, or both for twice the cost. A secondary caster at the destination who succeeds at Survival makes your success a critical success.

  **Critical Success** Travelers arrive exactly.

  **Success** Off by about 1% of the distance (at most 10 miles).

  **Failure** It doesn't work.

  **Critical Failure** It leads to a random destination at about the same distance.

  **Heightened (9th)** 2,000 gp, 1 month, anywhere on the planet.

  **Heightened (10th)** 10,000 gp, unlimited, anywhere on the planet.
rituals.ward-domain.name: 'Ward Domain'
rituals.ward-domain.texts.cost: 'incense, oils and powdered silver worth 150 gp'
rituals.ward-domain.texts.secondaryChecks: 'Lore (any), Survival, Thievery'
rituals.ward-domain.description: |-
  For 1 week a 100-by-100-foot area, up to 50 feet high, is warded at the ritual's rank: its doors and windows are locked (lock), up to six entrances look like walls (illusory object), scrying can't perceive it, and teleportation and summoning into or out of it are counteracted (the ritual's DC - 10). Dispel magic ends one effect; detonate magic ends the ritual.

  **Critical Success** The area is twice as large.

  **Success** As described.

  **Failure** Nothing happens.

  **Critical Failure** The area becomes trapped and hostile to you and your allies.

  **Heightened (+1)** Another 100-by-100-foot area, up to 50 feet high, contiguous with it.
