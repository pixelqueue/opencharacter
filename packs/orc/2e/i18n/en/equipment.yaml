runes.corrosive.block: '**Corrosive rune** — *Rune 8*{has_tags, select, true { · {tags_name}} other {}} · 500 gp'
runes.corrosive.description: "On a hit, 1d6 extra acid damage. On a critical hit, the target's armor (or its raised shield) takes 3d6 acid damage."
runes.corrosive.name: Corrosive {base}
runes.decaying.block: '**Decaying rune** — *Rune 8*{has_tags, select, true { · {tags_name}} other {}} · 500 gp'
runes.decaying.description: 'On a hit, 1d4 extra void damage. On a critical hit, 2d4 persistent void damage (to a raised shield instead, if the target has one).'
runes.decaying.name: Decaying {base}
runes.energy-resistant.choices.damage-type.prompt: Damage type resisted
runes.energy-resistant.block: '**Energy resistant rune** — *Rune 8*{has_tags, select, true { · {tags_name}} other {}} · 420 gp'
runes.energy-resistant.description: "Resistance 5 to acid, cold, electricity or fire, chosen when it's made. Several on one armor must each resist a different type."
runes.energy-resistant.name: '{base} (energy resistant)'
runes.fearsome.block: '**Fearsome rune** — *Rune 5*{has_tags, select, true { · {tags_name}} other {}} · 160 gp'
runes.fearsome.description: 'On a critical hit, the target becomes frightened 1.'
runes.fearsome.name: Fearsome {base}
runes.flaming.block: '**Flaming rune** — *Rune 8*{has_tags, select, true { · {tags_name}} other {}} · 500 gp'
runes.flaming.description: 'On a hit, 1d6 extra fire damage, plus 1d10 persistent fire damage on a critical hit.'
