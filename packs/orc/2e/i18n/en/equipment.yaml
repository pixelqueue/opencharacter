runes.armor-potency-1.block: '**Armor potency (+1)** — *Rune 5*{has_tags, select, true { · {tags_name}} other {}} · 160 gp'
runes.armor-potency-1.description: "The armor's item bonus to AC rises by 1, and it can hold 1 property rune."
runes.armor-potency-1.name: +1 {base}
runes.armor-potency-2.block: '**Armor potency (+2)** — *Rune 11*{has_tags, select, true { · {tags_name}} other {}} · 1,060 gp'
runes.armor-potency-2.description: "The armor's item bonus to AC rises by 2, and it can hold 2 property runes."
runes.armor-potency-2.name: +2 {base}
runes.armor-potency-3.block: '**Armor potency (+3)** — *Rune 18*{has_tags, select, true { · {tags_name}} other {}} · 20,560 gp'
runes.armor-potency-3.description: "The armor's item bonus to AC rises by 3, and it can hold 3 property runes."
