runes.fortification.block: '**Fortification rune** — *Rune 12*{has_tags, select, true { · {tags_name}} other {}} · For medium or heavy armor · 2,000 gp'
runes.fortification.description: "When you're critically hit, a DC 17 flat check makes it a normal hit. The armor's Bulk and Strength rise by 1."
runes.fortification.name: '{base} (fortification)'
runes.frost.block: '**Frost rune** — *Rune 8*{has_tags, select, true { · {tags_name}} other {}} · 500 gp'
runes.frost.description: 'On a hit, 1d6 extra cold damage. On a critical hit, the target is slowed 1 until the end of your next turn unless it succeeds at a DC 24 Fortitude save.'
runes.frost.name: Frost {base}
runes.ghost-touch.block: '**Ghost touch rune** — *Rune 4*{has_tags, select, true { · {tags_name}} other {}} · 75 gp'
runes.ghost-touch.description: 'The weapon can harm incorporeal creatures, which are particularly vulnerable to it, and they can hold and wield it.'
