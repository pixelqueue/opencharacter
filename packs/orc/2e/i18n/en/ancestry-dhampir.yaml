# Player Core 2's dhampir: its ancestry or heritage, heritages and feats, in text written for the
# pack.
heritages.dhampir.name: 'Dhampir'
heritages.dhampir.description: 'Descended from a vampire. You gain the dhampir trait and void healing (vitality damage harms you and void effects heal you, as if you were undead), and low-light vision, or darkvision if your ancestry has low-light vision. You can take dhampir feats as ancestry feats.'
feats.ancestry.eyes-of-night-dhampir.name: 'Eyes of Night'
feats.ancestry.eyes-of-night-dhampir.description: "You gain darkvision. Only at 1st level; it can't be retrained."
feats.ancestry.fangs.name: 'Fangs'
feats.ancestry.fangs.description: 'You gain a fangs unarmed attack: 1d6 piercing, brawling group, grapple and unarmed.'
weapons.dhampir-fangs.name: 'Fangs'
feats.ancestry.discerning-lineage.name: 'Discerning Lineage'
feats.ancestry.discerning-lineage.description: 'A +1 circumstance bonus to Sense Motive, and to your Perception DC against attempts to Lie to you.'
feats.ancestry.enduring-lineage.name: 'Enduring Lineage'
feats.ancestry.enduring-lineage.description: "Drained, you take its Fortitude penalty and Hit Point loss as if its value were 1 lower. You're trained in Diplomacy (or a skill of your choice if you already were)."
feats.ancestry.vampire-lore.name: 'Vampire Lore'
feats.ancestry.vampire-lore.description: "You're trained in Religion and Society (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Vampire Lore."
feats.ancestry.voice-of-the-night.name: 'Voice of the Night'
feats.ancestry.voice-of-the-night.description: 'You can ask questions of, understand and use Diplomacy with bats, rats and wolves, with a +1 circumstance bonus to Make an Impression on them.'
feats.ancestry.enthralling-allure.name: 'Enthralling Allure'
feats.ancestry.enthralling-allure.description: 'You can cast charm once a day as a divine innate spell, at half your level rounded up, without its heightened duration or targets.'
feats.ancestry.necromantic-physiology.name: 'Necromantic Physiology'
feats.ancestry.necromantic-physiology.description: 'A +2 circumstance bonus to saves against diseases, and a success on one is a critical success (with another ability that improves it this way, a critical failure is a failure).'
feats.ancestry.undead-slayer.name: 'Undead Slayer'
feats.ancestry.undead-slayer.description: 'Against undead, a circumstance bonus to damage with weapon and unarmed Strikes equal to their damage dice; twice that against a vampire.'
feats.ancestry.bloodletting-fangs.name: 'Bloodletting Fangs'
feats.ancestry.bloodletting-fangs.description: 'A critical hit with a fangs Strike deals 1d4 persistent bleed damage too.'
feats.ancestry.bloodletting-fangs.prerequisites.fangs: 'A fangs unarmed attack'
feats.ancestry.night-magic.name: 'Night Magic'
feats.ancestry.night-magic.description: 'You can cast animal form (a wolf, as a canine) and mist once a day each as 2nd-rank divine innate spells.'
feats.ancestry.form-of-the-bat.name: 'Form of the Bat'
feats.ancestry.form-of-the-bat.description: 'Once an hour, 1 action (concentrate, divine, polymorph): you gain the effects of a 4th-rank pest form, always as a bat.'
feats.ancestry.symphony-of-blood.name: 'Symphony of Blood'
feats.ancestry.symphony-of-blood.description: 'You can cast vampiric exsanguination once a day as a 7th-rank divine innate spell.'
