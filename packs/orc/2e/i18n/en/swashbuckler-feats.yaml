# Swashbuckler feats to 20th level. Short rules text written for the pack.

feats.swashbuckler.flashy-dodge.name: 'Flashy Dodge'
feats.swashbuckler.flashy-dodge.description: 'Reaction. Requirement: not encumbered. Trigger: a creature you see targets you with an attack. +2 circumstance bonus to AC against it; if the Strike misses you gain panache until the end of your next turn.'
feats.swashbuckler.focused-fascination.name: 'Focused Fascination'
feats.swashbuckler.focused-fascination.description: 'In combat, Fascinating Performance aimed at a single target fascinates it on a success, not only a critical success.'
feats.swashbuckler.focused-fascination.prerequisites.fascinating-performance: 'Fascinating Performance'
feats.swashbuckler.one-for-all.name: 'One For All'
feats.swashbuckler.one-for-all.description: 'One action (auditory, concentrate, emotion, linguistic, mental). An ally within 30 feet: this prepares you to Aid it, and that Aid can use Diplomacy and gains the bravado trait.'
feats.swashbuckler.one-for-all.prerequisites.diplomacy: 'Trained in Diplomacy'
feats.swashbuckler.plummeting-roll.name: 'Plummeting Roll'
feats.swashbuckler.plummeting-roll.description: 'You gain Cat Fall and a reaction: when you fall at least 10 feet unhurt, you land on your feet and Stride up to half your Speed.'
feats.swashbuckler.plummeting-roll.prerequisites.acrobatics: 'Trained in Acrobatics'
feats.swashbuckler.after-you.name: 'After You'
feats.swashbuckler.after-you.description: "Free action. Trigger: you're about to roll initiative. You don't roll; you go last and gain panache (ties go NPCs first, then as the creatures choose)."
feats.swashbuckler.antagonize.name: 'Antagonize'
feats.swashbuckler.antagonize.description: "A creature you Demoralize can't lower frightened below 1 at the end of its turn until it takes a hostile action against you or can't sense you for a round."
feats.swashbuckler.charmed-life.name: 'Charmed Life'
feats.swashbuckler.charmed-life.description: 'Reaction. Trigger: you attempt a save. +2 circumstance bonus to it; a success gives you panache until the end of your next turn.'
feats.swashbuckler.charmed-life.prerequisites.charisma: 'Charisma +2'
feats.swashbuckler.enjoy-the-show.name: 'Enjoy the Show'
feats.swashbuckler.enjoy-the-show.description: 'When you Perform, you can target one creature within 30 feet with these results (bravado, auditory, linguistic). **Critical Success** -2 circumstance penalty to its attack rolls against others than you until the end of its next turn. **Success** -1. **Critical Failure** +1 circumstance bonus to its attacks against you.'
feats.swashbuckler.tumble-behind-swashbuckler.name: 'Tumble Behind (Swashbuckler)'
feats.swashbuckler.tumble-behind-swashbuckler.description: 'A foe you successfully Tumble Through is off-guard to your next attack this turn.'
feats.swashbuckler.dastardly-dash.name: 'Dastardly Dash'
feats.swashbuckler.dastardly-dash.description: 'One action, flourish. Stride half your Speed, and Trip (or Dirty Trick) one opponent you pass within reach.'
feats.swashbuckler.guardians-deflection.name: "Guardian's Deflection"
feats.swashbuckler.guardians-deflection.description: 'Reaction. Requirement: one one-handed melee weapon and other hands free. Trigger: an ally in your reach is hit by an attacker you see, and +2 AC would downgrade the hit. Give the ally +2 circumstance to AC against it, then gain panache until the end of your next turn.'
feats.swashbuckler.impaling-finisher.name: 'Impaling Finisher'
feats.swashbuckler.impaling-finisher.description: 'One action, finisher. Make a bludgeoning or piercing melee Strike compared against an adjacent foe and the foe directly behind it, damage rolled once; it counts as two attacks.'
feats.swashbuckler.leading-dance.name: 'Leading Dance'
feats.swashbuckler.leading-dance.description: 'One action (bravado, move). Requirement: adjacent to an enemy. Performance against its Will DC. **Critical Success** You both move up to 10 feet together, triggering no reactions. **Success** 5 feet. **Failure** You can move 5 feet alone, triggering reactions. **Critical Failure** You fall prone.'
feats.swashbuckler.leading-dance.prerequisites.performance: 'Trained in Performance'
feats.swashbuckler.agile-maneuvers.name: 'Agile Maneuvers'
feats.swashbuckler.agile-maneuvers.description: 'Your Disarm, Grapple, Reposition, Shove and Trip take -4/-8 multiple attack penalties (-3/-6 with an agile weapon while you have panache).'
feats.swashbuckler.agile-maneuvers.prerequisites.athletics: 'Expert in Athletics'
feats.swashbuckler.bleeding-finisher.name: 'Bleeding Finisher'
feats.swashbuckler.bleeding-finisher.description: 'One action, finisher. Make a slashing or piercing Strike; on a hit the target also takes persistent bleed damage equal to your precise strike finisher dice.'
feats.swashbuckler.bleeding-finisher.actions.bleeding-finisher.name: 'Bleeding Finisher'
feats.swashbuckler.bleeding-finisher.actions.bleeding-finisher.steps.weapon.prompt: 'Choose a weapon'
feats.swashbuckler.distracting-toss.name: 'Distracting Toss'
feats.swashbuckler.distracting-toss.description: 'Two actions (bravado, flourish). Feint a creature within 30 feet even beyond melee reach (off-guard applies to your thrown attacks), then draw and throw a weapon at it; with a free hand you catch the tossed weapon unless the Feint critically failed.'
feats.swashbuckler.dual-finisher.name: 'Dual Finisher'
feats.swashbuckler.dual-finisher.description: 'One action, finisher. Requirement: a melee weapon in each hand. Strike two different foes, one with each (the second at -2 unless agile); the penalty rises only after both.'
feats.swashbuckler.flashy-roll.name: 'Flashy Roll'
feats.swashbuckler.flashy-roll.description: 'You can use Flashy Dodge before a Reflex save, adding its bonus to the save; when the attack fails or the save succeeds you can Stride up to 10 feet as part of the reaction.'
feats.swashbuckler.flashy-roll.prerequisites.flashy-dodge: 'Flashy Dodge'
feats.swashbuckler.stunning-finisher.name: 'Stunning Finisher'
feats.swashbuckler.stunning-finisher.description: 'One action, finisher. Make a melee Strike; on a hit the foe attempts a Fortitude save against your class DC (incapacitation). **Critical Success** Unaffected. **Success** No reactions until its next turn. **Failure** Stunned 1. **Critical Failure** Stunned 3.'
feats.swashbuckler.stunning-finisher.actions.stunning-finisher.name: 'Stunning Finisher'
feats.swashbuckler.stunning-finisher.actions.stunning-finisher.steps.weapon.prompt: 'Choose a weapon'
feats.swashbuckler.vivacious-bravado.name: 'Vivacious Bravado'
feats.swashbuckler.vivacious-bravado.description: 'One action. Requirement: you gained panache this turn. Gain temporary Hit Points equal to your level + Charisma until the start of your next turn.'
feats.swashbuckler.vivacious-bravado.actions.vivacious-bravado.name: 'Vivacious Bravado'
feats.swashbuckler.vivacious-bravado.actions.vivacious-bravado.results.vigorous.name: 'Temporary Hit Points'
feats.swashbuckler.buckler-dance.name: 'Buckler Dance'
feats.swashbuckler.buckler-dance.description: "Stance. Requirement: a buckler. Your buckler is constantly raised while you meet Raise a Shield's requirements."
feats.swashbuckler.derring-do.name: 'Derring-do'
feats.swashbuckler.derring-do.description: "While you have panache, you roll twice and take the higher on checks Stylish Combatant's bonus applies to."
feats.swashbuckler.reflexive-riposte.name: 'Reflexive Riposte'
feats.swashbuckler.reflexive-riposte.description: 'At the start of each of your turns you gain an extra reaction usable only for Opportune Riposte.'
feats.swashbuckler.reflexive-riposte.prerequisites.riposte: 'Opportune Riposte'
feats.swashbuckler.stumbling-finisher.name: 'Stumbling Finisher'
feats.swashbuckler.stumbling-finisher.description: 'One action, finisher. Strike; on a hit the target is pushed 5 feet back (10 on a critical hit).'
feats.swashbuckler.stumbling-finisher.actions.stumbling-finisher.name: 'Stumbling Finisher'
feats.swashbuckler.stumbling-finisher.actions.stumbling-finisher.steps.weapon.prompt: 'Choose a weapon'
feats.swashbuckler.switcheroo.name: 'Switcheroo'
feats.swashbuckler.switcheroo.description: "Reaction. Requirement: adjacent to an enemy, with panache. Trigger: you're targeted by a ranged attack. Reposition the enemy with these results. **Critical Success** You swap places and it becomes the target. **Success** As critical success, it has lesser cover, and you lose panache. **Failure** You lose panache. **Critical Failure** You're off-guard to the attack and lose panache."
feats.swashbuckler.targeting-finisher.name: 'Targeting Finisher'
feats.swashbuckler.targeting-finisher.description: 'One action, finisher. Choose arm, head or legs and Strike; if you hit and deal damage, until the end of your next turn: arm, enfeebled 2; head, stupefied 2; legs, -10-foot status penalty to Speeds. A critical hit also gives enfeebled 1, stupefied 1 or -5 feet for 1 minute.'
feats.swashbuckler.targeting-finisher.actions.targeting-finisher.name: 'Targeting Finisher'
feats.swashbuckler.targeting-finisher.actions.targeting-finisher.steps.weapon.prompt: 'Choose a weapon'
feats.swashbuckler.targeting-finisher.actions.targeting-finisher.steps.part.prompt: 'Which part?'
feats.swashbuckler.targeting-finisher.actions.targeting-finisher.options.arm.name: 'Arm (enfeebled 2)'
feats.swashbuckler.targeting-finisher.actions.targeting-finisher.options.head.name: 'Head (stupefied 2)'
feats.swashbuckler.targeting-finisher.actions.targeting-finisher.options.legs.name: 'Legs (-10 feet of Speed)'
feats.swashbuckler.cheat-death.name: 'Cheat Death'
feats.swashbuckler.cheat-death.description: "Reaction. Trigger: damage would reduce you to 0 Hit Points. You stay at 1 Hit Point and gain panache but become doomed 1 (or +1), which lasts 10 minutes and can't be reduced."
feats.swashbuckler.get-used-to-disappointment.name: 'Get Used to Disappointment'
feats.swashbuckler.get-used-to-disappointment.description: 'Free action (bravado). Requirement: your turn begins and a target within 30 feet failed an attack or skill check against you on its last turn. Demoralize it; it is then immune for 1 minute.'
feats.swashbuckler.get-used-to-disappointment.prerequisites.intimidation: 'Expert in Intimidation'
feats.swashbuckler.mobile-finisher.name: 'Mobile Finisher'
feats.swashbuckler.mobile-finisher.description: 'One action, finisher. Stride (or Burrow, Climb, Fly or Swim), then Strike.'
feats.swashbuckler.mobile-finisher.actions.mobile-finisher.name: 'Mobile Finisher'
feats.swashbuckler.mobile-finisher.actions.mobile-finisher.steps.weapon.prompt: 'Choose a weapon'
feats.swashbuckler.the-bigger-they-are.name: 'The Bigger They Are'
feats.swashbuckler.the-bigger-they-are.description: 'One action (bravado). Tumble Through a creature at least one size larger. **Critical Success** You pass through (its squares are difficult terrain); having passed, it has weakness to your precision damage equal to half your level until the end of your turn. **Success** As critical success, only against your next attack. **Failure** Your movement ends, triggering reactions. **Critical Failure** As failure, and you fall prone.'
feats.swashbuckler.flamboyant-leap.name: 'Flamboyant Leap'
feats.swashbuckler.flamboyant-leap.description: 'Two actions. Requirement: you can use a finisher. Leap, High Jump or Long Jump (Long Jump DCs, up to double your Speed) and use a one-action finisher without movement during it; you land unhurt if the fall is no farther than the jump.'
feats.swashbuckler.flamboyant-leap.prerequisites.flamboyant-athlete: 'Flamboyant Athlete'
feats.swashbuckler.impossible-riposte.name: 'Impossible Riposte'
feats.swashbuckler.impossible-riposte.description: "You can Opportune Riposte when a foe outside your reach critically fails an attack against you: against a ranged attack your Strike turns it back, compared with the foe's AC and dealing the attack's damage type."
feats.swashbuckler.impossible-riposte.prerequisites.riposte: 'Opportune Riposte'
feats.swashbuckler.perfect-finisher.name: 'Perfect Finisher'
feats.swashbuckler.perfect-finisher.description: 'One action, finisher, fortune. Strike, rolling the attack twice and taking the better.'
feats.swashbuckler.perfect-finisher.actions.perfect-finisher.name: 'Perfect Finisher'
feats.swashbuckler.perfect-finisher.actions.perfect-finisher.steps.weapon.prompt: 'Choose a weapon'
feats.swashbuckler.deadly-grace.name: 'Deadly Grace'
feats.swashbuckler.deadly-grace.description: 'A critical hit with an agile or finesse melee weapon doubles its deadly dice; one without deadly gains deadly d8.'
feats.swashbuckler.felicitous-riposte.name: 'Felicitous Riposte'
feats.swashbuckler.felicitous-riposte.description: 'Your Opportune Riposte rolls its attack twice and takes the better (fortune).'
feats.swashbuckler.revitalizing-finisher.name: 'Revitalizing Finisher'
feats.swashbuckler.revitalizing-finisher.description: 'One action, finisher. Strike; on a hit you and allies within 30 feet gain temporary Hit Points equal to half your level. **Failure** You alone gain them.'
feats.swashbuckler.revitalizing-finisher.actions.revitalizing-finisher.name: 'Revitalizing Finisher'
feats.swashbuckler.revitalizing-finisher.actions.revitalizing-finisher.steps.weapon.prompt: 'Choose a weapon'
feats.swashbuckler.incredible-luck.name: 'Incredible Luck'
feats.swashbuckler.incredible-luck.description: 'Charmed Life rolls the save twice (with its +2) and takes the better.'
feats.swashbuckler.incredible-luck.prerequisites.charmed-life: 'Charmed Life'
feats.swashbuckler.lethal-finisher.name: 'Lethal Finisher'
feats.swashbuckler.lethal-finisher.description: 'One action (death, finisher). Strike; on a success, instead of precise strike, the target attempts a Fortitude save against your class DC (one degree worse after a critical hit). **Critical Success** 6 precision damage. **Success** 6d6. **Failure** 12d6. **Critical Failure** 18d6.'
feats.swashbuckler.lethal-finisher.prerequisites.precise: 'Precise strike 6d6'
feats.swashbuckler.lethal-finisher.actions.lethal-finisher.name: 'Lethal Finisher'
feats.swashbuckler.lethal-finisher.actions.lethal-finisher.steps.weapon.prompt: 'Choose a weapon'
feats.swashbuckler.parry-and-riposte.name: 'Parry and Riposte'
feats.swashbuckler.parry-and-riposte.description: 'You can Opportune Riposte a foe that merely fails a Strike against you, if you damaged it with a finisher on your last turn and have a circumstance bonus to AC from a parry weapon or Extravagant Parry.'
feats.swashbuckler.parry-and-riposte.prerequisites.riposte: 'Opportune Riposte'
feats.swashbuckler.illimitable-finisher.name: 'Illimitable Finisher'
feats.swashbuckler.illimitable-finisher.description: 'One action, finisher, flourish. Step and use a one-action finisher with the bravado trait; if it gives you panache again, you can use another finisher as part of this action.'
feats.swashbuckler.inexhaustible-countermoves.name: 'Inexhaustible Countermoves'
feats.swashbuckler.inexhaustible-countermoves.description: "At the start of each enemy's turn you gain an extra reaction, that turn only, for Opportune Riposte or Reactive Strike."
feats.swashbuckler.panache-paragon.name: 'Panache Paragon'
feats.swashbuckler.panache-paragon.description: "You're permanently quickened; the extra action can only be a bravado action."
situational.charmedLife.name: 'Charmed Life (a reaction: +2 to this save)'
