# Player Core 2's hobgoblin: its ancestry or heritage, heritages and feats, in text written for the
# pack.
ancestries.hobgoblin.choices.boosts.options.alternate.choices.free.prompt: 'Two free attribute boosts'
ancestries.hobgoblin.choices.boosts.options.alternate.name: 'Two free boosts instead'
ancestries.hobgoblin.choices.boosts.options.standard.choices.free.prompt: 'A free attribute boost'
ancestries.hobgoblin.choices.boosts.options.standard.name: "The ancestry's boosts and flaw"
ancestries.hobgoblin.choices.boosts.prompt: 'Ancestry attribute boosts'
ancestries.hobgoblin.choices.heritage.prompt: 'Heritage'
ancestries.hobgoblin.name: 'Hobgoblin'
ancestries.hobgoblin.description: 'Disciplined, enduring kin of goblins. 8 Hit Points, Medium, 25 feet. Boosts: Constitution, Intelligence, free; flaw: Wisdom. Darkvision.'
heritages.elfbane-hobgoblin.name: 'Elfbane Hobgoblin'
heritages.elfbane-hobgoblin.description: 'Resist Elf Magic: a reaction when you attempt a save against a magical effect, before rolling: a +1 circumstance bonus to it (+2 against an arcane effect).'
heritages.runtboss-hobgoblin.name: 'Runtboss Hobgoblin'
heritages.runtboss-hobgoblin.description: 'You gain Group Coercion. Coercing a goblin, a success is a critical success and a critical failure a failure.'
heritages.shortshanks-hobgoblin.name: 'Shortshanks Hobgoblin'
heritages.shortshanks-hobgoblin.description: "You gain the Ride feat, and you aren't off-guard while you Climb."
heritages.smokeworker-hobgoblin.name: 'Smokeworker Hobgoblin'
heritages.smokeworker-hobgoblin.description: 'Fire resistance equal to half your level (minimum 1), and you automatically succeed at the flat check to target a creature concealed only by smoke.'
heritages.warmarch-hobgoblin.name: 'Warmarch Hobgoblin'
heritages.warmarch-hobgoblin.description: 'A failure (not a critical failure) to Subsist in the wilderness still feeds you poorly, and you can Hustle twice as long while exploring.'
heritages.warrenbred-hobgoblin.name: 'Warrenbred Hobgoblin'
heritages.warrenbred-hobgoblin.description: 'Underground, the flat check to target a concealed creature is DC 3 and a hidden one DC 9. A success to Squeeze is a critical success.'
feats.ancestry.alchemical-scholar.name: 'Alchemical Scholar'
feats.ancestry.alchemical-scholar.description: "You gain Alchemical Crafting (or another 1st-level Crafting skill feat if you'd gain it anyway), an extra common 1st-level alchemical formula, and one common alchemical formula of each level you reach after 1st."
feats.ancestry.cantorian-reinforcement.name: 'Cantorian Reinforcement'
feats.ancestry.cantorian-reinforcement.description: 'A success on a save against a disease or poison is a critical success; with another ability that improves the save this way, a critical failure is a failure too.'
feats.ancestry.hobgoblin-lore.name: 'Hobgoblin Lore'
feats.ancestry.hobgoblin-lore.description: "You're trained in Athletics and Crafting (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Hobgoblin Lore."
feats.ancestry.hobgoblin-weapon-familiarity.name: 'Hobgoblin Weapon Familiarity'
feats.ancestry.hobgoblin-weapon-familiarity.description: 'You have access to uncommon hobgoblin weapons, and familiarity with hobgoblin weapons and the composite longbow, composite shortbow, glaive, longbow, longsword and shortbow: martial ones count as simple and advanced ones as martial for you. From 5th level, their critical specialization effects.'
feats.ancestry.leech-clip.name: 'Leech-Clip'
feats.ancestry.leech-clip.description: "2 actions: a melee Strike with a flail. On a hit the target takes a -10-foot status penalty to its Speed for 1 round (-15 on a critical hit), if it walks on legs or the like; it can't take its Speed below 5 feet."
feats.ancestry.leech-clip.actions.leech-clip.name: 'Leech-Clip'
feats.ancestry.leech-clip.actions.leech-clip.steps.weapon.prompt: 'Flail'
feats.ancestry.leech-clip.actions.leech-clip.participants.target.name: 'Target'
feats.ancestry.remorseless-lash.name: 'Remorseless Lash'
feats.ancestry.remorseless-lash.description: "When you hit a frightened enemy with a melee weapon Strike, it can't lower its frightened value below 1 until the start of your next turn."
feats.ancestry.sneaky.name: 'Sneaky'
feats.ancestry.sneaky.description: "You Sneak 5 feet farther (up to your Speed), and while you keep Sneaking successfully you don't become observed for lacking cover or concealment at the end of a Sneak, as long as you have it at the end of your turn."
feats.ancestry.stone-face.name: 'Stone Face'
feats.ancestry.stone-face.description: 'A +1 circumstance bonus to saves against fear effects, and a +2 circumstance bonus to your Will DC against Intimidation skill actions such as Demoralize.'
feats.ancestry.vigorous-health.name: 'Vigorous Health'
feats.ancestry.vigorous-health.description: "When you would become drained, a DC 17 flat check: on a success, you aren't."
feats.ancestry.agonizing-rebuke.name: 'Agonizing Rebuke'
feats.ancestry.agonizing-rebuke.description: "An enemy you Demoralize takes 1d4 mental damage at the start of each of its turns (2d4 if you're a master in Intimidation, 3d4 if legendary) until it isn't frightened, is more than 30 feet away, or a minute passes."
feats.ancestry.expert-drill-sergeant.name: 'Expert Drill Sergeant'
feats.ancestry.expert-drill-sergeant.description: "Leading allies who Follow the Expert, you give a +3 circumstance bonus if you're an expert and +4 if you're a master, instead of +2."
feats.ancestry.recognize-ambush.name: 'Recognize Ambush'
feats.ancestry.recognize-ambush.description: 'A free action when you roll initiative: Interact to draw a weapon.'
feats.ancestry.runtsage.name: 'Runtsage'
feats.ancestry.runtsage.description: 'You gain Adopted Ancestry for goblins, and a 1st-level goblin ancestry feat.'
feats.ancestry.runtsage.choices.feat.prompt: '1st-level goblin ancestry feat'
feats.ancestry.cantorian-rejuvenation.name: 'Cantorian Rejuvenation'
feats.ancestry.cantorian-rejuvenation.description: 'Once a day, 2 actions (healing, vitality): you regain 4d6 Hit Points and gain 10 temporary Hit Points for 1 minute (6d6 and 15 from 15th level).'
feats.ancestry.cantorian-rejuvenation.actions.cantorian-rejuvenation.name: 'Cantorian Rejuvenation'
feats.ancestry.cantorian-rejuvenation.actions.cantorian-rejuvenation.results.healed.name: 'Healed'
feats.ancestry.fell-rider.name: 'Fell Rider'
feats.ancestry.fell-rider.description: 'Your animal companion becomes trained in Intimidation, and its Support as your mount Aids your first Demoralize that turn.'
feats.ancestry.pride-in-arms.name: 'Pride in Arms'
feats.ancestry.pride-in-arms.description: 'A reaction (auditory, emotion, mental) when an ally within 30 feet brings an enemy to 0 Hit Points: it gains temporary Hit Points equal to its Constitution modifier until the end of its next turn.'
feats.ancestry.squad-tactics.name: 'Squad Tactics'
feats.ancestry.squad-tactics.description: 'An enemy within reach of you and at least two of your allies is off-guard to you.'
feats.ancestry.cant-fall-here.name: "Can't Fall Here"
feats.ancestry.cant-fall-here.description: 'Once a day, a reaction (auditory, manipulate) when an adjacent willing ally would drop to 0 HP but not die: it stays at 1 Hit Point and gains temporary Hit Points equal to your level for 1 minute; its wounded value rises by 1.'
feats.ancestry.war-conditioning.name: 'War Conditioning'
feats.ancestry.war-conditioning.description: 'You gain a climb Speed of 20 feet or a swim Speed of 20 feet, your choice.'
feats.ancestry.war-conditioning.choices.speed.prompt: 'Speed gained'
feats.ancestry.war-conditioning.choices.speed.options.climb.name: 'Climb Speed 20 feet'
feats.ancestry.war-conditioning.choices.speed.options.swim.name: 'Swim Speed 20 feet'
feats.ancestry.cantorian-restoration.name: 'Cantorian Restoration'
feats.ancestry.cantorian-restoration.description: "Once a day, a reaction (healing, vitality) when a living creature within 60 feet would die (not from a death effect or one that leaves no remains): it doesn't, and regains 6d8 + your Constitution modifier Hit Points."
feats.ancestry.rallying-cry.name: 'Rallying Cry'
feats.ancestry.rallying-cry.description: 'Once a day, 2 actions (auditory): allies in a 30-foot emanation who hear you gain temporary Hit Points equal to your level and are quickened for 1 minute, the extra action only to Step, Stride or Strike.'
