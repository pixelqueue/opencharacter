# Player Core 2's lizardfolk: its ancestry or heritage, heritages and feats, in text written for the
# pack.
ancestries.lizardfolk.choices.boosts.options.alternate.choices.free.prompt: 'Two free attribute boosts'
ancestries.lizardfolk.choices.boosts.options.alternate.name: 'Two free boosts instead'
ancestries.lizardfolk.choices.boosts.options.standard.choices.free.prompt: 'A free attribute boost'
ancestries.lizardfolk.choices.boosts.options.standard.name: "The ancestry's boosts and flaw"
ancestries.lizardfolk.choices.boosts.prompt: 'Ancestry attribute boosts'
ancestries.lizardfolk.choices.heritage.prompt: 'Heritage'
ancestries.lizardfolk.name: 'Lizardfolk'
ancestries.lizardfolk.description: 'Patient scaled survivors of ancient lineage. 8 Hit Points, Medium, 25 feet. Boosts: Strength, Wisdom, free; flaw: Intelligence. Claws: a claw unarmed attack, 1d4 slashing, brawling group, agile and finesse. Aquatic Adaptation: the Breath Control feat.'
heritages.cliffscale-lizardfolk.name: 'Cliffscale Lizardfolk'
heritages.cliffscale-lizardfolk.description: 'You gain Combat Climber; barefoot, you climb with your feet, hands free. A success to Climb is a critical success.'
heritages.cloudleaper-lizardfolk.name: 'Cloudleaper Lizardfolk'
heritages.cloudleaper-lizardfolk.description: 'With room, and able to act, you spread skin flaps to take no damage from a fall.'
heritages.frilled-lizardfolk.name: 'Frilled Lizardfolk'
heritages.frilled-lizardfolk.description: "Your Demoralize is visual instead of auditory and takes no penalty against a creature that doesn't understand your language. Threatening Approach (2 actions): Stride next to a foe and Demoralize it; on a success it's frightened 2 instead of 1."
heritages.sandstrider-lizardfolk.name: 'Sandstrider Lizardfolk'
heritages.sandstrider-lizardfolk.description: "Fire resistance equal to half your level (minimum 1); environmental heat is one step less extreme for you and you go ten times as long before starvation or thirst affect you, but environmental cold is one step more extreme unless you're protected."
heritages.unseen-lizardfolk.name: 'Unseen Lizardfolk'
heritages.unseen-lizardfolk.description: "You change your color to match your surroundings: 1 action for a +2 circumstance bonus to Stealth checks until the surroundings' colors change (an hour for dramatic changes)."
heritages.wetlander-lizardfolk.name: 'Wetlander Lizardfolk'
heritages.wetlander-lizardfolk.description: 'You gain a swim Speed of 15 feet.'
heritages.woodstalker-lizardfolk.name: 'Woodstalker Lizardfolk'
heritages.woodstalker-lizardfolk.description: 'You can always Take Cover in forest or jungle, and you gain Terrain Stalker (underbrush) even untrained in Stealth.'
feats.ancestry.bone-magic.name: 'Bone Magic'
feats.ancestry.bone-magic.description: 'Pick a cantrip from the occult or primal list: you can cast it as an innate spell at will (heightened as cantrips are). Your lizardfolk innate spells that need Bone Magic share the tradition you pick.'
feats.ancestry.bone-magic.choices.cantrip.prompt: 'Occult or primal cantrip (innate)'
features.lizardfolk-armaments.claws.name: 'Claws'
features.lizardfolk-armaments.claws.description: 'Your claws deal 1d6 slashing damage instead of 1d4 and gain versatile P.'
features.lizardfolk-armaments.fangs.name: 'Fangs'
features.lizardfolk-armaments.fangs.description: 'A fangs unarmed attack: 1d8 piercing, brawling group.'
features.lizardfolk-armaments.tail.name: 'Tail'
features.lizardfolk-armaments.tail.description: 'A tail unarmed attack: 1d6 bludgeoning, brawling group, sweep.'
templates.lizardfolk-claws.name: '{base} (Lizardfolk Armaments)'
weapons.lizardfolk-fangs.name: 'Fangs'
weapons.lizardfolk-tail.name: 'Tail'
feats.ancestry.lizardfolk-armaments.name: 'Lizardfolk Armaments'
feats.ancestry.lizardfolk-armaments.description: 'Pick one: claws (your claws deal 1d6 and gain versatile P), fangs (a 1d8 piercing fangs attack, brawling) or tail (a 1d6 bludgeoning tail attack, brawling, sweep). From 5th level, their critical specialization effects. You can take it again for another option.'
feats.ancestry.lizardfolk-armaments.choices.armament.prompt: 'Armament'
feats.ancestry.lizardfolk-lore.name: 'Lizardfolk Lore'
feats.ancestry.lizardfolk-lore.description: "You're trained in Survival and in Nature or Occultism (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Astrology Lore or Lizardfolk Lore."
feats.ancestry.lizardfolk-lore.choices.skill.prompt: 'Skill trained'
feats.ancestry.lizardfolk-lore.choices.lore.prompt: 'Lore (Additional Lore)'
feats.ancestry.marsh-runner.name: 'Marsh Runner'
feats.ancestry.marsh-runner.description: "Stepping, you ignore difficult terrain from floods, swamps or quicksand; Balancing on narrow surfaces or marshy ground you aren't off-guard, and a success is a critical success."
feats.ancestry.marsh-runner.prerequisites.swim: 'A swim Speed'
feats.ancestry.parthenogenic-hatchling.name: 'Parthenogenic Hatchling'
feats.ancestry.parthenogenic-hatchling.description: 'A +1 circumstance bonus to saves against diseases, and a success on one is a critical success (with another ability that improves it this way, a critical failure is a failure). Thirst harms you every 2 hours and starvation every 2 days. 1st level only.'
feats.ancestry.reptile-speaker.name: 'Reptile Speaker'
feats.ancestry.reptile-speaker.description: 'You can ask questions of, understand and use Diplomacy with reptilian animals.'
feats.ancestry.envenom-fangs.name: 'Envenom Fangs'
feats.ancestry.envenom-fangs.description: 'Once an hour, 1 action: your next fangs Strike before the end of your next turn that hits and deals damage adds 1d6 persistent poison damage.'
feats.ancestry.envenom-fangs.prerequisites.lizardfolk-armaments: 'Lizardfolk Armaments'
feats.ancestry.flexible-tail.name: 'Flexible Tail'
feats.ancestry.flexible-tail.description: "Your tail can do simple Interact actions (open an unlocked door), but nothing needing fingers or a check, and it can't hold items."
feats.ancestry.geckos-grip.name: "Gecko's Grip"
feats.ancestry.geckos-grip.description: 'You gain Combat Climber, and a success to Climb is a critical success. With the cliffscale heritage, you gain a climb Speed of 15 feet instead.'
feats.ancestry.shed-tail.name: 'Shed Tail'
feats.ancestry.shed-tail.description: "A reaction when you're grabbed, with a full tail: you stop being grabbed and Stride without triggering the grabber's reactions. For a day, until the tail regrows, no tail attack and -2 circumstance to Balance."
feats.ancestry.shed-tail.prerequisites.lizardfolk-armaments: 'Lizardfolk Armaments'
feats.ancestry.swift-swimmer.name: 'Swift Swimmer'
feats.ancestry.swift-swimmer.description: 'You gain a swim Speed of 15 feet (25 feet with the wetlander heritage).'
feats.ancestry.dangle.name: 'Dangle'
feats.ancestry.dangle.description: 'You can hang by your tail from a suitable anchor, all your other limbs free.'
feats.ancestry.hone-claws.name: 'Hone Claws'
feats.ancestry.hone-claws.description: 'Once an hour, 1 action: your next claw Strike that hits and deals damage adds 1d6 bleed damage (one at a time).'
feats.ancestry.hone-claws.prerequisites.lizardfolk-armaments: 'Lizardfolk Armaments'
feats.ancestry.terrain-advantage.name: 'Terrain Advantage'
feats.ancestry.terrain-advantage.description: 'Non-lizardfolk creatures in difficult terrain are off-guard to you, and with a swim Speed so are those in water without one.'
feats.ancestry.bone-investiture.name: 'Bone Investiture'
feats.ancestry.bone-investiture.description: 'You can cast dinosaur form on yourself as a 5th-rank innate spell once a day (a Huge dinosaur).'
feats.ancestry.bone-investiture.prerequisites.bone-magic: 'Bone Magic'
feats.ancestry.lizardfolk-spirit-strike.name: 'Lizardfolk Spirit Strike'
feats.ancestry.lizardfolk-spirit-strike.description: "Unarmed attacks from your lizardfolk ancestry, heritage or ancestry feats have the ghost touch rune's effects."
feats.ancestry.primal-rampage.name: 'Primal Rampage'
feats.ancestry.primal-rampage.description: 'You can cast unfettered movement and mountain resilience once a day each as 4th-rank primal innate spells, both at once as a 3-action activity.'
feats.ancestry.fossil-rider.name: 'Fossil Rider'
feats.ancestry.fossil-rider.description: 'You can cast mask of terror on yourself as an innate spell once a day, looking like a twisted skeletal ancestor.'
feats.ancestry.fossil-rider.prerequisites.bone-magic: 'Bone Magic'
feats.ancestry.scion-transformation.name: 'Scion Transformation'
feats.ancestry.scion-transformation.description: "After a day's hibernation and a ritual, you're permanently enlarged (as the enlarge spell) and your maximum Hit Points rise by your level; most of your gear grows with you."
