heritages.aiuvarin.description: You gain the elf and aiuvarin traits and low-light vision, and you can take elf feats as ancestry feats.
heritages.aiuvarin.name: Aiuvarin
heritages.ancient-blooded-dwarf.description: 'You gain the Call on Ancient Blood reaction: when you attempt a saving throw against a magical effect, before rolling, you gain a +1 circumstance bonus to saves until the end of this turn, the triggering save included.'
heritages.ancient-blooded-dwarf.name: Ancient-Blooded Dwarf
heritages.ancient-elf.description: 'Choose a class other than your own: you gain its multiclass dedication feat, ignoring its level prerequisite.'
heritages.ancient-elf.name: Ancient Elf
heritages.arctic-elf.description: Cold resistance equal to half your level (minimum 1), and you treat environmental cold as one step less extreme.
heritages.arctic-elf.name: Arctic Elf
heritages.badlands-orc.description: You can Hustle twice as long while exploring, and you treat environmental heat as one step less extreme.
heritages.badlands-orc.name: Badlands Orc
heritages.battle-ready-orc.description: You become trained in Intimidation and gain the Intimidating Glare skill feat.
heritages.battle-ready-orc.name: Battle-Ready Orc
heritages.cactus-leshy.description: 'You gain a spine unarmed attack: 1d6 piercing, brawling group, finesse and unarmed.'
heritages.cactus-leshy.name: Cactus Leshy
heritages.cavern-elf.description: You gain darkvision.
heritages.cavern-elf.name: Cavern Elf
heritages.chameleon-gnome.description: You can change your coloration. Where it matches your surroundings, a single action gives you a +2 circumstance bonus to Stealth checks until the surroundings change.
heritages.chameleon-gnome.name: Chameleon Gnome
heritages.changeling.description: You gain the changeling trait, and low-light vision (darkvision if your ancestry has low-light vision already).
heritages.changeling.name: Changeling
heritages.charhide-goblin.description: Fire resistance equal to half your level (minimum 1). Your flat check to end persistent fire damage is DC 10 instead of 15 (DC 5 with particularly appropriate help).
heritages.charhide-goblin.name: Charhide Goblin
heritages.death-warden-dwarf.description: When you roll a success on a saving throw against a void effect or an effect created by an undead creature, you get a critical success instead.
heritages.death-warden-dwarf.name: Death Warden Dwarf
heritages.deep-orc.description: You gain the Terrain Expertise skill feat for underground terrain, and the Combat Climber skill feat.
heritages.deep-orc.name: Deep Orc
heritages.dromaar.description: You gain the orc and dromaar traits and low-light vision, and you can take orc feats as ancestry feats.
heritages.dromaar.name: Dromaar
heritages.fey-touched-gnome.description: 'You gain the fey trait. Choose a primal cantrip: you can cast it as a primal innate spell at will, and change it once a day with 10 minutes of meditation.'
heritages.fey-touched-gnome.name: Fey-Touched Gnome
heritages.forge-dwarf.description: Fire resistance equal to half your level (minimum 1), and you treat environmental heat as one step less extreme.
heritages.forge-dwarf.name: Forge Dwarf
heritages.fruit-leshy.description: Each dawn a fruit ripens on you. Eaten within an hour (an Interact action), it restores 1d8 Hit Points, plus 1d8 for every 2 levels you have beyond 1st (healing, vitality).
heritages.fruit-leshy.name: Fruit Leshy
heritages.fungus-leshy.description: You gain darkvision. You lose the plant trait and gain the fungus trait.
heritages.fungus-leshy.name: Fungus Leshy
heritages.gourd-leshy.description: You can store up to 1 Bulk of objects in your head; Stealing them is 4 harder, and a single stored object can be drawn as part of the action that uses it.
heritages.gourd-leshy.name: Gourd Leshy
heritages.grave-orc.description: Void resistance equal to half your level (minimum 1), and a +1 circumstance bonus to saves against death and void effects.
heritages.grave-orc.name: Grave Orc
heritages.gutsy-halfling.description: When you roll a success on a saving throw against an emotion effect, you get a critical success instead.
heritages.gutsy-halfling.name: Gutsy Halfling
heritages.hillock-halfling.description: When you regain Hit Points overnight, add your level. When someone Treats your Wounds, you can eat a snack to add your level to the Hit Points regained.
heritages.hillock-halfling.name: Hillock Halfling
heritages.hold-scarred-orc.description: You gain 12 Hit Points from your ancestry instead of 10, and the Diehard feat.
heritages.hold-scarred-orc.name: Hold-Scarred Orc
heritages.irongut-goblin.description: You can eat spoiled food and eat while sickened. Against afflictions and sickness from something you ingested, a +2 circumstance bonus to saves (and to remove sickened), and a success on such a Fortitude save is a critical success.
heritages.irongut-goblin.name: Irongut Goblin
heritages.jinxed-halfling.description: 'You can never take Halfling Luck. Jinx (2 actions, curse, occult), once a day: a creature within 30 feet that you can see attempts a Will save against your class DC or spell DC; on a failure it is clumsy 1 for 1 minute, clumsy 2 on a critical failure, and on a success it is immune for 24 hours.'
heritages.jinxed-halfling.name: Jinxed Halfling
heritages.leaf-leshy.description: You glide down slowly and take no damage from falling.
heritages.leaf-leshy.name: Leaf Leshy
heritages.lotus-leshy.description: You can walk on still water at half Speed, and Balance across flowing water using the Swim DC, at half Speed; failing drops you into the water.
heritages.lotus-leshy.name: Lotus Leshy
heritages.nephilim.description: You gain the nephilim trait, and low-light vision (darkvision if your ancestry has low-light vision already).
heritages.nephilim.name: Nephilim
heritages.nomadic-halfling.description: Two more languages of your choice, and another each time you take Multilingual.
heritages.nomadic-halfling.name: Nomadic Halfling
heritages.rainfall-orc.description: A +2 circumstance bonus to Athletics checks to Climb or Swim, and a +1 circumstance bonus to saves against diseases.
heritages.rainfall-orc.name: Rainfall Orc
heritages.razortooth-goblin.description: 'You gain a jaws unarmed attack: 1d6 piercing, brawling group, finesse and unarmed.'
heritages.razortooth-goblin.name: Razortooth Goblin
heritages.rock-dwarf.description: A +2 circumstance bonus to your Fortitude or Reflex DC against being Repositioned, Shoved or Tripped, and to saves against effects that would move you or knock you prone. Forced movement of 10 feet or more moves you only half as far.
heritages.rock-dwarf.name: Rock Dwarf
heritages.root-leshy.description: You gain 10 Hit Points from your ancestry instead of 8, and can go 2 weeks without sunlight. A +2 circumstance bonus to your Fortitude or Reflex DC against being Repositioned, Shoved or Tripped, and to saves against effects that would move you or knock you prone.
heritages.root-leshy.name: Root Leshy
heritages.seaweed-leshy.description: A swim Speed of 20 feet, and you can breathe underwater, but your land Speed is 5 feet lower.
heritages.seaweed-leshy.name: Seaweed Leshy
heritages.seer-elf.description: You can cast the detect magic cantrip as an arcane innate spell at will, and you gain a +1 circumstance bonus to checks to Identify Magic and to Decipher Writing of a magical nature.
heritages.seer-elf.name: Seer Elf
heritages.sensate-gnome.description: Imprecise scent with a range of 30 feet, and a +2 circumstance bonus to Perception checks to locate undetected creatures within it.
heritages.sensate-gnome.name: Sensate Gnome
heritages.skilled-human.choices.skill.prompt: Skill to train (expert at 5th level)
heritages.skilled-human.description: You become trained in one skill of your choice, and an expert in it at 5th level.
heritages.skilled-human.name: Skilled Human
heritages.snow-goblin.description: Cold resistance equal to half your level (minimum 1), and you treat environmental cold as one step less extreme.
heritages.snow-goblin.name: Snow Goblin
heritages.strong-blooded-dwarf.description: Poison resistance equal to half your level (minimum 1). Successful saves against poison afflictions reduce the stage by 2 (1 for a virulent poison), and a critical success by 3 (2).
heritages.strong-blooded-dwarf.name: Strong-Blooded Dwarf
heritages.twilight-halfling.description: You gain low-light vision.
heritages.twilight-halfling.name: Twilight Halfling
heritages.umbral-gnome.description: You gain darkvision.
heritages.umbral-gnome.name: Umbral Gnome
heritages.unbreakable-goblin.description: You gain 10 Hit Points from your ancestry instead of 6. Falls deal half damage, and you land on your feet.
heritages.unbreakable-goblin.name: Unbreakable Goblin
heritages.versatile-human.choices.feat.prompt: Feat
heritages.versatile-human.description: You gain a 1st-level general feat.
heritages.versatile-human.name: Versatile Human
heritages.vine-leshy.description: You can Climb without free hands, and a success on an Athletics check to Climb is a critical success.
heritages.vine-leshy.name: Vine Leshy
heritages.wellspring-gnome.description: 'Choose arcane, divine or occult: you gain a cantrip from that tradition as an innate spell at will, and primal innate spells from gnome feats use that tradition instead.'
heritages.wellspring-gnome.name: Wellspring Gnome
heritages.whisper-elf.description: A +2 circumstance bonus to Seek hidden or undetected creatures within 30 feet, and the flat check against a concealed target is DC 3, against a hidden one DC 9, while you can hear.
heritages.whisper-elf.name: Whisper Elf
heritages.wildwood-halfling.description: You ignore difficult terrain caused by plants and fungi.
heritages.wildwood-halfling.name: Wildwood Halfling
heritages.winter-orc.description: You become trained in Survival, and you treat environmental cold as one step less extreme.
heritages.winter-orc.name: Winter Orc
heritages.woodland-elf.description: When Climbing foliage, you move at half your Speed on a success and full Speed on a critical success (full Speed on a success with Quick Climb), and you can always Take Cover in forest terrain.
heritages.woodland-elf.name: Woodland Elf
