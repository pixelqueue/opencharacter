# Spell names and descriptions (content/spells): short rules text written for the pack from Player
# Core (ORC), without its setting.
spells.caustic-blast.name: Caustic Blast
spells.caustic-blast.description: |-
  You hurl a glob of acid that bursts on impact. Each creature in the area takes 1d8 acid damage with a basic Reflex save; on a critical failure it also takes 1 persistent acid damage.

  **Heightened (+2)** The initial damage increases by 1d8 and the persistent damage by 1.
spells.clinging-ice.name: Clinging Ice
spells.clinging-ice.description: |-
  Sleet and snow cling to the target's legs, dealing 1d4 cold damage and more by its Reflex save.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage.

  **Failure** The target takes full damage and a –5-foot circumstance penalty to its Speeds while the spell lasts.

  **Critical Failure** The target takes double damage and a –10-foot circumstance penalty to its Speeds while the spell lasts.

  **Heightened (+1)** The damage increases by 1d4.
spells.courageous-anthem.name: Courageous Anthem
spells.courageous-anthem.description: |-
  Your words or music encourage your allies. You and all allies in the area gain a +1 status bonus to attack rolls, damage rolls and saves against fear effects.
spells.daze.name: Daze
spells.daze.description: |-
  A mental jolt deals 1d6 mental damage with a basic Will save. On a critical failure, the target is also stunned 1.

  **Heightened (+2)** The damage increases by 1d6.
spells.detect-magic.name: Detect Magic
spells.detect-magic.description: |-
  A pulse tells you whether magic is present in the area, and nothing more. You can ignore magic you're fully aware of, such as your allies' magic items and spells. Illusion magic is detected only if its rank is lower than this spell's (though items with an illusion aura that aren't deceptive in appearance are usually detected normally).

  **Heightened (3rd)** You also learn the rank or level of the most powerful magic the spell detects, as the GM decides.

  **Heightened (4th)** As 3rd rank, and you also narrow the source of the highest-rank magic down to a 5-foot cube (or the nearest larger area), as an imprecise sense would.
spells.discern-secrets.name: Discern Secrets
spells.discern-secrets.description: |-
  Your patron whispers secrets to the target. It can Recall Knowledge, Seek or Sense Motive as a free action, with a +1 status bonus to the skill or Perception used, on that roll and for as long as you Sustain the spell. It is then temporarily immune to this spell for 1 minute.

  **Heightened (5th)** You can target two creatures.
spells.divine-lance.name: Divine Lance
spells.divine-lance.description: |-
  A beam of divine energy flies at the target. Make a ranged spell attack against its AC: a hit deals 2d4 spirit damage, a critical hit double damage.

  **Heightened (+1)** The damage increases by 1d4.
spells.electric-arc.name: Electric Arc
spells.electric-arc.description: |-
  Lightning leaps between one or two targets. Each takes 2d4 electricity damage with a basic Reflex save.

  **Heightened (+1)** The damage increases by 1d4.
spells.evil-eye.name: Evil Eye
spells.evil-eye.description: |-
  Your patron's envious gaze falls on the target. On a failed Will save it is sickened 1 (sickened 2 on a critical failure), and it can't lower the value below 1 while the spell lasts and you can see it.
spells.figment.name: Figment
spells.figment.description: |-
  You create a simple illusory sound (no words or elaborate music; the spell gains the auditory trait) or a crude, undetailed image no larger than a 5-foot cube (the visual trait). When you Cast or Sustain the spell, you can Create a Diversion with it, with a +2 circumstance bonus to your Deception check; a creature the attempt fails against disbelieves it.
spells.forbidding-ward.name: Forbidding Ward
spells.forbidding-ward.description: |-
  You ward an ally against one enemy (the target). The ally gains a +1 status bonus to AC and saving throws against that enemy's attacks, spells and other effects.

  **Heightened (6th)** The bonus increases to +2.
spells.frostbite.name: Frostbite
spells.frostbite.description: |-
  Biting cold closes around the target, dealing 2d4 cold damage with a basic Fortitude save. On a critical failure, it also gains weakness 1 to bludgeoning until the start of your next turn.

  **Heightened (+1)** The damage increases by 1d4 and the weakness by 1.
spells.gouging-claw.name: Gouging Claw
spells.gouging-claw.description: |-
  Your limb becomes a claw for an instant. Make a melee spell attack against the target's AC. A hit deals your choice of 2d6 slashing or 2d6 piercing damage plus 2 persistent bleed damage; a critical hit doubles both.

  **Heightened (+1)** The damage increases by 1d6 and the persistent bleed damage by 1.
spells.guidance.name: Guidance
spells.guidance.description: |-
  The target gains a +1 status bonus to one attack roll, Perception check, saving throw or skill check it attempts before the spell ends, chosen before rolling; using it ends the spell. Either way, it is then temporarily immune for 1 hour.
spells.ignition.name: Ignition
spells.ignition.description: |-
  You snap your fingers and the target begins to smolder. Make a spell attack against its AC: a hit deals 2d4 fire damage. If the target is within your reach, you can make it a melee spell attack instead, and all the spell's damage dice become d6s.

  **Critical Success** The target takes double damage and 1d4 persistent fire damage.

  **Success** The target takes full damage.

  **Heightened (+1)** The initial damage increases by 1d4 and the persistent fire damage on a critical hit by 1d4.
spells.know-the-way.name: Know the Way
spells.know-the-way.description: |-
  You know which way is north (if north exists where you are), and the direction of a place you were at within the last 24 hours.

  **Heightened (3rd)** A place you were at within the last week.

  **Heightened (7th)** Any place you have been.
spells.light.name: Light
spells.light.description: |-
  An orb of light in a color you choose sheds bright light in a 20-foot radius and dim light for 20 feet more. You can attach it to a willing creature, and Sustain the spell to move it up to 60 feet. You can Dismiss it; casting a fifth light ends one of the other four.

  **Heightened (4th)** The orb sheds bright light in a 60-foot radius and dim light for 60 feet more.
spells.message.name: Message
spells.message.description: |-
  You mouth words that the target hears as though you stood beside it. It can answer briefly as a reaction, or as a free action on its next turn, if it can see you and you are within range.

  **Heightened (3rd)** The range increases to 500 feet.
spells.nudge-fate.name: Nudge Fate
spells.nudge-fate.description: |-
  When the target fails an attack roll, skill check or saving throw and a +1 status bonus would improve the result (a critical failure to a failure, or a failure to a success), you grant it that bonus after the fact and the spell ends. Casting it again ends the previous one.
spells.prestidigitation.name: Prestidigitation
spells.prestidigitation.description: |-
  You perform small magical tricks for as long as you Sustain the spell, choosing one each time:

  - **Cook:** cool, warm or flavor 1 pound of nonliving material.
  - **Lift:** slowly lift an unattended object of light Bulk or less 1 foot.
  - **Make:** create a crude, fragile temporary object of negligible Bulk, useless as a tool, weapon or spell component.
  - **Tidy:** color, clean or soil an object of light Bulk or less (1 Bulk takes 10 rounds; larger objects 1 minute per Bulk).

  It can't deal damage or cause conditions, and its changes last only while you Sustain it.
spells.read-aura.name: Read Aura
spells.read-aura.description: |-
  You learn whether the target object is magical, and you or anyone you tell gains a +2 circumstance bonus to Identify Magic on it. An illusory object is detected only if its rank is lower than this spell's.

  **Heightened (3rd)** You can target up to 10 objects.

  **Heightened (6th)** You can target any number of objects.
spells.shield.name: Shield
spells.shield.description: |-
  A shield of force gives you a +1 circumstance bonus to AC until the start of your next turn, as Raise a Shield, without using a hand. While it lasts you can Shield Block with it, against any spell or magical effect too; it has Hardness 5. After you block with it, the spell ends and you can't cast it again for 10 minutes.

  **Heightened (+2)** The Hardness increases by 5.
spells.shroud-of-night.name: Shroud of Night
spells.shroud-of-night.description: |-
  Darkness covers the target's eyes. A willing ally can choose its result without rolling.

  **Success** The target is unaffected.

  **Failure** The target treats bright light as dim light, and all creatures are concealed to it unless it has greater darkvision.
spells.sigil.name: Sigil
spells.sigil.description: |-
  You place your harmless personal mark, about a square inch, on a creature or object, visible or invisible (an Interact to switch). It can be scrubbed off with 5 minutes of work; on a creature it fades after a week.

  **Heightened (3rd)** It fades after a month.

  **Heightened (5th)** It fades after a year.

  **Heightened (7th)** It never fades.
spells.song-of-strength.name: Song of Strength
spells.song-of-strength.description: |-
  You and your allies gain a +1 status bonus to Athletics checks and to your DCs against Athletics actions such as Disarm, Reposition, Shove and Trip.
spells.stabilize.name: Stabilize
spells.stabilize.description: |-
  The target loses the dying condition, though it stays unconscious at 0 Hit Points.
spells.stoke-the-heart.name: Stoke the Heart
spells.stoke-the-heart.description: |-
  The target gains a +2 status bonus to damage rolls.

  **Heightened (+2)** The bonus increases by 1.
spells.summon-instrument.name: Summon Instrument
spells.summon-instrument.description: |-
  A handheld musical instrument of your choice appears in your hand, playable only by you. It vanishes when the spell ends or when you cast it again.

  **Heightened (5th)** The instrument is a virtuoso instrument.
spells.tangle-vine.name: Tangle Vine
spells.tangle-vine.description: |-
  A vine lashes out at the target. Make a spell attack against it.

  **Critical Success** The target is immobilized and takes a –10-foot circumstance penalty to its Speeds for 1 round. It can Escape against your spell DC to end both.

  **Success** The target takes a –10-foot circumstance penalty to its Speeds for 1 round. It can Escape against your spell DC to end it.

  **Failure** The target is unaffected.

  **Heightened (2nd)** The effects last 2 rounds.

  **Heightened (4th)** The effects last 1 minute.
spells.telekinetic-hand.name: Telekinetic Hand
spells.telekinetic-hand.description: |-
  An invisible or ghostly hand lifts the target object and moves it slowly up to 20 feet; Sustaining the spell moves it 20 feet more. It falls when the spell ends.

  **Heightened (3rd)** You can target an unattended object of 1 Bulk or less.

  **Heightened (5th)** The range is 60 feet, and you can target an unattended object of 1 Bulk or less.

  **Heightened (7th)** The range is 60 feet, and you can target an unattended object of 2 Bulk or less.
spells.telekinetic-projectile.name: Telekinetic Projectile
spells.telekinetic-projectile.description: |-
  You hurl a loose unattended object of 1 Bulk or less at the target. Make a spell attack against its AC: a hit deals 2d6 bludgeoning, piercing or slashing damage, as fits the object, and a critical hit double damage. The object's own traits and magic don't apply.

  **Heightened (+1)** The damage increases by 1d6.
spells.uplifting-overture.name: Uplifting Overture
spells.uplifting-overture.description: |-
  Your performance counts as preparing to Aid an ally with a skill check of your choice. When you later Aid, you can roll Performance instead, and a failure becomes a success (a critical success if you're legendary in Performance). The GM may rule that your encouragement would spoil the check.
spells.vitality-lash.name: Vitality Lash
spells.vitality-lash.description: |-
  Vital energy strikes at the target's corrupted essence: 2d6 vitality damage with a basic Fortitude save. On a critical failure, it is also enfeebled 1 until the start of your next turn.

  **Heightened (+1)** The damage increases by 1d6.
spells.void-warp.name: Void Warp
spells.void-warp.description: |-
  Void energy saps the target's life force: 2d4 void damage with a basic Fortitude save. On a critical failure, it is also enfeebled 1 until the start of your next turn.

  **Heightened (+1)** The damage increases by 1d4.
spells.wilding-word.name: Wilding Word
spells.wilding-word.description: |-
  A growl in your patron's voice makes the target reluctant to harm you. It attempts a Will save, with a –1 circumstance penalty if it is an animal, fungus or plant.

  **Critical Success** The target is unaffected.

  **Success** The target takes a –2 status penalty to attack rolls and skill checks that would harm you.

  **Failure** As success, and it becomes sickened 1 each time it damages you.

  **Critical Failure** As failure, but sickened 2.
spells.rallying-anthem.name: Rallying Anthem
spells.rallying-anthem.description: |-
  Your song helps your allies protect themselves. You and all allies in the area gain a +1 status bonus to AC and saving throws, and resistance to physical damage equal to half the spell's rank.
spells.triple-time.name: Triple Time
spells.triple-time.description: |-
  Your music sets a fast pace: you and all allies in the area gain a +10-foot status bonus to all Speeds for 1 round.
spells.dirge-of-doom.name: Dirge of Doom
spells.dirge-of-doom.description: |-
  Enemies in the area are frightened 1, and can't lower their frightened value below 1 while they stay in it.
spells.song-of-marching.name: Song of Marching
spells.song-of-marching.description: |-
  You and your allies in the area can Hustle for the duration as well as your other exploration activities (yours is Sustaining this spell), and are then temporarily immune for 1 day. If an encounter begins while you perform, you can roll Performance for initiative, and you and your affected allies gain a +1 status bonus to that initiative roll.

  **Heightened (6th)** You can Sustain it for up to 2 hours.

  **Heightened (9th)** You can Sustain it for up to 4 hours.
spells.house-of-imaginary-walls.name: House of Imaginary Walls
spells.house-of-imaginary-walls.description: |-
  You mime an invisible 10-by-10-foot wall adjacent to you and within reach. It is solid to creatures that don't disbelieve it, even incorporeal ones; you and your allies can choose to believe in it, to climb onto it for instance. A creature that disbelieves it is temporarily immune for 1 minute. It doesn't block creatures that didn't see your performance, nor objects. The wall has AC 10, Hardness equal to double the spell's rank and Hit Points equal to four times the spell's rank.
spells.allegro.name: Allegro
spells.allegro.description: |-
  Your rapid performance speeds an ally: it becomes quickened, and can use the extra action to Strike, Stride or Step.
spells.air-bubble.name: Air Bubble
spells.air-bubble.description: |-
  A bubble of air forms around the target's head, letting it breathe normally. It ends as soon as the target is back where it can breathe.
spells.air-bubble.texts.trigger: a creature within range enters an environment where it can't breathe
spells.alarm.name: Alarm
spells.alarm.description: |-
  You ward an area and choose a password. When a Small or larger corporeal creature enters without speaking it, you receive a mental alert (the spell gains the mental trait) or a hand bell rings (the auditory trait). Either wakes you; the bell lets each creature in the area attempt a DC 15 Perception check to wake. A creature that knows of the alarm must succeed at a Stealth check against your spell DC to enter without setting it off.

  **Heightened (3rd)** You can specify which kinds of creatures set it off.
spells.ant-haul.name: Ant Haul
spells.ant-haul.description: |-
  The target can carry 3 more Bulk before becoming encumbered, and up to 6 more Bulk in all.
spells.bane.name: Bane
spells.bane.description: |-
  Doubt fills your enemies' minds. Each enemy in the area must succeed at a Will save or take a –1 status penalty to attack rolls while it stays in the area. Once per round on later turns, you can Sustain the spell to widen the emanation by 10 feet, and enemies in it not yet affected must save. Bane can counteract bless.
spells.bless.name: Bless
spells.bless.description: |-
  You and your allies gain a +1 status bonus to attack rolls while within the emanation. Once per round on later turns, you can Sustain the spell to widen it by 10 feet. Bless can counteract bane.
spells.breathe-fire.name: Breathe Fire
spells.breathe-fire.description: |-
  Flame gushes from your mouth: 2d6 fire damage to each creature in the area, with a basic Reflex save.

  **Heightened (+1)** The damage increases by 2d6.
spells.charm.name: Charm
spells.charm.description: |-
  The target sees you through a dreamy haze. It attempts a Will save, with a +4 circumstance bonus if you or your allies recently threatened it or acted against it. You can Dismiss the spell; using a hostile action against the target ends it. Afterward the target doesn't necessarily know it was charmed.

  **Critical Success** The target is unaffected and knows you tried to charm it.

  **Success** The target is unaffected and thinks the spell was something harmless, unless it identifies it.

  **Failure** The target's attitude toward you becomes friendly (helpful if it was friendly), and it can't use hostile actions against you.

  **Critical Failure** The target's attitude toward you becomes helpful, and it can't use hostile actions against you.

  **Heightened (4th)** The spell lasts until your next daily preparations.

  **Heightened (8th)** It lasts until your next daily preparations, and you can target up to 10 creatures.
spells.cleanse-cuisine.name: Cleanse Cuisine
spells.cleanse-cuisine.description: |-
  The food and drink in the area become delicious (water into wine or another fine drink, plain fare into a gourmet treat), and you can remove all toxins and contamination from it. It doesn't prevent later spoilage, nor make the food more nourishing.

  **Heightened (+2)** Add another contiguous cubic foot to the area.
spells.command.name: Command
spells.command.description: |-
  You shout a command: approach you, run away (as if fleeing), release what it holds, drop prone, or stand in place. Until it obeys, the target can't Delay or use reactions.

  **Success** The target is unaffected.

  **Failure** The target spends the first action of its next turn obeying.

  **Critical Failure** The target spends all its actions on its next turn obeying.

  **Heightened (5th)** You can target up to 10 creatures.
spells.create-water.name: Create Water
spells.create-water.description: |-
  Water flows from your cupped hands: 2 gallons, which evaporate after a day if no one drinks them.
spells.detect-poison.name: Detect Poison
spells.detect-poison.description: |-
  You learn whether the target creature is venomous or poisonous, or whether the target object is poison or has been poisoned, but not the kind or how many. Some substances, such as lead and alcohol, are poisons and mask others.

  **Heightened (2nd)** You learn the number and types of poison.
spells.disguise-magic.name: Disguise Magic
spells.disguise-magic.description: |-
  You change how an item's or spell's aura appears to detection: hide it, make an item read as a common item of lower level, or a spell as a common spell of the same or lower rank. You can Dismiss it. A caster using a detection spell of higher rank can try to disbelieve it with the skill of the spell's tradition (Arcana, Religion, Occultism or Nature), and gets the same result on later tries.

  **Heightened (2nd)** You can cast it on a creature, disguising all items and spell effects on it.
spells.dizzying-colors.name: Dizzying Colors
spells.dizzying-colors.description: |-
  A swirl of colors overwhelms creatures by their Will saves.

  **Critical Success** The creature is unaffected.

  **Success** The creature is dazzled for 1 round.

  **Failure** The creature is stunned 1, blinded for 1 round and dazzled for 1 minute.

  **Critical Failure** The creature is stunned for 1 round and blinded for 1 minute.
spells.enfeeble.name: Enfeeble
spells.enfeeble.description: |-
  You sap the target's strength by its Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target is enfeebled 1 until the start of your next turn.

  **Failure** The target is enfeebled 2 for 1 minute.

  **Critical Failure** The target is enfeebled 3 for 1 minute.
spells.fear.name: Fear
spells.fear.description: |-
  You plant fear in the target, which attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target is frightened 1.

  **Failure** The target is frightened 2.

  **Critical Failure** The target is frightened 3 and fleeing for 1 round.

  **Heightened (3rd)** You can target up to five creatures.
spells.fleet-step.name: Fleet Step
spells.fleet-step.description: |-
  You gain a +30-foot status bonus to your Speed.
spells.force-barrage.name: Force Barrage
spells.force-barrage.description: |-
  You fire a shard of solid magic at a creature you can see; it hits automatically for 1d4+1 force damage. Each additional action you spend fires one more shard, up to three for 3 actions, each aimed separately. Shards at the same target combine their damage before bonuses, penalties, resistances and weaknesses.

  **Heightened (+2)** Each action fires one more shard.
spells.gentle-landing.name: Gentle Landing
spells.gentle-landing.description: |-
  An updraft slows the target's fall to 60 feet per round; that part of the fall doesn't count for falling damage, and it takes none if it lands while the spell lasts. The spell ends when it lands.
spells.gentle-landing.texts.trigger: a creature within range is falling
spells.goblin-pox.name: Goblin Pox
spells.goblin-pox.description: |-
  Your touch gives the target an itchy allergenic rash; it attempts a Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target is sickened 1.

  **Failure** The target is afflicted with goblin pox at stage 1.

  **Critical Failure** The target is afflicted with goblin pox at stage 2.

  **Goblin pox** (disease) Level 1. Creatures with the goblin trait are immune. **Stage 1** sickened 1 (1 round); **Stage 2** sickened 1 and slowed 1 (1 round); **Stage 3** sickened 1, and the creature can't lower its sickened value below 1 (1 day).
spells.grease.name: Grease
spells.grease.description: |-
  You cover an area or an object with grease.

  - **Area:** each creature standing on the 4 squares must succeed at a Reflex save or an Acrobatics check against your spell DC or fall prone, and one using an action to move onto it must save or Balance (not when it Steps or Crawls).
  - **Object:** anyone picking up the unattended object must succeed at an Acrobatics check or Reflex save against your spell DC. A creature holding it must attempt one: on a failure it takes a –2 circumstance penalty to checks using the object, on a critical failure it drops it. A greased worn object gives its wearer a +2 circumstance bonus to Fortitude saves against being grappled.
spells.grim-tendrils.name: Grim Tendrils
spells.grim-tendrils.description: |-
  Tendrils of darkness race from your fingers, dealing 2d4 void damage and 1 persistent bleed damage to living creatures in the line, by their Fortitude saves.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half the void damage and no bleed.

  **Failure** The creature takes full damage.

  **Critical Failure** The creature takes double void damage and double persistent bleed damage.

  **Heightened (+1)** The void damage increases by 2d4 and the persistent bleed damage by 1.
spells.gust-of-wind.name: Gust of Wind
spells.gust-of-wind.description: |-
  A violent wind blows along the line until the start of your next turn, putting out small fires, dispersing fog and blowing light objects away. Large or smaller creatures in it, or moving into it, attempt Fortitude saves.

  **Critical Success** The creature is unaffected.

  **Success** The creature can't move against the wind.

  **Failure** The creature is knocked prone; a flying creature suffers the critical failure instead.

  **Critical Failure** The creature is pushed 30 feet with the wind, knocked prone and takes 2d6 bludgeoning damage.
spells.harm.name: Harm
spells.harm.description: |-
  You channel void energy, dealing 1d8 void damage to a living target (a basic Fortitude save) or restoring that many Hit Points to a willing undead one. The actions you spend decide the rest:

  - **1 action** (manipulate): range touch, one target.
  - **2 actions** (concentrate, manipulate): range 30 feet, one target; healing an undead creature restores 8 more Hit Points.
  - **3 actions** (concentrate, manipulate): every living and undead creature in a 30-foot emanation.

  **Heightened (+1)** The damage or healing increases by 1d8, and the 2-action version's extra healing by 8.
spells.heal.name: Heal
spells.heal.description: |-
  You channel vital energy, restoring 1d8 Hit Points to a willing living target, or dealing that much vitality damage to an undead one (a basic Fortitude save). The actions you spend decide the rest:

  - **1 action** (manipulate): range touch, one target.
  - **2 actions** (concentrate, manipulate): range 30 feet, one target; healing a living creature restores 8 more Hit Points.
  - **3 actions** (concentrate, manipulate): every living and undead creature in a 30-foot emanation.

  **Heightened (+1)** The healing or damage increases by 1d8, and the 2-action version's extra healing by 8.
spells.hydraulic-push.name: Hydraulic Push
spells.hydraulic-push.description: |-
  A blast of pressurized water slams into the target. Make a ranged spell attack.

  **Critical Success** The target takes 6d6 bludgeoning damage and is knocked back 10 feet.

  **Success** The target takes 3d6 bludgeoning damage and is knocked back 5 feet.

  **Heightened (+1)** The damage increases by 2d6.
spells.ill-omen.name: Ill Omen
spells.ill-omen.description: |-
  Misfortune throws the target off balance; it attempts a Will save.

  **Success** The target is unaffected.

  **Failure** The first time in the duration that the target attempts an attack roll or skill check, it rolls twice and takes the worse result.

  **Critical Failure** Every attack roll and skill check it attempts in the duration, it rolls twice and takes the worse result.
spells.illusory-disguise.name: Illusory Disguise
spells.illusory-disguise.description: |-
  The target looks and sounds like another creature of the same body shape and roughly the same height and weight; its worn items can change appearance too, but not what it holds. It counts as setting up a disguise to Impersonate: the target ignores penalties for a dissimilar creature, gains a +4 status bonus to Deception checks to keep up the disguise, and adds its level to them even if untrained. It can't impersonate a specific individual. You can Dismiss it.

  **Heightened (3rd)** The target can appear as any creature of its size, even a specific individual you have seen (and heard, for the voice).

  **Heightened (4th)** You can target up to 10 willing creatures, each with its own disguise, none of a specific individual, and Dismiss them one by one or together.

  **Heightened (7th)** As 4th, and the disguises can be of specific individuals.
spells.illusory-object.name: Illusory Object
spells.illusory-object.description: |-
  You create a silent, scentless image of a stationary object that fits in the area; it can move naturally (water pouring down a waterfall). A creature that touches it or Seeks to examine it can attempt to disbelieve it.

  **Heightened (2nd)** The image makes sounds and smells and feels right to the touch (the auditory and olfactory traits), and lasts 1 hour.

  **Heightened (5th)** As 2nd, and it lasts indefinitely.
spells.infuse-vitality.name: Infuse Vitality
spells.infuse-vitality.description: |-
  You empower attacks with vital energy: one target per action you spend. Each target's unarmed and weapon Strikes deal 1d4 extra vitality damage (which usually harms only undead). If you have the holy trait, you can add it to the spell and the affected Strikes.

  **Heightened (3rd)** The damage is 2d4.

  **Heightened (5th)** The damage is 3d4.
spells.item-facade.name: Item Facade
spells.item-facade.description: |-
  The target object looks and feels much better or much worse than it is: decrepit and broken, or brand new; a broken item looks whole. Destroyed items can't be affected. A creature that Interacts with it can attempt to disbelieve it.

  **Heightened (2nd)** It lasts 24 hours.

  **Heightened (3rd)** It lasts indefinitely.
spells.jump.name: Jump
spells.jump.description: |-
  You jump 30 feet in any direction without touching the ground. Land on solid ground within 30 feet, or you fall after your next action.

  **Heightened (3rd)** The range is touch and the target one creature, for 1 minute: it jumps this way whenever it Leaps.
spells.lock.name: Lock
spells.lock.description: |-
  The target's latch magically locks. The Athletics and Thievery DC to open it is your spell DC or its own DC with a +4 status bonus, whichever is higher. Its key or combination no longer opens it, but gives a +4 circumstance bonus to checks to open it. Opening it ends the spell; you can unlock and open it with an Interact while touching it without ending the spell, and Dismiss the spell from any distance.

  **Heightened (2nd)** It lasts indefinitely, at an additional cost of 6 gp of precious metals.
spells.mending.name: Mending
spells.mending.description: |-
  You repair the target item: it regains 5 Hit Points per spell rank, which can remove the broken condition if it rises past its Broken Threshold. Lost pieces and destroyed objects can't be restored.

  **Heightened (2nd)** You can target a non-magical object of 1 Bulk or less.

  **Heightened (3rd)** You can target a non-magical object of 2 Bulk or less, or a magical object of 1 Bulk or less.
spells.mindlink.name: Mindlink
spells.mindlink.description: |-
  You link minds with the target and instantly share as much information as you could tell it in 10 minutes.
spells.mystic-armor.name: Mystic Armor
spells.mystic-armor.description: |-
  Shimmering energy wards you: a +1 item bonus to AC and a maximum Dexterity modifier of +5. While it lasts, you use your unarmored proficiency for AC.

  **Heightened (4th)** You also gain a +1 item bonus to saving throws.

  **Heightened (6th)** The bonus to AC is +2, and you gain a +1 item bonus to saves.

  **Heightened (8th)** The bonus to AC is +2, and to saves +2.

  **Heightened (10th)** The bonus to AC is +3, and to saves +3.
spells.pest-form.name: Pest Form
spells.pest-form.description: |-
  You become a Tiny animal of your choice (a cat, insect, lizard or rat), in a battle form: you gain the animal trait and can't Strike, and you can Dismiss the spell. You have AC 15 + your level, ignoring your armor's check penalty and Speed reduction; a Speed of 20 feet; weakness 5 to physical damage; low-light vision and imprecise scent 30 feet; and Acrobatics and Stealth modifiers of +10 (unless yours are higher) and Athletics –4.

  **Heightened (4th)** You can become a flying creature, such as a bird, with a fly Speed of 20 feet.
spells.pet-cache.name: Pet Cache
spells.pet-cache.description: |-
  You draw the target, a companion, into a pocket dimension just big enough for its comfort, with air, food and water for the duration; it brings only items made to be worn by its kind. You can Dismiss the spell; it also ends if you die or enter an extradimensional space. The target then reappears in the nearest open space.
spells.phantasmal-minion.name: Phantasmal Minion
spells.phantasmal-minion.description: |-
  You summon a phantasmal minion: a roughly humanoid shape, invisible or ghostly, obviously magical rather than a real creature.
spells.phantom-pain.name: Phantom Pain
spells.phantom-pain.description: |-
  Illusory pain deals 2d4 mental damage and 1d4 persistent mental damage, by the target's Will save.

  **Critical Success** The target is unaffected.

  **Success** The target takes the full initial damage but no persistent damage, and the spell ends.

  **Failure** The target takes the full initial and persistent damage and is sickened 1. When it recovers from sickened, the persistent damage and the spell end.

  **Critical Failure** As failure, but sickened 2.

  **Heightened (+1)** The damage increases by 2d4 and the persistent damage by 1d4.
spells.protection.name: Protection
spells.protection.description: |-
  The target gains a +1 status bonus to AC and saving throws.

  **Heightened (3rd)** You can also extend the benefits to all your allies in a 10-foot emanation around the target.
spells.pummeling-rubble.name: Pummeling Rubble
spells.pummeling-rubble.description: |-
  Heavy rocks spray over the area, dealing 2d4 bludgeoning damage to each creature by its Reflex save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is pushed 5 feet away from you.

  **Critical Failure** The creature takes double damage and is pushed 10 feet away from you.

  **Heightened (+1)** The damage increases by 2d4.
spells.runic-body.name: Runic Body
spells.runic-body.description: |-
  Glowing runes cover the target. Its unarmed attacks become +1 striking unarmed attacks: a +1 item bonus to attack rolls, and two damage dice.

  **Heightened (6th)** They are +2 greater striking (three dice).

  **Heightened (9th)** They are +3 major striking (four dice).
spells.runic-weapon.name: Runic Weapon
spells.runic-weapon.description: |-
  Temporary runes carve down the target weapon: it becomes a +1 striking weapon, with a +1 item bonus to attack rolls and two weapon damage dice.

  **Heightened (6th)** It is +2 greater striking (three dice).

  **Heightened (9th)** It is +3 major striking (four dice).
spells.sanctuary.name: Sanctuary
spells.sanctuary.description: |-
  A protective ward deters attacks on the target. A creature must attempt a Will save each time it tries to attack the target. If the target uses a hostile action, the spell ends.

  **Critical Success** The spell ends.

  **Success** The creature can make its attack, and any others against the target this turn.

  **Failure** The creature can't attack the target, wastes the action, and can't attack it again this turn.

  **Critical Failure** The creature wastes the action and can't attack the target for the rest of the spell.
spells.sleep.name: Sleep
spells.sleep.description: |-
  Creatures in the area grow drowsy. One that falls unconscious from this spell doesn't fall prone or drop what it holds, and a successful Perception check can still wake it.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes a –1 status penalty to Perception checks for 1 round.

  **Failure** The creature falls unconscious, waking automatically if it still is after 1 minute.

  **Critical Failure** The creature falls unconscious, waking automatically if it still is after 1 hour.

  **Heightened (4th)** The creatures are unconscious for 1 round on a failure or 1 minute on a critical failure, fall prone and drop what they hold, and can't attempt Perception checks to wake; when it ends they are sleeping normally.
spells.soothe.name: Soothe
spells.soothe.description: |-
  You soothe the target's mind and wounds: it regains 1d10+4 Hit Points and gains a +2 status bonus to saves against mental effects for the duration.

  **Heightened (+1)** The healing increases by 1d10+4.
spells.spider-sting.name: Spider Sting
spells.spider-sting.description: |-
  You deal 1d4 piercing damage to the touched creature and afflict it with spider venom; it attempts a Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target takes 1d4 poison damage.

  **Failure** The target is afflicted with spider venom at stage 1.

  **Critical Failure** The target is afflicted with spider venom at stage 2.

  **Spider venom** (poison) Level 1; maximum duration 4 rounds. **Stage 1** 1d4 poison damage and enfeebled 1 (1 round); **Stage 2** 1d4 poison damage and enfeebled 2 (1 round).
spells.spirit-link.name: Spirit Link
spells.spirit-link.description: |-
  You take on another creature's pain. When you cast the spell and at the start of each of your turns, if the target is below its maximum Hit Points it regains 2 Hit Points (or up to its maximum), and you lose as many. Nothing changes the amount, temporary Hit Points are ignored, and it works on undead too. Meanwhile you gain nothing from regeneration or fast healing. You can Dismiss it; it ends if you reach 0 Hit Points.

  **Heightened (+1)** The Hit Points transferred increase by 2.
spells.summon-animal.name: Summon Animal
spells.summon-animal.description: |-
  You summon a creature with the animal trait, of level –1, to fight for you.

  **Heightened** The creature's level is 1 at 2nd rank, 2 at 3rd, 3 at 4th, 5 at 5th, 7 at 6th, 9 at 7th, 11 at 8th, 13 at 9th and 15 at 10th.
spells.summon-construct.name: Summon Construct
spells.summon-construct.description: |-
  You summon a creature with the construct trait, of level –1, to fight for you.

  **Heightened** The creature's level is 1 at 2nd rank, 2 at 3rd, 3 at 4th, 5 at 5th, 7 at 6th, 9 at 7th, 11 at 8th, 13 at 9th and 15 at 10th.
spells.summon-fey.name: Summon Fey
spells.summon-fey.description: |-
  You summon a creature with the fey trait, of level –1, to fight for you.

  **Heightened** The creature's level is 1 at 2nd rank, 2 at 3rd, 3 at 4th, 5 at 5th, 7 at 6th, 9 at 7th, 11 at 8th, 13 at 9th and 15 at 10th.
spells.summon-plant-or-fungus.name: Summon Plant or Fungus
spells.summon-plant-or-fungus.description: |-
  You summon a creature with the plant or fungus trait, of level –1, to fight for you.

  **Heightened** The creature's level is 1 at 2nd rank, 2 at 3rd, 3 at 4th, 5 at 5th, 7 at 6th, 9 at 7th, 11 at 8th, 13 at 9th and 15 at 10th.
spells.summon-undead.name: Summon Undead
spells.summon-undead.description: |-
  You summon a creature with the undead trait, of level –1, to fight for you.

  **Heightened** The creature's level is 1 at 2nd rank, 2 at 3rd, 3 at 4th, 5 at 5th, 7 at 6th, 9 at 7th, 11 at 8th, 13 at 9th and 15 at 10th.
spells.sure-strike.name: Sure Strike
spells.sure-strike.description: |-
  The next time you make an attack roll before the end of your turn, roll it twice and take the better result. The attack ignores circumstance penalties to the roll and any flat check for a concealed or hidden target. You are then temporarily immune for 10 minutes.
spells.tailwind.name: Tailwind
spells.tailwind.description: |-
  The wind at your back gives you a +10-foot status bonus to your Speed.

  **Heightened (2nd)** It lasts 8 hours.
spells.thunderstrike.name: Thunderstrike
spells.thunderstrike.description: |-
  A crack of lightning and thunder deals 1d12 electricity damage and 1d4 sonic damage to the target, with a basic Reflex save. A target in metal armor or made of metal takes a –1 circumstance penalty to the save, and is clumsy 1 for 1 round if it takes damage.

  **Heightened (+1)** The damage increases by 1d12 electricity and 1d4 sonic.
spells.vanishing-tracks.name: Vanishing Tracks
spells.vanishing-tracks.description: |-
  Your tracks are hard to follow: the DC to Track you gains a +4 status bonus or becomes your spell DC, whichever is higher.

  **Heightened (2nd)** It lasts 8 hours.

  **Heightened (4th)** It lasts 8 hours, has a range of 20 feet and targets up to 10 creatures.
spells.ventriloquism.name: Ventriloquism
spells.ventriloquism.description: |-
  Your voice can seem to come from anywhere within 60 feet, and you can move it as you speak. Any creature that hears it can attempt to disbelieve the illusion.

  **Heightened (2nd)** It lasts 1 hour, and you can change your voice's tone and quality. A creature must actively examine the sound with a Perception check or other actions before it can disbelieve.
spells.acid-grip.name: Acid Grip
spells.acid-grip.description: |-
  A ghostly taloned hand grips the target, dealing 2d8 acid damage plus 1d6 persistent acid damage by its Reflex save. While it takes this persistent damage, it has a –10-foot status penalty to its Speeds.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage and no persistent damage, and the claw moves it up to 5 feet in a direction you choose.

  **Failure** The creature takes full damage and the persistent damage, and is moved up to 10 feet.

  **Critical Failure** The creature takes double damage and the full persistent damage, and is moved up to 20 feet.

  **Heightened (+2)** The initial damage increases by 2d8 and the persistent damage by 1d6.
spells.animal-form.name: Animal Form
spells.animal-form.description: |-
  You become a Medium animal battle form of your choice from the list (the kind of animal is yours to decide), gaining the animal trait; you can Dismiss the spell. You gain AC 16 + your level, ignoring your armor's check penalty and Speed reduction; 5 temporary Hit Points; low-light vision and imprecise scent 30 feet; the form's unarmed attacks, the only ones you can Strike with, trained, with an attack modifier of +9 and a damage bonus of +1 (Strength-based; use your own unarmed attack modifier if higher); and Athletics +9 unless yours is higher. Each form adds:

  - **Ape:** Speed 25 feet, climb 20 feet; fist 2d6 bludgeoning.
  - **Bear:** Speed 30 feet; jaws 2d8 piercing; claw (agile) 1d8 slashing.
  - **Bull:** Speed 30 feet; horn 2d8 piercing.
  - **Canine:** Speed 40 feet; jaws 2d8 piercing.
  - **Cat:** Speed 40 feet; jaws 2d6 piercing; claw (agile) 1d10 slashing.
  - **Deer:** Speed 50 feet; antler 2d6 piercing.
  - **Frog:** Speed 25 feet, swim 25 feet; jaws 2d6 bludgeoning; tongue (reach 15 feet) 2d4 bludgeoning.
  - **Shark:** swim 35 feet; jaws 2d8 piercing; breathes water but not air.
  - **Snake:** Speed 20 feet, climb 20 feet, swim 20 feet; fangs 2d4 piercing plus 1d6 poison.

  **Heightened (3rd)** 10 temporary Hit Points, AC 17 + your level, attack modifier +14, damage bonus +5, Athletics +14.

  **Heightened (4th)** Large, with 10-foot reach: 15 temporary Hit Points, AC 18 + your level, attack modifier +16, damage bonus +9, Athletics +16.

  **Heightened (5th)** Huge, with 15-foot reach: 20 temporary Hit Points, AC 18 + your level, attack modifier +18, damage bonus +7 and double damage dice, Athletics +20.
spells.animal-messenger.name: Animal Messenger
spells.animal-messenger.description: |-
  A Tiny wild animal in range comes to eat the food you offer. You give it the image, direction and distance of a place you know well, and it can carry a small object or note of light Bulk. It does its best to get there and waits for a nonhostile creature to take what it carries. The spell ends once it delivers or after 24 hours; without a Tiny animal in range, the spell is lost.
spells.augury.name: Augury
spells.augury.description: |-
  You ask about a course of action up to 30 minutes ahead and learn the GM's best guess: good, bad, mixed or nothing. The GM rolls a secret DC 6 flat check; on a failure the answer is always nothing, so a "nothing" can't be trusted. Asking again about the same topic reuses the first roll unless circumstances change.
spells.blazing-bolt.name: Blazing Bolt
spells.blazing-bolt.description: |-
  You fire a ray of heat and flame: make a spell attack against one creature, dealing 2d6 fire damage on a hit and double on a critical hit. Each additional action fires another ray at a different target, up to three for 3 actions; each attack adds to your multiple attack penalty, but only after all of them. With 2 or more actions, each ray deals 4d6 fire damage.

  **Heightened (+1)** The damage increases by 1d6 for 1 action, or 2d6 for 2 or 3 actions.
spells.blood-vendetta.name: Blood Vendetta
spells.blood-vendetta.description: |-
  You curse the creature that spilled your blood: it takes 2d6 persistent bleed damage and attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target takes half the persistent bleed damage.

  **Failure** The target takes the full persistent bleed damage, and has weakness 1 to piercing and slashing damage until the bleeding stops.

  **Critical Failure** As failure, but double the persistent bleed damage.

  **Heightened (+2)** The persistent bleed damage increases by 2d6.
spells.blood-vendetta.texts.trigger: a creature deals piercing, slashing or persistent bleed damage to you
spells.blood-vendetta.texts.requirements: you can bleed
spells.blur.name: Blur
spells.blur.description: |-
  The target's form blurs: it is concealed. Its location is still obvious, so it can't use this concealment to Hide or Sneak.
spells.calm.name: Calm
spells.calm.description: |-
  You soothe creatures in the area into a nonviolent state; each attempts a Will save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes a –1 status penalty to attack rolls.

  **Failure** Emotion effects on the creature are suppressed and it can't use hostile actions. If anyone is hostile to it, the spell no longer affects it.

  **Critical Failure** As failure, but hostility doesn't end the effect.
spells.cleanse-affliction.name: Cleanse Affliction
spells.cleanse-affliction.description: |-
  Choose an affliction on the target, such as a curse, disease or poison. If it is past stage 1, it goes down one stage; this can happen only once for a given case.

  **Heightened (3rd)** You also attempt to counteract it, if it is a disease or poison.

  **Heightened (4th)** You also attempt to counteract it, if it is a curse, disease or poison.
spells.clear-mind.name: Clear Mind
spells.clear-mind.description: |-
  Attempt to counteract an effect giving the target one of these conditions: fleeing, frightened or stupefied. If you fail but would have succeeded against a counteract rank 2 lower, the effect is suppressed until the start of your next turn (its duration doesn't run meanwhile). Conditions from curses, diseases or the target's nature can't be affected.

  **Heightened (4th)** Add confused, controlled and slowed.

  **Heightened (6th)** As 4th, and doomed.

  **Heightened (8th)** As 4th, and doomed and stunned.
spells.create-food.name: Create Food
spells.create-food.description: |-
  You create bland but nourishing food for six Medium creatures for a day; uneaten, it spoils after a day. A Small creature eats a quarter as much as a Medium one (a Tiny one a sixteenth), a Large one ten times as much (Huge, a hundred times).

  **Heightened (4th)** Food for 12 Medium creatures.

  **Heightened (6th)** Food for 50 Medium creatures.

  **Heightened (8th)** Food for 200 Medium creatures.
spells.darkness.name: Darkness
spells.darkness.description: |-
  Light can't enter the area or shine within it: non-magical light sources inside give no light, and magical light of this spell's rank or lower is suppressed. Creatures inside can't see out, and from outside it looks like a globe of darkness.

  **Heightened (4th)** Even creatures with darkvision (but not greater darkvision) barely see through it: targets seen through it are concealed to them.
spells.darkvision.name: Darkvision
spells.darkvision.description: |-
  You gain darkvision.

  **Heightened (3rd)** The range is touch and the target one willing creature.

  **Heightened (5th)** As 3rd, and it lasts until your next daily preparations.
spells.deafness.name: Deafness
spells.deafness.description: |-
  The target loses its hearing by its Fortitude save, and is then temporarily immune for 1 minute.

  **Critical Success** The target is unaffected.

  **Success** The target is deafened for 1 round.

  **Failure** The target is deafened for 10 minutes.

  **Critical Failure** The target is deafened permanently.
spells.dispel-magic.name: Dispel Magic
spells.dispel-magic.description: |-
  You attempt a counteract check against a spell or magic item. A magic item you counteract becomes a mundane item of its type for 10 minutes, keeping its non-magical properties. Against an artifact or similar item, you automatically fail.
spells.embed-message.name: Embed Message
spells.embed-message.description: |-
  You set a trigger and a message of up to 25 words. When the trigger happens within 30 feet of the target, illusory text circles it and a disembodied voice speaks the message, in a language you know and a voice you choose. The spell then ends.

  **Heightened (4th)** You can add a simple, obviously illusory sensory flourish (a smell, a visual effect, a sensation) that lasts while the message plays.

  **Heightened (6th)** As 4th, and you choose how many times the message repeats before the spell ends, without limit.
spells.enlarge.name: Enlarge
spells.enlarge.description: |-
  The target grows to Large, its equipment with it (an item it removes returns to normal size). It is clumsy 1, its reach increases by 5 feet (10 if it was Tiny), and it gains a +2 status bonus to damage rolls with melee Strikes. A Large or larger creature is unaffected.

  **Heightened (4th)** The target grows to Huge instead: +4 to melee damage, and reach 10 feet more (15 if it was Tiny). A Huge or larger creature is unaffected.

  **Heightened (6th)** Choose the 2nd- or 4th-rank version and apply it to up to 10 willing creatures.
spells.entangling-flora.name: Entangling Flora
spells.entangling-flora.description: |-
  Plants and fungi grow over the area, making every surface difficult terrain. A creature that starts its turn in the area attempts a Reflex save: on a failure it takes a –10-foot circumstance penalty to its Speeds until it leaves the area, and on a critical failure it is also immobilized for 1 round. It can Escape to end these.
spells.environmental-endurance.name: Environmental Endurance
spells.environmental-endurance.description: |-
  The target is protected from severe cold or severe heat, as you choose (not extreme).

  **Heightened (3rd)** It is protected from both severe cold and severe heat.

  **Heightened (5th)** It is protected from severe and extreme cold and heat.
spells.everlight.name: Everlight
spells.everlight.description: |-
  The gemstone you touch glows in a color of your choice, bright light in a 20-foot radius and dim light 20 feet beyond, until it breaks.
spells.false-vitality.name: False Vitality
spells.false-vitality.description: |-
  You give yourself 10 temporary Hit Points.

  **Heightened (+1)** The temporary Hit Points increase by 3.
spells.floating-flame.name: Floating Flame
spells.floating-flame.description: |-
  A fuelless flame appears, dealing 3d6 fire damage to each creature in its square with a basic Reflex save. When you Sustain the spell you can float it up to 10 feet, damaging each creature whose space it passes through (one new damage roll each Sustain; a creature takes damage from it at most once a round).

  **Heightened (+1)** The damage increases by 1d6.
spells.gecko-grip.name: Gecko Grip
spells.gecko-grip.description: |-
  The target gains a climb Speed equal to its Speed.

  **Heightened (5th)** It lasts 1 hour.
spells.ghostly-carrier.name: Ghostly Carrier
spells.ghostly-carrier.description: |-
  A Tiny semi-corporeal figure of your design hovers near you. When you cast a spell with a range of touch, it can carry the spell to a creature within range and return; it uses your bonuses for any spell attack. It has your AC and saves and is destroyed by any damage.
spells.humanoid-form.name: Humanoid Form
spells.humanoid-form.description: |-
  You look like a Small or Medium humanoid, such as a dwarf, elf, goblin, halfling, human or orc, gaining the humanoid trait and its kind's trait; a smaller form shrinks your reach. Your statistics and gear are unchanged and you gain none of its abilities. You gain a +4 status bonus to Deception checks to pass as a typical member of that ancestry, adding your level even if untrained, but you can't look like a specific person. You can Dismiss the spell.

  **Heightened (3rd)** You gain darkvision or low-light vision if the form has it.

  **Heightened (5th)** You can look like a Large humanoid, and gain enlarge's effects if you grow.
spells.illusory-creature.name: Illusory Creature
spells.illusory-creature.description: |-
  You create an illusion of a Large or smaller creature that sounds, smells and feels real; it ends if it is ever more than 500 feet from you. You can speak through it (a Deception or Performance check may be needed). In combat it acts with 2 actions when you Sustain the spell, using your spell attack modifier to attack and your spell DC as its AC, with saves at your spell DC – 10; it can flank. It ends if hit or if it fails a save. Its Strikes deal 3d4 nonlethal mental damage to a creature that believes it, and resistances apply as the target thinks they would. A creature that touches it or Seeks to examine it can disbelieve it, recovering half the damage it took.

  **Heightened (+1)** The damage increases by 1d4, and the creature can be one size larger (up to Gargantuan).
spells.invisibility.name: Invisibility
spells.invisibility.description: |-
  The target becomes invisible: undetected by everyone, though creatures can look for it to make it hidden to them instead. If the target uses a hostile action, the spell ends after it.

  **Heightened (4th)** It lasts 1 minute, and a hostile action doesn't end it.
spells.knock.name: Knock
spells.knock.description: |-
  The target door, lock or container is easier to open: a +4 status bonus to Athletics and Thievery checks to open it. You can attempt a Thievery check to open it as part of the casting, adding your level even if untrained. Knock counteracts lock.
spells.laughing-fit.name: Laughing Fit
spells.laughing-fit.description: |-
  Uncontrollable laughter overtakes the target by its Will save.

  **Critical Success** The target is unaffected.

  **Success** The target can't use reactions.

  **Failure** The target is slowed 1 and can't use reactions.

  **Critical Failure** The target falls prone and can't act or react for 1 round, then takes the failure's effects.
spells.marvelous-mount.name: Marvelous Mount
spells.marvelous-mount.description: |-
  You conjure a Large fantastical mount for the target, its minion: Speed 40 feet, carrying the target and its gear but no one else. It uses the target's AC and saves and is destroyed by more than 10 damage at once, ending the spell.

  **Heightened (3rd)** It can walk on water, but sinks if it ends its turn off solid ground.

  **Heightened (4th)** Speed 60 feet, and it walks on water.

  **Heightened (5th)** As 4th, with a fly Speed of 60 feet; it falls if it doesn't end its turn on a surface.

  **Heightened (6th)** Speed and fly Speed 80 feet.
spells.mist.name: Mist
spells.mist.description: |-
  A cloud of mist fills the area: creatures inside are concealed, and creatures outside are concealed to those inside. You can Dismiss it.
spells.noise-blast.name: Noise Blast
spells.noise-blast.description: |-
  A cacophony deals 2d10 sonic damage to each creature in the area by its Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is deafened for 1 round.

  **Critical Failure** The creature takes double damage, is deafened for 1 minute and stunned 1.

  **Heightened (+1)** The damage increases by 1d10.
spells.oaken-resilience.name: Oaken Resilience
spells.oaken-resilience.description: |-
  The target's skin turns tough as bark: resistance 2 to bludgeoning and piercing damage, and weakness 3 to fire. After taking fire damage, it can Dismiss the spell as a free action (the damage still applies).

  **Heightened (+2)** The resistances increase by 2 and the weakness by 3.
spells.one-with-plants.name: One with Plants
spells.one-with-plants.description: |-
  You become a plant or merge into one, and can Dismiss the spell. Either way you can't move or affect anything outside it, but can cast spells that need no line of effect beyond it.

  - **Merge with plants** (10 minutes): you must touch a plant big enough to hold you and your gear. You hear but can't see outside. Damage to the plant expels you and deals you 10d6 damage; the spell ends if you leave.
  - **Turn into a plant** (8 hours): you become a Large plant, typically a tree. Perception doesn't reveal you, but a Nature or Survival check against your spell DC shows you are a plant new to the area. You perceive normally. Your AC is 20, only status and circumstance bonuses and penalties affect you, and successes on Reflex saves are failures.
spells.paranoia.name: Paranoia
spells.paranoia.description: |-
  The target sees every creature as a threat; it attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target becomes unfriendly to everyone it wasn't already hostile to, allies included, and treats no one as an ally, for 1 round.

  **Failure** As success, for 1 minute.

  **Critical Failure** As failure, and it sees everyone as a mortal enemy, using its reactions and free actions against anyone, though it otherwise acts rationally and prefers foes that are harming it.

  **Heightened (6th)** You can target up to 5 creatures.
spells.peaceful-rest.name: Peaceful Rest
spells.peaceful-rest.description: |-
  The corpse doesn't decay and can't become undead. Time under this spell doesn't count against spells that need a recent death, and ordinary pests leave the body alone.

  **Heightened (5th)** It lasts indefinitely, takes one more action to cast, and costs embalming fluid worth 6 gp.
spells.resist-energy.name: Resist Energy
spells.resist-energy.description: |-
  Choose acid, cold, electricity, fire or sonic. The target and its gear gain resistance 5 to that damage.

  **Heightened (4th)** The resistance is 10, and you can target up to two creatures.

  **Heightened (7th)** The resistance is 15, and you can target up to five creatures.
spells.revealing-light.name: Revealing Light
spells.revealing-light.description: |-
  Magical light of the look you choose washes over the area. An affected creature is dazzled; an invisible one becomes concealed instead, and one concealed for any other reason no longer is. Each creature attempts a Reflex save.

  **Critical Success** The creature is unaffected.

  **Success** The light affects it for 2 rounds.

  **Failure** The light affects it for 1 minute.

  **Critical Failure** The light affects it for 10 minutes.
spells.see-the-unseen.name: See the Unseen
spells.see-the-unseen.description: |-
  You see invisible creatures as blurred shapes, concealed and hard to identify, and incorporeal creatures within 10 feet of an object's surface through it. You also gain a +2 status bonus to checks to disbelieve illusions.

  **Heightened (5th)** It lasts 8 hours.
spells.shape-wood.name: Shape Wood
spells.shape-wood.description: |-
  You shape the wood into a rough form of your choice, with no intricate parts, fine details or moving pieces. It can't make the wood more valuable.
spells.share-life.name: Share Life
spells.share-life.description: |-
  The target takes half the Hit Point damage from every effect, and you take the rest, with none of your resistances, weaknesses or other abilities applied. The spell ends if the target is more than 30 feet away, or once either of you reaches 0 Hit Points (after that damage is resolved).
spells.shatter.name: Shatter
spells.shatter.description: |-
  A high-pitched sound deals 2d10 sonic damage to the target object, ignoring its Hardness if it is 4 or lower.

  **Heightened (+1)** The damage increases by 1d10, and the Hardness ignored by 2.
spells.shrink.name: Shrink
spells.shrink.description: |-
  The target shrinks to Tiny, with its equipment (an item it removes returns to normal size). Its reach becomes 0 feet. A Tiny creature is unaffected.

  **Heightened (6th)** You can target up to 10 creatures.
spells.silence.name: Silence
spells.silence.description: |-
  The target makes no sound: it can't be noticed by hearing alone, can't use sonic attacks or auditory actions, and can't cast spells other than subtle ones.

  **Heightened (4th)** A 10-foot emanation around the touched creature silences all sound in it or passing through, with the same effects on creatures inside.
spells.sound-body.name: Sound Body
spells.sound-body.description: |-
  Attempt to counteract an effect giving the target one of these conditions: blinded, dazzled, deafened, enfeebled or sickened. If you fail but would have succeeded against a counteract rank 2 lower, the effect is suppressed until the start of your next turn (its duration doesn't run meanwhile). Curses, diseases and the target's natural conditions can't be affected.

  **Heightened (4th)** Add drained and slowed.

  **Heightened (6th)** As 4th, and petrified.

  **Heightened (8th)** As 4th, and petrified and stunned.
spells.speak-with-animals.name: Speak with Animals
spells.speak-with-animals.description: |-
  You can talk with animals and use Diplomacy with them. They aren't any friendlier than usual: clever ones are terse and evasive, simple ones often say inane things.
spells.spiritual-armament.name: Spiritual Armament
spells.spiritual-armament.description: |-
  You fling a ghostly echo of a weapon you wield or wear: a spell attack against the target's AC, dealing 2d8 damage of the weapon's type (or spirit damage, if that would be worse for the target) on a hit, double on a critical hit. It uses and adds to your multiple attack penalty. Each time you Sustain the spell, you can attack again any creature within 120 feet. If you sanctify the spell, the attacks are sanctified.

  **Heightened (+2)** The damage increases by 1d8.
spells.status.name: Status
spells.status.description: |-
  While you and the target are on the same plane and alive, you know its direction and distance from you and the conditions affecting it.

  **Heightened (4th)** The range is 30 feet, and you can target up to 10 creatures.
spells.stupefy.name: Stupefy
spells.stupefy.description: |-
  You dull the target's mind by its Will save.

  **Critical Success** The target is unaffected.

  **Success** The target is stupefied 1 until the start of your next turn.

  **Failure** The target is stupefied 2 for 1 minute.

  **Critical Failure** The target is stupefied 3 for 1 minute.
spells.summon-elemental.name: Summon Elemental
spells.summon-elemental.description: |-
  You summon a creature with the elemental trait, of level 1 or lower, to fight for you.

  **Heightened** The creature's level is 2 at 3rd rank, 3 at 4th, 5 at 5th, 7 at 6th, 9 at 7th, 11 at 8th, 13 at 9th and 15 at 10th.
spells.sure-footing.name: Sure Footing
spells.sure-footing.description: |-
  Attempt to counteract an effect giving the target one of these conditions: clumsy, grabbed or paralyzed. If you fail but would have succeeded against a counteract rank 2 lower, the effect is suppressed until the start of your next turn (its duration doesn't run meanwhile). Curses, diseases and the target's natural conditions can't be affected.

  **Heightened (4th)** Add immobilized, restrained and slowed.

  **Heightened (6th)** As 4th, and petrified.

  **Heightened (8th)** As 4th, and petrified and stunned.
spells.telekinetic-maneuver.name: Telekinetic Maneuver
spells.telekinetic-maneuver.description: |-
  You telekinetically Disarm, Reposition, Shove or Trip the target, rolling a spell attack instead of an Athletics check.
spells.translate.name: Translate
spells.translate.description: |-
  The target understands the meaning of one language it hears or reads when you cast the spell (not codes or heavy metaphor). If it hears several, it chooses one if it knows they are there, otherwise one at random.

  **Heightened (3rd)** The target can also speak the language.

  **Heightened (4th)** You can target up to 10 creatures, and they can speak the language.
spells.water-breathing.name: Water Breathing
spells.water-breathing.description: |-
  The targets can breathe underwater.

  **Heightened (3rd)** It lasts 8 hours.

  **Heightened (4th)** It lasts until your next daily preparations.
spells.water-walk.name: Water Walk
spells.water-walk.description: |-
  The target walks on water and other liquids without sinking. It can go under if it wishes, then Swims normally; it can't breathe underwater.

  **Heightened (4th)** The range is 30 feet, it lasts 1 hour, and you can target up to 10 creatures.
spells.aqueous-orb.name: Aqueous Orb
spells.aqueous-orb.description: |-
  A 10-foot sphere of water forms on the ground or on a liquid's surface. When you cast the spell and each time you Sustain it, you can roll it up to 10 feet, through creatures and obstacles that wouldn't stop water. It puts out non-magical fires of its size or smaller and attempts to counteract magical ones (once per fire). It tries to engulf each Large or smaller creature it moves through (once per turn each), which attempts a Reflex save.

  **Success** The creature lets the orb pass, or lets it push the creature to the end of its movement.

  **Failure** The creature is engulfed and moves with the orb, holding its breath or suffocating unless it breathes water; aquatic combat rules apply to a Medium or smaller creature. It escapes by Swimming (DC 10 Athletics) or Escaping against your spell DC.

  **Critical Failure** As failure, but it can't Swim free.
spells.bind-undead.name: Bind Undead
spells.bind-undead.description: |-
  You seize control of the target, a mindless undead creature of level no higher than the spell's rank: it gains the minion trait. A hostile action by you or an ally against it ends the spell.
spells.blindness.name: Blindness
spells.blindness.description: |-
  You blind the target by its Fortitude save; it is then temporarily immune for 1 minute.

  **Critical Success** The target is unaffected.

  **Success** The target is blinded until its next turn begins.

  **Failure** The target is blinded for 1 minute.

  **Critical Failure** The target is blinded permanently.
spells.chilling-darkness.name: Chilling Darkness
spells.chilling-darkness.description: |-
  A ray of unholy, freezing darkness: make a ranged spell attack. It deals 5d6 cold damage, plus 5d6 spirit damage if the target has the holy trait.

  **Critical Success** The target takes double damage.

  **Success** The target takes full damage.

  If the ray passes through magical light or targets a creature affected by it, it attempts to counteract the light.

  **Heightened (+1)** The cold damage increases by 2d6, and the spirit damage against holy creatures by 2d6.
spells.clairaudience.name: Clairaudience
spells.clairaudience.description: |-
  An invisible, unmoving ear appears where you choose in range, even out of sight or line of effect, and you hear through it as though there.
spells.cozy-cabin.name: Cozy Cabin
spells.cozy-cabin.description: |-
  You raise a wooden cabin 20 feet square and 10 feet high (a structure), with glass windows and a door that takes a lock. Inside are three cots, a chamber pot, a fireplace with a magical fire, and a light you turn on and off with a Sustain. It's comfortable against most weather, but extreme heat or cold, great storms and hurricane winds destroy it. Others come and go freely; if you leave, the spell ends. You can Dismiss it.
spells.crisis-of-faith.name: Crisis of Faith
spells.crisis-of-faith.description: |-
  You assail the target's faith with doubt: 6d6 mental damage, or 6d8 if it can cast divine spells, by its Will save. Casting it on a follower of your own deity without good cause is anathema to many deities.

  **Critical Success** The target is unaffected.

  **Success** The target takes half damage.

  **Failure** The target takes full damage; a divine caster is also stupefied 1 for 1 round.

  **Critical Failure** The target takes double damage, is stupefied 1 for 1 round, and can't cast divine spells for 1 round.

  **Heightened (+1)** The damage increases by 2d6 (2d8 against a divine spellcaster).
spells.dream-message.name: Dream Message
spells.dream-message.description: |-
  You send one minute of speech (about 150 words) into the target's dreams. A sleeping target gets it at once, otherwise the next time it sleeps; the spell then ends, and you know it arrived.

  **Heightened (4th)** You can send the same message to up to 10 creatures you know by name and have met.
spells.earthbind.name: Earthbind
spells.earthbind.description: |-
  The weight of the earth drags the flying target down by its Fortitude save; if it lands safely, it takes no falling damage.

  **Critical Success** The target is unaffected.

  **Success** The target falls safely up to 120 feet.

  **Failure** It falls safely up to 120 feet, and if it lands it can't Fly, levitate or otherwise leave the ground for 1 round.

  **Critical Failure** As failure, for 1 minute.
spells.enthrall.name: Enthrall
spells.enthrall.description: |-
  You speak or sing without pause, and your words captivate those who notice them; each target attempts a Will save, with up to a +4 circumstance bonus if it is unlikely to agree with you. A creature coming into range saves when you Sustain the spell. Speaking gives the spell the linguistic trait.

  **Critical Success** The target is unaffected and notices you tried to use magic.

  **Success** The target needn't pay attention and doesn't notice the magic.

  **Failure** The target is fascinated with you. It can save again when it sees or hears something it disagrees with, ending the fascination and becoming temporarily immune for 1 hour on a success. A hostile act against it, or a successful Diplomacy or Intimidation check against it, ends the fascination.

  **Critical Failure** As failure, but disagreement gives it no new save.
spells.feet-to-fins.name: Feet to Fins
spells.feet-to-fins.description: |-
  The target's feet become fins: it gains a swim Speed equal to its land Speed, but its land Speed becomes 5 feet.

  **Heightened (6th)** It lasts until your next daily preparations.
spells.fireball.name: Fireball
spells.fireball.description: |-
  A roaring blast of fire bursts where you choose: 6d6 fire damage with a basic Reflex save.

  **Heightened (+1)** The damage increases by 2d6.
spells.ghostly-weapon.name: Ghostly Weapon
spells.ghostly-weapon.description: |-
  The target weapon turns translucent and ghostly, with the effects of the ghost touch property rune: it is magical, especially effective against incorporeal creatures, and can be wielded by corporeal and incorporeal creatures alike.
spells.haste.name: Haste
spells.haste.description: |-
  The target is quickened, and can use the extra action only to Strike or Stride.

  **Heightened (7th)** You can target up to 6 creatures.
spells.heroism.name: Heroism
spells.heroism.description: |-
  The target gains a +1 status bonus to attack rolls, Perception checks, saving throws and skill checks.

  **Heightened (6th)** The bonus is +2.

  **Heightened (9th)** The bonus is +3.
spells.holy-light.name: Holy Light
spells.holy-light.description: |-
  A ray of blazing, holy light: make a ranged spell attack. It deals 5d6 fire damage, plus 5d6 spirit damage if the target has the unholy trait.

  **Critical Success** The target takes double damage.

  **Success** The target takes full damage.

  If the light passes through magical darkness or targets a creature affected by it, it attempts to counteract the darkness.

  **Heightened (+1)** The fire damage increases by 2d6, and the spirit damage against unholy creatures by 2d6.
spells.hypercognition.name: Hypercognition
spells.hypercognition.description: |-
  You instantly use up to 6 Recall Knowledge actions as part of the casting, without special abilities, reactions or free actions that trigger on Recall Knowledge.
spells.hypnotize.name: Hypnotize
spells.hypnotize.description: |-
  A cloud of mesmerizing patterns hangs in the air; creatures inside are dazzled. A creature saves (Will) when it is inside as you cast the spell, enters it, ends its turn in it, or Seeks or Interacts with it; one already fascinated by it doesn't save again.

  **Success** The target is unaffected.

  **Failure** The target is fascinated by the cloud.

  **Critical Failure** The target is fascinated by the cloud and can't use reactions while it is.
spells.insect-form.name: Insect Form
spells.insect-form.description: |-
  You become a Medium insect battle form of your choice from the list (the kind of bug is yours to decide), gaining the animal trait; you can Dismiss the spell. You gain AC 18 + your level, ignoring your armor's check penalty and Speed reduction; 10 temporary Hit Points; low-light vision; the form's attacks, the only ones you can Strike with, trained, with an attack modifier of +13 and a damage bonus of +2 (Strength-based; use your own unarmed attack modifier if higher); and Athletics +13 unless yours is higher. Each form adds:

  - **Ant:** Speed 30 feet, climb 30 feet; mandibles 2d6 bludgeoning.
  - **Beetle:** Speed 25 feet; mandibles 2d10 bludgeoning.
  - **Centipede:** Speed 25 feet, climb 25 feet; darkvision; mandibles 1d8 piercing plus 1d4 persistent poison.
  - **Mantis:** Speed 40 feet; imprecise scent 30 feet; foreleg 2d8 piercing.
  - **Scorpion:** Speed 40 feet; darkvision, imprecise tremorsense 60 feet; stinger 1d8 piercing plus 1d4 persistent poison; pincer (agile) 1d6 bludgeoning.
  - **Spider:** Speed 25 feet, climb 25 feet; darkvision; fangs 1d6 piercing plus 1d4 persistent poison; web (ranged, increment 20 feet) immobilizes the target for 1 round or until it Escapes.

  **Heightened (4th)** Large, with 10-foot reach: 15 temporary Hit Points, attack modifier +16, damage bonus +6, Athletics +16.

  **Heightened (5th)** Huge, with 15-foot reach: 20 temporary Hit Points, attack modifier +18, damage bonus +2 and double damage dice (persistent damage too), Athletics +20.
spells.levitate.name: Levitate
spells.levitate.description: |-
  The target floats 5 feet off the ground; you can Sustain the spell to move it up or down 10 feet. A floating creature takes a –2 circumstance penalty to attack rolls, which an Interact to steady itself removes for the rest of its turn. Next to a suitable surface, it can move along it by climbing (walls) or crawling (ceilings), as the GM decides.
spells.lightning-bolt.name: Lightning Bolt
spells.lightning-bolt.description: |-
  A bolt of lightning lances out along the line: 4d12 electricity damage with a basic Reflex save.

  **Heightened (+1)** The damage increases by 1d12.
spells.locate.name: Locate
spells.locate.description: |-
  You learn the direction to the target object, or to the nearest of a type of object. A specific object must be one you have observed directly; a type needs an accurate mental image. Lead or running water between you blocks the spell, so a farther one may be found instead.

  **Heightened (5th)** You can target a specific creature or ancestry you have met or seen up close.
spells.mad-monkeys.name: Mad Monkeys
spells.mad-monkeys.description: |-
  Spirit monkeys fill the area; they can't be attacked or hurt, and calm or similar magic makes them docile for the spell. Choose their mischief when you cast it: it happens then and the first time each round you Sustain the spell, when you can also move the area 5 feet.

  - **Flagrant burglary:** the monkeys Steal one item from one creature in the area, with your spell DC – 10 as their Thievery modifier; the victim knows what was tried. Getting an item back takes Stealing it or Disarming them against your spell DC; when the spell ends, stolen items drop in the area.
  - **Raucous din:** each creature in the area attempts a Fortitude save. Critical success: unaffected, and temporarily immune for 10 minutes. Success: unaffected. Failure: deafened for 1 round. Critical failure: deafened for 1 minute.
  - **Tumultuous gymnastics:** each creature in the area attempts a Reflex save. Critical success: unaffected, and temporarily immune for 10 minutes. Success: unaffected. Failure: for 1 round, a DC 5 flat check for each manipulate action, which is disrupted on a failure. Critical failure: as failure, until the spell ends, even outside the area.
spells.mind-reading.name: Mind Reading
spells.mind-reading.description: |-
  You try to read the target's mind; it attempts a Will save and is then temporarily immune to your mind reading for 1 hour.

  **Critical Success** The target perceives your surface thoughts as you cast the spell.

  **Success** You learn whether its Intelligence modifier is higher than, equal to or lower than yours.

  **Failure** You perceive its surface thoughts as you cast the spell, and learn how its Intelligence compares to yours.

  **Critical Failure** As failure, and you can Sustain the spell to read its surface thoughts again, with no new saves.
spells.one-with-stone.name: One with Stone
spells.one-with-stone.description: |-
  As one with plants, but you merge with stone or become a stone, with AC 23 in stone form. You can Dismiss the spell.
spells.paralyze.name: Paralyze
spells.paralyze.description: |-
  You freeze the target's body before its commands leave its mind; it attempts a Will save.

  **Critical Success** The target is unaffected.

  **Success** The target is stunned 1.

  **Failure** The target is paralyzed for 1 round.

  **Critical Failure** The target is paralyzed for 4 rounds. At the end of each of its turns, it can attempt a new Will save to shorten the duration by 1 round, or end it on a critical success.

  **Heightened (7th)** You can target up to 10 creatures.
spells.ring-of-truth.name: Ring of Truth
spells.ring-of-truth.description: |-
  Lies are revealed in the area: a bell rings softly whenever a creature in it speaks the truth, and creatures there take a –2 status penalty to Deception checks. They know of the magic and can be evasive. Each creature attempts a Will save on being in the area as you cast it or entering it, keeping that result.

  **Critical Success** The creature is so convincing the bell rings even when it lies.

  **Success** If it lies and its Deception check beats everyone present, the bell still rings.

  **Failure** The bell never rings when it lies.
spells.safe-passage.name: Safe Passage
spells.safe-passage.description: |-
  Everyone in the area is protected from harm by the terrain and environment there (environmental damage, hazardous terrain, hazards): a +2 status bonus to AC and saves against them and resistance 5 to their damage. Things prone to collapse there, such as a rickety bridge, don't collapse short of extreme strain. It doesn't remove difficult terrain or concealment, nor protect against creatures.

  **Heightened (5th)** Resistance 10, and the area can be 120 feet long.

  **Heightened (8th)** Resistance 15, and the area can be 500 feet long.
spells.slow.name: Slow
spells.slow.description: |-
  Time drags around the target, by its Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** The target is slowed 1 for 1 round.

  **Failure** The target is slowed 1 for 1 minute.

  **Critical Failure** The target is slowed 2 for 1 minute.

  **Heightened (6th)** You can target up to 10 creatures.
spells.speak-with-plants.name: Speak with Plants
spells.speak-with-plants.description: |-
  You can ask plants and fungi questions and understand their answers, though they are no friendlier or wiser than usual: they know little beyond their surroundings, and clever plant monsters are terse and evasive.

  **Heightened (4th)** It lasts 8 hours.
spells.vampiric-feast.name: Vampiric Feast
spells.vampiric-feast.description: |-
  Your touch drains the target's life: 6d6 void damage with a basic Fortitude save. You gain temporary Hit Points equal to half the damage it takes (after resistances and the like), which last 1 minute.

  **Heightened (+1)** The damage increases by 2d6.
spells.veil-of-privacy.name: Veil of Privacy
spells.veil-of-privacy.description: |-
  For the duration, the spell attempts to counteract every detection, revelation and scrying effect used against the target or its gear, counting cantrips as 1st-rank spells. Countering an area or multi-target effect protects only this target.
spells.wall-of-thorns.name: Wall of Thorns
spells.wall-of-thorns.description: |-
  A 5-foot-thick wall of thorny brambles grows in a straight line up to 60 feet long and 10 feet high (or shorter), in unbroken open space, or the spell is lost. It gives cover to each side from the other and is difficult terrain; each move action a creature uses to enter it deals 3d4 piercing damage. Each 10-by-10-foot section has AC 10, Hardness 10 and 20 Hit Points, and is immune to critical hits and precision damage.

  **Heightened (+1)** Each section's Hit Points increase by 5, and the piercing damage by 1d4.
spells.wall-of-wind.name: Wall of Wind
spells.wall-of-wind.description: |-
  A wall of gusting wind 5 feet thick, 60 feet long and 30 feet high rises along a path you choose. It doesn't block sight. Ammunition from physical ranged attacks can't pass through; larger thrown weapons take a –2 circumstance penalty to attack through it; massive weapons and spells that don't create objects are unaffected. It is difficult terrain for creatures moving over land, gases can't pass, and a creature trying to fly through it with a move action attempts a Fortitude save.

  **Critical Success** It moves through normally this turn.

  **Success** It can move through this turn, but the wall is difficult terrain.

  **Failure** The wall stops it, and the rest of its movement for that action is lost.

  **Critical Failure** As failure, and it is pushed 10 feet away from the wall.
templates.runic-greater.name: '{base} (runic, +2 greater striking)'
templates.runic-major.name: '{base} (runic, +3 major striking)'
templates.runic.name: '{base} (runic, +1 striking)'
