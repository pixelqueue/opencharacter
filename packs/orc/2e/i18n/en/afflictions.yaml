# Afflictions: their stages, written for the pack (the poisons' as their items').

afflictions.arsenic.name: 'Arsenic'
afflictions.arsenic.description: 'Poison. Fortitude DC 18; onset 10 minutes; maximum duration 5 minutes. Stage 1: 1d4 poison and sickened 1 (1 minute); stage 2: 1d6 poison and sickened 2 (1 minute); stage 3: 1d8 poison and sickened 3 (1 minute).'
afflictions.belladonna.name: 'Belladonna'
afflictions.belladonna.description: 'Poison. Fortitude DC 19; onset 10 minutes; maximum duration 30 minutes. Stage 1: dazzled (10 minutes); stage 2: 1d6 poison and sickened 1 (10 minutes); stage 3: 1d6 poison, confused and sickened 1 (1 minute).'
afflictions.black-adder-venom.name: 'Black Adder Venom'
afflictions.black-adder-venom.description: 'Poison. Fortitude DC 18; maximum duration 3 rounds. Stage 1: 1d4 poison (1 round); stage 2: 1d6 poison (1 round); stage 3: 1d8 poison (1 round).'
afflictions.black-lotus-extract.name: 'Black Lotus Extract'
afflictions.black-lotus-extract.description: 'Poison. Fortitude DC 42; onset 1 minute; maximum duration 6 rounds. Stage 1: 13d6 poison and drained 1 (1 round); stage 2: 15d6 poison and drained 1 (1 round); stage 3: 17d6 poison and drained 2 (1 round).'
afflictions.blightburn-resin.name: 'Blightburn Resin'
afflictions.blightburn-resin.description: 'Poison. Fortitude DC 30; onset 1 minute; maximum duration 6 rounds. Stage 1: 6d6 poison (1 round); stage 2: 7d6 poison (1 round); stage 3: 9d6 poison (1 round).'
afflictions.brimstone-fumes.name: 'Brimstone Fumes'
afflictions.brimstone-fumes.description: 'Poison. Fortitude DC 36; onset 1 round; maximum duration 6 rounds. Stage 1: 7d8 poison and enfeebled 1 (1 round); stage 2: 8d8 poison and enfeebled 2 (1 round); stage 3: 10d8 poison and enfeebled 3 (1 round).'
afflictions.cave-worm-venom.name: 'Cave Worm Venom'
afflictions.cave-worm-venom.description: 'Poison. Fortitude DC 32; maximum duration 6 rounds. Stage 1: 5d6 poison and enfeebled 2 (1 round); stage 2: 6d6 poison and enfeebled 2 (1 round); stage 3: 8d6 poison and enfeebled 2 (1 round).'
afflictions.cerulean-scourge.name: 'Cerulean Scourge'
afflictions.cerulean-scourge.description: 'Poison. Fortitude DC 37; maximum duration 6 rounds. Stage 1: 10d6 poison (1 round); stage 2: 12d6 poison (1 round); stage 3: 14d6 poison (1 round).'
afflictions.cytillesh-oil.name: 'Cytillesh Oil'
afflictions.cytillesh-oil.description: 'Poison. Fortitude DC 19; maximum duration 4 rounds. Stage 1: 1d8 poison (1 round); stage 2: 1d10 poison (1 round); stage 3: 2d8 poison (1 round).'
afflictions.deathcap-powder.name: 'Deathcap Powder'
afflictions.deathcap-powder.description: 'Poison. Fortitude DC 33; onset 10 minutes; maximum duration 6 minutes. Stage 1: 7d8 poison (1 minute); stage 2: 9d6 poison and sickened 2 (1 minute); stage 3: 8d10 poison and sickened 3 (1 minute).'
afflictions.enervating-powder.name: 'Enervating Powder'
afflictions.enervating-powder.description: 'Poison. Fortitude DC 28; onset 10 minutes; maximum duration 6 minutes. Stage 1: fatigued (1 minute); stage 2: 5d6 poison and fatigued (1 minute); stage 3: 6d6 poison, fatigued and paralyzed (1 minute).'
afflictions.fearflower-nectar.name: 'Fearflower Nectar'
afflictions.fearflower-nectar.description: 'Poison. Fortitude DC 21; maximum duration 6 rounds. Stage 1: 1d6 poison and frightened 1 (1 round); stage 2: 1d6 poison and frightened 2 (1 round); stage 3: 1d6 poison and frightened 3 (1 round).'
afflictions.giant-centipede-venom.name: 'Giant Centipede Venom'
afflictions.giant-centipede-venom.description: 'Poison. Fortitude DC 17; maximum duration 6 rounds. Stage 1: 1d4 poison (1 round); stage 2: 1d4 poison and fatigued (1 round); stage 3: 1d4 poison, clumsy 1 and fatigued (1 round).'
afflictions.giant-scorpion-venom.name: 'Giant Scorpion Venom'
afflictions.giant-scorpion-venom.description: 'Poison. Fortitude DC 22; maximum duration 6 rounds. Stage 1: 2d6 poison and enfeebled 1 (1 round); stage 2: 2d8 poison and enfeebled 1 (1 round); stage 3: 2d10 poison and enfeebled 2 (1 round).'
afflictions.graveroot.name: 'Graveroot'
afflictions.graveroot.description: 'Poison. Fortitude DC 19; maximum duration 4 rounds. Stage 1: 1d8 poison (1 round); stage 2: 1d10 poison and stupefied 1 (1 round); stage 3: 2d6 poison and stupefied 2 (1 round).'
afflictions.hemlock.name: 'Hemlock'
afflictions.hemlock.description: 'Poison. Fortitude DC 38; onset 30 minutes; maximum duration 60 minutes. Stage 1: 16d6 poison and enfeebled 2 (10 minutes); stage 2: 17d6 poison and enfeebled 3 (10 minutes); stage 3: 18d6 poison and enfeebled 4 (10 minutes).'
afflictions.kings-sleep.name: "King's Sleep"
afflictions.kings-sleep.description: 'Poison. Fortitude DC 41; onset 1 day. Stage 1: drained 1 (1 day); stage 2: drained 1 (1 day); stage 3: drained 2 (1 day).'
afflictions.leadenleg.name: 'Leadenleg'
afflictions.leadenleg.description: 'Poison. Fortitude DC 20; maximum duration 6 rounds. Stage 1: 1d10 poison and a -5-foot status penalty to Speeds (1 round); stage 2: 2d6 poison and -10 feet (1 round); stage 3: 2d6 poison and -20 feet (1 round).'
afflictions.lethargy-poison.name: 'Lethargy Poison'
afflictions.lethargy-poison.description: 'Poison. Fortitude DC 18; onset 1 round; maximum duration 4 hours. Stage 1: slowed 1 (1 round); stage 2: slowed 1 (1 minute); stage 3: unconscious with no Perception check to wake (1 round); stage 4: unconscious with no Perception check to wake (1d4 hours).'
afflictions.mindfog-mist.name: 'Mindfog Mist'
afflictions.mindfog-mist.description: 'Poison. Fortitude DC 35; onset 1 round; maximum duration 6 rounds. Stage 1: stupefied 2 (1 round); stage 2: confused and stupefied 3 (1 round); stage 3: confused and stupefied 4 (1 round).'
afflictions.nethershade.name: 'Nethershade'
afflictions.nethershade.description: 'Poison. Fortitude DC 29; maximum duration 6 rounds. Stage 1: 2d6 void and 2d6 poison (1 round); stage 2: 3d6 void, 2d6 poison and enfeebled 1 (1 round); stage 3: 3d6 void, 3d6 poison and enfeebled 2 (1 round).'
afflictions.nettleweed-residue.name: 'Nettleweed Residue'
afflictions.nettleweed-residue.description: 'Poison. Fortitude DC 27; onset 1 minute; maximum duration 6 minutes. Stage 1: 3d6 poison (1 minute); stage 2: 4d6 poison (1 minute); stage 3: 6d6 poison (1 minute).'
afflictions.slumber-wine.name: 'Slumber Wine'
afflictions.slumber-wine.description: 'Poison. Fortitude DC 32; onset 1 hour; maximum duration 7 days. Stage 1: unconscious (1 day); stage 2: unconscious (2 days); stage 3: unconscious (3 days).'
afflictions.spider-root.name: 'Spider Root'
afflictions.spider-root.description: 'Poison. Fortitude DC 28; onset 1 minute; maximum duration 6 minutes. Stage 1: 3d6 poison and clumsy 1 (1 minute); stage 2: 4d6 poison and clumsy 2 (1 minute); stage 3: 6d6 poison and clumsy 3 (1 minute).'
afflictions.spider-venom.name: 'Spider Venom'
afflictions.spider-venom.description: 'Poison. Fortitude DC 22; maximum duration 6 rounds. Stage 1: 1d10 poison and sickened 1 (1 round); stage 2: 1d12 poison, clumsy 1 and sickened 2 (1 round); stage 3: 2d6 poison, clumsy 2 and sickened 3 (1 round).'
afflictions.tangle-root-toxin.name: 'Tangle Root Toxin'
afflictions.tangle-root-toxin.description: 'Poison. Fortitude DC 26; onset 1 minute; maximum duration 6 minutes. Stage 1: clumsy 1 and a -10-foot status penalty to Speeds (1 minute); stage 2: clumsy 2 and -20 feet (1 minute); stage 3: clumsy 3, off-guard and -30 feet (1 minute).'
afflictions.tears-of-death.name: 'Tears of Death'
afflictions.tears-of-death.description: 'Poison. Fortitude DC 44; onset 1 minute; maximum duration 10 minutes. Stage 1: 20d6 poison and paralyzed (1 round); stage 2: 22d6 poison and paralyzed (1 minute); stage 3: 24d6 poison and paralyzed (1 minute).'
afflictions.wolfsbane.name: 'Wolfsbane'
afflictions.wolfsbane.description: 'Poison. Fortitude DC 30; onset 10 minutes; maximum duration 6 minutes. Stage 1: 3d10 poison (1 minute); stage 2: 4d10 poison (1 minute); stage 3: 5d10 poison (1 minute).'
afflictions.wyvern-poison.name: 'Wyvern Poison'
afflictions.wyvern-poison.description: 'Poison. Fortitude DC 26; maximum duration 6 rounds. Stage 1: 3d6 poison (1 round); stage 2: 3d8 poison (1 round); stage 3: 3d10 poison (1 round).'
afflictions.goblin-pox.name: 'Goblin pox'
afflictions.goblin-pox.description: "Disease, level 1; creatures with the goblin trait are immune. Stage 1: sickened 1 (1 round); stage 2: sickened 1 and slowed 1 (1 round); stage 3: sickened 1, which can't be lowered (1 day)."
afflictions.spider-venom-spell.name: 'Spider venom'
afflictions.spider-venom-spell.description: 'Poison, level 1; maximum duration 4 rounds. Stage 1: 1d4 poison damage and enfeebled 1 (1 round); stage 2: 1d4 poison damage and enfeebled 2 (1 round).'
afflictions.curse-of-death.name: 'Curse of death'
afflictions.curse-of-death.description: 'Curse, ending with the spell. Stage 1: 4d6 void damage and fatigued (1 round); stage 2: 8d6 void damage and fatigued; stage 3: 12d6 void damage and fatigued; stage 4: death. Heightened, each of the first three stages deals 1d6 more per rank above 5th.'
afflictions.dagger-venom.name: 'Dagger venom'
afflictions.dagger-venom.description: 'Poison, Fortitude DC 21; maximum duration 4 rounds. Stage 1: 1d8 poison damage and enfeebled 1 (1 round).'

# GM Core's diseases and curses.
afflictions.bog-rot.name: 'Bog rot'
afflictions.bog-rot.description: 'Disease, level 0. Fortitude DC 13; onset 1 day. Stage 1: clumsy 1 (1 day); stage 2: clumsy 1 and a -5-foot status penalty to Speed (1 day); stage 3: clumsy 2 and a -10-foot status penalty to Speed (1 day). Amputating the affected feet also cures it.'
afflictions.scarlet-fever.name: 'Scarlet fever'
afflictions.scarlet-fever.description: "Disease, level 1. Fortitude DC 13; onset 2 days. You can't lower your sickened value while afflicted. Stage 1: sickened 1 (1 day); stage 2: sickened 2 (1 day); stage 3: sickened 3 and unable to speak (1 day); stage 4: death."
afflictions.tetanus.name: 'Tetanus'
afflictions.tetanus.description: 'Disease, level 1. Fortitude DC 14; onset 10 days. Stage 1: clumsy 1 (1 week); stage 2: clumsy 2 and unable to speak (1 day); stage 3: paralyzed by spasms (1 day); stage 4: death.'
afflictions.tuberculosis.name: 'Tuberculosis'
afflictions.tuberculosis.description: "Disease, level 1. Fortitude DC 15; onset 1 week. Stage 1: a carrier, no effect (1 week); stage 2: coughing: a DC 5 flat check to Cast a Spell or Activate an Item with the concentrate trait (1 week); stage 3: fatigued, which you can't recover from, and the flat check is DC 15 (1 week); stage 4: unconscious (1 week); stage 5: death."
afflictions.malaria.name: 'Malaria'
afflictions.malaria.description: "Disease, level 2. Fortitude DC 16; onset 10 days. You can't lower your sickened value while afflicted. Stage 1: sickened 1 (1 day); stage 2: sickened 2 (1 day); stage 3: sickened 2, and the disease recurs every 1d4 months even once cured (1 day); stage 4: unconscious (1 day); stage 5: death."
afflictions.bubonic-plague.name: 'Bubonic plague'
afflictions.bubonic-plague.description: "Disease, level 3. Fortitude DC 17; onset 1 day. You can't remove fatigued while afflicted. Stage 1: fatigued (1 day); stage 2: enfeebled 2 and fatigued (1 day); stage 3: enfeebled 3, fatigued, and 1d6 persistent bleed damage every 1d20 minutes (1 day)."
afflictions.scarlet-leprosy.name: 'Scarlet leprosy'
afflictions.scarlet-leprosy.description: "Disease, level 4, virulent. Fortitude DC 19; onset 1 day. Its damage can't be healed until the disease is cured. Stage 1: 2d6 bludgeoning damage (1 day); stage 2: 2d6 bludgeoning damage, and each time you gain wounded its value rises 1 more (1 day); stage 3: 4d6 bludgeoning damage, and you can't heal any damage (1 day)."
afflictions.bonechill.name: 'Bonechill'
afflictions.bonechill.description: "Disease, level 5, primal. Fortitude DC 20; onset 1 day. Stage 1: clumsy 1 (1 day); stage 2: clumsy 2, and you can't heal cold damage until cured (1 day); stage 3: clumsy 3, and cold is one step more severe for you (1 day); stage 4: paralyzed, and cold is one step more severe for you (1 day)."
afflictions.choking-death.name: 'Choking death'
afflictions.choking-death.description: 'Disease, level 6. Fortitude DC 22; onset 1 day. Stage 1: a hoarse voice, no other effect (1 day); stage 2: drained 1 (1 day); stage 3: drained 2 and unable to speak (1 day); stage 4: death.'
afflictions.blinding-sickness.name: 'Blinding sickness'
afflictions.blinding-sickness.description: 'Disease, level 7. Fortitude DC 23. Stage 1: a carrier, no effect (1 day); stage 2: enfeebled 1 (1 day); stage 3: enfeebled 2 (1 day); stage 4: enfeebled 2 and permanently blinded (1 day); stage 5: enfeebled 4 (1 day); stage 6: unconscious (1 day); stage 7: death.'
afflictions.sewer-haze.name: 'Sewer haze'
afflictions.sewer-haze.description: 'Disease, level 7, virulent. Fortitude DC 23; onset 3 days. Stage 1: stupefied 2 (1 day); stage 2: drained 2 and stupefied 2 (1 day); stage 3: drained 3 and stupefied 3 (1 day).'
afflictions.nightmare-fever.name: 'Nightmare fever'
afflictions.nightmare-fever.description: "Disease, level 8, occult. Will DC 25. Its damage and fatigue can't be healed until the disease is removed. Stage 1: 2d6 slashing damage and fatigued (1 day); stage 2: 4d6 slashing damage and fatigued (1 day); stage 3: 4d6 slashing damage, fatigued, and each time you take slashing damage a Will save against the disease's DC or frightened 2 (1 day); stage 4: 6d6 slashing damage, fatigued, and each time you take slashing damage a Will save or paralyzed for 1 round (1 day); stage 5: 6d6 slashing damage and unconscious. Some versions deal bludgeoning or piercing damage instead."
afflictions.brain-worms.name: 'Brain worms'
afflictions.brain-worms.description: "Disease, level 11, virulent. Fortitude DC 28; onset 1 day. While afflicted, an attack you make because you're confused is a bite. Stage 1: stupefied 2 (1 day); stage 2: stupefied 2, and each time you take damage a Will save against the disease's DC or confused for 1 round (1 day); stage 3: stupefied 3, and the same save or confused for 1 minute (1 day); stage 4: stupefied 4 and confused, which damage doesn't end (1 day); stage 5: unconscious (1 day); stage 6: death."
afflictions.crimson-ooze.name: 'Crimson ooze'
afflictions.crimson-ooze.description: "Disease, level 15, virulent. Fortitude DC 34. Amputating the infected hand before stage 4 cures it. Stage 1: clumsy 1 (1 day); stage 2: clumsy 2, and using the infected hand deals you 3d6 persistent bleed damage (1 day); stage 3: clumsy 2, stupefied 2, and the hand is unusable (1 day); stage 4: clumsy 3, stupefied 3, and the hand is permanently unusable (1 day); stage 5: confused, which damage doesn't end (1 day); stage 6: death."
afflictions.curse-of-nightmares.name: 'Curse of nightmares'
afflictions.curse-of-nightmares.description: 'Curse, level 2 (magical, mental). Will DC 16. You must rest 12 hours instead of 8 to avoid being fatigued, and you gain no benefit from rest or long-term rest; you can still make your daily preparations.'
afflictions.theft-of-thought.name: 'Theft of thought'
afflictions.theft-of-thought.description: "Curse, level 3 (magical, mental). Will DC 18; it guards one book against whoever Steals it. The first time you then use a skill you're trained in or better, your proficiency rank in it drops by one for as long as you're cursed."
afflictions.slayers-haunt.name: "Slayer's haunt"
afflictions.slayers-haunt.description: "Curse, level 4 (illusion, magical, visual). Will DC 19. Everyone around you looks like someone you killed. To identify one, Recall Knowledge about it or otherwise deal with its true form, you must first succeed at a Will save against the curse's DC; on a critical failure you're frightened 1."
afflictions.cowards-roots.name: "Coward's roots"
afflictions.cowards-roots.description: "Curse, level 5 (emotion, fear, magical, mental). Will DC 20. At the start of your turn, if you're frightened, you're immobilized or fleeing (your choice) until the end of that turn."
afflictions.curse-of-the-ravenous.name: 'Curse of the ravenous'
afflictions.curse-of-the-ravenous.description: 'Curse, level 5 (magical). Fortitude DC 20. No food satisfies you; after 1 day you begin starving. You get a new save each week.'
afflictions.wizards-ward.name: "Wizard's ward"
afflictions.wizards-ward.description: "Curse, level 6 (magical). Will DC 22; it guards one book, usually a spellbook, against whoever damages it. You take 5d6 damage of the type you dealt the book, which can't be healed while the curse lasts. Repairing the book, missing text included, ends it."
afflictions.oath-of-the-flesh.name: 'Oath of the flesh'
afflictions.oath-of-the-flesh.description: "Curse, level 7 (magical). Fortitude DC 23. Every promise you make is carved into your skin as a symbol; breaking one opens it into a wound that deals you 3d6 slashing damage, which can't be healed while the curse lasts."
afflictions.sellswords-folly.name: "Sellsword's folly"
afflictions.sellswords-folly.description: "Curse, level 9 (emotion, magical, mental). Will DC 26. Each time you roll initiative, you attempt a new save against the curse; on a failure you're confused for 1 round (an incapacitation effect)."
afflictions.curse-of-slumber.name: 'Curse of slumber'
afflictions.curse-of-slumber.description: "Curse, level 11 (incapacitation, magical, sleep). Fortitude DC 28. You fall asleep for 1 round (for good on a critical failure) and seem dead: a DC 30 Medicine check tells you're alive. Noise doesn't wake you; taking damage gives you a new save."
afflictions.reviling-earth.name: 'Reviling earth'
afflictions.reviling-earth.description: 'Curse, level 12 (death, magical). Fortitude DC 30; it lies over a region. Entering it, you become doomed 1 (doomed 2 on a critical failure).'
afflictions.spirit-anchor.name: 'Spirit anchor'
afflictions.spirit-anchor.description: 'Curse, level 13 (magical). Fortitude DC 31. If you die while cursed, your spirit is bound where you died and you rise as a ghost or other incorporeal undead.'
afflictions.unending-thirst.name: 'Unending thirst'
afflictions.unending-thirst.description: 'Curse, level 15 (magical). Fortitude DC 32. Drinking does you no good and you suffer from thirst. You get a new save each day.'
afflictions.reviled-of-nature.name: 'Reviled of nature'
afflictions.reviled-of-nature.description: 'Curse, level 18 (emotion, magical, mental). Will DC 38. Each animal that becomes aware of you attempts a Will save against the curse; on a failure it attacks you and fights to the death.'
afflictions.thiefs-retribution.name: "Thief's retribution"
afflictions.thiefs-retribution.description: "Curse, level 19 (magical). Fortitude DC 39. Each time you steal something, you lose something worth more, never to be found. With nothing of greater value on you, you lose a limb instead: 10d6 slashing damage and the limb's use, neither restored until the stolen thing is returned."
afflictions.sword-of-anathema.name: 'Sword of anathema'
afflictions.sword-of-anathema.description: 'Curse, level 20 (divine). Will DC 40. A deity marks you as an enemy of its faith: you have weakness 10 to damage dealt by its worshippers.'
afflictions.grave-curse.name: 'Grave curse'
afflictions.grave-curse.description: "Curse (magical); Will save at a high spell DC for its level. For robbing a tomb or other resting place, you're hounded by undead of the curse's level: each night a DC 15 flat check, or an incorporeal undead harries you and spoils your rest; entering a burial ground, the same flat check or a corpse rises to attack you. Returning what you took ends it."

# GM Core's item curses: one template per curse, whatever it curses.
item-curses.degenerating.name: 'Degenerating'
item-curses.degenerating.description: 'Item curse, level 5 (a weapon). Whenever you critically fail an attack roll with it, the weapon takes 1d10 acid damage, ignoring its Hardness and resistances.'
item-curses.bloodbiter.name: 'Bloodbiter'
item-curses.bloodbiter.description: 'Item curse, level 6 (a piercing or slashing weapon). A hit with it deals 1d6 persistent bleed damage to the target and 1d6 persistent bleed damage to you. Once it first hits, it fuses to your hand, which can do nothing else.'
item-curses.grandstanding.name: 'Grandstanding'
item-curses.grandstanding.description: 'Item curse, level 11 (a weapon). Whenever you bring a foe to 0 Hit Points, you lose your remaining actions that turn, showing off.'
tags.item-curse.name: Item curse
item-curses.ravenous.name: 'Ravenous'
item-curses.ravenous.description: 'Item curse, level 1 (a ring, staff or wand). Each time you activate the item you start starving at once, needing ten times the usual food for the next day.'
item-curses.arsonous.name: 'Arsonous'
item-curses.arsonous.description: "Item curse, level 7 (a ring, staff or wand). Each time you activate the item, a random ally within 30 feet takes 1d10 persistent fire damage (you, if there's none)."
item-curses.staining.name: 'Staining'
item-curses.staining.description: 'Item curse, level 1 (gear or a weapon). It has a color: whenever you use the item while manipulating another object, that object is stained that color for good (it can be changed by ordinary means).'
item-curses.raucous.name: 'Raucous'
item-curses.raucous.description: "Item curse, level 3 (gear or a weapon). Whenever you use the item you must yell what you're doing; if you don't, or not loudly enough, the action is a critical failure."
