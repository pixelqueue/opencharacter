# Wizard feats to 20th level, and the caster feats several classes share. Short rules text written
# for the pack.

feats.wizard.bond-conservation.name: 'Bond Conservation'
feats.wizard.bond-conservation.description: 'One action, spellshape. Requirement: your last action cast a spell with Drain Bonded Item. You gain another use of Drain Bonded Item, for a spell 2 or more ranks lower, before the end of your next turn.'
feats.wizard.bond-conservation.prerequisites.bond: 'Arcane bond'
feats.wizard.form-retention.name: 'Form Retention'
feats.wizard.form-retention.description: "You can prepare a 1-minute battle-form polymorph spell in a slot 2 ranks higher than its rank: it isn't heightened, but lasts up to 10 minutes."
feats.wizard.knowledge-is-power-wizard.name: 'Knowledge is Power (Wizard)'
feats.wizard.knowledge-is-power-wizard.description: 'When you critically succeed at Recall Knowledge about a creature, it takes a -1 circumstance penalty to AC or saves against your next attack or spell against it, and to its next attack or DC against you; allies you tell benefit too. Unused, it fades after 1 minute.'
feats.spellcasting.overwhelming-energy.name: 'Overwhelming Energy'
feats.spellcasting.overwhelming-energy.description: 'One action, spellshape. If your next action is to Cast a Spell, it ignores energy resistance up to your level (all its damage, persistent and ongoing too), but not immunity.'
feats.spellcasting.quickened-casting.name: 'Quickened Casting'
feats.spellcasting.quickened-casting.description: 'Free action, once a day, spellshape. If your next action casts a cantrip or a spell at least 2 ranks below your highest slot (of this class), it takes one action fewer (minimum 1).'
feats.wizard.scroll-adept.name: 'Scroll Adept'
feats.wizard.scroll-adept.description: 'During daily preparations you make two temporary scrolls of spellbook spells of different ranks, at least 2 below your highest (three with master spell DC proficiency, four legendary); they go inert at your next preparations.'
feats.wizard.clever-counterspell.name: 'Clever Counterspell'
feats.wizard.clever-counterspell.description: "You can Counterspell a spell that's in your spellbook, expending any prepared spell sharing a trait with it other than concentrate, manipulate or its tradition (or one that logically counters it, at the GM's discretion)."
feats.wizard.clever-counterspell.prerequisites.counterspell: 'Counterspell'
feats.wizard.clever-counterspell.prerequisites.quick-recognition: 'Quick Recognition'
feats.wizard.forcible-energy.name: 'Forcible Energy'
feats.wizard.forcible-energy.description: 'One action, spellshape. If your next action casts a spell dealing acid, cold, electricity, fire or sonic damage, one damaged target gains weakness 5 to that type until the end of your next turn (not if it resists or is immune).'
feats.wizard.keen-magical-detection.name: 'Keen Magical Detection'
feats.wizard.keen-magical-detection.description: 'When you Detect Magic and an opponent in range has a magical effect or item, you roll initiative twice and take the better.'
feats.spellcasting.magic-sense.name: 'Magic Sense'
feats.spellcasting.magic-sense.description: 'You constantly sense magic auras in your field of vision as a 1st-rank detect magic, and Seeking gives a 3rd-rank one on what you see. You can switch it off or on as a free action at the start or end of your turn.'
feats.wizard.bonded-focus.name: 'Bonded Focus'
feats.wizard.bonded-focus.description: 'When you Refocus with your bonded item in your possession, you refill your focus pool.'
feats.wizard.bonded-focus.prerequisites.bond: 'Arcane bond'
feats.spellcasting.reflect-spell.name: 'Reflect Spell'
feats.spellcasting.reflect-spell.description: 'When your Counterspell succeeds against a spell targeting creatures or an area, you can turn it back on its caster alone, who defends as normal.'
feats.spellcasting.reflect-spell.prerequisites.counterspell: 'Counterspell'
feats.wizard.secondary-detonation-array.name: 'Secondary Detonation Array'
feats.wizard.secondary-detonation-array.description: "One action, spellshape. If your next action casts an area spell that deals damage and has no duration, a circle in a 5-foot burst within the area detonates at the start of your next turn: 1d6 force damage per spell rank (or the spell's damage type), basic Reflex save against your spell DC."
feats.wizard.superior-bond.name: 'Superior Bond'
feats.wizard.superior-bond.description: 'You can Drain Bonded Item once more a day, for a spell 2 or more ranks below your highest slot.'
feats.wizard.superior-bond.prerequisites.bond: 'Arcane bond'
feats.spellcasting.effortless-concentration.name: 'Effortless Concentration'
feats.spellcasting.effortless-concentration.description: 'Free action. Trigger: your turn begins. You gain the effects of Sustain for one of your active spells (of this class).'
feats.spellcasting.scintillating-spell.name: 'Scintillating Spell'
feats.spellcasting.scintillating-spell.description: 'One action, spellshape. If your next action casts a spell without the darkness trait or a duration that calls for Reflex saves, creatures that fail are dazzled for 1 round, and those that critically fail blinded for 1 round.'
feats.wizard.spell-tinker.name: 'Spell Tinker'
feats.wizard.spell-tinker.description: "Two actions. After casting a spell on only yourself that offers choices (resist energy's type, a polymorph's form), you change the choice, unless its benefit is spent or would linger."
feats.wizard.infinite-possibilities.name: 'Infinite Possibilities'
feats.wizard.infinite-possibilities.description: 'Once during daily preparations, a slot holds infinite potential: it casts any spellbook spell at least 2 ranks lower, as a spell 2 ranks lower than the slot.'
feats.wizard.reprepare-spell.name: 'Reprepare Spell'
feats.wizard.reprepare-spell.description: 'In 10 minutes you prepare again a spell of 4th rank or lower without a duration that you already cast today. With spell substitution you can prepare a different durationless spell in that expended slot instead.'
feats.wizard.second-thoughts.name: 'Second Thoughts'
feats.wizard.second-thoughts.description: 'Reaction (concentrate, mental). Trigger: a creature critically succeeds at its Will save against your single-target mental spell. You can cast it again on another creature without a slot, until the end of your next turn.'
feats.wizard.archwizards-might.name: "Archwizard's Might"
feats.wizard.archwizards-might.description: 'You gain one more 10th-rank spell slot.'
feats.wizard.archwizards-might.prerequisites.spellcraft: "Archwizard's spellcraft"
feats.wizard.spell-combination.name: 'Spell Combination'
feats.wizard.spell-combination.description: 'One slot of each rank from 3rd up becomes a combination slot: you can prepare two spells in it, each 2 or more ranks lower, both able to target a single creature and resolved the same way (spell attack, the same save or automatic). Cast, they affect one target with both effects, at the shorter range.'
feats.wizard.spell-mastery.name: 'Spell Mastery'
feats.wizard.spell-mastery.description: 'Four spellbook spells of 9th rank or lower, each of a different rank, are prepared automatically each day in extra slots of their own. A week of downtime changes them.'
feats.spellcasting.spellshape-mastery.name: 'Spellshape Mastery'
feats.spellcasting.spellshape-mastery.description: 'You can use single-action spellshape actions as free actions.'
