features.spellcasting.archetype-repertoire.name: Archetype spell repertoire
features.spellcasting.archetype-repertoire.description: >-
  The spells you know through a spellcasting archetype: its cantrips, and one spell for each of
  its spell slots, of its tradition.
features.spellcasting.archetype-repertoire.choices.cantrips.prompt: Archetype repertoire cantrips
features.spellcasting.archetype-repertoire.choices.spells.prompt: 'Archetype repertoire spell (rank {slot})'
features.spellcasting.archetype-signature-spells.name: Archetype signature spells
features.spellcasting.archetype-signature-spells.description: >-
  Spells of your archetype repertoire you can cast heightened from any archetype slot at or above
  their rank: one from 6th level with the basic spellcasting benefits, a second with the expert
  benefits, a third with the master.
features.spellcasting.archetype-signature-spells.choices.signature.prompt: Archetype signature spells
features.spellcasting.archetype-book.name: Archetype spellbook
features.spellcasting.archetype-book.description: >-
  The spells your archetype prepares from: a wizard archetype's spellbook or a witch archetype's
  familiar. It starts with the archetype's cantrips, and each new rank of archetype slot adds two
  common spells of that rank.
features.spellcasting.archetype-book.choices.cantrips.prompt: Cantrips in your archetype's book
features.spellcasting.archetype-book.choices.spells.prompt: "Spells added to your archetype's book (rank {slot})"

actions.cast-spell.params.source.name: Repertoire
actions.cast-spell.params.source.description: >-
  Which repertoire casts a spell several know: class for your class's, or an archetype (bard,
  oracle, sorcerer, eldritchArcher).
actions.prepare-archetype-spells.name: Prepare archetype spells
actions.prepare-archetype-spells.description: >-
  Prepare a spellcasting archetype's cantrips and spells for the day, one in each of its slots,
  from its tradition or its book.
actions.prepare-archetype-spells.params.source.name: Archetype
actions.prepare-archetype-spells.params.source.description: >-
  The archetype that prepares (cleric, druid, witch or wizard); the first you have if you leave it
  out.
actions.prepare-archetype-spells.results.prepared.name: Prepared
actions.prepare-archetype-spells.results.not-prepared.name: Not a prepared archetype
