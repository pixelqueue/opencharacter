consumables.absolute-solvent-lesser.name: 'Absolute Solvent (Lesser)'
consumables.absolute-solvent-lesser.description: 'Activate (1 action): dissolves everlasting adhesive at once and tries to counteract other adhesives (rank 3, +9).'
consumables.absolute-solvent-moderate.name: 'Absolute Solvent (Moderate)'
consumables.absolute-solvent-moderate.description: 'Activate (1 action): dissolves everlasting adhesive at once and tries to counteract other adhesives (rank 6, +19).'
consumables.absolute-solvent-greater.name: 'Absolute Solvent (Greater)'
consumables.absolute-solvent-greater.description: 'Activate (1 action): dissolves everlasting adhesive at once and tries to counteract other adhesives (rank 9, +28).'
consumables.alarm-snare.name: 'Alarm Snare'
consumables.alarm-snare.description: 'When a Small or larger creature enters its square, it makes a noise heard within 100 to 500 feet (set when made).'
consumables.alloy-orb-low-grade.name: 'Alloy Orb (Low-Grade)'
consumables.alloy-orb-low-grade.description: 'Activate (1 action): the affixed metal weapon counts as cold iron or silver for 1 minute; it works on weapons of 8th level or lower.'
consumables.alloy-orb-standard-grade.name: 'Alloy Orb (Standard-Grade)'
consumables.alloy-orb-standard-grade.description: 'Activate (1 action): the affixed metal weapon counts as cold iron or silver for 1 minute; it works on weapons of 15th level or lower.'
consumables.exquisite-alloy-orb-standard-grade.name: 'Exquisite Alloy Orb (Standard-Grade)'
consumables.exquisite-alloy-orb-standard-grade.description: 'Activate (1 action): the affixed metal weapon counts as adamantine, cold iron or dawnsilver for 1 minute; it works on weapons of 15th level or lower.'
consumables.alloy-orb-high-grade.name: 'Alloy Orb (High-Grade)'
consumables.alloy-orb-high-grade.description: 'Activate (1 action): the affixed metal weapon counts as cold iron or silver for 1 minute; it works on weapons of any level.'
consumables.exquisite-alloy-orb-high-grade.name: 'Exquisite Alloy Orb (High-Grade)'
consumables.exquisite-alloy-orb-high-grade.description: 'Activate (1 action): the affixed metal weapon counts as adamantine, cold iron or dawnsilver for 1 minute; it works on weapons of any level.'
consumables.antimagic-oil.name: 'Antimagic Oil'
consumables.antimagic-oil.description: "Activate (1 action): applied to armor, its wearer is immune to spells, magic items' effects and magical effects for 1 minute (not the armor's own magic or attackers' fundamental runes; sources of 20th level or higher still work)."
consumables.antler-arrow.name: 'Antler Arrow'
consumables.antler-arrow.description: 'Activate (1 action): on a hit, glowing antlers pin the target: DC 16 Reflex or stuck to a surface, as the bow critical specialization (DC 15 to pull free on a critical hit with that specialization).'
consumables.balisse-feather.name: 'Balisse Feather'
consumables.balisse-feather.description: 'Activate (free action) when you damage an unholy creature, or one you saw harm an ally or innocent within a minute: it must succeed at a DC 29 Will save or take a –2 status penalty to AC and saves and lose 5 of its resistances until the end of your next turn.'
consumables.balisse-feather-greater.name: 'Balisse Feather (Greater)'
consumables.balisse-feather-greater.description: 'Activate (free action) when you damage an unholy creature, or one you saw harm an ally or innocent within a minute: it must succeed at a DC 35 Will save or take a –2 status penalty to AC and saves and lose 10 of its resistances until the end of your next turn.'
consumables.basilisk-eye.name: 'Basilisk Eye'
consumables.basilisk-eye.description: 'Activate (free action) when you Shield Block a melee attack with the shield: the attacker must succeed at a DC 25 Fortitude save or be slowed 1 for 1 minute.'
consumables.beacon-shot.name: 'Beacon Shot'
consumables.beacon-shot.description: "Activate (1 action): it sticks in the target and sparks for 1 minute: invisible, it is only hidden, and it isn't concealed. Pulling it out takes an Interact and a DC 20 Athletics check."
consumables.biting-snare.name: 'Biting Snare'
consumables.biting-snare.description: 'Closes on the first creature to enter its square: 5d6 piercing damage (DC 21 Reflex); on a critical failure, double damage and a –10-foot status penalty to Speed until it recovers a Hit Point.'
consumables.bleeding-spines-snare.name: 'Bleeding Spines Snare'
consumables.bleeding-spines-snare.description: 'Spines stab a creature entering: 8d8 piercing and 2d8 persistent bleed damage (DC 31 basic Reflex), and again to anyone entering or ending a turn there for 1 minute.'
consumables.bloodseeker-beak.name: 'Bloodseeker Beak'
consumables.bloodseeker-beak.description: 'Activate (free action) when you hit an off-guard creature: 1d4 extra precision damage, and 1d4 persistent bleed damage if you dealt sneak attack damage.'
consumables.bloodseeker-beak-greater.name: 'Bloodseeker Beak (Greater)'
consumables.bloodseeker-beak-greater.description: 'Activate (free action) when you hit an off-guard creature: 2d4 extra precision damage, and 2d4 persistent bleed damage if you dealt sneak attack damage.'
consumables.bomb-snare.name: 'Bomb Snare'
consumables.bomb-snare.description: "Three moderate alchemical bombs of one kind explode on the creature that triggers it and those adjacent (DC 24 Reflex): three times one bomb's direct damage, halved on a success; on a failure, also the bomb's other effects; double on a critical failure."
consumables.bombers-eye-elixir-lesser.name: "Bomber's Eye Elixir (Lesser)"
consumables.bombers-eye-elixir-lesser.description: "For 5 minutes, your alchemical bomb Strikes reduce the target's circumstance bonus to AC from cover by 1."
consumables.bombers-eye-elixir-greater.name: "Bomber's Eye Elixir (Greater)"
consumables.bombers-eye-elixir-greater.description: "For 5 minutes, your alchemical bomb Strikes reduce the target's circumstance bonus to AC from cover by 2."
consumables.bottled-catharsis-minor.name: 'Bottled Catharsis (Minor)'
consumables.bottled-catharsis-minor.description: 'It tries to counteract each emotion effect on you and each effect making you stupefied (rank 1, +6).'
consumables.bottled-catharsis-lesser.name: 'Bottled Catharsis (Lesser)'
consumables.bottled-catharsis-lesser.description: 'It tries to counteract each emotion effect on you and each effect making you stupefied (rank 2, +8).'
consumables.bottled-catharsis-moderate.name: 'Bottled Catharsis (Moderate)'
consumables.bottled-catharsis-moderate.description: 'It tries to counteract each emotion effect on you and each effect making you stupefied (rank 4, +14).'
consumables.bottled-catharsis-greater.name: 'Bottled Catharsis (Greater)'
consumables.bottled-catharsis-greater.description: 'It tries to counteract each emotion effect on you and each effect making you stupefied (rank 6, +19).'
consumables.bottled-catharsis-major.name: 'Bottled Catharsis (Major)'
consumables.bottled-catharsis-major.description: 'It tries to counteract each emotion effect on you and each effect making you stupefied (rank 9, +28).'
consumables.bravos-brew-lesser.name: "Bravo's Brew (Lesser)"
consumables.bravos-brew-lesser.description: 'For 1 hour, a +1 item bonus to Will saves, +2 against fear.'
consumables.bravos-brew-moderate.name: "Bravo's Brew (Moderate)"
consumables.bravos-brew-moderate.description: 'For 1 hour, a +2 item bonus to Will saves, +3 against fear.'
consumables.bravos-brew-greater.name: "Bravo's Brew (Greater)"
consumables.bravos-brew-greater.description: 'For 1 hour, a +3 item bonus to Will saves, +4 against fear. A success against fear is a critical success.'
consumables.bronze-bull-pendant.name: 'Bronze Bull Pendant'
consumables.bronze-bull-pendant.description: 'Activate (1 action): Shove with a +1 item bonus; the target moves 10 feet on a success, 20 on a critical success.'
consumables.caltrop-snare.name: 'Caltrop Snare'
consumables.caltrop-snare.description: 'Flings caltrops into its square or an adjacent one (set when made); a creature there attempts the Acrobatics check at once.'
consumables.candle-of-revealing.name: 'Candle of Revealing'
consumables.candle-of-revealing.description: 'Activate (1 action): lit for 1 minute, invisible creatures within 10 feet are only concealed.'
consumables.candle-of-truth.name: 'Candle of Truth'
consumables.candle-of-truth.description: 'Activate (1 action): lit for 10 minutes; creatures within 10 feet take a –4 status penalty to Lie, and each must succeed at a DC 26 Will save on entering or be unable to lie there.'
consumables.cats-eye-elixir.name: "Cat's Eye Elixir"
consumables.cats-eye-elixir.description: 'For 1 minute, against creatures within 30 feet: no flat check to target concealed ones, and DC 5 to target hidden ones.'
consumables.climbing-bolt.name: 'Climbing Bolt'
consumables.climbing-bolt.description: 'When it hits a solid surface, it becomes a 50-foot rope fastened there (Interact and DC 20 Athletics to pull free).'
consumables.comprehension-elixir-lesser.name: 'Comprehension Elixir (Lesser)'
consumables.comprehension-elixir-lesser.description: 'For 1 minute, you understand words you read in a common language (codes still need Decipher Writing).'
consumables.comprehension-elixir-greater.name: 'Comprehension Elixir (Greater)'
consumables.comprehension-elixir-greater.description: 'For 10 minutes, you understand words you read in a common language (codes still need Decipher Writing).'
consumables.cooling-elixir-lesser.name: 'Cooling Elixir (Lesser)'
consumables.cooling-elixir-lesser.description: 'For 24 hours, protection from severe heat.'
consumables.cooling-elixir-moderate.name: 'Cooling Elixir (Moderate)'
consumables.cooling-elixir-moderate.description: 'For 24 hours, protection from severe heat and extreme heat.'
consumables.cooling-elixir-greater.name: 'Cooling Elixir (Greater)'
consumables.cooling-elixir-greater.description: 'For 24 hours, protection from severe heat, extreme and incredible heat.'
consumables.corrosive-ammunition.name: 'Corrosive Ammunition'
consumables.corrosive-ammunition.description: "Activate (1 action): on a hit, the target's armor takes 1d8 persistent acid damage ignoring Hardness at the end of its turns (or the target does, unarmored), until wiped off or the armor breaks."
consumables.crying-angel-pendant.name: 'Crying Angel Pendant'
consumables.crying-angel-pendant.description: 'Activate (2 actions): Administer First Aid with a +1 item bonus; a success stabilizes with 1 Hit Point and consciousness, or stops the bleeding.'
consumables.dazing-coil.name: 'Dazing Coil'
consumables.dazing-coil.description: 'Activate (free action) when you damage an off-guard creature: it must succeed at a DC 31 Will save or be stunned 1 (stunned 2 on a critical failure).'
consumables.deadweight-snare.name: 'Deadweight Snare'
consumables.deadweight-snare.description: 'Magnetic weights drag at the triggering creature (DC 18 Reflex): a –1 status penalty to attack rolls for 1 round on a success, –2 for 1 minute on a failure (until it Escapes, DC 18), and it drops held metal items on a critical failure.'
consumables.disintegration-bolt.name: 'Disintegration Bolt'
consumables.disintegration-bolt.description: 'Activate (1 action): the target it hits is subjected to disintegrate (DC 34 Fortitude); a critical hit makes the save one degree worse.'
consumables.dispelling-sliver.name: 'Dispelling Sliver'
consumables.dispelling-sliver.description: 'Activate (free action) when your Strike damages a target: try to counteract one spell on it (+29, as 8th-rank dispel magic); with Dispelling Slice, every spell on it.'
consumables.dragon-turtle-scale.name: 'Dragon Turtle Scale'
consumables.dragon-turtle-scale.description: 'Activate (1 action; trained in Athletics): a swim Speed equal to half your land Speed for 1 minute.'
consumables.dragon-turtle-scale-greater.name: 'Dragon Turtle Scale (Greater)'
consumables.dragon-turtle-scale-greater.description: 'Activate (1 action; trained in Athletics): a swim Speed equal to your land Speed for 1 minute.'
consumables.dust-of-corpse-animation.name: 'Dust of Corpse Animation'
consumables.dust-of-corpse-animation.description: 'Activate (2 actions): pour it on a corpse to raise a skeleton or zombie of level 3 or lower as your minion (two actions when you Command it).'
consumables.dust-of-corpse-animation-greater.name: 'Dust of Corpse Animation (Greater)'
consumables.dust-of-corpse-animation-greater.description: 'Activate (2 actions): pour it on a corpse to raise a skeleton or zombie of level 11 or lower as your minion (two actions when you Command it).'
consumables.effervescent-ampoule.name: 'Effervescent Ampoule'
consumables.effervescent-ampoule.description: 'Activate (1 action; trained in Acrobatics): until the end of your turn, you move over water and other liquids as if solid, without triggering pressure plates.'
consumables.elixir-of-gender-transformation-lesser.name: 'Elixir of Gender Transformation (Lesser)'
consumables.elixir-of-gender-transformation-lesser.description: 'Changes secondary sex characteristics as formulated: taken weekly, over a year or more.'
consumables.elixir-of-gender-transformation-moderate.name: 'Elixir of Gender Transformation (Moderate)'
consumables.elixir-of-gender-transformation-moderate.description: 'Changes secondary sex characteristics as formulated: taken monthly, over a year.'
consumables.elixir-of-gender-transformation-greater.name: 'Elixir of Gender Transformation (Greater)'
consumables.elixir-of-gender-transformation-greater.description: 'Changes secondary sex characteristics as formulated: taken once, over 6 months.'
consumables.elixir-of-rejuvenation.name: 'Elixir of Rejuvenation'
consumables.elixir-of-rejuvenation.description: 'You are restored to your maximum Hit Points and every affliction of 20th level or lower ends; given to a creature dead a week or less, it returns to life with 1 Hit Point and no daily resources.'
consumables.emerald-grasshopper.name: 'Emerald Grasshopper'
consumables.emerald-grasshopper.description: 'Activate (1 action; trained in Athletics): Leap up to 40 feet across and 10 up, then drift down harmlessly at 60 feet per round.'
consumables.emerald-grasshopper-greater.name: 'Emerald Grasshopper (Greater)'
consumables.emerald-grasshopper-greater.description: 'Activate (1 action; trained in Athletics): Leap up to 100 feet across and 30 up, then drift down harmlessly at 60 feet per round. Your other Leaps this turn work the same way.'
consumables.energy-breath-potion-lesser.name: 'Energy Breath Potion (Lesser)'
consumables.energy-breath-potion-lesser.description: "For 1 hour, Energy Breath (1 action; then not for 1d4 rounds): 4d6 damage of the potion's energy (DC 23 basic save) in a 30-foot line (acid, electricity; Reflex) or a 15-foot cone (cold, fire: Reflex; sonic: Fortitude)."
consumables.energy-breath-potion-moderate.name: 'Energy Breath Potion (Moderate)'
consumables.energy-breath-potion-moderate.description: "For 1 hour, Energy Breath (1 action; then not for 1d4 rounds): 6d6 damage of the potion's energy (DC 29 basic save) in a 30-foot line (acid, electricity; Reflex) or a 15-foot cone (cold, fire: Reflex; sonic: Fortitude)."
consumables.energy-breath-potion-greater.name: 'Energy Breath Potion (Greater)'
consumables.energy-breath-potion-greater.description: "For 1 hour, Energy Breath (1 action; then not for 1d4 rounds): 10d6 damage of the potion's energy (DC 37 basic save) in a 30-foot line (acid, electricity; Reflex) or a 15-foot cone (cold, fire: Reflex; sonic: Fortitude)."
consumables.engulfing-snare.name: 'Engulfing Snare'
consumables.engulfing-snare.description: 'A cage springs up on the first creature to enter: 10d8 piercing damage (DC 34 Reflex): half and off-guard on a success; on a failure, full damage, prone and caged (immobilized; Escape DC 34 or break the cage); double on a critical failure.'
consumables.everlasting-adhesive.name: 'Everlasting Adhesive'
consumables.everlasting-adhesive.description: 'Activate (1 minute): bonds two surfaces of up to a square foot almost inseparably (DC 50 Athletics to part them).'
consumables.explosive-ammunition.name: 'Explosive Ammunition'
consumables.explosive-ammunition.description: 'Activate (1 action): on a hit, it explodes in a 10-foot burst: 6d6 fire damage to each creature there, target included (DC 25 basic Reflex).'
consumables.explosive-ammunition-greater.name: 'Explosive Ammunition (Greater)'
consumables.explosive-ammunition-greater.description: 'Activate (1 action): on a hit, it explodes in a 10-foot burst: 10d6 fire damage to each creature there, target included (DC 30 basic Reflex).'
consumables.eye-of-apprehension.name: 'Eye of Apprehension'
consumables.eye-of-apprehension.description: 'Activate (free action; master in Perception), before rolling Perception for initiative: roll twice and take the higher.'
consumables.fade-band.name: 'Fade Band'
consumables.fade-band.description: 'Activate (free action; trained in Stealth) when an attack misses you: it casts 2nd-rank invisibility on you.'
consumables.fear-gem.name: 'Fear Gem'
consumables.fear-gem.description: 'Activate (2 actions): a melee Strike; a damaging hit makes the target frightened 1 (2 on a critical hit), one more with Intimidating Strike.'
consumables.feather-step-stone.name: 'Feather Step Stone'
consumables.feather-step-stone.description: 'Activate (free action; trained in Acrobatics) when you Stride or Step: ignore difficult and greater difficult terrain until the end of your turn.'
consumables.flame-navette.name: 'Flame Navette'
consumables.flame-navette.description: "Activate (1 action, one a day): gain the fighter's Determination (counteract rank 8, +22, or yours if better)."
consumables.flare-snare.name: 'Flare Snare'
consumables.flare-snare.description: 'When a Small or larger creature enters, a flare shoots into the sky, visible for miles.'
consumables.flying-blade-wheel-snare.name: 'Flying Blade Wheel Snare'
consumables.flying-blade-wheel-snare.description: 'A wheel of blades launches at the creature entering: a Strike at +35 for 8d8 slashing damage; once a turn, an Interact within 120 feet flies it 60 feet toward the creature to Strike again, for 1 minute.'
consumables.forensic-dye.name: 'Forensic Dye'
consumables.forensic-dye.description: 'Activate it with a sample (blood, mud); for 10 minutes, brushed on an object or a 5-foot square, it shows traces matching the sample.'
consumables.freezing-ammunition.name: 'Freezing Ammunition'
consumables.freezing-ammunition.description: 'Activate (1 action): the target it hits must succeed at a DC 19 Fortitude save or be slowed 1 for 1 round (1 minute on a critical failure).'
consumables.frozen-lava.name: 'Frozen Lava'
consumables.frozen-lava.description: 'Activate (1 action): once thrown (Interact) within 70 feet, it detonates as a fireball: 5d6 fire damage (DC 21 basic Reflex). Unthrown by your next turn, it goes off on you.'
consumables.frozen-lava-level-7.name: 'Frozen Lava (Level 7)'
consumables.frozen-lava-level-7.description: 'Activate (1 action): once thrown (Interact) within 70 feet, it detonates as a fireball: 7d6 fire damage (DC 25 basic Reflex). Unthrown by your next turn, it goes off on you.'
consumables.frozen-lava-level-9.name: 'Frozen Lava (Level 9)'
consumables.frozen-lava-level-9.description: 'Activate (1 action): once thrown (Interact) within 70 feet, it detonates as a fireball: 9d6 fire damage (DC 27 basic Reflex). Unthrown by your next turn, it goes off on you.'
consumables.frozen-lava-level-11.name: 'Frozen Lava (Level 11)'
consumables.frozen-lava-level-11.description: 'Activate (1 action): once thrown (Interact) within 70 feet, it detonates as a fireball: 11d6 fire damage (DC 30 basic Reflex). Unthrown by your next turn, it goes off on you.'
consumables.frozen-lava-level-13.name: 'Frozen Lava (Level 13)'
consumables.frozen-lava-level-13.description: 'Activate (1 action): once thrown (Interact) within 70 feet, it detonates as a fireball: 13d6 fire damage (DC 32 basic Reflex). Unthrown by your next turn, it goes off on you.'
consumables.frozen-lava-level-15.name: 'Frozen Lava (Level 15)'
consumables.frozen-lava-level-15.description: 'Activate (1 action): once thrown (Interact) within 70 feet, it detonates as a fireball: 15d6 fire damage (DC 36 basic Reflex). Unthrown by your next turn, it goes off on you.'
consumables.frozen-lava-level-17.name: 'Frozen Lava (Level 17)'
consumables.frozen-lava-level-17.description: 'Activate (1 action): once thrown (Interact) within 70 feet, it detonates as a fireball: 17d6 fire damage (DC 39 basic Reflex). Unthrown by your next turn, it goes off on you.'
consumables.frozen-lava-level-19.name: 'Frozen Lava (Level 19)'
consumables.frozen-lava-level-19.description: 'Activate (1 action): once thrown (Interact) within 70 feet, it detonates as a fireball: 19d6 fire damage (DC 43 basic Reflex). Unthrown by your next turn, it goes off on you.'
consumables.gallows-tooth.name: 'Gallows Tooth'
consumables.gallows-tooth.description: 'Activate (1 action): a melee Strike against an adjacent creature, which is off-guard against it and until the end of your turn.'
consumables.gecko-potion.name: 'Gecko Potion'
consumables.gecko-potion.description: 'For 5 minutes, a +1 item bonus to Climb, to Palm an Object and to your Reflex DC against Disarm.'
consumables.ghost-ammunition.name: 'Ghost Ammunition'
consumables.ghost-ammunition.description: 'Has the ghost touch rune and passes through obstacles except those that stop incorporeal things, ignoring cover (not concealment). It returns to its quiver 1d4 nights later.'
consumables.ghost-dust.name: 'Ghost Dust'
consumables.ghost-dust.description: 'Activate (1 action; trained in Stealth): it casts 4th-rank invisibility on you; then you may Stride or Step (or use another Speed you have).'
consumables.ghost-ink.name: 'Ghost Ink'
consumables.ghost-ink.description: 'Ink that turns invisible a minute after writing and glows red near heat (or another light, as formulated).'
consumables.glow-rod.name: 'Glow Rod'
consumables.glow-rod.description: 'Activate (1 action): struck, it sheds bright light 20 feet (dim 40 more) for 6 hours.'
consumables.grasping-snare.name: 'Grasping Snare'
consumables.grasping-snare.description: 'Vines hold the first creature to enter (DC 26 Reflex): a –5-foot status penalty to Speed for 1 minute on a success; immobilized for 1 round and then the penalty on a failure; immobilized for 1 minute on a critical failure (each until it Escapes, DC 26).'
consumables.grim-trophy.name: 'Grim Trophy'
consumables.grim-trophy.description: 'Activate (1 action): Demoralize up to two targets with one Intimidation check.'
consumables.grim-trophy-greater.name: 'Grim Trophy (Greater)'
consumables.grim-trophy-greater.description: 'Activate (1 action): Demoralize up to three targets with one Intimidation check.'
consumables.hail-of-arrows-snare.name: 'Hail of Arrows Snare'
consumables.hail-of-arrows-snare.description: 'Arrows blanket a 20-foot radius around it: 18d6 piercing damage (DC 37 basic Reflex).'
consumables.hampering-snare.name: 'Hampering Snare'
consumables.hampering-snare.description: 'Its square and three adjacent ones become difficult terrain for 1d4 rounds when the first creature enters (an Interact clears a square).'
consumables.hobbling-snare.name: 'Hobbling Snare'
consumables.hobbling-snare.description: 'Cinches the triggering creature (DC 20 Reflex): a –5-foot status penalty to Speed for 1 minute on a success, –10 on a failure, –20 on a critical failure, until it Escapes (DC 18).'
consumables.holy-water.name: 'Holy Water'
consumables.holy-water.description: 'Thrown as a Strike (simple thrown weapon, 20 feet): 1d6 spirit damage and 1 spirit splash damage, only to unholy creatures.'
consumables.hunters-bane.name: "Hunter's Bane"
consumables.hunters-bane.description: 'Activate (free action; trained in Survival) when a hidden or undetected enemy hits you: you sense its location (hidden becomes observed, undetected becomes hidden).'
consumables.incense-of-distilled-death.name: 'Incense of Distilled Death'
consumables.incense-of-distilled-death.description: 'Activate (1 action): lit for 1 minute, undead in a 10-foot emanation gain fast healing 4.'
consumables.instant-evisceration-snare.name: 'Instant Evisceration Snare'
consumables.instant-evisceration-snare.description: 'An arsenal of blades strikes the creature entering: 18d8 piercing damage (DC 42 basic Reflex).'
consumables.invisibility-potion.name: 'Invisibility Potion'
consumables.invisibility-potion.description: 'You gain the effects of 2nd-rank invisibility.'
consumables.iron-cube.name: 'Iron Cube'
consumables.iron-cube.description: 'Activate (2 actions): a melee Strike; on a damaging hit, try to Trip the target (no free hand needed with a two-handed weapon), dealing 2d6 bludgeoning damage if it falls prone.'
consumables.iron-cudgel.name: 'Iron Cudgel'
consumables.iron-cudgel.description: 'Activate (1 action): use Brutal Finish, as the fighter feat (with it, one more weapon die on a success or failure).'
consumables.iron-equalizer.name: 'Iron Equalizer'
consumables.iron-equalizer.description: "Activate (1 action): use Certain Strike, as the fighter feat (with it, a failure deals the weapon's normal damage)."
consumables.iron-medallion.name: 'Iron Medallion'
consumables.iron-medallion.description: 'Activate (free action) before a Will save against fear: a +2 status bonus to it and other saves against fear for 1 minute; a failure on it is a success and a critical failure a failure.'
consumables.jade-bauble.name: 'Jade Bauble'
consumables.jade-bauble.description: "Activate (1 action): enemies within the affixed weapon's reach are off-guard until the start of your next turn."
consumables.jade-cat.name: 'Jade Cat'
consumables.jade-cat.description: "Activate (free action; trained in Acrobatics) when you fall or Balance: for 1 minute, falls are 20 feet shorter, Balance doesn't make you off-guard, and narrow surfaces and uneven ground aren't difficult terrain."
consumables.marking-snare.name: 'Marking Snare'
consumables.marking-snare.description: 'Dye or scent marks a creature entering (DC 17 Reflex), giving a +2 circumstance bonus to Track it for 24 hours; blinded until the end of its next turn on a critical failure.'
consumables.marvelous-miniature-campfire.name: 'Marvelous Miniature (Campfire)'
consumables.marvelous-miniature-campfire.description: 'Activate (1 action): it becomes a campfire that burns 8 hours untended.'
consumables.marvelous-miniature-ladder.name: 'Marvelous Miniature (Ladder)'
consumables.marvelous-miniature-ladder.description: 'Activate (1 action): it becomes a 20-foot wooden ladder for good.'
consumables.marvelous-miniature-chest.name: 'Marvelous Miniature (Chest)'
consumables.marvelous-miniature-chest.description: 'Activate (1 action): it becomes a chest holding 10 Bulk; closed, it turns into a key that can turn it back into the chest once more.'
consumables.marvelous-miniature-horse.name: 'Marvelous Miniature (Horse)'
consumables.marvelous-miniature-horse.description: "Activate (1 action): it becomes a riding horse that can't attack, for 8 hours."
consumables.marvelous-miniature-boat.name: 'Marvelous Miniature (Boat)'
consumables.marvelous-miniature-boat.description: 'Activate (1 action), tossed into a large body of water: it becomes a cutter for 1 day.'
consumables.matchstick.name: 'Matchstick'
consumables.matchstick.description: 'Ignite it and light a flammable object in one Interact; it burns for 1 round.'
consumables.mending-lattice.name: 'Mending Lattice'
consumables.mending-lattice.description: 'Activate (free action; trained in Crafting) when the affixed item would take damage: negate it and fully repair the item.'
consumables.mesmerizing-opal.name: 'Mesmerizing Opal'
consumables.mesmerizing-opal.description: 'Activate (1 action): Feint; a success is a critical success and a critical failure a failure.'
consumables.mistform-elixir-lesser.name: 'Mistform Elixir (Lesser)'
consumables.mistform-elixir-lesser.description: 'You are concealed for 3 rounds (not to Hide or Sneak while your position is obvious).'
consumables.mistform-elixir-moderate.name: 'Mistform Elixir (Moderate)'
consumables.mistform-elixir-moderate.description: 'You are concealed for 1 minute (not to Hide or Sneak while your position is obvious).'
consumables.mistform-elixir-greater.name: 'Mistform Elixir (Greater)'
consumables.mistform-elixir-greater.description: 'You are concealed for 5 minutes (not to Hide or Sneak while your position is obvious).'
consumables.monkey-pin.name: 'Monkey Pin'
consumables.monkey-pin.description: 'Activate (1 action): Climb with a +1 item bonus; this turn, a successful Climb moves your full Speed and a critical failure is a failure.'
consumables.mudrock-snare.name: 'Mudrock Snare'
consumables.mudrock-snare.description: 'The first creature to enter sinks in hardening mud (DC 29 Fortitude): a –5-foot circumstance penalty to Speed for 1 minute on a success; stunned 2 and –10 feet on a failure; stunned 3 and immobilized for 1 minute on a critical failure (until it Escapes, DC 27).'
consumables.mummified-bat.name: 'Mummified Bat'
consumables.mummified-bat.description: "Activate (1 action): for 1 minute, no flat check against concealed creatures, a DC 5 flat check against hidden ones, and hidden creatures don't make you off-guard."
consumables.murderers-knot.name: "Murderer's Knot"
consumables.murderers-knot.description: 'Activate (free action) when you damage an off-guard creature with a Strike: 1d6 persistent bleed damage (your sneak attack damage with Twist the Knife), and it is off-guard while it bleeds.'
consumables.nauseating-snare.name: 'Nauseating Snare'
consumables.nauseating-snare.description: 'Foul substances splash the first creature to enter (DC 24 Fortitude): sickened 1 on a success, 2 on a failure, 3 on a critical failure.'
consumables.nectar-of-purification.name: 'Nectar of Purification'
consumables.nectar-of-purification.description: 'Activate (1 action): poured on food or drink, it casts 1st-rank cleanse cuisine on it.'
consumables.oak-potion.name: 'Oak Potion'
consumables.oak-potion.description: 'You gain the effects of 2nd-rank oaken resilience for 10 minutes.'
consumables.obfuscation-oil.name: 'Obfuscation Oil'
consumables.obfuscation-oil.description: 'Activate (1 action): an item of 3 Bulk or less becomes undetectable to detection, revelation and scrying magic of 8th rank or lower, until acid removes the oil.'
consumables.oil-of-animation.name: 'Oil of Animation'
consumables.oil-of-animation.description: 'Activate (1 action): a melee weapon gains the animated rune until a failed flat check makes it fall.'
consumables.oil-of-dynamism.name: 'Oil of Dynamism'
consumables.oil-of-dynamism.description: 'Activate (1 action): spread on an object, it animates as an animated object of level 3 or lower for 1 minute, a minion you Command (once as part of the activation).'
consumables.oil-of-dynamism-greater.name: 'Oil of Dynamism (Greater)'
consumables.oil-of-dynamism-greater.description: 'Activate (1 action): spread on an object, it animates as an animated object of level 11 or lower for 1 minute, a minion you Command (once as part of the activation).'
consumables.oil-of-keen-edges.name: 'Oil of Keen Edges'
consumables.oil-of-keen-edges.description: 'Activate (1 action): a piercing or slashing melee weapon gains the keen rune for 1 minute.'
consumables.oil-of-mending.name: 'Oil of Mending'
consumables.oil-of-mending.description: 'Applied to an item, it casts 2nd-rank mending on it.'
consumables.oil-of-potency.name: 'Oil of Potency'
consumables.oil-of-potency.description: 'Activate (1 action): for 1 minute, a weapon becomes a +1 striking weapon, or armor becomes +1 resilient armor.'
consumables.oil-of-potency-greater.name: 'Oil of Potency (Greater)'
consumables.oil-of-potency-greater.description: 'Activate (1 action): for 1 minute, a weapon becomes a +2 greater striking weapon, or armor becomes +2 greater resilient armor.'
consumables.oil-of-potency-major.name: 'Oil of Potency (Major)'
consumables.oil-of-potency-major.description: 'Activate (1 action): for 1 minute, a weapon becomes a +3 major striking weapon, or armor becomes +3 major resilient armor.'
consumables.oil-of-repulsion.name: 'Oil of Repulsion'
consumables.oil-of-repulsion.description: "Activate (1 action): for 1 minute, a creature that hits the armor's wearer with a melee Strike must save (DC 28 Fortitude) or be pushed 10 feet (and knocked prone on a critical failure)."
consumables.oil-of-revelation.name: 'Oil of Revelation'
consumables.oil-of-revelation.description: "Activate (1 action): the first creature the coated weapon damages glows for 1 minute: invisible, it is only hidden, and lighting doesn't conceal it. The oil fades after an hour unused."
consumables.oil-of-unlife-minor.name: 'Oil of Unlife (Minor)'
consumables.oil-of-unlife-minor.description: 'Activate (1 action): an undead creature or one with void healing regains 1d8 Hit Points.'
consumables.oil-of-unlife-lesser.name: 'Oil of Unlife (Lesser)'
consumables.oil-of-unlife-lesser.description: 'Activate (1 action): an undead creature or one with void healing regains 2d8+5 Hit Points.'
consumables.oil-of-unlife-moderate.name: 'Oil of Unlife (Moderate)'
consumables.oil-of-unlife-moderate.description: 'Activate (1 action): an undead creature or one with void healing regains 3d8+10 Hit Points.'
consumables.oil-of-unlife-greater.name: 'Oil of Unlife (Greater)'
consumables.oil-of-unlife-greater.description: 'Activate (1 action): an undead creature or one with void healing regains 6d8+20 Hit Points.'
consumables.oil-of-unlife-major.name: 'Oil of Unlife (Major)'
consumables.oil-of-unlife-major.description: 'Activate (1 action): an undead creature or one with void healing regains 8d8+30 Hit Points.'
consumables.oil-of-weightlessness.name: 'Oil of Weightlessness'
consumables.oil-of-weightlessness.description: 'Activate (1 action): an item of 1 Bulk or less has negligible Bulk for 1 hour.'
consumables.oil-of-weightlessness-greater.name: 'Oil of Weightlessness (Greater)'
consumables.oil-of-weightlessness-greater.description: 'Activate (1 action): an item of 2 Bulk or less has negligible Bulk for 8 hours.'
consumables.omnidirectional-spear-snare.name: 'Omnidirectional Spear Snare'
consumables.omnidirectional-spear-snare.description: 'Spears strike the creature entering from every side: 15d8 piercing damage (DC 37 basic Reflex).'
consumables.onyx-panther.name: 'Onyx Panther'
consumables.onyx-panther.description: 'Activate (1 action): Sneak with a +1 item bonus at your full Speed, as are your other Sneaks this turn.'
consumables.panacea.name: 'Panacea'
consumables.panacea.description: 'It tries to counteract every curse and disease affecting you, and blinded and deafened from spells (rank 7, +20).'
consumables.penetrating-ammunition.name: 'Penetrating Ammunition'
consumables.penetrating-ammunition.description: "Activate (1 action): the Strike is a 60-foot line; one attack roll against each target's AC, ignoring 10 resistance and thin walls; each target damaged takes 1d6 persistent bleed damage."
consumables.philosophers-stone.name: "Philosopher's Stone"
consumables.philosophers-stone.description: "Made monthly by an alchemist with Craft Philosopher's Stone; broken open (DC 35 Force Open), its quicksilver turns an infused true elixir of life into an elixir of rejuvenation, or base metals into silver and gold over downtime."
consumables.potency-crystal.name: 'Potency Crystal'
consumables.potency-crystal.description: 'Activate (free action) before an attack with the affixed weapon: it is a +1 striking weapon until the end of the turn.'
consumables.potency-crystal-greater.name: 'Potency Crystal (Greater)'
consumables.potency-crystal-greater.description: 'Activate (free action) before an attack with the affixed weapon: it is a +2 greater striking weapon until the end of the turn.'
consumables.potency-crystal-major.name: 'Potency Crystal (Major)'
consumables.potency-crystal-major.description: 'Activate (free action) before an attack with the affixed weapon: it is a +3 major striking weapon until the end of the turn.'
consumables.potion-of-disguise-lesser.name: 'Potion of Disguise (Lesser)'
consumables.potion-of-disguise-lesser.description: 'You look like a specific creature type, set when made, for 2d12 hours (rolled secretly), without its abilities; it can shrink you to Small.'
consumables.potion-of-disguise-moderate.name: 'Potion of Disguise (Moderate)'
consumables.potion-of-disguise-moderate.description: 'You look like a specific creature type, set when made, for 2d12 hours (rolled secretly), without its abilities; it can shrink you to Small. It can also make you up to Large or as small as Tiny.'
consumables.potion-of-disguise-greater.name: 'Potion of Disguise (Greater)'
consumables.potion-of-disguise-greater.description: 'You look like a specific creature type, set when made, for 2d12 hours (rolled secretly), without its abilities; it can shrink you to Small. Picture a specific form and you take it, and can Impersonate a specific individual.'
consumables.potion-of-emergency-escape.name: 'Potion of Emergency Escape'
consumables.potion-of-emergency-escape.description: 'For 1 minute you are fleeing from hostile creatures you know of, with a +40-foot status bonus to your Speeds while fleeing; you Stride at once.'
consumables.potion-of-flying.name: 'Potion of Flying'
consumables.potion-of-flying.description: 'A 40-foot fly Speed for 1 minute.'
consumables.potion-of-flying-greater.name: 'Potion of Flying (Greater)'
consumables.potion-of-flying-greater.description: 'A 40-foot fly Speed for 1 hour.'
consumables.potion-of-leaping.name: 'Potion of Leaping'
consumables.potion-of-leaping.description: 'For 1 minute, whenever you Leap you gain the effect of 1st-rank jump.'
consumables.potion-of-quickness.name: 'Potion of Quickness'
consumables.potion-of-quickness.description: 'You gain the effects of haste for 1 minute.'
consumables.potion-of-retaliation-minor.name: 'Potion of Retaliation (Minor)'
consumables.potion-of-retaliation-minor.description: "For 1 minute, a creature touching you takes 1 damage of the potion's energy (acid, cold, electricity or fire)."
consumables.potion-of-retaliation-lesser.name: 'Potion of Retaliation (Lesser)'
consumables.potion-of-retaliation-lesser.description: "For 1 minute, a creature touching you takes 1d4 damage of the potion's energy (acid, cold, electricity or fire)."
consumables.potion-of-retaliation-moderate.name: 'Potion of Retaliation (Moderate)'
consumables.potion-of-retaliation-moderate.description: "For 1 minute, a creature touching you takes 2d4 damage of the potion's energy (acid, cold, electricity or fire), as does an adjacent creature hitting you with a melee weapon."
consumables.potion-of-retaliation-greater.name: 'Potion of Retaliation (Greater)'
consumables.potion-of-retaliation-greater.description: "For 1 minute, a creature touching you takes 3d6 damage of the potion's energy (acid, cold, electricity or fire), as does an adjacent creature hitting you with a melee weapon."
consumables.potion-of-retaliation-major.name: 'Potion of Retaliation (Major)'
consumables.potion-of-retaliation-major.description: "For 1 minute, a creature touching you takes 4d8 damage of the potion's energy (acid, cold, electricity or fire), as does an adjacent creature hitting you with a melee weapon."
consumables.potion-of-shared-memories.name: 'Potion of Shared Memories'
consumables.potion-of-shared-memories.description: 'Holds one memory of about a minute placed in it; the drinker remembers it as their own (or refuses).'
consumables.potion-of-swimming.name: 'Potion of Swimming'
consumables.potion-of-swimming.description: 'A swim Speed equal to your land Speed for 10 minutes.'
consumables.potion-of-swimming-greater.name: 'Potion of Swimming (Greater)'
consumables.potion-of-swimming-greater.description: 'A swim Speed equal to your land Speed for 1 hour.'
consumables.potion-of-truespeech.name: 'Potion of Truespeech'
consumables.potion-of-truespeech.description: 'For 4 hours, you speak and understand every language (not written).'
consumables.potion-of-undetectability.name: 'Potion of Undetectability'
consumables.potion-of-undetectability.description: "For 10 minutes, detection effects can't find you (as hidden mind, without its bonus), and you have 4th-rank invisibility that defeats see the unseen of 8th rank or lower and has DC 36 against truesight."
consumables.potion-of-water-breathing.name: 'Potion of Water Breathing'
consumables.potion-of-water-breathing.description: 'You gain the effects of 2nd-rank water breathing for 1 hour.'
consumables.predators-claw.name: "Predator's Claw"
consumables.predators-claw.description: "Activate (free action) when you critically hit with the affixed weapon: the Strike gains the weapon's critical specialization effect."
consumables.ration-tonic.name: 'Ration Tonic'
consumables.ration-tonic.description: "Nourishes you as a day's food and water."
consumables.ration-tonic-greater.name: 'Ration Tonic (Greater)'
consumables.ration-tonic-greater.description: "Nourishes you as a day's food and water, for 1 week."
consumables.rending-snare.name: 'Rending Snare'
consumables.rending-snare.description: 'Spinning jaws clamp the first creature to enter: 10d8 piercing damage (DC 34 Reflex): half and off-guard on a success; full, 2d6 persistent bleed and clumsy 2 for 1 round on a failure; double, 4d6 persistent bleed and clumsy 2 for 1 minute on a critical failure.'
consumables.runestone.name: 'Runestone'
consumables.runestone.description: "A stone prepared to hold one rune, which can be transferred to an item (the stone then cracks); its Price adds the rune's."
consumables.salve-of-antiparalysis.name: 'Salve of Antiparalysis'
consumables.salve-of-antiparalysis.description: "Activate (1 action): counteract a creature's magical paralysis (rank 3, +22)."
consumables.salve-of-antiparalysis-greater.name: 'Salve of Antiparalysis (Greater)'
consumables.salve-of-antiparalysis-greater.description: "Activate (1 action): counteract a creature's magical paralysis (rank 6, +31). A petrified creature returns to normal."
consumables.savior-spike.name: 'Savior Spike'
consumables.savior-spike.description: 'Activate (free action) before you roll to Grab an Edge: a +1 item bonus; a success is a critical success and a critical failure a failure.'
consumables.scything-blade-snare.name: 'Scything Blade Snare'
consumables.scything-blade-snare.description: 'Scything blades slice the creature entering: 10d8 slashing damage (DC 32 basic Reflex).'
consumables.sea-touch-elixir-lesser.name: 'Sea Touch Elixir (Lesser)'
consumables.sea-touch-elixir-lesser.description: 'A 20-foot swim Speed for 10 minutes.'
consumables.sea-touch-elixir-moderate.name: 'Sea Touch Elixir (Moderate)'
consumables.sea-touch-elixir-moderate.description: 'A 20-foot swim Speed for 1 hour, and you breathe underwater.'
consumables.sea-touch-elixir-greater.name: 'Sea Touch Elixir (Greater)'
consumables.sea-touch-elixir-greater.description: 'A 20-foot swim Speed for 24 hours, and you breathe underwater.'
consumables.serum-of-sex-shift.name: 'Serum of Sex Shift'
consumables.serum-of-sex-shift.description: 'Your body takes on the sexual characteristics you choose, healthily and permanently; another serum can change them again.'
consumables.shark-tooth-charm.name: 'Shark Tooth Charm'
consumables.shark-tooth-charm.description: 'Activate (1 action): Escape using Acrobatics with a +1 item bonus; a success is a critical success and a critical failure a failure. Failing against a grabbing creature makes it release you or take 2d8 piercing damage.'
consumables.shielding-salve.name: 'Shielding Salve'
consumables.shielding-salve.description: 'Activate (1 action): the creature or object gains a +1 circumstance bonus to AC for 1 round; the first physical attack or force barrage to hit it that round has 5 damage prevented, ending it.'
consumables.shining-ammunition.name: 'Shining Ammunition'
consumables.shining-ammunition.description: 'Sheds bright light 20 feet (dim 20 more) for 10 minutes once shot, and sticks to a target it hits, which sheds the light.'
consumables.shrinking-potion.name: 'Shrinking Potion'
consumables.shrinking-potion.description: 'After 1 minute, you gain the effects of shrink for 10 minutes.'
consumables.shrinking-potion-greater.name: 'Shrinking Potion (Greater)'
consumables.shrinking-potion-greater.description: 'At once, you gain the effects of 4th-rank shrink for 1 hour, and a +2 item bonus to Stealth while shrunken.'
consumables.signaling-snare.name: 'Signaling Snare'
consumables.signaling-snare.description: 'Disturbed terrain shows whoever knows to look that a creature of the right size entered its square.'
consumables.silver-salve.name: 'Silver Salve'
consumables.silver-salve.description: 'Activate: coat one weapon or 10 pieces of ammunition; for 1 hour it counts as silver for its physical damage.'
consumables.skinstitch-salve.name: 'Skinstitch Salve'
consumables.skinstitch-salve.description: "Administer Stitch (1 action): Administer First Aid without a healer's toolkit, with a +2 item bonus or Medicine +13. Stitch Wounds (free action, when you Treat Wounds or use Battle Medicine): a +2 item bonus, and a success is a critical success."
consumables.slumber-arrow.name: 'Slumber Arrow'
consumables.slumber-arrow.description: 'Activate (1 action): deals no damage; a living creature hit must succeed at a DC 17 Will save or take a –5-foot status penalty to its Speeds for 1 round (and be slowed 1 on a critical failure).'
consumables.smoke-ball-lesser.name: 'Smoke Ball (Lesser)'
consumables.smoke-ball-lesser.description: 'Activate (1 action): a 5-foot burst of smoke at a corner of your space for 1 minute; creatures inside are concealed, and others are concealed to them.'
consumables.smoke-ball-greater.name: 'Smoke Ball (Greater)'
consumables.smoke-ball-greater.description: 'Activate (1 action): a 20-foot burst of smoke at a corner of your space for 1 minute; creatures inside are concealed, and others are concealed to them.'
consumables.snagging-hook-snare.name: 'Snagging Hook Snare'
consumables.snagging-hook-snare.description: 'Hooks snag the first creature to enter: 5d8 piercing and 5d8 slashing damage (DC 29 basic Reflex); immobilized until it Escapes (DC 29) on a critical failure.'
consumables.snake-oil.name: 'Snake Oil'
consumables.snake-oil.description: 'Activate (1 action): for 1 hour, a wound or symptom on a creature looks and feels gone, though its effects remain (DC 17 Perception with a Seek to notice).'
consumables.sneaky-key.name: 'Sneaky Key'
consumables.sneaky-key.description: 'Activate (1 action; trained in Thievery): a +1 status bonus to Pick a Lock for 1 minute, and your first success counts as one more success.'
consumables.spellstrike-ammunition-type-i.name: 'Spellstrike Ammunition (Type I)'
consumables.spellstrike-ammunition-type-i.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 1 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spellstrike-ammunition-type-ii.name: 'Spellstrike Ammunition (Type II)'
consumables.spellstrike-ammunition-type-ii.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 2 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spellstrike-ammunition-type-iii.name: 'Spellstrike Ammunition (Type III)'
consumables.spellstrike-ammunition-type-iii.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 3 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spellstrike-ammunition-type-iv.name: 'Spellstrike Ammunition (Type IV)'
consumables.spellstrike-ammunition-type-iv.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 4 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spellstrike-ammunition-type-v.name: 'Spellstrike Ammunition (Type V)'
consumables.spellstrike-ammunition-type-v.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 5 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spellstrike-ammunition-type-vi.name: 'Spellstrike Ammunition (Type VI)'
consumables.spellstrike-ammunition-type-vi.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 6 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spellstrike-ammunition-type-vii.name: 'Spellstrike Ammunition (Type VII)'
consumables.spellstrike-ammunition-type-vii.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 7 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spellstrike-ammunition-type-viii.name: 'Spellstrike Ammunition (Type VIII)'
consumables.spellstrike-ammunition-type-viii.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 8 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spellstrike-ammunition-type-ix.name: 'Spellstrike Ammunition (Type IX)'
consumables.spellstrike-ammunition-type-ix.description: "Activate (2 actions, Cast a Spell): cast a spell of rank 9 or lower that takes 1 or 2 actions and can target a creature into it; the creature it hits is the spell's only target (your attack roll for a spell attack, your spell DC for a save)."
consumables.spike-snare.name: 'Spike Snare'
consumables.spike-snare.description: 'Hidden spikes deal 2d8 piercing damage to the creature entering (DC 17 basic Reflex).'
consumables.spirit-bulb.name: 'Spirit Bulb'
consumables.spirit-bulb.description: 'Activate (2 actions): eat it to cast 5th-rank plant form on yourself, or plant it to cast 5th-rank summon plant or fungus there.'
consumables.spirit-bulb-greater.name: 'Spirit Bulb (Greater)'
consumables.spirit-bulb-greater.description: 'Activate (2 actions): eat it to cast 6th-rank plant form on yourself, or plant it to cast 6th-rank summon plant or fungus there.'
consumables.spirit-bulb-major.name: 'Spirit Bulb (Major)'
consumables.spirit-bulb-major.description: 'Activate (2 actions): eat it to cast 7th-rank plant form on yourself, or plant it to cast 7th-rank summon plant or fungus there.'
consumables.stalker-bane-snare.name: 'Stalker Bane Snare'
consumables.stalker-bane-snare.description: 'Powder clings to the creature entering (DC 20 Reflex): invisible, it is hidden rather than undetected on a success, concealed on a failure, and blinded until the end of its next turn too on a critical failure.'
consumables.stone-bullet.name: 'Stone Bullet'
consumables.stone-bullet.description: 'Activate (1 action): a creature hit is subjected to 6th-rank petrify (DC 34).'
consumables.stone-fist-elixir.name: 'Stone Fist Elixir'
consumables.stone-fist-elixir.description: 'For 1 hour, your fists deal 1d6 bludgeoning damage and lose the nonlethal trait.'
consumables.storm-arrow.name: 'Storm Arrow'
consumables.storm-arrow.description: 'Activate (1 action): on a hit, lightning deals 3d12 electricity damage (DC 25 Reflex, 27 from a shock-runed weapon): half on a success; on a failure, full and buffeting winds (–2 to ranged attacks, –10 feet of fly Speed for 1 round); double on a critical failure.'
consumables.striking-snare.name: 'Striking Snare'
consumables.striking-snare.description: 'Stones or stakes strike the creature entering: 9d8 bludgeoning or piercing damage (set when made; DC 26 basic Reflex).'
consumables.stunning-snare.name: 'Stunning Snare'
consumables.stunning-snare.description: 'A bash disorients the first creature to enter: 10d6 bludgeoning damage (DC 32 Reflex): half, off-guard 1 round and stunned 1 on a success; full, off-guard 1 round and stunned 2 on a failure; double, off-guard 1 minute and stunned 4 on a critical failure.'
consumables.surging-serum-minor.name: 'Surging Serum (Minor)'
consumables.surging-serum-minor.description: 'It tries to counteract each effect making you clumsy or enfeebled (rank 1, +6).'
consumables.surging-serum-lesser.name: 'Surging Serum (Lesser)'
consumables.surging-serum-lesser.description: 'It tries to counteract each effect making you clumsy or enfeebled (rank 2, +8).'
consumables.surging-serum-moderate.name: 'Surging Serum (Moderate)'
consumables.surging-serum-moderate.description: 'It tries to counteract each effect making you clumsy or enfeebled (rank 4, +14).'
consumables.surging-serum-greater.name: 'Surging Serum (Greater)'
consumables.surging-serum-greater.description: 'It tries to counteract each effect making you clumsy or enfeebled (rank 6, +19).'
consumables.surging-serum-major.name: 'Surging Serum (Major)'
consumables.surging-serum-major.description: 'It tries to counteract each effect making you clumsy or enfeebled (rank 9, +28).'
consumables.swift-block-cabochon.name: 'Swift Block Cabochon'
consumables.swift-block-cabochon.description: 'Activate (reaction) when you take damage from a physical attack without the shield raised: Shield Block with it, with 5 more Hardness; the shield stays raised.'
consumables.taper-of-sanctification.name: 'Taper of Sanctification'
consumables.taper-of-sanctification.description: "Activate (1 action): lit for 1 hour; a willing creature who prays near it for the hour gains the candle's holy or unholy trait on its Strikes until its next daily preparations."
consumables.terrifying-ammunition.name: 'Terrifying Ammunition'
consumables.terrifying-ammunition.description: "Activate (1 action): a creature it damages attempts a DC 20 Will save: frightened 1 on a success; on a failure frightened 1 that can't go below 1 until it spends an action to calm down; frightened 2 that way on a critical failure."
consumables.tiger-menuki.name: 'Tiger Menuki'
consumables.tiger-menuki.description: 'Activate (free action) when you Strike with the affixed weapon: it gains forceful and sweep for 1 minute.'
consumables.time-shield-potion.name: 'Time Shield Potion'
consumables.time-shield-potion.description: "You are frozen outside time for 2d4 rounds: you can't act or be targeted, are immune to everything, and effects on you pause."
consumables.timeless-salts.name: 'Timeless Salts'
consumables.timeless-salts.description: 'Activate (1 action): an object up to 10 cubic feet and 40 Bulk (a corpse included) is preserved for 1 week.'
consumables.tricky-liniment.name: 'Tricky Liniment'
consumables.tricky-liniment.description: 'Activate (1 action): applied to armor, for 8 hours a +2 item bonus to Acrobatics checks to Escape or Squeeze.'
consumables.trident-of-lightning.name: 'Trident of Lightning'
consumables.trident-of-lightning.description: 'Activate (2 actions): hurl it to shatter into a 4th-rank lightning bolt from your space (5d12 electricity damage, DC 25 basic Reflex).'
consumables.trident-of-lightning.options.use.name: 'Hurl the trident'
consumables.trip-snare.name: 'Trip Snare'
consumables.trip-snare.description: 'A trip wire catches a Medium or smaller creature entering (DC 21 Reflex): off-guard on a success, prone on a failure, prone and 1d6 bludgeoning on a critical failure.'
consumables.truesight-potion.name: 'Truesight Potion'
consumables.truesight-potion.description: 'You gain 7th-rank truesight with a counteract modifier of +25.'
consumables.truth-potion.name: 'Truth Potion'
consumables.truth-potion.description: "For 10 minutes you can't lie; attempt a DC 19 Will save (you may fail on purpose): on a critical failure you must also answer questions truthfully unless you succeed at a save each time."
consumables.unholy-water.name: 'Unholy Water'
consumables.unholy-water.description: 'Thrown as a Strike (simple thrown weapon, 20 feet): 1d6 spirit damage and 1 spirit splash damage, only to holy creatures.'
consumables.vanishing-coin.name: 'Vanishing Coin'
consumables.vanishing-coin.description: 'Activate (free action; trained in Stealth) before rolling Stealth for initiative: it casts 2nd-rank invisibility on you until the end of your next turn.'
consumables.vine-arrow.name: 'Vine Arrow'
consumables.vine-arrow.description: 'Activate (1 action): the target it hits takes a –10-foot circumstance penalty to its Speeds for 2d4 rounds or until it Escapes (DC 19); immobilized too on a critical hit.'
consumables.viper-arrow.name: 'Viper Arrow'
consumables.viper-arrow.description: 'Activate (1 action): after it hits, it becomes a viper whose venom affects the target; the summoned viper acts at the end of your turn for 1 minute.'
consumables.vipers-fang.name: "Viper's Fang"
consumables.vipers-fang.description: 'Activate (reaction; master with the weapon) when a creature in reach manipulates, moves or makes a ranged attack: a melee Strike with no multiple attack penalty that disrupts a manipulate action on a critical hit; a hit exposes it to viper fang venom (DC 32 Fortitude; 3d10 poison damage and enfeebled 1).'
consumables.witchwarg-elixir-lesser.name: 'Witchwarg Elixir (Lesser)'
consumables.witchwarg-elixir-lesser.description: 'For 24 hours, protection from severe cold.'
consumables.witchwarg-elixir-moderate.name: 'Witchwarg Elixir (Moderate)'
consumables.witchwarg-elixir-moderate.description: 'For 24 hours, protection from severe cold and extreme cold.'
consumables.witchwarg-elixir-greater.name: 'Witchwarg Elixir (Greater)'
consumables.witchwarg-elixir-greater.description: 'For 24 hours, protection from severe cold, extreme and incredible cold.'
consumables.wolf-fang.name: 'Wolf Fang'
consumables.wolf-fang.description: 'Activate (free action) when you Trip a foe: it takes bludgeoning damage equal to your Strength modifier.'
