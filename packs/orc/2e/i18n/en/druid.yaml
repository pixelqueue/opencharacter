# The druid (Player Core): the class, its orders, features, feats and order spells. Short rules text
# written for the pack.
classes.druid.name: Druid
classes.druid.description: "A primal caster who serves nature. Key attribute: Wisdom. 8 Hit Points plus Constitution per level. Trained in Perception, Fortitude and Reflex, expert in Will; trained in simple weapons and unarmed attacks; trained in light and medium armor and unarmored defense; trained in the druid class DC and in spell attacks and spell DCs. Trained in Nature, your order's skill, and 2 skills plus Intelligence. You prepare primal spells with Wisdom: five cantrips, and two spells of each rank you can cast (three from the next level)."
classes.druid.choices.order.prompt: Druidic order
classes.druid.choices.voice-of-nature.prompt: 'Voice of nature: Animal Empathy or Plant Empathy'
classes.druid.choices.skills.prompt: Trained skills (2 plus Intelligence)
classes.druid.choices.class-feat.prompt: Druid feat (level {slot})
classes.druid.choices.skill-feat.prompt: Skill feat (level {slot})

classes.druid.orders.animal.name: Animal Order
classes.druid.orders.animal.description: 'Trained in Athletics. You gain the Animal Companion feat and the heal animal order spell. Anathema: wanton cruelty to animals, or killing them needlessly (defending yourself and hunting cleanly for food are allowed).'
classes.druid.orders.leaf.name: Leaf Order
classes.druid.orders.leaf.description: 'Trained in Diplomacy. You gain the Leshy Familiar feat and the cornucopia order spell. Anathema: wanton cruelty to plants or fungi, or killing them needlessly (defending yourself and harvesting to survive are allowed).'
classes.druid.orders.storm.name: Storm Order
classes.druid.orders.storm.description: "Trained in Acrobatics. You gain the Storm Born feat and the tempest surge order spell. Anathema: polluting the air, or letting those who cause great air pollution or shifts in the climate go unpunished (you needn't act against harm that is only possible, nor throw yourself against a clearly stronger foe)."
classes.druid.orders.untamed.name: Untamed Order
classes.druid.orders.untamed.description: 'Trained in Intimidation. You gain the Untamed Form feat and the untamed shift order spell. Anathema: becoming fully tamed by the comforts of civilization (you may buy goods and stay in towns, but never come to depend on them or make a settlement your home).'
classes.druid.current-spell.name: Current Spell
classes.druid.current-spell.description: 'A +1 circumstance bonus to AC until the start of your next turn.'

features.druid.anathema.name: Anathema
features.druid.anathema.description: "Anathema to every druid: despoiling natural places, using more natural resources than you need to live comfortably, and teaching Druidic to anyone who isn't a druid. Your order adds its own. If you commit them repeatedly, you lose your druid spellcasting and your order's benefits until you atone."
features.druid.druidic-order.name: Druidic Order
features.druid.druidic-order.description: "Your order gives you a skill, a druid feat and an order spell. Order spells are focus spells: each costs a Focus Point, is heightened to half your level rounded up, and can't be cast with spell slots. Your focus pool starts at 1 Focus Point (one more per focus spell, up to 3); daily preparations refill it, and Refocus (10 minutes tending to nature) regains 1."
features.druid.shield-block.name: Shield Block
features.druid.shield-block.description: You gain the Shield Block general feat.
features.druid.druidic.name: Druidic
features.druid.druidic.description: "You know Druidic, the druids' secret language, which sounds like animal calls and is written in spirals and fractals."
features.druid.perception-expertise.name: Perception Expertise
features.druid.perception-expertise.description: Your Perception proficiency becomes expert.
features.druid.fortitude-expertise.name: Fortitude Expertise
features.druid.fortitude-expertise.description: Your Fortitude proficiency becomes expert.
features.druid.reflex-expertise.name: Reflex Expertise
features.druid.reflex-expertise.description: Your Reflex proficiency becomes expert.
features.druid.expert-spellcaster.name: Expert Spellcaster
features.druid.expert-spellcaster.description: Your spell attack and spell DC proficiency becomes expert.
features.druid.weapon-expertise.name: Weapon Expertise
features.druid.weapon-expertise.description: Expert in simple weapons and unarmed attacks.
features.druid.wild-willpower.name: Wild Willpower
features.druid.wild-willpower.description: Your Will proficiency becomes master. A success on a Will save is a critical success.
features.druid.medium-armor-expertise.name: Medium Armor Expertise
features.druid.medium-armor-expertise.description: Expert in light and medium armor and unarmored defense.
features.druid.weapon-specialization.name: Weapon Specialization
features.druid.weapon-specialization.description: '+2 damage with weapons and unarmed attacks you are expert in, +3 if master, +4 if legendary.'
features.druid.master-spellcaster.name: Master Spellcaster
features.druid.master-spellcaster.description: Your spell attack and spell DC proficiency becomes master.
features.druid.legendary-spellcaster.name: Legendary Spellcaster
features.druid.legendary-spellcaster.description: Your spell attack and spell DC proficiency becomes legendary.
features.druid.primal-hierophant.name: Primal Hierophant
features.druid.primal-hierophant.description: "You gain one 10th-rank spell slot. Abilities that give more slots or cast spells without spending a slot can't use it."

feats.druid.animal-companion.name: Animal Companion
feats.druid.animal-companion.description: 'A young animal companion travels with you and obeys your simple commands.'
feats.druid.animal-companion.prerequisites.animal-order: Animal order
feats.druid.animal-empathy.name: Animal Empathy
feats.druid.animal-empathy.description: 'You can ask animals questions, understand their answers and use Diplomacy with them; wild animals usually give you time to make your case.'
feats.druid.plant-empathy.name: Plant Empathy
feats.druid.plant-empathy.description: 'You can ask plants and fungi questions, understand their answers and use Diplomacy with them.'
feats.druid.leshy-familiar.name: Leshy Familiar
feats.druid.leshy-familiar.description: "You gain a Tiny leshy familiar with your choice of the plant or fungus familiar ability, which doesn't count toward its usual abilities."
feats.druid.leshy-familiar.prerequisites.leaf-order: Leaf order
feats.druid.storm-born.name: Storm Born
feats.druid.storm-born.description: "Weather doesn't give you circumstance penalties to ranged spell attacks or Perception checks, and your targeted spells need no flat check against a target that weather conceals."
feats.druid.storm-born.prerequisites.storm-order: Storm order
feats.druid.untamed-form.name: Untamed Form
feats.druid.untamed-form.description: 'You gain the untamed form order spell, whose shapes other druid feats add to.'
feats.druid.untamed-form.prerequisites.untamed-order: Untamed order
feats.druid.verdant-weapon.name: Verdant Weapon
feats.druid.verdant-weapon.description: "Over 10 minutes you imprint a seed with a level 0 weapon you're trained with that has no metal or mechanical parts. Holding it, an Interact action grows it into that weapon, and another returns it to a seed. Runes and talismans on it are suppressed while it is a seed. You have one verdant seed at a time; a new one takes the old one's runes."
feats.druid.call-of-the-wild.name: Call of the Wild
feats.druid.call-of-the-wild.description: 'Over 10 minutes, you replace a spell prepared in one of your druid slots with summon animal or summon plant or fungus of the same rank.'
feats.druid.order-explorer.name: Order Explorer
feats.druid.order-explorer.description: 'Choose an order other than yours. You gain a 1st-level feat that requires that order, and you count as its member for feat prerequisites, but gain none of its other benefits. Breaking its anathema costs you the feats and abilities that need it. You can take this feat again for another order.'
feats.druid.order-explorer.choices.order.prompt: Another order
feats.druid.order-explorer.choices.order.options.animal.name: 'Animal (Animal Companion)'
feats.druid.order-explorer.choices.order.options.leaf.name: 'Leaf (Leshy Familiar)'
feats.druid.order-explorer.choices.order.options.storm.name: 'Storm (Storm Born)'
feats.druid.order-explorer.choices.order.options.untamed.name: 'Untamed (Untamed Form)'
feats.druid.poison-resistance.name: Poison Resistance
feats.druid.poison-resistance.description: 'You gain poison resistance equal to half your level and a +1 status bonus to saves against poisons.'
feats.druid.anthropomorphic-shape.name: Anthropomorphic Shape
feats.druid.anthropomorphic-shape.description: "You add humanoid form's shapes to your untamed form list."
feats.druid.anthropomorphic-shape.prerequisites.untamed-form: Untamed Form
feats.druid.elemental-summons.name: Elemental Summons
feats.druid.elemental-summons.description: 'Over 10 minutes, you replace a spell prepared in one of your druid slots with summon elemental of the same rank.'
feats.druid.forest-passage.name: Forest Passage
feats.druid.forest-passage.description: 'You ignore difficult terrain caused by plants and fungi.'
feats.druid.forest-passage.prerequisites.leaf-order: Leaf order
feats.druid.form-control.name: Form Control
feats.druid.form-control.description: 'One action. If your next action casts untamed form, it is 2 ranks lower (at least 1st), but you can stay transformed for up to 1 hour or its normal duration, whichever is longer.'
feats.druid.form-control.prerequisites.untamed-form: Untamed Form
feats.druid.leshy-familiar-secrets.name: Leshy Familiar Secrets
feats.druid.leshy-familiar-secrets.description: 'Each day your familiar can take one more ability, one of these: grasping tendrils (15-foot reach), purify air (fresh air for a Medium creature, and +2 circumstance to saves against inhaled and olfactory effects within 15 feet), or verdant burst (on its death it casts the 3-action heal one rank below your highest slot, with extra healing to plants; needs 2nd-rank slots).'
feats.druid.leshy-familiar-secrets.prerequisites.leaf-order: Leaf order
feats.druid.mature-animal-companion.name: Mature Animal Companion
feats.druid.mature-animal-companion.description: "Your animal companion becomes mature. If you don't Command it, it can still use 1 action on your turn to Strike or move."
feats.druid.mature-animal-companion.prerequisites.animal-companion: Animal Companion
feats.druid.order-magic.name: Order Magic
feats.druid.order-magic.description: 'Choose an order you joined with Order Explorer: you gain its initial order spell. You can take this feat again for another such order.'
feats.druid.order-magic.prerequisites.order-explorer: Order Explorer
feats.druid.order-magic.choices.order.prompt: An explored order's spell
feats.druid.order-magic.choices.order.options.animal.name: 'Animal (heal animal)'
feats.druid.order-magic.choices.order.options.leaf.name: 'Leaf (cornucopia)'
feats.druid.order-magic.choices.order.options.storm.name: 'Storm (tempest surge)'
feats.druid.order-magic.choices.order.options.untamed.name: 'Untamed (untamed shift)'
feats.druid.snowdrift-spell.name: Snowdrift Spell
feats.druid.snowdrift-spell.description: 'One action. If your next action casts an air, water or cold spell without the fire trait, pick a creature on the ground it affects: its square and the adjacent ones fill with snow, difficult terrain until the start of your next turn. An Interact clears a square, and fire melts it.'
feats.druid.snowdrift-spell.prerequisites.storm-order: Storm order
feats.druid.current-spell.name: Current Spell
feats.druid.current-spell.description: 'One action. If your next action casts an air or water spell, until the start of your next turn you gain a +1 circumstance bonus to AC (+2 against ranged attacks instead) and a +1 circumstance bonus to saves against air and water effects.'
feats.druid.current-spell.actions.current-spell.name: Current Spell
feats.druid.grown-of-oak.name: Grown of Oak
feats.druid.grown-of-oak.description: 'You can cast oaken resilience at will as an innate primal spell, one rank below the highest rank you can cast. It targets you and your leshy familiar if it is within 30 feet.'
feats.druid.grown-of-oak.prerequisites.leaf-order: Leaf order
feats.druid.insect-shape.name: Insect Shape
feats.druid.insect-shape.description: "You add insect form's shapes to your untamed form list. Untamed form into pest form's non-flying insects lasts 24 hours."
feats.druid.insect-shape.prerequisites.untamed-form: Untamed Form
feats.druid.instinctive-support.name: Instinctive Support
feats.druid.instinctive-support.description: 'Free action, when you cast a non-cantrip spell that targets only your animal companion: afterward it takes its actions as if Commanded, one of them Support (unless it has already acted).'
feats.druid.instinctive-support.prerequisites.animal-companion: Animal Companion
feats.druid.storm-retribution.name: Storm Retribution
feats.druid.storm-retribution.description: 'Reaction, when an adjacent foe critically hits you with a melee attack, with a Focus Point: you cast tempest surge on it, and push it 5 feet away if it fails its Reflex save, or 10 feet on a critical failure.'
feats.druid.storm-retribution.prerequisites.storm-order: Storm order
feats.druid.storm-retribution.prerequisites.tempest-surge: The tempest surge order spell

spells.heal-animal.name: Heal Animal
spells.heal-animal.description: |-
  You heal a willing living animal for 1d8 Hit Points.

  - **1 action:** range touch.
  - **2 actions** (concentrate): range 30 feet, and 8 more Hit Points.

  **Heightened (+1)** The healing increases by 1d8, and the 2-action version's extra healing by 8.
spells.cornucopia.name: Cornucopia
spells.cornucopia.description: |-
  A horn of woven vines appears in your hands and drops one fruit, nut or other small produce. A creature that eats it with an Interact action regains 1d6+4 Hit Points. The horn and any uneaten produce wither when the spell ends.

  **Heightened (+1)** One more piece of produce. A creature can eat any number from one casting with a single Interact action; six pieces nourish like a full meal.
spells.tempest-surge.name: Tempest Surge
spells.tempest-surge.description: |-
  A storm of wind, cloud and lightning wraps around a creature, dealing 1d12 electricity damage with a basic Reflex save. On a failure, it is also clumsy 2 for 1 round.

  **Heightened (+1)** The damage increases by 1d12.
spells.untamed-form.name: Untamed Form
spells.untamed-form.description: |-
  You transform into a shape on your untamed form list: pest form's shapes last 10 minutes, the others 1 minute. Druid feats add shapes; a shape from a polymorph spell gives that spell's effects at untamed form's rank. If you use your own attack modifier instead of the form's, you gain a +2 status bonus to attack rolls.

  **Heightened (2nd)** You can also take animal form's shapes.
spells.untamed-shift.name: Untamed Shift
spells.untamed-shift.description: |-
  Part of your body transforms. Choose one effect for an untamed feat you have:

  - **Untamed Form:** claws, an agile, finesse unarmed attack dealing 1d6 slashing damage (you can still hold items, but need a free hand to attack).
  - **Insect Shape:** jaws, an unarmed attack dealing 1d8 piercing damage.
  - **Elemental Shape:** resistance 5 to critical hits and precision damage.
  - **Plant Shape:** vine arms, reach 10 feet (15 with a reach weapon).
  - **Soaring Shape** (2 actions only): wings, a fly Speed of 30 feet.

  **Heightened (6th)** Up to two effects; claws also deal 2d6 persistent bleed damage and jaws 2d6 persistent poison damage on a hit.

  **Heightened (10th)** Up to three effects; the persistent damage becomes 4d6.

