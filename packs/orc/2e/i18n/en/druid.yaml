feats.druid.wind-caller.name: 'Wind Caller'
feats.druid.wind-caller.description: 'You gain the stormwind flight order spell and 1 Focus Point.'
feats.druid.wind-caller.prerequisites.storm-order: 'Storm order'
feats.druid.primal-summons.name: 'Primal Summons'
feats.druid.primal-summons.description: 'You gain the primal summons order spell and 1 Focus Point.'
feats.druid.primal-summons.prerequisites.call-of-the-wild: 'Call of the Wild'
feats.druid.impaling-briars.name: 'Impaling Briars'
feats.druid.impaling-briars.description: 'You gain the impaling briars order spell and 1 Focus Point.'
feats.druid.impaling-briars.prerequisites.leaf-order: 'Leaf order'
feats.druid.invoke-disaster.name: 'Invoke Disaster'
feats.druid.invoke-disaster.description: 'You gain the storm lord order spell and 1 Focus Point.'
feats.druid.invoke-disaster.prerequisites.wind-caller: 'Wind Caller'
