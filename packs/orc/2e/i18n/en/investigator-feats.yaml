# Investigator feats to 20th level. Short rules text written for the pack.

feats.investigator.underworld-investigator.name: 'Underworld Investigator'
feats.investigator.underworld-investigator.description: "You're trained in Underworld Lore, and your Pursue a Lead bonus applies to Thievery checks to investigate a case."
feats.investigator.exploit-blunder.name: 'Exploit Blunder'
feats.investigator.exploit-blunder.description: 'Reaction. Trigger: a creature you Devised a Stratagem against on your last turn fails or critically fails a Strike against you. You Step.'
feats.investigator.person-of-interest.name: 'Person of Interest'
feats.investigator.person-of-interest.description: "One action, once per 10 minutes. Choose a creature you can see that isn't tied to your investigations: for 1 minute you can Devise a Stratagem against it as a free action."
feats.investigator.alchemical-discoveries.name: 'Alchemical Discoveries'
feats.investigator.alchemical-discoveries.description: "You learn two formulas (elixirs or tools) each level instead of one, and make one more versatile vial a day if you're an expert in Crafting (two if master, three if legendary)."
feats.investigator.alchemical-discoveries.prerequisites.methodology: 'Alchemical sciences methodology'
feats.investigator.ongoing-investigation.name: 'Ongoing Investigation'
feats.investigator.ongoing-investigation.description: 'You can Investigate at full Speed and use another exploration activity at the same time.'
feats.investigator.connect-the-dots.name: 'Connect the Dots'
feats.investigator.connect-the-dots.description: "Two actions (auditory, concentrate, linguistic). Choose an ally and a non-allied creature you can see; Perception against the creature's higher of Deception and Will DC; both are then immune for 10 minutes. **Critical Success** The ally gains your Pursue a Lead bonus as a circumstance bonus to its Strikes and skill checks against the creature until the start of your next turn. **Success** Only to its next Strike or skill check against it. **Failure** Nothing. **Critical Failure** You're stupefied 1 until the end of your next turn."
feats.investigator.clue-them-all-in.name: 'Clue Them All In'
feats.investigator.clue-them-all-in.description: 'Clue In gives its bonus to every ally attempting the same investigation check (within 1 round in an encounter).'
feats.investigator.defensive-stratagem.name: 'Defensive Stratagem'
feats.investigator.defensive-stratagem.description: "Devise a Stratagem can be a defensive stratagem after the d20: you can't Strike the target until your next turn, and gain a +1 circumstance bonus to all defenses against its effects until then."
feats.investigator.whodunnit.name: 'Whodunnit?'
feats.investigator.whodunnit.description: "Once a day, when Pursue a Lead opens a larger mystery, ask two yes-or-no questions about the clue (left by a creature with a given trait? within the last hour? the last day? in a heightened emotional state? did anyone hide it?); the GM may answer 'immaterial'."
feats.investigator.just-one-more-thing.name: 'Just One More Thing'
feats.investigator.just-one-more-thing.description: "One action, fortune. Requirement: your last action was a failed (not critically) Demoralize, Feint or Request. Reroll it, doubling your Pursue a Lead bonus if the target is in one of your investigations; it's then immune for a day. A failed Lie, Gather Information, Make an Impression or Coerce can be redone taking half its original time."
feats.investigator.ongoing-strategy.name: 'Ongoing Strategy'
feats.investigator.ongoing-strategy.description: "On a Strike you didn't Devise a Stratagem for, with a weapon that would have used your Intelligence, you deal precision damage equal to your strategic strike dice."
feats.investigator.ongoing-strategy.prerequisites.strategic: 'Strategic strike'
feats.investigator.suspect-of-opportunity.name: 'Suspect of Opportunity'
feats.investigator.suspect-of-opportunity.description: 'Reaction. Trigger: a creature unconnected to your investigations takes a hostile action against you in combat. Use Person of Interest on it (within its usual frequency).'
feats.investigator.suspect-of-opportunity.prerequisites.person-of-interest: 'Person of Interest'
feats.investigator.empiricists-eye.name: "Empiricist's Eye"
feats.investigator.empiricists-eye.description: "Your Point Out isn't auditory, and a creature you Point Out is off-guard to your allies until the start of your next turn (with Blind-Fight, they gain its benefits against it)."
feats.investigator.empiricists-eye.prerequisites.methodology: 'Empiricism methodology'
feats.investigator.foresee-danger.name: 'Foresee Danger'
feats.investigator.foresee-danger.description: 'Reaction, concentrate. Trigger: a creature you can see targets you with an attack. The attack targets your Perception DC instead of your AC (its conditions still apply).'
feats.investigator.just-as-planned.name: 'Just As Planned'
feats.investigator.just-as-planned.description: 'Free action, fortune, once per hour. If your next action is Devise a Stratagem, roll its d20 twice and take the higher.'
feats.investigator.make-em-sweat.name: "Make 'em Sweat"
feats.investigator.make-em-sweat.description: 'A successful Pointed Question also makes the target frightened 1 (2 on a critical success), an emotion and fear effect.'
feats.investigator.make-em-sweat.prerequisites.methodology: 'Interrogation methodology'
feats.investigator.reason-rapidly.name: 'Reason Rapidly'
feats.investigator.reason-rapidly.description: "One action. You use up to five Recall Knowledge actions at once, without abilities they'd trigger."
feats.investigator.share-tincture.name: 'Share Tincture'
feats.investigator.share-tincture.description: 'One action. Use Quick Tincture (needing a vial), potent until the start of your next turn, then Interact to pass it to another creature (a throw always succeeds).'
feats.investigator.share-tincture.prerequisites.methodology: 'Alchemical sciences methodology'
feats.investigator.surgical-shock.name: 'Surgical Shock'
feats.investigator.surgical-shock.description: "One action (attack). Medicine against the Fortitude DC of a target in reach. **Critical Success** Clumsy 3 or stupefied 3 until the end of your next turn, then immune for an hour. **Success** Clumsy 2 or stupefied 2. **Failure** +1 circumstance bonus to your next attack action against it this turn. **Critical Failure** You trigger reactions as if you'd used a manipulate action."
feats.investigator.surgical-shock.prerequisites.methodology: 'Forensic medicine methodology'
feats.investigator.surgical-shock.actions.surgical-shock.name: 'Surgical Shock'
feats.investigator.surgical-shock.actions.surgical-shock.params.dc.name: "Target's Fortitude DC"
feats.investigator.plot-the-future.name: 'Plot the Future'
feats.investigator.plot-the-future.description: 'In 10 minutes of contemplation you learn how likely a chosen event within a week is (highly or somewhat likely or unlikely) and a piece of advice to make it more or less so.'
feats.investigator.strategic-bypass.name: 'Strategic Bypass'
feats.investigator.strategic-bypass.description: 'A hit with a Strike that used your stratagem roll ignores resistances up to your Intelligence modifier.'
feats.investigator.didactic-strike.name: 'Didactic Strike'
feats.investigator.didactic-strike.description: "Shared Stratagem can designate up to 10 allies: the foe is off-guard to each one's first attack before your next turn, which deals 2d6 more precision damage on a hit."
feats.investigator.didactic-strike.prerequisites.shared-stratagem: 'Shared Stratagem'
feats.investigator.implausible-purchase.name: 'Implausible Purchase'
feats.investigator.implausible-purchase.description: 'You can use Prescient Planner even after buying goods, drawing the item as one action, and five times a day pull out a common consumable up to 6 levels below yours.'
feats.investigator.implausible-purchase.prerequisites.predictive-purchase: 'Predictive Purchase'
feats.investigator.lead-investigator.name: 'Lead Investigator'
feats.investigator.lead-investigator.description: "Exploration. A minute's briefing gives up to four allies your Pursue a Lead bonus to checks investigating that question, until you drop the lead or for a day."
feats.investigator.lead-investigator.prerequisites.clue-them-all-in: 'Clue Them All In'
feats.investigator.tricksters-ace.name: "Trickster's Ace"
feats.investigator.tricksters-ace.description: "Reaction, concentrate. During daily preparations you set a trigger (as for Ready) and a single-target spell of 4th rank or lower (no cost, at most 10 minutes to cast) you can be targeted by. When it triggers, the spell takes effect on you alone; it's then spent until your next preparations."
feats.investigator.everyones-a-suspect.name: "Everyone's a Suspect"
feats.investigator.everyones-a-suspect.description: "After interacting with a creature for a minute, you automatically Pursue a Lead on it; you can have any number of these leads, and Pursuing another lead doesn't end them."
feats.investigator.just-the-facts.name: 'Just the Facts'
feats.investigator.just-the-facts.description: "You're permanently quickened, the extra action only to Recall Knowledge. Your Recall Knowledge isn't secret, its outcome is one degree better, and you know which information from it (or an ally's that's shared with you) is false."
feats.investigator.just-the-facts.prerequisites.thorough-research: 'Thorough Research'
