# The investigator (Player Core 2): the class, its features and feats, and its stratagems.
# Short rules text written for the pack.
classes.investigator.name: Investigator
classes.investigator.description: "A detective who plans every blow. Key attribute: Intelligence. 8 Hit Points plus Constitution per level. Expert in Perception, Reflex and Will, trained in Fortitude; trained in simple and martial weapons and unarmed attacks; trained in light armor and unarmored defense; trained in the investigator class DC. Trained in Society, your methodology's skill, and 4 skills plus Intelligence. A skill increase at 2nd level and every level after."
classes.investigator.choices.methodology.prompt: Methodology
classes.investigator.choices.methodology.options.alchemical-sciences.name: 'Alchemical Sciences (Crafting)'
classes.investigator.choices.methodology.options.empiricism.name: 'Empiricism (an Intelligence-based skill)'
classes.investigator.choices.methodology.options.empiricism.choices.skill.prompt: 'Empiricism: an Intelligence-based skill'
classes.investigator.choices.methodology.options.forensic-medicine.name: 'Forensic Medicine (Medicine)'
classes.investigator.choices.methodology.options.interrogation.name: 'Interrogation (Diplomacy)'
classes.investigator.choices.methodology.options.alchemical-sciences.description: 'Trained in Crafting. You gain Alchemical Crafting and formulas for two 1st-level elixirs or tools (one more each level), versatile vials equal to your Intelligence modifier each day, and Quick Tincture: one action and a vial to make an elixir or tool from your formula book that lasts until the end of your turn.'
classes.investigator.choices.methodology.options.empiricism.description: "Trained in one Intelligence-based skill. You gain That's Odd and Expeditious Inspection: a free action once per 10 minutes to Recall Knowledge, Seek or Sense Motive."
classes.investigator.choices.methodology.options.forensic-medicine.description: 'Trained in Medicine. You gain Forensic Acumen and Battle Medicine; your Battle Medicine restores extra Hit Points equal to your level, and its immunity lasts 1 hour.'
classes.investigator.choices.methodology.options.interrogation.description: "Trained in Diplomacy. You gain No Cause for Alarm, you can Pursue a Lead while you Make an Impression, and you gain Pointed Question: one action, Diplomacy against the target's Will DC to make it answer and to see through its lies."
classes.investigator.choices.skills.prompt: Trained skills (4 plus Intelligence)
classes.investigator.choices.class-feat.prompt: Investigator feat (level {slot})
classes.investigator.choices.skill-feat.prompt: Skill feat (level {slot})
classes.investigator.choices.skillful-lessons.prompt: 'Skillful Lessons: an Intelligence-, Wisdom- or Charisma-based or methodology skill feat (level {slot})'

features.investigator.on-the-case.name: On the Case
features.investigator.on-the-case.description: 'Pursue a Lead: examine a detail for 1 minute to open an investigation (two at most), gaining a +1 circumstance bonus to Perception and skill checks to investigate it. Clue In: a reaction once per 10 minutes, giving another creature that bonus to a check for one of your investigations.'
features.investigator.devise-a-stratagem.name: Devise a Stratagem
features.investigator.devise-a-stratagem.description: "One action (free against a creature tied to one of your investigations), concentrate, once per round. Choose a creature you can see and roll a d20. Attack stratagem: your first Strike against it before the start of your next turn uses that roll (fortune), and can use Intelligence instead of Strength or Dexterity, with a ranged weapon or an agile or finesse melee or thrown weapon. Skill stratagem: you can't Strike it until your next turn, but gain a +1 circumstance bonus to your next Intelligence-, Wisdom- or Charisma-based skill check or Perception check involving it."
features.investigator.devise-a-stratagem.actions.devise-a-stratagem.name: Devise a Stratagem
features.investigator.devise-a-stratagem.actions.devise-a-stratagem.steps.plan.prompt: Attack stratagem or skill stratagem?
features.investigator.devise-a-stratagem.actions.devise-a-stratagem.options.attack.name: Attack stratagem
features.investigator.devise-a-stratagem.actions.devise-a-stratagem.options.skill.name: Skill stratagem
features.investigator.devise-a-stratagem.actions.devise-a-stratagem.results.attack.name: Attack stratagem
features.investigator.devise-a-stratagem.actions.devise-a-stratagem.results.skill.name: Skill stratagem
features.investigator.strategic-strike.name: Strategic Strike
features.investigator.strategic-strike.description: 'A Strike that adds your Intelligence modifier through Devise a Stratagem deals 1d6 extra precision damage, one more die at 5th, 9th, 13th and 17th level.'
features.investigator.keen-recollection.name: Keen Recollection
features.investigator.keen-recollection.description: Your proficiency bonus to untrained checks to Recall Knowledge equals your level.
features.investigator.weapon-expertise.name: Weapon Expertise
features.investigator.weapon-expertise.description: 'Expert in simple and martial weapons and unarmed attacks.'
features.investigator.vigilant-senses.name: Vigilant Senses
features.investigator.vigilant-senses.description: Your Perception proficiency becomes master.
features.investigator.weapon-specialization.name: Weapon Specialization
features.investigator.weapon-specialization.description: '+2 damage with weapons and unarmed attacks you are expert in, +3 if master, +4 if legendary.'
features.investigator.fortitude-expertise.name: Fortitude Expertise
features.investigator.fortitude-expertise.description: Your Fortitude proficiency becomes expert.
features.investigator.investigator-expertise.name: Investigator Expertise
features.investigator.investigator-expertise.description: "Pursue a Lead's bonus becomes +2, and your investigator class DC proficiency expert."
features.investigator.deductive-improvisation.name: Deductive Improvisation
features.investigator.deductive-improvisation.description: 'You can attempt a check that needs a proficiency rank one step above yours (trained if untrained, and so on).'
features.investigator.dogged-will.name: Dogged Will
features.investigator.dogged-will.description: Your Will proficiency becomes master. A success on a Will save is a critical success.
features.investigator.incredible-senses.name: Incredible Senses
features.investigator.incredible-senses.description: Your Perception proficiency becomes legendary.
features.investigator.light-armor-expertise.name: Light Armor Expertise
features.investigator.light-armor-expertise.description: Expert in light armor and unarmored defense.
features.investigator.weapon-mastery.name: Weapon Mastery
features.investigator.weapon-mastery.description: Master in simple and martial weapons and unarmed attacks.
features.investigator.greater-weapon-specialization.name: Greater Weapon Specialization
features.investigator.greater-weapon-specialization.description: 'Weapon specialization damage becomes +4 at expert, +6 at master and +8 at legendary.'
features.investigator.savvy-reflexes.name: Savvy Reflexes
features.investigator.savvy-reflexes.description: Your Reflex proficiency becomes master. A success on a Reflex save is a critical success.
features.investigator.greater-dogged-will.name: Greater Dogged Will
features.investigator.greater-dogged-will.description: 'Your Will proficiency becomes legendary. A critical failure on a Will save is a failure, and a failure against a damaging effect halves the damage.'
features.investigator.light-armor-mastery.name: Light Armor Mastery
features.investigator.light-armor-mastery.description: Master in light armor and unarmored defense.
features.investigator.master-detective.name: Master Detective
features.investigator.master-detective.description: 'Your investigator class DC proficiency becomes master. Entering a place with a clue for an open investigation, the GM tells you a clue is there and what kind.'

feats.investigator.eliminate-red-herrings.name: Eliminate Red Herrings
feats.investigator.eliminate-red-herrings.description: 'A critical failure on a check to Recall Knowledge about one of your open investigations is a failure.'
feats.investigator.flexible-studies.name: Flexible Studies
feats.investigator.flexible-studies.description: "At your daily preparations, become trained in one skill until your next preparations; it can't be a prerequisite for anything permanent."
feats.investigator.known-weaknesses.name: Known Weaknesses
feats.investigator.known-weaknesses.description: 'When you Devise a Stratagem, you can also Recall Knowledge first; on a critical success, your allies (and your attack stratagem) gain a +1 circumstance bonus to their next attack against the creature before your next turn.'
feats.investigator.takedown-expert.name: Takedown Expert
feats.investigator.takedown-expert.description: 'A club-group weapon in one hand qualifies for your attack stratagem and strategic strike, and you make nonlethal Strikes without the –2 penalty.'
feats.investigator.thats-odd.name: "That's Odd"
feats.investigator.thats-odd.description: 'Entering a new place, you notice one thing out of the ordinary (but not why), and can Pursue a Lead about it even within 10 minutes of the last.'
feats.investigator.athletic-strategist.name: Athletic Strategist
feats.investigator.athletic-strategist.description: "Your attack stratagem's roll can be used for a Disarm, Grapple, Reposition, Shove or Trip instead (the first eligible attack), with Intelligence instead of Strength."
feats.investigator.athletic-strategist.prerequisites.athletics: Trained in Athletics
feats.investigator.certain-stratagem.name: Certain Stratagem
feats.investigator.certain-stratagem.description: "When a Strike to which you add your Intelligence modifier through Devise a Stratagem misses, deal half your strategic strike damage, of the weapon's damage type."
feats.investigator.shared-stratagem.name: Shared Stratagem
feats.investigator.shared-stratagem.description: "When you hit with an attack that used your stratagem's roll, the creature is off-guard to one ally's next attack against it before your next turn."
feats.investigator.solid-lead.name: Solid Lead
feats.investigator.solid-lead.description: 'Once per day, a lead you stop pursuing becomes your solid lead, which you can return to with a single action.'
feats.investigator.detectives-readiness.name: "Detective's Readiness"
feats.investigator.detectives-readiness.description: "Pursue a Lead's bonus applies to saves (and their DCs) against creatures or effects tied to an open investigation, and Clue In can help an ally's save against them."
feats.investigator.lie-detector.name: Lie Detector
feats.investigator.lie-detector.description: 'A +1 circumstance bonus to Sense Motive and to your Perception DC against Lies; catching a liar gives a +1 circumstance bonus to your next Deception, Diplomacy, Intimidation or Performance check against it within a minute.'
feats.investigator.lie-detector.prerequisites.methodology: Empiricism or interrogation methodology
feats.investigator.scalpels-point.name: "Scalpel's Point"
feats.investigator.scalpels-point.description: "A critical hit with an attack that used your stratagem's roll and deals piercing or slashing damage also deals 1d6 persistent bleed damage."
feats.investigator.scalpels-point.prerequisites.methodology: Forensic medicine methodology
feats.investigator.strategic-assessment.name: Strategic Assessment
feats.investigator.strategic-assessment.description: "The first time you hit a creature with a Strike that used your stratagem's roll, the GM tells you its highest weakness, highest resistance, lowest save or an immunity."
feats.investigator.predictive-purchase.name: Predictive Purchase
feats.investigator.predictive-purchase.description: 'You gain Prescient Planner and Prescient Consumable, and pull out a planned item in 2 actions.'
feats.investigator.thorough-research.name: Thorough Research
feats.investigator.thorough-research.description: 'A success to Recall Knowledge gives more information; a critical success more information or a follow-up question.'

