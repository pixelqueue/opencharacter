feats.general.adopted-ancestry.choices.ancestry.prompt: Adopted ancestry
feats.general.adopted-ancestry.description: Choose another ancestry. You can take ancestry feats of that ancestry as well as your own, unless they need a body you don't have.
feats.general.adopted-ancestry.name: Adopted Ancestry
feats.general.ancestral-paragon.choices.feat.prompt: 1st-level ancestry feat
feats.general.ancestral-paragon.description: You gain a 1st-level ancestry feat.
feats.general.ancestral-paragon.name: Ancestral Paragon
feats.general.armor-proficiency.choices.category.options.heavy.name: Heavy armor
feats.general.armor-proficiency.choices.category.options.light.name: Light armor
feats.general.armor-proficiency.choices.category.options.medium.name: Medium armor
feats.general.armor-proficiency.choices.category.prompt: Armor category to train in
feats.general.armor-proficiency.description: Training in light armor; if you have it, medium; if you have both, heavy. Expert in that armor from 13th level.
feats.general.armor-proficiency.name: Armor Proficiency
feats.general.breath-control.description: You hold your breath 25 times as long as usual. A +1 circumstance bonus to saves against inhaled threats, and a success on such a save is a critical success.
feats.general.breath-control.name: Breath Control
feats.general.canny-acumen.choices.proficiency.options.fortitude.name: Fortitude
feats.general.canny-acumen.choices.proficiency.options.perception.name: Perception
feats.general.canny-acumen.choices.proficiency.options.reflex.name: Reflex
feats.general.canny-acumen.choices.proficiency.options.will.name: Will
feats.general.canny-acumen.choices.proficiency.prompt: Save or Perception
feats.general.canny-acumen.description: 'Choose Fortitude, Reflex, Will or Perception: you become an expert in it, and a master at 17th level.'
feats.general.canny-acumen.name: Canny Acumen
feats.general.diehard.description: You die at dying 5 instead of dying 4.
feats.general.diehard.name: Diehard
feats.general.expeditious-search.description: You Search an area in half the time (a quarter if you're legendary in Perception), so you can move at twice the usual Speed while Searching.
feats.general.expeditious-search.name: Expeditious Search
feats.general.expeditious-search.prerequisites.master: Master in Perception
feats.general.fast-recovery.description: You regain twice as many Hit Points from resting. Successful Fortitude saves against an ongoing disease or poison reduce its stage by 2 (1 if virulent), critical successes by 3 (2 if virulent), and a night's rest reduces drained by 2.
feats.general.fast-recovery.name: Fast Recovery
feats.general.fast-recovery.prerequisites.con: Constitution +2
feats.general.feather-step.description: You can Step into difficult terrain.
feats.general.feather-step.name: Feather Step
feats.general.feather-step.prerequisites.dex: Dexterity +2
feats.general.fleet.description: Your Speed rises by 5 feet.
feats.general.fleet.name: Fleet
feats.general.incredible-initiative.description: A +2 circumstance bonus to initiative rolls.
feats.general.incredible-initiative.name: Incredible Initiative
feats.general.incredible-investiture.description: You can invest up to 12 magic items instead of 10.
feats.general.incredible-investiture.name: Incredible Investiture
feats.general.incredible-investiture.prerequisites.cha: Charisma +3
feats.general.pet.description: You have a Tiny animal pet with the minion trait, of your level, with your saves and AC; it can't attack.
feats.general.pet.name: Pet
feats.general.prescient-consumable.description: Prescient Planner can produce a common consumable item instead of adventuring gear, under the same limits.
feats.general.prescient-consumable.name: Prescient Consumable
feats.general.prescient-consumable.prerequisites.prescient-planner: Prescient Planner
feats.general.prescient-planner.description: Once between shopping trips, take 1 minute to pull a piece of common adventuring gear (level up to half yours, not enough Bulk to encumber you) out of your pack, paying its price.
feats.general.prescient-planner.name: Prescient Planner
feats.general.ride.description: Commanding an animal you're mounted on to move succeeds automatically, and your mount acts on your turn.
feats.general.ride.name: Ride
feats.general.shield-block.description: 'Reaction, while your shield is raised and you would take physical damage from an attack: the shield prevents damage up to its Hardness, and you and it each take the rest.'
feats.general.shield-block.name: Shield Block
feats.general.toughness.description: Your maximum Hit Points rise by your level, and your recovery checks are DC 9 + your dying value.
feats.general.toughness.name: Toughness
feats.general.untrained-improvisation.description: Your proficiency bonus to untrained skill checks is your level − 2, your level − 1 from 5th level and your full level from 7th. It doesn't let you use trained actions.
feats.general.untrained-improvisation.name: Untrained Improvisation
feats.general.weapon-proficiency.description: You become trained in all martial weapons; if you already were, in one advanced weapon. Expert in them from 11th level.
feats.general.weapon-proficiency.name: Weapon Proficiency
feats.skill.additional-lore.choices.lore.options.academia.name: Academia Lore
feats.skill.additional-lore.choices.lore.options.alcohol.name: Alcohol Lore
feats.skill.additional-lore.choices.lore.options.art.name: Art Lore
