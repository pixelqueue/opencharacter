feats.skill.additional-lore.choices.lore.options.sailing.name: Sailing Lore
feats.skill.additional-lore.choices.lore.options.scribing.name: Scribing Lore
feats.skill.additional-lore.choices.lore.options.swamp.name: Swamp Lore
feats.skill.additional-lore.choices.lore.options.tanning.name: Tanning Lore
feats.skill.additional-lore.choices.lore.options.theater.name: Theater Lore
