feats.skill.additional-lore.choices.lore.prompt: Lore
feats.skill.additional-lore.description: 'Choose a Lore: you become trained in it, and at 3rd, 7th and 15th level it gains an extra skill increase.'
feats.skill.additional-lore.name: Additional Lore
feats.skill.advanced-first-aid.description: When you Administer First Aid, you can instead lower an ally's frightened or sickened by 2, or end it on a critical success.
feats.skill.advanced-first-aid.name: Advanced First Aid
feats.skill.advanced-first-aid.prerequisites.master: Master in Medicine
feats.skill.alchemical-crafting.description: You can Craft alchemical items, and add four common 1st-level alchemical formulas to your formula book.
feats.skill.alchemical-crafting.name: Alchemical Crafting
feats.skill.alchemical-crafting.prerequisites.trained: Trained in Crafting
feats.skill.arcane-sense.description: You can cast detect magic at will as an arcane innate spell, at 3rd rank if you're a master in Arcana and 4th if legendary.
feats.skill.arcane-sense.name: Arcane Sense
feats.skill.arcane-sense.prerequisites.trained: Trained in Arcana
feats.skill.assurance.actions.assurance.description: A fixed result of 10 + your proficiency bonus in a skill you chose for Assurance, with no other bonuses or penalties, against a DC if given.
feats.skill.assurance.actions.assurance.name: Assurance
feats.skill.assurance.actions.assurance.params.dc.name: DC
feats.skill.assurance.actions.assurance.params.skill.name: Skill
feats.skill.assurance.choices.skill.prompt: Skill
feats.skill.assurance.description: Choose a skill. Instead of rolling, you can take a result of 10 + your proficiency bonus, ignoring every other bonus and penalty.
feats.skill.assurance.name: Assurance
feats.skill.automatic-knowledge.description: "Choose a skill you're an expert in with Recall Knowledge and Assurance: once per round, you can Recall Knowledge with it as a free action, using Assurance."
feats.skill.automatic-knowledge.name: Automatic Knowledge
feats.skill.automatic-knowledge.prerequisites.assurance: Assurance
feats.skill.automatic-knowledge.prerequisites.expert: Expert in Arcana, Crafting, Medicine, Nature, Occultism, Religion, Society or a Lore
feats.skill.bargain-hunter.description: You can Earn Income with Diplomacy by hunting bargains, or spend that time buying an item at a discount equal to the income. Taken at 1st level, you start with 2 more gp.
feats.skill.bargain-hunter.name: Bargain Hunter
feats.skill.bargain-hunter.prerequisites.trained: Trained in Diplomacy
feats.skill.battle-cry.description: When you roll initiative, you can Demoralize an observed foe as a free action; legendary, you can also Demoralize as a reaction when you critically hit.
feats.skill.battle-cry.name: Battle Cry
feats.skill.battle-cry.prerequisites.master: Master in Intimidation
feats.skill.battle-medicine.actions.battle-medicine.description: '1 action: Medicine at a Treat Wounds DC of a rank you have, healing as Treat Wounds without ending wounded.'
feats.skill.battle-medicine.actions.battle-medicine.name: Battle Medicine
feats.skill.battle-medicine.actions.battle-medicine.options.expert.name: Expert (DC 20, +10 HP)
feats.skill.battle-medicine.actions.battle-medicine.options.legendary.name: Legendary (DC 40, +50 HP)
feats.skill.battle-medicine.actions.battle-medicine.options.master.name: Master (DC 30, +30 HP)
feats.skill.battle-medicine.actions.battle-medicine.options.trained.name: Trained (DC 15)
feats.skill.battle-medicine.actions.battle-medicine.participants.patient.name: Patient
feats.skill.battle-medicine.actions.battle-medicine.steps.tier.prompt: DC to attempt
feats.skill.battle-medicine.description: "1 action, holding or wearing a healer's toolkit: a Medicine check at a Treat Wounds DC heals as Treat Wounds would, without removing wounded. The target is then immune to your Battle Medicine for a day."
feats.skill.battle-medicine.name: Battle Medicine
feats.skill.battle-medicine.prerequisites.trained: Trained in Medicine
feats.skill.bizarre-magic.description: The DCs to Recognize your spells and Identify your magic rise by 5.
feats.skill.bizarre-magic.name: Bizarre Magic
feats.skill.bizarre-magic.prerequisites.master: Master in Occultism
feats.skill.bonded-animal.description: After 7 days of downtime with a friendly animal and a Nature check against its Will DC, it's bonded to you, helpful, and a minion if it's level –1.
feats.skill.bonded-animal.name: Bonded Animal
feats.skill.bonded-animal.prerequisites.expert: Expert in Nature
feats.skill.break-curse.description: '8 hours of rites (10 minutes if legendary): counteract a curse on a target with Occultism or Religion, at a counteract rank of half your level rounded up.'
feats.skill.break-curse.name: Break Curse
feats.skill.break-curse.prerequisites.master: Master in Occultism or Religion
feats.skill.cat-fall.description: Treat falls as 10 feet shorter, 25 feet if you're an expert in Acrobatics and 50 if a master; legendary, you always land on your feet unharmed.
feats.skill.cat-fall.name: Cat Fall
feats.skill.cat-fall.prerequisites.trained: Trained in Acrobatics
feats.skill.charming-liar.description: A critical success to Lie improves the target's attitude toward you by one step, once per conversation, when the lie is meant to impress or ingratiate.
feats.skill.charming-liar.name: Charming Liar
feats.skill.charming-liar.prerequisites.trained: Trained in Deception
feats.skill.cloud-jump.description: A successful Long Jump goes three times as far, and a successful High Jump goes as far as a Long Jump would. Each extra action you spend on a jump adds your Speed to its limit.
feats.skill.cloud-jump.name: Cloud Jump
feats.skill.cloud-jump.prerequisites.legendary: Legendary in Athletics
feats.skill.combat-climber.description: You aren't off-guard while Climbing, and you can Climb with one hand occupied.
feats.skill.combat-climber.name: Combat Climber
feats.skill.combat-climber.prerequisites.trained: Trained in Athletics
feats.skill.communal-crafting.description: Other characters can help you Craft with a relevant skill; their checks also lower the cost of raw materials.
feats.skill.communal-crafting.name: Communal Crafting
feats.skill.communal-crafting.prerequisites.expert: Expert in Crafting
feats.skill.confabulator.description: The bonus a target gets against your repeated Lies and Diversions is +2 instead of +4 (+1 if you're a master, none if legendary).
feats.skill.confabulator.name: Confabulator
feats.skill.confabulator.prerequisites.expert: Expert in Deception
feats.skill.continual-recovery.description: A patient of your Treat Wounds is immune for only 10 minutes instead of an hour.
feats.skill.continual-recovery.name: Continual Recovery
feats.skill.continual-recovery.prerequisites.expert: Expert in Medicine
feats.skill.courtly-graces.description: You pass as a noble or one of their circle. You can use Society to Make an Impression on nobles and to Impersonate one; with the usual skills there, a +1 circumstance bonus instead.
feats.skill.courtly-graces.name: Courtly Graces
feats.skill.courtly-graces.prerequisites.trained: Trained in Society
feats.skill.craft-anything.description: With the right crafting feat and the item's level and proficiency, you can ignore most other requirements to Craft it (not its cost, nor an artifact's), as the GM allows.
feats.skill.craft-anything.name: Craft Anything
feats.skill.craft-anything.prerequisites.legendary: Legendary in Crafting
feats.skill.divine-guidance.actions.divine-guidance.name: Divine Guidance
feats.skill.divine-guidance.actions.divine-guidance.params.dc.name: DC
feats.skill.divine-guidance.description: Spend 10 minutes reading your scriptures about a problem, then attempt a Religion check against the GM's DC; on a success you find a passage that helps you past it.
feats.skill.divine-guidance.name: Divine Guidance
feats.skill.divine-guidance.prerequisites.legendary: Legendary in Religion
feats.skill.dubious-knowledge.description: When you fail (not critically) to Recall Knowledge, you learn the correct answer and a wrong one, without knowing which is which.
feats.skill.dubious-knowledge.name: Dubious Knowledge
feats.skill.dubious-knowledge.prerequisites.trained: Trained in Arcana, Crafting, Medicine, Nature, Occultism, Religion, Society or a Lore
feats.skill.experienced-professional.description: A critical failure to Earn Income with Lore is a failure instead; if you're an expert in the Lore, a failure earns twice as much.
feats.skill.experienced-professional.name: Experienced Professional
feats.skill.experienced-professional.prerequisites.trained: Trained in a Lore
feats.skill.experienced-smuggler.description: When the GM rolls your Stealth to see if an observer notices a small item you've hidden, the die counts as at least 10 (15 if you're a master in Stealth; legendary, you always succeed).
feats.skill.experienced-smuggler.name: Experienced Smuggler
feats.skill.experienced-smuggler.prerequisites.trained: Trained in Stealth
feats.skill.experienced-tracker.description: You can Track at full Speed with a –5 penalty (none if you're a master in Survival; legendary, you roll only when the trail changes).
feats.skill.experienced-tracker.name: Experienced Tracker
feats.skill.experienced-tracker.prerequisites.trained: Trained in Survival
feats.skill.fascinating-performance.description: "When you Perform, compare the result to one observer's Will DC: on a success it's fascinated for a round (a critical success in combat, with the incapacitation trait), then immune for an hour. Expert: up to 4 observers; master: 10; legendary: any number."
feats.skill.fascinating-performance.name: Fascinating Performance
feats.skill.fascinating-performance.prerequisites.trained: Trained in Performance
feats.skill.foil-senses.description: When you Avoid Notice, Hide or Sneak, you always take precautions against special senses.
feats.skill.foil-senses.name: Foil Senses
feats.skill.foil-senses.prerequisites.master: Master in Stealth
feats.skill.forager.description: When you Subsist with Survival, any result worse than a success is a success, and you feed yourself and 4 more creatures (8 if expert, 16 if master, 32 if legendary; twice as many on a critical success).
feats.skill.forager.name: Forager
feats.skill.forager.prerequisites.trained: Trained in Survival
feats.skill.glad-hand.description: Meeting someone socially, you can Make an Impression at once; if you fail, you can talk for a minute and try again.
feats.skill.glad-hand.name: Glad-Hand
feats.skill.glad-hand.prerequisites.expert: Expert in Diplomacy
feats.skill.group-coercion.description: When you Coerce, compare the result to up to 5 targets' Will DCs (10 if expert, 25 if master, 50 if legendary).
feats.skill.group-coercion.name: Group Coercion
feats.skill.group-coercion.prerequisites.trained: Trained in Intimidation
feats.skill.group-impression.description: When you Make an Impression, compare the result to up to 10 targets' Will DCs (20 if expert, 50 if master, 100 if legendary).
feats.skill.group-impression.name: Group Impression
feats.skill.group-impression.prerequisites.trained: Trained in Diplomacy
feats.skill.hefty-hauler.description: Your maximum and encumbered Bulk limits rise by 2.
feats.skill.hefty-hauler.name: Hefty Hauler
feats.skill.hefty-hauler.prerequisites.trained: Trained in Athletics
feats.skill.hobnobber.description: Gathering Information takes you half as long; if you're a master in Diplomacy, a critical failure to Gather Information is a failure.
feats.skill.hobnobber.name: Hobnobber
feats.skill.hobnobber.prerequisites.trained: Trained in Diplomacy
feats.skill.impeccable-crafting.description: A success at Crafting an item of your Specialty Crafting kind is a critical success.
feats.skill.impeccable-crafting.name: Impeccable Crafting
feats.skill.impeccable-crafting.prerequisites.master: Master in Crafting
feats.skill.impeccable-crafting.prerequisites.specialty-crafting: Specialty Crafting
feats.skill.impressive-performance.description: You can Make an Impression with Performance. After performing for 10 minutes, you can impress up to 10 audience members at once (20 after an hour, 50 after two).
feats.skill.impressive-performance.name: Impressive Performance
feats.skill.impressive-performance.prerequisites.trained: Trained in Performance
feats.skill.intimidating-glare.description: "You can Demoralize with a glare: it loses the auditory trait, gains the visual trait, and takes no penalty when the target doesn't understand you."
feats.skill.intimidating-glare.name: Intimidating Glare
feats.skill.intimidating-glare.prerequisites.trained: Trained in Intimidation
feats.skill.intimidating-prowess.description: When you can physically menace the target, a +1 circumstance bonus to Coerce and Demoralize (+2 with Strength +5 as a master in Intimidation), and no penalty for not sharing a language.
feats.skill.intimidating-prowess.name: Intimidating Prowess
feats.skill.intimidating-prowess.prerequisites.expert: Expert in Intimidation
feats.skill.intimidating-prowess.prerequisites.str: Strength +3
feats.skill.inventor.description: "Downtime: invent a common formula you don't know, as if Crafting it."
feats.skill.inventor.name: Inventor
feats.skill.inventor.prerequisites.expert: Expert in Crafting
feats.skill.kip-up.description: 'Free action: you stand up without triggering reactions.'
feats.skill.kip-up.name: Kip Up
feats.skill.kip-up.prerequisites.master: Master in Acrobatics
feats.skill.lasting-coercion.description: A creature you Coerce can comply for up to a week (a month if you're legendary).
feats.skill.lasting-coercion.name: Lasting Coercion
feats.skill.lasting-coercion.prerequisites.expert: Expert in Intimidation
feats.skill.legendary-codebreaker.description: You can Decipher Writing with Society while reading at normal speed. Taking the full time, a success is a critical success, and a critical success gives a near word-for-word understanding.
feats.skill.legendary-codebreaker.name: Legendary Codebreaker
feats.skill.legendary-codebreaker.prerequisites.legendary: Legendary in Society
feats.skill.legendary-linguist.description: You can always talk with a creature that has a language by making up a simple pidgin, once you know how it communicates.
feats.skill.legendary-linguist.name: Legendary Linguist
feats.skill.legendary-linguist.prerequisites.legendary: Legendary in Society
feats.skill.legendary-linguist.prerequisites.multilingual: Multilingual
feats.skill.legendary-medic.actions.legendary-medic.name: Legendary Medic
feats.skill.legendary-medic.actions.legendary-medic.options.blinded.name: Blinded
feats.skill.legendary-medic.actions.legendary-medic.options.deafened.name: Deafened
feats.skill.legendary-medic.actions.legendary-medic.options.disease.name: A disease
feats.skill.legendary-medic.actions.legendary-medic.options.doomed.name: Doomed
feats.skill.legendary-medic.actions.legendary-medic.options.drained.name: Drained
feats.skill.legendary-medic.actions.legendary-medic.params.dc.name: DC
feats.skill.legendary-medic.actions.legendary-medic.participants.patient.name: Patient
feats.skill.legendary-medic.actions.legendary-medic.steps.aim.prompt: What to remove
feats.skill.legendary-medic.description: Once a day per creature, spend an hour and attempt Medicine against the effect's DC to remove a disease or the blinded, deafened, doomed or drained condition (10 higher for an artifact's or a power beyond 20th level).
feats.skill.legendary-medic.name: Legendary Medic
feats.skill.legendary-medic.prerequisites.legendary: Legendary in Medicine
feats.skill.legendary-negotiation.actions.legendary-negotiation.name: Legendary Negotiation
feats.skill.legendary-negotiation.actions.legendary-negotiation.params.dc.name: DC
feats.skill.legendary-negotiation.actions.legendary-negotiation.participants.target.name: Target
feats.skill.legendary-negotiation.description: '3 actions: Make an Impression and then Request that a foe stop fighting and talk, with one Diplomacy check at −5, usually against its Will DC.'
feats.skill.legendary-negotiation.name: Legendary Negotiation
feats.skill.legendary-negotiation.prerequisites.legendary: Legendary in Diplomacy
feats.skill.legendary-performer.description: Your fame makes creatures who know of you start one attitude step better (or worse, by your reputation), and you can Earn Income with Performance from higher-level audiences.
feats.skill.legendary-performer.name: Legendary Performer
feats.skill.legendary-performer.prerequisites.legendary: Legendary in Performance
feats.skill.legendary-performer.prerequisites.virtuosic-performer: Virtuosic Performer
feats.skill.legendary-professional.description: As Legendary Performer, but your fame is in a Lore, and you find higher-level jobs to Earn Income with it.
feats.skill.legendary-professional.name: Legendary Professional
feats.skill.legendary-professional.prerequisites.legendary: Legendary in a Lore
feats.skill.legendary-sneak.description: You can Hide and Sneak without cover or concealment, and you Avoid Notice while doing another exploration activity unless you choose not to.
feats.skill.legendary-sneak.name: Legendary Sneak
feats.skill.legendary-sneak.prerequisites.legendary: Legendary in Stealth
feats.skill.legendary-sneak.prerequisites.swift-sneak: Swift Sneak
feats.skill.legendary-survivalist.description: You can go without food and water indefinitely, and severe, extreme and incredible cold or heat deal you no damage.
feats.skill.legendary-survivalist.name: Legendary Survivalist
feats.skill.legendary-survivalist.prerequisites.legendary: Legendary in Survival
feats.skill.legendary-thief.description: Over at least a minute while staying hidden, you can Steal things that are wielded or hard to remove, even worn armor.
feats.skill.legendary-thief.name: Legendary Thief
feats.skill.legendary-thief.prerequisites.legendary: Legendary in Thievery
feats.skill.legendary-thief.prerequisites.pickpocket: Pickpocket
feats.skill.lengthy-diversion.description: When you critically succeed to Create a Diversion, you stay hidden after your turn ends, for at least another round.
feats.skill.lengthy-diversion.name: Lengthy Diversion
feats.skill.lengthy-diversion.prerequisites.trained: Trained in Deception
feats.skill.lie-to-me.description: In a conversation, someone Lying to you must beat your Deception DC if it's higher than your Perception DC.
feats.skill.lie-to-me.name: Lie to Me
feats.skill.lie-to-me.prerequisites.trained: Trained in Deception
feats.skill.magical-crafting.description: You can Craft magic items, and gain formulas for four common magic items of 2nd level or lower.
feats.skill.magical-crafting.name: Magical Crafting
feats.skill.magical-crafting.prerequisites.expert: Expert in Crafting
feats.skill.magical-shorthand.description: Learning a spell takes you 10 minutes, a success is a critical success, and after a failure you can retry after a week or a level. You can spend downtime learning spells as if Earning Income.
feats.skill.magical-shorthand.name: Magical Shorthand
feats.skill.magical-shorthand.prerequisites.expert: Expert in Arcana, Nature, Occultism or Religion
feats.skill.monster-crafting.description: You can Craft with a monster's body using Survival, spending its valuable parts on the materials and reducing the price by its level.
feats.skill.monster-crafting.name: Monster Crafting
feats.skill.monster-crafting.prerequisites.master: Master in Survival
feats.skill.multilingual.description: You learn two new languages, and one more each when you become a master and legendary in Society.
feats.skill.multilingual.name: Multilingual
feats.skill.multilingual.prerequisites.trained: Trained in Society
feats.skill.natural-medicine.description: You can Treat Wounds with Nature instead of Medicine, with a +2 circumstance bonus in the wilderness at the GM's discretion.
feats.skill.natural-medicine.name: Natural Medicine
feats.skill.natural-medicine.prerequisites.trained: Trained in Nature
feats.skill.nimble-crawl.description: You Crawl at half your Speed (full Speed as a master in Acrobatics); legendary, you aren't off-guard while prone.
feats.skill.nimble-crawl.name: Nimble Crawl
feats.skill.nimble-crawl.prerequisites.expert: Expert in Acrobatics
feats.skill.no-cause-for-alarm.description: '3 actions: a Diplomacy check against the Will DC of each frightened creature in a 10-foot emanation; a success lowers its frightened by 1, a critical success by 2. Each is then immune for an hour.'
feats.skill.no-cause-for-alarm.name: No Cause for Alarm
feats.skill.no-cause-for-alarm.prerequisites.trained: Trained in Diplomacy
feats.skill.oddity-identification.description: When you notice a magical effect, you know at once whether it's mental, about fortune, or reveals secrets; you get a +2 circumstance bonus with Occultism to Identify Magic or Recall Knowledge about such effects.
feats.skill.oddity-identification.name: Oddity Identification
feats.skill.oddity-identification.prerequisites.trained: Trained in Occultism
feats.skill.pickpocket.description: You can Steal or Palm a closely guarded object without the –5 penalty. As a master in Thievery, you can Steal from a creature on guard, with 2 actions and a –5 penalty.
feats.skill.pickpocket.name: Pickpocket
feats.skill.pickpocket.prerequisites.trained: Trained in Thievery
feats.skill.planar-survival.description: You can Subsist with Survival on any plane, and a success also protects you and those you support from the plane's general harm.
feats.skill.planar-survival.name: Planar Survival
feats.skill.planar-survival.prerequisites.master: Master in Survival
feats.skill.powerful-leap.description: You can Leap 5 feet up, and every Leap goes 5 feet farther.
feats.skill.powerful-leap.name: Powerful Leap
feats.skill.powerful-leap.prerequisites.expert: Expert in Athletics
feats.skill.quick-climb.description: Climbing, you move 5 feet farther on a success and 10 on a critical success, up to your Speed; legendary, a climb Speed equal to your Speed.
feats.skill.quick-climb.name: Quick Climb
feats.skill.quick-climb.prerequisites.master: Master in Athletics
feats.skill.quick-coercion.description: You can Coerce a creature after 1 round of conversation instead of 1 minute (still not in combat).
feats.skill.quick-coercion.name: Quick Coercion
feats.skill.quick-coercion.prerequisites.trained: Trained in Intimidation
feats.skill.quick-disguise.description: A disguise takes a tenth the usual time; a 3-action activity with Impersonate as a master in Deception, 1 action if legendary.
feats.skill.quick-disguise.name: Quick Disguise
feats.skill.quick-disguise.prerequisites.expert: Expert in Deception
feats.skill.quick-identification.description: Identify Magic takes you 1 minute instead of 10; 3 actions if you're a master, 1 action if legendary.
feats.skill.quick-identification.name: Quick Identification
feats.skill.quick-identification.prerequisites.trained: Trained in Arcana, Nature, Occultism or Religion
feats.skill.quick-jump.description: High Jump and Long Jump take you 1 action, without the Stride first.
feats.skill.quick-jump.name: Quick Jump
feats.skill.quick-jump.prerequisites.trained: Trained in Athletics
feats.skill.quick-recognition.description: Once per round, you can Recognize a Spell as a free action with a skill you're a master in.
feats.skill.quick-recognition.name: Quick Recognition
feats.skill.quick-recognition.prerequisites.master: Master in Arcana, Nature, Occultism or Religion
feats.skill.quick-recognition.prerequisites.recognize-spell: Recognize Spell
feats.skill.quick-repair.description: Repair takes you 1 minute and isn't an exploration activity; 3 actions if you're a master in Crafting, 1 if legendary.
feats.skill.quick-repair.name: Quick Repair
feats.skill.quick-repair.prerequisites.trained: Trained in Crafting
feats.skill.quick-squeeze.description: You Squeeze 5 feet per round (10 on a critical success); at full Speed if you're legendary in Acrobatics.
feats.skill.quick-squeeze.name: Quick Squeeze
feats.skill.quick-squeeze.prerequisites.trained: Trained in Acrobatics
feats.skill.quick-swim.description: Swimming, you move 5 feet farther on a success and 10 on a critical success, up to your Speed; legendary, a swim Speed equal to your Speed.
feats.skill.quick-swim.name: Quick Swim
feats.skill.quick-swim.prerequisites.master: Master in Athletics
feats.skill.quick-unlock.description: You Pick a Lock with 1 action instead of 2.
feats.skill.quick-unlock.name: Quick Unlock
feats.skill.quick-unlock.prerequisites.master: Master in Thievery
feats.skill.quiet-allies.description: While you Avoid Notice and your allies Follow the Expert, the group rolls one Stealth check with the lowest modifier.
feats.skill.quiet-allies.name: Quiet Allies
feats.skill.quiet-allies.prerequisites.expert: Expert in Stealth
feats.skill.rapid-mantel.description: When you Grab an Edge you can pull yourself up and stand, using Athletics instead of a Reflex save; Climbing or Leaping to within 5 feet of the top, you can do the same.
feats.skill.rapid-mantel.name: Rapid Mantel
feats.skill.rapid-mantel.prerequisites.expert: Expert in Athletics
feats.skill.read-lips.description: You can read the lips of creatures you can see clearly, in a language you know. In encounters or hard cases you're fascinated and off-guard while you focus, and need a Society check.
feats.skill.read-lips.name: Read Lips
feats.skill.read-lips.prerequisites.trained: Trained in Society
feats.skill.recognize-spell.description: "Reaction when a creature you see casts a spell you don't have: identify it, automatically if it's common, of 2nd rank or lower and of a tradition you're trained in; otherwise a secret check with that tradition's skill. A critical success gives a +1 circumstance bonus to your save or AC against it; a critical failure misidentifies it."
feats.skill.recognize-spell.name: Recognize Spell
feats.skill.recognize-spell.prerequisites.trained: Trained in Arcana, Nature, Occultism or Religion
feats.skill.robust-recovery.description: Treating a disease or poison (yours or a patient's) gives +4 instead of +2 on a success, and the patient's success on the save is a critical success.
feats.skill.robust-recovery.name: Robust Recovery
feats.skill.robust-recovery.prerequisites.expert: Expert in Medicine
feats.skill.scare-to-death.actions.scare-to-death.name: Scare to Death
feats.skill.scare-to-death.actions.scare-to-death.params.dc.name: DC
feats.skill.scare-to-death.actions.scare-to-death.participants.target.name: Target
feats.skill.scare-to-death.description: "1 action: Intimidation against the Will DC of a living creature within 30 feet (−4 if it can't hear or understand you). Critical success: it saves on Fortitude against your Intimidation DC, dying on a critical failure, else frightened 2 and fleeing for a round; success: frightened 2; failure: frightened 1. It's immune for a minute."
feats.skill.scare-to-death.name: Scare to Death
feats.skill.scare-to-death.prerequisites.legendary: Legendary in Intimidation
feats.skill.schooled-in-secrets.description: You can use Occultism instead of Diplomacy to Gather Information about secret societies and instead of Deception to Impersonate their members, and you recognize members of your own group.
feats.skill.schooled-in-secrets.name: Schooled in Secrets
feats.skill.schooled-in-secrets.prerequisites.trained: Trained in Occultism
feats.skill.seasoned.description: A +1 circumstance bonus to Craft food and drink (elixirs and potions with the matching crafting feats), +2 if you're a master in a prerequisite skill.
feats.skill.seasoned.name: Seasoned
feats.skill.seasoned.prerequisites.trained: Trained in Alcohol Lore, Cooking Lore or Crafting
feats.skill.shameless-request.description: Outrageous Requests raise the DC by 2 less, and a critical failure to Request is a failure.
feats.skill.shameless-request.name: Shameless Request
feats.skill.shameless-request.prerequisites.master: Master in Diplomacy
feats.skill.sign-language.description: You know the sign languages of the languages you know.
feats.skill.sign-language.name: Sign Language
feats.skill.sign-language.prerequisites.trained: Trained in Society
feats.skill.skill-training.choices.skill.prompt: Skill to train
feats.skill.skill-training.description: You become trained in a skill of your choice.
feats.skill.skill-training.name: Skill Training
feats.skill.skill-training.prerequisites.int: Intelligence +1
feats.skill.slippery-secrets.description: When magic would read your mind, detect your lies or reveal your identity, a Deception check against its DC makes it reveal nothing.
feats.skill.slippery-secrets.name: Slippery Secrets
feats.skill.slippery-secrets.prerequisites.master: Master in Deception
