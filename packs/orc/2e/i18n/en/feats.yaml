# Player Core 2's general and skill feats.
feats.skill.acrobatic-performer.name: 'Acrobatic Performer'
feats.skill.acrobatic-performer.description: 'You can roll Acrobatics instead of Performance to Perform; trained in both, you get a +1 circumstance bonus to that Acrobatics check.'
feats.skill.acrobatic-performer.prerequisites.trained: 'Trained in Acrobatics'
feats.skill.armor-assist.name: 'Armor Assist'
feats.skill.armor-assist.description: "An Athletics or Warfare Lore check at the GM's DC (usually 15 common, 20 uncommon, 25 rare armor) halves the time you, or an ally you help, take to don armor."
feats.skill.armor-assist.prerequisites.trained: 'Trained in Athletics or Warfare Lore'
feats.skill.bon-mot.name: 'Bon Mot'
feats.skill.bon-mot.description: '1 action (auditory, concentrate, emotion, linguistic, mental): Diplomacy against the Will DC of a foe within 30 feet. Critical success: a -3 status penalty to its Perception and Will saves for 1 minute, which it can end early with a fitting retort; success: -2; critical failure: you take -2 for a minute or until your next successful Bon Mot.'
feats.skill.bon-mot.prerequisites.trained: 'Trained in Diplomacy'
feats.skill.bon-mot.actions.bon-mot.name: 'Bon Mot'
feats.skill.bon-mot.actions.bon-mot.params.dc.name: 'DC'
feats.skill.bon-mot.actions.bon-mot.participants.target.name: 'Target'
feats.skill.concealing-legerdemain.name: 'Concealing Legerdemain'
feats.skill.concealing-legerdemain.description: 'To Conceal an Object of light Bulk or less, you can use Thievery instead of Stealth, for the check and the DC an active searcher rolls against. You roll once but keep spending actions to keep it hidden.'
feats.skill.concealing-legerdemain.prerequisites.trained: 'Trained in Thievery'
feats.skill.crafters-appraisal.name: "Crafter's Appraisal"
feats.skill.crafters-appraisal.description: "You can use Crafting instead of a tradition's skill to Identify Magic on magic items (not other magic)."
feats.skill.crafters-appraisal.prerequisites.trained: 'Trained in Crafting'
feats.skill.deceptive-worship.name: 'Deceptive Worship'
feats.skill.deceptive-worship.description: "You can use Occultism instead of Deception to Impersonate an ordinary worshipper of another faith, or to Lie that you belong to the faith you're Impersonating."
feats.skill.deceptive-worship.prerequisites.trained: 'Trained in Occultism'
feats.skill.dirty-trick.name: 'Dirty Trick'
feats.skill.dirty-trick.description: "1 action (attack, manipulate), a hand free and a foe in reach: Thievery against its Reflex DC. Critical success: it's clumsy 1 until it uses an Interact action to end it; success: clumsy 1 for 1 round; critical failure: you fall prone."
feats.skill.dirty-trick.prerequisites.trained: 'Trained in Thievery'
feats.skill.dirty-trick.actions.dirty-trick.name: 'Dirty Trick'
feats.skill.dirty-trick.actions.dirty-trick.params.dc.name: 'DC'
feats.skill.dirty-trick.actions.dirty-trick.params.attack.name: 'Attack this turn (1st, 2nd, 3rd)'
feats.skill.dirty-trick.actions.dirty-trick.participants.target.name: 'Target'
feats.skill.express-rider.name: 'Express Rider'
feats.skill.express-rider.description: "When working out your travel Speed for the day while mounted, a Nature check to Command an Animal (the GM's DC) raises your mount's travel Speed by half on a success, and up to six mounted allies' (or 30-foot quadrupeds') with it. No effect in encounters."
feats.skill.express-rider.prerequisites.trained: 'Trained in Nature'
feats.skill.eye-for-numbers.name: 'Eye for Numbers'
feats.skill.eye-for-numbers.description: "You learn at a glance about how many similar, countable items are in a group you see (rounded to the first digit). Counting a foe's belongings gives a +1 circumstance bonus, and Society instead of Deception, to your next Feint or Create a Diversion against it within a minute. +2 circumstance bonus to Decipher Writing that is mostly numbers."
feats.skill.eye-for-numbers.prerequisites.trained: 'Trained in Society'
feats.skill.forensic-acumen.name: 'Forensic Acumen'
feats.skill.forensic-acumen.description: "A forensic examination takes you half as long (at least 5 minutes). On a success, you can at once Recall Knowledge to follow up on what you found, or about the creature, with a +2 circumstance bonus (+3 if you're a master in Medicine, +4 legendary)."
feats.skill.forensic-acumen.prerequisites.trained: 'Trained in Medicine'
feats.skill.glean-contents.name: 'Glean Contents'
feats.skill.glean-contents.description: 'You can Decipher Writing with Society on a message you only glimpse, or see upside down or reversed, with a +1 circumstance bonus, and read sealed letters without breaking the seal (adding the manipulate trait). On a critical failure the owner learns of it.'
feats.skill.glean-contents.prerequisites.trained: 'Trained in Society'
feats.skill.improvise-tool.name: 'Improvise Tool'
feats.skill.improvise-tool.description: "You can Repair without a repair toolkit, and, with the raw materials, Craft a caltrop set, candle, compass, crowbar, fishing tackle, flint and steel, hammer, ladder, piton, rope, 10-foot pole, thieves' picks, long or short tool, or torch as if you had their formulas."
feats.skill.improvise-tool.prerequisites.trained: 'Trained in Crafting'
feats.skill.inoculation.name: 'Inoculation'
feats.skill.inoculation.description: 'When you successfully Treat a Disease and the patient fully recovers, they get a +2 circumstance bonus to saves against that disease for 1 week.'
feats.skill.inoculation.prerequisites.trained: 'Trained in Medicine'
feats.skill.pilgrims-token.name: "Pilgrim's Token"
feats.skill.pilgrims-token.description: "You follow a religion. You get a wooden religious symbol for free; while you have it, you go first when you tie a foe's initiative roll. A lost one is replaced by buying or Crafting another and attuning it in 10 minutes of prayer."
feats.skill.pilgrims-token.prerequisites.trained: 'Trained in Religion'
feats.skill.risky-surgery.name: 'Risky Surgery'
feats.skill.risky-surgery.description: 'When you Treat Wounds, you can deal 1d8 slashing damage to the patient first; if you do, you get a +2 circumstance bonus to the Medicine check, and a success is a critical success.'
feats.skill.risky-surgery.prerequisites.trained: 'Trained in Medicine'
feats.skill.root-magic.name: 'Root Magic'
feats.skill.root-magic.description: "At your daily preparations you make a charm pouch for one ally (not you). The ally's first saving throw that day against a spell or haunt gets a +1 circumstance bonus (+2 if you're an expert in Occultism, +3 if legendary)."
feats.skill.root-magic.prerequisites.trained: 'Trained in Occultism'
feats.skill.snare-crafting.name: 'Snare Crafting'
feats.skill.snare-crafting.description: 'You can Craft snares, and you add the formulas of four common 1st-level snares to your formula book.'
feats.skill.snare-crafting.prerequisites.trained: 'Trained in Crafting'
feats.skill.armored-stealth.name: 'Armored Stealth'
feats.skill.armored-stealth.description: "In non-noisy armor you're trained in, your Stealth penalty from it drops by 1 (2 if you're a master in Stealth, 3 if legendary). In noisy armor, you ignore the noisy trait instead, so enough Strength removes the penalty as usual."
feats.skill.armored-stealth.prerequisites.expert: 'Expert in Stealth'
feats.skill.assured-identification.name: 'Assured Identification'
feats.skill.assured-identification.description: "Identifying Magic with Arcana, Nature, Occultism or Religion, a critical failure is a failure; and where a success would misidentify a cursed item, you just can't identify it."
feats.skill.assured-identification.prerequisites.expert: 'Expert in Arcana, Nature, Occultism or Religion'
feats.skill.backup-disguise.name: 'Backup Disguise'
feats.skill.backup-disguise.description: "You keep one disguise ready under your clothes: changing into it to Impersonate takes 3 actions (2 if you're a master in Deception, 1 if legendary). Making a new one takes the usual time; you have one at a time."
feats.skill.backup-disguise.prerequisites.expert: 'Expert in Deception'
feats.skill.battle-planner.name: 'Battle Planner'
feats.skill.battle-planner.description: "With a clear picture of your foes' numbers, positions and identities, you spend 1 minute planning and roll Warfare Lore. If the information was and stays accurate when you roll initiative against them, you can use that result for your initiative (a fortune effect)."
feats.skill.battle-planner.prerequisites.expert: 'Expert in Warfare Lore'
feats.skill.discreet-inquiry.name: 'Discreet Inquiry'
feats.skill.discreet-inquiry.description: 'When you Gather Information, you can hide your real subject among others at no cost. Anyone checking whether someone asked about it must beat the higher of your Deception DC and the usual DC to learn of you.'
feats.skill.discreet-inquiry.prerequisites.expert: 'Expert in Deception or Diplomacy'
feats.skill.distracting-performance.name: 'Distracting Performance'
feats.skill.distracting-performance.description: "You can Create a Diversion with Performance instead of Deception; its benefits go to an ally of your choice instead of you, until the end of that ally's turn. You need to know the ally is present, not see it."
feats.skill.distracting-performance.prerequisites.expert: 'Expert in Performance'
feats.skill.exhort-the-faithful.name: 'Exhort the Faithful'
feats.skill.exhort-the-faithful.description: "You follow a religion. To Request something of, or Coerce, members of your own faith you can use Religion instead of Diplomacy or Intimidation, with a +2 circumstance bonus; a critically failed Request doesn't worsen their attitude."
feats.skill.exhort-the-faithful.prerequisites.expert: 'Expert in Religion'
feats.skill.eyes-of-the-city.name: 'Eyes of the City'
feats.skill.eyes-of-the-city.description: "In a settlement, you can Track with Diplomacy or Society (whichever you're trained in), asking locals to follow the trail, as long as there are people to ask."
feats.skill.eyes-of-the-city.prerequisites.trained: 'Trained in Diplomacy or Society'
feats.skill.lead-climber.name: 'Lead Climber'
feats.skill.lead-climber.description: 'When allies Follow the Expert up a route you set and one critically fails to Climb, you can attempt an Athletics check against the same DC: on a success it only fails; if you also critically fail, you both suffer the critical failure.'
feats.skill.lead-climber.prerequisites.expert: 'Expert in Athletics'
feats.skill.leverage-connections.name: 'Leverage Connections'
feats.skill.leverage-connections.description: 'Once a week, among an established group of nobles or elites (with Courtly Graces) or a network of unsavory folk (with Streetwise), you can use Society to Request a fitting favor as if they were friendly. Critical success: helpful advice too, a +2 circumstance bonus to the first skill check acting on the favor; critical failure: you may owe them a service.'
feats.skill.leverage-connections.prerequisites.feat: 'Courtly Graces or Streetwise'
feats.skill.leverage-connections.prerequisites.expert: 'Expert in Society'
feats.skill.rolling-landing.name: 'Rolling Landing'
feats.skill.rolling-landing.description: "When you fall and take no damage, you can use your reaction to Step as you land (Step or Stride half your Speed if you're an expert in Acrobatics, your full Speed if a master; legendary, that Stride triggers no movement reactions)."
feats.skill.rolling-landing.prerequisites.cat-fall: 'Cat Fall'
feats.skill.sanctify-water.name: 'Sanctify Water'
feats.skill.sanctify-water.description: "1 action: a light-Bulk container of water you or an ally in reach has becomes holy or unholy water (as your deity's sanctification allows) until the end of your next turn. It has no value and can't pay ritual costs. Two containers if you're a master in Religion, three if legendary."
feats.skill.sanctify-water.prerequisites.expert: 'Expert in Religion'
feats.skill.shadow-mark.name: 'Shadow Mark'
feats.skill.shadow-mark.description: "When you Avoid Notice while following a specific target, it takes a -2 circumstance penalty to its Perception DC (-3 if you're a master in Stealth, -4 if legendary), and to its initiative roll and Perception DC if an encounter starts while you shadow it."
feats.skill.shadow-mark.prerequisites.expert: 'Expert in Stealth'
feats.skill.slippery-prey.name: 'Slippery Prey'
feats.skill.slippery-prey.description: "When you Escape with Acrobatics or Athletics, the multiple attack penalty for repeated Escapes is -4 and -8 (if you're trained in that skill), -3 and -6 (master) or none (legendary). Escape keeps the attack trait for your other actions."
feats.skill.slippery-prey.prerequisites.trained: 'Trained in Acrobatics or Athletics'
feats.skill.sow-rumor.name: 'Sow Rumor'
feats.skill.sow-rumor.description: "You spread a rumor about a subject, taking as long as Gathering Information; the GM rolls a secret Deception check. Critical success: it spreads widely for a month, and you get +2 circumstance to Deception, Diplomacy and Intimidation when you invoke it; success: it joins the subject's rumors for a week, +1; failure: it dies out; critical failure: -4 to sow rumors on that subject in the region for a week, and word spreads that someone is spreading lies."
feats.skill.sow-rumor.prerequisites.expert: 'Expert in Deception'
feats.skill.terrifying-resistance.name: 'Terrifying Resistance'
feats.skill.terrifying-resistance.description: 'When you Demoralize a creature successfully, you get a +1 circumstance bonus to saves against its spells for 24 hours.'
feats.skill.terrifying-resistance.prerequisites.expert: 'Expert in Intimidation'
feats.skill.tumbling-teamwork.name: 'Tumbling Teamwork'
feats.skill.tumbling-teamwork.description: "When you Tumble Through a foe's space successfully, an ally adjacent to that foe can Step as a reaction, staying adjacent to it."
feats.skill.tumbling-teamwork.prerequisites.expert: 'Expert in Acrobatics'
feats.skill.underground-network.name: 'Underground Network'
feats.skill.underground-network.description: "Where you have a network (usually a settlement where you've spent a week), Gathering Information with Society can go straight to a contact in about an hour, drawing little notice. Afterward, your next Recall Knowledge on that subject gets +1 circumstance (+2 with Underworld Lore)."
feats.skill.underground-network.prerequisites.streetwise: 'Streetwise'
feats.skill.underground-network.prerequisites.expert: 'Expert in Society'
feats.general.improvised-repair.name: 'Improvised Repair'
feats.general.improvised-repair.description: "3 actions: you patch a broken item you or an adjacent willing creature hold. Until it takes damage again it works as a shoddy item of its kind (a magic item can't be activated). It regains no Hit Points; a proper Repair that ends its broken state ends the shoddiness too."
feats.general.keen-follower.name: 'Keen Follower'
feats.general.keen-follower.description: 'Following the Expert, you get a +3 circumstance bonus if the ally is an expert and +4 if a master. When the ally uses a feat that lets the group roll once with the lowest modifier, they can use yours instead.'
feats.general.pick-up-the-pace.name: 'Pick Up the Pace'
feats.general.pick-up-the-pace.description: 'When your group Hustles while exploring, everyone can keep it up as long as whoever could Hustle longest.'
feats.general.pick-up-the-pace.prerequisites.con: 'Constitution +2'
feats.general.robust-health.name: 'Robust Health'
feats.general.robust-health.description: "You regain additional Hit Points equal to your level (a circumstance bonus) when you're successfully treated with Treat Wounds or Battle Medicine. After Battle Medicine, you're immune to it for only 1 hour instead of a day."
feats.general.thorough-search.name: 'Thorough Search'
feats.general.thorough-search.description: "You can Search at half the usual pace (at most 150 feet per minute, or 75 feet before you enter). If you do, the GM's secret Seek check gets a +2 circumstance bonus, and a success is a critical success."
feats.general.thorough-search.prerequisites.expert: 'Expert in Perception'
feats.skill.aerobatics-mastery.name: 'Aerobatics Mastery'
feats.skill.aerobatics-mastery.description: '+2 circumstance bonus to Acrobatics to Maneuver in Flight, and you can combine two maneuvers in one action (DC of the hardest + 5); legendary, three (DC + 10). You rarely move farther than your fly Speed.'
feats.skill.aerobatics-mastery.prerequisites.master: 'Master in Acrobatics'
feats.skill.biographical-eye.name: 'Biographical Eye'
feats.skill.biographical-eye.description: 'After 1 minute with someone new, a secret DC 30 Society check (+1 circumstance if you talked) reveals their background: critical success, profession, specialty, a major accomplishment or scandal, where they live (down to the district) and grew up; success, profession, specialty and where they live; failure, their profession and region; critical failure, something false. A false identity fools you unless you beat their Will DC.'
feats.skill.biographical-eye.prerequisites.master: 'Master in Society'
feats.skill.consult-the-spirits.name: 'Consult the Spirits'
feats.skill.consult-the-spirits.description: "Once a day (once an hour if legendary, never twice over the same area): 10 minutes and a secret Recall Knowledge with the skill you chose when taking the feat (Nature, Occultism or Religion) against the GM's DC. Critical success: friendly spirits answer three simple questions about the area within 100 feet; success: indifferent ones answer one; failure: nothing; critical failure: hostile spirits answer three, harmfully."
feats.skill.consult-the-spirits.prerequisites.master: 'Master in Nature, Occultism or Religion'
feats.skill.disturbing-knowledge.name: 'Disturbing Knowledge'
feats.skill.disturbing-knowledge.description: "2 actions (emotion, fear, mental): you recite dreadful names and secrets. Occultism against the Will DC of an enemy within 30 feet (any number of them if you're legendary), who are then immune for 24 hours. Critical success: confused for 1 round and frightened 1; success: frightened 1; critical failure: you're frightened 1."
feats.skill.disturbing-knowledge.prerequisites.master: 'Master in Occultism'
feats.skill.disturbing-knowledge.actions.disturbing-knowledge.name: 'Disturbing Knowledge'
feats.skill.disturbing-knowledge.actions.disturbing-knowledge.params.dc.name: 'DC'
feats.skill.disturbing-knowledge.actions.disturbing-knowledge.participants.target.name: 'Enemies'
feats.skill.doublespeak.name: 'Doublespeak'
feats.skill.doublespeak.description: "You can hide a second meaning in what you say. Allies who've traveled with you for a week understand it; others need a Perception check against your Deception DC to notice a hidden message, and a critical success to understand it."
feats.skill.doublespeak.prerequisites.master: 'Master in Deception'
feats.skill.environmental-guide.name: 'Environmental Guide'
feats.skill.environmental-guide.description: "After an hour in an environment, you and up to five allies treat its temperature effects as one step less severe (two steps if you're legendary), on top of gear and spells."
feats.skill.environmental-guide.prerequisites.master: 'Master in Survival'
feats.skill.evangelize.name: 'Evangelize'
feats.skill.evangelize.description: "1 action (auditory, linguistic, mental), as a follower of a religion or philosophy: Diplomacy against the Will DC of a target that hears and understands you; it's then immune for a day. Critical success: stupefied 2 for 1 round; success: stupefied 1 for 1 round. A target that already agrees, or is won over, is unaffected."
feats.skill.evangelize.prerequisites.master: 'Master in Diplomacy'
feats.skill.evangelize.actions.evangelize.name: 'Evangelize'
feats.skill.evangelize.actions.evangelize.params.dc.name: 'DC'
feats.skill.evangelize.actions.evangelize.participants.target.name: 'Target'
feats.skill.influence-nature.name: 'Influence Nature'
feats.skill.influence-nature.description: "Over a day or two of downtime (10 minutes if you're legendary), with a check at the GM's DC, you sway a kind of animal in the region to favor you: easier hunts, birds falling silent before danger and the like."
feats.skill.influence-nature.prerequisites.master: 'Master in Nature'
feats.general.numb-to-death.name: 'Numb to Death'
feats.general.numb-to-death.description: "You've died before. The first time each day you regain Hit Points while dying, you regain additional Hit Points equal to your level (a circumstance bonus) and don't gain or increase wounded."
feats.general.numb-to-death.prerequisites.diehard: 'Diehard'
feats.skill.rapid-affixture.name: 'Rapid Affixture'
feats.skill.rapid-affixture.description: "You Affix a Talisman in 1 minute, or as a 3-action activity if you're legendary in Crafting."
feats.skill.rapid-affixture.prerequisites.master: 'Master in Crafting'
feats.skill.signature-crafting.name: 'Signature Crafting'
feats.skill.signature-crafting.description: "When you finish Crafting a permanent magic item successfully, a DC 9 flat check: critical success, you choose a quirk for it (dancing, always clean, matching its surroundings, glittering, floating, loyal, mood colors, a +1 item bonus to one kind of skill check, …); success, the GM gives it a random one. A quirk's benefit works only while it's worn or held."
feats.skill.signature-crafting.prerequisites.magical-crafting: 'Magical Crafting'
feats.skill.signature-crafting.prerequisites.master: 'Master in Crafting'
feats.general.supertaster.name: 'Supertaster'
feats.general.supertaster.description: "Eating or drinking, you automatically try to identify what's in it: the GM's secret Perception check against the poison's DC tells you it's poisoned (not which poison) in time to spit it out. Tasting something while Investigating or Recalling Knowledge gives a +2 circumstance bonus when the taste is telling."
feats.general.supertaster.prerequisites.master: 'Master in Perception'
feats.skill.tumbling-theft.name: 'Tumbling Theft'
feats.skill.tumbling-theft.description: "When you critically succeed to Tumble Through a foe's space, you can Steal an exposed item of light or negligible Bulk from it as a reaction, with a +1 circumstance bonus (not from a container or its hands)."
feats.skill.tumbling-theft.prerequisites.expert-acrobatics: 'Expert in Acrobatics'
feats.skill.tumbling-theft.prerequisites.expert-thievery: 'Expert in Thievery'
feats.skill.water-sprint.name: 'Water Sprint'
feats.skill.water-sprint.description: "Striding in a straight line, after half your Speed over ground you can cover the rest over level water, falling in if you don't end on solid ground. Legendary: from solid ground, any part of the Stride can cross water, in any line."
feats.skill.water-sprint.prerequisites.master: 'Master in Athletics'
feats.general.a-home-in-every-port.name: 'A Home in Every Port'
feats.general.a-home-in-every-port.description: 'In a town or village, 8 hours of downtime finds a resident who houses you and up to six allies for 24 hours at no cost, at a comfortable standard with meals.'
feats.general.a-home-in-every-port.prerequisites.cha: 'Charisma +3'
feats.general.caravan-leader.name: 'Caravan Leader'
feats.general.caravan-leader.description: 'Your group can Hustle 20 minutes longer than whoever could Hustle longest on their own.'
feats.general.caravan-leader.prerequisites.pick-up-the-pace: 'Pick Up the Pace'
feats.general.incredible-scout.name: 'Incredible Scout'
feats.general.incredible-scout.description: 'When you Scout, your allies get a +2 circumstance bonus to initiative instead of +1.'
feats.general.incredible-scout.prerequisites.master: 'Master in Perception'
feats.skill.legendary-guide.name: 'Legendary Guide'
feats.skill.legendary-guide.description: 'Leading your party through wilderness, its travel Speed gets a +10-foot circumstance bonus, ignores difficult terrain, and is only halved by greater difficult terrain. Not in encounters.'
feats.skill.legendary-guide.prerequisites.legendary: 'Legendary in Survival'
feats.general.true-perception.name: 'True Perception'
feats.general.true-perception.description: "You're constantly under the effects of a 6th-rank truesight spell, using your Perception modifier for its counteract checks."
feats.general.true-perception.prerequisites.legendary: 'Legendary in Perception'
