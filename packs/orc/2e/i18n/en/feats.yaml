feats.skill.terrain-stalker.choices.terrain.options.snow.name: Snow
feats.skill.terrain-stalker.choices.terrain.options.underbrush.name: Underbrush
feats.skill.terrain-stalker.choices.terrain.prompt: Terrain
feats.skill.terrain-stalker.description: Choose rubble, snow or underbrush. Undetected in that terrain, you can Sneak 5 feet without a check if you stay 10 feet from enemies, and approach within 15 feet while Avoiding Notice.
feats.skill.terrain-stalker.name: Terrain Stalker
feats.skill.terrain-stalker.prerequisites.trained: Trained in Stealth
feats.skill.terrified-retreat.description: When you critically succeed to Demoralize a target of lower level than you, it's fleeing for 1 round.
feats.skill.terrified-retreat.name: Terrified Retreat
feats.skill.terrified-retreat.prerequisites.master: Master in Intimidation
feats.skill.titan-wrestler.description: You can Disarm, Grapple, Reposition, Shove or Trip creatures up to two sizes larger than you (three if you're legendary in Athletics).
feats.skill.titan-wrestler.name: Titan Wrestler
feats.skill.titan-wrestler.prerequisites.trained: Trained in Athletics
feats.skill.train-animal.description: 'Downtime: teach an animal a basic action, with a check and time the GM sets.'
feats.skill.train-animal.name: Train Animal
feats.skill.train-animal.prerequisites.trained: Trained in Nature
feats.skill.trick-magic-item.description: "1 action: a check with the skill of the item's tradition activates a magic item you couldn't otherwise use, using your DC and spell attack."
feats.skill.trick-magic-item.name: Trick Magic Item
feats.skill.trick-magic-item.prerequisites.trained: Trained in Arcana, Nature, Occultism or Religion
feats.skill.underwater-marauder.description: You aren't off-guard in water, and take no penalty for bludgeoning or slashing melee weapons there.
feats.skill.underwater-marauder.name: Underwater Marauder
feats.skill.underwater-marauder.prerequisites.trained: Trained in Athletics
feats.skill.unified-theory.description: You can use Arcana in place of Nature, Occultism or Religion for skill actions and skill feats about magic, with no penalty for doing so.
feats.skill.unified-theory.name: Unified Theory
feats.skill.unified-theory.prerequisites.legendary: Legendary in Arcana
feats.skill.unmistakable-lore.description: A critical failure to Recall Knowledge with a Lore you're trained in is a failure; as a master in it, a critical success tells you more.
feats.skill.unmistakable-lore.name: Unmistakable Lore
feats.skill.unmistakable-lore.prerequisites.expert: Expert in a Lore
feats.skill.unusual-treatment.description: Succeeding at Treat Wounds against DC 20 or higher also lowers one clumsy, enfeebled or stupefied condition on the patient by 1 (once a day per creature).
feats.skill.unusual-treatment.name: Unusual Treatment
feats.skill.unusual-treatment.prerequisites.expert: Expert in Medicine
