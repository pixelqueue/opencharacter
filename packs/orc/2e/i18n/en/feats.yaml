feats.skill.specialty-crafting.choices.specialty.options.weaving.name: Weaving
feats.skill.specialty-crafting.choices.specialty.options.woodworking.name: Woodworking
feats.skill.specialty-crafting.choices.specialty.prompt: Specialty
feats.skill.specialty-crafting.description: "Choose a crafting specialty: a +1 circumstance bonus to Craft items of that kind, +2 if you're a master in Crafting."
feats.skill.specialty-crafting.name: Specialty Crafting
feats.skill.specialty-crafting.prerequisites.trained: Trained in Crafting
feats.skill.steady-balance.description: A success to Balance is a critical success, and you aren't off-guard while Balancing on narrow surfaces or uneven ground.
feats.skill.steady-balance.name: Steady Balance
feats.skill.steady-balance.prerequisites.trained: Trained in Acrobatics
feats.skill.streetwise.description: You can Gather Information with Society, and in a settlement you know well, Recall Knowledge with Society for what Gathering Information would find.
feats.skill.streetwise.name: Streetwise
feats.skill.streetwise.prerequisites.trained: Trained in Society
feats.skill.student-of-the-canon.description: A critical failure with Religion to Decipher religious writing or Recall Knowledge about faiths is a failure; about your own faith, a failure is a success and a success a critical success.
feats.skill.student-of-the-canon.name: Student of the Canon
feats.skill.student-of-the-canon.prerequisites.trained: Trained in Religion
feats.skill.subtle-theft.description: After you Steal, observers take a –2 circumstance penalty to their Perception DCs to notice. After a Create a Diversion, one Palm an Object or Steal doesn't end your being undetected.
feats.skill.subtle-theft.name: Subtle Theft
feats.skill.subtle-theft.prerequisites.trained: Trained in Thievery
feats.skill.survey-wildlife.description: In 10 minutes, a Survival check reveals which creatures are nearby from their signs; on a success you can Recall Knowledge about them with a –2 penalty (none as a master).
feats.skill.survey-wildlife.name: Survey Wildlife
feats.skill.survey-wildlife.prerequisites.trained: Trained in Survival
feats.skill.swift-sneak.description: You Sneak at full Speed, and while Burrowing, Climbing, Flying or Swimming if you can.
feats.skill.swift-sneak.name: Swift Sneak
feats.skill.swift-sneak.prerequisites.master: Master in Stealth
