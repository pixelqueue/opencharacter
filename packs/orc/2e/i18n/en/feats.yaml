feats.skill.virtuosic-performer.name: Virtuosic Performer
feats.skill.virtuosic-performer.prerequisites.trained: Trained in Performance
feats.skill.wall-jump.description: Ending a jump next to a wall, you don't fall if your next action is another jump, which takes 1 action; once a turn, or any number of times if you're legendary in Athletics.
feats.skill.wall-jump.name: Wall Jump
feats.skill.wall-jump.prerequisites.master: Master in Athletics
