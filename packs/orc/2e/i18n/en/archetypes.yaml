feats.archetype.swashbuckler.basic-flair.choices.feat.prompt: 'Swashbuckler feat (1st or 2nd level)'
feats.archetype.swashbuckler.finishing-precision.prerequisites.swashbuckler-dedication: 'Swashbuckler Dedication'
feats.archetype.swashbuckler.finishing-precision.name: 'Finishing Precision'
feats.archetype.swashbuckler.finishing-precision.description: "You gain precise strike, dealing 1 more precision damage (1d6 on a finisher), which doesn't grow with your level, and the Basic Finisher action: a Strike whose hit deals precise strike's full 1d6."
feats.archetype.swashbuckler.advanced-flair.prerequisites.basic-flair: 'Basic Flair'
feats.archetype.swashbuckler.advanced-flair.name: 'Advanced Flair'
feats.archetype.swashbuckler.advanced-flair.description: 'You gain a swashbuckler feat of up to half your level; your swashbuckler level for its prerequisites is half your level. You can take this feat more than once, gaining another feat each time.'
feats.archetype.swashbuckler.advanced-flair.choices.feat.prompt: 'Swashbuckler feat'
feats.archetype.swashbuckler.swashbucklers-riposte.prerequisites.swashbuckler-dedication: 'Swashbuckler Dedication'
feats.archetype.swashbuckler.swashbucklers-riposte.name: "Swashbuckler's Riposte"
feats.archetype.swashbuckler.swashbucklers-riposte.description: 'You gain the Opportune Riposte reaction.'
feats.archetype.swashbuckler.swashbucklers-speed.prerequisites.swashbuckler-dedication: 'Swashbuckler Dedication'
feats.archetype.swashbuckler.swashbucklers-speed.name: "Swashbuckler's Speed"
feats.archetype.swashbuckler.swashbucklers-speed.description: 'You gain a +5-foot status bonus to your Speeds, +10 feet while you have panache.'
feats.archetype.swashbuckler.evasiveness.prerequisites.swashbuckler-dedication: 'Swashbuckler Dedication'
feats.archetype.swashbuckler.evasiveness.prerequisites.reflex: 'expert in Reflex Saves'
feats.archetype.swashbuckler.evasiveness.name: 'Evasiveness'
feats.archetype.swashbuckler.evasiveness.description: 'Your proficiency in Reflex saves rises to master.'
archetypes.swashbuckler.name: 'Swashbuckler'
archetypes.swashbuckler.description: "You have picked up a swashbuckler's flair and the daring that fuels it."
feats.archetype.investigator.investigator-dedication.prerequisites.int: 'Intelligence +2'
feats.archetype.investigator.investigator-dedication.prerequisites.not-investigator: 'Not an investigator'
feats.archetype.investigator.investigator-dedication.name: 'Investigator Dedication'
feats.archetype.investigator.investigator-dedication.description: 'You gain on the case (Pursue a Lead and Clue In). You become trained in Society (another skill if you already are), one more skill of your choice, and the investigator class DC.'
feats.archetype.investigator.investigator-dedication.choices.free-skill.prompt: 'A skill of your choice'
feats.archetype.investigator.basic-deduction.prerequisites.investigator-dedication: 'Investigator Dedication'
feats.archetype.investigator.basic-deduction.name: 'Basic Deduction'
feats.archetype.investigator.basic-deduction.description: 'You gain a 1st- or 2nd-level investigator feat.'
feats.archetype.investigator.basic-deduction.choices.feat.prompt: 'Investigator feat (1st or 2nd level)'
feats.archetype.investigator.investigators-stratagem.prerequisites.investigator-dedication: 'Investigator Dedication'
feats.archetype.investigator.investigators-stratagem.name: "Investigator's Stratagem"
feats.archetype.investigator.investigators-stratagem.description: "You gain Devise a Stratagem, but its Strike can't use your Intelligence modifier in place of Strength or Dexterity, nor can rolls of abilities that build on it."
feats.archetype.investigator.advanced-deduction.prerequisites.basic-deduction: 'Basic Deduction'
feats.archetype.investigator.advanced-deduction.name: 'Advanced Deduction'
feats.archetype.investigator.advanced-deduction.description: 'You gain an investigator feat of up to half your level; your investigator level for its prerequisites is half your level. You can take this feat more than once, gaining another feat each time.'
feats.archetype.investigator.advanced-deduction.choices.feat.prompt: 'Investigator feat'
feats.archetype.investigator.keen-recollection.prerequisites.investigator-dedication: 'Investigator Dedication'
feats.archetype.investigator.keen-recollection.name: 'Keen Recollection'
feats.archetype.investigator.keen-recollection.description: 'You gain the keen recollection class feature.'
feats.archetype.investigator.skill-mastery.prerequisites.skills: 'Trained in at least one skill and expert in at least one skill'
feats.archetype.investigator.skill-mastery.prerequisites.investigator-dedication: 'Investigator Dedication'
feats.archetype.investigator.skill-mastery.name: 'Skill Mastery'
feats.archetype.investigator.skill-mastery.description: 'One of your skills rises from expert to master and another from trained to expert, and you gain a skill feat for one of them. You can take this feat up to five times.'
feats.archetype.investigator.skill-mastery.choices.skill-feat.prompt: 'Skill feat'
feats.archetype.investigator.skill-mastery.choices.to-master.prompt: 'A skill to raise from expert to master'
feats.archetype.investigator.skill-mastery.choices.to-expert.prompt: 'Another skill to raise from trained to expert'
feats.archetype.investigator.master-spotter.prerequisites.investigator-dedication: 'Investigator Dedication'
feats.archetype.investigator.master-spotter.prerequisites.perception: 'expert in Perception'
feats.archetype.investigator.master-spotter.name: 'Master Spotter'
feats.archetype.investigator.master-spotter.description: 'Your proficiency in Perception rises to master.'
archetypes.investigator.name: 'Investigator'
archetypes.investigator.description: 'You have learned to pursue a case as an investigator does.'
feats.archetype.alchemist.alchemist-dedication.prerequisites.int: 'Intelligence +2'
feats.archetype.alchemist.alchemist-dedication.prerequisites.not-alchemist: 'Not an alchemist'
feats.archetype.alchemist.alchemist-dedication.name: 'Alchemist Dedication'
feats.archetype.alchemist.alchemist-dedication.description: "You become trained in alchemical bombs, the alchemist class DC and Crafting (another skill if you already are). You gain Quick Alchemy, with up to 4 versatile vials a day, and add four common alchemical formulas to your formula book besides Alchemical Crafting's."
feats.archetype.alchemist.alchemist-dedication.choices.formulas.prompt: 'Formulas (four common alchemical items)'
feats.archetype.alchemist.advanced-alchemy.prerequisites.alchemist-dedication: 'Alchemist Dedication'
feats.archetype.alchemist.advanced-alchemy.name: 'Advanced Alchemy'
feats.archetype.alchemist.advanced-alchemy.description: 'You gain advanced alchemy: 4 alchemical consumables made during your daily preparations.'
feats.archetype.alchemist.basic-concoction.prerequisites.alchemist-dedication: 'Alchemist Dedication'
feats.archetype.alchemist.basic-concoction.name: 'Basic Concoction'
feats.archetype.alchemist.basic-concoction.description: 'You gain a 1st- or 2nd-level alchemist feat.'
feats.archetype.alchemist.basic-concoction.choices.feat.prompt: 'Alchemist feat (1st or 2nd level)'
feats.archetype.alchemist.advanced-concoction.prerequisites.basic-concoction: 'Basic Concoction'
feats.archetype.alchemist.advanced-concoction.name: 'Advanced Concoction'
feats.archetype.alchemist.advanced-concoction.description: 'You gain an alchemist feat of up to half your level; your alchemist level for its prerequisites is half your level. You can take this feat more than once, gaining another feat each time.'
feats.archetype.alchemist.advanced-concoction.choices.feat.prompt: 'Alchemist feat'
feats.archetype.alchemist.voluminous-vials.prerequisites.alchemist-dedication: 'Alchemist Dedication'
feats.archetype.alchemist.voluminous-vials.prerequisites.crafting: 'Expert in Crafting'
feats.archetype.alchemist.voluminous-vials.name: 'Voluminous Vials'
feats.archetype.alchemist.voluminous-vials.description: 'You have 5 versatile vials a day. You can take this feat again at 12th level for 6, and at 18th for 7.'
feats.archetype.alchemist.alchemical-power.prerequisites.alchemist-dedication: 'Alchemist Dedication'
feats.archetype.alchemist.alchemical-power.prerequisites.crafting: 'Master in Crafting'
feats.archetype.alchemist.alchemical-power.name: 'Alchemical Power'
feats.archetype.alchemist.alchemical-power.description: 'You become an expert in the alchemist class DC; an infused alchemical item you make that calls for a save can use your class DC instead.'
archetypes.alchemist.name: 'Alchemist'
archetypes.alchemist.description: 'You have learned to brew alchemical items in a hurry.'
feats.archetype.acrobat.acrobat-dedication.prerequisites.acrobatics: 'Trained in Acrobatics'
feats.archetype.acrobat.acrobat-dedication.name: 'Acrobat Dedication'
feats.archetype.acrobat.acrobat-dedication.description: "You become an expert in Acrobatics, a master at 7th level and legendary at 15th. A critical success to Tumble Through an enemy's space doesn't treat it as difficult terrain."
feats.archetype.acrobat.contortionist.prerequisites.acrobat-dedication: 'Acrobat Dedication'
feats.archetype.acrobat.contortionist.name: 'Contortionist'
feats.archetype.acrobat.contortionist.description: 'You gain Quick Squeeze, and Squeeze at full Speed as a master in Acrobatics. A creature you Escape from with Acrobatics is off-guard to your next attack against it before the end of your next turn.'
feats.archetype.acrobat.dodge-away.prerequisites.acrobat-dedication: 'Acrobat Dedication'
feats.archetype.acrobat.dodge-away.name: 'Dodge Away'
feats.archetype.acrobat.dodge-away.description: "Reaction. Trigger: you are the target of a melee attack you're aware of and aren't off-guard to. You gain a +1 circumstance bonus to AC against it; if it misses, you can Step (10 feet as a master in Acrobatics)."
feats.archetype.acrobat.graceful-leaper.prerequisites.acrobat-dedication: 'Acrobat Dedication'
feats.archetype.acrobat.graceful-leaper.prerequisites.acrobatics: 'Master in Acrobatics'
feats.archetype.acrobat.graceful-leaper.name: 'Graceful Leaper'
feats.archetype.acrobat.graceful-leaper.description: 'You can use Acrobatics instead of Athletics to High Jump or Long Jump.'
feats.archetype.acrobat.tumbling-strike.prerequisites.acrobat-dedication: 'Acrobat Dedication'
feats.archetype.acrobat.tumbling-strike.name: 'Tumbling Strike'
feats.archetype.acrobat.tumbling-strike.description: 'One action, flourish, move. Requirement: you are adjacent to an enemy. Attempt Acrobatics against its Reflex DC: on a success you move through its space to the far side (without triggering reactions) and Strike it, off-guard on a critical success; on a failure you stay put but still Strike; on a critical failure you neither move nor Strike.'
feats.archetype.acrobat.tumbling-opportunist.prerequisites.acrobat-dedication: 'Acrobat Dedication'
feats.archetype.acrobat.tumbling-opportunist.name: 'Tumbling Opportunist'
feats.archetype.acrobat.tumbling-opportunist.description: "Free action, attack; once per minute. Requirement: your last action was Tumble Through or Tumbling Strike and you moved through an enemy's space. Trip that enemy, using Acrobatics if you like."
archetypes.acrobat.name: 'Acrobat'
archetypes.acrobat.description: "You move with an acrobat's grace, tumbling past foes and through danger."
feats.archetype.archaeologist.archaeologist-dedication.prerequisites.society: 'Trained in Society'
feats.archetype.archaeologist.archaeologist-dedication.prerequisites.thievery: 'Trained in Thievery'
feats.archetype.archaeologist.archaeologist-dedication.name: 'Archaeologist Dedication'
feats.archetype.archaeologist.archaeologist-dedication.description: 'You become an expert in Society and Thievery, and gain a +1 circumstance bonus to Recall Knowledge about ancient history, peoples and cultures.'
feats.archetype.archaeologist.magical-scholastics.prerequisites.archaeologist-dedication: 'Archaeologist Dedication'
feats.archetype.archaeologist.magical-scholastics.name: 'Magical Scholastics'
feats.archetype.archaeologist.magical-scholastics.description: 'You can cast detect magic, guidance and read aura as occult innate cantrips.'
feats.archetype.archaeologist.settlement-scholastics.prerequisites.archaeologist-dedication: 'Archaeologist Dedication'
feats.archetype.archaeologist.settlement-scholastics.name: 'Settlement Scholastics'
feats.archetype.archaeologist.settlement-scholastics.description: 'Choose a settlement: you gain Additional Lore for its Lore and learn a common or uncommon language spoken there. You can take this feat again for another settlement.'
feats.archetype.archaeologist.scholastic-identification.prerequisites.archaeologist-dedication: 'Archaeologist Dedication'
feats.archetype.archaeologist.scholastic-identification.prerequisites.society: 'Master in Society'
feats.archetype.archaeologist.scholastic-identification.name: 'Scholastic Identification'
feats.archetype.archaeologist.scholastic-identification.description: 'You can use Society to Decipher Writing of any kind, and to Identify Magic on an item or place of cultural significance.'
feats.archetype.archaeologist.archaeologists-luck.prerequisites.archaeologist-dedication: 'Archaeologist Dedication'
feats.archetype.archaeologist.archaeologists-luck.name: "Archaeologist's Luck"
feats.archetype.archaeologist.archaeologists-luck.description: 'Free action, fortune; once per hour. Trigger: you fail a check against a trap. Reroll it and use the new result.'
feats.archetype.archaeologist.greater-magical-scholastics.prerequisites.magical-scholastics: 'Magical Scholastics'
feats.archetype.archaeologist.greater-magical-scholastics.name: 'Greater Magical Scholastics'
feats.archetype.archaeologist.greater-magical-scholastics.description: 'You can cast augury, locate and veil of privacy as occult innate spells, each once a day; your veil of privacy targets only an object and is heightened to half your level.'
archetypes.archaeologist.name: 'Archaeologist'
archetypes.archaeologist.description: 'You search out the secrets and relics of past peoples.'
feats.archetype.archer.archer-dedication.name: 'Archer Dedication'
feats.archetype.archer.archer-dedication.description: 'You treat martial bows and crossbows as simple weapons and advanced ones as martial. As an expert in such a weapon, you get its critical specialization effect.'
feats.archetype.archer.quick-shot.prerequisites.archer-dedication: 'Archer Dedication'
feats.archetype.archer.quick-shot.name: 'Quick Shot'
feats.archetype.archer.quick-shot.description: 'One action. Draw a loaded or reload 0 bow or crossbow and Strike with it.'
feats.archetype.archer.crossbow-terror.prerequisites.archer-dedication: 'Archer Dedication'
feats.archetype.archer.crossbow-terror.name: 'Crossbow Terror'
feats.archetype.archer.crossbow-terror.description: 'One action. Reload a crossbow, then Demoralize with a +2 circumstance bonus if you hit with a crossbow Strike this turn.'
feats.archetype.archer.archers-aim.prerequisites.archer-dedication: 'Archer Dedication'
feats.archetype.archer.archers-aim.name: "Archer's Aim"
feats.archetype.archer.archers-aim.description: "Two actions, concentrate. Make a ranged Strike with a bow or crossbow at a +2 circumstance bonus, ignoring the target's concealment; a hidden target's flat check is DC 5."
feats.archetype.archer.archers-aim.actions.archers-aim.name: "Archer's Aim"
feats.archetype.archer.archers-aim.actions.archers-aim.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.archer.unobstructed-shot.prerequisites.archer-dedication: 'Archer Dedication'
feats.archetype.archer.unobstructed-shot.prerequisites.athletics: 'Expert in Athletics'
feats.archetype.archer.unobstructed-shot.name: 'Unobstructed Shot'
feats.archetype.archer.unobstructed-shot.description: 'Two actions, flourish. Shove or Trip an adjacent creature, then Strike with your bow or crossbow at the same multiple attack penalty; it counts as one attack.'
archetypes.archer.name: 'Archer'
archetypes.archer.description: 'You fight with bow and crossbow, at a distance and from cover.'
feats.archetype.assassin.assassin-dedication.prerequisites.deception: 'Trained in Deception'
feats.archetype.assassin.assassin-dedication.prerequisites.stealth: 'Trained in Stealth'
feats.archetype.assassin.assassin-dedication.name: 'Assassin Dedication'
feats.archetype.assassin.assassin-dedication.description: 'You gain Mark for Death (concentrate): designate a creature you observe as your mark until it dies or you mark another. You get +2 circumstance to Seek and Feint it, it takes −2 to Seek you, and your attacks against it deal sneak attack of 1d4 (1d6 from 6th level); if you already have sneak attack, 1 more precision damage (2 from 6th) against it.'
feats.archetype.assassin.assassin-dedication.actions.mark-for-death.name: 'Mark for Death'
feats.archetype.assassin.assassin-dedication.actions.mark-for-death.results.marked.name: 'Marked'
feats.archetype.assassin.expert-backstabber.prerequisites.assassin-dedication: 'Assassin Dedication'
feats.archetype.assassin.expert-backstabber.name: 'Expert Backstabber'
feats.archetype.assassin.expert-backstabber.description: 'Your backstabber weapons deal 2 extra precision damage to an off-guard foe instead of 1 (4 instead of 2 with a +3 weapon).'
feats.archetype.assassin.surprise-attack.prerequisites.assassin-dedication: 'Assassin Dedication'
feats.archetype.assassin.surprise-attack.name: 'Surprise Attack'
feats.archetype.assassin.surprise-attack.description: "On the first round, if you rolled Deception or Stealth for initiative, creatures that haven't acted are off-guard to you."
feats.archetype.assassin.angel-of-death.prerequisites.assassin-dedication: 'Assassin Dedication'
feats.archetype.assassin.angel-of-death.name: 'Angel of Death'
feats.archetype.assassin.angel-of-death.description: 'Your Strikes against your mark have the death trait, so it dies at 0 Hit Points, and magic to speak with, revive or disturb it fails unless its counteract rank beats half the level you had then.'
feats.archetype.assassin.assassinate.prerequisites.assassin-dedication: 'Assassin Dedication'
feats.archetype.assassin.assassinate.name: 'Assassinate'
feats.archetype.assassin.assassinate.description: "Two actions. Requirement: you have a mark and it hasn't noticed you. Strike your mark: on a hit it takes 6d6 more precision damage with a basic Fortitude save against your class or spell DC, dying on a critical failure unless its level is higher than yours. It is then immune to your Assassinate for a day."
archetypes.assassin.name: 'Assassin'
archetypes.assassin.description: 'You mark a target and kill it with patience and precision.'
feats.archetype.bastion.bastion-dedication.prerequisites.shield-block: 'Shield Block'
feats.archetype.bastion.bastion-dedication.name: 'Bastion Dedication'
feats.archetype.bastion.bastion-dedication.description: 'You gain the fighter feat Reactive Shield.'
feats.archetype.bastion.disarming-block.prerequisites.bastion-dedication: 'Bastion Dedication'
feats.archetype.bastion.disarming-block.prerequisites.athletics: 'Trained in Athletics'
feats.archetype.bastion.disarming-block.name: 'Disarming Block'
feats.archetype.bastion.disarming-block.description: 'Free action. Trigger: you Shield Block a melee Strike with a held weapon. Disarm the attacker of that weapon, even without a free hand.'
feats.archetype.bastion.nimble-shield-hand.prerequisites.bastion-dedication: 'Bastion Dedication'
feats.archetype.bastion.nimble-shield-hand.name: 'Nimble Shield Hand'
feats.archetype.bastion.nimble-shield-hand.description: 'Your shield hand counts as free for Interact actions and can hold another object (not to wield a weapon), except with a tower shield.'
feats.archetype.bastion.destructive-block.prerequisites.bastion-dedication: 'Bastion Dedication'
feats.archetype.bastion.destructive-block.name: 'Destructive Block'
feats.archetype.bastion.destructive-block.description: "When you Shield Block, you can reduce the damage by double the shield's Hardness, but the shield takes double damage."
feats.archetype.bastion.shield-salvation.prerequisites.bastion-dedication: 'Bastion Dedication'
feats.archetype.bastion.shield-salvation.name: 'Shield Salvation'
feats.archetype.bastion.shield-salvation.description: "A shield your Shield Block would destroy stays at 1 Hit Point instead; you can't save the same shield again until your next preparations."
archetypes.bastion.name: 'Bastion'
archetypes.bastion.description: 'Your shield is as much a part of you as your arm.'
feats.archetype.beastmaster.beastmaster-dedication.prerequisites.nature: 'Trained in Nature'
feats.archetype.beastmaster.beastmaster-dedication.name: 'Beastmaster Dedication'
feats.archetype.beastmaster.beastmaster-dedication.description: 'You gain a young animal companion, and can have a second one; with more than one you gain Call Companion. Your beastmaster focus spells are primal, cast with Charisma, and you become trained in spell attacks and spell DCs with the first; you Refocus by tending a companion.'
feats.archetype.beastmaster.additional-companion.prerequisites.beastmaster-dedication: 'Beastmaster Dedication'
feats.archetype.beastmaster.additional-companion.name: 'Additional Companion'
feats.archetype.beastmaster.additional-companion.description: 'Another young animal companion, with the minion trait, joins you. You can take this feat again, to four companions in all.'
feats.archetype.beastmaster.mature-beastmaster-companion.prerequisites.beastmaster-dedication: 'Beastmaster Dedication'
feats.archetype.beastmaster.mature-beastmaster-companion.name: 'Mature Beastmaster Companion'
feats.archetype.beastmaster.mature-beastmaster-companion.description: 'Your companions become mature, and your active one can Stride or Strike on your turn without a command.'
feats.archetype.beastmaster.beastmasters-trance.prerequisites.beastmaster-dedication: 'Beastmaster Dedication'
feats.archetype.beastmaster.beastmasters-trance.name: "Beastmaster's Trance"
feats.archetype.beastmaster.beastmasters-trance.description: "You gain the focus spell beastmaster trance, sharing a companion's senses."
feats.archetype.beastmaster.swift-guardian.prerequisites.beastmaster-dedication: 'Beastmaster Dedication; Call Companion'
feats.archetype.beastmaster.swift-guardian.name: 'Swift Guardian'
feats.archetype.beastmaster.swift-guardian.description: 'Free action, concentrate. Trigger: you roll initiative. Use Call Companion.'
feats.archetype.beastmaster.incredible-beastmaster-companion.prerequisites.mature-beastmaster-companion: 'Mature Beastmaster Companion'
feats.archetype.beastmaster.incredible-beastmaster-companion.name: 'Incredible Beastmaster Companion'
feats.archetype.beastmaster.incredible-beastmaster-companion.description: 'Your mature companions become nimble or savage, your choice for each.'
feats.archetype.beastmaster.beastmaster-bond.prerequisites.beastmaster-dedication: 'Beastmaster Dedication'
feats.archetype.beastmaster.beastmaster-bond.name: 'Beastmaster Bond'
feats.archetype.beastmaster.beastmaster-bond.description: "You speak telepathically with your companions within 100 feet (anywhere on the same world if you're legendary in Nature)."
feats.archetype.beastmaster.beastmasters-call.prerequisites.beastmaster-dedication: 'Beastmaster Dedication; Call Companion'
feats.archetype.beastmaster.beastmasters-call.name: "Beastmaster's Call"
feats.archetype.beastmaster.beastmasters-call.description: 'One action; once per turn. A primal projection of an inactive companion appears within 30 feet, grants you its support benefit, and vanishes at the start of your next turn or when damaged.'
feats.archetype.beastmaster.specialized-beastmaster-companion.prerequisites.incredible-beastmaster-companion: 'Incredible Beastmaster Companion'
feats.archetype.beastmaster.specialized-beastmaster-companion.name: 'Specialized Beastmaster Companion'
feats.archetype.beastmaster.specialized-beastmaster-companion.description: 'Each nimble or savage companion gains a specialization. You can take this feat again, up to three specializations each.'
feats.archetype.beastmaster.lead-the-pack.prerequisites.mature: 'Mature Beastmaster Companion; you have multiple animal companions'
feats.archetype.beastmaster.lead-the-pack.name: 'Lead the Pack'
feats.archetype.beastmaster.lead-the-pack.description: 'Two companions can be active at once; commanding them, one acts twice or each Strides or Strikes once.'
archetypes.beastmaster.name: 'Beastmaster'
archetypes.beastmaster.description: 'You keep company with animals, and they fight at your side.'
feats.archetype.blessed-one.blessed-one-dedication.name: 'Blessed One Dedication'
feats.archetype.blessed-one.blessed-one-dedication.description: 'You gain the lay on hands devotion spell and a Focus Point, divine, cast with Charisma, trained in spell attacks and spell DCs. You Refocus by meditating.'
feats.archetype.blessed-one.blessed-sacrifice.prerequisites.blessed-one-dedication: 'Blessed One Dedication'
feats.archetype.blessed-one.blessed-sacrifice.name: 'Blessed Sacrifice'
feats.archetype.blessed-one.blessed-sacrifice.description: "You gain the protector's sacrifice domain spell as a devotion spell."
feats.archetype.blessed-one.blessed-spell.prerequisites.blessed-one-dedication: 'Blessed One Dedication'
feats.archetype.blessed-one.blessed-spell.prerequisites.mercy: 'Mercy'
feats.archetype.blessed-one.blessed-spell.prerequisites.slots: 'Ability to cast spells from spell slots'
feats.archetype.blessed-one.blessed-spell.name: 'Blessed Spell'
feats.archetype.blessed-one.blessed-spell.description: 'One action, concentrate, spellshape; once per 10 minutes. If your next action casts a spell from a slot targeting only one ally, also try to counteract a condition your Mercy could remove from it.'
feats.archetype.blessed-one.blessed-denial.prerequisites.blessed-one-dedication: 'Blessed One Dedication'
feats.archetype.blessed-one.blessed-denial.name: 'Blessed Denial'
feats.archetype.blessed-one.blessed-denial.description: "Reaction. Trigger: an ally within 30 feet would become frightened, drained, enfeebled, sickened or stupefied. Reduce that condition's value by 1."
archetypes.blessed-one.name: 'Blessed One'
archetypes.blessed-one.description: "A deity's touch lets you ease the suffering of others."
feats.archetype.bounty-hunter.bounty-hunter-dedication.name: 'Bounty Hunter Dedication'
feats.archetype.bounty-hunter.bounty-hunter-dedication.description: "You gain Hunt Prey, and can designate prey you've only heard or read about, or while Gathering Information about it, with +2 circumstance to Gather Information about your prey. If you already have Hunt Prey, you gain Monster Hunter too."
feats.archetype.bounty-hunter.posse.prerequisites.bounty-hunter-dedication: 'Bounty Hunter Dedication'
feats.archetype.bounty-hunter.posse.name: 'Posse'
feats.archetype.bounty-hunter.posse.description: 'Exploration. Requirement: you have prey. Spend a minute guiding up to five willing allies: they get +1 circumstance to Seek, Track and Gather Information about your prey, and you and they +1 to initiative against it, until you pick new prey or it dies.'
feats.archetype.bounty-hunter.tools-of-the-trade.prerequisites.bounty-hunter-dedication: 'Bounty Hunter Dedication'
feats.archetype.bounty-hunter.tools-of-the-trade.name: 'Tools of the Trade'
feats.archetype.bounty-hunter.tools-of-the-trade.description: 'You treat the bola, sap and whip as simple weapons, deal 1d4 more precision damage with them in nonlethal Strikes against off-guard prey, and take no penalty for nonlethal attacks with lethal weapons.'
feats.archetype.bounty-hunter.keep-pace.prerequisites.bounty-hunter-dedication: 'Bounty Hunter Dedication'
feats.archetype.bounty-hunter.keep-pace.name: 'Keep Pace'
feats.archetype.bounty-hunter.keep-pace.description: 'Reaction. Trigger: your prey in reach moves away. Stride (or another Speed) with it, keeping it in reach.'
feats.archetype.bounty-hunter.opportunistic-grapple.prerequisites.bounty-hunter-dedication: 'Bounty Hunter Dedication'
feats.archetype.bounty-hunter.opportunistic-grapple.name: 'Opportunistic Grapple'
feats.archetype.bounty-hunter.opportunistic-grapple.description: 'Reaction. Trigger: your prey critically fails a melee Strike against you. Grapple it.'
archetypes.bounty-hunter.name: 'Bounty Hunter'
archetypes.bounty-hunter.description: 'You hunt down wanted creatures and bring them in.'
feats.archetype.cavalier.cavalier-dedication.prerequisites.nature-or-society: 'Trained in Nature or Society'
feats.archetype.cavalier.cavalier-dedication.name: 'Cavalier Dedication'
feats.archetype.cavalier.cavalier-dedication.description: 'You gain a young animal companion with the mount ability, at least one size larger than you. Having pledged to a cause, you can take a second dedication tied to it before completing this archetype, as the GM allows.'
feats.archetype.cavalier.cavaliers-banner.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.cavaliers-banner.name: "Cavalier's Banner"
feats.archetype.cavalier.cavaliers-banner.description: "Your mount flies your pledge's banner: you and allies within 30 feet of it get +1 circumstance to Will saves and DCs against fear; if it's lost, they become frightened 1."
feats.archetype.cavalier.cavaliers-charge.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.cavaliers-charge.name: "Cavalier's Charge"
feats.archetype.cavalier.cavaliers-charge.description: "Two actions, flourish. Requirement: you're riding. Your mount Strides twice, and once during it you Strike one enemy with a +1 circumstance bonus."
feats.archetype.cavalier.impressive-mount.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.impressive-mount.name: 'Impressive Mount'
feats.archetype.cavalier.impressive-mount.description: 'Your mount becomes a mature companion.'
feats.archetype.cavalier.quick-mount.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.quick-mount.prerequisites.nature: 'Expert in Nature'
feats.archetype.cavalier.quick-mount.name: 'Quick Mount'
feats.archetype.cavalier.quick-mount.description: 'One action. Mount an adjacent willing creature and Command it.'
feats.archetype.cavalier.defend-mount.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.defend-mount.name: 'Defend Mount'
feats.archetype.cavalier.defend-mount.description: 'Reaction. Trigger: an enemy attacks your mount while you ride it. Use your defense instead, and take its effects if it hits.'
feats.archetype.cavalier.mounted-shield.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.mounted-shield.name: 'Mounted Shield'
feats.archetype.cavalier.mounted-shield.description: 'Raising a shield while mounted gives your mount its bonus too, and your Shield Block can protect your mount.'
feats.archetype.cavalier.incredible-mount.prerequisites.impressive-mount: 'Impressive Mount'
feats.archetype.cavalier.incredible-mount.name: 'Incredible Mount'
feats.archetype.cavalier.incredible-mount.description: 'Your mount becomes nimble or savage.'
feats.archetype.cavalier.trampling-charge.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.trampling-charge.name: 'Trampling Charge'
feats.archetype.cavalier.trampling-charge.description: "Three actions, flourish. Your mount moves up to twice its Speed through foes' spaces, dealing one of its melee Strikes' damage to each (basic Reflex against its Athletics DC; off-guard on a critical failure)."
feats.archetype.cavalier.unseat.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.unseat.name: 'Unseat'
feats.archetype.cavalier.unseat.description: "One action. Requirement: you're riding and wielding a jousting weapon. Strike a mounted creature; on a hit, Athletics against its Fortitude DC knocks it off its mount (prone on a critical success)."
feats.archetype.cavalier.specialized-mount.prerequisites.incredible-mount: 'Incredible Mount'
feats.archetype.cavalier.specialized-mount.name: 'Specialized Mount'
feats.archetype.cavalier.specialized-mount.description: 'Your mount gains a specialization. You can take this feat up to three times.'
feats.archetype.cavalier.legendary-rider.prerequisites.cavalier-dedication: 'Cavalier Dedication'
feats.archetype.cavalier.legendary-rider.name: 'Legendary Rider'
feats.archetype.cavalier.legendary-rider.description: "While riding your mount you're quickened, the extra action only to Command it."
archetypes.cavalier.name: 'Cavalier'
archetypes.cavalier.description: 'You ride a trained mount into battle.'
feats.archetype.celebrity.celebrity-dedication.name: 'Celebrity Dedication'
feats.archetype.celebrity.celebrity-dedication.description: 'You gain the Upstage reaction, and a +1 circumstance bonus to Earn Income with a task above your level.'
feats.archetype.celebrity.never-tire.prerequisites.celebrity-dedication: 'Celebrity Dedication'
feats.archetype.celebrity.never-tire.name: 'Never Tire'
feats.archetype.celebrity.never-tire.description: 'Reaction. Trigger: you would become fatigued while three or more non-enemies watch you. Delay it for a minute or until the audience leaves.'
feats.archetype.celebrity.mesmerizing-gaze.prerequisites.celebrity-dedication: 'Celebrity Dedication'
feats.archetype.celebrity.mesmerizing-gaze.name: 'Mesmerizing Gaze'
feats.archetype.celebrity.mesmerizing-gaze.description: 'Two actions, visual. A creature that sees you must succeed at a Will save against your class or spell DC or be fascinated by you until the end of your next turn; it is then immune for a day.'
feats.archetype.celebrity.command-attention.prerequisites.celebrity-dedication: 'Celebrity Dedication'
feats.archetype.celebrity.command-attention.name: 'Command Attention'
feats.archetype.celebrity.command-attention.description: 'One action, aura. Until the end of your next turn, creatures within 30 feet get one degree better against other visual effects; enemies focusing a visual effect must save to target anyone but you; allies there can Hide without cover.'
archetypes.celebrity.name: 'Celebrity'
archetypes.celebrity.description: 'You live for an audience and outshine any rival.'
feats.archetype.dandy.dandy-dedication.prerequisites.diplomacy: 'Trained in Diplomacy'
feats.archetype.dandy.dandy-dedication.name: 'Dandy Dedication'
feats.archetype.dandy.dandy-dedication.description: 'You become trained in Deception and Society (expert in any you already were), and gain the Influence Rumor downtime activity.'
feats.archetype.dandy.distracting-flattery.prerequisites.dandy-dedication: 'Dandy Dedication'
feats.archetype.dandy.distracting-flattery.prerequisites.deception: 'Expert in Deception'
feats.archetype.dandy.distracting-flattery.name: 'Distracting Flattery'
feats.archetype.dandy.distracting-flattery.description: "Reaction. Trigger: an ally's behavior would lower a target's attitude. Deception against its Will DC: on a success it doesn't; on a critical failure it drops a step further toward you. It is then immune for 10 minutes."
feats.archetype.dandy.gossip-lore.prerequisites.dandy-dedication: 'Dandy Dedication'
feats.archetype.dandy.gossip-lore.name: 'Gossip Lore'
feats.archetype.dandy.gossip-lore.description: "You are trained in Gossip Lore, usable only to Recall Knowledge on any topic, with Dubious Knowledge's benefit; expert if you are legendary in Society."
feats.archetype.dandy.fabricated-connections.prerequisites.dandy-dedication: 'Dandy Dedication'
feats.archetype.dandy.fabricated-connections.prerequisites.deception: 'Master in Deception'
feats.archetype.dandy.fabricated-connections.name: 'Fabricated Connections'
feats.archetype.dandy.fabricated-connections.description: 'You can roll Deception instead of the usual skill to Make an Impression or Request (once a day) or to Earn Income or Subsist (once a week).'
feats.archetype.dandy.party-crasher.prerequisites.dandy-dedication: 'Dandy Dedication'
feats.archetype.dandy.party-crasher.prerequisites.society: 'Master in Society'
feats.archetype.dandy.party-crasher.name: 'Party Crasher'
feats.archetype.dandy.party-crasher.description: "In 1d4 hours you can get yourself and allies into a social event you'd be refused, as long as it has staff or guests."
archetypes.dandy.name: 'Dandy'
archetypes.dandy.description: 'You know fashion, manners and every rumor that matters.'
feats.archetype.dual-weapon-warrior.dual-weapon-warrior-dedication.name: 'Dual-Weapon Warrior Dedication'
feats.archetype.dual-weapon-warrior.dual-weapon-warrior-dedication.description: 'You gain the fighter feat Double Slice.'
feats.archetype.dual-weapon-warrior.dual-thrower.prerequisites.dual-weapon-warrior-dedication: 'Dual-Weapon Warrior Dedication'
feats.archetype.dual-weapon-warrior.dual-thrower.name: 'Dual Thrower'
feats.archetype.dual-weapon-warrior.dual-thrower.description: "Your dual-weapon warrior feats' melee Strikes can be ranged Strikes with thrown or one-handed ranged weapons."
feats.archetype.dual-weapon-warrior.dual-weapon-reload.prerequisites.dual-weapon-warrior-dedication: 'Dual-Weapon Warrior Dedication'
feats.archetype.dual-weapon-warrior.dual-weapon-reload.name: 'Dual-Weapon Reload'
feats.archetype.dual-weapon-warrior.dual-weapon-reload.description: 'Wielding two one-handed weapons, you can reload a one-handed ranged weapon without a free hand.'
feats.archetype.dual-weapon-warrior.flensing-slice.prerequisites.dual-weapon-warrior-dedication: 'Dual-Weapon Warrior Dedication'
feats.archetype.dual-weapon-warrior.flensing-slice.name: 'Flensing Slice'
feats.archetype.dual-weapon-warrior.flensing-slice.description: 'One action. Requirement: both attacks of your last Double Slice hit. The target takes 1d8 persistent bleed per weapon die of your weapon with the most dice (up to 4d8), is off-guard and has its physical resistances reduced by 5 until your next turn.'
feats.archetype.dual-weapon-warrior.flensing-slice.actions.flensing-slice.name: 'Flensing Slice'
feats.archetype.dual-weapon-warrior.flensing-slice.actions.flensing-slice.params.dice.name: 'Weapon damage dice'
feats.archetype.dual-weapon-warrior.flensing-slice.actions.flensing-slice.results.flensed.name: 'Flensed'
feats.archetype.dual-weapon-warrior.dual-weapon-blitz.prerequisites.dual-weapon-warrior-dedication: 'Dual-Weapon Warrior Dedication'
feats.archetype.dual-weapon-warrior.dual-weapon-blitz.name: 'Dual-Weapon Blitz'
feats.archetype.dual-weapon-warrior.dual-weapon-blitz.description: 'Two actions. Requirement: two one-handed melee weapons. Stride, Striking once with each weapon at any point.'
feats.archetype.dual-weapon-warrior.dual-onslaught.prerequisites.dual-weapon-warrior-dedication: 'Dual-Weapon Warrior Dedication'
feats.archetype.dual-weapon-warrior.dual-onslaught.name: 'Dual Onslaught'
feats.archetype.dual-weapon-warrior.dual-onslaught.description: "If both Strikes of Double Slice miss, one of them (not a critical failure) still applies a hit's effects."
archetypes.dual-weapon-warrior.name: 'Dual-Weapon Warrior'
archetypes.dual-weapon-warrior.description: 'You fight with a weapon in each hand.'
feats.archetype.duelist.duelist-dedication.prerequisites.trained: 'Trained in light armor and simple weapons'
feats.archetype.duelist.duelist-dedication.name: 'Duelist Dedication'
feats.archetype.duelist.duelist-dedication.description: 'You gain Quick Draw.'
feats.archetype.duelist.duelists-challenge.prerequisites.duelist-dedication: 'Duelist Dedication'
feats.archetype.duelist.duelists-challenge.name: "Duelist's Challenge"
feats.archetype.duelist.duelists-challenge.description: "One action. Challenge an enemy you can see until it's defeated, flees or the encounter ends: your hits on it with a single one-handed melee weapon (other hands free) deal a circumstance bonus to damage equal to the weapon's dice; against others, the same as a penalty."
feats.archetype.duelist.selfless-parry.prerequisites.dueling-parry-fighter: 'Dueling Parry (Fighter)'
feats.archetype.duelist.selfless-parry.prerequisites.duelist-dedication: 'Duelist Dedication'
feats.archetype.duelist.selfless-parry.name: 'Selfless Parry'
feats.archetype.duelist.selfless-parry.description: 'With Dueling Parry, adjacent allies get +1 circumstance to AC; Dueling Riposte can answer a critical miss against an adjacent ally.'
feats.archetype.duelist.student-of-the-dueling-arts.prerequisites.duelist-dedication: 'Duelist Dedication'
feats.archetype.duelist.student-of-the-dueling-arts.name: 'Student of the Dueling Arts'
feats.archetype.duelist.student-of-the-dueling-arts.description: 'During daily preparations you can swap duelist feats for others you qualify for, and enter a duelist stance you lack with one more action.'
archetypes.duelist.name: 'Duelist'
archetypes.duelist.description: 'You challenge a single foe and best it, blade to blade.'
feats.archetype.eldritch-archer.eldritch-archer-dedication.prerequisites.bow-expert: 'Expert in at least one weapon of the bow or crossbow group'
feats.archetype.eldritch-archer.eldritch-archer-dedication.name: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.eldritch-archer-dedication.description: "If you don't already cast from slots, you cast spontaneous spells: a repertoire with one cantrip that needs a spell attack, of a tradition you choose, trained in spell attacks and spell DCs, with Charisma. You gain Eldritch Shot: cast a 1- or 2-action spell attack spell into your bow and Strike, the spell using the Strike's roll and hitting with it."
feats.archetype.eldritch-archer.eldritch-archer-dedication.choices.tradition.prompt: 'Tradition'
feats.archetype.eldritch-archer.eldritch-archer-dedication.choices.tradition.options.arcane.name: 'Arcane'
feats.archetype.eldritch-archer.eldritch-archer-dedication.choices.tradition.options.divine.name: 'Divine'
feats.archetype.eldritch-archer.eldritch-archer-dedication.choices.tradition.options.occult.name: 'Occult'
feats.archetype.eldritch-archer.eldritch-archer-dedication.choices.tradition.options.primal.name: 'Primal'
feats.archetype.eldritch-archer.basic-eldritch-archer-spellcasting.prerequisites.eldritch-archer-dedication: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.basic-eldritch-archer-spellcasting.name: 'Basic Eldritch Archer Spellcasting'
feats.archetype.eldritch-archer.basic-eldritch-archer-spellcasting.description: 'You gain the basic spellcasting benefits, adding a spell of your tradition to your repertoire for each new rank of slot.'
feats.archetype.eldritch-archer.enchanting-shot.prerequisites.eldritch-archer-dedication: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.enchanting-shot.name: 'Enchanting Shot'
feats.archetype.eldritch-archer.enchanting-shot.description: 'Two actions, magical. Make a bow or crossbow Strike: a hit deals 2d6 more mental damage (3d6 with a greater striking rune, 4d6 with a major one), and a critical hit also stuns 1.'
feats.archetype.eldritch-archer.enchanting-shot.actions.enchanting-shot.name: 'Enchanting Shot'
feats.archetype.eldritch-archer.enchanting-shot.actions.enchanting-shot.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.eldritch-archer.magic-ammunition.prerequisites.eldritch-archer-dedication: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.magic-ammunition.name: 'Magic Ammunition'
feats.archetype.eldritch-archer.magic-ammunition.description: 'Choose three common magical ammunition of 4th level or lower; once a round you can turn a plain arrow or bolt into one of them, to shoot before your turn ends. You can take this feat again for three more.'
feats.archetype.eldritch-archer.precious-ammunition.prerequisites.eldritch-archer-dedication: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.precious-ammunition.name: 'Precious Ammunition'
feats.archetype.eldritch-archer.precious-ammunition.description: 'One action, magical. A piece of ammunition counts as cold iron or silver (adamantine from 14th level) if you shoot it this turn.'
feats.archetype.eldritch-archer.eldritch-reload.prerequisites.eldritch-archer-dedication: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.eldritch-reload.name: 'Eldritch Reload'
feats.archetype.eldritch-archer.eldritch-reload.description: 'Free action. Requirement: your last action this turn was Eldritch Shot, a spell from a slot or activating magical ammunition. Reload a weapon you wield.'
feats.archetype.eldritch-archer.expert-eldritch-archer-spellcasting.prerequisites.basic-eldritch-archer-spellcasting: 'Basic Eldritch Archer Spellcasting'
feats.archetype.eldritch-archer.expert-eldritch-archer-spellcasting.name: 'Expert Eldritch Archer Spellcasting'
feats.archetype.eldritch-archer.expert-eldritch-archer-spellcasting.description: 'You gain the expert spellcasting benefits.'
feats.archetype.eldritch-archer.homing-shot.prerequisites.eldritch-archer-dedication: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.homing-shot.name: 'Homing Shot'
feats.archetype.eldritch-archer.homing-shot.description: 'One action, magical. Make a bow or crossbow Strike at a foe you can see that goes around corners, ignoring concealment and cover.'
feats.archetype.eldritch-archer.homing-shot.actions.homing-shot.name: 'Homing Shot'
feats.archetype.eldritch-archer.homing-shot.actions.homing-shot.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.eldritch-archer.incorporeal-shot.prerequisites.eldritch-archer-dedication: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.incorporeal-shot.name: 'Incorporeal Shot'
feats.archetype.eldritch-archer.incorporeal-shot.description: "One action, magical; once a day. Make a bow or crossbow Strike that passes through mundane barriers, ignoring cover, concealment, hiding and shields' circumstance bonuses, with a +4 status bonus against armored targets."
feats.archetype.eldritch-archer.fatal-shot.prerequisites.eldritch-archer-dedication: 'Eldritch Archer Dedication'
feats.archetype.eldritch-archer.fatal-shot.name: 'Fatal Shot'
feats.archetype.eldritch-archer.fatal-shot.description: 'Three actions, magical; once a day. Make a bow or crossbow Strike: a hit deals 10d10 more precision damage, and a critical hit forces a Fortitude save against your class or spell DC (death, incapacitation) or the target dies.'
feats.archetype.eldritch-archer.fatal-shot.actions.fatal-shot.name: 'Fatal Shot'
feats.archetype.eldritch-archer.fatal-shot.actions.fatal-shot.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.eldritch-archer.master-eldritch-archer-spellcasting.prerequisites.expert-eldritch-archer-spellcasting: 'Expert Eldritch Archer Spellcasting'
feats.archetype.eldritch-archer.master-eldritch-archer-spellcasting.name: 'Master Eldritch Archer Spellcasting'
feats.archetype.eldritch-archer.master-eldritch-archer-spellcasting.description: 'You gain the master spellcasting benefits.'
archetypes.eldritch-archer.name: 'Eldritch Archer'
archetypes.eldritch-archer.description: 'You weave spells into your arrows and bolts.'
feats.archetype.familiar-master.familiar-master-dedication.name: 'Familiar Master Dedication'
feats.archetype.familiar-master.familiar-master-dedication.description: 'You gain a familiar; if you already have one, you gain Enhanced Familiar.'
feats.archetype.familiar-master.familiar-mascot.prerequisites.familiar-master-dedication: 'Familiar Master Dedication'
feats.archetype.familiar-master.familiar-mascot.name: 'Familiar Mascot'
feats.archetype.familiar-master.familiar-mascot.description: 'When choosing master abilities, you can give each one to an ally instead.'
feats.archetype.familiar-master.familiar-conduit.prerequisites.familiar-master-dedication: 'Familiar Master Dedication'
feats.archetype.familiar-master.familiar-conduit.prerequisites.spellcaster: 'able to cast spells'
feats.archetype.familiar-master.familiar-conduit.name: 'Familiar Conduit'
feats.archetype.familiar-master.familiar-conduit.description: 'One action, spellshape. Requirement: line of effect to your familiar. Your next spell with a range originates from your familiar.'
feats.archetype.familiar-master.improved-familiar.prerequisites.familiar-master-dedication: 'Familiar Master Dedication'
feats.archetype.familiar-master.improved-familiar.name: 'Improved Familiar'
feats.archetype.familiar-master.improved-familiar.description: 'A specific familiar needs two fewer abilities for you.'
feats.archetype.familiar-master.mutable-familiar.prerequisites.familiar-master-dedication: 'Familiar Master Dedication'
feats.archetype.familiar-master.mutable-familiar.name: 'Mutable Familiar'
feats.archetype.familiar-master.mutable-familiar.description: "A 10-minute activity swaps some of your familiar's daily abilities for others."
feats.archetype.familiar-master.incredible-familiar.prerequisites.enhanced-familiar: 'Enhanced Familiar'
feats.archetype.familiar-master.incredible-familiar.name: 'Incredible Familiar (Familiar Master)'
feats.archetype.familiar-master.incredible-familiar.description: 'You choose six familiar or master abilities a day instead of four.'
archetypes.familiar-master.name: 'Familiar Master'
archetypes.familiar-master.description: 'You share a magical bond with a familiar.'
feats.archetype.gladiator.gladiator-dedication.prerequisites.impressive-performance: 'Impressive Performance'
feats.archetype.gladiator.gladiator-dedication.name: 'Gladiator Dedication'
feats.archetype.gladiator.gladiator-dedication.description: 'You gain Additional Lore for Gladiatorial Lore (another Lore if you have it). With spectators, a fight starts with temporary Hit Points equal to your level for a minute, and you can roll Performance for initiative.'
feats.archetype.gladiator.fancy-moves.prerequisites.gladiator-dedication: 'Gladiator Dedication'
feats.archetype.gladiator.fancy-moves.prerequisites.performance: 'Expert in Performance'
feats.archetype.gladiator.fancy-moves.name: 'Fancy Moves'
feats.archetype.gladiator.fancy-moves.description: 'You can Demoralize with Performance.'
feats.archetype.gladiator.play-to-the-crowd.prerequisites.gladiator-dedication: 'Gladiator Dedication'
feats.archetype.gladiator.play-to-the-crowd.name: 'Play to the Crowd'
feats.archetype.gladiator.play-to-the-crowd.description: 'Reaction. Trigger: you drop a foe to 0 Hit Points before spectators. A Performance check grants one (two on a critical success): temporary Hit Points equal to your level, +1 circumstance to AC, or +1 circumstance to your next attack.'
feats.archetype.gladiator.stage-fighting.prerequisites.gladiator-dedication: 'Gladiator Dedication'
feats.archetype.gladiator.stage-fighting.name: 'Stage Fighting'
feats.archetype.gladiator.stage-fighting.description: 'No penalty for nonlethal attacks with lethal weapons or unarmed attacks.'
feats.archetype.gladiator.performative-weapons-training.prerequisites.gladiator-dedication: 'Gladiator Dedication'
feats.archetype.gladiator.performative-weapons-training.name: 'Performative Weapons Training'
feats.archetype.gladiator.performative-weapons-training.description: 'You treat the bo staff, spiked chain, sword cane, trident, war flail and whip (and the dueling cape) as simple weapons and get their critical specialization effects.'
feats.archetype.gladiator.call-your-shot.prerequisites.play-to-the-crowd: 'Play to the Crowd'
feats.archetype.gladiator.call-your-shot.name: 'Call Your Shot'
feats.archetype.gladiator.call-your-shot.description: 'Playing to the Crowd can also make a creature within 30 feet frightened 2.'
archetypes.gladiator.name: 'Gladiator'
archetypes.gladiator.description: 'You fight for the crowd, and the crowd loves you.'
feats.archetype.herbalist.herbalist-dedication.prerequisites.natural-medicine: 'Natural Medicine'
feats.archetype.herbalist.herbalist-dedication.prerequisites.nature: 'Trained in Nature'
feats.archetype.herbalist.herbalist-dedication.name: 'Herbalist Dedication'
feats.archetype.herbalist.herbalist-dedication.description: "You gain advanced alchemy for 4 healing consumables a day (2 if you didn't prepare in the wild), your herbal items, whose formulas you remember. You become an expert in Nature and can Craft healing alchemical items with it and healer's tools."
feats.archetype.herbalist.fresh-ingredients.prerequisites.herbalist-dedication: 'Herbalist Dedication'
feats.archetype.herbalist.fresh-ingredients.name: 'Fresh Ingredients'
feats.archetype.herbalist.fresh-ingredients.description: 'Treating Wounds with Natural Medicine always gets the +2 for fresh ingredients (+4 in the wild).'
feats.archetype.herbalist.poultice-preparation.prerequisites.herbalist-dedication: 'Herbalist Dedication'
feats.archetype.herbalist.poultice-preparation.name: 'Poultice Preparation'
feats.archetype.herbalist.poultice-preparation.description: 'An herbal elixir can be a poultice (oil, one-handed Interact) that also allows a flat check against one persistent acid, bleed or fire damage.'
feats.archetype.herbalist.advanced-herbalism.prerequisites.herbalist-dedication: 'Herbalist Dedication'
feats.archetype.herbalist.advanced-herbalism.prerequisites.nature: 'Expert in Nature'
feats.archetype.herbalist.advanced-herbalism.name: 'Advanced Herbalism'
feats.archetype.herbalist.advanced-herbalism.description: 'You make 6 herbal items a day (8 if you take this feat again at 10th level).'
feats.archetype.herbalist.endemic-herbs.prerequisites.herbalist-dedication: 'Herbalist Dedication'
feats.archetype.herbalist.endemic-herbs.prerequisites.survival: 'Trained in Survival'
feats.archetype.herbalist.endemic-herbs.name: 'Endemic Herbs'
feats.archetype.herbalist.endemic-herbs.description: 'Your herbal items grant a benefit for where you made them (aquatic +1 Fortitude, arctic and desert weather, forest +2 against disease and poison, mountain +1 Reflex, plains +1 Will, swamp ends a persistent bleed, underground +1 Perception).'
archetypes.herbalist.name: 'Herbalist'
archetypes.herbalist.description: 'You make remedies from the plants around you.'
feats.archetype.linguist.linguist-dedication.prerequisites.languages: 'You speak at least three languages'
feats.archetype.linguist.linguist-dedication.name: 'Linguist Dedication'
feats.archetype.linguist.linguist-dedication.description: 'You become trained in Society (an expert if you already were) and gain Multilingual twice.'
feats.archetype.linguist.multilingual-cipher.prerequisites.linguist-dedication: 'Linguist Dedication'
feats.archetype.linguist.multilingual-cipher.prerequisites.society: 'Expert in Society'
feats.archetype.linguist.multilingual-cipher.name: 'Multilingual Cipher'
feats.archetype.linguist.multilingual-cipher.description: 'You get +1 circumstance to Decipher Writing; others take −2 to decipher your codes unless they speak every language you used.'
feats.archetype.linguist.phonetic-training.prerequisites.linguist-dedication: 'Linguist Dedication'
feats.archetype.linguist.phonetic-training.prerequisites.society: 'Expert in Society'
feats.archetype.linguist.phonetic-training.name: 'Phonetic Training'
feats.archetype.linguist.phonetic-training.description: "You can repeat and phonetically transcribe words you don't understand."
feats.archetype.linguist.spot-translate.prerequisites.linguist-dedication: 'Linguist Dedication'
feats.archetype.linguist.spot-translate.name: 'Spot Translate'
feats.archetype.linguist.spot-translate.description: 'Reaction. Trigger: a creature within 60 feet uses a linguistic effect in a language you know. It also counts as another language you know.'
feats.archetype.linguist.analyze-idiolect.prerequisites.linguist-dedication: 'Linguist Dedication'
feats.archetype.linguist.analyze-idiolect.prerequisites.deception: 'Expert in Deception'
feats.archetype.linguist.analyze-idiolect.prerequisites.society: 'Expert in Society'
feats.archetype.linguist.analyze-idiolect.name: 'Analyze Idiolect'
feats.archetype.linguist.analyze-idiolect.description: 'After 10 minutes with someone, you get +4 circumstance to Impersonate them.'
feats.archetype.linguist.read-shibboleths.prerequisites.linguist-dedication: 'Linguist Dedication'
feats.archetype.linguist.read-shibboleths.prerequisites.society: 'Master in Society'
feats.archetype.linguist.read-shibboleths.name: 'Read Shibboleths'
feats.archetype.linguist.read-shibboleths.description: 'After 10 minutes with someone, you learn a minor fact about their background and gain +1 circumstance to Diplomacy and Deception with them.'
feats.archetype.linguist.crude-communication.prerequisites.linguist-dedication: 'Linguist Dedication'
feats.archetype.linguist.crude-communication.name: 'Crude Communication'
feats.archetype.linguist.crude-communication.description: 'After 10 minutes, a secret Society check lets you exchange basic ideas with a creature without a shared language (automatically as legendary).'
archetypes.linguist.name: 'Linguist'
archetypes.linguist.description: 'Languages come easily to you, and you read people through them.'
feats.archetype.marshal.marshal-dedication.prerequisites.diplomacy-or-intimidation: 'Trained in Diplomacy or Intimidation'
feats.archetype.marshal.marshal-dedication.prerequisites.martial: 'Trained in martial weapons'
feats.archetype.marshal.marshal-dedication.name: 'Marshal Dedication'
feats.archetype.marshal.marshal-dedication.description: "Choose Diplomacy or Intimidation: you become trained in it (an expert if you already were). While conscious you have a 15-foot marshal's aura (emotion, mental, visual) giving you and allies in it a +1 status bonus to saves against fear."
feats.archetype.marshal.marshal-dedication.choices.skill.prompt: 'Diplomacy or Intimidation'
feats.archetype.marshal.dread-marshal-stance.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.dread-marshal-stance.prerequisites.intimidation: 'Trained in Intimidation'
feats.archetype.marshal.dread-marshal-stance.name: 'Dread Marshal Stance'
feats.archetype.marshal.dread-marshal-stance.description: "One action, stance. Intimidation against an easy DC of your level: on a success your aura gives a +1 status bonus to damage (or your weapon's dice), and critical hits in it frighten the enemy 1; a critical failure locks you out for a minute."
feats.archetype.marshal.inspiring-marshal-stance.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.inspiring-marshal-stance.prerequisites.diplomacy: 'Trained in Diplomacy'
feats.archetype.marshal.inspiring-marshal-stance.name: 'Inspiring Marshal Stance'
feats.archetype.marshal.inspiring-marshal-stance.description: 'One action, stance. Diplomacy against an easy DC of your level: on a success your aura gives a +1 status bonus to attack rolls and saves against mental effects.'
feats.archetype.marshal.snap-out-of-it.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.snap-out-of-it.name: 'Snap Out of It!'
feats.archetype.marshal.snap-out-of-it.description: 'One action. An ally in your aura under a mental effect of up to a minute that allowed a Will save saves again with +1, ending it on a success; it is then immune for 10 minutes.'
feats.archetype.marshal.steel-yourself.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.steel-yourself.name: 'Steel Yourself!'
feats.archetype.marshal.steel-yourself.description: 'One action. An ally in your aura gains temporary Hit Points equal to your Charisma modifier and +2 circumstance to Fortitude saves until your next turn.'
feats.archetype.marshal.cadence-call.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.cadence-call.name: 'Cadence Call'
feats.archetype.marshal.cadence-call.description: 'One action, flourish; once a minute. Willing allies in your aura are quickened until the end of their next turn, the action only to Stride; one that uses it is slowed 1 after.'
feats.archetype.marshal.rallying-charge.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.rallying-charge.name: 'Rallying Charge'
feats.archetype.marshal.rallying-charge.description: 'Two actions. Stride and make a melee Strike; if it damages, allies within 60 feet who saw it gain temporary Hit Points equal to your Charisma modifier until your next turn.'
feats.archetype.marshal.back-to-back.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.back-to-back.name: 'Back to Back'
feats.archetype.marshal.back-to-back.description: "Adjacent allies aren't off-guard from flanking unless you are flanked too, and the same for you beside an ally."
feats.archetype.marshal.to-battle.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.to-battle.name: 'To Battle!'
feats.archetype.marshal.to-battle.description: 'One or two actions. An ally in your aura with a reaction can Stride (one action) or Strike (two) with it.'
feats.archetype.marshal.topple-foe.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.topple-foe.prerequisites.athletics: 'Trained in Athletics'
feats.archetype.marshal.topple-foe.name: 'Topple Foe'
feats.archetype.marshal.topple-foe.description: 'Reaction. Trigger: an ally hits an enemy you are both adjacent to. Trip it.'
feats.archetype.marshal.coordinated-charge.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.coordinated-charge.name: 'Coordinated Charge'
feats.archetype.marshal.coordinated-charge.description: 'Two actions, flourish. Stride and make a melee Strike; if it damages, allies within 60 feet who saw it can Stride toward the foe as a reaction.'
feats.archetype.marshal.tactical-cadence.prerequisites.cadence-call: 'Cadence Call'
feats.archetype.marshal.tactical-cadence.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.tactical-cadence.name: 'Tactical Cadence'
feats.archetype.marshal.tactical-cadence.description: "Cadence Call's extra action can Strike too, and doesn't slow allies after."
feats.archetype.marshal.target-of-opportunity.prerequisites.marshal-dedication: 'Marshal Dedication'
feats.archetype.marshal.target-of-opportunity.name: 'Target of Opportunity'
feats.archetype.marshal.target-of-opportunity.description: 'Reaction. Trigger: an ally hits a ranged Strike at a foe in your first range increment. Make a ranged Strike at it at −2, outside your multiple attack penalty, combining damage for resistances.'
archetypes.marshal.name: 'Marshal'
archetypes.marshal.description: 'You lead allies in battle, steadying them with word and example.'
feats.archetype.martial-artist.martial-artist-dedication.name: 'Martial Artist Dedication'
feats.archetype.martial-artist.martial-artist-dedication.description: 'Your fist deals 1d6, and you take no penalty for lethal attacks with nonlethal unarmed attacks.'
feats.archetype.martial-artist.follow-up-strike.prerequisites.martial-artist-dedication: 'Martial Artist Dedication'
feats.archetype.martial-artist.follow-up-strike.name: 'Follow-up Strike'
feats.archetype.martial-artist.follow-up-strike.description: 'One action, flourish. Requirement: your last action was a missed melee unarmed Strike. Strike again with a melee unarmed attack at the same multiple attack penalty.'
feats.archetype.martial-artist.follow-up-strike.actions.follow-up-strike.name: 'Follow-up Strike'
feats.archetype.martial-artist.follow-up-strike.actions.follow-up-strike.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.martial-artist.grievous-blow.prerequisites.martial-artist-dedication: 'Martial Artist Dedication'
feats.archetype.martial-artist.grievous-blow.name: 'Grievous Blow'
feats.archetype.martial-artist.grievous-blow.description: 'Two actions, flourish. Make an unarmed melee Strike dealing two more weapon dice (three from 18th level) and ignoring physical resistance up to your level; it counts as two attacks.'
feats.archetype.martial-artist.grievous-blow.actions.grievous-blow.name: 'Grievous Blow'
feats.archetype.martial-artist.grievous-blow.actions.grievous-blow.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.martial-artist.path-of-iron.prerequisites.martial-artist-dedication: 'Martial Artist Dedication'
feats.archetype.martial-artist.path-of-iron.name: 'Path of Iron'
feats.archetype.martial-artist.path-of-iron.description: 'Three actions, flourish; once a minute. Stride without triggering reactions, Striking up to three different enemies along the way, the penalty rising only after all.'
archetypes.martial-artist.name: 'Martial Artist'
archetypes.martial-artist.description: 'You have trained your body as a weapon.'
feats.archetype.mauler.mauler-dedication.prerequisites.str: 'Strength +2'
feats.archetype.mauler.mauler-dedication.name: 'Mauler Dedication'
feats.archetype.mauler.mauler-dedication.description: 'You treat martial melee weapons needing two hands (or with two-hand) as simple and advanced ones as martial, and get their critical specialization as an expert.'
feats.archetype.mauler.clear-the-way.prerequisites.mauler-dedication: 'Mauler Dedication'
feats.archetype.mauler.clear-the-way.name: 'Clear the Way'
feats.archetype.mauler.clear-the-way.description: 'Two actions. Requirement: a melee weapon in two hands. Shove up to five adjacent creatures (no free hand needed), then Stride half your Speed without reactions from those you Shoved; the penalty rises only after all.'
feats.archetype.mauler.shoving-sweep.prerequisites.mauler-dedication: 'Mauler Dedication'
feats.archetype.mauler.shoving-sweep.prerequisites.athletics: 'Expert in Athletics'
feats.archetype.mauler.shoving-sweep.name: 'Shoving Sweep'
feats.archetype.mauler.shoving-sweep.description: 'Reaction. Trigger: an enemy in reach leaves a square while moving. Shove it (no free hand needed); it keeps moving unless you critically succeed.'
feats.archetype.mauler.hammer-quake.prerequisites.mauler-dedication: 'Mauler Dedication'
feats.archetype.mauler.hammer-quake.name: 'Hammer Quake'
feats.archetype.mauler.hammer-quake.description: 'Three actions, flourish. Strike an enemy in a square in reach, then Trip every enemy in that square and adjacent ones; three attacks, the penalty rising only after all.'
feats.archetype.mauler.avalanche-strike.prerequisites.mauler-dedication: 'Mauler Dedication'
feats.archetype.mauler.avalanche-strike.name: 'Avalanche Strike'
feats.archetype.mauler.avalanche-strike.description: 'Three actions, flourish. Strike every enemy in reach with your two-handed weapon, the penalty rising only after all.'
archetypes.mauler.name: 'Mauler'
archetypes.mauler.description: 'You swing heavy two-handed weapons that smash through foes.'
feats.archetype.medic.medic-dedication.prerequisites.battle-medicine: 'Battle Medicine'
feats.archetype.medic.medic-dedication.prerequisites.medicine: 'Trained in Medicine'
feats.archetype.medic.medic-dedication.name: 'Medic Dedication'
feats.archetype.medic.medic-dedication.description: 'You become an expert in Medicine. Your Battle Medicine and Treat Wounds heal 5 more Hit Points at DC 20, 10 at DC 30 and 15 at DC 40. Once a day (once an hour as a master) you can use Battle Medicine on a creature immune to it.'
feats.archetype.medic.doctors-visitation.prerequisites.medic-dedication: 'Medic Dedication'
feats.archetype.medic.doctors-visitation.name: "Doctor's Visitation"
feats.archetype.medic.doctors-visitation.description: 'One or two actions, flourish. Stride, then Battle Medicine or Treat Poison (one action), or Administer First Aid or Treat Condition (two).'
feats.archetype.medic.treat-condition.prerequisites.medic-dedication: 'Medic Dedication'
feats.archetype.medic.treat-condition.name: 'Treat Condition'
feats.archetype.medic.treat-condition.description: "Two actions. Try to counteract an adjacent creature's clumsy, enfeebled or sickened with Medicine: reduce it by 2 on a critical success, 1 on a success, raise it by 1 on a critical failure."
feats.archetype.medic.holistic-care.prerequisites.treat-condition: 'Treat Condition'
feats.archetype.medic.holistic-care.prerequisites.diplomacy: 'Trained in Diplomacy'
feats.archetype.medic.holistic-care.name: 'Holistic Care'
feats.archetype.medic.holistic-care.description: 'Treat Condition also reduces frightened, stupefied and stunned (with a value).'
feats.archetype.medic.resuscitate.prerequisites.medic-dedication: 'Medic Dedication'
feats.archetype.medic.resuscitate.prerequisites.medicine: 'Legendary in Medicine'
feats.archetype.medic.resuscitate.name: 'Resuscitate'
feats.archetype.medic.resuscitate.description: "Three actions. A DC 40 Medicine check revives a creature dead for at most 3 rounds with raise dead's effects, wounded 1 higher; it is then immune for a day."
archetypes.medic.name: 'Medic'
archetypes.medic.description: 'You keep your companions alive in the thick of battle.'
feats.archetype.pirate.pirate-dedication.prerequisites.intimidation: 'Trained in Intimidation'
feats.archetype.pirate.pirate-dedication.name: 'Pirate Dedication'
feats.archetype.pirate.pirate-dedication.description: "You gain Additional Lore for Sailing Lore or a coastal city's Lore, ignore difficult terrain from unsteady ground, and gain Boarding Assault: Stride twice or swing on a rope (Acrobatics, usually DC 20), then Strike, with one more weapon die if you boarded or left a vessel."
feats.archetype.pirate.pirate-combat-training.prerequisites.pirate-dedication: 'Pirate Dedication'
feats.archetype.pirate.pirate-combat-training.name: 'Pirate Combat Training'
feats.archetype.pirate.pirate-combat-training.description: 'You gain Combat Climber or Underwater Marauder without their prerequisites, treat the hatchet, rapier, scimitar and whip as simple weapons, and from 5th level get their critical specialization.'
feats.archetype.pirate.pirate-combat-training.choices.feat.prompt: 'Combat Climber or Underwater Marauder'
feats.archetype.pirate.rope-runner.prerequisites.pirate-dedication: 'Pirate Dedication'
feats.archetype.pirate.rope-runner.prerequisites.acrobatics: 'Trained in Acrobatics'
feats.archetype.pirate.rope-runner.prerequisites.athletics: 'Trained in Athletics'
feats.archetype.pirate.rope-runner.name: 'Rope Runner'
feats.archetype.pirate.rope-runner.description: "You have a 15-foot climb Speed on ropes and rigging; a success to Climb or Balance is a critical success, and you aren't off-guard on ropes."
feats.archetype.pirate.walk-the-plank.prerequisites.pirate-dedication: 'Pirate Dedication'
feats.archetype.pirate.walk-the-plank.name: 'Walk the Plank'
feats.archetype.pirate.walk-the-plank.description: 'Two actions. Demoralize a foe; on a success you also make it Stride its Speed along a path you choose (into danger only on a critical success). It is then immune for 10 minutes.'
archetypes.pirate.name: 'Pirate'
archetypes.pirate.description: 'You sail the seas, board ships and take what you want.'
feats.archetype.poisoner.poisoner-dedication.prerequisites.crafting: 'Trained in Crafting'
feats.archetype.poisoner.poisoner-dedication.name: 'Poisoner Dedication'
feats.archetype.poisoner.poisoner-dedication.description: 'You gain advanced alchemy for four alchemical poisons a day, whose formulas you remember.'
feats.archetype.poisoner.poisoners-twist.prerequisites.poisoner-dedication: 'Poisoner Dedication'
feats.archetype.poisoner.poisoners-twist.prerequisites.medicine: 'Trained in Medicine'
feats.archetype.poisoner.poisoners-twist.name: "Poisoner's Twist"
feats.archetype.poisoner.poisoners-twist.description: "One action. Requirement: your last action was a damaging melee Strike against a creature afflicted by a poison you know. It takes 1d6 damage of the Strike's type and 1d6 poison (2d6 each from 18th level)."
feats.archetype.poisoner.poisoners-twist.actions.poisoners-twist.name: "Poisoner's Twist"
feats.archetype.poisoner.poisoners-twist.actions.poisoners-twist.results.dealt.name: 'Damage dealt'
feats.archetype.poisoner.advanced-poisoncraft.prerequisites.poisoner-dedication: 'Poisoner Dedication'
feats.archetype.poisoner.advanced-poisoncraft.name: 'Advanced Poisoncraft'
feats.archetype.poisoner.advanced-poisoncraft.description: 'You make 6 poisons a day (8 if you take this feat again at 10th).'
feats.archetype.poisoner.poison-coat.prerequisites.poisoner-dedication: 'Poisoner Dedication'
feats.archetype.poisoner.poison-coat.name: 'Poison Coat'
feats.archetype.poisoner.poison-coat.description: "Brush a contact or injury poison into your clothing (one at a time) to gain Once Bitten: when an adjacent creature hits you with an unarmed Strike, it's exposed to the poison."
feats.archetype.poisoner.acquired-tolerance.prerequisites.poisoner-dedication: 'Poisoner Dedication'
feats.archetype.poisoner.acquired-tolerance.name: 'Acquired Tolerance'
feats.archetype.poisoner.acquired-tolerance.description: 'Reaction, fortune. Trigger: you fail a save against a poison. Reroll it; you can use this again only against the same poison until your next preparations.'
feats.archetype.poisoner.chemical-contagion.prerequisites.poisoner-dedication: 'Poisoner Dedication'
feats.archetype.poisoner.chemical-contagion.name: 'Chemical Contagion'
feats.archetype.poisoner.chemical-contagion.description: "You gain the toxicologist's greater field discovery: your injury poisons can spray onto creatures."
archetypes.poisoner.name: 'Poisoner'
archetypes.poisoner.description: 'You keep toxins close at hand and know how to use them.'
feats.archetype.ritualist.ritualist-dedication.prerequisites.skill: 'Expert in Arcana, Nature, Occultism or Religion'
feats.archetype.ritualist.ritualist-dedication.name: 'Ritualist Dedication'
feats.archetype.ritualist.ritualist-dedication.description: 'You gain a +2 circumstance bonus to checks to perform a ritual. You learn two uncommon rituals of 2nd rank or lower, two more at 8th level and every 4 levels after (of up to half the level), which only you can lead.'
feats.archetype.ritualist.flexible-ritualist.prerequisites.ritualist-dedication: 'Ritualist Dedication'
feats.archetype.ritualist.flexible-ritualist.name: 'Flexible Ritualist'
feats.archetype.ritualist.flexible-ritualist.description: 'You can stand in for one secondary caster of a ritual you lead, making its check.'
feats.archetype.ritualist.resourceful-ritualist.prerequisites.ritualist-dedication: 'Ritualist Dedication'
feats.archetype.ritualist.resourceful-ritualist.name: 'Resourceful Ritualist'
feats.archetype.ritualist.resourceful-ritualist.description: "You can attempt a ritual's checks one proficiency rank below what it requires."
feats.archetype.ritualist.efficient-rituals.prerequisites.ritualist-dedication: 'Ritualist Dedication'
feats.archetype.ritualist.efficient-rituals.name: 'Efficient Rituals'
feats.archetype.ritualist.efficient-rituals.description: 'A day-long ritual takes 4 hours, longer ones half the days; from 14th level days become hours.'
feats.archetype.ritualist.assured-ritualist.prerequisites.flexible-ritualist: 'Flexible Ritualist'
feats.archetype.ritualist.assured-ritualist.name: 'Assured Ritualist'
feats.archetype.ritualist.assured-ritualist.description: 'Fortune. As primary caster, improve one failed secondary check by one degree.'
feats.archetype.ritualist.enterprising-ritualist.prerequisites.ritualist-dedication: 'Ritualist Dedication'
feats.archetype.ritualist.enterprising-ritualist.name: 'Enterprising Ritualist'
feats.archetype.ritualist.enterprising-ritualist.description: "Rituals' gold costs drop by 10% for you, 20% on a critical success."
archetypes.ritualist.name: 'Ritualist'
archetypes.ritualist.description: 'You have mastered the difficult art of rituals.'
feats.archetype.scout.scout-dedication.prerequisites.stealth: 'Trained in Stealth'
feats.archetype.scout.scout-dedication.prerequisites.survival: 'Trained in Survival'
feats.archetype.scout.scout-dedication.name: 'Scout Dedication'
feats.archetype.scout.scout-dedication.description: 'You can Scout while you Avoid Notice, and your Scout bonus to initiative is +2.'
feats.archetype.scout.scouts-charge.prerequisites.scout-dedication: 'Scout Dedication'
feats.archetype.scout.scouts-charge.name: "Scout's Charge"
feats.archetype.scout.scouts-charge.description: 'Two actions, flourish. Stride, Feint an enemy (with Stealth if you like), then Strike it.'
feats.archetype.scout.terrain-scout.prerequisites.scout-dedication: 'Scout Dedication'
feats.archetype.scout.terrain-scout.name: 'Terrain Scout'
feats.archetype.scout.terrain-scout.choices.terrain.prompt: 'Second terrain'
feats.archetype.scout.terrain-scout.choices.terrain.options.rubble.name: 'Rubble'
feats.archetype.scout.terrain-scout.choices.terrain.options.snow.name: 'Snow'
feats.archetype.scout.terrain-scout.choices.terrain.options.underbrush.name: 'Underbrush'
feats.archetype.scout.terrain-scout.description: 'You gain Terrain Stalker twice, for two terrains, and can share one with an ally following you.'
feats.archetype.scout.fleeting-shadow.prerequisites.scout-dedication: 'Scout Dedication'
feats.archetype.scout.fleeting-shadow.name: 'Fleeting Shadow'
feats.archetype.scout.fleeting-shadow.description: 'Two actions, flourish. Hide, then Sneak twice.'
feats.archetype.scout.scouts-speed.prerequisites.scout-dedication: 'Scout Dedication'
feats.archetype.scout.scouts-speed.name: "Scout's Speed"
feats.archetype.scout.scouts-speed.description: 'You gain a +10-foot status bonus to Speed (+20 for travel speed).'
feats.archetype.scout.scouts-pounce.prerequisites.scout-dedication: 'Scout Dedication'
feats.archetype.scout.scouts-pounce.name: "Scout's Pounce"
feats.archetype.scout.scouts-pounce.description: "Two actions, flourish. Requirement: hidden from or undetected by every foe and not within 10 feet of one. Stride, then Strike twice, the target off-guard if it didn't notice you."
archetypes.scout.name: 'Scout'
archetypes.scout.description: 'You range ahead, unseen, and warn your companions of danger.'
feats.archetype.scroll-trickster.scroll-trickster-dedication.prerequisites.skill: 'Trained in Arcana, Nature, Occultism or Religion'
feats.archetype.scroll-trickster.scroll-trickster-dedication.name: 'Scroll Trickster Dedication'
feats.archetype.scroll-trickster.scroll-trickster-dedication.description: 'You gain Trick Magic Item, with a +2 circumstance bonus to Trick scrolls; a critical failure to Trick a scroll is a failure.'
feats.archetype.scroll-trickster.basic-scroll-cache.prerequisites.scroll-trickster-dedication: 'Scroll Trickster Dedication'
feats.archetype.scroll-trickster.basic-scroll-cache.name: 'Basic Scroll Cache'
feats.archetype.scroll-trickster.basic-scroll-cache.description: "Each day you make a temporary scroll of a 1st-rank spell (and a 2nd-rank one from 8th level) you can access, of a tradition whose skill you're trained in."
feats.archetype.scroll-trickster.skim-scroll.prerequisites.scroll-trickster-dedication: 'Scroll Trickster Dedication'
feats.archetype.scroll-trickster.skim-scroll.name: 'Skim Scroll'
feats.archetype.scroll-trickster.skim-scroll.description: 'One action. Draw a scroll and Trick it.'
feats.archetype.scroll-trickster.expert-scroll-cache.prerequisites.basic-scroll-cache: 'Basic Scroll Cache'
feats.archetype.scroll-trickster.expert-scroll-cache.name: 'Expert Scroll Cache'
feats.archetype.scroll-trickster.expert-scroll-cache.description: 'Your daily scrolls add a 3rd-rank spell, a 4th-rank one at 14th level and a 5th-rank one at 16th.'
feats.archetype.scroll-trickster.master-scroll-cache.prerequisites.expert-scroll-cache: 'Expert Scroll Cache'
feats.archetype.scroll-trickster.master-scroll-cache.name: 'Master Scroll Cache'
feats.archetype.scroll-trickster.master-scroll-cache.description: 'Your daily scrolls add a 6th-rank spell, and a 7th-rank one at 20th level.'
archetypes.scroll-trickster.name: 'Scroll Trickster'
archetypes.scroll-trickster.description: 'You coax magic out of scrolls whatever your training.'
feats.archetype.scrounger.scrounger-dedication.prerequisites.crafting: 'Trained in Crafting'
feats.archetype.scrounger.scrounger-dedication.name: 'Scrounger Dedication'
feats.archetype.scrounger.scrounger-dedication.description: 'You Craft without tools or a workshop and memorize your formulas. You gain Cobble Together: in 10 minutes, a temporary shoddy item (common, mundane, half your level or lower) lasting 1d4 hours, made for one creature who ignores its shoddiness.'
feats.archetype.scrounger.reverse-engineering.prerequisites.scrounger-dedication: 'Scrounger Dedication'
feats.archetype.scrounger.reverse-engineering.prerequisites.crafting: 'Expert in Crafting'
feats.archetype.scrounger.reverse-engineering.name: 'Reverse Engineering'
feats.archetype.scrounger.reverse-engineering.description: "You get +2 circumstance to reverse engineer a formula, after one day's setup; a critical success also rebuilds the item."
feats.archetype.scrounger.magical-scrounger.prerequisites.magical-crafting: 'Magical Crafting'
feats.archetype.scrounger.magical-scrounger.prerequisites.scrounger-dedication: 'Scrounger Dedication'
feats.archetype.scrounger.magical-scrounger.name: 'Magical Scrounger'
feats.archetype.scrounger.magical-scrounger.description: 'Once a day, Cobble Together a temporary common magic item you hold or wear, of half your level or lower.'
feats.archetype.scrounger.expert-disassembly.prerequisites.scrounger-dedication: 'Scrounger Dedication'
feats.archetype.scrounger.expert-disassembly.prerequisites.crafting: 'Master in Crafting'
feats.archetype.scrounger.expert-disassembly.name: 'Expert Disassembly'
feats.archetype.scrounger.expert-disassembly.description: 'You can use Crafting instead of Thievery to Disable a Device or Pick a Lock.'
archetypes.scrounger.name: 'Scrounger'
archetypes.scrounger.description: 'You build what you need from whatever is at hand.'
feats.archetype.sentinel.sentinel-dedication.name: 'Sentinel Dedication'
feats.archetype.sentinel.sentinel-dedication.description: 'You become trained in light and medium armor (and heavy armor if you already had both). Your armor proficiency rises with any other armor expertise a class gives you.'
feats.archetype.sentinel.steel-skin.prerequisites.sentinel-dedication: 'Sentinel Dedication'
feats.archetype.sentinel.steel-skin.prerequisites.survival: 'Trained in Survival'
feats.archetype.sentinel.steel-skin.name: 'Steel Skin'
feats.archetype.sentinel.steel-skin.description: "You can rest normally in medium armor, and in heavy armor once you're a master in heavy armor."
feats.archetype.sentinel.armor-specialist.prerequisites.sentinel-dedication: 'Sentinel Dedication'
feats.archetype.sentinel.armor-specialist.name: 'Armor Specialist'
feats.archetype.sentinel.armor-specialist.description: "You gain the armor specialization effects of every armor you're proficient with."
feats.archetype.sentinel.armored-rebuff.prerequisites.sentinel-dedication: 'Sentinel Dedication'
feats.archetype.sentinel.armored-rebuff.name: 'Armored Rebuff'
feats.archetype.sentinel.armored-rebuff.description: "Reaction. Trigger: an adjacent enemy critically fails a melee Strike against you while you wear medium or heavy armor. Shove it without a free hand (you don't follow)."
feats.archetype.sentinel.mighty-bulwark.prerequisites.sentinel-dedication: 'Sentinel Dedication'
feats.archetype.sentinel.mighty-bulwark.name: 'Mighty Bulwark'
feats.archetype.sentinel.mighty-bulwark.description: "Your armor's bulwark trait gives +4 instead of +3, and on every Reflex save, not only against damaging effects."
archetypes.sentinel.name: 'Sentinel'
archetypes.sentinel.description: 'You make the most of your armor.'
feats.archetype.snarecrafter.snarecrafter-dedication.prerequisites.crafting: 'Trained in Crafting'
feats.archetype.snarecrafter.snarecrafter-dedication.name: 'Snarecrafter Dedication'
feats.archetype.snarecrafter.snarecrafter-dedication.description: "You gain Snare Crafting; your snares' save DCs use your class DC if higher, and 1-minute snares take 3 Interact actions. Each day you prepare four snares (six as a master in Crafting, eight as legendary) at no cost, and gain three snare formulas at each new Crafting rank."
feats.archetype.snarecrafter.surprise-snare.prerequisites.snarecrafter-dedication: 'Snarecrafter Dedication'
feats.archetype.snarecrafter.surprise-snare.name: 'Surprise Snare'
feats.archetype.snarecrafter.surprise-snare.description: "Three actions. Install a prepared snare in an enemy's space; it triggers at once."
feats.archetype.snarecrafter.remote-trigger.prerequisites.snarecrafter-dedication: 'Snarecrafter Dedication'
feats.archetype.snarecrafter.remote-trigger.name: 'Remote Trigger'
feats.archetype.snarecrafter.remote-trigger.description: 'You can Strike a snare to trigger it (automatically one you made).'
feats.archetype.snarecrafter.giant-snare.prerequisites.snarecrafter-dedication: 'Snarecrafter Dedication'
feats.archetype.snarecrafter.giant-snare.name: 'Giant Snare'
feats.archetype.snarecrafter.giant-snare.description: 'A prepared snare can be giant, 10 by 10 feet, costing two of your daily snares.'
feats.archetype.snarecrafter.lightning-snares.prerequisites.snarecrafter-dedication: 'Snarecrafter Dedication'
feats.archetype.snarecrafter.lightning-snares.prerequisites.crafting: 'Master in Crafting'
feats.archetype.snarecrafter.lightning-snares.name: 'Lightning Snares'
feats.archetype.snarecrafter.lightning-snares.description: 'A 1-minute snare takes a single Interact action.'
feats.archetype.snarecrafter.plentiful-snares.prerequisites.snarecrafter-dedication: 'Snarecrafter Dedication'
feats.archetype.snarecrafter.plentiful-snares.name: 'Plentiful Snares'
feats.archetype.snarecrafter.plentiful-snares.description: 'You prepare twice as many snares a day.'
archetypes.snarecrafter.name: 'Snarecrafter'
archetypes.snarecrafter.description: 'You lay snares and traps faster than anyone.'
feats.archetype.talisman-dabbler.talisman-dabbler-dedication.name: 'Talisman Dabbler Dedication'
feats.archetype.talisman-dabbler.talisman-dabbler-dedication.description: 'You can craft talismans and know every common talisman formula of your level or lower. Each day you make two temporary talismans of up to half your level, whose DCs use your class or spell DC if higher, and you can affix or remove four talismans in 10 minutes.'
feats.archetype.talisman-dabbler.quick-fix.prerequisites.talisman-dabbler-dedication: 'Talisman Dabbler Dedication'
feats.archetype.talisman-dabbler.quick-fix.name: 'Quick Fix'
feats.archetype.talisman-dabbler.quick-fix.description: 'You gain Rapid Affixture, affixing up to four talismans a minute, and its 3-action activity from 12th level.'
feats.archetype.talisman-dabbler.deeper-dabbler.prerequisites.talisman-dabbler-dedication: 'Talisman Dabbler Dedication'
feats.archetype.talisman-dabbler.deeper-dabbler.prerequisites.retake-level: 'Taken again: 14th level'
feats.archetype.talisman-dabbler.deeper-dabbler.name: 'Deeper Dabbler'
feats.archetype.talisman-dabbler.deeper-dabbler.description: 'You make two more temporary talismans a day; you can take this feat again at 14th level.'
feats.archetype.talisman-dabbler.talismanic-sage.prerequisites.talisman-dabbler-dedication: 'Talisman Dabbler Dedication'
feats.archetype.talisman-dabbler.talismanic-sage.name: 'Talismanic Sage'
feats.archetype.talisman-dabbler.talismanic-sage.description: 'One item you treat can have two active talismans at once.'
archetypes.talisman-dabbler.name: 'Talisman Dabbler'
archetypes.talisman-dabbler.description: 'You make and use talismans, even makeshift ones.'
feats.archetype.vigilante.vigilante-dedication.prerequisites.deception: 'Trained in Deception'
feats.archetype.vigilante.vigilante-dedication.name: 'Vigilante Dedication'
feats.archetype.vigilante.vigilante-dedication.description: 'You have a social and a vigilante identity. Discerning the other takes a Perception check against 20 + your Deception proficiency bonus, and changing identity takes a minute out of sight. Your class and vigilante feats belong to the vigilante identity.'
feats.archetype.vigilante.hidden-magic.prerequisites.vigilante-dedication: 'Vigilante Dedication'
feats.archetype.vigilante.hidden-magic.prerequisites.magic-skill: 'Expert in Arcana, Nature, Occultism or Religion'
feats.archetype.vigilante.hidden-magic.name: 'Hidden Magic'
feats.archetype.vigilante.hidden-magic.description: 'During daily preparations your magic items can appear mundane; detect magic or read aura needs a Perception check against your Deception DC to see through it.'
feats.archetype.vigilante.minion-guise.prerequisites.vigilante-dedication: 'Vigilante Dedication'
feats.archetype.vigilante.minion-guise.prerequisites.deception: 'Expert in Deception; an animal companion or familiar'
feats.archetype.vigilante.minion-guise.name: 'Minion Guise'
feats.archetype.vigilante.minion-guise.description: 'Your companion or familiar takes a social identity too.'
feats.archetype.vigilante.safe-house.prerequisites.vigilante-dedication: 'Vigilante Dedication'
feats.archetype.vigilante.safe-house.name: 'Safe House'
feats.archetype.vigilante.safe-house.description: 'You set up a hidden safe house (two 10-foot cubes, more with Deception rank) shielded by veil of privacy.'
feats.archetype.vigilante.social-purview.prerequisites.vigilante-dedication: 'Vigilante Dedication'
feats.archetype.vigilante.social-purview.name: 'Social Purview'
feats.archetype.vigilante.social-purview.description: 'Choose an archetype you qualify for: you gain its dedication and can take its feats even before completing this archetype, as part of your social identity.'
feats.archetype.vigilante.startling-appearance.prerequisites.vigilante-dedication: 'Vigilante Dedication'
feats.archetype.vigilante.startling-appearance.name: 'Startling Appearance'
feats.archetype.vigilante.startling-appearance.description: "One action, emotion, fear, mental. Requirement: the target hasn't noticed you. Strike it while it's off-guard; on a hit it stays off-guard this turn and is frightened 1 (2 on a critical hit)."
feats.archetype.vigilante.startling-appearance.actions.startling-appearance.name: 'Startling Appearance'
feats.archetype.vigilante.startling-appearance.actions.startling-appearance.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.vigilante.quick-change.prerequisites.vigilante-dedication: 'Vigilante Dedication'
feats.archetype.vigilante.quick-change.prerequisites.deception: 'Master in Deception'
feats.archetype.vigilante.quick-change.name: 'Quick Change'
feats.archetype.vigilante.quick-change.description: 'Changing identity takes three actions (one as legendary in Deception).'
feats.archetype.vigilante.subjective-truth.prerequisites.vigilante-dedication: 'Vigilante Dedication'
feats.archetype.vigilante.subjective-truth.prerequisites.deception: 'Master in Deception'
feats.archetype.vigilante.subjective-truth.name: 'Subjective Truth'
feats.archetype.vigilante.subjective-truth.description: "What's true for your current identity fools magic that reveals lies."
feats.archetype.vigilante.many-guises.prerequisites.vigilante-dedication: 'Vigilante Dedication'
feats.archetype.vigilante.many-guises.prerequisites.deception: 'Master in Deception'
feats.archetype.vigilante.many-guises.name: 'Many Guises'
feats.archetype.vigilante.many-guises.description: 'You can take a nondescript ordinary identity instead, which detection magic needs a counteract check against your Deception DC to see past.'
feats.archetype.vigilante.frightening-appearance.prerequisites.startling-appearance: 'Startling Appearance'
feats.archetype.vigilante.frightening-appearance.prerequisites.intimidation: 'Expert in Intimidation'
feats.archetype.vigilante.frightening-appearance.name: 'Frightening Appearance'
feats.archetype.vigilante.frightening-appearance.description: "Startling Appearance also lets you Demoralize each enemy within 10 feet that hadn't noticed you."
feats.archetype.vigilante.stunning-appearance.prerequisites.startling-appearance: 'Startling Appearance'
feats.archetype.vigilante.stunning-appearance.name: 'Stunning Appearance'
feats.archetype.vigilante.stunning-appearance.description: "Startling Appearance's hit also stuns an enemy of your level or lower 1 (2 on a critical hit)."
archetypes.vigilante.name: 'Vigilante'
archetypes.vigilante.description: 'You lead a double life, one identity hiding the other.'
feats.archetype.viking.viking-dedication.prerequisites.athletics: 'Trained in Athletics'
feats.archetype.viking.viking-dedication.name: 'Viking Dedication'
feats.archetype.viking.viking-dedication.description: 'You gain Additional Lore for Sailing Lore and for Warfare Lore, ignore difficult terrain from shallow water, and a success to Swim is a critical success.'
feats.archetype.viking.hurling-charge.prerequisites.viking-dedication: 'Viking Dedication'
feats.archetype.viking.hurling-charge.name: 'Hurling Charge'
feats.archetype.viking.hurling-charge.description: "Two actions. Make a thrown ranged Strike, Stride, then draw a weapon without triggering reactions; raging and ending beside a foe, it's off-guard to your next Strike with it."
feats.archetype.viking.viking-weapon-familiarity.prerequisites.viking-dedication: 'Viking Dedication'
feats.archetype.viking.viking-weapon-familiarity.name: 'Viking Weapon Familiarity'
feats.archetype.viking.viking-weapon-familiarity.description: 'You gain Shield Block and treat the battle axe, hatchet, longsword, shield boss, shield spikes and shortsword as simple weapons, with critical specialization from 5th level.'
feats.archetype.viking.second-shield.prerequisites.viking-dedication: 'Viking Dedication'
feats.archetype.viking.second-shield.name: 'Second Shield'
feats.archetype.viking.second-shield.description: 'Free action. Trigger: your Shield Block breaks or destroys your shield. Draw another shield, or an object as an improvised one.'
feats.archetype.viking.into-the-fray.prerequisites.viking-dedication: 'Viking Dedication'
feats.archetype.viking.into-the-fray.name: 'Into the Fray'
feats.archetype.viking.into-the-fray.description: 'Two actions. Leap, Stride or Swim, Striking two different enemies on the way, one with your weapon and one with your shield, the penalty rising after both.'
archetypes.viking.name: 'Viking'
archetypes.viking.description: 'You raid from the sea with axe and shield.'
feats.archetype.weapon-improviser.weapon-improviser-dedication.prerequisites.martial: 'Trained in martial weapons'
feats.archetype.weapon-improviser.weapon-improviser-dedication.name: 'Weapon Improviser Dedication'
feats.archetype.weapon-improviser.weapon-improviser-dedication.description: 'You take no penalty with improvised weapons, whose damage die is at least 1d6 (1d4 if agile).'
feats.archetype.weapon-improviser.improvised-pummel.prerequisites.weapon-improviser-dedication: 'Weapon Improviser Dedication'
feats.archetype.weapon-improviser.improvised-pummel.name: 'Improvised Pummel'
feats.archetype.weapon-improviser.improvised-pummel.description: 'Improvised weapon Strikes get +1 item bonus (+2 from 12th) and two weapon dice (three from 16th); a critical hit breaks the object.'
feats.archetype.weapon-improviser.surprise-strike.prerequisites.weapon-improviser-dedication: 'Weapon Improviser Dedication'
feats.archetype.weapon-improviser.surprise-strike.name: 'Surprise Strike'
feats.archetype.weapon-improviser.surprise-strike.description: "A creature that hasn't seen you fight with improvised weapons is off-guard to your first such Strike."
feats.archetype.weapon-improviser.improvised-critical.prerequisites.weapon-improviser-dedication: 'Weapon Improviser Dedication'
feats.archetype.weapon-improviser.improvised-critical.name: 'Improvised Critical'
feats.archetype.weapon-improviser.improvised-critical.description: 'Your improvised weapons get a critical specialization effect the GM picks.'
feats.archetype.weapon-improviser.makeshift-strike.prerequisites.weapon-improviser-dedication: 'Weapon Improviser Dedication'
feats.archetype.weapon-improviser.makeshift-strike.name: 'Makeshift Strike'
feats.archetype.weapon-improviser.makeshift-strike.description: 'One action. Pick up an object in reach and Strike with it as an improvised weapon.'
feats.archetype.weapon-improviser.shattering-strike.prerequisites.improvised-pummel: 'Improvised Pummel'
feats.archetype.weapon-improviser.shattering-strike.name: 'Shattering Strike (Weapon Improviser)'
feats.archetype.weapon-improviser.shattering-strike.description: "Reaction. Trigger: Improvised Pummel's critical hit breaks your weapon. It shatters, dealing 3d6 more piercing damage (not doubled)."
archetypes.weapon-improviser.name: 'Weapon Improviser'
archetypes.weapon-improviser.description: 'Anything you pick up is a weapon in your hands.'
feats.archetype.wrestler.wrestler-dedication.prerequisites.athletics: 'Trained in Athletics'
feats.archetype.wrestler.wrestler-dedication.name: 'Wrestler Dedication'
feats.archetype.wrestler.wrestler-dedication.description: 'You become an expert in Athletics and gain Titan Wrestler. You take no penalty for lethal attacks with nonlethal unarmed attacks, and get +2 circumstance to your Fortitude DC against being Grappled or Swallowed Whole.'
feats.archetype.wrestler.disengaging-twist.prerequisites.wrestler-dedication: 'Wrestler Dedication'
feats.archetype.wrestler.disengaging-twist.name: 'Disengaging Twist'
feats.archetype.wrestler.disengaging-twist.description: 'Reaction. Trigger: a creature grabs or restrains you. Escape with Athletics at +2 circumstance.'
feats.archetype.wrestler.elbow-breaker.prerequisites.wrestler-dedication: 'Wrestler Dedication'
feats.archetype.wrestler.elbow-breaker.name: 'Elbow Breaker'
feats.archetype.wrestler.elbow-breaker.description: 'One action. Requirement: you have a creature grabbed or restrained. Make an unarmed melee Strike against it: a critical hit knocks a held item out of its grasp; a hit loosens its grip (+2 to Disarm it, −2 to its checks with the item).'
feats.archetype.wrestler.elbow-breaker.actions.elbow-breaker.name: 'Elbow Breaker'
feats.archetype.wrestler.elbow-breaker.actions.elbow-breaker.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.wrestler.suplex.prerequisites.wrestler-dedication: 'Wrestler Dedication'
feats.archetype.wrestler.suplex.name: 'Suplex'
feats.archetype.wrestler.suplex.description: 'One action. Requirement: you have a creature grabbed or restrained. Make an unarmed melee Strike against it: on a hit it lands prone (and takes 2d6 more bludgeoning on a critical hit). You release it either way.'
feats.archetype.wrestler.suplex.actions.suplex.name: 'Suplex'
feats.archetype.wrestler.suplex.actions.suplex.steps.weapon.prompt: 'Choose a weapon'
feats.archetype.wrestler.clinch-strike.prerequisites.wrestler-dedication: 'Wrestler Dedication'
feats.archetype.wrestler.clinch-strike.name: 'Clinch Strike'
feats.archetype.wrestler.clinch-strike.description: 'Reaction. Trigger: a creature you grabbed or restrained Escapes. Make an unarmed melee Strike against it.'
feats.archetype.wrestler.clinch-strike.actions.clinch-strike.name: 'Clinch Strike'
feats.archetype.wrestler.clinch-strike.actions.clinch-strike.steps.weapon.prompt: 'Choose a weapon'
