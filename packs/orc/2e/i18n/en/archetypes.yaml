feats.archetype.wrestler.strangle.name: 'Strangle'
feats.archetype.wrestler.strangle.description: "One action. Requirement: you have a creature grabbed or restrained. Make an unarmed melee Strike against it: a hit gets a circumstance bonus to damage equal to the weapon's dice, and it can barely speak until your next turn (DC 10 flat check or lose a spoken action)."
