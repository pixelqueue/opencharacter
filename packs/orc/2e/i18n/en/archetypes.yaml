feats.archetype.wrestler.aerial-piledriver.prerequisites.wrestler-dedication: 'Wrestler Dedication'
feats.archetype.wrestler.aerial-piledriver.name: 'Aerial Piledriver'
feats.archetype.wrestler.aerial-piledriver.description: 'Two actions, attack. Requirement: you have a creature grabbed or restrained. Make an unarmed melee Strike with 1d6 more damage per weapon die: a hit knocks it prone; a miss loses your grip; a critical miss also knocks you prone.'
