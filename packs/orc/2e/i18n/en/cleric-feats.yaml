# Cleric feats to 20th level. Short rules text written for the pack.

feats.cleric.cremate-undead.name: 'Cremate Undead'
feats.cleric.cremate-undead.description: "Undead your heal damages also take persistent fire damage equal to the spell's rank."
feats.cleric.emblazon-energy.name: 'Emblazon Energy'
feats.cleric.emblazon-energy.description: 'Emblazon Armament can instead choose acid, cold, electricity, fire or sonic: on a shield, its bonus applies to saves against that damage and Shield Block works against it (resistance half your level with a matching domain spell); on a weapon, 1d4 more damage of that type (1d6 with a matching domain spell).'
feats.cleric.emblazon-energy.prerequisites.emblazon-armament: 'Emblazon Armament'
feats.cleric.martyr.name: 'Martyr'
feats.cleric.martyr.description: 'One action, spellshape. If your next action casts harm or heal restoring Hit Points to one ally, you lose 1d8 Hit Points per spell rank (unmitigable) and the ally regains that many more.'
feats.cleric.restorative-channel.name: 'Restorative Channel'
feats.cleric.restorative-channel.description: 'You can give up a heal from your font slots to cast cleanse affliction, clear mind, sound body or sure footing at the same rank.'
feats.cleric.restorative-channel.prerequisites.font: 'Healing font'
feats.cleric.sanctify-armament.name: 'Sanctify Armament'
feats.cleric.sanctify-armament.description: 'One action (divine). A weapon you touch gains your holy or unholy trait for 1 round and deals 2d6 more spirit damage to creatures of the opposed trait; a new use ends the last.'
feats.cleric.sanctify-armament.prerequisites.sanctified: 'Holy or unholy trait'
feats.cleric.surging-focus.name: 'Surging Focus'
feats.cleric.surging-focus.description: 'Free action, once a day. Trigger: an ally you can see drops to 0 Hit Points. You regain 1 Focus Point.'
feats.cleric.surging-focus.actions.surging-focus.name: 'Surging Focus'
feats.cleric.surging-focus.actions.surging-focus.results.regained.name: 'A Focus Point'
feats.cleric.void-siphon-cleric.name: 'Void Siphon (Cleric)'
feats.cleric.void-siphon-cleric.description: 'A living creature that critically fails its save against your harm is drained 1.'
feats.cleric.zealous-rush.name: 'Zealous Rush'
feats.cleric.zealous-rush.description: 'Reaction. Trigger: you cast a divine spell of 1 action or more affecting only you or your equipment. Stride up to 10 feet (your full Speed if it took 2 or more actions).'
feats.cleric.castigating-weapon.name: 'Castigating Weapon'
feats.cleric.castigating-weapon.description: "After Divine Castigation deals spirit damage, your Strikes gain your holy or unholy trait and deal spirit damage equal to that heal or harm's rank until the end of your turn."
feats.cleric.castigating-weapon.prerequisites.divine-castigation: 'Divine Castigation'
feats.cleric.heroic-recovery.name: 'Heroic Recovery'
feats.cleric.heroic-recovery.description: 'One action, spellshape. If your next action casts heal on one living creature that regains Hit Points, it gains +5 feet of Speed and +1 to attack and damage rolls (status) until the end of its next turn, and can Stand as a free action without reactions.'
feats.cleric.heroic-recovery.prerequisites.font: 'Healing font'
feats.cleric.replenishment-of-war.name: 'Replenishment of War'
feats.cleric.replenishment-of-war.description: "When you damage a creature with a Strike using your deity's favored weapon, you gain temporary Hit Points equal to half your level (your level on a critical hit) until the start of your next turn."
feats.cleric.replenishment-of-war.prerequisites.favored: 'Expert in your deity’s favored weapon'
feats.cleric.shared-avoidance.name: 'Shared Avoidance'
feats.cleric.shared-avoidance.description: 'Premonition of Avoidance also gives its +2 to allies within 20 feet rolling the same save against the same hazard.'
feats.cleric.shared-avoidance.prerequisites.premonition-of-avoidance: 'Premonition of Avoidance'
feats.cleric.shield-of-faith.name: 'Shield of Faith'
feats.cleric.shield-of-faith.description: 'When you spend a Focus Point on a domain spell, you gain a +1 status bonus to AC until the start of your next turn.'
feats.cleric.shield-of-faith.prerequisites.domain-initiate: 'Domain Initiate'
feats.cleric.defensive-recovery.name: 'Defensive Recovery'
feats.cleric.defensive-recovery.description: 'One action, spellshape. If your next action casts harm or heal on one target that regains Hit Points, it gains a +2 status bonus to AC and saves for 1 round.'
feats.cleric.domain-focus.name: 'Domain Focus'
feats.cleric.domain-focus.description: 'When you Refocus, you refill your focus pool.'
feats.cleric.emblazon-antimagic.name: 'Emblazon Antimagic'
feats.cleric.emblazon-antimagic.description: "Emblazon Armament can instead: on a shield, its bonus applies to saves against magic and Shield Block works against enemies' spells; on a weapon, a critical hit can try to counteract a spell on the target (rank half the wielder's level rounded up), then the symbol fades."
feats.cleric.emblazon-antimagic.prerequisites.emblazon-armament: 'Emblazon Armament'
feats.cleric.fortunate-relief.name: 'Fortunate Relief'
feats.cleric.fortunate-relief.description: 'When your healing spell tries to counteract an effect, roll the counteract check twice and take the higher.'
feats.cleric.sapping-symbol.name: 'Sapping Symbol'
feats.cleric.sapping-symbol.description: "Reaction (divine). Trigger: with your symbol raised, you're about to take damage from a melee attack. Religion against the attacker's Will DC; it's then immune for a minute. **Critical Success** Enfeebled 2 until it spends an action moving away from you. **Success** Enfeebled 1 likewise."
feats.cleric.sapping-symbol.prerequisites.raise-symbol: 'Raise Symbol'
feats.cleric.shared-replenishment.name: 'Shared Replenishment'
feats.cleric.shared-replenishment.description: 'Replenishment of War can give its temporary Hit Points to an ally within 10 feet instead (a different ally each time).'
feats.cleric.shared-replenishment.prerequisites.replenishment-of-war: 'Replenishment of War'
feats.cleric.channeling-block.name: 'Channeling Block'
feats.cleric.channeling-block.description: "When you Shield Block, you can expend a harm or heal to add 1d8 per spell rank to the shield's Hardness for that block."
feats.cleric.channeling-block.prerequisites.shield-block: 'Shield Block'
feats.cleric.deitys-protection.name: "Deity's Protection"
feats.cleric.deitys-protection.description: 'After you cast a domain spell, you have resistance to all damage equal to its rank until the start of your next turn.'
feats.cleric.deitys-protection.prerequisites.advanced-domain: 'Advanced Domain'
feats.cleric.ebb-and-flow.name: 'Ebb and Flow'
feats.cleric.ebb-and-flow.description: 'One action, spellshape. If your next action casts a 1- or 2-action heal or harm, it targets one creature it would harm and another it would heal.'
feats.cleric.ebb-and-flow.prerequisites.versatile-font: 'Versatile Font'
feats.cleric.fast-channel.name: 'Fast Channel'
feats.cleric.fast-channel.description: 'Casting harm or heal (whichever your font allows, both with Versatile Font) with 2 actions gives the 3-action effects.'
feats.cleric.fast-channel.prerequisites.font: 'Harmful font or healing font'
feats.cleric.lasting-armament.name: 'Lasting Armament'
feats.cleric.lasting-armament.description: 'Sanctify Armament lasts 1 hour (until you sanctify another weapon).'
feats.cleric.lasting-armament.prerequisites.sanctify-armament: 'Sanctify Armament'
feats.cleric.premonition-of-clarity.name: 'Premonition of Clarity'
feats.cleric.premonition-of-clarity.description: 'Reaction, fortune, once per hour. Trigger: you fail a save against a mental effect. Reroll it with a +2 circumstance bonus, keeping the new result.'
feats.cleric.swift-banishment.name: 'Swift Banishment'
feats.cleric.swift-banishment.description: 'Reaction. Requirement: you have banishment prepared. Trigger: you critically hit a creature away from its home plane. Expend banishment to affect it without casting; it resists as normal.'
feats.cleric.eternal-bane.name: 'Eternal Bane'
feats.cleric.eternal-bane.description: 'A bane spell (rank half your level rounded up, 15-foot radius) always surrounds you; Dismissed, it returns after 1 minute.'
feats.cleric.eternal-bane.prerequisites.unholy: 'Unholy'
feats.cleric.eternal-blessing.name: 'Eternal Blessing'
feats.cleric.eternal-blessing.description: 'A bless spell (rank half your level rounded up, 15-foot radius) always surrounds you; Dismissed, it returns after 1 minute.'
feats.cleric.eternal-blessing.prerequisites.holy: 'Holy'
feats.cleric.rebounding-smite.name: 'Rebounding Smite'
feats.cleric.rebounding-smite.description: "Reaction. Trigger: your Channel Smite's Strike misses. Cast the 1-action version of the expended harm or heal on another creature."
feats.cleric.rebounding-smite.prerequisites.channel-smite: 'Channel Smite'
feats.cleric.remediate.name: 'Remediate'
feats.cleric.remediate.description: 'Free action, once per hour, spellshape. If your next action casts a 3-action heal or harm from your font, it also tries to counteract one divine effect in its area.'
feats.cleric.resurrectionist.name: 'Resurrectionist'
feats.cleric.resurrectionist.description: 'A dying or dead creature you restore Hit Points to gains fast healing 5 for 1 minute (until knocked out).'
feats.cleric.divine-apex.name: 'Divine Apex'
feats.cleric.divine-apex.description: "After daily preparations you touch a worn magic item without the apex trait: until your next preparations it is an apex item raising one of your deity's divine attributes by 1 or to +4, whichever is higher."
feats.cleric.echoing-channel.name: 'Echoing Channel'
feats.cleric.echoing-channel.description: 'One action, spellshape. If your next action casts a 2-action harm or heal on one creature, another creature in range also gets a free 1-action version at the same rank.'
feats.cleric.improved-swift-banishment.name: 'Improved Swift Banishment'
feats.cleric.improved-swift-banishment.description: 'You can use Swift Banishment by sacrificing any prepared spell of 5th rank or higher, the banishment heightened to its rank, and the target takes a -2 circumstance penalty to its save.'
feats.cleric.improved-swift-banishment.prerequisites.swift-banishment: 'Swift Banishment'
feats.cleric.inviolable.name: 'Inviolable'
feats.cleric.inviolable.description: 'Creatures that hit you with an attack take 3d6 spirit damage each time (with your holy or unholy trait).'
feats.cleric.miraculous-possibility.name: 'Miraculous Possibility'
feats.cleric.miraculous-possibility.description: 'Once during daily preparations a slot holds divine potential: it casts any divine spell you know at least 2 ranks lower, as a spell 2 ranks lower than the slot.'
feats.cleric.shared-clarity.name: 'Shared Clarity'
feats.cleric.shared-clarity.description: 'Premonition of Clarity lets allies within 15 feet who failed the same save against the same mental effect use their reactions to reroll it with +2.'
feats.cleric.shared-clarity.prerequisites.premonition-of-clarity: 'Premonition of Clarity'
feats.cleric.avatars-audience.name: "Avatar's Audience"
feats.cleric.avatars-audience.description: "Creatures know you speak for your deity; your commune ritual with your deity costs nothing and critically succeeds; once a day you can cast interplanar teleport (1 minute, your symbol the key) to your deity's realm, returning with one action."
feats.cleric.avatars-protection.name: "Avatar's Protection"
feats.cleric.avatars-protection.description: 'Reaction. Requirement: you have avatar prepared. Trigger: an enemy critically hits you. You cast avatar; the hit becomes a normal hit, applied after its temporary Hit Points.'
feats.cleric.maker-of-miracles.name: 'Maker of Miracles'
feats.cleric.maker-of-miracles.description: 'You gain one more 10th-rank spell slot.'
feats.cleric.maker-of-miracles.prerequisites.miraculous: 'Miraculous spell'
feats.cleric.spellshape-channel.name: 'Spellshape Channel'
feats.cleric.spellshape-channel.description: 'Free action, concentrate. Use a one-action spellshape action you know that can apply to harm or heal, for those spells only.'
