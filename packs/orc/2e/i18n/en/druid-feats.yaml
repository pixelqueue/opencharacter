# Druid feats to 20th level. Short rules text written for the pack.

feats.druid.deimatic-display.name: 'Deimatic Display'
feats.druid.deimatic-display.description: 'One action. Demoralize each enemy within 30 feet with one Intimidation roll (visual, not auditory, no language penalty): +2 circumstance against animals, fungi and plants, -2 against others. Each is immune for 1 minute.'
feats.druid.deimatic-display.prerequisites.intimidation: 'Trained in Intimidation'
feats.druid.ferocious-shape.name: 'Ferocious Shape'
feats.druid.ferocious-shape.description: "Untamed form can take dinosaur form's shapes, and a shape with its own Athletics modifier gets a +1 status bonus to Athletics."
feats.druid.ferocious-shape.prerequisites.untamed-form: 'Untamed Form'
feats.druid.fey-caller.name: 'Fey Caller'
feats.druid.fey-caller.description: 'Illusory disguise, illusory object and illusory scene join your spell list as primal spells.'
feats.druid.floral-restoration.name: 'Floral Restoration'
feats.druid.floral-restoration.description: "One action (healing, vitality), once a day, in at least a 15-foot square of healthy plants: you regain 1 Focus Point and 4d8 Hit Points (1d8 more at 9th level and every 2 levels after); that patch can't do it again for 24 hours."
feats.druid.floral-restoration.prerequisites.order: 'Leaf order'
feats.druid.incredible-companion-druid.name: 'Incredible Companion (Druid)'
feats.druid.incredible-companion-druid.description: 'Your animal companion becomes nimble or savage.'
feats.druid.incredible-companion-druid.prerequisites.mature-animal-companion-druid: 'Mature Animal Companion (Druid)'
feats.druid.raise-menhir.name: 'Raise Menhir'
feats.druid.raise-menhir.description: 'Two actions, once per hour. A monument rises in an unoccupied square within 30 feet (difficult terrain): choose arcane, divine or occult, and creatures within 15 feet gain a +2 status bonus to saves against effects with that trait. It lasts 1 round; Sustain it up to 1 minute.'
feats.druid.soaring-shape.name: 'Soaring Shape'
feats.druid.soaring-shape.description: "Untamed form can take aerial form's bat and bird shapes (the wasp with Insect Shape, the pterosaur with Ferocious Shape), and a shape with its own Acrobatics modifier gets +1 status to Acrobatics."
feats.druid.soaring-shape.prerequisites.untamed-form: 'Untamed Form'
feats.druid.wind-caller.prerequisites.order: 'Storm order'
feats.druid.elemental-shape.name: 'Elemental Shape'
feats.druid.elemental-shape.description: "Untamed form can take elemental form's shapes, and while polymorphed by it you have resistance 5 to fire."
feats.druid.elemental-shape.prerequisites.untamed-form: 'Untamed Form'
feats.druid.healing-transformation.name: 'Healing Transformation'
feats.druid.healing-transformation.description: 'One action, spellshape. If your next action casts a non-cantrip polymorph spell on one creature, it also heals 1d6 per spell rank.'
feats.druid.plant-shape.name: 'Plant Shape'
feats.druid.plant-shape.description: "With untamed form, you can take plant form's shapes and have resistance 5 to poison while polymorphed by it; without it, you can cast plant form once a day at your highest rank."
feats.druid.plant-shape.prerequisites.order: 'Leaf order or Untamed Form'
feats.druid.primal-howl.name: 'Primal Howl'
feats.druid.primal-howl.description: 'Your companion gains an advanced maneuver, once per hour: 1d6 sonic per 2 of its levels in a 30-foot cone (basic Fortitude save against your spell DC), frightened 1 on a failure, 2 on a critical failure.'
feats.druid.primal-howl.prerequisites.incredible-companion-druid: 'Incredible Companion (Druid)'
feats.druid.pristine-weapon.name: 'Pristine Weapon'
feats.druid.pristine-weapon.description: 'Your verdant weapon counts as cold iron and silver; a critical hit on a creature weak to either deals 1d6 persistent bleed damage.'
feats.druid.pristine-weapon.prerequisites.verdant-weapon: 'Verdant Weapon'
feats.druid.side-by-side-druid.name: 'Side by Side (Druid)'
feats.druid.side-by-side-druid.description: 'You and your animal companion flank a foe you are both adjacent to, wherever you stand.'
feats.druid.side-by-side-druid.prerequisites.animal-companion: 'Animal Companion'
feats.druid.thunderclap-spell.name: 'Thunderclap Spell'
feats.druid.thunderclap-spell.description: 'One action, spellshape. If your next action casts an electricity spell without a duration that calls for saves, creatures that fail their Reflex save are deafened for 1 round, and those that critically fail are also knocked prone.'
feats.druid.thunderclap-spell.prerequisites.order: 'Storm order'
feats.druid.dragon-shape.name: 'Dragon Shape'
feats.druid.dragon-shape.description: "Untamed form can take dragon form's shapes, and while polymorphed by it you have resistance 5 to bludgeoning or poison (your choice)."
feats.druid.dragon-shape.prerequisites.soaring-shape: 'Soaring Shape'
feats.druid.garland-spell.name: 'Garland Spell'
feats.druid.garland-spell.description: 'One action, spellshape. If your next action casts a fungus or plant spell, a 10-foot burst in its range fills with thorns or poisonous vines for 1 minute: difficult and hazardous terrain dealing 2d6 piercing or poison to a creature entering or ending its turn there (once a turn; 3d6 at 16th level, 4d6 at 20th); you and your familiar are immune.'
feats.druid.garland-spell.prerequisites.order: 'Leaf order'
feats.druid.primal-focus.name: 'Primal Focus'
feats.druid.primal-focus.description: 'When you Refocus, you refill your focus pool.'
feats.druid.wandering-oasis.name: 'Wandering Oasis'
feats.druid.wandering-oasis.description: 'You and allies within 60 feet are protected from severe heat and cold (extreme too, if you are legendary in Survival).'
feats.druid.wandering-oasis.prerequisites.survival: 'Master in Survival'
feats.druid.reactive-transformation.name: 'Reactive Transformation'
feats.druid.reactive-transformation.description: 'Reaction. Cast untamed form into a shape of your prerequisite feats as the danger calls for, its resistances applying: falling 10 feet (aerial form), bludgeoning or poison damage (a resisting primal dragon), fire damage (a fire elemental), poison damage (plant form).'
feats.druid.reactive-transformation.prerequisites.untamed-form: 'Untamed Form'
feats.druid.reactive-transformation.prerequisites.shape: 'Dragon Shape, Elemental Shape, Plant Shape, or Soaring Shape'
feats.druid.sow-spell.name: 'Sow Spell'
feats.druid.sow-spell.description: 'One action, spellshape. If your next action casts a 1- or 2-action spell, it is planted in an adjacent square (decisions made now): within 10 minutes it sprouts as a reaction when a creature enters its space or an adjacent square. One at a time; Perception against your spell DC notices it.'
feats.druid.specialized-companion-druid.name: 'Specialized Companion (Druid)'
feats.druid.specialized-companion-druid.description: 'Your animal companion gains a specialization of your choice.'
feats.druid.specialized-companion-druid.prerequisites.incredible-companion-druid: 'Incredible Companion (Druid)'
feats.druid.timeless-nature.name: 'Timeless Nature'
feats.druid.timeless-nature.description: 'You stop aging, and gain a +2 status bonus to saves against diseases and primal magic.'
feats.druid.verdant-metamorphosis.name: 'Verdant Metamorphosis'
feats.druid.verdant-metamorphosis.description: 'You become a plant version of yourself (the plant trait, losing traits like humanoid) and gain Verdant Rest: become a tree (one with plants, AC 30); 10 minutes in sunlight restores half your Hit Points, and a daily rest in it restores all and ends drained, enfeebled, clumsy, stupefied and poisons and diseases of 19th level or lower.'
feats.druid.verdant-metamorphosis.prerequisites.order: 'Leaf order'
feats.druid.impaling-briars.prerequisites.order: 'Leaf order'
feats.druid.monstrosity-shape.name: 'Monstrosity Shape'
feats.druid.monstrosity-shape.description: "Untamed form can take monstrosity form's cave worm and sea serpent shapes (the phoenix with Soaring Shape)."
feats.druid.monstrosity-shape.prerequisites.untamed-form: 'Untamed Form'
feats.druid.uplifting-winds.name: 'Uplifting Winds'
feats.druid.uplifting-winds.description: 'When you fly and cast an air or electricity spell, you gain a +10 status bonus to your fly Speed and can immediately Fly half your Speed.'
feats.druid.uplifting-winds.prerequisites.order: 'Storm order'
feats.druid.perfect-form-control.name: 'Perfect Form Control'
feats.druid.perfect-form-control.description: 'Untamed form from Form Control lasts indefinitely (you can still Dismiss it).'
feats.druid.perfect-form-control.prerequisites.form-control: 'Form Control'
feats.druid.perfect-form-control.prerequisites.strength: 'Strength +4'
feats.druid.primal-aegis.name: 'Primal Aegis'
feats.druid.primal-aegis.description: 'You and allies within 30 feet have resistance equal to your Wisdom modifier to acid, cold, electricity, fire, vitality and void damage.'
feats.druid.hierophants-power.name: "Hierophant's Power"
feats.druid.hierophants-power.description: 'You gain one more 10th-rank spell slot.'
feats.druid.ley-line-conduit.name: 'Ley Line Conduit'
feats.druid.ley-line-conduit.description: 'One action, once per minute, spellshape. If your next action casts a spell of 5th rank or lower without a duration, the prepared spell is not expended.'
feats.druid.true-shapeshifter.name: 'True Shapeshifter'
feats.druid.true-shapeshifter.description: 'Once a day you can cast nature incarnate unprepared, as a kaiju (a green man with Plant Shape), and you can True Shapeshift (concentrate): while under untamed form, change to any other of its shapes (the shorter duration remains).'
feats.druid.true-shapeshifter.prerequisites.dragon-shape: 'Dragon Shape'
feats.druid.true-shapeshifter.prerequisites.untamed-form: 'Untamed Form'
