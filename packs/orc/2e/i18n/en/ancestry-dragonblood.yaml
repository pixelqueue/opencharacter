# Player Core 2's dragonblood: its ancestry or heritage, heritages and feats, in text written for
# the pack.
fields.dragonblood.damageType.name: "Draconic exemplar's damage type"
situational.againstPrimal.name: 'Against a primal effect'
heritages.dragonblood.name: 'Dragonblood'
heritages.dragonblood.description: 'Descended from a dragon. You gain the dragonblood trait, Draconic is among the languages you can learn, and a success on a save against a fear effect is a critical success. You can take dragonblood feats as ancestry feats. Your draconic exemplar, the kind of dragon you descend from, can be chosen now or when a feat needs it.'
heritages.dragonblood.choices.exemplar.prompt: 'Draconic exemplar'
heritages.dragonblood.choices.exemplar.options.arcane-force.name: 'Arcane dragon: cone of force (Reflex)'
heritages.dragonblood.choices.exemplar.options.arcane-mental.name: 'Arcane dragon, a climber: cone of mental (Will)'
heritages.dragonblood.choices.exemplar.options.divine-fire.name: 'Divine dragon: cone of fire (Reflex)'
heritages.dragonblood.choices.exemplar.options.divine-spirit.name: 'Divine dragon: cone of spirit (Reflex)'
heritages.dragonblood.choices.exemplar.options.occult-poison.name: 'Occult dragon, a climber: cone of poison (Fortitude)'
heritages.dragonblood.choices.exemplar.options.occult-mental.name: 'Occult dragon: cone of mental (Will)'
heritages.dragonblood.choices.exemplar.options.primal-bludgeoning.name: 'Primal dragon, a burrower: cone of bludgeoning (Reflex)'
heritages.dragonblood.choices.exemplar.options.primal-poison.name: 'Primal dragon, a swimmer: cone of poison (Fortitude)'
feats.ancestry.arcane-dragonblood.name: 'Arcane Dragonblood'
feats.ancestry.arcane-dragonblood.description: "You're trained in Arcana (or a skill of your choice if you already were). You gain Arcane Sense. Your draconic exemplar, if you pick one, must be an arcane dragon."
feats.ancestry.divine-dragonblood.name: 'Divine Dragonblood'
feats.ancestry.divine-dragonblood.description: "You're trained in Religion (or a skill of your choice if you already were). You get a +1 circumstance bonus to initiative rolls. Your draconic exemplar, if you pick one, must be a divine dragon."
feats.ancestry.occult-dragonblood.name: 'Occult Dragonblood'
feats.ancestry.occult-dragonblood.description: "You're trained in Occultism (or a skill of your choice if you already were). You gain Oddity Identification. Your draconic exemplar, if you pick one, must be an occult dragon."
feats.ancestry.primal-dragonblood.name: 'Primal Dragonblood'
feats.ancestry.primal-dragonblood.description: "You're trained in Nature (or a skill of your choice if you already were). You can use Nature to Sense Direction and to Subsist in the wilds. Your draconic exemplar, if you pick one, must be a primal dragon."
feats.ancestry.breath-of-the-dragon.name: 'Breath of the Dragon'
feats.ancestry.breath-of-the-dragon.description: "2 actions (magical): you exhale your exemplar's breath in a 15-foot cone or 30-foot line: 1d4 damage of its type (1d4 more at 3rd level and every 2 levels after), a basic save of its kind against the higher of your class DC and spell DC. Then you can't again for 1d4 rounds."
feats.ancestry.breath-of-the-dragon.actions.breath-of-the-dragon.name: 'Breath of the Dragon'
feats.ancestry.breath-of-the-dragon.actions.breath-of-the-dragon.participants.target.name: 'Creatures in the area'
feats.ancestry.breath-of-the-dragon.actions.breath-of-the-dragon.results.breathed.name: 'Breathed'
weapons.draconic-claw.name: 'Claw'
features.draconic-aspect.claw.name: 'Claw'
features.draconic-aspect.claw.description: '1d4 slashing, brawling group, agile, finesse.'
weapons.draconic-jaws.name: 'Jaws'
features.draconic-aspect.jaws.name: 'Jaws'
features.draconic-aspect.jaws.description: '1d6 piercing, brawling group, forceful.'
weapons.draconic-tail.name: 'Tail'
features.draconic-aspect.tail.name: 'Tail'
features.draconic-aspect.tail.description: '1d6 bludgeoning, brawling group, sweep, trip.'
feats.ancestry.draconic-aspect.name: 'Draconic Aspect'
feats.ancestry.draconic-aspect.description: "You gain an unarmed attack of your choice, brawling group: claw (1d4 slashing, agile, finesse), jaws (1d6 piercing, forceful) or tail (1d6 bludgeoning, sweep, trip). 1st level only; it can't be retrained or changed."
feats.ancestry.draconic-aspect.choices.attack.prompt: 'Unarmed attack'
feats.ancestry.draconic-resistance.name: 'Draconic Resistance'
feats.ancestry.draconic-resistance.description: "Resistance equal to half your level (minimum 1) to your exemplar's damage type, doubled against dragons. If that type is bludgeoning, piercing or slashing, pick acid, cold, electricity, fire or sonic instead."
feats.ancestry.draconic-resistance.choices.type.prompt: 'Resistance (your exemplar deals physical damage)'
feats.ancestry.draconic-resistance.choices.type.options.acid.name: 'Acid'
feats.ancestry.draconic-resistance.choices.type.options.cold.name: 'Cold'
feats.ancestry.draconic-resistance.choices.type.options.electricity.name: 'Electricity'
feats.ancestry.draconic-resistance.choices.type.options.fire.name: 'Fire'
feats.ancestry.draconic-resistance.choices.type.options.sonic.name: 'Sonic'
feats.ancestry.draconic-sight.name: 'Draconic Sight'
feats.ancestry.draconic-sight.description: 'You gain low-light vision, or darkvision if your ancestry has low-light vision.'
feats.ancestry.dragon-lore.name: 'Dragon Lore'
feats.ancestry.dragon-lore.description: "You're trained in Diplomacy and Intimidation (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Dragon Lore."
feats.ancestry.scaly-hide.name: 'Scaly Hide'
feats.ancestry.scaly-hide.description: "Unarmored, your scales give a +1 item bonus to AC (+2 from 5th level) with a Dexterity cap of +3. It adds to armor potency runes on explorer's clothing, mystic armor or bands of force. 1st level only."
templates.deadly-aspect.name: '{base} (Deadly Aspect)'
feats.ancestry.deadly-aspect.name: 'Deadly Aspect'
feats.ancestry.deadly-aspect.description: 'Your Draconic Aspect unarmed attack gains the deadly d8 trait.'
feats.ancestry.deadly-aspect.prerequisites.draconic-aspect: 'Draconic Aspect'
feats.ancestry.draconic-scent.name: 'Draconic Scent'
feats.ancestry.draconic-scent.description: 'You gain imprecise scent with a range of 30 feet.'
feats.ancestry.dragons-flight.name: "Dragon's Flight"
feats.ancestry.dragons-flight.description: "Once a round, 1 action: Fly (with a fly Speed of 20 feet for this move if you have none); you fall if you don't end on solid ground."
feats.ancestry.traditional-resistances.name: 'Traditional Resistances'
feats.ancestry.traditional-resistances.description: "A +1 status bonus to AC and saves against spells and magical effects of your lineage's tradition, +2 against such sleep and paralysis effects."
feats.ancestry.traditional-resistances.prerequisites.lineage: 'Arcane, Divine, Occult or Primal Dragonblood'
feats.ancestry.formidable-breath.name: 'Formidable Breath'
feats.ancestry.formidable-breath.description: "Your Breath of the Dragon's area grows to a 30-foot cone or 60-foot line, and its dice are d6s."
feats.ancestry.formidable-breath.prerequisites.breath: 'Breath of the Dragon'
feats.ancestry.true-dragons-flight.name: "True Dragon's Flight"
feats.ancestry.true-dragons-flight.description: 'You have a fly Speed of 20 feet at all times.'
feats.ancestry.true-dragons-flight.prerequisites.dragons-flight: "Dragon's Flight"
feats.ancestry.wing-buffet.name: 'Wing Buffet'
feats.ancestry.wing-buffet.description: '2 actions (attack): Athletics against the Fortitude DC of up to two adjacent creatures (two attacks for your multiple attack penalty, which rises only after both). Critical success: bludgeoning damage equal to twice your level and pushed up to 10 feet; success: your level in damage, 5 feet; failure: half your level; critical failure: you fall prone afterward.'
feats.ancestry.wing-buffet.prerequisites.expert: 'Expert in Athletics'
feats.ancestry.draconic-veil.name: 'Draconic Veil'
feats.ancestry.draconic-veil.description: "You can cast humanoid form once a day as a 5th-rank innate spell lasting 1 hour, of your exemplar's tradition."
feats.ancestry.majestic-presence.name: 'Majestic Presence'
feats.ancestry.majestic-presence.description: '1 action (emotion, fear, mental, visual): each creature in a 20-foot emanation attempts a Will save against the higher of your class DC and spell DC, then is immune for 24 hours. Success: frightened 1; failure: frightened 2; critical failure: frightened 4.'
feats.ancestry.majestic-presence.actions.majestic-presence.name: 'Majestic Presence'
feats.ancestry.majestic-presence.actions.majestic-presence.participants.target.name: 'Creatures within 20 feet'
feats.ancestry.majestic-presence.actions.majestic-presence.results.cowed.name: 'Cowed'
feats.ancestry.form-of-the-dragon.name: 'Form of the Dragon'
feats.ancestry.form-of-the-dragon.description: "You can cast dragon form once a day as an 8th-rank innate spell of your exemplar's tradition, taking your exemplar's shape (or, with a lineage feat, any dragon of that tradition)."
feats.ancestry.lingering-breath.name: 'Lingering Breath'
feats.ancestry.lingering-breath.description: "Your Breath of the Dragon's area is difficult terrain for 1 minute, and a creature that fails its save takes 2d6 persistent damage of its type."
feats.ancestry.lingering-breath.prerequisites.breath: 'Breath of the Dragon'
