# Alchemical items.
consumables.acid-flask-lesser.name: 'Acid Flask (Lesser)'
consumables.acid-flask-lesser.description: 'Item 1, 3 gp, light. Corrosive acid: 1 acid damage, 1d6 persistent acid damage and 1 acid splash.'
consumables.acid-flask-moderate.name: 'Acid Flask (Moderate)'
consumables.acid-flask-moderate.description: 'Item 3, 10 gp, light. Corrosive acid: 1 acid damage, 2d6 persistent acid damage and 2 acid splash. +1 item bonus to the attack roll.'
consumables.acid-flask-greater.name: 'Acid Flask (Greater)'
consumables.acid-flask-greater.description: 'Item 11, 250 gp, light. Corrosive acid: 1 acid damage, 3d6 persistent acid damage and 3 acid splash. +2 item bonus to the attack roll.'
consumables.acid-flask-major.name: 'Acid Flask (Major)'
consumables.acid-flask-major.description: 'Item 17, 2500 gp, light. Corrosive acid: 1 acid damage, 4d6 persistent acid damage and 4 acid splash. +3 item bonus to the attack roll.'
consumables.alchemists-fire-lesser.name: "Alchemist's Fire (Lesser)"
consumables.alchemists-fire-lesser.description: 'Item 1, 3 gp, light. Volatile liquids that ignite in the air: 1d8 fire damage, 1 persistent fire damage and 1 fire splash.'
consumables.alchemists-fire-moderate.name: "Alchemist's Fire (Moderate)"
consumables.alchemists-fire-moderate.description: 'Item 3, 10 gp, light. Volatile liquids that ignite in the air: 2d8 fire damage, 2 persistent fire damage and 2 fire splash. +1 item bonus to the attack roll.'
consumables.alchemists-fire-greater.name: "Alchemist's Fire (Greater)"
consumables.alchemists-fire-greater.description: 'Item 11, 250 gp, light. Volatile liquids that ignite in the air: 3d8 fire damage, 3 persistent fire damage and 3 fire splash. +2 item bonus to the attack roll.'
consumables.alchemists-fire-major.name: "Alchemist's Fire (Major)"
consumables.alchemists-fire-major.description: 'Item 17, 2500 gp, light. Volatile liquids that ignite in the air: 4d8 fire damage, 4 persistent fire damage and 4 fire splash. +3 item bonus to the attack roll.'
consumables.blasting-stone-lesser.name: 'Blasting Stone (Lesser)'
consumables.blasting-stone-lesser.description: 'Item 1, 3 gp, light. A pebble that bursts with a deafening bang: 1d4 sonic damage and 1 sonic splash; each creature within 10 feet must succeed at a DC 17 Fortitude save or be deafened until the end of its next turn.'
consumables.blasting-stone-moderate.name: 'Blasting Stone (Moderate)'
consumables.blasting-stone-moderate.description: 'Item 3, 10 gp, light. A pebble that bursts with a deafening bang: 2d4 sonic damage and 2 sonic splash; each creature within 10 feet must succeed at a DC 20 Fortitude save or be deafened until the end of its next turn. +1 item bonus to the attack roll.'
consumables.blasting-stone-greater.name: 'Blasting Stone (Greater)'
consumables.blasting-stone-greater.description: 'Item 11, 250 gp, light. A pebble that bursts with a deafening bang: 3d4 sonic damage and 3 sonic splash; each creature within 10 feet must succeed at a DC 28 Fortitude save or be deafened until the end of its next turn. +2 item bonus to the attack roll.'
consumables.blasting-stone-major.name: 'Blasting Stone (Major)'
consumables.blasting-stone-major.description: 'Item 17, 2500 gp, light. A pebble that bursts with a deafening bang: 4d4 sonic damage and 4 sonic splash; each creature within 10 feet must succeed at a DC 36 Fortitude save or be deafened until the end of its next turn. +3 item bonus to the attack roll.'
consumables.blight-bomb-lesser.name: 'Blight Bomb (Lesser)'
consumables.blight-bomb-lesser.description: 'Item 1, 3 gp, light. Toxic chemicals that rot flesh: 1d4 poison damage, 1d4 persistent poison damage and 1 poison splash.'
consumables.blight-bomb-moderate.name: 'Blight Bomb (Moderate)'
consumables.blight-bomb-moderate.description: 'Item 3, 10 gp, light. Toxic chemicals that rot flesh: 2d4 poison damage, 2d4 persistent poison damage and 2 poison splash. +1 item bonus to the attack roll.'
consumables.blight-bomb-greater.name: 'Blight Bomb (Greater)'
consumables.blight-bomb-greater.description: 'Item 11, 250 gp, light. Toxic chemicals that rot flesh: 3d4 poison damage, 3d4 persistent poison damage and 3 poison splash. +2 item bonus to the attack roll.'
consumables.blight-bomb-major.name: 'Blight Bomb (Major)'
consumables.blight-bomb-major.description: 'Item 17, 2500 gp, light. Toxic chemicals that rot flesh: 4d4 poison damage, 4d4 persistent poison damage and 4 poison splash. +3 item bonus to the attack roll.'
consumables.bottled-lightning-lesser.name: 'Bottled Lightning (Lesser)'
consumables.bottled-lightning-lesser.description: 'Item 1, 3 gp, light. Reagents that crackle into lightning: 1d6 electricity damage and 1 electricity splash; on a hit the target is off-guard until the start of your next turn.'
consumables.bottled-lightning-moderate.name: 'Bottled Lightning (Moderate)'
consumables.bottled-lightning-moderate.description: 'Item 3, 10 gp, light. Reagents that crackle into lightning: 2d6 electricity damage and 2 electricity splash; on a hit the target is off-guard until the start of your next turn. +1 item bonus to the attack roll.'
consumables.bottled-lightning-greater.name: 'Bottled Lightning (Greater)'
consumables.bottled-lightning-greater.description: 'Item 11, 250 gp, light. Reagents that crackle into lightning: 3d6 electricity damage and 3 electricity splash; on a hit the target is off-guard until the start of your next turn. +2 item bonus to the attack roll.'
consumables.bottled-lightning-major.name: 'Bottled Lightning (Major)'
consumables.bottled-lightning-major.description: 'Item 17, 2500 gp, light. Reagents that crackle into lightning: 4d6 electricity damage and 4 electricity splash; on a hit the target is off-guard until the start of your next turn. +3 item bonus to the attack roll.'
consumables.dread-ampoule-lesser.name: 'Dread Ampoule (Lesser)'
consumables.dread-ampoule-lesser.description: 'Item 1, 3 gp, light. A murky gas that clouds the mind: 1d6 mental damage and 1 mental splash; on a hit the target is frightened 1 (2 on a critical hit).'
consumables.dread-ampoule-moderate.name: 'Dread Ampoule (Moderate)'
consumables.dread-ampoule-moderate.description: 'Item 3, 10 gp, light. A murky gas that clouds the mind: 2d6 mental damage and 2 mental splash; on a hit the target is frightened 1 (2 on a critical hit). +1 item bonus to the attack roll.'
consumables.dread-ampoule-greater.name: 'Dread Ampoule (Greater)'
consumables.dread-ampoule-greater.description: 'Item 11, 300 gp, light. A murky gas that clouds the mind: 3d6 mental damage and 3 mental splash; on a hit the target is frightened 1 (2 on a critical hit). +2 item bonus to the attack roll.'
consumables.dread-ampoule-major.name: 'Dread Ampoule (Major)'
consumables.dread-ampoule-major.description: 'Item 17, 3000 gp, light. A murky gas that clouds the mind: 4d6 mental damage and 4 mental splash; on a hit the target is frightened 1 (2 on a critical hit). +3 item bonus to the attack roll.'
consumables.frost-vial-lesser.name: 'Frost Vial (Lesser)'
consumables.frost-vial-lesser.description: "Item 1, 3 gp, light. Reagents that drink in heat: 1d6 cold damage and 1 cold splash; on a hit a -5-foot status penalty to the target's Speeds until the end of its next turn."
consumables.frost-vial-moderate.name: 'Frost Vial (Moderate)'
consumables.frost-vial-moderate.description: "Item 3, 10 gp, light. Reagents that drink in heat: 2d6 cold damage and 2 cold splash; on a hit a -10-foot status penalty to the target's Speeds until the end of its next turn. +1 item bonus to the attack roll."
consumables.frost-vial-greater.name: 'Frost Vial (Greater)'
consumables.frost-vial-greater.description: "Item 11, 250 gp, light. Reagents that drink in heat: 3d6 cold damage and 3 cold splash; on a hit a -10-foot status penalty to the target's Speeds until the end of its next turn. +2 item bonus to the attack roll."
consumables.frost-vial-major.name: 'Frost Vial (Major)'
consumables.frost-vial-major.description: "Item 17, 2500 gp, light. Reagents that drink in heat: 4d6 cold damage and 4 cold splash; on a hit a -15-foot status penalty to the target's Speeds until the end of its next turn. +3 item bonus to the attack roll."
consumables.ghost-charge-lesser.name: 'Ghost Charge (Lesser)'
consumables.ghost-charge-lesser.description: 'Item 1, 3 gp, light. A canister of salts that harms undead (and creatures with void healing): 1d8 vitality damage and 1 vitality splash; a primary target it damages is enfeebled 1 until the start of your next turn. It bursts even against spirits.'
consumables.ghost-charge-moderate.name: 'Ghost Charge (Moderate)'
consumables.ghost-charge-moderate.description: 'Item 3, 10 gp, light. A canister of salts that harms undead (and creatures with void healing): 2d8 vitality damage and 2 vitality splash; a primary target it damages is enfeebled 1 until the start of your next turn. It bursts even against spirits. +1 item bonus to the attack roll.'
consumables.ghost-charge-greater.name: 'Ghost Charge (Greater)'
consumables.ghost-charge-greater.description: 'Item 11, 250 gp, light. A canister of salts that harms undead (and creatures with void healing): 3d8 vitality damage and 3 vitality splash; a primary target it damages is enfeebled 2 until the start of your next turn. It bursts even against spirits. +2 item bonus to the attack roll.'
consumables.ghost-charge-major.name: 'Ghost Charge (Major)'
consumables.ghost-charge-major.description: 'Item 17, 2500 gp, light. A canister of salts that harms undead (and creatures with void healing): 4d8 vitality damage and 4 vitality splash; a primary target it damages is enfeebled 2 until the start of your next turn. It bursts even against spirits. +3 item bonus to the attack roll.'
consumables.glue-bomb-lesser.name: 'Glue Bomb (Lesser)'
consumables.glue-bomb-lesser.description: "Item 1, 3 gp, light. A harmless burst of sticky glue: on a hit a -10-foot status penalty to the target's Speeds for 1 minute; on a critical hit, a target touching a surface is stuck and immobilized for 1 round (Escape DC 17)."
consumables.glue-bomb-moderate.name: 'Glue Bomb (Moderate)'
consumables.glue-bomb-moderate.description: "Item 3, 10 gp, light. A harmless burst of sticky glue: on a hit a -15-foot status penalty to the target's Speeds for 1 minute; on a critical hit, a target touching a surface is stuck and immobilized for 1 round (Escape DC 19). +1 item bonus to the attack roll."
consumables.glue-bomb-greater.name: 'Glue Bomb (Greater)'
consumables.glue-bomb-greater.description: "Item 11, 250 gp, light. A harmless burst of sticky glue: on a hit a -15-foot status penalty to the target's Speeds for 1 minute; on a critical hit, a target touching a surface is stuck and immobilized for 1 round (Escape DC 28). +2 item bonus to the attack roll."
consumables.glue-bomb-major.name: 'Glue Bomb (Major)'
consumables.glue-bomb-major.description: "Item 17, 2500 gp, light. A harmless burst of sticky glue: on a hit a -20-foot status penalty to the target's Speeds for 1 minute; on a critical hit, a target touching a surface is stuck and immobilized for 1 round (Escape DC 37). +3 item bonus to the attack roll."
consumables.crystal-shards-moderate.name: 'Crystal Shards (Moderate)'
consumables.crystal-shards-moderate.description: 'Item 4, 16 gp, light. A pressurized gas that turns into flying crystals: 2d4 piercing damage and 4 piercing splash; a hit also deals 1 persistent bleed damage and, while it bleeds, a -5-foot penalty to its Speed (an Interact pulls the crystals out, easing the bleeding). +1 item bonus to the attack roll.'
consumables.crystal-shards-greater.name: 'Crystal Shards (Greater)'
consumables.crystal-shards-greater.description: 'Item 12, 350 gp, light. A pressurized gas that turns into flying crystals: 3d4 piercing damage and 5 piercing splash; a hit also deals 1 persistent bleed damage and, while it bleeds, a -5-foot penalty to its Speed (an Interact pulls the crystals out, easing the bleeding). +2 item bonus to the attack roll.'
consumables.crystal-shards-major.name: 'Crystal Shards (Major)'
consumables.crystal-shards-major.description: 'Item 18, 4000 gp, light. A pressurized gas that turns into flying crystals: 4d4 piercing damage and 6 piercing splash; a hit also deals 1 persistent bleed damage and, while it bleeds, a -5-foot penalty to its Speed (an Interact pulls the crystals out, easing the bleeding). +3 item bonus to the attack roll.'

# Mutagens.
consumables.bestial-mutagen-lesser.name: 'Bestial Mutagen (Lesser)'
consumables.bestial-mutagen-lesser.description: "Item 1, 4 gp, light. Your features turn bestial. Benefit: a +1 item bonus to Athletics checks and unarmed attack rolls, and claw (agile, 1d4 slashing) and jaws (1d6 piercing) unarmed attacks that striking runes don't change. Drawback: a -2 penalty to Reflex saves, Acrobatics and Stealth, and -1 to AC. Duration 1 minute."
consumables.bestial-mutagen-moderate.name: 'Bestial Mutagen (Moderate)'
consumables.bestial-mutagen-moderate.description: "Item 3, 12 gp, light. Your features turn bestial. Benefit: a +2 item bonus to Athletics checks and unarmed attack rolls, and claw (agile, 2d6 slashing) and jaws (2d8 piercing) unarmed attacks that striking runes don't change. Drawback: a -2 penalty to Reflex saves, Acrobatics and Stealth, and -1 to AC. Duration 10 minutes."
consumables.bestial-mutagen-greater.name: 'Bestial Mutagen (Greater)'
consumables.bestial-mutagen-greater.description: "Item 11, 300 gp, light. Your features turn bestial. Benefit: a +3 item bonus to Athletics checks and unarmed attack rolls, and claw (agile, 3d8 slashing) and jaws (3d10 piercing) unarmed attacks that striking runes don't change. Drawback: a -2 penalty to Reflex saves, Acrobatics and Stealth, and -1 to AC. Duration 1 hour."
consumables.bestial-mutagen-major.name: 'Bestial Mutagen (Major)'
consumables.bestial-mutagen-major.description: "Item 17, 3000 gp, light. Your features turn bestial. Benefit: a +4 item bonus to Athletics checks and unarmed attack rolls, and claw (agile, 4d8 slashing) and jaws (4d10 piercing) unarmed attacks that striking runes don't change. Drawback: a -2 penalty to Reflex saves, Acrobatics and Stealth, and -1 to AC. Duration 1 hour."
consumables.cognitive-mutagen-lesser.name: 'Cognitive Mutagen (Lesser)'
consumables.cognitive-mutagen-lesser.description: 'Item 1, 4 gp, light. Your mind clears, but the physical seems distant. Benefit: a +1 item bonus to Arcana, Crafting, Lore, Occultism and Society checks and all Recall Knowledge, whose critical failures become failures. Drawback: a -2 penalty to weapon and unarmed attack rolls, Athletics and Acrobatics. Duration 1 minute.'
consumables.cognitive-mutagen-moderate.name: 'Cognitive Mutagen (Moderate)'
consumables.cognitive-mutagen-moderate.description: 'Item 3, 12 gp, light. Your mind clears, but the physical seems distant. Benefit: a +2 item bonus to Arcana, Crafting, Lore, Occultism and Society checks and all Recall Knowledge, whose critical failures become failures. Drawback: a -2 penalty to weapon and unarmed attack rolls, Athletics and Acrobatics. Duration 10 minutes.'
consumables.cognitive-mutagen-greater.name: 'Cognitive Mutagen (Greater)'
consumables.cognitive-mutagen-greater.description: 'Item 11, 300 gp, light. Your mind clears, but the physical seems distant. Benefit: a +3 item bonus to Arcana, Crafting, Lore, Occultism and Society checks and all Recall Knowledge, whose critical failures become failures. Drawback: a -2 penalty to weapon and unarmed attack rolls, Athletics and Acrobatics. Duration 1 hour.'
consumables.cognitive-mutagen-major.name: 'Cognitive Mutagen (Major)'
consumables.cognitive-mutagen-major.description: 'Item 17, 3000 gp, light. Your mind clears, but the physical seems distant. Benefit: a +4 item bonus to Arcana, Crafting, Lore, Occultism and Society checks and all Recall Knowledge, whose critical failures become failures. Drawback: a -2 penalty to weapon and unarmed attack rolls, Athletics and Acrobatics. Duration 1 hour.'
consumables.juggernaut-mutagen-lesser.name: 'Juggernaut Mutagen (Lesser)'
consumables.juggernaut-mutagen-lesser.description: "Item 1, 4 gp, light. Your body grows sturdy and ponderous. Benefit: a +1 item bonus to Fortitude saves and 5 temporary Hit Points, regained whenever you've been at full Hit Points for a minute. Drawback: a -2 penalty to Will saves, Perception and initiative. Duration 1 minute."
consumables.juggernaut-mutagen-moderate.name: 'Juggernaut Mutagen (Moderate)'
consumables.juggernaut-mutagen-moderate.description: "Item 3, 12 gp, light. Your body grows sturdy and ponderous. Benefit: a +2 item bonus to Fortitude saves and 10 temporary Hit Points, regained whenever you've been at full Hit Points for a minute. Drawback: a -2 penalty to Will saves, Perception and initiative. Duration 10 minutes."
consumables.juggernaut-mutagen-greater.name: 'Juggernaut Mutagen (Greater)'
consumables.juggernaut-mutagen-greater.description: "Item 11, 300 gp, light. Your body grows sturdy and ponderous. Benefit: a +3 item bonus to Fortitude saves and 30 temporary Hit Points, regained whenever you've been at full Hit Points for a minute. Drawback: a -2 penalty to Will saves, Perception and initiative. Duration 1 hour."
consumables.juggernaut-mutagen-major.name: 'Juggernaut Mutagen (Major)'
consumables.juggernaut-mutagen-major.description: "Item 17, 3000 gp, light. Your body grows sturdy and ponderous. Benefit: a +4 item bonus to Fortitude saves and 45 temporary Hit Points, regained whenever you've been at full Hit Points for a minute. Drawback: a -2 penalty to Will saves, Perception and initiative. Duration 1 hour."
consumables.quicksilver-mutagen-lesser.name: 'Quicksilver Mutagen (Lesser)'
consumables.quicksilver-mutagen-lesser.description: 'Item 1, 4 gp, light. You grow swift and nimble, but fragile. Benefit: a +1 item bonus to Acrobatics, Stealth, Thievery, Reflex saves and Dexterity-based attack rolls, and a +5-foot status bonus to Speed. Drawback: you take damage equal to twice your level, which nothing heals while it lasts. Duration 1 minute.'
consumables.quicksilver-mutagen-moderate.name: 'Quicksilver Mutagen (Moderate)'
consumables.quicksilver-mutagen-moderate.description: 'Item 3, 12 gp, light. You grow swift and nimble, but fragile. Benefit: a +2 item bonus to Acrobatics, Stealth, Thievery, Reflex saves and Dexterity-based attack rolls, and a +10-foot status bonus to Speed. Drawback: you take damage equal to twice your level, which nothing heals while it lasts. Duration 10 minutes.'
consumables.quicksilver-mutagen-greater.name: 'Quicksilver Mutagen (Greater)'
consumables.quicksilver-mutagen-greater.description: 'Item 11, 300 gp, light. You grow swift and nimble, but fragile. Benefit: a +3 item bonus to Acrobatics, Stealth, Thievery, Reflex saves and Dexterity-based attack rolls, and a +15-foot status bonus to Speed. Drawback: you take damage equal to twice your level, which nothing heals while it lasts. Duration 1 hour.'
consumables.quicksilver-mutagen-major.name: 'Quicksilver Mutagen (Major)'
consumables.quicksilver-mutagen-major.description: 'Item 17, 3000 gp, light. You grow swift and nimble, but fragile. Benefit: a +4 item bonus to Acrobatics, Stealth, Thievery, Reflex saves and Dexterity-based attack rolls, and a +20-foot status bonus to Speed. Drawback: you take damage equal to twice your level, which nothing heals while it lasts. Duration 1 hour.'
consumables.serene-mutagen-lesser.name: 'Serene Mutagen (Lesser)'
consumables.serene-mutagen-lesser.description: "Item 1, 4 gp, light. You find inner calm but recoil from violence. Benefit: a +1 item bonus to Will saves and to Perception, Medicine, Nature, Religion and Survival (+1 more on Will saves against mental effects). Drawback: a -1 penalty to attack rolls and offensive spells' DCs, and -1 per damage die to weapon, unarmed and spell damage. Duration 1 minute."
consumables.serene-mutagen-moderate.name: 'Serene Mutagen (Moderate)'
consumables.serene-mutagen-moderate.description: "Item 3, 12 gp, light. You find inner calm but recoil from violence. Benefit: a +2 item bonus to Will saves and to Perception, Medicine, Nature, Religion and Survival (+1 more on Will saves against mental effects). Drawback: a -1 penalty to attack rolls and offensive spells' DCs, and -1 per damage die to weapon, unarmed and spell damage. Duration 10 minutes."
consumables.serene-mutagen-greater.name: 'Serene Mutagen (Greater)'
consumables.serene-mutagen-greater.description: "Item 11, 300 gp, light. You find inner calm but recoil from violence. Benefit: a +3 item bonus to Will saves and to Perception, Medicine, Nature, Religion and Survival (+1 more on Will saves against mental effects). Drawback: a -1 penalty to attack rolls and offensive spells' DCs, and -1 per damage die to weapon, unarmed and spell damage. Duration 1 hour."
consumables.serene-mutagen-major.name: 'Serene Mutagen (Major)'
consumables.serene-mutagen-major.description: "Item 17, 3000 gp, light. You find inner calm but recoil from violence. Benefit: a +4 item bonus to Will saves and to Perception, Medicine, Nature, Religion and Survival (+1 more on Will saves against mental effects). Drawback: a -1 penalty to attack rolls and offensive spells' DCs, and -1 per damage die to weapon, unarmed and spell damage. Duration 1 hour."
consumables.silvertongue-mutagen-lesser.name: 'Silvertongue Mutagen (Lesser)'
consumables.silvertongue-mutagen-lesser.description: 'Item 1, 4 gp, light. Your face turns striking and your voice commanding, though emotion clouds your reason. Benefit: a +1 item bonus to Deception, Diplomacy, Intimidation and Performance, whose critical failures become failures. Drawback: a -2 penalty to Arcana, Crafting, Lore, Occultism and Society, whose critical successes become successes. Duration 1 minute.'
consumables.silvertongue-mutagen-moderate.name: 'Silvertongue Mutagen (Moderate)'
consumables.silvertongue-mutagen-moderate.description: 'Item 3, 12 gp, light. Your face turns striking and your voice commanding, though emotion clouds your reason. Benefit: a +2 item bonus to Deception, Diplomacy, Intimidation and Performance, whose critical failures become failures. Drawback: a -2 penalty to Arcana, Crafting, Lore, Occultism and Society, whose critical successes become successes. Duration 10 minutes.'
consumables.silvertongue-mutagen-greater.name: 'Silvertongue Mutagen (Greater)'
consumables.silvertongue-mutagen-greater.description: 'Item 11, 300 gp, light. Your face turns striking and your voice commanding, though emotion clouds your reason. Benefit: a +3 item bonus to Deception, Diplomacy, Intimidation and Performance, whose critical failures become failures. Drawback: a -2 penalty to Arcana, Crafting, Lore, Occultism and Society, whose critical successes become successes. Duration 1 hour.'
consumables.silvertongue-mutagen-major.name: 'Silvertongue Mutagen (Major)'
consumables.silvertongue-mutagen-major.description: 'Item 17, 3000 gp, light. Your face turns striking and your voice commanding, though emotion clouds your reason. Benefit: a +4 item bonus to Deception, Diplomacy, Intimidation and Performance, whose critical failures become failures. Drawback: a -2 penalty to Arcana, Crafting, Lore, Occultism and Society, whose critical successes become successes. Duration 1 hour.'
consumables.drakeheart-mutagen-lesser.name: 'Drakeheart Mutagen (Lesser)'
consumables.drakeheart-mutagen-lesser.description: "Item 1, 4 gp, light. Your heart beats like a dragon's. Benefit: a +4 item bonus to AC and +1 to Perception, and Final Surge (one action: Stride twice, ending the mutagen). Drawback: a -1 penalty to Will and Reflex saves and Recall Knowledge. Duration 1 minute."
consumables.drakeheart-mutagen-moderate.name: 'Drakeheart Mutagen (Moderate)'
consumables.drakeheart-mutagen-moderate.description: "Item 3, 12 gp, light. Your heart beats like a dragon's. Benefit: a +5 item bonus to AC and +2 to Perception, and Final Surge (one action: Stride twice, ending the mutagen). Drawback: a -1 penalty to Will and Reflex saves and Recall Knowledge. Duration 10 minutes."
consumables.drakeheart-mutagen-greater.name: 'Drakeheart Mutagen (Greater)'
consumables.drakeheart-mutagen-greater.description: "Item 11, 300 gp, light. Your heart beats like a dragon's. Benefit: a +6 item bonus to AC and +3 to Perception, and Final Surge (one action: Stride twice, ending the mutagen). Drawback: a -1 penalty to Will and Reflex saves and Recall Knowledge. Duration 1 hour."
consumables.drakeheart-mutagen-major.name: 'Drakeheart Mutagen (Major)'
consumables.drakeheart-mutagen-major.description: "Item 17, 3000 gp, light. Your heart beats like a dragon's. Benefit: a +7 item bonus to AC and +4 to Perception, and Final Surge (one action: Stride twice, ending the mutagen). Drawback: a -1 penalty to Will and Reflex saves and Recall Knowledge. Duration 1 hour."

# Elixirs.
consumables.cheetahs-elixir-lesser.name: "Cheetah's Elixir (Lesser)"
consumables.cheetahs-elixir-lesser.description: 'Item 1, 3 gp, light. A +5-foot status bonus to your Speed for 1 minute.'
consumables.cheetahs-elixir-moderate.name: "Cheetah's Elixir (Moderate)"
consumables.cheetahs-elixir-moderate.description: 'Item 5, 25 gp, light. A +10-foot status bonus to your Speed for 10 minutes.'
consumables.cheetahs-elixir-greater.name: "Cheetah's Elixir (Greater)"
consumables.cheetahs-elixir-greater.description: 'Item 9, 110 gp, light. A +10-foot status bonus to your Speed for 1 hour.'
consumables.eagle-eye-elixir-lesser.name: 'Eagle-Eye Elixir (Lesser)'
consumables.eagle-eye-elixir-lesser.description: 'Item 1, 4 gp, light. A +1 item bonus to Perception checks for 1 hour (+2 to find secret doors and traps).'
consumables.eagle-eye-elixir-moderate.name: 'Eagle-Eye Elixir (Moderate)'
consumables.eagle-eye-elixir-moderate.description: 'Item 5, 27 gp, light. A +2 item bonus to Perception checks for 1 hour (+3 to find secret doors and traps).'
consumables.eagle-eye-elixir-greater.name: 'Eagle-Eye Elixir (Greater)'
consumables.eagle-eye-elixir-greater.description: 'Item 10, 200 gp, light. A +3 item bonus to Perception checks for 1 hour (+4 to find secret doors and traps).'
consumables.eagle-eye-elixir-major.name: 'Eagle-Eye Elixir (Major)'
consumables.eagle-eye-elixir-major.description: 'Item 16, 2000 gp, light. A +3 item bonus to Perception checks for 1 hour (+4 to find secret doors and traps). Within 10 feet of a secret door or trap, the GM rolls a secret check for you to find it.'
consumables.darkvision-elixir-lesser.name: 'Darkvision Elixir (Lesser)'
consumables.darkvision-elixir-lesser.description: 'Item 2, 6 gp, light. You gain darkvision for 10 minutes.'
consumables.darkvision-elixir-moderate.name: 'Darkvision Elixir (Moderate)'
consumables.darkvision-elixir-moderate.description: 'Item 4, 11 gp, light. You gain darkvision for 1 hour.'
consumables.darkvision-elixir-greater.name: 'Darkvision Elixir (Greater)'
consumables.darkvision-elixir-greater.description: 'Item 8, 90 gp, light. You gain darkvision for 24 hours.'

# Poisons.
consumables.arsenic.name: 'Arsenic'
consumables.arsenic.description: "Item 1, 3 gp, light; ingested. A compound of arsenic; while affected you can't reduce your sickened condition. Fortitude DC 18; onset 10 minutes; maximum duration 5 minutes. Stage 1: 1d4 poison and sickened 1 (1 minute); stage 2: 1d6 poison and sickened 2 (1 minute); stage 3: 1d8 poison and sickened 3 (1 minute)."
consumables.belladonna.name: 'Belladonna'
consumables.belladonna.description: 'Item 2, 5 gp, light; ingested. Deadly nightshade. Fortitude DC 19; onset 10 minutes; maximum duration 30 minutes. Stage 1: dazzled (10 minutes); stage 2: 1d6 poison and sickened 1 (10 minutes); stage 3: 1d6 poison, confused and sickened 1 (1 minute).'
consumables.black-adder-venom.name: 'Black Adder Venom'
consumables.black-adder-venom.description: 'Item 2, 6 gp, light; injury. Fortitude DC 18; maximum duration 3 rounds. Stage 1: 1d4 poison (1 round); stage 2: 1d6 poison (1 round); stage 3: 1d8 poison (1 round).'
consumables.giant-centipede-venom.name: 'Giant Centipede Venom'
consumables.giant-centipede-venom.description: 'Item 1, 4 gp, light; injury. Stiffens muscles and saps strength. Fortitude DC 17; maximum duration 6 rounds. Stage 1: 1d4 poison (1 round); stage 2: 1d4 poison and fatigued (1 round); stage 3: 1d4 poison, clumsy 1 and fatigued (1 round).'
consumables.lethargy-poison.name: 'Lethargy Poison'
consumables.lethargy-poison.description: 'Item 2, 7 gp, light; injury. Puts victims to sleep for capture; further exposure needs no new save, but a failed save against an ongoing exposure advances it. Fortitude DC 18; onset 1 round; maximum duration 4 hours. Stage 1: slowed 1 (1 round); stage 2: slowed 1 (1 minute); stage 3: unconscious with no Perception check to wake (1 round); stage 4: unconscious with no Perception check to wake (1d4 hours).'
consumables.cytillesh-oil.name: 'Cytillesh Oil'
consumables.cytillesh-oil.description: 'Item 3, 10 gp, light; injury. Fortitude DC 19; maximum duration 4 rounds. Stage 1: 1d8 poison (1 round); stage 2: 1d10 poison (1 round); stage 3: 2d8 poison (1 round).'
consumables.graveroot.name: 'Graveroot'
consumables.graveroot.description: 'Item 3, 10 gp, light; injury. A sap that clouds the mind. Fortitude DC 19; maximum duration 4 rounds. Stage 1: 1d8 poison (1 round); stage 2: 1d10 poison and stupefied 1 (1 round); stage 3: 2d6 poison and stupefied 2 (1 round).'
consumables.fearflower-nectar.name: 'Fearflower Nectar'
consumables.fearflower-nectar.description: 'Item 4, 16 gp, light; injury. Causes panic. Fortitude DC 21; maximum duration 6 rounds. Stage 1: 1d6 poison and frightened 1 (1 round); stage 2: 1d6 poison and frightened 2 (1 round); stage 3: 1d6 poison and frightened 3 (1 round).'
consumables.leadenleg.name: 'Leadenleg'
consumables.leadenleg.description: 'Item 4, 15 gp, light; injury. Numbs the limbs. Fortitude DC 20; maximum duration 6 rounds. Stage 1: 1d10 poison and a -5-foot status penalty to Speeds (1 round); stage 2: 2d6 poison and -10 feet (1 round); stage 3: 2d6 poison and -20 feet (1 round).'
consumables.spider-venom.name: 'Spider Venom'
consumables.spider-venom.description: "Item 5, 25 gp, light; injury. Erodes a target's defenses. Fortitude DC 22; maximum duration 6 rounds. Stage 1: 1d10 poison and sickened 1 (1 round); stage 2: 1d12 poison, clumsy 1 and sickened 2 (1 round); stage 3: 2d6 poison, clumsy 2 and sickened 3 (1 round)."
consumables.giant-scorpion-venom.name: 'Giant Scorpion Venom'
consumables.giant-scorpion-venom.description: 'Item 6, 40 gp, light; injury. Fortitude DC 22; maximum duration 6 rounds. Stage 1: 2d6 poison and enfeebled 1 (1 round); stage 2: 2d8 poison and enfeebled 1 (1 round); stage 3: 2d10 poison and enfeebled 2 (1 round).'
consumables.tangle-root-toxin.name: 'Tangle Root Toxin'
consumables.tangle-root-toxin.description: 'Item 7, 55 gp, light; contact. Fortitude DC 26; onset 1 minute; maximum duration 6 minutes. Stage 1: clumsy 1 and a -10-foot status penalty to Speeds (1 minute); stage 2: clumsy 2 and -20 feet (1 minute); stage 3: clumsy 3, off-guard and -30 feet (1 minute).'
consumables.nettleweed-residue.name: 'Nettleweed Residue'
consumables.nettleweed-residue.description: 'Item 8, 75 gp, light; contact. Fortitude DC 27; onset 1 minute; maximum duration 6 minutes. Stage 1: 3d6 poison (1 minute); stage 2: 4d6 poison (1 minute); stage 3: 6d6 poison (1 minute).'
consumables.wyvern-poison.name: 'Wyvern Poison'
consumables.wyvern-poison.description: 'Item 8, 80 gp, light; injury. Fortitude DC 26; maximum duration 6 rounds. Stage 1: 3d6 poison (1 round); stage 2: 3d8 poison (1 round); stage 3: 3d10 poison (1 round).'
consumables.enervating-powder.name: 'Enervating Powder'
consumables.enervating-powder.description: 'Item 9, 110 gp, light; inhaled. Fortitude DC 28; onset 10 minutes; maximum duration 6 minutes. Stage 1: fatigued (1 minute); stage 2: 5d6 poison and fatigued (1 minute); stage 3: 6d6 poison, fatigued and paralyzed (1 minute).'
consumables.spider-root.name: 'Spider Root'
consumables.spider-root.description: 'Item 9, 110 gp, light; contact. Fortitude DC 28; onset 1 minute; maximum duration 6 minutes. Stage 1: 3d6 poison and clumsy 1 (1 minute); stage 2: 4d6 poison and clumsy 2 (1 minute); stage 3: 6d6 poison and clumsy 3 (1 minute).'
consumables.nethershade.name: 'Nethershade'
consumables.nethershade.description: 'Item 10, 160 gp, light; injury. Its enfeebled lasts 24 hours. Fortitude DC 29; maximum duration 6 rounds. Stage 1: 2d6 void and 2d6 poison (1 round); stage 2: 3d6 void, 2d6 poison and enfeebled 1 (1 round); stage 3: 3d6 void, 3d6 poison and enfeebled 2 (1 round).'
consumables.wolfsbane.name: 'Wolfsbane'
consumables.wolfsbane.description: "Item 10, 155 gp, light; ingested. Surviving stage 3 cures a werecreature's curse. Fortitude DC 30; onset 10 minutes; maximum duration 6 minutes. Stage 1: 3d10 poison (1 minute); stage 2: 4d10 poison (1 minute); stage 3: 5d10 poison (1 minute)."
consumables.blightburn-resin.name: 'Blightburn Resin'
consumables.blightburn-resin.description: 'Item 11, 225 gp, light; contact. Fortitude DC 30; onset 1 minute; maximum duration 6 rounds. Stage 1: 6d6 poison (1 round); stage 2: 7d6 poison (1 round); stage 3: 9d6 poison (1 round).'
consumables.cave-worm-venom.name: 'Cave Worm Venom'
consumables.cave-worm-venom.description: 'Item 12, 500 gp, light; injury. Fortitude DC 32; maximum duration 6 rounds. Stage 1: 5d6 poison and enfeebled 2 (1 round); stage 2: 6d6 poison and enfeebled 2 (1 round); stage 3: 8d6 poison and enfeebled 2 (1 round).'
consumables.slumber-wine.name: 'Slumber Wine'
consumables.slumber-wine.description: "Item 12, 325 gp, light; ingested. Its sleepers can't be woken, need no food or drink, and seem freshly dead (DC 40 Medicine to tell). Fortitude DC 32; onset 1 hour; maximum duration 7 days. Stage 1: unconscious (1 day); stage 2: unconscious (2 days); stage 3: unconscious (3 days)."
consumables.deathcap-powder.name: 'Deathcap Powder'
consumables.deathcap-powder.description: 'Item 13, 450 gp, light; ingested. Fortitude DC 33; onset 10 minutes; maximum duration 6 minutes. Stage 1: 7d8 poison (1 minute); stage 2: 9d6 poison and sickened 2 (1 minute); stage 3: 8d10 poison and sickened 3 (1 minute).'
consumables.mindfog-mist.name: 'Mindfog Mist'
consumables.mindfog-mist.description: 'Item 15, 1,000 gp, light; inhaled. Fortitude DC 35; onset 1 round; maximum duration 6 rounds. Stage 1: stupefied 2 (1 round); stage 2: confused and stupefied 3 (1 round); stage 3: confused and stupefied 4 (1 round).'
consumables.brimstone-fumes.name: 'Brimstone Fumes'
consumables.brimstone-fumes.description: 'Item 16, 1,500 gp, light; inhaled. Fortitude DC 36; onset 1 round; maximum duration 6 rounds. Stage 1: 7d8 poison and enfeebled 1 (1 round); stage 2: 8d8 poison and enfeebled 2 (1 round); stage 3: 10d8 poison and enfeebled 3 (1 round).'
consumables.cerulean-scourge.name: 'Cerulean Scourge'
consumables.cerulean-scourge.description: 'Item 16, 1,450 gp, light; injury. Fortitude DC 37; maximum duration 6 rounds. Stage 1: 10d6 poison (1 round); stage 2: 12d6 poison (1 round); stage 3: 14d6 poison (1 round).'
consumables.hemlock.name: 'Hemlock'
consumables.hemlock.description: 'Item 17, 2,250 gp, light; ingested. Fortitude DC 38; onset 30 minutes; maximum duration 60 minutes. Stage 1: 16d6 poison and enfeebled 2 (10 minutes); stage 2: 17d6 poison and enfeebled 3 (10 minutes); stage 3: 18d6 poison and enfeebled 4 (10 minutes).'
consumables.kings-sleep.name: "King's Sleep"
consumables.kings-sleep.description: "Item 18, 4,000 gp, light; ingested. A slow poison passing as illness; its drained adds up and can't be removed while it lasts. Fortitude DC 41; onset 1 day. Stage 1: drained 1 (1 day); stage 2: drained 1 (1 day); stage 3: drained 2 (1 day)."
consumables.black-lotus-extract.name: 'Black Lotus Extract'
consumables.black-lotus-extract.description: 'Item 19, 6,500 gp, light; contact. Fortitude DC 42; onset 1 minute; maximum duration 6 rounds. Stage 1: 13d6 poison and drained 1 (1 round); stage 2: 15d6 poison and drained 1 (1 round); stage 3: 17d6 poison and drained 2 (1 round).'
consumables.tears-of-death.name: 'Tears of Death'
consumables.tears-of-death.description: 'Item 20, 12,000 gp, light; contact. Fortitude DC 44; onset 1 minute; maximum duration 10 minutes. Stage 1: 20d6 poison and paralyzed (1 round); stage 2: 22d6 poison and paralyzed (1 minute); stage 3: 24d6 poison and paralyzed (1 minute).'

# The class.
classes.alchemist.name: 'Alchemist'
classes.alchemist.description: 'A scholar of alchemy who brews bombs, elixirs, mutagens and poisons. Key attribute: Intelligence. 8 Hit Points plus Constitution per level. Trained in Perception and Will, expert in Fortitude and Reflex; trained in simple weapons, alchemical bombs and unarmed attacks; trained in light and medium armor and unarmored defense; trained in the alchemist class DC. Trained in Crafting and 3 more skills plus Intelligence. You gain Alchemical Crafting, a formula book, advanced alchemy (4 + Intelligence infused items each day), versatile vials (2 + Intelligence) and Quick Alchemy.'
classes.alchemist.choices.research-field.prompt: 'Research field'
classes.alchemist.choices.skills.prompt: 'Trained skills (3 plus Intelligence)'
classes.alchemist.choices.formulas.prompt: 'Formulas (2 for your book and 4 from Alchemical Crafting, common 1st-level)'
classes.alchemist.choices.new-formulas.prompt: 'New formulas (level {slot})'
classes.alchemist.choices.class-feat.prompt: 'Alchemist feat (level {slot})'
classes.alchemist.choices.skill-feat.prompt: 'Skill feat (level {slot})'

# Research fields.
classes.alchemist.fields.bomber.name: 'Bomber'
classes.alchemist.fields.bomber.description: "You specialize in explosions. Formulas: two common 1st-level bombs. Field benefit: a splash bomb's splash can hit only the primary target. Field vials: a versatile vial can deal cold, electricity or fire damage instead of acid. Field discovery (5th): a splash bomb can deal splash damage equal to your Intelligence modifier (at least 1). Advanced vials (11th): a vial can count as adamantine, cold iron or dawnsilver. Greater field discovery (13th): your splash can reach 10 feet (15 with Expanded Splash)."
classes.alchemist.fields.bomber.choices.formulas.prompt: 'Bomber formulas (two)'
classes.alchemist.fields.chirurgeon.name: 'Chirurgeon'
classes.alchemist.fields.chirurgeon.description: 'You heal with alchemy. Formulas: two common 1st-level healing elixirs. Field benefit: your Crafting rank counts for Medicine prerequisites and you use your Crafting modifier for Medicine checks. Field vials: a vial can heal a living creature by its initial damage (drunk, or thrown to a willing creature within 20 feet as an Interact). Field discovery (5th): a creature drinking a healing elixir you infused gains temporary Hit Points equal to your Intelligence modifier for 1 minute. Advanced vials (11th): healing a creature at half its Hit Points or fewer ignores the coagulant trait. Greater field discovery (13th): an elixir of life from Quick Alchemy heals its maximum.'
classes.alchemist.fields.chirurgeon.choices.formulas.prompt: 'Chirurgeon formulas (two)'
classes.alchemist.fields.mutagenist.name: 'Mutagenist'
classes.alchemist.fields.mutagenist.description: "You focus on mutagens. Formulas: two common 1st-level mutagens. Field benefit: using a mutagen gives you temporary Hit Points equal to your Intelligence modifier + half your level for 1 minute (once a minute). Field vials: drinking a vial suppresses one mutagen's drawback for 1 minute. Field discovery (5th): affected by a mutagen, you can end it to reroll a Fortitude save (fortune). Advanced vials (11th): that vial also gives resistance to physical damage of half your level. Greater field discovery (13th): you can benefit from two mutagens at once."
classes.alchemist.fields.mutagenist.choices.formulas.prompt: 'Mutagenist formulas (two)'
classes.alchemist.fields.toxicologist.name: 'Toxicologist'
classes.alchemist.fields.toxicologist.description: "You specialize in poisons. Formulas: two common 1st-level poisons. Field benefit: you apply an injury poison to a held weapon or ammunition as one action, and your infused poisons can harm creatures immune to poison (with acid damage when that's worse for them). Field vials: your vials deal poison damage, and can be applied as an injury poison adding their initial damage to the weapon's next hit this turn. Field discovery (5th): poison resistance equal to half your level. Advanced vials (11th): that vial poison also deals persistent poison damage equal to its splash. Greater field discovery (13th): a creature failing its first save against your infused injury poison sprays it onto an adjacent creature."
classes.alchemist.fields.toxicologist.choices.formulas.prompt: 'Toxicologist formulas (two)'

# Features.
features.alchemist.alchemy.name: 'Alchemy'
features.alchemist.alchemy.description: "You know Alchemical Crafting and identify the alchemical items whose formulas you have. Formula book: two common 1st-level formulas, those of Alchemical Crafting and your field, and two more each level. Advanced alchemy: during daily preparations you make 4 + your Intelligence modifier infused consumables of your level or lower from your book, free. Versatile vials: during daily preparations you make 2 + your Intelligence modifier vials (the maximum), regaining 2 every 10 minutes of exploration; one thrown is a bomb (1d6 acid damage and 1 acid splash, 2d6 and 2 at 3rd level, 3d6 and 3 at 11th, 4d6 and 4 at 17th). Quick Alchemy (one action, with an alchemist's toolkit and a free hand): spend a vial to make an alchemical consumable of your level or lower from your book, potent until the start of your next turn, or make a quick vial usable only this turn as a bomb or your field's vial."
features.alchemist.alchemy.actions.versatile-vial.name: 'Versatile Vial (Strike)'
features.alchemist.alchemy.actions.versatile-vial.description: 'Throw a versatile vial as a bomb (a quick vial spends none).'
features.alchemist.alchemy.actions.versatile-vial.params.quick.name: 'A quick vial (Quick Alchemy)'
features.alchemist.alchemy.actions.versatile-vial.params.damageType.name: 'Damage type (bomber)'
features.alchemist.alchemy.actions.versatile-vial.params.intSplash.name: 'Splash of your Intelligence modifier (bomber, 5th)'
features.alchemist.alchemy.actions.versatile-vial.params.ac.name: "Target's AC"
features.alchemist.alchemy.actions.versatile-vial.params.attack.name: 'Attack number this turn'
features.alchemist.alchemy.actions.versatile-vial.participants.target.name: 'Target'
features.alchemist.alchemy.actions.healing-vial.name: 'Healing Vial (chirurgeon)'
features.alchemist.alchemy.actions.healing-vial.params.quick.name: 'A quick vial (Quick Alchemy)'
features.alchemist.alchemy.actions.healing-vial.participants.ally.name: 'The creature healed'
features.alchemist.alchemy.actions.healing-vial.results.healed.name: 'Healed'
features.alchemist.alchemy.actions.quick-alchemy.name: 'Quick Alchemy'
features.alchemist.alchemy.actions.quick-alchemy.steps.what.prompt: 'Make what?'
features.alchemist.alchemy.actions.quick-alchemy.options.consumable.name: 'An item from your formula book (spends a vial)'
features.alchemist.alchemy.actions.quick-alchemy.options.quick-vial.name: 'A quick vial (usable this turn)'
features.alchemist.alchemy.actions.quick-alchemy.steps.item.prompt: 'The item'
features.alchemist.alchemy.actions.quick-alchemy.results.made.name: 'Made'
features.alchemist.alchemy.actions.quick-alchemy.results.quick-vial.name: 'A quick vial'
features.alchemist.powerful-alchemy.name: 'Powerful Alchemy'
features.alchemist.powerful-alchemy.description: 'An infused alchemical item you create that calls for a save can use your class DC instead.'
features.alchemist.alchemical-weapon-expertise.name: 'Alchemical Weapon Expertise'
features.alchemist.alchemical-weapon-expertise.description: 'Your proficiency ranks for simple weapons, alchemical bombs and unarmed attacks increase to expert.'
features.alchemist.will-expertise.name: 'Will Expertise'
features.alchemist.will-expertise.description: 'Your proficiency rank for Will saves increases to expert.'
features.alchemist.alchemical-expertise.name: 'Alchemical Expertise'
features.alchemist.alchemical-expertise.description: 'Your proficiency rank for the alchemist class DC increases to expert, and you regain three vials (not two) while exploring.'
features.alchemist.double-brew.name: 'Double Brew'
features.alchemist.double-brew.description: 'Quick Alchemy can make two items at once (two consumables spend two vials).'
features.alchemist.perception-expertise.name: 'Perception Expertise'
features.alchemist.perception-expertise.description: 'Your proficiency rank for Perception increases to expert.'
features.alchemist.chemical-hardiness.name: 'Chemical Hardiness'
features.alchemist.chemical-hardiness.description: 'Your proficiency rank for Fortitude saves increases to master, and a success on a Fortitude save is a critical success instead.'
features.alchemist.medium-armor-expertise.name: 'Medium Armor Expertise'
features.alchemist.medium-armor-expertise.description: 'Your proficiency ranks for light and medium armor and unarmored defense increase to expert.'
features.alchemist.weapon-specialization.name: 'Weapon Specialization'
features.alchemist.weapon-specialization.description: 'You deal 2 more damage with weapons and unarmed attacks in which you are an expert, 3 if a master, 4 if legendary.'
features.alchemist.alchemical-weapon-mastery.name: 'Alchemical Weapon Mastery'
features.alchemist.alchemical-weapon-mastery.description: 'Your proficiency ranks for simple weapons, alchemical bombs and unarmed attacks increase to master.'
features.alchemist.explosion-dodger.name: 'Explosion Dodger'
features.alchemist.explosion-dodger.description: 'Your proficiency rank for Reflex saves increases to master, and a success on a Reflex save is a critical success instead.'
features.alchemist.abundant-vials.name: 'Abundant Vials'
features.alchemist.abundant-vials.description: "You're permanently quickened; the extra action can only make one quick vial with Quick Alchemy."
features.alchemist.alchemical-mastery.name: 'Alchemical Mastery'
features.alchemist.alchemical-mastery.description: 'Your proficiency rank for the alchemist class DC increases to master.'
features.alchemist.medium-armor-mastery.name: 'Medium Armor Mastery'
features.alchemist.medium-armor-mastery.description: 'Your proficiency ranks for light and medium armor and unarmored defense increase to master.'

# Feats.
feats.alchemist.alchemical-assessment.name: 'Alchemical Assessment'
feats.alchemist.alchemical-assessment.description: 'You can Identify Alchemy on an alchemical item you hold with Crafting as a single action instead of 10 minutes.'
feats.alchemist.alchemical-assessment.prerequisites.crafting: 'Trained in Crafting'
feats.alchemist.alchemical-familiar.name: 'Alchemical Familiar'
feats.alchemist.alchemical-familiar.description: 'You create a familiar of alchemical stuff and your blood: it has the construct ability permanently (without tough, and not counting toward its abilities) and uses your Intelligence modifier for its Perception, Acrobatics and Stealth.'
feats.alchemist.blowgun-poisoner.name: 'Blowgun Poisoner'
feats.alchemist.blowgun-poisoner.description: "Your blowgun Strikes deliver injury poisons even when resistance stops their damage; a critical hit with a poisoned dart makes the target's first save one degree worse (misfortune). A blowgun Strike while hidden or undetected needs a Stealth check against the target's Perception DC; on a success you're hidden instead of observed."
feats.alchemist.far-lobber.name: 'Far Lobber'
feats.alchemist.far-lobber.description: 'Your alchemical bombs have a range increment of 30 feet instead of 20.'
feats.alchemist.quick-bomber.name: 'Quick Bomber'
feats.alchemist.quick-bomber.description: 'One action. You draw a bomb (or a versatile vial, or make one with Quick Alchemy) and Strike with it.'
feats.alchemist.quick-bomber.actions.quick-bomber.name: 'Quick Bomber'
feats.alchemist.quick-bomber.actions.quick-bomber.steps.bomb.prompt: 'Choose a bomb'
feats.alchemist.soothing-vials.name: 'Soothing Vials'
feats.alchemist.soothing-vials.description: 'A living creature under a mental effect that regains Hit Points from your vial can attempt a new Will save, with a +1 item bonus, to end one mental effect.'
feats.alchemist.soothing-vials.prerequisites.field: 'Chirurgeon research field'
feats.alchemist.clotting-elixirs.name: 'Clotting Elixirs'
feats.alchemist.clotting-elixirs.description: 'A living creature drinking a healing elixir you infused can attempt a DC 10 flat check to end persistent bleed damage.'
feats.alchemist.improvise-admixture.name: 'Improvise Admixture'
feats.alchemist.improvise-admixture.description: "One action, once a day, with fewer than your maximum vials and an alchemist's toolkit. Attempt a Crafting check (usually a standard DC of your level). **Critical Success** Regain 3 vials. **Success** 2. **Failure** 1. **Critical Failure** None."
feats.alchemist.improvise-admixture.actions.improvise-admixture.name: 'Improvise Admixture'
feats.alchemist.improvise-admixture.actions.improvise-admixture.params.dc.name: 'DC'
feats.alchemist.pernicious-poison.name: 'Pernicious Poison'
feats.alchemist.pernicious-poison.description: 'Additive: a poison you make deals poison damage equal to its level to a target that succeeds (not critically) at its first save.'
feats.alchemist.revivifying-mutagen.name: 'Revivifying Mutagen'
feats.alchemist.revivifying-mutagen.description: 'One action while a mutagen affects you: you regain 1d6 Hit Points per 2 levels, and the mutagen ends.'
feats.alchemist.revivifying-mutagen.actions.revivifying-mutagen.name: 'Revivifying Mutagen'
feats.alchemist.revivifying-mutagen.actions.revivifying-mutagen.results.revived.name: 'Revived'
feats.alchemist.smoke-bomb.name: 'Smoke Bomb'
feats.alchemist.smoke-bomb.description: "Additive: a bomb also releases a 10-foot burst of smoke at a corner of the target's space for 1 minute; creatures in it are concealed, and others are concealed to them."
feats.alchemist.efficient-alchemy.name: 'Efficient Alchemy'
feats.alchemist.efficient-alchemy.description: 'Advanced alchemy makes 6 + your Intelligence modifier items a day, and your downtime batches of alchemical consumables are twice as large.'
feats.alchemist.enduring-alchemy.name: 'Enduring Alchemy'
feats.alchemist.enduring-alchemy.description: 'A tool or elixir from Quick Alchemy stays potent until the end of your next turn.'
feats.alchemist.healing-bomb.name: 'Healing Bomb'
feats.alchemist.healing-bomb.description: "Additive: you can throw an elixir of life at a creature within 20 feet (an Interact): it's affected as if it drank it, and each adjacent living creature regains as many Hit Points as the elixir's dice."
feats.alchemist.invigorating-elixir.name: 'Invigorating Elixir'
feats.alchemist.invigorating-elixir.description: "Additive: a healing elixir can be drunk even by one who otherwise couldn't (a sickened creature), and tries to counteract one effect making it clumsy, enfeebled, sickened or stupefied (counteract rank half your level rounded up, modifier your class DC - 10); then it's immune for 10 minutes."
feats.alchemist.regurgitate-mutagen.name: 'Regurgitate Mutagen'
feats.alchemist.regurgitate-mutagen.description: 'One action while a mutagen affects you: a creature within 30 feet takes 1d6 acid damage per 2 levels (basic Reflex save against your class DC), and is sickened 1 on a failure (2 on a critical failure). The mutagen ends.'
feats.alchemist.regurgitate-mutagen.actions.regurgitate-mutagen.name: 'Regurgitate Mutagen'
feats.alchemist.regurgitate-mutagen.actions.regurgitate-mutagen.results.spat.name: 'Spat'
feats.alchemist.tenacious-toxins.name: 'Tenacious Toxins'
feats.alchemist.tenacious-toxins.description: "Your poisons' maximum duration grows by their stage 1 interval, up to double."
feats.alchemist.combine-elixirs.name: 'Combine Elixirs'
feats.alchemist.combine-elixirs.description: 'Additive: spend another vial to fold a second elixir of the same level or lower into one you make; drinking it gives both.'
feats.alchemist.debilitating-bomb.name: 'Debilitating Bomb'
feats.alchemist.debilitating-bomb.description: 'Additive: a bomb that hits also imposes, unless the target succeeds at a Fortitude save against your class DC, dazzled, deafened, off-guard or a -5-foot status penalty to Speeds until the start of your next turn.'
feats.alchemist.directional-bombs.name: 'Directional Bombs'
feats.alchemist.directional-bombs.description: "A splash bomb's splash can be a 15-foot cone starting in the target's space instead (20 feet with Expanded Splash)."
feats.alchemist.fortified-elixirs.name: 'Fortified Elixirs'
feats.alchemist.fortified-elixirs.description: 'A creature under your infused antidote or antiplague can reroll a failed Fortitude save against that kind of affliction, without the item bonus, ending the elixir (fortune).'
feats.alchemist.sticky-poison.name: 'Sticky Poison'
feats.alchemist.sticky-poison.description: 'If a Strike with your poisoned weapon would spend the poison without a save, a DC 5 flat check keeps it; after a hit, a DC 17 flat check keeps it until the end of your next turn.'
feats.alchemist.alter-admixture.name: 'Alter Admixture'
feats.alchemist.alter-admixture.description: "Exploration, 10 minutes, with an alchemist's toolkit: turn an item from advanced alchemy into a similar one (bomb to bomb, elixir to elixir, poison to poison) of the same level or lower whose formula you know; it stays infused as long as the original."
feats.alchemist.improved-invigorating-elixir.name: 'Improved Invigorating Elixir'
feats.alchemist.improved-invigorating-elixir.description: 'Your invigorating elixirs can also counteract either physical conditions (blinded, deafened, drained, paralyzed, slowed) or mental ones (confused, controlled, fleeing, frightened, paralyzed, slowed). You can take this feat a second time for the other.'
feats.alchemist.improved-invigorating-elixir.choices.invigoration.prompt: 'Invigoration'
feats.alchemist.improved-invigorating-elixir.choices.invigoration.options.physical.name: 'Physical'
feats.alchemist.improved-invigorating-elixir.choices.invigoration.options.mental.name: 'Mental'
feats.alchemist.improved-invigorating-elixir.prerequisites.invigorating-elixir: 'Invigorating Elixir'
feats.alchemist.mutant-physique.name: 'Mutant Physique'
feats.alchemist.mutant-physique.description: 'Bestial mutagen: its bonus applies to Intimidation, and your claws and jaws gain a larger die and deadly d10. Juggernaut mutagen: resistance to physical damage equal to half your level. Quicksilver mutagen: you can Step 10 feet and squeeze as if a size smaller.'
feats.alchemist.pinpoint-poisoner.name: 'Pinpoint Poisoner'
feats.alchemist.pinpoint-poisoner.description: 'An off-guard creature you poison with a Strike or an inhaled poison takes a -2 circumstance penalty to its first save.'
feats.alchemist.sticky-bomb.name: 'Sticky Bomb'
feats.alchemist.sticky-bomb.description: "Additive: a creature a bomb hits also takes persistent damage equal to the bomb's listed splash, of its type (added to the bomb's own persistent damage)."
feats.alchemist.advanced-efficient-alchemy.name: 'Advanced Efficient Alchemy'
feats.alchemist.advanced-efficient-alchemy.description: 'Advanced alchemy makes 8 + your Intelligence modifier items a day (10 + it from 16th level).'
feats.alchemist.advanced-efficient-alchemy.prerequisites.efficient-alchemy: 'Efficient Alchemy'
feats.alchemist.expanded-splash.name: 'Expanded Splash'
feats.alchemist.expanded-splash.description: "A splash bomb's splash can reach 10 feet instead of 5, with a status bonus to the splash damage equal to your Intelligence modifier (with the bomber's field discovery, twice your Intelligence modifier in all)."
feats.alchemist.greater-debilitating-bomb.name: 'Greater Debilitating Bomb'
feats.alchemist.greater-debilitating-bomb.description: 'Debilitating Bomb can also impose clumsy 1, enfeebled 1, stupefied 1 or a -10-foot status penalty to Speeds.'
feats.alchemist.greater-debilitating-bomb.prerequisites.debilitating-bomb: 'Debilitating Bomb'
feats.alchemist.unstable-concoction.name: 'Unstable Concoction'
feats.alchemist.unstable-concoction.description: "Additive: the dice of a consumable's initial effect grow one size (a moderate alchemist's fire deals 2d10); whoever activates it must succeed at a DC 10 flat check or take acid damage equal to its level."
feats.alchemist.extend-elixir.name: 'Extend Elixir'
feats.alchemist.extend-elixir.description: "An infused elixir you made that lasts 1 minute or more lasts twice as long for you (Quick Alchemy's 10-minute limit still applies)."
feats.alchemist.supreme-invigorating-elixir.name: 'Supreme Invigorating Elixir'
feats.alchemist.supreme-invigorating-elixir.description: 'Your invigorating elixirs counteract as if you were 2 levels higher and can also counteract petrified, stunned or a disease.'
feats.alchemist.supreme-invigorating-elixir.prerequisites.invigorating-elixir: 'Invigorating Elixir'
feats.alchemist.uncanny-bombs.name: 'Uncanny Bombs'
feats.alchemist.uncanny-bombs.description: "Your bombs' range increment is 60 feet, a target's circumstance bonus to AC from cover is 1 lower against them, and you automatically succeed at the flat check against a concealed target."
feats.alchemist.uncanny-bombs.prerequisites.far-lobber: 'Far Lobber'
feats.alchemist.double-poison.name: 'Double Poison'
feats.alchemist.double-poison.description: "You can apply two infused injury poisons at least 2 levels below yours to one weapon; they merge into one using the lower DC and stage count and both poisons' effects."
feats.alchemist.mutant-innervation.name: 'Mutant Innervation'
feats.alchemist.mutant-innervation.description: 'Cognitive mutagen: its bonus also applies to Deception, Diplomacy, Intimidation, Medicine, Nature, Performance, Religion and Survival, and you have 60-foot telepathy with creatures sharing a language. Serene mutagen: detection, revelation and scrying effects of 9th rank or lower find nothing on you. Silvertongue mutagen: you ignore circumstance penalties to Deception, Diplomacy, Intimidation and Performance, and everyone understands your speech.'
feats.alchemist.true-debilitating-bomb.name: 'True Debilitating Bomb'
feats.alchemist.true-debilitating-bomb.description: 'Debilitating Bomb can also impose enfeebled 2, stupefied 2 or a -15-foot status penalty to Speeds.'
feats.alchemist.true-debilitating-bomb.prerequisites.greater-debilitating-bomb: 'Greater Debilitating Bomb'
feats.alchemist.eternal-elixir.name: 'Eternal Elixir'
feats.alchemist.eternal-elixir.description: 'When you drink an infused elixir you made, of half your level or lower and lasting 1 minute or more, its duration can be indefinite (one at a time).'
feats.alchemist.eternal-elixir.prerequisites.extend-elixir: 'Extend Elixir'
feats.alchemist.exploitive-bomb.name: 'Exploitive Bomb'
feats.alchemist.exploitive-bomb.description: 'Additive: choose a damage type the bomb deals; all its damage ignores that much resistance up to your level.'
feats.alchemist.persistent-mutagen.name: 'Persistent Mutagen'
feats.alchemist.persistent-mutagen.description: 'Once a day, an infused mutagen you drink lasts until your next daily preparations.'
feats.alchemist.persistent-mutagen.prerequisites.extend-elixir: 'Extend Elixir'
feats.alchemist.improbable-elixirs.name: 'Improbable Elixirs'
feats.alchemist.improbable-elixirs.description: 'Choose potions of 9th level or lower, as many as your Intelligence modifier (at least 1): you gain their formulas as alchemical elixirs, using reagents and your alchemist tools in place of magic.'
feats.alchemist.miracle-worker.name: 'Miracle Worker'
feats.alchemist.miracle-worker.description: 'Once every 10 minutes you can give a major or true elixir of life to a creature dead no more than 2 rounds: it returns with 1 Hit Point and wounded 1.'
feats.alchemist.perfect-debilitation.name: 'Perfect Debilitation'
feats.alchemist.perfect-debilitation.description: "A Debilitating Bomb's target avoids the condition only on a critical success."
feats.alchemist.alchemical-revivification.name: 'Alchemical Revivification'
feats.alchemist.alchemical-revivification.description: "If you die while under an elixir, you return at the start of your next turn under an elixir of rejuvenation, then a true elixir of life, then a major bestial, juggernaut or quicksilver mutagen; then you're immune for 1d4 hours."
feats.alchemist.craft-philosophers-stone.name: "Craft Philosopher's Stone"
feats.alchemist.craft-philosophers-stone.description: "You learn the philosopher's stone's formula."
feats.alchemist.mega-bomb.name: 'Mega Bomb'
feats.alchemist.mega-bomb.description: 'Additive: throwing the bomb is a 2-action activity, not a Strike: it explodes in a 30-foot burst within 60 feet, each creature taking its damage as a primary target (basic Reflex save) and, on a failure, its primary-target effects; no splash beyond.'
