# Sorcerer feats to 20th level. Short rules text written for the pack.

feats.sorcerer.bloodline-resistance.name: 'Bloodline Resistance'
feats.sorcerer.bloodline-resistance.description: 'You gain a +1 status bonus to saves against spells and magical effects.'
feats.sorcerer.crossblooded-evolution.name: 'Crossblooded Evolution'
feats.sorcerer.crossblooded-evolution.description: 'Choose another bloodline: you know its blood magic effect (making its 1st-level choice, such as an elemental influence, now).'
feats.sorcerer.explosion-of-power.name: 'Explosion of Power'
feats.sorcerer.explosion-of-power.description: 'You know a blood magic effect: each creature in a 5-foot emanation takes 1d6 damage per rank of the spell you cast (basic Reflex save): force for arcane, spirit for divine, mental for occult, fire for primal.'
feats.spellcasting.soulsight.name: 'Soulsight'
feats.spellcasting.soulsight.description: "You gain spiritsense, an imprecise sense with a 60-foot range that perceives spirits (living creatures, most undead that aren't mindless, haunts, projected and possessing spirits), but not soulless bodies, constructs or objects, nor through solid objects."
feats.sorcerer.energy-fusion.name: 'Energy Fusion'
feats.sorcerer.energy-fusion.description: "One action, spellshape. If your next action casts a spell dealing energy damage, expend a slot of a repertoire spell dealing another energy type: the spell deals extra damage equal to that slot's rank, the total split evenly between the two types."
feats.sorcerer.signature-spell-expansion.name: 'Signature Spell Expansion'
feats.sorcerer.signature-spell-expansion.description: 'You gain two more signature spells, each of base rank 3rd or lower.'
feats.sorcerer.blood-sovereignty.name: 'Blood Sovereignty'
feats.sorcerer.blood-sovereignty.description: "When you would benefit from blood magic, you can lose Hit Points equal to twice the spell's rank to gain two different blood magic effects you know (with different targets if you like)."
feats.sorcerer.bloodline-focus.name: 'Bloodline Focus'
feats.sorcerer.bloodline-focus.description: 'When you Refocus, you refill your focus pool.'
feats.sorcerer.bloodline-focus.prerequisites.bloodline: 'A bloodline spell'
feats.sorcerer.greater-physical-evolution.name: 'Greater Physical Evolution'
feats.sorcerer.greater-physical-evolution.description: "Once a day, a sorcerer slot (or Primal Evolution's) can cast any common polymorph battle form spell of its rank as a signature spell."
feats.sorcerer.greater-physical-evolution.prerequisites.primal-evolution-or: 'Primal Evolution or Arcane Evolution'
feats.sorcerer.greater-spiritual-evolution.name: 'Greater Spiritual Evolution'
feats.sorcerer.greater-spiritual-evolution.description: "Your spells work as if they had the ghost touch rune, can affect a creature's projected or possessing consciousness you know about, and affect creatures on the Ethereal Plane."
feats.sorcerer.greater-spiritual-evolution.prerequisites.divine-evolution-or: 'Divine Evolution or Occult Evolution'
feats.sorcerer.terraforming-trickery.name: 'Terraforming Trickery'
feats.sorcerer.terraforming-trickery.description: 'You know a blood magic effect: the spaces adjacent to you become difficult terrain, or stop being difficult terrain (not greater difficult terrain or hazards).'
feats.sorcerer.blood-ascendancy.name: 'Blood Ascendancy'
feats.sorcerer.blood-ascendancy.description: 'Blood Rising can give you two different blood magic effects you know, each with its own target.'
feats.sorcerer.blood-ascendancy.prerequisites.blood-rising: 'Blood Rising'
feats.sorcerer.interweave-dispel.name: 'Interweave Dispel'
feats.sorcerer.interweave-dispel.description: 'One action, spellshape. If your next action casts a single-target spell that hits an enemy or that it fails its save against, you can cast dispel magic on it as a free action, spending a slot, against one of its spell effects.'
feats.sorcerer.interweave-dispel.prerequisites.dispel: '_dispel magic_ in your spell repertoire'
feats.sorcerer.reflect-harm.name: 'Reflect Harm'
feats.sorcerer.reflect-harm.description: 'You know a blood magic effect: the first time a spell damages you before your next turn, make a spell attack against its caster; on a hit it takes the same damage and type (double on a critical hit).'
feats.sorcerer.spell-shroud.name: 'Spell Shroud'
feats.sorcerer.spell-shroud.description: 'One action, spellshape. If your next action casts a spell targeting you, a 15-foot emanation of mist surrounds you until your next turn: creatures inside are concealed, and those outside concealed to them.'
feats.sorcerer.greater-mental-evolution.name: 'Greater Mental Evolution'
feats.sorcerer.greater-mental-evolution.description: 'Your repertoire holds one more spell of each rank you can cast.'
feats.sorcerer.greater-mental-evolution.prerequisites.arcane-evolution-or: 'Arcane Evolution or Occult Evolution'
feats.sorcerer.greater-mental-evolution.choices.spell.prompt: 'Greater Mental Evolution spell (rank {slot})'
feats.sorcerer.greater-vital-evolution.name: 'Greater Vital Evolution'
feats.sorcerer.greater-vital-evolution.description: 'Twice a day you can cast a spell after running out of slots of its rank (the two of different ranks).'
feats.sorcerer.greater-vital-evolution.prerequisites.primal-evolution-or: 'Primal Evolution or Divine Evolution'
feats.sorcerer.echoing-spell.name: 'Echoing Spell'
feats.sorcerer.echoing-spell.description: 'One action, spellshape. If your next action casts a spell of 4th rank or lower without a duration, you can cast it again before the end of your next turn without a slot.'
feats.sorcerer.greater-crossblooded-evolution.name: 'Greater Crossblooded Evolution'
feats.sorcerer.greater-crossblooded-evolution.description: 'Up to three gift spells of your Crossblooded Evolution bloodline join your repertoire, heightened as high as you can cast (below your highest rank), cast with your tradition.'
feats.sorcerer.greater-crossblooded-evolution.prerequisites.crossblooded-evolution: 'Crossblooded Evolution'
feats.sorcerer.bloodline-conduit.name: 'Bloodline Conduit'
feats.sorcerer.bloodline-conduit.description: 'One action, once per minute, spellshape. If your next action casts a spell of 5th rank or lower without a duration, it spends no slot.'
feats.sorcerer.bloodline-mutation.name: 'Bloodline Mutation'
feats.sorcerer.bloodline-mutation.description: "You become more like your bloodline's creatures: their traits, low-light vision or darkvision as fitting, and one of a fly Speed, amphibious with a swim Speed, or resistance 20 to an energy type they resist (as fits them)."
feats.sorcerer.bloodline-mutation.prerequisites.bloodline: 'A bloodline based on a specific type of creature'
feats.sorcerer.bloodline-perfection.name: 'Bloodline Perfection'
feats.sorcerer.bloodline-perfection.description: 'You gain one more 10th-rank spell slot.'
feats.sorcerer.bloodline-perfection.prerequisites.paragon: 'Bloodline paragon'
situational.bloodlineResistance.name: 'Against a spell or magical effect (Bloodline Resistance)'
