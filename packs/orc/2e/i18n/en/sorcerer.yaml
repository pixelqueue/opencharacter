# Features.
features.sorcerer.sorcerous-potency.name: Sorcerous Potency
features.sorcerer.sorcerous-potency.description: "A spell you cast from a spell slot that deals damage or restores Hit Points gains a status bonus equal to the spell's rank to its initial damage or healing. Each creature gets this bonus only once per spell."
features.sorcerer.blood-magic.name: Blood Magic
features.sorcerer.blood-magic.description: 'When you cast a bloodline spell or a sorcerous gift spell from your bloodline, you can benefit from a blood magic effect you know: your bloodline gives you one. You benefit from one blood magic effect at a time.'
features.sorcerer.blood-magic.actions.blood-magic.name: Blood Magic
features.sorcerer.blood-magic.actions.blood-magic.description: "After casting a bloodline spell or a sorcerous gift spell: a blood magic effect you know, on you or on a target of the spell. Give the spell's rank."
features.sorcerer.blood-magic.actions.blood-magic.params.rank.name: Spell rank
features.sorcerer.blood-magic.actions.blood-magic.participants.target.name: Target
features.sorcerer.blood-magic.actions.blood-magic.steps.effect.prompt: Which blood magic effect?
features.sorcerer.blood-magic.actions.blood-magic.options.none.name: None (forgo it)
features.sorcerer.blood-magic.actions.blood-magic.results.applied.name: Blood magic
features.sorcerer.blood-magic.followUps.blood-magic.name: Blood magic
features.sorcerer.magical-fortitude.name: Magical Fortitude
features.sorcerer.magical-fortitude.description: Your Fortitude proficiency becomes expert.
features.sorcerer.expert-spellcaster.name: Expert Spellcaster
features.sorcerer.expert-spellcaster.description: Your spell attack modifier and spell DC proficiencies become expert.
features.sorcerer.reflex-expertise.name: Reflex Expertise
features.sorcerer.reflex-expertise.description: Your Reflex proficiency becomes expert.
features.sorcerer.perception-expertise.name: Perception Expertise
features.sorcerer.perception-expertise.description: Your Perception proficiency becomes expert.
features.sorcerer.weapon-expertise.name: Weapon Expertise
features.sorcerer.weapon-expertise.description: Expert in simple weapons and unarmed attacks.
features.sorcerer.defensive-robes.name: Defensive Robes
features.sorcerer.defensive-robes.description: Your unarmored defense proficiency becomes expert.
features.sorcerer.weapon-specialization.name: Weapon Specialization
features.sorcerer.weapon-specialization.description: '+2 damage with weapons and unarmed attacks you are expert in, +3 if master, +4 if legendary.'
features.sorcerer.master-spellcaster.name: Master Spellcaster
features.sorcerer.master-spellcaster.description: Your spell attack modifier and spell DC proficiencies become master.
features.sorcerer.majestic-will.name: Majestic Will
features.sorcerer.majestic-will.description: Your Will proficiency becomes master. A success on a Will save is a critical success.
features.sorcerer.bloodline-paragon.name: Bloodline Paragon
features.sorcerer.bloodline-paragon.description: "Add two common 10th-rank spells of your tradition to your repertoire, and gain one 10th-rank spell slot to cast them. You don't gain more 10th-rank slots as you level, and abilities that cast spells without a slot or give more slots can't use it."
features.sorcerer.bloodline-paragon.choices.spell.prompt: 'Bloodline Paragon: a second 10th-rank spell'
features.sorcerer.legendary-spellcaster.name: Legendary Spellcaster
features.sorcerer.legendary-spellcaster.description: Your spell attack modifier and spell DC proficiencies become legendary.

# Feats.
feats.sorcerer.blood-rising.name: Blood Rising
feats.sorcerer.blood-rising.description: "Reaction. Trigger: a creature targets you with a spell of your bloodline's tradition. You gain a blood magic effect you know, even while under another, on you or that creature. A bonus it gives to AC or the save applies against the triggering spell, and a duration lasts until the start of your next turn."
feats.sorcerer.tap-into-blood.name: Tap Into Blood
feats.sorcerer.tap-into-blood.description: "One action, while you benefit from blood magic. By your bloodline's tradition: arcane, Recall Knowledge using Arcana (a critical failure is a failure); divine, Step, or Reposition a target in reach using Religion; occult, Step up to 10 feet; primal, Demoralize using Nature."
feats.sorcerer.anoint-ally.name: Anoint Ally
feats.sorcerer.anoint-ally.description: 'One action. A blood rune on an adjacent ally for 1 minute: when you or an ally would gain a blood magic effect, you can give it to the anointed ally instead. One ally at a time.'
feats.sorcerer.bleed-out.name: Bleed Out
feats.sorcerer.bleed-out.description: "One action, right after casting a non-cantrip spell that gave you blood magic. A ranged spell attack against a target within 60 feet: a hit deals persistent bleed damage equal to that spell's rank."
feats.sorcerer.bleed-out.actions.bleed-out.name: Bleed Out
feats.sorcerer.bleed-out.actions.bleed-out.params.rank.name: Rank of the spell just cast
feats.sorcerer.bleed-out.actions.bleed-out.params.ac.name: "Target's AC"
feats.sorcerer.bleed-out.actions.bleed-out.participants.target.name: Target
feats.sorcerer.propelling-sorcery.name: Propelling Sorcery
feats.sorcerer.propelling-sorcery.description: 'You know another blood magic effect: you Step as a free action, or move the target 5 feet in a direction you choose.'
feats.sorcerer.propelling-sorcery.options.step.name: 'Propelling sorcery: Step as a free action'
feats.sorcerer.propelling-sorcery.options.push.name: 'Propelling sorcery: move the target 5 feet'
feats.sorcerer.divine-evolution.options.extra-slot.name: 'Divine Evolution: the extra slot (highest rank)'
feats.sorcerer.primal-evolution.options.extra-slot.name: 'Primal Evolution: the extra slot (highest rank)'
feats.sorcerer.arcane-evolution.name: Arcane Evolution
feats.sorcerer.arcane-evolution.description: 'Trained in one skill. At your daily preparations, one spell in your repertoire becomes a signature spell for the day. You can Learn a Spell to add arcane spells to the list you choose from; one not in your repertoire joins it for the day at a rank you choose instead.'
feats.sorcerer.arcane-evolution.prerequisites.tradition: A bloodline that grants arcane spells
feats.sorcerer.arcane-evolution.choices.skill.prompt: 'Arcane Evolution: a trained skill'
feats.sorcerer.divine-evolution.name: Divine Evolution
feats.sorcerer.divine-evolution.description: "One more spell slot of your highest rank, only to cast heal or harm, either of which you can cast with it even if it isn't in your repertoire."
feats.sorcerer.divine-evolution.prerequisites.tradition: A bloodline that grants divine spells
feats.sorcerer.occult-evolution.name: Occult Evolution
feats.sorcerer.occult-evolution.description: "Trained in one skill. Once a day, spend 1 minute to add a mental occult spell you don't know to your repertoire until your next daily preparations."
feats.sorcerer.occult-evolution.prerequisites.tradition: A bloodline that grants occult spells
feats.sorcerer.occult-evolution.choices.skill.prompt: 'Occult Evolution: a trained skill'
feats.sorcerer.primal-evolution.name: Primal Evolution
feats.sorcerer.primal-evolution.description: "One more spell slot of your highest rank, only to cast summon animal or summon plant or fungus, either of which you can cast with it even if it isn't in your repertoire."
feats.sorcerer.primal-evolution.prerequisites.tradition: A bloodline that grants primal spells
feats.sorcerer.split-shot.name: Split Shot
feats.sorcerer.split-shot.description: "One action, spellshape. If your next action is to cast a spell without a duration that makes an attack roll against one target, choose a second target in range. One attack roll against both ACs, counting as one attack; the second takes half damage and none of the spell's other effects."
feats.sorcerer.advanced-bloodline.name: Advanced Bloodline
feats.sorcerer.advanced-bloodline.description: "You gain your bloodline's advanced spell and 1 Focus Point: aberrant whispers (aberrant), angelic wings (angelic), swamp of sloth (demonic), embrace the pit (diabolic), dragon breath (draconic), elemental motion (elemental), fey disappearance (fey), horrific visage (hag), extend blood magic (imperial) or drain life (undead)."
feats.sorcerer.advanced-bloodline.prerequisites.bloodline: A bloodline spell
feats.sorcerer.diverting-vortex.name: Diverting Vortex
feats.sorcerer.diverting-vortex.description: 'One action, right after casting a non-cantrip spell. Until the start of your next turn, a +1 status bonus to AC against ranged weapon attacks and physical ranged unarmed attacks.'
feats.sorcerer.energy-ward.name: Energy Ward
feats.sorcerer.energy-ward.description: "Free action, once per turn, right after casting a non-cantrip spell that dealt energy damage. Until the start of your next turn, resistance to acid, cold, electricity, fire, force, sonic, vitality or void equal to 4 + that spell's rank."
feats.sorcerer.energy-ward.actions.energy-ward.name: Energy Ward
feats.sorcerer.energy-ward.actions.energy-ward.params.damageType.name: Energy
feats.sorcerer.energy-ward.actions.energy-ward.params.rank.name: Rank of the spell just cast
feats.sorcerer.energy-ward.actions.energy-ward.results.warded.name: Warded
feats.sorcerer.safeguard-spell.name: Safeguard Spell
feats.sorcerer.safeguard-spell.description: "One action, spellshape. If your next action is to cast a spell with an area, it doesn't affect you."
feats.sorcerer.spell-relay.name: Spell Relay
feats.sorcerer.spell-relay.description: "Reaction. Trigger: an ally casts a spell and you are within its range. The ally can use your space as the spell's point of origin, for range and cover."

# Bloodline spells (focus spells).
spells.ancestral-memories.name: Ancestral Memories
spells.ancestral-memories.description: |-
  Long-dead spellcasters lend you their knowledge. Either you gain a +1 status bonus to your next spell attack roll this turn, or an enemy within 60 feet takes a -1 status penalty to its next save against a spell you cast this turn.

  **Heightened (5th)** +2 or -2. **Heightened (8th)** +3 or -3.
spells.angelic-halo.name: Angelic Halo
spells.angelic-halo.description: |-
  A halo shines over you for 1 minute. Allies in its 15-foot emanation healed by a heal spell gain a status bonus to the Hit Points regained equal to double the heal spell's rank.
spells.diabolic-edict.name: Diabolic Edict
spells.diabolic-edict.description: |-
  You proclaim a task for one willing living creature within 30 feet. For 1 round it gains a +1 status bonus to attack rolls and skill checks to perform it; if it refuses, it takes a -1 status penalty to all its attack rolls and skill checks instead.
spells.elemental-toss.name: Elemental Toss
spells.elemental-toss.description: |-
  You fling a chunk of your element. Make a ranged spell attack against a creature within 30 feet: a hit deals 1d8 damage of your elemental influence's type (double on a critical hit), and the spell has your element's trait.

  **Heightened (+1)** The damage increases by 1d8.
spells.faerie-dust.name: Faerie Dust
spells.faerie-dust.description: |-
  Magic dust fills a 5-foot burst within 30 feet, 5 feet wider for each extra action. Each creature in it attempts a Will save. **Failure** For 1 round it can't use reactions and takes a -2 status penalty to Perception checks and Will saves. **Critical Failure** As failure, and then a -1 status penalty to Perception checks and Will saves for 1 minute.

  **Heightened (+3)** The starting radius increases by 5 feet.
spells.flurry-of-claws.name: Flurry of Claws
spells.flurry-of-claws.description: |-
  Dragon claws slash two creatures within 30 feet and 10 feet of each other. Make a spell attack against each (two attacks for your multiple attack penalty, which rises only after both). A hit deals 1d8 slashing damage plus 1d4 damage of your exemplar's type: force (arcane), spirit (divine), mental (occult) or fire (primal).

  **Heightened (+1)** 1d8 and 1d4 more.
spells.gluttons-jaws.name: "Glutton's Jaws"
spells.gluttons-jaws.description: |-
  A drooling maw bites a creature within 30 feet. Make a spell attack: a hit deals 2d6 piercing damage, and you gain 1d4 temporary Hit Points until the start of your next turn.

  **Heightened (+1)** 2d6 more damage and 1d4 more temporary Hit Points.
spells.jealous-hex.name: Jealous Hex
spells.jealous-hex.description: |-
  You curse a creature within 30 feet for 1 minute with a condition tied to its highest attribute modifier: enfeebled (Strength), clumsy (Dexterity), drained (Constitution) or stupefied (Intelligence, Wisdom or Charisma); on a tie, it picks. It attempts a Will save, and again at the start of each of your turns, ending the curse on a success. **Success** Unaffected. **Failure** The condition's value is 1. **Critical Failure** Its value is 2.
spells.tentacular-limbs.name: Tentacular Limbs
spells.tentacular-limbs.description: |-
  For 1 minute your arms become tentacles: your reach is 10 feet for touch spells and unarmed Strikes with your arms (not weapons). When you cast a spell, you can spend 1 more action to reach 20 feet with it.

  **Heightened (+2)** The extra action's reach increases by 10 feet more.
spells.undeaths-blessing.name: "Undeath's Blessing"
spells.undeaths-blessing.description: |-
  You touch a living creature. For 1 minute heal and harm treat it as undead, and harm restores 2 more Hit Points to it (a status bonus). An unwilling target attempts a Will save. **Critical Success** Unaffected. **Success** For 1 round it heals half as much from heal and takes half as much damage from harm. **Failure** The full effect.

  **Heightened (+1)** The status bonus increases by 2.

