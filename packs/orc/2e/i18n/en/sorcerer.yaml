feats.sorcerer.greater-bloodline.name: 'Greater Bloodline'
feats.sorcerer.greater-bloodline.description: "You gain your bloodline's greater spell and 1 Focus Point: unusual anatomy (aberrant), celestial brand (angelic), chthonian wrath (demonic), hellfire plume (diabolic), dragon wings (draconic), elemental blast (elemental), fey glamour (fey), you're mine (hag), arcane countermeasure (imperial) or grasping grave (undead)."
