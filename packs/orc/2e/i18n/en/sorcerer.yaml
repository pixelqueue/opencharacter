# The sorcerer (Player Core 2): the class, its bloodlines, features, feats and bloodline spells.
# Short rules text written for the pack.
classes.sorcerer.name: Sorcerer
classes.sorcerer.description: "A spellcaster by birth, with magic in the blood. Key attribute: Charisma. 6 Hit Points plus Constitution per level. Trained in Perception, Fortitude and Reflex, expert in Will; trained in simple weapons and unarmed attacks; trained in unarmored defense; trained in the sorcerer class DC, spell attack modifier and spell DC. Trained in your bloodline's two skills and 2 more skills plus Intelligence. You cast spontaneously with Charisma from your bloodline's tradition: three spell slots of each rank (four from the next level), a repertoire of as many spells of each rank (one of them your bloodline's) and five cantrips (one your bloodline's). Each time you gain a level you can swap one spell for another of its rank (not a bloodline spell)."
classes.sorcerer.choices.bloodline.prompt: Bloodline
classes.sorcerer.bloodlines.draconic.choices.exemplar.prompt: Draconic exemplar (tradition)
classes.sorcerer.bloodlines.draconic.choices.exemplar.options.arcane.name: 'Arcane (Arcana; blazing bolt, subconscious suggestion, quandary)'
classes.sorcerer.bloodlines.draconic.choices.exemplar.options.divine.name: 'Divine (Religion; augury, divine immolation, divine inspiration)'
classes.sorcerer.bloodlines.draconic.choices.exemplar.options.occult.name: 'Occult (Occultism; blood vendetta, slither, unrelenting observation)'
classes.sorcerer.bloodlines.draconic.choices.exemplar.options.primal.name: 'Primal (Nature; shatter, howling blizzard, earthquake)'
classes.sorcerer.bloodlines.elemental.choices.influence.prompt: Elemental influence
classes.sorcerer.bloodlines.elemental.choices.influence.options.air.name: 'Air (gale blast, tailwind, wall of wind, chain lightning; slashing)'
classes.sorcerer.bloodlines.elemental.choices.influence.options.earth.name: 'Earth (scatter scree, pummeling rubble, earthbind, petrify; bludgeoning)'
classes.sorcerer.bloodlines.elemental.choices.influence.options.fire.name: 'Fire (ignition, breathe fire, fireball, tree of seasons; fire)'
classes.sorcerer.bloodlines.elemental.choices.influence.options.metal.name: 'Metal (electric arc, thunderstrike, lightning bolt, chain lightning; piercing)'
classes.sorcerer.bloodlines.elemental.choices.influence.options.water.name: 'Water (frostbite, hydraulic push, aqueous orb, scintillating safeguard; bludgeoning)'
classes.sorcerer.bloodlines.elemental.choices.influence.options.wood.name: 'Wood (tangle vine, cleanse cuisine, wall of thorns, tangling creepers; bludgeoning)'
classes.sorcerer.choices.skills.prompt: Trained skills (2 plus Intelligence)
classes.sorcerer.choices.class-feat.prompt: Sorcerer feat (level {slot})
classes.sorcerer.choices.skill-feat.prompt: Skill feat (level {slot})

# Bloodlines.
classes.sorcerer.bloodlines.aberrant.name: Aberrant
classes.sorcerer.bloodlines.aberrant.description: 'Something vast and unknowable speaks to you. Occult; trained in Intimidation and Occultism. Sorcerous gifts: daze, phantom pain, stupefy, vampiric feast, confusion, slither, never mind, warp mind, uncontrollable dance, unfathomable song. Bloodline spell: tentacular limbs. Blood magic (eerie veil): a target takes a -1 status penalty to Will saves for 1 round, or you gain a +2 status bonus to Will saves for 1 round.'
classes.sorcerer.bloodlines.aberrant.options.veil-self.name: 'Eerie veil: +2 status bonus to your Will saves'
classes.sorcerer.bloodlines.aberrant.options.veil-target.name: "Eerie veil: -1 status penalty to the target's Will saves"
classes.sorcerer.bloodlines.angelic.name: Angelic
classes.sorcerer.bloodlines.angelic.description: "A celestial forebear or a lineage's devotion blessed your blood. Divine; trained in Diplomacy and Religion. Sorcerous gifts: light, heal, spiritual armament, holy light, divine wrath, divine immolation, blessed boundary, divine decree, moment of renewal, foresight. Bloodline spell: angelic halo. Blood magic (divine aura): you or a target gain a +1 status bonus to saves for 1 round."
classes.sorcerer.bloodlines.angelic.options.aura-self.name: 'Divine aura: +1 status bonus to your saves'
classes.sorcerer.bloodlines.angelic.options.aura-target.name: "Divine aura: +1 status bonus to the target's saves"
classes.sorcerer.bloodlines.demonic.name: Demonic
classes.sorcerer.bloodlines.demonic.description: "A demon's corruption marked one of your ancestors. Divine; trained in Intimidation and Religion. Sorcerous gifts: caustic blast, fear, enlarge, slow, divine wrath, blister, disintegrate, divine decree, canticle of everlasting grief, implosion. Bloodline spell: glutton's jaws. Blood magic (corruption of sin): a target takes a -1 status penalty to AC for 1 round, or you gain a +2 status bonus to Intimidation for 1 round."
classes.sorcerer.bloodlines.demonic.options.sin-self.name: 'Corruption of sin: +2 status bonus to your Intimidation'
classes.sorcerer.bloodlines.demonic.options.sin-target.name: "Corruption of sin: -1 status penalty to the target's AC"
classes.sorcerer.bloodlines.diabolic.name: Diabolic
classes.sorcerer.bloodlines.diabolic.description: "An ancestor bargained with devils. Divine; trained in Deception and Religion. Sorcerous gifts: ignition, charm, floating flame, enthrall, suggestion, wave of despair, truesight, divine decree, divine inspiration, falling stars. Bloodline spell: diabolic edict. Blood magic (tongue of flame): a target takes 1 fire damage per spell rank (added to the spell's own fire damage before weaknesses and resistances), or you gain a +2 status bonus to Deception for 1 round."
classes.sorcerer.bloodlines.diabolic.options.flame-self.name: 'Tongue of flame: +2 status bonus to your Deception'
classes.sorcerer.bloodlines.diabolic.options.flame-target.name: 'Tongue of flame: 1 fire damage per spell rank to the target'
classes.sorcerer.bloodlines.draconic.name: Draconic
classes.sorcerer.bloodlines.draconic.description: "Dragon blood runs in your veins. Your exemplar's tradition; trained in Intimidation and the exemplar's skill (Arcana, Religion, Occultism or Nature). Sorcerous gifts: shield, fear, the exemplar's 2nd-rank spell, haste, fly, the exemplar's 5th-rank spell, dragon form (your exemplar's), mask of terror, the exemplar's 8th-rank spell, overwhelming presence. Bloodline spell: flurry of claws. Blood magic (scaly hide): you or a target gain a +1 status bonus to AC for 1 round."
classes.sorcerer.bloodlines.draconic.options.scales-self.name: 'Scaly hide: +1 status bonus to your AC'
classes.sorcerer.bloodlines.draconic.options.scales-target.name: "Scaly hide: +1 status bonus to the target's AC"
classes.sorcerer.bloodlines.elemental.name: Elemental
classes.sorcerer.bloodlines.elemental.description: "An element's fury fills your blood. Primal; trained in Intimidation and Nature. Sorcerous gifts: your influence's cantrip and 1st-rank spell, resist energy, your influence's 3rd-rank spell, unfettered movement, elemental form (your element), your influence's 6th-rank spell, energy aegis, earthquake, wrathful storm. Bloodline spell: elemental toss. Blood magic (elemental fury): you gain a +2 status bonus to Intimidation for 1 round, or a target takes 1 damage per spell rank of your influence's type (added to the spell's own damage of that type before weaknesses and resistances)."
classes.sorcerer.bloodlines.elemental.options.fury-self.name: 'Elemental fury: +2 status bonus to your Intimidation'
classes.sorcerer.bloodlines.elemental.options.fury-target.name: "Elemental fury: 1 damage per spell rank of your influence's type to the target"
classes.sorcerer.bloodlines.fey.name: Fey
classes.sorcerer.bloodlines.fey.description: 'Fey whimsy put bewitching magic in your family. Primal; trained in Deception and Nature. Sorcerous gifts: figment, charm, laughing fit, enthrall, suggestion, hallucination, mislead, visions of danger, uncontrollable dance, metamorphosis. Bloodline spell: faerie dust. Blood magic (cloak of ribbons): you gain a +2 status bonus to Performance for 1 round, or you are concealed for 1 round (too obvious to Hide with).'
classes.sorcerer.bloodlines.fey.options.ribbons-performance.name: 'Cloak of ribbons: +2 status bonus to your Performance'
classes.sorcerer.bloodlines.fey.options.ribbons-concealed.name: 'Cloak of ribbons: you are concealed'
classes.sorcerer.bloodlines.hag.name: Hag
classes.sorcerer.bloodlines.hag.description: "A hag's curse or blood lingers in your family. Occult; trained in Deception and Occultism. Sorcerous gifts: daze, illusory disguise, stupefy, blindness, outcast's curse, mariner's curse, cursed metamorphosis, warp mind, quandary, phantasmagoria. Bloodline spell: jealous hex. Blood magic (retributive spite): the first creature to damage you before the end of your next turn takes 4 mental damage per spell rank (basic Will save); if none does, you gain temporary Hit Points equal to the spell's rank at the start of your next turn, until the start of the turn after."
classes.sorcerer.bloodlines.hag.options.spite.name: 'Retributive spite'
classes.sorcerer.bloodlines.imperial.name: Imperial
classes.sorcerer.bloodlines.imperial.description: 'An ancestor was a mortal who mastered magic. Arcane; trained in Arcana and Society. Sorcerous gifts: detect magic, force barrage, dispel magic, haste, translocate, scouting eye, disintegrate, retrocognition, quandary, implosion. Bloodline spell: ancestral memories. Blood magic (imperious defense): a +1 status bonus to AC or to saves until the start of your next turn.'
classes.sorcerer.bloodlines.imperial.options.defense-ac.name: 'Imperious defense: +1 status bonus to your AC'
classes.sorcerer.bloodlines.imperial.options.defense-saves.name: 'Imperious defense: +1 status bonus to your saves'
classes.sorcerer.bloodlines.undead.name: Undead
classes.sorcerer.bloodlines.undead.description: "Undeath touches your family tree. Divine; trained in Intimidation and Religion. Sorcerous gifts: void warp, harm, see the unseen, bind undead, talking corpse, invoke spirits, vampiric exsanguination, execute, canticle of everlasting grief, wails of the damned. Bloodline spell: undeath's blessing. Blood magic (stolen life): you gain temporary Hit Points equal to the spell's rank until the start of your next turn, or a target takes 1 void damage per spell rank (added to the spell's own void damage before weaknesses and resistances)."
classes.sorcerer.bloodlines.undead.options.life-self.name: "Stolen life: temporary Hit Points equal to the spell's rank"
classes.sorcerer.bloodlines.undead.options.life-target.name: 'Stolen life: 1 void damage per spell rank to the target'

