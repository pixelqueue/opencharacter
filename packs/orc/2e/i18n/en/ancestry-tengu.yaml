ancestries.tengu.choices.boosts.options.alternate.name: 'Two free boosts instead'
ancestries.tengu.choices.boosts.options.standard.choices.free.prompt: 'A free attribute boost'
ancestries.tengu.choices.boosts.options.standard.name: "The ancestry's boost"
ancestries.tengu.choices.boosts.prompt: 'Ancestry attribute boosts'
ancestries.tengu.choices.heritage.prompt: 'Heritage'
ancestries.tengu.name: 'Tengu'
ancestries.tengu.description: 'Gregarious, resourceful avian folk. 6 Hit Points, Medium, 25 feet. Boosts: Dexterity, free. Low-light vision. Sharp Beak: a beak unarmed attack, 1d6 piercing, brawling group, finesse.'
heritages.dogtooth-tengu.name: 'Dogtooth Tengu'
heritages.dogtooth-tengu.description: 'Your beak gains the deadly d8 trait.'
heritages.jinxed-tengu.name: 'Jinxed Tengu'
heritages.jinxed-tengu.description: "A success on a save against a curse or misfortune effect is a critical success. When you'd become doomed, a DC 17 flat check lowers the value you gain by 1."
heritages.mountainkeeper-tengu.name: 'Mountainkeeper Tengu'
heritages.mountainkeeper-tengu.description: 'You can cast vitality lash as a primal innate cantrip at will; each spell from a tengu heritage or feat can be divine or primal, your choice when you cast it.'
heritages.skyborn-tengu.name: 'Skyborn Tengu'
heritages.skyborn-tengu.description: 'You take no damage from falling, however far.'
heritages.stormtossed-tengu.name: 'Stormtossed Tengu'
heritages.stormtossed-tengu.description: 'Electricity resistance equal to half your level (minimum 1), and you automatically succeed at the flat check to target a creature concealed only by rain or fog.'
heritages.taloned-tengu.name: 'Taloned Tengu'
heritages.taloned-tengu.description: 'You gain a talons unarmed attack: 1d4 slashing, brawling group, agile, finesse, unarmed and versatile P.'
heritages.wavediver-tengu.name: 'Wavediver Tengu'
heritages.wavediver-tengu.description: 'You gain a swim Speed of 15 feet.'
templates.dogtooth.name: '{base} (dogtooth)'
weapons.tengu-talons.name: 'Talons'
feats.ancestry.mariners-fire.name: "Mariner's Fire"
feats.ancestry.mariners-fire.description: 'You can cast ignition as a primal innate cantrip at will, as floating orbs of flame, even underwater.'
feats.ancestry.one-toed-hop.name: 'One-Toed Hop'
feats.ancestry.one-toed-hop.description: "1 action: a vertical Leap that doesn't trigger reactions to moving or to entering or leaving a square."
feats.ancestry.scavengers-search.name: "Scavenger's Search"
feats.ancestry.scavengers-search.description: 'A +2 circumstance bonus to Seek objects (secret doors and hazards included) within 30 feet.'
feats.ancestry.squawk.name: 'Squawk!'
feats.ancestry.squawk.description: "A reaction when you critically fail a Deception, Diplomacy or Intimidation check against a non-tengu: it's a failure instead. Those who saw it are immune for 24 hours."
feats.ancestry.storms-lash.name: "Storm's Lash"
feats.ancestry.storms-lash.description: 'You can cast electric arc as a primal innate cantrip at will.'
feats.ancestry.tengu-lore.name: 'Tengu Lore'
feats.ancestry.tengu-lore.description: "You're trained in Society and Survival (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Tengu Lore."
feats.ancestry.tengu-weapon-familiarity.name: 'Tengu Weapon Familiarity'
feats.ancestry.tengu-weapon-familiarity.description: 'You have access to uncommon tengu weapons and the katana, khakkhara, temple sword and wakizashi, and familiarity with them: martial ones count as simple and advanced ones as martial for you. At your daily preparations you can practice with a sword you have to gain familiarity with it too, until you practice with another. From 5th level, their critical specialization effects.'
feats.ancestry.uncanny-agility.name: 'Uncanny Agility'
feats.ancestry.uncanny-agility.description: 'You gain Steady Balance, and you can Step into difficult terrain from uneven ground.'
feats.ancestry.eat-fortune.name: 'Eat Fortune'
feats.ancestry.eat-fortune.description: 'Once a day, a reaction (concentrate, divine) when a creature within 60 feet uses a fortune or misfortune effect: you disrupt it, and Eat Fortune gains the opposite trait for that roll.'
feats.ancestry.long-nosed-form.name: 'Long-Nosed Form'
feats.ancestry.long-nosed-form.description: '1 action (concentrate, polymorph, primal): you take a set human form (a long nose, a reddish complexion) that counts as a disguise to Impersonate, until you Dismiss it; in it you have no beak or other tengu unarmed attacks.'
feats.ancestry.magpie-snatch.name: 'Magpie Snatch'
feats.ancestry.magpie-snatch.description: '2 actions: Stride twice, Interacting to pick up an unattended object at any point.'
feats.ancestry.soaring-flight.name: 'Soaring Flight'
feats.ancestry.soaring-flight.description: "Once a round, 1 action: Fly (with a fly Speed of 20 feet for this move if you have none); you fall if you don't end on solid ground."
feats.ancestry.soaring-flight.prerequisites.skyborn: 'Skyborn tengu heritage'
feats.ancestry.tengu-feather-fan.name: 'Tengu Feather Fan'
feats.ancestry.tengu-feather-fan.description: 'You make a tengu feather fan (a primal magic item of light Bulk at your level, only yours, remade at your daily preparations if lost). Wave Fan (manipulate), once a day: cast a spell it holds (gust of wind at 1st rank), with the higher of your class DC and spell DC; or cast a cantrip from your heritage or ancestry feats without using an activation. At most three activations a day, whatever feats add them.'
feats.ancestry.soaring-form.name: 'Soaring Form'
feats.ancestry.soaring-form.description: 'You have a fly Speed of 20 feet at all times.'
feats.ancestry.soaring-form.prerequisites.soaring-flight: 'Soaring Flight'
feats.ancestry.wind-gods-fan.name: "Wind God's Fan"
feats.ancestry.wind-gods-fan.description: 'Your fan gains another daily Wave Fan and holds wall of wind at 3rd rank.'
feats.ancestry.wind-gods-fan.prerequisites.tengu-feather-fan: 'Tengu Feather Fan'
feats.ancestry.harbingers-claw.name: "Harbinger's Claw"
feats.ancestry.harbingers-claw.description: 'Once a day, a reaction (auditory, divine, misfortune) when a creature within 60 feet is about to attempt an attack roll or skill check: it rolls twice and takes the lower.'
feats.ancestry.jinx-glutton.name: 'Jinx Glutton'
feats.ancestry.jinx-glutton.description: 'You can Eat Fortune once an hour instead of once a day.'
feats.ancestry.jinx-glutton.prerequisites.eat-fortune: 'Eat Fortune'
feats.ancestry.thunder-gods-fan.name: "Thunder God's Fan"
feats.ancestry.thunder-gods-fan.description: 'Your fan gains another daily Wave Fan and holds lightning bolt at 5th rank.'
feats.ancestry.thunder-gods-fan.prerequisites.tengu-feather-fan: 'Tengu Feather Fan'
feats.ancestry.great-tengu-form.name: 'Great Tengu Form'
feats.ancestry.great-tengu-form.description: 'Once a day, as part of Long-Nosed Form, you also gain 4th-rank enlarge and fly for 5 minutes or until you leave the form.'
feats.ancestry.great-tengu-form.prerequisites.long-nosed-form: 'Long-Nosed Form'
feats.ancestry.trickster-tengu.name: 'Trickster Tengu'
feats.ancestry.trickster-tengu.description: 'Once a day, you can cast aerial form (a bird only) or cursed metamorphosis as a 7th-rank primal innate spell.'
feats.ancestry.tengu-feather-fan.options.wave-fan-gust-of-wind.name: 'Wave Fan (an activation of your fan)'
feats.ancestry.tengu-feather-fan.options.wave-fan-wall-of-wind.name: 'Wave Fan (an activation of your fan)'
feats.ancestry.tengu-feather-fan.options.wave-fan-lightning-bolt.name: 'Wave Fan (an activation of your fan)'
