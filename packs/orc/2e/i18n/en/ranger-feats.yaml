# Ranger feats to 20th level. Short rules text written for the pack.

feats.ranger.animal-empathy-ranger.name: 'Animal Empathy (Ranger)'
feats.ranger.animal-empathy-ranger.description: 'You can use Diplomacy to Make an Impression on animals and make very simple Requests of them; wild animals usually give you time to try.'
feats.ranger.mature-animal-companion-ranger.name: 'Mature Animal Companion (Ranger)'
feats.ranger.mature-animal-companion-ranger.description: "Your animal companion becomes mature, and each round it can Stride or Strike once on your turn without a command (then it can't be Commanded that round)."
feats.ranger.mature-animal-companion-ranger.prerequisites.animal-companion: 'Animal Companion'
feats.ranger.deadly-aim.name: 'Deadly Aim'
feats.ranger.deadly-aim.description: 'One action, flourish. Make a ranged Strike against your hunted prey at -2, with a +4 circumstance bonus to damage (+6 at 11th level, +8 at 15th).'
feats.ranger.deadly-aim.prerequisites.specialization: 'Weapon specialization'
feats.ranger.deadly-aim.actions.deadly-aim.name: 'Deadly Aim'
feats.ranger.deadly-aim.actions.deadly-aim.steps.weapon.prompt: 'Choose a ranged weapon'
feats.ranger.hazard-finder.name: 'Hazard Finder'
feats.ranger.hazard-finder.description: "You gain a +1 circumstance bonus to Perception to find traps and hazards, to AC against their attacks and to saves against their effects, and find hazards that need Searching even when you aren't."
feats.ranger.terrain-master.name: 'Terrain Master'
feats.ranger.terrain-master.description: 'An hour of practice makes your current natural terrain your favored terrain until you spend a full day out of it.'
feats.ranger.terrain-master.prerequisites.survival: 'Master in Survival'
feats.ranger.terrain-master.prerequisites.favored-terrain: 'Favored Terrain'
feats.ranger.wardens-boon.name: "Warden's Boon"
feats.ranger.wardens-boon.description: "One action (auditory or visual). An ally gains your Hunt Prey and hunter's edge benefits against your prey until the end of its next turn."
feats.ranger.camouflage.name: 'Camouflage'
feats.ranger.camouflage.description: 'In natural terrain you can Hide and Sneak without cover or concealment.'
feats.ranger.camouflage.prerequisites.stealth: 'Master in Stealth'
feats.ranger.incredible-companion-ranger.name: 'Incredible Companion (Ranger)'
feats.ranger.incredible-companion-ranger.description: 'Your animal companion becomes nimble or savage (your choice).'
feats.ranger.incredible-companion-ranger.prerequisites.mature-animal-companion-ranger: 'Mature Animal Companion (Ranger)'
feats.ranger.master-monster-hunter.name: 'Master Monster Hunter'
feats.ranger.master-monster-hunter.description: "You can Recall Knowledge with Nature to identify any creature, and gain Monster Hunter's (and Monster Warden's) benefits on a success, not only a critical success."
feats.ranger.master-monster-hunter.prerequisites.nature: 'Master in Nature'
feats.ranger.master-monster-hunter.prerequisites.monster-hunter: 'Monster Hunter'
feats.ranger.peerless-warden.description: "You gain a peerless warden spell (Hunter's Vision, Terrain Transposition) or a lower-tier one, and a Focus Point. You can take this feat more than once, choosing a different spell."
feats.ranger.peerless-warden.choices.spell.prompt: 'Warden spell'
feats.ranger.peerless-warden.choices.spell.options.gravity-weapon.name: 'Gravity Weapon'
feats.ranger.peerless-warden.choices.spell.options.heal-companion.name: 'Heal Companion'
feats.ranger.peerless-warden.choices.spell.options.magic-hide.name: 'Magic Hide'
feats.ranger.peerless-warden.choices.spell.options.animal-feature.name: 'Animal Feature'
feats.ranger.peerless-warden.choices.spell.options.enlarge-companion.name: 'Enlarge Companion'
feats.ranger.peerless-warden.choices.spell.options.hunters-luck.name: "Hunter's Luck"
feats.ranger.peerless-warden.choices.spell.options.soothing-mist.name: 'Soothing Mist'
feats.ranger.peerless-warden.choices.spell.options.ephemeral-tracking.name: 'Ephemeral Tracking'
feats.ranger.peerless-warden.choices.spell.options.rangers-bramble.name: "Ranger's Bramble"
feats.ranger.peerless-warden.choices.spell.options.hunters-vision.name: "Hunter's Vision"
feats.ranger.peerless-warden.choices.spell.options.terrain-transposition.name: 'Terrain Transposition'
feats.ranger.peerless-warden.name: 'Peerless Warden'
feats.ranger.peerless-warden.prerequisites.initiate-warden: 'Initiate Warden'
feats.ranger.penetrating-shot.name: 'Penetrating Shot'
feats.ranger.penetrating-shot.description: 'Two actions. Requirement: a ranged weapon. One ranged Strike against both a creature giving your prey lesser cover and your prey (ignoring that cover), damage rolled once; it counts as two attacks for your penalty.'
feats.ranger.wardens-step.name: "Warden's Step"
feats.ranger.wardens-step.description: 'When you Avoid Notice in natural terrain, any number of your allies gain its benefits too.'
feats.ranger.wardens-step.prerequisites.stealth: 'Master in Stealth'
feats.ranger.distracting-shot.name: 'Distracting Shot'
feats.ranger.distracting-shot.description: 'A critical hit on your prey with a ranged weapon, or two ranged hits on it in one turn, makes it off-guard until the start of your next turn.'
feats.ranger.double-prey.name: 'Double Prey'
feats.ranger.double-prey.description: 'Hunt Prey can designate two creatures as your prey.'
feats.ranger.second-sting.name: 'Second Sting'
feats.ranger.second-sting.description: "One action, press. Requirement: a melee weapon in each hand. Strike your prey with one. **Failure** You deal the other weapon's damage on a hit without any damage dice."
feats.ranger.side-by-side-ranger.name: 'Side by Side (Ranger)'
feats.ranger.side-by-side-ranger.description: 'You and your animal companion flank a foe you are both adjacent to, wherever you stand.'
feats.ranger.side-by-side-ranger.prerequisites.companion: 'An animal companion'
feats.ranger.wardens-focus.name: "Warden's Focus"
feats.ranger.wardens-focus.description: 'When you Refocus, you regain all your Focus Points.'
feats.ranger.wardens-focus.prerequisites.warden: 'Warden spells'
feats.ranger.shared-prey.name: 'Shared Prey'
feats.ranger.shared-prey.description: "When Hunt Prey picks a single prey, an ally gains its benefits and your hunter's edge too, until you Hunt Prey again."
feats.ranger.shared-prey.prerequisites.double-prey: 'Double Prey'
feats.ranger.shared-prey.prerequisites.wardens-boon: "Warden's Boon"
feats.ranger.stealthy-companion.name: 'Stealthy Companion'
feats.ranger.stealthy-companion.description: "Your companion gains Camouflage's benefit; an ambusher companion's Stealth rank rises to master (legendary if master)."
feats.ranger.stealthy-companion.prerequisites.animal-companion: 'Animal Companion'
feats.ranger.stealthy-companion.prerequisites.camouflage: 'Camouflage'
feats.ranger.wardens-guidance.name: "Warden's Guidance"
feats.ranger.wardens-guidance.description: 'While you observe your prey, allies who can perceive you and fail or critically fail to Seek it succeed instead.'
feats.ranger.greater-distracting-shot.name: 'Greater Distracting Shot'
feats.ranger.greater-distracting-shot.description: 'A ranged hit on your prey makes it off-guard until the start of your next turn; a critical hit or two hits in a turn, until the end of your next turn.'
feats.ranger.greater-distracting-shot.prerequisites.distracting-shot: 'Distracting Shot'
feats.ranger.improved-twin-riposte-ranger.name: 'Improved Twin Riposte (Ranger)'
feats.ranger.improved-twin-riposte-ranger.description: 'You can Twin Riposte without Twin Parry (with a melee weapon in each hand), and gain an extra reaction each turn usable only for it.'
feats.ranger.improved-twin-riposte-ranger.prerequisites.twin-riposte: 'Twin Riposte'
feats.ranger.legendary-monster-hunter.name: 'Legendary Monster Hunter'
feats.ranger.legendary-monster-hunter.description: "Monster Hunter's (and Monster Warden's) bonus becomes +2 for you and the allies who gain it."
feats.ranger.legendary-monster-hunter.prerequisites.nature: 'Legendary in Nature'
feats.ranger.legendary-monster-hunter.prerequisites.master-monster-hunter: 'Master Monster Hunter'
feats.ranger.specialized-companion-ranger.name: 'Specialized Companion (Ranger)'
feats.ranger.specialized-companion-ranger.description: 'Your animal companion gains a specialization of your choice.'
feats.ranger.specialized-companion-ranger.prerequisites.incredible-companion-ranger: 'Incredible Companion (Ranger)'
feats.ranger.wardens-reload.name: 'Warden’s Reload'
feats.ranger.wardens-reload.description: 'Free action, once per round. Requirement: your last action cast a warden spell. Interact to reload a weapon you wield.'
feats.ranger.impossible-flurry.name: 'Impossible Flurry'
feats.ranger.impossible-flurry.description: "Three actions, flourish. Requirement: a melee weapon in each hand. Make three melee Strikes with each: each weapon's first at your second-attack penalty, the rest at the maximum penalty."
feats.ranger.manifold-edge.name: 'Manifold Edge'
feats.ranger.manifold-edge.description: "When you Hunt Prey you can use a different hunter's edge than your own, without masterful hunter's extra benefit."
feats.ranger.manifold-edge.prerequisites.masterful: "Hunter's edge, masterful hunter"
feats.ranger.masterful-companion.name: 'Masterful Companion'
feats.ranger.masterful-companion.description: "When you Hunt Prey, your companion gains your edge's masterful hunter benefit instead of only the edge."
feats.ranger.masterful-companion.prerequisites.masterful: 'Masterful hunter'
feats.ranger.masterful-companion.prerequisites.animal-companion: 'Animal Companion'
feats.ranger.perfect-shot.name: 'Perfect Shot'
feats.ranger.perfect-shot.description: 'Three actions, flourish. Requirement: a loaded ranged weapon with reload 1 or more, not reloaded since your last turn. Make a ranged Strike against your prey; a hit deals maximum damage. Then your turn ends.'
feats.ranger.perfect-shot.actions.perfect-shot.name: 'Perfect Shot'
feats.ranger.perfect-shot.actions.perfect-shot.steps.weapon.prompt: 'Choose a ranged weapon'
feats.ranger.shadow-hunter.name: 'Shadow Hunter'
feats.ranger.shadow-hunter.description: 'In natural terrain you can be concealed from every foe but your prey.'
feats.ranger.shadow-hunter.prerequisites.camouflage: 'Camouflage'
feats.ranger.legendary-shot.name: 'Legendary Shot'
feats.ranger.legendary-shot.description: 'With a ranged weapon you are a master in, you ignore the penalty for attacking your prey up to five range increments away.'
feats.ranger.legendary-shot.prerequisites.perception: 'Legendary in Perception'
feats.ranger.legendary-shot.prerequisites.far-shot: 'Far Shot'
feats.ranger.to-the-ends-of-the-earth.name: 'To the Ends of the Earth'
feats.ranger.to-the-ends-of-the-earth.description: "When you Hunt Prey on a creature within 100 feet you always know where it is while it's your prey; across teleportation or planes too if you're legendary in Nature (gaining the detection and primal traits)."
feats.ranger.to-the-ends-of-the-earth.prerequisites.survival: 'Legendary in Survival'
feats.ranger.triple-threat.name: 'Triple Threat'
feats.ranger.triple-threat.description: 'Hunt Prey can designate three prey, two prey and share with an ally, or one prey and share with two allies.'
feats.ranger.triple-threat.prerequisites.shared-prey: 'Shared Prey'
feats.ranger.ultimate-skirmisher.name: 'Ultimate Skirmisher'
feats.ranger.ultimate-skirmisher.description: "You ignore difficult, greater difficult and hazardous terrain, and don't trigger traps and hazards triggered by moving into an area unless you want to."
feats.ranger.ultimate-skirmisher.prerequisites.journey: 'Unimpeded journey'
tags.strike.deadly-aim.name: 'Deadly aim'
