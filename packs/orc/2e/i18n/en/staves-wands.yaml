wands.wand-of-hopeless-night-2nd-rank-spell.name: 'Wand of Hopeless Night (2nd-Rank Spell)'
wands.wand-of-hopeless-night-2nd-rank-spell.description: 'A wand of 2nd-rank darkness. You cast darkness; a creature ending its turn in it must succeed at a DC 20 Will save or be frightened 1 (2 on a critical failure).'
