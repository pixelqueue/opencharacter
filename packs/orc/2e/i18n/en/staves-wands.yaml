wands.wand-of-crackling-lightning-3rd-rank-spell.name: 'Wand of Crackling Lightning (3rd-Rank Spell)'
wands.wand-of-crackling-lightning-3rd-rank-spell.description: 'A wand of 3rd-rank lightning bolt. You cast lightning bolt, but its area is two adjacent parallel lines, and creatures that fail the save are off-guard for 1 round.'
