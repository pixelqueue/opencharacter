# Generated text for treasure (rules/treasure.yaml, rules/magic-items.yaml).
weapons.specific.bloodletting-kukri.name: 'Bloodletting Kukri'
weapons.specific.bloodletting-kukri.description: "Item 6. A +1 striking kukri. On a critical hit, 1d8 persistent bleed damage, and 1d8 temporary Hit Points for 1 minute if the target wasn't bleeding already."
weapons.specific.caterwaul-sling.name: 'Caterwaul Sling'
weapons.specific.caterwaul-sling.description: 'Item 5. A +1 striking sling. Unleash Roar (2 actions, once per day): a 30-foot cone of 4d6 sonic damage (DC 21 basic Fortitude); deafened for 1 round on a failure, 1 hour on a critical failure.'
weapons.specific.chaplains-cudgel.name: "Chaplain's Cudgel"
weapons.specific.chaplains-cudgel.description: "Item 9. A +1 striking mace. Bow to a Higher Power (1 action): it becomes your deity's favored weapon (as shifting, even ranged or two-handed); your holy or unholy trait can go on its Strikes, and after a divine spell of 2 actions or more, your next Strike with it by the end of your next turn gets a status bonus to damage equal to its damage dice."
weapons.specific.fighters-fork.name: "Fighter's Fork"
weapons.specific.fighters-fork.description: 'Item 3. A +1 trident. Fluid Length (1 action): extend it (two hands, reach, not thrown) or shorten it again.'
weapons.specific.gloom-blade.name: 'Gloom Blade'
weapons.specific.gloom-blade.description: 'Item 9. A +1 shortsword in bright light (hiding its aura from low-rank detect magic); in dim light or darkness, a +2 striking shortsword. Against a creature you are undetected by, 1d6 extra precision damage.'
weapons.specific.hunters-anthem.name: "Hunter's Anthem"
weapons.specific.hunters-anthem.description: 'Item 11. A +2 striking longbow; with Hunt Prey, it has the thundering rune against your prey. Song of the Bow (2 actions, once per day): a Strike whose arrow explodes in a 20-foot emanation around the target for 5d10 sonic damage (DC 28 basic Fortitude), deafening on a critical failure and revealing undetected creatures.'
weapons.specific.icicle.name: 'Icicle'
weapons.specific.icicle.description: 'Item 16. A +2 greater striking greater frost longspear that puts out non-magical fires within 20 feet; while you wield it, fire resistance 5. Quench Flames (2 actions): counteract a magical fire (+27). Ice Spike (2 actions, once per day): a 30-foot line of 11d6 cold damage (DC 35 Reflex), and 3d6 persistent bleed damage on a failure (double on a critical failure).'
weapons.specific.retribution-axe.name: 'Retribution Axe'
weapons.specific.retribution-axe.description: 'Item 3. A +1 greataxe. When a creature damages you with an attack, your next damage roll against it before the end of your next turn gets a +2 circumstance bonus (only the latest attacker).'
weapons.specific.searing-blade.name: 'Searing Blade'
weapons.specific.searing-blade.description: 'Item 13. A +2 greater striking flaming longsword that sheds dim firelight 10 feet. Shoot Fire (2 actions): cast ignition from it as a 7th-rank arcane spell, using your melee attack modifier with it.'
weapons.specific.searing-blade.options.ignition.name: 'Shoot Fire'
weapons.specific.searing-blade-greater.name: 'Searing Blade (Greater)'
weapons.specific.searing-blade-greater.description: "Item 17. A +3 greater striking greater flaming longsword that sheds dim firelight 10 feet. Shoot Fire (2 actions): cast ignition from it as a 9th-rank arcane spell, using your melee attack modifier with it. Radiate Flames (1 action, once per day): for 1 minute, your and your allies' attacks within 10 feet gain the flaming rune."
weapons.specific.searing-blade-greater.options.ignition.name: 'Shoot Fire'
weapons.specific.serpent-dagger.name: 'Serpent Dagger'
weapons.specific.serpent-dagger.description: 'Item 5. A +1 striking dagger. A critical hit sickens the target 1 unless it succeeds at a DC 19 Fortitude save (poison). Drip Poison (free action, once per day, when you damage a creature with it): dagger venom (DC 21 Fortitude; 4 rounds; stage 1: 1d8 poison damage and enfeebled 1).'
weapons.specific.sky-hammer.name: 'Sky Hammer'
weapons.specific.sky-hammer.description: 'Item 20. A +3 major striking flaming shock orichalcum warhammer. Comet Fall (reaction): on a critical hit with it, a 6th-rank arcane fireball (DC 45) explodes centered on it; you are immune.'
weapons.specific.storm-flash.name: 'Storm Flash'
weapons.specific.storm-flash.description: "Item 14. A +2 greater striking shock rapier that gathers storm clouds under an open sky. Lightning Stab (2 actions, once per day): cast 6th-rank lightning bolt (DC 33). Divert Lightning (reaction, once per 10 minutes): roll a melee attack against an electricity effect's DC to spare one creature within 10 feet its damage."
weapons.specific.storm-flash.options.lightning-bolt.name: 'Lightning Stab'
weapons.specific.storm-flash-greater.name: 'Storm Flash (Greater)'
weapons.specific.storm-flash-greater.description: "Item 18. A +3 greater striking greater shock rapier that gathers storm clouds under an open sky. Lightning Stab (2 actions, once per day): cast 8th-rank lightning bolt (DC 38). Divert Lightning (reaction, once per 10 minutes): roll a melee attack against an electricity effect's DC to spare one creature within 10 feet its damage."
weapons.specific.storm-flash-greater.options.lightning-bolt.name: 'Lightning Stab'
weapons.specific.twining-staff.name: 'Twining Staff'
weapons.specific.twining-staff.description: 'Item 6. A +1 striking staff. Form Staff (1 action): it becomes a +1 striking staff, a +1 striking bo staff, or a disk of negligible Bulk; expanding it can High Jump or Force Open with Athletics +15.'
armor.specific.dragonplate.name: 'Dragonplate'
armor.specific.dragonplate.description: "Item 16. +2 greater resilient dragonhide full plate in a dragon's likeness. Dragon Breath (2 actions, once per day): a 15-foot cone of 14d6 damage (DC 36 basic save) of the dragon's tradition: force (Reflex) arcane, spirit (Reflex) divine, mental (Will) occult, poison (Fortitude) primal."
armor.specific.electric-eelskin.name: 'Electric Eelskin'
armor.specific.electric-eelskin.description: 'Item 10. +1 resilient greater slick leather armor. You can breathe water, and a +2 item bonus to Athletics to Swim and to Stealth in water. Unleash Charge (2 actions, once per hour): cast 2nd-rank thunderstrike (DC 29).'
armor.specific.electric-eelskin.options.thunderstrike.name: 'Unleash Charge'
armor.specific.impenetrable-scale.name: 'Impenetrable Scale'
armor.specific.impenetrable-scale.description: "Item 17. +2 greater resilient fortification adamantine scale mail. Each time its fortification turns a significant foe's critical hit into a hit, a scale turns violet: resistance to physical damage equal to the violet scales (up to 8), reset at dawn."
armor.specific.life-saver-mail.name: 'Life-Saver Mail'
armor.specific.life-saver-mail.description: 'Item 14. +2 resilient fortification splint mail with a glowing green gem. Second Chance (reaction, once per day): when you would die, it casts breath of life on you. Shielding Light (2 actions): cast 5th-rank shield.'
armor.specific.life-saver-mail.options.shield.name: 'Shielding Light'
armor.specific.life-saver-mail.options.breath-of-life.name: 'Second Chance'
armor.specific.life-saver-mail-greater.name: 'Life-Saver Mail (Greater)'
armor.specific.life-saver-mail-greater.description: 'Item 20. +3 greater resilient greater fortification splint mail with a glowing green gem. Second Chance (reaction, once per day): when you would die, it casts breath of life on you. Shielding Light (2 actions): cast 9th-rank shield.'
armor.specific.life-saver-mail-greater.options.shield.name: 'Shielding Light'
armor.specific.life-saver-mail-greater.options.breath-of-life.name: 'Second Chance'
armor.specific.lions-armor.name: "Lion's Armor"
armor.specific.lions-armor.description: "Item 12. +2 resilient half plate with lion heads: a +2 item bonus to Intimidation checks. A critical hit with a lion's shield's Lion Bite frightens the target 1. Roar of the Pride (2 actions, once per day): Demoralize each enemy within 30 feet (fleeing for 1 round on a critical success)."
armor.specific.lions-armor-greater.name: "Lion's Armor (Greater)"
armor.specific.lions-armor-greater.description: "Item 19. +3 greater resilient half plate with lion heads: a +3 item bonus to Intimidation checks. A critical hit with a lion's shield's Lion Bite frightens the target 1. Roar of the Pride (2 actions, once per hour): Demoralize each enemy within 30 feet (fleeing for 1 round on a critical success)."
armor.specific.moonlit-chain.name: 'Moonlit Chain'
armor.specific.moonlit-chain.description: 'Item 7. +1 silver chain shirt. You see in moonlight as with low-light vision. Dim Sight (1 action, once per day): suppress dazzled for 1 minute.'
armor.specific.onslaught-hide.name: 'Onslaught Hide'
armor.specific.onslaught-hide.description: "Item 9. +1 resilient hide armor with a check penalty of 1. Your Sudden Charge's Strike deals 1d8 extra damage."
armor.specific.tideplate.name: 'Tideplate'
armor.specific.tideplate.description: "Item 10. +1 resilient full plate made for water: its check penalty doesn't apply to Acrobatics and Athletics in water, a +2 item bonus to Swim, and you breathe underwater. Ride the Waves (2 actions, once per hour): it casts water walk on you. Submerge (2 actions, once per day): merge with water for 10 minutes."
armor.specific.tideplate.options.water-walk.name: 'Ride the Waves'
armor.specific.medusa-armor.name: 'Medusa Armor'
armor.specific.medusa-armor.description: 'Item 14. Cursed: +2 adamantine scale mail that seems to have a fortification rune but has none of its effects. When you are critically hit, after the damage you are petrified for 1 round; after the first time, the armor fuses to you.'
armor.specific.elven-chain-standard-grade.name: 'Elven Chain (Standard-Grade)'
armor.specific.elven-chain-standard-grade.description: 'Item 13. A chain shirt of standard-grade dawnsilver in tiny supple rings: no check penalty, and quiet (not noisy). It takes runes like any dawnsilver chain shirt.'
armor.specific.elven-chain-high-grade.name: 'Elven Chain (High-Grade)'
armor.specific.elven-chain-high-grade.description: 'Item 20. A chain shirt of high-grade dawnsilver in tiny supple rings: no check penalty, and quiet (not noisy). It takes runes like any dawnsilver chain shirt.'
shields.specific.dragonslayers-shield.name: "Dragonslayer's Shield"
shields.specific.dragonslayers-shield.description: "Item 9. A steel shield (Hardness 8, HP 32, BT 16) covered in dragonhide: raised, its bonus applies to Reflex saves against area effects; held, a +2 circumstance bonus to Will saves against frightful presence. It has resistance 10 to its dragon's breath damage type, after Hardness, and can Shield Block effects of that type."
shields.specific.floating-shield.name: 'Floating Shield'
shields.specific.floating-shield.description: "Item 11. A buckler (Hardness 6, HP 24, BT 12). Float (1 action, once per day): it floats beside you for 1 minute, its bonus as if raised, though you can't Shield Block with it."
shields.specific.floating-shield-greater.name: 'Floating Shield (Greater)'
shields.specific.floating-shield-greater.description: "Item 16. A buckler (Hardness 6, HP 24, BT 12). Float (1 action): it floats beside you for 1 minute, its bonus as if raised, though you can't Shield Block with it."
shields.specific.force-shield.actions.force-bubble.name: 'Force Bubble'
shields.specific.force-shield.name: 'Force Shield'
shields.specific.force-shield.description: 'Item 9. A steel shield (Hardness 8, HP 32, BT 16). Force Bubble (1 action, once per day): resistance 5 to physical damage for 1 minute while you hold it.'
shields.specific.forge-warden.name: 'Forge Warden'
shields.specific.forge-warden.description: "Item 10. A lesser reinforcing steel shield (Hardness 8, HP 72, BT 36) that is a religious symbol of the forge god. While it's raised, you and adjacent allies have fire resistance 5. Forge Fire (free action): when you Shield Block an adjacent creature's attack and it takes damage, the attacker takes 2d6 fire damage."
shields.specific.glamorous-buckler.name: 'Glamorous Buckler'
shields.specific.glamorous-buckler.description: 'Item 2. A buckler that, raised, gives a +1 item bonus to Deception checks to Feint. Dazzling Feint (free action, once per day, when you Feint with it raised): a successful Feint dazzles the target for 1 round.'
shields.specific.indestructible-shield.name: 'Indestructible Shield'
shields.specific.indestructible-shield.description: 'Item 18. A high-grade greater reinforcing adamantine shield (Hardness 17, HP 136) damaged only by disintegrate or an artifact of destruction.'
shields.specific.lions-shield.name: "Lion's Shield"
shields.specific.lions-shield.description: "Item 6. A steel shield (Hardness 6, HP 36, BT 18) whose lion head is a +1 striking shield boss. Lion's Bite (free action, once per day, raised): it animates for 1 minute and you Strike with it (2d6 piercing, deadly d6, martial), again each time you Raise a Shield or Strike."
shields.specific.lodestone-shield.name: 'Lodestone Shield'
shields.specific.lodestone-shield.description: "Item 11. A moderate reinforcing cold iron shield (Hardness 10, HP 92, BT 46). Attract Projectile (reaction, once per minute, raised): a ranged Strike at a creature within 15 feet targets you instead, with Shield Block's benefit if it hits."
shields.specific.reflecting-shield.name: 'Reflecting Shield'
shields.specific.reflecting-shield.description: 'Item 18. A high-grade silver buckler (Hardness 6, HP 24, BT 12) that works as a spellguard shield. Reflect Spell (reaction, once per day, raised): counteract a spell targeting you (rank 9, +30) and turn it back on its caster.'
shields.specific.spellguard-shield.name: 'Spellguard Shield'
shields.specific.spellguard-shield.description: 'Item 6. A steel shield (Hardness 6, HP 24, BT 12): raised, its circumstance bonus applies to saves against spells that target you, and you can Shield Block such spells.'
shields.specific.spined-shield.name: 'Spined Shield'
shields.specific.spined-shield.description: 'Item 7. A steel shield (Hardness 6, HP 24, BT 12) with +1 striking shield spikes. Its spines take Shield Block damage first, one snapping off per 6 damage (they regrow each day). Fire Spine (1 action): shoot a spine as a martial ranged weapon (120 feet).'
shields.specific.sturdy-shield-minor.name: 'Sturdy Shield (Minor)'
shields.specific.sturdy-shield-minor.description: 'Item 4. A superior steel shield (Hardness 8, HP 64, BT 32).'
shields.specific.sturdy-shield-lesser.name: 'Sturdy Shield (Lesser)'
shields.specific.sturdy-shield-lesser.description: 'Item 7. A superior steel shield (Hardness 10, HP 80, BT 40).'
shields.specific.sturdy-shield-moderate.name: 'Sturdy Shield (Moderate)'
shields.specific.sturdy-shield-moderate.description: 'Item 10. A superior steel shield (Hardness 13, HP 104, BT 52).'
shields.specific.sturdy-shield-greater.name: 'Sturdy Shield (Greater)'
shields.specific.sturdy-shield-greater.description: 'Item 13. A superior steel shield (Hardness 15, HP 120, BT 60).'
shields.specific.sturdy-shield-major.name: 'Sturdy Shield (Major)'
shields.specific.sturdy-shield-major.description: 'Item 16. A superior steel shield (Hardness 17, HP 136, BT 68).'
shields.specific.sturdy-shield-supreme.name: 'Sturdy Shield (Supreme)'
shields.specific.sturdy-shield-supreme.description: 'Item 19. A superior steel shield (Hardness 20, HP 160, BT 80).'
# Player Core 2's specific weapons, armor and shields.
weapons.specific.infiltrators-accessory.name: "Infiltrator's Accessory"
weapons.specific.infiltrators-accessory.description: 'Item 5. A +1 striking sword cane. Hide Magic (1 action): the blade merges into the cane, which then appears non-magical (3rd-rank disguise magic; DC 30 Perception to see through) until you activate it again.'
weapons.specific.spellguard-blade.name: 'Spellguard Blade'
weapons.specific.spellguard-blade.description: "Item 7. A +1 striking main-gauche. While you have its parry trait's circumstance bonus to AC, you also add it to saves against spells that target you."
weapons.specific.spiritsight-crossbow.name: 'Spiritsight Crossbow'
weapons.specific.spiritsight-crossbow.description: 'Item 8. A +1 striking ghost touch crossbow. Ethereal Vision (1 action, once per minute): until the end of your turn you sense into the Ethereal Plane within 60 feet (imprecise; precise for creatures not immune to spirit). Ethereal Shot (1 action, while it lasts): a Strike that passes through physical cover within that range.'
weapons.specific.four-ways-dogslicer.name: 'Four-Ways Dogslicer'
weapons.specific.four-ways-dogslicer.description: 'Item 12. A +2 striking dogslicer. Gem Twist (1 action): activate one of its flaming, frost or shock runes (only one at a time), taking 1d6 damage of that type, or turn the active one off with no damage.'
weapons.specific.chalice-of-justice.name: 'Chalice of Justice'
weapons.specific.chalice-of-justice.description: "Item 14. A +2 greater striking holy cold iron longsword, also silver. An unholy creature holding it is drained 2 and can't recover. Sip of Justice (1 action, once per day): you regain Hit Points equal to its level (double if you're holy, and for 1 minute your critical hits on unholy creatures deal 2d6 persistent holy spirit damage and slow them 1 for 1 round)."
armor.specific.mariners-splint.name: "Mariner's Splint"
armor.specific.mariners-splint.description: 'Item 5. +1 splint mail: a +1 item bonus to Athletics checks to Climb or Swim, and you move 5 feet farther when you succeed.'
armor.specific.ghoul-hide.name: 'Ghoul Hide'
armor.specific.ghoul-hide.description: "Item 6. +1 hide armor: a +1 item bonus to saves against curses (a resilient rune's bonus against curses is 1 higher, at most +4), and immunity to ghouls' stench."
armor.specific.warleaders-bulwark.name: "Warleader's Bulwark"
armor.specific.warleaders-bulwark.description: 'Item 10. A +1 resilient breastplate: a +2 item bonus to Diplomacy, and a -2 item penalty to Stealth checks to Hide and Sneak and Deception checks to Impersonate. Command Bravery (1 action, once per day): allies within 100 feet gain a +2 status bonus to saves against fear for 1 minute, and each frightened one lowers its frightened value by 1.'
armor.specific.warleaders-bulwark-greater.name: "Warleader's Bulwark (Greater)"
armor.specific.warleaders-bulwark-greater.description: "Item 18. A +2 greater resilient breastplate, as warleader's bulwark with a +3 item bonus and a -3 item penalty."
armor.specific.holy-chain.name: 'Holy Chain'
armor.specific.holy-chain.description: "Item 13. +2 resilient chain mail with no Speed reduction, no check penalty and 1 Bulk: a +1 circumstance bonus to AC and saves against fiends, and a +2 item bonus to Diplomacy with all but fiends. An unholy wearer is drained 2 and can't recover. Celestial Flight (1 action, once per day): glowing wings give a fly Speed of 30 feet for 10 minutes."
armor.specific.unholy-plate.name: 'Unholy Plate'
armor.specific.unholy-plate.description: "Item 13. +2 resilient full plate with a horned helm: the horns are a martial melee weapon (+2 potency, 2d8 piercing, deadly d12, unholy; a critical hit needs a DC 30 Fortitude save or the target is drained 1, 2 on a critical failure). A holy wearer is drained 2 and can't recover. Demonic Slip (2 actions, once per day): you cast translocate."
shields.specific.exploding-shield.name: 'Exploding Shield'
shields.specific.exploding-shield.description: 'Item 5. A wooden shield. Splintering Boom (free action, when it is destroyed): it explodes, 4d6 piercing damage to each creature in a 15-foot cone (DC 19 basic Reflex save).'
shields.specific.medusas-scream.name: "Medusa's Scream"
shields.specific.medusas-scream.description: "Item 13. A steel shield (Hardness 13, HP 52, BT 26) bearing a medusa's head under a cover. Petrifying Gaze (2 actions, once per day): it casts a DC 30 petrify on a creature within 30 feet."
shields.specific.medusas-scream-greater.name: "Medusa's Scream (Greater)"
shields.specific.medusas-scream-greater.description: "Item 16. As medusa's scream, with Hardness 15, HP 60, BT 30, Petrifying Gaze once per hour and DC 35."
