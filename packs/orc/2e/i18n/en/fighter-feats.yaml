# Fighter feats to 20th level. Short rules text written for the pack.

feats.fighter.combat-assessment.name: 'Combat Assessment'
feats.fighter.combat-assessment.description: 'One action. Make a melee Strike; on a hit you can immediately Recall Knowledge about the target (+2 circumstance bonus on a critical hit). The target is then immune for a day.'
feats.fighter.combat-assessment.actions.combat-assessment.name: 'Combat Assessment'
feats.fighter.combat-assessment.actions.combat-assessment.steps.weapon.prompt: 'Choose a weapon'
feats.fighter.aggressive-block.name: 'Aggressive Block'
feats.fighter.aggressive-block.description: "Free action. Trigger: you Shield Block an adjacent foe your size or smaller. It chooses: you Shove it 5 feet (your direction), or it's off-guard until the start of your next turn; it must take off-guard if the Shove would hit an object, difficult terrain or a creature."
feats.fighter.assisting-shot.name: 'Assisting Shot'
feats.fighter.assisting-shot.description: 'One action, press. Requirement: a ranged weapon. Make a ranged Strike; on a hit, the next creature other than you to attack the target before your next turn gains a +1 circumstance bonus to its roll (+2 on a critical hit).'
feats.fighter.assisting-shot.actions.assisting-shot.name: 'Assisting Shot'
feats.fighter.assisting-shot.actions.assisting-shot.steps.weapon.prompt: 'Choose a weapon'
feats.fighter.blade-brake.name: 'Blade Brake'
feats.fighter.blade-brake.description: 'Reaction. Trigger: forced movement would move you, while you wield a melee weapon near a hard surface. You anchor yourself: moved 5 feet if it would be 20 feet or more, otherwise not at all.'
feats.fighter.brutish-shove.name: 'Brutish Shove'
feats.fighter.brutish-shove.description: "One action, press. Requirement: a two-handed melee weapon. Strike; on a hit against a creature your size or smaller it's off-guard until the end of your turn and you automatically Shove it (critical Shove on a critical hit), your following movement triggering no reactions. **Failure** The target is off-guard until the end of your turn."
feats.fighter.combat-grab.name: 'Combat Grab'
feats.fighter.combat-grab.description: 'One action, press. Requirement: a free hand within reach of the target. Make a melee Strike keeping the hand free; on a hit you grab the target until the end of your next turn or until it Escapes.'
feats.fighter.combat-grab.actions.combat-grab.name: 'Combat Grab'
feats.fighter.combat-grab.actions.combat-grab.steps.weapon.prompt: 'Choose a weapon'
feats.fighter.lightning-swap.name: 'Lightning Swap'
feats.fighter.lightning-swap.description: 'One action, flourish. Interact to stow anything in your hands, then draw up to two weapons, or a shield and a weapon.'
feats.fighter.rebounding-toss.name: 'Rebounding Toss'
feats.fighter.rebounding-toss.description: 'Two actions, flourish. Requirement: a thrown weapon. Make a ranged thrown Strike; on a hit it rebounds to an enemy within 10 feet of the target for another Strike. Both count for your multiple attack penalty, which rises only after both.'
feats.fighter.sleek-reposition.name: 'Sleek Reposition'
feats.fighter.sleek-reposition.description: "One action, press. Requirement: a finesse weapon or polearm. Make a melee Strike; on a hit against a creature your size or smaller you automatically Reposition it (a critical Reposition on a critical hit), using a reach weapon's reach. **Failure** The target is off-guard until the end of your turn."
feats.fighter.double-shot.name: 'Double Shot'
feats.fighter.double-shot.description: 'Two actions, flourish. Requirement: a ranged weapon with reload 0. Make two Strikes against different targets, each at -2; the multiple attack penalty rises only after both.'
feats.fighter.dual-handed-assault.name: 'Dual-Handed Assault'
feats.fighter.dual-handed-assault.description: "One action, flourish. Requirement: a one-handed melee weapon and a free hand. Strike gripping it in both hands: its damage die is one step larger, or a two-hand weapon gets its two-hand die and a circumstance bonus to damage equal to its damage dice. Your stances needing a free hand don't end."
feats.fighter.parting-shot.name: 'Parting Shot'
feats.fighter.parting-shot.description: 'Two actions. Requirement: a loaded ranged weapon or one with reload 0. Step, then make a ranged Strike against a target off-guard to it.'
feats.fighter.powerful-shove.name: 'Powerful Shove'
feats.fighter.powerful-shove.description: 'Aggressive Block and Brutish Shove work on creatures up to two sizes larger than you. A creature you Shove or knock back with a shield, polearm or club critical specialization into an object takes damage equal to your Strength modifier (at least 1).'
feats.fighter.powerful-shove.prerequisites.aggressive-block-or: 'Aggressive Block or Brutish Shove'
feats.fighter.quick-reversal.name: 'Quick Reversal'
feats.fighter.quick-reversal.description: 'One action, flourish, press. Requirement: at least two enemies flank you. Make a melee Strike against one flanker and a second Strike with the same weapon against another, at the same multiple attack penalty, the second not counting toward it.'
feats.fighter.shielded-stride.name: 'Shielded Stride'
feats.fighter.shielded-stride.description: 'With your shield raised, you can Stride (or Fly or Swim) up to half your Speed without triggering reactions to your movement.'
feats.fighter.slam-down.name: 'Slam Down'
feats.fighter.slam-down.description: "Two actions, flourish. Make a melee Strike; if it hits and deals damage you can Trip the creature with Athletics (a two-handed melee weapon ignores Trip's free hand). The penalty rises only after both."
feats.fighter.slam-down.prerequisites.athletics: 'Trained in Athletics'
feats.fighter.advanced-weapon-training.name: 'Advanced Weapon Training'
feats.fighter.advanced-weapon-training.description: "Choose a weapon group: you're proficient with its advanced weapons as if they were martial weapons."
feats.fighter.advantageous-assault.name: 'Advantageous Assault'
feats.fighter.advantageous-assault.description: "One action, press. Strike a grabbed, prone or restrained creature with a circumstance bonus to damage equal to the weapon damage dice (+2 if wielded in two hands). **Failure** You deal that much damage of the weapon's type."
feats.fighter.dazing-blow.name: 'Dazing Blow'
feats.fighter.dazing-blow.description: 'One action, press. Requirement: you have a creature grabbed. Make a melee Strike against it dealing bludgeoning damage; on a hit it attempts a Fortitude save against your class DC (incapacitation). **Critical Success** Unaffected. **Success** Stunned 1. **Failure** Stunned 2. **Critical Failure** Stunned 3.'
feats.fighter.dazing-blow.actions.dazing-blow.name: 'Dazing Blow'
feats.fighter.dazing-blow.actions.dazing-blow.steps.weapon.prompt: 'Choose a weapon'
feats.fighter.disarming-stance.name: 'Disarming Stance'
feats.fighter.disarming-stance.description: 'Stance. Requirement: one one-handed melee weapon and nothing else in your hands. You gain a +1 circumstance bonus to Athletics checks to Disarm, a +2 circumstance bonus to your Reflex DC against being Disarmed, and can Disarm creatures up to two sizes larger.'
feats.fighter.disarming-stance.prerequisites.athletics: 'Trained in Athletics'
feats.fighter.furious-focus.name: 'Furious Focus'
feats.fighter.furious-focus.description: 'A Vicious Swing with a melee weapon held in two hands counts as one attack for your multiple attack penalty instead of two.'
feats.fighter.furious-focus.prerequisites.vicious-swing: 'Vicious Swing'
feats.fighter.guardians-deflection-fighter.name: "Guardian's Deflection (Fighter)"
feats.fighter.guardians-deflection-fighter.description: 'Reaction. Requirement: one one-handed melee weapon and nothing else in your hands. Trigger: an ally in your reach is hit by an attacker you can see, and +2 to its AC would downgrade the hit. You give the ally a +2 circumstance bonus to AC against it, turning a critical hit into a hit or a hit into a miss.'
feats.fighter.reflexive-shield.name: 'Reflexive Shield'
feats.fighter.reflexive-shield.description: "When you Raise your Shield, its circumstance bonus applies to your Reflex saves too, and damage from a Reflex save can trigger Shield Block even if it isn't physical."
feats.fighter.revealing-stab.name: 'Revealing Stab'
feats.fighter.revealing-stab.description: "Two actions. Requirement: a piercing melee weapon. Strike: a concealed target needs no flat check and a hidden one only DC 5. If you hit and deal damage you can leave the weapon lodged in a corporeal target, revealing it to observers who can see the weapon (same flat checks, and it can't become undetected) until it's pulled out (two Interact actions)."
feats.fighter.ricochet-stance-fighter.name: 'Ricochet Stance (Fighter)'
feats.fighter.ricochet-stance-fighter.description: 'Stance. Your thrown weapons that deal bludgeoning or slashing damage return to your hand after a ranged Strike within their range increment (with a hand free to catch them); beyond it they fly back that many feet and drop.'
feats.fighter.shatter-defenses.name: 'Shatter Defenses'
feats.fighter.shatter-defenses.description: "One action, press. Requirement: a frightened creature in your melee reach. Strike it; if you hit and deal damage it's off-guard until its frightened ends, and if it was already off-guard to you it can't reduce frightened below 1 until the start of your next turn."
feats.fighter.triple-shot.name: 'Triple Shot'
feats.fighter.triple-shot.description: 'Double Shot can target the same creature, and with one more action makes three Strikes at -4 each; the penalty rises only after all of them.'
feats.fighter.triple-shot.prerequisites.double-shot: 'Double Shot'
feats.fighter.blind-fight.name: 'Blind-Fight'
feats.fighter.blind-fight.description: "You need no flat check against concealed creatures, aren't off-guard to hidden ones (for that reason), and need only DC 5 against hidden ones. An adjacent undetected creature of your level or lower is only hidden to you."
feats.fighter.blind-fight.prerequisites.perception: 'Master in Perception'
feats.fighter.disorienting-opening.name: 'Disorienting Opening'
feats.fighter.disorienting-opening.description: 'A creature you hit with Reactive Strike is off-guard until the start of your next turn.'
feats.fighter.disorienting-opening.prerequisites.reactive-strike: 'Reactive Strike'
feats.fighter.dueling-riposte.name: 'Dueling Riposte'
feats.fighter.dueling-riposte.description: 'Reaction. Requirement: you benefit from Dueling Parry. Trigger: a creature in your reach critically fails a Strike against you. Make a melee Strike against it or Disarm it.'
feats.fighter.dueling-riposte.prerequisites.dueling-parry-fighter: 'Dueling Parry (Fighter)'
feats.fighter.felling-strike.name: 'Felling Strike'
feats.fighter.felling-strike.description: "Two actions. Strike; if you hit a flying target and deal damage, it falls gently up to 120 feet (no falling damage). On a critical hit it can't Fly, Leap or otherwise leave the ground until the end of your next turn."
feats.fighter.incredible-aim.name: 'Incredible Aim'
feats.fighter.incredible-aim.description: "Two actions, concentrate. Make a ranged weapon Strike with a +2 circumstance bonus to the attack roll, ignoring the target's concealment."
feats.fighter.incredible-aim.actions.incredible-aim.name: 'Incredible Aim'
feats.fighter.incredible-aim.actions.incredible-aim.steps.weapon.prompt: 'Choose a weapon'
feats.fighter.mobile-shot-stance.name: 'Mobile Shot Stance'
feats.fighter.mobile-shot-stance.description: "Stance. Your ranged Strikes don't trigger reactions that ranged attacks trigger, and you can use Reactive Strike with a loaded ranged weapon against a triggering creature within 5 feet."
feats.fighter.positioning-assault.name: 'Positioning Assault'
feats.fighter.positioning-assault.description: 'Two actions, flourish. Requirement: a two-handed melee weapon and the target in reach. Strike; on a hit you Reposition the target 5 feet.'
feats.fighter.resounding-bravery.name: 'Resounding Bravery'
feats.fighter.resounding-bravery.description: "When you critically succeed at a Will save against a foe's ability, you gain a +1 status bonus to saves and temporary Hit Points equal to half your level for 1 minute (doubled if it was a fear effect)."
feats.fighter.resounding-bravery.prerequisites.bravery: 'Bravery'
feats.fighter.sudden-leap.name: 'Sudden Leap'
feats.fighter.sudden-leap.description: "Two actions. Leap, High Jump or Long Jump (High and Long Jump use Long Jump's rules, up to double your Speed) and make one melee Strike during it (Felling Strike instead if you have it); you then land, unhurt if the fall is no farther than your jump's height."
feats.fighter.agile-grace.name: 'Agile Grace'
feats.fighter.agile-grace.description: 'Your multiple attack penalty with agile weapons and agile unarmed attacks is -3 for the second attack and -6 after, instead of -4 and -8.'
feats.fighter.certain-strike.name: 'Certain Strike'
feats.fighter.certain-strike.description: 'One action, press. Make a melee Strike. **Failure** It deals the damage a hit would, without any damage dice.'
feats.fighter.crashing-slam.name: 'Crashing Slam'
feats.fighter.crashing-slam.description: "Slam Down can be a single Strike: on a hit you can take a critical success on the Trip instead of rolling (both still count toward your penalty), and a two-handed weapon's damage die replaces the critical Trip's die."
feats.fighter.crashing-slam.prerequisites.slam-down: 'Slam Down'
feats.fighter.cut-from-the-air.name: 'Cut from the Air'
feats.fighter.cut-from-the-air.description: "Reaction. Requirement: you're aware of the attack, not off-guard, and have a hand free or a melee weapon. Trigger: you're targeted by a physical ranged Strike. +4 circumstance bonus to AC against it; if it misses you knocked it aside."
feats.fighter.debilitating-shot.name: 'Debilitating Shot'
feats.fighter.debilitating-shot.description: 'Two actions, flourish. Make a ranged weapon Strike; if it hits and deals damage, the target is slowed 1 until the end of its next turn.'
feats.fighter.debilitating-shot.actions.debilitating-shot.name: 'Debilitating Shot'
feats.fighter.debilitating-shot.actions.debilitating-shot.steps.weapon.prompt: 'Choose a weapon'
feats.fighter.disarming-twist.name: 'Disarming Twist'
feats.fighter.disarming-twist.description: "One action, press. Requirement: one one-handed melee weapon and nothing else in your hands. Make a melee Strike that also has Disarm's success and critical success effects (+1 circumstance to the attack in Disarming Stance). **Failure** The target is off-guard until the end of your turn."
feats.fighter.disarming-twist.prerequisites.athletics: 'Trained in Athletics'
feats.fighter.disruptive-stance.name: 'Disruptive Stance'
feats.fighter.disruptive-stance.description: 'Stance. You can use Reactive Strike against a concentrate action in your reach too, and your hit disrupts a triggering concentrate or manipulate action (not only a critical hit).'
feats.fighter.fearsome-brute.name: 'Fearsome Brute'
feats.fighter.fearsome-brute.description: "Your Strikes against a frightened creature gain a circumstance bonus to damage equal to twice its frightened value (three times if you're a master in Intimidation)."
feats.fighter.flinging-charge.name: 'Flinging Charge'
feats.fighter.flinging-charge.description: 'Two actions, flourish. Stride twice, making a thrown ranged Strike at any point; on a hit the target is off-guard to your next melee attack against it this turn.'
feats.fighter.mirror-shield.name: 'Mirror Shield'
feats.fighter.mirror-shield.description: "Reaction. Requirement: your shield is raised. Trigger: a spell's spell attack against you critically fails. Make a ranged attack (or a spell attack, if you cast spells) against the caster; on a success it suffers its own spell's successful attack (a critical success's on a critical success)."
feats.fighter.overpowering-charge.name: 'Overpowering Charge'
feats.fighter.overpowering-charge.description: "When your Barreling Charge moves through a creature's space, it takes bludgeoning damage equal to your Strength modifier; on a critical success, double, and it's off-guard until the end of your next turn."
feats.fighter.overpowering-charge.prerequisites.barreling-charge: 'Barreling Charge'
feats.fighter.tactical-reflexes.name: 'Tactical Reflexes'
feats.fighter.tactical-reflexes.description: 'At the start of each of your turns you gain an extra reaction usable only for Reactive Strike.'
feats.fighter.twin-riposte.name: 'Twin Riposte'
feats.fighter.twin-riposte.description: 'Reaction. Requirement: you benefit from Twin Parry. Trigger: a creature in your reach critically fails to Strike you. Make a melee Strike against it or Disarm it.'
feats.fighter.brutal-finish.name: 'Brutal Finish'
feats.fighter.brutal-finish.description: 'One action, press. Requirement: a melee weapon held in two hands. Strike with one more weapon damage die (two at 18th level); then your turn ends. **Failure** You deal one weapon damage die (two at 18th level).'
feats.fighter.brutal-finish.actions.brutal-finish.name: 'Brutal Finish'
feats.fighter.brutal-finish.actions.brutal-finish.steps.weapon.prompt: 'Choose a weapon'
feats.fighter.dashing-strike.name: 'Dashing Strike'
feats.fighter.dashing-strike.description: "One action, press. Requirement: you're adjacent to an enemy. Stride (or Burrow, Climb, Fly or Swim) up to your Speed, ending within reach of a different enemy, and make a melee Strike against it."
feats.fighter.dueling-dance-fighter.name: 'Dueling Dance (Fighter)'
feats.fighter.dueling-dance-fighter.description: "Stance. Requirement: one one-handed melee weapon and nothing else in your hands. You constantly have Dueling Parry's benefits."
feats.fighter.dueling-dance-fighter.prerequisites.dueling-parry-fighter: 'Dueling Parry (Fighter)'
feats.fighter.flinging-shove.name: 'Flinging Shove'
feats.fighter.flinging-shove.description: 'Aggressive Block and Brutish Shove push 10 feet on a success, 20 on a critical success; Aggressive Block lets you choose off-guard or Shove; Brutish Shove pushes 5 feet even on a failure.'
feats.fighter.flinging-shove.prerequisites.aggressive-block-or: 'Aggressive Block or Brutish Shove'
feats.fighter.improved-dueling-riposte.name: 'Improved Dueling Riposte'
feats.fighter.improved-dueling-riposte.description: 'You can Dueling Riposte without Dueling Parry (with one one-handed weapon and nothing else), and gain an extra reaction each turn usable only for it.'
feats.fighter.improved-dueling-riposte.prerequisites.dueling-riposte: 'Dueling Riposte'
feats.fighter.incredible-ricochet.name: 'Incredible Ricochet'
feats.fighter.incredible-ricochet.description: 'One action, concentrate, press. Make a ranged weapon Strike against a creature you attacked this turn, ignoring its concealment and all cover.'
feats.fighter.incredible-ricochet.prerequisites.incredible-aim: 'Incredible Aim'
feats.fighter.lunging-stance.name: 'Lunging Stance'
feats.fighter.lunging-stance.description: "Stance. Requirement: a melee weapon. You can Reactive Strike a creature beyond your reach but within your Lunge's reach, that Strike's reach 5 feet longer."
feats.fighter.lunging-stance.prerequisites.reactive-strike: 'Reactive Strike'
feats.fighter.lunging-stance.prerequisites.lunge: 'Lunge'
feats.fighter.paragons-guard.name: "Paragon's Guard"
feats.fighter.paragons-guard.description: "Stance. Requirement: a shield. Your shield is constantly raised, as if you'd used Raise a Shield."
feats.fighter.desperate-finisher.name: 'Desperate Finisher'
feats.fighter.desperate-finisher.description: "Reaction, press. Trigger: you finish the last action of your turn. Use one press action you know (at your multiple attack penalty); you can't use reactions until your next turn."
feats.fighter.determination.name: 'Determination'
feats.fighter.determination.description: "One action, concentrate, once a day. End one nonpermanent condition affecting you, or try to counteract a spell or magical effect on you (counteract rank half your level rounded up, your Will save as the counteract check). Hit Points lost stay lost; afflictions and situational conditions (prone, flanked) aren't ended."
feats.fighter.guiding-finish.name: 'Guiding Finish'
feats.fighter.guiding-finish.description: 'One action, press. Requirement: one one-handed melee weapon and nothing else in your hands. Strike; on a hit you can Reposition the target up to 10 feet, even through your space. **Failure** As a success, but only 5 feet.'
feats.fighter.guiding-riposte.name: 'Guiding Riposte'
feats.fighter.guiding-riposte.description: 'When your Dueling Riposte Strike hits, you can Reposition the target up to 10 feet.'
feats.fighter.guiding-riposte.prerequisites.dueling-riposte: 'Dueling Riposte'
feats.fighter.improved-twin-riposte-fighter.name: 'Improved Twin Riposte (Fighter)'
feats.fighter.improved-twin-riposte-fighter.description: 'You can Twin Riposte without Twin Parry (with a melee weapon in each hand), and gain an extra reaction each turn usable only for it.'
feats.fighter.improved-twin-riposte-fighter.prerequisites.twin-riposte: 'Twin Riposte'
feats.fighter.opening-stance-fighter.name: 'Opening Stance (Fighter)'
feats.fighter.opening-stance-fighter.description: 'Free action. Trigger: you roll initiative. You use an action with the stance trait.'
feats.fighter.two-weapon-flurry.name: 'Two-Weapon Flurry'
feats.fighter.two-weapon-flurry.description: 'One action, flourish, press. Requirement: two weapons, one in each hand. Strike once with each.'
feats.fighter.whirlwind-strike.name: 'Whirlwind Strike'
feats.fighter.whirlwind-strike.description: 'Three actions, flourish. Make a melee Strike against each enemy in your reach; the multiple attack penalty rises only after all of them.'
feats.fighter.graceful-poise.name: 'Graceful Poise'
feats.fighter.graceful-poise.description: "Stance. When Double Slice's second Strike uses an agile weapon, Double Slice counts as one attack for your multiple attack penalty."
feats.fighter.graceful-poise.prerequisites.double-slice: 'Double Slice'
feats.fighter.improved-reflexive-shield.name: 'Improved Reflexive Shield'
feats.fighter.improved-reflexive-shield.description: "When you Shield Block damage from a Reflex save, adjacent allies taking damage from the same effect's Reflex saves benefit from the reduction too."
feats.fighter.improved-reflexive-shield.prerequisites.reflexive-shield: 'Reflexive Shield'
feats.fighter.master-of-many-styles.name: 'Master of Many Styles'
feats.fighter.master-of-many-styles.description: 'Free action. Trigger: your turn begins. You use an action with the stance trait.'
feats.fighter.master-of-many-styles.prerequisites.stance: 'Opening Stance (fighter) or Reflexive Stance (monk)'
feats.fighter.multishot-stance.name: 'Multishot Stance'
feats.fighter.multishot-stance.description: 'Stance. Requirement: a ranged weapon with reload 0. Your Double Shot penalty is -1 (-2 with three Strikes from Triple Shot); moving ends the stance.'
feats.fighter.multishot-stance.prerequisites.triple-shot: 'Triple Shot'
feats.fighter.overwhelming-blow.name: 'Overwhelming Blow'
feats.fighter.overwhelming-blow.description: "Three actions. Make a melee Strike that counts as three attacks for your penalty: a hit is a critical hit, and a critical hit gains deadly d12 (replacing any deadly). Either way you're stunned 1 and off-guard until the start of your next turn."
feats.fighter.twinned-defense-fighter.name: 'Twinned Defense (Fighter)'
feats.fighter.twinned-defense-fighter.description: "Stance. Requirement: a melee weapon in each hand. You constantly have Twin Parry's benefits."
feats.fighter.twinned-defense-fighter.prerequisites.twin-parry: 'Twin Parry'
feats.fighter.impossible-volley.name: 'Impossible Volley'
feats.fighter.impossible-volley.description: 'Three actions, flourish. Requirement: a volley weapon with reload 0. Strike at -2 against each enemy in a 10-foot burst at or beyond the volley range, rolling damage once; the penalty rises only after all of them.'
feats.fighter.savage-critical.name: 'Savage Critical'
feats.fighter.savage-critical.description: "With a weapon or unarmed attack in which you're legendary, a natural 19 that would succeed is a critical success."
feats.fighter.smash-from-the-air.name: 'Smash from the Air'
feats.fighter.smash-from-the-air.description: 'You can use Cut from the Air against ranged spell attacks.'
feats.fighter.smash-from-the-air.prerequisites.cut-from-the-air: 'Cut from the Air'
feats.fighter.boundless-reprisals.name: 'Boundless Reprisals'
feats.fighter.boundless-reprisals.description: "At the start of each enemy's turn you gain a reaction usable that turn only for a reaction from a fighter feat or class feature."
feats.fighter.ultimate-flexibility.name: 'Ultimate Flexibility'
feats.fighter.ultimate-flexibility.description: "Combat flexibility gives three fighter feats: the first of 8th level or lower, the second up to 14th, the third up to 18th (each can meet the next ones' prerequisites). An hour of training lets you reselect them, but not trade away used limited abilities."
feats.fighter.ultimate-flexibility.prerequisites.flexibility: 'Improved flexibility'
feats.fighter.weapon-supremacy.name: 'Weapon Supremacy'
feats.fighter.weapon-supremacy.description: "You're permanently quickened; the extra action can only Strike."
tags.strike.brutal-finish.name: 'Brutal finish'
tags.strike.incredible-aim.name: 'Incredible aim'
