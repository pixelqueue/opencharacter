# Player Core 2's ratfolk: its ancestry or heritage, heritages and feats, in text written for the
# pack.
ancestries.ratfolk.choices.boosts.options.alternate.choices.free.prompt: 'Two free attribute boosts'
ancestries.ratfolk.choices.boosts.options.alternate.name: 'Two free boosts instead'
ancestries.ratfolk.choices.boosts.options.standard.choices.free.prompt: 'A free attribute boost'
ancestries.ratfolk.choices.boosts.options.standard.name: "The ancestry's boosts and flaw"
ancestries.ratfolk.choices.boosts.prompt: 'Ancestry attribute boosts'
ancestries.ratfolk.choices.heritage.prompt: 'Heritage'
ancestries.ratfolk.name: 'Ratfolk'
ancestries.ratfolk.description: 'Small, clever, communal traders and tinkers. 6 Hit Points, Small, 25 feet. Boosts: Dexterity, Intelligence, free; flaw: Strength. Low-light vision. Sharp Teeth: a jaws unarmed attack, 1d4 piercing, brawling group, agile and finesse.'
heritages.deep-rat.name: 'Deep Rat'
heritages.deep-rat.description: 'You gain darkvision.'
heritages.desert-rat.name: 'Desert Rat'
heritages.desert-rat.description: "With both hands free you can run on all fours at a Speed of 30 feet. Environmental heat is one step less extreme for you and you go ten times as long before starvation or thirst affect you, but environmental cold is one step more extreme unless you're protected."
heritages.longsnout-rat.name: 'Longsnout Rat'
heritages.longsnout-rat.description: 'Imprecise scent, 30 feet, and a +2 circumstance bonus to Seek a creature or object within its range.'
heritages.sewer-rat.name: 'Sewer Rat'
heritages.sewer-rat.description: "You're immune to putrid plague. +1 circumstance bonus to saves against diseases and poisons, and a success on one is a critical success (with another ability that improves it this way, a critical failure is a failure)."
heritages.shadow-rat.name: 'Shadow Rat'
heritages.shadow-rat.description: "You're trained in Intimidation (or a skill of your choice if you already were), can Coerce animals with it, and take no language penalty to Demoralize an animal. Animals' attitudes toward you start one step worse."
heritages.snow-rat.name: 'Snow Rat'
heritages.snow-rat.description: 'Cold resistance equal to half your level (minimum 1), and environmental cold is one step less extreme for you.'
heritages.tunnel-rat.name: 'Tunnel Rat'
heritages.tunnel-rat.description: "You gain Quick Squeeze even untrained in Acrobatics, and spaces not tight enough to need Squeezing aren't difficult terrain for you."
feats.ancestry.cheek-pouches.name: 'Cheek Pouches'
feats.ancestry.cheek-pouches.description: 'Your cheeks hold up to four items of light Bulk or less (none longer than a foot); with anything in them your speech is hard to understand. Storing or retrieving one is an Interact action; 1 action empties them onto the ground.'
feats.ancestry.pack-rat.name: 'Pack Rat'
feats.ancestry.pack-rat.description: 'You fit 50% more Bulk into mundane containers and vehicles (6 Bulk in a backpack, 12 in a chest); not magical or extradimensional ones.'
feats.ancestry.rat-familiar.name: 'Rat Familiar'
feats.ancestry.rat-familiar.description: 'You gain a familiar, which must be a rat.'
feats.ancestry.ratfolk-lore.name: 'Ratfolk Lore'
feats.ancestry.ratfolk-lore.description: "You're trained in Acrobatics and Stealth (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Ratfolk Lore."
feats.ancestry.ratspeak.name: 'Ratspeak'
feats.ancestry.ratspeak.description: 'You can ask questions of, understand and use Diplomacy with rodents (not other mammals).'
feats.ancestry.tinkering-fingers.name: 'Tinkering Fingers'
feats.ancestry.tinkering-fingers.description: "You're trained in Crafting (or a skill of your choice if you already were). You Repair without a repair toolkit and without the -2 penalty, and with a toolkit you get a +1 circumstance bonus to Repair."
templates.vicious-incisors.name: '{base} (Vicious Incisors)'
feats.ancestry.vicious-incisors.name: 'Vicious Incisors'
feats.ancestry.vicious-incisors.description: 'Your jaws deal 1d6 piercing damage instead of 1d4 and gain the backstabber trait. You can take or retrain this feat at any level.'
feats.ancestry.warren-navigator.name: 'Warren Navigator'
feats.ancestry.warren-navigator.description: "You're trained in Survival (or a skill of your choice if you already were). To Sense Direction, or against a quandary spell, your result is one degree better, and lacking a compass gives no penalty."
feats.ancestry.cornered-fury.name: 'Cornered Fury'
feats.ancestry.cornered-fury.description: 'A larger foe that critically hits and damages you is off-guard to you for 1 round.'
feats.ancestry.lab-rat.name: 'Lab Rat'
feats.ancestry.lab-rat.description: '+1 circumstance bonus to saves against poisons and diseases, and a success on one is a critical success.'
feats.ancestry.quick-stow.name: 'Quick Stow'
feats.ancestry.quick-stow.description: 'Once a round, a free action: Interact to put a held item that fits into your cheek pouches.'
feats.ancestry.quick-stow.prerequisites.cheek-pouches: 'Cheek Pouches'
feats.ancestry.rat-magic.name: 'Rat Magic'
feats.ancestry.rat-magic.description: 'You can cast animal messenger once a day as a primal innate spell; the animal is always a rat (none nearby, the spell is lost).'
feats.ancestry.ratfolk-roll.name: 'Ratfolk Roll'
feats.ancestry.ratfolk-roll.description: '2 actions (move): roll down an incline in a straight line, up to four times your Speed, and keep rolling on later turns (slowed 2 each) until the bottom or an obstacle (4d6 bludgeoning damage to you and it after the first turn).'
feats.ancestry.big-mouth.name: 'Big Mouth'
feats.ancestry.big-mouth.description: 'Your cheek pouches hold up to 1 Bulk of items (each still no bigger than before).'
feats.ancestry.big-mouth.prerequisites.cheek-pouches: 'Cheek Pouches'
feats.ancestry.overcrowd.name: 'Overcrowd'
feats.ancestry.overcrowd.description: "While Small, you can end your move in a Small ally's square (two creatures at most)."
feats.ancestry.rat-form.name: 'Rat Form'
feats.ancestry.rat-form.description: '1 action (concentrate, polymorph, primal): you gain the effects of a 1st-rank pest form, as a Tiny rat.'
feats.ancestry.uncanny-cheeks.name: 'Uncanny Cheeks'
feats.ancestry.uncanny-cheeks.description: 'You gain Prescient Planner and Prescient Consumable, always pulling the items from your cheek pouches (so they must fit).'
feats.ancestry.shinstabber.name: 'Shinstabber'
feats.ancestry.shinstabber.description: "While Small or smaller, you can end your move in any ally's square (two creatures at most)."
feats.ancestry.shinstabber.prerequisites.overcrowd: 'Overcrowd'
feats.ancestry.skittering-sneak.name: 'Skittering Sneak'
feats.ancestry.skittering-sneak.description: 'You can move up to your full Speed when you Sneak.'
feats.ancestry.warren-digger.name: 'Warren Digger'
feats.ancestry.warren-digger.description: 'You gain a burrow Speed of 15 feet.'
feats.ancestry.call-the-swarm.name: 'Call the Swarm'
feats.ancestry.call-the-swarm.description: 'Once a day, 3 actions: rats fill a 30-foot burst within 120 feet, dealing 6d8 piercing damage to all enemies there, then 3d8 to any enemy ending its turn there for a minute; the area is difficult terrain for enemies. You can Dismiss it.'
feats.ancestry.call-the-swarm.prerequisites.ratspeak: 'Ratspeak'
feats.ancestry.greater-than-the-sum.name: 'Greater than the Sum'
feats.ancestry.greater-than-the-sum.description: 'You can cast enlarge once a day as a 6th-rank primal innate spell.'
