# Class feats the caster classes share.
feats.spellcasting.reach-spell.name: Reach Spell
feats.spellcasting.reach-spell.description: 'One action, spellshape. If your next action is to Cast a Spell with a range, its range increases by 30 feet; a touch range becomes 30 feet.'
feats.spellcasting.widen-spell.name: Widen Spell
feats.spellcasting.widen-spell.description: 'One action, spellshape. If your next action is to Cast a Spell with a burst, cone or line area and no duration, the area grows: 5 feet more radius for a burst of at least 10 feet, 5 feet more length for a cone or line of 15 feet or less, 10 feet more for a longer one.'
feats.spellcasting.familiar.name: Familiar
feats.spellcasting.familiar.description: You bond with a familiar, a small creature that serves you and helps your spellcasting.
feats.spellcasting.cantrip-expansion.name: Cantrip Expansion
feats.spellcasting.cantrip-expansion.description: 'Two more cantrips: a prepared caster prepares two more each day; a spontaneous caster adds two cantrips from its list to its repertoire.'
feats.spellcasting.enhanced-familiar.name: Enhanced Familiar
feats.spellcasting.enhanced-familiar.description: 'Prerequisite: a familiar. You choose four familiar or master abilities each day instead of two.'
feats.spellcasting.bespell-strikes.name: Bespell Strikes
feats.spellcasting.bespell-strikes.description: "Free action, once per turn, when your last action was to cast a spell other than a cantrip. Until the end of your turn, one weapon or unarmed attack you wield deals 1d6 extra force damage (or the spell's damage type), and gains your tradition's trait."
feats.spellcasting.steady-spellcasting.name: Steady Spellcasting
feats.spellcasting.steady-spellcasting.description: 'When a reaction would disrupt your spellcasting, attempt a DC 15 flat check; on a success it is not disrupted.'
situational.bespellStrikes.name: Bespell Strikes (1d6 force)
