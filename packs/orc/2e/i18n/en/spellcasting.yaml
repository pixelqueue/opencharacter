features.spellcasting.repertoire.name: Spell repertoire
features.spellcasting.repertoire.description: >-
  The spells you know and can cast spontaneously: your cantrips, and for each rank you have
  slots of as many spells as you have slots of that rank. A spell added at a higher rank than
  its own is known heightened to that rank.
features.spellcasting.repertoire.choices.cantrips.prompt: Cantrips in your repertoire
features.spellcasting.repertoire.choices.spells.prompt: >-
  {slot, selectordinal, one {#st} two {#nd} few {#rd} other {#th}}-rank spells in your repertoire
features.spellcasting.signature-spells.name: Signature spells
features.spellcasting.signature-spells.description: >-
  For each spell rank you can cast, one spell in your repertoire is a signature spell: you can
  cast it heightened to any rank you have slots for, from its own up, without learning it at
  that rank.
features.spellcasting.signature-spells.choices.signature.prompt: >-
  {slot, selectordinal, one {#st} two {#nd} few {#rd} other {#th}}-rank signature spell

