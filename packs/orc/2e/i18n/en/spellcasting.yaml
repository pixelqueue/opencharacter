actions.cast-spell.name: Cast a Spell
actions.cast-spell.description: >-
  Cast a spell you have. A cantrip or focus spell is heightened to half your level rounded up; a
  prepared spell is cast at its slot's rank and expended; a spontaneous spell at a rank it is
  known at (any rank from its own for a signature spell), spending a slot; a focus spell spends
  a Focus Point. Attack spells make a spell attack against each target; save spells have each
  target save against your spell DC.
actions.cast-spell.params.rank.name: Rank
actions.cast-spell.params.rank.description: "The rank it is cast at; above the spell's own, it is heightened."
