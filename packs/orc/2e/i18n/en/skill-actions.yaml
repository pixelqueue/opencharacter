actions.palm-an-object.description: '1 action: Thievery against the Perception DC of each creature observing you to pick up a small unattended object unnoticed (−5 if closely guarded).'
actions.palm-an-object.name: Palm an Object
actions.palm-an-object.params.dc.name: DC
actions.palm-an-object.participants.observer.name: Observers
actions.perform.description: "1 action: Performance against the GM's DC for a short performance that impresses (or doesn't) its audience."
actions.perform.name: Perform
actions.perform.params.combat.name: In combat
actions.perform.params.dc.name: DC
actions.perform.participants.audience.name: Audience
actions.pick-a-lock.description: "2 actions, trained, with a thieves' toolkit: Thievery against the lock's DC. Success: one success toward opening it; critical success: two, leaving no trace. Critical failure: your toolkit breaks."
actions.pick-a-lock.name: Pick a Lock
actions.pick-a-lock.params.dc.name: DC
actions.recall-knowledge.description: "1 action: a skill or Lore check against the GM's DC to remember something about a subject. Critical success: a true answer and more; success: a true answer; critical failure: a false one."
actions.recall-knowledge.name: Recall Knowledge
actions.recall-knowledge.params.dc.name: DC
actions.recall-knowledge.params.skill.name: Skill
actions.repair.description: "10 minutes with a repair toolkit: Crafting against the GM's DC. The item regains 5 HP + 5 per rank (10 + 10 per rank on a critical success); a critical failure deals it 2d6 damage."
actions.repair.name: Repair
actions.repair.params.dc.name: DC
actions.reposition.description: "1 action, attack: Athletics against the target's Fortitude DC to move it 5 feet (10 on a critical success) within your reach. Critical failure: it may move you 5 feet."
actions.reposition.name: Reposition
actions.reposition.params.attack.name: Attack this turn (1st, 2nd, 3rd)
