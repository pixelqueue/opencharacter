actions.learn-a-spell.description: "Trained, 1 hour per rank: your tradition's skill against the Learning a Spell DC for the rank. Success: you learn it and spend the materials; critical success: half the materials; critical failure: half spent, not learned."
actions.learn-a-spell.name: Learn a Spell
actions.learn-a-spell.params.dc.name: DC
actions.learn-a-spell.params.rank.name: Spell rank
actions.learn-a-spell.params.skill.name: Skill
actions.lie.description: "At least a round: one Deception check against the Perception DC of each creature you're fooling. Success: they believe you; failure: they don't, and get +4 against your Lies this conversation."
actions.lie.name: Lie
actions.lie.params.dc.name: DC
actions.lie.participants.observer.name: Observers
actions.long-jump.description: '2 actions: Stride at least 10 feet, then a DC 15 Athletics check. Success: leap your result in feet, rounded down to 5 and no farther than your Speed. Failure: an ordinary Leap; critical failure: then you fall prone.'
actions.long-jump.name: Long Jump
actions.long-jump.params.dc.name: DC
actions.long-jump.params.extraActions.name: Extra actions
actions.make-an-impression.description: "A minute of conversation: Diplomacy against the target's Will DC (up to five targets at −2). Its attitude improves by one step on a success, two on a critical success, and worsens by one on a critical failure."
actions.make-an-impression.name: Make an Impression
actions.make-an-impression.options.diplomacy.name: Diplomacy
