# Skill actions (rules/skill-actions*.yaml): names, rules text, prompts.
actions.administer-first-aid.description: "2 actions with a healer's toolkit: Medicine to stabilize a dying creature (DC 5 + its recovery DC; success: no longer dying, still unconscious; critical failure: dying rises by 1) or to stop bleeding (the bleed's DC; success: an assisted flat check; critical failure: it takes the bleed damage)."
actions.administer-first-aid.name: Administer First Aid
actions.administer-first-aid.options.bleeding.name: Stop bleeding
actions.administer-first-aid.options.frightened.name: Lower frightened
actions.administer-first-aid.options.sickened.name: Lower sickened
actions.administer-first-aid.options.stabilize.name: Stabilize
actions.administer-first-aid.params.dc.name: DC
actions.administer-first-aid.participants.patient.name: Patient
actions.administer-first-aid.steps.aim.prompt: What to treat
actions.aid.description: "Reaction, after preparing on your turn: a check the GM picks, usually against DC 15. Your ally gets +2 on a critical success (+3 if you're a master, +4 if legendary), +1 on a success, −1 on a critical failure."
actions.aid.name: Aid
actions.aid.params.dc.name: DC
actions.aid.params.skill.name: Skill
actions.avoid-notice.description: 'Exploration, at half speed: a Stealth check against the Perception DCs of creatures that might notice you, which is also your initiative roll.'
actions.avoid-notice.name: Avoid Notice
actions.avoid-notice.params.dc.name: DC
actions.avoid-notice.participants.observer.name: Observers
actions.balance.description: "1 action: Acrobatics against the surface's DC to cross a narrow or uneven surface, off-guard while on it. Critical success: move your Speed; success: as difficult terrain; failure: stay or fall; critical failure: fall. A fall ends your turn."
actions.balance.name: Balance
actions.balance.params.dc.name: DC
actions.climb.description: "1 action, two hands free: Athletics against the GM's DC to move 5 feet along an incline (more with a high Speed), 5 more on a critical success. You're off-guard unless you have a climb Speed. Critical failure: you fall."
actions.climb.name: Climb
actions.climb.params.dc.name: DC
actions.coerce.description: "A minute of conversation: Intimidation against the target's Will DC. Success: it complies for up to a day, then turns unfriendly (and may act against you); failure: it refuses and turns unfriendly; critical failure: hostile and immune for a week."
actions.coerce.name: Coerce
actions.coerce.params.dc.name: DC
actions.coerce.participants.target.name: Target
actions.command-an-animal.description: "1 action: Nature against the animal's Will DC (automatic failure if it's hostile or unfriendly, one degree better if helpful). Success: it does as told on its next turn; failure: nothing; critical failure: something else."
actions.command-an-animal.name: Command an Animal
actions.command-an-animal.params.attitude.name: The animal's attitude
actions.command-an-animal.params.dc.name: DC
actions.command-an-animal.participants.target.name: Target
actions.conceal-an-object.description: "1 action, secret: Stealth against each passive observer's Perception DC to keep a small object hidden on you or somewhere else. Success: it stays undetected."
actions.conceal-an-object.name: Conceal an Object
actions.conceal-an-object.params.dc.name: DC
actions.conceal-an-object.participants.observer.name: Observers
actions.cover-tracks.description: "Trained, exploration, at half travel Speed: no check; anyone Tracking you must beat your Survival DC if it's higher than the usual DC."
actions.cover-tracks.name: Cover Tracks
actions.cover-tracks.results.covered.name: Tracks covered
actions.craft.description: "Trained, downtime: Crafting against the GM's DC to make an item of your level or lower. On a success, each extra day takes the Income Earned amount for your level (and rank) off the materials still needed; a critical success counts a level higher. Critical failure: 10% of the materials are ruined."
actions.craft.name: Craft
actions.craft.params.dc.name: DC
actions.craft.params.itemLevel.name: Item level
actions.create-a-diversion.description: "1 action: one Deception check against the Perception DC of each creature you want to distract. You're hidden to those you succeed against until the end of your turn or until you act. Each gets +4 against your Diversions for a minute."
actions.create-a-diversion.name: Create a Diversion
actions.create-a-diversion.params.dc.name: DC
actions.create-a-diversion.participants.observer.name: Observers
actions.create-forgery.description: 'Trained, downtime: a secret Society check, usually DC 20, to forge a document. On a failure, observers who beat your result with Perception or Society notice it.'
actions.create-forgery.name: Create Forgery
actions.create-forgery.params.dc.name: DC
actions.decipher-writing.description: "Trained: Arcana, Occultism, Religion or Society against the GM's DC to understand an obscure or coded text. Failure: −2 to further tries; critical failure: you misread it."
actions.decipher-writing.name: Decipher Writing
actions.decipher-writing.params.dc.name: DC
actions.decipher-writing.params.skill.name: Skill
actions.demoralize.description: "1 action: Intimidation against the Will DC of a creature within 30 feet (−4 if it doesn't understand you). Success: frightened 1; critical success: frightened 2. It's then immune to your Demoralize for 10 minutes."
actions.demoralize.name: Demoralize
actions.demoralize.params.dc.name: DC
actions.demoralize.participants.target.name: Target
actions.disable-a-device.description: "2 actions, trained: Thievery against the device's DC. Success: one success toward disabling it; critical success: two, leaving no trace. Critical failure: you trigger it."
actions.disable-a-device.name: Disable a Device
actions.disable-a-device.params.dc.name: DC
actions.disarm.description: "1 action, attack, trained: Athletics against the target's Reflex DC. Critical success: the item falls; success: +2 to Disarm it again and −2 to its checks with the item. Critical failure: you're off-guard until your next turn."
actions.disarm.name: Disarm
actions.disarm.params.attack.name: Attack this turn (1st, 2nd, 3rd)
actions.disarm.params.attack.description: 'For the multiple attack penalty: 1 for the first attack this turn.'
actions.disarm.params.dc.name: DC
actions.disarm.participants.target.name: Target
actions.earn-income.description: "Trained, downtime: Crafting, Lore or Performance on a task of a level the GM sets, against its DC. A day's pay comes from the Income Earned table by your rank; a critical success pays as the next level, a failure the failed rate, a critical failure nothing."
actions.earn-income.name: Earn Income
actions.earn-income.params.dc.name: DC
actions.earn-income.params.skill.name: Skill
actions.earn-income.params.taskLevel.name: Task level
actions.earn-income.params.taskLevel.description: 'The level of the job, which sets the pay.'
actions.escape.description: '1 action, attack: your unarmed attack modifier, Acrobatics or Athletics against the DC of what grabs, immobilizes or restrains you. Success: free; critical success: free, and you may Stride 5 feet. Critical failure: no Escape again this turn.'
actions.escape.name: Escape
actions.escape.options.acrobatics.name: Acrobatics
actions.escape.options.athletics.name: Athletics
actions.escape.options.unarmed.name: Unarmed attack
actions.escape.params.attack.name: Attack this turn (1st, 2nd, 3rd)
actions.escape.params.attack.description: 'For the multiple attack penalty: 1 for the first attack this turn.'
actions.escape.params.dc.name: DC
actions.escape.participants.grappler.name: What holds you
actions.escape.steps.using.prompt: Skill to use
actions.feint.description: "1 action, trained, within reach: Deception against the target's Perception DC. Success: it's off-guard to your next melee attack this turn; critical success: to your melee attacks until the end of your next turn. Critical failure: you're off-guard to its melee attacks until then."
actions.feint.name: Feint
actions.feint.params.dc.name: DC
actions.feint.participants.target.name: Target
actions.force-open.description: "1 action, attack: Athletics against the GM's DC to force a door, container or gate (−2 without a crowbar). Critical success: open and undamaged; success: broken open; critical failure: jammed (−2 to later tries)."
actions.force-open.name: Force Open
actions.force-open.params.attack.name: Attack this turn (1st, 2nd, 3rd)
actions.force-open.params.attack.description: 'For the multiple attack penalty: 1 for the first attack this turn.'
actions.force-open.params.dc.name: DC
actions.gather-information.description: "About 2 hours: Diplomacy against the GM's DC to learn about a person or topic in a settlement. Critical failure: you learn something false."
actions.gather-information.name: Gather Information
actions.gather-information.options.diplomacy.name: Diplomacy
actions.gather-information.options.occultism.name: Occultism
actions.gather-information.options.society.name: Society
actions.gather-information.params.dc.name: DC
actions.gather-information.steps.using.prompt: Skill to use
actions.grapple.description: "1 action, attack: Athletics against the target's Fortitude DC. Success: grabbed; critical success: restrained, until the end of your next turn unless you move or it Escapes. A failure frees a creature you held; on a critical failure it may grab you or knock you prone."
actions.grapple.name: Grapple
actions.grapple.params.attack.name: Attack this turn (1st, 2nd, 3rd)
actions.grapple.params.attack.description: 'For the multiple attack penalty: 1 for the first attack this turn.'
actions.grapple.params.dc.name: DC
actions.grapple.params.holding.name: Already holding the target
actions.grapple.participants.target.name: Target
actions.hide.description: "1 action, secret: Stealth against the Perception DC of each creature you have cover from or are concealed from (+2 for cover, +4 greater cover). Success: you're hidden from it."
actions.hide.name: Hide
actions.hide.params.dc.name: DC
actions.hide.participants.observer.name: Observers
actions.high-jump.description: '2 actions: Stride at least 10 feet, then a DC 30 Athletics check. Critical success: leap 8 feet up and 10 across; success: 5 and 5; failure: an ordinary Leap; critical failure: you fall prone.'
actions.high-jump.name: High Jump
actions.high-jump.params.dc.name: DC
actions.identify-alchemy.description: "Trained, 10 minutes with an alchemist's toolkit: Crafting against the GM's DC to identify an alchemical item. Critical failure: you misidentify it."
actions.identify-alchemy.name: Identify Alchemy
actions.identify-alchemy.params.dc.name: DC
actions.identify-magic.description: "Trained, 10 minutes: Arcana, Nature, Occultism or Religion against the GM's DC to learn what a magic item, place or effect does. Failure: no retry for a day; critical failure: you misidentify it."
actions.identify-magic.name: Identify Magic
actions.identify-magic.params.dc.name: DC
actions.identify-magic.params.skill.name: Skill
actions.impersonate.description: '10 minutes with a disguise kit: when you interact with someone in disguise, Deception against its Perception DC. Failure: it sees through you; critical failure: it also recognizes you.'
actions.impersonate.name: Impersonate
actions.impersonate.options.deception.name: Deception
actions.impersonate.options.occultism.name: Occultism
actions.impersonate.options.society.name: Society
actions.impersonate.params.dc.name: DC
actions.impersonate.participants.target.name: Target
