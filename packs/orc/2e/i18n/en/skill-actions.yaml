actions.reposition.params.dc.name: DC
actions.reposition.participants.target.name: Target
actions.request.description: "1 action: Diplomacy against the GM's DC to ask something of a friendly or helpful creature. Critical success: it agrees; success: with conditions; failure: it refuses; critical failure: it refuses and its attitude worsens."
actions.request.name: Request
actions.request.params.dc.name: DC
actions.seek.description: "1 action, secret: Perception against the Stealth DC of each hidden or undetected creature in an area, or an object's DC. Success: undetected becomes hidden and hidden observed; critical success: observed."
actions.seek.name: Seek
actions.seek.params.dc.name: DC
actions.seek.participants.creature.name: Creatures
actions.sense-direction.description: "Exploration: Survival against the GM's DC (−2 without a compass) to stay oriented. Success: you have a sense of the cardinal directions; critical success: you know them exactly."
actions.sense-direction.name: Sense Direction
actions.sense-direction.params.dc.name: DC
actions.sense-motive.description: "1 action, secret: Perception against a creature's Deception DC (or a mental spell's DC) to tell whether it's behaving normally. Critical success: you learn its intentions; critical failure: a false sense of them."
actions.sense-motive.name: Sense Motive
actions.sense-motive.params.dc.name: DC
actions.sense-motive.participants.target.name: Target
actions.shove.description: "1 action, attack: Athletics against the target's Fortitude DC to push it 5 feet (10 on a critical success); you may follow. Critical failure: you fall prone."
actions.shove.name: Shove
actions.shove.params.attack.name: Attack this turn (1st, 2nd, 3rd)
actions.shove.params.attack.description: 'For the multiple attack penalty: 1 for the first attack this turn.'
actions.shove.params.dc.name: DC
actions.shove.participants.target.name: Target
actions.sneak.description: '1 action, secret: Stride half your Speed, then Stealth against the Perception DC of each creature you were hidden from or undetected by. Success: undetected; failure: hidden; critical failure: observed.'
actions.sneak.name: Sneak
actions.sneak.params.dc.name: DC
actions.sneak.participants.observer.name: Observers
actions.squeeze.description: "Trained, exploration: Acrobatics against the GM's DC to squeeze through a tiny space: 1 minute per 10 feet on a critical success, per 5 feet on a success. Critical failure: you're stuck."
actions.squeeze.name: Squeeze
actions.squeeze.params.dc.name: DC
actions.maneuver-in-flight.name: Maneuver in Flight
actions.maneuver-in-flight.description: "Trained, one action (move), with a fly Speed: Acrobatics against the GM's DC to try a difficult maneuver while flying (trained: a steep climb or dive; expert: against the wind; master: reversing direction; legendary: through gale-force winds). On a failure the maneuver fails, as the GM decides; worse on a critical failure."
actions.maneuver-in-flight.params.dc.name: DC
actions.borrow-an-arcane-spell.name: Borrow an Arcane Spell
actions.borrow-an-arcane-spell.description: "Trained, exploration, for an arcane caster who prepares spells: Arcana against the GM's DC to prepare a spell from someone else's spellbook or familiar. Success: you prepare it in your normal preparations. Failure: the slot stays free, and you can't try that spell again until your next preparations."
actions.borrow-an-arcane-spell.params.dc.name: DC
actions.steal.description: "1 action: Thievery against the bearer's Perception DC to take a small object unnoticed (−5 if closely guarded). Failure: the bearer or an observer notices."
actions.steal.name: Steal
actions.steal.params.dc.name: DC
actions.steal.participants.target.name: Target
actions.subsist.description: "Downtime: Survival in the wild or Society in a settlement against the GM's DC (−5 after a day of exploration). Critical success: a comfortable living, or food for one more; success: a subsistence living; failure: fatigued until fed; critical failure: −2 to Subsist for a week."
actions.subsist.name: Subsist
actions.subsist.options.society.name: Society
actions.subsist.options.survival.name: Survival
actions.subsist.params.dc.name: DC
actions.subsist.steps.using.prompt: Skill to use
actions.swim.description: "1 action: Athletics against the GM's DC to move 10 feet through water (more with a high Speed), 5 more on a critical success. Critical failure: no progress, and a round of air lost if holding your breath."
actions.swim.name: Swim
actions.swim.params.dc.name: DC
actions.track.description: "Trained, exploration, at half travel Speed: Survival against the GM's DC to follow a trail for an hour. Failure: lost, retry in an hour; critical failure: lost for 24 hours."
actions.track.name: Track
actions.track.params.dc.name: DC
actions.treat-disease.description: "Trained, 8 hours with a healer's toolkit: Medicine against the disease's DC. The patient's next save against it gets +2 (success), +4 (critical success) or −2 (critical failure)."
actions.treat-disease.name: Treat Disease
actions.treat-disease.params.dc.name: DC
actions.treat-disease.participants.patient.name: Patient
actions.treat-poison.description: "1 action, trained, with a healer's toolkit: Medicine against the poison's DC. The patient's next save against it gets +2 (success), +4 (critical success) or −2 (critical failure)."
actions.treat-poison.name: Treat Poison
actions.treat-poison.params.dc.name: DC
actions.treat-poison.participants.patient.name: Patient
