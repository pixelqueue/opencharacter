# The class.
classes.bard.name: 'Bard'
classes.bard.description: 'A performer whose art carries occult magic. Key attribute: Charisma. 8 Hit Points plus Constitution per level. Expert in Perception and Will, trained in Fortitude and Reflex; trained in simple and martial weapons and unarmed attacks; trained in light armor and unarmored defense; trained in the bard class DC, spell attack modifier and spell DC. Trained in Occultism, Performance and 4 more skills plus Intelligence. You cast occult spells spontaneously with Charisma: two spell slots of each rank (three from the next level), a repertoire of as many spells of each rank and five cantrips. Your muse gives you a feat and a spell; your compositions are counter performance and courageous anthem.'
classes.bard.choices.muse.prompt: 'Muse'
classes.bard.choices.skills.prompt: 'Trained skills (4 plus Intelligence)'
classes.bard.choices.class-feat.prompt: 'Bard feat (level {slot})'
classes.bard.choices.skill-feat.prompt: 'Skill feat (level {slot})'

# Muses.
classes.bard.muses.enigma.name: 'Enigma'
classes.bard.muses.enigma.description: 'A mystery drives you to uncover hidden secrets; you support your allies with knowledge. Muse feat: Bardic Lore. Muse spell: sure strike.'
classes.bard.muses.maestro.name: 'Maestro'
classes.bard.muses.maestro.description: 'You strive for ever greater artistry and inspire your allies with it. Muse feat: Lingering Composition. Muse spell: soothe.'
classes.bard.muses.polymath.name: 'Polymath'
classes.bard.muses.polymath.description: 'Your muse flits from pursuit to pursuit, and so do you. Muse feat: Versatile Performance. Muse spell: phantasmal minion.'
classes.bard.muses.warrior.name: 'Warrior'
classes.bard.muses.warrior.description: 'The battlefield is your stage, and you ready your allies for it. Muse feat: Martial Performance. Muse spell: fear.'

# Features.
features.bard.composition-spells.name: 'Composition Spells'
features.bard.composition-spells.description: 'Your performances carry magic. You learn the counter performance composition spell (a focus spell; your focus pool starts at 1 Focus Point, regained by Refocusing as you perform or compose) and the courageous anthem composition cantrip, which costs no Focus Point. You can cast only one composition spell each turn and have one active at a time; a new one ends the last.'
features.bard.reflex-expertise.name: 'Reflex Expertise'
features.bard.reflex-expertise.description: 'Your proficiency rank for Reflex saves increases to expert.'
features.bard.expert-spellcaster.name: 'Expert Spellcaster'
features.bard.expert-spellcaster.description: 'Your proficiency ranks for spell attack modifier and spell DC increase to expert.'
features.bard.fortitude-expertise.name: 'Fortitude Expertise'
features.bard.fortitude-expertise.description: 'Your proficiency rank for Fortitude saves increases to expert.'
features.bard.performers-heart.name: "Performer's Heart"
features.bard.performers-heart.description: 'Your proficiency rank for Will saves increases to master, and a success on a Will save is a critical success instead.'
features.bard.bard-weapon-expertise.name: 'Bard Weapon Expertise'
features.bard.bard-weapon-expertise.description: 'Your proficiency ranks for simple and martial weapons and unarmed attacks increase to expert. While one of your compositions is active, a critical hit with one of them applies its critical specialization effect.'
features.bard.perception-mastery.name: 'Perception Mastery'
features.bard.perception-mastery.description: 'Your proficiency rank for Perception increases to master.'
features.bard.light-armor-expertise.name: 'Light Armor Expertise'
features.bard.light-armor-expertise.description: 'Your proficiency ranks for light armor and unarmored defense increase to expert.'
features.bard.weapon-specialization.name: 'Weapon Specialization'
features.bard.weapon-specialization.description: 'You deal 2 more damage with weapons and unarmed attacks in which you are an expert, 3 if a master, 4 if legendary.'
features.bard.master-spellcaster.name: 'Master Spellcaster'
features.bard.master-spellcaster.description: 'Your proficiency ranks for spell attack modifier and spell DC increase to master.'
features.bard.greater-performers-heart.name: "Greater Performer's Heart"
features.bard.greater-performers-heart.description: 'Your proficiency rank for Will saves increases to legendary. A critical failure on a Will save is a failure instead, and when you fail a Will save against a damaging effect you take half damage.'
features.bard.legendary-spellcaster.name: 'Legendary Spellcaster'
features.bard.legendary-spellcaster.description: 'Your proficiency ranks for spell attack modifier and spell DC increase to legendary.'
features.bard.magnum-opus.name: 'Magnum Opus'
features.bard.magnum-opus.description: "Two common 10th-rank occult spells join your repertoire, and you gain a single 10th-rank spell slot to cast them. Abilities that give more slots or cast without spending one can't use it. Perfect Encore gives a second slot."
features.bard.magnum-opus.choices.spell.prompt: 'A second 10th-rank occult spell'

# Composition and focus spells.
spells.counter-performance.name: 'Counter Performance'
spells.counter-performance.description: 'Trigger: you or an ally within 60 feet rolls a save against an auditory or visual effect. You roll a Performance check of a fitting type (auditory against an auditory effect, visual against a visual one), and you and your allies in the area can use the better of your check and the save.'
spells.hymn-of-healing.name: 'Hymn of Healing'
spells.hymn-of-healing.description: "Your singing mends you or an ally within 30 feet: fast healing 2 for as long as you Sustain the spell (up to 4 rounds), and 2 temporary Hit Points for 1 round when you cast it and the first time each round you Sustain it.\n\n**Heightened (+1)** The fast healing and the temporary Hit Points each increase by 2."
spells.lingering-composition.name: 'Lingering Composition'
spells.lingering-composition.description: "Free action. If your next action casts a composition cantrip lasting 1 round, attempt a Performance check (usually a standard DC of the highest-level target's level). **Critical Success** The composition lasts 4 rounds. **Success** It lasts 3 rounds. **Failure** It lasts 1 round, and you don't spend the Focus Point."
spells.loremasters-etude.name: "Loremaster's Etude"
spells.loremasters-etude.description: 'Free action. Trigger: you or an ally within 30 feet attempts a skill check to Recall Knowledge. The target rolls the check twice and uses the higher result.'
spells.fortissimo-composition.name: 'Fortissimo Composition'
spells.fortissimo-composition.description: "Free action. If your next action casts courageous anthem, rallying anthem or song of strength, attempt a Performance check, usually against the highest Will DC among its targets. **Critical Success** The composition's status bonus is +3. **Success** It is +2. **Failure** It stays +1, and you don't spend the Focus Point."
spells.ode-to-ouroboros.name: 'Ode to Ouroboros'
spells.ode-to-ouroboros.description: "Reaction. Trigger: a creature within 60 feet would reach the dying value at which it dies. Its dying value stays 1 below that value instead. It doesn't stop deaths that don't raise the dying value, such as death effects."
spells.symphony-of-the-unfettered-heart.name: 'Symphony of the Unfettered Heart'
spells.symphony-of-the-unfettered-heart.description: "You or an ally within 30 feet: attempt a Performance check to counteract an effect making the target grabbed, immobilized, paralyzed, restrained, slowed or stunned (the counteract DC comes from its source, such as the Escape DC for grabbed). If you fail, you can't try against that effect on that target again for 1 day.\n\n**Heightened (9th)** Up to four targets."
spells.soothing-ballad.name: 'Soothing Ballad'
spells.soothing-ballad.description: "You and up to 9 allies within 30 feet. Choose one: the spell attempts to counteract fear effects on the targets, or effects paralyzing them, or it restores 7d8 Hit Points to each.\n\n**Heightened (+1)** The healing increases by 1d8."
spells.fatal-aria.name: 'Fatal Aria'
spells.fatal-aria.description: 'A creature within 30 feet hears music so perfect it may die of joy or sorrow; it is then immune for 1 minute. Of 16th level or lower, it dies. Of 17th level, it dies if it has 50 Hit Points or fewer, and otherwise drops to 0 Hit Points and is dying 1. Of 18th level or higher, it takes 50 damage, and dies if that brings it to 0 Hit Points.'
spells.pied-piping.name: 'Pied Piping'
spells.pied-piping.description: 'Each creature in a 5-foot emanation, when you cast the spell or the first time it enters the area, attempts a Will save, then is immune for 1 day. Once per turn you can Sustain the spell to widen the emanation by 5 feet. **Critical Success** Unaffected. **Success** Fascinated with you. **Failure** Fascinated, and it spends all its actions moving toward you and praising your performance; a hostile action against it ends this. **Critical Failure** It gains the minion trait and you control it, until a hostile action is used against it or you direct it to harm itself.'

# Feats.
feats.bard.bardic-lore.name: 'Bardic Lore'
feats.bard.bardic-lore.description: "Your studies touch every subject. You are trained in Bardic Lore, a Lore you can use only to Recall Knowledge, on any topic. When you're legendary in Occultism you're an expert in it; nothing else raises it."
feats.bard.bardic-lore.prerequisites.enigma: 'Enigma muse'
feats.bard.hymn-of-healing.name: 'Hymn of Healing'
feats.bard.hymn-of-healing.description: 'You learn the hymn of healing composition spell, which mends an ally over a few rounds.'
feats.bard.lingering-composition.name: 'Lingering Composition'
feats.bard.lingering-composition.description: 'You learn the lingering composition focus spell, which makes a composition cantrip last longer.'
feats.bard.lingering-composition.prerequisites.maestro: 'Maestro muse'
feats.bard.martial-performance.name: 'Martial Performance'
feats.bard.martial-performance.description: 'When your courageous anthem is active and you damage an enemy with a Strike, the anthem lasts 1 round longer, once per casting. It works the same for rallying anthem and song of strength if you know them.'
feats.bard.martial-performance.prerequisites.warrior: 'Warrior muse'
feats.bard.versatile-performance.name: 'Versatile Performance'
feats.bard.versatile-performance.description: "You can use Performance instead of Diplomacy to Make an Impression, instead of Intimidation to Demoralize, and an acting Performance instead of Deception to Impersonate. Your Performance rank also meets skill feats' rank prerequisites in Deception, Diplomacy and Intimidation."
feats.bard.versatile-performance.prerequisites.polymath: 'Polymath muse'
feats.bard.well-versed.name: 'Well-Versed'
feats.bard.well-versed.description: 'You gain a +1 circumstance bonus to saves against effects with the auditory, illusion, linguistic, sonic or visual traits.'
feats.bard.directed-audience.name: 'Directed Audience'
feats.bard.directed-audience.description: 'When you cast a composition with an emanation area, you can make it a cone 10 feet longer instead, at most twice the original area (a 5-foot emanation becomes at most a 10-foot cone).'
feats.bard.emotional-push.name: 'Emotional Push'
feats.bard.emotional-push.description: 'Reaction. Trigger: an enemy you are aware of fails its save against an emotion spell. It is off-guard against your next attack before the end of your next turn.'
feats.bard.esoteric-polymath.name: 'Esoteric Polymath'
feats.bard.esoteric-polymath.description: "You keep a book of occult spells, starting with your repertoire's, and can Learn Spells into it with Occultism. During daily preparations, choose a spell from the book: if it's in your repertoire it is also a signature spell today; if not, treat it as in your repertoire until your next preparations."
feats.bard.esoteric-polymath.prerequisites.polymath: 'Polymath muse'
feats.bard.loremasters-etude.name: "Loremaster's Etude"
feats.bard.loremasters-etude.description: "You learn the loremaster's etude composition spell, letting an ally or you roll Recall Knowledge twice."
feats.bard.loremasters-etude.prerequisites.enigma: 'Enigma muse'
feats.bard.multifarious-muse.name: 'Multifarious Muse'
feats.bard.multifarious-muse.description: "Your muse defies a single label. Choose a muse other than your own: you gain the 1st-level feat that muse gives, and your muse counts as that muse for feats' prerequisites (not its other benefits). You can take this feat again for another muse."
feats.bard.multifarious-muse.choices.muse.prompt: 'Another muse'
feats.bard.multifarious-muse.choices.muse.options.enigma.prerequisites.other: 'Not already your muse'
feats.bard.multifarious-muse.choices.muse.options.enigma.name: 'Enigma (Bardic Lore)'
feats.bard.multifarious-muse.choices.muse.options.maestro.prerequisites.other: 'Not already your muse'
feats.bard.multifarious-muse.choices.muse.options.maestro.name: 'Maestro (Lingering Composition)'
feats.bard.multifarious-muse.choices.muse.options.polymath.prerequisites.other: 'Not already your muse'
feats.bard.multifarious-muse.choices.muse.options.polymath.name: 'Polymath (Versatile Performance)'
feats.bard.multifarious-muse.choices.muse.options.warrior.prerequisites.other: 'Not already your muse'
feats.bard.multifarious-muse.choices.muse.options.warrior.name: 'Warrior (Martial Performance)'
feats.bard.song-of-strength.name: 'Song of Strength'
feats.bard.song-of-strength.description: 'You learn the song of strength composition cantrip, which helps your allies at physical tasks.'
feats.bard.song-of-strength.prerequisites.warrior: 'Warrior muse'
feats.bard.uplifting-overture.name: 'Uplifting Overture'
feats.bard.uplifting-overture.description: "You learn the uplifting overture composition cantrip, which aids your allies' skill checks."
feats.bard.uplifting-overture.prerequisites.maestro: 'Maestro muse'
feats.bard.combat-reading.name: 'Combat Reading'
feats.bard.combat-reading.description: "One action. The GM rolls a secret Occultism check against the higher of the Deception or Stealth DC of an enemy in combat you can perceive; it's then immune for a day. **Critical Success** You learn two of: its highest weakness, its lowest save, one immunity, its highest resistance. **Success** One of them. **Critical Failure** False information."
feats.bard.courageous-advance.name: 'Courageous Advance'
feats.bard.courageous-advance.description: 'One action, spellshape. If your next action casts courageous anthem, one ally who gains its bonus can use its reaction to Stride.'
feats.bard.courageous-advance.prerequisites.warrior: 'Warrior muse'
feats.bard.in-tune.name: 'In Tune'
feats.bard.in-tune.description: 'One action, spellshape. If your next action casts a composition with an emanation area, the area spreads from a willing ally within 60 feet instead of you (with Directed Audience, so can the cone).'
feats.bard.in-tune.prerequisites.maestro: 'Maestro muse'
feats.bard.melodious-spell.name: 'Melodious Spell'
feats.bard.melodious-spell.description: 'One action, spellshape. If your next action is to Cast a Spell, it gains the subtle trait, hiding its casting and manifestations but not its effects. As part of this you can Create a Diversion, Demoralize, Perform or Request; if you do, the spell must have the auditory, emotion, sonic or visual trait to become subtle.'
feats.bard.rallying-anthem.name: 'Rallying Anthem'
feats.bard.rallying-anthem.description: 'You learn the rallying anthem composition cantrip, which protects you and your allies.'
feats.bard.ritual-researcher.name: 'Ritual Researcher'
feats.bard.ritual-researcher.description: 'You gain a +2 circumstance bonus to the primary and secondary checks you attempt to cast a ritual.'
feats.bard.ritual-researcher.prerequisites.enigma: 'Enigma muse'
feats.bard.ritual-researcher.prerequisites.occultism: 'Expert in Occultism'
feats.bard.triple-time.name: 'Triple Time'
feats.bard.triple-time.description: 'You learn the triple time composition cantrip, which speeds you and your allies for a round.'
feats.bard.versatile-signature.name: 'Versatile Signature'
feats.bard.versatile-signature.description: 'During your daily preparations you can change one of your signature spells to another spell of that rank from your repertoire.'
feats.bard.versatile-signature.prerequisites.polymath: 'Polymath muse'
feats.bard.assured-knowledge.name: 'Assured Knowledge'
feats.bard.assured-knowledge.description: "When you Recall Knowledge with any skill (Bardic Lore too), you can take 10 + your proficiency bonus instead of rolling, with no other bonuses or penalties. As long as you're an expert in a skill, you meet Automatic Knowledge's prerequisites for it without Assurance."
feats.bard.assured-knowledge.prerequisites.enigma: 'Enigma muse'
feats.bard.defensive-coordination.name: 'Defensive Coordination'
feats.bard.defensive-coordination.description: 'One action, spellshape. If your next action casts rallying anthem, you can Raise a Shield, and one ally who gains its bonus can use its reaction to Raise a Shield.'
feats.bard.defensive-coordination.prerequisites.warrior: 'Warrior muse'
feats.bard.defensive-coordination.prerequisites.rallying-anthem: 'Rallying Anthem'
feats.bard.dirge-of-doom.name: 'Dirge of Doom'
feats.bard.dirge-of-doom.description: 'You learn the dirge of doom composition cantrip, which frightens your enemies and keeps their fear from fading below 1.'
feats.bard.educate-allies.name: 'Educate Allies'
feats.bard.educate-allies.description: "Reaction. Trigger: an ally benefiting from your composition is subject to an auditory, illusion, linguistic, sonic or visual effect. Allies affected by the composition gain Well-Versed's +1 circumstance bonus until the start of your next turn, and yours rises to +2 for that time."
feats.bard.educate-allies.prerequisites.well-versed: 'Well-Versed'
feats.bard.harmonize.name: 'Harmonize'
feats.bard.harmonize.description: "One action, spellshape. If your next action casts a composition, it is harmonized: it doesn't end when you cast another composition, and you can cast another in the same turn. A new harmonized composition ends the last one."
feats.bard.harmonize.prerequisites.maestro: 'Maestro muse'
feats.bard.song-of-marching.name: 'Song of Marching'
feats.bard.song-of-marching.description: 'You learn the song of marching composition cantrip, which lets you and your allies travel far without strain.'
feats.bard.accompany.name: 'Accompany'
feats.bard.accompany.description: "Reaction. Trigger: an ally within 30 feet Casts a Spell. Attempt a Performance check against a very high DC for the ally's level and spend a Focus Point (for a focus spell) or a spell slot at least 1 rank higher. On a success, the ally doesn't spend its Focus Point or slot."
feats.bard.call-and-response.name: 'Call and Response'
feats.bard.call-and-response.description: 'One action, spellshape. If your next action casts a 1-round composition cantrip, it becomes a call: one affected ally can respond with a single action (auditory, concentrate) to extend it by 1 round.'
feats.bard.eclectic-skill.name: 'Eclectic Skill'
feats.bard.eclectic-skill.description: "Your proficiency bonus to untrained skill checks equals your level, and you can attempt checks that need training while untrained. If you're legendary in Occultism, you can attempt checks that need expert proficiency while untrained or trained."
feats.bard.eclectic-skill.prerequisites.polymath: 'Polymath muse'
feats.bard.eclectic-skill.prerequisites.occultism: 'Master in Occultism'
feats.bard.fortissimo-composition.name: 'Fortissimo Composition'
feats.bard.fortissimo-composition.description: 'You learn the fortissimo composition focus spell, which raises the bonus of your anthems and song of strength.'
feats.bard.fortissimo-composition.prerequisites.maestro: 'Maestro muse'
feats.bard.know-it-all.name: 'Know-It-All'
feats.bard.know-it-all.description: 'When you succeed at Recall Knowledge you learn more information or context; on a critical success, more information or a follow-up question (the GM chooses).'
feats.bard.know-it-all.prerequisites.enigma: 'Enigma muse'
feats.bard.reflexive-courage.name: 'Reflexive Courage'
feats.bard.reflexive-courage.description: "Reaction. Requirement: you're affected by courageous anthem. Trigger: a creature in your reach uses an auditory effect, a manipulate action or a move action, makes a ranged attack, or leaves a square while moving. Make a melee Strike against it; a critical hit disrupts a manipulate action."
feats.bard.reflexive-courage.prerequisites.warrior: 'Warrior muse'
feats.bard.reflexive-courage.actions.reflexive-courage.name: 'Reflexive Courage'
feats.bard.reflexive-courage.actions.reflexive-courage.steps.weapon.prompt: 'Choose a melee weapon'
feats.bard.reflexive-courage.actions.reflexive-courage.participants.target.name: 'The triggering creature'
feats.bard.annotate-composition.name: 'Annotate Composition'
feats.bard.annotate-composition.description: "Exploration. Spend 10 minutes and 1 Focus Point to write a one-action composition onto a special scroll that anyone who reads its language can activate (one action, concentrate) as if casting it. A Performance check it needs is rolled secretly when you write it. It goes inert at your next daily preparations, or when you render it inert; you can't regain its Focus Points until then."
feats.bard.courageous-assault.name: 'Courageous Assault'
feats.bard.courageous-assault.description: 'One action, spellshape. If your next action casts courageous anthem, one ally who gains its bonus can use its reaction to make a melee Strike.'
feats.bard.courageous-assault.prerequisites.warrior: 'Warrior muse'
feats.bard.house-of-imaginary-walls.name: 'House of Imaginary Walls'
feats.bard.house-of-imaginary-walls.description: 'You learn the house of imaginary walls composition cantrip, an imaginary barrier others believe is real.'
feats.bard.ode-to-ouroboros.name: 'Ode to Ouroboros'
feats.bard.ode-to-ouroboros.description: 'You learn the ode to ouroboros composition spell, which holds an ally back from death.'
feats.bard.symphony-of-the-unfettered-heart.name: 'Symphony of the Unfettered Heart'
feats.bard.symphony-of-the-unfettered-heart.description: 'You learn the symphony of the unfettered heart composition spell, which frees an ally from incapacitating conditions.'
feats.bard.unusual-composition.name: 'Unusual Composition'
feats.bard.unusual-composition.description: 'One action, spellshape. If your next action casts an auditory or visual composition, creatures can perceive it with any sense (even special senses like tremorsense), and you can leave out any senses you choose.'
feats.bard.unusual-composition.prerequisites.polymath: 'Polymath muse'
feats.bard.eclectic-polymath.name: 'Eclectic Polymath'
feats.bard.eclectic-polymath.description: 'When you prepare again after adding a spell with Esoteric Polymath, you can keep that spell in your repertoire and lose another of the same rank instead.'
feats.bard.eclectic-polymath.prerequisites.esoteric-polymath: 'Esoteric Polymath'
feats.bard.enigmas-knowledge.name: "Enigma's Knowledge"
feats.bard.enigmas-knowledge.description: 'You gain the benefits of Automatic Knowledge with every skill you can use to Recall Knowledge, still only once per round.'
feats.bard.enigmas-knowledge.prerequisites.assured-knowledge: 'Assured Knowledge'
feats.bard.inspirational-focus.name: 'Inspirational Focus'
feats.bard.inspirational-focus.description: 'Whenever you Refocus, you refill your focus pool completely.'
feats.bard.reverberate.name: 'Reverberate'
feats.bard.reverberate.description: "Reaction. Trigger: a creature or hazard would deal sonic damage to you. Attempt Performance against the creature's Will DC (its spell DC for a spell, if lower) or a hazard's Fortitude DC. **Critical Success** Reduce the damage by up to four times your level, and the source takes that much sonic damage. **Success** As critical success, up to twice your level. **Critical Failure** You take double the damage."
feats.bard.shared-assault.name: 'Shared Assault'
feats.bard.shared-assault.description: 'When the ally of your Courageous Assault critically succeeds at its Strike, another ally affected by your courageous anthem can use its reaction to make a melee Strike (once).'
feats.bard.shared-assault.prerequisites.courageous-assault: 'Courageous Assault'
feats.bard.allegro.name: 'Allegro'
feats.bard.allegro.description: 'You learn the allegro composition cantrip, which quickens an ally with a fast performance.'
feats.bard.earworm.name: 'Earworm'
feats.bard.earworm.description: "Exploration. Over 10 minutes you implant a composition cantrip in every ally who perceives your performance. Later, a Performance check against the highest Will DC among them (a free action) casts it on all of them on a success; on a failure the earworm is lost. It can't be modified by lingering or fortissimo composition, and it fades once used, when you implant another or at your next daily preparations."
feats.bard.soothing-ballad.name: 'Soothing Ballad'
feats.bard.soothing-ballad.description: 'You learn the soothing ballad composition spell, which counters fear or paralysis or heals your allies.'
feats.bard.triumphant-inspiration.name: 'Triumphant Inspiration'
feats.bard.triumphant-inspiration.description: 'Free action. Trigger: you critically hit a foe with a melee weapon or melee unarmed Strike. You cast a one-action composition cantrip you know.'
feats.bard.triumphant-inspiration.prerequisites.warrior: 'Warrior muse'
feats.bard.true-hypercognition.name: 'True Hypercognition'
feats.bard.true-hypercognition.description: "One action. You use up to five Recall Knowledge actions at once; abilities triggered by Recall Knowledge don't apply to them."
feats.bard.true-hypercognition.prerequisites.enigma: 'Enigma muse'
feats.bard.vigorous-anthem.name: 'Vigorous Anthem'
feats.bard.vigorous-anthem.description: 'One action, spellshape. If your next action casts courageous anthem, you and each affected ally gain temporary Hit Points equal to 3 + your Charisma modifier for 1 minute.'
feats.bard.vigorous-anthem.actions.vigorous-anthem.name: 'Vigorous Anthem (your temporary Hit Points)'
feats.bard.vigorous-anthem.actions.vigorous-anthem.results.vigorous.name: 'Temporary Hit Points gained'
feats.bard.courageous-onslaught.name: 'Courageous Onslaught'
feats.bard.courageous-onslaught.description: 'One action, spellshape. If your next action casts courageous anthem, one ally who gains its bonus can use its reaction to Stride and then make a melee Strike.'
feats.bard.courageous-onslaught.prerequisites.courageous-advance: 'Courageous Advance'
feats.bard.courageous-onslaught.prerequisites.courageous-assault: 'Courageous Assault'
feats.bard.resounding-finale.name: 'Resounding Finale'
feats.bard.resounding-finale.description: "Reaction. Trigger: you or an ally benefiting from your composition would take sonic damage. The composition ends, and each ally who benefited gains sonic resistance against that damage equal to twice the composition's rank."
feats.bard.resounding-finale.prerequisites.maestro: 'Maestro muse'
feats.bard.studious-capacity.name: 'Studious Capacity'
feats.bard.studious-capacity.description: 'Once a day you can cast a spell after running out of slots of its rank, but not one of your highest rank.'
feats.bard.studious-capacity.prerequisites.enigma: 'Enigma muse'
feats.bard.studious-capacity.prerequisites.occultism: 'Legendary in Occultism'
feats.bard.all-in-my-head.name: 'All in My Head'
feats.bard.all-in-my-head.description: "Reaction. Trigger: you would take damage from a Strike or a spell without the death trait or another instant-death effect. You convince yourself it's imaginary: the damage becomes mental damage and the effect gains the nonlethal trait. You can't if you're immune to mental effects or damage."
feats.bard.deep-lore.name: 'Deep Lore'
feats.bard.deep-lore.description: 'Your repertoire holds one more spell of each rank you can cast.'
feats.bard.deep-lore.prerequisites.enigma: 'Enigma muse'
feats.bard.deep-lore.prerequisites.occultism: 'Legendary in Occultism'
feats.bard.deep-lore.choices.spell.prompt: 'Deep Lore spell (rank {slot})'
feats.bard.discordant-voice.name: 'Discordant Voice'
feats.bard.discordant-voice.description: 'While your allies are affected by your courageous anthem, their weapon and unarmed Strikes deal 1d6 more sonic damage.'
feats.bard.eternal-composition.name: 'Eternal Composition'
feats.bard.eternal-composition.description: "You're permanently quickened; you can use the extra action only to cast a one-action composition cantrip. In exploration you can perform such a cantrip during any exploration activity, and it's active before your first turn of an encounter."
feats.bard.eternal-composition.prerequisites.maestro: 'Maestro muse'
feats.bard.impossible-polymath.name: 'Impossible Polymath'
feats.bard.impossible-polymath.description: 'While trained in Arcana you can add arcane spells to your Esoteric Polymath book, primal spells with Nature, and divine spells with Religion; each day one can join your repertoire as an occult spell, but none can be kept with Eclectic Polymath.'
feats.bard.impossible-polymath.prerequisites.trained: 'Trained in Arcana, Nature or Religion'
feats.bard.impossible-polymath.prerequisites.esoteric-polymath: 'Esoteric Polymath'
feats.bard.fatal-aria.name: 'Fatal Aria'
feats.bard.fatal-aria.description: 'You learn the fatal aria composition spell, a performance that can strike a creature dead.'
feats.bard.perfect-encore.name: 'Perfect Encore'
feats.bard.perfect-encore.description: 'You gain one more 10th-rank spell slot.'
feats.bard.perfect-encore.prerequisites.magnum-opus: 'Magnum opus'
feats.bard.pied-piping.name: 'Pied Piping'
feats.bard.pied-piping.description: 'You learn the pied piping composition spell, which compels weak-minded creatures to follow you.'
feats.bard.symphony-of-the-muse.name: 'Symphony of the Muse'
feats.bard.symphony-of-the-muse.description: "You're no longer limited to one composition a turn or one at a time: each new composition leaves the others running for their durations."
feats.bard.symphony-of-the-muse.prerequisites.harmonize: 'Harmonize'
feats.bard.ultimate-polymath.name: 'Ultimate Polymath'
feats.bard.ultimate-polymath.description: 'Every spell in your repertoire is a signature spell.'
feats.bard.ultimate-polymath.prerequisites.polymath: 'Polymath muse'
spells.fortissimo-composition.actions.perform.name: Fortissimo (Performance)
spells.fortissimo-composition.actions.perform.description: The Performance check that raises your next anthem's status bonus.
spells.fortissimo-composition.actions.perform.params.dc.name: Highest Will DC among the targets
