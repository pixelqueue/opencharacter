backgrounds.cursed.name: 'Cursed'
backgrounds.cursed.description: "A boost to Intelligence or Charisma and a free boost. Trained in Occultism and Curse Lore. Warding Sign: once a minute, a reaction (concentrate) when you attempt a save against a magical effect, before rolling: a +2 circumstance bonus to that save (+3 against a curse). The curse's lingering manifestations are yours and the GM's."
