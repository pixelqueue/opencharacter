backgrounds.feybound.name: 'Feybound'
backgrounds.feybound.description: "A boost to Dexterity or Charisma and a free boost. Trained in Fey Lore. Fey's Fortune: once a day, a free action (concentrate, fortune) when you attempt a skill check, before rolling: roll twice and take the better. You have an anathema from your pact with the fey; breaking it costs you Fey's Fortune until you atone."
backgrounds.feybound.choices.boost.prompt: 'Background attribute boost'
backgrounds.feybound.choices.free-boost.prompt: 'A free attribute boost (a different attribute)'
backgrounds.haunted.name: 'Haunted'
backgrounds.haunted.description: "A boost to Wisdom or Charisma and a free boost. Trained in Occultism and a skill the GM picks for the entity haunting you. On a check with that skill the GM can offer it as Aid (+1 circumstance); if you accept and fail, you're frightened 2 (4 on a critical failure), a value nothing can lower at first."
