held.everlight-crystal.name: 'Everlight Crystal'
held.everlight-crystal.description: 'Sheds bright light in a 20-foot radius (dim to 40 feet) that never goes out, though it can be covered.'
held.explorers-yurt.name: "Explorer's Yurt"
held.explorers-yurt.description: 'Unfolds into a sturdy yurt that shelters up to 10 creatures in comfort and warmth, and packs away again.'
held.flying-broomstick.name: 'Flying Broomstick'
held.flying-broomstick.description: "Ride it with one hand at a fly Speed of 20 feet, with one passenger (–10 feet past 20 Bulk; it falls past 30). Lift Off (2 actions): name a destination; it flies there at 40 feet (with you holding on with both hands, for up to 4 hours), then can't be activated for 1 hour."
held.horn-of-exorcism.name: 'Horn of Exorcism'
held.horn-of-exorcism.description: 'Rattle the Dead (1 action, once per hour): Demoralize every undead or unholy creature within 30 feet, even mindless ones, with no language penalty. Sacred Seeds (2 actions, once per day): you and allies within 30 feet get the ghost touch rune on all Strikes for 1 minute.'
held.madcap-top.name: 'Madcap Top'
held.madcap-top.description: "Spin the Top (2 actions): pick a creature within 60 feet and roll a d20 on the top's table of random effects (spells at DC 27 and attack +17, and stranger outcomes); then it can't be activated for 1d4 hours."
held.maestros-instrument-lesser.name: "Maestro's Instrument (Lesser)"
held.maestros-instrument-lesser.description: 'A +1 item bonus to Performance checks while playing it. Charming Performance (2 actions, once per day): it casts charm (DC 17).'
held.maestros-instrument-lesser.options.charm.name: 'Charming Performance'
held.maestros-instrument-moderate.name: "Maestro's Instrument (Moderate)"
held.maestros-instrument-moderate.description: 'A +2 item bonus to Performance checks while playing it. Charming Performance (2 actions, once per day): it casts 4th-rank charm (DC 27).'
held.maestros-instrument-moderate.options.charm.name: 'Charming Performance'
held.maestros-instrument-greater.name: "Maestro's Instrument (Greater)"
held.maestros-instrument-greater.description: 'A +3 item bonus to Performance checks while playing it. Charming Performance (2 actions, once per day): it casts 8th-rank charm (DC 38).'
held.maestros-instrument-greater.options.charm.name: 'Charming Performance'
held.martyrs-shield.name: "Martyr's Shield"
held.martyrs-shield.description: 'An intelligent shield devoted to protecting others; it can act on its own to Shield Block for an ally and casts spells of its own.'
held.marvelous-medicines.name: 'Marvelous Medicines'
held.marvelous-medicines.description: "A healer's toolkit: a +2 item bonus to Medicine checks. When you Treat a Poison or Treat a Disease, it first tries to counteract the affliction (rank 5, +21), once per patient and affliction."
held.marvelous-medicines-greater.name: 'Marvelous Medicines (Greater)'
held.marvelous-medicines-greater.description: "A healer's toolkit: a +3 item bonus to Medicine checks. When you Treat a Poison or Treat a Disease, it first tries to counteract the affliction (rank 8, +30), once per patient and affliction."
held.ancient-mirror.name: 'Ancient Mirror'
held.ancient-mirror.description: 'An artifact: an ancient mirror bonded to its owner.'
held.monkeys-paw.name: "Monkey's Paw"
held.monkeys-paw.description: 'Cursed: its fingers grant wishes, each fulfilled in the worst possible way.'
held.philosophers-extractor.name: "Philosopher's Extractor"
held.philosophers-extractor.description: 'An artifact: an alchemical apparatus of great power.'
held.pocket-stage.name: 'Pocket Stage'
held.pocket-stage.description: 'Unfolds into a small stage with curtains and props for performances, and packs away again.'
held.possibility-tome.name: 'Possibility Tome'
held.possibility-tome.description: 'Skim (10 minutes): choose Arcana, Crafting, Medicine, Nature, Occultism, Religion, Society or a Lore; for 24 hours, an Interact before Recalling Knowledge with it gives a +3 item bonus, and a critical failure is a failure.'
held.predictable-silver-piece.name: 'Predictable Silver Piece'
held.predictable-silver-piece.description: 'Cheat Fate (1 action): rub a side, flip the coin, and it lands on that side.'
held.intelligent-holy-blade.name: 'Intelligent Holy Blade'
held.intelligent-holy-blade.description: 'An artifact: an intelligent holy blade.'
held.legendary-ammunition.name: 'Legendary Ammunition'
held.legendary-ammunition.description: 'An artifact: a legendary piece of ammunition.'
held.singing-sword.name: 'Singing Sword'
held.singing-sword.description: 'An intelligent longsword that sings during combat, inspiring its wielder (and annoying everyone else).'
held.skeleton-key.name: 'Skeleton Key'
held.skeleton-key.description: "Works as a thieves' toolkit to Pick a Lock, with a +1 item bonus. Loosen Lock (free action, once per day): it casts knock on the lock you're picking."
held.skeleton-key.options.knock.name: 'Loosen Lock'
held.skeleton-key-greater.name: 'Skeleton Key (Greater)'
held.skeleton-key-greater.description: "Works as a thieves' toolkit to Pick a Lock, with a +2 item bonus. Loosen Lock (free action, once per hour): it casts knock on the lock you're picking."
held.skeleton-key-greater.options.knock.name: 'Loosen Lock'
held.slates-of-distant-letters.name: 'Slates of Distant Letters'
held.slates-of-distant-letters.description: 'A matched pair. Send a Message (2 actions, once per hour): up to 25 words chalked on one appear on the other, anywhere on the same plane.'
held.spacious-pouch-type-i.name: 'Spacious Pouch (Type I)'
held.spacious-pouch-type-i.description: "An extradimensional bag holding 25 Bulk that doesn't count toward yours; the bag itself is 1 Bulk. Stow and retrieve as from a sack. Overloaded or broken, it ruptures and its contents are lost."
