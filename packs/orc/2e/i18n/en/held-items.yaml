held.thurible-of-revelation-lesser.name: 'Thurible of Revelation (Lesser)'
held.thurible-of-revelation-lesser.description: 'Burn Incense (2 actions, 5 gp of incense): for 1 hour while you hold it, a +1 item bonus to Religion checks, and a critical failure to Decipher religious writing is a failure.'
held.thurible-of-revelation-lesser.actions.burn-incense.name: 'Burn Incense'
held.thurible-of-revelation-moderate.name: 'Thurible of Revelation (Moderate)'
held.thurible-of-revelation-moderate.description: 'Burn Incense (2 actions, 5 gp of incense): for 1 hour while you hold it, a +2 item bonus to Religion checks, and a critical failure to Decipher religious writing is a failure. Once per day, peering through the smoke gives see the unseen for 1 round.'
held.thurible-of-revelation-moderate.actions.burn-incense.name: 'Burn Incense'
held.thurible-of-revelation-greater.name: 'Thurible of Revelation (Greater)'
held.thurible-of-revelation-greater.description: 'Burn Incense (2 actions, 5 gp of incense): for 1 hour while you hold it, a +3 item bonus to Religion checks, and a critical failure to Decipher religious writing is a failure. Once per day, peering through the smoke gives see the unseen and truesight for 1 round.'
held.thurible-of-revelation-greater.actions.burn-incense.name: 'Burn Incense'
held.travelers-any-tool.name: "Traveler's Any-Tool"
held.travelers-any-tool.description: 'Tap (2 actions): it becomes any simple tool you imagine; an Interact returns it to a rod.'
held.twisting-twine-lesser.name: 'Twisting Twine (Lesser)'
held.twisting-twine-lesser.description: 'Unravel Twine (1 action, once per day): toss it into a square within 20 feet to Disarm or Trip a creature there with Athletics +9; it returns at the end of your turn.'
held.twisting-twine-moderate.name: 'Twisting Twine (Moderate)'
held.twisting-twine-moderate.description: 'Unravel Twine (1 action, once per hour): toss it into a square within 20 feet to Disarm or Trip a creature there with Athletics +12; it returns at the end of your turn.'
held.twisting-twine-greater.name: 'Twisting Twine (Greater)'
held.twisting-twine-greater.description: 'Unravel Twine (1 action): toss it into a square within 20 feet to Disarm or Trip a creature there with Athletics +15; it returns at the end of your turn.'
held.urn-of-ashes.name: 'Urn of Ashes'
held.urn-of-ashes.description: "Doom the Urn (reaction): the urn takes a doomed condition you would gain or increase. Spirit's Wrath (1 action, once per round): a void bolt at a foe within 30 feet, a spell attack with +15 or yours, dealing 4d4 void damage (double on a critical hit)."
held.walking-cauldron.name: 'Walking Cauldron'
held.walking-cauldron.description: 'An invested cauldron on legs that follows you and carries its contents.'
worn.cloak-of-immolation.name: 'Cloak of Immolation'
worn.cloak-of-immolation.description: "Cursed: it bursts into flame when you face danger, dealing fire damage to you and those near you; it can't be removed until the curse is lifted."
worn.genius-diadem.name: 'Genius Diadem'
worn.genius-diadem.description: 'An intelligent crown of intellect: apex (Intelligence) and a +3 item bonus to Recall Knowledge, with a mind of its own that prefers to make you learn.'
worn.forgefathers-seal.name: "Forgefather's Seal"
worn.forgefathers-seal.description: 'An artifact rune etched onto armor.'
