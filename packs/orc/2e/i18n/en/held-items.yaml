held.bag-of-weasels.name: 'Bag of Weasels'
held.bag-of-weasels.description: 'Cursed: a spacious pouch that, a quarter of the time, turns a retrieved item into a weasel; the item reappears in the bag 1 minute later.'
held.bottled-air.name: 'Bottled Air'
held.bottled-air.description: 'Uncork it (Interact), then Breath In (1 action): breathe from its endless supply, even where there is no air or the air is toxic.'
held.cloth-of-nullification.name: 'Cloth of Nullification'
held.cloth-of-nullification.description: "Nullify Magic (2 actions): counteract a magic item or effect (rank 10, +32); a success deactivates it for 2d6 hours or drains its magic and the cloth's forever. The cloth then can't be activated for 2d6 hours."
held.cloud-pouch.name: 'Cloud Pouch'
held.cloud-pouch.description: 'Disperse (2 actions, once per hour): a 20-foot burst of cloud within 10 feet, as mist, for 1 minute; Sustain it to fly the cloud 20 feet.'
held.cloud-pouch.options.mist.name: 'Disperse'
