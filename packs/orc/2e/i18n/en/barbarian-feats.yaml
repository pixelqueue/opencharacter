# Barbarian feats to 20th level. Short rules text written for the pack.

feats.barbarian.animalistic-brutality.name: 'Animalistic Brutality'
feats.barbarian.animalistic-brutality.description: 'One action (rage). Your bestial rage unarmed attack gains backswing, forceful, parry, razing or sweep until your rage ends; once per rage.'
feats.barbarian.animalistic-brutality.prerequisites.instinct: 'Animal instinct'
feats.barbarian.disarming-assault.name: 'Disarming Assault'
feats.barbarian.disarming-assault.description: 'One action, flourish (rage). Make a melee Strike; on a hit you can try to Disarm that enemy with Athletics.'
feats.barbarian.disarming-assault.prerequisites.athletics: 'Trained in Athletics'
feats.barbarian.follow-up-assault.name: 'Follow-up Assault'
feats.barbarian.follow-up-assault.description: 'One action (rage). Requirement: your previous action was a melee Strike that missed. Strike again with that weapon, adding backswing and forceful.'
feats.barbarian.friendly-toss.name: 'Friendly Toss'
feats.barbarian.friendly-toss.description: 'Two actions (rage). Requirement: an adjacent ally and a free hand. Throw an adjacent ally your size or smaller to a space within 30 feet you can see; its movement triggers no reactions, it lands standing and unhurt, and can use its reaction to Strike an enemy in its reach there.'
feats.barbarian.furious-bully.name: 'Furious Bully'
feats.barbarian.furious-bully.description: 'While raging you gain a +2 circumstance bonus to Athletics checks for attack actions.'
feats.barbarian.furious-bully.prerequisites.athletics: 'Master in Athletics'
feats.barbarian.instinctive-strike.name: 'Instinctive Strike'
feats.barbarian.instinctive-strike.description: 'Your melee Strikes against a creature you detect by scent ignore the flat check for its being concealed or hidden.'
feats.barbarian.instinctive-strike.prerequisites.scent: 'Acute Scent or Scent'
feats.barbarian.invulnerable-rager.name: 'Invulnerable Rager'
feats.barbarian.invulnerable-rager.description: "You're trained in heavy armor, and class features that raise your medium armor proficiency raise heavy armor's too. You can Quick-Temper in heavy armor."
feats.barbarian.renewed-vigor.name: 'Renewed Vigor'
feats.barbarian.renewed-vigor.description: 'One action (rage). Gain temporary Hit Points equal to half your level + your Constitution modifier (your level + Constitution if you made an attack this turn), until your rage ends.'
feats.barbarian.renewed-vigor.actions.renewed-vigor.name: 'Renewed Vigor'
feats.barbarian.renewed-vigor.actions.renewed-vigor.results.renewed.name: 'Renewed'
feats.barbarian.share-rage.name: 'Share Rage'
feats.barbarian.share-rage.description: "One action (rage; auditory, visual), once per rage. A willing creature within 30 feet gains Rage's effects (but can use concentrate actions), without your instinct or feats."
feats.barbarian.thrash.name: 'Thrash'
feats.barbarian.thrash.description: 'One action (rage). Requirement: you have an enemy grabbed or restrained. It takes bludgeoning damage equal to your Strength modifier + weapon specialization damage + Rage damage, basic Fortitude save against your class DC.'
feats.barbarian.come-and-get-me.name: 'Come and Get Me'
feats.barbarian.come-and-get-me.description: "One action (rage). Until your rage ends you're off-guard and damage rolls against you get +2 circumstance; a creature that hits you is off-guard to you until the end of your next turn, and hitting it before then gives you temporary Hit Points equal to your Constitution modifier (double on a critical hit) until your rage ends."
feats.barbarian.furious-sprint.name: 'Furious Sprint'
feats.barbarian.furious-sprint.description: 'Two or three actions (rage). Stride up to five times (eight with three actions) in a straight line, replacing any Stride with a Balance using Athletics.'
feats.barbarian.great-cleave.name: 'Great Cleave'
feats.barbarian.great-cleave.description: "When a Cleave Strike reduces its target to 0 HP, keep making melee Strikes until one doesn't, or there's no creature adjacent to the last one."
feats.barbarian.great-cleave.prerequisites.cleave: 'Cleave'
feats.barbarian.impressive-landing.name: 'Impressive Landing'
feats.barbarian.impressive-landing.description: 'Reaction. Trigger: you fall at least 10 feet onto solid ground. The fall counts as 10 feet shorter and you land standing; the ground in a 5-foot emanation becomes difficult terrain, and creatures there take 5 bludgeoning damage and are off-guard until the start of their next turn.'
feats.barbarian.knockback.name: 'Knockback'
feats.barbarian.knockback.description: 'One action (rage). Requirement: your last action was a successful Strike. Push that enemy 5 feet as a successful Shove (you can follow).'
feats.barbarian.resounding-blow.name: 'Resounding Blow'
feats.barbarian.resounding-blow.description: 'Two actions. Requirement: a bludgeoning melee weapon. Make a melee Strike; if it hits and deals damage the target is deafened until the start of your next turn (1 minute on a critical hit).'
feats.barbarian.resounding-blow.actions.resounding-blow.name: 'Resounding Blow'
feats.barbarian.resounding-blow.actions.resounding-blow.steps.weapon.prompt: 'Choose a weapon'
feats.barbarian.silencing-strike.name: 'Silencing Strike'
feats.barbarian.silencing-strike.description: 'One action (rage, incapacitation). Make a melee Strike; on a hit the target attempts a Fortitude save against your class DC. **Success** Unaffected. **Failure** Stunned 1, and it needs a DC 11 flat check for linguistic actions or non-subtle spells. **Critical Failure** As failure, but stunned 3.'
feats.barbarian.silencing-strike.actions.silencing-strike.name: 'Silencing Strike'
feats.barbarian.silencing-strike.actions.silencing-strike.steps.weapon.prompt: 'Choose a weapon'
feats.barbarian.tangle-of-battle.name: 'Tangle of Battle'
feats.barbarian.tangle-of-battle.description: 'Reaction (rage). Trigger: you critically hit an adjacent enemy. Try to Grapple it.'
feats.barbarian.terrifying-howl.name: 'Terrifying Howl'
feats.barbarian.terrifying-howl.description: 'One action (rage, auditory). Demoralize each enemy within 30 feet, without the penalty for not sharing a language; each is then immune for 1 minute.'
feats.barbarian.dragons-rage-wings.name: "Dragon's Rage Wings"
feats.barbarian.dragons-rage-wings.description: 'One action (rage, morph). While raging you have a fly Speed equal to your land Speed; if your rage ends in flight you descend safely and land standing.'
feats.barbarian.dragons-rage-wings.prerequisites.instinct: 'Dragon instinct'
feats.barbarian.embrace-the-pain.name: 'Embrace the Pain'
feats.barbarian.embrace-the-pain.description: 'Reaction (rage). Trigger: a creature in your reach damages you with a melee attack. Try to Grapple it, or Disarm it of the weapon.'
feats.barbarian.furious-grab.name: 'Furious Grab'
feats.barbarian.furious-grab.description: 'One action (rage). Requirement: your last action was a successful Strike, with a hand free or a grapple weapon. The enemy you hit is grabbed, as by a successful Grapple.'
feats.barbarian.predators-pounce.name: "Predator's Pounce"
feats.barbarian.predators-pounce.description: 'One action, flourish (rage). Requirement: unarmored or light armor. Stride up to your Speed, then Strike.'
feats.barbarian.predators-pounce.prerequisites.instinct: 'Animal instinct'
feats.barbarian.predators-pounce.actions.predators-pounce.name: "Predator's Pounce"
feats.barbarian.predators-pounce.actions.predators-pounce.steps.weapon.prompt: 'Choose a weapon'
feats.barbarian.spirits-wrath.name: "Spirit's Wrath"
feats.barbarian.spirits-wrath.description: 'One action (rage, attack, concentrate). A spirit wisp makes a melee unarmed attack against an enemy within 120 feet with your martial proficiency + Strength + a +2 item bonus (and your circumstance and status modifiers): 4d8 + Constitution spirit damage, double and frightened 1 on a critical hit. It uses and counts toward your multiple attack penalty.'
feats.barbarian.spirits-wrath.prerequisites.instinct: 'Spirit instinct'
feats.barbarian.sunder-spell.name: 'Sunder Spell'
feats.barbarian.sunder-spell.description: "Two actions (rage, attack, concentrate). Make a melee Strike against a creature, object or spell manifestation (AC 10 for an easy target); on a hit try to counteract one spell or magical effect on it (rank half your level rounded up, your attack roll as the check). Either way it's immune for 24 hours."
feats.barbarian.sunder-spell.prerequisites.instinct: 'Superstition instinct'
feats.barbarian.titans-stature.name: "Titan's Stature"
feats.barbarian.titans-stature.description: "Giant's Stature can make you Huge (10 feet more reach if you were Medium or smaller)."
feats.barbarian.titans-stature.prerequisites.giants-stature: "Giant's Stature"
feats.barbarian.unbalancing-sweep.name: 'Unbalancing Sweep'
feats.barbarian.unbalancing-sweep.description: 'Three actions, flourish. Choose up to three enemies in reach and Shove or Trip all of them, a separate Athletics check each; the penalty rises only after all of them.'
feats.barbarian.awesome-blow.name: 'Awesome Blow'
feats.barbarian.awesome-blow.description: "When you use Knockback, attempt Athletics against the target's Fortitude DC. **Critical Success** A Shove's critical success, then a Trip's. **Success** A Shove's success, then a Trip's. **Failure** Knockback's normal effect."
feats.barbarian.awesome-blow.prerequisites.knockback: 'Knockback'
feats.barbarian.giants-lunge.name: "Giant's Lunge"
feats.barbarian.giants-lunge.description: 'One action (rage, concentrate). Until your rage ends your melee weapons and unarmed attacks have 10-foot reach (not added to reach weapons, but combining with larger size).'
feats.barbarian.giants-lunge.prerequisites.instinct: 'Giant instinct'
feats.barbarian.impaling-thrust.name: 'Impaling Thrust'
feats.barbarian.impaling-thrust.description: "Two actions (rage). Requirement: a piercing melee weapon. Make a melee Strike; if it hits and deals damage the target is grabbed until it Escapes, you attack with the weapon again or you Release it; then it takes persistent bleed damage equal to the weapon's damage dice."
feats.barbarian.sunder-enchantment.name: 'Sunder Enchantment'
feats.barbarian.sunder-enchantment.description: "Sunder Spell can instead counteract an unattended magic item or one of the target's: on a success it's mundane for 10 minutes (artifacts and intelligent items always resist)."
feats.barbarian.sunder-enchantment.prerequisites.sunder-spell: 'Sunder Spell'
feats.barbarian.vengeful-strike.name: 'Vengeful Strike'
feats.barbarian.vengeful-strike.description: 'Reaction (rage). Requirement: Come and Get Me affects you. Trigger: a creature in your reach hits you. Make a melee Strike against it (a free action if its attack was a critical hit).'
feats.barbarian.vengeful-strike.prerequisites.come-and-get-me: 'Come and Get Me'
feats.barbarian.vengeful-strike.actions.vengeful-strike.name: 'Vengeful Strike'
feats.barbarian.vengeful-strike.actions.vengeful-strike.steps.weapon.prompt: 'Choose a weapon'
feats.barbarian.collateral-thrash.name: 'Collateral Thrash'
feats.barbarian.collateral-thrash.description: 'When you Thrash, another enemy adjacent to the grabbed one takes the same damage, basic Reflex save against your class DC.'
feats.barbarian.collateral-thrash.prerequisites.thrash: 'Thrash'
feats.barbarian.desperate-wrath.name: 'Desperate Wrath'
feats.barbarian.desperate-wrath.description: 'Free action (rage). Trigger: your turn begins at half your Hit Points or fewer. +2 circumstance bonus to attack rolls, -1 to AC and saves, until your rage ends or you rise above half.'
feats.barbarian.dragon-transformation.name: 'Dragon Transformation'
feats.barbarian.dragon-transformation.description: "One action (rage, polymorph), once per 10 minutes. You become a Large dragon as a 6th-rank dragon form, using your AC and attack modifier, adding your Rage damage, Dragon Breath at your class DC; its temporary Hit Points add to your rage's. At 18th level, +20 feet to your fly Speed, +12 damage on dragon Strikes and +14 status to Dragon Breath."
feats.barbarian.dragon-transformation.prerequisites.dragons-rage-wings: "Dragon's Rage Wings"
feats.barbarian.furious-vengeance.name: 'Furious Vengeance'
feats.barbarian.furious-vengeance.description: 'Reaction (rage). Trigger: an enemy in your melee reach critically hits you with a melee Strike. Make a melee Strike against it.'
feats.barbarian.furious-vengeance.prerequisites.instinct: 'Fury instinct'
feats.barbarian.furious-vengeance.actions.furious-vengeance.name: 'Furious Vengeance'
feats.barbarian.furious-vengeance.actions.furious-vengeance.steps.weapon.prompt: 'Choose a weapon'
feats.barbarian.penetrating-projectile.name: 'Penetrating Projectile'
feats.barbarian.penetrating-projectile.description: 'Two actions, flourish (rage). Requirement: a piercing ranged or thrown weapon. Make a ranged Strike against each creature in a 30-foot line, ignoring cover from creatures, damage rolled once; the penalty rises only after all of them.'
feats.barbarian.shattering-blows.name: 'Shattering Blows'
feats.barbarian.shattering-blows.description: 'While raging, your melee Strikes ignore the first 5 Hardness of objects (10 with devastator).'
feats.barbarian.brutal-critical.name: 'Brutal Critical'
feats.barbarian.brutal-critical.description: 'A critical hit with a melee Strike adds one more damage die (beyond deadly or fatal), and the target takes persistent bleed damage equal to two damage dice.'
feats.barbarian.perfect-clarity.name: 'Perfect Clarity'
feats.barbarian.perfect-clarity.description: 'Reaction (rage, fortune). Trigger: you fail or critically fail an attack roll or Will save. Reroll it with a +2 circumstance bonus and use the better result; then your rage ends.'
feats.barbarian.vicious-evisceration.name: 'Vicious Evisceration'
feats.barbarian.vicious-evisceration.description: 'Two actions (rage). Make a melee Strike; if it hits and deals damage the target is drained 1 (drained 2 on a critical hit).'
feats.barbarian.vicious-evisceration.actions.vicious-evisceration.name: 'Vicious Evisceration'
feats.barbarian.vicious-evisceration.actions.vicious-evisceration.steps.weapon.prompt: 'Choose a weapon'
feats.barbarian.whirlwind-toss.name: 'Whirlwind Toss'
feats.barbarian.whirlwind-toss.description: 'Two actions (rage). Thrash, with Collateral Thrash on every other enemy adjacent to you (each saving once), then throw the grabbed creature 10 feet, where it falls prone.'
feats.barbarian.whirlwind-toss.prerequisites.collateral-thrash: 'Collateral Thrash'
feats.barbarian.annihilating-swing.name: 'Annihilating Swing'
feats.barbarian.annihilating-swing.description: "Two actions. Make a melee Strike ignoring the target's resistances. Against a solid unattended object or surface of Hardness 20 or less that isn't magic you destroy it (up to a 5-foot cube); against magic, counteract it at 10th rank with your Strike's attack bonus, destroying it on a success unless its Hardness exceeds 20 or it's an artifact."
feats.barbarian.contagious-rage.name: 'Contagious Rage'
feats.barbarian.contagious-rage.description: 'You can Share Rage any number of times in a rage, and allies affected can take your instinct ability and its weapon specialization ability (not greater), with its restrictions.'
feats.barbarian.contagious-rage.prerequisites.share-rage: 'Share Rage'
feats.barbarian.quaking-stomp.name: 'Quaking Stomp'
feats.barbarian.quaking-stomp.description: 'One action (rage, manipulate), once per 10 minutes. You stomp out the effects of earthquake.'
feats.barbarian.unstoppable-juggernaut.name: 'Unstoppable Juggernaut'
feats.barbarian.unstoppable-juggernaut.description: 'You gain resistance 3 + Constitution to all damage, your raging resistance becomes 8 + Constitution, and when reduced to 0 Hit Points while raging you can end your rage as a reaction to stay at 1 Hit Point, wounded 2 (or wounded value +2).'
