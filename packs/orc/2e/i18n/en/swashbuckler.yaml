# The swashbuckler (Player Core 2): the class, its features and feats, panache and its parry.
# Short rules text written for the pack.
classes.swashbuckler.name: Swashbuckler
classes.swashbuckler.description: "A daring combatant who fights with flair. Key attribute: Dexterity. 10 Hit Points plus Constitution per level. Expert in Perception, Reflex and Will, trained in Fortitude; trained in simple and martial weapons and unarmed attacks; trained in light armor and unarmored defense; trained in the swashbuckler class DC. Trained in Acrobatics, your style's skill, and 4 skills plus Intelligence."
classes.swashbuckler.choices.style.prompt: Swashbuckler's style
classes.swashbuckler.choices.style.options.battledancer.name: 'Battledancer (Performance; Perform is bravado)'
classes.swashbuckler.choices.style.options.braggart.name: 'Braggart (Intimidation; Demoralize is bravado)'
classes.swashbuckler.choices.style.options.fencer.name: 'Fencer (Deception; Create a Diversion and Feint are bravado)'
classes.swashbuckler.choices.style.options.gymnast.name: 'Gymnast (Athletics; Grapple, Reposition, Shove and Trip are bravado)'
classes.swashbuckler.choices.style.options.rascal.name: 'Rascal (Thievery; Dirty Trick is bravado)'
classes.swashbuckler.choices.style.options.wit.name: 'Wit (Diplomacy; Bon Mot is bravado)'
classes.swashbuckler.choices.skills.prompt: Trained skills (4 plus Intelligence)
classes.swashbuckler.choices.class-feat.prompt: Swashbuckler feat (level {slot})
classes.swashbuckler.choices.skill-feat.prompt: Skill feat (level {slot})
classes.swashbuckler.choices.stylish-trick-feat.prompt: 'Stylish Tricks: an Acrobatics or style skill feat (level {slot})'

features.swashbuckler.panache.name: Panache
features.swashbuckler.panache.description: "You gain panache with bravado actions: Tumble Through and your style's actions. A success on the check gives panache; a failure (not a critical failure) gives panache until the end of your next turn. You lose panache when the encounter ends or when you use a finisher."
features.swashbuckler.panache.actions.bravado.name: Bravado check
features.swashbuckler.panache.actions.bravado.params.check.name: Skill
features.swashbuckler.panache.actions.bravado.params.dc.name: DC
features.swashbuckler.panache.actions.gain-panache.name: Gain panache
features.swashbuckler.panache.actions.gain-panache.params.brief.name: Until the end of your next turn
features.swashbuckler.precise-strike.name: Precise Strike
features.swashbuckler.precise-strike.description: 'A Strike with an agile or finesse melee weapon or unarmed attack deals 2 extra precision damage, or 2d6 as part of a finisher. Both rise at 5th, 9th, 13th and 17th level, by 1 and by 1d6.'
features.swashbuckler.stylish-combatant.name: Stylish Combatant
features.swashbuckler.stylish-combatant.description: 'A +1 circumstance bonus to skill checks with the bravado trait in combat, and a +5-foot status bonus to your Speeds while you have panache.'
features.swashbuckler.confident-finisher.name: Confident Finisher
features.swashbuckler.confident-finisher.description: "One action, finisher. Make a Strike. On a failure, deal half your precise strike damage, of the weapon's damage type."
features.swashbuckler.confident-finisher.actions.confident-finisher.name: Confident Finisher
features.swashbuckler.confident-finisher.actions.confident-finisher.steps.weapon.prompt: Choose a weapon or unarmed attack
features.swashbuckler.fortitude-expertise.name: Fortitude Expertise
features.swashbuckler.fortitude-expertise.description: Your Fortitude proficiency becomes expert.
features.swashbuckler.opportune-riposte.name: Opportune Riposte
features.swashbuckler.opportune-riposte.description: 'Reaction, bravado, when an enemy within your reach critically fails a Strike against you: make a melee Strike against it, or Disarm it of the weapon it used.'
features.swashbuckler.opportune-riposte.actions.opportune-riposte.name: Opportune Riposte
features.swashbuckler.opportune-riposte.actions.opportune-riposte.steps.weapon.prompt: Choose a melee weapon or unarmed attack
features.swashbuckler.stylish-tricks.name: Stylish Tricks
features.swashbuckler.stylish-tricks.description: "At 3rd, 7th and 15th level, an extra skill increase and an extra skill feat, both for Acrobatics or your style's skill."
features.swashbuckler.vivacious-speed.name: Vivacious Speed
features.swashbuckler.vivacious-speed.description: "Stylish Combatant's status bonus to your Speeds becomes +10 feet, rising by 5 feet at 7th, 11th, 15th and 19th level. Without panache you get half of it, rounded down to 5 feet."
features.swashbuckler.weapon-expertise.name: Weapon Expertise
features.swashbuckler.weapon-expertise.description: 'Expert in simple and martial weapons and unarmed attacks, with their critical specialization effects.'
features.swashbuckler.confident-evasion.name: Confident Evasion
features.swashbuckler.confident-evasion.description: Your Reflex proficiency becomes master. A success on a Reflex save is a critical success.
features.swashbuckler.weapon-specialization.name: Weapon Specialization
features.swashbuckler.weapon-specialization.description: '+2 damage with weapons and unarmed attacks you are expert in, +3 if master, +4 if legendary.'
features.swashbuckler.exemplary-finisher.name: Exemplary Finisher
features.swashbuckler.exemplary-finisher.description: "When a finisher's Strike hits, it adds your style's effect. Battledancer: Step as a free action. Braggart: the foe's temporary immunity to your Demoralize ends. Fencer: the foe is off-guard until your next turn. Gymnast: against a grabbed, restrained or prone foe, a circumstance bonus to damage of twice the weapon damage dice. Rascal: a –10-foot circumstance penalty to the foe's Speed until the start of your next turn. Wit: a –2 circumstance penalty to the foe's attack rolls against you until the start of your next turn."
features.swashbuckler.swashbuckler-expertise.name: Swashbuckler Expertise
features.swashbuckler.swashbuckler-expertise.description: "Stylish Combatant's bonus becomes +2, and your swashbuckler class DC proficiency expert."
features.swashbuckler.continuous-flair.name: Continuous Flair
features.swashbuckler.continuous-flair.description: "Stylish Combatant's circumstance bonus also applies in exploration mode."
features.swashbuckler.perception-mastery.name: Perception Mastery
features.swashbuckler.perception-mastery.description: Your Perception proficiency becomes master.
features.swashbuckler.assured-evasion.name: Assured Evasion
features.swashbuckler.assured-evasion.description: 'Your Reflex proficiency becomes legendary. A critical failure on a Reflex save is a failure, and a failure against a damaging effect halves the damage.'
features.swashbuckler.light-armor-expertise.name: Light Armor Expertise
features.swashbuckler.light-armor-expertise.description: Expert in light armor and unarmored defense.
features.swashbuckler.weapon-mastery.name: Weapon Mastery
features.swashbuckler.weapon-mastery.description: Master in simple and martial weapons and unarmed attacks.
features.swashbuckler.greater-weapon-specialization.name: Greater Weapon Specialization
features.swashbuckler.greater-weapon-specialization.description: 'Weapon specialization damage becomes +4 at expert, +6 at master and +8 at legendary.'
features.swashbuckler.keen-flair.name: Keen Flair
features.swashbuckler.keen-flair.description: "With a weapon or unarmed attack you're a master in, a natural 19 that succeeds is a critical success."
features.swashbuckler.reinforced-ego.name: Reinforced Ego
features.swashbuckler.reinforced-ego.description: Your Will proficiency becomes master. A success on a Will save is a critical success.
features.swashbuckler.eternal-confidence.name: Eternal Confidence
features.swashbuckler.eternal-confidence.description: "Your swashbuckler class DC proficiency becomes master. A finisher's or Opportune Riposte's Strike can take Confident Finisher's failure effect, with a weapon that could make one."
features.swashbuckler.light-armor-mastery.name: Light Armor Mastery
features.swashbuckler.light-armor-mastery.description: Master in light armor and unarmored defense.

feats.swashbuckler.disarming-flair.name: Disarming Flair
feats.swashbuckler.disarming-flair.description: Your Disarm actions gain the bravado trait.
feats.swashbuckler.elegant-buckler.name: Elegant Buckler
feats.swashbuckler.elegant-buckler.description: "A raised buckler's circumstance bonus to AC is +2, and a creature critically missing you with a Strike while it's raised gives you panache until the end of your next turn."
feats.swashbuckler.extravagant-parry.name: Extravagant Parry
feats.swashbuckler.extravagant-parry.description: 'One action, wielding one or more one-handed weapons: a +1 circumstance bonus to AC until the start of your next turn, +2 with a free hand or a parry weapon. A Strike that misses you meanwhile gives you panache until the end of your next turn.'
feats.swashbuckler.extravagant-parry.actions.extravagant-parry.name: Extravagant Parry
feats.swashbuckler.extravagant-parry.actions.extravagant-parry.params.freeHand.name: A free hand or a parry weapon
feats.swashbuckler.flying-blade.name: Flying Blade
feats.swashbuckler.flying-blade.description: 'Precise strike applies to ranged Strikes with agile or finesse thrown weapons within their first range increment, and those Strikes can be finishers.'
feats.swashbuckler.goading-feint.name: Goading Feint
feats.swashbuckler.goading-feint.description: 'When you Feint, you can instead give the target a –2 circumstance penalty to its next attack roll against you before the end of its next turn (every attack roll on a critical success).'
feats.swashbuckler.goading-feint.prerequisites.deception: Trained in Deception
feats.swashbuckler.brandishing-draw.name: Brandishing Draw
feats.swashbuckler.brandishing-draw.description: 'One action. Interact to draw a weapon, then Strike with it or use a one-action finisher.'
feats.swashbuckler.brandishing-draw.actions.brandishing-draw.name: Brandishing Draw
feats.swashbuckler.brandishing-draw.actions.brandishing-draw.steps.weapon.prompt: Choose the weapon you draw
feats.swashbuckler.finishing-follow-through.name: Finishing Follow-through
feats.swashbuckler.finishing-follow-through.description: You gain panache whenever your finisher brings a target to 0 Hit Points.
feats.swashbuckler.retreating-finisher.name: Retreating Finisher
feats.swashbuckler.retreating-finisher.description: 'One action, finisher. Make a melee Strike. On a failure, Step as a free action.'
feats.swashbuckler.retreating-finisher.actions.retreating-finisher.name: Retreating Finisher
feats.swashbuckler.retreating-finisher.actions.retreating-finisher.steps.weapon.prompt: Choose a melee weapon or unarmed attack
feats.swashbuckler.unbalancing-finisher.name: Unbalancing Finisher
feats.swashbuckler.unbalancing-finisher.description: 'One action, finisher. Make a melee Strike. If it hits and deals damage, the target is off-guard until the end of your next turn.'
feats.swashbuckler.unbalancing-finisher.actions.unbalancing-finisher.name: Unbalancing Finisher
feats.swashbuckler.unbalancing-finisher.actions.unbalancing-finisher.steps.weapon.prompt: Choose a melee weapon or unarmed attack
feats.swashbuckler.even-the-odds.name: Even the Odds
feats.swashbuckler.even-the-odds.description: 'Free action, once per 10 minutes, when your turn begins while you are flanked: you gain panache until the end of your turn.'
feats.swashbuckler.swaggering-initiative.name: Swaggering Initiative
feats.swashbuckler.swaggering-initiative.description: 'A +2 circumstance bonus to initiative, and you can Interact to draw a weapon. If you act first, you gain panache.'
feats.swashbuckler.twirling-throw.name: Twirling Throw
feats.swashbuckler.twirling-throw.description: 'One action, finisher. Make a thrown weapon Strike, ignoring the penalty for its second and third range increments. The weapon returns to your hand unless you critically fail.'
feats.swashbuckler.twirling-throw.actions.twirling-throw.name: Twirling Throw
feats.swashbuckler.twirling-throw.actions.twirling-throw.steps.weapon.prompt: Choose a thrown weapon
feats.swashbuckler.twirling-throw.prerequisites.flying-blade: Flying Blade
feats.swashbuckler.flamboyant-athlete.name: Flamboyant Athlete
feats.swashbuckler.flamboyant-athlete.description: 'With panache: climb and swim Speeds of half your land Speed, jump DCs 10 lower, and longer Leaps.'
feats.swashbuckler.flamboyant-athlete.prerequisites.athletics: Expert in Athletics
feats.swashbuckler.combination-finisher.name: Combination Finisher
feats.swashbuckler.combination-finisher.description: "Your finishers' Strikes take a multiple attack penalty of –4 and –8 (–3 and –6 with an agile weapon) instead of –5 and –10."
feats.swashbuckler.precise-finisher.name: Precise Finisher
feats.swashbuckler.precise-finisher.description: 'On a failure with Confident Finisher, you deal your full precise strike damage instead of half.'
feats.swashbuckler.vexing-tumble.name: Vexing Tumble
feats.swashbuckler.vexing-tumble.description: "One action, bravado. Stride up to half your Speed, with an Acrobatics check against the Reflex DC of each enemy whose reach you start in or enter: on a success its reactions don't trigger, and on a critical success it's also off-guard to you until the end of your turn; on a critical failure your movement stops."

effects.panache.name: Panache
effects.panache.description: 'A status bonus to your Speeds; finishers need it and spend it.'
effects.extravagant-parry.name: Extravagant Parry
effects.extravagant-parry.state.value.name: Bonus to AC

