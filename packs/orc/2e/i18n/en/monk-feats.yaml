# Monk feats to 20th level. Short rules text written for the pack.
weapons.unarmed.stumbling-swing.name: 'Stumbling swing'
effects.stumbling-stance.name: 'Stumbling Stance'
weapons.unarmed.iron-sweep.name: 'Iron sweep'
effects.ironblood-stance.name: 'Ironblood Stance'
weapons.unarmed.lashing-branch.name: 'Lashing branch'
effects.tangled-forest-stance.name: 'Tangled Forest Stance'

feats.monk.monastic-archer-stance.name: 'Monastic Archer Stance'
feats.monk.monastic-archer-stance.description: "Stance. Requirement: unarmored, wielding a longbow, shortbow or monk bow. You can Strike only with those bows, can Flurry with them, and can use monk abilities meant for unarmed attacks with them within half their first range increment. You're trained in the longbow, shortbow and monk bows, rising with expert and master strikes."
feats.monk.stumbling-stance.name: 'Stumbling Stance'
feats.monk.stumbling-stance.description: 'Stance. You weave like a drunkard: +1 circumstance bonus to Feint, and your only Strikes are stumbling swings (1d8 bludgeoning, brawling, agile, backstabber, finesse, nonlethal, unarmed). An enemy that hits you with a melee Strike is off-guard to your next stumbling swing against it before the end of your next turn.'
feats.monk.stumbling-stance.prerequisites.deception: 'Trained in Deception'
feats.monk.stumbling-stance.actions.stumbling-stance.name: 'Stumbling Stance'
feats.monk.elemental-fist.name: 'Elemental Fist'
feats.monk.elemental-fist.description: 'Inner upheaval can deliver its extra damage as an element, with its trait: air electricity, earth bludgeoning, fire fire, metal slashing, water cold or wood bludgeoning.'
feats.monk.elemental-fist.prerequisites.qi: 'Inner upheaval'
feats.monk.shooting-stars-stance.name: 'Shooting Stars Stance'
feats.monk.shooting-stars-stance.description: 'Stance. You can use monk abilities meant for unarmed attacks with shuriken.'
feats.monk.shooting-stars-stance.prerequisites.monastic-weaponry: 'Monastic Weaponry'
feats.monk.flurry-of-maneuvers.name: 'Flurry of Maneuvers'
feats.monk.flurry-of-maneuvers.description: 'You can replace one or both Strikes of a Flurry of Blows with Grapple, Reposition, Shove or Trip.'
feats.monk.flurry-of-maneuvers.prerequisites.athletics: 'Expert in Athletics'
feats.monk.guarded-movement.name: 'Guarded Movement'
feats.monk.guarded-movement.description: 'You gain a +4 circumstance bonus to AC against reactions triggered by your movement.'
feats.monk.align-qi.name: 'Align Qi'
feats.monk.align-qi.description: 'Reaction, once per hour. Trigger: you Cast a Spell with the monk trait. You regain Hit Points equal to your level + your Wisdom modifier.'
feats.monk.align-qi.prerequisites.qi-spells: 'Qi Spells'
feats.monk.crane-flutter.name: 'Crane Flutter'
feats.monk.crane-flutter.description: "Reaction. Requirement: Crane Stance. Trigger: an observed attacker targets you with an attack. Crane Stance's AC bonus is +3 against it; if it misses and the attacker is in reach, make a crane wing Strike against it at -2."
feats.monk.crane-flutter.prerequisites.crane-stance: 'Crane Stance'
feats.monk.dragon-roar.name: 'Dragon Roar'
feats.monk.dragon-roar.description: "One action (auditory, emotion, fear, mental). Requirement: Dragon Stance. Enemies in a 15-foot emanation must succeed at a Will save against your Intimidation DC or be frightened 1 (2 on a critical failure); one starting its turn adjacent to you can't drop below frightened 1 that turn, and your first hit on a frightened creature before the end of your next turn gains +4 circumstance damage. Usable again after 1d4 rounds; creatures are immune for 1 minute."
feats.monk.dragon-roar.prerequisites.dragon-stance: 'Dragon Stance'
feats.monk.return-fire.name: 'Return Fire'
feats.monk.return-fire.description: 'In Monastic Archer Stance with a bow and a free hand, when you Deflect an arrow you can fire it back with a ranged Strike as part of the reaction.'
feats.monk.return-fire.prerequisites.deflect-projectile: 'Deflect Projectile'
feats.monk.return-fire.prerequisites.monastic-archer-stance: 'Monastic Archer Stance'
feats.monk.stumbling-feint.name: 'Stumbling Feint'
feats.monk.stumbling-feint.description: "In Stumbling Stance, you can Feint as a free action just before Flurry of Blows' first Strike; on a success the target is off-guard to both Strikes."
feats.monk.stumbling-feint.prerequisites.stumbling-stance: 'Stumbling Stance'
feats.monk.stumbling-feint.prerequisites.deception: 'Expert in Deception'
feats.monk.whirling-throw.name: 'Whirling Throw'
feats.monk.whirling-throw.description: "One action (attack). Requirement: you have a creature grabbed or restrained. Athletics against its Fortitude DC (-2 for one size larger, -4 larger still; +2 one size smaller, +4 smaller still). **Critical Success** Throw it up to 10 feet + 5 feet per Strength modifier for Strength + 1d6 per 10 feet bludgeoning damage (maximum distance into an obstacle), and it falls prone. **Success** As critical success, not prone. **Failure** No throw. **Critical Failure** No throw, and it's no longer held."
feats.monk.wolf-drag.name: 'Wolf Drag'
feats.monk.wolf-drag.description: 'Two actions. Requirement: Wolf Stance. Make a wolf jaw Strike with fatal d12; on a hit the target is knocked prone.'
feats.monk.wolf-drag.prerequisites.wolf-stance: 'Wolf Stance'
feats.monk.ironblood-stance.name: 'Ironblood Stance'
feats.monk.ironblood-stance.description: 'Stance. Requirement: unarmored. You can make iron sweep attacks (1d8 bludgeoning, brawling, nonlethal, parry, sweep, unarmed) and have resistance 2 to all damage (3 at 12th level, 4 at 16th, 5 at 20th).'
feats.monk.ironblood-stance.actions.ironblood-stance.name: 'Ironblood Stance'
feats.monk.mixed-maneuver.name: 'Mixed Maneuver'
feats.monk.mixed-maneuver.description: 'Two actions. Attempt two of Grapple, Reposition, Shove and Trip against the same or different creatures; the penalty rises only after both.'
feats.monk.mixed-maneuver.prerequisites.athletics: 'Master in Athletics'
feats.monk.pinning-fire.name: 'Pinning Fire'
feats.monk.pinning-fire.description: 'Reaction. Trigger: your Flurry of Blows makes two ranged piercing Strikes against one target. If both hit, it must succeed at a Reflex save against your class DC or be immobilized until it or an adjacent creature succeeds at a DC 10 Athletics check (not incorporeal, liquid or effortlessly free creatures).'
feats.monk.projectile-snatching.name: 'Projectile Snatching'
feats.monk.projectile-snatching.description: "When you Deflect a Projectile, you can make a ranged Strike with it at the attacker as part of the reaction (a thrown weapon with the triggering attack's range and effect)."
feats.monk.projectile-snatching.prerequisites.deflect-projectile: 'Deflect Projectile'
feats.monk.tangled-forest-stance.name: 'Tangled Forest Stance'
feats.monk.tangled-forest-stance.description: 'Stance. Requirement: unarmored. You can make lashing branch attacks (1d8 slashing, brawling, agile, finesse, nonlethal, unarmed); an enemy in your reach trying to move away must succeed at a Reflex save, Acrobatics or Athletics check against your class DC or be immobilized for that action (unless you let it go).'
feats.monk.tangled-forest-stance.actions.tangled-forest-stance.name: 'Tangled Forest Stance'
feats.monk.wall-run.name: 'Wall Run'
feats.monk.wall-run.description: "One action. Stride, running up vertical surfaces at full Speed; you fall after your next action or at turn's end if you end off the ground (Water Step lets you run on flimsy or liquid surfaces too)."
feats.monk.cobra-envenom.name: 'Cobra Envenom'
feats.monk.cobra-envenom.description: "One action, once per minute. Requirement: Cobra Stance. Make a cobra fang Strike with 5 feet more reach; on a hit its persistent poison damage becomes 1d4 per weapon damage die. Cobra Stance's Fortitude bonus becomes +2."
feats.monk.cobra-envenom.prerequisites.cobra-stance: 'Cobra Stance'
feats.monk.cobra-envenom.prerequisites.expert: 'Expert in unarmed strikes'
feats.monk.knockback-strike.name: 'Knockback Strike'
feats.monk.knockback-strike.description: 'Two actions, concentrate. Make an unarmed Strike; on a hit, Shove the target at the same multiple attack penalty, not counting toward it.'
feats.monk.prevailing-position.name: 'Prevailing Position'
feats.monk.prevailing-position.description: 'Reaction. Trigger: in a stance, you are targeted by an attack or attempt a Reflex save against a damaging effect. Leave the stance for a +4 circumstance bonus to AC or the save against it.'
feats.monk.sleeper-hold.name: 'Sleeper Hold'
feats.monk.sleeper-hold.description: 'One action (incapacitation). Requirement: you have a creature grabbed or restrained. Attempt to Grapple it with these results. **Critical Success** It falls unconscious for 1 minute, still standing and holding its items. **Success** Clumsy 1 until the end of its next turn.'
feats.monk.winding-flow.name: 'Winding Flow'
feats.monk.winding-flow.description: 'One action, once per round. Use two different actions of Stand, Step and Stride, in any order.'
feats.monk.disrupt-qi.name: 'Disrupt Qi'
feats.monk.disrupt-qi.description: 'Two actions (void). Make an unarmed Strike; if it damages a living creature it takes 2d6 persistent void damage (3d6 at 18th level) and is enfeebled 1 until that ends.'
feats.monk.disrupt-qi.actions.disrupt-qi.name: 'Disrupt Qi'
feats.monk.disrupt-qi.actions.disrupt-qi.steps.weapon.prompt: 'Choose an unarmed attack'
feats.monk.dodging-roll.name: 'Dodging Roll'
feats.monk.dodging-roll.description: 'Reaction. Trigger: you take damage from an area effect with a Reflex save. Step, gaining resistance to all its damage equal to your level (level + Dexterity if you leave its area).'
feats.monk.dodging-roll.prerequisites.acrobatics: 'Master in Acrobatics'
feats.monk.focused-shot.name: 'Focused Shot'
feats.monk.focused-shot.description: 'One action, concentrate. Requirement: Monastic Archer Stance. Make a ranged Strike within the first range increment, ignoring concealment and all cover.'
feats.monk.focused-shot.prerequisites.monastic-archer-stance: 'Monastic Archer Stance'
feats.monk.improved-knockback.name: 'Improved Knockback'
feats.monk.improved-knockback.description: 'A successful Shove pushes and lets you follow 5 feet farther (10 on a critical success); a creature pushed into another creature or obstacle takes, as does the other, 1d6 bludgeoning per 5 feet prevented.'
feats.monk.improved-knockback.prerequisites.knockback-strike: 'Knockback Strike'
feats.monk.meditative-focus.name: 'Meditative Focus'
feats.monk.meditative-focus.description: 'When you Refocus, you regain all your Focus Points.'
feats.monk.meditative-focus.prerequisites.qi-spells: 'Qi Spells'
feats.monk.overwhelming-breath.name: 'Overwhelming Breath'
feats.monk.overwhelming-breath.description: 'One action, spellshape. If your next action casts a monk spell with no duration, it and its Strikes ignore physical resistance up to your level.'
feats.monk.overwhelming-breath.prerequisites.qi-spells: 'Qi Spells'
feats.monk.reflexive-stance.name: 'Reflexive Stance'
feats.monk.reflexive-stance.description: 'Free action. Trigger: you roll initiative. Use an action with the stance trait.'
feats.monk.form-lock.name: 'Form Lock'
feats.monk.form-lock.description: "One action (attack). Requirement: you have a foe grabbed or restrained. Athletics to counteract a polymorph effect on it (your choice of several); it's then immune for a day."
feats.monk.ironblood-surge.name: 'Ironblood Surge'
feats.monk.ironblood-surge.description: "One action. Requirement: Ironblood Stance. Until the start of your next turn you gain iron sweep's parry bonus (+1 circumstance to AC) and your Ironblood resistance equals your Strength modifier if higher."
feats.monk.ironblood-surge.prerequisites.ironblood-stance: 'Ironblood Stance'
feats.monk.mountain-quake.name: 'Mountain Quake'
feats.monk.mountain-quake.description: "One action. Requirement: Mountain Stance. Creatures on the ground in a 20-foot emanation take damage equal to your Strength modifier (basic Fortitude save against your class DC), falling prone on a failure; usable again after 1d4 rounds. Mountain Stance's Dexterity cap rises to +2."
feats.monk.mountain-quake.prerequisites.mountain-stronghold: 'Mountain Stronghold'
feats.monk.peerless-form.name: 'Peerless Form'
feats.monk.peerless-form.description: 'You stop aging (but still die in time) and gain a +2 status bonus to Fortitude and Will saves.'
feats.monk.tangled-forest-rake.name: 'Tangled Forest Rake'
feats.monk.tangled-forest-rake.description: 'One action. Requirement: Tangled Forest Stance. Make a lashing branch Strike; if it hits and deals damage, Reposition the target up to 10 feet, even through your space.'
feats.monk.tangled-forest-rake.prerequisites.tangled-forest-stance: 'Tangled Forest Stance'
feats.monk.whirling-blade-stance.name: 'Whirling Blade Stance'
feats.monk.whirling-blade-stance.description: "Stance. Your finesse melee monk weapons gain thrown 10 feet; after a thrown Strike you can Strike again with the weapon from the last target's space, and it returns to you at the end of your turn (unless blocked)."
feats.monk.whirling-blade-stance.prerequisites.monastic-weaponry: 'Monastic Weaponry'
feats.monk.wild-winds-gust.name: 'Wild Winds Gust'
feats.monk.wild-winds-gust.description: 'Two actions (air, concentrate, manipulate). Requirement: Wild Winds Stance. Make a wind crash Strike against each creature in a 30-foot cone or 60-foot line; the penalty rises only after all of them.'
feats.monk.wild-winds-gust.prerequisites.wild-winds-initiate: 'Wild Winds Initiate'
feats.monk.fuse-stance.name: 'Fuse Stance'
feats.monk.fuse-stance.description: 'Combine two stances you know into one you name, with both their effects, attacks, requirements and restrictions (the GM settles conflicts).'
feats.monk.one-millimeter-punch.name: 'One-millimeter Punch'
feats.monk.one-millimeter-punch.description: 'When One-Inch Punch damages a target, it attempts a Fortitude save against your class DC. **Critical Success** Unaffected. **Success** Pushed 5 feet. **Failure** Pushed 10 feet. **Critical Failure** Pushed 10 feet per action you spent.'
feats.monk.one-millimeter-punch.prerequisites.one-inch-punch: 'One-inch Punch'
feats.monk.shattering-strike-monk.name: 'Shattering Strike (Monk)'
feats.monk.shattering-strike-monk.description: "Two actions. Make an unarmed Strike that bypasses the target's resistances and treats its Hardness as half."
feats.monk.diamond-fists.name: 'Diamond Fists'
feats.monk.diamond-fists.description: 'Your unarmed attacks gain forceful and deadly d10; one that already had either has a larger damage die.'
feats.monk.qi-center.name: 'Qi Center'
feats.monk.qi-center.description: 'Free action, once per minute. Cast a one-action qi spell with the stance trait without spending a Focus Point.'
feats.monk.qi-center.prerequisites.master-of-many-styles: 'Master of Many Styles'
feats.monk.qi-center.prerequisites.qi-spells: 'Qi Spells'
feats.monk.swift-river.name: 'Swift River'
feats.monk.swift-river.description: 'Free action. Trigger: your turn ends while a status penalty slows your Speed or you are immobilized or slowed. End one such penalty or condition.'
feats.monk.triangle-shot.name: 'Triangle Shot'
feats.monk.triangle-shot.description: 'Two actions (concentrate, fortune). Requirement: Monastic Archer Stance with a fitting bow. Make three ranged Strikes against one target at your current penalty -2 more; it counts as two attacks, damage combines for resistances and weaknesses, Stunning Blows applies, and if all three hit the target takes 3d6 persistent bleed damage.'
feats.monk.triangle-shot.prerequisites.monastic-archer-stance: 'Monastic Archer Stance'
feats.monk.triangle-shot.prerequisites.stunning-blows: 'Stunning Blows'
feats.monk.enduring-quickness.name: 'Enduring Quickness'
feats.monk.enduring-quickness.description: "You're permanently quickened; the extra action can Stride, Leap or be part of a High Jump or Long Jump."
feats.monk.godbreaker.name: 'Godbreaker'
feats.monk.godbreaker.description: 'Three actions. Requirement: you have a creature grabbed or restrained. Hurl it 20 feet up, leap after it and make an unarmed Strike, up to three times while you hit; a miss ends it and you both fall. If all three hit, you slam it down for your unarmed damage plus falling damage, landing unhurt beside it, still holding it.'
feats.monk.godbreaker.prerequisites.crushing-grab: 'Crushing Grab'
feats.monk.godbreaker.prerequisites.whirling-throw: 'Whirling Throw'
feats.monk.immortal-techniques.name: 'Immortal Techniques'
feats.monk.immortal-techniques.description: 'The first time each round you use an action with the monk and stance traits, you gain 20 temporary Hit Points until the start of your next turn.'
feats.monk.immortal-techniques.prerequisites.master-of-many-styles: 'Master of Many Styles'
feats.monk.impossible-technique.name: 'Impossible Technique'
feats.monk.impossible-technique.description: "Reaction (fortune). Requirement: unarmored and not fatigued. Trigger: an enemy's attack hits you or you fail a save against an enemy's ability. The attacker rerolls and takes the lower, or you reroll the save and take the higher."
feats.monk.lightning-qi.name: 'Lightning Qi'
feats.monk.lightning-qi.description: 'Free action, once per 10 minutes. If your next action casts a qi spell of two or more actions, it takes one action fewer.'
feats.monk.lightning-qi.prerequisites.qi-spells: 'Qi Spells'
