# Generated text for treasure (rules/treasure.yaml, rules/magic-items.yaml).
worn.accolade-robe.name: 'Accolade Robe'
worn.accolade-robe.description: "A +2 item bonus to Arcana checks. Its pockets hold 1 Bulk of light study items (spellbooks, scrolls, wands) that don't count toward your Bulk. Review (1 action): take an item from the robe and Recall Knowledge. Extra Credit (free action, once per day): gain 1 Focus Point for a school spell, lost at the end of your turn."
worn.accolade-robe-greater.name: 'Accolade Robe (Greater)'
worn.accolade-robe-greater.description: "A +3 item bonus to Arcana checks. Its pockets hold 1 Bulk of light study items (spellbooks, scrolls, wands) that don't count toward your Bulk. Review (1 action): take an item from the robe and Recall Knowledge, as a free action once per minute. Extra Credit (free action, once per day): gain 1 Focus Point for a school spell, lost at the end of your turn."
worn.aeon-stone-consumed.name: 'Aeon Stone (Consumed)'
worn.aeon-stone-consumed.description: 'A dull stone that has lost its magic; it still orbits your head. No resonant power.'
worn.aeon-stone-preserving.name: 'Aeon Stone (Preserving)'
worn.aeon-stone-preserving.description: 'Resistance 3 to persistent damage, and a persistent damage it fully resists ends at the end of your turn. Resonant power: stabilize as a primal innate cantrip.'
worn.aeon-stone-sprouting.name: 'Aeon Stone (Sprouting)'
worn.aeon-stone-sprouting.description: 'Resonant power: tangle vine as a primal innate cantrip. Flow of Life (reaction, once per hour): when vitality magic heals you or you take void damage, gain 8 temporary Hit Points for 1 minute.'
worn.aeon-stone-sprouting.actions.flow-of-life.name: 'Flow of Life'
worn.aeon-stone-smoothing.name: 'Aeon Stone (Smoothing)'
worn.aeon-stone-smoothing.description: 'Ignore the status penalty to skill checks from clumsy, enfeebled, frightened, sickened and stupefied while their value is 1. Resonant power: guidance as an occult innate cantrip.'
worn.aeon-stone-nourishing.name: 'Aeon Stone (Nourishing)'
worn.aeon-stone-nourishing.description: 'After a week invested, you no longer need to eat or drink. Resonant power: air bubble as a primal innate spell once per day.'
worn.aeon-stone-delaying.name: 'Aeon Stone (Delaying)'
worn.aeon-stone-delaying.description: 'When dying would kill you, it activates and keeps your dying value one short of death, then becomes a consumed aeon stone (once per day). Resonant power: 1st-rank heal as a divine innate spell once per day.'
worn.aeon-stone-envisioning.name: 'Aeon Stone (Envisioning)'
worn.aeon-stone-envisioning.description: 'Send a simple mental image each round to creatures within 100 feet. Resonant power: translate as an occult innate spell once per day.'
worn.aeon-stone-peering.name: 'Aeon Stone (Peering)'
worn.aeon-stone-peering.description: 'In bright light, it sheds dim purple light 30 feet that shows magic auras and tries to counteract darkness and illusions (+25). Resonant power: switch the light on or off from a wayfinder.'
worn.aeon-stone-amplifying.name: 'Aeon Stone (Amplifying)'
worn.aeon-stone-amplifying.description: 'Amplify (1 action, spellshape): your next spell counts as 1 rank higher for counteracting. Resonant power: a +2 item bonus to the skill of the tradition of the last spell you amplified.'
worn.alacritous-horseshoes.name: 'Alacritous Horseshoes'
worn.alacritous-horseshoes.description: 'Worn and invested by a horse or quadruped animal companion: a +5-foot item bonus to its land Speed, a +2 circumstance bonus to High Jump and Long Jump, and longer Leaps.'
worn.alacritous-horseshoes-greater.name: 'Alacritous Horseshoes (Greater)'
worn.alacritous-horseshoes-greater.description: 'Worn and invested by a horse or quadruped animal companion: a +10-foot item bonus to its land Speed, a +3 circumstance bonus to High Jump and Long Jump, and longer Leaps.'
worn.alchemist-goggles.name: 'Alchemist Goggles'
worn.alchemist-goggles.description: 'A +1 item bonus to Crafting checks to Craft alchemical items. Your alchemical bomb Strikes ignore lesser cover, and a failed (not critically failed) bomb Strike adds +1 to its splash damage.'
worn.alchemist-goggles-greater.name: 'Alchemist Goggles (Greater)'
worn.alchemist-goggles-greater.description: 'A +2 item bonus to Crafting checks to Craft alchemical items. Your alchemical bomb Strikes ignore lesser cover, and a failed (not critically failed) bomb Strike adds +2 to its splash damage.'
worn.alchemist-goggles-major.name: 'Alchemist Goggles (Major)'
worn.alchemist-goggles-major.description: 'A +3 item bonus to Crafting checks to Craft alchemical items. Your alchemical bomb Strikes ignore lesser cover, and a failed (not critically failed) bomb Strike adds +3 to its splash damage.'
worn.arboreal-boots.name: 'Arboreal Boots'
worn.arboreal-boots.description: 'A +1 item bonus to Acrobatics checks; you ignore difficult terrain from plants and fungi.'
worn.arboreal-boots-greater.name: 'Arboreal Boots (Greater)'
worn.arboreal-boots-greater.description: 'A +2 item bonus to Acrobatics checks; you ignore difficult terrain from plants and fungi. You also gain a 10-foot climb Speed on plants and fungi and climb them without hands.'
worn.armbands-of-athleticism.name: 'Armbands of Athleticism'
worn.armbands-of-athleticism.description: 'A +2 item bonus to Athletics checks, and a successful Climb or Swim moves you 5 feet farther.'
worn.armbands-of-athleticism-greater.name: 'Armbands of Athleticism (Greater)'
worn.armbands-of-athleticism-greater.description: 'A +3 item bonus to Athletics checks, and a successful Climb or Swim moves you 10 feet farther.'
worn.bands-of-force.name: 'Bands of Force'
worn.bands-of-force.description: 'A +1 item bonus to AC and saving throws and a Dexterity cap of +5, as armor; talismans can be affixed as to light armor. Return Force (reaction): when a creature critically misses you with a melee Strike, Shove it with Athletics +14.'
worn.bands-of-force-greater.name: 'Bands of Force (Greater)'
worn.bands-of-force-greater.description: 'A +2 item bonus to AC and saving throws and a Dexterity cap of +5, as armor; talismans can be affixed as to light armor. Return Force (reaction): when a creature critically misses you with a melee Strike, Shove it with Athletics +21.'
worn.bands-of-force-major.name: 'Bands of Force (Major)'
worn.bands-of-force-major.description: 'A +3 item bonus to AC and saving throws and a Dexterity cap of +5, as armor; talismans can be affixed as to light armor. Return Force (reaction): when a creature critically misses you with a melee Strike, Shove it with Athletics +33.'
worn.barding-of-the-zephyr.name: 'Barding of the Zephyr'
worn.barding-of-the-zephyr.description: 'Worn by your animal companion: it gets gentle landing when it falls. Take Flight (2 actions, once per day): your companion gains a 30-foot fly Speed for 10 minutes.'
worn.belt-of-long-life.name: 'Belt of Long Life'
worn.belt-of-long-life.description: 'Apex: invested, it raises your Constitution modifier by 1, or to +4 if that is higher. Investing it gives 15 temporary Hit Points (the first time each day). Call Upon the Ancient Life (1 action, once per day): for 2d4 rounds, you recover 15 Hit Points at the start of each of your turns.'
worn.berserkers-cloak.name: "Berserker's Cloak"
worn.berserkers-cloak.description: 'While raging (if you have Rage), you grow jaws (1d10 piercing) and agile claws (1d6 slashing), brawling unarmed attacks with the benefit of a +1 striking rune; with the animal instinct and bestial rage, your bestial attacks get +2 greater striking instead.'
worn.berserkers-cloak-greater.name: "Berserker's Cloak (Greater)"
worn.berserkers-cloak-greater.description: 'While raging (if you have Rage), you grow jaws (1d10 piercing) and agile claws (1d6 slashing), brawling unarmed attacks with the benefit of a +2 greater striking rune; with the animal instinct and bestial rage, your bestial attacks get +3 major striking instead.'
worn.boots-of-bounding.name: 'Boots of Bounding'
worn.boots-of-bounding.description: 'A +5-foot item bonus to your Speed and a +2 item bonus to High Jump and Long Jump; a Leap goes 5 feet farther or 3 feet higher.'
worn.boots-of-bounding-greater.name: 'Boots of Bounding (Greater)'
worn.boots-of-bounding-greater.description: 'A +10-foot item bonus to your Speed and a +3 item bonus to High Jump and Long Jump; a Leap goes 5 feet farther or 3 feet higher.'
worn.bracelet-of-dashing.name: 'Bracelet of Dashing'
worn.bracelet-of-dashing.description: 'A +1 item bonus to Acrobatics checks. Jangling Dash (1 action, once per day): a +10-foot status bonus to your Speed for 1 minute.'
worn.bracelet-of-dashing.actions.jangling-dash.name: 'Jangling Dash'
worn.bracers-of-missile-deflection.name: 'Bracers of Missile Deflection'
worn.bracers-of-missile-deflection.description: "Reaction (once per day): when a ranged weapon attack hits you but doesn't critically hit, and you aren't off-guard, gain a +2 circumstance bonus to AC against it; if that makes it miss, it misses."
worn.bracers-of-missile-deflection-greater.name: 'Bracers of Missile Deflection (Greater)'
worn.bracers-of-missile-deflection-greater.description: "Reaction (once every 10 minutes): when a ranged weapon attack hits you but doesn't critically hit, and you aren't off-guard, gain a +2 circumstance bonus to AC against it; if that makes it miss, it misses."
worn.bracers-of-strength.name: 'Bracers of Strength'
worn.bracers-of-strength.description: 'Apex (Strength). A +3 item bonus to Athletics checks and a +2 circumstance bonus to Athletics to lift a heavy object, Escape and Force Open. Bear Hug (1 action): Grapple; on a success it takes bludgeoning damage equal to your Strength modifier (double, and it suffocates while held, on a critical success).'
worn.channel-protection-amulet.name: 'Channel Protection Amulet'
worn.channel-protection-amulet.description: 'Resistance 5 to damage from harm spells if you are living, or from heal spells if you are undead.'
worn.charlatans-cape.name: "Charlatan's Cape"
worn.charlatans-cape.description: 'A +2 item bonus to Deception checks. Puff of Smoke (2 actions, once per day): cast translocate; the spaces you leave and arrive in fill with smoke that conceals anyone inside until your next turn ends.'
worn.charlatans-cape.options.translocate.name: 'Puff of Smoke'
worn.charlatans-gloves.name: "Charlatan's Gloves"
worn.charlatans-gloves.description: 'A +1 item bonus to Thievery checks, and telekinetic hand as an occult innate cantrip.'
worn.charlatans-gloves-greater.name: "Charlatan's Gloves (Greater)"
worn.charlatans-gloves-greater.description: "A +2 item bonus to Thievery checks, and telekinetic hand as an occult innate cantrip. With a charlatan's cape, the object you move can vanish and reappear beside you."
worn.charm-of-resistance.name: 'Charm of Resistance'
worn.charm-of-resistance.description: "Resistance 5 to one energy damage type, chosen when it's made: acid, cold, electricity, fire or sonic."
worn.charm-of-resistance.choices.damage-type.prompt: 'Which energy does the charm resist?'
worn.charm-of-resistance-greater.name: 'Charm of Resistance (Greater)'
worn.charm-of-resistance-greater.description: "Resistance 10 to one energy damage type, chosen when it's made: acid, cold, electricity, fire or sonic."
worn.charm-of-resistance-greater.choices.damage-type.prompt: 'Which energy does the charm resist?'
worn.charm-of-resistance-major.name: 'Charm of Resistance (Major)'
worn.charm-of-resistance-major.description: "Resistance 15 to one energy damage type, chosen when it's made: acid, cold, electricity, fire or sonic."
worn.charm-of-resistance-major.choices.damage-type.prompt: 'Which energy does the charm resist?'
worn.choker-of-elocution.name: 'Choker of Elocution'
worn.choker-of-elocution.description: "A +1 item bonus to Society checks, and you understand, speak and write one language the choker bears. While deafened, an auditory action's flat check is DC 3 instead of 5."
worn.choker-of-elocution.choices.languages.prompt: 'Which language does the choker bear?'
worn.choker-of-elocution-greater.name: 'Choker of Elocution (Greater)'
worn.choker-of-elocution-greater.description: "A +2 item bonus to Society checks, and you understand, speak and write three languages the choker bears. While deafened, an auditory action's flat check is DC 3 instead of 5."
worn.choker-of-elocution-greater.choices.languages.prompt: 'Which language does the choker bear?'
worn.clandestine-cloak.name: 'Clandestine Cloak'
worn.clandestine-cloak.description: 'With the hood up, a +1 item bonus to Stealth checks and to Impersonate a forgettable background character, and a -1 item penalty to Diplomacy and Intimidation checks. Cloak Identity (2 actions, once per day): gain veil of privacy for 1 hour.'
worn.clandestine-cloak.options.veil-of-privacy.name: 'Cloak Identity'
worn.clandestine-cloak-greater.name: 'Clandestine Cloak (Greater)'
worn.clandestine-cloak-greater.description: 'With the hood up, a +2 item bonus to Stealth checks and to Impersonate a forgettable background character, and a -1 item penalty to Diplomacy and Intimidation checks. Cloak Identity (2 actions, once per day): gain 5th-rank veil of privacy for 8 hours.'
worn.clandestine-cloak-greater.options.veil-of-privacy.name: 'Cloak Identity'
worn.clawed-bracers.name: 'Clawed Bracers'
worn.clawed-bracers.description: 'Extend Claws (1 action, once per hour): for 10 minutes, gain a 20-foot climb Speed and an agile, finesse claw unarmed attack dealing 1d6 slashing damage.'
worn.cloak-of-illusions.name: 'Cloak of Illusions'
worn.cloak-of-illusions.description: 'Figment as an occult innate cantrip, and a +1 item bonus to Stealth checks. Draw Hood (2 actions, once per day): gain invisibility, until it ends or you lower the hood.'
worn.cloak-of-illusions.options.invisibility.name: 'Draw Hood'
worn.cloak-of-illusions-greater.name: 'Cloak of Illusions (Greater)'
worn.cloak-of-illusions-greater.description: 'Figment as an occult innate cantrip, and a +2 item bonus to Stealth checks. Draw Hood (2 actions, once per day): gain 4th-rank invisibility, until it ends or you lower the hood.'
worn.cloak-of-illusions-greater.options.invisibility.name: 'Draw Hood'
worn.cloak-of-swiftness.name: 'Cloak of Swiftness'
worn.cloak-of-swiftness.description: 'Apex (Dexterity). A +3 item bonus to Acrobatics checks. Ride the Wind (1 action, once per day): a 30-foot fly Speed for 1 hour, and you are concealed for the duration.'
worn.cloak-of-swiftness.actions.ride-the-wind.name: 'Ride the Wind'
worn.collar-of-empathy.name: 'Collar of Empathy'
worn.collar-of-empathy.description: "You wear the bracelet, your companion the collar: you sense each other's emotions and needs. Empathic Link (1 action, sustained): perceive through your companion's senses."
worn.collar-of-inconspicuousness.name: 'Collar of Inconspicuousness'
worn.collar-of-inconspicuousness.description: 'Adorable Guise (1 action): your companion turns into a harmless Tiny creature of its kind, as pest form (2nd rank, 4th if it can fly), until you Dismiss it.'
worn.countering-charm.name: 'Countering Charm'
worn.countering-charm.description: "A caster can store a spell from a slot in the charm (the one held is replaced). Counter (reaction): when the stored spell targets you or includes you, counteract it at the stored spell's rank with +20; the spell is spent."
worn.countering-charm-greater.name: 'Countering Charm (Greater)'
worn.countering-charm-greater.description: "A caster can store a spell from a slot in the charm (the one held is replaced). Counter (reaction): when the stored spell targets you or includes you, counteract it at the stored spell's rank with +25; the spell is spent."
worn.countering-charm-major.name: 'Countering Charm (Major)'
worn.countering-charm-major.description: "A caster can store a spell from a slot in the charm (the one held is replaced). Counter (reaction): when the stored spell targets you or includes you, counteract it at the stored spell's rank with +30; the spell is spent."
worn.coyote-cloak.name: 'Coyote Cloak'
worn.coyote-cloak.description: 'A +1 item bonus to Survival checks; a critical success to Subsist feeds twice as many extra creatures.'
worn.coyote-cloak-greater.name: 'Coyote Cloak (Greater)'
worn.coyote-cloak-greater.description: 'A +2 item bonus to Survival checks; a critical success to Subsist feeds four times as many extra creatures.'
worn.crafters-eyepiece.name: "Crafter's Eyepiece"
worn.crafters-eyepiece.description: 'A +1 item bonus to Crafting checks; Repair restores 10 + 10 per proficiency rank Hit Points (15 + 15 on a critical success).'
worn.crafters-eyepiece-greater.name: "Crafter's Eyepiece (Greater)"
worn.crafters-eyepiece-greater.description: 'A +2 item bonus to Crafting checks; Repair restores 10 + 10 per proficiency rank Hit Points (15 + 15 on a critical success). Prototype (1 minute, once per day): the eyepiece casts 5th-rank creation.'
worn.crafters-eyepiece-greater.options.creation.name: 'Prototype'
worn.crown-of-intellect.name: 'Crown of Intellect'
worn.crown-of-intellect.description: 'Apex (Intelligence): the higher modifier brings its trained skills and languages, chosen the first time and kept. A +3 item bonus to checks to Recall Knowledge. Search Your Mind (1 action, once per hour): gain hypercognition.'
worn.crown-of-intellect.options.hypercognition.name: 'Search Your Mind'
worn.crown-of-witchcraft.name: 'Crown of Witchcraft'
worn.crown-of-witchcraft.description: "A +1 item bonus to Intimidation checks; a witch also gets a +2 item bonus to their patron's skill, and a familiar wearing part of it has the tough pet ability. Defiant Hex (free action, once per day): gain 1 Focus Point for a hex, lost at the end of your turn."
worn.crown-of-witchcraft-greater.name: 'Crown of Witchcraft (Greater)'
worn.crown-of-witchcraft-greater.description: "A +2 item bonus to Intimidation checks; a witch also gets a +3 item bonus to their patron's skill, and a familiar wearing part of it has the tough pet ability. Defiant Hex (free action, once per day): gain 1 Focus Point for a hex, lost at the end of your turn."
worn.dancing-scarf.name: 'Dancing Scarf'
worn.dancing-scarf.description: 'A +1 item bonus to Performance checks to dance. Swirling Scarf (1 action), right after a successful dance: you are concealed until your next turn.'
worn.dancing-scarf-greater.name: 'Dancing Scarf (Greater)'
worn.dancing-scarf-greater.description: 'A +2 item bonus to Performance checks to dance. Swirling Scarf (1 action), right after a successful dance: you are concealed until your next turn, and you can Stride half your Speed or Step.'
worn.daredevil-boots.name: 'Daredevil Boots'
worn.daredevil-boots.description: 'A +2 item bonus to Acrobatics checks and a +1 circumstance bonus to Tumble Through. You can Grab an Edge without free hands and treat falls as 10 feet shorter (with Cat Fall, your Acrobatics counts one rank higher).'
worn.daredevil-boots-greater.name: 'Daredevil Boots (Greater)'
worn.daredevil-boots-greater.description: 'A +3 item bonus to Acrobatics checks and a +2 circumstance bonus to Tumble Through. You can Grab an Edge without free hands and treat falls as 10 feet shorter (with Cat Fall, your Acrobatics counts one rank higher). Daredevil Impulse (2 actions, once per day): cast unfettered movement on yourself.'
worn.daredevil-boots-greater.options.unfettered-movement.name: 'Daredevil Impulse'
worn.demon-mask.name: 'Demon Mask'
worn.demon-mask.description: 'A +1 item bonus to Intimidation checks. Leering Mask (2 actions, once per day): the mask casts fear with DC 20.'
worn.demon-mask.options.fear.name: 'Leering Mask'
worn.demon-mask-greater.name: 'Demon Mask (Greater)'
worn.demon-mask-greater.description: 'A +2 item bonus to Intimidation checks. Leering Mask (2 actions, once per day): the mask casts 3rd-rank fear with DC 29.'
worn.demon-mask-greater.options.fear.name: 'Leering Mask'
worn.devoted-vestments.name: 'Devoted Vestments'
worn.devoted-vestments.description: "A religious symbol of its deity, and a +2 item bonus to Religion checks. Your heal and harm restore extra Hit Points equal to the spell's rank to the deity's followers. Domain Devotion (free action, once per day): gain 1 Focus Point for one of the deity's domain spells, lost at the end of your turn."
worn.diplomats-badge.name: "Diplomat's Badge"
worn.diplomats-badge.description: "A +1 item bonus to Diplomacy checks. Diplomat's Bearing (1 action, once per day): a DC 20 check to Recall Knowledge about a people; on a success the bonus is +2 with them for the day."
worn.doubling-rings.name: 'Doubling Rings'
worn.doubling-rings.description: 'Worn on both hands: the fundamental runes of the melee weapon in the gold-ringed hand apply to the melee weapon in the iron-ringed hand (its own are suppressed).'
worn.doubling-rings-greater.name: 'Doubling Rings (Greater)'
worn.doubling-rings-greater.description: 'Worn on both hands: the fundamental runes of the melee weapon in the gold-ringed hand apply to the melee weapon in the iron-ringed hand (its own are suppressed). The greater rings copy property runes too, where the other weapon qualifies (you may choose fundamental runes only when you invest them).'
worn.dread-blindfold.name: 'Dread Blindfold'
worn.dread-blindfold.description: 'Darkvision (and you see only by it) and a +3 item bonus to Intimidation checks. A creature seeing you the first time in a day must succeed at a DC 37 Will save or be frightened 1. Visions of Terror (free action, once per minute, when you damage a creature with a Strike): it is subjected to a DC 37 vision of death and then immune for 24 hours.'
worn.dread-blindfold.options.vision-of-death.name: 'Visions of Terror'
worn.earthglide-cloak.name: 'Earthglide Cloak'
worn.earthglide-cloak.description: 'Glide Through Earth (1 action, once per hour): Burrow through dirt and stone up to your land Speed, leaving no trace; ending inside stone expels you to the nearest open space with 1d6 bludgeoning damage per 5 feet.'
worn.entertainers-cincture.name: "Entertainer's Cincture"
worn.entertainers-cincture.description: 'A +2 item bonus to the skill you choose when you invest it: Deception, Diplomacy, Intimidation or Performance. Encore (free action, once per day): gain 1 Focus Point for a composition spell, lost at the end of your turn. Transcribe (1 action, once per day): your performances for 10 minutes are written down.'
worn.entertainers-cincture.choices.skill.prompt: 'Which skill does the cincture improve?'
worn.entertainers-cincture-greater.name: "Entertainer's Cincture (Greater)"
worn.entertainers-cincture-greater.description: 'A +3 item bonus to the skill you choose when you invest it: Deception, Diplomacy, Intimidation or Performance. Encore (free action, once per day): gain 1 Focus Point for a composition spell, lost at the end of your turn. Transcribe (1 action, once per day): your performances for 1 hour are written down.'
worn.entertainers-cincture-greater.choices.skill.prompt: 'Which skill does the cincture improve?'
worn.eye-of-fortune.name: 'Eye of Fortune'
worn.eye-of-fortune.description: 'You see through the eye patch. Luck Beyond Sight (free action, fortune): when you attack a concealed or hidden creature, roll the flat check twice and take the higher.'
worn.eyes-of-the-cat.name: 'Eyes of the Cat'
worn.eyes-of-the-cat.description: 'Low-light vision and a +2 item bonus to Perception checks that involve sight.'
worn.fire-jump-ring.name: 'Fire-Jump Ring'
worn.fire-jump-ring.description: 'A +2 item bonus to Athletics checks. Fire Jump (2 actions, once per day, teleportation): step into a fire large enough to hold you and come out of any such fire within 100 feet.'
worn.gorget-of-the-primal-roar.name: 'Gorget of the Primal Roar'
worn.gorget-of-the-primal-roar.description: 'A +2 item bonus to Intimidation checks. Primal Roar (1 action, once per polymorph effect, in a non-humanoid form): one Intimidation check against the Will DC of every enemy within 30 feet: frightened 2 on a critical success, frightened 1 on a success.'
worn.guise-of-the-smirking-devil.name: 'Guise of the Smirking Devil'
worn.guise-of-the-smirking-devil.description: 'A +2 item bonus to Intimidation checks. Hideous Wail (2 actions, once per day): 6d10 void damage to each living creature in a 20-foot emanation (DC 25 basic Fortitude save).'
worn.guise-of-the-smirking-devil-greater.name: 'Guise of the Smirking Devil (Greater)'
worn.guise-of-the-smirking-devil-greater.description: 'A +3 item bonus to Intimidation checks. Hideous Wail (2 actions, once per day): the mask casts wails of the damned (DC 41) on the living creatures in the area.'
worn.guise-of-the-smirking-devil-greater.options.wails-of-the-damned.name: 'Hideous Wail'
worn.handwraps-of-mighty-blows-1.name: 'Handwraps of Mighty Blows (+1)'
worn.handwraps-of-mighty-blows-1.description: 'Invested, the runes etched on them apply to your unarmed attacks: their item bonus to attack rolls and their weapon damage dice. Runes can be added and transferred as for a weapon (a melee brawling weapon of light Bulk); property runes apply only to unarmed attacks they could be etched on.'
worn.handwraps-of-mighty-blows-1-striking.name: 'Handwraps of Mighty Blows (+1 striking)'
worn.handwraps-of-mighty-blows-1-striking.description: 'Invested, the runes etched on them apply to your unarmed attacks: their item bonus to attack rolls and their weapon damage dice. Runes can be added and transferred as for a weapon (a melee brawling weapon of light Bulk); property runes apply only to unarmed attacks they could be etched on.'
worn.handwraps-of-mighty-blows-2-striking.name: 'Handwraps of Mighty Blows (+2 striking)'
worn.handwraps-of-mighty-blows-2-striking.description: 'Invested, the runes etched on them apply to your unarmed attacks: their item bonus to attack rolls and their weapon damage dice. Runes can be added and transferred as for a weapon (a melee brawling weapon of light Bulk); property runes apply only to unarmed attacks they could be etched on.'
worn.handwraps-of-mighty-blows-2-greater-striking.name: 'Handwraps of Mighty Blows (+2 greater striking)'
worn.handwraps-of-mighty-blows-2-greater-striking.description: 'Invested, the runes etched on them apply to your unarmed attacks: their item bonus to attack rolls and their weapon damage dice. Runes can be added and transferred as for a weapon (a melee brawling weapon of light Bulk); property runes apply only to unarmed attacks they could be etched on.'
worn.handwraps-of-mighty-blows-3-greater-striking.name: 'Handwraps of Mighty Blows (+3 greater striking)'
worn.handwraps-of-mighty-blows-3-greater-striking.description: 'Invested, the runes etched on them apply to your unarmed attacks: their item bonus to attack rolls and their weapon damage dice. Runes can be added and transferred as for a weapon (a melee brawling weapon of light Bulk); property runes apply only to unarmed attacks they could be etched on.'
worn.handwraps-of-mighty-blows-3-major-striking.name: 'Handwraps of Mighty Blows (+3 major striking)'
worn.handwraps-of-mighty-blows-3-major-striking.description: 'Invested, the runes etched on them apply to your unarmed attacks: their item bonus to attack rolls and their weapon damage dice. Runes can be added and transferred as for a weapon (a melee brawling weapon of light Bulk); property runes apply only to unarmed attacks they could be etched on.'
worn.headwrap-of-wisdom.name: 'Headwrap of Wisdom'
worn.headwrap-of-wisdom.description: "Apex (Wisdom). Consider the Consequences (1 action, once per day): gain augury's effects from your own instincts. Reclaim Your Mind (reaction, once per hour, fortune): when you fail a save against confused, fascinated or stupefied, reroll it and take the better."
worn.headwrap-of-wisdom.options.augury.name: 'Consider the Consequences'
worn.healers-gloves.name: "Healer's Gloves"
worn.healers-gloves.description: "A +1 item bonus to Medicine checks. Healer's Touch (1 action, once per day): a willing, living, adjacent creature regains 2d6+7 Hit Points (healing, vitality)."
worn.healers-gloves.actions.healers-touch.participants.ally.name: 'Creature healed'
worn.healers-gloves.actions.healers-touch.name: "Healer's Touch"
worn.healers-gloves-greater.name: "Healer's Gloves (Greater)"
worn.healers-gloves-greater.description: "A +2 item bonus to Medicine checks. Healer's Touch (1 action, once per day): a willing, living, adjacent creature regains 4d6+15 Hit Points (healing, vitality)."
worn.healers-gloves-greater.actions.healers-touch.participants.ally.name: 'Creature healed'
worn.healers-gloves-greater.actions.healers-touch.name: "Healer's Touch"
worn.hellfire-boots.name: 'Hellfire Boots'
worn.hellfire-boots.description: "Resistance 10 to fire damage. Devil's Dance (2 actions, once per minute): Stride; the squares you cross burn for 1 minute as hazardous terrain dealing 3d6 fire damage."
worn.helm-of-zeal.name: 'Helm of Zeal'
worn.helm-of-zeal.description: "A +2 item bonus to the Divine Skill of the deity it was made for. Rally to the Cause (free action, once per day): gain 1 Focus Point for a devotion spell, lost at the end of your turn. Divine Fervor (free action, once per day, after your champion's reaction): gain an extra reaction for your champion's reaction until your next turn."
worn.helm-of-zeal-greater.name: 'Helm of Zeal (Greater)'
worn.helm-of-zeal-greater.description: "A +3 item bonus to the Divine Skill of the deity it was made for. Rally to the Cause (free action, once per day): gain 1 Focus Point for a devotion spell, lost at the end of your turn. Divine Fervor (free action, once per hour, after your champion's reaction): gain an extra reaction for your champion's reaction until your next turn."
worn.humbug-pocket.name: 'Humbug Pocket'
worn.humbug-pocket.description: 'Holds one item of light Bulk. A +2 item bonus to Society checks and to Stealth checks to Conceal an Object in it; it supplies materials to Create a Forgery. Papers Please (1 action, once per hour): Create a Forgery of a document that crumbles after an hour.'
worn.humbug-pocket-greater.name: 'Humbug Pocket (Greater)'
worn.humbug-pocket-greater.description: 'Holds one item of light Bulk. A +3 item bonus to Society checks and to Stealth checks to Conceal an Object in it; it supplies materials to Create a Forgery. Papers Please (1 action, once per hour): Create a Forgery of a document that crumbles after an hour, up to five alike.'
worn.inexplicable-apparatus.name: 'Inexplicable Apparatus'
worn.inexplicable-apparatus.description: 'A +3 item bonus to Crafting checks to Craft, Earn Income and Repair; crafting takes at least 1 day, and extra days progress faster. Inexplicable Patch (3 actions, once per day): an item within 5 feet is repaired for 10 minutes, as 3rd-rank mending.'
worn.lifting-belt.name: 'Lifting Belt'
worn.lifting-belt.description: 'A +1 item bonus to Athletics checks; you are encumbered past 6 + Strength Bulk and can carry 11 + Strength. Assisted Lift (2 actions): lift an object of up to 8 Bulk as if it were weightless until the end of your next turn.'
worn.living-mantle.name: 'Living Mantle'
worn.living-mantle.description: 'A +2 item bonus to Nature checks; no effects from severe cold and heat. Druidic Secrets (free action, once per day): gain 1 Focus Point for an order spell, lost at the end of your turn.'
worn.living-mantle-greater.name: 'Living Mantle (Greater)'
worn.living-mantle-greater.description: 'A +3 item bonus to Nature checks; no effects from extreme cold and heat. Druidic Secrets (free action, once per day): gain 1 Focus Point for an order spell, lost at the end of your turn.'
worn.lovers-gloves.name: "Lover's Gloves"
worn.lovers-gloves.description: 'A +1 item bonus to Diplomacy checks. Bond (1 action, once per day): a willing creature you feel strongly about gains a +1 status bonus to saves and 10 temporary Hit Points for 10 minutes; if the feeling is shared, you do too, and a success against a negative emotion effect is a critical success for both.'
worn.mages-hat.name: "Mage's Hat"
worn.mages-hat.description: 'A +1 item bonus to Arcana checks, and prestidigitation as an arcane innate cantrip.'
worn.mages-hat-greater.name: "Mage's Hat (Greater)"
worn.mages-hat-greater.description: 'A +2 item bonus to Arcana checks, and prestidigitation as an arcane innate cantrip. Hat Spell (cast a spell, once per day): cast the 4th-rank arcane summon spell woven into it (an arcane prepared caster can swap it when investing).'
worn.masquerade-scarf.name: 'Masquerade Scarf'
worn.masquerade-scarf.description: 'Masquerade (1 minute, once per day): the scarf casts 1st-rank illusory disguise on you, which ends if it is removed; the scarf can change or vanish as part of it.'
worn.masquerade-scarf.options.illusory-disguise.name: 'Masquerade'
worn.masquerade-scarf-greater.name: 'Masquerade Scarf (Greater)'
worn.masquerade-scarf-greater.description: 'Masquerade (2 actions, at will): the scarf casts 2nd-rank illusory disguise on you, which ends if it is removed; the scarf can change or vanish as part of it.'
worn.masquerade-scarf-greater.options.illusory-disguise.name: 'Masquerade'
worn.messengers-ring.name: "Messenger's Ring"
worn.messengers-ring.description: 'A +2 item bonus to Diplomacy checks, and message as an arcane innate spell at will. Dispatch Messenger (1 minute, once per day): the ring casts animal messenger.'
worn.messengers-ring.options.animal-messenger.name: 'Dispatch Messenger'
worn.messengers-ring-greater.name: "Messenger's Ring (Greater)"
worn.messengers-ring-greater.description: 'A +3 item bonus to Diplomacy checks, and message as an arcane innate spell at will. Dispatch Messenger (1 minute, once per day): the ring casts animal messenger. Sending (3 actions, once per hour): the ring casts sending.'
worn.messengers-ring-greater.options.animal-messenger.name: 'Dispatch Messenger'
worn.messengers-ring-greater.options.sending.name: 'Sending'
worn.necklace-of-allure.name: 'Necklace of Allure'
worn.necklace-of-allure.description: 'Apex (Charisma). A +2 item bonus to Deception and Diplomacy checks. Win Them Over (2 actions, once per hour): cast 4th-rank charm (DC 38).'
worn.necklace-of-allure.options.charm.name: 'Win Them Over'
worn.obsidian-goggles.name: 'Obsidian Goggles'
worn.obsidian-goggles.description: 'A +1 item bonus to Perception checks involving sight. Darkvision (1 action, once per day): gain darkvision for 1 hour.'
worn.obsidian-goggles.actions.darkvision.name: 'Darkvision'
worn.obsidian-goggles-greater.name: 'Obsidian Goggles (Greater)'
worn.obsidian-goggles-greater.description: 'A +2 item bonus to Perception checks involving sight. Darkvision (1 action): gain darkvision until you deactivate it or stop investing the goggles.'
worn.obsidian-goggles-greater.actions.darkvision.name: 'Darkvision'
worn.obsidian-goggles-major.name: 'Obsidian Goggles (Major)'
worn.obsidian-goggles-major.description: 'A +3 item bonus to Perception checks involving sight. Darkvision (1 action): gain greater darkvision until you deactivate it or stop investing the goggles.'
worn.obsidian-goggles-major.actions.darkvision.name: 'Darkvision'
worn.pendant-of-the-occult.name: 'Pendant of the Occult'
worn.pendant-of-the-occult.description: 'A +1 item bonus to Occultism checks, and guidance as an occult innate cantrip.'
worn.pendant-of-the-occult-greater.name: 'Pendant of the Occult (Greater)'
worn.pendant-of-the-occult-greater.description: 'A +2 item bonus to Occultism checks, and guidance as an occult innate cantrip. Dream Message (once per day): cast 4th-rank dream message.'
worn.pendant-of-the-occult-greater.options.dream-message.name: 'Dream Message'
worn.persona-mask.name: 'Persona Mask'
worn.persona-mask.description: 'A +1 item bonus to Performance checks to act, orate, do comedy or sing. Assume Role (1 action): the mask shows a dramatic character of your choice.'
worn.persona-mask-greater.name: 'Persona Mask (Greater)'
worn.persona-mask-greater.description: 'A +2 item bonus to Performance checks to act, orate, do comedy or sing. Assume Role (1 action): the mask shows a dramatic character of your choice. Sacrifice Role (reaction, once per day, fortune): when you fail a Performance check it helps, change its character and reroll, taking the second result.'
worn.primeval-mistletoe.name: 'Primeval Mistletoe'
worn.primeval-mistletoe.description: 'A primal locus, and a +1 item bonus to Nature checks. Anoint (2 actions, once per 10 minutes): cast runic weapon on a wooden weapon or runic body on a creature. Bind (2 actions, once per day): cast one with plants on yourself, becoming a vine on a tree you touch.'
worn.primeval-mistletoe.options.runic-weapon.name: 'Anoint (runic weapon)'
worn.primeval-mistletoe.options.runic-body.name: 'Anoint (runic body)'
worn.primeval-mistletoe.options.one-with-plants.name: 'Bind'
worn.primeval-mistletoe-greater.name: 'Primeval Mistletoe (Greater)'
worn.primeval-mistletoe-greater.description: 'A primal locus, and a +2 item bonus to Nature checks. Anoint (2 actions, once per 10 minutes): cast 6th-rank runic weapon on a wooden weapon or runic body on a creature. Bind (2 actions, once per day): cast one with plants on yourself, becoming a vine on a tree you touch. Cultivate (2 actions, once per day): plant it to make a field of life.'
worn.primeval-mistletoe-greater.options.runic-weapon.name: 'Anoint (runic weapon)'
worn.primeval-mistletoe-greater.options.runic-body.name: 'Anoint (runic body)'
worn.primeval-mistletoe-greater.options.one-with-plants.name: 'Bind'
worn.primeval-mistletoe-greater.options.field-of-life.name: 'Cultivate'
worn.prognostic-veil.name: 'Prognostic Veil'
worn.prognostic-veil.description: 'A +2 item bonus to Religion checks. Remember the Future (free action, once per day): gain 1 Focus Point for a revelation spell, lost at the end of your turn. Twist the Skeins of Fate (reaction, once per day, while cursebound): an ally within 30 feet gets a status bonus equal to your cursebound value to a saving throw.'
worn.prognostic-veil-greater.name: 'Prognostic Veil (Greater)'
worn.prognostic-veil-greater.description: 'A +3 item bonus to Religion checks. Remember the Future (free action, once per day): gain 1 Focus Point for a revelation spell, lost at the end of your turn. Twist the Skeins of Fate (reaction, once per day, while cursebound): an ally within 30 feet gets a status bonus equal to your cursebound value to a saving throw or attack roll.'
worn.propulsive-boots.name: 'Propulsive Boots'
worn.propulsive-boots.description: 'A +5-foot item bonus to your land Speed and to your climb and swim Speeds. Quickening Stomp (1 action, once per day): quickened for 1 minute; the extra action can Stride, Climb or Swim.'
worn.retrieval-belt.name: 'Retrieval Belt'
worn.retrieval-belt.description: 'An extradimensional space for one item of 1 Bulk or less each, which only the investor can store and retrieve. Store Item (1 action); Retrieve Item (free action, to a free hand; then neither again for 1 minute).'
worn.retrieval-belt-greater.name: 'Retrieval Belt (Greater)'
worn.retrieval-belt-greater.description: 'An extradimensional space for up to three items of 1 Bulk or less each, which only the investor can store and retrieve. Store Item (1 action); Retrieve Item (free action, to a free hand; then neither again for 1 minute).'
worn.retrieval-belt-major.name: 'Retrieval Belt (Major)'
worn.retrieval-belt-major.description: 'An extradimensional space for up to 10 items of 1 Bulk or less each, which only the investor can store and retrieve. Store Item (1 action); Retrieve Item (free action, to a free hand; then neither again for 1 minute).'
worn.ring-of-climbing.name: 'Ring of Climbing'
worn.ring-of-climbing.description: 'A climb Speed equal to half your land Speed (after penalties).'
worn.ring-of-lies.name: 'Ring of Lies'
worn.ring-of-lies.description: 'A +2 item bonus to Deception checks. Sweeten Lies (2 actions, once per day): a snap of your fingers casts honeyed words on you, with no sign of a spell.'
worn.ring-of-lies.options.honeyed-words.name: 'Sweeten Lies'
worn.ring-of-maniacal-devices.name: 'Ring of Maniacal Devices'
worn.ring-of-maniacal-devices.description: "Pull a thieves' toolkit from the ring (Interact): a +2 item bonus to Disable a Device and Pick a Lock, and to Crafting to Craft and Repair snares and traps. Fireball Trap (10 minutes, once per day): a rune trap holding fireball; one at a time."
worn.ring-of-maniacal-devices-greater.name: 'Ring of Maniacal Devices (Greater)'
worn.ring-of-maniacal-devices-greater.description: "Pull a thieves' toolkit from the ring (Interact): a +3 item bonus to Disable a Device and Pick a Lock, and to Crafting to Craft and Repair snares and traps. Fireball Trap (10 minutes, once per day): a rune trap holding 7th-rank howling blizzard or fireball; one at a time."
worn.ring-of-sigils.name: 'Ring of Sigils'
worn.ring-of-sigils.description: 'Sigil as an arcane innate cantrip. Track Sigil (1 action, once per 10 minutes): learn the direction to your latest sigil within 5 miles.'
worn.ring-of-sigils-greater.name: 'Ring of Sigils (Greater)'
worn.ring-of-sigils-greater.description: 'Sigil as an arcane innate cantrip. Track Sigil (1 action, once per 10 minutes): learn the direction to your latest sigil within 100 miles; on a creature, also whether it lives, how far it is and its conditions.'
worn.ring-of-sustenance.name: 'Ring of Sustenance'
worn.ring-of-sustenance.description: 'After a week worn and invested, you need no food or drink, and 2 hours of sleep rest you as 8.'
worn.ring-of-swimming.name: 'Ring of Swimming'
worn.ring-of-swimming.description: 'A swim Speed equal to half your land Speed (after penalties).'
worn.sanguine-pendant.name: 'Sanguine Pendant'
worn.sanguine-pendant.description: "Only a sorcerer of its bloodline can invest it. A +2 item bonus to both of your bloodline skills. Blood's Call (free action, once per day): gain 1 Focus Point for a bloodline spell, lost at the end of your turn."
worn.sanguine-pendant-greater.name: 'Sanguine Pendant (Greater)'
worn.sanguine-pendant-greater.description: "Only a sorcerer of its bloodline can invest it. A +3 item bonus to both of your bloodline skills. Blood's Call (free action, once per day): gain 1 Focus Point for a bloodline spell, lost at the end of your turn."
worn.sash-of-prowess.name: 'Sash of Prowess'
worn.sash-of-prowess.description: 'A +2 item bonus to Acrobatics and Athletics checks. Effortless Mastery (free action, once per day): an Acrobatics or Athletics success becomes a critical success. Reserves of Inner Strength (free action, once per day): gain 1 Focus Point for a qi spell, lost at the end of your turn.'
worn.sash-of-prowess-greater.name: 'Sash of Prowess (Greater)'
worn.sash-of-prowess-greater.description: 'A +3 item bonus to Acrobatics and Athletics checks. Effortless Mastery (free action, once per day): an Acrobatics or Athletics success becomes a critical success. Reserves of Inner Strength (free action, once per day): gain 1 Focus Point for a qi spell, lost at the end of your turn.'
worn.shadow-signet.name: 'Shadow Signet'
worn.shadow-signet.description: 'Free action (spellshape): if your next action casts a spell attack against AC, attack Fortitude DC or Reflex DC instead, for every target.'
worn.shining-symbol.name: 'Shining Symbol'
worn.shining-symbol.description: "It becomes your deity's symbol; a +1 item bonus to Religion checks; dim light in a 20-foot emanation. Spiritual Light (2 actions, once per day): bright light for 10 minutes, a -1 status penalty to Deception and Stealth for creatures in it."
worn.shining-symbol-greater.name: 'Shining Symbol (Greater)'
worn.shining-symbol-greater.description: "It becomes your deity's symbol; a +2 item bonus to Religion checks; dim light in a 20-foot emanation. Spiritual Light (2 actions, once per day): bright light for 10 minutes, a -2 status penalty to Deception and Stealth for creatures in it, and your enemies in it gain weakness 5 to spirit damage."
worn.shining-symbol-major.name: 'Shining Symbol (Major)'
worn.shining-symbol-major.description: "It becomes your deity's symbol; a +3 item bonus to Religion checks; dim light in a 20-foot emanation. Spiritual Light (2 actions, once per day): bright light for 10 minutes, a -3 status penalty to Deception and Stealth for creatures in it, and your enemies in it gain weakness 10 to spirit damage."
worn.sleeves-of-storage.name: 'Sleeves of Storage'
worn.sleeves-of-storage.description: 'Each sleeve holds 5 Bulk (no item over 1 Bulk); an Interact with one hand stores or retrieves an item. An empty sleeve can hold your familiar for up to 1 hour.'
worn.sleeves-of-storage-greater.name: 'Sleeves of Storage (Greater)'
worn.sleeves-of-storage-greater.description: 'Each sleeve holds 20 Bulk (no item over 1 Bulk); an Interact with one hand stores or retrieves an item. An empty sleeve can hold your familiar for up to 4 hours.'
worn.symbol-of-conflict.name: 'Symbol of Conflict'
worn.symbol-of-conflict.description: 'Only a holy or unholy character can invest it. A +1 item bonus to Religion and a +1 circumstance bonus to saves against holy and unholy effects. Presence (2 actions, once per day): the symbol casts bane or bless (DC 18, counteract +8).'
worn.symbol-of-conflict.options.bane.name: 'Presence (bane)'
worn.symbol-of-conflict.options.bless.name: 'Presence (bless)'
worn.symbol-of-conflict-greater.name: 'Symbol of Conflict (Greater)'
worn.symbol-of-conflict-greater.description: 'Only a holy or unholy character can invest it. A +2 item bonus to Religion and a +1 circumstance bonus to saves against holy and unholy effects. Presence (2 actions, once per day): the symbol casts 4th-rank bane or bless, divine wrath or cleanse affliction (DC 27, counteract +17).'
worn.symbol-of-conflict-greater.options.bane.name: 'Presence (bane)'
worn.symbol-of-conflict-greater.options.bless.name: 'Presence (bless)'
worn.symbol-of-conflict-greater.options.divine-wrath.name: 'Presence (divine wrath)'
worn.symbol-of-conflict-greater.options.cleanse-affliction.name: 'Presence (cleanse affliction)'
worn.symbol-of-conflict-major.name: 'Symbol of Conflict (Major)'
worn.symbol-of-conflict-major.description: 'Only a holy or unholy character can invest it. A +3 item bonus to Religion and a +1 circumstance bonus to saves against holy and unholy effects. Presence (2 actions, once per day): the symbol casts 6th-rank bane or bless, divine wrath or cleanse affliction (DC 38, counteract +28).'
worn.symbol-of-conflict-major.options.bane.name: 'Presence (bane)'
worn.symbol-of-conflict-major.options.bless.name: 'Presence (bless)'
worn.symbol-of-conflict-major.options.divine-wrath.name: 'Presence (divine wrath)'
worn.symbol-of-conflict-major.options.cleanse-affliction.name: 'Presence (cleanse affliction)'
worn.third-eye.name: 'Third Eye'
worn.third-eye.description: "A +3 item bonus to Perception checks; you see every magic aura within 30 feet (as 9th-rank detect magic) and can Seek to read a creature's health and conditions. Truesight (2 actions, once per day): gain 8th-rank truesight."
worn.third-eye.options.truesight.name: 'Truesight'
worn.trackers-goggles.name: "Tracker's Goggles"
worn.trackers-goggles.description: 'A +1 item bonus to Survival checks to Sense Direction and Track; after failing to Track, try again after 30 minutes.'
worn.trackers-goggles-greater.name: "Tracker's Goggles (Greater)"
worn.trackers-goggles-greater.description: 'A +2 item bonus to Survival checks to Sense Direction and Track; after failing to Track, try again after 15 minutes.'
worn.ventriloquists-ring.name: "Ventriloquist's Ring"
worn.ventriloquists-ring.description: 'A +1 item bonus to Deception checks. Throw Voice (2 actions, once per day): ventriloquism (DC 19).'
worn.ventriloquists-ring.options.ventriloquism.name: 'Throw Voice'
worn.ventriloquists-ring-greater.name: "Ventriloquist's Ring (Greater)"
worn.ventriloquists-ring-greater.description: 'A +2 item bonus to Deception checks. Throw Voice (2 actions): 2nd-rank ventriloquism (DC 27).'
worn.ventriloquists-ring-greater.options.ventriloquism.name: 'Throw Voice'
worn.voyagers-pack.name: "Voyager's Pack"
worn.voyagers-pack.description: 'A +3 item bonus to Survival checks, and you can Track a creature that teleported. It holds a type II spacious pouch with a climbing kit that refills each dawn. Group Voyage (10 minutes): you and up to four creatures roped to it travel by 7th-rank interplanar teleport or teleport, with a DC 45 Survival check to land closer.'
worn.voyagers-pack.options.teleport.name: 'Group Voyage (teleport)'
worn.voyagers-pack.options.interplanar-teleport.name: 'Group Voyage (interplanar teleport)'
worn.wayfinder.name: 'Wayfinder'
worn.wayfinder.description: 'A compass with a slot for an aeon stone: invested together, they count as one item, and the stone gives its resonant power. Light (1 action): the wayfinder is the target of 1st-rank light. Two wayfinders with invested stones cancel each other.'
worn.wayfinder.options.light.name: 'Light'
worn.whisper-of-the-first-lie.name: 'Whisper of the First Lie'
worn.whisper-of-the-first-lie.description: 'A +3 item bonus to Deception checks, and you can try to counteract effects that would make you tell the truth or detect your lies (rank 9, +35). Release the Lie (3 actions, once ever): fabricated truth (DC 47), and the vial is empty.'
worn.whisper-of-the-first-lie.options.fabricated-truth.name: 'Release the Lie'
worn.winged-sandals.name: 'Winged Sandals'
worn.winged-sandals.description: 'When you fall, they cast gentle landing on you (once per 10 minutes). Awaken Wings (2 actions, once per day): a 30-foot fly Speed for 10 minutes.'
worn.winged-sandals.actions.awaken-wings.name: 'Awaken Wings'
