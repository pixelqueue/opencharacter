# Player Core 2's catfolk: its ancestry or heritage, heritages and feats, in text written for the
# pack.
ancestries.catfolk.choices.boosts.options.alternate.choices.free.prompt: 'Two free attribute boosts'
ancestries.catfolk.choices.boosts.options.alternate.name: 'Two free boosts instead'
ancestries.catfolk.choices.boosts.options.standard.choices.free.prompt: 'A free attribute boost'
ancestries.catfolk.choices.boosts.options.standard.name: "The ancestry's boosts and flaw"
ancestries.catfolk.choices.boosts.prompt: 'Ancestry attribute boosts'
ancestries.catfolk.choices.heritage.prompt: 'Heritage'
ancestries.catfolk.name: 'Catfolk'
ancestries.catfolk.description: "Curious, nimble feline wanderers. 8 Hit Points, Medium, 25 feet. Boosts: Dexterity, Charisma, free; flaw: Wisdom. Low-light vision. Land on Your Feet: a fall deals you half damage and you don't land prone."
heritages.clawed-catfolk.name: 'Clawed Catfolk'
heritages.clawed-catfolk.description: 'You gain a claw unarmed attack: 1d6 slashing, brawling group, agile, finesse and unarmed.'
heritages.hunting-catfolk.name: 'Hunting Catfolk'
heritages.hunting-catfolk.description: "Imprecise scent, 30 feet, and a +2 circumstance bonus to Track a creature or object you've smelled before."
heritages.jungle-catfolk.name: 'Jungle Catfolk'
heritages.jungle-catfolk.description: 'You ignore difficult terrain from undergrowth, and greater difficult terrain from undergrowth is only difficult terrain for you.'
heritages.liminal-catfolk.name: 'Liminal Catfolk'
heritages.liminal-catfolk.description: 'You can cast detect magic as an occult innate cantrip at will, and get a +1 circumstance bonus to Occultism checks to Recall Knowledge about creatures from other planes.'
heritages.nine-lives-catfolk.name: 'Nine Lives Catfolk'
heritages.nine-lives-catfolk.description: "While dying, your recovery checks' DC doesn't add your dying value (usually DC 10). You gain the Diehard feat."
heritages.sharp-eared-catfolk.name: 'Sharp-Eared Catfolk'
heritages.sharp-eared-catfolk.description: "A +2 circumstance bonus to Seek undetected creatures within 30 feet you could hear. Once a round, you can Point Out a creature you're aware of by sound to all allies as a free action."
heritages.winter-catfolk.name: 'Winter Catfolk'
heritages.winter-catfolk.description: 'Cold resistance equal to half your level (minimum 1), and environmental cold is one step less extreme for you.'
feats.ancestry.cat-nap.name: 'Cat Nap'
feats.ancestry.cat-nap.description: 'Once an hour (concentrate, exploration): a 10-minute nap gives you temporary Hit Points equal to your level for 1 hour.'
feats.ancestry.cat-nap.actions.cat-nap.name: 'Cat Nap'
feats.ancestry.cats-luck.name: "Cat's Luck"
feats.ancestry.cats-luck.description: 'Once a day, a free action (fortune) when you fail a Reflex save: reroll it and use the better result.'
feats.ancestry.catfolk-dance.name: 'Catfolk Dance'
feats.ancestry.catfolk-dance.description: "1 action: Acrobatics against an adjacent creature's Reflex DC. Success: a -2 circumstance penalty to its Reflex saves until the start of your next turn; critical success: it's also off-guard until then."
feats.ancestry.catfolk-dance.actions.catfolk-dance.name: 'Catfolk Dance'
feats.ancestry.catfolk-dance.actions.catfolk-dance.params.dc.name: 'DC'
feats.ancestry.catfolk-dance.actions.catfolk-dance.participants.target.name: 'Adjacent creature'
feats.ancestry.catfolk-lore.name: 'Catfolk Lore'
feats.ancestry.catfolk-lore.description: "You're trained in Acrobatics and Survival (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Catfolk Lore."
feats.ancestry.catfolk-weapon-familiarity.name: 'Catfolk Weapon Familiarity'
feats.ancestry.catfolk-weapon-familiarity.description: 'You have access to uncommon catfolk weapons, and familiarity with catfolk weapons and the kama, kukri, scimitar and sickle: martial ones count as simple and advanced ones as martial for you. From 5th level, their critical specialization effects.'
feats.ancestry.saber-teeth.name: 'Saber Teeth'
feats.ancestry.saber-teeth.description: 'You gain a jaws unarmed attack: 1d6 piercing, brawling group, unarmed.'
feats.ancestry.well-met-traveler.name: 'Well-Met Traveler'
feats.ancestry.well-met-traveler.description: "You're trained in Diplomacy (or a skill of your choice if you already were), and gain the Hobnobber skill feat."
feats.ancestry.climbing-claws.name: 'Climbing Claws'
feats.ancestry.climbing-claws.description: 'You gain a climb Speed of 10 feet.'
feats.ancestry.graceful-guidance.name: 'Graceful Guidance'
feats.ancestry.graceful-guidance.description: "You can Aid an ally's Reflex save, preparing with an action on your turn as usual."
feats.ancestry.light-paws.name: 'Light Paws'
feats.ancestry.light-paws.description: '2 actions: Stride then Step, or Step then Stride, ignoring difficult terrain during this movement.'
feats.ancestry.lucky-break.name: 'Lucky Break'
feats.ancestry.lucky-break.description: "Cat's Luck also triggers on a failed or critically failed Fortitude or Will save, Acrobatics check or Athletics check; still once a day."
feats.ancestry.lucky-break.prerequisites.cats-luck: "Cat's Luck"
feats.ancestry.pride-hunter.name: 'Pride Hunter'
feats.ancestry.pride-hunter.description: 'You can use lesser cover from your allies to Hide.'
feats.ancestry.springing-leaper.name: 'Springing Leaper'
feats.ancestry.springing-leaper.description: "You can Leap as 2 actions to double your vertical Leap, or 3 actions to triple it, and you don't automatically fail a Long Jump in a different direction than your Stride."
feats.ancestry.springing-leaper.prerequisites.expert: 'Expert in Athletics'
feats.ancestry.well-groomed.name: 'Well-Groomed'
feats.ancestry.well-groomed.description: 'A +2 circumstance bonus to saves against diseases, and a success on such a save is a critical success; with another ability that improves the save this way, a critical failure is a failure too.'
feats.ancestry.aggravating-scratch.name: 'Aggravating Scratch'
feats.ancestry.aggravating-scratch.description: 'A critical hit with a claw Strike deals 1d4 persistent poison damage too.'
feats.ancestry.aggravating-scratch.prerequisites.claws: 'A claw unarmed attack'
feats.ancestry.evade-doom.name: 'Evade Doom'
feats.ancestry.evade-doom.description: "When you would become doomed, a DC 17 flat check: on a success, you aren't."
feats.ancestry.luck-of-the-clowder.name: 'Luck of the Clowder'
feats.ancestry.luck-of-the-clowder.description: "When you reroll with Cat's Luck, creatures you choose within 10 feet that just failed against the same effect can reroll too, using the better result."
feats.ancestry.luck-of-the-clowder.prerequisites.cats-luck: "Cat's Luck"
feats.ancestry.predators-growl.name: "Predator's Growl"
feats.ancestry.predators-growl.description: 'A reaction when you Seek a hidden or undetected creature successfully: Demoralize it, without the -4 for not sharing a language.'
feats.ancestry.predators-growl.prerequisites.expert: 'Expert in Intimidation'
feats.ancestry.silent-step.name: 'Silent Step'
feats.ancestry.silent-step.description: '1 action (flourish): Step, then Hide or Sneak (meeting their requirements as usual).'
feats.ancestry.wary-skulker.name: 'Wary Skulker'
feats.ancestry.wary-skulker.description: 'You can Scout and Avoid Notice at the same time while exploring.'
feats.ancestry.black-cat-curse.name: 'Black Cat Curse'
feats.ancestry.black-cat-curse.description: 'Once a day, a reaction (misfortune, occult) when a creature you see within 30 feet would succeed at a save: it rerolls and uses the worse result.'
feats.ancestry.caterwaul.name: 'Caterwaul'
feats.ancestry.caterwaul.description: 'Once a day, a reaction (auditory, concentrate, emotion, mental) when an ally within 30 feet would drop to 0 HP but not die: it stays at 1 Hit Point, and its wounded value still rises by 1.'
feats.ancestry.elude-trouble.name: 'Elude Trouble'
feats.ancestry.elude-trouble.description: "A reaction when a creature misses you with a melee attack: Stride up to your Speed without triggering that creature's reactions."
feats.ancestry.reliable-luck.name: 'Reliable Luck'
feats.ancestry.reliable-luck.description: "You can use Cat's Luck once an hour instead of once a day."
feats.ancestry.reliable-luck.prerequisites.cats-luck: "Cat's Luck"
feats.ancestry.ten-lives.name: 'Ten Lives'
feats.ancestry.ten-lives.description: "When you would die, a DC 17 flat check: on a success you're at 0 Hit Points and dying 1 less than would kill you (usually dying 3) instead."
feats.ancestry.ten-lives.prerequisites.evade-doom: 'Evade Doom'
