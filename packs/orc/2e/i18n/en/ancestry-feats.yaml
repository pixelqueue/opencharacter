effects.speed-circumstance-penalty.name: Speed penalty (circumstance)
effects.speed-status-penalty.name: Speed penalty (status)
feats.ancestry.accursed-claws.description: A critical hit with a claw Strike deals 1d4 persistent mental damage too.
feats.ancestry.accursed-claws.name: Accursed Claws
feats.ancestry.accursed-claws.prerequisites.claws: A claw unarmed attack
feats.ancestry.adapted-cantrip.description: Choose a cantrip from another tradition; you can prepare it or add it to your repertoire, and cast it as a spell of your class's tradition. Requires the spellcasting class feature.
feats.ancestry.adapted-cantrip.prerequisites.spellcasting: 'The spellcasting class feature'
feats.ancestry.adapted-cantrip.name: Adapted Cantrip
feats.ancestry.adaptive-adept.description: Choose a cantrip or 1st-rank spell of your Adapted Cantrip's tradition; you gain it as you did that cantrip (not its heightened versions). Requires Adapted Cantrip and the ability to cast 3rd-rank spells.
feats.ancestry.adaptive-adept.prerequisites.rank: 'You can cast 3rd-rank spells'
feats.ancestry.adaptive-adept.name: Adaptive Adept
feats.ancestry.adaptive-adept.prerequisites.adapted-cantrip: Adapted Cantrip
feats.ancestry.advanced-general-training.choices.feat.prompt: General feat
feats.ancestry.advanced-general-training.description: You gain a general feat of 7th level or lower whose prerequisites you meet. You can take this feat more than once.
feats.ancestry.advanced-general-training.name: Advanced General Training
feats.ancestry.ageless-patience.description: Taking twice as long on a Perception or skill check of 1 action or more gives a +2 circumstance bonus, and a natural 1 doesn't lower the degree of success.
feats.ancestry.ageless-patience.name: Ageless Patience
feats.ancestry.ancestral-longevity.choices.skill.prompt: Skill trained until your next daily preparations
feats.ancestry.ancestral-longevity.description: At your daily preparations, you become trained in one skill of your choice until you prepare again. This training can't satisfy prerequisites or receive skill increases.
feats.ancestry.ancestral-longevity.name: Ancestral Longevity
feats.ancestry.ancestral-suspicion.description: A +2 circumstance bonus to saves against effects that would control you and to Sense Motive checks to tell whether a creature is so influenced; a success on such a save is a critical success.
feats.ancestry.ancestral-suspicion.name: Ancestral Suspicion
feats.ancestry.anchoring-roots.description: 'You gain Steady Balance, even untrained in Acrobatics, and the Anchor action: until you move, a +2 circumstance bonus (+4 for a root leshy) to your Fortitude or Reflex DC against Reposition, Shove and Trip and to saves against being moved or knocked prone, and forced movement moves you half as far.'
feats.ancestry.anchoring-roots.name: Anchoring Roots
feats.ancestry.angelkin.description: "You descend from an angel: you're trained in Society (or another skill if you already were), know the Empyrean language, and gain Multilingual."
feats.ancestry.angelkin.name: Angelkin
feats.ancestry.animal-accomplice.description: You gain a familiar, an animal of your choice (often one that burrows).
feats.ancestry.animal-accomplice.name: Animal Accomplice
feats.ancestry.animal-elocutionist.description: You can speak with animals and use Diplomacy with them, and you gain a +1 circumstance bonus to Make an Impression on animals.
feats.ancestry.animal-elocutionist.name: Animal Elocutionist
feats.ancestry.athletic-might.description: A success on an Athletics check to Climb or Swim is a critical success.
feats.ancestry.athletic-might.name: Athletic Might
feats.ancestry.avenge-ally.actions.avenge-ally.name: Avenge Ally
feats.ancestry.avenge-ally.actions.avenge-ally.steps.weapon.prompt: Weapon
feats.ancestry.avenge-ally.description: '1 action, once every 10 minutes, within 30 feet of a dying ally: make a Strike, rolling the attack twice and taking the higher.'
feats.ancestry.avenge-ally.name: Avenge Ally
feats.ancestry.bark-and-tendril.description: You can cast entangling flora and oaken resilience as 2nd-rank primal innate spells once a day each.
feats.ancestry.bark-and-tendril.name: Bark and Tendril
feats.ancestry.beast-trainer.choices.feat.prompt: Pet or Train Animal
feats.ancestry.beast-trainer.description: You're trained in Nature (a skill of your choice if you already are), and gain your choice of the Pet or Train Animal feat.
feats.ancestry.beast-trainer.name: Beast Trainer
feats.ancestry.bestial-manifestation.choices.attack.prompt: Unarmed attack
feats.ancestry.bestial-manifestation.description: "You gain an unarmed attack of your choice, brawling group: claw (1d4 slashing, agile, finesse, versatile piercing), hoof (1d6 bludgeoning, finesse), jaws (1d6 piercing, finesse) or tail (1d4 bludgeoning, agile, finesse). 1st level only; it can't be retrained or changed."
feats.ancestry.bestial-manifestation.name: Bestial Manifestation
feats.ancestry.blessed-blood.description: 'Your blood works like holy water: a fiend, undead or creature weak to holy that drinks it or bites you for piercing or slashing damage takes 1d6 holy spirit damage. +4 circumstance bonus to Craft holy water with it.'
feats.ancestry.blessed-blood.name: Blessed Blood
feats.ancestry.bloody-blows.description: A critical hit with a lethal unarmed attack deals 1d4 persistent bleed damage.
feats.ancestry.bloody-blows.name: Bloody Blows
feats.ancestry.boulder-roll.description: Two actions. Step into the space of a foe your size or smaller, pushing it into the space behind it. It can attempt a Fortitude save against your Athletics DC to block you, taking bludgeoning damage equal to your level + your Strength modifier unless it critically succeeds.
feats.ancestry.boulder-roll.name: Boulder Roll
feats.ancestry.boulder-roll.prerequisites.rock-runner: Rock Runner
feats.ancestry.bounce-back.description: "Free action once a day, when you lose the dying condition: your wounded value doesn't rise."
feats.ancestry.bounce-back.name: Bounce Back
feats.ancestry.brine-may.description: A success to Swim is a critical success, and you don't sink when you end your turn in water without a successful Swim.
feats.ancestry.brine-may.name: Brine May
feats.ancestry.burn-it.description: Your fire spells and alchemical items gain a status bonus to damage of half the spell's rank or a quarter of the item's level (at least +1), and persistent fire damage you deal gains a +1 status bonus.
feats.ancestry.burn-it.name: Burn It!
feats.ancestry.call-of-the-green-man.description: You can cast plant form as a 5th-rank primal innate spell once a day (6th from 17th level).
feats.ancestry.call-of-the-green-man.name: Call of the Green Man
feats.ancestry.called.description: +1 circumstance bonus to Will saves against mental effects, and a success against a mental effect that would control you is a critical success.
feats.ancestry.called.name: Called
feats.ancestry.callow-may.description: You gain Charming Liar. When you roll Deception for initiative, foes who haven't acted yet are off-guard to you.
feats.ancestry.callow-may.name: Callow May
feats.ancestry.cautious-curiosity.description: You can cast disguise magic and silence as 2nd-rank innate spells once a day each, of your gnome options' arcane or occult tradition, on yourself only.
feats.ancestry.cautious-curiosity.name: Cautious Curiosity
feats.ancestry.cautious-curiosity.prerequisites.innate: An arcane or occult innate spell from a gnome heritage or ancestry feat
feats.ancestry.cave-climber.description: You gain a climb Speed of 10 feet.
feats.ancestry.cave-climber.name: Cave Climber
feats.ancestry.ceaseless-shadows.description: You can Hide or Sneak without cover or concealment, and cover from creatures is one step better for you (lesser to standard, standard to greater).
feats.ancestry.ceaseless-shadows.name: Ceaseless Shadows
feats.ancestry.ceaseless-shadows.prerequisites.distracting-shadows: Distracting Shadows
feats.ancestry.celestial-magic.choices.spells.options.clear-mind.name: Clear mind
feats.ancestry.celestial-magic.choices.spells.options.everlight.name: Everlight
feats.ancestry.celestial-magic.choices.spells.options.humanoid-form.name: Humanoid form
feats.ancestry.celestial-magic.choices.spells.options.revealing-light.name: Revealing light
feats.ancestry.celestial-magic.choices.spells.options.share-life.name: Share life
feats.ancestry.celestial-magic.choices.spells.options.sure-footing.name: Sure footing
feats.ancestry.celestial-magic.choices.spells.prompt: Spells (two)
feats.ancestry.celestial-magic.description: 'Choose two of clear mind, everlight, humanoid form, revealing light, share life and sure footing: you can cast each once a day as a 2nd-rank divine innate spell.'
feats.ancestry.celestial-magic.name: Celestial Magic
feats.ancestry.celestial-magic.prerequisites.lineage: Angelkin, Lawbringer or Musetouched
feats.ancestry.celestial-mercy.description: You can cast cleanse affliction twice a day as a 4th-rank divine innate spell.
feats.ancestry.celestial-mercy.name: Celestial Mercy
feats.ancestry.celestial-mercy.prerequisites.lineage: Angelkin, Lawbringer or Musetouched
feats.ancestry.changeling-lore.description: You're trained in Deception and Occultism (or other skills if you already were), and gain Additional Lore for Hag Lore.
feats.ancestry.changeling-lore.name: Changeling Lore
feats.ancestry.city-scavenger.description: A +1 circumstance bonus to Subsist, and you can Subsist with Society or Survival in a settlement; in a city you can Earn Income at the same time, with a +1 circumstance bonus. An irongut goblin's bonuses are +2.
feats.ancestry.city-scavenger.name: City Scavenger
feats.ancestry.clever-improviser.description: You gain Untrained Improvisation, and you can attempt skill actions that require training while untrained.
feats.ancestry.clever-improviser.name: Clever Improviser
feats.ancestry.cling.description: '1 action after a successful Strike, with a free hand: you hang on to the foe and move with it until you let go, the start of your next turn, or it Escapes against your Acrobatics DC.'
feats.ancestry.cling.name: Cling
feats.ancestry.cloak-of-poison.description: '2 actions once a day: for a minute, a creature that touches you or hits you with an unarmed attack or a melee weapon without reach takes 3d6 poison damage.'
feats.ancestry.cloak-of-poison.name: Cloak of Poison
feats.ancestry.cooperative-nature.description: A +4 circumstance bonus to checks to Aid.
feats.ancestry.cooperative-nature.name: Cooperative Nature
feats.ancestry.cooperative-soul.description: As an expert in the skill you Aid with, a failure or critical failure to Aid is a success.
feats.ancestry.cooperative-soul.name: Cooperative Soul
feats.ancestry.cultural-adaptability.choices.ancestry.prompt: Adopted ancestry
feats.ancestry.cultural-adaptability.choices.feat.prompt: 1st-level ancestry feat of the adopted ancestry
feats.ancestry.cultural-adaptability.description: You gain Adopted Ancestry, choosing another ancestry, and a 1st-level ancestry feat of that ancestry.
feats.ancestry.cultural-adaptability.name: Cultural Adaptability
feats.ancestry.dance-underfoot.description: You can end a successful Tumble Through in a Large or larger enemy's space, and Step Lively into the triggering enemy's space.
feats.ancestry.dance-underfoot.name: Dance Underfoot
feats.ancestry.dance-underfoot.prerequisites.step-lively: Step Lively
feats.ancestry.defy-death.description: Your recovery checks are DC 9 + your dying value (8 + with Toughness). Magic that returns you to life doesn't leave you debilitated for a week.
feats.ancestry.defy-death.name: Defy Death
feats.ancestry.defy-death.prerequisites.orc-ferocity: Orc Ferocity
feats.ancestry.defy-the-darkness.description: You gain greater darkvision, seeing through magical darkness. You can't cast spells, activate items or use abilities with the darkness trait.
feats.ancestry.defy-the-darkness.name: Defy the Darkness
feats.ancestry.defy-the-darkness.prerequisites.darkvision: Darkvision
feats.ancestry.distracting-shadows.description: You can use creatures at least one size larger than you as cover to Hide and Sneak.
feats.ancestry.distracting-shadows.name: Distracting Shadows
feats.ancestry.divine-countermeasures.description: +1 circumstance bonus to saves against divine effects.
feats.ancestry.divine-countermeasures.name: Divine Countermeasures
feats.ancestry.divine-declaration.description: Once a day, you can cast divine decree as a 7th-rank divine innate spell.
feats.ancestry.divine-declaration.name: Divine Declaration
feats.ancestry.divine-wings.description: '2 actions once a day: wings give you a fly Speed equal to your Speed for 10 minutes.'
feats.ancestry.divine-wings.name: Divine Wings
feats.ancestry.dream-may.description: +2 circumstance bonus to saves against sleep and dream effects. Sleep heals you twice as much and lowers drained and doomed by 2.
feats.ancestry.dream-may.name: Dream May
feats.ancestry.dwarven-doughtiness.description: At the end of your turn, your frightened value drops by 2 instead of 1.
feats.ancestry.dwarven-doughtiness.name: Dwarven Doughtiness
feats.ancestry.dwarven-lore.description: You're trained in Crafting and Religion (one you're already trained in becomes a training in a skill of your choice), and you gain Additional Lore for Dwarf Lore.
feats.ancestry.dwarven-lore.name: Dwarven Lore
feats.ancestry.dwarven-reinforcement.description: An hour's work gives an item or a section of a structure a +1 circumstance bonus to its Hardness for 24 hours (+2 if you're a master in Crafting, +3 if legendary).
feats.ancestry.dwarven-reinforcement.name: Dwarven Reinforcement
feats.ancestry.dwarven-reinforcement.prerequisites.expert-crafting: Expert in Crafting
feats.ancestry.dwarven-weapon-familiarity.description: You have access to uncommon dwarf weapons. For proficiency, dwarf weapons, the battle axe, pick and warhammer count as simple if martial and as martial if advanced. From 5th level, critical hits with them get their critical specialization effect.
feats.ancestry.dwarven-weapon-familiarity.name: Dwarven Weapon Familiarity
feats.ancestry.earned-glory.description: You're trained in Performance (or another skill if you already were) and gain Impressive Performance. A critical failure with Performance to Make an Impression on an elf is a failure.
feats.ancestry.earned-glory.name: Earned Glory
feats.ancestry.echoes-in-stone.description: '1 action, standing on stone or earth: you gain imprecise tremorsense 20 feet until the start of your next turn.'
feats.ancestry.echoes-in-stone.name: Echoes in Stone
feats.ancestry.elf-atavism.choices.heritage.prompt: Elf heritage
feats.ancestry.elf-atavism.description: You gain the benefits of an elf heritage of your elven ancestors, if your body allows it. You can take this feat only at 1st level.
feats.ancestry.elf-atavism.name: Elf Atavism
feats.ancestry.elf-step.description: '1 action: you Step 5 feet twice.'
feats.ancestry.elf-step.name: Elf Step
feats.ancestry.elven-lore.description: You're trained in Arcana and Nature (one you're already trained in becomes a training in a skill of your choice), and you gain Additional Lore for Elf Lore.
feats.ancestry.elven-lore.name: Elven Lore
feats.ancestry.elven-weapon-familiarity.description: You have access to uncommon elf weapons. For proficiency, elf weapons, longbows, composite longbows, rapiers, shortbows and composite shortbows count as simple if martial and as martial if advanced. From 5th level, critical hits with them get their critical specialization effect.
feats.ancestry.elven-weapon-familiarity.name: Elven Weapon Familiarity
feats.ancestry.energized-font.description: 'One action, once per day: regain 1 Focus Point, up to your maximum. Requires a focus pool and an innate spell from a gnome heritage or feat that shares a tradition with one of your focus spells.'
feats.ancestry.energized-font.name: Energized Font
feats.ancestry.energized-font.prerequisites.focus: A focus pool
feats.ancestry.energized-font.actions.energize.name: Energized Font
feats.ancestry.energized-font.actions.energize.description: Regain 1 Focus Point (once a day).
feats.ancestry.energized-font.actions.energize.results.energized.name: Focus Point regained
feats.ancestry.eternal-wings.description: Your Divine Wings are always manifested.
feats.ancestry.eternal-wings.name: Eternal Wings
feats.ancestry.eternal-wings.prerequisites.divine-wings: Divine Wings
feats.ancestry.expert-longevity.choices.skill.prompt: Trained skill to be an expert in until your next daily preparations
feats.ancestry.expert-longevity.description: When you pick Ancestral Longevity's skill, you also become an expert in a skill you're trained in, until it expires; then you may retrain a skill increase into either.
feats.ancestry.expert-longevity.name: Expert Longevity
feats.ancestry.expert-longevity.prerequisites.ancestral-longevity: Ancestral Longevity
feats.ancestry.extraplanar-supplication.choices.spell.options.bane.name: Bane
feats.ancestry.extraplanar-supplication.choices.spell.options.bless.name: Bless
feats.ancestry.extraplanar-supplication.choices.spell.prompt: Spell
feats.ancestry.extraplanar-supplication.description: 'Choose bless or bane: you can cast it once a day as a 1st-rank divine innate spell.'
feats.ancestry.extraplanar-supplication.name: Extraplanar Supplication
feats.ancestry.ferocious-beasts.description: Your animal companions, pets, familiars and bonded animals gain Orc Ferocity (and Undying Ferocity's benefit if you have it), with a reaction a round for it.
feats.ancestry.ferocious-beasts.name: Ferocious Beasts
feats.ancestry.ferocious-beasts.prerequisites.companion: Bonded Animal, an animal companion or Pet
feats.ancestry.ferocious-beasts.prerequisites.orc-ferocity: Orc Ferocity
feats.ancestry.fey-fellowship.description: A +2 circumstance bonus to Perception checks and saving throws against fey. In a social meeting with a fey, you can Make an Impression at once with a -5 penalty, and on a failure try again after a minute of conversation.
feats.ancestry.fey-fellowship.name: Fey Fellowship
feats.ancestry.fiendish-magic.choices.spells.options.disguise-magic.name: Disguise magic
feats.ancestry.fiendish-magic.choices.spells.options.false-vitality.name: False vitality
feats.ancestry.fiendish-magic.choices.spells.options.invisibility.name: Invisibility
feats.ancestry.fiendish-magic.choices.spells.options.paranoia.name: Paranoia
feats.ancestry.fiendish-magic.choices.spells.options.see-the-unseen.name: See the unseen
feats.ancestry.fiendish-magic.choices.spells.options.shatter.name: Shatter
feats.ancestry.fiendish-magic.choices.spells.prompt: Spells (two)
feats.ancestry.fiendish-magic.description: 'Choose two of disguise magic, false vitality, invisibility, see the unseen, shatter and paranoia: you can cast each once a day as a 2nd-rank divine innate spell.'
feats.ancestry.fiendish-magic.name: Fiendish Magic
feats.ancestry.fiendish-magic.prerequisites.lineage: Grimspawn, Pitborn or Hellspawn
feats.ancestry.fey-realm-adept.description: You can cast invisibility and revealing light as 2nd-rank primal innate spells once a day each.
feats.ancestry.fey-realm-adept.name: Fey Realm Adept
feats.ancestry.fey-realm-adept.prerequisites.innate: A primal innate spell
feats.ancestry.fey-realm-magic.description: Choose a primal cantrip. You can cast it at will as a primal innate spell, heightened to half your level rounded up.
feats.ancestry.fey-realm-magic.name: Fey Realm Magic
feats.ancestry.fey-realm-magic.choices.cantrip.prompt: Primal cantrip
feats.ancestry.flourish-and-ruin.description: You can cast field of life and tangling creepers as 6th-rank primal innate spells once a day each.
feats.ancestry.flourish-and-ruin.name: Flourish and Ruin
feats.ancestry.folksy-patter.description: You hide a three-word message in idle talk. Your listener needs a DC 20 Perception check to understand it (DC 15 for a halfling or one with this feat, DC 10 for both); eavesdroppers need to beat your Deception DC.
feats.ancestry.folksy-patter.name: Folksy Patter
feats.ancestry.forlorn.description: A +1 circumstance bonus to saving throws against emotion effects, and a success on one is a critical success.
feats.ancestry.forlorn.name: Forlorn
feats.ancestry.general-training.choices.feat.prompt: 1st-level general feat
feats.ancestry.general-training.description: You gain a 1st-level general feat.
feats.ancestry.general-training.name: General Training
feats.ancestry.gnome-obsession.choices.lore.prompt: Lore
feats.ancestry.gnome-obsession.description: 'You gain Additional Lore and Assurance for a Lore of your choice: trained, then expert at 3rd level, master at 7th and legendary at 15th. You can retrain it to another Lore in a day of downtime.'
feats.ancestry.gnome-obsession.name: Gnome Obsession
feats.ancestry.gnome-weapon-familiarity.description: You have access to kukris and uncommon gnome weapons. For proficiency, gnome weapons, the glaive and the kukri count as simple if martial and as martial if advanced. From 5th level, critical hits with them get their critical specialization effect.
feats.ancestry.gnome-weapon-familiarity.name: Gnome Weapon Familiarity
feats.ancestry.goblin-lore.description: You're trained in Nature and Stealth (one you're already trained in becomes a training in a skill of your choice), and you gain Additional Lore for Goblin Lore.
feats.ancestry.goblin-lore.name: Goblin Lore
feats.ancestry.goblin-scuttle.description: 'Reaction, when an ally ends a move action adjacent to you: you Step.'
feats.ancestry.goblin-scuttle.name: Goblin Scuttle
feats.ancestry.goblin-song.actions.goblin-song.name: Goblin Song
feats.ancestry.goblin-song.actions.goblin-song.params.dc.name: Target's Will DC
feats.ancestry.goblin-song.description: "One action: a Performance check against the Will DC of an enemy within 30 feet (two targets if you're an expert, four if a master, eight if legendary). Critical success: -1 status penalty to its Perception checks and Will saves for 1 minute; success: for 1 round; critical failure: it's immune for 1 hour."
feats.ancestry.goblin-song.name: Goblin Song
feats.ancestry.goblin-weapon-familiarity.description: You have access to uncommon goblin weapons. For proficiency, goblin weapons count as simple if martial and as martial if advanced. From 5th level, critical hits with them get their critical specialization effect.
feats.ancestry.goblin-weapon-familiarity.name: Goblin Weapon Familiarity
feats.ancestry.grasping-reach.description: 'With a two-handed melee weapon without reach that deals at least 1d6, you can switch with an Interact action to an extended grasp: reach 10 feet, but its damage die one size smaller.'
feats.ancestry.grasping-reach.name: Grasping Reach
feats.ancestry.grimspawn.description: 'You descend from a daemon and cling to life: you gain Diehard.'
feats.ancestry.grimspawn.name: Grimspawn
feats.ancestry.group-aid.description: After you Aid an ally's skill check (not an attack), you can Aid each other ally attempting the same check that round as a free action.
feats.ancestry.group-aid.name: Group Aid
feats.ancestry.guiding-luck.description: 'You can use Halfling Luck twice a day: once as usual, and once when you fail a Perception check or attack roll.'
feats.ancestry.guiding-luck.name: Guiding Luck
feats.ancestry.guiding-luck.prerequisites.halfling-luck: Halfling Luck
feats.ancestry.hag-claws.description: 'You gain a claw unarmed attack: 1d4 slashing, brawling group, agile, finesse. You can take this feat whenever you gain an ancestry feat.'
feats.ancestry.hag-claws.name: Hag Claws
feats.ancestry.hag-magic.choices.spell.options.augury.name: Augury
feats.ancestry.hag-magic.choices.spell.options.charm.name: Charm
feats.ancestry.hag-magic.choices.spell.options.clairvoyance.name: Clairvoyance
feats.ancestry.hag-magic.choices.spell.options.clairaudience.name: Clairaudience
feats.ancestry.hag-magic.choices.spell.options.dream-message.name: Dream message
feats.ancestry.hag-magic.choices.spell.options.earthbind.name: Earthbind
feats.ancestry.hag-magic.choices.spell.options.humanoid-form.name: Humanoid form
feats.ancestry.hag-magic.choices.spell.options.illusory-disguise.name: Illusory disguise
feats.ancestry.hag-magic.choices.spell.options.water-walk.name: Water walk
feats.ancestry.hag-magic.choices.spell.prompt: Hag spell
feats.ancestry.hag-magic.description: "Choose a common spell of 4th rank or lower that covens or your mother's kind of hag can cast: you can cast it once a day as a 4th-rank occult innate spell."
feats.ancestry.hag-magic.name: Hag Magic
feats.ancestry.hags-sight.description: You gain darkvision.
feats.ancestry.hags-sight.name: Hag's Sight
feats.ancestry.halfling-lore.description: You're trained in Acrobatics and Stealth (one you're already trained in becomes a training in a skill of your choice), and you gain Additional Lore for Halfling Lore.
feats.ancestry.halfling-lore.name: Halfling Lore
feats.ancestry.halfling-luck.description: 'Free action, once per day, when you fail a skill check or saving throw: reroll it and use the new result.'
feats.ancestry.halfling-luck.name: Halfling Luck
feats.ancestry.halfling-luck.prerequisites.not-jinxed: Not a jinxed halfling
feats.ancestry.halfling-weapon-familiarity.description: You have access to uncommon halfling weapons. For proficiency, halfling weapons, the sling and the shortsword count as simple if martial and as martial if advanced. From 5th level, critical hits with them get their critical specialization effect.
feats.ancestry.halfling-weapon-familiarity.name: Halfling Weapon Familiarity
feats.ancestry.halo.description: A halo sheds light as the divine light cantrip, heightened to half your level rounded up; you can Sustain to suppress or restore it.
feats.ancestry.halo.name: Halo
feats.ancestry.hardy-traveler.description: Your maximum and encumbered Bulk limits rise by 1, and you get a +10-foot circumstance bonus to Speed for overland travel.
feats.ancestry.hardy-traveler.name: Hardy Traveler
feats.ancestry.harmlessly-cute.description: You gain Shameless Request, and a +1 circumstance bonus to initiative when you roll Deception for it.
feats.ancestry.harmlessly-cute.name: Harmlessly Cute
feats.ancestry.haughty-obstinacy.description: A success on a save against a mental effect that would directly control your actions is a critical success, and a creature's failure to Coerce you is a critical failure.
feats.ancestry.haughty-obstinacy.name: Haughty Obstinacy
feats.ancestry.hellspawn.description: "You descend from devils: you're trained in Deception (or another skill if you already were) and Legal Lore, and gain Lie to Me."
feats.ancestry.hellspawn.name: Hellspawn
feats.ancestry.heroic-presence.description: '1 action once a day: up to 10 willing creatures within 30 feet gain the effects of a 6th-rank zealous conviction.'
feats.ancestry.heroic-presence.name: Heroic Presence
feats.ancestry.hold-mark.choices.mark.options.burning-sun.name: 'Burning Sun: Diplomacy, arcane spells'
feats.ancestry.hold-mark.choices.mark.options.deaths-head.name: "Death's Head: Survival, primal spells"
feats.ancestry.hold-mark.choices.mark.options.defiled-corpse.name: 'Defiled Corpse: Religion, divine spells'
feats.ancestry.hold-mark.choices.mark.options.empty-hand.name: 'Empty Hand: Intimidation, occult spells'
feats.ancestry.hold-mark.choices.mark.prompt: Emblem
feats.ancestry.hold-mark.description: "Choose an emblem, worn as a brand or tattoo: you're trained in its skill and gain a +1 status bonus to saves against spells of its tradition. Burning Sun: Diplomacy, arcane. Death's Head: Survival, primal. Defiled Corpse: Religion, divine. Empty Hand: Intimidation, occult."
feats.ancestry.hold-mark.name: Hold Mark
feats.ancestry.homeward-bound.description: Twice a week, you can cast interplanar teleport as a primal innate spell, only between the realm of the fey and the mortal world, without a planar key.
feats.ancestry.homeward-bound.name: Homeward Bound
feats.ancestry.illusion-sense.description: A +1 circumstance bonus to Perception checks and Will saves against illusions. Within 10 feet of an illusion you could disbelieve, the GM rolls a secret check for you to do so.
feats.ancestry.illusion-sense.name: Illusion Sense
feats.ancestry.incredible-ferocity.description: You can use Orc Ferocity once an hour instead of once a day.
feats.ancestry.incredible-ferocity.name: Incredible Ferocity
feats.ancestry.incredible-ferocity.prerequisites.orc-ferocity: Orc Ferocity
feats.ancestry.incredible-improvisation.description: "Free action once a day, when you attempt a check with a skill you're untrained in: +4 circumstance bonus to it."
feats.ancestry.incredible-improvisation.name: Incredible Improvisation
feats.ancestry.inspire-imitation.description: When you critically succeed at a skill check, you can Aid an ally using the same skill without preparing.
feats.ancestry.inspire-imitation.name: Inspire Imitation
feats.ancestry.instinctive-obfuscation.description: 'Reaction once an hour, when a foe attacks you before rolling: it must succeed at a DC 10 flat check or hit an illusory double instead.'
feats.ancestry.instinctive-obfuscation.name: Instinctive Obfuscation
feats.ancestry.instinctive-obfuscation.prerequisites.innate: An arcane or occult innate spell from a gnome heritage or ancestry feat
feats.ancestry.iron-fists.description: Your fist unarmed attacks lose the nonlethal trait and gain the shove trait.
feats.ancestry.iron-fists.name: Iron Fists
feats.ancestry.irrepressible.description: A success on a save against an emotion effect is a critical success; a gutsy halfling's critical failure on one is a failure.
feats.ancestry.irrepressible.name: Irrepressible
feats.ancestry.junk-tinker.description: You can Craft level 0 items out of junk for a quarter of the Price; they're shoddy, but you take no penalty for using shoddy items you made. Junk also discounts other items you Craft as if you'd worked an extra day.
feats.ancestry.junk-tinker.name: Junk Tinker
feats.ancestry.kneecap.actions.kneecap.name: Kneecap
feats.ancestry.kneecap.actions.kneecap.steps.weapon.prompt: Choose a melee weapon
feats.ancestry.kneecap.description: 'One action: a melee Strike that deals no damage; on a hit the target takes a -10-foot status penalty to its Speed for 1 round (-15 feet on a critical hit).'
feats.ancestry.kneecap.name: Kneecap
feats.ancestry.lawbringer.description: 'You descend from archons: +1 circumstance bonus to saves against emotion effects, and a success on one is a critical success.'
feats.ancestry.lawbringer.name: Lawbringer
feats.ancestry.leshy-glide.description: 'One action: you glide 5 feet down and up to 25 feet forward; gliding at least once a round keeps you in the air at the end of your turn.'
feats.ancestry.leshy-glide.name: Leshy Glide
feats.ancestry.leshy-glide.prerequisites.leaf-or-cat-fall: Leaf leshy heritage or Cat Fall
feats.ancestry.leshy-lore.description: You're trained in Nature and Stealth (one you're already trained in becomes a training in a skill of your choice), and you gain Additional Lore for Leshy Lore.
feats.ancestry.leshy-lore.name: Leshy Lore
feats.ancestry.leshy-superstition.description: 'Reaction, before a saving throw against a spell or magical effect: a +1 circumstance bonus to that save.'
feats.ancestry.leshy-superstition.name: Leshy Superstition
feats.ancestry.life-leap.description: '1 action, adjacent to a living creature: you pass through it to the opposite side, without triggering reactions, within your Speed.'
feats.ancestry.life-leap.name: Life Leap
feats.ancestry.loud-singer.description: Your Goblin Song reaches 60 feet and one more target.
feats.ancestry.loud-singer.name: Loud Singer
feats.ancestry.loud-singer.prerequisites.goblin-song: Goblin Song
feats.ancestry.lucky-keepsake.description: You always have Leshy Superstition's +1 circumstance bonus to saves against spells and magical effects, as long as you keep your keepsake.
feats.ancestry.lucky-keepsake.name: Lucky Keepsake
feats.ancestry.lucky-keepsake.prerequisites.leshy-superstition: Leshy Superstition
feats.ancestry.magic-rider.description: A teleportation spell that moves several creatures can take one more when you're a target, and a teleport with you lands within a mile of its mark.
feats.ancestry.magic-rider.name: Magic Rider
feats.ancestry.march-the-mines.description: '2 actions: you gain a burrow Speed of 15 feet, then Stride or Burrow twice, bringing an adjacent willing ally along behind you.'
feats.ancestry.march-the-mines.name: March the Mines
feats.ancestry.martial-experience.description: With a weapon you aren't trained in, your proficiency bonus equals your level. At 11th level, you become trained in all weapons.
feats.ancestry.martial-experience.name: Martial Experience
feats.ancestry.mist-child.description: The flat check to target you is DC 6 while you're concealed and DC 12 while you're hidden.
feats.ancestry.mist-child.name: Mist Child
feats.ancestry.monstrous-peacemaker.description: +1 circumstance bonus to Diplomacy with intelligent non-humanoids and with humanoids human society shuns (giants, goblins, kobolds, orcs and others), and to Sense Motive against them.
feats.ancestry.monstrous-peacemaker.name: Monstrous Peacemaker
feats.ancestry.mountain-strategy.description: A +1 circumstance bonus to damage per weapon die against creatures with the giant, goblin or orc trait (your GM may add others), and for 1 minute against a creature that critically hit and damaged you.
feats.ancestry.mountain-strategy.name: Mountain Strategy
feats.ancestry.mountains-stoutness.description: Your maximum Hit Points rise by your level, and your recovery checks are DC 9 + your dying value (6 + it if you also have Toughness).
feats.ancestry.mountains-stoutness.name: Mountain's Stoutness
feats.ancestry.multitalented.description: You gain a 2nd-level multiclass dedication feat, even before finishing another archetype; an aiuvarin ignores its attribute prerequisites.
feats.ancestry.multitalented.name: Multitalented
feats.ancestry.multitalented.choices.dedication.prompt: Multiclass dedication
feats.ancestry.musetouched.description: 'You descend from azatas: +1 circumstance bonus to Escape; a critical failure to Escape is a failure and a success a critical success.'
feats.ancestry.musetouched.name: Musetouched
feats.ancestry.natural-ambition.choices.feat.prompt: Feat
feats.ancestry.natural-ambition.description: You gain a 1st-level class feat of your class.
feats.ancestry.natural-ambition.name: Natural Ambition
feats.ancestry.natural-skill.choices.skills.prompt: Two skills to be trained in
feats.ancestry.natural-skill.description: You're trained in two skills of your choice.
feats.ancestry.natural-skill.name: Natural Skill
feats.ancestry.nephilim-eyes.description: You gain darkvision.
feats.ancestry.nephilim-eyes.name: Nephilim Eyes
feats.ancestry.nephilim-eyes.prerequisites.low-light: Low-light vision
feats.ancestry.nephilim-lore.choices.skill.options.diplomacy.name: Diplomacy
feats.ancestry.nephilim-lore.choices.skill.options.intimidation.name: Intimidation
feats.ancestry.nephilim-lore.choices.skill.prompt: Skill to train
feats.ancestry.nephilim-lore.description: You're trained in Diplomacy or Intimidation, and Religion (or other skills if you already were), and gain Additional Lore for a plane of your lineage.
feats.ancestry.nephilim-lore.name: Nephilim Lore
feats.ancestry.nephilim-resistance.choices.type.options.acid.name: Acid
feats.ancestry.nephilim-resistance.choices.type.options.cold.name: Cold
feats.ancestry.nephilim-resistance.choices.type.options.electricity.name: Electricity
feats.ancestry.nephilim-resistance.choices.type.options.fire.name: Fire
feats.ancestry.nephilim-resistance.choices.type.options.sonic.name: Sonic
feats.ancestry.nephilim-resistance.choices.type.prompt: Damage type
feats.ancestry.nephilim-resistance.description: 'Choose acid, cold, electricity, fire or sonic: you gain resistance 5 to it.'
feats.ancestry.nephilim-resistance.name: Nephilim Resistance
feats.ancestry.nimble-elf.description: Your Speed rises by 5 feet.
feats.ancestry.nimble-elf.name: Nimble Elf
feats.ancestry.nimble-hooves.description: Your Speed rises by 5 feet, not cumulative with another ancestry feat's Speed increase.
feats.ancestry.nimble-hooves.name: Nimble Hooves
feats.ancestry.occult-resistance.description: +1 circumstance bonus to saves against occult effects.
feats.ancestry.occult-resistance.name: Occult Resistance
feats.ancestry.occult-resistance.prerequisites.expert: Expert in Occultism
feats.ancestry.orc-ferocity.actions.ferocity.name: Orc Ferocity
feats.ancestry.orc-ferocity.description: 'Reaction, once per day, when you are reduced to 0 Hit Points but not killed: stay at 1 Hit Point instead, and your wounded value rises by 1.'
feats.ancestry.orc-ferocity.name: Orc Ferocity
feats.ancestry.orc-lore.description: You're trained in Athletics and Survival (one you're already trained in becomes a training in a skill of your choice), and you gain Additional Lore for Orc Lore.
feats.ancestry.orc-lore.name: Orc Lore
feats.ancestry.orc-sight.description: You gain darkvision. You can take this feat only at 1st level.
feats.ancestry.orc-sight.name: Orc Sight
feats.ancestry.orc-sight.prerequisites.low-light: Low-light vision
feats.ancestry.orc-superstition.description: 'Reaction, before a saving throw against a spell or magical effect: a +1 circumstance bonus to that save.'
feats.ancestry.orc-superstition.name: Orc Superstition
feats.ancestry.orc-weapon-familiarity.description: You have access to uncommon orc weapons. For proficiency, orc weapons, the falchion and the greataxe count as simple if martial and as martial if advanced. From 5th level, critical hits with them get their critical specialization effect.
feats.ancestry.orc-weapon-familiarity.name: Orc Weapon Familiarity
feats.ancestry.otherworldly-acumen.choices.spell.prompt: 2nd-rank arcane spell
feats.ancestry.otherworldly-acumen.description: 'Choose a common 2nd-rank spell of the tradition of an innate spell an elf feat gave you (arcane, from Otherworldly Magic): you can cast it once a day as an innate spell. A day of downtime changes it.'
feats.ancestry.otherworldly-acumen.name: Otherworldly Acumen
feats.ancestry.otherworldly-acumen.prerequisites.innate: An innate spell from an elf ancestry feat (Otherworldly Magic)
feats.ancestry.otherworldly-magic.description: Choose an arcane cantrip. You can cast it at will as an arcane innate spell, heightened to half your level rounded up.
feats.ancestry.otherworldly-magic.name: Otherworldly Magic
feats.ancestry.otherworldly-magic.choices.cantrip.prompt: Arcane cantrip
feats.ancestry.pervasive-superstition.description: You always have a +1 circumstance bonus to saves against spells and magical effects.
feats.ancestry.pervasive-superstition.name: Pervasive Superstition
feats.ancestry.pervasive-superstition.prerequisites.orc-superstition: Orc Superstition
feats.ancestry.pitborn.choices.feat.prompt: Athletics skill feat
feats.ancestry.pitborn.description: "You descend from a demon: you're trained in Athletics (or another skill if you already were) and gain a common 1st-level skill feat that needs Athletics."
feats.ancestry.pitborn.name: Pitborn
feats.ancestry.prairie-rider.description: You're trained in Nature (a skill of your choice if you already are), and gain a +1 circumstance bonus to Command an Animal on a pony, riding dog or similar traditional mount.
feats.ancestry.prairie-rider.name: Prairie Rider
feats.ancestry.project-persona.description: "One action: your armor looks like ordinary or fine clothes of your choice, its statistics unchanged, while you're conscious and wearing it. Seeking or touching it lets a creature disbelieve (DC your Will DC)."
feats.ancestry.project-persona.name: Project Persona
feats.ancestry.rampaging-ferocity.actions.rampaging-ferocity.name: Rampaging Ferocity
feats.ancestry.rampaging-ferocity.actions.rampaging-ferocity.steps.weapon.prompt: Melee weapon
feats.ancestry.rampaging-ferocity.description: "Free action when you use Orc Ferocity: make a melee Strike; if it drops a foe to 0 Hit Points, that Orc Ferocity doesn't count against its frequency."
feats.ancestry.rampaging-ferocity.name: Rampaging Ferocity
feats.ancestry.rampaging-ferocity.prerequisites.orc-ferocity: Orc Ferocity
feats.ancestry.razzle-dazzle.description: 'Free action, once per hour, when you blind or dazzle a creature: the condition lasts 1 round longer.'
feats.ancestry.razzle-dazzle.name: Razzle-Dazzle
feats.ancestry.reckless-abandon.actions.reckless-abandon.name: Reckless Abandon
feats.ancestry.reckless-abandon.description: 'Free action once a day: for the rest of your turn, a failed save against a harmful effect is a success, and damage from enemies or hazards is the minimum.'
feats.ancestry.reckless-abandon.name: Reckless Abandon
feats.ancestry.regrowth.description: You can cast regenerate as a 7th-rank primal innate spell once a day.
feats.ancestry.regrowth.name: Regrowth
feats.ancestry.ritual-reversion.description: 'Two actions: you take the form of an ordinary plant or fungus like the one you came from, as the one with plants spell, but you stay Small.'
feats.ancestry.ritual-reversion.name: Ritual Reversion
feats.ancestry.rock-runner.description: You ignore difficult terrain of stone and earth. Balancing on narrow or uneven stone or earth, you aren't off-guard, and a success is a critical success.
feats.ancestry.rock-runner.name: Rock Runner
feats.ancestry.rough-rider.description: You gain the Ride feat, even without its prerequisites, and a +1 circumstance bonus to Command an Animal on a goblin dog or wolf mount. A wolf animal companion can be a mount.
feats.ancestry.rough-rider.name: Rough Rider
feats.ancestry.scar-thick-skin.description: The flat check to end persistent bleed damage is DC 10 for you instead of 15 (5 instead of 10 with especially appropriate help).
feats.ancestry.scar-thick-skin.name: Scar-Thick Skin
feats.ancestry.scion-of-many-planes.choices.feat.prompt: Lineage feat
feats.ancestry.scion-of-many-planes.description: You gain another nephilim lineage feat you don't have, with all its benefits.
feats.ancestry.scion-of-many-planes.name: Scion of Many Planes
feats.ancestry.seedpod.description: You gain a seedpod ranged unarmed attack (1d4 bludgeoning, range increment 30 feet). On a critical hit, the target takes a -10-foot circumstance penalty to its Speed until the start of your next turn. It has no critical specialization effect.
feats.ancestry.seedpod.name: Seedpod
feats.ancestry.sense-allies.description: Willing allies within 60 feet that would be undetected by you are hidden instead, and the flat check to target them is 5 instead of 11.
feats.ancestry.sense-allies.name: Sense Allies
feats.ancestry.shadow-of-the-wilds.description: Outside urban areas, you always count as Covering Tracks, whatever you do while exploring.
feats.ancestry.shadow-of-the-wilds.name: Shadow of the Wilds
feats.ancestry.shadow-self.actions.shadow-self.name: Shadow Self
feats.ancestry.shadow-self.description: "Reaction once an hour, when you Hide or Sneak from all your foes: you're invisible for a minute or until you act with hostility, and seem to be hidden somewhere within 10 feet."
feats.ancestry.shadow-self.name: Shadow Self
feats.ancestry.shadow-self.prerequisites.legendary: Legendary in Stealth
feats.ancestry.skillful-tail.description: Your tail can make simple Interact actions that need no check or fingers, such as opening an unlocked door; it can't hold items.
feats.ancestry.skillful-tail.name: Skillful Tail
feats.ancestry.skittering-scuttle.description: Goblin Scuttle lets you Stride up to half your Speed instead of Stepping.
feats.ancestry.skittering-scuttle.name: Skittering Scuttle
feats.ancestry.skittering-scuttle.prerequisites.goblin-scuttle: Goblin Scuttle
feats.ancestry.slag-may.description: 'You gain cold iron claws: 1d6 slashing, brawling group, grapple.'
feats.ancestry.slag-may.name: Slag May
feats.ancestry.slip-sideways.description: Once a day, you can cast translocate as a 5th-rank divine innate spell.
feats.ancestry.slip-sideways.name: Slip Sideways
feats.ancestry.slip-sideways.prerequisites.lineage: Grimspawn, Pitborn or Hellspawn
feats.ancestry.solar-rejuvenation.actions.solar-rest.name: Rest 10 minutes (Solar Rejuvenation)
feats.ancestry.solar-rejuvenation.description: Resting 10 minutes outdoors by day (or in a fitting place) heals you your Constitution modifier × half your level, on top of Treat Wounds.
feats.ancestry.solar-rejuvenation.name: Solar Rejuvenation
feats.ancestry.speak-with-kindred.description: You can speak with plants and fungi and use Diplomacy with them, with a +2 circumstance bonus with those of your own kind.
feats.ancestry.speak-with-kindred.name: Speak with Kindred
feats.ancestry.spell-devourer.description: When you succeed at a save against a spell or magical effect, you gain temporary Hit Points of twice its rank (or its level) until the end of your next turn.
feats.ancestry.spell-devourer.name: Spell Devourer
feats.ancestry.spell-devourer.prerequisites.pervasive-superstition: Pervasive Superstition
feats.ancestry.step-lively.description: 'Reaction, when a Large or larger enemy ends a move action adjacent to you: you Step to another space adjacent to it.'
feats.ancestry.step-lively.name: Step Lively
feats.ancestry.stone-bones.actions.stone-bones.name: Stone Bones
feats.ancestry.stone-bones.description: 'Reaction when a critical hit deals you physical damage: on a DC 17 flat check, it becomes an ordinary hit.'
feats.ancestry.stone-bones.name: Stone Bones
feats.ancestry.stonegate.description: You can cast magic passage as a 7th-rank divine innate spell once a day, only through earth or stone.
feats.ancestry.stonegate.name: Stonegate
feats.ancestry.stonegate.prerequisites.stonewalker: Stonewalker
feats.ancestry.stonemasons-eye.description: You're trained in Crafting; if you already were, you gain Specialty Crafting for stonemasonry instead. A +2 circumstance bonus to Perception checks to notice unusual stonework, and the GM rolls a secret check for you when you aren't searching.
feats.ancestry.stonemasons-eye.name: Stonemason's Eye
feats.ancestry.stonewalker.description: You can cast one with stone as a 3rd-rank divine innate spell once a day. With Stonemason's Eye you can find stonework that needs legendary Perception, and keep its bonus on the GM's secret checks if you're legendary.
feats.ancestry.stonewalker.name: Stonewalker
feats.ancestry.stonewall.actions.stonewall.name: Stonewall
feats.ancestry.stonewall.description: "Reaction once a day, when an enemy's or hazard's effect hits you or you fail a Fortitude save against one: you're petrified until the end of the turn and take no damage or other effects that couldn't affect stone."
feats.ancestry.stonewall.name: Stonewall
feats.ancestry.stubborn-persistence.description: When you would become fatigued, a DC 17 flat check stops it; you check again at intervals until you fail or deal with the cause.
feats.ancestry.stubborn-persistence.name: Stubborn Persistence
feats.ancestry.summon-nephilim-kin.description: Once a day, you can cast a 5th-rank summoning spell for a creature of your lineage's kind as a divine innate spell.
feats.ancestry.summon-nephilim-kin.name: Summon Nephilim Kin
feats.ancestry.summon-nephilim-kin.prerequisites.lineage: A nephilim lineage feat
feats.ancestry.supernatural-charm.description: You can cast 1st-rank charm as an arcane innate spell once a day.
feats.ancestry.supernatural-charm.name: Supernatural Charm
feats.ancestry.sure-feet.description: A success on an Acrobatics check to Balance or an Athletics check to Climb is a critical success, and you aren't off-guard while you Balance or Climb.
feats.ancestry.sure-feet.name: Sure Feet
feats.ancestry.telluric-power.description: A melee Strike against a target standing on the same earth or stone as you gets a circumstance bonus to damage equal to the weapon's damage dice.
feats.ancestry.telluric-power.name: Telluric Power
feats.ancestry.thorned-seedpod.description: A critical hit with your seedpod deals 1d4 persistent piercing damage too.
feats.ancestry.thorned-seedpod.name: Thorned Seedpod
feats.ancestry.thorned-seedpod.prerequisites.seedpod: Seedpod
feats.ancestry.titan-slinger.description: When you hit a Large or larger creature with a weapon of the sling group, its weapon damage die is one size larger.
feats.ancestry.titan-slinger.name: Titan Slinger
feats.ancestry.toppling-dance.description: While sharing a creature's space with Dance Underfoot, your melee Strikes against it have the trip trait, and you can share a Large or larger prone creature's space.
feats.ancestry.toppling-dance.name: Toppling Dance
feats.ancestry.toppling-dance.prerequisites.dance-underfoot: Dance Underfoot
feats.ancestry.tree-climber.description: You gain a climb Speed of 10 feet.
feats.ancestry.tree-climber.name: Tree Climber
feats.ancestry.tusks.description: 'You gain a tusks unarmed attack: 1d6 piercing, brawling group, finesse. You can take this feat only at 1st level.'
feats.ancestry.tusks.name: Tusks
feats.ancestry.unburdened-iron.description: Ignore the Speed reduction from armor, and reduce other Speed penalties (such as from being encumbered) by 5 feet.
feats.ancestry.unburdened-iron.name: Unburdened Iron
feats.ancestry.unconventional-weaponry.choices.weapon.prompt: Weapon
feats.ancestry.unconventional-weaponry.description: "Choose an uncommon simple or martial weapon with an ancestry's trait or common in another culture: you have access to it and treat it as a simple weapon for proficiency. If you're trained in all martial weapons, you can choose such an advanced weapon instead, treated as martial."
feats.ancestry.unconventional-weaponry.name: Unconventional Weaponry
feats.ancestry.undaunted.description: A +1 circumstance bonus to saving throws against emotion effects, and a success on one is a critical success.
feats.ancestry.undaunted.name: Undaunted
feats.ancestry.undying-ferocity.description: When you use Orc Ferocity, you also gain temporary Hit Points equal to your level.
feats.ancestry.undying-ferocity.name: Undying Ferocity
feats.ancestry.undying-ferocity.prerequisites.orc-ferocity: Orc Ferocity
feats.ancestry.unfettered-halfling.description: A success on a check to Escape or on a save against being grabbed, immobilized or restrained is a critical success, and a creature's failure to Grapple you is a critical failure.
feats.ancestry.unfettered-halfling.name: Unfettered Halfling
feats.ancestry.unhampered-passage.description: You can cast unfettered movement on yourself as a primal innate spell once a day.
feats.ancestry.unhampered-passage.name: Unhampered Passage
feats.ancestry.universal-longevity.description: '1 action, once a day: you change the skills you picked with Ancestral Longevity and Expert Longevity.'
feats.ancestry.universal-longevity.name: Universal Longevity
feats.ancestry.universal-longevity.prerequisites.expert-longevity: Expert Longevity
feats.ancestry.unwavering-mien.description: When a mental effect that lasts at least 2 rounds affects you, you can reduce its duration by 1 round. Your saves against falling asleep are one degree of success better.
feats.ancestry.unwavering-mien.name: Unwavering Mien
feats.ancestry.vandal.description: You're trained in Thievery (a skill of your choice if you already are). Your Strikes against traps and unattended objects ignore their first 5 points of Hardness.
feats.ancestry.vandal.name: Vandal
feats.ancestry.very-sneaky.description: You Sneak 5 feet farther, up to your Speed, and while you keep Sneaking successfully you stay unobserved without cover or concealment, as long as you have it at the end of your turn.
feats.ancestry.very-sneaky.name: Very Sneaky
feats.ancestry.very-very-sneaky.description: You can Sneak up to your Speed, and Hide or Sneak without cover or concealment.
feats.ancestry.very-very-sneaky.name: Very, Very Sneaky
feats.ancestry.very-very-sneaky.prerequisites.very-sneaky: Very Sneaky
feats.ancestry.vivacious-conduit.actions.vivacious-rest.name: Rest 10 minutes (Vivacious Conduit)
feats.ancestry.vivacious-conduit.description: Resting 10 minutes heals you your Constitution modifier × half your level, on top of Treat Wounds.
feats.ancestry.vivacious-conduit.name: Vivacious Conduit
feats.ancestry.watchful-halfling.description: A +2 circumstance bonus to Sense Motive to notice enchanted or possessed creatures (and a secret check when you aren't looking), and you can Aid a creature's check to overcome enchantment or possession.
feats.ancestry.watchful-halfling.name: Watchful Halfling
features.bestial-manifestation.claw.description: 1d4 slashing, agile, finesse, versatile piercing.
features.bestial-manifestation.claw.name: Claw
features.bestial-manifestation.hoof.description: 1d6 bludgeoning, finesse.
