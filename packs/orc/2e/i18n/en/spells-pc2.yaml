# Player Core 2's spells and the ranger's warden spells: names and short rules text, paraphrased.
spells.gravity-weapon.name: 'Gravity Weapon'
spells.gravity-weapon.description: 'Your first weapon Strike each round gains a status bonus to damage equal to twice its number of weapon damage dice, for 1 minute.'
spells.heal-companion.name: 'Heal Companion'
spells.heal-companion.description: |-
  Your animal companion regains 1d10 Hit Points. With one action the range is touch; with two, 30 feet and 8 more Hit Points.

  **Heightened (+1)** The healing increases by 1d10, and the two-action version's extra healing by 8.
spells.magic-hide.name: 'Magic Hide'
spells.magic-hide.description: "Your animal companion's hide thickens: it gains a +1 status bonus to AC for 1 minute."
spells.animal-feature.name: 'Animal Feature'
spells.animal-feature.description: |-
  For 1 minute you gain one feature of your choice: cat eyes (low-light vision), claws (a 1d6 slashing agile, finesse unarmed attack) or jaws (a 1d8 piercing unarmed attack).

  **Heightened (4th)** You can also choose a fish tail (a swim Speed equal to your land Speed), owl eyes (darkvision) or wings (a fly Speed equal to your land Speed).
spells.enlarge-companion.name: 'Enlarge Companion'
spells.enlarge-companion.description: |-
  Your animal companion becomes Large for 1 minute, with the effects of a 2nd-rank enlarge.

  **Heightened (4th)** It becomes Huge instead, with the effects of a 4th-rank enlarge.
spells.hunters-luck.name: "Hunter's Luck"
spells.hunters-luck.description: "Trigger: you attempt a check to Recall Knowledge about a creature and haven't rolled yet. Roll the check twice and use the better result."
spells.soothing-mist.name: 'Soothing Mist'
spells.soothing-mist.description: |-
  A soothing mist restores 2d8 Hit Points to a living creature and ends one source of persistent acid, bleed, fire, poison or void damage on it. An undead target instead takes 2d8 vitality damage with a basic Fortitude save, and 2 persistent vitality damage if it fails.

  **Heightened (+1)** The healing or damage increases by 1d8, and the persistent vitality damage by 1.
spells.ephemeral-tracking.name: 'Ephemeral Tracking'
spells.ephemeral-tracking.description: 'For 1 hour you can Track creatures through air and water with Survival, following the traces of anything that passed in the last hour. The DC is at least 30, more after wind, rain or strong currents.'
spells.rangers-bramble.name: "Ranger's Bramble"
spells.rangers-bramble.description: |-
  Plants in a 5-foot burst entangle your foes for 1 minute, with the effects of entangling flora. A creature that critically fails its save also takes 2d4 persistent bleed damage, which escaping doesn't end.

  **Heightened (+1)** The bleed damage increases by 1d4.
spells.hunters-vision.name: "Hunter's Vision"
spells.hunters-vision.description: "For 10 minutes your hunted prey glows with an aura only you and those sharing your Hunt Prey see. It's visible to you despite darkness, concealment or invisibility (not cover), you ignore the flat check for its concealment, and it isn't hidden from you by darkness or invisibility."
spells.terrain-transposition.name: 'Terrain Transposition'
spells.terrain-transposition.description: 'In a wilderness environment, you teleport yourself and what you hold to a clear space you can see within 90 feet (180 feet if both spaces are in your favored terrain). An adjacent animal companion can come along; any other creature makes the spell fail.'
spells.beastmaster-trance.name: 'Beastmaster Trance'
spells.beastmaster-trance.description: |-
  You see through the senses of an animal companion within 1 mile, using your own Perception and sharing its special senses. While the trance lasts you're off-guard and can't use attack or move actions.

  **Heightened (6th)** The range is 100 miles, it lasts up to 10 minutes, and the companion hears you, so you can Command an Animal.

  **Heightened (8th)** The range is planetary, it lasts up to 1 hour, and you can communicate telepathically.
spells.animal-vision.name: 'Animal Vision'
spells.animal-vision.description: "For 1 hour you sense whatever the target animal senses (it can attempt a Will save to refuse). While you do, you can't use your own senses; Sustaining the spell switches between them."
spells.animated-assault.name: 'Animated Assault'
spells.animated-assault.description: |-
  Unattended objects in a 10-foot burst fly at the creatures there: 2d10 bludgeoning damage with a basic Reflex save. The first time each round you Sustain the spell, they deal 1d10 bludgeoning damage with a basic Reflex save.

  **Heightened (+2)** The initial damage increases by 2d10 and the later damage by 1d10.
spells.anointed-ground.name: 'Anointed Ground'
spells.anointed-ground.description: 'You anoint a 30-foot burst around you against aberrations, celestials, dragons, fiends, monitors or undead (your choice). Until your next daily preparations, creatures in the area gain a +1 status bonus to AC, attack rolls, damage rolls and saves against that kind of creature.'
spells.bestial-curse.name: 'Bestial Curse'
spells.bestial-curse.description: 'You curse a living humanoid to turn bestial (Fortitude save). Success: clumsy 1 for 1 round. Failure: for 1 hour it becomes clumsy 1, gains weakness 1 to silver and a claw, hoof, horn or jaws Strike, and must succeed at a DC 5 flat check to use a manipulate action. Critical failure: as failure, permanently.'
spells.blanket-of-stars.name: 'Blanket of Stars'
spells.blanket-of-stars.description: "A starry cloak of darkness gives you a +2 status bonus to Stealth checks to Hide and Sneak for 10 minutes. Under a starry night sky you're invisible while still and concealed while moving. A creature ending its turn adjacent to you attempts a Will save: dazzled until the end of its next turn on a failure, confused and dazzled on a critical failure."
spells.blinding-fury.name: 'Blinding Fury'
spells.blinding-fury.description: "Trigger: a creature damages you. It attempts a Will save. Success: it can't observe you until the end of its turn. Failure: as success, and for 1 minute it can't observe you after each time it damages you. Critical failure: as success, and forever, the first time each round it damages a creature, it can't observe that creature until the end of its turn."
spells.blister.name: 'Blister'
spells.blister.description: |-
  The target grows blisters (Fortitude save): one on a success, two on a failure, four on a critical failure. You can spend an action (concentrate) to pop one: the target and each creature in a 15-foot cone from it take 7d6 acid damage with a basic Fortitude save. The spell ends when none are left.

  **Heightened (+1)** A popped blister's damage increases by 1d6.
spells.blistering-invective.name: 'Blistering Invective'
spells.blistering-invective.description: |-
  Your insults burn: the target takes 2d6 persistent fire damage and attempts a Will save (+4 circumstance bonus if it doesn't understand you). Success: half the persistent damage. Failure: frightened 1 and the full persistent damage. Critical failure: frightened 2 and double the persistent damage.

  **Heightened (+2)** You can target two more creatures, and the persistent damage increases by 2d6.
spells.bullhorn.name: 'Bullhorn'
spells.bullhorn.description: |-
  For 10 minutes your voice carries clearly to all listeners within 500 feet. You gain a +1 status bonus to Coerce and to auditory Performance checks to Perform at a large venue. You can Dismiss the spell.

  **Heightened (5th)** Your voice carries 1,200 feet.

  **Heightened (7th)** Your voice carries 1 mile.
spells.carryall.name: 'Carryall'
spells.carryall.description: |-
  A 2-foot platform of force follows 5 feet behind you for 8 hours, carrying up to 5 Bulk. Sustaining moves it up to 30 feet, holds it in place or calls it back. It ends if overloaded, ridden, lifted, or more than 60 feet from you.

  **Heightened (4th)** It carries 10 Bulk, can be ridden and can hover in the air.
spells.chameleon-coat.name: 'Chameleon Coat'
spells.chameleon-coat.description: |-
  Up to eight creatures' clothing and gear shift colors to match their surroundings for 10 minutes, giving them a +3 status bonus to Stealth checks to Hide.

  **Heightened (6th)** A critical failure to Sneak within 30 feet of a creature that would spot them is a failure instead.

  **Heightened (8th)** As 6th, and the bonus is +4.
spells.charitable-urge.name: 'Charitable Urge'
spells.charitable-urge.description: 'You compel the target to give its possessions away (Will save). Success: stunned 1. Failure: on its next turn, before anything else, it hands an item to the nearest creature (or is stunned 1 instead of giving up the item it defends itself with). Critical failure: as failure each turn for 4 rounds; a new save at the end of each of its turns shortens it.'
spells.chilling-spray.name: 'Chilling Spray'
spells.chilling-spray.description: |-
  Icy shards in a 15-foot cone deal 2d4 cold damage (Reflex save, half on a success, double on a critical failure). On a failure a creature also takes a -5-foot status penalty to its Speeds for 2 rounds (-10 feet on a critical failure).

  **Heightened (+1)** The damage increases by 2d4.
spells.chroma-leach.name: 'Chroma Leach'
spells.chroma-leach.description: 'Your touch saps color and vitality (Fortitude save; gnomes take a -2 circumstance penalty). Success: enfeebled 2 for 1 round. Failure: enfeebled 2 for 1 minute and drained 1, and for 1 round each move action needs a successful Will save or is lost. Critical failure: as failure, but enfeebled 2 and drained 2 are permanent until removed.'
spells.cloak-of-colors.name: 'Cloak of Colors'
spells.cloak-of-colors.description: 'Swirling colors shroud the target for 1 minute. Creatures adjacent to it are dazzled. A creature that hits it with a melee attack attempts a Will save (incapacitation; then immune until the end of its turn): blinded for 1 round on a failure, stunned for 1 round on a critical failure.'
spells.collective-transposition.name: 'Collective Transposition'
spells.collective-transposition.description: |-
  You teleport up to two creatures to unoccupied spaces you can see within a 30-foot emanation; an unwilling one attempts a Will save. Critical success: it may teleport, choosing its own destination. Success: unaffected. Failure: you teleport it and choose where.

  **Heightened (+1)** One more target.
spells.concordant-choir.name: 'Concordant Choir'
spells.concordant-choir.description: |-
  One action: 1d4 sonic damage to one enemy within 30 feet. Two actions: 2d4 sonic damage to each creature in a 10-foot burst. Three actions: 2d4 sonic damage to each creature in a 30-foot emanation. Each with a basic Fortitude save.

  **Heightened (+1)** The damage increases by 1d4 for the one-action version, 2d4 for the others.
spells.confusing-colors.name: 'Confusing Colors'
spells.confusing-colors.description: 'A cloud of shifting colors fills a 20-foot burst for up to 1 minute (sustained). Creatures in it, or within 20 feet of it, are dazzled. A creature in it when you cast it, entering it, ending its turn in it, or Seeking or Interacting with it attempts a Will save: confused for 1d4 rounds on a failure; stunned for 1d4 rounds and then confused for the rest of the spell on a critical failure.'
spells.containment.name: 'Containment'
spells.containment.description: |-
  An immobile force field wraps a creature for 1 minute, blocking attacks, effects and creatures, the target included. It has Hardness 10, 40 Hit Points and immunity to critical hits and precision damage. An unwilling target attempts a Reflex save: on a critical success it escapes and the field collapses; on a success the field has 10 Hit Points.

  **Heightened (+1)** The field's Hit Points are 5 higher on a success or 15 higher on a failure.
spells.corrosive-muck.name: 'Corrosive Muck'
spells.corrosive-muck.description: |-
  Two 10-foot pools of acidic slime become greater difficult terrain for 1 minute. A creature that starts its turn in a pool or enters one during a move takes 8d6 acid damage with a basic Reflex save, and 1d6 persistent acid damage on a critical failure (once per round, even in both pools).

  **Heightened (+2)** One more pool.
spells.countless-eyes.name: 'Countless Eyes'
spells.countless-eyes.description: "Eyes cover the touched creature for 1 minute: it can't be flanked, and when it succeeds at Seeking it critically succeeds instead."
spells.crashing-wave.name: 'Crashing Wave'
spells.crashing-wave.description: |-
  A wave crashes out in a 30-foot cone: 6d6 bludgeoning damage with a basic Reflex save, and it puts out non-magical fires.

  **Heightened (+1)** The damage increases by 2d6.
spells.curse-of-lost-time.name: 'Curse of Lost Time'
spells.curse-of-lost-time.description: |-
  You age or erode the target. A living creature (Fortitude save) becomes clumsy 1 and enfeebled 1: for 1 round on a success, 1 hour on a failure, forever on a critical failure. A construct takes 4d6 damage (basic Fortitude save) and, on a failure, is clumsy 1 and enfeebled 1 and can't be Repaired. An object takes 4d6 damage and becomes shoddy and unrepairable until the curse ends.

  **Heightened (+1)** The damage increases by 1d6.
spells.deja-vu.name: 'Déjà Vu'
spells.deja-vu.description: "The target attempts a Will save. On a failure, it must repeat on its following turn the actions it uses on its next turn, as closely as possible; for each it can't repeat, it acts freely but is stupefied 1 until the end of its turn."
spells.dismantle.name: 'Dismantle'
spells.dismantle.description: |-
  A non-magical object of 1 Bulk or less in your possession comes apart into pieces small enough to hide under clothing, for 1 minute; it's broken meanwhile. When the spell ends (or you Dismiss it), it reassembles in your hands with its Hit Points as before.

  **Heightened (4th)** It lasts 10 minutes.

  **Heightened (6th)** It lasts until your next daily preparations.
spells.dream-council.name: 'Dream Council'
spells.dream-council.description: 'Up to twelve creatures you know by name and have met, including you, may fall asleep and join a shared dream for 1 hour, where they speak as if in one room. Each leaves the dream on waking.'
spells.drop-dead.name: 'Drop Dead'
spells.drop-dead.description: |-
  Trigger: a creature within range is hit by an enemy's attack. It seems to fall dead (an illusory corpse remains) but turns invisible, for up to 1 minute (sustained). A hostile action ends the spell; an absurd death may let the attacker disbelieve.

  **Heightened (7th)** Hostile actions don't end it.
spells.dull-ambition.name: 'Dull Ambition'
spells.dull-ambition.description: 'The target attempts a Will save. Success: for 1 hour it rolls initiative twice and takes the lower. Failure: for 1 day, the same for initiative and checks for downtime activities. Critical failure: as failure, forever.'
spells.familiars-face.name: "Familiar's Face"
spells.familiars-face.description: 'Your willing animal companion or familiar within 1 mile becomes a scrying sensor while you Sustain the spell: you see and hear through it, can speak through it, can cast revelation spells that affect your senses through its senses, and can Command it as part of Sustaining.'
spells.final-sacrifice.name: 'Final Sacrifice'
spells.final-sacrifice.description: |-
  A minion you summoned or permanently control explodes and dies: 6d6 fire damage to creatures within 20 feet of it with a basic Reflex save (cold damage for a cold or water minion). It fails against a creature you only temporarily control.

  **Heightened (+1)** The damage increases by 2d6.
spells.fungal-infestation.name: 'Fungal Infestation'
spells.fungal-infestation.description: |-
  Spores in a 15-foot cone deal 2d6 persistent poison damage (Fortitude save). Success: half. Failure: full, and while it lasts weakness 1 to fire and to slashing. Critical failure: double, and weakness 2 to fire and to slashing.

  **Heightened (+2)** The persistent damage increases by 2d6 and the weaknesses by 1 (2 on a critical failure).
spells.gale-blast.name: 'Gale Blast'
spells.gale-blast.description: |-
  Wind whirls in a 5-foot emanation: 1d6 bludgeoning damage to each creature (Fortitude save, half on a success, double on a critical failure). On a failure a creature is pushed 5 feet away (10 feet on a critical failure).

  **Heightened (+1)** The damage increases by 1d6.
spells.ghostly-tragedy.name: 'Ghostly Tragedy'
spells.ghostly-tragedy.description: "Local spirits reenact a violent event of the recent past you name, the 9 minutes before the victim's death or injury and the minute after, with you in the victim's role. Observers can investigate it for clues. Afterward you take 2d6 void damage per apparition that took part."
spells.ghoulish-cravings.name: 'Ghoulish Cravings'
spells.ghoulish-cravings.description: "The target craves raw meat (Will save). Success: sickened 1. Failure: sickened 2, and it can't go below sickened 1 until it eats raw meat. Critical failure: as failure, but it can't go below sickened 2."
spells.gravity-well.name: 'Gravity Well'
spells.gravity-well.description: 'Altered gravity pulls creatures and unsecured objects in a 30-foot burst toward its center (Reflex save, forced movement): 5 feet on a success, 15 feet on a failure, 30 feet on a critical failure.'
spells.haunting-hymn.name: 'Haunting Hymn'
spells.haunting-hymn.description: |-
  A jarring hymn in a 15-foot cone deals 1d8 sonic damage with a basic Fortitude save; a creature that critically fails is also deafened for 1 minute.

  **Heightened (+2)** The damage increases by 1d8.
spells.holy-cascade.name: 'Holy Cascade'
spells.holy-cascade.description: |-
  A vial of holy water bursts in a 20-foot burst up to 500 feet away: 3d6 bludgeoning damage, plus 6d6 spirit damage to unholy creatures, with a basic Reflex save.

  **Heightened (+1)** The bludgeoning damage increases by 1d6 and the spirit damage by 2d6.
spells.ice-storm.name: 'Ice Storm'
spells.ice-storm.description: |-
  A storm cloud pelts a 20-foot burst with hail: 2d8 bludgeoning and 2d8 cold damage with a basic Reflex save. While you Sustain it (up to 1 minute) the area is difficult terrain and a creature ending its turn there takes 2 cold damage. Outdoors you can make two clouds.

  **Heightened (+2)** The bludgeoning and cold damage each increase by 1d8, and the end-of-turn cold damage by 1.
spells.imaginary-lockbox.name: 'Imaginary Lockbox'
spells.imaginary-lockbox.description: 'Until your next daily preparations, a container of 10 Bulk or less (no creatures) exists only in your mind, with no Bulk. Taking an item out is a 3-action activity; nothing can go back in. You can Dismiss the spell; the container then reappears.'
spells.imprint-message.name: 'Imprint Message'
spells.imprint-message.description: 'You imprint a short message or emotional theme on an object you touch. The next creature to handle it senses the message as a fleeting vision. A new casting replaces any earlier imprint.'
spells.invisible-item.name: 'Invisible Item'
spells.invisible-item.description: |-
  An object you touch is invisible for 1 hour: undetected to all creatures, hidden to one that finds it. Using it in a hostile action ends the spell after that action.

  **Heightened (3rd)** It lasts until your next daily preparations.

  **Heightened (7th)** It lasts forever.
spells.leaden-steps.name: 'Leaden Steps'
spells.leaden-steps.description: |-
  The target's feet turn to metal (Fortitude save). Success: encumbered and weakness 2 to electricity until the end of your next turn. Failure: the same while you Sustain the spell (up to 1 minute). Critical failure: as failure, with weakness 3.

  **Heightened (+1)** The weakness increases by 1.
spells.lifewood-cage.name: 'Lifewood Cage'
spells.lifewood-cage.description: 'An invisible cage of living wood fills a 20-foot cube for up to 1 minute (sustained). Each creature there attempts a Reflex save: trapped inside on a failure, pushed out on a success. The cage has AC 10, Hardness 20, 40 Hit Points, weakness 5 to void and immunity to critical hits and precision damage; its bars give standard cover and stop incorporeal undead and large weapons, but not spells.'
spells.lightning-storm.name: 'Lightning Storm'
spells.lightning-storm.description: |-
  A storm cloud fills a 20-foot burst for up to 1 minute (sustained) and calls down a lightning bolt: 4d12 electricity damage to creatures in its vertical line, with a basic Reflex save. The first time you Sustain the spell each round you can call another bolt. Outdoors you can make two clouds (still one bolt per turn).

  **Heightened (+2)** Each bolt's damage increases by 1d12.
spells.live-wire.name: 'Live Wire'
spells.live-wire.description: |-
  A humming copper wire lashes a creature within 30 feet (spell attack). Critical success: double 1d4 slashing and 1d4 electricity damage, and 1d4 persistent electricity damage. Success: full damage. Failure: only the electricity damage.

  **Heightened (+2)** The slashing, electricity and persistent electricity damage each increase by 1d4.
spells.mud-pit.name: 'Mud Pit'
spells.mud-pit.description: 'Thick mud 1 foot deep covers the ground in a 15-foot burst for 1 minute: difficult terrain.'
spells.natures-enmity.name: "Nature's Enmity"
spells.natures-enmity.description: "For 10 minutes, nature turns against up to five targets in a 500-foot burst while they stay there: a -10-foot circumstance penalty to Speed near plants; at the start of each turn a DC 8 flat check, on a failure animals attack for 2d10 slashing damage (basic Reflex save) and it's off-guard for 1 round unless it critically succeeds; a DC 5 flat check to cast primal spells; and animal, fungus and plant creatures turn hostile to it."
spells.noxious-vapors.name: 'Noxious Vapors'
spells.noxious-vapors.description: |-
  Toxic smoke fills a 10-foot emanation around you for 1 round: each other creature in it takes 1d6 poison damage with a basic Fortitude save, sickened 1 on a critical failure. Creatures in the smoke are concealed, and those outside are concealed to those inside.

  **Heightened (+1)** The damage increases by 1d6.
spells.object-reading.name: 'Object Reading'
spells.object-reading.description: |-
  Touching an object, you learn one piece of information, as the GM decides, about an emotional event involving it in the past week. Casting it again tells you more about that event or another one.

  **Heightened (2nd)** Within the last month.

  **Heightened (4th)** Within the last year.

  **Heightened (6th)** Within the last decade.

  **Heightened (8th)** Within the last century.

  **Heightened (9th)** At any time in the object's history.
spells.phantasmal-treasure.name: 'Phantasmal Treasure'
spells.phantasmal-treasure.description: 'Only the target sees an image of what it treasures most within 60 feet (Will save). Success: fascinated until the end of its turn; it can disbelieve by touching, Seeking or speaking to it. Failure: as success, for 1 minute. Critical failure: as failure, and it spends every action approaching and interacting with the treasure.'
spells.primal-herd.name: 'Primal Herd'
spells.primal-herd.description: 'You and up to five willing creatures become Huge mammoths for 1 minute (a battle form): AC 22 + level, 20 temporary Hit Points, Speed 40 feet, low-light vision, Athletics +30, tusk (4d8+19 piercing), trunk (4d6+16 bludgeoning, agile) and foot (4d6+13 bludgeoning, agile) attacks with reach 15 feet, and Trample.'
spells.protector-tree.name: 'Protector Tree'
spells.protector-tree.description: |-
  A Medium tree with AC 10 and 10 Hit Points grows in a square within 30 feet for 1 minute. When an adjacent ally is hit by a Strike, the tree takes the damage first; any left over goes to the ally.

  **Heightened (+1)** The tree has 10 more Hit Points.
spells.puff-of-poison.name: 'Puff of Poison'
spells.puff-of-poison.description: |-
  Toxic breath at a creature within 10 feet: 1d4 poison damage and 1d4 persistent poison damage (Fortitude save). Success: half the initial damage, no persistent damage. Failure: full. Critical failure: double both.

  **Heightened (+2)** The initial and persistent damage each increase by 1d4.
spells.reapers-lantern.name: "Reaper's Lantern"
spells.reapers-lantern.description: 'A ghostly lantern sheds a 5-foot emanation for 1 minute. Creatures in it when you cast it or that enter later attempt a Fortitude save; on a failure, a living creature gains only half the benefit of healing in the area, and an undead one is enfeebled 1 there. A creature keeps its outcome. Once per turn, from the next round, Sustaining widens the emanation by 5 feet.'
spells.resplendent-mansion.name: 'Resplendent Mansion'
spells.resplendent-mansion.description: "Until your next daily preparations, a mansion of up to four stories and 300 feet on a side stands within 500 feet, furnished and staffed as planar palace's, its doors and windows warded by alarms."
spells.rouse-skeletons.name: 'Rouse Skeletons'
spells.rouse-skeletons.description: |-
  Skeletal forms erupt in a 10-foot burst for up to 1 minute (sustained): difficult terrain, and 2d6 slashing damage to creatures on the ground there with a basic Reflex save. The first time you Sustain it each round, you can move the area up to 20 feet and deal the damage again to creatures in the new area.

  **Heightened (+2)** The damage increases by 1d6.
spells.sacred-form.name: 'Sacred Form'
spells.sacred-form.description: |-
  You take a battle form of your own size wielding a divine armament, for 1 minute: AC 20 + level, 10 temporary Hit Points, Speed 40 feet, resistance 3 to physical damage, darkvision, Athletics +23, and a sacred armament (+21 to hit, 3d6 bludgeoning plus 1d6 spirit damage, +8 damage or +6 ranged), which can take your deity's favored weapon's form. You can still use manipulate actions.

  **Heightened (8th)** AC 21 + level, 15 temporary Hit Points, and better attack and damage.
spells.scatter-scree.name: 'Scatter Scree'
spells.scatter-scree.description: |-
  Rocks tumble into two contiguous 5-foot cubes: 2d4 bludgeoning damage with a basic Reflex save, and the ground there is difficult terrain for 1 minute (an Interact clears a square). Casting it again ends the earlier scree.

  **Heightened (+1)** The damage increases by 1d4.
spells.schadenfreude.name: 'Schadenfreude'
spells.schadenfreude.description: "Trigger: you critically fail a save against a foe's effect. The foe attempts a Will save. Success: -1 status penalty to Perception and Will saves for 1 round. Failure: stupefied 1 for 1 round. Critical failure: stupefied 2 for 1 round and stunned 1."
spells.scintillating-safeguard.name: 'Scintillating Safeguard'
spells.scintillating-safeguard.description: |-
  Trigger: an effect would deal physical or energy damage to you or a creature within 30 feet. Up to five willing creatures it would harm gain resistance 10 to one damage type of your choice that it deals, against its initial damage only.

  **Heightened (+1)** The resistance increases by 1.
spells.seal-fate.name: 'Seal Fate'
spells.seal-fate.description: |-
  Choose acid, bludgeoning, cold, electricity, fire, piercing, slashing, sonic or void. The target attempts a Fortitude save. Success: weakness 2 to that type until the end of your next turn. Failure: as success for 1 minute, and if that damage reduces it to 0 Hit Points and it's 7th level or lower, it dies. Critical failure: as failure, forever.

  **Heightened (+2)** The weakness increases by 1 and the level of creature that dies by 4.
spells.shared-invisibility.name: 'Shared Invisibility'
spells.shared-invisibility.description: |-
  For 10 minutes, you and up to five willing creatures are invisible to all but each other while within a 30-foot emanation. One that leaves becomes visible; a hostile action ends the spell after it.

  **Heightened (5th)** Up to ten creatures, for 1 hour.
spells.shrink-item.name: 'Shrink Item'
spells.shrink-item.description: 'A non-magical object up to 20 cubic feet and 80 Bulk shrinks to the size of a coin with negligible Bulk until your next daily preparations. Tossing it on a solid surface or Dismissing the spell restores it.'
spells.spell-riposte.name: 'Spell Riposte'
spells.spell-riposte.description: "Trigger: you're the target of a spell you're aware of. You attempt to counteract it; if you would succeed, it targets its caster instead of you. Spells without targets aren't affected."
spells.spirit-sense.name: 'Spirit Sense'
spells.spirit-sense.description: |-
  For 10 minutes you sense spirits within 30 feet: you get a check to find haunts and spirits even when not Searching, a +1 status bonus to Seek, Recall Knowledge and skill checks about haunts and spirits and to disable haunts, and a +1 status bonus to AC and saves against them.

  **Heightened (6th)** It lasts until your next daily preparations.
spells.spirit-song.name: 'Spirit Song'
spells.spirit-song.description: |-
  Ethereal waves in a 60-foot cone deal 14d6 spirit damage (Fortitude save), reaching incorporeal creatures inside solid objects. Success: half damage and no reactions until its turn. Failure: full damage, no reactions, stunned 1. Critical failure: double damage, no reactions, stunned 2.

  **Heightened (+1)** The damage increases by 2d6.
spells.spiritual-epidemic.name: 'Spiritual Epidemic'
spells.spiritual-epidemic.description: 'The target attempts a Will save. Success: enfeebled 2 and stupefied 2 for 1 round. Failure: enfeebled 2 and stupefied 2 for 1 minute, and enfeebled 1 and stupefied 1 permanently. Critical failure: enfeebled 3 and stupefied 3 for 1 minute, and enfeebled 2 and stupefied 2 permanently. A creature that casts a divine or occult spell on it is targeted by the curse too.'
spells.spout.name: 'Spout'
spells.spout.description: |-
  Water blasts up in a 5-foot cube (or a 5-foot burst centered in a body of water): 2d4 bludgeoning damage with a basic Reflex save; a creature that critically fails is off-guard until the end of your next turn.

  **Heightened (+1)** The damage increases by 1d4.
spells.strange-geometry.name: 'Strange Geometry'
spells.strange-geometry.description: 'Four 10-foot cubes seem to warp for 1 minute. A creature in them or entering one attempts a Will save; on a failure, all terrain in the cubes (even air and walls) is difficult for it, and leaving a cube teleports it out of a random one, as the GM decides.'
spells.sudden-blight.name: 'Sudden Blight'
spells.sudden-blight.description: |-
  Decay spreads in a 20-foot burst: 2d10 void damage to each living creature with a basic Fortitude save (a diseased creature takes a -2 circumstance penalty). You can also wither Small and Tiny plants there.

  **Heightened (+1)** The damage increases by 1d10.
spells.summon-lesser-servitor.name: 'Summon Lesser Servitor'
spells.summon-lesser-servitor.description: |-
  You summon a common celestial, fiend or monitor of level -1, or an otherworldly animal of level -1 with the celestial and holy, fiend and unholy, or monitor traits, for up to 1 minute (sustained). Summoning a holy or unholy servitor your deity's sanctification doesn't allow is anathema.

  **Heightened (2nd)** Level 1 or lower.

  **Heightened (3rd)** Level 2 or lower.

  **Heightened (4th)** Level 3 or lower.
spells.synesthesia.name: 'Synesthesia'
spells.synesthesia.description: |-
  The target's senses swap (Will save). While affected it must succeed at a DC 5 flat check for each concentrate action, everything is concealed from it, and it's clumsy 3 with a -10-foot status penalty to its Speeds. Success: for 1 round. Failure: for 1 minute. Critical failure: as failure, and stunned 2.

  **Heightened (9th)** Up to five targets.
spells.telepathic-demand.name: 'Telepathic Demand'
spells.telepathic-demand.description: "You send a message of 25 words or fewer to a creature you've been in telepathic contact with before, anywhere on the planet; it can reply in kind. The message works as a suggestion spell. On a success the target is immune for 1 day, on a critical success for 1 month."
spells.thoughtful-gift.name: 'Thoughtful Gift'
spells.thoughtful-gift.description: "You teleport a light or negligible object from your hand into a willing creature's hand within 120 feet (or onto the ground at its feet). With 3 actions, the range is 1 mile and you need no line of sight, but you must know the target very well."
spells.threefold-aspect.name: 'Threefold Aspect'
spells.threefold-aspect.description: 'Until your next daily preparations you can appear as a young adult, an adult or an elder (Sustaining switches), always recognizably yourself. You gain a +4 status bonus to Deception checks to pass as that age, adding your level even if untrained. You can Dismiss the spell.'
spells.vampiric-maiden.name: 'Vampiric Maiden'
spells.vampiric-maiden.description: |-
  A ghostly iron maiden deals 4d4 piercing and 4d4 void damage (Fortitude save), and you gain temporary Hit Points equal to the void damage taken, for 1 minute. Success: half damage. Failure: full damage and immobilized for 1 round or until it Interacts to get free. Critical failure: double damage and immobilized for 1 round or until it Escapes.

  **Heightened (+1)** The piercing and void damage each increase by 1d4.
spells.visions-of-danger.name: 'Visions of Danger'
spells.visions-of-danger.description: |-
  Illusory swarming monsters fill a 30-foot burst for 1 minute: 8d8 mental damage with a basic Will save to each creature there when it appears, entering it or starting its turn there. A critical success, Interacting with or Seeking a monster lets a creature disbelieve and take no more damage.

  **Heightened (+1)** The damage increases by 1d8.
spells.vomit-swarm.name: 'Vomit Swarm'
spells.vomit-swarm.description: |-
  Magical vermin swarm a 30-foot cone: 2d8 piercing damage with a basic Reflex save, and sickened 1 on a failure.

  **Heightened (+1)** The damage increases by 1d8.
spells.wall-of-flesh.name: 'Wall of Flesh'
spells.wall-of-flesh.description: |-
  A 20-foot-tall, 3-foot-thick wall of living flesh up to 30 feet long stands for 1 minute. Pick a feature: mouths (they Strike creatures ending a turn within 5 feet, with your spell attack, for 2d6 piercing damage), eyes (you see through them, +2 circumstance to visual Perception) or arms (a creature ending a turn within 5 feet attempts a Reflex save: grabbed on a failure, restrained on a critical failure).

  **Heightened (+2)** Each section's Hit Points increase by 10, and the mouths' damage increases.
spells.wanderers-guide.name: "Wanderer's Guide"
spells.wanderers-guide.description: "Until your next daily preparations, choose a destination: you and allies traveling overland with you halve the movement penalty from difficult terrain while you keep to the route. It doesn't affect encounters."
spells.weapon-of-judgment.name: 'Weapon of Judgment'
spells.weapon-of-judgment.description: "A spiritual weapon in your deity's favored weapon's shape hovers over the target for 1 minute. Name war (one creature: the weapon Strikes the target at the end of each of its turns it didn't attack that creature) or peace (up to five allies: it Strikes each time the target uses a hostile action against you or them). Its Strikes use your spell attack and deal 4d10 damage of the weapon's type, or spirit if worse for the target."
spells.web.name: 'Web'
spells.web.description: 'A sticky web fills a 10-foot burst for 1 minute: difficult terrain. A creature starting a move action in it or entering it attempts an Athletics check or Reflex save. Critical success: unaffected this turn. Success: unaffected this action. Failure: -10-foot circumstance penalty to its Speeds until its next turn. Critical failure: immobilized until its next turn. Slashing or fire damage clears a square.'
spells.whispers-of-the-void.name: 'Whispers of the Void'
spells.whispers-of-the-void.description: |-
  Baleful whispers in a 10-foot burst (Fortitude save). Success: 2d8 persistent void damage. Failure: 4d8 persistent void damage and drained 1. Critical failure: 4d8 persistent void damage, drained 2 and doomed 1.

  **Heightened (+2)** The persistent damage increases by 1d8 on a success, 2d8 on a failure or critical failure.
