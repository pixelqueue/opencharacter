# The class.
classes.champion.name: 'Champion'
classes.champion.description: "A divine warrior sworn to a deity and a cause. Key attribute: Strength or Dexterity. 10 Hit Points plus Constitution per level. Trained in Perception and Reflex, expert in Fortitude and Will; trained in simple and martial weapons and unarmed attacks; trained in all armor and unarmored defense; trained in the champion class DC, spell attack modifier and spell DC. Trained in Religion, your deity's skill and 2 more skills plus Intelligence. You gain your deity's favored weapon, a 15-foot champion's aura, a cause with its champion's reaction, a devotion spell (divine, Charisma) with 1 Focus Point, and Shield Block."
