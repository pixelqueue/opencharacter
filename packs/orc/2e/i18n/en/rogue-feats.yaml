# Rogue feats to 20th level. Short rules text written for the pack.

# Debilitations.
classes.rogue.debilitations.no-flanking.name: "Can't flank"
classes.rogue.debilitations.no-flanking.description: "Can't flank or help allies flank."
classes.rogue.debilitations.no-cover.name: 'No cover from shields'
classes.rogue.debilitations.no-cover.description: 'No circumstance bonus to AC from a raised shield, lesser or standard cover; +2 only from greater cover or Taking Cover.'
classes.rogue.debilitations.no-reactions.name: "Can't react"
classes.rogue.debilitations.no-reactions.description: "Can't use reactions."
classes.rogue.debilitations.weakness.name: 'Weakness 5'
classes.rogue.debilitations.weakness.description: 'Weakness 5 to the chosen physical damage type.'
classes.rogue.debilitations.weakness.state.damageType.name: 'Damage type'

feats.rogue.bullseye.name: 'Bullseye'
feats.rogue.bullseye.description: "One action. Your next Strike with a thrown weapon this turn gains a +1 circumstance bonus to the attack roll and ignores the target's concealment and lesser or standard cover (greater cover becomes standard)."
feats.rogue.delay-trap.name: 'Delay Trap'
feats.rogue.delay-trap.description: "Reaction. Trigger: a trap within your reach is triggered. Attempt Thievery to Disable a Device on it. **Critical Success** Prevent the trap or delay it to the start or end of your next turn. **Success** As critical success, the GM choosing the worse for you. **Failure** No effect. **Critical Failure** You're off-guard until the start of your next turn."
feats.rogue.improved-poison-weapon.name: 'Improved Poison Weapon'
feats.rogue.improved-poison-weapon.description: "A simple poison you apply with Poison Weapon deals 2d4 poison damage instead of 1d4, and isn't wasted on a critically failed attack roll."
feats.rogue.improved-poison-weapon.prerequisites.poison-weapon: 'Poison Weapon'
feats.rogue.inspired-stratagem.name: 'Inspired Stratagem'
feats.rogue.inspired-stratagem.description: 'During daily preparations you plan with up to five allies. Reaction (fortune, linguistic). Trigger: one of them is about to roll an attack or skill check. It rolls twice and takes the better, then is immune until your next preparations.'
feats.rogue.nimble-roll.name: 'Nimble Roll'
feats.rogue.nimble-roll.description: 'You can use Nimble Dodge before a Reflex save, adding its bonus to the save. When the attack fails or the save succeeds, you can Stride (or Fly or Swim) up to 10 feet as part of the reaction (gaining the move trait).'
feats.rogue.nimble-roll.prerequisites.nimble-dodge: 'Nimble Dodge'
feats.rogue.opportune-backstab.name: 'Opportune Backstab'
feats.rogue.opportune-backstab.description: 'Reaction. Trigger: an ally hits a creature within your melee reach with a melee attack. Strike that creature.'
feats.rogue.opportune-backstab.actions.opportune-backstab.name: 'Opportune Backstab'
feats.rogue.opportune-backstab.actions.opportune-backstab.steps.weapon.prompt: 'Choose a weapon'
feats.rogue.predictive-purchase-rogue.name: 'Predictive Purchase (Rogue)'
feats.rogue.predictive-purchase-rogue.description: 'You gain Prescient Planner and Prescient Consumable, and can draw a Prescient Planner item from your pack as a 2-action activity instead of 1 minute.'
feats.rogue.ricochet-stance-rogue.name: 'Ricochet Stance (Rogue)'
feats.rogue.ricochet-stance-rogue.description: 'Stance. Your thrown weapons that deal bludgeoning or slashing damage return to your hand after a ranged Strike within their range increment (with a hand free to catch them); beyond it they fly back that many feet and drop.'
feats.rogue.sidestep.name: 'Sidestep'
feats.rogue.sidestep.description: "Reaction. Trigger: a Strike's attack roll against you fails or critically fails. Redirect it to a creature adjacent to you within its reach or range; the attacker rerolls against the new target."
feats.rogue.sly-striker.name: 'Sly Striker'
feats.rogue.sly-striker.description: "When you hit a creature that isn't off-guard with a weapon or unarmed attack you could sneak attack with, you deal 1d6 precision damage (2d6 from 14th level, if your sneak attack is 3d6 or more)."
feats.rogue.sly-striker.prerequisites.sneak: 'Sneak attack'
feats.rogue.swipe-souvenir.name: 'Swipe Souvenir'
feats.rogue.swipe-souvenir.description: "Two actions. Requirement: you're grabbed or restrained. Try to Escape; if you succeed you can also try to Steal from that creature, even in combat."
feats.rogue.tactical-entry.name: 'Tactical Entry'
feats.rogue.tactical-entry.description: 'Free action. Requirement: you rolled Stealth for initiative and no one has acted yet. Stride without triggering reactions.'
feats.rogue.tactical-entry.prerequisites.stealth: 'Master in Stealth'
feats.rogue.methodical-debilitations.name: 'Methodical Debilitations'
feats.rogue.methodical-debilitations.description: "Debilitating Strike gains two debilitations: the target can't flank or help flank; or it gains no circumstance bonus to AC from a raised shield or lesser or standard cover (+2 only from greater cover or Taking Cover)."
feats.rogue.methodical-debilitations.prerequisites.racket: 'Mastermind racket'
feats.rogue.methodical-debilitations.prerequisites.debilitating: 'Debilitating Strike'
feats.rogue.methodical-debilitations.options.no-flanking.name: "Can't flank"
feats.rogue.methodical-debilitations.options.no-cover.name: 'No cover from shields or lesser cover'
feats.rogue.nimble-strike.name: 'Nimble Strike'
feats.rogue.nimble-strike.description: 'When you use Nimble Dodge, you can make a melee Strike against the triggering creature, outside your multiple attack penalty (during the roll, with Nimble Roll).'
feats.rogue.nimble-strike.prerequisites.nimble-roll: 'Nimble Roll'
feats.rogue.precise-debilitations.name: 'Precise Debilitations'
feats.rogue.precise-debilitations.description: "Debilitating Strike gains two debilitations: the target takes 2d6 more precision damage from your attacks; or it's off-guard."
feats.rogue.precise-debilitations.prerequisites.racket: 'Thief racket'
feats.rogue.precise-debilitations.prerequisites.debilitating: 'Debilitating Strike'
feats.rogue.precise-debilitations.options.off-guard.name: 'Off-guard'
feats.rogue.sneak-adept.name: 'Sneak Adept'
feats.rogue.sneak-adept.description: 'A failure to Sneak is a success instead (a critical failure stays one).'
feats.rogue.sneak-adept.prerequisites.stealth: 'Master in Stealth'
feats.rogue.tactical-debilitations.name: 'Tactical Debilitations'
feats.rogue.tactical-debilitations.description: "Debilitating Strike gains two debilitations: the target can't use reactions; or it can't flank or help flank."
feats.rogue.tactical-debilitations.prerequisites.racket: 'Scoundrel racket'
feats.rogue.tactical-debilitations.prerequisites.debilitating: 'Debilitating Strike'
feats.rogue.tactical-debilitations.options.no-reactions.name: "Can't react"
feats.rogue.tactical-debilitations.options.no-flanking-tactical.name: "Can't flank"
feats.rogue.vicious-debilitations.name: 'Vicious Debilitations'
feats.rogue.vicious-debilitations.description: 'Debilitating Strike gains two debilitations: weakness 5 to bludgeoning, piercing or slashing damage (your choice); or clumsy 1.'
feats.rogue.vicious-debilitations.prerequisites.racket: 'Ruffian racket'
feats.rogue.vicious-debilitations.prerequisites.debilitating: 'Debilitating Strike'
feats.rogue.vicious-debilitations.options.weakness.name: 'Weakness 5 to a physical damage type'
feats.rogue.vicious-debilitations.options.clumsy.name: 'Clumsy 1'
feats.rogue.bloody-debilitation.name: 'Bloody Debilitation'
feats.rogue.bloody-debilitation.description: 'Debilitating Strike gains a debilitation: 3d6 persistent bleed damage.'
feats.rogue.bloody-debilitation.prerequisites.medicine: 'Trained in Medicine'
feats.rogue.bloody-debilitation.prerequisites.debilitating: 'Debilitating Strike'
feats.rogue.bloody-debilitation.options.bleed.name: '3d6 persistent bleed damage'
feats.rogue.critical-debilitation.name: 'Critical Debilitation'
feats.rogue.critical-debilitation.description: 'When you critically hit and use Debilitating Strike, you can choose this debilitation: the target attempts a Fortitude save against your class DC. **Critical Success** Unaffected. **Success** Slowed 1 until the end of your next turn. **Failure** Slowed 2. **Critical Failure** Paralyzed until the end of your next turn.'
feats.rogue.critical-debilitation.prerequisites.debilitating: 'Debilitating Strike'
feats.rogue.fantastic-leap.name: 'Fantastic Leap'
feats.rogue.fantastic-leap.description: "Two actions. High Jump (as far as a Long Jump) or Long Jump, then make a melee Strike at the end; you land unhurt if the fall is no farther than the jump's height."
feats.rogue.felling-shot.name: 'Felling Shot'
feats.rogue.felling-shot.description: "Two actions. Make a ranged Strike against an off-guard creature; if it hits and deals damage, the target attempts a Reflex save against your class DC. **Success** Unaffected. **Failure** It falls up to 120 feet, unhurt by landing. **Critical Failure** As failure, and it can't fly, jump or levitate until the end of your next turn."
feats.rogue.preparation.name: 'Preparation'
feats.rogue.preparation.description: 'One action, flourish. You gain one more reaction, usable before your next turn for any rogue reaction.'
feats.rogue.reactive-interference.name: 'Reactive Interference'
feats.rogue.reactive-interference.description: 'Reaction. Trigger: an adjacent enemy begins a reaction. If its level is no higher than yours you disrupt it; otherwise make an attack roll against its AC, disrupting it on a success.'
feats.rogue.ricochet-feint.name: 'Ricochet Feint'
feats.rogue.ricochet-feint.description: 'In Ricochet Stance you can Feint a creature within the first range increment of a thrown weapon you wield, not only in melee reach.'
feats.rogue.ricochet-feint.prerequisites.ricochet-stance-rogue: 'Ricochet Stance (Rogue)'
feats.rogue.spring-from-the-shadows.name: 'Spring from the Shadows'
feats.rogue.spring-from-the-shadows.description: "One action, flourish. Stride (or Burrow, Climb, Fly or Swim) up to your Speed, ending next to an enemy you're hidden from or undetected by, and Strike it, staying hidden or undetected until after the Strike."
feats.rogue.defensive-roll.name: 'Defensive Roll'
feats.rogue.defensive-roll.description: 'Free action, once per 10 minutes. Trigger: a physical attack would reduce you to 0 Hit Points. You take half its damage.'
feats.rogue.instant-opening.name: 'Instant Opening'
feats.rogue.instant-opening.description: 'One action, concentrate (auditory or visual, as you describe it). A target within 30 feet is off-guard to your attacks until the end of your next turn.'
feats.rogue.instant-opening.actions.instant-opening.name: 'Instant Opening'
feats.rogue.instant-opening.actions.instant-opening.participants.target.name: 'Target'
feats.rogue.instant-opening.actions.instant-opening.results.opened.name: 'Off-guard'
feats.rogue.leave-an-opening.name: 'Leave An Opening'
feats.rogue.leave-an-opening.description: 'When you critically hit an off-guard foe with a melee attack and deal damage, one ally of your choice with Reactive Strike can use it against that foe, as if it used a manipulate action.'
feats.rogue.sense-the-unseen.name: 'Sense the Unseen'
feats.rogue.sense-the-unseen.description: 'Reaction. Trigger: you fail a check to Seek. Undetected creatures in the area you searched become hidden to you instead.'
feats.rogue.stay-down.name: 'Stay Down!'
feats.rogue.stay-down.description: "Reaction. Trigger: a prone foe within your reach Stands. Attempt Athletics against its Fortitude DC; on a success the Stand is disrupted, and on a critical success it can't Stand until its next turn."
feats.rogue.stay-down.prerequisites.athletics: 'Master in Athletics'
feats.rogue.blank-slate.name: 'Blank Slate'
feats.rogue.blank-slate.description: 'Detection, revelation and scrying effects find nothing of you, your possessions or your auras unless their counteract rank is 10 or higher.'
feats.rogue.blank-slate.prerequisites.deception: 'Legendary in Deception'
feats.rogue.cloud-step.name: 'Cloud Step'
feats.rogue.cloud-step.description: 'When you Stride, you can cross water, air and surfaces that hold little weight as if they were ground, without triggering weight-sensitive traps; at the end of your turn you sink, fall or trigger as normal.'
feats.rogue.cloud-step.prerequisites.acrobatics: 'Legendary in Acrobatics'
feats.rogue.cognitive-loophole.name: 'Cognitive Loophole'
feats.rogue.cognitive-loophole.description: 'Reaction. Requirement: a mental effect affects you. Trigger: your turn ends. You ignore one mental effect until the end of your next turn (once per effect, not one you chose), even if it bars reactions.'
feats.rogue.dispelling-slice.name: 'Dispelling Slice'
feats.rogue.dispelling-slice.description: 'Two actions. Strike an off-guard creature; if it deals sneak attack damage, try to counteract one spell on the target (counteract rank half your level rounded up, modifier your class DC - 10).'
feats.rogue.perfect-distraction.name: 'Perfect Distraction'
feats.rogue.perfect-distraction.description: "One action. Sneak, leaving a decoy that works as the mislead spell (you're undetected, not invisible); you can keep moving it as with the spell. Setting up another decoy takes 10 minutes."
feats.rogue.perfect-distraction.prerequisites.deception: 'Legendary in Deception'
feats.rogue.reconstruct-the-scene.name: 'Reconstruct The Scene'
feats.rogue.reconstruct-the-scene.description: 'Over 1 minute you survey a small area (a room) and get an indistinct impression of significant events there in the last day and their timing, plus small details that could be clues (the GM decides); not enough to identify unknown participants.'
feats.rogue.swift-elusion.name: 'Swift Elusion'
feats.rogue.swift-elusion.description: 'Reaction. Trigger: a foe ends its movement adjacent to you. Attempt Acrobatics against its Reflex DC; on a success Stride to another space adjacent to it, or move it to another space adjacent to you.'
feats.rogue.swift-elusion.prerequisites.acrobatics: 'Legendary in Acrobatics'
feats.rogue.implausible-infiltration.name: 'Implausible Infiltration'
feats.rogue.implausible-infiltration.description: "Two actions, move. Requirement: adjacent to a floor or wall. You squeeze through it, unless it's not wood, plaster or stone, is over 10 feet thick or has any metal in it (a ceiling too, with a climb Speed)."
feats.rogue.implausible-infiltration.prerequisites.acrobatics: 'Legendary in Acrobatics'
feats.rogue.implausible-infiltration.prerequisites.quick-squeeze: 'Quick Squeeze'
feats.rogue.implausible-purchase-rogue.name: 'Implausible Purchase (Rogue)'
feats.rogue.implausible-purchase-rogue.description: 'You can use Prescient Planner even after buying goods, drawing the item as one action, and five times a day pull out a common consumable up to 6 levels below yours.'
feats.rogue.implausible-purchase-rogue.prerequisites.predictive-purchase-rogue: 'Predictive Purchase (Rogue)'
feats.rogue.powerful-sneak.name: 'Powerful Sneak'
feats.rogue.powerful-sneak.description: "Your sneak attack ignores immunity and resistance to precision damage. When you Sneak, you can designate a creature you're undetected by: your next attack against it before the end of your next turn treats sneak attack dice below 3 as 3."
feats.rogue.hidden-paragon.name: 'Hidden Paragon'
feats.rogue.hidden-paragon.description: "Reaction, once per hour. Trigger: you Hide and become hidden from all current foes, or Sneak and become undetected by all of them. You're invisible for 1 minute, even after hostile actions, and nothing that reveals the invisible reveals you (Seek still works)."
feats.rogue.hidden-paragon.prerequisites.stealth: 'Legendary in Stealth'
feats.rogue.impossible-striker.name: 'Impossible Striker'
feats.rogue.impossible-striker.description: "Instead of Sly Striker's damage, you deal your full sneak attack damage to targets that aren't off-guard."
feats.rogue.impossible-striker.prerequisites.sly-striker: 'Sly Striker'
feats.rogue.reactive-distraction.name: 'Reactive Distraction'
feats.rogue.reactive-distraction.description: "Reaction. Requirement: Perfect Distraction is ready. Trigger: you would be hit by an attack or targeted by or in an effect. You use Perfect Distraction even while observed, ending concealed or in cover; the decoy is targeted instead (both of you in an area you don't leave)."
feats.rogue.reactive-distraction.prerequisites.deception: 'Legendary in Deception'
feats.rogue.reactive-distraction.prerequisites.perfect-distraction: 'Perfect Distraction'
tags.debilitation.name: 'Debilitation'
