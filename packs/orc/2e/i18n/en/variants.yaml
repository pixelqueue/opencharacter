# Variant rules (GM Core).
groups.variants.label: Variant rules
fields.variants.freeArchetype.name: Free Archetype
fields.variants.freeArchetype.description: >-
  An extra class feat at 2nd level and every even level after, for archetype feats only.
fields.variants.automaticBonus.name: Automatic Bonus Progression
fields.variants.automaticBonus.description: >-
  Potency bonuses that grow with your level replace runes' and items' bonuses.
fields.variants.noLevel.name: Proficiency without Level
fields.variants.noLevel.description: >-
  Proficiency bonuses don't add your level, and untrained is -2.
fields.abp.attack.name: Attack potency
fields.abp.defense.name: Defense potency
fields.abp.perception.name: Perception potency
fields.abp.saves.name: Saving throw potency
tags.abp-skill.name: Skill potency
tags.potency.name: Potency
constraints.skill-potency: A skill's potency bonus is higher than your level allows
features.variants.automatic-bonus-progression.name: Automatic bonus progression
features.variants.automatic-bonus-progression.description: >-
  Attack potency (+1 at 2nd level, +2 at 10th, +3 at 16th), defense potency (+1 at 5th, +2 at
  11th, +3 at 18th), Perception potency (+1 at 7th, +2 at 13th, +3 at 19th), saving throw potency
  (+1 at 8th, +2 at 14th, +3 at 20th), skill potency from 3rd level, devastating attacks (two
  weapon damage dice at 4th, three at 12th, four at 19th) and an attribute apex at 17th.
features.variants.automatic-bonus-progression.choices.skill-potency.prompt: 'Skill potency (level {slot})'
features.variants.automatic-bonus-progression.choices.apex.prompt: Attribute apex

