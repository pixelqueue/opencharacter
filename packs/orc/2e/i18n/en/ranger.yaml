classes.ranger.choices.class-feat.prompt: 'Ranger feat (level {slot})'
classes.ranger.choices.hunters-edge.prompt: "Hunter's edge"
classes.ranger.choices.key-attribute.options.dex.name: 'Dexterity'
classes.ranger.choices.key-attribute.options.str.name: 'Strength'
classes.ranger.choices.key-attribute.prompt: 'Key attribute'
classes.ranger.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.ranger.choices.skills.prompt: 'Trained skills (4 plus Intelligence)'
classes.ranger.description: 'A hunter who tracks down and brings down chosen prey. Key attribute: Strength or Dexterity. 10 Hit Points plus Constitution per level. Expert in Perception, Fortitude and Reflex; trained in Will, simple and martial weapons, unarmed attacks, light and medium armor, unarmored defense and the ranger class DC. Trained in Nature, Survival and 4 more skills plus Intelligence.'
classes.ranger.edges.flurry.description: 'Your multiple attack penalty for attacks against your hunted prey is –3 (–2 with an agile weapon) on your second attack of the turn and –6 (–4 with an agile weapon) on later ones. At 17th level, with a weapon you are master in, it is –2 and –4 (–1 and –2 with an agile weapon).'
classes.ranger.edges.flurry.name: 'Flurry'
classes.ranger.edges.outwit.description: 'You gain a +2 circumstance bonus to Deception, Intimidation and Stealth checks against your hunted prey and to checks to Recall Knowledge about it, and a +1 circumstance bonus to AC against its attacks. At 17th level, the skill bonus is +4 in skills you are master in, and the AC bonus is +2 if you are master in your armor.'
classes.ranger.edges.outwit.name: 'Outwit'
classes.ranger.edges.precision.description: 'The first time you hit your hunted prey in a round, you deal 1d8 extra precision damage (2d8 at 11th level, 3d8 at 19th). At 17th level your second hit in a round deals 1d8; at 19th, the second deals 2d8 and the third 1d8.'
classes.ranger.edges.precision.name: 'Precision'
classes.ranger.greater-natural-reflexes.description: 'Your Reflex proficiency becomes legendary. A critical failure on a Reflex save is a failure, and a failed Reflex save against a damaging effect deals half damage.'
classes.ranger.greater-natural-reflexes.name: 'Greater Natural Reflexes'
classes.ranger.greater-weapon-specialization.description: 'Weapon specialization damage becomes 4 at expert, 6 at master and 8 at legendary.'
classes.ranger.greater-weapon-specialization.name: 'Greater Weapon Specialization'
classes.ranger.hunt-prey.actions.hunt-prey.name: 'Hunt Prey'
classes.ranger.hunt-prey.actions.hunt-prey.results.hunting.name: 'Hunting'
classes.ranger.hunt-prey.description: 'One action (concentrate). Designate a creature you can see or hear, or are tracking, as your prey. You gain a +2 circumstance bonus to Perception checks to Seek it and to Survival checks to Track it, and you ignore the penalty for making ranged attacks against it within your second range increment. You have one prey at a time; it lasts until your next daily preparations.'
classes.ranger.hunt-prey.name: 'Hunt Prey'
classes.ranger.martial-weapon-mastery.description: 'Master in simple and martial weapons and unarmed attacks.'
classes.ranger.martial-weapon-mastery.name: 'Martial Weapon Mastery'
classes.ranger.masterful-hunter.description: "Your ranger class DC proficiency becomes master. With a ranged weapon you are master in, you ignore the penalties for your hunted prey being in your second or third range increment. Your bonus to Seek your prey becomes +4 if you are master in Perception, and to Track it +4 if you are master in Survival. Your hunter's edge improves."
classes.ranger.masterful-hunter.name: 'Masterful Hunter'
classes.ranger.medium-armor-expertise.description: 'Expert in light and medium armor and unarmored defense.'
classes.ranger.medium-armor-expertise.name: 'Medium Armor Expertise'
classes.ranger.medium-armor-mastery.description: 'Master in light and medium armor and unarmored defense.'
classes.ranger.medium-armor-mastery.name: 'Medium Armor Mastery'
classes.ranger.name: 'Ranger'
classes.ranger.natural-reflexes.description: 'Your Reflex proficiency becomes master. A success on a Reflex save is a critical success.'
classes.ranger.natural-reflexes.name: 'Natural Reflexes'
classes.ranger.natures-edge.description: 'Enemies in difficult terrain are off-guard to you.'
classes.ranger.natures-edge.name: "Nature's Edge"
classes.ranger.perception-legend.description: 'Your Perception proficiency becomes legendary.'
classes.ranger.perception-legend.name: 'Perception Legend'
classes.ranger.perception-mastery.description: 'Your Perception proficiency becomes master.'
classes.ranger.perception-mastery.name: 'Perception Mastery'
classes.ranger.ranger-expertise.description: 'Your ranger class DC proficiency becomes expert.'
classes.ranger.ranger-expertise.name: 'Ranger Expertise'
classes.ranger.ranger-weapon-expertise.description: 'Expert in simple and martial weapons and unarmed attacks. You apply critical specialization effects of these weapons when attacking your hunted prey.'
classes.ranger.ranger-weapon-expertise.name: 'Ranger Weapon Expertise'
classes.ranger.swift-prey.description: 'Hunt Prey is a free action if it is your first action of the turn.'
classes.ranger.swift-prey.name: 'Swift Prey'
classes.ranger.trackless-journey.description: 'In natural terrain, you always gain the benefits of Cover Tracks, without moving at half Speed.'
classes.ranger.trackless-journey.name: 'Trackless Journey'
classes.ranger.unimpeded-journey.description: 'You ignore difficult terrain, and treat greater difficult terrain as difficult terrain.'
classes.ranger.unimpeded-journey.name: 'Unimpeded Journey'
classes.ranger.wardens-endurance.description: 'Your Fortitude proficiency becomes master. A success on a Fortitude save is a critical success.'
classes.ranger.wardens-endurance.name: "Warden's Endurance"
classes.ranger.weapon-specialization.description: '2 extra damage with weapons and unarmed attacks you are expert in, 3 at master and 4 at legendary.'
classes.ranger.weapon-specialization.name: 'Weapon Specialization'
classes.ranger.will-expertise.description: 'Your Will proficiency becomes expert.'
classes.ranger.will-expertise.name: 'Will Expertise'
feats.ranger.additional-recollection.description: 'Free action. Trigger: you succeed at Recall Knowledge about your hunted prey. You immediately Recall Knowledge about a different creature you can perceive.'
feats.ranger.additional-recollection.name: 'Additional Recollection'
feats.ranger.advanced-warden.description: "You gain an advanced warden spell (Animal Feature, Enlarge Companion, Hunter's Luck, Soothing Mist) or a lower-tier one, and a Focus Point. You can take this feat more than once, choosing a different spell."
feats.ranger.advanced-warden.choices.spell.prompt: 'Warden spell'
feats.ranger.advanced-warden.choices.spell.options.gravity-weapon.name: 'Gravity Weapon'
feats.ranger.advanced-warden.choices.spell.options.heal-companion.name: 'Heal Companion'
feats.ranger.advanced-warden.choices.spell.options.magic-hide.name: 'Magic Hide'
feats.ranger.advanced-warden.choices.spell.options.animal-feature.name: 'Animal Feature'
feats.ranger.advanced-warden.choices.spell.options.enlarge-companion.name: 'Enlarge Companion'
feats.ranger.advanced-warden.choices.spell.options.hunters-luck.name: "Hunter's Luck"
feats.ranger.advanced-warden.choices.spell.options.soothing-mist.name: 'Soothing Mist'
feats.ranger.advanced-warden.name: 'Advanced Warden'
feats.ranger.advanced-warden.prerequisites.initiate-warden: 'Initiate Warden'
feats.ranger.animal-companion.description: "You gain a young animal companion. When you Hunt Prey, it gains the benefits of Hunt Prey and of your hunter's edge."
feats.ranger.animal-companion.name: 'Animal Companion'
feats.ranger.animal-empathy.description: 'You can use Diplomacy to Make an Impression on animals and to make very simple Requests of them.'
feats.ranger.animal-empathy.name: 'Animal Empathy'
feats.ranger.companions-cry.description: 'You can spend two actions to Command an Animal; your animal companion then gains an extra action.'
feats.ranger.companions-cry.name: "Companion's Cry"
feats.ranger.companions-cry.prerequisites.animal-companion: 'An animal companion'
feats.ranger.crossbow-ace.description: 'Requirement: you wield a crossbow with reload 1 or more. Create a Diversion or Take Cover, then Interact to reload.'
feats.ranger.crossbow-ace.name: 'Crossbow Ace'
feats.ranger.disrupt-prey.actions.disrupt-prey.name: 'Disrupt Prey'
feats.ranger.disrupt-prey.actions.disrupt-prey.steps.weapon.prompt: 'Choose a melee weapon'
feats.ranger.disrupt-prey.description: 'Reaction. Trigger: your hunted prey within your reach uses a manipulate or move action, or leaves a square during a move action. Make a melee Strike against it. On a critical hit, you disrupt the triggering action.'
feats.ranger.disrupt-prey.name: 'Disrupt Prey'
feats.ranger.far-shot.description: 'The range increments of your ranged weapons are doubled.'
feats.ranger.far-shot.name: 'Far Shot'
feats.ranger.favored-prey.choices.prey.options.animals.name: 'Animals'
feats.ranger.favored-prey.choices.prey.options.beasts.name: 'Beasts'
feats.ranger.favored-prey.choices.prey.options.dragons.name: 'Dragons'
feats.ranger.favored-prey.choices.prey.options.fungi-and-plants.name: 'Fungi and plants'
feats.ranger.favored-prey.choices.prey.prompt: 'Favored prey'
feats.ranger.favored-prey.description: "Choose animals, beasts, dragons, or fungi and plants. When you roll initiative and can see an enemy of that kind, you can Hunt Prey on it as a free action, even if you haven't identified it."
feats.ranger.favored-prey.name: 'Favored Prey'
feats.ranger.favored-terrain.choices.terrain.options.aquatic.name: 'Aquatic'
feats.ranger.favored-terrain.choices.terrain.options.arctic.name: 'Arctic'
feats.ranger.favored-terrain.choices.terrain.options.desert.name: 'Desert'
feats.ranger.favored-terrain.choices.terrain.options.forest.name: 'Forest'
feats.ranger.favored-terrain.choices.terrain.options.mountain.name: 'Mountain'
feats.ranger.favored-terrain.choices.terrain.options.plains.name: 'Plains'
feats.ranger.favored-terrain.choices.terrain.options.sky.name: 'Sky'
feats.ranger.favored-terrain.choices.terrain.options.swamp.name: 'Swamp'
feats.ranger.favored-terrain.choices.terrain.options.underground.name: 'Underground'
feats.ranger.favored-terrain.choices.terrain.prompt: 'Favored terrain'
feats.ranger.favored-terrain.description: 'Choose aquatic, arctic, desert, forest, mountain, plains, sky, swamp or underground. In that terrain you ignore non-magical difficult terrain. With Unimpeded Journey you gain a further benefit there.'
feats.ranger.favored-terrain.name: 'Favored Terrain'
feats.ranger.hunted-shot.actions.hunted-shot.name: 'Hunted Shot'
feats.ranger.hunted-shot.actions.hunted-shot.steps.first.prompt: 'Choose a ranged weapon'
feats.ranger.hunted-shot.actions.hunted-shot.steps.second.prompt: 'Choose the same weapon for the second Strike'
feats.ranger.hunted-shot.description: 'Flourish. Requirement: a ranged weapon with reload 0. Make two Strikes against your hunted prey with it. If both hit, combine their damage for resistances and weaknesses. Both count toward your multiple attack penalty.'
feats.ranger.hunted-shot.name: 'Hunted Shot'
feats.ranger.hunters-aim.actions.hunters-aim.name: "Hunter's Aim"
feats.ranger.hunters-aim.actions.hunters-aim.steps.weapon.prompt: 'Choose a ranged weapon'
feats.ranger.hunters-aim.description: 'Two actions (concentrate). Make a ranged Strike against your hunted prey with a +2 circumstance bonus to the attack roll, ignoring its concealed condition and lesser cover.'
feats.ranger.hunters-aim.name: "Hunter's Aim"
feats.ranger.initiate-warden.description: 'You gain an initial warden spell (Gravity Weapon, Heal Companion or Magic Hide) and a Focus Point. You can take this feat more than once, choosing a different spell.'
feats.ranger.initiate-warden.choices.spell.prompt: 'Warden spell'
feats.ranger.initiate-warden.choices.spell.options.gravity-weapon.name: 'Gravity Weapon'
feats.ranger.initiate-warden.choices.spell.options.heal-companion.name: 'Heal Companion'
feats.ranger.initiate-warden.choices.spell.options.magic-hide.name: 'Magic Hide'
feats.ranger.initiate-warden.name: 'Initiate Warden'
feats.ranger.masterful-warden.description: "You gain a master warden spell (Ephemeral Tracking, Ranger's Bramble) or a lower-tier one, and a Focus Point. You can take this feat more than once, choosing a different spell."
feats.ranger.masterful-warden.choices.spell.prompt: 'Warden spell'
feats.ranger.masterful-warden.choices.spell.options.gravity-weapon.name: 'Gravity Weapon'
feats.ranger.masterful-warden.choices.spell.options.heal-companion.name: 'Heal Companion'
feats.ranger.masterful-warden.choices.spell.options.magic-hide.name: 'Magic Hide'
feats.ranger.masterful-warden.choices.spell.options.animal-feature.name: 'Animal Feature'
feats.ranger.masterful-warden.choices.spell.options.enlarge-companion.name: 'Enlarge Companion'
feats.ranger.masterful-warden.choices.spell.options.hunters-luck.name: "Hunter's Luck"
feats.ranger.masterful-warden.choices.spell.options.soothing-mist.name: 'Soothing Mist'
feats.ranger.masterful-warden.choices.spell.options.ephemeral-tracking.name: 'Ephemeral Tracking'
feats.ranger.masterful-warden.choices.spell.options.rangers-bramble.name: "Ranger's Bramble"
feats.ranger.masterful-warden.name: 'Masterful Warden'
feats.ranger.masterful-warden.prerequisites.initiate-warden: 'Initiate Warden'
feats.ranger.mature-animal-companion.description: "Your animal companion becomes mature. If you don't Command it, it can still take one action on your turn to Stride or Strike."
feats.ranger.mature-animal-companion.name: 'Mature Animal Companion'
feats.ranger.mature-animal-companion.prerequisites.animal-companion: 'Animal Companion'
feats.ranger.monster-hunter.description: 'As part of Hunt Prey, you can Recall Knowledge about your prey. On a critical success, you and allies you tell gain a +1 circumstance bonus to your next attack roll against it (once a day per creature).'
feats.ranger.monster-hunter.name: 'Monster Hunter'
feats.ranger.monster-warden.description: "Anyone who gains Monster Hunter's bonus also gains a +2 circumstance bonus to AC against that creature's next attack or to their next save against its effects, whichever comes first."
feats.ranger.monster-warden.name: 'Monster Warden'
feats.ranger.monster-warden.prerequisites.monster-hunter: 'Monster Hunter'
feats.ranger.quick-draw.actions.quick-draw.name: 'Quick Draw'
feats.ranger.quick-draw.actions.quick-draw.steps.weapon.prompt: 'Choose a weapon to draw'
feats.ranger.quick-draw.description: 'Interact to draw a weapon, then Strike with it.'
feats.ranger.quick-draw.name: 'Quick Draw'
feats.ranger.running-reload.description: 'Stride, Step or Sneak, then Interact to reload.'
feats.ranger.running-reload.name: 'Running Reload'
feats.ranger.scouts-warning.description: 'Free action. Trigger: you are about to roll Perception or Survival for initiative. Your allies gain a +1 circumstance bonus to their initiative rolls, or +2 if you were Scouting.'
feats.ranger.scouts-warning.name: "Scout's Warning"
feats.ranger.skirmish-strike.actions.skirmish-strike.name: 'Skirmish Strike'
feats.ranger.skirmish-strike.actions.skirmish-strike.steps.weapon.prompt: 'Choose a weapon'
feats.ranger.skirmish-strike.description: 'Flourish. Step and then Strike, or Strike and then Step.'
feats.ranger.skirmish-strike.name: 'Skirmish Strike'
feats.ranger.snap-shot.description: 'A reaction that would let you make a melee Strike can instead let you make a ranged Strike against an adjacent creature; your ranged weapon counts as having 5-foot reach for its trigger.'
feats.ranger.snap-shot.name: 'Snap Shot'
feats.ranger.swift-tracker.description: "You Track at your full Speed. At master Survival you don't roll every hour; at legendary you can do another exploration activity while Tracking. If you roll Survival for initiative while tracking your prey, you can Stride toward it as a free action at the start of your first turn."
feats.ranger.swift-tracker.prerequisites.survival: 'Expert in Survival'
feats.ranger.swift-tracker.prerequisites.experienced-tracker: 'Experienced Tracker'
feats.ranger.swift-tracker.name: 'Swift Tracker'
feats.ranger.twin-parry.actions.twin-parry.name: 'Twin Parry'
feats.ranger.twin-parry.description: 'Requirement: a melee weapon in each hand. You gain a +1 circumstance bonus to AC until the start of your next turn, or +2 if either weapon has the parry trait.'
feats.ranger.twin-parry.name: 'Twin Parry'
feats.ranger.twin-takedown.actions.twin-takedown.name: 'Twin Takedown'
feats.ranger.twin-takedown.actions.twin-takedown.steps.first.prompt: 'First Strike: choose a melee weapon'
feats.ranger.twin-takedown.actions.twin-takedown.steps.second.prompt: 'Second Strike: choose your other melee weapon'
feats.ranger.twin-takedown.description: 'Flourish. Requirement: a melee weapon in each hand. Make two Strikes against your hunted prey, one with each weapon. If both hit, combine their damage for resistances and weaknesses. Both count toward your multiple attack penalty.'
feats.ranger.twin-takedown.name: 'Twin Takedown'
fields.prey.hits.name: 'Hits on your prey this turn'
fields.prey.target.name: 'Hunted prey'
fields.twinParry.active.name: 'Twin Parry'
