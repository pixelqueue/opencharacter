# The wizard (Player Core): the class, its schools and theses, features, feats and school spells.
# Short rules text written for the pack.
classes.wizard.name: Wizard
classes.wizard.description: "A scholar of arcane magic who prepares spells from a spellbook. Key attribute: Intelligence. 6 Hit Points plus Constitution per level. Trained in Perception, Fortitude and Reflex, expert in Will; trained in simple weapons and unarmed attacks; trained in unarmored defense; trained in the wizard class DC, spell attack modifier and spell DC. Trained in Arcana and 2 skills plus Intelligence. Arcane prepared spellcasting with Intelligence: two spells of each rank (three from the next level) and five cantrips, prepared from your spellbook, plus your curriculum's extra cantrip and spell of each rank."
classes.wizard.state.bondDrained.name: Ranks drained from the bonded item today
classes.wizard.state.linkedFocusUsed.name: Linked Focus used today
