classes.wizard.choices.skill-feat.prompt: Skill feat (level {slot})

classes.wizard.schools.ars-grammatica.name: School of Ars Grammatica
classes.wizard.schools.ars-grammatica.description: 'Runes, wards and the structure of spells. Curriculum: message, sigil; command, disguise magic, runic body, runic weapon; dispel magic, translate; enthrall, veil of privacy; dispelling globe, suggestion; sending, truespeech; repulsion, spellwrack; contingency, planar seal; quandary, unrelenting observation; detonate magic. School spell: protective wards.'
classes.wizard.schools.battle-magic.name: School of Battle Magic
classes.wizard.schools.battle-magic.description: 'Destructive energies, battlefield countermeasures and protective magic. Curriculum: shield, telekinetic projectile; breathe fire, force barrage, mystic armor; mist, resist energy; earthbind, fireball; wall of fire, weapon storm; howling blizzard, impaling spike; chain lightning, disintegrate; energy aegis, true target; arctic rift, desiccate; falling stars. School spell: force bolt.'
classes.wizard.schools.boundary.name: School of the Boundary
classes.wizard.schools.boundary.description: 'Spirits, shades, dimensions and planes. Curriculum: telekinetic hand, void warp; grim tendrils, phantasmal minion, summon undead; darkness, see the unseen; bind undead, ghostly weapon; flicker, translocate; banishment, invoke spirits; teleport, vampiric exsanguination; eclipse burst, interplanar teleport; quandary, unrelenting observation; massacre. School spell: fortify summoning.'
classes.wizard.schools.civic-wizardry.name: School of Civic Wizardry
classes.wizard.schools.civic-wizardry.description: 'Magic for building, finding and moving. Curriculum: prestidigitation, read aura; hydraulic push, pummeling rubble, summon construct; revealing light, water walk; cozy cabin, safe passage; creation, unfettered movement; control water, wall of stone; disintegrate, wall of force; planar palace, retrocognition; earthquake, pinpoint; foresight. School spell: earthworks.'
classes.wizard.schools.mentalism.name: School of Mentalism
classes.wizard.schools.mentalism.description: 'Illusions and magic that befuddles the mind. Curriculum: daze, figment; dizzying colors, sleep, sure strike; illusory creature, stupefy; dream message, mind reading; nightmare, vision of death; hallucination, illusory scene; never mind, phantasmal calamity; project image, warp mind; disappearance, uncontrollable dance; phantasmagoria. School spell: charming push.'
classes.wizard.schools.protean-form.name: School of Protean Form
classes.wizard.schools.protean-form.description: 'Reshaping living matter. Curriculum: gouging claw, tangle vine; jump, pest form, spider sting; enlarge, humanoid form; feet to fins, vampiric feast; mountain resilience, vapor form; elemental form, toxic cloud; cursed metamorphosis, petrify; duplicate foe, fiery body; desiccate, monstrosity form; metamorphosis. School spell: scramble body.'
classes.wizard.schools.unified-magical-theory.name: School of Unified Magical Theory
classes.wizard.schools.unified-magical-theory.description: 'Self-study across every school. No curriculum (no curriculum spells, slots or cantrip); instead a bonus 1st-level wizard feat and one more 1st-rank spell in your spellbook, and Drain Bonded Item once a day for each rank of spell you can cast, recalling a spell of a different rank each time. School spell: hand of the apprentice.'
classes.wizard.schools.unified-magical-theory.choices.feat.prompt: 'Unified magical theory: a 1st-level wizard feat'
classes.wizard.theses.experimental-spellshaping.name: Experimental Spellshaping
classes.wizard.theses.experimental-spellshaping.description: 'You gain a 1st-level spellshape wizard feat. From 4th level, at your daily preparations you gain one more spellshape wizard feat of up to half your level until your next preparations.'
classes.wizard.theses.experimental-spellshaping.choices.feat.prompt: 'Experimental spellshaping: a 1st-level spellshape feat'
classes.wizard.theses.experimental-spellshaping.choices.daily-feat.prompt: "Experimental spellshaping: today's spellshape feat"
classes.wizard.theses.improved-familiar-attunement.name: Improved Familiar Attunement
classes.wizard.theses.improved-familiar-attunement.description: 'You gain the Familiar feat; your familiar has an extra ability, and one more at 6th, 12th and 18th level. Your arcane bond is with your familiar: Drain Familiar replaces Drain Bonded Item and works the same way.'
classes.wizard.theses.spell-blending.name: Spell Blending
classes.wizard.theses.spell-blending.description: 'At your daily preparations, trade two slots of one rank for a bonus slot up to two ranks higher (one bonus slot per rank, of a rank you can cast), as many times as you like, and one slot for two extra cantrips.'
classes.wizard.theses.spell-substitution.name: Spell Substitution
classes.wizard.theses.spell-substitution.description: 'Spend 10 minutes to empty one prepared slot and prepare another spell from your spellbook in it. If interrupted, the original spell stays prepared.'
classes.wizard.theses.spell-substitution.actions.substitute-spell.name: Substitute a Spell
classes.wizard.theses.spell-substitution.actions.substitute-spell.steps.slot.prompt: Prepared slot to empty
classes.wizard.theses.spell-substitution.actions.substitute-spell.steps.spell.prompt: Spell from your spellbook to prepare instead
classes.wizard.theses.spell-substitution.actions.substitute-spell.results.substituted.name: Substituted
classes.wizard.theses.staff-nexus.name: Staff Nexus
classes.wizard.theses.staff-nexus.description: 'You start with a makeshift staff holding a cantrip and a 1st-rank spell from your spellbook. At daily preparations, expend a spell to give it charges equal to its rank (two spells from 8th level, three from 16th); casting the 1st-rank spell from it costs a charge. You can merge it with another staff, adding its two spells.'

features.wizard.arcane-bond.name: Arcane Bond
features.wizard.arcane-bond.description: 'Each day when you prepare spells, you designate an item you own as your bonded item. Drain Bonded Item (free action, arcane, once per day; your bonded item is on your person): this turn, you can cast one spell you prepared today and already cast, without spending a slot.'
features.wizard.arcane-bond.actions.drain-bonded-item.name: Drain Bonded Item
features.wizard.arcane-bond.actions.drain-bonded-item.steps.spell.prompt: A prepared spell you already cast today
features.wizard.arcane-bond.actions.drain-bonded-item.results.drained.name: Drained
features.wizard.reflex-expertise.name: Reflex Expertise
features.wizard.reflex-expertise.description: Your Reflex proficiency becomes expert.
features.wizard.expert-spellcaster.name: Expert Spellcaster
features.wizard.expert-spellcaster.description: Your spell attack modifier and spell DC proficiency becomes expert.
features.wizard.magical-fortitude.name: Magical Fortitude
features.wizard.magical-fortitude.description: Your Fortitude proficiency becomes expert.
features.wizard.perception-expertise.name: Perception Expertise
features.wizard.perception-expertise.description: Your Perception proficiency becomes expert.
features.wizard.weapon-expertise.name: Weapon Expertise
features.wizard.weapon-expertise.description: Expert in simple weapons and unarmed attacks.
features.wizard.defensive-robes.name: Defensive Robes
features.wizard.defensive-robes.description: Your unarmored defense proficiency becomes expert.
features.wizard.weapon-specialization.name: Weapon Specialization
features.wizard.weapon-specialization.description: '+2 damage with weapons and unarmed attacks you are expert in, +3 if master, +4 if legendary.'
features.wizard.master-spellcaster.name: Master Spellcaster
features.wizard.master-spellcaster.description: Your spell attack modifier and spell DC proficiency becomes master.
features.wizard.prodigious-will.name: Prodigious Will
features.wizard.prodigious-will.description: Your Will proficiency becomes master. A success on a Will save is a critical success.
features.wizard.archwizards-spellcraft.name: "Archwizard's Spellcraft"
features.wizard.archwizards-spellcraft.description: "You gain a single 10th-rank spell slot. It can't be used with abilities that give more slots or that cast spells without expending a slot (such as Drain Bonded Item), and you gain no more 10th-rank slots as you level."
features.wizard.legendary-spellcaster.name: Legendary Spellcaster
features.wizard.legendary-spellcaster.description: Your spell attack modifier and spell DC proficiency becomes legendary.

feats.wizard.counterspell.name: Counterspell
feats.wizard.counterspell.description: 'Reaction. Trigger: a creature Casts a Spell you have prepared. Expend your prepared copy of that spell, losing the slot as if you had cast it, and attempt to counteract the triggering spell.'
feats.wizard.counterspell.actions.counterspell.name: Counterspell
feats.wizard.counterspell.actions.counterspell.steps.spell.prompt: The prepared spell to expend
feats.wizard.counterspell.actions.counterspell.results.countering.name: Countering
feats.wizard.spellbook-prodigy.name: Spellbook Prodigy
feats.wizard.spellbook-prodigy.prerequisites.arcana: Trained in Arcana
feats.wizard.spellbook-prodigy.description: 'You gain Magical Shorthand without meeting its prerequisites, and a critical failure to Learn a Spell is a failure instead.'
feats.wizard.conceal-spell.name: Conceal Spell
feats.wizard.conceal-spell.description: 'One action. If your next action is to Cast a Spell, it gains the subtle trait: its casting and manifestations are hidden, though not its effects.'
feats.wizard.energy-ablation.name: Energy Ablation
feats.wizard.energy-ablation.description: "One action. If your next action is to Cast a Spell that deals energy damage (acid, cold, electricity, fire, force, sonic, vitality or void), you gain resistance to one energy type of your choice equal to the spell's rank until the end of your next turn."
feats.wizard.nonlethal-spell.name: Nonlethal Spell
feats.wizard.nonlethal-spell.description: 'One action. If your next action is to Cast a Spell that deals damage and lacks the death and void traits, it gains the nonlethal trait.'
feats.wizard.call-wizardly-tools.name: Call Wizardly Tools
feats.wizard.call-wizardly-tools.description: 'One action. Your bonded item or spellbook, within 1 mile and of 1 Bulk or less, teleports to your free hand (or your feet).'
feats.wizard.linked-focus.name: Linked Focus
feats.wizard.linked-focus.description: "Once per day, when you Drain your Bonded Item to cast one of your school's curriculum spells, you also regain 1 Focus Point."
feats.wizard.spell-protection-array.name: Spell Protection Array
feats.wizard.spell-protection-array.description: 'One action. A glowing circle fills a 5-foot burst within 30 feet; creatures in it gain a +1 status bonus to saves against magic until the end of your next turn. You can Sustain it up to 1 minute.'
feats.wizard.convincing-illusion.name: Convincing Illusion
feats.wizard.convincing-illusion.description: 'Reaction. Trigger: a creature within 30 feet succeeds, but not critically, at a check to disbelieve your illusion. Attempt Deception against its Perception DC; on a success, it fails to disbelieve.'
feats.wizard.convincing-illusion.prerequisites.deception: Expert in Deception
feats.wizard.explosive-arrival.name: Explosive Arrival
feats.wizard.explosive-arrival.description: 'Free action. If your next action is to Cast a Spell with the summon trait, each creature within 10 feet of the summoned creature takes 1d4 fire damage per spell rank (or acid, cold, electricity, sonic or spirit, if the summoned creature has that trait).'
feats.wizard.irresistible-magic.name: Irresistible Magic
feats.wizard.irresistible-magic.description: 'A creature with a status bonus to saves against magic has that bonus reduced by 1 against your spells.'
feats.wizard.split-slot.name: Split Slot
feats.wizard.split-slot.description: 'When you prepare spells, choose one slot at least 1 rank below your highest and prepare two spells in it; when you cast from it, choose one, and the other is lost.'

spells.protective-wards.name: Protective Wards
spells.protective-wards.description: |-
  A ring of glyphs shields you and your allies in the area: a +1 status bonus to AC. Each time you Sustain the spell, the emanation grows by 5 feet, to at most 30 feet.
spells.force-bolt.name: Force Bolt
spells.force-bolt.description: |-
  A bolt of force automatically hits the target for 1d4+1 force damage.

  **Heightened (+2)** The damage increases by 1d4+1.
spells.fortify-summoning.name: Fortify Summoning
spells.fortify-summoning.description: |-
  A creature you summoned gains a +1 status bonus to all checks and DCs, including AC, for as long as it stays summoned, up to 1 minute.
spells.earthworks.name: Earthworks
spells.earthworks.description: |-
  Low barriers rise from the ground, making the area difficult terrain: a 5-foot burst with 1 action, 10-foot with 2, 15-foot with 3. A creature can Interact to clear one adjacent 5-foot square.

  **Heightened (4th)** The barriers float, so the area is difficult terrain for flying creatures too.
spells.charming-push.name: Charming Push
spells.charming-push.description: |-
  You deflect the target's hostility with a Will save, until the start of your next turn.

  **Critical Success** The target is unaffected.

  **Success** The target takes a –1 circumstance penalty to attack and damage rolls against you.

  **Failure** The target can't use hostile actions against you.

  **Critical Failure** As failure, and the target is stunned 1.
spells.scramble-body.name: Scramble Body
spells.scramble-body.description: |-
  The target's biology falls into disarray, with a Fortitude save.

  **Success** The target is unaffected.

  **Failure** The target is sickened 1.

  **Critical Failure** The target is sickened 2, and slowed 1 as long as it is sickened.
spells.hand-of-the-apprentice.name: Hand of the Apprentice
spells.hand-of-the-apprentice.description: |-
  You hurl a held melee weapon you're trained with at the target with a spell attack. On a hit, it deals the weapon's damage as a melee Strike, adding your spellcasting attribute modifier instead of Strength; on a critical hit, double damage and the weapon's critical specialization effect. The weapon then flies back to your hand.

