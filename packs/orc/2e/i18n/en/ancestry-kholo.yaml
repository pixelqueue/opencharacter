# Player Core 2's kholo: its ancestry or heritage, heritages and feats, in text written for the
# pack.
ancestries.kholo.choices.boosts.options.alternate.choices.free.prompt: 'Two free attribute boosts'
ancestries.kholo.choices.boosts.options.alternate.name: 'Two free boosts instead'
ancestries.kholo.choices.boosts.options.standard.choices.free.prompt: 'A free attribute boost'
ancestries.kholo.choices.boosts.options.standard.name: "The ancestry's boosts and flaw"
ancestries.kholo.choices.boosts.prompt: 'Ancestry attribute boosts'
ancestries.kholo.choices.heritage.prompt: 'Heritage'
ancestries.kholo.name: 'Kholo'
ancestries.kholo.description: 'Pragmatic hyena-headed hunters. 8 Hit Points, Medium, 25 feet. Boosts: Strength, Intelligence, free; flaw: Wisdom. Low-light vision. Bite: a jaws unarmed attack, 1d6 piercing, brawling group.'
heritages.ant-kholo.name: 'Ant Kholo'
heritages.ant-kholo.description: "You're Small instead of Medium, and trained in Deception (or a skill of your choice if you already were). +1 circumstance bonus to Lie that you're innocent, to your Deception DC against Sense Motive to see through it, and to initiative when you roll Deception."
heritages.cave-kholo.name: 'Cave Kholo'
heritages.cave-kholo.description: 'You gain darkvision.'
heritages.dog-kholo.name: 'Dog Kholo'
heritages.dog-kholo.description: 'With both hands free, you can run on all fours at a Speed of 30 feet.'
heritages.great-kholo.name: 'Great Kholo'
heritages.great-kholo.description: 'You gain 10 Hit Points from your ancestry instead of 8, and a +1 circumstance bonus to Athletics checks to Reposition, Shove or Trip.'
heritages.sweetbreath-kholo.name: 'Sweetbreath Kholo'
heritages.sweetbreath-kholo.description: "You're trained in Diplomacy (or a skill of your choice if you already were), and get a +1 circumstance bonus to Make an Impression on a target that can smell your breath."
heritages.winter-kholo.name: 'Winter Kholo'
heritages.winter-kholo.description: 'Cold resistance equal to half your level (minimum 1), and environmental cold is one step less extreme for you.'
heritages.witch-kholo.name: 'Witch Kholo'
heritages.witch-kholo.description: 'You can cast figment as an occult innate cantrip at will, and get a +1 circumstance bonus to Create a Diversion and Impersonate using only your voice.'
feats.ancestry.ask-the-bones.name: 'Ask the Bones'
feats.ancestry.ask-the-bones.description: 'Once a day, a free action: Recall Knowledge, with a +1 circumstance bonus if the bones were of someone who knew the subject well.'
templates.crunch.name: '{base} (Crunch)'
feats.ancestry.crunch.name: 'Crunch'
feats.ancestry.crunch.description: 'Your jaws deal 1d8 piercing damage instead of 1d6 and gain the grapple trait.'
feats.ancestry.hyena-familiar.name: 'Hyena Familiar'
feats.ancestry.hyena-familiar.description: 'You gain a Tiny hyena as a familiar.'
feats.ancestry.kholo-lore.name: 'Kholo Lore'
feats.ancestry.kholo-lore.description: "You're trained in Stealth and Survival (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Kholo Lore."
feats.ancestry.kholo-weapon-familiarity.name: 'Kholo Weapon Familiarity'
feats.ancestry.kholo-weapon-familiarity.description: 'You have access to uncommon kholo weapons, and familiarity with kholo weapons and the flail, khopesh, mambele and war flail: martial ones count as simple and advanced ones as martial for you. From 5th level, their critical specialization effects.'
feats.ancestry.pack-hunter.name: 'Pack Hunter'
feats.ancestry.pack-hunter.description: 'A +2 circumstance bonus to checks to Aid, and allies get the same to Aid you.'
feats.ancestry.sensitive-nose.name: 'Sensitive Nose'
feats.ancestry.sensitive-nose.description: "You gain imprecise scent with a range of 30 feet. Only at 1st level; it can't be retrained."
feats.ancestry.absorb-strength.name: 'Absorb Strength'
feats.ancestry.absorb-strength.description: 'Once an hour, 1 action, next to the corpse of an enemy dead no more than a minute: you gain temporary Hit Points equal to its level for 1 minute.'
feats.ancestry.affliction-resistance.name: 'Affliction Resistance'
feats.ancestry.affliction-resistance.description: 'A +1 circumstance bonus to saves against diseases and poisons, and a success on such a save is a critical success; with another ability that improves the save this way, a critical failure is a failure too.'
feats.ancestry.distant-cackle.name: 'Distant Cackle'
feats.ancestry.distant-cackle.description: 'You can cast ventriloquism once a day as a 1st-rank occult innate spell.'
feats.ancestry.distant-cackle.prerequisites.witch-kholo: 'Witch kholo heritage'
feats.ancestry.left-hand-blood.name: 'Left-Hand Blood'
feats.ancestry.left-hand-blood.description: 'Once an hour, 1 action: you deal yourself 1 slashing damage to poison a weapon you hold; your next hit with it that deals damage, before the end of your next turn, adds 1d4 persistent poison damage.'
feats.ancestry.pack-stalker.name: 'Pack Stalker'
feats.ancestry.pack-stalker.description: "You gain Terrain Stalker, and can extend it to one ally within 10 feet (two if you're a master in Stealth, four if legendary)."
feats.ancestry.pack-stalker.prerequisites.expert: 'Expert in Stealth'
feats.ancestry.rabid-sprint.name: 'Rabid Sprint'
feats.ancestry.rabid-sprint.description: '2 actions (flourish), both hands free: Stride three times.'
feats.ancestry.rabid-sprint.prerequisites.dog-kholo: 'Dog kholo heritage'
feats.ancestry.right-hand-blood.name: 'Right-Hand Blood'
feats.ancestry.right-hand-blood.description: "You can deal yourself 1 slashing damage to Administer First Aid, or 2d8 to Treat Disease or Treat Wounds, with your blood: no healer's toolkit needed, and a +1 item bonus to the check. Blood from your left side makes it a critical failure."
feats.ancestry.ambush-hunter.name: 'Ambush Hunter'
feats.ancestry.ambush-hunter.description: 'You can Scout and Avoid Notice at the same time while exploring.'
feats.ancestry.breath-like-honey.name: 'Breath Like Honey'
feats.ancestry.breath-like-honey.description: 'Your bonus to Make an Impression on those who smell your breath is +2, and once a day you can cast enthrall as a 3rd-rank occult innate spell (30-foot range, olfactory instead of auditory; no bonus for disagreeing).'
feats.ancestry.breath-like-honey.prerequisites.sweetbreath-kholo: 'Sweetbreath kholo heritage'
feats.ancestry.grandmothers-wisdom.name: "Grandmother's Wisdom"
feats.ancestry.grandmothers-wisdom.description: 'You can cast augury twice a day as a 2nd-rank occult innate spell.'
feats.ancestry.laughing-kholo.name: 'Laughing Kholo'
feats.ancestry.laughing-kholo.description: "You gain Battle Cry, and you take no penalty to Demoralize a creature that doesn't understand your language."
feats.ancestry.laughing-kholo.prerequisites.master: 'Master in Intimidation'
feats.ancestry.ancestors-rage.name: "Ancestor's Rage"
feats.ancestry.ancestors-rage.description: 'You can cast animal form (canine only) once a day as a 5th-rank occult innate spell.'
feats.ancestry.bonekeepers-bane.name: "Bonekeeper's Bane"
feats.ancestry.bonekeepers-bane.description: "An enemy that starts its turn next to you attempts a Will save against your class DC or spell DC, whichever is higher: on a failure, a -1 status penalty to attack rolls and skill checks while it stays adjacent. It's then immune for 24 hours."
feats.ancestry.first-to-strike-first-to-fall.name: 'First to Strike, First to Fall'
feats.ancestry.first-to-strike-first-to-fall.description: "A creature you hit that hasn't acted in the first round is off-guard until the end of your next turn; if it drops to 0 HP by then, you and allies within 30 feet of it are quickened until the end of your next turn (only to Step, Stride or Strike)."
feats.ancestry.impaling-bone.name: 'Impaling Bone'
feats.ancestry.impaling-bone.description: "Once a day, you can cast impaling spike as a 7th-rank occult innate spell, its spike of bone: it has the ghost touch rune's effects and can immobilize incorporeal creatures."
feats.ancestry.legendary-laugh.name: 'Legendary Laugh'
feats.ancestry.legendary-laugh.description: 'You can Demoralize creatures up to 60 feet away, and a successful Demoralize deals 3d8 mental damage (6d8 on a critical success).'
feats.ancestry.legendary-laugh.prerequisites.laughing-kholo: 'Laughing Kholo'
