actions.affliction-save.name: Save against the affliction
actions.affliction-save.description: >-
  At each interval, a save against the affliction's DC: a critical success lowers its stage by 2,
  a success by 1, a failure raises it by 1 and a critical failure by 2. At stage 0 it ends;
  otherwise you take the new stage's damage. Exposed again, only a failure or critical failure
  changes the stage.
actions.affliction-save.results.cured.name: No longer afflicted
actions.affliction-save.results.afflicted.name: Afflicted
actions.expose.name: Expose to the poison
actions.expose.description: >-
  Use up the poison on a target (with the Strike that delivers an injury poison, or a dose it
  swallows or breathes). The target saves against it, the first of its affliction's saves.
actions.expose.results.exposed.name: Exposed
