# Player Core 2's tripkee: its ancestry or heritage, heritages and feats, in text written for the
# pack.
ancestries.tripkee.choices.boosts.options.alternate.choices.free.prompt: 'Two free attribute boosts'
ancestries.tripkee.choices.boosts.options.alternate.name: 'Two free boosts instead'
ancestries.tripkee.choices.boosts.options.standard.choices.free.prompt: 'A free attribute boost'
ancestries.tripkee.choices.boosts.options.standard.name: "The ancestry's boosts and flaw"
ancestries.tripkee.choices.boosts.prompt: 'Ancestry attribute boosts'
ancestries.tripkee.choices.heritage.prompt: 'Heritage'
ancestries.tripkee.name: 'Tripkee'
ancestries.tripkee.description: 'Small, cautious frogfolk of the treetops. 6 Hit Points, Small, 25 feet. Boosts: Dexterity, Wisdom, free; flaw: Strength. Low-light vision. Natural Climber: +2 circumstance bonus to Athletics checks to Climb.'
heritages.poisonhide-tripkee.name: 'Poisonhide Tripkee'
heritages.poisonhide-tripkee.description: 'Toxic Skin: once an hour, a reaction (poison) when a creature touches you (Grapples you, hits you with an unarmed attack, or targets you with a touch spell): it takes 1d4 poison damage (basic Fortitude save against the higher of your class DC or spell DC), 1d4 more at 3rd level and every 2 levels after.'
heritages.riverside-tripkee.name: 'Riverside Tripkee'
heritages.riverside-tripkee.description: 'You gain a swim Speed of 15 feet.'
heritages.snaptongue-tripkee.name: 'Snaptongue Tripkee'
heritages.snaptongue-tripkee.description: "Your tongue can deliver touch spells and do very simple Interact actions (opening some unlocked doors), nothing needing fingers or a check, and it can't hold items."
heritages.stickytoe-tripkee.name: 'Stickytoe Tripkee'
heritages.stickytoe-tripkee.description: 'A +2 circumstance bonus to your Fortitude and Reflex DCs against Disarm, Shove, Reposition and Trip; climbing trees, vines and other foliage, a success to Climb is a critical success.'
heritages.thickskin-tripkee.name: 'Thickskin Tripkee'
heritages.thickskin-tripkee.description: 'You gain 8 Hit Points from your ancestry instead of 6, and a +1 circumstance bonus to saves against diseases and poisons.'
heritages.windweb-tripkee.name: 'Windweb Tripkee'
heritages.windweb-tripkee.description: 'With a hand free, you take no damage from falling, however far.'
feats.ancestry.croak-talker.name: 'Croak Talker'
feats.ancestry.croak-talker.description: 'You can ask questions of, understand and use Diplomacy with amphibians.'
feats.ancestry.hunters-defense.name: "Hunter's Defense"
feats.ancestry.hunters-defense.description: 'Once an hour, a reaction when an animal, beast, elemental, fey, fungus or plant you see attacks you: the attack targets your Nature DC instead of your AC (effects of off-guard and the like still apply, but not its penalty to AC).'
feats.ancestry.hunters-defense.prerequisites.trained: 'Trained in Nature'
feats.ancestry.jungle-strider.name: 'Jungle Strider'
feats.ancestry.jungle-strider.description: "You ignore difficult terrain in forests and jungles; Balancing on narrow surfaces or uneven ground of plants you aren't off-guard, and a success is a critical success."
feats.ancestry.nocturnal-tripkee.name: 'Nocturnal Tripkee'
feats.ancestry.nocturnal-tripkee.description: "You gain darkvision. Only at 1st level; it can't be retrained."
feats.ancestry.terrifying-croak.name: 'Terrifying Croak'
feats.ancestry.terrifying-croak.description: "1 action: Demoralize a creature within 30 feet, without the penalty for not sharing a language; on a success it can't lower its frightened value below 1 for 1 round."
feats.ancestry.terrifying-croak.prerequisites.trained: 'Trained in Intimidation'
feats.ancestry.tripkee-lore.name: 'Tripkee Lore'
feats.ancestry.tripkee-lore.description: "You're trained in Nature and Stealth (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Tripkee Lore."
feats.ancestry.tripkee-weapon-familiarity.name: 'Tripkee Weapon Familiarity'
feats.ancestry.tripkee-weapon-familiarity.description: 'You have access to uncommon tripkee weapons, and familiarity with tripkee weapons and the blowgun, dart, hatchet, scythe and shortbow: martial ones count as simple and advanced ones as martial for you. From 5th level, their critical specialization effects.'
feats.ancestry.fantastic-leaps.name: 'Fantastic Leaps'
feats.ancestry.fantastic-leaps.description: 'Your Leaps go 10 feet farther horizontally and 5 feet higher.'
feats.ancestry.long-tongue.name: 'Long Tongue'
feats.ancestry.long-tongue.description: 'Your tongue delivers touch spells and simple Interacts 5 feet beyond your reach.'
feats.ancestry.long-tongue.prerequisites.snaptongue: 'Snaptongue tripkee heritage'
feats.ancestry.prodigious-climber.name: 'Prodigious Climber'
feats.ancestry.prodigious-climber.description: 'You gain a climb Speed of 10 feet (20 feet with the stickytoe heritage).'
feats.ancestry.tenacious-net.name: 'Tenacious Net'
feats.ancestry.tenacious-net.description: "Your nets' Escape and Force Open DC is 18 instead of 16, and a creature that gets free of one is off-guard until the start of its next turn."
feats.ancestry.tripkee-glide.name: 'Tripkee Glide'
feats.ancestry.tripkee-glide.description: '1 action, a hand free: you glide 5 feet down (10 without both hands free) and up to 25 feet forward; gliding at least 1 action a round keeps you aloft.'
feats.ancestry.tripkee-glide.prerequisites.windweb: 'Windweb tripkee heritage'
feats.ancestry.vomit-stomach.name: 'Vomit Stomach'
feats.ancestry.vomit-stomach.description: "Once a day, a reaction when you become sickened or fail a save against an ingested poison: lower sickened by 2 and at once save again, with +2 circumstance, against ingested poisons from the last minute; you're off-guard for 1 round."
feats.ancestry.absorb-toxin.name: 'Absorb Toxin'
feats.ancestry.absorb-toxin.description: 'A reaction when you save against an area disease or poison: a counteract check (rank half your level; your class DC - 10, or your spellcasting attribute modifier plus proficiency bonus) ends it for everyone else on a success, and you save with -2.'
feats.ancestry.moisture-bath.name: 'Moisture Bath'
feats.ancestry.moisture-bath.description: 'Once a day, 1 action (manipulate): a DC 10 flat check ends persistent fire and cold damage on a success, and you gain fire and cold resistance equal to half your level for 1 minute.'
feats.ancestry.ricocheting-leap.name: 'Ricocheting Leap'
feats.ancestry.ricocheting-leap.description: 'Wall Jump can bounce off creatures larger than you; once a turn, bouncing off one, you can Shove or Trip it as a free action.'
feats.ancestry.ricocheting-leap.prerequisites.wall-jump: 'Wall Jump'
feats.ancestry.tongue-tether.name: 'Tongue Tether'
feats.ancestry.tongue-tether.description: 'With your mouth free, you need no free hand to Disarm, Grab an Edge, Reposition or Trip (with Long Tongue, 5 feet beyond your reach).'
feats.ancestry.tongue-tether.prerequisites.snaptongue: 'Snaptongue tripkee heritage'
feats.ancestry.envenomed-edge.name: 'Envenomed Edge'
feats.ancestry.envenomed-edge.description: 'A critical hit with a Strike that deals slashing or piercing damage also deals 1d4 persistent poison damage.'
feats.ancestry.hop-up.name: 'Hop Up'
feats.ancestry.hop-up.description: 'A free action when you stop being unconscious: Stand, without triggering reactions.'
feats.ancestry.unbound-leaper.name: 'Unbound Leaper'
feats.ancestry.unbound-leaper.description: 'You can Leap up to 30 feet in any direction without touching the ground or a check, landing on solid ground within 30 feet or falling after your next action; Leaps can exceed your Speed. With Fantastic Leaps, 40 feet horizontally and 35 vertically.'
