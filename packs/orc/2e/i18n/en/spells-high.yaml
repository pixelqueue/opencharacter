# Spells of 4th to 10th rank and the casters' advanced focus spells: short rules text written for
# the pack from Player Core and Player Core 2 (ORC), without their setting.
fields.speed.fly.name: Fly Speed
fields.speed.climb.name: Climb Speed
fields.speed.burrow.name: Burrow Speed
tags.trait.possession.name: Possession
tags.trait.rare.name: Rare
tags.trait.teleportation.name: Teleportation

spells.aberrant-whispers.name: 'Aberrant Whispers'
spells.aberrant-whispers.description: |-
  You speak words in an unknown tongue that batter the minds of foes in a 5-foot emanation, 5 feet wider for each extra action you spend. Whatever their saves, they are then temporarily immune for 1 minute.

  **Success** The target is unaffected.

  **Failure** Stupefied 2.

  **Critical Failure** Confused.

  **Heightened (+3)** The starting radius is 5 feet larger.
spells.aerial-form.name: 'Aerial Form'
spells.aerial-form.description: |-
  You take a Medium flying animal battle form of your choice (bat, bird, pterosaur or wasp) and gain the animal trait. You can Dismiss the spell. In the form you have AC 18 + your level (ignoring your armor's check penalty and Speed reduction), 5 temporary Hit Points, low-light vision, an Acrobatics modifier of +16 unless yours is higher, and the form's unarmed attacks, which are the only ones you can Strike with: trained, Dexterity-based, attack modifier +16 and damage bonus +5 (or your own Dexterity unarmed attack modifier if higher).

  - **Bat** Speed 20 feet, fly 30 feet, precise echolocation 40 feet; fangs 2d8 piercing; wing (agile) 2d6 bludgeoning.
  - **Bird** Speed 10 feet, fly 50 feet; beak 2d8 piercing; talon (agile) 1d10 slashing.
  - **Pterosaur** Speed 10 feet, fly 40 feet, imprecise scent 30 feet; beak 3d6 piercing.
  - **Wasp** Speed 20 feet, fly 40 feet; stinger 1d8 piercing plus 1d6 persistent poison.

  **Heightened (5th)** Large, with a +10-foot status bonus to your fly Speed; 10 temporary HP, attack +18, damage +8, Acrobatics +20.

  **Heightened (6th)** Huge, with a +15-foot status bonus to your fly Speed and 10-foot reach; AC 21 + your level, 15 temporary HP, attack +21, damage +4 with double the damage dice (persistent damage included), Acrobatics +23.
spells.angelic-wings.name: 'Angelic Wings'
spells.angelic-wings.description: |-
  Wings of light spread from your back, giving you a fly Speed equal to your Speed and shedding bright light in a 30-foot radius. If you're still flying when the spell ends, you float down as with gentle landing.

  **Heightened (5th)** The duration is 1 minute.
spells.arcane-countermeasure.name: 'Arcane Countermeasure'
spells.arcane-countermeasure.texts.trigger: 'a creature within range that you can see Casts a Spell'
spells.arcane-countermeasure.description: |-
  You undermine the target spell: its rank drops by 1 (not below its lowest rank), and its targets gain a +2 status bonus to saves, skill checks, AC and DCs against it, even if its rank can't drop.
spells.arctic-rift.name: 'Arctic Rift'
spells.arctic-rift.description: |-
  A jagged rift opens in the air along the line, drawing away warmth: 12d8 cold damage by each creature's Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage, and slowed 1 until the start of your next turn.

  **Critical Failure** Double damage; ice immobilizes it, and it is slowed 1 while immobilized. The ice is an object with 60 HP, Hardness 5, immunity to cold and weakness 10 to fire, destroyed if the creature Escapes.

  **Heightened (+1)** The damage increases by 1d8 and the ice's HP by 5.
spells.artistic-flourish.name: 'Artistic Flourish'
spells.artistic-flourish.description: |-
  You reshape the target to your creative vision: plainly the same item, with the aesthetic details you choose. It is a striking piece, but obviously magical and temporary, so its value doesn't change. If you're an expert in Crafting, it grants a +1 item bonus to attack rolls (a weapon) or skill checks (a skill tool). Casting the spell again ends the earlier one.

  **Heightened (7th)** A +2 item bonus if you're a master in Crafting.

  **Heightened (10th)** A +3 item bonus if you're legendary in Crafting.
spells.avatar.name: 'Avatar'
spells.avatar.description: |-
  You take the Huge battle form of your deity's avatar; you have hands and can use manipulate actions. You can Dismiss the spell. In the form you have AC 25 + your level (ignoring your armor's check penalty and Speed reduction), 30 temporary Hit Points, darkvision, Athletics +35 unless yours is higher, and the attacks of your deity's form, the only ones you can Strike with: trained, attack modifier +33 (or your own unarmed attack modifier if higher), Strength-based for melee attacks without finesse and Dexterity-based for ranged ones, dealing the damage listed. Your deity's form also sets your Speeds and any other abilities, as the GM rules for your deity.
spells.banishment.name: 'Banishment'
spells.banishment.description: |-
  You send the target back to its home plane. You can spend a third action and add a cost, a specially gathered object anathema to the creature, to give it a –2 circumstance penalty to its save. The spell fails if you aren't on your own home plane.

  **Critical Success** The target resists, and you are stunned 1.

  **Success** The target resists.

  **Failure** The target is banished.

  **Critical Failure** The target is banished and can't return to this plane by any means for 1 week.

  **Heightened (9th)** You can target up to 10 creatures; the extra cost affects those it is anathema to.
spells.blessed-boundary.name: 'Blessed Boundary'
spells.blessed-boundary.description: |-
  A hollow sphere of hundreds of swirling divine-force fragments forms a 2-inch shell around the area (smaller in 5-foot steps if you like). It gives cover and passes through solid terrain harmlessly. A creature the shell intersects when it forms, or that moves through it, takes 7d8 force damage, and again at the end of its turn if the shell hasn't already damaged it that turn, by its Reflex save.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage, and you push it up to 10 feet in a direction you choose, ending its movement.

  **Critical Failure** Double damage, and you push it up to 20 feet, ending its movement.

  **Heightened (+1)** The damage increases by 1d8.
spells.breath-of-life.name: 'Breath of Life'
spells.breath-of-life.texts.trigger: 'a living creature within range would die'
spells.breath-of-life.description: |-
  You keep the target from dying and restore 5d8 Hit Points to it. You can't use this against a death effect or an effect that leaves no remains.

  **Heightened (+2)** The healing increases by 1d8.
spells.canticle-of-everlasting-grief.name: 'Canticle of Everlasting Grief'
spells.canticle-of-everlasting-grief.description: |-
  A melody of pure grief, heard only by the target, foretells the loss of all it cherishes: 10d6 mental damage by its Will save. A creature cursed by the spell can't benefit from circumstance or status bonuses.

  **Critical Success** The target is unaffected.

  **Success** Half damage, frightened 1, and cursed for 1 round.

  **Failure** Full damage, frightened 3, and cursed for 1 week.

  **Critical Failure** Double damage, frightened 4, and cursed for an unlimited duration; while it lasts, its allies within 15 feet of it are cursed too.
spells.captivating-adoration.name: 'Captivating Adoration'
spells.captivating-adoration.description: |-
  You become entrancing, distracting creatures in the area (you can exclude any). A creature attempts a Will save when you cast the spell or when it first enters the aura, keeping that result if it leaves and returns.

  **Critical Success** It is unaffected and temporarily immune for 1 hour.

  **Success** It is fascinated with you for its next action, then temporarily immune for 1 hour.

  **Failure** It is fascinated with you.

  **Critical Failure** It is fascinated with you, and its attitude toward you improves by one step.

  **Heightened (+1)** The emanation grows by 15 feet.
spells.cataclysm.name: 'Cataclysm'
spells.cataclysm.description: |-
  You bring down a piece of every world-ending catastrophe at once on all creatures in the area, treating their resistances as 10 lower against it. Each attempts one basic Reflex save against all of it: acid rain (3d10 acid), an earthquake (3d10 bludgeoning to creatures on the ground), freezing wind (3d10 cold), lightning (3d10 electricity), beating winds (3d10 bludgeoning to flying creatures), a tsunami (3d10 bludgeoning, doubled for swimming creatures) and a wildfire (3d10 fire).
spells.celestial-brand.name: 'Celestial Brand'
spells.celestial-brand.description: |-
  A blazing symbol curses an unholy target. You and your allies gain a +1 status bonus to attack rolls and skill checks against it, and a holy creature that damages it deals 1d4 extra spirit damage. It is then temporarily immune for 1 minute.

  **Heightened (+1)** The spirit damage increases by 1.
spells.chain-lightning.name: 'Chain Lightning'
spells.chain-lightning.description: |-
  A bolt of lightning strikes the target for 8d12 electricity damage with a basic Reflex save, then arcs to another creature within 30 feet of it, then another within 30 feet of that one, and so on, as long as you like. No creature can be struck twice, you need line of effect to each, and the chain stops when a target critically succeeds. Roll the damage once for all of them.

  **Heightened (+1)** The damage increases by 1d12.
spells.chthonian-wrath.name: 'Chthonian Wrath'
spells.chthonian-wrath.description: |-
  You call up a realm of the demonic depths: roll 1d4 for its two damage types and deal 4d6 of each (8d6 in all) to each creature in the cone, with a basic Reflex save.

  **1** Skies: bludgeoning and electricity. **2** Depths: acid and slashing. **3** Frozen: bludgeoning and cold. **4** Volcanic: fire and piercing.

  **Heightened (+1)** Each type's damage increases by 1d6.
spells.clairvoyance.name: 'Clairvoyance'
spells.clairvoyance.description: |-
  An invisible, unmoving eye appears at a spot within range, even one out of your sight or line of effect. You see in every direction from it as with your own visual senses.
spells.clinging-shadows-stance.name: 'Clinging Shadows Stance'
spells.clinging-shadows-stance.description: |-
  You enter the stance of clinging shadows. You can make shadow grasp Strikes: 1d4 void damage, brawling group, agile, grapple, reach and unarmed; entering the stance is a qi spell, but the Strikes aren't. While in the stance you gain a +2 circumstance bonus to Athletics checks to Grapple and to the DC to Escape from you.
spells.commanding-lash.name: 'Commanding Lash'
spells.commanding-lash.texts.requirements: 'your most recent action dealt damage to the target'
spells.commanding-lash.description: |-
  You compel a creature you've just harmed with the threat of more pain: it is commanded as by the command spell. It takes a –2 circumstance penalty to the save if it is frightened, stupefied or taking persistent damage, and whatever the result is then temporarily immune for 1 hour.
spells.community-restoration.name: 'Community Restoration'
spells.community-restoration.texts.trigger: 'you Cast a Spell from a wizard spell slot, and it affects one or more willing allies without damaging them'
spells.community-restoration.description: |-
  Shared strength bolsters you all: you gain 2 temporary Hit Points per rank of the triggering spell, and can divide as many more among the allies it affected. They last 1 minute.
spells.competitive-edge.name: 'Competitive Edge'
spells.competitive-edge.description: |-
  Your drive to beat the opposition gives you a +1 status bonus to attack rolls and skill checks. When an enemy within 20 feet critically succeeds at an attack roll or skill check, the bonus is +3 for 1 round on attack rolls or on that skill, whichever it was.

  **Heightened (7th)** The bonus is +2, and +4 after a foe's critical success.
spells.confusion.name: 'Confusion'
spells.confusion.description: |-
  The target's mind fills with strange impulses and it acts at random. You can Dismiss the spell.

  **Critical Success** The target is unaffected.

  **Success** The target babbles and is stunned 1.

  **Failure** The target is confused for 1 minute; it can attempt a new save at the end of each of its turns to end the confusion.

  **Critical Failure** The target is confused for 1 minute, with no save to end it early.

  **Heightened (8th)** You can target up to 10 creatures.
spells.contingency.name: 'Contingency'
spells.contingency.description: |-
  As you cast this spell you also cast a companion spell of 4th rank or lower, taking no more than 3 actions, that can affect you, making all its decisions now (such as resist energy's damage type). You set a trigger, as for a Ready action. Afterward, you can bring the companion spell into effect as a reaction when the trigger happens; it affects only you. The GM may rule an overly complicated trigger fails. Casting contingency again replaces the earlier one.

  **Heightened (8th)** The companion spell can be 5th rank or lower.

  **Heightened (9th)** 6th rank or lower.

  **Heightened (10th)** 7th rank or lower.
spells.control-water.name: 'Control Water'
spells.control-water.description: |-
  You raise or lower the water in the area by 10 feet. Creatures with the water trait in the area when you cast the spell attempt a Fortitude save against the effects of slow.
spells.creation.name: 'Creation'
spells.creation.description: |-
  You conjure a temporary object of earthen or plant matter (wood, paper, brick, stone and the like) of up to 5 cubic feet. It can't have intricate artistry or complex moving parts, can't be made of precious or uncommon materials and can't pay a cost; it is obviously conjured, so it can't be sold or passed off as real. The spell gains the trait of the material, typically earth, plant or wood.

  **Heightened (5th)** The object can also be metal, including common minerals such as quartz; the spell then gains the metal trait.
spells.cursed-metamorphosis.name: 'Cursed Metamorphosis'
spells.cursed-metamorphosis.description: |-
  You turn the target into a harmless local animal, by its Fortitude save.

  **Critical Success** The target is unaffected.

  **Success** It gains a few of the animal's features, and its churning insides make it sickened 1; its features return to normal when the sickened condition ends.

  **Failure** It transforms for 1 minute but keeps its mind. If it spends all its actions on a turn focusing on its true form, it can attempt a Will save to end the effect.

  **Critical Failure** It becomes the animal, body and mind, for an unlimited duration.
spells.darkened-sight.name: 'Darkened Sight'
spells.darkened-sight.description: |-
  You fill a creature's eyes with darkness, giving it greater darkvision, which sees even through magical darkness.
spells.delusional-pride.name: 'Delusional Pride'
spells.delusional-pride.description: |-
  You make the target overconfident, blaming its failures on anything but itself. Its Will save sets the spell's duration; whatever the result, it is then temporarily immune for 24 hours. While the spell lasts, when it fails an attack roll or skill check it takes a –1 status penalty to attack rolls and skill checks until the end of its turn (or of its next turn, if the roll was outside its turn), –2 if it fails again while penalized.

  **Critical Success** It is unaffected.

  **Success** 1 round.

  **Failure** 10 minutes.

  **Critical Failure** 24 hours.
spells.desiccate.name: 'Desiccate'
spells.desiccate.description: |-
  You draw the moisture from the targets' bodies: 10d10 void damage with a basic Fortitude save. Creatures made of water and plant creatures take the result one degree worse than their save; creatures with no real moisture in them, such as earth elementals, are immune.

  **Heightened (+1)** The damage increases by 1d10.
spells.destructive-aura.name: 'Destructive Aura'
spells.destructive-aura.description: |-
  Swirling sands of divine ruin surround you, lowering the resistances of you and every creature in the area by 2.

  **Heightened (+2)** The resistances drop by 2 more.
spells.detect-scrying.name: 'Detect Scrying'
spells.detect-scrying.description: |-
  You sense scrying effects in the area. If this spell's rank is higher than a scrying effect's, you also glimpse the creature scrying and learn its rough distance and direction.

  **Heightened (6th)** The duration is until your next daily preparations.
spells.detonate-magic.name: 'Detonate Magic'
spells.detonate-magic.description: |-
  You try to counteract the target. On a success, its magic explodes for 8d6 force damage with a basic Reflex save. A counteracted item is deactivated for 1 week (destroyed on a critical success) and the explosion is a 5-foot emanation around it; a counteracted spell ends, and the explosion hits every creature in its area, or its target and every creature within 5 feet of it.
spells.dinosaur-form.name: 'Dinosaur Form'
spells.dinosaur-form.description: |-
  You take a Large dinosaur battle form of your choice and gain the animal and dinosaur traits. You can Dismiss the spell. In the form you have AC 18 + your level (ignoring your armor's check penalty and Speed reduction), 15 temporary Hit Points, low-light vision, imprecise scent 30 feet, an Athletics modifier of +18 unless yours is higher, and the form's unarmed attacks, which are the only ones you can Strike with: trained, Strength-based, attack modifier +16 and damage bonus +9 (or your own unarmed attack modifier if higher).

  - **Ankylosaurus** Speed 25 feet; tail (backswing, reach 10 feet) 2d6 bludgeoning; foot 2d6 bludgeoning.
  - **Brontosaurus** Speed 25 feet; tail (reach 15 feet) 2d6 bludgeoning; foot 2d8 bludgeoning.
  - **Deinonychus** Speed 40 feet; talon (agile) 2d4 piercing plus 1 persistent bleed; jaws 1d10 piercing.
  - **Stegosaurus** Speed 30 feet; tail (reach 10 feet) 2d8 piercing.
  - **Triceratops** Speed 30 feet; horn 2d8 piercing, plus 1d6 persistent bleed on a critical hit; foot 2d6 bludgeoning.
  - **Tyrannosaurus** Speed 30 feet; jaws (deadly d12, reach 10 feet) 1d12 piercing; tail (reach 10 feet) 1d10 bludgeoning.

  **Heightened (5th)** Huge, with reach 15 feet (20 feet for an attack that had 15); 20 temporary HP, attack +18, damage +6 with double the damage dice, Athletics +21.

  **Heightened (7th)** Gargantuan, with reach 20 feet (25 feet for an attack that had 15); AC 21 + your level, 25 temporary HP, attack +25, damage +15 with double the damage dice, Athletics +25.
spells.disappearance.name: 'Disappearance'
spells.disappearance.description: |-
  The target becomes invisible to every precise sense, not only sight. A creature can still find it by Seeking with other means, such as disturbed dust or a gap in the sounds around it.
spells.disintegrate.name: 'Disintegrate'
spells.disintegrate.description: |-
  A black bolt flies at the target and becomes a destroying beam: make a spell attack. On a hit, an object or force construct (such as a wall of force) is destroyed with no save unless it is an artifact or the like, up to a 10-foot cube of matter. A creature hit takes 12d10 damage with no type, with a basic Fortitude save; on a critical hit, its save is one degree worse. A creature reduced to 0 HP turns to fine powder, leaving its gear.

  **Heightened (+1)** The damage increases by 2d10.
spells.dispelling-globe.name: 'Dispelling Globe'
spells.dispelling-globe.description: |-
  An immobile globe surrounds you. It tries to counteract every spell from outside whose area or targets enter it, as dispel magic of 1 rank lower than this spell. A success stops only the part of the spell that would enter the globe. The globe must form in open space, its edges passing through no creature or object, or the spell is lost; creatures can enter it afterward.
spells.disperse-into-air.name: 'Disperse into Air'
spells.disperse-into-air.texts.trigger: 'you take damage from an enemy or a hazard'
spells.disperse-into-air.description: |-
  After the triggering damage you turn into air. Until the end of the turn you can't be attacked or targeted, take up no space, can't act, and your auras and emanations are suppressed. At the end of the turn you re-form in a space you can occupy within 15 feet, your auras returning if their durations haven't run out.
spells.divine-decree.name: 'Divine Decree'
spells.divine-decree.description: |-
  You speak a litany of your faith that harms those against your ideals: 7d10 spirit damage to enemies in the area, by their Fortitude saves.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage, and enfeebled 2 for 1 minute.

  **Critical Failure** Double damage and enfeebled 2 for 1 minute. If you are on your home plane and the creature isn't, it is sent back to its own. A creature of 10th level or lower must also succeed at a Will save or be paralyzed for 1 minute, dying on a critical failure (a death effect).

  **Heightened (+1)** The damage increases by 1d10, and the level of creatures that attempt the second save by 2.
spells.divine-immolation.name: 'Divine Immolation'
spells.divine-immolation.description: |-
  Divine flames scour the area for 6d6 fire damage and 2d6 persistent fire damage, by each creature's Reflex save. A creature takes spirit damage instead of fire if that would be worse for it, as the GM decides.

  **Critical Success** The creature is unaffected.

  **Success** Half damage and no persistent damage.

  **Failure** Full damage and the persistent damage.

  **Critical Failure** Double damage and double persistent damage.

  **Heightened (+1)** The damage increases by 1d6 and the persistent damage by 1d6.
spells.divine-inspiration.name: 'Divine Inspiration'
spells.divine-inspiration.description: |-
  You fill the target with spiritual energy. A prepared caster recovers one spell of 6th rank or lower it cast today and can cast it again; a spontaneous caster recovers one spell slot of 6th rank or lower; and a creature with a focus pool regains its Focus Points as if it had Refocused.
spells.divine-wrath.name: 'Divine Wrath'
spells.divine-wrath.description: |-
  Divine fury strikes the enemies in the area for 4d10 spirit damage, by their Fortitude saves.

  **Critical Success** The creature is unaffected.

  **Success** The creature takes half damage.

  **Failure** The creature takes full damage and is sickened 1.

  **Critical Failure** The creature takes full damage and is sickened 2, and is slowed 1 while it is sickened.

  **Heightened (+1)** The damage increases by 1d10.
spells.dominate.name: 'Dominate'
spells.dominate.description: |-
  You take command of the target. If you give a plainly self-destructive order, it does nothing until you give another.

  **Critical Success** The target is unaffected.

  **Success** The target is stunned 1 as it fights off your commands.

  **Failure** The target is controlled by you, but it can attempt a Will save at the end of each of its turns, ending the spell on a success.

  **Critical Failure** As failure, but it gets a new save only when you order it to do something against its nature, such as killing its allies.

  **Heightened (10th)** The duration is unlimited.
spells.downpour.name: 'Downpour'
spells.downpour.description: |-
  A torrential rain puts out non-magical flames. Creatures in the area are concealed and gain fire resistance 10, and creatures outside are concealed to those within. A creature with weakness to water that ends its turn in the rain takes its weakness.

  **Heightened (+1)** The fire resistance increases by 2.
spells.dragon-breath.name: 'Dragon Breath'
spells.dragon-breath.description: |-
  You breathe energy in a 30-foot cone: 5d6 damage with a basic Reflex save, of a type set by your dragon's tradition (arcane force, divine spirit, occult mental, primal fire).

  **Heightened (+1)** The damage increases by 2d6.
spells.dragon-form.name: 'Dragon Form'
spells.dragon-form.description: |-
  You take the Large battle form of a dragon of a common kind (or another the GM allows) and gain the dragon trait; you have hands and can use manipulate actions. You can Dismiss the spell. In the form you have:

  - AC 18 + your level (ignoring your armor's check penalty and Speed reduction), 10 temporary Hit Points, Speed 40 feet and fly 100 feet, and, if the dragon has them, burrow 20 feet, climb 40 feet or swim 60 feet.
  - Resistance 10 to your Dragon Breath's damage type, darkvision and imprecise scent 60 feet, and Athletics +23 unless yours is higher.
  - Unarmed attacks, the only ones you can Strike with: trained, Strength-based, attack modifier +22 and damage bonus +6 (or your own unarmed attack modifier if higher): jaws 2d12 piercing plus 2d6 of your breath's damage type; claw (agile) 3d10 slashing; tail (reach 10 feet) 3d10 bludgeoning.
  - **Dragon Breath** (2 actions): 10d6 damage in a 30-foot cone or 100-foot line, of the dragon's shape, damage type and save (basic, against your spell DC; pick one type if the breath has several). You can't use it again for 1d4 rounds. It has the dragon's tradition trait and the trait of its damage type.
  - **Tradition resistance**, if the dragon's tradition matches the spell's: arcane, resistance 5 to damage from spells; divine, resistance 10 to spirit, vitality and void; occult, resistance 10 to mental; primal, resistance 5 to physical damage.

  **Heightened (8th)** Huge, with a +20-foot status bonus to your fly Speed and 5 feet more reach (10 feet for the tail); AC 21 + your level, 15 temporary HP, attack +28, damage +12, Athletics +28, and Dragon Breath deals 4d6 more damage.
spells.dragon-wings.name: 'Dragon Wings'
spells.dragon-wings.description: |-
  Leathery wings sprout from your back, giving you a fly Speed of 60 feet or your Speed, whichever is greater. If you're still flying when the spell ends, you float down as with gentle landing.

  **Heightened (8th)** The duration is 10 minutes.
spells.drain-life.name: 'Drain Life'
spells.drain-life.description: |-
  You close your hand and draw life from the target: 3d4 void damage with a basic Fortitude save. You gain temporary Hit Points equal to the damage it takes (after its save and any blood magic), or to its remaining Hit Points if fewer, lasting 1 minute.

  **Heightened (+1)** The damage increases by 1d4.
spells.dreamers-call.name: "Dreamer's Call"
spells.dreamers-call.description: |-
  A vivid illusory daydream drawn from the target's dreams appears in an unoccupied space within range, luring it.

  **Critical Success** It is unaffected.

  **Success** It is fascinated by the daydream.

  **Failure** It is fascinated by the daydream, and its first action after you cast the spell is one you choose: approach the daydream, flee from it (as fleeing), Release what it holds as an offering, or Drop Prone in obeisance.

  **Critical Failure** As failure, but it repeats that course of action with every action it can for the spell's duration, and does nothing else.
spells.dreaming-potential.name: 'Dreaming Potential'
spells.dreaming-potential.description: |-
  The sleeping target explores its own potential in a lucid dream. If it sleeps the full 8 hours undisturbed, it wakes having spent a day of downtime retraining, though not for retraining that needs an instructor or knowledge it can't reach in a dream.
spells.duplicate-foe.name: 'Duplicate Foe'
spells.duplicate-foe.description: |-
  You create a temporary duplicate of an enemy of 15th level or lower to fight for you, unless the target's Fortitude save disrupts it. It appears next to the target with the target's attack modifier, AC, saves, Perception and skill modifiers, but only 70 HP, no special abilities (no immunities, resistances or weaknesses) and no magic items besides weapon potency runes. It is a minion that can only Stride and Strike, dealing the target's normal damage without added effects, and it fights your enemies as best it can; when you Sustain the spell you can also Command it, though the GM decides if it obeys. It loses 4d6 HP after each of its turns, can't regain HP, and the spell ends at 0 HP.

  **Critical Success** No duplicate appears.

  **Success** The duplicate's Strikes deal half damage, and it lasts at most 2 rounds.

  **Failure** The duplicate works as described.

  **Heightened (+1)** The target can be 2 levels higher, and the duplicate has 10 more HP.
spells.earthquake.name: 'Earthquake'
spells.earthquake.description: |-
  You shake the ground, opening fissures and collapsing structures; the GM may add more, such as cliffs falling or a lake draining into quicksand.

  **Shaking Ground** The ground is difficult terrain, and creatures on it take a –2 circumstance penalty to attack rolls, AC and skill checks.

  **Fissures** Each creature on the ground attempts a Reflex save at the start of its turn to keep its footing and not fall into a permanent 40-foot-deep fissure (climbing out takes DC 15 Athletics checks).

  **Collapse** The GM rolls a flat check for each structure and ceiling (DC 16 sturdy, 14 average or natural, 9 shoddy, adjusted as fits). A collapse deals 11d6 bludgeoning damage to each creature caught in it with a basic Reflex save; a creature falls prone unless it critically succeeds, and into a fissure if it critically fails.

  **Heightened (10th)** A great earthquake that can level a settlement: range half a mile, area a quarter-mile burst.
spells.eclipse-burst.name: 'Eclipse Burst'
spells.eclipse-burst.description: |-
  A globe of freezing darkness bursts in the area: 8d10 cold damage to every creature, plus 8d4 void damage to living ones, by their Reflex saves. It tries to counteract magical light in the area or on a creature in it.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage.

  **Critical Failure** Double damage, and blinded for an unlimited duration.

  **Heightened (+1)** The cold damage increases by 1d10 and the void damage by 1d4.
spells.elemental-blast.name: 'Elemental Blast'
spells.elemental-blast.description: |-
  You blast your foes with your element in a 10-foot burst within 30 feet, a 30-foot cone or a 60-foot line: 8d6 damage of your element's type (slashing for air, fire for fire, and so on) with a basic Reflex save. The spell has your element's trait.

  **Heightened (+1)** The damage increases by 2d6.
spells.elemental-form.name: 'Elemental Form'
spells.elemental-form.description: |-
  You take a Medium elemental battle form of the element you choose, gaining its trait and the elemental trait; you have hands and can use manipulate actions. You can Dismiss the spell. In the form you have AC 19 + your level (ignoring your armor's check penalty and Speed reduction), 10 temporary Hit Points, darkvision, Acrobatics (air, fire, metal) or Athletics (earth, water, wood) +20 unless yours is higher, and the form's unarmed attacks, the only ones you can Strike with: trained, attack modifier +18 and damage bonus +9, Dexterity-based for air, fire and metal and Strength-based otherwise (or your own unarmed attack modifier if higher).

  - **Air** fly 80 feet, and your movement doesn't trigger reactions; gust 1d4 bludgeoning.
  - **Earth** Speed 20 feet, burrow 20 feet; boulder 2d10 bludgeoning.
  - **Fire** Speed 50 feet; fire resistance 10, weakness 5 to cold and to water; tendril 1d8 fire plus 1d4 persistent fire.
  - **Metal** Speed 40 feet, fly 20 feet; blade (versatile piercing) 1d8 slashing plus 1d4 electricity.
  - **Water** Speed 20 feet, swim 60 feet; fire resistance 5; wave 1d12 bludgeoning, and after a hit you can spend an action to push the target 5 feet as a successful Shove.
  - **Wood** Speed 20 feet, climb 30 feet; branch 2d10 bludgeoning.

  **Heightened (6th)** Large, with 10-foot reach; AC 22 + your level, 15 temporary HP, attack +23, damage +13, skill +23.

  **Heightened (7th)** Huge, with 15-foot reach; AC 22 + your level, 20 temporary HP, attack +25, damage +11 with double the damage dice (persistent damage included), skill +25.
spells.elemental-motion.name: 'Elemental Motion'
spells.elemental-motion.description: |-
  Your element carries you, and the spell has its trait: air or fire, a fly Speed equal to your Speed; earth or metal, a burrow Speed of 10 feet; water, a swim Speed equal to your Speed and breathing underwater; wood, a climb Speed equal to your Speed.

  **Heightened (6th)** You also gain a +10-foot status bonus to your Speeds.

  **Heightened (9th)** The status bonus is +20 feet.
spells.embrace-nothingness.name: 'Embrace Nothingness'
spells.embrace-nothingness.description: |-
  You empty your body of substance. You gain resistance to physical damage equal to your level. You move at half your Speed but in any direction, up and down included, and are concealed while moving. You are invisible outside your turn and during it until you use a move action. You can pass through solid inanimate objects up to 2 feet thick.
spells.embrace-the-pit.name: 'Embrace the Pit'
spells.embrace-the-pit.description: |-
  Horns grow from your skull and your skin takes on your devilish forebear's look. You gain resistance 5 to fire and poison and resistance 1 to physical damage (except silver).

  **Heightened (+2)** The fire and poison resistance increase by 5, the physical resistance by 2.
spells.enduring-might.name: 'Enduring Might'
spells.enduring-might.texts.trigger: 'an attack or effect would deal damage to you'
spells.enduring-might.description: |-
  Divine power joins your own might: you gain resistance 8 plus your Strength modifier to all damage from the triggering attack or effect.

  **Heightened (+1)** The resistance increases by 2.
spells.energy-absorption.name: 'Energy Absorption'
spells.energy-absorption.texts.trigger: 'an effect would deal acid, cold, electricity or fire damage to you'
spells.energy-absorption.description: |-
  Used to bombs and magical artillery, you gain resistance 15 to acid, cold, electricity or fire (your choice) against the triggering effect's initial damage.

  **Heightened (+1)** The resistance increases by 5.
spells.energy-aegis.name: 'Energy Aegis'
spells.energy-aegis.description: |-
  A lasting energy barrier gives the target resistance 5 to acid, cold, electricity, fire, force, sonic, vitality and void damage.

  **Heightened (9th)** The resistances are 10.
spells.eradicate-undeath.name: 'Eradicate Undeath'
spells.eradicate-undeath.description: |-
  A deluge of life energy makes the undead fall apart: each undead creature in the area takes 4d12 vitality damage with a basic Fortitude save.

  **Heightened (+1)** The damage increases by 1d12.
spells.execute.name: 'Execute'
spells.execute.description: |-
  You point at a creature and call its end: 70 void damage with a basic Fortitude save. Against an undead creature or one with void healing, the spell instead has the vitality trait (not death or void) and deals 70 vitality damage.

  **Heightened (+1)** The damage increases by 10.
spells.extend-blood-magic.name: 'Extend Blood Magic'
spells.extend-blood-magic.description: |-
  If your next action is to Cast a Spell that gives you a blood magic effect lasting at least 1 round, you or a target keep that effect 1 round longer. You can have only one extended blood magic effect at a time.
spells.fabricated-truth.name: 'Fabricated Truth'
spells.fabricated-truth.description: |-
  Choose one statement for the targets to believe: narrow ("a dragon circling overhead wants to kill me"), sweeping ("all humanoids are monsters in disguise") or conceptual ("I'll be punished in the afterlife unless I live kindly"). Their experience shapes how they react; a change in what they perceive comes as a sudden revelation. If a target is already under fabricated truth, your spell tries to counteract it, and on a failed counteract the target's save can't be worse than a success.

  **Critical Success** It doesn't believe the statement and knows you tried to trick it.

  **Success** It doesn't believe the statement and doesn't notice the attempt.

  **Failure** It believes the statement for 1 week.

  **Critical Failure** It believes the statement for an unlimited duration.
spells.falling-stars.name: 'Falling Stars'
spells.falling-stars.description: |-
  Four stars fall within range, in 40-foot bursts whose central 10-foot bursts can't overlap. Choose airbursts (sonic), asteroids (fire), comets (cold) or plasma (electricity); the spell gains that trait. Each star deals 6d10 bludgeoning damage to creatures in its central burst, then 14d6 damage of the chosen type to creatures in its whole burst. A creature attempts one basic Reflex save however many areas it is in, and takes each type of damage only once.

  **Heightened (+1)** The bludgeoning damage increases by 1d10 and the energy damage by 2d6.
spells.false-vision.name: 'False Vision'
spells.false-vision.description: |-
  Scrying into the area perceives whatever you wish instead of what is there; you can Sustain the spell to change the illusion, even playing out a complex scene. If the scrying spell's rank is higher than this one, the scryer can attempt a Perception check to disbelieve, though even then it can't learn what is really happening.
spells.fey-disappearance.name: 'Fey Disappearance'
spells.fey-disappearance.description: |-
  You become invisible and ignore natural difficult terrain such as underbrush. A hostile action ends the invisibility, but you keep ignoring the terrain.

  **Heightened (5th)** A hostile action doesn't end the invisibility.
spells.fey-glamour.name: 'Fey Glamour'
spells.fey-glamour.description: |-
  You cloak a 30-foot burst in illusory scene, or up to 10 willing creatures in illusory disguise, as if heightened to 1 rank lower than this spell and with this spell's range and duration.
spells.field-of-life.name: 'Field of Life'
spells.field-of-life.description: |-
  Life energy fills the area. Each living creature that starts its turn there regains 1d8 Hit Points, and each undead creature that starts its turn there takes 1d8 vitality damage.

  **Heightened (8th)** 1d10.

  **Heightened (9th)** 1d12.
spells.fiery-body.name: 'Fiery Body'
spells.fiery-body.description: |-
  You become living flame: immune to fire, with resistance 10 to precision damage and weakness 5 to cold and to water. A creature that touches you or damages you with an unarmed attack or a melee weapon without reach takes 3d6 fire damage. Your unarmed attacks deal 1d4 more fire damage, and your fire spells one more die of fire damage (of the spell's die). You can cast ignition as an innate spell with 1 action instead of 2. You have a fly Speed of 40 feet and don't need to breathe.

  **Heightened (9th)** Touching you deals 4d6 fire damage, your unarmed attacks 2d4 more fire damage, and your fly Speed is 60 feet.
spells.fire-shield.name: 'Fire Shield'
spells.fire-shield.description: |-
  A hovering shield of fire gives you cold resistance 5 and protects you from mild and severe environmental cold. You can Raise a Shield with it for a +1 circumstance bonus to AC, and Shield Block with it: Hardness 10 (halved against water effects), 40 HP, no Broken Threshold, immune to fire. When you Shield Block an unarmed attack or an adjacent attacker's melee attack with it, the attacker takes 2d6 fire damage.

  **Heightened (+2)** The cold resistance increases by 5, the shield's HP by 10 and the fire damage by 1d6.
spells.flame-barrier.name: 'Flame Barrier'
spells.flame-barrier.texts.trigger: 'an effect would deal fire damage to you or an ally within range'
spells.flame-barrier.description: |-
  You deflect the flames: the target gains fire resistance 15 against the triggering effect.

  **Heightened (+2)** The resistance increases by 5.
spells.flicker.name: 'Flicker'
spells.flicker.description: |-
  You flicker between this plane and another, gaining resistance 5 to all damage except force. At the end of each of your turns you teleport 10 feet in a random direction the GM picks; you can also Sustain the spell to teleport so.

  **Heightened (+2)** The resistance increases by 3.
spells.fly.name: 'Fly'
spells.fly.description: |-
  The target gains a fly Speed equal to its Speed or 20 feet, whichever is greater.

  **Heightened (7th)** The duration is 1 hour.
spells.foresight.name: 'Foresight'
spells.foresight.description: |-
  A sixth sense warns you of danger to the target; if it isn't you, a psychic link (a mental effect) lets you warn it. You can have only one foresight at a time; casting it again ends the old one. The target gains a +2 status bonus to initiative rolls and isn't off-guard to undetected creatures or when flanked. You also gain the following reaction.

  **Foresight** (reaction) **Trigger** The target defends against a hostile creature or other danger. **Effect** If the danger makes the target roll (a save, say), the target rolls twice and takes the higher result, and the spell gains the fortune trait. If the danger rolls against the target (an attack roll or skill check, say), it rolls twice and takes the lower, and the spell gains the misfortune trait.
spells.freeze-time.name: 'Freeze Time'
spells.freeze-time.description: |-
  You stop time for everything but yourself. Right after casting, you can use up to 9 actions in 3 sets of up to 3; after each set, 1 round passes, but only for you, effects targeting or affecting you, and effects you create during the stop. Every other creature and object is invulnerable to you, and you can't target or affect them. When you finish, time flows again; an effect you created that lasts beyond the stop, such as wall of fire, affects others again at once, without the effects that happen only when it is cast.
spells.gate.name: 'Gate'
spells.gate.description: |-
  You tear open a vertical, circular portal of 40-foot radius to another plane, which creatures can cross both ways. It opens where you choose on the destination plane, if you know clearly where that place is and what it looks like. A deity or similarly powerful being can keep a gate from opening into or out of its realm.
spells.glimpse-the-truth.name: 'Glimpse the Truth'
spells.glimpse-the-truth.description: |-
  Divine insight shows you things as they are. The GM attempts a secret counteract check against each illusion at least partly in the area, and each that enters it while the spell lasts; on a success you see through it without ending it (seeing the true form behind an illusory disguise, say).

  **Heightened (7th)** You can let everyone in the emanation see through the illusions you succeed against.
spells.grasping-grave.name: 'Grasping Grave'
spells.grasping-grave.description: |-
  Hundreds of skeletal arms burst from the ground in a 20-foot radius, clawing for 6d6 slashing damage by each creature's Reflex save.

  **Critical Success** Unaffected.

  **Success** Half damage.

  **Failure** Full damage, and a –10-foot circumstance penalty to its Speeds for 1 round.

  **Critical Failure** Double damage, and immobilized for 1 round or until it Escapes.

  **Heightened (+1)** The damage increases by 2d6.
spells.hallucination.name: 'Hallucination'
spells.hallucination.description: |-
  The target perceives one thing as another, fails to perceive something that is there, or perceives something that isn't, as you choose and detail. Its beliefs don't change. It can attempt a Will save when you cast the spell, and again to disbelieve each time it Seeks or directly interacts with the hallucination (with a large circumstance bonus where the GM sees fit).

  **Critical Success** The creature is unaffected.

  **Success** It perceives what you chose until it disbelieves, but knows it is a hallucination.

  **Failure** It perceives what you chose until it disbelieves.

  **Critical Failure** As failure, and it trusts its false senses, taking a –4 circumstance penalty to saves to disbelieve.

  **Heightened (6th)** Either target up to 10 creatures, or make the duration until your next daily preparations.

  **Heightened (8th)** Either target any number of creatures, or make the duration unlimited.
spells.harmonize-self.name: 'Harmonize Self'
spells.harmonize-self.description: |-
  You heal yourself in one of two ways, chosen as you cast: regain 8 Hit Points, or try to counteract one poison or disease afflicting you.

  **Heightened (+1)** The Hit Points regained increase by 8.
spells.hellfire-plume.name: 'Hellfire Plume'
spells.hellfire-plume.description: |-
  A plume of hellfire erupts in a 10-foot-radius, 60-foot-tall cylinder: 4d6 fire and 4d6 spirit damage with a basic Reflex save.

  **Heightened (+1)** The fire and the spirit damage each increase by 1d6.
spells.hidden-mind.name: 'Hidden Mind'
spells.hidden-mind.description: |-
  Wards hide a creature from magic that would spy on it or touch its mind. It gains a +4 status bonus to saves against mental effects. The spell tries to counteract every detection, revelation and scrying effect as if its rank were 1 higher; on a success, that effect works but learns nothing of the target or its possessions.
spells.honeyed-words.name: 'Honeyed Words'
spells.honeyed-words.description: |-
  Your lies slide out smooth as silk. You gain a +4 status bonus to Deception checks to Lie and to your Deception DC against attempts to tell whether you're lying, and you add your level to them even if untrained. Circumstance penalties or DC increases for implausible lies are halved.
spells.horrific-visage.name: 'Horrific Visage'
spells.horrific-visage.description: |-
  Your face becomes a hag's horrific visage for a moment. Foes in the area attempt a Will save.

  **Success** Unaffected.

  **Failure** Frightened 1.

  **Critical Failure** Frightened 2.

  **Heightened (5th)** Frightened 1 on a success, frightened 2 on a failure, and frightened 3 and fleeing for 1 round on a critical failure (a critical success is still unaffected).
spells.howling-blizzard.name: 'Howling Blizzard'
spells.howling-blizzard.description: |-
  Freezing winds roar out: with 2 actions, a 60-foot cone; with 3 actions, a 30-foot burst within 500 feet. Each creature in the area takes 10d6 cold damage with a basic Reflex save, and snowdrifts make the area difficult terrain until the start of your next turn.

  **Heightened (+1)** The damage increases by 2d6.
spells.hydraulic-torrent.name: 'Hydraulic Torrent'
spells.hydraulic-torrent.description: |-
  A torrent of water lashes along a line, dealing 8d6 bludgeoning damage with a basic Fortitude save (unattended objects automatically fail). A creature or object that fails is knocked back 5 feet, 10 feet on a critical failure.

  **Heightened (+1)** The damage increases by 2d6.
spells.illusory-scene.name: 'Illusory Scene'
spells.illusory-scene.description: |-
  You create a scene of up to 10 creatures or objects within the area, with fitting sounds, smells and textures. They can't speak and have no combat abilities, and the scene doesn't change the surrounding environment. The scene can be static (with natural movement such as rustling) or follow a program up to 1 minute long that repeats; anyone watching for more than a few minutes almost always notices the loop, and you can't change the program later. A creature that touches part of it or Seeks to examine it can attempt to disbelieve that part, and disbelieves the whole scene only on a critical success.

  **Heightened (6th)** The scene's figures can speak lines you set when you create the program, in voices not your own.

  **Heightened (8th)** As 6th rank, and the duration is unlimited.
spells.impaling-briars.name: 'Impaling Briars'
spells.impaling-briars.description: |-
  Briars overrun the ground in the area. When you cast the spell, and the first time you Sustain it each round, choose one effect.

  **Ensnare** Each foe in the area, or flying up to 20 feet above it, attempts a Reflex save: on a failure it takes a –10-foot circumstance penalty to all Speeds for 1 round, and on a critical failure it is immobilized for 1 round unless it Escapes.

  **Impede** The whole area is difficult terrain.

  **Wall** A wall of thorns appears in the area for 1 round, greater difficult terrain instead of difficult terrain.

  Also, once a round, you can use a single action (concentrate, manipulate) to have the briars impale a target you can see in the area or flying up to 20 feet above it: make a spell attack. On a success it takes 10d6 piercing damage and a –10-foot circumstance penalty to all Speeds for 1 round; on a critical success it is also immobilized for 1 round unless it Escapes.
spells.impaling-spike.name: 'Impaling Spike'
spells.impaling-spike.description: |-
  A spike of cold iron thrusts up from the ground under the target for 8d6 piercing damage, by its Reflex save.

  **Critical Success** The target is unaffected.

  **Success** Half damage.

  **Failure** The spike impales a limb: full damage, and immobilized if it stands on solid ground. It can Escape against your spell DC. While impaled, it takes its weakness to cold iron, if any, at the end of each of its turns.

  **Critical Failure** As failure, but double damage, and it is off-guard while impaled.

  **Heightened (+1)** The damage increases by 2d6.
spells.implosion.name: 'Implosion'
spells.implosion.description: |-
  You crush the target in on itself for 75 damage with a basic Fortitude save. The first time each round you Sustain the spell, you choose a new target for the same effect; no creature can be targeted twice by one casting, and you can affect only one creature a turn. Incorporeal, gaseous, liquid and other creatures without a solid form can't be targeted.

  **Heightened (+1)** The damage increases by 10.
spells.indestructibility.name: 'Indestructibility'
spells.indestructibility.description: |-
  You step outside cause and effect. Until the spell ends, no effect or damage can harm you, except from artifacts, deific power and the like. You can let anything you are willing to have affect you do so.
spells.inner-upheaval.name: 'Inner Upheaval'
spells.inner-upheaval.description: |-
  You pour your qi into a devastating attack. Make an unarmed Strike or a Flurry of Blows (which still counts toward your one flourish a turn). Its attack rolls gain a +1 status bonus, and its Strikes deal 1d6 extra damage, of force, spirit, vitality or void, chosen each Strike.

  **Heightened (+4)** The extra damage increases by 1d6.
spells.interdisciplinary-incantation.name: 'Interdisciplinary Incantation'
spells.interdisciplinary-incantation.texts.trigger: 'a creature within 30 feet casts an arcane spell'
spells.interdisciplinary-incantation.description: |-
  You pick apart another caster's spell well enough to imitate it. Until the end of your next turn, you can Cast the triggering spell by expending a wizard spell slot of its rank. That caster's spells can't trigger this spell again for 24 hours.
spells.interplanar-teleport.name: 'Interplanar Teleport'
spells.interplanar-teleport.texts.requirements: 'you have a planar key for the destination plane, used as a locus'
spells.interplanar-teleport.description: |-
  You and the targets cross to another plane you know exists, using a magic planar key made from that plane's material as the spell's locus (keys to the best-known planes are uncommon, others rarer). You arrive 1d20 × 25 miles from where one of the targets (your choice) last arrived on that plane, or at a random place if none has been there. The spell gives no way back, though casting it again usually returns you.
spells.invisibility-cloak.name: 'Invisibility Cloak'
spells.invisibility-cloak.description: |-
  You become invisible, with the limits of 2nd-rank invisibility.

  **Heightened (6th)** The duration is 10 minutes.

  **Heightened (8th)** The duration is 1 hour.
spells.invoke-spirits.name: 'Invoke Spirits'
spells.invoke-spirits.description: |-
  Ragged apparitions of the dead rise and deal 2d4 mental and 2d4 void damage to each living creature in the area, with a basic Will save. A creature that critically fails is frightened 2 and fleeing for 1 round. The first time you Sustain the spell each round, you can move the area up to 30 feet within range; living creatures in the new area save against the same effects, but a critical failure no longer makes them flee.

  **Heightened (+2)** The mental and the void damage each increase by 1d4.
spells.know-the-enemy.name: 'Know the Enemy'
spells.know-the-enemy.texts.trigger: 'you roll initiative and can see a creature, you succeed at an attack roll against a creature, or a creature fails a saving throw against one of your spells'
spells.know-the-enemy.description: |-
  You Recall Knowledge to identify the triggering creature's abilities, rolling the check twice and taking the better result.
spells.liminal-doorway.name: 'Liminal Doorway'
spells.liminal-doorway.description: |-
  You draw a chalk door on an unbroken surface. Any creature that treats it as a real door can Interact with the knob to step through into an extradimensional room, empty and 20 feet on a side. If the drawing is scrubbed away, the surface breaks or a creature tries to enter past the room's capacity, the room collapses, ejecting one random occupant to the nearest open ground each round until all are out.
spells.localized-quake.name: 'Localized Quake'
spells.localized-quake.description: |-
  You shake the earth in a 15-foot emanation or 15-foot cone. Each creature standing on solid ground there takes 4d6 bludgeoning damage with a basic Reflex save, and falls prone if it fails.

  **Heightened (+1)** The damage increases by 2d6.
spells.lucky-break.name: 'Lucky Break'
spells.lucky-break.texts.trigger: "you fail, but don't critically fail, a saving throw"
spells.lucky-break.description: |-
  You reroll the saving throw and use the better result, then become temporarily immune for 10 minutes.
spells.magic-passage.name: 'Magic Passage'
spells.magic-passage.description: |-
  You open a visible tunnel through a wooden, plaster or stone wall, up to 10 feet deep. Even a thin layer of metal stops the spell. The structure stays sound, and anyone inside when the spell ends is shunted to the nearest exit.

  **Heightened (7th)** The tunnel can be 20 feet deep, and its entrance looks like ordinary wall (unless seen through truesight or the like) and acts as one, though you can set a password or trigger to let creatures in.
spells.malignant-sustenance.name: 'Malignant Sustenance'
spells.malignant-sustenance.description: |-
  You plant a seed of void energy in an undead creature, which gains fast healing 7.

  **Heightened (+1)** The fast healing increases by 2.
spells.manifestation.name: 'Manifestation'
spells.manifestation.description: |-
  You shape the fundaments of magic into the effect of another spell: a spell of 9th rank or lower of the tradition you cast manifestation from, or of 7th rank or lower from any tradition. Normally it must be common or one you have access to, though the GM may allow more.
spells.mariners-curse.name: "Mariner's Curse"
spells.mariners-curse.description: |-
  You curse the target with the sea's roiling sickness.

  **Critical Success** The target is unaffected.

  **Success** The target is sickened 1; when its sickened condition ends, so does the curse.

  **Failure** The target is sickened 1 and can't lower it below 1 while cursed; 4th-rank cleanse affliction or similar magic lifts the curse. While sickened on water at least a mile from shore, it is also slowed 1.

  **Critical Failure** As failure, but sickened 2.
spells.mask-of-terror.name: 'Mask of Terror'
spells.mask-of-terror.description: |-
  The target looks like a gruesome, terrifying creature, different to each observer. A creature that tries a hostile action against it attempts a Will save, then is temporarily immune until the end of its next turn.

  **Success** The creature is unaffected.

  **Failure** It becomes frightened 2 before using its action.

  **Critical Failure** It becomes frightened 2, and its action fails and is wasted.

  **Heightened (8th)** You can target up to 5 creatures; a hostile action or reaction against several of them at once needs only one save.
spells.massacre.name: 'Massacre'
spells.massacre.description: |-
  A wave of death sweeps the line. Each living creature of 17th level or lower in it attempts a Fortitude save; a creature this damage reduces to 0 HP dies at once. If massacre kills no one, the void energy turns back, dealing 30 more void damage to every living creature in the line (whatever its level) and 30 void damage to you.

  **Critical Success** The creature is unaffected.

  **Success** 9d6 void damage.

  **Failure** 100 void damage.

  **Critical Failure** The creature dies.

  **Heightened (10th)** Living creatures up to 19th level; 10d6 on a success and 115 on a failure.
spells.medusas-wrath.name: "Medusa's Wrath"
spells.medusas-wrath.description: |-
  You make an unarmed Strike filled with a medusa's petrifying power, with these added effects.

  **Critical Success** The target is slowed 2 and attempts a Fortitude save (with the incapacitation trait) at the end of each of its turns: a failure raises slowed by 1 (2 on a critical failure), a success lowers it by 1. If the slowed condition leaves it unable to act, it is permanently petrified. The spell ends when it is petrified or the slowed condition is removed.

  **Success** As critical success, but initially slowed 1.
spells.metamorphosis.name: 'Metamorphosis'
spells.metamorphosis.description: |-
  You take any form you could take with a polymorph spell of 8th rank or lower in your repertoire or that you could prepare (heightened versions included), with 40 temporary Hit Points instead of the form's own. You can Sustain the spell to take a form you haven't used during this casting, which renews these temporary Hit Points.
spells.migration.name: 'Migration'
spells.migration.description: |-
  The targets take animal shapes fit for their travel. Each gains land, burrow, climb, fly and swim Speeds of 40 feet, can become a Tiny or Small animal suited to the movement and environment, and is immune to mild, severe and extreme cold and heat (and, as the GM decides, whatever else the local wildlife is immune to). In exploration mode, a target travels at 20 miles per hour. In animal form a target can't Strike, cast spells or use most manipulate actions; it can Sustain the spell to return to its own shape, and again to take animal form.
spells.mind-probe.name: 'Mind Probe'
spells.mind-probe.description: |-
  You sift through the target's memories and knowledge unless it fends you off with a Will save.

  **Success** The target is unaffected.

  **Failure** Each round, you can Sustain the spell to ask a new question. The target attempts a Deception check against your spell DC: on a success you don't learn the answer, and on a critical success it gives a false answer you believe. Asking the same question again, even in another casting, gets the same result.

  **Critical Failure** As failure, and the target takes a –4 circumstance penalty to its Deception checks against your questions.
spells.mirage.name: 'Mirage'
spells.mirage.description: |-
  You make natural terrain look, sound, feel and smell like another kind of terrain. Structures and creatures aren't disguised. A creature that touches the illusion or Seeks to examine it can attempt to disbelieve it.

  **Heightened (5th)** The illusion can also disguise structures or add illusory ones, but still not creatures.
spells.mislead.name: 'Mislead'
spells.mislead.description: |-
  You become invisible and create an illusory duplicate of yourself. When you Sustain the spell, you dictate what the duplicate does that round; it acts as if it had all your actions but can't affect anything. Your invisibility, like 4th-rank invisibility's, isn't ended by hostile actions. Seeing through one part doesn't reveal the other. When you Cast a Spell, attack or otherwise interact with a creature, you can attempt a Deception check against observers' Perception DCs to make them think the duplicate did it, unless they know it is an illusion or it plainly couldn't have.
spells.moment-of-renewal.name: 'Moment of Renewal'
spells.moment-of-renewal.description: |-
  The targets get a day's recovery in an instant. Harmful effects that would end within 24 hours end (spells on them keep their durations), and they regain Hit Points and recover from conditions as after 24 hours of rest, without new daily preparations or other benefits of rest. They are then temporarily immune for 1 day.
spells.monstrosity-form.name: 'Monstrosity Form'
spells.monstrosity-form.description: |-
  You take the Huge battle form of a legendary monster: a phoenix (gaining the beast trait), a cave worm or a sea serpent (the animal trait). You can Dismiss the spell. In the form you have AC 20 + your level (ignoring your armor's check penalty and Speed reduction), 20 temporary Hit Points, darkvision, Athletics +30 unless yours is higher, and the form's unarmed attacks, the only ones you can Strike with: trained, Strength-based, attack modifier +28 (or your own unarmed attack modifier if higher), dealing the damage listed.

  - **Phoenix** Speed 30 feet, fly 90 feet; beak (reach 15 feet) 2d6+12 piercing plus 2d4 fire and 2d4 persistent fire; talon (agile, reach 15 feet) 2d8+12 slashing; **Shroud of Flame** a 20-foot aura (fire, primal) dealing 2d6 fire damage to a creature that enters it or ends its turn in it, once a turn; you can turn it on or off with a Sustain action.
  - **Cave worm** Speed 40 feet, burrow 30 feet, swim 20 feet; jaws (reach 10 feet) 2d12+20 piercing; stinger (agile, reach 10 feet) 2d8+15 piercing plus 2d6 persistent poison; body (reach 10 feet) 2d8+20 bludgeoning; **Inexorable** you recover from paralyzed, slowed and stunned at the end of each of your turns, can't be immobilized, and ignore difficult and greater difficult terrain.
  - **Sea serpent** Speed 20 feet, swim 90 feet; jaws (reach 15 feet) 2d12+20 piercing; tail (reach 25 feet) 2d8+20 bludgeoning; **Spine Rake** (2 actions, move) you Swim or Stride, and each creature you're adjacent to during the move takes 4d8+10 slashing damage (basic Reflex against your spell DC).

  **Heightened (9th)** AC 22 + your level, 25 temporary HP, attack +31, one more damage die on each attack, Athletics +33.
spells.moon-frenzy.name: 'Moon Frenzy'
spells.moon-frenzy.description: |-
  The targets turn feral: each gains 5 temporary Hit Points, a +10-foot status bonus to its Speeds, weakness 5 to silver, and fangs (2d8 piercing) and claws (2d6 slashing, agile, finesse) as unarmed attacks, used with its best weapon or unarmed proficiency and adding its weapon specialization damage. A critical hit with them deals 1d4 persistent bleed damage. The targets can't use concentrate actions other than Seek or rage actions; one can spend a single action with the rage trait to attempt a Will save against your spell DC, ending the spell on itself on a success. Under a full moon, a Medium or smaller target also grows one size (a Medium or Tiny one gaining 5 feet of reach).

  **Heightened (6th)** 10 temporary Hit Points, silver weakness 10, and three damage dice for the attacks.

  **Heightened (10th)** 20 temporary Hit Points, silver weakness 20, and four damage dice for the attacks.
spells.mountain-resilience.name: 'Mountain Resilience'
spells.mountain-resilience.description: |-
  The target's skin hardens like mountain stone, giving it resistance 5 to physical damage (except adamantine). Each time a bludgeoning, piercing or slashing attack hits it, the spell's duration drops by 1 minute.

  **Heightened (6th)** The resistance is 10.

  **Heightened (8th)** The resistance is 15.

  **Heightened (10th)** The resistance is 20.
spells.mystic-beacon.name: 'Mystic Beacon'
spells.mystic-beacon.description: |-
  The next spell that deals damage or restores Hit Points the target casts before the start of your next turn deals or restores them as if heightened 1 rank higher (its initial damage or healing only; it otherwise works at its own rank). The spell then ends.
spells.nature-incarnate.name: 'Nature Incarnate'
spells.nature-incarnate.description: |-
  You become an incarnation of nature: a Medium green man (gaining the plant trait) or a Gargantuan kaiju filling a 30-foot square (the beast trait). You can Dismiss the spell. In the form you have AC 25 + your level (ignoring your armor's check penalty and Speed reduction), 30 temporary Hit Points, darkvision, Athletics +36 unless yours is higher, and the form's attacks, the only ones you can Strike with: trained, Strength-based, attack modifier +34 (or your own unarmed attack modifier if higher), dealing the damage listed.

  - **Green man** Speed 40 feet, climb 40 feet; vines (reach 30 feet, versatile P) 6d8+12 bludgeoning; thorns (ranged, range 100 feet) 6d6+6 piercing; **Green Caress** (aura, primal) 60 feet: enemies other than plants must succeed at a Fortitude save against your spell DC or be clumsy 1 for 1 round (clumsy 2 on a critical failure).
  - **Kaiju** Speed 50 feet; resistance 5 to physical damage; jaws (reach 30 feet) 6d10+10 piercing; claws (agile, reach 30 feet) 6d8+8 slashing; foot (agile, reach 15 feet) 6d6+10 bludgeoning; **Unstoppable** you can't be immobilized and ignore difficult and greater difficult terrain; **Trample** (3 actions) you move up to twice your Speed through the spaces of Huge or smaller creatures, each taking foot damage with a basic Reflex save against your spell DC.
spells.natures-bounty.name: "Nature's Bounty"
spells.natures-bounty.texts.requirements: 'you have a free hand'
spells.natures-bounty.description: |-
  A palm-sized raw fruit or vegetable of your choice appears in your hand. A creature can eat it with an Interact action to regain 3d10+12 Hit Points and be nourished as by a meal. Uneaten, it crumbles to dust after 1 minute.

  **Heightened (+1)** The healing increases by 6.
spells.natures-pathway.name: "Nature's Pathway"
spells.natures-pathway.description: |-
  You step into a living tree large enough to hold you and step out of another such tree within 5 miles; once inside, you know roughly where such trees are, and you can come back out of the first. You can't carry an extradimensional space with you; trying makes the spell fail.

  **Heightened (6th)** The tree you leave by can be up to 50 miles away.

  **Heightened (8th)** Up to 500 miles away.

  **Heightened (9th)** Anywhere on the same planet.
spells.never-mind.name: 'Never Mind'
spells.never-mind.description: |-
  You cripple the target's mind with a curse that only effects targeting curses can remove.

  **Critical Success** The target is unaffected.

  **Success** Stupefied 2 for 1 round.

  **Failure** Stupefied 4, with an unlimited duration.

  **Critical Failure** Its intellect falls permanently below an animal's: it treats its Intelligence, Wisdom and Charisma modifiers as –5 and loses every class ability that needs a mind, spellcasting included. A player character becomes an NPC under the GM's control.
spells.nightmare.name: 'Nightmare'
spells.nightmare.description: |-
  You send nightmares to the target. The next time it sleeps, it attempts a Will save, with a +4 circumstance bonus if you know it only by name and have never met it.

  **Critical Success** The target is unaffected and temporarily immune for 1 week.

  **Success** The target has the nightmares, with no effect beyond unpleasant memories.

  **Failure** The target wakes fatigued.

  **Critical Failure** The target wakes fatigued and is drained 2 until it is no longer fatigued.
spells.outcasts-curse.name: "Outcast's Curse"
spells.outcasts-curse.description: |-
  You curse the target with an off-putting, abrasive presence.

  **Critical Success** The target is unaffected.

  **Success** For 10 minutes, the target rolls twice and takes the worse result on Deception, Diplomacy, Intimidation and Performance checks, and creatures it meets start one attitude step worse toward it.

  **Failure** As success, but permanent.

  **Critical Failure** As failure, and new creatures start two attitude steps worse toward it.
spells.overwhelming-presence.name: 'Overwhelming Presence'
spells.overwhelming-presence.description: |-
  You appear as a god or similar majestic being, in regalia of your choice. Whatever their saves, the targets are then temporarily immune for 1 minute.

  **Critical Success** The target is unaffected.

  **Success** It must pay tribute to you twice: a single action with the move trait (bowing) or the manipulate trait (offering a token), at least once on each of its turns if it can. Until then it is fascinated by you and can't use hostile actions against you.

  **Failure** As success, but six times.

  **Critical Failure** As failure, but it spends all its actions paying tribute until it is done.
spells.peaceful-bubble.name: 'Peaceful Bubble'
spells.peaceful-bubble.description: |-
  A shell of drifting runes covers the area (you can make it smaller in 10-foot steps). It doesn't block movement, but those inside and outside can't perceive each other, and detection and scrying are blocked. Creatures sleeping inside are immune to dreams sent by spells, and 8 hours of sleep there lowers the doomed condition by 2 instead of 1.
spells.perfected-body.name: 'Perfected Body'
spells.perfected-body.texts.trigger: 'you fail or critically fail a saving throw against an effect with the morph, poison or polymorph trait, or one that would make you clumsy, doomed, enfeebled, petrified or sickened'
spells.perfected-body.description: |-
  Your perfected body shrugs off some of it: a critical failure becomes a failure, and a failure a success.
spells.petrify.name: 'Petrify'
spells.petrify.description: |-
  The target's body begins to turn to stone.

  **Critical Success** The target is unaffected.

  **Success** Slowed 1 for 1 round.

  **Failure** Slowed 1, and it attempts a Fortitude save (with the incapacitation trait) at the end of each of its turns: a failure raises slowed by 1 (2 on a critical failure), a success lowers it by 1. When the slowed condition leaves it unable to act, it becomes a statue, permanently petrified; if the slowed condition is removed, the stone flakes off and the spell ends.

  **Critical Failure** As failure, but initially slowed 2.
spells.phantasmagoria.name: 'Phantasmagoria'
spells.phantasmagoria.description: |-
  Endless images of colliding dreams and lives flood the targets' minds: 16d6 mental damage by their Will saves.

  **Critical Success** The target is unaffected.

  **Success** Half damage, and it can't use reactions until the start of your next turn.

  **Failure** Full damage, and confused until the start of your next turn.

  **Critical Failure** Double damage, and confused for 1 minute.
spells.phantasmal-calamity.name: 'Phantasmal Calamity'
spells.phantasmal-calamity.description: |-
  A vision of apocalypse fills each creature's mind in the area: 11d6 mental damage with a basic Will save. A creature that critically fails must also succeed at a Reflex save or believe itself trapped by the vision, stunned for 1 minute; it attempts a Will save at the end of each of its turns, disbelieving and recovering on a success.

  **Heightened (+1)** The damage increases by 2d6.
spells.pinpoint.name: 'Pinpoint'
spells.pinpoint.description: |-
  You learn exactly where the target is (building, community and country) and on which plane. You can target a creature only if you've seen it in person or have one of its significant belongings or a piece of its body, and an object only if you've touched it or have a fragment of it. The spell automatically overcomes protections against detection of lower rank.
spells.planar-palace.name: 'Planar Palace'
spells.planar-palace.description: |-
  You grow a demiplane holding a spacious mansion, its entrance a faint, shimmering 5-by-10-foot doorway within range. You choose who can enter; once inside, you can close the entrance, making it invisible, and you and those you named can reopen it at will. The floor plan is your choice within 40 by 40 by 30 feet. While it is closed, nothing passes in or out except interplanar teleport, and you can watch the outside only with scrying that crosses planes. Up to 24 visible servants like phantasmal minions attend to those inside, and there is food enough for a nine-course banquet for 150 people.
spells.planar-seal.name: 'Planar Seal'
spells.planar-seal.description: |-
  A visible barrier tries to counteract teleportation and planar travel into or out of the area, items that reach extradimensional spaces included, and any attempt to summon a creature into it (though a summoned creature can still leave when the summoning ends).
spells.planar-tether.name: 'Planar Tether'
spells.planar-tether.description: |-
  You bind the target to its current plane. While the spell lasts, it tries to counteract any teleportation or planar travel that would move the target. Its duration depends on the target's Will save.

  **Critical Success** The target is unaffected.

  **Success** 1 minute.

  **Failure** 10 minutes.

  **Critical Failure** 1 hour.
spells.plant-form.name: 'Plant Form'
spells.plant-form.description: |-
  You take a Large plant battle form of your choice and gain the plant trait. You can Dismiss the spell. In the form you have AC 19 + your level (ignoring your armor's check penalty and Speed reduction), 12 temporary Hit Points, resistance 10 to poison, low-light vision, an Athletics modifier of +19 unless yours is higher, and the form's unarmed attacks, the only ones you can Strike with: trained, Strength-based, attack modifier +17 and damage bonus +11 (or your own unarmed attack modifier if higher).

  - **Arboreal** Speed 30 feet; branch (reach 15 feet) 2d10 bludgeoning; foot 2d8 bludgeoning; you can speak.
  - **Flytrap** Speed 15 feet; acid resistance 10; leaf (reach 10 feet) 2d8 piercing, and after a hit you can spend an action to Grab the target.

  **Heightened (6th)** Huge, with 5 feet more reach; AC 22 + your level, 24 temporary HP, attack +21, damage +16, Athletics +22.
spells.possession.name: 'Possession'
spells.possession.description: |-
  You send your mind and soul into the target's body to take control. You can choose a result more favorable to the target than its save. While you possess it, your own body is unconscious and can't wake normally, and you sense everything the target does. You can Dismiss the spell. If the possessed body dies, the spell ends and you must succeed at a Fortitude save against your spell DC or be paralyzed for 1 hour (24 hours on a critical failure). If the spell ends in an encounter, you act just before the target.

  **Critical Success** The target is unaffected.

  **Success** You ride along in its body without control.

  **Failure** You take partial control and have no turn of your own. At the start of each of its turns it saves again: on a failure you control it that turn, on a success it acts freely, and on a critical success it forces you out and the spell ends.

  **Critical Failure** You possess it fully; it is controlled by you and can only watch.

  **Heightened (9th)** The duration is 10 minutes, and your body can enter the creature's with you, protected while the spell lasts.
spells.precious-metals.name: 'Precious Metals'
spells.precious-metals.description: |-
  The target's metal turns into cold iron, copper, gold, iron, silver or steel (adamantine and dawnsilver too at 8th rank or higher). Copper, gold or silver drop its Hardness to 1; otherwise its Hardness rises to 10 if lower. It deals damage as the new material, with the material's other effects as the GM rules. The change is plainly magical and temporary, so its value doesn't change.

  **Heightened (+1)** When the Hardness rises, it is 2 higher.
spells.primal-summons.name: 'Primal Summons'
spells.primal-summons.description: |-
  If your next action is to cast summon animal or summon plant or fungus, choose an element; the creature you summon gains its abilities.

  - **Air** A fly Speed of 60 feet.
  - **Earth** A burrow Speed of 20 feet, its land Speed 10 feet lower (at least 5 feet), and resistance 5 to physical damage.
  - **Fire** 1d6 extra fire damage on its Strikes, fire resistance 10, and weakness 5 to cold and to water.
  - **Metal** 1d6 extra electricity damage on its Strikes, and electricity resistance 5.
  - **Water** A swim Speed of 60 feet, an action after a melee attack to Shove (without the multiple attack penalty), and fire resistance 5.
  - **Wood** A climb Speed of 30 feet, and resistance 2 to bludgeoning and piercing damage.
spells.project-image.name: 'Project Image'
spells.project-image.description: |-
  You project an illusory image of yourself within range; the spell ends if you can't see it. When you Cast a Spell whose area isn't an emanation, it can originate from you or the image. The image can't benefit from spells, though their visible effects appear on it. It has your AC and saves, and the spell ends if it is hit by an attack or fails a save.

  **Heightened (+2)** You can Sustain the spell for up to 10 minutes.
spells.protectors-sphere.name: "Protector's Sphere"
spells.protectors-sphere.description: |-
  A protective aura gives you and your allies in it resistance 3 to all damage.

  **Heightened (+1)** The resistance increases by 1.
spells.pulse-of-civilization.name: 'Pulse of Civilization'
spells.pulse-of-civilization.description: |-
  You tap the spirit of every settlement within 25 miles and learn their names. You gain a +2 status bonus to Lore checks to Recall Knowledge about them and to Gather Information in or about them, using your level as your proficiency bonus even if untrained. When you cast the spell you can Recall Knowledge about one of them at once with the bonus. Casting it again ends the earlier one.

  **Heightened (5th)** The range is 100 miles.

  **Heightened (7th)** The range is 500 miles, and the bonus +3.
spells.punishing-winds.name: 'Punishing Winds'
spells.punishing-winds.description: |-
  A cyclone of violent winds and downdrafts fills the area. Flying creatures in it drop 40 feet, and any that ends its turn flying there drops 20 more. The area is greater difficult terrain for flying creatures and difficult terrain for those on the ground or climbing. A creature pushed into a surface by the winds takes falling damage. The outer edge of the cylinder is greater difficult terrain that holds creatures in: to cross it, a creature must succeed at an Athletics check or an Acrobatics check to Maneuver in Flight against your spell DC, and a failure ends its action (it can try again).
spells.qi-blast.name: 'Qi Blast'
spells.qi-blast.description: |-
  You unleash your qi in a cone: 2d6 force damage in a 15-foot cone with 1 action, 3d6 in a 30-foot cone with 2, or 4d6 in a 60-foot cone with 3, by each creature's Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage, and it is pushed 5 feet.

  **Critical Failure** Double damage, and it is pushed 10 feet.

  **Heightened (+1)** The damage increases by 1d6, or 2d6 with 2 or 3 actions.
spells.qi-form.name: 'Qi Form'
spells.qi-form.description: |-
  You take on a glowing qi form, gaining a fly Speed equal to your land Speed. Choose force, spirit, vitality or void: all your Strikes deal 1d6 extra damage of that type, and a corona of light (a 5-foot emanation aura) deals 2d6 damage of that type to each creature that starts its turn in it; you can Sustain the spell to widen it to 30 feet or shrink it back. Where it overlaps magical darkness, it tries to counteract the darkness, once a day for each effect. Your weapons and unarmed attacks lose the nonlethal trait, and you take a –2 status penalty to saves against emotion effects but gain a +2 status bonus to saves against other mental effects.
spells.qi-rush.name: 'Qi Rush'
spells.qi-rush.description: |-
  Your qi speeds you to a blur. Move twice: two Strides, two Steps, or a Stride and a Step in either order. You are concealed during the movement and until the start of your next turn.
spells.quandary.name: 'Quandary'
spells.quandary.description: |-
  You trap the target in an extraplanar puzzle room. Once each turn, as a single action, it can attempt an Occultism, Perception or Thievery check against your spell DC to solve the puzzle. Teleportation can't take it out unless it also crosses planes, such as interplanar teleport. When the spell ends, it returns to the space it left, or the nearest open one.

  **Critical Success** It solves the puzzle and escapes.

  **Success** It is on the right path; if it already was, it solves the puzzle and escapes.

  **Failure** No progress.

  **Critical Failure** No progress, and it loses the right path if it was on it.
spells.raise-dead.name: 'Raise Dead'
spells.raise-dead.description: |-
  **Cost** gems worth the target's level (minimum 1) × 200 gp.

  You call back the soul of a creature that died within the past 3 days; its body must be present and mostly intact. If its time has truly come (as the GM decides) or it doesn't wish to return, the spell fails and the cost isn't spent. Otherwise it returns to life with 1 Hit Point, no prepared spells or slots, no points in any pool and no other daily resources, keeping the old body's long-term debilitations. For 1 week it is clumsy 2, drained 2 and enfeebled 2, and nothing can remove or lower these. It is also changed somehow by its time beyond, such as a shift in personality or a streak of white hair.

  **Heightened (7th)** Up to 15th level; the cost is the target's level × 400 gp.

  **Heightened (8th)** Up to 17th level; level × 800 gp.

  **Heightened (9th)** Up to 19th level; level × 1,600 gp.

  **Heightened (10th)** Up to 21st level; level × 3,200 gp.
spells.read-omens.name: 'Read Omens'
spells.read-omens.description: |-
  Choose a goal, activity or event you expect within the next week. You receive a cryptic clue or piece of advice about it, often a rhyme or an omen.
spells.rebuke-death.name: 'Rebuke Death'
spells.rebuke-death.description: |-
  You snatch creatures from death's jaws, targeting one living creature per action you spend (1 to 3). Each regains 3d6 Hit Points; a target that was dying doesn't increase its wounded condition from recovering this way.

  **Heightened (+1)** The healing increases by 1d6.
spells.regenerate.name: 'Regenerate'
spells.regenerate.description: |-
  The target gains regeneration 15, regaining 15 Hit Points at the start of each of its turns. While it has regeneration, Hit Point damage can't kill it and its dying condition can't rise to the value that would (most creatures stop at dying 3), though with wounded 4 or more it stays unconscious until its wounds are treated. Acid or fire damage turns the regeneration off until after the end of its next turn. Each time the regeneration heals it, it regrows one damaged or ruined organ, and while the spell lasts it can reattach a severed body part by holding it in place with an Interact action.

  **Heightened (9th)** Regeneration 20.
spells.remake.name: 'Remake'
spells.remake.description: |-
  **Cost** a remnant of the item.

  You re-create an object from nothing, even a destroyed one, picturing it in your mind; even a speck of dust left by disintegrate is remnant enough. The spell fails if your picture relies on too much guesswork, if the object wouldn't fit in a 5-foot cube, if it still exists somewhere unknown to you, or if it is an artifact, above 20th level or of similar power. It returns in perfect condition, even if you pictured it worn. A magic object regains its constant properties but not temporary ones: charges and daily uses come back expended and then replenish normally.
spells.repulsion.name: 'Repulsion'
spells.repulsion.description: |-
  An aura of any radius up to 40 feet keeps creatures back. A creature in it when you cast the spell, or that enters it, attempts a Will save once, keeping that result for this casting. The limits apply only when it moves toward you voluntarily; you moving closer doesn't make it move away.

  **Critical Success** Its movement isn't limited.

  **Success** Squares in the area are difficult terrain for it when it moves closer to you.

  **Failure** It can't move closer to you within the area.
spells.retributive-pain.name: 'Retributive Pain'
spells.retributive-pain.texts.trigger: 'a creature in range damages you'
spells.retributive-pain.description: |-
  You turn your pain on your tormentor: it takes mental damage equal to half the triggering damage, with a basic Fortitude save.
spells.retrocognition.name: 'Retrocognition'
spells.retrocognition.description: |-
  You read psychic echoes of past events where you are: the last day's in the first minute, the day before in the next minute, and so on. They come as emotions and metaphors, cryptic clues rather than visions. If you witness a traumatic event, the spell ends unless you succeed at a Will save of DC 30 to 50, as the GM decides by its severity.

  **Heightened (8th)** Each minute covers a year instead of a day, though only major events stay clear.

  **Heightened (9th)** Each minute covers a century, and only the greatest events can be made out.
spells.revival.name: 'Revival'
spells.revival.description: |-
  A burst of healing soothes the living and briefly rouses the recently slain. Living targets regain 10d8+40 Hit Points. Dead targets return to life temporarily, with raise dead's effects and limits, and with temporary Hit Points equal to the healing the living received but no normal Hit Points. They can't regain Hit Points or gain temporary Hit Points any other way, and when the spell ends they lose these and die. Revival can't revive creatures killed by disintegrate or a death effect, and doesn't affect undead.
spells.rewrite-memory.name: 'Rewrite Memory'
spells.rewrite-memory.description: |-
  You change the target's memories: erase one, sharpen one, alter one or add a false one.

  **Critical Success** The target is unaffected and realizes you tried to alter its memory.

  **Success** The target is unaffected and thinks the spell was something harmless, unless it identifies it.

  **Failure** For the first 5 minutes, you can Sustain the spell once a round to change up to 6 seconds of memory, up to 5 continuous minutes in all. The changes last while the spell does; if the target leaves the range, you can't change more.

  **Heightened (6th)** You can cast it on a willing target to permanently suppress all memory of one topic (described in 50 words or fewer), the gap filled with a vague haze.
spells.rune-of-observation.name: 'Rune of Observation'
spells.rune-of-observation.description: |-
  You trace an invisible eye-shaped rune in the air, a sensor as clairvoyance's; it must be in your line of sight when created. Each time the duration would end, you can spend a Focus Point as a free action to extend it by an hour, though it still ends at your next daily preparations.
spells.safeguard-secret.name: 'Safeguard Secret'
spells.safeguard-secret.description: |-
  Choose a piece of information at least some targets know, such as where the treasure is hidden or a guild's password. Those who know it gain a +4 status bonus to skill checks to conceal it (usually Deception), to saves against spells that try to draw it out, and against effects that would force them to reveal it. Casting the spell again ends the earlier one.
spells.scouting-eye.name: 'Scouting Eye'
spells.scouting-eye.description: |-
  You create an invisible floating eye, an inch across, at a spot you can see within 500 feet. It sees in all directions with your normal vision and shows you what it sees. The first time you Sustain the spell each round, you can move the eye 30 feet, seeing only ahead, or 10 feet, seeing all around. It can go any distance from you, but the spell ends if you and it are on different planes. You can Seek through it. Any damage destroys it and ends the spell.
spells.scrying.name: 'Scrying'
spells.scrying.description: |-
  You spy on a creature as with clairvoyance, but the eye appears just above the target, and the view is too imprecise for teleport and the like. You choose the target by name or by touching one of its possessions or a piece of its body. The DC is 2 lower if you have never met it and 10 lower if you don't know who it is.

  **Critical Success** The spell fails, and the target is temporarily immune for 1 week; it also glimpses you and learns your rough distance and direction.

  **Success** The spell fails, and the target is temporarily immune for 1 day.

  **Failure** The spell succeeds.

  **Critical Failure** The spell succeeds, and the eye follows the target up to 60 feet per round.
spells.seize-soul.name: 'Seize Soul'
spells.seize-soul.texts.requirements: "an item worth at least the target's level × 100 gp"
spells.seize-soul.description: |-
  You trap the target's soul in an item before it can pass on. The item has AC 16 and its usual Hardness and HP; destroying it (not just breaking it) or counteracting the spell frees the soul to the afterlife. While trapped, the creature can't be returned to life by any means, not even a wish ritual. An item holds only one soul; trying to put in another wastes the spell. Casting the spell again on an item holding a soul destroys the item and either frees the soul or moves it to another item, unless the item is an artifact or the soul is of a creature of 19th level or higher.
spells.sending.name: 'Sending'
spells.sending.description: |-
  You send a creature you know well a mental message of 25 words or fewer, and it can answer at once with a message of its own of 25 words or fewer.
spells.shadow-blast.name: 'Shadow Blast'
spells.shadow-blast.description: |-
  You shape shadow-stuff into a blast of acid, bludgeoning, cold, electricity, fire, force, piercing, slashing, sonic or spirit damage (your choice), in a 30-foot cone, a 15-foot burst within 120 feet or a 50-foot line. Each creature in the area takes 6d8 damage of that type, with a basic Reflex or Will save (its choice).

  **Heightened (+1)** The damage increases by 1d8.
spells.shadows-web.name: "Shadow's Web"
spells.shadows-web.texts.requirements: 'you are in clinging shadows stance'
spells.shadows-web.description: |-
  Grasping darkness surges from you in a 30-foot emanation: 14d4 void damage by each creature's Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** Half damage, and enfeebled 1 for 1 round.

  **Failure** Full damage, and enfeebled 2 for 1 round.

  **Critical Failure** Double damage, stunned 1, enfeebled 2 for 1 round, and immobilized for 1 round or until it Escapes.

  **Heightened (+1)** The damage increases by 2d4.
spells.shape-stone.name: 'Shape Stone'
spells.shape-stone.description: |-
  You reshape a cube of stone up to 10 feet across into a rough shape of your choice, without fine detail or moving parts. Each creature standing on it attempts a Reflex save or Acrobatics check.

  **Success** The creature is unaffected.

  **Failure** The creature falls prone on the stone.

  **Critical Failure** The creature falls off the stone, if it can, and lands prone.
spells.shared-nightmare.name: 'Shared Nightmare'
spells.shared-nightmare.description: |-
  You merge minds with the target and trade disturbing visions; one of you is confused, by its Will save.

  **Critical Success** You are confused for 1 round.

  **Success** You spend the first action of your next turn confused, then act normally.

  **Failure** The target spends the first action of each of its turns confused, for 1 minute.

  **Critical Failure** The target is confused for 1 minute.
spells.shifting-form.name: 'Shifting Form'
spells.shifting-form.description: |-
  You reshape your body to suit the moment, gaining one ability of your choice. You can Dismiss the spell.

  - A +20-foot status bonus to your Speed.
  - A climb or swim Speed equal to half your Speed.
  - Darkvision.
  - Claws: agile, finesse unarmed attacks dealing 1d8 slashing damage.
  - Imprecise scent 60 feet.
spells.shrink-the-span.name: 'Shrink the Span'
spells.shrink-the-span.description: |-
  The world seems to shrink beneath your feet: you teleport up to your Speed to a spot within your line of sight.
spells.slither.name: 'Slither'
spells.slither.description: |-
  Snakes of shadow rise in the area. Each creature there when you cast the spell, and each creature that ends its turn there, attempts a Reflex save against a bite of 3d6 piercing damage and 1d6 persistent poison damage. You can Dismiss the spell.

  **Success** The creature is unaffected.

  **Failure** Full damage, and a snake grabs it (Escape DC your spell DC). Attacking a snake (AC your spell DC, destroyed by 12 damage at once) frees the creature, but new snakes keep growing.

  **Critical Failure** As failure, but double damage, and it is restrained.

  **Heightened (+2)** The persistent poison damage increases by 1d6 and a snake's Hit Points by 6.
spells.speak-with-stones.name: 'Speak with Stones'
spells.speak-with-stones.description: |-
  You can question natural or worked stone and hear its answers, speaking with the spirits within it. Their outlook is colored by the stone's kind and the structure it belongs to, and differs enough from a human's that they notice different things; they best know who has touched them and what lies under or behind them.

  **Heightened (6th)** The duration is 8 hours.
spells.spellwrack.name: 'Spellwrack'
spells.spellwrack.description: |-
  You curse the target so that spells cast on it lash out in surges of energy.

  **Critical Success** The target is unaffected.

  **Success** Whenever a spell with a duration affects the target, it takes 2d12 persistent force damage, and each time this persistent damage hurts it, the spells on it lose 1 round of duration. Only a successful Arcana check against your spell DC helps it recover from the persistent damage. The curse and the persistent damage end after 1 minute.

  **Failure** As success, but the curse and persistent damage don't end on their own.

  **Critical Failure** As failure, but the persistent damage is 4d12.
spells.spiral-of-horrors.name: 'Spiral of Horrors'
spells.spiral-of-horrors.description: |-
  Shades and spirits whirl and howl around you. Enemies in the area are frightened 1 and can't lower their frightened value below 1 while the spell lasts.
spells.spirit-blast.name: 'Spirit Blast'
spells.spirit-blast.description: |-
  You strike the target's spirit with ethereal energy for 16d6 spirit damage with a basic Fortitude save.

  **Heightened (+1)** The damage increases by 2d6.
spells.spiritual-guardian.name: 'Spiritual Guardian'
spells.spiritual-guardian.description: |-
  A Medium, translucent guardian of force appears in an unoccupied space within range, bearing a ghostly copy of a weapon you wield or wear; its attacks are sanctified if the spell is. Creatures can pass through but not stop in its space, and you and your allies can flank with it. It has 50 Hit Points, which it can't recover and loses only by protecting. When you cast the spell and each time you Sustain it, it can move to any unoccupied space within 120 feet of you and either attack or protect.

  **Attack** A melee spell attack against an adjacent creature for 3d8 damage of the weapon's type (any of a versatile weapon's), double on a critical hit, or spirit damage if that would be worse for the creature. It counts toward your multiple attack penalty.

  **Protect** While adjacent to a creature you choose, the guardian takes the first 10 damage the creature would take, until you command it otherwise or it is destroyed.

  **Heightened (+2)** The damage increases by 1d8 and the Hit Points by 20.
spells.storm-lord.name: 'Storm Lord'
spells.storm-lord.texts.requirements: 'you are outdoors and aboveground'
spells.storm-lord.description: |-
  Storm clouds swirl above you. When you cast the spell, and the first time you Sustain it each round, choose the weather in the area.

  **Calm** No effect.

  **Fog** Heavy fog, as mist.

  **Rain** Torrential rain douses ordinary flames, and creatures in the area take a –2 circumstance penalty to Acrobatics and Perception checks.

  **Wind** Ranged attacks take a –4 circumstance penalty, and the area is difficult terrain for flying creatures.

  Also, once a round, you can use a single action (concentrate, manipulate) to call lightning down on a target in range you can see: 10d6 electricity damage with a basic Reflex save, and deafened for 1 round on a failure.
spells.stormwind-flight.name: 'Stormwind Flight'
spells.stormwind-flight.description: |-
  Strong winds carry you: you gain a fly Speed equal to your Speed. If you're still flying when the spell ends, you float down as with gentle landing.

  **Heightened (6th)** You ignore difficult terrain caused by wind while flying this way.
spells.subconscious-suggestion.name: 'Subconscious Suggestion'
spells.subconscious-suggestion.description: |-
  You plant a suggestion in the target's mind, to follow when a trigger you set occurs. It must seem a logical course of action to the target and can't be self-destructive or plainly against its interests.

  **Critical Success** The target is unaffected and knows you tried to control it.

  **Success** The target is unaffected and thinks you were only talking to it.

  **Failure** The suggestion waits until your next daily preparations. If the trigger occurs before then, the target follows it at once, for 1 minute or until it completes a finite suggestion or the suggestion turns self-destructive or plainly harmful.

  **Critical Failure** As failure, but for up to 1 hour.

  **Heightened (9th)** You can target up to 10 creatures.
spells.suggestion.name: 'Suggestion'
spells.suggestion.description: |-
  You suggest a course of action that must seem logical to the target and can't be self-destructive or plainly against its interests.

  **Critical Success** The target is unaffected and knows you tried to control it with a spell.

  **Success** The target is unaffected.

  **Failure** The target follows the suggestion at once, for 1 minute, until it completes a finite suggestion, or until the suggestion turns self-destructive or plainly harmful.

  **Critical Failure** As failure, but for up to 1 hour.

  **Heightened (8th)** You can target up to 10 creatures.
spells.summon-celestial.name: 'Summon Celestial'
spells.summon-celestial.description: |-
  You summon a celestial of level 5 or lower to fight for you. The GM may rule that your deity restricts which celestials you can call.

  **Heightened (6th)** Level 7.

  **Heightened (7th)** Level 9.

  **Heightened (8th)** Level 11.

  **Heightened (9th)** Level 13.

  **Heightened (10th)** Level 15.
spells.summon-dragon.name: 'Summon Dragon'
spells.summon-dragon.description: |-
  You summon a dragon of level 5 or lower to fight for you. A dragon with a tradition trait can be summoned only with that tradition.

  **Heightened (6th)** Level 7.

  **Heightened (7th)** Level 9.

  **Heightened (8th)** Level 11.

  **Heightened (9th)** Level 13.

  **Heightened (10th)** Level 15.
spells.summon-entity.name: 'Summon Entity'
spells.summon-entity.description: |-
  You summon an aberration of level 5 or lower to fight for you.

  **Heightened (6th)** Level 7.

  **Heightened (7th)** Level 9.

  **Heightened (8th)** Level 11.

  **Heightened (9th)** Level 13.

  **Heightened (10th)** Level 15.
spells.summon-fiend.name: 'Summon Fiend'
spells.summon-fiend.description: |-
  You summon a fiend of level 5 or lower to fight for you. The GM may rule that your deity restricts which fiends you can call.

  **Heightened (6th)** Level 7.

  **Heightened (7th)** Level 9.

  **Heightened (8th)** Level 11.

  **Heightened (9th)** Level 13.

  **Heightened (10th)** Level 15.
spells.summon-giant.name: 'Summon Giant'
spells.summon-giant.description: |-
  You summon a giant of level 5 or lower to fight for you.

  **Heightened (6th)** Level 7.

  **Heightened (7th)** Level 9.

  **Heightened (8th)** Level 11.

  **Heightened (9th)** Level 13.

  **Heightened (10th)** Level 15.
spells.summon-monitor.name: 'Summon Monitor'
spells.summon-monitor.description: |-
  You summon a monitor of level 5 or lower to fight for you. The GM may rule that your deity restricts which monitors you can call.

  **Heightened (6th)** Level 7.

  **Heightened (7th)** Level 9.

  **Heightened (8th)** Level 11.

  **Heightened (9th)** Level 13.

  **Heightened (10th)** Level 15.
spells.sunburst.name: 'Sunburst'
spells.sunburst.description: |-
  A globe of searing sunlight bursts in the area: 8d10 fire damage to every creature, plus 8d10 vitality damage to undead, by their Reflex saves. It tries to counteract magical darkness it overlaps.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage.

  **Critical Failure** Full damage, and permanently blinded.

  **Heightened (+1)** The fire damage and the vitality damage to undead each increase by 1d10.
spells.swamp-of-sloth.name: 'Swamp of Sloth'
spells.swamp-of-sloth.description: |-
  The ground in a 5-foot burst (5 feet wider for each extra action) turns to a fetid swamp of difficult terrain, its sludge swarming with tiny demonic shapes. A creature that ends its turn there takes 1d6 poison damage with a basic Fortitude save.

  **Heightened (+2)** The damage increases by 1d6 and the starting radius by 5 feet.
spells.synaptic-pulse.name: 'Synaptic Pulse'
spells.synaptic-pulse.description: |-
  A pulsing mental blast hits every enemy in the area.

  **Critical Success** The creature is unaffected.

  **Success** Stunned 1.

  **Failure** Stunned 2.

  **Critical Failure** Stunned for 1 round.
spells.take-its-course.name: 'Take its Course'
spells.take-its-course.description: |-
  You hasten an affliction or persistent poison damage on the target past its worst, or make it worse. Choose a disease, a poison or persistent poison damage affecting it (the GM picks at random among those you don't know of). An unwilling target can negate the spell with a Will save.

  **Affliction** It attempts its next save against the affliction at once, with a +2 status bonus or a –2 status penalty, your choice.

  **Persistent poison** You can make it take the persistent poison damage now (as well as at the end of its next turn), and either way it attempts an extra flat check to end it, whose DC you can set to 5 or 20.

  **Heightened (7th)** You can affect any number of its afflictions and persistent poison damage.
spells.talking-corpse.name: 'Talking Corpse'
spells.talking-corpse.description: |-
  The target corpse gains enough semblance of life to answer three questions from its body's memories (not its spirit). It must be mostly intact, with a mouth and throat; the more damaged it is, the more patchy its answers. The spell fails if it was cast on the corpse in the last week. The corpse can resist with a Will save using its statistics at death.

  **Critical Success** It can lie or refuse, and its spirit haunts you for 24 hours, keeping you from resting.

  **Success** It can give false answers or refuse.

  **Failure** It must answer truthfully, though briefly, cryptically and repetitively, and can stall to run out the clock.

  **Critical Failure** As failure, but its answers are more direct, and it takes a –2 status penalty to Deception checks to mislead you.
spells.tangling-creepers.name: 'Tangling Creepers'
spells.tangling-creepers.description: |-
  Twitching creepers cover every surface and fill any water in the area. A creature moving over land there, or climbing or swimming through the creepers, takes a –10-foot circumstance penalty to its Speeds. Once a round, you can Sustain the spell to have a vine with 15-foot reach lash out from any square of creepers: make a melee spell attack, and on a hit the vine pulls the target into the creepers and immobilizes it for 1 round or until it Escapes against your spell DC.
spells.telekinetic-haul.name: 'Telekinetic Haul'
spells.telekinetic-haul.description: |-
  You move the target up to 20 feet, and can hold it in midair. Each time you Sustain the spell, you can move it again or move another eligible object within range instead.
spells.telepathy.name: 'Telepathy'
spells.telepathy.description: |-
  You can communicate telepathically with creatures within 30 feet that share a language with you; once you've reached a creature, it can answer the same way.

  **Heightened (6th)** You can communicate in shared mental images with creatures that share no language with you, and the spell loses the linguistic trait.
spells.teleport.name: 'Teleport'
spells.teleport.description: |-
  You and the targets are carried instantly to any place within 100 miles that you can identify precisely, by where it lies from you and by how it looks. False knowledge of its appearance usually makes the spell fail, or may lead to a mishap or an unwanted destination as the GM decides. You arrive about 1 percent of the distance traveled off target, in a direction the GM chooses.

  **Heightened (7th)** Anywhere within 1,000 miles.

  **Heightened (8th)** Anywhere on the same planet; past 1,000 miles, you arrive only 10 miles off target.

  **Heightened (9th)** Anywhere on another planet in the same solar system; with accurate knowledge of the place, you arrive 100 miles off target.

  **Heightened (10th)** As 9th rank, but any planet in the same galaxy.
spells.tempt-fate.name: 'Tempt Fate'
spells.tempt-fate.texts.trigger: 'you or an ally within range attempts a saving throw'
spells.tempt-fate.description: |-
  You make the moment dire or uneventful, nothing between. The target gains a +1 status bonus to the save; a success becomes a critical success, and a failure a critical failure that abilities can't lessen. If the triggering effect lacks either a critical success or a critical failure effect, the spell fails and you don't spend the Focus Point.

  **Heightened (8th)** The bonus is +2.
spells.touch-of-death.name: 'Touch of Death'
spells.touch-of-death.description: |-
  You make a melee unarmed Strike. If it hits a living target, at any time during the spell you can spend a single action (auditory, concentrate) to speak a word of death; the target attempts a Fortitude save. Casting the spell again ends any earlier touch of death.

  **Critical Success** It survives; the spell ends and it is temporarily immune for 24 hours.

  **Success** It is stunned 1 and takes 40 damage; the spell ends and it is temporarily immune for 24 hours.

  **Failure** It is stunned 3 and takes 80 damage. The spell goes on, but it is temporarily immune to being killed by touch of death for 24 hours.

  **Critical Failure** It dies.

  **Heightened (+1)** The damage increases by 10 on a failure and by 5 on a success.
spells.touch-of-the-moon.name: 'Touch of the Moon'
spells.touch-of-the-moon.description: |-
  A glowing moon symbol appears on the target's forehead; it sheds dim light in a 20-foot radius. It gains the benefit of a moon phase, starting with the new moon and moving to the next at the end of each of its turns, back to the new moon after waning.

  **New moon** No benefit.

  **Waxing moon** A +1 status bonus to attack rolls and a +4 status bonus to damage rolls.

  **Full moon** A +1 status bonus to attack rolls, AC and saves, and a +4 status bonus to damage rolls.

  **Waning moon** A +1 status bonus to AC and saves.
spells.toxic-cloud.name: 'Toxic Cloud'
spells.toxic-cloud.description: |-
  You conjure a poisonous fog that works as mist, except that it drifts 10 feet away from you each round. A breathing creature that starts its turn in it takes 6d8 poison damage with a basic Fortitude save. You can Dismiss the spell.

  **Heightened (+1)** The damage increases by 1d8.
spells.translocate.name: 'Translocate'
spells.translocate.description: |-
  You teleport, with what you wear and hold, to an unoccupied space within range that you can see. If another creature would come with you, even in an extradimensional container, the spell is lost.

  **Heightened (5th)** The range is 1 mile, and you needn't see the destination if you've been there and know its direction and distance. You are then temporarily immune for 1 hour.
spells.travelers-transit.name: "Traveler's Transit"
spells.travelers-transit.description: |-
  Power fills your muscles: you gain a climb Speed or a swim Speed, your choice, equal to your land Speed.

  **Heightened (5th)** You can choose a fly Speed instead.
spells.tree-of-seasons.name: 'Tree of Seasons'
spells.tree-of-seasons.description: |-
  A Small tree sprouts in an unoccupied space on the ground with four seedpods, one for each season. A creature can Interact to pluck a pod and throw it up to 30 feet, in the same action or a later Interact action. A thrown pod bursts in a 5-foot burst for 6d6 damage with a basic Reflex save against your spell DC: electricity (spring), fire (summer), poison (autumn) or cold (winter). When the spell ends, the tree withers and the pods rot to ordinary seeds.

  **Heightened (+1)** The damage increases by 1d6.
spells.tricksters-twin.name: "Trickster's Twin"
spells.tricksters-twin.description: |-
  You create an illusion of yourself, seen only by the target, at a spot within 100 feet of it that it can see, mimicking all your actions.

  **Critical Success** It is unaffected.

  **Success** It believes you are at that spot and can't see you where you are. It disbelieves when you do something that makes no sense from the illusion's position, or when it attacks, touches, Seeks or otherwise engages the illusion; a hostile action by you against it ends the spell.

  **Failure** As success, but it must succeed at a Will save to disbelieve on those occasions.

  **Critical Failure** As success, but it must critically succeed at a Will save to disbelieve.
spells.true-target.name: 'True Target'
spells.true-target.description: |-
  You glimpse every way a foe might avoid harm and share it. Name a creature. The first time each target makes an attack roll against it during the spell, the attacker rolls twice and takes the better result, ignoring circumstance penalties to the roll and any flat check for the creature being concealed or hidden.
spells.truesight.name: 'Truesight'
spells.truesight.description: |-
  You see things within 60 feet as they really are. The GM rolls a secret counteract check against each illusion, morph or polymorph effect in the area, only to tell whether you see through it; a success shows you a polymorphed creature's true form without ending the spell.
spells.truespeech.name: 'Truespeech'
spells.truespeech.description: |-
  The target understands all words in any language and can speak other creatures' languages: each time it speaks, it can choose a creature and speak in a language that creature understands, even without knowing which language it is.

  **Heightened (7th)** The duration is 8 hours.
spells.umbral-journey.name: 'Umbral Journey'
spells.umbral-journey.description: |-
  You and the targets slip partly into a realm of shadow, covering each hour about as much ground as in 3 days of normal travel. The landmarks are vague and symbolic, so when you Dismiss the spell or it ends, you arrive within a mile of where you meant to go.
spells.uncontrollable-dance.name: 'Uncontrollable Dance'
spells.uncontrollable-dance.description: |-
  The target is seized by an urge to dance: it is off-guard, can't use reactions, and can move only by dancing, Striding up to half its Speed.

  **Critical Success** The target is unaffected.

  **Success** For 3 rounds, and it spends at least 1 action each turn dancing.

  **Failure** For 1 minute, and it spends at least 2 actions each turn dancing.

  **Critical Failure** For 1 minute, and it spends all its actions dancing.
spells.unfathomable-song.name: 'Unfathomable Song'
spells.unfathomable-song.description: |-
  A strange, unnatural song overtakes the targets' minds. Each attempts a Will save when you cast the spell and the first time you Sustain it each round (once a round at most); the targets stay the same.

  **Critical Success** The target is unaffected, can't be affected later, and is temporarily immune for 1 minute.

  **Success** Unaffected this round.

  **Failure** Roll 1d4 on the table.

  **Critical Failure** Roll 1d4+1 on the table.

  **1** Frightened 2. **2** Confused for 1 round. **3** Stupefied 4 for 1 round. **4** Blinded for 1 round. **5** Stunned for 1 round, and stupefied 1 for an unlimited duration.
spells.unfettered-movement.name: 'Unfettered Movement'
spells.unfettered-movement.description: |-
  The target ignores effects that would give it a circumstance penalty to Speed. When it tries to Escape being grabbed, immobilized or restrained, it automatically succeeds unless the effect is magical and of a higher rank than this spell.
spells.unfettered-pack.name: 'Unfettered Pack'
spells.unfettered-pack.description: |-
  The targets ignore circumstance penalties to Speed from vegetation, rubble, wind and other features of the environment, and difficult terrain from them.

  **Heightened (9th)** They also ignore greater difficult terrain from the environment.
spells.unity.name: 'Unity'
spells.unity.texts.trigger: 'you and one or more allies within range are targeted by a spell or ability that allows a saving throw'
spells.unity.description: |-
  Each ally can use your saving throw modifier instead of its own against the triggering effect, each deciding for itself.
spells.unrelenting-observation.name: 'Unrelenting Observation'
spells.unrelenting-observation.description: |-
  Choose a creature or object in the area to track; it becomes the spell's sensor. Up to five willing creatures of your choice in the area see a ghostly image of it when it's out of their sight, perceiving it perfectly whatever its concealed or invisible condition (cover still applies), through every barrier but lead or running water and at any distance it can still be made out. They see what it wears or holds, but not its surroundings. A willing subject is tracked for 1 hour; an unwilling one attempts a Will save.

  **Critical Success** It is unaffected.

  **Success** Tracked for 1 minute.

  **Failure** Tracked for 1 hour.
spells.unusual-anatomy.name: 'Unusual Anatomy'
spells.unusual-anatomy.description: |-
  Your flesh becomes a bizarre mix of skin, scales, hair and growths. You gain resistance 10 to precision damage and to the extra damage of critical hits (reducing that extra to 0 at most, not the attack's normal damage), and darkvision. Acid oozes from your skin: a creature that hits you with an unarmed attack or a melee weapon without reach takes 2d6 acid damage.

  **Heightened (+2)** The resistances increase by 5 and the acid damage by 1d6.
spells.vampiric-exsanguination.name: 'Vampiric Exsanguination'
spells.vampiric-exsanguination.description: |-
  You draw in the blood and life of living creatures in the area: 12d6 void damage with a basic Fortitude save. You gain temporary Hit Points equal to half the damage taken by the creature that took the most; you lose any left after 1 minute.

  **Heightened (+1)** The damage increases by 2d6.
spells.vapor-form.name: 'Vapor Form'
spells.vapor-form.description: |-
  The target becomes amorphous vapor. It loses item bonuses to AC and all other effects of armor, using its unarmored defense proficiency. It gains resistance 8 to physical damage, immunity to precision damage and a fly Speed of 10 feet, and can slip through tiny cracks. It can't cast spells, activate items or use attack or manipulate actions. It can Dismiss the spell.
spells.vibrant-pattern.name: 'Vibrant Pattern'
spells.vibrant-pattern.description: |-
  A pattern of pulsing lights dazzles every creature inside it. A creature attempts a Will save when it is inside the pattern as you cast it, enters it, ends its turn in it, or Seeks or Interacts with it; a creature the pattern has blinded doesn't save again.

  **Success** The creature is unaffected.

  **Failure** It is blinded by the pattern. Once outside, it can attempt a new save at the end of each of its turns to recover, for at most 1 minute.

  **Critical Failure** It is blinded for 1 minute.
spells.vision-of-death.name: 'Vision of Death'
spells.vision-of-death.description: |-
  The target sees a vision of its own death and takes 8d6 mental damage, by its Will save. If this reduces it to 0 HP, the vision comes true and it dies.

  **Critical Success** The target is unaffected.

  **Success** Half damage, and frightened 1.

  **Failure** Full damage, and frightened 2.

  **Critical Failure** Double damage, frightened 4, and fleeing for as long as it is frightened.

  **Heightened (+1)** The damage increases by 2d6.
spells.vital-beacon.name: 'Vital Beacon'
spells.vital-beacon.description: |-
  Vitality radiates from you. Once per round, you or an ally can Interact to lay hands on you and regain Hit Points: 4d10 for the first creature, 4d8 for the second, 4d6 for the third and 4d4 for the fourth, after which the spell ends. You can have only one vital beacon at a time.

  **Heightened (+1)** Each healing gains one more die of its size.
spells.vital-luminance.name: 'Vital Luminance'
spells.vital-luminance.description: |-
  You glow with bright light in a 30-foot emanation (dim light for 30 feet more) and gain a luminance reservoir of 4, which grows by 4 at the start of each of your turns. An undead creature in your bright light that damages you with an attack or spell takes vitality damage equal to half the reservoir, once a round. You can Dismiss the spell to send the energy into a willing living creature or an undead creature in your light, healing the living one or dealing vitality damage to the undead one equal to the reservoir. Casting the spell again ends the earlier one.

  **Heightened (+1)** The reservoir's starting value and growth each turn increase by 1.
spells.volcanic-eruption.name: 'Volcanic Eruption'
spells.volcanic-eruption.description: |-
  Lava sprays up in a column, dealing 14d6 fire damage by each creature's Reflex save; creatures in the area and within 5 feet of it also take 3d6 fire damage from the heat whatever their save. The lava cools fast, encasing creatures: an encased creature is clumsy 1 and takes a –10-foot status penalty to its Speeds, and a flying one treats all terrain as difficult and drops 20 feet at once, without falling damage. It stays encased until it Escapes against your spell DC or takes 50 damage in all.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage, and encased.

  **Critical Failure** Double damage, and encased.

  **Heightened (+1)** The damage increases by 2d6 and the heat's by 1d6.
spells.wails-of-the-damned.name: 'Wails of the Damned'
spells.wails-of-the-damned.description: |-
  You howl the lament of damned souls. Each living enemy in the area takes 8d10 void damage by its Fortitude save.

  **Critical Success** The creature is unaffected.

  **Success** Full damage.

  **Failure** Full damage, and drained 1d4.

  **Critical Failure** Double damage, and drained 4.
spells.wall-of-fire.name: 'Wall of Fire'
spells.wall-of-fire.description: |-
  You raise a 10-foot-high, 5-foot-thick wall of flame, either a straight line up to 60 feet long or a ring with a 10-foot radius (shorter or lower if you like). Each side is concealed from the other. A creature that crosses the wall, or starts its turn in it, takes 4d6 fire damage.

  **Heightened (+1)** The fire damage increases by 1d6.
spells.wall-of-force.name: 'Wall of Force'
spells.wall-of-force.description: |-
  You create an invisible wall of force up to 50 feet long and 20 feet high, with no thickness. It must form in open space, its edges passing through no creature or object, or the spell is lost. It has AC 10, Hardness 30 and 60 HP, and is immune to critical hits and precision damage. It blocks physical effects and incorporeal and ethereal creatures, but not teleportation or visual effects. It is immune to counteracting by effects of its rank or lower, and disintegrate of any rank destroys it.

  **Heightened (+2)** The wall has 20 more HP.
spells.wall-of-ice.name: 'Wall of Ice'
spells.wall-of-ice.description: |-
  You raise an opaque ice barrier 1 foot thick: a line up to 60 feet long and 10 feet high, anchored at both ends but not necessarily vertical, or a hemisphere of 10-foot radius (smaller if you like). It must form in open space, its edges passing through no creature or object, or the spell is lost. Each 10-foot section has AC 10, Hardness 10, 40 HP, weakness 15 to fire, and immunity to critical hits, cold and precision damage. A section destroyed by fire melts away; one destroyed otherwise leaves chilling ice that is difficult terrain and deals 2d6 cold damage to a creature moving through it.

  **Heightened (+2)** Each section has 10 more HP, and the cold damage increases by 1d6.
spells.wall-of-stone.name: 'Wall of Stone'
spells.wall-of-stone.description: |-
  You raise a wall of stone 1 inch thick, up to 120 feet long and 20 feet high, placing each 5 feet along square borders; it needn't be vertical, so it can make a bridge or stairs. It must form in open space, its edges passing through no creature or object, or the spell is lost. Each 10-foot section has AC 10, Hardness 14 and 50 HP and is immune to critical hits and precision damage; a destroyed section's rubble is difficult terrain.

  **Heightened (+2)** Each section has 15 more HP.
spells.warp-mind.name: 'Warp Mind'
spells.warp-mind.description: |-
  You scramble the target's mind and senses; whatever its save, it is then temporarily immune for 10 minutes. The effects are instant, so dispel magic can't counteract them, though a wish ritual or an ability that removes non-magical effects can.

  **Critical Success** The target is unaffected.

  **Success** It is confused for the first action of its next turn.

  **Failure** Confused for 1 minute.

  **Critical Failure** Confused permanently.
spells.wave-of-despair.name: 'Wave of Despair'
spells.wave-of-despair.description: |-
  Despair washes over the creatures in the area.

  **Critical Success** The creature is unaffected.

  **Success** For 1 round, it can't use reactions, and at the start of its turn it saves again, slowed 1 for that turn on a failure.

  **Failure** As success, but for 1 minute.

  **Critical Failure** As failure, and it is slowed 1 for 1 minute.

  **Heightened (7th)** The area is a 60-foot cone.
spells.weapon-storm.name: 'Weapon Storm'
spells.weapon-storm.description: |-
  You swing a weapon you're holding and it multiplies into copies that sweep a 30-foot cone or a 10-foot emanation. Each creature in the area takes four dice of the weapon's damage, of its type and die size (as if you attacked with it, two-handed if you wield it so), by its Reflex save.

  **Critical Success** The creature is unaffected.

  **Success** Half damage.

  **Failure** Full damage.

  **Critical Failure** Double damage, and the weapon's critical specialization effect.

  **Heightened (+1)** One more damage die.
spells.wild-winds-stance.name: 'Wild Winds Stance'
spells.wild-winds-stance.description: |-
  You take the stance of flowing winds. You can make wind crash Strikes, ranged unarmed Strikes against targets within 30 feet: 1d6 bludgeoning damage, brawling group, agile, nonlethal, propulsive and unarmed, ignoring concealment and all cover. Entering the stance is a qi spell, but the Strikes aren't. While in the stance you gain a +2 circumstance bonus to AC against ranged attacks.
spells.wind-jump.name: 'Wind Jump'
spells.wind-jump.description: |-
  You gain a fly Speed equal to your Speed. You must end your turn on solid ground or fall.

  **Heightened (6th)** At the end of your turn you can attempt a DC 30 Acrobatics check to find purchase in midair; on a success you don't fall.
spells.word-of-freedom.name: 'Word of Freedom'
spells.word-of-freedom.description: |-
  A word of power suppresses one condition of your choice on the target for the spell's duration: confused, frightened, grabbed, paralyzed or restrained. Suppressing grabbed or restrained frees it at once. Unless its source is removed, the condition returns when the spell ends.
spells.wrathful-storm.name: 'Wrathful Storm'
spells.wrathful-storm.description: |-
  A vast storm cloud forms over the area with rain and gales: physical ranged attacks take a –4 circumstance penalty, and the air is greater difficult terrain for flying creatures. When you cast the spell and the first time you Sustain it each round, choose a storm effect other than the last one.

  **Blizzard** 4d8 cold damage, with no save, to each creature in or below the storm; everything there is concealed, and the ground is difficult terrain.

  **Hail** 4d10 bludgeoning damage to each creature in or below the storm, with a basic Fortitude save.

  **Lightning** Up to 10 creatures in or below the storm take 7d6 electricity damage with a basic Reflex save.

  **Tornado** A whirlwind of 30-foot radius forms in or below the cloud, throwing each creature in it 40 feet up.

  **Heightened (10th)** The range is 2,000 feet and the cloud a 1,000-foot burst.
spells.youre-mine.name: "You're Mine"
spells.youre-mine.description: |-
  You twist the target's emotions to seize it for a moment.

  **Critical Success** Unaffected.

  **Success** Stunned 1.

  **Failure** On its next turn it is stunned 1 and takes one action of your choice; any actions it has left are its own.

  **Critical Failure** It is controlled for 1 round.

  **Heightened (7th)** On a failure it is controlled for 1 round; on a critical failure, for up to 1 minute, with a Will save at the end of each of its turns to end the spell.
spells.zeal-for-battle.name: 'Zeal for Battle'
spells.zeal-for-battle.texts.trigger: 'you and at least one ally are about to roll initiative'
spells.zeal-for-battle.description: |-
  You and the target ally each roll a d20 and both use the higher result for initiative, each with your own modifier.
spells.zealous-conviction.name: 'Zealous Conviction'
spells.zealous-conviction.description: |-
  Unshakable zeal overrides the targets' reason. Each gains 12 temporary Hit Points and a +2 status bonus to Will saves against mental effects. A target must do what you tell it; if it finds the task repugnant, it can attempt a Will save at the end of each of its turns, ending the spell on itself on a success.

  **Heightened (9th)** 18 temporary Hit Points and a +3 status bonus.
spells.grisly-growths.name: 'Grisly Growths'
spells.grisly-growths.description: |-
  The target sprouts extra limbs and organs, taking 10d6 piercing damage (basic Fortitude save); a creature with no fixed anatomy, such as an ooze, is unaffected. The growths rot away after a round. Unless the target critically succeeds, every creature within 30 feet of it, the target included, attempts a Will save (a mental, visual effect) and is then immune to this part for 1 hour: unaffected on a success, sickened 1 on a failure, sickened 2 on a critical failure.

  **Heightened (+1)** The damage increases by 2d6.
