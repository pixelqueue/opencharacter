classes.barbarian.armor-mastery.description: 'Master in light and medium armor and unarmored defense.'
classes.barbarian.armor-mastery.name: 'Armor Mastery'
classes.barbarian.brutality.description: 'Expert in simple and martial weapons and unarmed attacks. While raging, you apply the critical specialization effects of melee weapons and unarmed attacks.'
classes.barbarian.brutality.name: 'Brutality'
classes.barbarian.choices.class-feat.prompt: 'Barbarian feat (level {slot})'
classes.barbarian.choices.instinct.prompt: 'Instinct'
classes.barbarian.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.barbarian.choices.skills.prompt: 'Trained skills (3 plus Intelligence)'
classes.barbarian.description: 'A warrior who fights in a rage drawn from an instinct. Key attribute: Strength. 12 Hit Points plus Constitution per level. Expert in Perception, Fortitude and Will; trained in Reflex, simple and martial weapons, unarmed attacks, light and medium armor, unarmored defense and the barbarian class DC. Trained in Athletics and 3 more skills plus Intelligence.'
classes.barbarian.devastator.description: "Your barbarian class DC proficiency becomes master. Your melee Strikes ignore 10 points of the target's resistance to their physical damage."
classes.barbarian.devastator.name: 'Devastator'
classes.barbarian.furious-footfalls.description: 'You gain a +5-foot status bonus to your Speed, increased to +10 feet while raging.'
classes.barbarian.furious-footfalls.name: 'Furious Footfalls'
classes.barbarian.greater-juggernaut.description: 'Your Fortitude proficiency becomes legendary. A critical failure on a Fortitude save is a failure, and a failed Fortitude save against a damaging effect deals half damage.'
classes.barbarian.greater-juggernaut.name: 'Greater Juggernaut'
classes.barbarian.greater-weapon-specialization.description: "Weapon specialization damage becomes 4 at expert, 6 at master and 8 at legendary, and your instinct's specialization ability improves."
classes.barbarian.greater-weapon-specialization.name: 'Greater Weapon Specialization'
classes.barbarian.indomitable-will.description: 'Your Will proficiency becomes master. A success on a Will save is a critical success.'
classes.barbarian.indomitable-will.name: 'Indomitable Will'
classes.barbarian.instincts.animal.choices.animal.prompt: 'Animal'
classes.barbarian.instincts.animal.description: "Bestial Rage: while raging, you gain your animal's unarmed attacks and can't use weapons; your Rage gains the morph and primal traits. Your Rage damage with them is 2 (5 with weapon specialization, 12 with greater weapon specialization), and at 7th level their damage dice grow by one step. From 9th level, Raging Resistance resists piercing and slashing damage."
classes.barbarian.instincts.animal.name: 'Animal Instinct'
classes.barbarian.instincts.dragon.choices.breath.options.bludgeoning.name: 'Bludgeoning'
classes.barbarian.instincts.dragon.choices.breath.options.fire.name: 'Fire'
classes.barbarian.instincts.dragon.choices.breath.options.force.name: 'Force'
classes.barbarian.instincts.dragon.choices.breath.options.mental.name: 'Mental'
classes.barbarian.instincts.dragon.choices.breath.options.poison.name: 'Poison'
classes.barbarian.instincts.dragon.choices.breath.options.spirit.name: 'Spirit'
classes.barbarian.instincts.dragon.choices.breath.prompt: "Your dragon's breath damage type"
classes.barbarian.instincts.dragon.description: "Draconic Rage: when you Rage, you can make your Rage damage 4 (8 with weapon specialization, 16 with greater weapon specialization) and of your dragon's breath damage type. From 9th level, Raging Resistance resists piercing damage and your breath type."
classes.barbarian.instincts.dragon.name: 'Dragon Instinct'
classes.barbarian.instincts.fury.choices.feat.prompt: 'Bonus barbarian feat'
classes.barbarian.instincts.fury.description: "Unstoppable Frenzy: your Rage damage is 3 (7 with weapon specialization, 13 with greater weapon specialization), and you gain a 1st-level barbarian feat. From 9th level, Raging Resistance resists physical weapon damage, but not unarmed attacks'."
classes.barbarian.instincts.fury.name: 'Fury Instinct'
classes.barbarian.instincts.giant.choices.resistance.options.cold.name: 'Cold'
classes.barbarian.instincts.giant.choices.resistance.options.electricity.name: 'Electricity'
classes.barbarian.instincts.giant.choices.resistance.options.fire.name: 'Fire'
classes.barbarian.instincts.giant.choices.resistance.prompt: 'Raging Resistance damage type'
classes.barbarian.instincts.giant.description: "Titan Mauler: if you are Small or Medium, you can wield weapons one size larger. While wielding one your Rage damage is 6 (10 with weapon specialization, 18 with greater weapon specialization), and you are clumsy 1, which can't be removed. From 9th level, Raging Resistance resists bludgeoning damage and your choice of cold, electricity or fire."
classes.barbarian.instincts.giant.name: 'Giant Instinct'
classes.barbarian.instincts.spirit.description: 'Spirit Rage: when you Rage, you can make your Rage damage 3 (7 with weapon specialization, 13 with greater weapon specialization) and spirit damage; your attacks then have the effects of a ghost touch rune. From 9th level, Raging Resistance resists void damage and damage from undead.'
classes.barbarian.instincts.spirit.name: 'Spirit Instinct'
classes.barbarian.instincts.superstition.choices.traditions.options.arcane-occult.name: 'Arcane and occult'
classes.barbarian.instincts.superstition.choices.traditions.options.arcane-primal.name: 'Arcane and primal'
classes.barbarian.instincts.superstition.choices.traditions.options.divine-occult.name: 'Divine and occult'
classes.barbarian.instincts.superstition.choices.traditions.options.divine-primal.name: 'Divine and primal'
classes.barbarian.instincts.superstition.choices.traditions.prompt: 'Raging Resistance traditions'
classes.barbarian.instincts.superstition.description: 'Anathema: learning or Casting a Spell, or using an item that Casts a Spell. Superstitious Resilience: your Rage damage is 3 (7 with weapon specialization, 13 with greater weapon specialization), or 4 (8, 16) against a creature you saw Cast a Spell in the last hour. While raging you gain a +2 status bonus to saves against magic, and accepting a magic effect makes you frightened 1. When you Rage, you regain Hit Points equal to the temporary Hit Points you gain (once every 10 minutes). From 9th level, Raging Resistance resists damage from spells of two traditions you choose.'
classes.barbarian.instincts.superstition.name: 'Superstition Instinct'
classes.barbarian.juggernaut.description: 'Your Fortitude proficiency becomes master. A success on a Fortitude save is a critical success.'
classes.barbarian.juggernaut.name: 'Juggernaut'
classes.barbarian.medium-armor-expertise.description: 'Expert in light and medium armor and unarmored defense.'
classes.barbarian.medium-armor-expertise.name: 'Medium Armor Expertise'
classes.barbarian.mighty-rage.description: 'Your barbarian class DC proficiency becomes expert. When you Rage with Quick-Tempered, your first Strike on your first turn deals extra damage equal to your Rage damage.'
classes.barbarian.mighty-rage.name: 'Mighty Rage'
classes.barbarian.name: 'Barbarian'
classes.barbarian.perception-mastery.description: 'Your Perception proficiency becomes master.'
classes.barbarian.perception-mastery.name: 'Perception Mastery'
classes.barbarian.quick-tempered.description: "Free action. Trigger: you roll initiative. Requirement: you aren't encumbered or wearing heavy armor. You Rage."
classes.barbarian.quick-tempered.name: 'Quick-Tempered'
classes.barbarian.rage.description: "One action (concentrate, emotion, mental). Requirement: you aren't fatigued or raging. You gain temporary Hit Points equal to your level plus your Constitution modifier, and deal 2 additional damage with melee Strikes (halved for agile weapons and agile unarmed attacks); your instinct may change this. While raging you can't use concentrate actions unless they have the rage trait (you can still Seek). The rage lasts 1 minute, until the encounter ends or until you fall unconscious, and you can't end it early. When it ends, you lose its remaining temporary Hit Points and can't gain temporary Hit Points from Rage for 1 minute."
classes.barbarian.rage.name: 'Rage'
classes.barbarian.raging-resistance.description: 'While raging, you gain resistance equal to 3 plus your Constitution modifier to the damage types your instinct names.'
classes.barbarian.raging-resistance.name: 'Raging Resistance'
classes.barbarian.raging.description: 'You are raging: extra damage on melee Strikes, and no concentrate actions without the rage trait.'
classes.barbarian.raging.name: 'Raging'
classes.barbarian.reflex-expertise.description: 'Your Reflex proficiency becomes expert.'
classes.barbarian.reflex-expertise.name: 'Reflex Expertise'
classes.barbarian.revitalizing-rage.description: 'After a rage ends, you can gain temporary Hit Points from Rage again once you have spent at least one full turn not raging, instead of after 1 minute.'
classes.barbarian.revitalizing-rage.name: 'Revitalizing Rage'
classes.barbarian.weapon-mastery.description: 'Master in simple and martial weapons and unarmed attacks.'
classes.barbarian.weapon-mastery.name: 'Weapon Mastery'
classes.barbarian.weapon-specialization.description: "2 extra damage with weapons and unarmed attacks you are expert in, 3 at master and 4 at legendary. You also gain your instinct's specialization ability."
classes.barbarian.weapon-specialization.name: 'Weapon Specialization'
feats.barbarian.acute-scent.description: 'While raging, you have imprecise scent with a range of 30 feet.'
feats.barbarian.acute-scent.name: 'Acute Scent'
feats.barbarian.acute-vision.description: 'While raging, you have darkvision.'
feats.barbarian.acute-vision.name: 'Acute Vision'
feats.barbarian.adrenaline-rush.description: 'While raging, your maximum and encumbered Bulk limits are 2 higher, and you gain a +1 status bonus to Athletics checks to lift heavy objects, Escape and Force Open.'
feats.barbarian.adrenaline-rush.name: 'Adrenaline Rush'
feats.barbarian.animal-skin.description: 'Animal instinct. Your unarmored defense proficiency becomes expert. While raging and unarmored, you gain a +2 item bonus to AC (+3 with greater juggernaut) and a Dexterity cap of +3.'
feats.barbarian.animal-skin.name: 'Animal Skin'
feats.barbarian.animal-skin.prerequisites.instinct: 'Animal instinct'
feats.barbarian.barreling-charge.actions.barreling-charge.name: 'Barreling Charge'
feats.barbarian.barreling-charge.actions.barreling-charge.steps.weapon.prompt: 'Choose a melee weapon'
feats.barbarian.barreling-charge.description: "Two actions (flourish). Stride up to twice your Speed, moving through enemies' spaces with an Athletics check against each one's Fortitude DC, then make a melee Strike."
feats.barbarian.barreling-charge.prerequisites.athletics: 'Trained in Athletics'
feats.barbarian.barreling-charge.name: 'Barreling Charge'
feats.barbarian.bashing-charge.description: 'Two actions (flourish). Stride twice. Once during it, you can Force Open a door, wall or similar obstacle with a +1 circumstance bonus; on a failure, your movement stops there.'
feats.barbarian.bashing-charge.prerequisites.athletics: 'Trained in Athletics'
feats.barbarian.bashing-charge.name: 'Bashing Charge'
feats.barbarian.brutal-bully.description: 'Expert in Athletics. While raging, a successful Disarm, Grapple, Reposition, Shove or Trip deals bludgeoning damage equal to your Strength modifier.'
feats.barbarian.brutal-bully.name: 'Brutal Bully'
feats.barbarian.brutal-bully.prerequisites.athletics: 'Expert in Athletics'
feats.barbarian.cleave.actions.cleave.name: 'Cleave'
feats.barbarian.cleave.actions.cleave.steps.weapon.prompt: 'Choose a melee weapon'
feats.barbarian.cleave.description: 'Reaction (rage). Trigger: your melee Strike reduces an enemy to 0 Hit Points. Make a melee Strike against an enemy adjacent to it and within your reach.'
feats.barbarian.cleave.name: 'Cleave'
feats.barbarian.draconic-arrogance.description: 'Dragon instinct. While raging, you gain a +2 status bonus to saves against emotion effects.'
feats.barbarian.draconic-arrogance.name: 'Draconic Arrogance'
feats.barbarian.draconic-arrogance.prerequisites.instinct: 'Dragon instinct'
feats.barbarian.dragons-rage-breath.description: 'Dragon instinct. Two actions (concentrate, rage), once every 10 minutes. Breathe a 30-foot cone dealing 1d6 damage per level of your breath type, basic Reflex save against your class DC.'
feats.barbarian.dragons-rage-breath.name: "Dragon's Rage Breath"
feats.barbarian.dragons-rage-breath.prerequisites.instinct: 'Dragon instinct'
feats.barbarian.furious-finish.actions.furious-finish.name: 'Furious Finish'
feats.barbarian.furious-finish.actions.furious-finish.params.rounds.name: 'Rounds of rage left'
feats.barbarian.furious-finish.actions.furious-finish.steps.weapon.prompt: 'Choose a melee weapon'
feats.barbarian.furious-finish.description: 'One action (rage). Make a Strike. On a hit, it deals extra damage equal to the number of rounds of your rage left (at most 10), a circumstance bonus. Your rage then ends, and you are fatigued until you rest for 10 minutes.'
feats.barbarian.furious-finish.name: 'Furious Finish'
feats.barbarian.giants-stature.description: 'Giant instinct. One action (polymorph, primal, rage). You grow to Large, with 5 more feet of reach and clumsy 1, until your rage ends.'
feats.barbarian.giants-stature.name: "Giant's Stature"
feats.barbarian.giants-stature.prerequisites.instinct: 'Giant instinct'
feats.barbarian.inner-strength.actions.inner-strength.name: 'Inner Strength'
feats.barbarian.inner-strength.actions.inner-strength.results.steadied.name: 'Steadied'
feats.barbarian.inner-strength.description: 'Spirit instinct. One action (concentrate, rage). Reduce your enfeebled value by 1.'
feats.barbarian.inner-strength.name: 'Inner Strength'
feats.barbarian.inner-strength.prerequisites.instinct: 'Spirit instinct'
feats.barbarian.mage-hunter.actions.mage-hunter.name: 'Mage Hunter'
feats.barbarian.mage-hunter.actions.mage-hunter.steps.weapon.prompt: 'Choose a melee weapon'
feats.barbarian.mage-hunter.description: 'Superstition instinct. Two actions (rage). Make a melee Strike against a creature you saw Cast a Spell. On a hit that deals damage, it is stupefied 1 (stupefied 2 on a critical hit) until the start of your next turn.'
feats.barbarian.mage-hunter.name: 'Mage Hunter'
feats.barbarian.mage-hunter.prerequisites.instinct: 'Superstition instinct'
feats.barbarian.moment-of-clarity.description: "One action (concentrate, rage). Until the end of this turn, you can use concentrate actions even if they don't have the rage trait."
feats.barbarian.moment-of-clarity.name: 'Moment of Clarity'
feats.barbarian.no-escape.description: 'Reaction (rage). Trigger: an enemy within reach moves away. Stride up to your Speed, keeping it within reach.'
feats.barbarian.no-escape.name: 'No Escape'
feats.barbarian.nocturnal-senses.description: 'While raging, your low-light vision becomes darkvision and your scent reaches 60 feet.'
feats.barbarian.nocturnal-senses.prerequisites.senses: 'Low-light vision or scent'
feats.barbarian.nocturnal-senses.name: 'Nocturnal Senses'
feats.barbarian.oversized-throw.description: 'Two actions (rage). Requirement: a free hand. Throw an object your size or one size smaller as a simple thrown weapon dealing 1d10 bludgeoning damage, with a range increment of 20 feet (2d10 with weapon specialization, 3d10 with greater).'
feats.barbarian.oversized-throw.name: 'Oversized Throw'
feats.barbarian.raging-athlete.description: 'Expert in Athletics. While raging, you have climb and swim Speeds equal to your land Speed, a –10 DC for High Jump and Long Jump, and farther Leaps.'
feats.barbarian.raging-athlete.name: 'Raging Athlete'
feats.barbarian.raging-athlete.prerequisites.athletics: 'Expert in Athletics'
feats.barbarian.raging-intimidation.description: 'Your Demoralize and Scare to Death gain the rage trait. You gain Intimidating Glare and Scare to Death once you meet their prerequisites.'
feats.barbarian.raging-intimidation.name: 'Raging Intimidation'
feats.barbarian.raging-thrower.description: 'Your Rage damage applies to thrown weapon Strikes, and so do Brutality and Devastator.'
feats.barbarian.raging-thrower.name: 'Raging Thrower'
feats.barbarian.reactive-strike.description: 'Reaction. Trigger: a creature within reach uses a manipulate or move action, makes a ranged attack or leaves a square. Make a melee Strike against it, without a multiple attack penalty and not counting toward it. A critical hit against a manipulate action disrupts it.'
feats.barbarian.reactive-strike.name: 'Reactive Strike'
feats.barbarian.scars-of-steel.description: 'Fury instinct. Reaction (rage), once a day. Trigger: a critical hit deals physical damage to you. You gain resistance to it equal to your Constitution modifier plus half your level.'
feats.barbarian.scars-of-steel.name: 'Scars of Steel'
feats.barbarian.scars-of-steel.prerequisites.instinct: 'Fury instinct'
feats.barbarian.scouring-rage.description: 'Your instinct changes your Rage damage type. Free action. Trigger: you Rage. Each enemy within 20 feet takes damage equal to your level of your Rage damage type, basic Fortitude save against your class DC.'
feats.barbarian.scouring-rage.name: 'Scouring Rage'
feats.barbarian.second-wind.description: 'You can gain temporary Hit Points from Rage in the minute after a rage ends. When a rage begun this way ends, you are fatigued for 10 minutes.'
feats.barbarian.second-wind.name: 'Second Wind'
feats.barbarian.shake-it-off.actions.shake-it-off.name: 'Shake It Off'
feats.barbarian.shake-it-off.actions.shake-it-off.results.shaken.name: 'Shaken off'
feats.barbarian.shake-it-off.description: 'One action (concentrate, rage). Reduce your frightened value by 1, then attempt a Fortitude save as if you were Retching: a failure reduces sickened by 1, a success by 2 and a critical success by 3.'
feats.barbarian.shake-it-off.name: 'Shake It Off'
feats.barbarian.spirits-interference.description: 'Spirit instinct. One action (divine, rage). Until your rage ends, a ranged attack against you needs a DC 5 flat check, or it misses.'
feats.barbarian.spirits-interference.name: "Spirits' Interference"
feats.barbarian.spirits-interference.prerequisites.instinct: 'Spirit instinct'
feats.barbarian.spiritual-guides.description: "Spirit instinct. Reaction (fortune), once a day. Trigger: you fail, but don't critically fail, a Perception or skill check. Reroll it and use the second result."
feats.barbarian.spiritual-guides.name: 'Spiritual Guides'
feats.barbarian.spiritual-guides.prerequisites.instinct: 'Spirit instinct'
feats.barbarian.supernatural-senses.description: 'While raging, the flat check to target a concealed creature is DC 3, and a hidden one DC 9.'
feats.barbarian.supernatural-senses.prerequisites.senses: 'Acute Scent or scent'
feats.barbarian.supernatural-senses.name: 'Supernatural Senses'
feats.barbarian.swipe.description: 'Two actions (flourish). Make one melee Strike against up to two foes adjacent to each other and within reach, one attack roll for both. It counts as two attacks for your multiple attack penalty.'
feats.barbarian.swipe.name: 'Swipe'
feats.barbarian.wounded-rage.actions.wounded-rage.name: 'Wounded Rage'
feats.barbarian.wounded-rage.actions.wounded-rage.results.raging.name: 'Raging'
feats.barbarian.wounded-rage.description: 'Reaction. Trigger: you take damage. You Rage.'
feats.barbarian.wounded-rage.name: 'Wounded Rage'
fields.rage.active.name: 'Raging'
fields.rage.largerWeapon.name: 'Wielding a larger weapon (giant instinct)'
fields.rage.resists.name: 'Raging Resistance'
fields.rage.tempHpBlocked.name: 'No temporary Hit Points from Rage (the minute after a rage)'
groups.rage.label: 'Rage'
