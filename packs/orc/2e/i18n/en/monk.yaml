tags.trait.backswing.description: A +1 circumstance bonus to attack rolls with it after missing with it this turn.
tags.trait.backstabber.name: Backstabber
tags.trait.backstabber.description: 'Against an off-guard target, 1 extra precision damage (2 with a +3 weapon).'
