# The monk (Player Core 2): the class, its features and feats, its stances and their unarmed
# attacks. Short rules text written for the pack.
classes.monk.name: Monk
classes.monk.description: 'A master of unarmed combat and swift movement. Key attribute: Strength or Dexterity. 10 Hit Points plus Constitution per level. Trained in Perception, expert in Fortitude, Reflex and Will; trained in simple weapons and unarmed attacks; untrained in armor, expert in unarmored defense; trained in the monk class DC. Trained in 4 skills plus Intelligence.'
classes.monk.choices.key-attribute.prompt: Key attribute
classes.monk.choices.key-attribute.options.str.name: Strength
classes.monk.choices.key-attribute.options.dex.name: Dexterity
classes.monk.choices.skills.prompt: Trained skills (4 plus Intelligence)
classes.monk.choices.class-feat.prompt: Monk feat (level {slot})
classes.monk.choices.skill-feat.prompt: Skill feat (level {slot})

features.monk.flurry-of-blows.name: Flurry of Blows
features.monk.flurry-of-blows.description: 'One action, flourish. Make two unarmed Strikes. If both hit the same creature, combine their damage for resistances and weaknesses. Your multiple attack penalty applies to each as normal.'
features.monk.flurry-of-blows.actions.flurry-of-blows.name: Flurry of Blows
features.monk.flurry-of-blows.actions.flurry-of-blows.steps.first.prompt: 'First Strike: choose an unarmed attack'
features.monk.flurry-of-blows.actions.flurry-of-blows.steps.second.prompt: 'Second Strike: choose an unarmed attack'
features.monk.powerful-fist.name: Powerful Fist
features.monk.powerful-fist.description: "Your fist's damage die is 1d6 instead of 1d4, and you don't take the –2 circumstance penalty for making a lethal attack with an unarmed attack."
features.monk.incredible-movement.name: Incredible Movement
features.monk.incredible-movement.description: 'A +10-foot status bonus to your Speed while you wear no armor, rising by 5 feet at 7th, 11th, 15th and 19th level.'
features.monk.mystic-strikes.name: Mystic Strikes
features.monk.mystic-strikes.description: 'Your unarmed attacks are magical, getting past resistances to non-magical attacks.'
features.monk.expert-strikes.name: Expert Strikes
features.monk.expert-strikes.description: 'Expert in unarmed attacks and simple weapons. You gain the critical specialization effects of unarmed attacks in the brawling group.'
features.monk.perception-expertise.name: Perception Expertise
features.monk.perception-expertise.description: Your Perception proficiency becomes expert.
features.monk.path-to-perfection.name: Path to Perfection
features.monk.path-to-perfection.description: 'Choose Fortitude, Reflex or Will: your proficiency in it becomes master, and a success on that save is a critical success.'
features.monk.path-to-perfection.choices.save.prompt: Saving throw
features.monk.path-to-perfection.choices.save.options.save.fortitude.name: Fortitude
features.monk.path-to-perfection.choices.save.options.save.reflex.name: Reflex
features.monk.path-to-perfection.choices.save.options.save.will.name: Will
features.monk.weapon-specialization.name: Weapon Specialization
features.monk.weapon-specialization.description: '+2 damage with weapons and unarmed attacks you are expert in, +3 if master, +4 if legendary.'
features.monk.metal-strikes.name: Metal Strikes
features.monk.metal-strikes.description: Your unarmed attacks count as cold iron and silver.
features.monk.monk-expertise.name: Monk Expertise
features.monk.monk-expertise.description: 'Your monk class DC proficiency becomes expert, and so do your spell attack modifier and spell DC for qi spells.'
features.monk.second-path-to-perfection.name: Second Path to Perfection
features.monk.second-path-to-perfection.description: 'Choose another saving throw than your first path: your proficiency in it becomes master, and a success on it is a critical success.'
features.monk.second-path-to-perfection.choices.save.prompt: Saving throw
features.monk.second-path-to-perfection.choices.save.options.save.fortitude.name: Fortitude
features.monk.second-path-to-perfection.choices.save.options.save.reflex.name: Reflex
features.monk.second-path-to-perfection.choices.save.options.save.will.name: Will
features.monk.graceful-mastery.name: Graceful Mastery
features.monk.graceful-mastery.description: Your unarmored defense proficiency becomes master.
features.monk.master-strikes.name: Master Strikes
features.monk.master-strikes.description: Master in unarmed attacks and simple weapons.
features.monk.greater-weapon-specialization.name: Greater Weapon Specialization
features.monk.greater-weapon-specialization.description: 'Weapon specialization damage becomes +4 at expert, +6 at master and +8 at legendary.'
features.monk.third-path-to-perfection.name: Third Path to Perfection
features.monk.third-path-to-perfection.description: "Choose one of your first two paths' saves: your proficiency in it becomes legendary, a critical failure on it is a failure, and a failure against a damaging effect halves the damage."
features.monk.third-path-to-perfection.choices.save.prompt: Saving throw
features.monk.third-path-to-perfection.choices.save.options.save.fortitude.name: Fortitude
features.monk.third-path-to-perfection.choices.save.options.save.reflex.name: Reflex
features.monk.third-path-to-perfection.choices.save.options.save.will.name: Will
features.monk.adamantine-strikes.name: Adamantine Strikes
features.monk.adamantine-strikes.description: Your unarmed attacks count as adamantine.
features.monk.graceful-legend.name: Graceful Legend
features.monk.graceful-legend.description: 'Your unarmored defense proficiency becomes legendary, and your monk class DC (and qi spell attack and DC) master.'
features.monk.perfected-form.name: Perfected Form
features.monk.perfected-form.description: 'Fortune. On your first Strike of your turn, if you roll lower than 10 on the d20, you can treat the roll as a 10.'

feats.monk.crane-stance.name: Crane Stance
feats.monk.crane-stance.description: 'One action, stance; you are unarmored. A +1 circumstance bonus to AC; the only Strikes you can make are crane wing attacks (1d6 bludgeoning, agile, finesse, nonlethal, unarmed). Jump DCs are 5 lower and a Leap goes 5 feet farther or 2 feet higher.'
feats.monk.crane-stance.actions.crane-stance.name: Crane Stance
feats.monk.dragon-stance.name: Dragon Stance
feats.monk.dragon-stance.description: 'One action, stance; you are unarmored. You can make dragon tail attacks (1d10 bludgeoning, backswing, nonlethal, unarmed) and ignore the first square of difficult terrain when you Stride.'
feats.monk.dragon-stance.actions.dragon-stance.name: Dragon Stance
feats.monk.mountain-stance.name: Mountain Stance
feats.monk.mountain-stance.description: 'One action, stance; you are unarmored and touching the ground. The only Strikes you can make are falling stone attacks (1d8 bludgeoning, forceful, nonlethal, unarmed). A +4 item bonus to AC and a +2 circumstance bonus against forced movement, but your Dexterity cap to AC is +0 and your Speeds are 5 feet lower.'
feats.monk.mountain-stance.actions.mountain-stance.name: Mountain Stance
feats.monk.tiger-stance.name: Tiger Stance
feats.monk.tiger-stance.description: 'One action, stance; you are unarmored. You can make tiger claw attacks (1d8 slashing, agile, finesse, nonlethal, unarmed); a critical hit that deals damage adds 1d4 persistent bleed damage. With a Speed of 20 feet or more, you can Step 10 feet.'
feats.monk.tiger-stance.actions.tiger-stance.name: Tiger Stance
feats.monk.wolf-stance.name: Wolf Stance
feats.monk.wolf-stance.description: "One action, stance; you are unarmored. You can make wolf jaw attacks (1d8 piercing, agile, backstabber, finesse, nonlethal, unarmed), which gain the trip trait against a target you're flanking."
feats.monk.wolf-stance.actions.wolf-stance.name: Wolf Stance
feats.monk.monastic-weaponry.name: Monastic Weaponry
feats.monk.advanced-monastic-weaponry.name: Advanced Monastic Weaponry
feats.monk.advanced-monastic-weaponry.description: 'For proficiency, you treat advanced monk weapons as martial monk weapons.'
feats.monk.advanced-monastic-weaponry.prerequisites.monastic-weaponry: 'Monastic Weaponry'
feats.monk.monastic-weaponry.description: 'Trained in simple and martial monk weapons, rising with your unarmed attacks; you can use melee monk weapons with monk feats and abilities that need unarmed attacks.'
feats.monk.qi-spells.name: Qi Spells
feats.monk.qi-spells.description: 'You gain a focus pool of 1 Focus Point and become trained in spell attack modifier and spell DC, casting qi spells with Wisdom; choose whether your qi spells are divine or occult. You gain a 1st-rank qi spell: inner upheaval or qi rush. You can take this feat again for the other spell.'
feats.monk.crushing-grab.name: Crushing Grab
feats.monk.crushing-grab.description: 'When you successfully Grapple a creature, you can deal bludgeoning damage equal to your Strength modifier to it, nonlethal if you like.'
feats.monk.dancing-leaf.name: Dancing Leaf
feats.monk.dancing-leaf.description: "Your Leaps and successful jumps go 5 feet farther, and falling distance next to a wall doesn't count."
feats.monk.stunning-blows.name: Stunning Blows
feats.monk.stunning-blows.description: 'Incapacitation. When both Strikes of your Flurry of Blows target the same creature and either hits and deals damage, it must succeed at a Fortitude save against your class DC or be stunned 1 (stunned 3 on a critical failure).'
feats.monk.cobra-stance.name: Cobra Stance
feats.monk.cobra-stance.description: 'One action, stance. The only Strikes you can make are cobra fang attacks (1d4 piercing, agile, deadly d10, finesse, unarmed, venomous). A +1 circumstance bonus to Fortitude saves and your Fortitude DC, and poison resistance equal to half your level.'
feats.monk.cobra-stance.actions.cobra-stance.name: Cobra Stance
feats.monk.deflect-projectile.name: Deflect Projectile
feats.monk.deflect-projectile.description: "Reaction, when you're targeted by a physical ranged attack you're aware of, with a hand free: a +4 circumstance bonus to AC against it."
feats.monk.flying-kick.name: Flying Kick
feats.monk.flying-kick.description: 'Two actions. Leap, High Jump or Long Jump; at its end, Strike an adjacent foe with an unarmed attack, then fall to the ground.'
feats.monk.flying-kick.actions.flying-kick.name: Flying Kick
feats.monk.flying-kick.actions.flying-kick.steps.weapon.prompt: Choose an unarmed attack
feats.monk.stand-still.name: Stand Still
feats.monk.stand-still.description: 'Reaction, when a creature within your reach uses a move action or leaves a square during one: make a melee Strike against it. A critical hit disrupts a move action.'
feats.monk.stand-still.actions.stand-still.name: Stand Still
feats.monk.stand-still.actions.stand-still.steps.weapon.prompt: Choose a melee weapon or unarmed attack
feats.monk.mountain-stronghold.name: Mountain Stronghold
feats.monk.mountain-stronghold.description: "One action, in Mountain Stance: a +2 circumstance bonus to AC until the start of your next turn. Mountain Stance's Dexterity cap to AC is +1 for you."
feats.monk.mountain-stronghold.actions.mountain-stronghold.name: Mountain Stronghold
feats.monk.mountain-stronghold.prerequisites.mountain-stance: Mountain Stance
feats.monk.one-inch-punch.name: One-Inch Punch
feats.monk.one-inch-punch.description: 'Two or three actions. An unarmed Strike that deals one extra weapon damage die for two actions, two for three; twice as many dice from 10th level and three times from 18th.'
feats.monk.one-inch-punch.actions.one-inch-punch.name: One-Inch Punch
feats.monk.one-inch-punch.actions.one-inch-punch.params.actions.name: Actions spent
feats.monk.one-inch-punch.actions.one-inch-punch.steps.weapon.prompt: Choose an unarmed attack
feats.monk.one-inch-punch.prerequisites.expert-strikes: Expert Strikes
feats.monk.tiger-slash.name: Tiger Slash
feats.monk.tiger-slash.description: 'Two actions, in Tiger Stance. A tiger claw Strike with two extra weapon damage dice (three from 14th level), and you can push the target 5 feet as a Shove. A critical hit adds your Strength modifier to the persistent bleed damage.'
feats.monk.tiger-slash.actions.tiger-slash.name: Tiger Slash
feats.monk.tiger-slash.actions.tiger-slash.steps.weapon.prompt: Choose your tiger claw
feats.monk.tiger-slash.prerequisites.tiger-stance: Tiger Stance
feats.monk.water-step.name: Water Step
feats.monk.water-step.description: "You can Stride across liquids and surfaces that can't support your weight, as long as you don't end your movement there."

