feats.monk.clinging-shadows-initiate.name: 'Clinging Shadows Initiate'
feats.monk.clinging-shadows-initiate.description: "You gain the clinging shadows stance qi spell and 1 Focus Point. Entering the stance is a qi spell; its shadow grasp Strikes aren't, so you can use them as often as you like while in it."
feats.monk.clinging-shadows-initiate.prerequisites.qi-spells: 'Qi Spells'
feats.monk.wild-winds-initiate.name: 'Wild Winds Initiate'
feats.monk.wild-winds-initiate.description: "You gain the wild winds stance qi spell and 1 Focus Point. Entering the stance is a qi spell; its wind crash Strikes aren't, so you can use them as often as you like while in it."
feats.monk.wild-winds-initiate.prerequisites.qi-spells: 'Qi Spells'
feats.monk.wind-jump.name: 'Wind Jump'
feats.monk.wind-jump.description: 'You gain the wind jump qi spell and 1 Focus Point.'
feats.monk.wind-jump.prerequisites.qi-spells: 'Qi Spells'
feats.monk.shadows-web.name: "Shadow's Web"
feats.monk.shadows-web.description: "You gain the shadow's web qi spell and 1 Focus Point."
feats.monk.shadows-web.prerequisites.clinging-shadows-initiate: 'Clinging Shadows Initiate'
feats.monk.master-qi-spells.name: 'Master Qi Spells'
feats.monk.master-qi-spells.description: "You gain an 8th-rank qi spell, medusa's wrath or touch of death, and 1 Focus Point. You can take this feat again for the other spell."
feats.monk.master-qi-spells.prerequisites.qi-spells: 'Qi Spells'
feats.monk.master-qi-spells.choices.spell.prompt: 'Qi spell'
feats.monk.master-qi-spells.choices.spell.options.medusas-wrath.name: "Medusa's wrath"
feats.monk.master-qi-spells.choices.spell.options.touch-of-death.name: 'Touch of death'
feats.monk.grandmaster-qi-spells.name: 'Grandmaster Qi Spells'
feats.monk.grandmaster-qi-spells.description: 'You gain a 9th-rank qi spell, embrace nothingness or qi form, and 1 Focus Point. You can take this feat again for the other spell.'
feats.monk.grandmaster-qi-spells.prerequisites.qi-spells: 'Qi Spells'
