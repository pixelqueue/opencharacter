feats.monk.harmonize-self.description: 'You gain the harmonize self qi spell and 1 Focus Point.'
feats.monk.harmonize-self.prerequisites.qi-spells: 'Qi Spells'
feats.monk.advanced-qi-spells.name: 'Advanced Qi Spells'
feats.monk.advanced-qi-spells.description: 'You gain a 3rd-rank qi spell, qi blast or shrink the span, and 1 Focus Point. You can take this feat again for the other spell.'
feats.monk.advanced-qi-spells.prerequisites.qi-spells: 'Qi Spells'
