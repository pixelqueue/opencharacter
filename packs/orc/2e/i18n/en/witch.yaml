# The witch (Player Core): the class, its patrons and lessons, features, feats and hexes. Short
# rules text written for the pack.
fields.witch.patron.name: 'Patron'
tags.lesson.name: 'Lesson'
tags.lesson.basic.name: 'Basic lesson'
