# The class.
classes.witch.name: 'Witch'
classes.witch.description: "A spellcaster empowered by a mysterious patron through a familiar. Key attribute: Intelligence. 6 Hit Points plus Constitution per level. Trained in Perception, Fortitude and Reflex, expert in Will; trained in simple weapons and unarmed attacks; trained in unarmored defense; trained in the witch class DC, spell attack modifier and spell DC. Trained in your patron's skill and 3 more skills plus Intelligence. You prepare spells of your patron's tradition with Intelligence from those your familiar knows: two slots of each rank (three from the next level) and five cantrips. Your familiar starts knowing 10 cantrips, five 1st-rank spells and your patron's lesson spell, and learns two spells each level. Hexes are focus spells; you can cast one hex each turn."
classes.witch.choices.patron.prompt: 'Patron'
classes.witch.choices.hex.prompt: 'First hex'
classes.witch.choices.skills.prompt: 'Trained skills (3 plus Intelligence)'
classes.witch.choices.familiar-cantrips.prompt: "Your familiar's cantrips (10)"
classes.witch.choices.familiar-spells.prompt: "Your familiar's 1st-rank spells (5)"
classes.witch.choices.familiar-learns.prompt: 'Spells your familiar learns (level {slot})'
classes.witch.choices.class-feat.prompt: 'Witch feat (level {slot})'
classes.witch.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.witch.choices.hex.options.patrons-puppet.name: "Patron's puppet"
classes.witch.choices.hex.options.phase-familiar.name: 'Phase familiar'

# Patrons.
classes.witch.patrons.faiths-flamekeeper.name: "Faith's Flamekeeper"
classes.witch.patrons.faiths-flamekeeper.description: "A patron that rekindled your will when it guttered. Divine; Religion. Lesson of fervor's grasp: the stoke the heart hex cantrip, and your familiar learns command. Familiar of restored spirit: when you Cast or Sustain a hex, a willing creature within 15 feet of your familiar gains temporary Hit Points equal to 2 + half your level until the start of your next turn."
classes.witch.patrons.inscribed-one.name: 'The Inscribed One'
classes.witch.patrons.inscribed-one.description: "A patron that speaks in glyphs and numbers. Arcane; Arcana. Lesson of glyph's supremacy: the discern secrets hex, and your familiar learns runic weapon. Familiar of flowing script: when you Cast or Sustain a hex, your familiar can flank for you and your allies until the start of your next turn."
classes.witch.patrons.resentment.name: 'The Resentment'
classes.witch.patrons.resentment.description: "A patron that longs to see the mighty brought low. Occult; Occultism. Lesson of strength's impermanence: the evil eye hex cantrip, and your familiar learns enfeeble. Familiar of ongoing misery: when you Cast or Sustain a hex, your familiar can prolong one timed negative condition on a creature within 15 feet by 1 round (once per condition; a curse effect)."
classes.witch.patrons.silence-in-snow.name: 'Silence in Snow'
classes.witch.patrons.silence-in-snow.description: "A patron of bitter cold. Primal; Nature. Lesson of winter's chill: the clinging ice hex cantrip, and your familiar learns gust of wind. Familiar of freezing rime: when you Cast or Sustain a hex, a 5-foot burst in your familiar's space becomes difficult terrain until the start of your next turn."
classes.witch.patrons.spinner-of-threads.name: 'Spinner of Threads'
classes.witch.patrons.spinner-of-threads.description: "A patron that weaves the tapestry of fate. Occult; Occultism. Lesson of fate's vicissitudes: the nudge fate hex cantrip, and your familiar learns sure strike. Familiar of balanced luck: when you Cast or Sustain a hex, a creature within 15 feet of your familiar gets a +1 status bonus or a -1 status penalty to AC (your choice) until the start of your next turn."
classes.witch.patrons.starless-shadow.name: 'Starless Shadow'
classes.witch.patrons.starless-shadow.description: "A patron of the witching hour. Occult; Occultism. Lesson of night's terrors: the shroud of night hex cantrip, and your familiar learns fear. Familiar of stalking night: when you Cast or Sustain a hex, an enemy adjacent to your familiar that it's concealed, hidden or undetected to becomes frightened 1."
classes.witch.patrons.wilding-steward.name: 'Wilding Steward'
classes.witch.patrons.wilding-steward.description: 'A patron that defends the wild. Primal; Nature. Lesson of wild speech: the wilding word hex cantrip, and your familiar learns summon animal or summon plant or fungus. Familiar of keen senses: when you Cast or Sustain a hex, your familiar gains imprecise scent, tremorsense or wavesense (60 feet) until the start of your next turn and can Point Out as a free action.'
classes.witch.patrons.wilding-steward.choices.lesson-spell.prompt: 'The spell your familiar learns'
classes.witch.patrons.wilding-steward.choices.lesson-spell.options.summon-animal.name: 'Summon animal'
classes.witch.patrons.wilding-steward.choices.lesson-spell.options.summon-plant-or-fungus.name: 'Summon plant or fungus'

# Lessons.
classes.witch.lessons.dreams.name: 'Lesson of Dreams'
classes.witch.lessons.dreams.description: 'Dreams open the way to insight. The veil of dreams hex; your familiar learns sleep.'
classes.witch.lessons.elements.name: 'Lesson of the Elements'
classes.witch.lessons.elements.description: 'Storms and disasters outmatch any creature. The elemental betrayal hex; your familiar learns breathe fire, gust of wind, hydraulic push or pummeling rubble.'
classes.witch.lessons.elements.choices.lesson-spell.prompt: 'The spell your familiar learns'
classes.witch.lessons.elements.choices.lesson-spell.options.breathe-fire.name: 'Breathe fire'
classes.witch.lessons.elements.choices.lesson-spell.options.gust-of-wind.name: 'Gust of wind'
classes.witch.lessons.elements.choices.lesson-spell.options.hydraulic-push.name: 'Hydraulic push'
classes.witch.lessons.elements.choices.lesson-spell.options.pummeling-rubble.name: 'Pummeling rubble'
classes.witch.lessons.life.name: 'Lesson of Life'
classes.witch.lessons.life.description: 'Life can be shared. The life boost hex; your familiar learns spirit link.'
classes.witch.lessons.protection.name: 'Lesson of Protection'
classes.witch.lessons.protection.description: 'Prevention beats a cure. The blood ward hex; your familiar learns mystic armor.'
classes.witch.lessons.vengeance.name: 'Lesson of Vengeance'
classes.witch.lessons.vengeance.description: 'No slight goes unanswered. The needle of vengeance hex; your familiar learns phantom pain.'
classes.witch.lessons.mischief.name: 'Lesson of Mischief'
classes.witch.lessons.mischief.description: "A little mischief does no harm. The deceiver's cloak hex; your familiar learns mad monkeys."
classes.witch.lessons.shadow.name: 'Lesson of Shadow'
classes.witch.lessons.shadow.description: 'A shadow holds something of its owner. The malicious shadow hex; your familiar learns chilling darkness.'
classes.witch.lessons.snow.name: 'Lesson of Snow'
classes.witch.lessons.snow.description: 'Gentle snow can still smother life. The personal blizzard hex; your familiar learns wall of wind.'
classes.witch.lessons.death.name: 'Lesson of Death'
classes.witch.lessons.death.description: 'Death is final, but not inescapable. The curse of death hex; your familiar learns raise dead.'
classes.witch.lessons.renewal.name: 'Lesson of Renewal'
classes.witch.lessons.renewal.description: 'Entropy can be wound back. The restorative moment hex; your familiar learns field of life.'

# Features.
features.witch.familiar.name: 'Familiar'
features.witch.familiar.description: "Your patron sends a familiar that teaches you magic. It follows the familiar rules with two more abilities: your patron's unique ability (always) and one you choose daily, and one more at 6th, 12th and 18th level. You commune with it to prepare spells; it knows the spells you prepare from. If it dies, your patron replaces it at your next daily preparations, knowing the same spells."
features.witch.hexes.name: 'Hexes'
features.witch.hexes.description: "Hexes are focus spells your patron sends through your familiar; you can cast only one hex each turn (a second fails, its actions lost). You start with a focus pool of 1 Focus Point, regained by Refocusing with your familiar, and learn patron's puppet or phase familiar. Hex cantrips cost no Focus Point and are in addition to your prepared cantrips; your patron gives you one."
features.witch.magical-fortitude.name: 'Magical Fortitude'
features.witch.magical-fortitude.description: 'Your proficiency rank for Fortitude saves increases to expert.'
features.witch.expert-spellcaster.name: 'Expert Spellcaster'
features.witch.expert-spellcaster.description: 'Your proficiency ranks for spell attack modifier and spell DC increase to expert.'
features.witch.reflex-expertise.name: 'Reflex Expertise'
features.witch.reflex-expertise.description: 'Your proficiency rank for Reflex saves increases to expert.'
features.witch.perception-expertise.name: 'Perception Expertise'
features.witch.perception-expertise.description: 'Your proficiency rank for Perception increases to expert.'
features.witch.weapon-expertise.name: 'Weapon Expertise'
features.witch.weapon-expertise.description: 'Your proficiency ranks for simple weapons and unarmed attacks increase to expert.'
features.witch.defensive-robes.name: 'Defensive Robes'
features.witch.defensive-robes.description: 'Your proficiency rank for unarmored defense increases to expert.'
features.witch.weapon-specialization.name: 'Weapon Specialization'
features.witch.weapon-specialization.description: 'You deal 2 more damage with weapons and unarmed attacks in which you are an expert, 3 if a master, 4 if legendary.'
features.witch.master-spellcaster.name: 'Master Spellcaster'
features.witch.master-spellcaster.description: 'Your proficiency ranks for spell attack modifier and spell DC increase to master.'
features.witch.will-of-the-pupil.name: 'Will of the Pupil'
features.witch.will-of-the-pupil.description: 'Your proficiency rank for Will saves increases to master, and a success on a Will save is a critical success instead.'
features.witch.legendary-spellcaster.name: 'Legendary Spellcaster'
features.witch.legendary-spellcaster.description: 'Your proficiency ranks for spell attack modifier and spell DC increase to legendary.'
features.witch.patrons-gift.name: "Patron's Gift"
features.witch.patrons-gift.description: "You gain a single 10th-rank spell slot to prepare a witch spell in; abilities that add slots or cast without spending one can't use it. Patron's Truth gives a second."

# Hexes.
spells.patrons-puppet.name: "Patron's Puppet"
spells.patrons-puppet.description: 'Free action. Trigger: your turn begins. Your patron takes hold of your familiar: you Command it (without the auditory or concentrate traits), and it takes its normal actions this turn.'
spells.phase-familiar.name: 'Phase Familiar'
spells.phase-familiar.description: "Reaction. Trigger: your familiar within 60 feet would take damage. It turns ghostly: resistance 5 to all damage against the trigger, and immunity to precision damage.\n\n**Heightened (+1)** The resistance increases by 2."
spells.cackle.name: 'Cackle'
spells.cackle.description: 'Free action. A burst of laughter prolongs your magic: you Sustain a spell.'
spells.blood-ward.name: 'Blood Ward'
spells.blood-ward.description: "A creature within 30 feet, sustained up to 1 minute: name a creature trait (aberration, animal, beast, celestial, construct, dragon, elemental, fey, fiend, fungus, monitor, ooze, plant or undead); the target gains a +1 status bonus to saves and AC against creatures with that trait.\n\n**Heightened (5th)** The bonus is +2."
spells.elemental-betrayal.name: 'Elemental Betrayal'
spells.elemental-betrayal.description: "A creature within 30 feet, sustained up to 1 minute: choose air, earth, fire, metal, water or wood; the target gains weakness 2 to that trait.\n\n**Heightened (+2)** The weakness increases by 1."
spells.life-boost.name: 'Life Boost'
spells.life-boost.description: "A creature within 30 feet gains fast healing 2 for 4 rounds.\n\n**Heightened (+1)** The fast healing increases by 2."
spells.needle-of-vengeance.name: 'Needle of Vengeance'
spells.needle-of-vengeance.description: "An enemy within 30 feet, sustained up to 1 minute: name yourself or an ally. Each time the target uses a hostile action against that creature, it takes 2 mental damage (basic Will save).\n\n**Heightened (+1)** The damage increases by 2."
spells.veil-of-dreams.name: 'Veil of Dreams'
spells.veil-of-dreams.description: 'A creature within 30 feet, sustained up to 1 minute, attempts a Will save. **Critical Success** Unaffected. **Success** A -1 status penalty to Perception, attack rolls and Will saves (-2 to Will saves against sleep). **Failure** As success, and each concentrate action it uses needs a DC 5 flat check or is disrupted.'
spells.deceivers-cloak.name: "Deceiver's Cloak"
spells.deceivers-cloak.description: "Your patron cloaks you in illusion for 1 hour: you appear as another creature of your body shape and roughly your size, as a 3rd-rank illusory disguise.\n\n**Heightened (6th)** Any creature of your size, of any shape."
spells.malicious-shadow.name: 'Malicious Shadow'
spells.malicious-shadow.description: "A creature within 30 feet, sustained up to 1 minute: its shadow turns on it. When you cast the spell and each time you Sustain it, the shadow makes a melee spell attack against it for 2d10 damage of a type you choose (bludgeoning, piercing or slashing); it uses and adds to your multiple attack penalty. It vanishes if the target casts no shadow.\n\n**Heightened (+2)** The damage increases by 1d10."
spells.personal-blizzard.name: 'Personal Blizzard'
spells.personal-blizzard.description: "A creature within 30 feet, sustained up to 1 minute, attempts a Fortitude save. **Critical Success** Unaffected. **Success** 1d6 cold damage, and the spell ends. **Failure** 1d6 cold and 1d6 persistent cold damage (ending with the spell); it and others are concealed to each other. **Critical Failure** As failure, 2d6 and 2d6.\n\n**Heightened (+1)** Each damage increases by 1 (2 on a critical failure)."
spells.curse-of-death.name: 'Curse of Death'
spells.curse-of-death.description: "A creature within 30 feet, sustained up to 1 minute, attempts a Fortitude save and is then immune for a day. **Critical Success** Unaffected. **Success** The curse at stage 1, which can't advance. **Failure** The curse at stage 1. **Critical Failure** At stage 2. Curse of death (ends with the spell): stage 1, 4d6 void damage and fatigued for 1 round; stage 2, 8d6 and fatigued; stage 3, 12d6 and fatigued; stage 4, death.\n\n**Heightened (+1)** The damage of the success and of the first three stages increases by 1d6."
spells.restorative-moment.name: 'Restorative Moment'
spells.restorative-moment.description: "A creature within 30 feet lowers its doomed and drained values by 1 and can attempt one save against each affliction with a stage of 1 day or less. It's then immune for a day."
situational.bloodWard.name: "Against a creature of the blood ward's trait"

# Witch's armaments.
weapons.witch-eldritch-nails.name: 'Eldritch Nails'
features.witch.armament-eldritch-nails.name: 'Eldritch Nails'
features.witch.armament-eldritch-nails.description: 'Long, sharp nails: 1d6 slashing, agile.'
weapons.witch-iron-teeth.name: 'Iron Teeth'
features.witch.armament-iron-teeth.name: 'Iron Teeth'
features.witch.armament-iron-teeth.description: 'Long metal teeth: 1d8 piercing.'
weapons.witch-living-hair.name: 'Living Hair'
features.witch.armament-living-hair.name: 'Living Hair'
features.witch.armament-living-hair.description: 'Hair you lengthen and wield: 1d4 bludgeoning, agile, disarm, finesse, trip.'

# Feats.
feats.witch.cackle.name: 'Cackle'
feats.witch.cackle.description: 'You learn the cackle hex, which lets you Sustain a spell with a burst of laughter.'
feats.witch.cauldron.name: 'Cauldron'
feats.witch.cauldron.description: 'You can Craft oils and potions and learn four common 1st-level formulas for them, and one more of your level or lower at 4th level and every 2 levels after (your familiar can hold them). During daily preparations you brew one temporary oil or potion from a formula you know (two with master spell DC proficiency, three legendary), inert at your next preparations.'
feats.witch.witchs-armaments.name: "Witch's Armaments"
feats.witch.witchs-armaments.description: 'Your patron arms your body. Gain one unarmed attack in the brawling group: eldritch nails (1d6 slashing, agile), iron teeth (1d8 piercing) or living hair (1d4 bludgeoning, agile, disarm, finesse, trip). You can take this feat again for another attack.'
feats.witch.witchs-armaments.choices.armament.prompt: 'Unarmed attack'
feats.witch.basic-lesson.name: 'Basic Lesson'
feats.witch.basic-lesson.description: 'Choose a basic lesson: you gain its hex, and your familiar learns its spell.'
feats.witch.basic-lesson.choices.lesson.prompt: 'Basic lesson'
feats.witch.familiars-language.name: "Familiar's Language"
feats.witch.familiars-language.description: "You can talk with creatures of your familiar's animal family (as speak with animals for that family) and use Diplomacy with them. A new familiar of another kind takes a week to learn."
feats.witch.rites-of-convocation.name: 'Rites of Convocation'
feats.witch.rites-of-convocation.description: "Choose a summon spell on your tradition's list. In 10 minutes of communion you can replace a prepared spell in one of your slots with it, heightened to that slot's rank (at least its minimum rank)."
feats.witch.sympathetic-strike.name: 'Sympathetic Strike'
feats.witch.sympathetic-strike.description: "One action, once per round. Make an unarmed Strike with a witch's armament; on a hit the target takes a -1 circumstance penalty to saves against your hexes (-2 on a critical hit) until the start of your next turn."
feats.witch.sympathetic-strike.prerequisites.armaments: "Witch's Armaments"
feats.witch.sympathetic-strike.actions.sympathetic-strike.name: 'Sympathetic Strike'
feats.witch.sympathetic-strike.actions.sympathetic-strike.steps.weapon.prompt: 'Choose an armament'
feats.witch.ceremonial-knife.name: 'Ceremonial Knife'
feats.witch.ceremonial-knife.description: 'During daily preparations you make a knife-group weapon into a wand holding a 1st-rank spell your familiar knows, which only you can activate (overcharging as normal). The rank rises by 1 at 8th level and every 2 levels after.'
feats.witch.greater-lesson.name: 'Greater Lesson'
feats.witch.greater-lesson.description: 'Choose a greater or basic lesson: you gain its hex, and your familiar learns its spell.'
feats.witch.greater-lesson.choices.lesson.prompt: 'Greater or basic lesson'
feats.witch.witchs-charge.name: "Witch's Charge"
feats.witch.witchs-charge.description: 'During daily preparations, designate a willing creature as your charge until your next preparations: you always know its direction, distance and conditions, and can cast touch spells on it from 30 feet.'
feats.witch.incredible-familiar.name: 'Incredible Familiar'
feats.witch.incredible-familiar.description: 'Your familiar has a base of six familiar or master abilities a day instead of four, plus your witch bonus abilities.'
feats.witch.incredible-familiar.prerequisites.enhanced: 'Enhanced Familiar'
feats.witch.murksight.name: 'Murksight'
feats.witch.murksight.description: "Non-magical fog, mist, rain and snow don't give you circumstance penalties to ranged attacks or Perception, and targets concealed only by them need no flat check."
feats.witch.spirit-familiar-witch.name: 'Spirit Familiar'
feats.witch.spirit-familiar-witch.description: "Two actions, once per 10 minutes (your familiar's Shed Spirit). Its spirit flies at an enemy within 20 feet for 6d6 spirit damage (basic Will save against your spell DC), then heals an ally within 30 feet of the enemy for half the damage dealt. 2d6 more at 9th level and every 2 levels after."
feats.witch.spirit-familiar-witch.prerequisites.patron: 'A divine or occult patron'
feats.witch.spirit-familiar-witch.actions.shed-spirit.name: 'Shed Spirit (your familiar)'
feats.witch.spirit-familiar-witch.actions.shed-spirit.results.shed.name: 'Spirit shed'
feats.witch.stitched-familiar.name: 'Stitched Familiar'
feats.witch.stitched-familiar.description: "Two actions, once per 10 minutes (your familiar's Stitching Strike). It unravels around an enemy within 30 feet for 6d6 slashing damage (basic Reflex save against your spell DC); on a failure the target is immobilized for 1 round or until it Escapes. 2d6 more at 9th level and every 2 levels after."
feats.witch.stitched-familiar.prerequisites.patron: 'An arcane or primal patron'
feats.witch.stitched-familiar.actions.stitching-strike.name: 'Stitching Strike (your familiar)'
feats.witch.stitched-familiar.actions.stitching-strike.results.struck.name: 'Struck'
feats.witch.witchs-bottle.name: "Witch's Bottle"
feats.witch.witchs-bottle.description: "Spend 10 minutes and 1 Focus Point to brew a potion holding one of your targeted hexes; whoever drinks it is targeted. A sustained hex can carry a cackle. It goes inert at your next daily preparations, and the Focus Points stay spent until it's drunk or inert."
feats.witch.witchs-bottle.prerequisites.cauldron: 'Cauldron'
feats.witch.double-double.name: 'Double, Double'
feats.witch.double-double.description: 'Each temporary oil or potion you brew in daily preparations comes as two copies.'
feats.witch.double-double.prerequisites.cauldron: 'Cauldron'
feats.witch.major-lesson.name: 'Major Lesson'
feats.witch.major-lesson.description: 'Choose a major, greater or basic lesson: you gain its hex, and your familiar learns its spell. You can take this feat a second time at 14th level and a third at 18th, choosing a different lesson.'
feats.witch.major-lesson.choices.lesson.prompt: 'Major, greater or basic lesson'
feats.witch.major-lesson.prerequisites.retake-level: 'Taken again: 14th level for a second time, 18th for a third'
feats.witch.witchs-communion.name: "Witch's Communion"
feats.witch.witchs-communion.description: 'You can designate as many charges as your Intelligence modifier.'
feats.witch.witchs-communion.prerequisites.charge: "Witch's Charge"
feats.witch.coven-spell.name: 'Coven Spell'
feats.witch.coven-spell.description: 'Reaction. Trigger: an ally within 30 feet Casts a Spell. Either the spell (dealing damage, without a duration) gains a status bonus to damage equal to its rank, or you apply a spellshape feat you know that suits it.'
feats.witch.hex-focus.name: 'Hex Focus'
feats.witch.hex-focus.description: 'When you Refocus, you refill your focus pool completely.'
feats.witch.witchs-broom.name: "Witch's Broom"
feats.witch.witchs-broom.description: "During daily preparations you anoint a broom, staff, polearm or similar object: until your next preparations it's magical and you can ride it while holding it, flying at 20 feet (-10 feet over 20 Bulk, crashing over 30). You can Craft it into a flying broomstick; one already gains +10 feet."
feats.witch.patrons-presence.name: "Patron's Presence"
feats.witch.patrons-presence.description: 'Your familiar gains a 2-action aura (once per hour): enemies entering or starting their turn in a 15-foot emanation must succeed at a Will save against your spell DC or be stupefied 2 while inside (3 on a critical failure). It lasts until the end of your next turn; the familiar can Sustain it up to 1 minute.'
feats.witch.rites-of-transfiguration.name: 'Rites of Transfiguration'
feats.witch.rites-of-transfiguration.description: 'Your familiar learns cursed metamorphosis (even off your list); in 10 minutes of communion you can replace a prepared spell of 6th rank or higher with it at the same rank.'
feats.witch.siphon-power.name: 'Siphon Power'
feats.witch.siphon-power.description: 'Free action, once a day, before you act on your turn. This turn you can cast a spell your familiar knows from your patron or lessons without a slot (or preparing it), at least 1 rank below your highest.'
feats.witch.patrons-claim.name: "Patron's Claim"
feats.witch.patrons-claim.description: 'Your familiar gains a 2-action activity (once per hour): your patron reaches from its mouth at a creature within 30 feet for 10d10 spirit damage (basic Fortitude save against your spell DC); if it fails and takes damage it is drained 2 (4 on a critical failure) and you regain 1 Focus Point.'
feats.witch.patrons-claim.actions.patrons-claim.name: "Patron's Claim (your familiar)"
feats.witch.patrons-claim.actions.patrons-claim.results.claimed.name: 'Claimed'
feats.witch.split-hex.name: 'Split Hex'
feats.witch.split-hex.description: 'One action, spellshape. If your next action casts a harmful single-target hex, cast it 2 ranks lower to give it a second target.'
feats.witch.hex-master.name: 'Hex Master'
feats.witch.hex-master.description: 'You can cast any number of hexes each turn, and casting cackle Sustains all your sustained hexes.'
feats.witch.patrons-truth.name: "Patron's Truth"
feats.witch.patrons-truth.description: 'You gain one more 10th-rank spell slot.'
feats.witch.patrons-truth.prerequisites.gift: "Patron's gift"
feats.witch.witchs-hut.name: "Witch's Hut"
feats.witch.witchs-hut.description: "A day-long rite animates a hut, house, wagon or tent up to Huge: it uses your AC, saves and Perception, has 150 Hit Points and Hardness 10 (construct armor), can't attack, and obeys one-action commands after a round: guard, hide, leap (a 10th-rank teleport), lock, move (Speed 60 feet)."
