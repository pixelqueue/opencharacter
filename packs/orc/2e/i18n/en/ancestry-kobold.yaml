# Player Core 2's kobold: its ancestry or heritage, heritages and feats, in text written for the
# pack.
ancestries.kobold.choices.boosts.options.alternate.choices.free.prompt: 'Two free attribute boosts'
ancestries.kobold.choices.boosts.options.alternate.name: 'Two free boosts instead'
ancestries.kobold.choices.boosts.options.standard.choices.free.prompt: 'A free attribute boost'
ancestries.kobold.choices.boosts.options.standard.name: "The ancestry's boosts and flaw"
ancestries.kobold.choices.boosts.prompt: 'Ancestry attribute boosts'
ancestries.kobold.choices.heritage.prompt: 'Heritage'
ancestries.kobold.name: 'Kobold'
ancestries.kobold.description: "Small, cunning reptilian folk marked by their warren's benefactor. 6 Hit Points, Small, 25 feet. Boosts: Dexterity, Charisma, free; flaw: Constitution. Darkvision. One more language."
heritages.cavernstalker-kobold.name: 'Cavernstalker Kobold'
heritages.cavernstalker-kobold.description: 'Climbing natural stone, you move half your Speed on a success and your full Speed on a critical success (full on a success with Quick Climb), unless you use a climb Speed. A success to Squeeze is a critical success.'
heritages.dragonscaled-kobold.name: 'Dragonscaled Kobold'
heritages.dragonscaled-kobold.description: 'You gain 10 Hit Points from your ancestry instead of 6, and a +1 circumstance bonus to saves against dragon breath, sleep effects and effects that would paralyze you.'
heritages.elementheart-kobold.name: 'Elementheart Kobold'
heritages.elementheart-kobold.description: 'Pick an elemental benefactor: resistance equal to half your level (minimum 1) to cold (air), electricity (earth), fire (fire), sonic (metal), acid (water) or poison (wood).'
heritages.elementheart-kobold.choices.element.prompt: 'Elemental benefactor'
heritages.elementheart-kobold.choices.element.options.air.name: 'Air (cold resistance)'
heritages.elementheart-kobold.choices.element.options.earth.name: 'Earth (electricity resistance)'
heritages.elementheart-kobold.choices.element.options.fire.name: 'Fire (fire resistance)'
heritages.elementheart-kobold.choices.element.options.metal.name: 'Metal (sonic resistance)'
heritages.elementheart-kobold.choices.element.options.water.name: 'Water (acid resistance)'
heritages.elementheart-kobold.choices.element.options.wood.name: 'Wood (poison resistance)'
heritages.spellhorn-kobold.name: 'Spellhorn Kobold'
heritages.spellhorn-kobold.description: 'Pick a common arcane cantrip: you can cast it as an arcane innate spell at will (heightened as cantrips are), trained in spell attacks and DCs, with Charisma.'
heritages.spellhorn-kobold.choices.cantrip.prompt: 'Arcane cantrip (innate)'
heritages.strongjaw-kobold.name: 'Strongjaw Kobold'
heritages.strongjaw-kobold.description: 'You gain a jaws unarmed attack: 1d6 piercing, brawling group, finesse and unarmed.'
heritages.tunnelflood-kobold.name: 'Tunnelflood Kobold'
heritages.tunnelflood-kobold.description: 'You gain a swim Speed of 15 feet.'
heritages.venomtail-kobold.name: 'Venomtail Kobold'
heritages.venomtail-kobold.description: 'Tail Toxin: once a day, 1 action (manipulate), wielding a piercing or slashing weapon: you coat it; if your next Strike with it before the end of your next turn hits and deals damage, the target takes persistent poison damage equal to your level.'
feats.ancestry.cringe.name: 'Cringe'
feats.ancestry.cringe.description: "A reaction (emotion, mental, visual) when a creature you're aware of critically hits you with a Strike: that damage takes a circumstance penalty equal to your level + 2 (after doubling). It's then immune for 24 hours."
feats.ancestry.dragons-presence.name: "Dragon's Presence"
feats.ancestry.dragons-presence.description: 'Against fear effects, a successful save is a critical success and a failed one a critical failure. +1 circumstance bonus to Demoralize a foe of your level or lower.'
feats.ancestry.dragons-presence.prerequisites.dragonscaled: 'Dragonscaled kobold heritage'
feats.ancestry.kobold-lore.name: 'Kobold Lore'
feats.ancestry.kobold-lore.description: "You're trained in Stealth and Thievery (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Kobold Lore."
feats.ancestry.kobold-weapon-familiarity.name: 'Kobold Weapon Familiarity'
feats.ancestry.kobold-weapon-familiarity.description: 'You have access to uncommon kobold weapons, and familiarity with kobold weapons and the greatpick, light pick and pick: martial ones count as simple and advanced ones as martial for you. From 5th level, their critical specialization effects.'
feats.ancestry.scamper.name: 'Scamper'
feats.ancestry.scamper.description: '1 action, next to an enemy: Stride with a +5-foot status bonus to Speed and a +2 circumstance bonus to AC against reactions it triggers, ending away from every enemy.'
feats.ancestry.snare-setter.name: 'Snare Setter'
feats.ancestry.snare-setter.description: "You're trained in Crafting (or a skill of your choice if you already were), have access to uncommon kobold snares, and gain Snare Crafting (its formulas may include kobold snares)."
feats.ancestry.snare-setter.prerequisites.trained: 'Trained in Crafting'
feats.ancestry.allys-shelter.name: "Ally's Shelter"
feats.ancestry.allys-shelter.description: "Once a day, a reaction (fortune) before a save while next to an ally: roll it with that ally's modifier for that save."
feats.ancestry.grovel.name: 'Grovel'
feats.ancestry.grovel.description: '1 action (auditory, concentrate, emotion, mental): Feint a creature within 30 feet (not just in reach), against its Will DC instead of its Perception DC.'
feats.ancestry.grovel.prerequisites.trained: 'Trained in Deception'
feats.ancestry.snare-genius.name: 'Snare Genius'
feats.ancestry.snare-genius.description: "1-minute snares take you 3 Interact actions; each day you prepare three snares for free (four if you're a master in Crafting, five if legendary); a creature that critically fails its save against a snare of yours and takes its damage is off-guard until the end of its next turn."
feats.ancestry.snare-genius.prerequisites.snare-crafting: 'Snare Crafting'
feats.ancestry.snare-genius.prerequisites.expert: 'Expert in Crafting'
feats.ancestry.winglets.name: 'Winglets'
feats.ancestry.winglets.description: "Leaping horizontally you go 5 feet farther (not with Powerful Leap), a Long Jump goes up to 10 feet farther (never past your Speed), and High and Long Jumps don't need a 10-foot Stride first."
templates.between-the-scales.name: '{base}'
feats.ancestry.between-the-scales.name: 'Between the Scales'
feats.ancestry.between-the-scales.description: 'Your agile, finesse melee weapons and unarmed attacks have the backstabber trait against off-guard creatures.'
feats.ancestry.briar-battler.name: 'Briar Battler'
feats.ancestry.briar-battler.description: "In difficult terrain from an environmental feature, you can Take Cover even if it's too small to give cover."
feats.ancestry.close-quarters.name: 'Close Quarters'
feats.ancestry.close-quarters.description: "If you're Small or smaller, you can end your move in the space of a Small or smaller ally (no more than two creatures to a space)."
feats.ancestry.evolved-spellhorn.name: 'Evolved Spellhorn'
feats.ancestry.evolved-spellhorn.description: 'Pick a common 1st-rank and a common 2nd-rank arcane spell: you can cast each once a day as an arcane innate spell.'
feats.ancestry.evolved-spellhorn.prerequisites.spellhorn: 'Spellhorn kobold heritage'
feats.ancestry.evolved-spellhorn.choices.rank1.prompt: '1st-rank arcane spell (innate)'
feats.ancestry.evolved-spellhorn.choices.rank2.prompt: '2nd-rank arcane spell (innate)'
feats.ancestry.fleeing-shriek.name: 'Fleeing Shriek'
feats.ancestry.fleeing-shriek.description: 'Once an hour, 2 actions (auditory, sonic): 5d6 sonic damage to each creature in a 10-foot emanation (basic Fortitude save against your class DC or spell DC, whichever is higher; 1d6 more at 11th level and every 2 levels after), then Stride without triggering reactions from those that failed.'
feats.ancestry.winglet-flight.name: 'Winglet Flight'
feats.ancestry.winglet-flight.description: "Once a round, 1 action: Fly (with a fly Speed of 20 feet for this move if you have none); you fall if you don't end on solid ground."
feats.ancestry.winglet-flight.prerequisites.winglets: 'Winglets'
feats.ancestry.resplendent-spellhorn.name: 'Resplendent Spellhorn'
feats.ancestry.resplendent-spellhorn.description: 'Pick a common 3rd-rank and a common 4th-rank arcane spell: you can cast each once a day as an arcane innate spell.'
feats.ancestry.resplendent-spellhorn.prerequisites.evolved-spellhorn: 'Evolved Spellhorn'
feats.ancestry.resplendent-spellhorn.choices.rank3.prompt: '3rd-rank arcane spell (innate)'
feats.ancestry.resplendent-spellhorn.choices.rank4.prompt: '4th-rank arcane spell (innate)'
feats.ancestry.tumbling-diversion.name: 'Tumbling Diversion'
feats.ancestry.tumbling-diversion.description: "1 action: Tumble Through a foe's space; on a success, ending away from it, Create a Diversion against it with +1 circumstance (+2 after a critical success); on a success you're hidden from it alone."
feats.ancestry.tumbling-diversion.prerequisites.expert-acrobatics: 'Expert in Acrobatics'
feats.ancestry.tumbling-diversion.prerequisites.expert-deception: 'Expert in Deception'
feats.ancestry.vicious-snares.name: 'Vicious Snares'
feats.ancestry.vicious-snares.description: "Damaging snares you craft deal 1d6 more precision damage (2d6 if you're legendary in Crafting)."
feats.ancestry.vicious-snares.prerequisites.snare-crafting: 'Snare Crafting'
feats.ancestry.vicious-snares.prerequisites.expert: 'Expert in Crafting'
feats.ancestry.benefactors-majesty.name: "Benefactor's Majesty"
feats.ancestry.benefactors-majesty.description: 'Once a day, 1 action: temporary Hit Points equal to your level for 1 minute, a flat check to end each type of persistent damage on you, and until the start of your next turn whoever targets you with something harmful must first succeed at a DC 11 flat check.'
feats.ancestry.benefactors-majesty.actions.benefactors-majesty.name: "Benefactor's Majesty"
