# Player Core 2's duskwalker: its ancestry or heritage, heritages and feats, in text written for the
# pack.
heritages.duskwalker.name: 'Duskwalker'
heritages.duskwalker.description: 'Reborn from a soul tied to the psychopomps. You gain the duskwalker trait, and low-light vision, or darkvision if your ancestry has low-light vision. Neither your body nor your spirit can ever become undead. You can take duskwalker feats as ancestry feats.'
feats.ancestry.chance-death.name: 'Chance Death'
feats.ancestry.chance-death.description: "Once a day, a reaction (fortune) when you'd die from a failed recovery check or save: reroll it and take the new result. 1st level only."
feats.ancestry.deliberate-death.name: 'Deliberate Death'
feats.ancestry.deliberate-death.description: 'Once a day, a reaction when another creature in your melee reach would make you dying: Strike it before you fall unconscious. 1st level only.'
feats.ancestry.duskwalker-lore.name: 'Duskwalker Lore'
feats.ancestry.duskwalker-lore.description: "You're trained in Medicine and Religion (a skill of your choice for each you'd already be trained in), and gain Additional Lore for Afterlife Lore (the realm of the dead's)."
feats.ancestry.duskwalker-weapon-familiarity.name: 'Duskwalker Weapon Familiarity'
feats.ancestry.duskwalker-weapon-familiarity.description: 'You have familiarity with the bo staff, longbow, composite longbow, scythe and staff: martial ones count as simple and advanced ones as martial for you. From 5th level, their critical specialization effects.'
feats.ancestry.ghost-hunter.name: 'Ghost Hunter'
feats.ancestry.ghost-hunter.description: "Your weapon and unarmed Strikes against incorporeal creatures are magical; already magical, they gain the ghost touch rune's effects."
feats.ancestry.gravesight.name: 'Gravesight'
feats.ancestry.gravesight.description: "You gain darkvision. 1st level only; it can't be retrained."
feats.ancestry.lifesense.name: 'Lifesense'
feats.ancestry.lifesense.description: 'You gain lifesense as an imprecise sense, 10 feet: you sense the vitality of living creatures and the void energy of undead, and tell them apart.'
feats.ancestry.spirit-soother.name: 'Spirit Soother'
feats.ancestry.spirit-soother.description: 'You can find haunts that need Searching without Searching, and get a +1 circumstance bonus to checks to disable haunts.'
feats.ancestry.ward-against-corruption.name: 'Ward Against Corruption'
feats.ancestry.ward-against-corruption.description: "A +1 circumstance bonus to saves against death effects, diseases and effects of undead or corrupted psychopomps; +2 against an undead's death effect or disease."
feats.ancestry.duskwalker-magic.name: 'Duskwalker Magic'
feats.ancestry.duskwalker-magic.description: 'You can cast augury and peaceful rest once a day each as 2nd-rank divine innate spells.'
feats.ancestry.quietus-strikes.name: 'Quietus Strikes'
feats.ancestry.quietus-strikes.description: 'Your weapon and unarmed Strikes are magical and deal 1 extra void damage to living creatures and 1 extra vitality damage to undead (2 with a +3 weapon potency rune).'
feats.ancestry.resist-ruin.name: 'Resist Ruin'
feats.ancestry.resist-ruin.description: 'You gain void resistance 5, and can cast false vitality once a day as a 5th-rank divine innate spell.'
feats.ancestry.call-of-the-afterlife.name: 'Call of the Afterlife'
feats.ancestry.call-of-the-afterlife.description: 'You can cast interplanar teleport as a divine innate spell twice a week, only to or from the realm of the dead, needing no planar key.'
