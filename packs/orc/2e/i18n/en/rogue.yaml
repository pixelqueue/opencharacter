classes.rogue.agile-mind.description: 'Your Will proficiency becomes master. A success on a Will save is a critical success.'
classes.rogue.agile-mind.name: 'Agile Mind'
classes.rogue.choices.class-feat.prompt: 'Rogue feat (level {slot})'
classes.rogue.choices.key-attribute.options.cha.name: 'Charisma (scoundrel)'
classes.rogue.choices.key-attribute.options.cha.prerequisites.racket: 'Scoundrel racket'
classes.rogue.choices.key-attribute.options.dex.name: 'Dexterity'
classes.rogue.choices.key-attribute.options.int.name: 'Intelligence (mastermind)'
classes.rogue.choices.key-attribute.options.int.prerequisites.racket: 'Mastermind racket'
classes.rogue.choices.key-attribute.options.str.name: 'Strength (ruffian)'
classes.rogue.choices.key-attribute.options.str.prerequisites.racket: 'Ruffian racket'
classes.rogue.choices.key-attribute.prompt: 'Key attribute'
classes.rogue.choices.racket.prompt: "Rogue's racket"
classes.rogue.choices.skill-feat.prompt: 'Skill feat (level {slot})'
classes.rogue.choices.skills.prompt: 'Trained skills (7 plus Intelligence)'
classes.rogue.debilitating-strike.actions.debilitate.name: 'Debilitating Strike'
classes.rogue.debilitating-strike.actions.debilitate.options.enfeebled.name: 'Enfeebled 1'
classes.rogue.debilitating-strike.actions.debilitate.options.speed.name: '–10-foot status penalty to Speed'
classes.rogue.debilitating-strike.actions.debilitate.results.debilitated.name: 'Debilitated'
classes.rogue.debilitating-strike.actions.debilitate.steps.first.prompt: 'Choose a debilitation'
classes.rogue.debilitating-strike.actions.debilitate.steps.second.prompt: 'Choose a second debilitation'
classes.rogue.debilitating-strike.description: 'Free action. Trigger: your Strike hits an off-guard creature and deals damage. Until the end of your next turn, the target takes a –10-foot status penalty to its Speeds, or is enfeebled 1. A new debilitation ends any earlier one.'
classes.rogue.debilitating-strike.name: 'Debilitating Strike'
classes.rogue.debilitations.speed.description: "A –10-foot status penalty to all Speeds, until the end of the rogue's next turn."
classes.rogue.debilitations.speed.name: 'Debilitated: slowed movement'
classes.rogue.deny-advantage.description: "You aren't off-guard to hidden, undetected or flanking creatures of your level or lower, or to such creatures' surprise attacks. They can still help their allies flank."
classes.rogue.deny-advantage.name: 'Deny Advantage'
classes.rogue.description: "A skilled opportunist who strikes where foes are unguarded. Key attribute: Dexterity or the racket's. 8 Hit Points plus Constitution per level. Expert in Perception, Reflex and Will; trained in Fortitude, simple and martial weapons, unarmed attacks, light armor, unarmored defense and the rogue class DC. Trained in Stealth, the racket's skills and 7 more skills plus Intelligence. A skill feat every level and a skill increase every level from 2nd."
classes.rogue.double-debilitation.description: 'Debilitating Strike applies two debilitations at once; removing one removes both.'
classes.rogue.double-debilitation.name: 'Double Debilitation'
classes.rogue.evasive-reflexes.description: 'Your Reflex proficiency becomes master. A success on a Reflex save is a critical success.'
classes.rogue.evasive-reflexes.name: 'Evasive Reflexes'
classes.rogue.greater-rogue-reflexes.description: 'Your Reflex proficiency becomes legendary. A critical failure on a Reflex save is a failure, and a failed Reflex save against a damaging effect deals half damage.'
classes.rogue.greater-rogue-reflexes.name: 'Greater Rogue Reflexes'
classes.rogue.greater-weapon-specialization.description: 'Weapon specialization damage becomes 4 at expert, 6 at master and 8 at legendary.'
classes.rogue.greater-weapon-specialization.name: 'Greater Weapon Specialization'
classes.rogue.light-armor-expertise.description: 'Expert in light armor and unarmored defense.'
classes.rogue.light-armor-expertise.name: 'Light Armor Expertise'
classes.rogue.light-armor-mastery.description: 'Master in light armor and unarmored defense.'
classes.rogue.light-armor-mastery.name: 'Light Armor Mastery'
classes.rogue.master-strike.description: 'Your rogue class DC proficiency becomes master. Free action (incapacitation). Trigger: your Strike hits an off-guard creature and deals damage. The target attempts a Fortitude save against your class DC and is then immune for 1 day. Critical success: no effect. Success: enfeebled 2 until the end of your next turn. Failure: paralyzed for 4 rounds. Critical failure: your choice of paralyzed for 4 rounds, unconscious for 2 hours, or killed.'
classes.rogue.master-strike.name: 'Master Strike'
classes.rogue.master-tricks.description: 'Master in simple and martial weapons and unarmed attacks.'
classes.rogue.master-tricks.name: 'Master Tricks'
classes.rogue.name: 'Rogue'
classes.rogue.perception-legend.description: 'Your Perception proficiency becomes legendary.'
classes.rogue.perception-legend.name: 'Perception Legend'
classes.rogue.perception-mastery.description: 'Your Perception proficiency becomes master.'
classes.rogue.perception-mastery.name: 'Perception Mastery'
classes.rogue.rackets.mastermind.choices.skill.prompt: 'Trained skill (mastermind)'
classes.rogue.rackets.mastermind.description: 'Trained in Society and one of Arcana, Nature, Occultism or Religion; Intelligence may be your key attribute. When you succeed at Recall Knowledge to identify a creature, it is off-guard to your attacks until the start of your next turn (for 1 minute on a critical success).'
classes.rogue.rackets.mastermind.name: 'Mastermind'
classes.rogue.rackets.ruffian.description: 'Trained in Intimidation and medium armor (expert and master in it when you gain Light Armor Expertise and Mastery); Strength may be your key attribute. You can deal sneak attack damage with any weapon except a simple weapon with a damage die larger than d8 or a martial or advanced weapon with a die larger than d6. A critical hit with such a weapon against an off-guard creature applies its critical specialization effect.'
classes.rogue.rackets.ruffian.name: 'Ruffian'
classes.rogue.rackets.scoundrel.description: 'Trained in Deception and Diplomacy; Charisma may be your key attribute. When you Feint successfully, the target is off-guard to your melee attacks until the end of your next turn (to all melee attacks on a critical success). Feinting with an agile or finesse melee weapon lets you Step as a free action right after.'
classes.rogue.rackets.scoundrel.name: 'Scoundrel'
classes.rogue.rackets.thief.description: 'Trained in Thievery. When you Strike with a finesse melee weapon or finesse melee unarmed attack, you can add your Dexterity modifier to damage instead of your Strength modifier.'
classes.rogue.rackets.thief.name: 'Thief'
classes.rogue.rogue-expertise.description: 'Your rogue class DC proficiency becomes expert.'
classes.rogue.rogue-expertise.name: 'Rogue Expertise'
classes.rogue.rogue-resilience.description: 'Your Fortitude proficiency becomes expert. A success on a Fortitude save is a critical success.'
classes.rogue.rogue-resilience.name: 'Rogue Resilience'
classes.rogue.sneak-attack.description: 'When you Strike an off-guard creature with an agile or finesse melee weapon, an agile or finesse unarmed attack, or a ranged weapon attack, you deal 1d6 extra precision damage. A thrown melee weapon must be agile or finesse. The dice rise to 2d6 at 5th level, 3d6 at 11th and 4d6 at 17th.'
classes.rogue.sneak-attack.name: 'Sneak Attack'
classes.rogue.surprise-attack.description: "On the first round of combat, if you rolled Deception or Stealth for initiative, creatures that haven't acted yet are off-guard to you."
classes.rogue.surprise-attack.name: 'Surprise Attack'
classes.rogue.weapon-specialization.description: '2 extra damage with weapons and unarmed attacks you are expert in, 3 at master and 4 at legendary.'
classes.rogue.weapon-specialization.name: 'Weapon Specialization'
classes.rogue.weapon-tricks.description: 'Expert in simple and martial weapons and unarmed attacks. A critical success against an off-guard creature with an agile or finesse weapon or unarmed attack applies its critical specialization effect.'
classes.rogue.weapon-tricks.name: 'Weapon Tricks'
feats.rogue.analyze-weakness.description: 'Requirement: you have identified the creature with Recall Knowledge, and your sneak attack is 2d6. Your next sneak attack against it before the end of your turn deals 2d6 more precision damage (3d6 at 11th level, 4d6 at 17th).'
feats.rogue.analyze-weakness.prerequisites.sneak-attack: 'Sneak attack 2d6'
feats.rogue.analyze-weakness.name: 'Analyze Weakness'
feats.rogue.anticipate-ambush.description: 'Exploration, at half your travel Speed. If an encounter starts while you are doing it, you roll Perception for initiative, and enemies rolling Stealth for initiative take a –2 circumstance penalty.'
feats.rogue.anticipate-ambush.prerequisites.stealth: 'Expert in Stealth'
feats.rogue.anticipate-ambush.name: 'Anticipate Ambush'
feats.rogue.brutal-beating.description: 'Ruffian. When your Strike is a critical hit and deals damage, the target is frightened 1.'
feats.rogue.brutal-beating.name: 'Brutal Beating'
feats.rogue.brutal-beating.prerequisites.racket: 'Ruffian racket'
feats.rogue.clever-gambit.description: "Mastermind. Reaction. Trigger: your Strike critically hits and deals damage to a creature you have identified with Recall Knowledge. Step or Stride; the movement doesn't trigger that creature's reactions."
feats.rogue.clever-gambit.name: 'Clever Gambit'
feats.rogue.clever-gambit.prerequisites.racket: 'Mastermind racket'
feats.rogue.distracting-feint.description: 'Scoundrel. While a creature is off-guard from your Feint, it also takes a –2 circumstance penalty to Perception checks and Reflex saves.'
feats.rogue.distracting-feint.name: 'Distracting Feint'
feats.rogue.distracting-feint.prerequisites.racket: 'Scoundrel racket'
feats.rogue.dread-striker.description: 'Frightened creatures are off-guard to you.'
feats.rogue.dread-striker.name: 'Dread Striker'
feats.rogue.far-throw.description: 'Your thrown weapons take a –1 penalty per additional range increment, not –2.'
feats.rogue.far-throw.name: 'Far Throw'
feats.rogue.gang-up.description: 'You flank any enemy within reach of both you and an ally, without being on opposite sides. It helps your allies only when they flank with you.'
feats.rogue.gang-up.name: 'Gang Up'
feats.rogue.head-stomp.actions.head-stomp.name: 'Head Stomp'
feats.rogue.head-stomp.actions.head-stomp.steps.weapon.prompt: 'Choose an unarmed attack'
feats.rogue.head-stomp.description: 'Make an unarmed melee Strike against a prone target. On a hit, it is stupefied 1 (stupefied 2 on a critical hit) and off-guard until the end of your next turn.'
feats.rogue.head-stomp.name: 'Head Stomp'
feats.rogue.light-step.description: 'You ignore difficult terrain when you Stride or Step.'
feats.rogue.light-step.name: 'Light Step'
feats.rogue.mobility.description: "When you Stride half your Speed or less, the movement doesn't trigger reactions (or Climb, Fly or Swim, with that Speed)."
feats.rogue.mobility.name: 'Mobility'
feats.rogue.mug.actions.mug.name: 'Mug'
feats.rogue.mug.actions.mug.steps.weapon.prompt: 'Choose a melee weapon'
feats.rogue.mug.description: 'Two actions. Make a melee Strike against an adjacent enemy. If it hits and deals sneak attack damage, you can also Steal from it, even in combat.'
feats.rogue.mug.name: 'Mug'
feats.rogue.nimble-dodge.actions.nimble-dodge.name: 'Nimble Dodge'
feats.rogue.nimble-dodge.description: "Reaction. Trigger: a creature targets you with an attack and you can see the attacker. Requirement: you aren't encumbered. You gain a +2 circumstance bonus to AC against the triggering attack."
feats.rogue.nimble-dodge.name: 'Nimble Dodge'
feats.rogue.overextending-feint.description: 'When you succeed at a Feint, you can give the target a –2 circumstance penalty to its next attack roll against you before the end of its next turn instead (to all its attack rolls against you on a critical success).'
feats.rogue.overextending-feint.prerequisites.deception: 'Trained in Deception'
feats.rogue.overextending-feint.name: 'Overextending Feint'
feats.rogue.plant-evidence.description: 'Put an item of light or negligible Bulk you hold on a person, with a Thievery check against their Perception DC. A ruffian may do it as a free action after Shoving the target.'
feats.rogue.plant-evidence.prerequisites.pickpocket: 'Pickpocket'
feats.rogue.plant-evidence.name: 'Plant Evidence'
feats.rogue.poison-weapon.description: 'Requirement: you wield a weapon. Apply a contact or injury poison to it, drawing it as part of the action if you have a free hand. Each day you prepare a number of simple injury poisons equal to your level, dealing 1d4 poison damage, which only you can apply.'
feats.rogue.poison-weapon.name: 'Poison Weapon'
feats.rogue.predictable.description: "Sense Motive against the higher of a foe's Deception DC or a hard DC of its level. Critical success: a +2 circumstance bonus to AC against it until the start of your next turn and to your next save against it before then. Success: +1. Critical failure: –1 to both."
feats.rogue.predictable.name: 'Predictable!'
feats.rogue.reactive-pursuit.description: "Reaction. Trigger: an adjacent foe moves away, and you can reach a space adjacent to it with a Stride. Stride, ending adjacent to it; this doesn't trigger its reactions."
feats.rogue.reactive-pursuit.name: 'Reactive Pursuit'
feats.rogue.sabotage.description: 'Incapacitation. Requirement: a free hand. Damage an item with moving parts a creature within reach wields or carries: a Thievery check against its Reflex DC. Critical success: damage equal to four times your Thievery proficiency bonus. Success: twice it. Critical failure: it is immune to your Sabotage for a day.'
feats.rogue.sabotage.name: 'Sabotage'
feats.rogue.scoundrels-surprise.description: 'After you Impersonate using a disguise kit, drop the disguise. Creatures that failed to see through it are off-guard to your next attack before the end of your turn.'
feats.rogue.scoundrels-surprise.name: "Scoundrel's Surprise"
feats.rogue.shove-down.description: 'Free action. Requirement: your last action was a successful Shove. Trip the target, even if it is no longer in reach.'
feats.rogue.shove-down.prerequisites.athletics: 'Trained in Athletics'
feats.rogue.shove-down.name: 'Shove Down'
feats.rogue.sly-disarm.description: 'You can Disarm with Thievery instead of Athletics. On a success with Thievery, the target is off-guard to your next attack before the end of your turn.'
feats.rogue.sly-disarm.name: 'Sly Disarm'
feats.rogue.strong-arm.description: "Your thrown weapons' range increment is 10 feet longer."
feats.rogue.strong-arm.name: 'Strong Arm'
feats.rogue.the-harder-they-fall.description: 'When you successfully Trip an off-guard foe, it takes 1d6 bludgeoning damage; on a critical success, add your sneak attack damage.'
feats.rogue.the-harder-they-fall.name: 'The Harder They Fall'
feats.rogue.trap-finder.description: 'A +1 circumstance bonus to Perception checks to find traps, to AC against attacks made by traps and to saves against traps (+2 when you are master in Thievery). You find traps even when not Searching, and can disable traps that need master Thievery (legendary, at master).'
feats.rogue.trap-finder.name: 'Trap Finder'
feats.rogue.tumble-behind.description: "When you Tumble Through a foe's space, it is off-guard to the next attack you make before the end of your turn."
feats.rogue.tumble-behind.name: 'Tumble Behind'
feats.rogue.twin-distraction.description: 'Requirement: a melee weapon in each hand. When both Strikes of your Twin Feint deal damage, the target attempts a Will save against your class DC or is stupefied 1 until the end of your next turn.'
feats.rogue.twin-distraction.name: 'Twin Distraction'
feats.rogue.twin-distraction.prerequisites.twin-feint: 'Twin Feint'
feats.rogue.twin-feint.actions.twin-feint.name: 'Twin Feint'
feats.rogue.twin-feint.actions.twin-feint.steps.first.prompt: 'First Strike: choose a melee weapon'
feats.rogue.twin-feint.actions.twin-feint.steps.second.prompt: 'Second Strike: choose your other melee weapon'
feats.rogue.twin-feint.description: 'Two actions. Requirement: a melee weapon in each hand. Strike the same target with each weapon. The target is off-guard to the second Strike. Both count toward your multiple attack penalty.'
feats.rogue.twin-feint.name: 'Twin Feint'
feats.rogue.twist-the-knife.actions.twist-the-knife.name: 'Twist the Knife'
feats.rogue.twist-the-knife.actions.twist-the-knife.results.bleeding.name: 'Bleeding'
feats.rogue.twist-the-knife.description: 'Requirement: your last action was a melee Strike that dealt sneak attack damage to an off-guard target. The target takes persistent bleed damage equal to your number of sneak attack dice.'
feats.rogue.twist-the-knife.name: 'Twist the Knife'
feats.rogue.unbalancing-blow.description: 'Thief. When your Strike is a critical hit and deals damage, the target is off-guard to your attacks until the end of your next turn.'
feats.rogue.unbalancing-blow.name: 'Unbalancing Blow'
feats.rogue.unbalancing-blow.prerequisites.racket: 'Thief racket'
feats.rogue.underhanded-assault.actions.underhanded-assault.name: 'Underhanded Assault'
feats.rogue.underhanded-assault.actions.underhanded-assault.steps.weapon.prompt: 'Choose a melee weapon'
feats.rogue.underhanded-assault.description: 'Two actions. Sneak up to a foe adjacent to one of your allies, rolling against it as if hidden, with a –2 penalty to the Stealth check. If the check succeeds, make a melee Strike against that foe at the end of the Sneak.'
feats.rogue.underhanded-assault.prerequisites.stealth: 'Trained in Stealth'
feats.rogue.underhanded-assault.name: 'Underhanded Assault'
feats.rogue.watch-your-back.description: 'An Intimidation check against the Will DC of a creature within 30 feet. On a success, for 1 minute it gains a +2 status bonus to Perception checks against you and takes a –2 status penalty to Will saves against fear.'
feats.rogue.watch-your-back.prerequisites.intimidation: 'Trained in Intimidation'
feats.rogue.watch-your-back.name: 'Watch Your Back'
feats.rogue.youre-next.description: 'Reaction. Trigger: you reduce an enemy to 0 Hit Points. Demoralize a creature within 60 feet with a +2 circumstance bonus. At legendary Intimidation, it is a free action.'
feats.rogue.youre-next.prerequisites.intimidation: 'Trained in Intimidation'
feats.rogue.youre-next.name: "You're Next"
fields.nimbleDodge.active.name: 'Nimble Dodge'
fields.sneakAttack.dice.name: 'Sneak attack dice'
situational.againstTrap.name: 'Against a trap (Trap Finder)'
tags.precision.name: 'Precision'
