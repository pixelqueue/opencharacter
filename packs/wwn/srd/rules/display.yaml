display:
  groups:
    - id: summary
      priority: 0
      visibility: primary
    - id: attributes
      priority: 0
    - id: saves
      priority: 0
      members: { type: field, where: "'save' in item.tags" }
    - id: combat
      priority: 0
    - id: condition
      priority: 0
    - id: skills
      priority: 1
      members: { type: field, where: "'skill' in item.tags" }
    - id: magic
      priority: 1
      showWhen: class.mage > 0 || spells.mode != 'none' || effort.mageslayer.max > 0
        || effort.bard.max > 0 || tradition.wise.tier > 0
    - id: advancement
      priority: 2
    - id: record
      priority: 2
    - id: encumbrance
      priority: 2
    # Actions
    - id: checks
      kind: actions
      priority: 0
      members: { type: action, where: "'check' in item.tags || 'save' in item.tags" }
    - id: attacks
      kind: actions
      priority: 0
      members: { type: action, where: "'attack' in item.tags || 'combat' in item.tags" }
    - id: magic-actions
      kind: actions
      priority: 1
      members: { type: action, where: "'spell' in item.tags || 'art' in item.tags" }
    - id: health-actions
      kind: actions
      priority: 1
      members: { type: action, where: "'health' in item.tags || 'rest' in item.tags" }
    - id: advancement-actions
      kind: actions
      priority: 2
      members: { type: action, where: "'advancement' in item.tags" }
    - id: creation
      kind: actions
      priority: 3
      visibility: background
      members: { type: action, where: "'creation' in item.tags" }
    # Content
    - id: class
      kind: content
      priority: 0
      members: { type: class }
    - id: partials
      kind: content
      priority: 0
      showWhen: hasChoice('partial')
      members: { type: partial }
    - id: background
      kind: content
      priority: 0
      members: { type: background }
    - id: foci
      kind: content
      priority: 1
      members: { type: focus }
    - id: arts
      kind: content
      priority: 1
      members: { type: art }
    - id: spells
      kind: content
      priority: 1
      showWhen: spells.mode != 'none'
      members: { type: spell }
      sectionBy: item.level
    - id: weapons
      kind: content
      priority: 1
      members: { type: weapon }
    - id: armor
      kind: content
      priority: 1
      members: { type: armor }
    - id: gear
      kind: content
      priority: 2
      members: { type: gear }

  fields:
    level: { groups: [summary], priority: 0, visibility: primary }
    hp.current:
      groups: [summary, condition]
      priority: 1
      visibility: primary
      with: [{ field: hp.max, as: max }]
    hp.max: { groups: [condition], priority: 2 }
    hp.rolled: { groups: [condition], priority: 3, visibility: background }
    ac.value: { groups: [summary, combat], priority: 2, visibility: primary }
    attack.base: { groups: [combat], priority: 0, format: signed }
    attack.punchBase: { hidden: true }
    attack.favoredBase: { hidden: true }
    hp.dieBonus: { hidden: true }
    damage.killingBlow: { groups: [combat], priority: 3, showWhen: damage.killingBlow > 0 }
    ac.innate: { hidden: true }
    ac.base: { hidden: true }
    ac.withShield: { hidden: true }
    ac.cappedBonus: { hidden: true }
    armor.wornAc: { hidden: true }
    armor.wornEnc: { hidden: true }
    armor.wornHeavy: { hidden: true }
    armor.shield: { hidden: true }
    armor.shieldAc: { hidden: true }
    shock.bonus: { hidden: true }
    shock.ignoresAc: { hidden: true }
    shock.unarmedIgnoresAc: { hidden: true }
    unarmed.die: { groups: [combat], priority: 4, format: dice }
    unarmed.shock: { hidden: true }
    unarmed.shockAc: { hidden: true }
    duelist.favored: { hidden: true }
    strain.current:
      groups: [condition]
      priority: 4
      with: [{ field: strain.max, as: max }]
    strain.max: { groups: [condition], priority: 5 }
    conditions.frail: { groups: [condition], priority: 6, input: { widget: checkbox } }
    conditions.mortallyWounded: { groups: [condition], priority: 7, input: { widget: checkbox } }
    class.warrior: { hidden: true }
    class.expert: { hidden: true }
    class.mage: { hidden: true }
    chassis.attackFull: { hidden: true }
    chassis.attackWarrior: { hidden: true }
    chassis.attackExpert: { hidden: true }
    chassis.hitsWarrior: { hidden: true }
    chassis.hitsExpert: { hidden: true }
    chassis.fragile: { hidden: true }
    foci.allowed: { groups: [advancement], priority: 3, visibility: background }
    foci.taken: { hidden: true }
    companion.hitDice: { groups: [record], priority: 5, showWhen: tradition.beastmaster.tier > 0 }
    xp.current:
      groups: [advancement]
      priority: 0
      with: [{ field: xp.nextLevel, as: max }]
    xp.nextLevel: { groups: [advancement], priority: 1, showWhen: xp.nextLevel > 0 }
    xp.pace: { groups: [advancement], priority: 2, visibility: background }
    xp.levelUp: { hidden: true }
    skillPoints.unspent: { groups: [advancement], priority: 4 }
    skillPoints.expert: { groups: [advancement], priority: 5, showWhen: class.expert > 0 }
    attributes.boosts: { groups: [advancement], priority: 6, visibility: background }
    attributes.bestMod: { hidden: true }
    skills.noncombatFloor: { hidden: true }
    coins.gold: { groups: [record], priority: 0 }
    coins.silver: { groups: [record], priority: 1 }
    coins.copper: { groups: [record], priority: 2 }
    enc.readied:
      groups: [encumbrance]
      priority: 0
      with: [{ field: enc.readiedLimit, as: max }]
    enc.stowed:
      groups: [encumbrance]
      priority: 1
      with: [{ field: enc.stowedLimit, as: max }]
    enc.readiedLimit: { groups: [encumbrance], priority: 2, visibility: background }
    enc.stowedLimit: { groups: [encumbrance], priority: 3, visibility: background }
    enc.over: { hidden: true }
    move.feet: { groups: [combat], priority: 5, unit: ft }
    spells.mode: { hidden: true }
    spells.maxLevel: { groups: [magic], priority: 0, showWhen: spells.maxLevel > 0 }
    spells.castsUsed:
      groups: [magic]
      priority: 1
      showWhen: spells.castsPerDay > 0
      with: [{ field: spells.castsPerDay, as: max }]
    spells.castsPerDay:
      { groups: [magic], priority: 10, visibility: background, showWhen: spells.castsPerDay > 0 }
    spells.castsLeft: { hidden: true }
    spells.pointsUsed:
      groups: [magic]
      priority: 1
      showWhen: spells.points > 0
      with: [{ field: spells.points, as: max }]
    spells.points:
      { groups: [magic], priority: 10, visibility: background, showWhen: spells.points > 0 }
    spells.pointsLeft: { hidden: true }
    spells.prepared:
      groups: [magic]
      priority: 2
      showWhen: spells.preparedMax > 0
      with: [{ field: spells.preparedMax, as: max }]
    spells.preparedMax:
      { groups: [magic], priority: 10, visibility: background, showWhen: spells.preparedMax > 0 }
    spells.starting: { hidden: true }
    invoker.education: { hidden: true }
    vowed.skill: { hidden: true }
    wise.skill: { hidden: true }
