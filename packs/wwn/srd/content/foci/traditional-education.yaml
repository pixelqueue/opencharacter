id: foci.traditional-education
type: focus
tags: [noncombat]
fields:
  maxLevel: 1
  requires: invoker
prerequisites:
  - { id: invoker, when: tradition.invoker.tier > 0 }
choices:
  # The specialist tradition whose spells and first-level arts the Invoker gains.
  - id: tradition
    from: { values: { formula: "keysOf('spellTrad')" } }
    recommend: "'elementalist'"
    effects:
      - { target: invoker.education, op: set, value: pick.value }
# An Elementalist education brings that tradition's two training arts too.
grants:
  - item: arts.elementalist.elemental-resilience
    when: "'elementalist' in picksOf('tradition')"
  - item: arts.elementalist.elemental-sparks
    when: "'elementalist' in picksOf('tradition')"
