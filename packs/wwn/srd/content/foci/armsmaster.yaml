id: foci.armsmaster
type: focus
tags: [combat]
fields:
  bonusSkill: stab
effects:
  # Stab added to melee and thrown damage and Shock (not with Deadeye's on thrown weapons).
  - { target: damage.melee.bonus, op: add, value: 'max(0, skills.stab)', stackKey: skill-damage }
  - { target: damage.thrown.bonus, op: add, value: 'max(0, skills.stab)', stackKey: skill-damage }
  - { target: shock.melee.bonus, op: add, value: 'max(0, skills.stab)', stackKey: skill-damage }
  - { target: attack.melee.bonus, op: add, value: 1, when: self.level >= 2 }
  - { target: attack.thrown.bonus, op: add, value: 1, when: self.level >= 2 }
  - { target: shock.ignoresAc, op: set, value: true, when: self.level >= 2 }
