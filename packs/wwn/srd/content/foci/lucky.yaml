id: foci.lucky
type: focus
tags: [combat, noncombat]
fields:
  requires: low-attribute
prerequisites:
  - id: low-attribute
    # A score that gives -1 or less, whatever later bonuses (Xenoblooded) do to the modifier.
    when: >-
      min(attributes.str.score, attributes.dex.score, attributes.con.score, attributes.int.score,
        attributes.wis.score, attributes.cha.score) <= 7
