id: edges.prodigy
type: edge
prerequisites:
  - { id: not-underdog, when: '!edges.underdog' }
choices:
  - id: attribute
    from: { values: [str, dex, int, wis, cha] }
    recommend: >-
      sortList(['str', 'dex', 'int', 'wis', 'cha'],
        -fieldOf('attributes.{attribute}.score', x))[0]
    effects:
      - target:
          { fields: { where: "item.id == 'wn-apocalypse:attributes.' + pick.value + '.score'" } }
        op: atLeast
        value: 18
      - target:
          { fields: { where: "item.id == 'wn-apocalypse:attributes.' + pick.value + '.base'" } }
        op: atLeast
        value: 3
