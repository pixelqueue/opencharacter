id: negative-mutations.deficient-polycephaly
type: negative
fields:
  roll: 21
choices:
  - id: attribute
    from: { values: [int, wis] }
    recommend: "sortList(['int', 'wis'], fieldOf('attributes.{attribute}.score', x))[0]"
    effects:
      - target:
          { fields: { where: "item.id == 'wn-apocalypse:attributes.' + pick.value + '.penalty'" } }
        op: add
        value: -1
        when: '!self.light'
