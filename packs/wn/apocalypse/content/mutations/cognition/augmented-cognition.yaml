id: mutations.cognition.augmented-cognition
type: mutation
fields:
  category: cognition
  roll: 1
choices:
  - id: attribute
    from: { values: [int, wis, cha] }
    recommend: "sortList(['int', 'wis', 'cha'], -fieldOf('attributes.{attribute}.score', x))[0]"
    effects:
      - target:
          { fields: { where: "item.id == 'wn-apocalypse:attributes.' + pick.value + '.boost'" } }
        op: add
        value: 1
