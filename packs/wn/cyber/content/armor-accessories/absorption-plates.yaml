id: armor-accessories.absorption-plates
type: template
appliesTo:
  type: armor
  where: "item.kind == 'clothing'"
fields:
  rangedAc: 'prior.rangedAc + 2'
  meleeAc: 'prior.meleeAc + 2'
  soak: 'prior.soak + 3'
  enc: 'prior.enc + 1'
  heavy: 'prior.heavy + 1'
  obvious: true
  cost: 'prior.cost + 500'
