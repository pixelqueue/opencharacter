id: skillplugs.level-0
type: skillplug
fields:
  cost: 1000
  plugLevel: 0
choices:
  - id: skill
    from:
      values:
        - administer
        - connect
        - drive
        - exert
        - fix
        - heal
        - know
        - lead
        - notice
        - perform
        - program
        - punch
        - shoot
        - sneak
        - stab
        - survive
        - talk
        - trade
        - work
    effects:
      - target:
          fields:
            where: "'skill' in item.tags && ('skill.' + pick.value) in item.tags"
        op: atLeast
        value: 0
        when: "self.equipped && cyber.plugJack >= (pick.value in ['drive', 'exert', 'perform', 'punch', 'shoot', 'sneak', 'stab'] ? 2 : 1)"
