cyberdeck-mods.bespoke-code-optimization.name: '{base} (bespoke code optimization)'
cyberdeck-mods.bespoke-code-optimization.description: |-
  Pick one Verb and one Subject when installing this mod; those utilities occupy no Memory and one instance of that Verb-Subject program doesn’t count against its CPU burden. Costs 20% of the base deck cost.

  *Fix-1.*
cyberdeck-mods.buffer-circuits.name: '{base} (buffer circuits)'
cyberdeck-mods.buffer-circuits.description: |-
  Add 5 points to the deck’s Shielding rating. Costs 20% of the base deck cost.

  *Fix-1.*
cyberdeck-mods.cpu-overclocking.name: '{base} (cpu overclocking)'
cyberdeck-mods.cpu-overclocking.description: |-
  Add one to the deck’s CPU rating. Costs 30% of the base deck cost.

  *Fix-2.*
cyberdeck-mods.memory-expansion.name: '{base} (memory expansion)'
cyberdeck-mods.memory-expansion.description: |-
  Add four units of Memory to the deck. Costs 20% of the base deck cost.

  *Fix-1.*
cyberdeck-mods.polymorphic-intrusion-algorithms.name: '{base} (polymorphic intrusion algorithms)'
cyberdeck-mods.polymorphic-intrusion-algorithms.description: |-
  Add one to the unit’s Bonus Access but subtract one from its CPU rating. Costs 10% of the base deck cost.

  *Fix-1.*
cyberdeck-mods.skeletal-case.name: '{base} (skeletal case)'
cyberdeck-mods.skeletal-case.description: |-
  The deck’s Encumbrance value is decreased by 1, but its Memory suffers a -2 penalty. Costs 10% of the base deck cost.

  *Fix-1.*
cyberdeck-mods.thermal-exhaust-case.name: '{base} (thermal exhaust case)'
cyberdeck-mods.thermal-exhaust-case.description: |-
  The deck’s Encumbrance value is increased by 1, but its CPU value increases by 1 as well. Costs 30% of the base deck cost.

  *Fix-2.*
programs.subjects.avatar.name: 'Avatar'
programs.subjects.avatar.description: 'A cyberspace avatar, whether one adopted by a hacker who’s jacked into the network or a Demon program standing guard there.'
programs.subjects.barrier.name: 'Barrier'
programs.subjects.barrier.description: 'A network node barrier that blocks avatars from passing through a network connection.'
programs.subjects.camera.name: 'Camera'
programs.subjects.camera.description: 'Any device that transmits audiovisual information. Some defensive hardware has its own onboard camera, which is susceptible to this target, while others rely on a separate device’s input.'
programs.subjects.cyber.name: 'Cyber'
programs.subjects.cyber.description: 'A cybernetic system in a visible subject within 30 meters with no significant obstacles to line of sight. Unlike most Subjects, it’s not necessary for a hacker to manifest an avatar inside the target node to affect cyber systems; they can launch their program directly at it, and the system itself need not be visible on the target’s body. Given the difficulty of affecting cyber wirelessly, many hackers prefer to use more specific Subjects for a +1 bonus, such as Nerve Cyber or Limb Cyber.'
programs.subjects.datafile.name: 'Datafile'
programs.subjects.datafile.description: 'A datafile stored within a cyberspace location. While individual files may have very little actual data in them, the autoencryption functions and anti-tamper code they’re wrapped in almost always take up a full unit of Memory per file .'
programs.subjects.door.name: 'Door'
programs.subjects.door.description: 'A physical door, shutter, hatch, or other barrier with an electronic lock or opening mechanism.'
programs.subjects.drone.name: 'Drone'
programs.subjects.drone.description: 'A remote-controlled drone. The base difficulty is equal to 7 plus the operator’s level or HD/3, rounded up, or 8 if it’s not actively controlled. Like the Cyber Subject, it is not necessary to manifest in a drone’s node to hack it wirelessly.'
programs.subjects.machine.name: 'Machine'
programs.subjects.machine.description: 'Security panels, factory machinery, electronic minefields, or any other hackable device not covered under an existing Subject. Its generality applies a +1 penalty to the security difficulty.'
programs.subjects.program.name: 'Program'
programs.subjects.program.description: 'A hostile program, used most often with the Terminate verb to end the effects of an enemy hacker’s programs prematurely.'
programs.subjects.sensor.name: 'Sensor'
programs.subjects.sensor.description: 'Similar to the Camera element, this code block handles sensors of any kind, regardless of what they are intended to detect. The generality of the element decreases its efficiency, however, and it applies a +1 security difficulty penalty.'
programs.subjects.transmission.name: 'Transmission'
programs.subjects.transmission.description: 'Ambient radio transmissions can be affected with this element, most often for the purpose of tampering with local comms. A hacker need not be jacked into a cyberspace node to target local radio transmissions, but the usual -2 check penalty for wireless hacking applies.'
programs.subjects.turret.name: 'Turret'
programs.subjects.turret.description: 'A security turret, emplaced gun, or other fixed automated weapon.'
programs.verbs.activate.name: 'Activate'
programs.verbs.activate.description: 'Turn a device or piece of cyberware on. You can’t control it or direct its function, but if it’s programmed to do something when activated, such as grant a bonus action in exchange for System Strain, it does it for one round or one action. The spasmodic activation of cyber outside of the wearer’s turn is unlikely to do anything useful, but it eats System Strain as usual if relevant.'
programs.verbs.analyze.name: 'Analyze'
programs.verbs.analyze.description: 'Identify the specific functionality of a device or the general topics of local datafiles. Hackers get a general idea of what kind of device a cyberspace node represents, but Analyze is needed to give specific details of where a device is in reality.'
programs.verbs.append.name: 'Append'
programs.verbs.append.description: 'Add a new entry or new data into a file. These new entries can’t overwrite or erase any existing data, however.'
programs.verbs.blind.name: 'Blind'
programs.verbs.blind.description: 'Deactivate a device’s sensory input or make cyberware temporarily unable to get any input from anything but the wearer’s nervous system. Cybereyes are blind, cameras sense nothing, and laser tripwires don’t register the beam. Blind characters can’t effectively attack at range, their movement rate is halved, and they suffer a -4 penalty to both AC and melee hit rolls.'
programs.verbs.deactivate.name: 'Deactivate'
programs.verbs.deactivate.description: 'Turn a device or piece of cyberware off. Most devices and cyber can be rebooted by the network or the user, but it’ll take a Main Action and a round to do so. If a network alert hasn’t been issued, the network may not notice a deactivated device until someone spots the problem.'
programs.verbs.decrypt.name: 'Decrypt'
programs.verbs.decrypt.description: 'Decrypt a data file or radio transmission. This is often automatic for civilian encoding, though some files take Int/Program checks.'
programs.verbs.defend.name: 'Defend'
programs.verbs.defend.description: 'A special Verb that can only be targeted at a friendly device or allied cyberware user within range, and costs no Access to use. While the program remains running, any hostile hacking attempts aimed at that device or any of the target’s cyber systems must first beat the user in an opposed Int/Program skill check before they can attempt their hack. This Verb cannot negate programs that are already running on the target.'
programs.verbs.delude.name: 'Delude'
programs.verbs.delude.description: 'Spoof a device with false sensor input. A camera can be made to record nonexistent scenes, a minefield can be made to see phantom intrusions, a drone can feed the operator false visuals, and a turret can be made to mistake friends for foes. This Verb can’t control a device directly, however, and must rely on feeding it false sensor data.'
programs.verbs.erase.name: 'Erase'
programs.verbs.erase.description: 'Erase a data file. This Verb is extremely thorough, and any on-site backups can be expected to be nuked as well, either immediately or as soon as the automatic backup protocols expose them.'
programs.verbs.frisk.name: 'Frisk'
programs.verbs.frisk.description: 'A Frisk Cyber program can give a list of all the cyber implanted in a specific human target within 30 meters, assuming the hacker’s skill check beats the cyber user’s security difficulty.'
programs.verbs.ghost.name: 'Ghost'
programs.verbs.ghost.description: 'Renders the targeted friendly avatar or Demon “invisible” until they take some cyberspace action other than Move Nodes. Observers in a node get an automatic opposed Int/Program check to detect a ghosted avatar’s presence, ending the program.'
programs.verbs.glitch.name: 'Glitch'
programs.verbs.glitch.description: 'Temporarily deactivate a device or cyberware system while the program remains running, for no more than one round per Program skill level plus two. A device can be targeted by a particular hacker’s Glitch only once a day, successful or not.'
programs.verbs.hijack.name: 'Hijack'
programs.verbs.hijack.description: 'Seize control of a device, operating it as you wish within the limits of its functionality for as long as the program remains running. One command is free with the program’s successful execution; others take a Main Action to issue.'
programs.verbs.kill.name: 'Kill'
programs.verbs.kill.description: 'Through forced autonomic feedback and out-of-bounds electrical current parameters, inflict lethal damage to an enemy avatar equal to 1d10 per Program skill level, to a minimum of 1d10 on a successful opposed Int/Program skill check. This damage has a Trauma Die of 1d8 and a x3 Trauma Rating. The victim’s Trauma Target is not modified by armor, but it is by cyber or other modifiers. Unconscious hackers cannot resist this Verb and will be instantly killed by it. This Verb has no effect on Demons.'
programs.verbs.lock.name: 'Lock'
programs.verbs.lock.description: 'Lock a physical device that has some sort of electronic locking mechanism or a currently-unlocked cyberspace node barrier.'
programs.verbs.paralyze.name: 'Paralyze'
programs.verbs.paralyze.description: 'On a successful opposed Int/Program skill check against the target, render a Demon or avatar incapable of moving out of a node or using the Alert the Network or Send Message actions while the program is running. Other cyberspace actions can be taken normally. Human hackers are also physically paralyzed while the program runs, incapable of moving in meatspace until the connection is cut or the program ends.'
programs.verbs.replace.name: 'Replace'
programs.verbs.replace.description: 'Edit a data file, changing one piece of data in it into another of the hacker’s choice. It cannot erase or add data outright, only alter it.'
programs.verbs.sabotage.name: 'Sabotage'
programs.verbs.sabotage.description: 'Cause a physical device or cyberware system to damage itself through violent movement or self-destructive current surges. Devices smaller than a car will usually be disabled until repaired. Cyberware users do not take damage, but must make two Physical saves to resist the effect; if they fail both, the targeted system is disabled until the next maintenance, and if they fail one, it’s frozen for one round. A device or cyber can be targeted by this Verb only once per scene.'
programs.verbs.sense.name: 'Sense'
programs.verbs.sense.description: 'Piggyback on the sensory feed of a device or piece of cyber. Anything the device senses or records, the hacker can sense. Swapping focus from cyberspace to reality is an On Turn action.'
programs.verbs.siege.name: 'Siege'
programs.verbs.siege.description: 'If a Device is successfully Sieged, its network connections are severed for everyone but the hacker, blocking transit, data, or drone control. Defenders can run Terminate Program against it from any adjacent node.'
programs.verbs.silence.name: 'Silence'
programs.verbs.silence.description: 'The affected avatar or Demon is unable to use the Send Message cyberspace action while this program runs. Alert the Network can still be done.'
programs.verbs.stun.name: 'Stun'
programs.verbs.stun.description: 'Disrupt an avatar or Demon with sensory glitching, non-lethal current surges, and code corruption. Make an Int/Program skill check; beat an opposed Int/Program check for a human target, or a static 8+skill bonus target for a Demon. The target takes 1d10 non-lethal damage per Program level, to a minimum of 1d10.'
programs.verbs.terminate.name: 'Terminate'
programs.verbs.terminate.description: 'Prematurely end an undesired program. Any damage or changes the program already inflicted are unaffected.'
programs.verbs.unlock.name: 'Unlock'
programs.verbs.unlock.description: 'Unlock a physical device with an electronic lock or a network’s cyberspace node barrier.'
drones.mouse.name: 'Mouse'
drones.mouse.description: |-
  Small wheeled, rotored, or even aquajet-driven drones are common tools for modern operatives.

  Most operators rely on man-portable drones that can be carried in packs or specially-designed harnesses. These portable drones require a Main Action to unpack and deploy before they can be commanded, in addition to any action necessary to get at a Stowed item.

  Once a drone has been deployed, the user must bring it online and ready for command using a control board or a Remote Control Unit cybersystem. This takes both a Main and a Move action on the user’s part. Once it’s been brought up, the drone can be commanded until it’s packed again, which requires a Main Action.

  A controlled drone automatically relays audiovisual sensor data back to the control board or Remote Control Unit cyber being used to control it. A pilot can see and hear what their drones see and hear. Default sensors are as acute as normal human senses.

  Flying drones operate by means of rotors and directed thrust and can hover in place. Ground-based drones can navigate stairs and other obstacles that human legs could manage. The noise made during operation is no louder than speech.

  Flying drones have an operational altitude maximum of 1,000 meters, and all drones have a safe default control range of 1,000 meters. Beyond this range, control signal latency leaves them critically vulnerable to modern signal hijacking tech; all wireless hack or jamming attempts against them are automatically successful. Their theoretical maximum control range is 8,000 meters.

  Drones operate for one hour on a full battery charge. They do not have swappable batteries, and require one hour of charging per Encumbrance, or six hours at most.
