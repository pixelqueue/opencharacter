drone-fittings.ablative-code-buffer.name: '{base} (Ablative Code Buffer)'
drone-fittings.ablative-code-buffer.description: |-
  Numerous self-correcting backup circuits are wired in to delay any hostile hacking intrusions. The drone automatically succeeds on the first opposed skill check made against a hostile hacker in a given scene.

  *10% of the drone’s base cost.*
drone-fittings.altitude-boost-unit.name: '{base} (Altitude Boost Unit)'
drone-fittings.altitude-boost-unit.description: |-
  Most flying drones have an effective ceiling of 1,000 meters if there are no scramblers to lessen the effective control range. This unit increases a flying drone’s maximum altitude to 5,000 meters, making most effectively invisible to ordinary sight. Such height does, however, make it extremely conspicuous to aerial scanners used by city law enforcement and high-security corp buildings. The speed of their response will depend on the drone’s apparent threat.

  *10% of the drone’s base cost.*
drone-fittings.ammo-caddy.name: '{base} (Ammo Caddy)'
drone-fittings.ammo-caddy.description: |-
  A specialized form of cargo space, this drone is able to carry and dispense substantial amounts of ammunition to adjacent allies. It can hold up to 6 fully-loaded magazines in quick-release clips that can be grabbed as On Turn actions by an ally. The clips remain locked for strangers. This fitting can be taken up to once per two points of the drone’s Encumbrance, rounded up.

  *10% of the drone’s base cost.*
drone-fittings.ammo-supply.name: '{base} (Ammo Supply)'
drone-fittings.ammo-supply.description: |-
  An automated ammo feeder is added to the drone. Two full magazines are added to one mounted weapon’s allotment, or one magazine to two weapons. This fitting can be added more than once.

  *10% of the drone’s base cost.*
drone-fittings.assisted-boost-burner.name: '{base} (Assisted Boost Burner)'
drone-fittings.assisted-boost-burner.description: |-
  The drone is equipped with reactive chemical booster that can be ignited to give it a very brief burst of tremendous speed. When activated as a Move action, the burner launches the drone up to 500 meters in a straight line. The boost is not precise enough to use as an aimed weapon, but solid obstacles in front of the drone will suffer half the drone’s HP in damage and inflict all of theirs on the drone. The burner functions only once before it require a scene to regenerate its charge.

  *10% of the drone’s base cost.*
drone-fittings.cargo-space.name: '{base} (Cargo Space)'
drone-fittings.cargo-space.description: |-
  Most drones are designed to carry only their own weight. This fitting upgrades engines and adds cargo mounts to the drone’s exterior; it can carry up to 3 points of Encumbrance now, but the drone’s own Encumbrance value is increased by one. Any additional cargo it carries is added to this burden, of course. Carried cargo is sealed within the drone and requires a Main Action to dig out.

  *20% of the drone’s base cost.*
drone-fittings.command-deck-follow.name: '{base} (Command Deck/Follow)'
drone-fittings.command-deck-follow.description: |-
  The drone is equipped with minimal autonomous pursuit capabilities. As a Main Action, the drone can be ordered to follow a particular visible target at a given distance at either half or full speed. If half speed, it will use its Move action to follow, and full speed will use both Move and Main Actions. Following can be ended as an On Turn command.

  *10% of the drone’s base cost.*
drone-fittings.command-deck-kill.name: '{base} (Command Deck/Kill)'
drone-fittings.command-deck-kill.description: |-
  The drone has autonomous attack routines wired into it. As a Main Action, it can be ordered to kill one specific visible target. If the target is in range of its weapons, it will use its Main Action to attack; if no additional fittings are added, its autonomous attacks have a total hit bonus of +2. The drone will not automatically move to follow or engage its target or otherwise position itself tactically unless directly piloted to do so or operating under the Follow command.

  *25% of the drone’s base cost.*
drone-fittings.command-deck-patrol.name: '{base} (Command Deck/Patrol)'
drone-fittings.command-deck-patrol.description: |-
  As a Main Action, the drone can be ordered to autonomously move to one or more waypoints on whatever schedule the pilot wishes. The drone can also be ordered to loiter at a particular location until it gets an On Turn command to proceed to the next location.

  *10% of the drone’s base cost.*
drone-fittings.command-deck-watch.name: '{base} (Command Deck/Watch)'
drone-fittings.command-deck-watch.description: |-
  The drone is equipped to monitor its surroundings autonomously and alert its pilot when something of interest is noticed. Its onboard intelligence is limited, however, and it can only handle about a sentence’s worth of specific orders or subjects to be watchful for. Putting a drone in Watch mode is a command that takes a Main Action.

  *10% of the drone’s base cost.*
drone-fittings.emergency-evac-litter.name: '{base} (Emergency Evac Litter)'
drone-fittings.emergency-evac-litter.description: |-
  Functioning only for ground-based drones of Enc 3 or greater, the drone is equipped with a retractable litter that can fit one human patient, along with manipulators sufficient to get a prone victim onto the litter with a Main Action. Onboard meds allow for remote Heal skill checks to stabilize a Mortally Wounded target, with one attempt allowed as part of the loading action. A loaded patient can’t be harmed until the drone is destroyed or opens the litter, but if the drone dies, the patient does too. As a Main Action, the drone can be ordered to autonomously take the patient to a particular location. As an On Turn action, an onboard transmitter can also place a call for medical assistance to a pre-arranged number.

  *25% of the drone’s base cost.*
drone-fittings.emissions-shielding.name: '{base} (Emissions Shielding)'
drone-fittings.emissions-shielding.description: |-
  The drone is designed to minimize its electromagnetic emissions and thermal signature. Skill checks to spot it with such sensors suffer a -2 penalty.

  *20% of the drone’s base cost.*
drone-fittings.enhanced-structure.name: '{base} (Enhanced Structure)'
drone-fittings.enhanced-structure.description: |-
  The drone’s maximum hit points increase by 25% of its unmodified base, rounded up. As with Improved Armor, this fitting is ineffective on drones that aren’t man-portable.

  *25% of the drone’s base cost.*
drone-fittings.extended-range.name: '{base} (Extended Range)'
drone-fittings.extended-range.description: |-
  The drone can now operate for two hours on a full battery charge.

  *25% of the drone’s base cost.*
drone-fittings.glider-grips.name: '{base} (Glider Grips)'
drone-fittings.glider-grips.description: |-
  Usable only by flying drones of Enc 3 size or greater, this fitting allows a human-sized mass to use the drone as a form of parachute-glider. As a Main Action, a user can leap off a high place after grabbing the drone and descend safely to the ground at a distance as far from the initial point as that point was above the ground. Similar weights can be sent safely to the ground in the same way.

  *20% of the drone’s base cost.*
drone-fittings.improved-armor.name: '{base} (Improved Armor)'
drone-fittings.improved-armor.description: |-
  The drone’s AC improves by 2, to a maximum of 18, but its Encumbrance rating increases by one. This fitting is ineffective on drones too big to have an Encumbrance rating; they need vehicle-grade armor upgrades.

  *25% of the drone’s base cost.*
drone-fittings.improved-targeting-logic.name: '{base} (Improved Targeting Logic)'
drone-fittings.improved-targeting-logic.description: |-
  This unit allows a skilled drone pilot to tweak the combat logic of its onboard weaponry. The drone’s attack gains a hit bonus equal to the pilot’s Drive or Program skill level when firing autonomously; no bonus is given if the pilot is in direct control.

  *20% of the drone’s base cost.*
drone-fittings.laser-comms.name: '{base} (Laser Comms)'
drone-fittings.laser-comms.description: |-
  This fitting provides both a set of universal transceiver plug-ins and a laser comm hub for the drone. Provided the PCs are in line of sight of the drone, normal radio-wave based comms can be switched to lasers, providing uncrackable, electromagnetically-inaudible communications within the group. Radio comms can still be used as needed.

  *10% of the drone’s base cost.*
drone-fittings.manipulator-tendrils.name: '{base} (Manipulator Tendrils)'
drone-fittings.manipulator-tendrils.description: |-
  One set of manipulators is added to the drone, whether a mechanical claw, an articulated metal tendril, or some other device. With a Main Action command from the pilot, it can function as a single human hand with an effective Strength of 12, but it cannot effectively be used for an attack or to lift anything heavier than the drone itself. The fitting can carry things for short distances, but to haul weight any real distance the Cargo Space fitting is required. This fitting can be added more than once if a pair of “hands” are needed.

  *20% of the drone’s base cost.*
drone-fittings.memory-banks.name: '{base} (Memory Banks)'
drone-fittings.memory-banks.description: |-
  The drone has two units of cyberdeck Memory added to it. While this Memory can be used to store hacker programs or datafiles, it also has room to record up to a week of audiovisual data per unit used. This fitting can be added more than once.

  *10% of the drone’s base cost.*
drone-fittings.no-touch-web.name: '{base} (No Touch Web)'
drone-fittings.no-touch-web.description: |-
  Most commonly installed on small ground drones, this web can be armed as a Main Action by the pilot. Until disarmed, any attempt to grab or pick up the drone automatically inflicts 2d6 non-lethal electrical damage on the grabber. This shock continues each round as long as the drone is held, with up to 5 discharges total before the battery must be recharged. The firm contact required makes it impractical to use the web as an offensive weapon.

  *10% of the drone’s base cost.*
drone-fittings.sleep-mode.name: '{base} (Sleep Mode)'
drone-fittings.sleep-mode.description: |-
  Sleep mode can be enabled with a Main Action command or ended with an On Turn command. While in sleep mode, a drone cannot fly, move, or perform actions, but it will continue to communicate with the pilot and observe its surroundings. A day of sleep mode counts as ten minutes of ordinary operation for battery drain purposes.

  *10% of the drone’s base cost.*
drone-fittings.stealth-package.name: '{base} (Stealth Package)'
drone-fittings.stealth-package.description: |-
  Usable only on drones of Enc 3 or smaller, this fitting adds color-changing drone sheathing, noise damping, and thermal sealing to the unit. It gains an effective Sneak-1 skill when operating autonomously, or a +2 bonus to Sneak checks when being directly piloted.

  *25% of the drone’s base cost.*
drone-fittings.suicide-charge.name: '{base} (Suicide Charge)'
drone-fittings.suicide-charge.description: |-
  With a Main Action command to detonate, the drone will explode, doing 3d6 damage to anyone within ten meters, with an Evasion save for half. Subjects behind solid cover further halve the damage. Drones reduced to zero hit points are too badly damaged to respond to detonation commands.

  *25% of the drone’s base cost.*
drone-fittings.telescopic-optics.name: '{base} (Telescopic Optics)'
drone-fittings.telescopic-optics.description: |-
  The drone can focus on objects up to one kilometer away with a visual acuity sufficient to read a newspaper. Integral low-light sensors allow it to see in all but total darkness.

  *20% of the drone’s base cost.*
drone-fittings.thermal-optics.name: '{base} (Thermal Optics)'
drone-fittings.thermal-optics.description: |-
  The drone is equipped with IR optics that can see heat patterns. The drone can function adequately even in complete darkness and grants the pilot a +1 bonus to Notice skill checks where thermal imaging might be useful.

  *20% of the drone’s base cost.*
drone-fittings.trauma-response-suite.name: '{base} (Trauma Response Suite)'
drone-fittings.trauma-response-suite.description: |-
  An array of injectors, scalpels, sutures, and trauma chems are built into the drone, allowing it to function as a medkit and make Heal skill checks for a medically-competent pilot or an on-site doc in need of a kit. Such medical efforts require a Main Action from the pilot as usual, and flying drones apply a -2 penalty to the skill check due to their innate instability. Up to six pharmaceutical doses of the pilot’s choice can be loaded into the drone.

  *25% of the drone’s base cost.*
drone-fittings.voice-broadcast.name: '{base} (Voice Broadcast)'
drone-fittings.voice-broadcast.description: |-
  The pilot can speak through the drone or cause it to emit other noises at a volume loud enough to be heard clearly a hundred meters away.

  *10% of the drone’s base cost.*
drone-fittings.wallcrawler.name: '{base} (Wallcrawler)'
drone-fittings.wallcrawler.description: |-
  Usable only on ground-based drones of Enc 3 or less, this fitting allows the drone to climb sheer surfaces at its normal movement rate, assuming the surface is sturdy enough to bear its weight. Most high-security buildings are constructed with veneers that defeat this fitting, but ordinary structures seldom have such measures.

  *20% of the drone’s base cost.*
drone-fittings.weapon-hardpoint.name: '{base} (Weapon Hardpoint)'
drone-fittings.weapon-hardpoint.description: |-
  Drones that are not factory-equipped with weapon hardpoints can have one worked in as an aftermarket addition. The usual hardpoint limits on maximum allowed weapon size still apply, however, and this fitting counts as two for purposes of the drone’s maximum fittings.

  *25% of the drone’s base cost.*
drone-mods.additional-fitting.name: '{base} (additional fitting)'
drone-mods.additional-fitting.description: |-
  Careful optimization of power lines and chassis reinforcement allows for adding an additional fitting to the drone. Man-portable drones add one point of Encumbrance, though this doesn’t affect their maximum hardpoint weapon size. The cost is 50% of the drone’s base cost.

  *Fix-1 & Drive-1.*
drone-mods.additional-hardpoint.name: '{base} (additional hardpoint)'
drone-mods.additional-hardpoint.description: |-
  By rearranging wiring, adding mass, and overriding safety protocols, an additional hardpoint can be added to a drone. This mod adds one point of Encumbrance to portable drones, though this doesn’t affect their maximum weapon size. The cost is 50% of the drone’s base cost plus the weapon.

  *Fix-1 & Drive-1.*
drone-mods.battery-swapping.name: '{base} (battery swapping)'
drone-mods.battery-swapping.description: |-
  Replacing proprietary battery systems with off-the-shelf models allows man-portable drones to have their battery swapped with a minute of work. Backup batteries cost 10% of the drone’s base cost and count as Enc 1 items, and this mod itself costs 10% of the drone’s base cost.

  *Fix-1 & Drive-1.*
drone-mods.boosted-engine.name: '{base} (boosted engine)'
drone-mods.boosted-engine.description: |-
  The drone’s engines are tuned to optimize speed, increasing its Move rate by 10m. It costs 25% of the drone’s base cost.

  *Fix-1 & Drive-2.*
drone-mods.heavy-plating.name: '{base} (heavy plating)'
drone-mods.heavy-plating.description: |-
  Strategic armor reinforcement improves its base AC by 2, but decreases its Move rate by 5m. It also increases its effective Encumbrance by 1 if it’s man-portable. The cost is 25% of the drone’s base cost.

  *Fix-1 & Drive-2.*
drone-mods.quick-launch.name: '{base} (quick launch)'
drone-mods.quick-launch.description: |-
  A packed man-portable drone is modified to deploy itself as an On Turn action by its controller instead of a Main Action, even if it’s currently Stowed. The cost is 10% of the drone’s base cost.

  *Fix-1 & Drive-2.*
drone-mods.redundant-systems.name: '{base} (redundant systems)'
drone-mods.redundant-systems.description: |-
  Careful duplication of critical systems increases the drone’s hit points by 25% of its unmodified base score, rounded up. The extra mass increases the Encumbrance of man-portable drones by 1. The cost is 50% of the drone’s base cost.

  *Fix-2 & Drive-2.*
drone-mods.stripped-fittings.name: '{base} (stripped fittings)'
drone-mods.stripped-fittings.description: |-
  Mass and power allocated to a man-portable drone’s fittings are removed. The drone’s maximum fitting total is decreased by 1 and its Encumbrance rating is reduced by 1, to a minimum of 1. The cost is 10% of the drone’s base cost.

  *Fix-2 & Drive-1.*
vehicles.motorcycle.name: 'Motorcycle'
vehicles.motorcycle.description: 'Fast, cheap, and nimble, both gangers and operators find these vehicles handy for making escapes down alleys and over terrain that larger vehicles can’t navigate.'
vehicles.micro-flyer.name: 'Micro Flyer'
vehicles.micro-flyer.description: 'One of a class of featherlight aircraft, a flyer is woven of the lightest, thinnest, strongest materials available at its price point, and can provide cheap aerial recon or transit over rough terrain for its single occupant. Such flyers are light enough to be broken down into components that can be easily transported by a pickup truck.'
vehicles.car.name: 'Car'
vehicles.car.description: 'An urban luxury, private cars are for the middle class and better, or those rough-edged slum entrepreneurs who are clever enough to keep some salvaged hulk running. This vehicle class also includes small pickup trucks and SUVs.'
vehicles.truck.name: 'Truck'
vehicles.truck.description: 'More commonly found among corp employees, these flatbed trucks, delivery vans, panel vans, and other large work vehicles earn their keep in a hundred ways each day.'
vehicles.helicopter.name: 'Helicopter'
vehicles.helicopter.description: 'A typical civilian helicopter, used for elite transit between city districts or the quick dispatch of personnel to some hotspot. Their ability to weave through the obstacles of urban high-rises is sometimes valuable when evading hostile pursuit.'
vehicles.tank.name: 'Tank'
vehicles.tank.description: 'A military classic, this model is relatively low-tech but more than enough to deal with any civilian vehicle. Tanks are seldom found in urban areas without a protective screen of infantry to keep hostiles with demo charges or rocket launchers from getting uncomfortable close.'
vehicles.apc.name: 'APC'
vehicles.apc.description: 'Armored personnel carriers are often custom-built for city law enforcement, the better to dump a squad of cops where they’re most needed. The mounted weapon on most of them helps pacify a hot zone before the occupants dismount.'
vehicles.gev.name: 'GEV'
vehicles.gev.description: 'Ground effect vehicles have evolved considerably from their 20th-century ancestors, and their armored pneumatic skirts and high-efficiency engines can send them over terrain that might defeat a tracked tank. The sacrifice in armor weight is generally deemed acceptable, given the usual opposition these vehicles face.'
vehicles.casra.name: 'CASRA'
vehicles.casra.description: 'The “Close Air Support Rotorwing Aircraft” of corporate R&D comes in a half-dozen different configurations, from multirotor helicopters to rotor-in-wing strike craft. Light and vicious, they’re favored by city SWAT teams who need military-grade firepower capable of maneuvering through city airspace. When a CASRA shows up, minigun rounds are seldom far behind.'
vehicles.dropcraft.name: 'Dropcraft'
vehicles.dropcraft.description: 'One of a family of armored military air transports, dropcraft are used when a squad needs to be inserted under heavy fire. Thick armor, a heavy gun, and VTOL engines combine with considerable loitering ability to make an excellent tool for pacifying corporate enemies.'
vehicle-fittings.advanced-sensors.name: '{base} (Advanced Sensors)'
vehicle-fittings.advanced-sensors.description: 'The vehicle is equipped with night vision, infrared sensors, and short-range radar good up to twenty kilometers of airspace. It can be driven safely even in pitch darkness.'
vehicle-fittings.afterburners.name: '{base} (Afterburners)'
vehicle-fittings.afterburners.description: 'Once per scene, as an On Turn action, boost the vehicle’s Speed by 1 for five rounds.'
vehicle-fittings.armor-plating.name: '{base} (Armor Plating)'
vehicle-fittings.armor-plating.description: 'Increase the vehicle’s Armor rating by 3 points. Medium vehicles can apply this fitting twice, and Large ones can apply it three times.'
vehicle-fittings.cargo-space.name: '{base} (Cargo Space)'
vehicle-fittings.cargo-space.description: 'This fitting can be taken multiple times. Each time it adds 50 kg of protected cargo space for Small vehicles, 500 kg for Medium ones, and 2 metric tons for Large ones.'
vehicle-fittings.crash-pod.name: '{base} (Crash Pod)'
vehicle-fittings.crash-pod.description: 'If the vehicle crashes, the occupants can each reroll one failed crash save. If they make any of their saves, their HP can’t be reduced below 1 point by the crash.'
vehicle-fittings.ecm-emitter.name: '{base} (ECM Emitter)'
vehicle-fittings.ecm-emitter.description: 'On a successful hit roll by a headshot pod, rocket launcher, or other long-range guided projectile, the driver can make an opposed Int or Dex/Drive skill check against the attacker’s combat skill. On a success, the attacker must reroll their hit roll and take the worst result.'
vehicle-fittings.emissions-cloaking.name: '{base} (Emissions Cloaking)'
vehicle-fittings.emissions-cloaking.description: 'Once per day, for one hour, the vehicle can become almost invisible to infrared or radar. This cloak becomes useless if the vehicle is visually spotted by defenders.'
vehicle-fittings.extra-durability.name: '{base} (Extra Durability)'
vehicle-fittings.extra-durability.description: 'The vehicle’s maximum hit points increase by 25%, rounded up.'
vehicle-fittings.extra-passengers.name: '{base} (Extra Passengers)'
vehicle-fittings.extra-passengers.description: 'Small vehicles add 1 Crew, Medium ones add 2, and Large ones add 4. This fitting can be taken multiple times, and any vehicle amenities such as crash pods or living quarters extend to these additional Crew as well.'
vehicle-fittings.field-portable.name: '{base} (Field Portable)'
vehicle-fittings.field-portable.description: 'Only Small or Medium vehicles can take this option, allowing them to be broken down into easily-portable parts packages. Small vehicles turn into 30 items of Encumbrance and Medium ones into 150. Disassembly takes 30 minutes for a Small vehicle and 3 hours for a Medium one, with reassembly taking four times as long.'
vehicle-fittings.ghost-driver.name: '{base} (Ghost Driver)'
vehicle-fittings.ghost-driver.description: 'The driver can order the vehicle directly or by radio or phone to go to particular places at particular times or perform other simple, direct actions on a given schedule. The onboard expert system can handle traffic-related challenges, but has no real intelligence to process more complicated problems.'
vehicle-fittings.hardpoint-support.name: '{base} (Hardpoint Support)'
vehicle-fittings.hardpoint-support.description: 'Additional power and structural support enable the addition of a hardpoint.'
vehicle-fittings.jack-control-port.name: '{base} (Jack Control Port)'
vehicle-fittings.jack-control-port.description: 'The vehicle is wired to be controlled through a plugged-in cranial jack as well as a conventional wheel. While jacked in, the driver need only use a Move Action to control the vehicle rather than a Main Action.'
vehicle-fittings.limpet-mount-small.name: '{base} (Limpet Mount, Small)'
vehicle-fittings.limpet-mount-small.description: 'An entire second vehicle can be mounted with this fitting, Medium vehicles taking Small parasites and Large ones taking Small or Medium. Adding a mount for a Small vehicle takes up 3 Mass while a Medium one takes 6. Modifying a vehicle to be mounted adds 10% to its base cost, but it can be launched even while the parent vehicle is underway. These parasite vehicles are destroyed if the parent is; otherwise, they take only half the damage the parent takes.'
vehicle-fittings.limpet-mount-medium.name: '{base} (Limpet Mount, Medium)'
vehicle-fittings.limpet-mount-medium.description: 'An entire second vehicle can be mounted with this fitting, Medium vehicles taking Small parasites and Large ones taking Small or Medium. Adding a mount for a Small vehicle takes up 3 Mass while a Medium one takes 6. Modifying a vehicle to be mounted adds 10% to its base cost, but it can be launched even while the parent vehicle is underway. These parasite vehicles are destroyed if the parent is; otherwise, they take only half the damage the parent takes.'
vehicle-fittings.living-quarters.name: '{base} (Living Quarters)'
vehicle-fittings.living-quarters.description: 'Basic, cramped quarters are provided for sleeping, sanitation, and cooking for all crew. Permanent living in a vehicle costs and counts as a slum lifestyle, though occupants with the Ace Driver or Roamer Focus can treat it as middle-class for the same price.'
vehicle-fittings.medbay.name: '{base} (Medbay)'
vehicle-fittings.medbay.description: 'Surgical tools and medical support are provided for up to one critically-injured patient at a time. A medbay counts as an emergency clinic for purposes of treating Major Injuries, if someone with at least Heal-0 is available to tend to the patient.'
vehicle-fittings.offroad-package.name: '{base} (Offroad Package)'
vehicle-fittings.offroad-package.description: 'While any modern vehicle can handle abandoned roads and mostly-flat terrain, this package includes winches, tire armor, chassis reinforcement, and other upgrades needed to go through all but the most impassible terrain.'
vehicle-fittings.power-system-small.name: '{base} (Power System, Small)'
vehicle-fittings.power-system-small.description: 'These fittings add extra Power in battery capacity and computing support at the cost of an additional Mass burden.'
vehicle-fittings.power-system-medium.name: '{base} (Power System, Medium)'
vehicle-fittings.power-system-medium.description: 'These fittings add extra Power in battery capacity and computing support at the cost of an additional Mass burden.'
vehicle-fittings.power-system-large.name: '{base} (Power System, Large)'
vehicle-fittings.power-system-large.description: 'These fittings add extra Power in battery capacity and computing support at the cost of an additional Mass burden.'
vehicle-fittings.sealed-atmosphere.name: '{base} (Sealed Atmosphere)'
vehicle-fittings.sealed-atmosphere.description: 'For up to two hours per day the vehicle can seal itself entirely from the outside atmosphere, with internal air tanks and positive pressure to keep out external toxins. At all times it can maintain a comfortable interior temperature in any terrestrial climate. Aircraft do not need this fitting to function normally at high altitudes.'
vehicle-fittings.smugglers-hold.name: '{base} (Smuggler’s Hold)'
vehicle-fittings.smugglers-hold.description: 'This fitting can be taken more than once, and adds 10 kg of concealed cargo space in Small vehicles, 100 kg in Medium ones, and 400 kg in Large ones. It can be detected only by taking the vehicle apart or by an acute, careful inspection with a difficulty 12 Wis/Notice or Wis/Drive skill check.'
vehicle-fittings.targeting-board.name: '{base} (Targeting Board)'
vehicle-fittings.targeting-board.description: 'A single unified targeting board allows one gunner to manage up to three vehicle weapons instead of the one gun per gunner that would usually be allowed.'
vehicle-fittings.tool-rack.name: '{base} (Tool Rack)'
vehicle-fittings.tool-rack.description: 'Any vehicle can carry a toolkit in the trunk, but this rack is equipped with welders, heavy tooling, winches, and room for up 40 HP worth of spare parts. It can repair any vehicle and can be used as a makeshift workshop for related efforts.'
vehicle-mods.augmented-armor.name: '{base} (augmented armor)'
vehicle-mods.augmented-armor.description: |-
  Increase the vehicle’s Armor rating by 3 points.

  *Fix-3/Drive-1, 25% of the vehicle’s base cost, 1 special component.*
vehicle-mods.drone-hub.name: '{base} (drone hub)'
vehicle-mods.drone-hub.description: |-
  Install a housing that can hold a portable drone on Small vehicles or a non-portable drone on Medium or larger vehicles. The drone can be deployed while the vehicle is in motion. Onboard signal encryption adds +2 to the difficulty of hacking any drone controlled by someone in or adjacent to this vehicle. This fitting can be installed twice on Large vehicles.

  *Fix-1/Drive-0, 10% of the vehicle’s base cost.*
vehicle-mods.extra-seating.name: '{base} (extra seating)'
vehicle-mods.extra-seating.description: |-
  Increase the maximum Crew size by 1 for Small vehicles, 2 for Medium, and 4 for Large.

  *Fix-0/Drive-1, 10% of the vehicle’s base cost.*
vehicle-mods.integrated-magazines.name: '{base} (integrated magazines)'
vehicle-mods.integrated-magazines.description: |-
  Mounted weapons gain one extra built-in magazine for Small vehicles, two for Medium, or four for Large. Reloading one vehicle magazine takes a Main Action.

  *Fix-1/Drive-0, 10% of the vehicle’s base cost.*
vehicle-mods.personalized-controls.name: '{base} (personalized controls)'
vehicle-mods.personalized-controls.description: |-
  The vehicle’s controls are designed for the idiosyncrasies of a specific driver. Once per scene, as an Instant action, they can add +1 to a Drive skill check. Anyone else takes -1 to drive the vehicle.

  *Fix-1/Drive-2, 20% of the vehicle’s base cost.*
vehicle-mods.power-system-upgrade.name: '{base} (power system upgrade)'
vehicle-mods.power-system-upgrade.description: |-
  Increase the Power rating of the vehicle by 2 points for Small vehicles, 3 for Medium, and 4 for Large.

  *Fix-2/Drive-2, 25% of the vehicle’s base cost, 1 special component.*
vehicle-mods.q-cladding.name: '{base} (q-cladding)'
vehicle-mods.q-cladding.description: |-
  Disguise the vehicle as another vehicle of the same general type, and hide its mounted weaponry. Replacing the disguise after weapons are deployed takes five minutes.

  *Fix-1/Drive-2, 20% of the vehicle’s base cost.*
vehicle-mods.reactive-defenses.name: '{base} (reactive defenses)'
vehicle-mods.reactive-defenses.description: |-
  Increase the vehicle’s Armor Class by 2 points, but subtract 2 points from its Armor, if it has any.

  *Fix-2/Drive-2, 25% of the vehicle’s base cost, 1 special component.*
vehicle-mods.reinforced-chassis.name: '{base} (reinforced chassis)'
vehicle-mods.reinforced-chassis.description: |-
  Increase the vehicle’s maximum HP by 25% of its base, but subtract 2 Mass from its maximum.

  *Fix-2/Drive-1, 25% of the vehicle’s base cost, 1 special component.*
vehicle-mods.remote-sensors.name: '{base} (remote sensors)'
vehicle-mods.remote-sensors.description: |-
  The driver’s smartphone or headware can tap the vehicle’s sensors as an On Turn action, getting audio and visual from it if no special sensors are installed. This signal can reach up to two kilometers.

  *Fix-1/Drive-0, 10% of the vehicle’s base cost.*
vehicle-mods.supplementary-tanks.name: '{base} (supplementary tanks)'
vehicle-mods.supplementary-tanks.description: |-
  The vehicle can operate for up to three days of normal driving without refueling.

  *Fix-0/Drive-1, 10% of the vehicle’s base cost.*
vehicle-mods.ultralight-components.name: '{base} (ultralight components)'
vehicle-mods.ultralight-components.description: |-
  Increase the vehicle’s maximum Mass by 2 points for Small vehicles, 3 for Medium, or 4 for Large. Its maximum HP decreases by 20% of its base, rounded up.

  *Fix-2/Drive-1, 20% of the vehicle’s base cost, 1 special component.*
vehicle-mods.upgraded-speed.name: '{base} (upgraded speed)'
vehicle-mods.upgraded-speed.description: |-
  Increase the vehicle’s Speed by 1, but lose 20% of its maximum Mass, rounded up.

  *Fix-2/Drive-3, 25% of the vehicle’s base cost, 2 special components.*
