extras.energy-blast.name: Energy Blast
extras.energy-blast.description: Blast people with energy; +2 to attack and create advantages with Shoot this way, and Weapon:2 with Weapon and Armor ratings.
extras.super-strength.name: Super-Strength
extras.super-strength.description: +2 per rank to feats of raw strength with Physique, and Fight attacks at Weapon:2 per rank with Weapon and Armor ratings.
extras.super-speed.name: Super-Speed
extras.super-speed.description: Always go first in a conflict, ignore aspects that slow movement, and +2 to defend with Athletics or to race in a contest of pure speed.
extras.super-resilience.name: Super-Resilience
extras.super-resilience.description: Armor:2 per rank against physical harm, with Weapon and Armor ratings.
extras.x-ray-vision.name: X-Ray Vision
extras.x-ray-vision.description: See through solid objects without rolling, and +2 to Stealth to avoid detection.
extras.demonbane.name: Demonbane, the Enchanted Sword
extras.demonbane.description: A sword with the aspect Slayer of Demon-Kind, invoked against demons; it banishes nameless demons and reveals hidden ones.
extras.dueling-pistol.name: A Legendary Dueling Pistol
extras.dueling-pistol.description: A famous gunfighter's pistol, permitted by an aspect about its legacy; +2 to Shoot attacks in a formal duel.
