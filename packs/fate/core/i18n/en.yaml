# Stunts
stunts.custom.name: Stunt
stunts.custom.description: A stunt of your own. Set its name, for a +2 bonus its skill and action, and any limit on its uses or fate point cost.
stunts.custom.state.bonus.name: '+2 bonus'
stunts.hardcore-parkour.name: Hardcore Parkour
stunts.hardcore-parkour.description: +2 to overcome with Athletics in a chase across rooftops or a similarly precarious place.
stunts.rumormonger.name: Rumormonger
stunts.rumormonger.description: +2 to create an advantage with Contacts when you plant vicious rumors about someone.
stunts.lie-whisperer.name: Lie Whisperer
stunts.lie-whisperer.description: +2 to Empathy rolls to discern or discover lies, told to you or to someone else.
stunts.specialist.name: Specialist
stunts.specialist.description: +2 to Lore rolls in your field of specialization.
stunts.grappler.name: Grappler
stunts.grappler.description: +2 to create advantages with Physique by wrestling or grappling an enemy.
stunts.indomitable.name: Indomitable
stunts.indomitable.description: +2 to defend with Will against Provoke attacks of intimidation and fear.
stunts.mind-games.name: Mind Games
stunts.mind-games.description: Use Deceive in place of Provoke for mental attacks, as long as a clever lie is part of the attack.
stunts.take-the-blow.name: Take the Blow
stunts.take-the-blow.description: Use Physique to defend against Fight attacks with fists or blunt weapons; you take 1 shift of stress on a tie.
stunts.strength-from-determination.name: Strength From Determination
stunts.strength-from-determination.description: Use Will in place of Physique to overcome with feats of strength.
stunts.i-ve-read-about-that.name: I’ve Read about That!
stunts.i-ve-read-about-that.description: Spend a fate point to use Lore in place of any skill for one roll or exchange, if you can justify having read about it.
stunts.riposte.name: Riposte
stunts.riposte.description: When you succeed with style on a Fight defense, you may inflict a 2-shift hit instead of taking a boost.
stunts.pedal-to-the-metal.name: Pedal to the Metal
stunts.pedal-to-the-metal.description: In a contest where speed matters most, a tie on your Drive roll counts as a success.
stunts.psychologist.name: Psychologist
stunts.psychologist.description: Once per session, an Empathy roll (Fair, Good or Great by severity) after half an hour of talk lowers someone else's consequence by one step.
stunts.tough-as-nails.name: Tough as Nails
stunts.tough-as-nails.description: Once per session, for a fate point, turn a physical moderate consequence into a mild one, or erase a physical mild consequence.
stunts.tough-as-nails.actions.ease.name: Tough as Nails
stunts.tough-as-nails.actions.ease.steps.consequence.prompt: Which consequence?
stunts.tough-as-nails.actions.ease.results.eased.name: Eased
stunts.killing-stroke.name: Killing Stroke
stunts.killing-stroke.description: Once per scene, for a fate point, a consequence you force on an opponent is one step more severe.
stunts.ninja-vanish.name: Ninja Vanish
stunts.ninja-vanish.description: Once per scene, for a fate point, vanish in plain sight and take the Vanished boost.
stunts.trust-fund-baby.name: Trust Fund Baby
stunts.trust-fund-baby.description: Twice per session, take a boost for a windfall of cash.

