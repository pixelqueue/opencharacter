id: stunts.tough-as-nails
type: stunt
fields: { shape: exception, skill: skills.physique, limit: session, fatePoint: true }
actions:
  - id: ease
    available: >-
      self.used < 1 && fatePoints.current > 0
        && countCopies(copy.type == 'consequence' && copy.state.harm == 'physical'
          && (copy.state.slot == 'mild' || copy.state.slot == 'mild-physical'
            || (copy.state.slot == 'moderate' && consequences.mildFree))) > 0
    results: [eased]
    steps:
      - id: consequence
        kind: choice
        # The first consequence it can ease, in sheet order, so an automatic run eases one.
        recommend: options[0]
        options:
          copies:
            type: consequence
            where: >-
              self.harm == 'physical' && (self.slot == 'mild' || self.slot == 'mild-physical'
                || (self.slot == 'moderate' && consequences.mildFree))
        changes:
          - type: setState
            when: "picked.self.slot == 'moderate'"
            entry: picked
            key: slot
            value: "'mild'"
          - { type: removeItem, when: "picked.self.slot != 'moderate'", entry: picked }
          - { type: adjustState, entry: self, key: used, by: 1 }
          - { type: adjust, field: fatePoints.current, by: -1 }
      - id: result
        kind: outcome
        result: "'eased'"
