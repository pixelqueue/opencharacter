id: edges.educated
type: edge
fields:
  gainPart: true
  bonusSkill:
    [
      administer,
      connect,
      drive,
      exert,
      fix,
      heal,
      know,
      lead,
      notice,
      perform,
      program,
      punch,
      shoot,
      sneak,
      stab,
      survive,
      talk,
      trade,
      work,
    ]
effects:
  - target: skills.perLevel
    op: add
    value: 1
actions:
  # Taken after 1st level: the bonus skill points of the levels before.
  - id: gain-part
    listed: false
    steps:
      - id: points
        kind: changes
        when: '!character.creating'
        changes:
          - { type: adjust, field: skills.points, by: level - 1 }
