id: edges.mutant
type: edge
tags: [makes-mutant]
fields:
  gainPart: true
effects:
  - { target: mutations.points.edges, op: add, value: 2 }
choices:
  # After the mutations: one attribute with a modifier of -1 or better takes -1.
  - id: penalty
    from:
      values: [str, dex, con, int, wis, cha]
      where: "value in choice.picks || fieldOf('attributes.{attribute}.mod', value) >= -1"
    recommend: >-
      sortList(filterList(['str', 'dex', 'con', 'int', 'wis', 'cha'],
        fieldOf('attributes.{attribute}.mod', x) >= -1),
        fieldOf('attributes.{attribute}.mod', x))[0]
    effects:
      - target:
          {
            fields:
              {
                where: "'attribute-penalty' in item.tags && ('attribute.' + pick.value) in item.tags",
              },
          }
        op: add
        value: -1
actions:
  # Taken after creation: the mutations come at once.
  - id: gain-part
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: mutate
        kind: action
        when: '!character.creating'
        use: mutate
        params: { random: params.random }
