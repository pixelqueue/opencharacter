id: foci.specialist
type: focus
fields:
  multiple: true
  bonusSkill:
    [
      administer,
      connect,
      drive,
      exert,
      fix,
      heal,
      know,
      lead,
      notice,
      perform,
      program,
      sneak,
      survive,
      talk,
      trade,
      work,
    ]
repeatable: true
choices:
  # The skill it sharpens: 3d6 keeping the best two, 4d6 at level 2. Recommended: the
  # character's best non-combat skill.
  - id: skill
    from:
      options:
        - id: administer
          effects:
            - target: { rolls: [skill.administer] }
              op: rollModifier
              value: { kind: poolDice, count: 'self.level >= 2 ? 2 : 1' }
              stackKey: skill-dice
        - id: connect
          effects:
            - target: { rolls: [skill.connect] }
              op: rollModifier
              value: { kind: poolDice, count: 'self.level >= 2 ? 2 : 1' }
              stackKey: skill-dice
        - id: drive
          effects:
            - target: { rolls: [skill.drive] }
              op: rollModifier
              value: { kind: poolDice, count: 'self.level >= 2 ? 2 : 1' }
              stackKey: skill-dice
        - id: exert
          effects:
