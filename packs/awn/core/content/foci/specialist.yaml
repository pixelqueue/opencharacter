              stackKey: skill-dice
        - id: lead
          effects:
            - target: { rolls: [skill.lead] }
              op: rollModifier
              value: { kind: poolDice, count: 'self.level >= 2 ? 2 : 1' }
              stackKey: skill-dice
        - id: notice
          effects:
            - target: { rolls: [skill.notice] }
