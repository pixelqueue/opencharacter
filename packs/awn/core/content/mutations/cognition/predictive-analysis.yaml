id: mutations.cognition.predictive-analysis
type: mutation
fields:
  category: cognition
  roll: 10
choices:
  - id: attribute
    from: { values: [int, wis] }
    recommend: "sortList(['int', 'wis'], -fieldOf('attributes.{attribute}.score', x))[0]"
    effects:
      - target: { fields: { where: "item.id == 'awn-core:attributes.' + pick.value + '.bonus'" } }
        op: add
        value: 1
