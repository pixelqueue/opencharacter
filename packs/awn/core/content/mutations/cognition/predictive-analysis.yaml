id: mutations.cognition.predictive-analysis
type: mutation
fields:
  category: mutation-categories.cognition
  roll: 10
choices:
  - id: attribute
    from: { values: [int, wis] }
    recommend: "sortList(['int', 'wis'], -fieldOf('attributes.{attribute}.score', x))[0]"
    effects:
      - target:
          {
            fields:
              {
                where: "'attribute-bonus' in item.tags && ('attribute.' + pick.value) in item.tags",
              },
          }
        op: add
        value: 1
