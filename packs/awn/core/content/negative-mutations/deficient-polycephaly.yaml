id: negative-mutations.deficient-polycephaly
type: negative
fields:
  roll: 21
choices:
  - id: attribute
    from: { values: [int, wis] }
    recommend: "sortList(['int', 'wis'], fieldOf('attributes.{attribute}.score', x))[0]"
    effects:
      - target:
          {
            fields:
              {
                where: "'attribute-penalty' in item.tags && ('attribute.' + pick.value) in item.tags",
              },
          }
        op: add
        value: -1
        when: '!self.light'
