display:
  groups:
    - id: attributes
      priority: 0
      members: { type: field, where: "'attribute' in item.tags || 'attribute-mod' in item.tags" }
    - id: skills
      priority: 0
      members: { type: field, where: "'skill' in item.tags" }
    - id: combat
      priority: 0
    - id: saves
      priority: 0
      members: { type: field, where: "'save' in item.tags" }
    - id: condition
      priority: 0
    - id: advancement
      priority: 1
    - id: encumbrance
      priority: 1
    - id: mutations
      priority: 1
    - id: background
      kind: content
      priority: 0
      members: { type: background }
    - id: edges
      kind: content
      priority: 0
      members: { type: edge }
    - id: foci
      kind: content
      priority: 0
      members: { type: focus }
    - id: positive-mutations
      kind: content
      priority: 1
      members: { type: mutation }
    - id: negative-mutations
      kind: content
      priority: 1
      members: { type: negative }
    - id: weapons
      kind: content
      priority: 1
      members: { type: weapon }
    - id: armor
      kind: content
      priority: 1
      members: { type: armor }
    - id: gear
      kind: content
      priority: 1
      members: { type: gear }
    - id: checks
      kind: actions
      priority: 0
      members: { type: action, where: "'check' in item.tags || 'save' in item.tags" }
    - id: attacks
      kind: actions
      priority: 0
      members: { type: action, where: "'attack' in item.tags" }
    - id: advancement-actions
      kind: actions
      priority: 2
      members: { type: action, where: "'advancement' in item.tags" }
    - id: creation
      kind: actions
      priority: 3
      visibility: background
      members: { type: action, where: "'creation' in item.tags" }
  types:
    background: { quantity: { hidden: true } }
    edge: { quantity: { hidden: true } }
    focus: { quantity: { hidden: true } }
    mutation: { quantity: { hidden: true } }
    negative: { quantity: { hidden: true } }
    weapon:
      state:
        shots: { priority: 0, input: { widget: track }, showWhen: has(item.magazine) }
      fields:
        damage: { format: dice }
  fields:
    'attributes.{attribute}.base': { hidden: true }
    'attributes.{attribute}.boost': { hidden: true }
    'attributes.{attribute}.bonus': { hidden: true }
    'attributes.{attribute}.penalty': { hidden: true }
    'skills.{skill}.credit': { hidden: true }
    'skills.{skill}.cap': { hidden: true }
    skills.highest: { hidden: true }
    attributes.baseTotal: { hidden: true }
    hp.attributeMod: { hidden: true }
    hp.dieBonus: { hidden: true }
    combat.damageBonus: { hidden: true }
    combat.melee.hit: { hidden: true }
    combat.melee.damage: { hidden: true }
    combat.melee.shock: { hidden: true }
    combat.melee.shockAnyAc: { hidden: true }
    combat.armed.hit: { hidden: true }
    combat.armed.damage: { hidden: true }
    combat.armed.shock: { hidden: true }
    combat.armed.shockAnyAc: { hidden: true }
    combat.ranged.damage: { hidden: true }
    move.base: { hidden: true }
    ac.armor: { hidden: true }
    ac.armorVsGuns: { hidden: true }
    ac.shield: { hidden: true }
    ac.bonus: { hidden: true }
    saves.physicalMod: { hidden: true }
    saves.evasionMod: { hidden: true }
    saves.mentalMod: { hidden: true }
    strain.penalty: { hidden: true }
    strain.bonus: { hidden: true }
    strain.bonusCap: { hidden: true }
    stress.immune: { hidden: true }
    edges.held: { hidden: true }
    foci.held: { hidden: true }
    edges.forgedByFire: { hidden: true }
    foci.bonus: { hidden: true }
    encumbrance.armorFactor: { hidden: true }
    mutations.mutant: { hidden: true }
    mutations.noVision: { hidden: true }
    mutations.noHearing: { hidden: true }
    mutations.sensitiveSkin: { hidden: true }

    level: { groups: [advancement], priority: 0, visibility: primary }
    xp.current: { groups: [advancement], priority: 0, with: [{ field: xp.next, as: max }] }
    xp.next: { groups: [advancement], priority: 1 }
    xp.rate: { groups: [advancement], priority: 2 }
    skills.points: { groups: [advancement], priority: 0 }
    skills.perLevel: { groups: [advancement], priority: 2 }
    attributes.boosts: { groups: [advancement], priority: 2 }
    edges.count: { groups: [advancement], priority: 1, with: [{ field: edges.allowed, as: max }] }
    edges.allowed: { groups: [advancement], priority: 2 }
    edges.underdog: { groups: [advancement], priority: 2 }
    variant.giftedSurvivors: { groups: [advancement], priority: 3 }
    foci.count: { groups: [advancement], priority: 1, with: [{ field: foci.allowed, as: max }] }
    foci.allowed: { groups: [advancement], priority: 2 }
    languages.extra: { groups: [advancement], priority: 2 }

    hp.current:
      groups: [condition]
      priority: 0
      visibility: primary
      with: [{ field: hp.max, as: max }]
    hp.max: { groups: [condition], priority: 1 }
    strain.current:
      groups: [condition]
      priority: 0
      with: [{ field: strain.max, as: max }]
    strain.max: { groups: [condition], priority: 1 }
    stress.current:
      groups: [condition]
      priority: 1
      with: [{ field: stress.limit, as: max }]
    stress.limit: { groups: [condition], priority: 2 }

    ac.value: { groups: [combat], priority: 0, visibility: primary }
    ac.vsGuns: { groups: [combat], priority: 1 }
    combat.attackBonus: { groups: [combat], priority: 0 }
    combat.traumaTarget: { groups: [combat], priority: 2 }
    move.value: { groups: [combat], priority: 1 }

    encumbrance.readied:
      groups: [encumbrance]
      priority: 0
      with: [{ field: encumbrance.readied.max, as: max }]
    encumbrance.readied.max: { groups: [encumbrance], priority: 1 }
    encumbrance.stowed:
      groups: [encumbrance]
      priority: 0
      with: [{ field: encumbrance.stowed.max, as: max }]
    encumbrance.stowed.max: { groups: [encumbrance], priority: 1 }
    encumbrance.strength: { groups: [encumbrance], priority: 2 }
    encumbrance.overload: { groups: [encumbrance], priority: 1 }

    mutations.points.total: { groups: [mutations], priority: 1, showWhen: mutations.mutant }
    mutations.points.spent: { groups: [mutations], priority: 1, showWhen: mutations.mutant }
    mutations.points.left: { groups: [mutations], priority: 0, showWhen: mutations.mutant }
    mutations.negatives: { groups: [mutations], priority: 2, showWhen: mutations.mutant }
    mutations.stigmaConcealed: { groups: [mutations], priority: 1, showWhen: mutations.mutant }
    stigma.part: { groups: [mutations], priority: 1, showWhen: mutations.mutant }
    stigma.part2: { groups: [mutations], priority: 2, showWhen: mutations.mutant }
    stigma.nature: { groups: [mutations], priority: 1, showWhen: mutations.mutant }
    stigma.detail: { groups: [mutations], priority: 1, showWhen: mutations.mutant }

    'skills.{skill}.level':
      rolls: [{ action: skill-check, params: { skill: 'skills.{skill}.level' } }]
    saves.physical: { rolls: [{ action: save, params: { save: saves.physical } }] }
    saves.evasion: { rolls: [{ action: save, params: { save: saves.evasion } }] }
    saves.mental: { rolls: [{ action: save, params: { save: saves.mental } }] }
    saves.luck: { rolls: [{ action: save, params: { save: saves.luck } }] }
