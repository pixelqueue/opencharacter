edges.educated.name: 'Educated'
edges.educated.description: 'You may pick a bonus skill of your choice. Whenever you gain skill points from character level advancement, you get a bonus skill point.'
edges.face.name: 'Face'
edges.face.description: 'Gain Connect as a bonus skill. Once per game week, whenever it’s convenient, gain one temporary Acquaintance Contact of your choice, describing them in any way the GM finds acceptable. You lose touch with this Contact after you use this Edge again, but you can use this Edge to connect with them again at a different time. You may also provide favors or payment sufficient to cement the relationship at the GM’s discretion.'
edges.focused.name: 'Focused'
edges.focused.description: 'You begin play with an extra Focus pick. You may choose this Edge more than once.'
edges.ghost.name: 'Ghost'
edges.ghost.description: 'You are uncannily elusive. Gain Sneak as a bonus skill and the Fighting Withdrawal combat action is an On Turn action for you. Once per scene, reroll a failed Sneak check related to sneaking or going unseen. Once per game day, as a Move action, move up to 10 meters without anyone around you seeing you move. If you use this movement to get behind cover, you might seem to vanish outright to onlookers.'
edges.hacker.name: 'Hacker'
edges.hacker.description: 'Gain Program as a bonus skill. You may begin play with an installed Cranial Jack cybersystem, a scrap deck, and eight program elements of your choice among available Verbs and Subjects. Each round, you gain a bonus Main Action that can only be used to perform hacking or cyberspace-related mental actions. This does not include drone piloting or vehicle driving.'
edges.hard-to-kill.name: 'Hard To Kill'
edges.hard-to-kill.description: 'Instead of rolling 1d6 per level for your hit points, you roll 1d6+2. Your base Trauma Target increases by +1, turning the base 6 into 7.'
edges.killing-blow.name: 'Killing Blow'
edges.killing-blow.description: 'Gain a combat skill as a bonus skill. Whenever you inflict hit point damage on something, whether by weapon, Shock, special ability, or any other source, the damage is increased by 1 point per two character levels, rounded up. Any Trauma Die you roll gains a +1 bonus.'
edges.masterful-expertise.name: 'Masterful Expertise'
edges.masterful-expertise.description: 'Once per scene, as an Instant action, reroll a failed check for a non-combat skill.'
edges.on-target.name: 'On Target'
edges.on-target.description: 'Gain a combat skill as a bonus skill. Your basic attack bonus is equal to your character level, instead of the usual half level, rounded down.'
edges.prodigy.name: 'Prodigy'
edges.prodigy.description: 'Pick an attribute other than Constitution; its score becomes 18 and it grants a +3 modifier instead of +2. Characters benefiting from the Underdog Rule can’t take this Edge.'
edges.prodigy.choices.attribute.prompt: 'Prodigy attribute'
edges.prodigy.prerequisites.not-underdog: 'Not for characters benefiting from the Underdog Rule'
edges.operators-fortune.name: 'Operator’s Fortune'
edges.operators-fortune.description: 'You may or may not be good, but you are undeniably lucky. Once per game session as an Instant action, when something bad happens to you such as an injury, a failed save, or a botched skill check, test your luck and roll 1d6. On a 1, the bad event is unaffected. On a 2-5, you somehow avert the consequences by blind chance. On a 6, it actually lands on an enemy or rival of the GM’s choice, if that’s possible. Only events that happened in this same round can be averted.'
edges.veterans-luck.name: 'Veteran’s Luck'
edges.veterans-luck.description: 'Once per scene, as an Instant action, trigger this ability to gain one of two effects: an attack roll that just hit you is instead treated as a miss, or an attack roll you just made that missed is instead treated as a hit. This ability can be applied to vehicle weapons used by the operator, but it cannot protect against environmental damage, vehicle crashes, falls, or other harm that doesn’t involve an attack roll.'
edges.voice-of-the-people.name: 'Voice of the People'
edges.voice-of-the-people.description: 'You are a rocker, graffiti artist, poet, demagogue, or other rabble-rouser with a considerable reputation. You gain both levels of the Pop Idol Focus and an additional Friend Contact related to your art.'
edges.wired.name: 'Wired'
edges.wired.description: 'You may begin play with up to $200,000 worth of new or secondhand cyber. If secondhand, you roll once per system for its defect and may end up with unusable junk. You don’t need to pay for installation and its maintenance is covered for the next two months. You can redeem this Edge later in your career by paying double the cost of the cyber you selected; if so, you can trade this Edge in for a different one with the GM’s approval.'
edges.graced.name: 'Graced'
edges.graced.description: 'You have innate magical abilities that enhance your physical or mental prowess. You gain the Graced powers and hindrances described in section 6.3.0.'
edges.spellcaster.name: 'Spellcaster'
edges.spellcaster.description: "You are a mage, capable of casting spells as described in section 6.1.0and suffering a mage's limits in using cyberware."
edges.summoner.name: 'Summoner'
edges.summoner.description: 'You are a summoner, capable of calling up spirit servants as described in the summoning rules, though you also have limits in using cyberware.'
edges.prodigy.choices.attribute.options.str.name: 'Strength'
edges.prodigy.choices.attribute.options.dex.name: 'Dexterity'
edges.prodigy.choices.attribute.options.int.name: 'Intelligence'
edges.prodigy.choices.attribute.options.wis.name: 'Wisdom'
edges.prodigy.choices.attribute.options.cha.name: 'Charisma'
