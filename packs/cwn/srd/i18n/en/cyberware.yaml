syndromes.brutal.name: 'Brutal'
syndromes.brutal.description: 'Your hardware isn’t meant to be restrained. It hurts to leave the limiters on; the confirmation prompts keep blaring in your brain and it feels like you’re suffocating when you don’t let them work according to spec. Sub-optimal performance feels like something sharp digging in your head. Effect: You cannot engage in non-lethal combat, though you don’t necessarily need to coup de grace downed foes. Check for Alienation each round you attack someone with non-lethal intent.'
syndromes.candid.name: 'Candid'
syndromes.candid.description: 'The processors feed you information so quickly and so smoothly that your meat brain barely has time to process it. If you try to slow it down, it hurts, so it’s easier to just let it run. Effect: You instinctively answer any question with at least one sentence of truthful reply. Check for Alienation if you try to remain silent or avert this instinct for a scene.'
syndromes.cold.name: 'Cold'
syndromes.cold.description: 'The hormonal adjustments are fraying your ability to form emotional bonds with others. You intellectually may know they love you and you may have every reason to love them, but it’s a distant abstraction to you. It’s not a real feeling, like the hate, or lust, or longing that still sometimes sparks in you. You stick with your friends out of habit or rational calculation. Effect: You are unable to feel love or affection for others. Lose your closest Contact.'
syndromes.distant.name: 'Distant'
syndromes.distant.description: 'Everything’s so much clearer with the augs. You can see what you need to do, to say, to be, while those around you wallow in weak, fleshly delusion. Dealing with them is so very tiresome. Effect: Take a -1 penalty to all social skill checks.'
syndromes.exultant.name: 'Exultant'
syndromes.exultant.description: 'The chrome is perfect. If it breaks, you can just fix it. If you break, you can just get more chrome. You can’t be beaten, not for long, because the metal can do anything. Effect: Your overconfidence causes an automatic, unavoidable skill failure on a natural skill roll of 12.'
syndromes.fearless.name: 'Fearless'
syndromes.fearless.description: 'The combat augs are great for suppressing fear. Honestly, it feels so good that you just leave them on all the time. Being able to live your life without worry or anxiety is such a tremendous relief, even if it sometimes makes you overlook some things. Effect: Your maximum HP is decreased by 20%, rounded down, because your survival instincts are dulled. If an NPC, your Morale is 12.'
syndromes.hypervigilant.name: 'Hypervigilant'
syndromes.hypervigilant.description: 'Can’t sleep. Wireless push updates will eat me. Effect: Gain one permanent System Strain point due to persistent insomnia.'
syndromes.murderous.name: 'Murderous'
syndromes.murderous.description: 'You were wired to kill, and you can’t turn it off. The longer between kills, the more everything starts looking like a weapon, and everyone starts looking like a throat to cut. When it gets really bad, the wires won’t let you think of anything but your real purpose, what you made yourself to be. Effect: Must personally kill at least one person a week, or check for Alienation for each day beyond without a murder.'
syndromes.ravenous.name: 'Ravenous'
syndromes.ravenous.description: 'These senses are incredible; you’re seeing, or hearing, or feeling things human meat was never meant to experience. You want more, you need more, and you’ll do anything to get it. Effect: Pick a sensory vice. Check for Alienation each time you resist an easy opportunity to indulge it. Pay $100 per total permanent Alienation point per week in feeding it or check for Alienation.'
syndromes.savage.name: 'Savage'
syndromes.savage.description: 'Your cyber is telling you to kill. It’s constantly reminding you of active enemies or weak points on targets, and you have to keep rejecting confirmation prompts for killing blows. It’s only letting you think about trajectories and kill counts, about threats and unfinished terminations. You can’t think with a live enemy around. Effect: You can’t run from combat after you’ve suffered hit point damage in it. If you choose to flee, check for Alienation.'
syndromes.secretive.name: 'Secretive'
syndromes.secretive.description: 'Your social protocols know best. They’re telling you not to say that, warning you that you’ll ruin everything if you admit it. You’re supposed to say something better, something more appropriate, and the prompts keep screaming at you if you try to defy them. Effect: You cannot entirely truthfully answer any question that doesn’t relate to common knowledge or your wishes in a business transaction. If you do so, check for Alienation for each topic that’s truthfully discussed in a scene.'
syndromes.stressed.name: 'Stressed'
syndromes.stressed.description: 'The hardware is getting in the way of the wetware. The demands are aggravating an already weakened system, and it can’t take the strain. Effect: Your lowest attribute suffers a -1 modifier penalty, to a minimum of -3. If multiple attributes tie, pick one.'
