cyberware.aesthetic-augmentation-suite.name: 'Aesthetic Augmentation Suite'
cyberware.aesthetic-augmentation-suite.description: 'Any standard fleshmod can supply beauty, but an aesthetic augmentation suite provides not only a fleshmod’s versatility, but tailored pheromones, vocal harmonizers, social cue triggers, and an absolutely inhuman visual perfection. Subjects gain a Charisma score of 14, or a +2 score bonus if already 14 or greater, up to a maximum of 18.'
cyberware.assisted-glide-system.name: 'Assisted Glide System'
cyberware.assisted-glide-system.description: 'Retractable nanofiber wings and integral boost jets allow a limited degree of flight for the user of this implant. When leaping from a high place, they gain a flight Move speed of 30m for up to two kilometers before being forced to land. Gaining altitude requires a Dex/Exert skill check against difficulty 10, however, with failure forcing a landing, and the wings can’t carry them more than twice as high as the height they jumped from. By deploying the boost jets and wings as an Instant action, the user can ignore up to a hundred meters of falling damage.'
cyberware.banshee-module.name: 'Banshee Module'
cyberware.banshee-module.description: 'Resonant cavities are designed into the user’s torso, along with an advanced amplification system. They can reproduce any sound or voice they have heard before, and at maximum volume can be heard clearly up to five hundred meters away. Once per day, as a Main Action, this sound can be used to shatter normal glass in a ten-meter line in front of the user; creatures without ear protection in this area must make a Physical save or take 2d6 non-lethal damage.'
cyberware.cybernetic-infrastructure-baseline.name: 'Cybernetic Infrastructure Baseline'
cyberware.cybernetic-infrastructure-baseline.description: 'A set of standardized support implants provide a baseline degree of cyber-compatibility to a subject. They can ignore System Strain from cyber implants equal to 12 minus their Constitution score- so a PC with a Constitution of 9 could ignore three points worth of System Strain from cyber implants. PCs with a Con of 12 or more have no use for this system.'
cyberware.deadman-circuit.name: 'Deadman Circuit'
cyberware.deadman-circuit.description: 'A common corporate implant to discourage kidnapping and warelegging. Any attempt to remove any of the user’s cyber without the right access codes will fry that hardware unless a difficulty 13 Int/Heal skill check is made.'
cyberware.dermal-armor-trauma-shielding.name: 'Dermal Armor/Trauma Shielding'
cyberware.dermal-armor-trauma-shielding.description: 'A system that can only be installed on a user with at least one level of Dermal Armor, the trauma shielding addition adds +1 to the user’s Trauma Target. This benefit stacks with any existing Dermal Armor bonus to the roll.'
cyberware.emergency-stabilization-factor.name: 'Emergency Stabilization Factor'
cyberware.emergency-stabilization-factor.description: 'When brought to zero hit points by an injury that does not instantly kill them, the user automatically stabilizes, gaining one System Strain, and will regain consciousness at the end of the scene with 1 hit point. If they are already at maximum strain, this cyberware does not function.'
cyberware.fleshmod.name: 'Fleshmod'
cyberware.fleshmod.description: 'Careful surgery and support implants allow for a complete physical remolding within generally humanoid lines, including alterations of sex, height, cosmetic limbs such as tails or decorative ears, and overall weight. Reproductive ability is not conferred, but rumors persist of experimental mods that can grant even that.'
cyberware.full-body-conversion.name: 'Full Body Conversion'
cyberware.full-body-conversion.description: 'The user’s brain and central nervous system are transplanted into a cutting-edge synthetic shell at a cost and difficulty as if this cyber took 4 System Strain. Once converted, the subject has an effective Constitution of 20 for System Strain purpose, but cannot be healed by conventional first aid or medical drugs, requiring ten minutes of repair work with a toolkit to repair any amount of damage, and $250 worth of parts for each hit point to be restored. A full conversion borg no longer requires food, water, air, or sleep, but each day without the latter adds one System Strain due to the mental stress. The conversion requires twelve hours of maintenance every two weeks, and missing it will result in the user’s death in 2d6 days unless the omitted maintenance is performed. Current full-body conversion tech is unstable; after 1d4 years, the subject has a cumulative 5% death chance each year. Borgs do not take Major Injuries and gain a +6 bonus to their Trauma Target that stacks with existing bonuses.'
cyberware.hemosynthetic-filter-system.name: 'Hemosynthetic Filter System'
cyberware.hemosynthetic-filter-system.description: 'A wide-spectrum array of blood scrubbers, intake filters, and microbial barriers grants the user effective immunity to most natural diseases and non-synthetic toxins. Weaponized toxins and certain exotic natural afflictions can still affect the user, but they get a +2 bonus on all saving throws against them. The system automatically alerts the user if they have been exposed to a recognized disease or toxin, whether or not it affects them.'
cyberware.holdout-cavity.name: 'Holdout Cavity'
cyberware.holdout-cavity.description: 'A biosculpted torso pocket allows for the air-tight, climate-controlled concealment of 2 Encumbrance worth of items inside the user’s body and their easy access with a Main Action. Any given object stored can’t be larger than a pistol or a tightly-folded suit of clothing, and the pocket’s contents don’t count against the user’s Encumbrance limit. The pocket’s signature is disguised against conventional scanning technology, and it cannot be detected without a manual strip search by a trained examiner.'
cyberware.medical-support-readout.name: 'Medical Support Readout'
cyberware.medical-support-readout.description: 'A diagnostic system is interfaced with the user’s biological processes, allowing a realtime analysis of their current health and any significant injuries. Aside from immediately alerting the user when they are poisoned, diseased, or injured, it grants any healing or medical support skill check a +2 bonus thanks to the diagnostic information and increases first aid or drug healing by +2 HP per application.'
cyberware.recovery-support-unit.name: 'Recovery Support Unit'
cyberware.recovery-support-unit.description: 'A number of support systems and blood purification filters are installed. The user can absorb up to four points of System Strain incurred from healing or wound stabilization effects; this is a separate pool that recovers one point every night at the same time as the user’s natural System Strain recovers.'
cyberware.redundant-systems.name: 'Redundant Systems'
cyberware.redundant-systems.description: 'Several pieces of prosthetic support cyber are preemptively installed to mitigate future trauma. When the user takes a Major Injury, they may instead choose to have the Redundant Systems critically damaged instead of accepting the major injury roll result. Redundant Systems can be installed more than once, but the System Strain inflicted increases by one point each time.'
cyberware.retribution-shield.name: 'Retribution Shield'
cyberware.retribution-shield.description: 'Numerous small projectile launchers are embedded under synthetic skin. When triggered as an On Turn action, the user gains one System Strain to launch a cloud of shrapnel around them, acting as ground zero of a frag grenade explosion. The user has enough targeting control to avoid hitting allies in range. If grappling or grappled at the time, their opponent automatically takes maximum damage. Reloading the Retribution Shield takes five minutes, and the system will not function if the user is wearing suit-grade armor. Lesser armor can usually be tailored to expose adequate amounts of skin.'
cyberware.therapeutic-control-dampers.name: 'Therapeutic Control Dampers'
cyberware.therapeutic-control-dampers.description: 'A set of customized medical and therapeutic implants are used to control the side-effects of a partially-successful cyberware implant. For each implantation of this system, the user can choose to ignore one implant side-effect they currently suffer. The skill check to implant this system can fail, but it never induces any side effects on its own.'
cyberware.titan-gun-system.name: 'Titan Gun System'
cyberware.titan-gun-system.description: 'Usable only by full body conversion cyborgs or subjects with a Strength score of 18, this mount allows the installation of any man-portable Heavy weapon such as those given in the Weapons section. The user counts as a stable firing rest, and the weapon has two integral magazines of ammo, though it can be loaded by hand as well. The specific weapon mounted can be swapped during maintenance.'
cyberware.viper-sting.name: 'Viper Sting'
cyberware.viper-sting.description: 'A tool of assassins, a Viper Sting is a fang, fingernail needle, palm injector, or more exotic implement for injecting an unsuspecting target with a drug of the user’s choice. A Viper Sting can be loaded with up to four doses of pharmaceuticals, dispensed as the user wishes. If loaded with a toxin, it does 1d12 damage with a 1d10/x3 Trauma Die. If a tranquilizer is used, the damage is the same, but unconsciousness will result instead of death. A Viper Sting can only be effectively used as part of an Execution Attack, as an alert opponent can avoid it easily. This cyber inflicts a -2 penalty on any check to detect its presence.'
cyberware.courier-memory.name: 'Courier Memory'
cyberware.courier-memory.description: 'One unit of cranial Memory is installed with a subdermal upload pad. The person uploading the data can set a passphrase; while the implant user can erase the data, they can’t download it again without the passphrase, which is usually told only to the data’s intended recipient. Courier memory is exceptionally well-hidden and even medical scans take a -2 penalty to find it.'
cyberware.cranial-jack.name: 'Cranial Jack'
cyberware.cranial-jack.description: 'A discreetly-placed plug socket in the user’s head or neck allows interfacing with cyberdecks and gear equipped with a jack line. Cranial jacks can be modded with cyberdeck mods.'
cyberware.discretion-insurance-unit.name: 'Discretion Insurance Unit'
cyberware.discretion-insurance-unit.description: 'A small cranial bomb that can be keyed go off when it receives- or does not receive- certain codes or transmissions. Its unfortunate tendency to misfire its anti-removal protocols makes it an unpopular choice for use in anyone but the most disposable subjects. Removing this cyber is done at a +2 difficulty, and failure causes the death of the subject and a Physical save to avoid the death of the physician, with 5d6 damage taken on success.'
cyberware.eye-mod-dazzler.name: 'Eye Mod/Dazzler'
cyberware.eye-mod-dazzler.description: 'This mod can emit a dazzling strobe of intense light, dazing and disorienting those standing up to five meters in front of the user. The strobe is triggered up to once per round as an On Turn action and adds one System Strain. Victims without eye protection must make a Physical saving throw or take a -4 penalty to their AC and hit rolls for the next 1d6 rounds. A victim can be targeted by this dazzling only once per scene.'
cyberware.eye-mod-flechette-launcher.name: 'Eye Mod/Flechette Launcher'
cyberware.eye-mod-flechette-launcher.description: 'A holdout weapon designed for surprise short-ranged attacks, this eye has been loaded with a small explosive flechette. It has the statistics of a light pistol, has a range of 10 meters, and requires a Main Action to reload its single-round magazine. If used against a target in melee range who does not suspect its existence, a normal hit roll is made; on a miss, it does full normal damage anyway, and on a hit, the damage is doubled. It can be used for Execution Attacks.'
cyberware.funes-complex.name: 'Funes Complex'
cyberware.funes-complex.description: 'A synthetic eidetic memory is granted by this implant, with formalized bodies of knowledge easily cross-referenced and recollected. Once per day, as an Instant action, reroll any failed Int-based skill check. This memory can be difficult to control, however, and unwanted allusions can overwhelm the desired datum. If the user rolls a natural 2 on any Int skill check, it automatically fails and cannot be recovered by any rerolling ability.'
cyberware.medusa-implant.name: 'Medusa Implant'
cyberware.medusa-implant.description: 'These prehensile cranial tendrils take multiple forms, from thick armored cables to bundles of brightly-colored articulated polymer fibers not unlike normal hair. The tendrils are shoulder-length under most circumstances, but can extend to manipulate objects up to three meters distant with the agility of a human hand. The bundles are not very strong, however, and cannot lift more than ten kilograms. Like other extra limbs, they do not grant extra actions, but can hold and use items as any other limb could.'
cyberware.neural-buffer.name: 'Neural Buffer'
cyberware.neural-buffer.state.bufferUsed.name: 'Buffer absorbed'
cyberware.neural-buffer.description: 'A system favored by hackers, a Neural Buffer rearranges the user’s brain topography, making it more difficult to harm the user with neural feedback. The user gains an additional 3 hit points per level that can only absorb cyberspace damage from Stun or Kill Verbs. These phantom hit points refresh completely each hour.'
cyberware.skull-citadel.name: 'Skull Citadel'
cyberware.skull-citadel.description: 'The user’s head is augmented with independent blood oxygenation pumps, armor plating, and trauma buffers designed to keep the brain intact even after the rest of the body is critically damaged. Barring dismemberment or the use of high-powered ammunition directly on the target’s head, the subject ignores head-affecting Major Injuries and can be stabilized even as long as ten minutes after their technical “death”. Each such delayed revivification permanently reduces a randomly-chosen attribute by 2 points, however. This ability damage cannot be undone.'
cyberware.dermal-armor-i.name: 'Dermal Armor I'
cyberware.dermal-armor-i.description: 'Subtle dermal weave reinforcement grants a base ranged and melee AC of 16 and a +1 bonus to the user’s Trauma Target.'
cyberware.dermal-armor-ii.name: 'Dermal Armor II'
cyberware.dermal-armor-ii.description: 'Heavier subcutaneous plating acts as Dermal Armor I with a base ranged and melee AC of 18. In addition, the user can ignore the first instance of Shock in a round.'
cyberware.dermal-armor-iii.name: 'Dermal Armor III'
cyberware.dermal-armor-iii.description: 'Overt ceramic body plating and double-mesh joint reinforcement acts as Dermal Armor II, but with a base ranged and melee AC of 20 and +2 to the user’s Trauma Target.'
cyberware.poseidon-implants.name: 'Poseidon Implants'
cyberware.poseidon-implants.description: 'These implants allow the user to function normally while submerged for an indefinite period, drawing any necessary oxygen or drinking water from the surrounding salt or freshwater. Normal temperature extremes are managed without difficulty, and pressure can be handled down to depths of one kilometer. Visual augments and pressure gradient sensors allow the equivalent of normal sight up to 30 meters even in lightless water, and miniaturized support jets allow three-dimensional movement at twice the user’s normal Move rating.'
cyberware.sealed-systems-implant.name: 'Sealed Systems Implant'
cyberware.sealed-systems-implant.description: 'When triggered as an Instant action, implanted shields deploy and skinweaves energize to seal the user off from hostile external environments. For the next six hours, the user can operate as if wearing a vacuum suit, ignoring vacuum, contact poisons, non-immediately-lethal levels of radiation, toxic gases, low or high-pressure atmospheres, and environmental temperature hazards short of open flame. After deployment, the implant needs an equal time of recovery before it can be deployed again.'
cyberware.sharkskin-electrodes.name: 'Sharkskin Electrodes'
cyberware.sharkskin-electrodes.description: 'An implanted mesh of electrodes beneath the user’s skin allows them to deliver debilitating shocks while grappling a target, even if both are heavily clothed. At the end of each round of grappling, the user inflicts 2d6 non-lethal electrical damage on anyone they grapple or who is grappling them. The shielding built into the cyber automatically negates non-lethal electrical damage for the user and halves lethal shocks.'
cyberware.skinmod.name: 'Skinmod'
cyberware.skinmod.description: 'Various neon tattoos, skin texture and color changes, and other superficial physical mods can be performed with no real systemic burden beyond the usual need for regular maintenance.'
cyberware.skyborn-shielding.name: 'Skyborn Shielding'
cyberware.skyborn-shielding.description: 'A set of implants and skin treatments meant for those who spend extended periods in hard vacuum, this implant can be triggered as an Instant action. When deployed, the user gains the benefits of a Sealed Systems Implant and low-G microjets that allow 30m/round flight in microgravity conditions. Skyborn Shielding can operate for up to 72 hours before needing an hour of downtime to regenerate.'
cyberware.body-blades-i.name: 'Body Blades I'
cyberware.body-blades-i.description: 'Assorted retractable blades and spikes are implanted in the user’s limbs. Their unarmed attacks do 1d8 damage, Shock of 2/15, Trauma Die 1d8/x3 and can be rolled with either Stab or Punch as the relevant combat skill. The Punch skill does not add damage to Body Blades attacks. When not in use, the blades are perceptible only to a medical scan.'
cyberware.body-blades-ii.name: 'Body Blades II'
cyberware.body-blades-ii.description: 'As level one, but the user’s body armament includes not only conventional blades, but assorted improvements such as monomolecular edges, cutting vibrations, or thermal augmentation. Their unarmed attacks do 2d6 damage with a Shock of 4/15, and a Trauma Die 1d10/x3. Anyone who sees or touches their arms can detect signs of the cyber, however.'
cyberware.cyberlimb.name: 'Cyberlimb'
cyberware.cyberlimb.description: 'A standard medical-grade cyberlimb, albeit one Encumbrance worth of non-weapon equipment or storage can be implanted in each limb and remain Readied without counting against the character’s Encumbrance. Add the equipment cost to the limb. The limb provides power to any electronic equipment implanted.'
cyberware.iron-hand-aegis.name: 'Iron Hand Aegis'
cyberware.iron-hand-aegis.description: 'Absorption plates and kinetic ablation units are implanted in the user’s arms and linked with a reactive ballistic calculator. Once per scene, as an Instant action, the user can deflect a successful ranged bullet, arrow, or thrown weapon attack, including burst or suppressive fire. Surprise attacks cannot be deflected this way, nor can melee attacks or explosives.'
cyberware.limbgun.name: 'Limbgun'
cyberware.limbgun.description: 'A ranged weapon is implanted into an arm, tail, or other significant limb, along with space for two magazines worth of ammunition. A full reload of this space can be accomplished as a Main Action. Limbguns can be used with Gunlink cyber, count as Readied at all times, and can be used even while both hands are occupied, but can be bound up in melee as normal guns can. Limbguns have an intrinsic +1 hit bonus, in addition to whatever bonus the implanted weapon may have. The maximum size of the gun is Encumbrance 1 for legs or neolimb tails, or Encumbrance 2 for arms. The buyer must supply the gun. Different guns can be swapped in as desired during the system’s monthly maintenance, but once implanted, a gun is useless for later conventional use.'
cyberware.muscle-fiber-replacement-i.name: 'Muscle Fiber Replacement I'
cyberware.muscle-fiber-replacement-i.description: 'Artificial muscle fibers are implanted as replacements for the user’s own flesh. The subject gains a Strength score of 14, or +2 if already 14 or higher.'
cyberware.muscle-fiber-replacement-ii.name: 'Muscle Fiber Replacement II'
cyberware.muscle-fiber-replacement-ii.description: 'The subject gains a Strength score of 18, and can smash through standard interior doors or equivalent barriers as a Move action.'
cyberware.neolimb.name: 'Neolimb'
cyberware.neolimb.description: 'The user gains an additional limb that normal humans lack. Usual choices involve an additional pair of arms or manipulatory mechano-tentacles, though functional prehensile tails are popular too. One installation of the cyber covers paired limbs or a single tail or body-mounted tendril up to 3 meters long. Neolimbs can support up to one Encumbrance point of non-weaponry built-in tech and add two items to the user’s Readied encumbrance allowance. Neolimbs can hold or grip objects, but cannot employ additional shields or grant extra actions.'
cyberware.omnihand.name: 'Omnihand'
cyberware.omnihand.description: 'A full array of small mechanical and electronic tools are folded into this cybernetic hand. The user is never without the tools for relevant skill checks, and once per day as an Instant action can gain +1 on any skill check involving the omnihand’s tool use. As an improvised weapon, the tools do damage as a knife.'
cyberware.shock-fists.name: 'Shock Fists'
cyberware.shock-fists.description: 'The user’s hands are implanted with subdermal electrical webbing. As an Instant action, accept one System Strain; for the rest of the scene, the user’s unarmed attacks do an additional 1d8 electrical damage on a successful hit. Unarmed attacks augmented with this mod are non-lethal if desired. This system does not stack with Body Blades.'
cyberware.stick-pads.name: 'Stick Pads'
cyberware.stick-pads.description: 'Macroscale van der Waals generators allow the user’s hands and feet to stick to vertical or overhanging surfaces, their full weight supported by one arm. They can climb such surfaces at their full movement rate with one free hand.'
cyberware.synthlimb.name: 'Synthlimb'
cyberware.synthlimb.description: 'A high-grade cyberlimb that’s indistinguishable from an organic body part by anything short of a medical examination. It functions as a Cyberlimb for purposes of implanted equipment.'
cyberware.active-sense-processor.name: 'Active Sense Processor'
cyberware.active-sense-processor.description: 'Augmented sensory processing grants a +1 Wisdom modifier for all skill checks involving sensing or noticing things, up to a +2 modifier maximum.'
cyberware.cyberears.name: 'Cyberears (pair)'
cyberware.cyberears.description: 'While normal in appearance, touch reveals the synthetic nature of these ears. Some owners prefer to style them in fanciful or unnatural ways. While the base model provides only normal human hearing, all are equipped with ear protection against loud noises. A pair of cyberears or synthears halves the System Strain cost of ear implants.'
cyberware.cybereyes.name: 'Cybereyes (pair)'
cyberware.cybereyes.description: 'While a single cybernetic eye can be implanted, it is recommended that both be replaced at the same time to improve neural adaptation. These cybereyes are clearly artificial, though most are styled in attractive or striking fashions. They all have perfect 20/20 vision and integral flash protectors, but additional functionality must be implanted separately. A user with a pair of cybereyes or syntheyes halves the System Strain cost of cybernetic eye implants.'
cyberware.ear-mod-filter.name: 'Ear Mod/Filter'
cyberware.ear-mod-filter.description: 'The user’s sense of hearing is sharpened remarkably, allowing them to follow individual conversations in a noisy crowd, eavesdrop on whispers up to twenty meters distant, and gain a +2 bonus on all hearing-related Notice checks.'
cyberware.ear-mod-positional-detection.name: 'Ear Mod/Positional Detection'
cyberware.ear-mod-positional-detection.description: 'This ear mod constructs a spatial map of significant surrounding sounds, allowing the user to know the exact location of anything making audible noise. The precise location of distant shooters, the location of targets in visual concealment, and the positions of moving creatures in darkness are all clear.'
cyberware.ear-mod-sonar.name: 'Ear Mod/Sonar'
cyberware.ear-mod-sonar.description: 'The user can navigate even in darkness or while blinded by means of ultrasonic sensors, being able to construct a crude map of people and obstacles in front of them out to 20 meters. This sense is the equivalent of vision, though it can’t discern details more subtle than faces.'
cyberware.ear-mod-tracer.name: 'Ear Mod/Tracer'
cyberware.ear-mod-tracer.description: 'As an On Turn action, the user can nominate a target within 20 meters. Until they get more than 100 meters away from the user or pass behind a solid barrier, the implant’s hyper-specific hearing can track their motions perfectly and overhear anything they say or that is said to them. The user can listen to one such target at a time.'
cyberware.eye-mod-impostor.name: 'Eye Mod/Impostor'
cyberware.eye-mod-impostor.description: 'Aside from allowing free alteration of eye color, this mod allows the user to copy another person’s retinal patterns. Provided they are within two meters, they need only meet the user’s gaze for a few moments to get a good imprint. The eye can store up to a dozen imprints, but it takes a Main Action to shift from one to another. Note that it is a relatively simple procedure to alter a person’s retinal pattern, so an important target alerted to the imposture may end up changing their imprint.'
cyberware.eye-mod-infrared-vision.name: 'Eye Mod/Infrared Vision'
cyberware.eye-mod-infrared-vision.description: 'The infrared vision this mod allows permits basic navigation in dark areas and makes the presence of heat sources such as humans, engines, and infrared tripwires very obvious. The user gains a +1 bonus on any Notice checks to detect the presence of thermally-unshielded living creatures.'
cyberware.eye-mod-low-light-vision.name: 'Eye Mod/Low Light Vision'
cyberware.eye-mod-low-light-vision.description: 'This mod grants low-light vision, allowing clear sight to normal distances in any light condition better than pitch blackness.'
cyberware.eye-mod-tactical-view.name: 'Eye Mod/Tactical View'
cyberware.eye-mod-tactical-view.description: 'These eyes can receive text or video transmissions and play them on an inset in the user’s normal vision. Outline and pattern discrimination is enhanced; when specifically looking for things or keeping watch, gain a +1 bonus to any relevant Notice check.'
cyberware.eye-mod-zoom.name: 'Eye Mod/Zoom'
cyberware.eye-mod-zoom.description: 'The user’s vision can zoom in on distant targets. The user can see objects within 500 meters as if they were standing next to them. The hit penalty for a ranged weapon’s long range is eliminated.'
cyberware.gunlink.name: 'Gunlink'
cyberware.gunlink.description: 'Hardwired control points interface with the onboard targeting systems of most modern firearms. When using a modern firearm, the PC ignores range penalties and negates up to 2 points of hit penalties for cover, concealment, or prone targets. Once per scene, as an Instant action, they can reroll a missed attack roll with a gun.'
cyberware.headcomm.name: 'Headcomm'
cyberware.headcomm.description: 'An implanted phone/short-range radio that can directly communicate within 100 meters or use the phone grid, if it’s available. For cranial security reasons, only text and voice can be transmitted, but conversations can be held without audible vocalization.'
cyberware.sensory-recorder.name: 'Sensory Recorder'
cyberware.sensory-recorder.description: 'The user can record up to 180 minutes of sensory input. If they have a jack line into a transmitter or cyberware capable of transmitting data, they can share these recordings in real time or afterwards.'
cyberware.synthears.name: 'Synthears (pair)'
cyberware.synthears.description: 'This model of artificial ear is designed to be indistinguishable from normal ears, though they have all the properties of a normal pair of cyberears.'
cyberware.syntheyes.name: 'Syntheyes (pair)'
cyberware.syntheyes.description: 'These high-end cybereyes are designed to be indistinguishable from normal eyes under anything short of a medical examination. Any additional mods made to the eyes share this subtlety'
cyberware.prosthetic-cyber-i.name: 'Prosthetic Cyber I'
cyberware.prosthetic-cyber-i.description: 'One of an array of minimally-adequate and very obvious organ replacements, eye prosthetics, neural patches, and other medical cyber. Prosthetic cyber grants no benefits over ordinary flesh, but can mitigate a Major Injury as Major Injuries explain. Patients who’ve lost an arm or leg don’t need this cyber; they need a serviceable new limb system such as a Cyberlimb or Synthlimb.'
cyberware.prosthetic-cyber-ii.name: 'Prosthetic Cyber II'
cyberware.prosthetic-cyber-ii.description: 'A more sophisticated and expensive version of basic prosthetic cyber, inobvious to anything but a medical scan and far less burdensome on the user’s system.'
cyberware.regulated-anagathic-substrate.name: 'Regulated Anagathic Substrate'
cyberware.regulated-anagathic-substrate.description: 'This whole-body network of chem regulators can prolong human lifespans by up to 1d4+2 decades. Maintenance on this cyber costs $50,000 a month, however, and interruptions have catastrophic consequences. Rumors persist of even more effective models existing among the megacorp ultra-elite.'
cyberware.coordination-augment-i.name: 'Coordination Augment I'
cyberware.coordination-augment-i.description: 'The user’s natural mind-body interface is tightened. The subject gains a Dexterity score of 14, or +2 if already 14 or higher.'
cyberware.coordination-augment-ii.name: 'Coordination Augment II'
cyberware.coordination-augment-ii.description: 'As Coordination Augment I, but the subject gains a Dexterity score of 18, and their base Move rate is increased by 10 meters.'
cyberware.enhanced-reflexes-i.name: 'Enhanced Reflexes I'
cyberware.enhanced-reflexes-i.description: 'Neural acceleration matrices can be deployed to briefly boost the user’s reaction speed. Once per scene, as an On Turn action, the user gets a bonus non-cyberspace Main Action.'
cyberware.enhanced-reflexes-ii.name: 'Enhanced Reflexes II'
cyberware.enhanced-reflexes-ii.description: 'Once per scene, as an On Turn action, the user gains a bonus non-cyberspace Main Action and Move action. By accepting one System Strain, this ability can be used as an Instant action, potentially interrupting incoming attacks if the user moves out of reach.'
cyberware.enhanced-reflexes-iii.name: 'Enhanced Reflexes III'
cyberware.enhanced-reflexes-iii.description: 'Twice per scene, as an On Turn action up to once per round, the user gains a bonus non-cyberspace Main Action and bonus Move Action. By accepting one System Strain, this ability can be used as an Instant action.'
cyberware.reaction-booster-i.name: 'Reaction Booster I'
cyberware.reaction-booster-i.description: 'These implants grant a +2 bonus to your Initiative, perhaps making you act before the rest of your team. Once per scene, as an Instant action, ignore Snap Attack hit penalties.'
cyberware.reaction-booster-ii.name: 'Reaction Booster II'
cyberware.reaction-booster-ii.description: 'As level one, but the user automatically wins initiative against targets that don’t also automatically win initiative; if both have this ability, initiative is rolled without modifications. The user can act normally during surprise rounds.'
cyberware.remote-control-unit.name: 'Remote Control Unit'
cyberware.remote-control-unit.description: 'A neurally-integrated control link allows for near-range control of drones or remote-rigged vehicles, as per the drone control rules.'
cyberware.skillplug-jack-i.name: 'Skillplug Jack I'
cyberware.skillplug-jack-i.description: 'A discreet head-mounted plug port allows use of an intellectual skillplug for a skill requiring minimal physical ability, up to level-1. Once slotted, a skillplug takes fifteen minutes to boot up and integrate properly.'
cyberware.skillplug-jack-ii.name: 'Skillplug Jack II'
cyberware.skillplug-jack-ii.description: 'This improved plug jack allows use of either an intellectual skillplug or one requiring physical expertise, up to level-1.'
cyberware.skillplug-wiring.name: 'Skillplug Wiring'
cyberware.skillplug-wiring.description: 'A neural wiring connection improves a skillplug jack’s limits to allow up to level-3 skill usage. One set of wires can support any number of jacks, but at least one is needed.'
cyberware.trajectory-optimization-node.name: 'Trajectory Optimization Node'
cyberware.trajectory-optimization-node.description: 'This cyber can calculate the optimal path for bypassing defenses and striking a target. Once per scene, as an Instant action, turn a missed hit roll into a success. Melee and unarmed attacks can be used as-is, but using this unit with a ranged attack requires an active Gunlink with the weapon.'
cyberware.zombie-wires.name: 'Zombie Wires'
cyberware.zombie-wires.description: 'Functioning only for a user with at least one Body cybersystem to serve as a motor substrate, “zombie wires” allow a user to keep functioning even at zero hit points. As an Instant action at zero hit points, the user can give their body a one-sentence command involving physical action. Their insensate flesh will blindly carry out that action for up to six rounds until it is complete or they take up to one quarter of their maximum hit points in further damage, which will kill them instantly. Time spent under Zombie Wires counts against a user’s stabilization time limit. Triggering this cyber adds 2 System Strain.'
cyberware-mods.biocapacitors.name: '{base} (biocapacitors)'
cyberware-mods.biocapacitors.description: |-
  The first System Strain cost that the cyber would normally exact in a day is ignored. Thus, the first time an Enhanced Reflexes system is triggered, it would not add System Strain to the modded user.

  *Fix-1 and Heal-2, 30% of the system’s cost, 1 special component.*
cyberware-mods.durable-system.name: '{base} (durable system)'
cyberware-mods.durable-system.description: |-
  A limb or eye system is up-armored to resist injury. The next Major Injury directed at the modded limb is treated as if it were just a flesh wound roll of 12. It destroys this mod instead.

  *Fix-1 and Heal-1, 20% of the system’s cost.*
cyberware-mods.firewalled.name: '{base} (firewalled)'
cyberware-mods.firewalled.description: |-
  The modded system is much harder to hack, inflicting a -2 penalty on any related skill checks.

  *Fix-1 and Heal-1, 20% of the system’s cost.*
cyberware-mods.hardened-weave.name: '{base} (hardened weave)'
cyberware-mods.hardened-weave.description: |-
  Skin cyber that grants an improved base armor class such as Dermal Armor has any AC it grants improved by +2. The additional armor makes the system Obvious, regardless of its original subtlety, and counts as one item of Readied encumbrance that cannot be dropped.

  *Fix-2 and Heal-1, 30% of the system’s cost.*
cyberware-mods.low-maintenance.name: '{base} (low maintenance)'
cyberware-mods.low-maintenance.description: |-
  The modded system no longer requires any significant maintenance. This mod does not work on systems with special maintenance costs or consequences, such as a Full Body Conversion or a Regulated Anagathic Substrate.

  *Fix-2 and Heal-2, 10% of the system’s cost, 1 special component.*
cyberware-mods.monoblade.name: '{base} (monoblade)'
cyberware-mods.monoblade.description: |-
  A bladed cyber system has advanced monomolecular cutting elements installed. The edge is difficult to maintain but inflicts horrific injuries when it strikes cleanly. The weapon’s Trauma Die gets a +1 bonus, but its base damage die and Shock is decreased by -2.

  *Fix-2 and Heal-1, 20% of the system’s cost.*
cyberware-mods.profile-adjustment.name: '{base} (profile adjustment)'
cyberware-mods.profile-adjustment.description: |-
  The system’s obviousness is lowered by one step, from Sight to Touch, or Touch to Medical. It has no benefit for a system that is already at a Medical grade of concealment.

  *Fix-1 and Heal-2, 20% of the system’s cost.*
cyberware-mods.quick-detach.name: '{base} (quick detach)'
cyberware-mods.quick-detach.description: |-
  Usable only on limb cyber, eyes, or other parts that could conceivably be removed, this mod allows the user to attach or detach the system with five minutes of work, and replace it with any other Quick Detach-modded system that would fit in the same place.

  *Fix-2 and Heal-2, 30% of the system’s cost.*
cyberware-mods.tailored-interface.name: '{base} (tailored interface)'
cyberware-mods.tailored-interface.description: |-
  A demanding cyber system is adjusted to specifically match the biochemistry of the user rather than using a factory-set best approximation. This mod only functions on cyber that inflicts 2+ points of permanent System Strain, but lowers the strain cost by 1 point.

  *Fix-1 and Heal-3, 30% of the system’s cost, 1 special component.*
cyberware-mods.targeting-processor.name: '{base} (targeting processor)'
cyberware-mods.targeting-processor.description: |-
  This mod must be installed in Gunlink, or in a weapon system such as Body Blades or Eye Mod/Flechette. Improved targeting calculations grant a +1 bonus to hit with the cyber-weapon or with guns aimed with the Gunlink system. An attack can only ever benefit from one instance of this mod.

  *Fix-2 and Heal-1, 30% of the system’s cost.*
cyberware-complications.unreliable.name: '{base} (unreliable)'
cyberware-complications.unreliable.description: "*Complication 1.* The first time each day that it's important that the system function, roll 1d6; on a 1, it's nonfunctional until it receives maintenance."
cyberware-complications.inefficient.name: '{base} (inefficient)'
cyberware-complications.inefficient.description: '*Complication 2.* The ware incurs an additional 0.5 System Strain cost.'
cyberware-complications.loud.name: '{base} (loud)'
cyberware-complications.loud.description: "*Complication 3.* When the system is operating, it's loud enough to be heard clearly five meters away, making stealth impossible. Systems that are always on make this noise constantly."
cyberware-complications.fussy.name: '{base} (fussy)'
cyberware-complications.fussy.description: '*Complication 4.* The required interval between maintenance is halved.'
cyberware-complications.bad-connection.name: '{base} (bad connection)'
cyberware-complications.bad-connection.description: "*Complication 5.* Each time the cyberware is triggered, there's a 1 in 6 chance it fails to activate and the action is wasted. Cyberware that is always on is not hindered by this."
cyberware-complications.blatant.name: '{base} (blatant)'
cyberware-complications.blatant.description: '*Complication 6.* Cyberware that normally requires Medical or Touch detection now becomes obvious on sight, perhaps due to excessive scarring or required surface-mount support.'
cyberware-complications.debilitating.name: '{base} (debilitating)'
cyberware-complications.debilitating.description: '*Complication 7.* Pick an attribute in some way relevant to the cyber. The attribute suffers a 1d2 point penalty to its base score that persists as long as the system remains implanted.'
cyberware-complications.uncooperative.name: '{base} (uncooperative)'
cyberware-complications.uncooperative.description: '*Complication 8.* Add 1 System Strain if this isn’t the only implant of the same category, such as Limb/Nerve/Body.'
cyberware-complications.complicated.name: '{base} (complicated)'
cyberware-complications.complicated.description: '*Complication 9.* The complexity of the installation increases the minimum skill level required to maintain it to either Fix-1 or Heal-1.'
cyberware-complications.exhausting.name: '{base} (exhausting)'
cyberware-complications.exhausting.description: "*Complication 10.* Maintenance on the system is exceptionally taxing. After it's done, the user needs to spend 24 hours of downtime resting; if they omit this, they gain 2 System Strain immediately."
cyberware-complications.power-hungry.name: '{base} (power hungry)'
cyberware-complications.power-hungry.description: '*Complication 11.* The user needs to supplement the system by plugging into an urban power grid or vehicle power port for a half-hour each day. Without this, the system goes inert until re-powered.'
cyberware-complications.petty-annoyance.name: '{base} (petty annoyance)'
cyberware-complications.petty-annoyance.description: '*Complication 12.* It has some small quirk or deficiency of fit that causes no real problem in its functionality.'
skillplugs.level-0.name: 'Level-0 Skillplug'
skillplugs.level-0.description: |-
  Commonly-available skillplugs can be found for any skill at level-0 or level-1. A basic Skillplug Jack I system can only interface with intellectual skills that require only modest physical expertise; Know, Fix, or Heal could qualify for this, but Shoot, Exert, or most forms of Perform would not. Such physical skills require an upgraded Skillplug Jack II unit.

  Someone with a plug jack and the Skillplug Wires implant can make use of rare, costly level-2 skillplugs, or the vanishingly rare level-3 plugs. Level-3 plugs are normally only available through special missions to obtain them.

  Whenever the user rolls a natural 2 on a skillplug-augmented skill check, or a natural 1 on a skillplug-augmented attack roll, the check or roll is an automatic failure that no reroll ability can save. The skillplug jack itself then locks up uselessly for the scene.

  While it is possible to implant multiple plug jacks and use multiple skillplugs at once, the increased neural crosstalk invariably increases the chance of severe error. Each additional skillplug run after the first increases the automatic failure roll range by one point.
skillplugs.level-0.choices.skill.prompt: 'Skill'
