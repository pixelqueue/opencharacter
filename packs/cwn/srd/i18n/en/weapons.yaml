weapons.big-club.description: 'Knives, clubs, swords, and other simple melee weapons are available almost anywhere on the street. Particularly impoverished gangers sometimes fashion makeshift machetes and improvised shivs when better can’t be obtained. Such weapons are effectively free, but have a -1 penalty to hit and damage rolls due to their ungainly make.'
weapons.advanced-knife.name: 'Advanced Knife'
weapons.advanced-knife.description: 'Advanced weapons employ modern polymers, sophisticated metallurgy, fractal edges, electro-stun tech, and a small legion of marketers to sell products that are distinctly superior to the plain steel edges of a prior age.'
weapons.advanced-sword.name: 'Advanced Sword'
weapons.advanced-sword.description: 'Advanced weapons employ modern polymers, sophisticated metallurgy, fractal edges, electro-stun tech, and a small legion of marketers to sell products that are distinctly superior to the plain steel edges of a prior age.'
weapons.advanced-big-sword.name: 'Advanced Big Sword'
weapons.advanced-big-sword.description: 'Advanced weapons employ modern polymers, sophisticated metallurgy, fractal edges, electro-stun tech, and a small legion of marketers to sell products that are distinctly superior to the plain steel edges of a prior age.'
weapons.advanced-club.name: 'Advanced Club'
weapons.advanced-club.description: 'Advanced weapons employ modern polymers, sophisticated metallurgy, fractal edges, electro-stun tech, and a small legion of marketers to sell products that are distinctly superior to the plain steel edges of a prior age.'
weapons.flash-grenade.name: 'Flash Grenade'
weapons.flash-grenade.description: |-
  Flash grenades force victims without eye and ear protection to make a Physical save; on a failure, the victim loses their next Main Action and takes a -2 penalty to hit rolls and AC for the next 1d6 rounds. Flashbang effects don’t stack, and a target who makes their save cannot be flashbanged again that same round.

  Grenades may be thrown at a point within range and always target AC 10. On a miss, the grenade bounces 1d10 meters in a random direction before exploding. Most grenades have a 5-meter radius of effect.
weapons.frag-grenade.name: 'Frag Grenade'
weapons.frag-grenade.description: |-
  Frag grenades inflict 2d6 damage on all victims in range, plus the chance for a Traumatic Hit. An Evasion save can halve a frag grenade’s damage, and each point of melee AC the target has above 14 reduces the final damage total by one point, possibly down to zero.

  Grenades may be thrown at a point within range and always target AC 10. On a miss, the grenade bounces 1d10 meters in a random direction before exploding. Most grenades have a 5-meter radius of effect.
weapons.gas-grenade.name: 'Gas Grenade'
weapons.gas-grenade.description: |-
  Gas grenades create a 10-meter-diameter cloud of opaque, choking, irritating gas that disperses in one round. They inflict non-lethal damage, halved on a successful Physical save, and are useless against targets with breathing protection. They provide full concealment for those within the gas. Smoke grenades are harmless, but provide the same 10-meter dome of concealment where it’s necessary. Gas and smoke aren’t enough to defeat IR or augmented visuals.

  Grenades may be thrown at a point within range and always target AC 10. On a miss, the grenade bounces 1d10 meters in a random direction before exploding. Most grenades have a 5-meter radius of effect.
weapons.smoke-grenade.name: 'Smoke Grenade'
weapons.smoke-grenade.description: |-
  Gas grenades create a 10-meter-diameter cloud of opaque, choking, irritating gas that disperses in one round. They inflict non-lethal damage, halved on a successful Physical save, and are useless against targets with breathing protection. They provide full concealment for those within the gas. Smoke grenades are harmless, but provide the same 10-meter dome of concealment where it’s necessary. Gas and smoke aren’t enough to defeat IR or augmented visuals.

  Grenades may be thrown at a point within range and always target AC 10. On a miss, the grenade bounces 1d10 meters in a random direction before exploding. Most grenades have a 5-meter radius of effect.
weapons.anti-materiel-rifle.name: 'Anti-Materiel Rifle'
weapons.anti-materiel-rifle.description: 'Anti-materiel rifles have encountered something of a renaissance with the ubiquity of armored drones and heavily cybered combatants. While not suitable for downing tanks or other heavily armored vehicles, their 20mm rounds are more than sufficient to punch through lighter armor plating, concrete walls, and full body conversion cyborgs. Use of a secure firing rest is recommended for best results.'
weapons.grenade-launcher.name: 'Grenade Launcher'
weapons.grenade-launcher.description: |-
  Grenade launchers are accessories that are mounted on rifle-sized firearms, adding 1 Encumbrance to their bulk. These weapons can launch specially-designed grenades to the listed range, targeting them as if they were thrown normally. These special grenades cost and function the same as their regular equivalents but cannot be thrown by hand. When attacking, the user can choose whether to fire the grenade launcher or the weapon it’s mounted to, but both cannot be fired in the same round.

  Stand-alone grenade launcher models are available for vehicle or drone mounting, counting as 2 Encumbrance but otherwise having the same cost and statistics.
weapons.demo-charge.name: 'Demo Charge'
weapons.demo-charge.description: 'Demo charges are shaped explosive charges usually meant to knock human-sized holes in anything short of fortified defensive walls. While ineffective as thrown weapons, when used as part of a trap or ambush they inflict their listed damage in a cone out to normal range, with an Evasion save for half damage. If applied carefully to a vehicle target, the following explosion will inevitably destroy it. Like frag grenades, use of demo charges tends to be very exciting to security forces and can provoke more heat than many operators like to draw.'
weapons.heavy-machine-gun.name: 'Heavy Machine Gun'
weapons.heavy-machine-gun.description: 'Heavy machine guns are old tech, but reliable. Without a fixed firing position or vehicle mount, however, their recoil makes them almost uncontrollable. Due to the mass of lead involved in firing an HMG, each “round” of its ammunition costs $100 and counts as a full item of encumbrance.'
weapons.mortar.name: 'Mortar'
weapons.mortar.description: |-
  Mortars are rare, but have their uses amid the tall buildings of an urban sprawl. They have a minimum range of 20 meters, but can lob indirect fire over buildings and obstacles. Mortars always target AC 20 at first, but each round of fire at the same target grants a +1 hit bonus if there’s a forward spotter to adjust the aim. Mortar rounds act as frag grenades on the target point, but do 3d6 damage at base with a 10-meter radius. Armor doesn’t lessen harm from mortar rounds.

  Relatively simple as they are, a mortar round costs $50 and counts as one item of encumbrance.
weapons.rocket-launcher.name: 'Rocket Launcher'
weapons.rocket-launcher.description: 'Rocket launchers include a wide variety of single-shot disposable launchers. Their general imprecision forces a -4 hit penalty against human-sized targets, but they inflict frag grenade damage on any target within 5 meters of the rocket’s landing point. Specialized anti-armor warheads lose this frag grenade bonus, but do double damage to vehicles or obstacles. Operators who intend to take down enemy vehicles favor them for their effectiveness in that role.'
weapons.land-mine-anti-personnel.name: 'Land Mine, Anti-Personnel'
weapons.land-mine-anti-personnel.description: 'Land mines come in anti-personnel and anti-vehicle flavors. The first activates on any human-sized approach within 1 meter, inflicting damage in a 2-meter radius with an Evasion save for half. Anti-vehicle mines can only be activated by vehicular levels of ground pressure or vehicle-sized proximate metal masses, but do their damage in a 5-meter radius. Humans get an Evasion save for half damage in either case.'
weapons.land-mine-anti-vehicle.name: 'Land Mine, Anti-Vehicle'
weapons.land-mine-anti-vehicle.description: 'Land mines come in anti-personnel and anti-vehicle flavors. The first activates on any human-sized approach within 1 meter, inflicting damage in a 2-meter radius with an Evasion save for half. Anti-vehicle mines can only be activated by vehicular levels of ground pressure or vehicle-sized proximate metal masses, but do their damage in a 5-meter radius. Humans get an Evasion save for half damage in either case.'
weapons.drone-cannon.name: 'Drone Cannon'
weapons.drone-cannon.description: 'Drone cannons are heavy semi-automatic weapons too bulky for human portability. A round of firing costs $100 worth of ammunition.'
weapons.headshot-pod.name: 'Headshot Pod'
weapons.headshot-pod.description: 'Headshot pods are a family of guided missiles meant for mounted deployment on vehicles or large drones. They always target AC 10 to hit, but require two full consecutive rounds of aiming at a visible target to get a target lock on them and prime for firing on the third round. Any bystanders within 5 meters of the impact take damage as if from a frag grenade. A headshot pod missile costs $2,000.'
weapons.main-tank-gun.name: 'Main Tank Gun'
weapons.main-tank-gun.description: 'Main Tank Gun        4d12!        1,000/3,000        $100,000@        1        Dex        N/A        1d20        x4'
weapons.mounted-autogun.name: 'Mounted Autogun'
weapons.mounted-autogun.description: 'Mounted autoguns are a drone cannon’s big brother, for larger platforms. Each round of firing costs $100.'
weapons.shrieker-gun.name: 'Shrieker Gun'
weapons.shrieker-gun.description: 'Shrieker guns are sonic cannons used for crowd control and non-lethal suppression. While highly effective against unprotected targets, military-grade ear protection or the integral dampers in cyber-ears are sufficient to render the weapon useless.'
weapons.unarmed.name: 'Unarmed Attack'
weapons.unarmed.description: 'If you are making a purely unarmed attack you may add your Punch skill to the damage. You may not add the skill to the damage done by Body Blade cyber or other artificial weaponry that uses the Punch skill.'
weapons.eye-flechette.name: 'Eye Flechette'
