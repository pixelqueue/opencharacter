weapons.light-pistol.name: 'Light Pistol'
weapons.light-pistol.description: 'Light and heavy pistols are categorized by the caliber of the bullet they fire. Some operators prefer the low recoil and high mag capacity possible with a low-caliber round, while others like to have a little more certainty in dropping the targets they hit.'
weapons.heavy-pistol.name: 'Heavy Pistol'
weapons.heavy-pistol.description: 'Light and heavy pistols are categorized by the caliber of the bullet they fire. Some operators prefer the low recoil and high mag capacity possible with a low-caliber round, while others like to have a little more certainty in dropping the targets they hit.'
weapons.advanced-bow.name: 'Advanced Bow'
weapons.advanced-bow.description: 'Advanced bows are used by a few specialists who prefer the near-silence that modern composites provide or the massive blood loss induced by a modern fractal broadhead carried on a fifty-gram arrow.'
weapons.rifle.name: 'Rifle'
weapons.rifle.description: 'Rifles and combat rifles are similar semi-automatic tech, though the latter is equipped with a burst-fire selector and usually trades the range of a heavier caliber for the ability to carry more ammunition.'
weapons.combat-rifle.name: 'Combat Rifle'
weapons.combat-rifle.description: 'Rifles and combat rifles are similar semi-automatic tech, though the latter is equipped with a burst-fire selector and usually trades the range of a heavier caliber for the ability to carry more ammunition.'
weapons.submachine-gun.name: 'Submachine Gun'
weapons.submachine-gun.description: 'Submachine guns are popular for their small form factor and convenient burst fire, though like other burst-fire weaponry the corps frown heavily on civilian possession.'
weapons.shotgun.name: 'Shotgun'
weapons.shotgun.description: 'Shotguns of various stripes can be found under the counter of practically every bar and shop in a slum. Simple double-barrel models can be made by any home gunsmith with a pulse, but the finer tolerances and more elaborate machining of a burst-fire capable combat shotgun leaves them as a more selective product. Ranges and damages given are for shot shells; slugs double their normal and extreme ranges but apply a -1 penalty to hit rolls.'
weapons.semi-auto-shotgun.name: 'Semi-Auto Shotgun'
weapons.semi-auto-shotgun.description: 'Shotguns of various stripes can be found under the counter of practically every bar and shop in a slum. Simple double-barrel models can be made by any home gunsmith with a pulse, but the finer tolerances and more elaborate machining of a burst-fire capable combat shotgun leaves them as a more selective product. Ranges and damages given are for shot shells; slugs double their normal and extreme ranges but apply a -1 penalty to hit rolls.'
weapons.combat-shotgun.name: 'Combat Shotgun'
weapons.combat-shotgun.description: 'Shotguns of various stripes can be found under the counter of practically every bar and shop in a slum. Simple double-barrel models can be made by any home gunsmith with a pulse, but the finer tolerances and more elaborate machining of a burst-fire capable combat shotgun leaves them as a more selective product. Ranges and damages given are for shot shells; slugs double their normal and extreme ranges but apply a -1 penalty to hit rolls.'
weapons.sniper-rifle.name: 'Sniper Rifle'
weapons.sniper-rifle.description: 'Sniper rifles are often nothing more than bolt-action rifles with expensive tuning and optics. If not fired from a rest in a prepared position, a sniper rifle’s statistics are the same as a normal rifle.'
weapons.taser-pistol.name: 'Taser Pistol'
weapons.taser-pistol.description: 'Taser pistols cover a family of ranged non-lethal weapons small and light enough to carry concealed. Most rely on tried-and-true electrical shocks to drop a target; they inflict non-lethal hit point damage and cannot make Traumatic Hits.'
weapons.automatic-rifle.name: 'Automatic Rifle'
weapons.automatic-rifle.description: 'Automatic rifles include a large range of barely man-portable firearms designed to hurl vast amounts of lead through the air, and unlike smaller firearms, they can use suppressive fire if properly braced. Ammunition for these guns comes in belts or boxes. The mag rating reflects how many rounds the weapon can fire before needing a refill, with each “round” costing $50 worth of ammunition. The compactness of their loaded magazines still only counts as one item, however.'
weapons.knife.name: 'Knife'
weapons.knife.description: 'Knives, clubs, swords, and other simple melee weapons are available almost anywhere on the street. Particularly impoverished gangers sometimes fashion makeshift machetes and improvised shivs when better can’t be obtained. Such weapons are effectively free, but have a -1 penalty to hit and damage rolls due to their ungainly make.'
weapons.club.name: 'Club'
weapons.club.description: 'Knives, clubs, swords, and other simple melee weapons are available almost anywhere on the street. Particularly impoverished gangers sometimes fashion makeshift machetes and improvised shivs when better can’t be obtained. Such weapons are effectively free, but have a -1 penalty to hit and damage rolls due to their ungainly make.'
