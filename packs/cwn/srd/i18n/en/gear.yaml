armor.ordinary-clothing.name: 'Ordinary Clothing'
armor.ordinary-clothing.description: 'Some bold, impoverished, or highly fashionable people still insist on wearing clothing that has no functional use as armor.'
armor.reinforced-clothing.name: 'Reinforced Clothing'
armor.reinforced-clothing.description: 'Subtle polymer sheets and reinforced weaves are used to provide a modicum of protection in this clothing without sacrificing taste.'
armor.war-harness.name: 'War Harness'
armor.war-harness.description: 'An upgraded form of street leathers, these outfits have sacrificed all discretion for whatever spare ballistic plates and advanced polymer weaves its owner can sew or bolt on. It’s usually the best armor that local gangs or common thugs can afford.'
armor.street-leathers.name: 'Street Leathers'
armor.street-leathers.description: 'Fashionable, aggressive, and often mismatched, “street leathers” seldom have any non-synthetic leather in their makeup, but are light and comfortable enough to wear as a habit.'
armor.reinforced-longcoat.name: 'Reinforced Longcoat'
armor.reinforced-longcoat.description: 'Long, draping clothing is bolstered with advanced fabrics and discreetly-placed absorption plates, the whole remaining deniable as armor.'
armor.armored-clothing.name: 'Armored Clothing'
armor.armored-clothing.description: 'The bulky plates and heavy ballistic weaves of this outfit are disguised as drapes and fashion elements.'
armor.plated-longcoat.name: 'Plated Longcoat'
armor.plated-longcoat.description: 'An ankle-length coat, robe, or mantle is used as a substrate for numerous reinforced plates and swaths of ballistic weave. It’s heavy, bulky, and blatant, but it can absorb a lot of punishment.'
armor.impact-jacket.name: 'Impact Jacket'
armor.impact-jacket.description: 'Built to absorb the impact of various contact sports, extreme athletic pursuits, and unguided vehicle races, these jackets usually come as part of a full-body protective outfit.'
armor.light-armored-suit.name: 'Light Armored Suit'
armor.light-armored-suit.description: 'Ordinary law enforcement and security guards will be wearing suits like this, usually brightly emblazoned with their corporate affiliation.'
armor.medium-armored-suit.name: 'Medium Armored Suit'
armor.medium-armored-suit.description: 'Heavy security usually sports armor on this level, including police rapid response teams.'
armor.heavy-armored-suit.name: 'Heavy Armored Suit'
armor.heavy-armored-suit.description: 'A head-to-toe suit of interlocking plates and impact absorption units, these suits are reserved for high-end response teams and military operations.'
armor.riot-shield.name: 'Riot Shield'
armor.riot-shield.description: 'These bulky, transparent shields are most effective in fending off melee attackers. They must be Readied in one hand; users with multiple cyberarms can benefit from only one shield at a time. A shield negates the first melee Shock damage a bearer takes in a round.'
armor-accessories.absorption-plates.name: '{base} with absorption plates'
armor-accessories.absorption-plates.description: 'Additional impact-absorbing buffer plates are added to the armor. Their bulk inflicts a -1 penalty to the user’s Sneak and Exert checks.'
armor-accessories.joint-reinforcement.name: '{base} with joint reinforcement'
armor-accessories.joint-reinforcement.description: 'The weak points around limb joints are reinforced with extra layers of weave. The extra weave hinders movement, and applies a -1 penalty to the wearer’s Sneak and Exert checks.'
armor-mods.absorption-pads.name: '{base} (absorption pads)'
armor-mods.absorption-pads.description: |-
  Kinetic padding is added to the armor, granting it 5 more hit points of damage soak per fight.

  *Fix-2, $2,000.*
armor-mods.active-response.name: '{base} (active response)'
armor-mods.active-response.description: |-
  The armor has hyper-advanced reactive defenses that deflect and mitigate otherwise-critical injuries. Increase the wearer’s Trauma Target by 1. This stacks with any existing Trauma Target bonus the armor may already confer on the wearer.

  *Fix-3, $20,000, 2 special tech.*
armor-mods.biostabilizing.name: '{base} (biostabilizing)'
armor-mods.biostabilizing.description: |-
  An integral biostatus monitor triggers emergency trauma drugs when the wearer is Mortally Wounded. As an Instant action, they roll 2d6+2 versus difficulty 8 to stabilize. Only one such attempt can be made before the suit needs an hour to recalibrate.

  *Fix-1, $2,500.*
armor-mods.customized.name: '{base} (customized)'
armor-mods.customized.description: |-
  The armor is tailored to a specific wearer, granting them a +1 bonus to both ranged and melee AC while it’s worn.

  *Fix-1, $1,000.*
armor-mods.discreet-design.name: '{base} (discreet design)'
armor-mods.discreet-design.description: |-
  The armor is carefully tailored and adjusted to be less imposing. Obvious armor is made Subtle by this mod, though it suffers a -2 penalty to its ranged and melee AC. The armor retains its original bulk, but its lines, drapes, and fabrics now appear to be particularly voluminous fashion couture rather than protective equipment.

  *Fix-2, $5,000, 1 special tech.*
armor-mods.flexible.name: '{base} (flexible)'
armor-mods.flexible.description: |-
  Bulky armor is carefully cut and tailored to allow a wearer the optimal range of movement. The Heavy quality of a suit of armor is removed.

  *Fix-2, $10,000, 1 special tech.*
armor-mods.quickchange.name: '{base} (quickchange)'
armor-mods.quickchange.description: |-
  The armor or clothing is designed with chroma-shifting fabrics, bi-facial texture panels, and removable accessories. As a Main Action, the wearer can shift its appearance to that of a different type of clothing or armor with the same level of obviousness. The details of this alternate appearance can be set with an hour of adjustment.

  *Fix-1, $1,000.*
armor-mods.sealed.name: '{base} (sealed)'
armor-mods.sealed.description: |-
  The armor is equipped with a concealed filter hood and temporary pressure gaskets. As a Main Action, the user can seal the clothing against the external atmosphere, rendering them immune to gases and contact toxins. The seal and its integral air supply last 30 minutes, after which an hour of cleaning and purging will be needed to refresh the system.

  *Fix-1, $2,500.*
armor-mods.tailored-rig.name: '{base} (tailored rig)'
armor-mods.tailored-rig.description: |-
  Pouches, attachment points, holsters, and other rigging are designed for a particular wearer’s body contours. They gain 1 point of Readied Encumbrance and 2 points of Stowed Encumbrance added to their maximum. These items are clearly visible to others, however, and cannot be concealed.

  *Fix-1, $2,000.*
armor-mods.trauma-dampers.name: '{base} (trauma dampers)'
armor-mods.trauma-dampers.description: |-
  This mod can only be installed after Absorption Pads are in place. Once fully engineered, they add 5 additional hit points of damage soak per fight.

  *Fix-3, $10,000, 1 special tech.*
armor-mods.whisperlight.name: '{base} (whisperlight)'
armor-mods.whisperlight.description: |-
  The armor’s bulk is cut down and conventional materials are replaced with more advanced composites. The armor’s Encumbrance decreases by 1 point.

  *Fix-2, $10,000, 1 special tech.*
weapon-mods.autotargeting.name: '{base} (autotargeting)'
weapon-mods.autotargeting.description: |-
  The weapon has kinetic sensors embedded in it that synchronize with onboard targeting chips. The user gains a +1 bonus to all hit rolls with the weapon, but needs to connect with it via either a Gunlink or a Cranial Jack.

  *Fix-1, $5,000.*
weapon-mods.concealed.name: '{base} (concealed)'
weapon-mods.concealed.description: |-
  Materials are replaced, outlines are altered, and appearances are adjusted. Pistol-sized and smaller weapons now cannot be detected without a full minute of patting down the bearer, while anything no larger than a rifle can be concealed as if it were a pistol, unfolding to full size upon use.

  *Fix-2, $5,000, 1 special components.*
weapon-mods.customized.name: '{base} (customized)'
weapon-mods.customized.description: |-
  The weapon’s balance and form are tailored to a specific user. That user gains a +1 bonus to all hit rolls with the weapon.

  *Fix-1, $1,000.*
weapon-mods.extended-mag.name: '{base} (extended magazine)'
weapon-mods.extended-mag.description: |-
  Caliber adjustments, feed assists, and magazine dimension alterations double a gun’s reliable magazine capacity.

  *Fix-1, $1,000.*
weapon-mods.heavy-sabot.name: '{base} (heavy sabot)'
weapon-mods.heavy-sabot.description: |-
  Applicable only to projectile weapons, the gun is modified to fire heavy AP rounds that can plausibly land Traumatic Hits even on armored vehicles or heavy drones.

  *Fix-1, $2,000.*
weapon-mods.integral-toxins.name: '{base} (integral toxins)'
weapon-mods.integral-toxins.description: |-
  A melee or thrown weapon is impregnated with numerous microcells of an advanced hemotoxin, the cells rupturing on impact with a target. The weapon does +2 damage and Shock to subjects not immune to poison.

  *Fix-2, $10,000, 1 special components.*
weapon-mods.onboard-gunlink.name: '{base} (onboard gunlink)'
weapon-mods.onboard-gunlink.description: |-
  Usable only on firearms, the weapon’s onboard targeting hardware emulates the effects of the Gunlink cyber-system. The user must have a Cranial Jack system to plug it in.

  *Fix-2, $10,000, 1 special components.*
weapon-mods.predictive-guidance.name: '{base} (predictive guidance)'
weapon-mods.predictive-guidance.description: |-
  An entire onboard computing core is augmented by advanced materials and cutting-edge kinetic analysis to increase the odds of landing a lethal blow. The weapon gains a +1 bonus to hit rolls, damage, and Shock. The user must be connected via a Gunlink or a Cranial Jack cybersystem.

  *Fix-3, $15,000, 2 special components.*
weapon-mods.reel-wires.name: '{base} (reel wires)'
weapon-mods.reel-wires.description: |-
  A thrown weapon is linked to a wrist spool with retractable wires that allow its retrieval as an On Turn action. The wires can be cut by a properly-timed attack with a sharp weapon, but are too thin and sharp to be easily grabbed. The wires can drag up to 20 kilos of mass when retracting. Replacing broken wires takes fifteen minutes.

  *Fix-1, $2,500.*
weapon-mods.savage-impact.name: '{base} (savage impact)'
weapon-mods.savage-impact.description: |-
  Usable only on melee weapons, powered impact plates, vibrating serrations, or other after-market adjustments increase its damage and Shock by +1.

  *Fix-1, $5,000.*
weapon-mods.shock-burst.name: '{base} (shock burst)'
weapon-mods.shock-burst.description: |-
  Once per fight, as an On Turn action, the weapon can imbue itself or a round of ammunition with an electrical charge, inflicting an additional 2d6 damage on a hit, or +2 damage to melee Shock on the next attack. This damage is not affected by the +3 cap to mod hit and damage.

  *Fix-2, $5,000.*
weapon-mods.stun-rounds.name: '{base} (stun rounds)'
weapon-mods.stun-rounds.description: |-
  Usable only on firearms, the weapon’s barrel and firing mechanism is altered to accept soft, electrically-charged stun rounds. The firearm’s range is halved, it takes a -2 penalty to damage, and it loses its Trauma Die, but all damage it inflicts is treated as non-lethal. Stun rounds do no significant harm to inanimate objects.

  *Fix-2, $5,000.*
weapon-mods.thermal-charge.name: '{base} (thermal charge)'
weapon-mods.thermal-charge.description: |-
  Usable only on melee or thrown weapons, the mod adds a bank of heat cells to the weapon. The weapon then inflicts +2 damage and Shock to all creatures not impervious to heat. The cells are activated as an On Turn action, but last for only two fights before requiring an hour to swap batteries and let the elements cool.

  *Fix-2, $7,500.*
weapon-mods.unarmed-combatant.name: '{base} (Unarmed Combatant)'
weapon-mods.unarmed-combatant-2.name: '{base} (Unarmed Combatant 2)'
weapon-mods.body-blades-1.name: '{base} (Body Blades I)'
weapon-mods.body-blades-2.name: '{base} (Body Blades II)'
weapon-mods.hand-of-doom.name: '{base} (Hand of Doom)'
gear.active-hearing-protection.name: 'Active Hearing Protection'
gear.active-hearing-protection.description: 'This headset protects the wearer from disorientation due to loud noises. It passes along conversational-level speech without difficulty.'
gear.empty-magazine.name: 'Empty Magazine'
gear.empty-magazine.description: 'Individual rounds are loaded into empty magazines that are specific to individual firearms.'
gear.ammunition.name: 'Ammunition'
gear.ammunition.description: 'Individual rounds are loaded into empty magazines that are specific to individual firearms.'
gear.backpack.name: 'Backpack'
gear.backpack.description: 'Backpacks, gear harnesses, and other such kit may add some bulk to an operator’s burden, but without them the GM is perfectly justified in asking how a PC is fitting their entire loadout in their jacket pockets.'
gear.binoculars.name: 'Binoculars'
gear.binoculars.description: 'Most modern binocs have low-light functionality and magnification sufficient to bring targets as much as a kilometer distant into view.'
gear.bus-pass-monthly.name: 'Bus Pass, Monthly'
gear.bus-pass-monthly.description: 'A critical mobility resource for the first mission of many operators.'
gear.climbing-kit.name: 'Climbing Kit'
gear.climbing-kit.description: 'Ultralight cord, a grapnel, some grip handholds, and a fast-acting, ultra-strong wall adhesive make up this kit.'
gear.fashionable-clothing.name: 'Fashionable Clothing'
gear.fashionable-clothing.description: 'Clothing has no Encumbrance when worn, but it’s sometimes prudent to have a spare outfit in your pack.'
gear.haute-couture-clothing.name: 'Haute Couture Clothing'
gear.haute-couture-clothing.description: 'Clothing has no Encumbrance when worn, but it’s sometimes prudent to have a spare outfit in your pack.'
gear.ordinary-clothes.name: 'Ordinary Clothes'
gear.ordinary-clothes.description: 'Clothing has no Encumbrance when worn, but it’s sometimes prudent to have a spare outfit in your pack.'
gear.gas-mask.name: 'Gas Mask'
gear.gas-mask.description: 'Bulky and uncomfortable, but once Readied it leaves the user immune to most inhaled gases, including tear gas grenades.'
gear.anti-flash-goggles.name: 'Anti-Flash Goggles'
gear.anti-flash-goggles.description: 'Basic anti-flash goggles defuse the visual threat of flashbangs and similar dazzlers. IR goggles include anti-flash tech, but also give the user effective IR vision out to 50 meters in most environments.'
gear.ir-goggles.name: 'IR Goggles'
gear.ir-goggles.description: 'Basic anti-flash goggles defuse the visual threat of flashbangs and similar dazzlers. IR goggles include anti-flash tech, but also give the user effective IR vision out to 50 meters in most environments.'
gear.kit-basic-tools.name: 'Basic Tools Kit'
gear.kit-basic-tools.description: 'These bundles of gear are carefully packed for minimal weight. Toolkits give a tech the gear they need for basic repairs and construction, while medical kits provide first aid implements. Cyberdoc kits contain everything medical kits do, as well as gear for cyber maintenance or even emergency implantation. Survival kits are for badlands operations, with water filtration, firemaking tools, and other such gear for extended wilderness stays.'
gear.kit-cyberdoc.name: 'Cyberdoc Kit'
gear.kit-cyberdoc.description: 'These bundles of gear are carefully packed for minimal weight. Toolkits give a tech the gear they need for basic repairs and construction, while medical kits provide first aid implements. Cyberdoc kits contain everything medical kits do, as well as gear for cyber maintenance or even emergency implantation. Survival kits are for badlands operations, with water filtration, firemaking tools, and other such gear for extended wilderness stays.'
gear.kit-medkit.name: 'Medkit'
gear.kit-medkit.description: 'These bundles of gear are carefully packed for minimal weight. Toolkits give a tech the gear they need for basic repairs and construction, while medical kits provide first aid implements. Cyberdoc kits contain everything medical kits do, as well as gear for cyber maintenance or even emergency implantation. Survival kits are for badlands operations, with water filtration, firemaking tools, and other such gear for extended wilderness stays.'
gear.kit-survival.name: 'Survival Kit'
gear.kit-survival.description: 'These bundles of gear are carefully packed for minimal weight. Toolkits give a tech the gear they need for basic repairs and construction, while medical kits provide first aid implements. Cyberdoc kits contain everything medical kits do, as well as gear for cyber maintenance or even emergency implantation. Survival kits are for badlands operations, with water filtration, firemaking tools, and other such gear for extended wilderness stays.'
gear.lockpicks.name: 'Lockpicks'
gear.lockpicks.description: 'Both manual lockpicks and a selection of useful electronic shims sufficient to threaten most modern locks.'
gear.military-ration.name: 'Military Ration'
gear.military-ration.description: 'This food brick is unappetizing but contains the nutrition necessary for a day of heavy activity. Water can be included for an extra point of Encumbrance per day.'
gear.portable-video-camera.name: 'Portable Video Camera'
gear.portable-video-camera.description: 'Palm-sized and discreet, this camera can record up to twelve hours of high-def video before its internal memory is filled.'
gear.handheld-radio.name: 'Handheld Radio'
gear.handheld-radio.description: 'Both conventional handheld radios and ultra-convenient headset or collar-tab radios can be had. Ranges are one kilometer in the city and six in an open, flat area.'
gear.ultralight-tab-radio.name: 'Ultralight Tab Radio'
gear.ultralight-tab-radio.description: 'Both conventional handheld radios and ultra-convenient headset or collar-tab radios can be had. Ranges are one kilometer in the city and six in an open, flat area.'
gear.smartphone-service-plan.name: 'Smartphone Service Plan'
gear.smartphone-service-plan.description: 'Corp-approved media devices are cheap and ubiquitous, but few operators trust them with sensitive information.'
gear.basic-smartphone.name: 'Basic Smartphone'
gear.basic-smartphone.description: 'Corp-approved media devices are cheap and ubiquitous, but few operators trust them with sensitive information.'
gear.fashionable-smartphone.name: 'Fashionable Smartphone'
gear.fashionable-smartphone.description: 'Corp-approved media devices are cheap and ubiquitous, but few operators trust them with sensitive information.'
gear.cheap-vr-crown.name: 'Cheap VR Crown'
gear.cheap-vr-crown.description: 'A cheap headset for a VR addict or a hacker too poor for a cranial jack.'
gear.wearable-light.name: 'Wearable Light'
gear.wearable-light.description: 'These clip-on lights can illuminate up to 30 meters ahead of the wearer.'
gear.maintenance-supplies.name: 'Maintenance Supplies'
gear.maintenance-supplies.description: 'A collection of consumable parts, lubricants, medications, faked subscription keys, and pirated firmware updates. Any reasonable dollar value of supplies can be carried as 1 point of Encumbrance.'
gear.manufacturers-installation-kit.name: 'Manufacturer’s Installation Kit'
gear.manufacturers-installation-kit.description: 'These tools and technical resources are usually restricted to licensed installation vendors of a given cyberware company. They grant a +1 skill check bonus when installing or removing cyberware made by that manufacturer. They are closely tracked, and it can be difficult to find a corp doc willing to sell them under the table.'
gear.surgical-theater-tools-level-1.name: 'Surgical Theater Tools, Level 1'
gear.surgical-theater-tools-level-1.description: 'A basic collection of medical tools, pharmaceuticals, scanners, technical manuals, and software subscriptions. Most ordinary street docs command this level of hardware. Laying it out for use requires at least a semi-clean room’s worth of working space.'
gear.surgical-theater-tools-level-2.name: 'Surgical Theater Tools, Level 2'
gear.surgical-theater-tools-level-2.description: 'A more sophisticated, extensive, and advanced operating theater than the level 1 version. High-grade street docs and standard corporate employee clinics would use this tech, which requires the same amount of space as the level 1 array.'
gear.surgical-theater-tools-level-3.name: 'Surgical Theater Tools, Level 3'
gear.surgical-theater-tools-level-3.description: 'Some of the most advanced medical tech commonly available on the market, this grade of surgical assistance is usually found only in corporate clinics for high-level employees or in the private clinics of top-end street docs. It requires a half-dozen rooms to support all its functionality.'
drugs.avalanche.name: 'Avalanche'
drugs.avalanche.description: 'A somewhat pricey combat drug favored by shock troops and those first out of the trenches, Avalanche numbs sensations of pain or exhaustion for one hour, granting the user an effective +10 to their current hit points, even if it takes them above their maximum. This numbness tends to make it harder to notice serious harms, however, and the d12 roll for any Major Injury suffered while under its effects takes a -1 penalty.'
drugs.boneshaker.name: 'Boneshaker'
drugs.boneshaker.description: 'A filthy mix of jailbroken corp industrial chems and amphetamine scrapings, Boneshaker is a popular combat drug among the most impoverished or savage street gangs. On application, the subject is filled with blind aggression, gaining a +2 Morale bonus and a +2 bonus to hit rolls, damage, and Shock. The recklessness induced by Boneshaker leaves them wide open, however, and all attacks against them add +2 to any Trauma Die rolls. Boneshaker lasts for one scene and adds 2 System Strain at the end of it.'
drugs.chokeout.name: 'Chokeout'
drugs.chokeout.description: 'A chem that briefly induces severe swelling of the mucous membranes, Chokeout is odorless and tasteless, but must be consumed in food or drink and naturally degrades after twelve hours. A subject who consumes a dose of Chokeout must make a Physical save; on a failure, they are strangled to unconsciousness for an hour, waking up with one hit point at the end. On a success, they take 1d10 non-lethal damage as they struggle to breathe. On a natural saving throw of 1, the victim chokes to death.'
drugs.control-delete.name: 'Control-Delete'
drugs.control-delete.description: 'A chemical that temporarily destroys a person’s ability to form long-term memories, Control-Delete must be ingested in food or drink. Toxin-filtering cyber can fend it off, but it otherwise grants no saving throw. Once affected, the target will continue to act normally, but anything that happens to them between then and their next sleep or unconsciousness will be completely forgotten by the time they awake.'
drugs.hellbender.name: 'Hellbender'
drugs.hellbender.description: 'A watery black toxin that must be administered through food or direct injection, Hellbender causes the victim to convulse with bone-cracking force shortly after consumption. A dose of Hellbender has a distinct acrid taste, but if the victim consumes it they must make a Physical saving throw or begin convulsing helplessly for 1d6 rounds, suffering 1d10 damage each round unless restrained by at least two associates. This damage can kill an unfortunate victim.'
drugs.lurch.name: 'Lurch'
drugs.lurch.description: 'An emergency stimulant meant to shock a downed ally back into mobility, Lurch heals 1d10 damage plus the physician’s Heal skill on application, adding one System Strain to the target. Each dose of Lurch after the first each day increases the required Heal skill by one, so the third dose requires Heal-2 to successfully administer. Lurch only works on conscious and stabilized targets; the shock will kill a Mortally Wounded subject that hasn’t been made stable.'
drugs.madeleine.name: 'Madeleine'
drugs.madeleine.description: 'A chem that intensely stimulates a subject’s memory centers, Madeleine has its dangers. Users normally focus on a particular memory before injecting the drug; for the next 1d6 hours, they relive some portion of that memory with perfect fidelity while remaining oblivious to their physical surroundings. Psychological addiction is a considerable risk for long-term users, as well as choosing a less pleasant memory to recall.'
drugs.medical-prescription.name: 'Medical Prescription'
drugs.medical-prescription.description: 'One of a thousand different medical drugs, a prescription like this is often necessary to treat some chronic condition or keep a medical problem from growing worse. Corp employees get their drugs for a pittance, but less fortunate souls need to source their drugs from extortionate corp pharmacies or street docs. Lucky users only need a dose a few times a week, but others must have a daily supply or suffer potentially lethal complications.'
drugs.olympus.name: 'Olympus'
drugs.olympus.description: 'A “respectable” combat chem used by certain units of corporate security, Olympus numbs pain, sharpens mental focus, and slows down instinctive panic or rush instincts, allowing a calm observation of the battlefield. Users can reroll their first failed Morale check in a fight and gain a +2 bonus to hit rolls. One dose of Olympus lasts for one scene, and adds one System Strain at its end.'
drugs.panacea.name: 'Panacea'
drugs.panacea.description: 'Not so much a single drug as a pharmaceutical suite in a single injection system, this chem requires a skilled physician to adjust its mix. When used as part of a first aid attempt, this drug doubles the amount of hit points recovered by the attempt, with a minimum healing rate of 6 HP. Rumors of a drastically increased rate of bone cancers among regular users are, of course, mere slander against its manufacturer.'
drugs.pillow.name: 'Pillow'
drugs.pillow.description: 'A powerful sedative that requires medical expertise to administer properly, Pillow must be injected into a restrained or helpless subject, as vigorous physical action can disrupt the effects. Once injected, the subject falls into a torpor indistinguishable from death that lasts for 24 hours. They require only trace amounts of oxygen while in their trance, and can be identified as alive only through careful medical examination. If Pillow is administered with less than a 24-hour gap between doses, the victim must make a Physical save or die sometime before the dose ends.'
drugs.psycho.name: 'Psycho'
drugs.psycho.description: 'Ingesting one of these small pills rapidly flattens a user’s capacity for emotional distress while heavily increasing their aggressiveness. For roughly one hour, users gain a +2 bonus to Morale checks and experience no immediate emotional trauma from performing even the most heinous and violent actions. The drug is a favorite pre-fight dose among gangers, and used as self-medication among many of them who would otherwise be incapacitated by the emotional scars of what they’ve done.'
drugs.reset.name: 'Reset'
drugs.reset.description: 'A rare drug of desperation, Reset is a combination injector patch and wireless cyber override key. When applied to a willing subject with at least one Body or Nerve cyber system, it deluges the user’s system with safety override commands and neurotransmitter stimulants. They lose all accumulated System Strain in excess of their permanent minimum. Five minutes later, their System Strain is maximized and they must make a Physical saving throw at a penalty equal to the number of System Strain they’ve gained since the drug was taken. On a success, they drop to 1 hit point. On a failure, they become Mortally Wounded. If their adjusted roll is 1 or less, they must make a second modified Physical save or instantly and unavoidably die. Using Reset more than once a week is invariably fatal.'
drugs.sand.name: 'Sand'
drugs.sand.description: 'A gritty powder trafficked to those addicts too poor to afford anything better, a snorted dose of Sand will put its user into a euphoric haze for as long as an hour, depending on tolerance. Beautiful visions and dreamy contentment give way to shooting pains and intense light sensitivity afterwards, with most heavy users dying within six to twelve months of picking up the habit.'
drugs.trauma-patch.name: 'Trauma Patch'
drugs.trauma-patch.description: |-
  A theoretically foolproof cocktail of coagulants, stimulants, and painkillers, a trauma patch can be applied to a Mortally Wounded ally to stabilize them on a successful Int or Dex/Heal skill check against difficulty 6, with a +1 difficulty penalty for each full round since the subject went down. The patch is useless after six rounds.

  Trauma patches cannot revive victims downed by poisons or diseases, or those dismembered by explosives or heavy weapons.
drugs.window.name: 'Window'
drugs.window.description: 'A neurobooster favored among hackers and knowledge workers, Window augments the user’s focus and mental reaction speed at the cost of distracting them from their terrestrial surroundings. A Window user can trade their Move action to gain a bonus Main Action that can only be used for cyberspace actions. Each time this is done in a scene, however, the user gains one System Strain. One dose lasts for one scene.'
