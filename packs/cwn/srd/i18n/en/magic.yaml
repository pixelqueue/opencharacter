spells.arson.name: 'Arson'
spells.arson.description: 'Target a visible creature or flammable object. If a creature, roll a Shoot attack to hit it, adding your Cast skill as a bonus to the hit roll. If the spell hits, the target is wreathed in flames, suffering 1d8 fire damage per level. Flammable objects continue to burn normally. A target can be hit by Arson only once per scene.'
spells.blast.name: 'Blast'
spells.blast.description: 'A single visible target, whether a creature or object, takes 1d6 damage per level in concussive impact. Creatures can make a Physical save for half damage. Each use of this spell after the first in a scene adds one System Strain to the caster.'
spells.blastwave.name: 'Blastwave'
spells.blastwave.description: 'Select a visible target, whether creature or object; it and everything within five meters of it takes 1d6 damage per level in concussive impact. Creatures can make a Physical save to halve the damage. Each time you cast this spell, gain one System Strain, and it cannot be used more than once per scene unless you overcast it.'
spells.bless.name: 'Bless'
spells.bless.description: 'Target a visible creature. They gain a +1 bonus to all hit rolls and damage, including Shock, for one round per caster level. Only one Bless effect can be on a target at once.'
spells.cleanse-toxin.name: 'Cleanse Toxin'
spells.cleanse-toxin.description: 'You touch an ally who has been poisoned; the effects of the poison immediately end, though the damage it’s already done is not cured.'
spells.cloak.name: 'Cloak'
spells.cloak.description: 'Target up to one visible creature per two caster levels, rounded up. The creature becomes nearly transparent for the rest of the scene, gaining a +2 bonus on all Sneak checks and giving most creatures no chance to spot them at all unless they are specifically vigilant for intruders or the cloaked target gets within five meters of them. The effect ends instantly if the cloaked creature moves quickly, such as by running, fighting, or casting.'
spells.combat-precognition.name: 'Combat Precognition'
spells.combat-precognition.description: 'A single visible target is given a brief glimpse of the future while in combat, the effect lasting the rest of the scene. This precognition is enough to allow them to reroll a missed hit roll or low damage roll as an Instant action, taking the better of the two rolls. A roll may be rerolled only once, and after each use of the power the target gains System Strain equal to the number of times they’ve used it that same day.'
spells.compulsion.name: 'Compulsion'
spells.compulsion.description: 'Target a visible intelligent creature and give them a one-sentence telepathic command that isn’t extremely contrary to their wishes. They must make a Mental save or spend their next round’s actions performing your command to the best of their ability, unaware of your mental influence. If used against a target that is not in combat or feeling threatened, they might continue to obey for up to a scene if not alarmed. Victims will not realize they have been mentally attacked unless they make their saving throw. Once a save is made, a creature is immune to Compulsion for the rest of the scene.'
spells.curse.name: 'Curse'
spells.curse.description: 'Target a visible creature. They suffer a -1 penalty to all hit rolls and damage, including Shock, for one round per caster level. They can make a Mental save at the end of each round to throw off the effect. This penalty increases to -2 at level 5, and -3 at level 9. Only one Curse can be active on a creature at once.'
spells.detect-target.name: 'Detect Target'
spells.detect-target.description: 'When preparing this spell, choose a type of target from this list: a species of living creature, a specific person you’ve met, a general class of object, intelligent creatures that currently mean to physically harm you, or enchanted objects. When cast, for the rest of the scene you can take a Move action to sense the selected target within five meters per level, gaining a basic sense of their presence and location. You may prepare this spell more than once for different targets.'
spells.dispel.name: 'Dispel'
spells.dispel.description: 'Target a visible spell effect or creature. Any spell effects on the creature or targeted area are immediately ended. If the original caster had an equal or higher Cast skill, the dispeller must succeed in an opposed Int/Cast spell check against them to dispel their magic. This spell only functions against spell effects, and not standing magical effects created by items or other methods.'
spells.disrupt.name: 'Disrupt'
spells.disrupt.description: 'The next time you touch a creature or object, inflict normal unarmed damage plus 1d8 per level. Creatures can make a Physical save to negate this bonus damage. A Punch attack is necessary to touch a target in combat, but the mage may add their Cast skill to the hit roll. Only one charge of this spell may be active at once, and it dissipates if not used by the end of the scene.'
spells.emotion.name: 'Emotion'
spells.emotion.description: 'Target a visible creature, choose an emotion, and optionally pick a target or subject for that emotion. The victim must make a Mental save or immediately feel that emotion for the rest of the scene, optionally directed toward that target. This emotion is strong enough to get them to act to the limit of their normal character and rationality. In combat, a powerful fear may be enough to force a Morale check. If this spell is cast with Effort for the day instead of the scene, the target and all creatures within five meters must save or be affected, all sharing an emotion and target.'
spells.far-senses.name: 'Far Senses'
spells.far-senses.description: 'Pick a location within ten meters per character level. Unless the area is shielded against magical intrusion, your unaided human senses focus on the location as if you were standing there. You maintain this clairvoyance as long as you do nothing but concentrate, up to a scene in duration.'
spells.glide.name: 'Glide'
spells.glide.description: 'Target a number of visible creatures equal to your character level plus three. For the rest of the scene, these creatures are immune to falling damage. When leaping from a height, they can land at any point within 5 meters for each meter of height they have, gliding at a rate of 40 meters per round.'
spells.haste.name: 'Haste'
spells.haste.description: 'Target a visible ally. For the next 1d4+1 rounds, once per round, as an On Turn action, they can perform an extra Main Action. This bonus action cannot involve spellcasting, summoning, or activating magical items. Using this bonus action adds 0 System Strain to the user for the first use per day, 1 for the second that same day, 2 for the third, and so forth.'
spells.heal-injury.name: 'Heal Injury'
spells.heal-injury.description: 'You touch an ally, curing 1d6 damage per three caster levels, rounded up, plus your Heal skill. This healing adds one System Strain to the target but removes any Frailty they may be suffering. It cannot repair Major Injuries, but can stabilize those downed by them.'
spells.illumination.name: 'Illumination'
spells.illumination.description: 'Such a minor spell that it doesn’t even require Effort, this incantation causes a touched object to glow as you wish, illuminating up to 10 meters around it for up to an hour. Only one Illumination can be active at a time.'
spells.mirage.name: 'Mirage'
spells.mirage.description: 'Pick a visible target location. You can create a visual and audible illusion within ten meters of that location. This illusion cannot turn objects invisible, but can conceal them behind opaque phantasms. The illusion can involve motion and activity, but once programmed, it cannot be changed, nor can it move out of the target radius. The illusion is intangible and cannot inflict damage, and those aware of its falsity can see through it with a successful Mental save taken as a Main Action. Only one Mirage can be summoned at a time.'
spells.muffle.name: 'Muffle'
spells.muffle.description: 'Pick a visible target location and a radius of up to ten meters. For the rest of the scene, no sound made within this zone will be audible outside the zone.'
spells.paralysis.name: 'Paralysis'
spells.paralysis.description: 'Target a visible creature and roll 1d8 per level. If the total is greater than the target’s current hit points, they must make a Mental save or become paralyzed and helpless for the rest of the scene. On a successful save, they still lose their next Main Action. The spell can target a given creature only once per scene.'
spells.psychic-interrogation.name: 'Psychic Interrogation'
spells.psychic-interrogation.description: 'Target a visible intelligent creature that is cooperative or restrained. Ask them one question of no more than two sentences. They may make a Mental save; on a success, they give you three telepathic sentences of their choice. On a failure, those three sentences are a truthful and candid answer to your question. The target is then immune to this spell for a week. A target’s saving throw result is not obvious to you.'
spells.slow.name: 'Slow'
spells.slow.description: 'Target a visible creature. For one round per level thereafter, each round they must either lose their Main Action or take 1d6 psychic damage per two caster levels, rounded up, with a Mental save for half damage. This damage can leave them unconscious, but not kill them. At the end of each of their rounds, they can make a Mental save to end the spell early. A creature can be affected by Slow only once per scene.'
spells.soul-link.name: 'Soul Link'
spells.soul-link.description: 'You connect your mind to that of a willing visible intelligent target. For the rest of the scene, you can communicate telepathically no matter the distance between you, and each know each other’s location and physical status at all times. Once during the spell, the two of you may agree to share a skill, both using it at the same level for one round per caster level. Only one Soul Link can be active at a time.'
spells.stun.name: 'Stun'
spells.stun.description: 'A single visible creature takes 1d6 damage per level in psychic shock, with a Mental save to take only one point of damage per level instead. This damage can strike a creature unconscious, but it awakens ten minutes later with one hit point. A creature targeted by this spell is thereafter immune to it and Stunwave for the rest of the scene. Using this spell more than once a scene requires committing Effort for the day instead of the scene.'
spells.stunwave.name: 'Stunwave'
spells.stunwave.description: 'Target a visible point; every living target within five meters takes 1d6 damage per level in psychic shock, with a Mental save to take only one point of damage per level instead. This damage can strike a creature unconscious, but it awakes ten minutes later with one hit point. A creature targeted by this spell is thereafter immune to it and Stun for the rest of the scene. This spell cannot be used more than once per scene unless you overcast it.'
spells.triage.name: 'Triage'
spells.triage.description: 'You touch an adjacent living creature that is Mortally Wounded, stabilizing them immediately. This process adds one System Strain to the target, though you can avoid this by Committing Effort for the day when casting it instead of for the scene.'
arts.alacrity-basic.name: 'Alacrity, Basic'
arts.alacrity-basic.description: 'Your supernatural reflexes function in the same way as the Enhanced Reflexes I cyberware. You may later upgrade any level of Alacrity to its higher levels by paying the difference in point cost.'
arts.alacrity-improved.name: 'Alacrity, Improved'
arts.alacrity-improved.description: 'Your reflexes have been honed to be equivalent to Enhanced Reflexes II cyberware, with the same System Strain costs.'
arts.alacrity-sublime.name: 'Alacrity, Sublime'
arts.alacrity-sublime.description: 'Your blinding haste functions as if it were Enhanced Reflexes III cyberware, with the same System Strain costs.'
arts.arcane-senses.name: 'Arcane Senses'
arts.arcane-senses.description: 'You can see clearly in complete darkness, hear whispered conversations at twenty meters, and identify people and their belongings by scent. For any skill checks involving the acuity of your senses, you get a +1 bonus.'
arts.arcane-skill.name: 'Arcane Skill'
arts.arcane-skill.description: 'Pick a skill you have at level-0 or better that isn’t a combat skill, Magic, or Program. Gain a +1 bonus to the skill’s checks. If it requires human-portable tools or implements to function, such as a medkit or a toolbox, your art magically substitutes for the need.'
arts.blades-of-will.name: 'Blades of Will'
arts.blades-of-will.description: 'You can manifest arcane melee weapons of your choice as an On Turn action, using the statistics of any normally-available melee weapon. You can throw these weapons to attack, but they vanish if you merely drop them or fall unconscious. The weapons gain a bonus to hit, damage, and Shock equal to your character level divided by three, rounded down.'
arts.brazen-thews.name: 'Brazen Thews'
arts.brazen-thews.description: 'Your muscles are supernaturally reinforced, granting a +1 bonus to your Strength modifier, up to a maximum of +3.'
arts.faultless-grace.name: 'Faultless Grace'
arts.faultless-grace.description: 'Supernatural grace infuses your motions, and you gain a +1 bonus to your Dexterity modifier, up to a maximum of +3.'
arts.flying-steps.name: 'Flying Steps'
arts.flying-steps.description: 'When you move, you can leap horizontal or vertical distances up to your normal Move rating. You subtract your Move rating from any falling damage distance.'
arts.hand-of-doom.name: 'Hand of Doom'
arts.hand-of-doom.description: 'Your hands and feet have the hardness and durability of steel, and are impervious to most forms of damage. Your unarmed attacks now do 1d10 damage and Shock 2/15. They get a hit, damage, and Shock bonus equal to your level divided by three, rounded down. You may use unarmed attacks to inflict lethal damage with a 1d8 Trauma Die and a x3 Trauma Rating. The Unarmed Combatant Focus doesn’t stack with this.'
arts.hundred-faces.name: 'Hundred Faces'
arts.hundred-faces.description: 'As a Main Action, shift your physical appearance to be that of any other humanoid between 1.5 and 2 meters in height. You can perfectly mimic people you’ve met personally, including retinal and fingerprint patterns, but not DNA. Your clothing alters its appearance as well, but armor subtlety can’t be changed. Changes revert when you die or change back as an Instant action.'
arts.inexhaustible-vigor.name: 'Inexhaustible Vigor'
arts.inexhaustible-vigor.description: 'Your physical stamina and hardiness is enhanced, granting a +1 bonus to your Constitution modifier, up to +3.'
arts.martial-instinct.name: 'Martial Instinct'
arts.martial-instinct.description: 'You have a number of bonus combat rolls equal to your highest combat skill, to a minimum of one. As an On Turn action, you may choose to use one of these rolls to make an additional hit roll or damage roll, rolling multiple dice for the same attack. Only the best die is used, however, so if you spend a bonus roll to make a d20 hit roll twice or a 2d8 weapon damage twice, you use only the better of your results. As this is an On Turn action, you must choose to use this bonus before you make the roll. Your rolls refresh after a night’s good sleep.'
arts.occult-pavis.name: 'Occult Pavis'
arts.occult-pavis.description: 'You are unusually resistant to hostile magic. You may roll all saves versus spells or magical effects twice, and take the better result. This cannot help against effects without a save.'
arts.personal-void.name: 'Personal Void'
arts.personal-void.description: 'You are linked with a personal extradimensional space that can contain up to 20 items of encumbrance or 50 kilos of bulk matter. Storing or retrieving one or more items takes a Main Action, and you must be holding an unattached, uncontested item to store it. Retrieved items such as weapons or armor can be Readied as part of the action if you have the strength for it. Living creatures can’t be stored, and time passes normally within the space. If you die, your stored items spill out around you.'
arts.refulgent-vitality.name: 'Refulgent Vitality'
arts.refulgent-vitality.description: 'You automatically stabilize when brought to zero hit points, unless instantly killed by the damage, and you can regenerate Major Injuries with a week’s rest. You heal twice your level in hit points with each night’s rest, instead of your level alone.'
arts.skin-of-steel.name: 'Skin of Steel'
arts.skin-of-steel.description: 'Your flesh is highly resilient against harm. You gain a base armor class equal to fifteen plus half your level, rounded up, and a +1 bonus to your Trauma Target that increases to +2 at 5th level. This art does not stack with armor.'
arts.sorcerous-sight.name: 'Sorcerous Sight'
arts.sorcerous-sight.description: 'By examining an object, area, or person as a Main Action, you can see any active magic or enchantments and gain a one-sentence description of their effect.'
arts.spiritbane.name: 'Spiritbane'
arts.spiritbane.description: 'You add your level to all damage inflicted on spirits or magical constructs, including Shock. Once per round, as an Instant action, gain one System Strain to reroll a missed attack against such creatures.'
spirit-powers.airy-steps.name: 'Airy Steps'
spirit-powers.airy-steps.description: 'The spirit can fly at its usual movement rate, though it cannot attack while flying. Physical spirits can carry up to 25 kilograms, or up to 500 if they have a Mighty Form.'
spirit-powers.artifice-wise.name: 'Artifice-Wise'
spirit-powers.artifice-wise.description: 'A spirit is capable of using daily human technology such as telephones, cars, and other common devices at an ordinary human level of skill. They are still unable to use human weapons or armor, however, including grenades, and they cannot function as hackers, technicians, or other tech-skilled professions regardless of their other powers.'
spirit-powers.aura-of-destruction.name: 'Aura of Destruction'
spirit-powers.aura-of-destruction.description: 'The spirit is mantled in toxic gases, bitter cold, leaping flames, crushing depression, or some other aura that causes harm to those who get too close. If the spirit can make melee attacks, it gains a damage bonus equal to half its hit dice, rounded up. If someone makes a melee attack against it, they must make an appropriate save or suffer the spirit’s hit dice+2 in damage before the attack can be made. The save type will depend on the nature of the aura. Non-lethal auras can strike a victim unconscious but will not kill them. The spirit cannot “turn off” this aura.'
spirit-powers.curse.name: 'Curse'
spirit-powers.curse.description: 'As a Main Action, the spirit can blight a visible creature’s luck, forcing a -1 to all skill checks and a -2 to all hit and damage rolls for the scene. At 7th level these penalties double. A creature can bear only one curse at a time, and the spirit can’t curse more people in a single day than its hit dice.'
spirit-powers.ensnare.name: 'Ensnare'
spirit-powers.ensnare.description: 'The spirit can trap human-sized targets as a Main Action, provided they’re within 30 meters and fail an Evasion save. If snared, it’s two Main Actions for an ally to cut them free, or one successful Str/Exert check against difficulty 10. Ensnared enemies can still act, but cannot move from their location until the snare fades in five minutes. The spirit can’t have more targets snared at once than its hit dice. Only spirits in physical form can take this power.'
spirit-powers.favor.name: 'Favor'
spirit-powers.favor.description: 'As a Main Action, the spirit graces a target’s luck in a particular activity related to its nature, giving them a +1 to all related skill checks for a scene. If a combat blessing is given, the subject gets a +2 to hit and damage rolls. At 7th level, these benefits double. It’s up to the GM to decide whether or not a particular activity is related to the spirit. A creature can bear only one favor at a time and a spirit cannot favor more people in a day than its hit dice.'
spirit-powers.feral-pact.name: 'Feral Pact'
spirit-powers.feral-pact.description: 'Animals of the same general type as the spirit obey its commands, provided its commands are not contrary to their nature. This power is useless to spirits without an animal nature.'
spirit-powers.finned-swiftness.name: 'Finned Swiftness'
spirit-powers.finned-swiftness.description: 'The spirit gains a swimming movement rate equal to twice its normal Move.'
spirit-powers.flesh-of-clay.name: 'Flesh of Clay'
spirit-powers.flesh-of-clay.description: 'The spirit is not subject to Traumatic Hits, rather than having the usual Trauma Target of 6.'
spirit-powers.ghostly-presence.name: 'Ghostly Presence'
spirit-powers.ghostly-presence.description: 'The spirit is invisible to sight, including IR and similar exotic senses, until it takes a violent action, makes a disturbance, or uses a power on a target that allows a saving throw. Once this invisibility is lost, it cannot be regained for ten minutes.'
spirit-powers.hideous-talons.name: 'Hideous Talons'
spirit-powers.hideous-talons.description: 'The melee attack of Violent Will is improved. Its Shock now affects any AC and both damage and Shock are increased by +2. These benefits do not apply to any ranged attacks the spirit may make. Spirits summoned with this power always look dangerous or vicious, and cannot be disguised as something harmless.'
spirit-powers.iron-eidolon.name: 'Iron Eidolon'
spirit-powers.iron-eidolon.description: 'A Physical Form spirit is now immune to non-magical weapons that aren’t Heavy. The psychic force inherent in unarmed attacks can still harm it, however, even if the assailant isn’t magically-gifted.'
spirit-powers.merciful-hands.name: 'Merciful Hands'
spirit-powers.merciful-hands.description: 'The spirit can expend its power to heal an injured victim. As a Main Action, it can heal 1d8 HP to an adjacent ally. Each use of this power inflicts 1d8 damage to the spirit and adds one System Strain to the target. A spirit with this power will willingly use it even if it faces destruction by doing so.'
spirit-powers.mighty-form.name: 'Mighty Form'
spirit-powers.mighty-form.description: 'Requiring a physical form, this power enhances the spirit’s strength. While this strength is too slowly-deployed to be useful in combat, with a Main Action the spirit can smash down an interior wall or standard exterior door, lift and carry up to five hundred kilograms, or otherwise perform similar feats of raw strength. If used against a helpless or immobile target, the spirit must have the Violent Will power. If so, the spirit’s melee attacks against the helpless are an automatic Traumatic Hit and can cause harm even to vehicles.'
spirit-powers.mislead.name: 'Mislead'
spirit-powers.mislead.description: 'Once per round, as an Instant action, the spirit can target a moving person. If the target fails a Mental save, the spirit controls their intended movement, directing it in any direction that is not obviously dangerous out to the maximum of their normal Move action. If the victim is not aware of the spirit’s interference, they will think their course was somehow their own idea and try to rationalize why they did it.'
spirit-powers.misty-form.name: 'Misty Form'
spirit-powers.misty-form.description: 'The spirit can flow through any barrier that isn’t watertight without impeding its movement. Even entities in Spirit Form can use this to seep through holes in barriers their manifested shape would otherwise be unable to pass.'
spirit-powers.mortal-disguise.name: 'Mortal Disguise'
spirit-powers.mortal-disguise.description: 'The spirit appears to be a normal human being on casual inspection, with the appearance and clothing the summoner wishes. Specific humans cannot be duplicated by this power, and close, careful inspection of the spirit will reveal its uncanny nature.'
spirit-powers.myrmidons-shield.name: 'Myrmidon’s Shield'
spirit-powers.myrmidons-shield.description: 'As an Instant action, when the spirit’s summoner takes a Traumatic Hit while the spirit is within 10 meters, the spirit can change the hit to a regular one. The spirit, however, then takes the Traumatic Hit. This damage affects the spirit even if it is otherwise immune to the weapon or to Traumatic Hits. A spirit with this power will willingly use it even if it faces destruction by doing so.'
spirit-powers.namebearer.name: 'Namebearer'
spirit-powers.namebearer.description: 'The spirit is named by the summoner. Even if destroyed, this specific spirit can be summoned again with all the knowledge and experiences it had before its destruction. While this preserves its personality and experiences, this also means that you must summon it with the same physical or spiritual manifestation and can only ever add powers to it; once you imbue it with Hideous Talons, for example, every future summoning of it must also have that power. Namebearers are slightly more durable, gaining +2 hit points per hit die. They’re also more willful, adding +2 to the difficulty of imposing an unnatural command on them.'
spirit-powers.natural-immunity.name: 'Natural Immunity'
spirit-powers.natural-immunity.description: 'The spirit is impervious to some substance appropriate to its nature: a fire spirit could be immune to fire, a storm spirit to electricity, or so forth. This imperviousness cannot render it immune to normal weapons or attacks, and the GM rules on edge cases.'
spirit-powers.poltergeist.name: 'Poltergeist'
spirit-powers.poltergeist.description: 'As a Main Action, the spirit can telekinetically manipulate unattended objects within 20 meters as if with two unseen hands. This manipulation can lift no more than 20 kilograms and is too imprecise to deliver effective attacks or impede a resisting subject. Actions taken with this power do not disrupt Ghostly Presence, even if they cause a disturbance.'
spirit-powers.skilled.name: 'Skilled'
spirit-powers.skilled.description: 'The spirit is talented at a particular non-combat skill, gaining an additional +2 bonus to all rolls related to its use.'
spirit-powers.spiderlegs.name: 'Spiderlegs'
spirit-powers.spiderlegs.description: 'The spirit can stand or walk on sheer or overhanging surfaces as if they were flat ground.'
spirit-powers.spirit-of-war.name: 'Spirit of War'
spirit-powers.spirit-of-war.description: 'A spirit with a Violent Will has the power enhanced, granting it a tremendous zeal for bloodshed. It gains a bonus to its hit roll equal to your Summon skill and no longer resists commands to engage in suicidal battles. It is incapable of inflicting non-lethal damage with its attacks, however, and will resist commands to spare downed opponents.'
spirit-powers.spirit-whispers.name: 'Spirit Whispers'
spirit-powers.spirit-whispers.description: 'As a Main Action, the spirit can make a suggestion to a listener that isn’t longer than one sentence. If the suggestion is not deeply contrary to the target’s nature or interests, they must make a Mental save or else carry it out for at least one round. If not given a reason to desist, the target may carry out the suggestion until it is complete or an hour has passed. A target can be subject to Spirit Whispers only once per scene.'
spirit-powers.spirits-eye.name: 'Spirit’s Eye'
spirit-powers.spirits-eye.description: 'The spirit is capable of seeing clearly in the dark, hearing whispers at twenty meters, and identifying people by the scent they leave on objects they have recently touched. All Notice skill checks are made at +2.'
spirit-powers.swift-pursuit.name: 'Swift Pursuit'
spirit-powers.swift-pursuit.description: 'The spirit’s Move rating is increased by 10m. It gains a +2 bonus on all skill checks related to chasing down a target.'
spirit-powers.violent-will.name: 'Violent Will'
spirit-powers.violent-will.description: 'A Physical Form spirit gains a base attack bonus equal to its hit dice +1 and does 1d10 damage on a melee hit plus one-half its hit dice, rounded down, with a melee Shock rating equal to half its hit dice, rounded down, against AC 15. At 5th level this attack can be used at range, up to 100 meters distant. If used lethally, the attack has a Trauma Rating of 1d8/x3. The spirit acts independently on its summoner’s initiative in combat. Spirit Forms cannot take this power, and cannot directly harm creatures.'
spirits.spirit.name: 'Summoned spirit'
spirits.spirit.description: |-
  Every summoned spirit shares a few basic qualities. Spirits can:

  * Think with human intelligence and carry out verbal orders reasonably and intelligently.

  * Exist without food, water, or air, and resist all mundane toxins, diseases, and radiation.

  * Speak, read, and write any languages known to their summoner.

  * Gain their skill bonus when performing skill checks related to their nature.

  * Ignore Morale checks, being solely subject to their summoner’s commands within the limits of their nature.

  Along with these abilities, there are some things that spirits simply can’t do.

  * Use weapons or armor, as spirits can use only such things as are part of their own being.

  * Operate human technology beyond pushing a single button. They understand the uses of such devices, but simply cannot conceive of using them personally.

  * Attack or directly harm humans, creatures, or other spirits without the Violent Will power. Only spirits in physical form can take this power.

  * Act directly contrary to their nature or accept a suicidal order without attempting to resist it.

  Some of these limits can be at least partially circumvented with the right spirit powers.
spirits.spirit.choices.powers.prompt: 'Spirit powers'
