fields.skills.cast.base.name: 'Cast (trained)'
fields.skills.cast.credit.name: 'Cast skill point credit'
fields.skills.cast.level.description: 'Cast spells, know about magic, know about important magical events.'
tags.skill.cast.name: 'Cast'
