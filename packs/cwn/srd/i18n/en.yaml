fields.skills.administer.level.name: 'Administer'
fields.skills.administer.base.name: 'Administer (trained)'
fields.skills.administer.credit.name: 'Administer skill point credit'
fields.skills.administer.level.description: 'Manage an organization, handle paperwork, analyze records, and keep an institution functioning on a daily basis. Roll it for bureaucratic expertise, organizational management, legal knowledge, dealing with government agencies, and understanding how corps really work.'
tags.skill.administer.name: 'Administer'
fields.skills.connect.level.name: 'Connect'
fields.skills.connect.base.name: 'Connect (trained)'
fields.skills.connect.credit.name: 'Connect skill point credit'
fields.skills.connect.level.description: 'Find people who can be helpful to your purposes and get them to cooperate with you. Roll it to make useful connections with others, find people you know, know where to get illicit goods and services, and be familiar with foreign cultures and languages. You can use it in place of Talk for persuading people you find via this skill. Note that the people you meet via Connect are not necessarily inclined to work with you without a good reason; if you want reliably cooperative allies, you need Contacts.'
tags.skill.connect.name: 'Connect'
fields.skills.drive.level.name: 'Drive'
fields.skills.drive.base.name: 'Drive (trained)'
fields.skills.drive.credit.name: 'Drive skill point credit'
fields.skills.drive.level.description: 'Drive vehicles, sail ships, fly planes, pilot drones, and perform maintenance and basic repairs on such devices. A PC’s background may incline them to a particular kind of driving, but with some practice this skill can be applied generally.'
tags.skill.drive.name: 'Drive'
fields.skills.exert.level.name: 'Exert'
fields.skills.exert.base.name: 'Exert (trained)'
fields.skills.exert.credit.name: 'Exert skill point credit'
fields.skills.exert.level.description: 'Apply trained speed, strength, or stamina in some feat of physical exertion. Roll it to run, jump, lift, swim, climb, throw, and so forth. You can use it as a combat skill when throwing things, though it doesn’t qualify as a combat skill for other uses.'
tags.skill.exert.name: 'Exert'
fields.skills.fix.level.name: 'Fix'
fields.skills.fix.base.name: 'Fix (trained)'
fields.skills.fix.credit.name: 'Fix skill point credit'
fields.skills.fix.level.description: 'Create and repair devices both simple and complex. Your PC may be specialized in some field depending on their background, but this skill can be applied generally by most operators. Roll it to fix things, build things, and identify what something is supposed to do.'
tags.skill.fix.name: 'Fix'
fields.skills.heal.level.name: 'Heal'
fields.skills.heal.base.name: 'Heal (trained)'
fields.skills.heal.credit.name: 'Heal skill point credit'
fields.skills.heal.level.description: 'Employ medical and psychological treatment for the injured or disturbed. Roll it to cure diseases, stabilize the critically injured, treat psychological disorders, or diagnose illnesses. It’s also an important skill for implanting and maintaining cyberware.'
tags.skill.heal.name: 'Heal'
fields.skills.know.level.name: 'Know'
fields.skills.know.base.name: 'Know (trained)'
fields.skills.know.credit.name: 'Know skill point credit'
fields.skills.know.level.description: 'Know facts about academic or scientific fields. Roll it to understand academic topics, remember relevant history, solve science mysteries, and know the basic facts about rare or esoteric topics.'
tags.skill.know.name: 'Know'
fields.skills.lead.level.name: 'Lead'
fields.skills.lead.base.name: 'Lead (trained)'
fields.skills.lead.credit.name: 'Lead skill point credit'
fields.skills.lead.level.description: 'Convince others to also do whatever it is you’re trying to do. Talk might persuade them that following you is smart, but Lead can make them do it even when they think it’s a bad idea. Roll it to lead troops in combat, convince others to follow you, inspire employee loyalty, or maintain morale and discipline.'
tags.skill.lead.name: 'Lead'
fields.skills.notice.level.name: 'Notice'
fields.skills.notice.base.name: 'Notice (trained)'
fields.skills.notice.credit.name: 'Notice skill point credit'
fields.skills.notice.level.description: 'Spot anomalies or interesting facts about your environment. Roll it for searching places, detecting ambushes, spotting things, and reading the emotional state of other people.'
tags.skill.notice.name: 'Notice'
fields.skills.perform.level.name: 'Perform'
fields.skills.perform.base.name: 'Perform (trained)'
fields.skills.perform.credit.name: 'Perform skill point credit'
fields.skills.perform.level.description: 'Exhibit some performance skill. Roll it to dance, sing, orate, act, or otherwise put on a convincing or emotionally moving performance.'
tags.skill.perform.name: 'Perform'
fields.skills.program.level.name: 'Program'
fields.skills.program.base.name: 'Program (trained)'
fields.skills.program.credit.name: 'Program skill point credit'
fields.skills.program.level.description: 'Operating or hacking computing and communications hardware. Roll it to program or hack computers, control computer-operated hardware, operate communications tech, or decrypt things. Hacker PCs rely heavily on this skill.'
tags.skill.program.name: 'Program'
fields.skills.punch.level.name: 'Punch'
fields.skills.punch.base.name: 'Punch (trained)'
fields.skills.punch.credit.name: 'Punch skill point credit'
fields.skills.punch.level.description: 'Use it as a combat skill when fighting unarmed. If your PC means to make a habit of this rather than as a recourse of desperation, you should take the Unarmed Combatant Focus described later.'
tags.skill.punch.name: 'Punch'
fields.skills.shoot.level.name: 'Shoot'
fields.skills.shoot.base.name: 'Shoot (trained)'
fields.skills.shoot.credit.name: 'Shoot skill point credit'
fields.skills.shoot.level.description: 'Use it as a combat skill when using ranged weaponry, whether thrown weapons, bows, gunlinked pistols, combat rifles, or heavy artillery.'
tags.skill.shoot.name: 'Shoot'
fields.skills.sneak.level.name: 'Sneak'
fields.skills.sneak.base.name: 'Sneak (trained)'
fields.skills.sneak.credit.name: 'Sneak skill point credit'
fields.skills.sneak.level.description: 'Move without drawing notice. Roll it for stealth, disguise, infiltration, manual legerdemain, pickpocketing, and the physical defeating of security measures such as electronic locks.'
tags.skill.sneak.name: 'Sneak'
fields.skills.stab.level.name: 'Stab'
fields.skills.stab.base.name: 'Stab (trained)'
fields.skills.stab.credit.name: 'Stab skill point credit'
fields.skills.stab.level.description: 'Use it as a combat skill when wielding melee weapons, whether primitive or complex. It can also be used when throwing weapons.'
tags.skill.stab.name: 'Stab'
fields.skills.survive.level.name: 'Survive'
fields.skills.survive.base.name: 'Survive (trained)'
fields.skills.survive.credit.name: 'Survive skill point credit'
fields.skills.survive.level.description: 'Depending on the character’s background, this might be more a matter of street smarts and urban survival or it might be directed towards outlands bushcraft and wilderness living. Regardless of the original focus, some time and practice can allow it to be generalized by a PC.'
tags.skill.survive.name: 'Survive'
fields.skills.talk.level.name: 'Talk'
fields.skills.talk.base.name: 'Talk (trained)'
fields.skills.talk.credit.name: 'Talk skill point credit'
fields.skills.talk.level.description: 'Convince other people of the facts you want them to believe. What they do with that conviction may not be completely predictable. Roll it to persuade, charm, or deceive others in conversation.'
tags.skill.talk.name: 'Talk'
fields.skills.trade.level.name: 'Trade'
fields.skills.trade.base.name: 'Trade (trained)'
fields.skills.trade.credit.name: 'Trade skill point credit'
fields.skills.trade.level.description: 'Find what you need on the market and sell what you have. Roll it to sell or buy things, figure out where to purchase hard-to-get or illicit goods, deal with customs agents, or run a business.'
tags.skill.trade.name: 'Trade'
fields.skills.work.level.name: 'Work'
fields.skills.work.base.name: 'Work (trained)'
fields.skills.work.credit.name: 'Work skill point credit'
fields.skills.work.level.description: 'This is a catch-all skill for professions not represented by other skills. When you take it, pick a particular profession, such as lawyering, stevedore work, painting, or some other career. The skill then applies to performing that work or making contacts with people in its sphere.'
tags.skill.work.name: 'Work'
