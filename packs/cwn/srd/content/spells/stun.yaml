id: spells.stun
type: spell
fields:
  effort: either
  duration: instant
# The damage at the caster's level.
computed:
  damage: { type: string, formula: "string(level) + 'd6'" }
effects:
  # A second cast in a scene Commits Effort for the day.
  - target: { steps: [spell.effort], from: self }
    op: changes
    when: self.sceneCasts >= 1
    value: { flags: { commit: "'day'" } }
