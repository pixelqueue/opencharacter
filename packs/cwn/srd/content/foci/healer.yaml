id: foci.healer
type: focus
fields:
  bonusSkill: heal
effects:
  # Heal checks: 3d6, the lowest dropped. Not with a Heal Specialist's dice, which are at least
  # as many: the larger pool applies.
  - target:
      rolls:
        - skill.heal
    op: rollModifier
    value:
      kind: poolDice
      count: 1
    when: "!('heal' in picksOf('foci.specialist', 'skill'))"
