actions:
  # Gain a level: a third Edge at 5th level, a Focus level at 2nd, 5th, 7th and 10th, new hit
  # points, and skill points to spend.
  - id: level-up
    tags: [advancement]
    available: '!character.creating && level < 10'
    params:
      random: { type: boolean, default: false }
    results: [raised]
    steps:
      - id: raise
        kind: changes
        changes:
          - { type: adjust, field: level, by: 1 }
      - id: edge
        kind: action
        when: level + 1 == 5
        use: gain-edge
        params: { choice: "'edge-5'", random: params.random }
      - id: focus
        kind: action
        when: (level + 1) in [2, 5, 7, 10]
        use: gain-focus
        params: { random: params.random }
      # Hit points: roll 1d6 per level, each plus the Constitution modifier (and Hard to Kill's
      # +2) and at least 1. A total over the old maximum replaces it; otherwise it rises by one.
      - id: dice
        kind: branch
        sheet: proposed
        cases:
          - when: true
            flags:
              perDie: attributes.con.mod + hp.dieBonus
              dice: level
      - id: hp
        kind: roll
        tags: [hit-points]
        parts:
          - dice: >-
              flags.perDie >= 0 ? (flags.dice)d6 : flags.perDie == -1 ? (flags.dice)d6min2
                : flags.perDie == -2 ? (flags.dice)d6min3 : flags.perDie == -3 ? (flags.dice)d6min4
                : (flags.dice)d6min5
          - value: flags.dice * flags.perDie
      - id: gains
        kind: changes
        sheet: proposed
        changes:
          - { type: set, field: hp.rolled, value: 'max(steps.hp.total, hp.rolled + 1)' }
          - { type: adjust, field: skillPoints.unspent, by: skillPoints.perLevel }
      # Choices the new level opens (All Natural's attribute picks).
      - id: picks
        kind: choice
        options: { pending: {} }
        random: params.random
      - { id: done, kind: outcome, result: "'raised'" }

  # Spend skill points on the next level of a skill: level-0 costs 1, level-1 2, level-2 3 (from
  # 3rd level), level-3 4 (from 6th) and level-4 5 (from 9th). Banked credit is spent first.
  - id: improve-skill
    tags: [advancement]
    available: '!character.creating'
    params:
      skill:
        type: enum
        values:
          [
            administer,
            connect,
            drive,
            exert,
            fix,
            heal,
            know,
            lead,
            notice,
            perform,
            program,
            punch,
            shoot,
            sneak,
            stab,
            survive,
            talk,
            trade,
            work,
            cast,
            summon,
          ]
    results: [improved, refused]
    steps:
      - id: start
        kind: branch
        cases:
          - when: true
            flags:
              level: fieldOf('skills.{skill}.base', params.skill)
              credit: fieldOf('skills.{skill}.credit', params.skill)
      - id: cost
        kind: branch
        cases:
          - when: flags.level < 4
            flags:
              cost: flags.level + 2
              allowed: >-
                level >= [1, 1, 3, 6, 9][flags.level + 1]
                  && skillPoints.unspent + flags.credit >= flags.level + 2
          - when: true
            flags: { cost: 0, allowed: false }
      - id: buy
        kind: changes
        when: flags.allowed
        changes:
          - type: set
            field: { formula: "'skills.' + params.skill + '.base'" }
            value: flags.level + 1
          - type: set
            field: { formula: "'skills.' + params.skill + '.credit'" }
            value: max(0, flags.credit - flags.cost)
          - type: adjust
            field: skillPoints.unspent
            by: -max(0, flags.cost - flags.credit)
      - id: result
        kind: outcome
        result: "flags.allowed ? 'improved' : 'refused'"

  # Spend skill points on an attribute boost: +1 to a score, costing 1 for the first boost, 2 for
  # the second and so on. The third needs 3rd level, the fourth 6th and the fifth 9th; five in
  # all. Not for characters who took the Underdog Rule.
  - id: improve-attribute
    tags: [advancement]
    available: '!character.creating && !underdog && advancement.attributeBoosts < 5'
    params:
      attribute: { type: enum, values: [str, dex, con, int, wis, cha] }
    results: [improved, refused]
    steps:
      - id: start
        kind: branch
        cases:
          - when: true
            flags:
              cost: advancement.attributeBoosts + 1
              allowed: >-
                skillPoints.unspent >= advancement.attributeBoosts + 1
                  && level >= [1, 1, 3, 6, 9][advancement.attributeBoosts]
                  && fieldOf('attributes.{attribute}.base', params.attribute) < 18
      - id: buy
        kind: changes
        when: flags.allowed
        changes:
          - type: adjust
            field: { formula: "'attributes.' + params.attribute + '.base'" }
            by: 1
          - { type: adjust, field: advancement.attributeBoosts, by: 1 }
          - { type: adjust, field: skillPoints.unspent, by: -flags.cost }
      - id: result
        kind: outcome
        result: "flags.allowed ? 'improved' : 'refused'"
