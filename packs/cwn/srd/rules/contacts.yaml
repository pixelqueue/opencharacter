contentTypes:
  # A Contact: an NPC the character knows, named by the player. Acquaintances deal honestly and do
  # safe favors; Friends take real risks for the character.
  contact:
    nameFrom: label
    state:
      label: { type: string, default: '' }
      bond: { type: enum, values: [acquaintance, friend], default: acquaintance }
      # Their profession and how the character knows them.
      about: { type: string, default: '' }
