contentTypes:
  # Weapons. A Readied weapon is `equipped`. Firearms track the rounds left in the magazine.
  weapon:
    carried: true
    equippable: true
    fields:
      cost: { type: integer, default: 0, min: 0 }
      enc: { type: integer, min: 0 }
      damage: { type: dice, required: true }
      # The combat skill: `shoot`, `stab` or `punch`. Thrown weapons may also use Exert or Stab.
      skill: { type: enum, values: [shoot, stab, punch], required: true, open: true }
      # The attribute that modifies hit and damage: the better of two where two are listed.
      attribute: { type: enum, values: [str, dex, str-dex, wis, none], required: true }
      rangeNormal: { type: integer, min: 0 }
      rangeLong: { type: integer, min: 0 }
      magazine: { type: integer, min: 1 }
      # Shock: damage on a miss against a target whose Melee AC is at most `shockAc` (any AC when
      # it has none).
      shockDamage: { type: integer, min: 0 }
      shockAc: { type: integer, min: 0 }
      traumaDie: { type: dice }
      traumaRating: { type: integer, min: 1 }
      # Bonuses mods add.
      attackBonus: { type: integer, default: 0 }
      damageBonus: { type: integer, default: 0 }
      shockBonus: { type: integer, default: 0 }
      traumaDieBonus: { type: integer, default: 0 }
    state:
      loaded:
        type: integer
        default: 'has(item.magazine) ? item.magazine : 0'
        min: 0
        max: 'has(item.magazine) ? item.magazine : 0'
    # The weapon's numbers as an attack with it starts: the better attribute, single fire, not
    # thrown, before situational modifiers.
    computed:
      attributeMod:
        type: integer
        formula: >-
          item.attribute == 'none' ? 0
            : item.attribute == 'str-dex' ? max(attributes.str.mod, attributes.dex.mod)
            : fieldOf('attributes.{attribute}.mod', item.attribute)
      ranged: { type: boolean, formula: "has(item.rangeNormal) && !('melee' in item.tags)" }
      skillDamage:
        type: integer
        formula: >-
          'unarmed' in item.tags ? 0
            : 'thrown' in item.tags ? max(combat.meleeSkillDamage, combat.rangedSkillDamage)
            : self.ranged ? combat.rangedSkillDamage : combat.meleeSkillDamage
      # The combat skill: a throwable's best of Shoot, Stab and Exert.
      skillLevel:
        type: integer
        formula: >-
          'thrown' in item.tags ? max(skills.shoot.level, skills.stab.level, skills.exert.level)
            : fieldOf('skills.{skill}.level', item.skill)
      # Attack bonus, attribute, combat skill (-2 untrained) and the weapon's and Armsmaster's
      # bonuses.
      hit:
        type: integer
        formula: >-
          combat.attackBonus + self.attributeMod + item.attackBonus
            + (self.skillLevel >= 0 ? self.skillLevel : -2)
            + (!('unarmed' in item.tags) && (!self.ranged || 'thrown' in item.tags)
              ? combat.meleeHitBonus : 0)
      # Added to the damage die.
      damage:
        type: integer
        formula: >-
          self.attributeMod + item.damageBonus + self.skillDamage + combat.damageBonus
            + ('unarmed' in item.tags ? max(0, skills.punch.level) : 0)
      shock:
        type: integer
        formula: >-
          has(item.shockDamage) && item.shockDamage > 0 && !self.ranged
            ? max(0, item.shockDamage + self.attributeMod + item.shockBonus + combat.shockBonus
              + combat.damageBonus + self.skillDamage)
            : 0
    effects:
      # What a weapon offers on each attack: the better of Strength and Dexterity unless the
      # player picks, throwing a melee weapon with a range, and burst fire.
      - target: { actions: [attack], from: self }
        op: params
        when: item.attribute == 'str-dex'
        value:
          attribute: { type: enum, values: [str, dex], optional: true }
      - target: { actions: [attack], from: self }
        op: params
        when: "'melee' in item.tags && has(item.rangeNormal)"
        value:
          thrown: { type: boolean, default: false }
      - target: { actions: [attack], from: self }
        op: params
        when: "'burst' in item.tags"
        value:
          burst: { type: boolean, default: false }
      - target: { steps: [attack.options], from: self }
        op: changes
        when: has(params.attribute)
        value: { flags: { attribute: params.attribute } }
      - target: { steps: [attack.options], from: self }
        op: changes
        when: has(params.thrown) && params.thrown
        value: { flags: { ranged: 'true', thrown: 'true' } }
      - target: { steps: [attack.options], from: self }
        op: changes
        when: has(params.burst) && params.burst && self.loaded >= 3
        value: { flags: { burst: 'true' } }
    actions:
      - use: attack
      - use: reload

  # The unarmed attack every character has.
standardCopies:
  - { type: weapon, where: "'standard' in item.tags" }

fields:
  # The highest Melee AC melee Shock treats a target as having: Armsmaster 2, Close Combatant 2
  # and Shocking Assault treat every target as AC 10.
  combat.shockAc: { type: integer, formula: '99' }
  # A bonus to melee and unarmed Shock (Shocking Assault 2).
  combat.shockBonus: { type: integer, formula: '0' }
  # A combat skill added to damage: Stab to melee and thrown weapons and their Shock
  # (Armsmaster), Shoot to ranged weapons (Deadeye). A thrown weapon takes the better one.
  combat.meleeSkillDamage: { type: integer, formula: '0' }
  combat.rangedSkillDamage: { type: integer, formula: '0' }
  # A bonus to hit with melee and thrown weapons, not unarmed attacks (Armsmaster 2).
  combat.meleeHitBonus: { type: integer, formula: '0' }

resultBands:
  hit:
    - { id: hit, when: roll.total >= flags.ac, success: true }
    - { id: miss, when: true }
  trauma:
    - { id: traumatic, when: roll.total >= flags.traumaTarget }
    - { id: none, when: true }

actions:
  # Attack with a weapon: 1d20 + attack bonus + the attribute modifier + the combat skill (-2
  # with no skill) against the target's Ranged or Melee AC. A hit rolls damage and the Trauma
  # Die; a Traumatic Hit multiplies the damage by the Trauma Rating. A melee miss may still deal
  # Shock. Burst fire spends three rounds for +2 to hit and damage. The weapon type adds the
  # attribute, thrown and burst parameters where a weapon offers them, read in `options`.
  - id: attack
    tags: [attack]
    available: >-
      (self.equipped || 'standard' in item.tags || 'implant' in item.tags)
        && !('trap' in item.tags) && (!has(item.magazine) || self.loaded >= 1)
    params:
      lethal: { type: boolean, optional: true }
      targetAc: { type: integer, optional: true }
      targetTrauma: { type: integer, optional: true }
      modifier: { type: integer, optional: true }
    participants:
      target:
        max: 1
        fields:
          ac.ranged: { type: integer }
          ac.melee: { type: integer }
          trauma.target: { type: integer, default: 6 }
    results: [hit, miss, rolled]
    steps:
      - id: start
        kind: branch
        cases:
          - when: true
            flags:
              ranged: has(item.rangeNormal) && !('melee' in item.tags)
              thrown: "'thrown' in item.tags"
              attribute: >-
                item.attribute == 'none' ? ''
                  : item.attribute != 'str-dex' ? item.attribute
                  : attributes.dex.mod > attributes.str.mod ? 'dex' : 'str'
              burst: 'false'
              nonlethal: "has(params.lethal) ? !params.lethal : 'nonlethal' in item.tags"
      # The weapon's own parameters: the attribute picked, a throw, burst fire.
      - { id: options, kind: changes, tags: [attack.options] }
      - id: pick
        kind: branch
        cases:
          - when: true
            flags:
              skill: >-
                flags.thrown ? max(skills.shoot.level, skills.stab.level, skills.exert.level)
                  : fieldOf('skills.{skill}.level', item.skill)
              ac: >-
                'grenade' in item.tags ? 10
                  : size(participants.target) > 0
                  ? (flags.ranged ? participants.target[0].ac.ranged
                    : participants.target[0].ac.melee)
                  : has(params.targetAc) ? params.targetAc : -1
              meleeAc: >-
                size(participants.target) > 0 ? participants.target[0].ac.melee
                  : has(params.targetAc) ? params.targetAc : -1
              traumaTarget: >-
                size(participants.target) > 0 ? participants.target[0].trauma.target
                  : has(params.targetTrauma) ? params.targetTrauma : 6
      - id: mod
        kind: branch
        cases:
          - when: true
            flags:
              attrMod: "flags.attribute == '' ? 0 : fieldOf('attributes.{attribute}.mod', flags.attribute)"
              # Armsmaster and Deadeye: a skill's level to damage (and Armsmaster's to Shock).
              skillDamage: >-
                'unarmed' in item.tags ? 0
                  : flags.thrown ? max(combat.meleeSkillDamage, combat.rangedSkillDamage)
                  : flags.ranged ? combat.rangedSkillDamage : combat.meleeSkillDamage
              meleeHit: >-
                !('unarmed' in item.tags) && (!flags.ranged || flags.thrown)
                  ? combat.meleeHitBonus : 0
      - id: hit
        kind: roll
        tags:
          - attack
          - { formula: "flags.ranged ? 'attack.ranged' : 'attack.melee'" }
          - { formula: "'skill.' + item.skill" }
        bands: hit
        parts:
          - dice: 1d20
          - field: "'combat.attackBonus'"
          - { value: flags.attrMod, tags: [attack.attribute] }
          - { value: 'flags.skill >= 0 ? flags.skill : -2', tags: [attack.skill] }
          - { value: item.attackBonus, when: item.attackBonus != 0 }
          - { value: flags.meleeHit, when: flags.meleeHit != 0 }
          - { value: 2, when: flags.burst, tags: [attack.burst] }
          - { value: params.modifier, when: has(params.modifier) }
      - id: landed
        kind: branch
        cases:
          - when: true
            flags:
              hit: flags.ac < 0 || steps.hit.band == 'hit'
              shock: >-
                has(item.shockDamage) && item.shockDamage > 0 && !flags.ranged
                  && (!has(item.shockAc) || flags.meleeAc < 0
                    || min(flags.meleeAc, combat.shockAc) <= item.shockAc)
                  ? max(0, item.shockDamage + flags.attrMod + item.shockBonus
                    + combat.shockBonus + combat.damageBonus + flags.skillDamage)
                  : 0
      - id: damage
        kind: roll
        when: flags.hit
        tags:
          - damage
          - { formula: "flags.ranged ? 'damage.ranged' : 'damage.melee'" }
          - { formula: "'skill.' + item.skill" }
        parts:
          - dice: item.damage
          - { value: flags.attrMod, tags: [damage.attribute] }
          - { value: 2, when: flags.burst, tags: [damage.burst] }
          - { value: item.damageBonus, when: item.damageBonus != 0 }
          - { value: flags.skillDamage, when: flags.skillDamage != 0, tags: [damage.skill] }
          - { field: "'combat.damageBonus'" }
          - value: skills.punch.level
            when: "'unarmed' in item.tags && skills.punch.level > 0"
            tags: [damage.punch]
      - id: trauma
        kind: roll
        when: flags.hit && has(item.traumaDie) && !flags.nonlethal
        tags: [trauma]
        bands: trauma
        parts:
          - dice: item.traumaDie
          - { value: item.traumaDieBonus, when: item.traumaDieBonus != 0 }
          - { field: "'combat.traumaBonus'" }
      - id: total
        kind: branch
        cases:
          - when: flags.hit
            flags:
              traumatic: has(steps.trauma) && steps.trauma.band == 'traumatic'
              dealt: >-
                max(0, max(steps.damage.total, flags.shock))
                  * (has(steps.trauma) && steps.trauma.band == 'traumatic' ? item.traumaRating : 1)
          - when: true
            flags: { traumatic: false, dealt: flags.shock }
      # Once the rolls are made: where content pays for them (Martial Instinct).
      - { id: rolled, kind: changes, tags: [attack.rolled] }
      - id: ammo
        kind: changes
        when: has(item.magazine)
        changes:
          - { type: adjustState, entry: self, key: loaded, by: 'flags.burst ? -3 : -1' }
      - id: deal
        kind: changes
        when: flags.dealt > 0
        to: target
        changes:
          - type: adjust
            field: hp.current
            by: -flags.dealt
            tags:
              - damage
              - damage.weapon
              - { formula: "flags.nonlethal ? ['damage.nonlethal'] : []" }
              - { formula: "flags.traumatic ? ['damage.traumatic'] : []" }
      - id: result
        kind: outcome
        result: "flags.ac < 0 ? 'rolled' : flags.hit ? 'hit' : 'miss'"
        data:
          damage: flags.dealt
          traumatic: flags.traumatic
          shock: flags.shock

  # Reload a firearm: fill its magazine.
  - id: reload
    tags: [reload]
    available: has(item.magazine) && self.loaded < item.magazine
    results: [reloaded]
    steps:
      - id: fill
        kind: changes
        changes:
          - { type: setState, entry: self, key: loaded, value: item.magazine }
      - { id: result, kind: outcome, result: "'reloaded'" }
