id: spells.bestow-curse
type: spell
fields:
  level: 3
  school: necromancy
  classes: [classes.bard, classes.cleric, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: false
  durationUnit: minute
  durationAmount: 1
  save: wis
  saveEffect: none
  applied: true
  castOptions: [str, dex, con, int, wis, cha, attacks, dodge, necrotic]
actions:
  - use: cast-spell
effects:
  - target: { rolls: [check.str, save.str] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'str'
    scope: applied
  - target: { rolls: [check.dex, save.dex] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'dex'
    scope: applied
  - target: { rolls: [check.con, save.con] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'con'
    scope: applied
  - target: { rolls: [check.int, save.int] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'int'
    scope: applied
  - target: { rolls: [check.wis, save.wis] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'wis'
    scope: applied
  - target: { rolls: [check.cha, save.cha] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'cha'
    scope: applied
