id: spells.bestow-curse
type: spell
# The ability curse is on the sheet; the other three are the caster's and the text.
fields:
  level: 3
  school: necromancy
  classes: [classes.bard, classes.cleric, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: false
  durationUnit: minute
  durationAmount: 1
  save: wis
  saveEffect: none
  applied: true
state:
  curse:
    { type: enum, values: [str, dex, con, int, wis, cha, attacks, dodge, necrotic], default: str }
actions:
  - use: cast-spell
  # The chosen option is state on the applied spell; it starts as the first.
  - id: choose
    scope: applied
    tags: [spell]
    results: [chosen]
    steps:
      - id: option
        kind: choice
        options:
          - id: str
            changes:
              - { type: setState, entry: self, key: curse, value: "'str'" }
          - id: dex
            changes:
              - { type: setState, entry: self, key: curse, value: "'dex'" }
          - id: con
            changes:
              - { type: setState, entry: self, key: curse, value: "'con'" }
          - id: int
            changes:
              - { type: setState, entry: self, key: curse, value: "'int'" }
          - id: wis
            changes:
              - { type: setState, entry: self, key: curse, value: "'wis'" }
          - id: cha
            changes:
              - { type: setState, entry: self, key: curse, value: "'cha'" }
          - id: attacks
            changes:
              - { type: setState, entry: self, key: curse, value: "'attacks'" }
          - id: dodge
            changes:
              - { type: setState, entry: self, key: curse, value: "'dodge'" }
          - id: necrotic
            changes:
              - { type: setState, entry: self, key: curse, value: "'necrotic'" }
        recommend: self.curse
      - id: result
        kind: outcome
        result: "'chosen'"
effects:
  - target: { rolls: [check.str, save.str] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.curse == 'str'
    scope: applied
  - target: { rolls: [check.dex, save.dex] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.curse == 'dex'
    scope: applied
  - target: { rolls: [check.con, save.con] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.curse == 'con'
    scope: applied
  - target: { rolls: [check.int, save.int] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.curse == 'int'
    scope: applied
  - target: { rolls: [check.wis, save.wis] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.curse == 'wis'
    scope: applied
  - target: { rolls: [check.cha, save.cha] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.curse == 'cha'
    scope: applied
