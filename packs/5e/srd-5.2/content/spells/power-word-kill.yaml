id: spells.power-word-kill
type: spell
fields:
  level: 9
  school: enchantment
  classes: [classes.bard, classes.sorcerer, classes.warlock, classes.wizard]
  castingTime: action
  rangeKind: ranged
  range: 60
  verbal: true
  somatic: false
  material: false
  durationUnit: instantaneous
  damageType: psychic
  damage: 12d12
effects:
  - target: { steps: [spell.target] }
    op: changes
    when: action.item.id == item.id && has(participant.hp.current)
    value:
      changes:
        - { type: set, when: participant.hp.current <= 100, field: hp.current, value: 0 }
        - type: set
          when: participant.hp.current <= 100
          field: deathSaves.failures
          value: 3
        - type: adjust
          when: participant.hp.current > 100
          field: hp.current
          by: -max(0, steps.damage.total)
          tags: [damage, damage.psychic, spell, magical]
actions:
  - use: cast-spell
