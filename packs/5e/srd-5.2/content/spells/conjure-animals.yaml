id: spells.conjure-animals
type: spell
fields:
  level: 3
  school: conjuration
  classes: [classes.druid, classes.ranger]
  concentration: true
  castingTime: action
  rangeKind: ranged
  range: 60
  verbal: true
  somatic: true
  material: false
  durationUnit: minute
  durationAmount: 10
actions:
  - use: cast-spell
  - id: pack
    tags: [spell]
    params:
      slot: { type: integer, optional: true, min: 1, max: 9 }
    participants:
      target: { fields: target }
    results: [save]
    steps:
      - id: effect
        kind: action
        use: spell-effect
        participants: { target: participants.target }
        params:
          save: "'dex'"
          dice: 'dieOf(1d10, 3 + max(0, (has(params.slot) ? params.slot : item.level) - item.level))'
          damageType: "'slashing'"
      - id: result
        kind: outcome
        result: steps.effect.result
        data:
          damage: steps.effect.data.damage
