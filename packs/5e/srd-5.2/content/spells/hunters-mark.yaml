id: spells.hunters-mark
type: spell
fields:
  level: 1
  school: divination
  classes: [classes.ranger]
  concentration: true
  castingTime: bonus-action
  rangeKind: ranged
  range: 90
  verbal: true
  somatic: false
  material: false
  durationUnit: hour
  durationAmount: 1
  applied: true
actions:
  - use: cast-spell
  - id: move
    tags: [spell]
    participants: { target: { max: 1 } }
    results: [moved]
    steps:
      # Ends the caster's mark wherever it is (the app sends it to whoever holds one), then marks
      # the new creature.
      - id: unmark
        kind: changes
        to: applied
        changes:
          - type: removeEffect
            applied: { where: item.id == @spells.hunters-mark }
      - id: mark
        kind: changes
        to: target
        changes:
          - { type: applyEffect, source: item.id }
      - id: result
        kind: outcome
        result: "'moved'"
effects:
  - target: { rolls: [damage] }
    op: add
    value: huntersMark.die
    tags: [damage.force]
    when: >-
      has(flags.hit) && flags.hit && has(participants.target) && size(participants.target) > 0
        && character.id in participants.target[0].huntersMark.markedBy
