id: spells.chromatic-orb
type: spell
fields:
  level: 1
  school: evocation
  classes: [classes.sorcerer, classes.wizard]
  castingTime: action
  rangeKind: ranged
  range: 90
  verbal: true
  somatic: true
  material: true
  durationUnit: instantaneous
  attack: ranged
  damage: 3d8
  upcastDice: 1
# The orb's type is picked per cast: a parameter of its own cast-spell, which sets the damage type
# the cast's damage roll reads. A leap (matching dice) is the `orb` action, with no slot spent.
effects:
  - target: { actions: [spell.cast], from: self }
    op: params
    value:
      damageType:
        { type: enum, values: [acid, cold, fire, lightning, poison, thunder], default: acid }
  - target: { steps: [spell.cast], from: self }
    op: changes
    value:
      flags: { damageType: params.damageType }
actions:
  - use: cast-spell
  - id: orb
    tags: [spell]
    params:
      slot: { type: integer, optional: true, min: 1, max: 9 }
      targetAc: { type: integer, optional: true }
      damageType: { type: enum, values: [acid, cold, fire, lightning, poison, thunder] }
    participants:
      target: { fields: target }
    results: [hit, miss]
    steps:
      - id: effect
        kind: action
        use: spell-effect
        participants: { target: participants.target }
        params:
          attack: "'ranged'"
          dice: 'dieOf(1d8, 3 + max(0, (has(params.slot) ? params.slot : item.level) - item.level))'
          damageType: params.damageType
          targetAc: 'has(params.targetAc) ? params.targetAc : null'
      - id: result
        kind: outcome
        result: steps.effect.result
        data:
          damage: steps.effect.data.damage
