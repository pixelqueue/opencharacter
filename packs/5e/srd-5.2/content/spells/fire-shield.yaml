id: spells.fire-shield
type: spell
fields:
  level: 4
  school: evocation
  classes: [classes.druid, classes.sorcerer, classes.wizard]
  castingTime: action
  rangeKind: self
  verbal: true
  somatic: true
  material: true
  durationUnit: minute
  durationAmount: 10
  applied: true
state: { chill: { type: boolean, default: false } }
effects:
  - target: damage.resistances
    op: grant
    value: { tag: damage.cold }
    scope: applied
    when: '!self.chill'
    duration: { amount: 10, unit: minute }
  - target: damage.resistances
    op: grant
    value: { tag: damage.fire }
    scope: applied
    when: self.chill
    duration: { amount: 10, unit: minute }
# The warm shield unless `chill` is set (the `chill-shield` action, when you cast it).
actions:
  - use: cast-spell
  - id: chill-shield
    scope: applied
    tags: [spell]
    available: '!self.chill'
    results: [chill]
    steps:
      - id: set
        kind: changes
        changes:
          - { type: setState, entry: self, key: chill, value: true }
      - id: result
        kind: outcome
        result: "'chill'"
  - id: erupt
    tags: [spell]
    participants: { target: {} }
    results: [damage]
    steps:
      - id: setup
        kind: branch
        cases:
          - { when: true, flags: { slot: item.level, critical: 'false' } }
      - id: damage
        kind: roll
        tags: [damage.spell]
        parts:
          - dice: 2d8
            tags: [{ formula: "self.chill ? 'damage.cold' : 'damage.fire'" }]
      - id: deal
        kind: changes
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags:
              - damage
              - spell
              - magical
              - { formula: "flags.critical ? ['critical'] : []" }
      - id: result
        kind: outcome
        result: "'damage'"
        data: { damage: steps.damage.total }
    scope: applied
