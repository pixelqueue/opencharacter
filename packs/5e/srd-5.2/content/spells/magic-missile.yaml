id: spells.magic-missile
type: spell
fields:
  level: 1
  school: evocation
  classes: [classes.sorcerer, classes.wizard]
  castingTime: action
  rangeKind: ranged
  range: 120
  verbal: true
  somatic: true
  material: false
  durationUnit: instantaneous
actions:
  - use: cast-spell
  - id: dart
    tags: [spell]
    participants: { target: {} }
    results: [damage]
    steps:
      - id: setup
        kind: branch
        cases:
          - { when: true, flags: { slot: item.level, critical: 'false' } }
      - id: damage
        kind: roll
        tags: [damage.spell]
        parts:
          - { dice: 1d4, tags: [damage.force] }
          - { value: 1, tags: [damage.force] }
      - id: deal
        kind: changes
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags:
              - damage
              - spell
              - magical
              - { formula: "flags.critical ? ['critical'] : []" }
      - id: result
        kind: outcome
        result: "'damage'"
        data: { damage: steps.damage.total }
