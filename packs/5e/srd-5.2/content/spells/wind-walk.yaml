id: spells.wind-walk
type: spell
fields:
  level: 6
  school: transmutation
  classes: [classes.druid]
  castingTime: 1-minute
  rangeKind: ranged
  range: 30
  verbal: true
  somatic: true
  material: true
  durationUnit: hour
  durationAmount: 8
  applied: true
actions:
  - use: cast-spell
effects:
  - target: combat.flySpeed
    op: atLeast
    value: 300
    scope: applied
    duration: { amount: 8, unit: hour }
  - target: combat.hover
    op: set
    value: true
    scope: applied
    duration: { amount: 8, unit: hour }
  - target: conditions.immunities
    op: grant
    value: { formula: '@conditions.prone' }
    scope: applied
    duration: { amount: 8, unit: hour }
  - target: damage.resistances
    op: grant
    value: { tag: damage.bludgeoning }
    scope: applied
    duration: { amount: 8, unit: hour }
  - target: damage.resistances
    op: grant
    value: { tag: damage.piercing }
    scope: applied
    duration: { amount: 8, unit: hour }
  - target: damage.resistances
    op: grant
    value: { tag: damage.slashing }
    scope: applied
    duration: { amount: 8, unit: hour }
