id: spells.hex
type: spell
fields:
  level: 1
  school: enchantment
  classes: [classes.warlock]
  concentration: true
  castingTime: bonus-action
  rangeKind: ranged
  range: 90
  verbal: true
  somatic: true
  material: true
  durationUnit: hour
  durationAmount: 1
  applied: true
  castOptions: [str, dex, con, int, wis, cha]
effects:
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: str }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: dex }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: con }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: int }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: wis }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: cha }
  - target: { rolls: [check.str] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'str'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.dex] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'dex'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.con] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'con'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.int] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'int'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.wis] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'wis'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.cha] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'cha'
    duration: { amount: 1, unit: hour, concentration: true }
# The extra damage is `hex-damage`, run on a hit.
actions:
  - use: cast-spell
  - id: hex-damage
    tags: [spell]
    params: { critical: { type: boolean, optional: true } }
    participants: { target: {} }
    results: [damage]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              slot: item.level
              critical: has(params.critical) && params.critical
      - id: damage
        kind: roll
        tags: [damage.spell]
        parts: [{ dice: 1d6, tags: [damage.necrotic] }]
      - id: deal
        kind: changes
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags:
              - damage
              - spell
              - magical
              - { formula: "flags.critical ? ['critical'] : []" }
      - id: result
        kind: outcome
        result: "'damage'"
        data: { damage: steps.damage.total }
