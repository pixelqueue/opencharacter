id: spells.hex
type: spell
fields:
  level: 1
  school: enchantment
  classes: [classes.warlock]
  concentration: true
  castingTime: bonus-action
  rangeKind: ranged
  range: 90
  verbal: true
  somatic: true
  material: true
  durationUnit: hour
  durationAmount: 1
  applied: true
  castOptions: [str, dex, con, int, wis, cha]
effects:
  - target: { rolls: [damage] }
    op: add
    value: 1d6
    tags: [damage.necrotic]
    when: >-
      has(flags.hit) && flags.hit && has(participants.target) && size(participants.target) > 0
        && character.id in participants.target[0].hex.cursedBy
  - target: { rolls: [check.str] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'str'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.dex] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'dex'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.con] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'con'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.int] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'int'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.wis] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'wis'
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.cha] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
    when: self.option == 'cha'
    duration: { amount: 1, unit: hour, concentration: true }
actions:
  - use: cast-spell
  # While the caster concentrates on it; `slot` is the slot it was cast with, kept on the new
  # target's entry with the caster's spell save DC.
  - id: move
    tags: [spell]
    available: concentration.active
    params:
      slot: { type: integer, optional: true }
    participants: { target: { max: 1 } }
    results: [moved]
    steps:
      - id: ability
        kind: choice
        options: { values: { formula: item.castOptions } }
      # Ends the caster's curse wherever it is (the app sends it to whoever holds one), then curses
      # the new creature.
      - id: uncurse
        kind: changes
        to: applied
        changes:
          - type: removeEffect
            applied: { where: item.id == @spells.hex }
      - id: curse
        kind: changes
        to: target
        changes:
          - type: applyEffect
            source: item.id
            state:
              option: steps.ability.value
              castSlot: 'has(params.slot) ? params.slot : item.level'
              castDc: self.spellDc
      - id: result
        kind: outcome
        result: "'moved'"
        data: { ability: steps.ability.value }
