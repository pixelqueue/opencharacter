id: spells.divine-smite
type: spell
fields:
  level: 1
  school: evocation
  classes: [classes.paladin]
  castingTime: bonus-action
  rangeKind: self
  verbal: true
  somatic: false
  material: false
  durationUnit: instantaneous
actions:
  - use: cast-spell
effects:
  # Offered on a hit with a melee weapon or an Unarmed Strike: the attack casts it, and its damage
  # joins the attack's (doubled on a Critical Hit).
  - { target: combat.hitOptions, op: add, value: 1 }
  - target: { choices: [weapon-hit, unarmed-hit] }
    op: option
    when: >-
      ('unarmed-hit' in action.step.tags || (action.item.range == 'melee' && !params.thrown))
        && (countList([1, 2, 3, 4, 5, 6, 7, 8, 9], x >= item.level
            && fieldOf('spellSlots.level{slot}.max', x) - fieldOf('spellSlots.level{slot}.used', x) > 0) > 0
          || (pactSlots.max - pactSlots.used > 0 && pactSlots.level >= item.level)
          || item.id in spells.free)
    value:
      id: smite
      flags: { smite: item.id, smiteLevel: item.level }
  - target: { rolls: [damage.weapon] }
    op: add
    value: >-
      dieOf(1d8, 2 + max(0, steps.smiteCast.data.slot - item.level)
        + (size(participants.target) > 0 && participants.target[0].creature.type in ['fiend', 'undead']
          ? 1 : 0))
    tags: [damage.radiant]
    when: >-
      has(flags.smite) && flags.smite == item.id && has(steps.smiteCast)
        && steps.smiteCast.result == 'cast'
