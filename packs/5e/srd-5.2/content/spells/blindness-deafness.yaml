id: spells.blindness-deafness
type: spell
fields:
  level: 2
  school: transmutation
  classes: [classes.bard, classes.cleric, classes.sorcerer, classes.wizard]
  castingTime: action
  rangeKind: ranged
  range: 120
  verbal: true
  somatic: false
  material: false
  durationUnit: minute
  durationAmount: 1
  save: con
  saveEffect: none
  applied: true
state:
  condition: { type: enum, values: [blinded, deafened], default: blinded }
actions:
  - use: cast-spell
  # The chosen option is state on the applied spell; it starts as the first.
  - id: choose
    scope: applied
    tags: [spell]
    results: [chosen]
    steps:
      - id: option
        kind: choice
        options:
          - id: blinded
            changes:
              - { type: setState, entry: self, key: condition, value: "'blinded'" }
          - id: deafened
            changes:
              - { type: setState, entry: self, key: condition, value: "'deafened'" }
        recommend: self.condition
      - id: result
        kind: outcome
        result: "'chosen'"
grants:
  - { item: conditions.blinded, scope: applied, when: "self.condition == 'blinded'" }
  - { item: conditions.deafened, scope: applied, when: "self.condition == 'deafened'" }
