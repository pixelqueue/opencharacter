id: spells.eyebite
type: spell
fields:
  level: 6
  school: necromancy
  classes: [classes.bard, classes.sorcerer, classes.warlock, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: self
  verbal: true
  somatic: true
  material: false
  durationUnit: minute
  durationAmount: 1
  save: wis
  saveEffect: none
  applied: true
  castOptions: [asleep, panicked, sickened]
actions:
  - use: cast-spell
grants:
  - { item: conditions.unconscious, scope: applied, when: "self.option == 'asleep'" }
  - { item: conditions.frightened, scope: applied, when: "self.option == 'panicked'" }
  - { item: conditions.poisoned, scope: applied, when: "self.option == 'sickened'" }
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: add
    value: 0
    when: "self.option == 'asleep' && incoming.amount < 0"
    scope: applied
    then:
      - { type: removeEffect, entry: self }
