id: spells.eyebite
type: spell
fields:
  level: 6
  school: necromancy
  classes: [classes.bard, classes.sorcerer, classes.warlock, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: self
  verbal: true
  somatic: true
  material: false
  durationUnit: minute
  durationAmount: 1
  save: wis
  saveEffect: none
  applied: true
state:
  effect: { type: enum, values: [asleep, panicked, sickened], default: asleep }
actions:
  - use: cast-spell
  # The chosen option is state on the applied spell; it starts as the first.
  - id: choose
    scope: applied
    tags: [spell]
    results: [chosen]
    steps:
      - id: option
        kind: choice
        options:
          - id: asleep
            changes:
              - { type: setState, entry: self, key: effect, value: "'asleep'" }
          - id: panicked
            changes:
              - { type: setState, entry: self, key: effect, value: "'panicked'" }
          - id: sickened
            changes:
              - { type: setState, entry: self, key: effect, value: "'sickened'" }
        recommend: self.effect
      - id: result
        kind: outcome
        result: "'chosen'"
grants:
  - { item: conditions.unconscious, scope: applied, when: "self.effect == 'asleep'" }
  - { item: conditions.frightened, scope: applied, when: "self.effect == 'panicked'" }
  - { item: conditions.poisoned, scope: applied, when: "self.effect == 'sickened'" }
