id: spells.glyph-of-warding
type: spell
fields:
  level: 3
  school: abjuration
  classes: [classes.bard, classes.cleric, classes.wizard]
  castingTime: 1-hour
  rangeKind: touch
  verbal: true
  somatic: true
  material: true
  durationUnit: until-dispelled
actions:
  - use: cast-spell
  - id: explosive-rune
    tags: [spell]
    params:
      slot: { type: integer, optional: true }
      damageType:
        type: enum
        values: [acid, cold, fire, lightning, thunder]
    participants: { target: { fields: target } }
    results: [save]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              cls: "countList(keysOf('caster'), item.id in fieldOf('spells.{caster}', x)) > 0 ? filterList(keysOf('caster'), item.id in fieldOf('spells.{caster}', x))[0] : 'none'"
              slot: 'has(params.slot) ? max(item.level, min(9, params.slot)) : item.level'
      - id: numbers
        kind: branch
        cases:
          - when: true
            flags:
              dc: "flags.cls != 'none' ? fieldOf('spellcasting.{caster}.dc', flags.cls) : maxList(keysOf('caster'), fieldOf('spellcasting.{caster}.dc', x))"
              attackBonus: "flags.cls != 'none' ? fieldOf('spellcasting.{caster}.attack', flags.cls) : maxList(keysOf('caster'), fieldOf('spellcasting.{caster}.attack', x))"
              mod: "flags.cls != 'none' ? fieldOf('spellcasting.{caster}.mod', flags.cls) : maxList(keysOf('caster'), fieldOf('spellcasting.{caster}.mod', x))"
      - id: damage
        kind: roll
        tags: [damage.spell]
        parts:
          - dice: (5 + 1 * (flags.slot - item.level))d8
            tags: [{ formula: "'damage.' + params.damageType" }]
      - id: saves
        kind: action
        each: target
        as: participant
        use: saving-throw
        params: { ability: "'dex'", dc: flags.dc }
      - id: burn
        kind: changes
        each: target
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: "steps.saves.result == 'success' ? -floor(max(0, part.total) / 2) : -max(0, part.total)"
            tags:
              - damage
              - spell
              - magical
              - save-half
              - save.dex
              - formula: "steps.saves.result == 'success' ? 'save-success' : 'save-failure'"
      - id: result
        kind: outcome
        result: "'save'"
        data:
          slot: flags.slot
          dc: flags.dc
          save: "'dex'"
          damage: steps.damage.total
