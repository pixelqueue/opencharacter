id: spells.haste
type: spell
fields:
  level: 3
  school: transmutation
  classes: [classes.sorcerer, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: ranged
  range: 30
  verbal: true
  somatic: true
  material: true
  durationUnit: minute
  durationAmount: 1
  applied: true
effects:
  - target: combat.ac
    op: add
    value: 2
    scope: applied
    duration: { amount: 1, unit: minute, concentration: true }
  - target: combat.speed
    op: multiply
    value: 2
    scope: applied
    duration: { amount: 1, unit: minute, concentration: true }
  - target: { rolls: [save.dex] }
    op: rollModifier
    value: { kind: advantage }
    scope: applied
    duration: { amount: 1, unit: minute, concentration: true }
actions:
  - use: cast-spell
