id: spells.dragons-breath
type: spell
fields:
  level: 2
  school: transmutation
  classes: [classes.sorcerer, classes.wizard]
  concentration: true
  castingTime: bonus-action
  rangeKind: touch
  verbal: true
  somatic: true
  material: true
  durationUnit: minute
  durationAmount: 1
  applied: true
  areaShape: cone
  areaSize: 15
state:
  damageType: { type: enum, values: [acid, cold, fire, lightning, poison], default: acid }
actions:
  - use: cast-spell
  # The chosen option is state on the applied spell; it starts as the first.
  - id: choose
    scope: applied
    tags: [spell]
    results: [chosen]
    steps:
      - id: option
        kind: choice
        options:
          - id: acid
            changes:
              - { type: setState, entry: self, key: damageType, value: "'acid'" }
          - id: cold
            changes:
              - { type: setState, entry: self, key: damageType, value: "'cold'" }
          - id: fire
            changes:
              - { type: setState, entry: self, key: damageType, value: "'fire'" }
          - id: lightning
            changes:
              - { type: setState, entry: self, key: damageType, value: "'lightning'" }
          - id: poison
            changes:
              - { type: setState, entry: self, key: damageType, value: "'poison'" }
        recommend: self.damageType
      - id: result
        kind: outcome
        result: "'chosen'"
  # The target's breath, on its own sheet: the caster's DC is a parameter.
  - id: exhale
    scope: applied
    tags: [spell]
    params:
      dc: { type: integer }
    participants:
      target: { fields: target }
    results: [save]
    steps:
      - id: effect
        kind: action
        use: spell-effect
        participants: { target: participants.target }
        params:
          save: "'dex'"
          half: true
          dc: params.dc
          damageType: self.damageType
          dice: dieOf(1d6, 3 + max(0, self.castSlot - item.level))
      - id: result
        kind: outcome
        result: steps.effect.result
        data:
          damage: steps.effect.data.damage
