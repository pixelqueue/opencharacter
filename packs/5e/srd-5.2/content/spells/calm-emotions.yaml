id: spells.calm-emotions
type: spell
fields:
  level: 2
  school: enchantment
  classes: [classes.bard, classes.cleric]
  concentration: true
  castingTime: action
  rangeKind: ranged
  range: 60
  verbal: true
  somatic: true
  material: false
  durationUnit: minute
  durationAmount: 1
  areaShape: sphere
  areaSize: 20
  save: cha
  saveEffect: none
  applied: true
  castOptions: [immunity, indifference]
actions:
  - use: cast-spell
immuneTo:
  - id: charmed-and-frightened
    items: [conditions.charmed, conditions.frightened]
    scope: applied
    when: self.option == 'immunity'
