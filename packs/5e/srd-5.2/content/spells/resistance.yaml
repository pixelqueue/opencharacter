id: spells.resistance
type: spell
fields:
  level: 0
  school: abjuration
  classes: [classes.cleric, classes.druid]
  concentration: true
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: false
  durationUnit: minute
  durationAmount: 1
  applied: true
state:
  damageType: { type: string, default: '' }
# Once per turn is the table's to track.
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: add
    value: 1d4
    when: "self.damageType != '' && ('damage.' + self.damageType) in incoming.tags"
    scope: applied
    duration: { amount: 1, unit: minute, concentration: true }
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: atMost
    value: 0
    when: "self.damageType != '' && ('damage.' + self.damageType) in incoming.tags"
    scope: applied
    duration: { amount: 1, unit: minute, concentration: true }
# The damage type is chosen on the creature it protects.
actions:
  - use: cast-spell
  - id: choose-damage-type
    scope: applied
    tags: [spell]
    results: [done]
    steps:
      - id: damageType
        kind: choice
        options:
          - { id: acid }
          - { id: bludgeoning }
          - { id: cold }
          - { id: fire }
          - { id: lightning }
          - { id: necrotic }
          - { id: piercing }
          - { id: poison }
          - { id: radiant }
          - { id: slashing }
          - { id: thunder }
      - id: set
        kind: changes
        changes:
          - { type: setState, entry: self, key: damageType, value: steps.damageType.picked }
      - id: result
        kind: outcome
        result: "'done'"
