  castingTime: action
  rangeKind: ranged
  range: 120
  verbal: true
  somatic: true
  material: true
  durationUnit: minute
  durationAmount: 1
  areaShape: cube
  areaSize: 40
  save: wis
  saveEffect: none
  applied: true
actions:
