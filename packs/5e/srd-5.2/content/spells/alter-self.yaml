id: spells.alter-self
type: spell
# Aquatic Adaptation is on the sheet; Natural Weapons and Change Appearance are the text. `choose`
# replaces the option (a Magic action).
fields:
  level: 2
  school: transmutation
  classes: [classes.sorcerer, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: self
  verbal: true
  somatic: true
  material: false
  durationUnit: hour
  durationAmount: 1
  applied: true
  castOptions: [aquatic-adaptation, change-appearance, natural-weapons]
actions:
  - use: cast-spell
  - id: choose
    scope: applied
    tags: [spell]
    results: [chosen]
    steps:
      - id: option
        kind: choice
        options:
          - id: aquatic-adaptation
            changes:
              - { type: setState, entry: self, key: option, value: "'aquatic-adaptation'" }
          - id: change-appearance
            changes:
              - { type: setState, entry: self, key: option, value: "'change-appearance'" }
          - id: natural-weapons
            changes:
              - { type: setState, entry: self, key: option, value: "'natural-weapons'" }
        recommend: self.option
      - id: result
        kind: outcome
        result: "'chosen'"
effects:
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: aquatic-adaptation }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: change-appearance }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: natural-weapons }
  - target: combat.swimSpeed
    op: atLeast
    value: combat.speed
    when: self.option == 'aquatic-adaptation'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
