id: spells.phantasmal-force
type: spell
fields:
  level: 2
  school: illusion
  classes: [classes.bard, classes.sorcerer, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: ranged
  range: 60
  verbal: true
  somatic: true
  material: true
  durationUnit: minute
  durationAmount: 1
  save: int
  saveEffect: none
actions:
  - use: cast-spell
  - id: phantasm
    tags: [spell]
    participants: { target: {} }
    results: [damage]
    steps:
      - id: setup
        kind: branch
        cases:
          - { when: true, flags: { slot: item.level, critical: 'false' } }
      - id: damage
        kind: roll
        tags: [damage.spell]
        parts: [{ dice: 2d8, tags: [damage.psychic] }]
      - id: deal
        kind: changes
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags:
              - damage
              - spell
              - magical
              - { formula: "flags.critical ? ['critical'] : []" }
      - id: result
        kind: outcome
        result: "'damage'"
        data: { damage: steps.damage.total }
