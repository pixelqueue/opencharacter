id: spells.contagion
type: spell
# On a failed save the spell is applied: Poisoned, and Disadvantage on the chosen ability's saves.
fields:
  level: 5
  school: necromancy
  classes: [classes.cleric, classes.druid]
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: false
  durationUnit: day
  durationAmount: 7
  save: con
  saveEffect: none
  applied: true
  castOptions: [str, dex, con, int, wis, cha]
  damageType: necrotic
  damage: 11d8
actions:
  - use: cast-spell
grants:
  - { item: conditions.poisoned, scope: applied }
effects:
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: str }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: dex }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: con }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: int }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: wis }
  - target: { choices: [spell-option] }
    op: option
    when: action.item.id == item.id
    value: { id: cha }
  - target: { rolls: [save.str] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'str'
    scope: applied
  - target: { rolls: [save.dex] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'dex'
    scope: applied
  - target: { rolls: [save.con] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'con'
    scope: applied
  - target: { rolls: [save.int] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'int'
    scope: applied
  - target: { rolls: [save.wis] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'wis'
    scope: applied
  - target: { rolls: [save.cha] }
    op: rollModifier
    value: { kind: disadvantage }
    when: self.option == 'cha'
    scope: applied
