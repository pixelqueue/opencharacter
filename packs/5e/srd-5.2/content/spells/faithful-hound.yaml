id: spells.faithful-hound
type: spell
fields:
  level: 4
  school: conjuration
  classes: [classes.wizard]
  castingTime: action
  rangeKind: ranged
  range: 30
  verbal: true
  somatic: true
  material: true
  durationUnit: hour
  durationAmount: 8
actions:
  - use: cast-spell
  - id: bite
    tags: [spell]
    params: { slot: { type: integer, optional: true } }
    participants: { target: { fields: target } }
    results: [save]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              cls: self.castingClass
              slot: 'has(params.slot) ? max(item.level, min(9, params.slot)) : item.level'
      - id: numbers
        kind: branch
        cases:
          - when: true
            flags:
              dc: self.spellDc
              attackBonus: self.spellAttack
              mod: self.spellMod
      - id: damage
        kind: roll
        tags: [damage.spell]
        parts: [{ dice: 4d8, tags: [damage.force] }]
      - id: saves
        kind: action
        each: target
        as: participant
        use: saving-throw
        params: { ability: "'dex'", dc: flags.dc, spell: true }
      - id: burn
        kind: changes
        each: target
        to: target
        changes:
          - type: adjust
            when: steps.saves.result != 'success'
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags:
              - damage
              - spell
              - magical
              - save-negates
              - save.dex
              - formula: "steps.saves.result == 'success' ? 'save-success' : 'save-failure'"
      - id: result
        kind: outcome
        result: "'save'"
        data:
          slot: flags.slot
          dc: flags.dc
          save: "'dex'"
          damage: steps.damage.total
