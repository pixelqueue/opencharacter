id: spells.death-ward
type: spell
# Damage that would drop the target to 0 Hit Points leaves it at 1; the app then ends the spell.
# The instant-death half is the text.
fields:
  level: 4
  school: abjuration
  classes: [classes.cleric, classes.paladin]
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: false
  durationUnit: hour
  durationAmount: 8
  applied: true
actions:
  - use: cast-spell
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: atLeast
    value: -(hp.current + hp.temp - 1)
    when: hp.current > 0
    scope: applied
    duration: { amount: 8, unit: hour }
