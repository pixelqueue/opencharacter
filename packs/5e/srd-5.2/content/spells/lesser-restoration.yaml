id: spells.lesser-restoration
type: spell
fields:
  level: 2
  school: abjuration
  classes:
    - classes.bard
    - classes.cleric
    - classes.druid
    - classes.paladin
    - classes.ranger
  castingTime: bonus-action
  rangeKind: touch
  verbal: true
  somatic: true
  material: false
  durationUnit: instantaneous
actions:
  - use: cast-spell
  - id: restore
    tags: [spell]
    participants: { target: { max: 1 } }
    results: [ended]
    steps:
      - id: effect
        kind: choice
        options:
          values:
            formula: >-
              [@conditions.blinded, @conditions.deafened, @conditions.paralyzed,
                @conditions.poisoned]
      - id: end
        kind: changes
        to: target
        changes:
          - { type: removeEffect, applied: { where: item.id == steps.effect.value } }
      - id: result
        kind: outcome
        result: "'ended'"
        data: { effect: steps.effect.value }
