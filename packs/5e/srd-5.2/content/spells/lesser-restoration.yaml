id: spells.lesser-restoration
type: spell
fields:
  level: 2
  school: abjuration
  classes:
    - classes.bard
    - classes.cleric
    - classes.druid
    - classes.paladin
    - classes.ranger
  castingTime: bonus-action
  rangeKind: touch
  verbal: true
  somatic: true
  material: false
  durationUnit: instantaneous
actions:
  - use: cast-spell
  - id: restore
    tags: [spell]
    participants: { target: { max: 1 } }
    results: [ended]
    steps:
      - id: effect
        kind: choice
        options:
          - id: blinded
            changes:
              - type: removeEffect
                applied: { where: item.id == @conditions.blinded }
            to: target
          - id: deafened
            changes:
              - type: removeEffect
                applied: { where: item.id == @conditions.deafened }
            to: target
          - id: paralyzed
            changes:
              - type: removeEffect
                applied: { where: item.id == @conditions.paralyzed }
            to: target
          - id: poisoned
            changes:
              - type: removeEffect
                applied: { where: item.id == @conditions.poisoned }
            to: target
      - id: result
        kind: outcome
        result: "'ended'"
        data: { effect: steps.effect.picked }
