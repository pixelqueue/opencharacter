id: spells.enhance-ability
type: spell
fields:
  level: 2
  school: transmutation
  classes:
    [classes.bard, classes.cleric, classes.druid, classes.ranger, classes.sorcerer, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: true
  durationUnit: hour
  durationAmount: 1
  applied: true
state:
  ability: { type: enum, values: [str, dex, int, wis, cha], default: str }
actions:
  - use: cast-spell
  # The chosen option is state on the applied spell; it starts as the first.
  - id: choose
    scope: applied
    tags: [spell]
    results: [chosen]
    steps:
      - id: option
        kind: choice
        options:
          - id: str
            changes:
              - { type: setState, entry: self, key: ability, value: "'str'" }
          - id: dex
            changes:
              - { type: setState, entry: self, key: ability, value: "'dex'" }
          - id: int
            changes:
              - { type: setState, entry: self, key: ability, value: "'int'" }
          - id: wis
            changes:
              - { type: setState, entry: self, key: ability, value: "'wis'" }
          - id: cha
            changes:
              - { type: setState, entry: self, key: ability, value: "'cha'" }
        recommend: self.ability
      - id: result
        kind: outcome
        result: "'chosen'"
effects:
  - target: { rolls: [check.str] }
    op: rollModifier
    value: { kind: advantage }
    when: self.ability == 'str'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.dex] }
    op: rollModifier
    value: { kind: advantage }
    when: self.ability == 'dex'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.int] }
    op: rollModifier
    value: { kind: advantage }
    when: self.ability == 'int'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.wis] }
    op: rollModifier
    value: { kind: advantage }
    when: self.ability == 'wis'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { rolls: [check.cha] }
    op: rollModifier
    value: { kind: advantage }
    when: self.ability == 'cha'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
