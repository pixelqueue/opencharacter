id: spells.aura-of-life
type: spell
fields:
  level: 4
  school: abjuration
  classes: [classes.cleric, classes.paladin]
  concentration: true
  castingTime: action
  rangeKind: self
  verbal: true
  somatic: false
  material: false
  durationUnit: minute
  durationAmount: 10
  areaShape: emanation
  areaSize: 30
  applied: true
actions:
  - use: cast-spell
effects:
  - target: damage.resistances
    op: grant
    value: { tag: damage.necrotic }
    scope: applied
    duration: { amount: 10, unit: minute, concentration: true }
# Cast with no target, the spell is on the caster and holds the aura up for its allies inside. The
# Hit Point maximum that can't be reduced and the 1 Hit Point at turn start stay the table's.
auras:
  - id: life
    when: countList(character.applied, x.active && x.source == @spells.aura-of-life
      && (x.appliedBy == '' || x.appliedBy == character.id)) > 0
    size: item.areaSize
    affects: allies
    effects:
      - target: damage.resistances
        op: grant
        value: { tag: damage.necrotic }
        scope: applied
