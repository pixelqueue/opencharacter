id: spells.freedom-of-movement
type: spell
fields:
  level: 4
  school: abjuration
  classes:
    - classes.bard
    - classes.cleric
    - classes.druid
    - classes.ranger
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: true
  durationUnit: hour
  durationAmount: 1
  applied: true
effects:
  - target: combat.swimSpeed
    op: atLeast
    value: combat.speed
    scope: applied
    duration: { amount: 1, unit: hour }
immuneTo:
  - id: magical-paralysis-and-restraint
    scope: applied
    query:
      type: condition
      where: item.id in [@conditions.paralyzed, @conditions.restrained] && entry.magical
actions:
  - use: cast-spell
