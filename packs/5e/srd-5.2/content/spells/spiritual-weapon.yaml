id: spells.spiritual-weapon
type: spell
fields:
  level: 2
  school: evocation
  classes: [classes.cleric]
  concentration: true
  castingTime: bonus-action
  rangeKind: ranged
  range: 60
  verbal: true
  somatic: true
  material: false
  durationUnit: minute
  durationAmount: 1
  attack: melee
  damageType: force
  damage: 1d8
  damageAddsMod: true
  upcastDice: 1
# The cast makes the first attack; each later one is `strike`, with the slot it was cast with.
actions:
  - use: cast-spell
  - id: strike
    tags: [spell]
    params:
      slot: { type: integer, optional: true, min: 2, max: 9 }
      targetAc: { type: integer, optional: true }
    participants:
      target: { max: 1, fields: target }
    results: [hit, miss]
    steps:
      - id: effect
        kind: action
        use: spell-effect
        participants: { target: participants.target }
        params:
          dice: 'dieOf(1d8, has(params.slot) ? params.slot - 1 : 1)'
          damageType: "'force'"
          addMod: true
          attack: "'melee'"
          targetAc: 'has(params.targetAc) ? params.targetAc : null'
      - id: result
        kind: outcome
        result: steps.effect.result
        data:
          damage: steps.effect.data.damage
          critical: steps.effect.data.critical
