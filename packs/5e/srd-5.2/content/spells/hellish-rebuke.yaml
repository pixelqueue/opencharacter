id: spells.hellish-rebuke
type: spell
fields:
  level: 1
  school: evocation
  classes: [classes.warlock]
  castingTime: reaction
  rangeKind: ranged
  range: 60
  verbal: true
  somatic: true
  material: false
  durationUnit: instantaneous
  save: dex
  saveEffect: half
  damageType: fire
  damage: 2d10
  upcastDice: 1
# Damage another creature dealt offers the Reaction, `change.from` naming the damager (whether
# it is within 60 feet and seen is the app's).
followUps:
  - id: rebuke
    on: { field: hp.current, tags: [damage], once: true }
    when: change.from != '' && change.from != character.id && change.taken < 0
    action: cast-spell
actions:
  - use: cast-spell
