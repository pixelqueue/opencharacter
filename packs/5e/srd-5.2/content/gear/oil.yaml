id: gear.oil
type: gear
fields:
  category: adventuring-gear
  cost: 0.1
  weight: 1
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.fire] } }
    op: add
    value: -5
    when: incoming.amount < 0
    scope: applied
    duration: { amount: 1, unit: minute }
    then:
      - { type: removeEffect, entry: self }
actions:
  - use: throw-item
    params: { applies: "'gear.oil'" }
