id: gear.entertainers-pack
type: gear
fields:
  category: equipment-pack
  cost: 40
  weight: 58.5
actions:
  - id: unpack
    tags: [item]
    available: self.quantity > 0
    steps:
      - id: unpack
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'gear.backpack'" } }
          - { type: addItem, entry: { item: "'gear.bedroll'" } }
          - { type: addItem, entry: { item: "'gear.bell'" } }
          - { type: addItem, entry: { item: "'gear.bullseye-lantern'" } }
          - { type: addItem, entry: { item: "'gear.costume'", quantity: 3 } }
          - { type: addItem, entry: { item: "'gear.mirror'" } }
          - { type: addItem, entry: { item: "'gear.oil'", quantity: 8 } }
          - { type: addItem, entry: { item: "'gear.rations'", quantity: 9 } }
          - { type: addItem, entry: { item: "'gear.tinderbox'" } }
          - { type: addItem, entry: { item: "'gear.waterskin'" } }
          - { type: adjustQuantity, entry: self, by: -1, when: self.quantity > 1 }
          - { type: removeItem, entry: self, when: self.quantity <= 1 }
