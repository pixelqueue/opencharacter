id: feats.magic-initiate
type: feat
repeatable: true
tags: [repeatable]
fields:
  category: origin
effects:
  - { target: feats.held, op: grant, value: { formula: item.id } }
  - target: { choices: [spell-cost] }
    op: option
    stackKey: initiate-cleric
    when: >-
      action.item.id in spells.initiateCleric && action.item.level == 1 && !initiate.clericUsed
    value:
      id: free-cast-cleric
      flags: { slot: 1, castAbility: "'initiateCleric'" }
      changes:
        - { type: set, field: initiate.clericUsed, value: true }
  - target: { choices: [spell-cost] }
    op: option
    stackKey: initiate-druid
    when: >-
      action.item.id in spells.initiateDruid && action.item.level == 1 && !initiate.druidUsed
    value:
      id: free-cast-druid
      flags: { slot: 1, castAbility: "'initiateDruid'" }
      changes:
        - { type: set, field: initiate.druidUsed, value: true }
  - target: { choices: [spell-cost] }
    op: option
    stackKey: initiate-wizard
    when: >-
      action.item.id in spells.initiateWizard && action.item.level == 1 && !initiate.wizardUsed
    value:
      id: free-cast-wizard
      flags: { slot: 1, castAbility: "'initiateWizard'" }
      changes:
        - { type: set, field: initiate.wizardUsed, value: true }
  - target: { steps: [rest.long] }
    op: changes
    when: initiate.clericUsed || initiate.druidUsed || initiate.wizardUsed
    value:
      changes:
        - { type: set, field: initiate.clericUsed, value: false, when: initiate.clericUsed }
        - { type: set, field: initiate.druidUsed, value: false, when: initiate.druidUsed }
        - { type: set, field: initiate.wizardUsed, value: false, when: initiate.wizardUsed }
choices:
  - id: list
    unique: magic-initiate
    requiresOption: true
    recommend: >-
      size(spells.initiateCleric) == 0 ? 'cleric' : size(spells.initiateDruid) == 0 ? 'druid'
        : 'wizard'
    from:
      options:
        - id: cleric
          choices:
            - id: ability
              recommend: >-
                abilities.int.score >= abilities.wis.score && abilities.int.score >= abilities.cha.score
                  ? 'int' : abilities.wis.score >= abilities.cha.score ? 'wis' : 'cha'
              from:
                options:
                  - id: int
                    effects:
                      - {
                          target: spellcasting.initiateCleric.mod,
                          op: set,
                          value: abilities.int.mod,
                        }
                      - target: spellcasting.initiateCleric.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.int.mod
                      - target: spellcasting.initiateCleric.attack
                        op: set
                        value: proficiency.bonus + abilities.int.mod
                  - id: wis
                    effects:
                      - {
                          target: spellcasting.initiateCleric.mod,
                          op: set,
                          value: abilities.wis.mod,
                        }
                      - target: spellcasting.initiateCleric.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.wis.mod
                      - target: spellcasting.initiateCleric.attack
                        op: set
                        value: proficiency.bonus + abilities.wis.mod
                  - id: cha
                    effects:
                      - {
                          target: spellcasting.initiateCleric.mod,
                          op: set,
                          value: abilities.cha.mod,
                        }
                      - target: spellcasting.initiateCleric.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.cha.mod
                      - target: spellcasting.initiateCleric.attack
                        op: set
                        value: proficiency.bonus + abilities.cha.mod
            - id: cantrips
              pick: 2
              from: { type: spell, where: 'item.level == 0 && @classes.cleric in item.classes' }
              effects:
                - { target: spells.initiateCleric, op: grant, value: { formula: pick.id } }
            - id: spell
              from: { type: spell, where: 'item.level == 1 && @classes.cleric in item.classes' }
              effects:
                - { target: spells.initiateCleric, op: grant, value: { formula: pick.id } }
                - { target: spells.free, op: grant, value: { formula: pick.id } }
        - id: druid
          choices:
            - id: ability
              recommend: >-
                abilities.int.score >= abilities.wis.score && abilities.int.score >= abilities.cha.score
                  ? 'int' : abilities.wis.score >= abilities.cha.score ? 'wis' : 'cha'
              from:
                options:
                  - id: int
                    effects:
                      - {
                          target: spellcasting.initiateDruid.mod,
                          op: set,
                          value: abilities.int.mod,
                        }
                      - target: spellcasting.initiateDruid.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.int.mod
                      - target: spellcasting.initiateDruid.attack
                        op: set
                        value: proficiency.bonus + abilities.int.mod
                  - id: wis
                    effects:
                      - {
                          target: spellcasting.initiateDruid.mod,
                          op: set,
                          value: abilities.wis.mod,
                        }
                      - target: spellcasting.initiateDruid.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.wis.mod
                      - target: spellcasting.initiateDruid.attack
                        op: set
                        value: proficiency.bonus + abilities.wis.mod
                  - id: cha
                    effects:
                      - {
                          target: spellcasting.initiateDruid.mod,
                          op: set,
                          value: abilities.cha.mod,
                        }
                      - target: spellcasting.initiateDruid.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.cha.mod
                      - target: spellcasting.initiateDruid.attack
                        op: set
                        value: proficiency.bonus + abilities.cha.mod
            - id: cantrips
              pick: 2
              from: { type: spell, where: 'item.level == 0 && @classes.druid in item.classes' }
              effects:
                - { target: spells.initiateDruid, op: grant, value: { formula: pick.id } }
            - id: spell
              from: { type: spell, where: 'item.level == 1 && @classes.druid in item.classes' }
              effects:
                - { target: spells.initiateDruid, op: grant, value: { formula: pick.id } }
                - { target: spells.free, op: grant, value: { formula: pick.id } }
        - id: wizard
          choices:
            - id: ability
              recommend: >-
                abilities.int.score >= abilities.wis.score && abilities.int.score >= abilities.cha.score
                  ? 'int' : abilities.wis.score >= abilities.cha.score ? 'wis' : 'cha'
              from:
                options:
                  - id: int
                    effects:
                      - {
                          target: spellcasting.initiateWizard.mod,
                          op: set,
                          value: abilities.int.mod,
                        }
                      - target: spellcasting.initiateWizard.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.int.mod
                      - target: spellcasting.initiateWizard.attack
                        op: set
                        value: proficiency.bonus + abilities.int.mod
                  - id: wis
                    effects:
                      - {
                          target: spellcasting.initiateWizard.mod,
                          op: set,
                          value: abilities.wis.mod,
                        }
                      - target: spellcasting.initiateWizard.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.wis.mod
                      - target: spellcasting.initiateWizard.attack
                        op: set
                        value: proficiency.bonus + abilities.wis.mod
                  - id: cha
                    effects:
                      - {
                          target: spellcasting.initiateWizard.mod,
                          op: set,
                          value: abilities.cha.mod,
                        }
                      - target: spellcasting.initiateWizard.dc
                        op: set
                        value: 8 + proficiency.bonus + abilities.cha.mod
                      - target: spellcasting.initiateWizard.attack
                        op: set
                        value: proficiency.bonus + abilities.cha.mod
            - id: cantrips
              pick: 2
              from: { type: spell, where: 'item.level == 0 && @classes.wizard in item.classes' }
              effects:
                - { target: spells.initiateWizard, op: grant, value: { formula: pick.id } }
            - id: spell
              from: { type: spell, where: 'item.level == 1 && @classes.wizard in item.classes' }
              effects:
                - { target: spells.initiateWizard, op: grant, value: { formula: pick.id } }
                - { target: spells.free, op: grant, value: { formula: pick.id } }
