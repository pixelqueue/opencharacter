id: feats.boon-of-spell-recall
type: feat
fields:
  category: epic-boon
prerequisites:
  - id: level
    when: 'level.total >= 19'
  - id: spellcasting
    when: 'spellcasting.casterLevel > 0 || pactSlots.max > 0'
effects:
  - { target: feats.held, op: grant, value: { formula: item.id } }
  - target: { steps: [spell.slot-spent] }
    op: changes
    when: >-
      (flags.slotType == 'pact' ? pactSlots.level : flags.slot) >= 1
        && (flags.slotType == 'pact' ? pactSlots.level : flags.slot) <= 4
    value:
      changes:
        - type: adjust
          field:
            formula: >-
              flags.slotType == 'pact' ? 'pactSlots.used'
                : 'spellSlots.level' + string(flags.slot) + '.used'
          by: 0
          tags: [spell-recall]
  - target: { incoming: { tags: [spell-recall] } }
    op: add
    value: -1d4cs1
    when: >-
      incoming.field == @spellSlots.level1.used
        || (incoming.field == @pactSlots.used && pactSlots.level == 1)
  - target: { incoming: { tags: [spell-recall] } }
    op: add
    value: -1d4cs2
    when: >-
      incoming.field == @spellSlots.level2.used
        || (incoming.field == @pactSlots.used && pactSlots.level == 2)
  - target: { incoming: { tags: [spell-recall] } }
    op: add
    value: -1d4cs3
    when: >-
      incoming.field == @spellSlots.level3.used
        || (incoming.field == @pactSlots.used && pactSlots.level == 3)
  - target: { incoming: { tags: [spell-recall] } }
    op: add
    value: -1d4cs4
    when: >-
      incoming.field == @spellSlots.level4.used
        || (incoming.field == @pactSlots.used && pactSlots.level == 4)
choices:
  - id: ability
    recommend: >-
      sortList(filterList(['int', 'wis', 'cha'], fieldOf('abilities.{ability}.score', x) < 30 || x in choice.picks),
        -fieldOf('abilities.{ability}.score', x))[0]
    from:
      options:
        - id: int
          effects:
            - { target: abilities.int.score, op: add, value: 1 }
        - id: wis
          effects:
            - { target: abilities.wis.score, op: add, value: 1 }
        - id: cha
          effects:
            - { target: abilities.cha.score, op: add, value: 1 }
