id: metamagic.heightened-spell
type: metamagic
effects:
  - target: { choices: [metamagic] }
    op: option
    when: >-
      !flags.metamagicDone && !flags.heightened && flags.metamagicCount < sorcery.metamagicPerSpell
        && has(action.item.save)
        && (sorcery.free || sorcery.left >= 2)
    value:
      id: heightened
      flags: { heightened: true, metamagicCount: flags.metamagicCount + 1 }
      changes:
        - type: adjustState
          when: '!sorcery.free'
          entry: self
          key: sorceryPointsSpent
          by: 2
