id: metamagic.quickened-spell
type: metamagic
effects:
  - target: { choices: [metamagic] }
    op: option
    when: >-
      (!has(action.item.castingTime) || action.item.castingTime == 'action')
        && (sorcery.free || sorcery.left >= 2)
    value:
      id: quickened
      flags: { metamagic: "'quickened'" }
      changes:
        - type: adjustState
          when: '!sorcery.free'
          entry: self
          key: sorceryPointsSpent
          by: 2
