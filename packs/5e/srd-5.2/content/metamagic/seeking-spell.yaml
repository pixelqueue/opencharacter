id: metamagic.seeking-spell
type: metamagic
effects:
  - target: { choices: [failed-attack] }
    op: option
    when: has(action.item.school) && (sorcery.free || sorcery.left >= 1)
    value:
      id: seeking
      flags: { retry: true }
      changes:
        - type: adjustState
          when: '!sorcery.free'
          entry: self
          key: sorceryPointsSpent
          by: 1
