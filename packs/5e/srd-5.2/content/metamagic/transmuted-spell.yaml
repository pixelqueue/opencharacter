id: metamagic.transmuted-spell
type: metamagic
effects:
  - target: { choices: [metamagic] }
    op: option
    when: >-
      !flags.metamagicDone && !flags.transmuted && flags.metamagicCount < sorcery.metamagicPerSpell
        && has(flags.damageType) && flags.damageType in ['acid', 'cold', 'fire', 'lightning', 'poison', 'thunder']
        && flags.damageType != 'acid' && (sorcery.free || sorcery.left >= 1)
    value:
      id: to-acid
      flags: { transmuted: true, metamagicCount: flags.metamagicCount + 1, damageType: "'acid'" }
      changes:
        - type: adjustState
          when: '!sorcery.free'
          entry: self
          key: sorceryPointsSpent
          by: 1
