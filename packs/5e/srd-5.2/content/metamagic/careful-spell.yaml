id: metamagic.careful-spell
type: metamagic
effects:
  - target: { choices: [metamagic] }
    op: option
    when: >-
      !flags.metamagicDone && !flags.careful && flags.metamagicCount < sorcery.metamagicPerSpell
        && has(action.item.save)
        && (sorcery.free || sorcery.left >= 1)
    value:
      id: careful
      flags: { careful: true, metamagicCount: flags.metamagicCount + 1 }
      changes:
        - type: adjustState
          when: '!sorcery.free'
          entry: self
          key: sorceryPointsSpent
          by: 1
