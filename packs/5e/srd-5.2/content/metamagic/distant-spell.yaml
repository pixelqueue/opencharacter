id: metamagic.distant-spell
type: metamagic
effects:
  - target: { choices: [metamagic] }
    op: option
    when: >-
      !flags.metamagicDone && !flags.distant && flags.metamagicCount < sorcery.metamagicPerSpell
        && (!has(action.item.rangeKind) || action.item.rangeKind in ['touch', 'ranged'])
        && (sorcery.free || sorcery.left >= 1)
    value:
      id: distant
      flags: { distant: true, metamagicCount: flags.metamagicCount + 1 }
      changes:
        - type: adjustState
          when: '!sorcery.free'
          entry: self
          key: sorceryPointsSpent
          by: 1
