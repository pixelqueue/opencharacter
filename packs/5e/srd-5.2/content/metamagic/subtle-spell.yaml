id: metamagic.subtle-spell
type: metamagic
effects:
  - target: { choices: [metamagic] }
    op: option
    when: >-
      (sorcery.free || sorcery.left >= 1)
    value:
      id: subtle
      flags: { metamagic: "'subtle'" }
      changes:
        - type: adjustState
          when: '!sorcery.free'
          entry: self
          key: sorceryPointsSpent
          by: 1
