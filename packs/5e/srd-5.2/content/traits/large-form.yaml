id: traits.large-form
type: trait
state:
  largeFormUsed: { type: boolean, default: false }
  largeFormActive: { type: boolean, default: false }
effects:
  - target: creature.size
    op: set
    value: "self.largeFormActive ? 'large' : 'medium'"
  - target: { rolls: [check.str] }
    op: rollModifier
    value: { kind: advantage }
    when: self.largeFormActive
  - { target: combat.speed, op: add, value: 10, when: self.largeFormActive }
  - target: { steps: [rest.long] }
    op: changes
    when: self.largeFormUsed || self.largeFormActive
    value:
      changes:
        - type: setState
          grants: { where: 'item.id == @traits.large-form' }
          key: largeFormUsed
          value: false
        - type: setState
          grants: { where: 'item.id == @traits.large-form' }
          key: largeFormActive
          value: false
actions:
  - id: large-form
    tags: [feature]
    available: level.total >= 5 && !self.largeFormUsed && !self.largeFormActive
    results: [large]
    steps:
      - id: grow
        kind: changes
        changes:
          - { type: setState, grant: self, key: largeFormActive, value: true }
          - { type: setState, grant: self, key: largeFormUsed, value: true }
      - id: result
        kind: outcome
        result: "'large'"
  - id: end-large-form
    tags: [feature]
    available: self.largeFormActive
    results: [ended]
    steps:
      - id: shrink
        kind: changes
        changes:
          - { type: setState, grant: self, key: largeFormActive, value: false }
      - id: result
        kind: outcome
        result: "'ended'"
