id: traits.breath-weapon
type: trait
# `self` is the Dragonborn copy, which keeps the uses.
effects:
  - target: { steps: [rest.long] }
    op: changes
    when: self.breathWeaponUsed > 0
    value:
      changes:
        - { type: setState, entry: self, key: breathWeaponUsed, value: 0 }
actions:
  - id: breath-weapon
    tags: [feature]
    available: origins.draconicDamage != '' && self.breathWeaponUsed < proficiency.bonus
    params:
      shape: { type: enum, values: [cone, line], default: cone }
    participants:
      target:
        fields: target
    results: [breathed]
    steps:
      - id: damage
        kind: roll
        tags: [damage]
        parts:
          - dice: '(level.total >= 17 ? 4 : level.total >= 11 ? 3 : level.total >= 5 ? 2 : 1)d10'
            tags: [{ formula: "'damage.' + origins.draconicDamage" }]
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: breathWeaponUsed, by: 1 }
      - id: saves
        kind: action
        each: target
        as: participant
        use: saving-throw
        params:
          ability: "'dex'"
          dc: 8 + abilities.con.mod + proficiency.bonus
      - id: burn
        kind: changes
        each: target
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: >-
              steps.saves.result == 'success' ? -floor(max(0, part.total) / 2) : -max(0, part.total)
            tags:
              - damage
              - magical
              - save-half
              - save.dex
              - { formula: "steps.saves.result == 'success' ? 'save-success' : 'save-failure'" }
      - id: result
        kind: outcome
        result: "'breathed'"
        data:
          damage: steps.damage.total
          dc: 8 + abilities.con.mod + proficiency.bonus
          area: "params.shape == 'cone' ? 15 : 30"
