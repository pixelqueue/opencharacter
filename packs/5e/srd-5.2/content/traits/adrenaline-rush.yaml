id: traits.adrenaline-rush
type: trait
state:
  adrenalineRushUsed: { type: integer, default: 0, min: 0 }
effects:
  - target: { steps: [rest.short, rest.long] }
    op: changes
    when: self.adrenalineRushUsed > 0
    value:
      changes:
        - type: setState
          grants: { where: 'item.id == @traits.adrenaline-rush' }
          key: adrenalineRushUsed
          value: 0
actions:
  - id: adrenaline-rush
    tags: [feature]
    available: self.adrenalineRushUsed < proficiency.bonus
    results: [dashed]
    steps:
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, grant: self, key: adrenalineRushUsed, by: 1 }
      - id: rush
        kind: action
        use: gain-temporary-hit-points
        params: { amount: proficiency.bonus }
      - id: result
        kind: outcome
        result: "'dashed'"
        data:
          temp: max(hp.temp, proficiency.bonus)
