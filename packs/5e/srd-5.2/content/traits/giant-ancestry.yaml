id: traits.giant-ancestry
type: trait
# The uses spent since the last long rest, shared by every power (proficiency bonus of them). An
# action spends one with `grant: self`; Stone's Endurance's `then` writes it here too, since the
# trait declares the key. The granting species sets the lineage picked.
state:
  giantAncestryUsed: { type: integer, default: 0, min: 0 }
  lineage: { type: string, default: '' }
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: add
    value: 1d12 + abilities.con.mod
    when: situational.stonesEndurance && incoming.amount < 0
    then:
      - { type: adjustState, entry: self, key: giantAncestryUsed, by: 1 }
  - target: { incoming: { fields: [hp.current], tags: [damage] } }
    op: atMost
    value: 0
    when: situational.stonesEndurance && incoming.amount < 0
  # Fire's Burn, Frost's Chill and Hill's Tumble are offered on a weapon or Unarmed Strike hit:
  # the extra dice join the hit's damage roll (doubled on a Critical Hit), and the use is spent
  # on the damage step. Their own actions stay for other attack rolls.
  - target: combat.hitOptions
    op: add
    value: 1
    when: >-
      self.lineage in [@lineages.fire-giant, @lineages.frost-giant, @lineages.hill-giant]
        && self.giantAncestryUsed < proficiency.bonus
  - target: { choices: [weapon-hit, unarmed-hit] }
    op: option
    when: self.lineage == @lineages.fire-giant && self.giantAncestryUsed < proficiency.bonus
    value: { id: fires-burn }
  - target: { choices: [weapon-hit, unarmed-hit] }
    op: option
    when: self.lineage == @lineages.frost-giant && self.giantAncestryUsed < proficiency.bonus
    value: { id: frosts-chill }
  - target: { choices: [weapon-hit, unarmed-hit] }
    op: option
    when: self.lineage == @lineages.hill-giant && self.giantAncestryUsed < proficiency.bonus
    value: { id: hills-tumble }
  - target: { rolls: [damage.weapon] }
    op: add
    value: 1d10
    tags: [damage.fire]
    when: has(steps.onHit) && steps.onHit.picked == '5e-srd-5.2:traits.giant-ancestry#fires-burn'
  - target: { rolls: [damage.weapon] }
    op: add
    value: 1d6
    tags: [damage.cold]
    when: has(steps.onHit) && steps.onHit.picked == '5e-srd-5.2:traits.giant-ancestry#frosts-chill'
  - target: { steps: [attack-hit] }
    op: changes
    when: has(steps.onHit) && steps.onHit.picked == '5e-srd-5.2:traits.giant-ancestry#frosts-chill'
    value:
      changes:
        - { type: applyEffect, source: "'combat-effects.slowed'" }
  - target: { steps: [attack-hit] }
    op: changes
    when: >-
      has(steps.onHit) && steps.onHit.picked == '5e-srd-5.2:traits.giant-ancestry#hills-tumble'
        && !(size(participants.target) > 0
          && participants.target[0].creature.size in ['huge', 'gargantuan'])
    value:
      changes:
        - type: applyEffect
          source: "'conditions.prone'"
          state: { by: creature.type, magical: true }
  - target: { steps: [attack-hit] }
    op: changes
    when: >-
      (has(steps.onHit) && steps.onHit.picked in ['5e-srd-5.2:traits.giant-ancestry#fires-burn',
        '5e-srd-5.2:traits.giant-ancestry#frosts-chill'])
        || (has(steps.onHit) && steps.onHit.picked == '5e-srd-5.2:traits.giant-ancestry#hills-tumble'
          && !(size(participants.target) > 0
            && participants.target[0].creature.size in ['huge', 'gargantuan']))
    value:
      to: self
      changes:
        - { type: adjustState, grant: owner, key: giantAncestryUsed, by: 1 }
  - target: { steps: [rest.long] }
    op: changes
    when: self.giantAncestryUsed > 0
    value:
      changes:
        - type: setState
          grant: owner
          key: giantAncestryUsed
          value: 0
actions:
  - id: clouds-jaunt
    tags: [feature]
    available: >-
      self.lineage == @lineages.cloud-giant && self.giantAncestryUsed < proficiency.bonus
    results: [teleported]
    steps:
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, grant: self, key: giantAncestryUsed, by: 1 }
      - id: result
        kind: outcome
        result: "'teleported'"
        data:
          distance: 30
  - id: fires-burn
    tags: [feature]
    available: >-
      self.lineage == @lineages.fire-giant && self.giantAncestryUsed < proficiency.bonus
    params:
      critical: { type: boolean, default: false }
    participants:
      target:
        max: 1
        fields: target
    results: [burned]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags: { critical: params.critical }
      - id: damage
        kind: roll
        tags: [damage]
        parts:
          - dice: 1d10
            tags: [damage.fire]
      - id: deal
        kind: changes
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags: [damage, magical]
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, grant: self, key: giantAncestryUsed, by: 1 }
      - id: result
        kind: outcome
        result: "'burned'"
        data:
          damage: steps.damage.total
  - id: frosts-chill
    tags: [feature]
    available: >-
      self.lineage == @lineages.frost-giant && self.giantAncestryUsed < proficiency.bonus
    params:
      critical: { type: boolean, default: false }
    participants:
      target:
        max: 1
        fields: target
    results: [chilled]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags: { critical: params.critical }
      - id: damage
        kind: roll
        tags: [damage]
        parts:
          - dice: 1d6
            tags: [damage.cold]
      - id: deal
        kind: changes
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags: [damage, magical]
          - type: applyEffect
            source: "'combat-effects.slowed'"
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, grant: self, key: giantAncestryUsed, by: 1 }
      - id: result
        kind: outcome
        result: "'chilled'"
        data:
          damage: steps.damage.total
  - id: hills-tumble
    tags: [feature]
    available: >-
      self.lineage == @lineages.hill-giant && self.giantAncestryUsed < proficiency.bonus
    participants:
      target:
        max: 1
        fields: target
    results: [toppled, too-large]
    steps:
      - id: tooLarge
        kind: outcome
        when: >-
          size(participants.target) > 0
            && participants.target[0].creature.size in ['huge', 'gargantuan']
        result: "'too-large'"
      - id: topple
        kind: changes
        to: target
        changes:
          - type: applyEffect
            source: "'conditions.prone'"
            state: { by: creature.type, magical: true }
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, grant: self, key: giantAncestryUsed, by: 1 }
      - id: result
        kind: outcome
        result: "'toppled'"
  - id: storms-thunder
    tags: [feature]
    available: >-
      self.lineage == @lineages.storm-giant && self.giantAncestryUsed < proficiency.bonus
    participants:
      target:
        max: 1
        fields: target
    results: [thundered]
    steps:
      - id: damage
        kind: roll
        tags: [damage]
        parts:
          - dice: 1d8
            tags: [damage.thunder]
      - id: deal
        kind: changes
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags: [damage, magical]
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, grant: self, key: giantAncestryUsed, by: 1 }
      - id: result
        kind: outcome
        result: "'thundered'"
        data:
          damage: steps.damage.total
