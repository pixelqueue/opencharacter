id: traits.draconic-flight
type: trait
state:
  flightUsed: { type: boolean, default: false }
  flightActive: { type: boolean, default: false }
effects:
  - { target: combat.flySpeed, op: atLeast, value: combat.speed, when: self.flightActive }
  - target: { steps: [rest.long] }
    op: changes
    when: self.flightUsed || self.flightActive
    value:
      changes:
        - type: setState
          grant: owner
          key: flightUsed
          value: false
        - type: setState
          grant: owner
          key: flightActive
          value: false
followUps:
  - id: incapacitated
    becomes: conditions.incapacitated
    required: true
    when: self.flightActive
    action: retract-wings
actions:
  - id: draconic-flight
    tags: [feature]
    available: level.total >= 5 && !self.flightUsed && !self.flightActive
    results: [flying]
    steps:
      - id: wings
        kind: changes
        changes:
          - { type: setState, grant: self, key: flightActive, value: true }
          - { type: setState, grant: self, key: flightUsed, value: true }
      - id: result
        kind: outcome
        result: "'flying'"
  - id: retract-wings
    tags: [feature]
    available: self.flightActive
    results: [ended]
    steps:
      - id: retract
        kind: changes
        changes:
          - { type: setState, grant: self, key: flightActive, value: false }
      - id: result
        kind: outcome
        result: "'ended'"
