id: traits.draconic-flight
type: trait
effects:
  - { target: combat.flySpeed, op: atLeast, value: combat.speed, when: self.flightActive }
  - target: { steps: [rest.long] }
    op: changes
    when: self.flightUsed || self.flightActive
    value:
      changes:
        - { type: setState, entry: self, key: flightUsed, value: false }
        - { type: setState, entry: self, key: flightActive, value: false }
followUps:
  - id: incapacitated
    becomes: conditions.incapacitated
    required: true
    when: >-
      countCopies(copy.type == 'species' && has(copy.state.flightActive)
        && copy.state.flightActive) > 0
    changes:
      - type: setState
        copies: { type: species, where: has(self.flightActive) }
        key: flightActive
        value: false
actions:
  - id: draconic-flight
    tags: [feature]
    available: level.total >= 5 && !self.flightUsed && !self.flightActive
    results: [flying]
    steps:
      - id: wings
        kind: changes
        changes:
          - { type: setState, entry: self, key: flightActive, value: true }
          - { type: setState, entry: self, key: flightUsed, value: true }
      - id: result
        kind: outcome
        result: "'flying'"
  - id: retract-wings
    tags: [feature]
    available: self.flightActive
    results: [ended]
    steps:
      - id: retract
        kind: changes
        changes:
          - { type: setState, entry: self, key: flightActive, value: false }
      - id: result
        kind: outcome
        result: "'ended'"
