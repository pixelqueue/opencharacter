id: traits.stonecunning
type: trait
effects:
  - { target: senses.tremorsense, op: atLeast, value: 60, when: self.tremorsenseActive }
  - target: { steps: [rest.long] }
    op: changes
    when: self.stonecunningUsed > 0 || self.tremorsenseActive
    value:
      changes:
        - { type: setState, entry: self, key: stonecunningUsed, value: 0 }
        - { type: setState, entry: self, key: tremorsenseActive, value: false }
actions:
  - id: stonecunning
    tags: [feature]
    available: self.stonecunningUsed < proficiency.bonus && !self.tremorsenseActive
    results: [sensing]
    steps:
      - id: sense
        kind: changes
        changes:
          - { type: setState, entry: self, key: tremorsenseActive, value: true }
          - { type: adjustState, entry: self, key: stonecunningUsed, by: 1 }
      - id: result
        kind: outcome
        result: "'sensing'"
  - id: end-stonecunning
    tags: [feature]
    available: self.tremorsenseActive
    results: [ended]
    steps:
      - id: end
        kind: changes
        changes:
          - { type: setState, entry: self, key: tremorsenseActive, value: false }
      - id: result
        kind: outcome
        result: "'ended'"
