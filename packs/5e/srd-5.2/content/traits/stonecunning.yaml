id: traits.stonecunning
type: trait
state:
  stonecunningUsed: { type: integer, default: 0, min: 0 }
  tremorsenseActive: { type: boolean, default: false }
effects:
  - { target: senses.tremorsense, op: atLeast, value: 60, when: self.tremorsenseActive }
  - target: { steps: [rest.long] }
    op: changes
    when: self.stonecunningUsed > 0 || self.tremorsenseActive
    value:
      changes:
        - type: setState
          grant: owner
          key: stonecunningUsed
          value: 0
        - type: setState
          grant: owner
          key: tremorsenseActive
          value: false
actions:
  - id: stonecunning
    tags: [feature]
    available: self.stonecunningUsed < proficiency.bonus && !self.tremorsenseActive
    results: [sensing]
    steps:
      - id: sense
        kind: changes
        changes:
          - { type: setState, grant: self, key: tremorsenseActive, value: true }
          - { type: adjustState, grant: self, key: stonecunningUsed, by: 1 }
      - id: result
        kind: outcome
        result: "'sensing'"
  - id: end-stonecunning
    tags: [feature]
    available: self.tremorsenseActive
    results: [ended]
    steps:
      - id: end
        kind: changes
        changes:
          - { type: setState, grant: self, key: tremorsenseActive, value: false }
      - id: result
        kind: outcome
        result: "'ended'"
