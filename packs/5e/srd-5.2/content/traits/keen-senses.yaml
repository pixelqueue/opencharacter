id: traits.keen-senses
type: trait
# With all three skills already proficient, any of them is a valid pick (it adds nothing).
choices:
  - id: skill
    unique: skills
    recommend: >-
      (filterList(['skill.perception', 'skill.insight', 'skill.survival'],
        !(x in proficiencies.skills) || x in choice.picks)
        + ['skill.perception', 'skill.insight', 'skill.survival'])[0]
    from:
      values: [skill.insight, skill.perception, skill.survival]
      where: >-
        !(value in proficiencies.skills) || value in choice.picks
          || countList(['skill.insight', 'skill.perception', 'skill.survival'],
            !(x in proficiencies.skills)) == 0
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
