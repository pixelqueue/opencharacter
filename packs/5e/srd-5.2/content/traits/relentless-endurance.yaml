id: traits.relentless-endurance
type: trait
state:
  relentlessEnduranceUsed: { type: boolean, default: false }
followUps:
  - id: relentless-endurance
    becomes: hp.current == 0 && !creature.dead
    when: '!self.relentlessEnduranceUsed'
    action: relentless-endurance
effects:
  - target: { steps: [rest.long] }
    op: changes
    when: self.relentlessEnduranceUsed
    value:
      changes:
        - { type: setState, grants: { where: "item.id == @traits.relentless-endurance" }, key: relentlessEnduranceUsed, value: false }
actions:
  - id: relentless-endurance
    tags: [feature]
    available: hp.current == 0 && !creature.dead && !self.relentlessEnduranceUsed
    results: [endured]
    steps:
      - id: endure
        kind: changes
        changes:
          - { type: set, field: hp.current, value: 1 }
          - { type: setState, grant: self, key: relentlessEnduranceUsed, value: true }
      - id: result
        kind: outcome
        result: "'endured'"
