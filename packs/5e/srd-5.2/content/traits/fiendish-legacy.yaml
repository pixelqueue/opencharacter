id: traits.fiendish-legacy
type: trait
state:
  lineageSpell1Used: { type: boolean, default: false }
  lineageSpell2Used: { type: boolean, default: false }
effects:
  - target: { choices: [spell-cost] }
    op: option
    stackKey: lineage-spell-1
    when: >-
      action.item.id in spells.species && action.item.level == 1 && level.total >= 3
        && !self.lineageSpell1Used
    value:
      id: free-cast
      flags: { slot: 1, castAbility: "'species'" }
      changes:
        - type: setState
          grant: owner
          key: lineageSpell1Used
          value: true
  - target: { choices: [spell-cost] }
    op: option
    stackKey: lineage-spell-2
    when: >-
      action.item.id in spells.species && action.item.level == 2 && level.total >= 5
        && !self.lineageSpell2Used
    value:
      id: free-cast-2
      flags: { slot: 2, castAbility: "'species'" }
      changes:
        - type: setState
          grant: owner
          key: lineageSpell2Used
          value: true
  - target: { steps: [rest.long] }
    op: changes
    when: self.lineageSpell1Used || self.lineageSpell2Used
    value:
      changes:
        - type: setState
          grant: owner
          key: lineageSpell1Used
          value: false
        - type: setState
          grant: owner
          key: lineageSpell2Used
          value: false
