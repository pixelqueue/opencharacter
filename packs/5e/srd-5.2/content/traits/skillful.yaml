id: traits.skillful
type: trait
choices:
  - id: skill
    unique: skills
    recommend: >-
      filterList(['skill.perception', 'skill.insight', 'skill.athletics', 'skill.stealth',
        'skill.persuasion', 'skill.survival', 'skill.investigation', 'skill.arcana'],
        !(x in proficiencies.skills) || x in choice.picks)[0]
    from:
      values:
        [
          skill.acrobatics,
          skill.animal-handling,
          skill.arcana,
          skill.athletics,
          skill.deception,
          skill.history,
          skill.insight,
          skill.intimidation,
          skill.investigation,
          skill.medicine,
          skill.nature,
          skill.perception,
          skill.performance,
          skill.persuasion,
          skill.religion,
          skill.sleight-of-hand,
          skill.stealth,
          skill.survival,
        ]
      where: '!(value in proficiencies.skills) || value in choice.picks'
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
