id: monsters.chimera.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3, fields: target }
    results: [done]
    steps:
      - id: ram1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.chimera.ram)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: bite2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.chimera.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: pick3
        kind: choice
        options:
          - id: fire-breath
            when: >-
              countCopies(copy.item == @monsters.chimera.fire-breath && !copy.state.recharging) > 0
          - id: claw
        recommend: options[0]
      - id: claw3
        kind: action
        when: "steps.pick3.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.chimera.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: fireBreath
        kind: action
        when: "steps.pick3.picked == 'fire-breath'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.chimera.fire-breath)[0].id
        participants:
          target: participants.target
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.ram1.result == 'hit' ? 1 : 0)
              + (steps.bite2.result == 'hit' ? 1 : 0)
              + (has(steps.claw3) && steps.claw3.result == 'hit' ? 1 : 0)
