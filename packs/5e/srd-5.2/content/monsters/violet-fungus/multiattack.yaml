id: monsters.violet-fungus.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: rottingTouch1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.violet-fungus.rotting-touch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: rottingTouch2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.violet-fungus.rotting-touch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.rottingTouch1.result == 'hit' ? 1 : 0)
              + (steps.rottingTouch2.result == 'hit' ? 1 : 0)
