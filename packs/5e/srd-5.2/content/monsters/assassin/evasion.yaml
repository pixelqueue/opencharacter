id: monsters.assassin.evasion
type: monsterAction
fields:
  kind: trait
  order: 1
# Effects that allow a Dexterity save for half damage tag their damage with the save, so this
# removes it on a success and halves it again on a failure.
effects:
  - target: { incoming: { fields: [hp.current], tags: [save.dex] } }
    op: multiply
    value: "'save-success' in incoming.tags ? 0 : 0.5"
    when: "'save-half' in incoming.tags && !conditions.incapacitated"
