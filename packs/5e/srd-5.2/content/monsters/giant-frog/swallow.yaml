id: monsters.giant-frog.swallow
type: monsterAction
fields:
  kind: action
  order: 4
  maxSize: small
actions:
  # The target it is grappling: no longer Grappled, but Blinded and Restrained. The acid damage
  # and the disgorging at the end of the frog's next turn are text.
  - id: swallow
    tags: [monster-effect]
    participants:
      target: { max: 1, fields: target }
    results: [swallowed, too-big]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              sizeOk: >-
                size(participants.target) == 0
                  || indexOf(['tiny', 'small', 'medium', 'large', 'huge', 'gargantuan'],
                    participants.target[0].creature.size) <= 1
      - id: swallow
        kind: changes
        when: flags.sizeOk && size(participants.target) > 0
        to: target
        changes:
          - type: removeEffect
            applied: { where: 'item.id == @conditions.grappled' }
          - { type: applyEffect, source: "'conditions.blinded'", state: { by: creature.type } }
          - { type: applyEffect, source: "'conditions.restrained'", state: { by: creature.type } }
      - id: result
        kind: outcome
        result: "flags.sizeOk ? 'swallowed' : 'too-big'"
