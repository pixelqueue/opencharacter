id: monsters.werewolf.multiattack
type: monsterAction
fields:
  kind: action
  order: 2
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: scratch }, { id: longbow }]
        recommend: "'scratch'"
      - id: scratch1
        kind: action
        when: "steps.pick1.picked == 'scratch'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.werewolf.scratch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: longbow1
        kind: action
        when: "steps.pick1.picked == 'longbow'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.werewolf.longbow)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: scratch }, { id: longbow }, { id: bite }]
        recommend: "'scratch'"
      - id: scratch2
        kind: action
        when: "steps.pick2.picked == 'scratch'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.werewolf.scratch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: longbow2
        kind: action
        when: "steps.pick2.picked == 'longbow'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.werewolf.longbow)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: bite2
        kind: action
        when: "steps.pick2.picked == 'bite'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.werewolf.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.scratch1) && steps.scratch1.result == 'hit' ? 1 : 0)
              + (has(steps.longbow1) && steps.longbow1.result == 'hit' ? 1 : 0)
              + (has(steps.scratch2) && steps.scratch2.result == 'hit' ? 1 : 0)
              + (has(steps.longbow2) && steps.longbow2.result == 'hit' ? 1 : 0)
              + (has(steps.bite2) && steps.bite2.result == 'hit' ? 1 : 0)
