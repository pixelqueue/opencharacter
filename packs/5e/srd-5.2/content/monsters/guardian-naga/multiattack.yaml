id: monsters.guardian-naga.multiattack
type: monsterAction
fields:
  kind: action
  order: 2
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: bite }, { id: poisonous-spittle }]
        recommend: "'bite'"
      - id: bite1
        kind: action
        when: "steps.pick1.picked == 'bite'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.guardian-naga.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: spittle1
        kind: action
        when: "steps.pick1.picked == 'poisonous-spittle'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.guardian-naga.poisonous-spittle)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: bite }, { id: poisonous-spittle }]
        recommend: "'bite'"
      - id: bite2
        kind: action
        when: "steps.pick2.picked == 'bite'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.guardian-naga.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: spittle2
        kind: action
        when: "steps.pick2.picked == 'poisonous-spittle'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.guardian-naga.poisonous-spittle)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.bite1) && steps.bite1.result == 'hit' ? 1 : 0)
              + (has(steps.bite2) && steps.bite2.result == 'hit' ? 1 : 0)
