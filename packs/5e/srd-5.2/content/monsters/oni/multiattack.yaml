id: monsters.oni.multiattack
type: monsterAction
fields:
  kind: action
  order: 2
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options:
          - { id: claw }
          - { id: nightmare-ray }
        recommend: "'claw'"
      - id: claw1
        kind: action
        when: "steps.pick1.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.oni.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: nightmareRay1
        kind: action
        when: "steps.pick1.picked == 'nightmare-ray'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.oni.nightmare-ray)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options:
          - { id: claw }
          - { id: nightmare-ray }
          - { id: spellcasting }
        recommend: "'claw'"
      - id: claw2
        kind: action
        when: "steps.pick2.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.oni.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: nightmareRay2
        kind: action
        when: "steps.pick2.picked == 'nightmare-ray'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.oni.nightmare-ray)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.claw1) && steps.claw1.result == 'hit' ? 1 : 0)
              + (has(steps.nightmareRay1) && steps.nightmareRay1.result == 'hit' ? 1 : 0)
              + (has(steps.claw2) && steps.claw2.result == 'hit' ? 1 : 0)
              + (has(steps.nightmareRay2) && steps.nightmareRay2.result == 'hit' ? 1 : 0)
