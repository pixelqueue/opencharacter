id: monsters.mummy-lord.multiattack
type: monsterAction
fields:
  kind: action
  order: 4
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick
        kind: choice
        options:
          - { id: rotting-fist }
          - { id: channel-negative-energy }
        recommend: "'rotting-fist'"
      - id: rottingFist
        kind: action
        when: "steps.pick.picked == 'rotting-fist'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.mummy-lord.rotting-fist)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: channelNegativeEnergy
        kind: action
        when: "steps.pick.picked == 'channel-negative-energy'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.mummy-lord.channel-negative-energy)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: dreadfulGlare
        kind: action
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.mummy-lord.dreadful-glare)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.rottingFist) && steps.rottingFist.result == 'hit' ? 1 : 0)
              + (has(steps.channelNegativeEnergy) && steps.channelNegativeEnergy.result == 'hit' ? 1 : 0)
