id: monsters.roc.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: beak1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.roc.beak)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options:
          - { id: beak }
          - { id: talons }
        recommend: "'beak'"
      - id: beak2
        kind: action
        when: "steps.pick2.picked == 'beak'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.roc.beak)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: talons
        kind: action
        when: "steps.pick2.picked == 'talons'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.roc.talons)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.beak1.result == 'hit' ? 1 : 0)
              + (has(steps.beak2) && steps.beak2.result == 'hit' ? 1 : 0)
              + (has(steps.talons) && steps.talons.result == 'hit' ? 1 : 0)
