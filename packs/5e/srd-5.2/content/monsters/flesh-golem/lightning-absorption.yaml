id: monsters.flesh-golem.lightning-absorption
type: monsterAction
fields:
  kind: trait
  order: 4
# Immunity zeroes the damage first (multiply); atLeast then turns it into healing of the same
# amount.
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.lightning] } }
    op: atLeast
    value: -incoming.amount
    when: incoming.amount < 0
