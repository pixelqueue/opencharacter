id: monsters.horned-devil.multiattack
type: monsterAction
fields:
  kind: action
  order: 3
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: searing-fork }, { id: hurl-flame }]
        recommend: "'searing-fork'"
      - id: searingFork1
        kind: action
        when: "steps.pick1.picked == 'searing-fork'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.horned-devil.searing-fork)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: hurlFlame1
        kind: action
        when: "steps.pick1.picked == 'hurl-flame'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.horned-devil.hurl-flame)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: searing-fork }, { id: hurl-flame }]
        recommend: "'searing-fork'"
      - id: searingFork2
        kind: action
        when: "steps.pick2.picked == 'searing-fork'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.horned-devil.searing-fork)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: hurlFlame2
        kind: action
        when: "steps.pick2.picked == 'hurl-flame'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.horned-devil.hurl-flame)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: pick3
        kind: choice
        options: [{ id: searing-fork }, { id: hurl-flame }, { id: infernal-tail }]
        recommend: "'searing-fork'"
      - id: searingFork3
        kind: action
        when: "steps.pick3.picked == 'searing-fork'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.horned-devil.searing-fork)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: hurlFlame3
        kind: action
        when: "steps.pick3.picked == 'hurl-flame'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.horned-devil.hurl-flame)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: infernalTail
        kind: action
        when: "steps.pick3.picked == 'infernal-tail'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.horned-devil.infernal-tail)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.searingFork1) && steps.searingFork1.result == 'hit' ? 1 : 0)
              + (has(steps.hurlFlame1) && steps.hurlFlame1.result == 'hit' ? 1 : 0)
              + (has(steps.searingFork2) && steps.searingFork2.result == 'hit' ? 1 : 0)
              + (has(steps.hurlFlame2) && steps.hurlFlame2.result == 'hit' ? 1 : 0)
              + (has(steps.searingFork3) && steps.searingFork3.result == 'hit' ? 1 : 0)
              + (has(steps.hurlFlame3) && steps.hurlFlame3.result == 'hit' ? 1 : 0)
