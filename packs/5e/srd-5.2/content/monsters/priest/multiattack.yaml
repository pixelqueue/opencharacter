id: monsters.priest.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: mace }, { id: radiant-flame }]
        recommend: "'mace'"
      - id: mace1
        kind: action
        when: "steps.pick1.picked == 'mace'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.priest.mace)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: radiantFlame1
        kind: action
        when: "steps.pick1.picked == 'radiant-flame'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.priest.radiant-flame)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: mace }, { id: radiant-flame }]
        recommend: "'mace'"
      - id: mace2
        kind: action
        when: "steps.pick2.picked == 'mace'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.priest.mace)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: radiantFlame2
        kind: action
        when: "steps.pick2.picked == 'radiant-flame'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.priest.radiant-flame)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.mace1) && steps.mace1.result == 'hit' ? 1 : 0)
              + (has(steps.radiantFlame1) && steps.radiantFlame1.result == 'hit' ? 1 : 0)
              + (has(steps.mace2) && steps.mace2.result == 'hit' ? 1 : 0)
              + (has(steps.radiantFlame2) && steps.radiantFlame2.result == 'hit' ? 1 : 0)
