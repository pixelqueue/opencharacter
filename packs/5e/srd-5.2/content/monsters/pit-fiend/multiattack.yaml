id: monsters.pit-fiend.multiattack
type: monsterAction
fields:
  kind: action
  order: 5
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 4, fields: target }
    results: [done]
    steps:
      - id: bite1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.pit-fiend.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: devilishClaw2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.pit-fiend.devilish-claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: devilishClaw3
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.pit-fiend.devilish-claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: fieryMace4
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.pit-fiend.fiery-mace)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(3, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.bite1.result == 'hit' ? 1 : 0)
              + (steps.devilishClaw2.result == 'hit' ? 1 : 0)
              + (steps.devilishClaw3.result == 'hit' ? 1 : 0)
              + (steps.fieryMace4.result == 'hit' ? 1 : 0)
