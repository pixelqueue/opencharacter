id: monsters.behir.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: bite
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.behir.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: constrict
        kind: action
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.behir.constrict)[0].id
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)]] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: "steps.bite.result == 'hit' ? 1 : 0"
