id: monsters.elk.ram
type: monsterAction
fields:
  kind: action
  order: 1
  attack: melee
  toHit: 5
  reach: 5
  damage: 1d6 + 3
  damageType: bludgeoning
actions:
  # "If the target is a Large or smaller creature and the elk moved 20+ feet straight toward it
  # immediately before the hit".
  - id: charge
    tags: [attack]
    participants:
      target: { max: 1, fields: target }
    results: [hit, miss]
    steps:
      - id: ram
        kind: action
        use: monster-attack
        entry: self.id
        participants:
          target: participants.target
      - id: rider
        kind: branch
        cases:
          - when: true
            flags:
              rider: >-
                steps.ram.result == 'hit' && size(participants.target) > 0
                  && indexOf(['tiny', 'small', 'medium', 'large', 'huge', 'gargantuan'],
                    participants.target[0].creature.size) <= 3
      - id: extra
        kind: roll
        when: flags.rider
        tags: [damage]
        parts:
          - dice: 'steps.ram.data.critical ? 2d6 : 1d6'
            tags: [damage.bludgeoning]
      - id: deal
        kind: changes
        when: has(steps.extra)
        each: target
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: extra, by: damage }
            by: -max(0, part.total)
            tags: [damage, attack, melee]
      - id: prone
        kind: changes
        when: flags.rider
        each: target
        to: target
        changes:
          - { type: applyEffect, source: "'conditions.prone'", state: { by: creature.type } }
      - id: result
        kind: outcome
        result: "steps.ram.result == 'hit' ? 'hit' : 'miss'"
