id: monsters.mummy.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: rottingFist1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.mummy.rotting-fist)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: rottingFist2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.mummy.rotting-fist)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: dreadfulGlare
        kind: action
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.mummy.dreadful-glare)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.rottingFist1.result == 'hit' ? 1 : 0)
              + (steps.rottingFist2.result == 'hit' ? 1 : 0)
