id: monsters.sea-hag.death-glare
type: monsterAction
fields:
  kind: action
  order: 5
  recharge: 5
actions:
  - id: glare
    tags: [monster-effect]
    available: '!self.recharging'
    params:
      # The target's current Hit Points (the target view doesn't show them).
      targetHp: { type: integer, optional: true }
    participants:
      target: { max: 1, fields: target }
    results: [used]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              drop: has(params.targetHp) && params.targetHp <= 20
      - id: save
        kind: action
        each: target
        as: participant
        use: saving-throw
        params:
          ability: "'wis'"
          dc: 11
      - id: drop
        kind: changes
        each: target
        when: steps.save.result == 'failure' && flags.drop
        to: target
        changes:
          - type: set
            field: hp.current
            value: 0
      - id: damage
        kind: roll
        when: '!flags.drop'
        tags: [damage]
        parts:
          - { dice: 3d8, tags: [damage.psychic] }
      - id: burn
        kind: changes
        each: target
        when: has(steps.damage) && steps.save.result == 'failure'
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags: [damage, save-negates, save.wis, save-failure]
      - id: spend
        kind: changes
        changes:
          - { type: setState, entry: self, key: recharging, value: true }
      - id: result
        kind: outcome
        result: "'used'"
