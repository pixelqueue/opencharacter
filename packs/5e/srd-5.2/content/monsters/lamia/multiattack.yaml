id: monsters.lamia.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: claw1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.lamia.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: claw }, { id: corrupting-touch }]
        recommend: "'claw'"
      - id: claw2
        kind: action
        when: "steps.pick2.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.lamia.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: corruptingTouch
        kind: action
        when: "steps.pick2.picked == 'corrupting-touch'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.lamia.corrupting-touch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.claw1.result == 'hit' ? 1 : 0)
              + (has(steps.claw2) && steps.claw2.result == 'hit' ? 1 : 0)
