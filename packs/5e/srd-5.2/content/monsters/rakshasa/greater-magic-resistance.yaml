id: monsters.rakshasa.greater-magic-resistance
type: monsterAction
fields:
  kind: trait
  order: 1
effects:
  - { target: saves.spellsSucceed, op: set, value: true }
  - { target: combat.spellAttacksMiss, op: set, value: true }
  - target: { choices: [failed-save] }
    op: option
    when: has(params.dc)
    value:
      id: greater-magic-resistance
      flags: { addBonus: 'params.dc - flags.total' }
