id: monsters.rakshasa.multiattack
type: monsterAction
fields:
  kind: action
  order: 3
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3, fields: target }
    results: [done]
    steps:
      - id: cursedTouch1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.rakshasa.cursed-touch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: cursedTouch2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.rakshasa.cursed-touch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: cursedTouch3
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.rakshasa.cursed-touch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.cursedTouch1.result == 'hit' ? 1 : 0)
              + (steps.cursedTouch2.result == 'hit' ? 1 : 0)
              + (steps.cursedTouch3.result == 'hit' ? 1 : 0)
