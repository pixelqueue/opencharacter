id: monsters.hill-giant.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: tree-club }, { id: trash-lob }]
        recommend: "'tree-club'"
      - id: treeClub1
        kind: action
        when: "steps.pick1.picked == 'tree-club'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.hill-giant.tree-club)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: trashLob1
        kind: action
        when: "steps.pick1.picked == 'trash-lob'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.hill-giant.trash-lob)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: tree-club }, { id: trash-lob }]
        recommend: "'tree-club'"
      - id: treeClub2
        kind: action
        when: "steps.pick2.picked == 'tree-club'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.hill-giant.tree-club)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: trashLob2
        kind: action
        when: "steps.pick2.picked == 'trash-lob'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.hill-giant.trash-lob)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.treeClub1) && steps.treeClub1.result == 'hit' ? 1 : 0)
              + (has(steps.trashLob1) && steps.trashLob1.result == 'hit' ? 1 : 0)
              + (has(steps.treeClub2) && steps.treeClub2.result == 'hit' ? 1 : 0)
              + (has(steps.trashLob2) && steps.trashLob2.result == 'hit' ? 1 : 0)
