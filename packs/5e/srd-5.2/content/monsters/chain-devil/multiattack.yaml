id: monsters.chain-devil.multiattack
type: monsterAction
fields:
  kind: action
  order: 3
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: chain1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.chain-devil.chain)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: chain2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.chain-devil.chain)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: conjureInfernalChain
        kind: action
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.chain-devil.conjure-infernal-chain)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.chain1.result == 'hit' ? 1 : 0)
              + (steps.chain2.result == 'hit' ? 1 : 0)
