id: monsters.ice-devil.multiattack
type: monsterAction
fields:
  kind: action
  order: 3
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3, fields: target }
    results: [done]
    steps:
      - id: iceSpear1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.ice-devil.ice-spear)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: iceSpear2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.ice-devil.ice-spear)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: pick3
        kind: choice
        options: [{ id: ice-spear }, { id: tail }]
        recommend: "'ice-spear'"
      - id: iceSpear3
        kind: action
        when: "steps.pick3.picked == 'ice-spear'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.ice-devil.ice-spear)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: tail
        kind: action
        when: "steps.pick3.picked == 'tail'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.ice-devil.tail)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.iceSpear1.result == 'hit' ? 1 : 0)
              + (steps.iceSpear2.result == 'hit' ? 1 : 0)
              + (has(steps.iceSpear3) && steps.iceSpear3.result == 'hit' ? 1 : 0)
              + (has(steps.tail) && steps.tail.result == 'hit' ? 1 : 0)
