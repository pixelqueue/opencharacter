id: monsters.otyugh.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3, fields: target }
    results: [done]
    steps:
      - id: bite1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.otyugh.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: tentacle2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.otyugh.tentacle)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: tentacle3
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.otyugh.tentacle)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.bite1.result == 'hit' ? 1 : 0)
              + (steps.tentacle2.result == 'hit' ? 1 : 0)
              + (steps.tentacle3.result == 'hit' ? 1 : 0)
