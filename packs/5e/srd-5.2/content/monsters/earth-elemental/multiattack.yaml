id: monsters.earth-elemental.multiattack
type: monsterAction
fields:
  kind: action
  order: 3
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: slam }, { id: rock-launch }]
        recommend: "'slam'"
      - id: slam1
        kind: action
        when: "steps.pick1.picked == 'slam'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.earth-elemental.slam)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: rockLaunch1
        kind: action
        when: "steps.pick1.picked == 'rock-launch'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.earth-elemental.rock-launch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: slam }, { id: rock-launch }]
        recommend: "'slam'"
      - id: slam2
        kind: action
        when: "steps.pick2.picked == 'slam'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.earth-elemental.slam)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: rockLaunch2
        kind: action
        when: "steps.pick2.picked == 'rock-launch'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.earth-elemental.rock-launch)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.slam1) && steps.slam1.result == 'hit' ? 1 : 0)
              + (has(steps.rockLaunch1) && steps.rockLaunch1.result == 'hit' ? 1 : 0)
              + (has(steps.slam2) && steps.slam2.result == 'hit' ? 1 : 0)
              + (has(steps.rockLaunch2) && steps.rockLaunch2.result == 'hit' ? 1 : 0)
