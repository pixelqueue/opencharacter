id: monsters.kraken.multiattack
type: monsterAction
fields:
  kind: action
  order: 4
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: tentacle1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.kraken.tentacle)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: tentacle2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.kraken.tentacle)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      # Fling and Swallow take a creature the kraken has Grappled: the first target.
      - id: extra
        kind: choice
        options: [{ id: fling }, { id: lightning-strike }, { id: swallow }]
        recommend: "'lightning-strike'"
      - id: fling
        kind: action
        when: "steps.extra.picked == 'fling'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.kraken.fling)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: lightningStrike
        kind: action
        when: "steps.extra.picked == 'lightning-strike'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.kraken.lightning-strike)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: swallow
        kind: action
        when: "steps.extra.picked == 'swallow'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.kraken.swallow)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.tentacle1.result == 'hit' ? 1 : 0)
              + (steps.tentacle2.result == 'hit' ? 1 : 0)
