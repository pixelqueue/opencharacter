id: monsters.salamander.multiattack
type: monsterAction
fields:
  kind: action
  order: 2
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: flameSpear1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.salamander.flame-spear)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options:
          - { id: flame-spear }
          - { id: constrict }
        recommend: "'flame-spear'"
      - id: flameSpear2
        kind: action
        when: "steps.pick2.picked == 'flame-spear'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.salamander.flame-spear)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: constrict
        kind: action
        when: "steps.pick2.picked == 'constrict'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.salamander.constrict)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.flameSpear1.result == 'hit' ? 1 : 0)
              + (has(steps.flameSpear2) && steps.flameSpear2.result == 'hit' ? 1 : 0)
