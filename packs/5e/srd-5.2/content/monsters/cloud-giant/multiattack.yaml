id: monsters.cloud-giant.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: thunderous-mace }, { id: thundercloud }]
        recommend: "'thunderous-mace'"
      - id: thunderousMace1
        kind: action
        when: "steps.pick1.picked == 'thunderous-mace'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.cloud-giant.thunderous-mace)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: thundercloud1
        kind: action
        when: "steps.pick1.picked == 'thundercloud'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.cloud-giant.thundercloud)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: thunderous-mace }, { id: thundercloud }, { id: fog-cloud }]
        recommend: "'thunderous-mace'"
      - id: thunderousMace2
        kind: action
        when: "steps.pick2.picked == 'thunderous-mace'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.cloud-giant.thunderous-mace)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: thundercloud2
        kind: action
        when: "steps.pick2.picked == 'thundercloud'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.cloud-giant.thundercloud)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: fogCloud
        kind: action
        when: "steps.pick2.picked == 'fog-cloud'"
        use: cast-spell
        source: "'spells.fog-cloud'"
        params:
          slotType: "'none'"
        participants:
          target: participants.target
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.thunderousMace1) && steps.thunderousMace1.result == 'hit' ? 1 : 0)
              + (has(steps.thundercloud1) && steps.thundercloud1.result == 'hit' ? 1 : 0)
              + (has(steps.thunderousMace2) && steps.thunderousMace2.result == 'hit' ? 1 : 0)
              + (has(steps.thundercloud2) && steps.thundercloud2.result == 'hit' ? 1 : 0)
