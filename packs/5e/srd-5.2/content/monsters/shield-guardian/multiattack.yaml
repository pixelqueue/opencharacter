id: monsters.shield-guardian.multiattack
type: monsterAction
fields:
  kind: action
  order: 4
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: fist1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.shield-guardian.fist)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: fist2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.shield-guardian.fist)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.fist1.result == 'hit' ? 1 : 0)
              + (steps.fist2.result == 'hit' ? 1 : 0)
