id: monsters.storm-giant.multiattack
type: monsterAction
fields:
  kind: action
  order: 2
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: storm-sword }, { id: thunderbolt }]
        recommend: "'storm-sword'"
      - id: stormSword1
        kind: action
        when: "steps.pick1.picked == 'storm-sword'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.storm-giant.storm-sword)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: thunderbolt1
        kind: action
        when: "steps.pick1.picked == 'thunderbolt'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.storm-giant.thunderbolt)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: storm-sword }, { id: thunderbolt }]
        recommend: "'storm-sword'"
      - id: stormSword2
        kind: action
        when: "steps.pick2.picked == 'storm-sword'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.storm-giant.storm-sword)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: thunderbolt2
        kind: action
        when: "steps.pick2.picked == 'thunderbolt'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.storm-giant.thunderbolt)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.stormSword1) && steps.stormSword1.result == 'hit' ? 1 : 0)
              + (has(steps.thunderbolt1) && steps.thunderbolt1.result == 'hit' ? 1 : 0)
              + (has(steps.stormSword2) && steps.stormSword2.result == 'hit' ? 1 : 0)
              + (has(steps.thunderbolt2) && steps.thunderbolt2.result == 'hit' ? 1 : 0)
