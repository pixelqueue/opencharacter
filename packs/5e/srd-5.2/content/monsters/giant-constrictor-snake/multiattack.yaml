id: monsters.giant-constrictor-snake.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 1, fields: target }
    results: [done]
    steps:
      - id: bite1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.giant-constrictor-snake.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: constrict
        kind: action
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.giant-constrictor-snake.constrict)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.bite1.result == 'hit' ? 1 : 0)
