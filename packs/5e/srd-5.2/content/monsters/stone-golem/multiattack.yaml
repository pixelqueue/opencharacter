id: monsters.stone-golem.multiattack
type: monsterAction
fields:
  kind: action
  order: 3
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: slam }, { id: force-bolt }]
        recommend: "'slam'"
      - id: slam1
        kind: action
        when: "steps.pick1.picked == 'slam'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.stone-golem.slam)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: forceBolt1
        kind: action
        when: "steps.pick1.picked == 'force-bolt'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.stone-golem.force-bolt)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: slam }, { id: force-bolt }]
        recommend: "'slam'"
      - id: slam2
        kind: action
        when: "steps.pick2.picked == 'slam'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.stone-golem.slam)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: forceBolt2
        kind: action
        when: "steps.pick2.picked == 'force-bolt'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.stone-golem.force-bolt)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.slam1) && steps.slam1.result == 'hit' ? 1 : 0)
              + (has(steps.forceBolt1) && steps.forceBolt1.result == 'hit' ? 1 : 0)
              + (has(steps.slam2) && steps.slam2.result == 'hit' ? 1 : 0)
              + (has(steps.forceBolt2) && steps.forceBolt2.result == 'hit' ? 1 : 0)
