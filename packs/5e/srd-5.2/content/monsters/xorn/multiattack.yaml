id: monsters.xorn.multiattack
type: monsterAction
fields:
  kind: action
  order: 3
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 4, fields: target }
    results: [done]
    steps:
      - id: bite1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.xorn.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: claw2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.xorn.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: claw3
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.xorn.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: claw4
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.xorn.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(3, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.bite1.result == 'hit' ? 1 : 0)
              + (steps.claw2.result == 'hit' ? 1 : 0)
              + (steps.claw3.result == 'hit' ? 1 : 0)
              + (steps.claw4.result == 'hit' ? 1 : 0)
