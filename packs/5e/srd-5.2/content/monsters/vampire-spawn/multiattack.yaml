id: monsters.vampire-spawn.multiattack
type: monsterAction
fields:
  kind: action
  order: 7
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: claw1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.vampire-spawn.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: claw2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.vampire-spawn.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: bite
        kind: action
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.vampire-spawn.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.claw1.result == 'hit' ? 1 : 0)
              + (steps.claw2.result == 'hit' ? 1 : 0)
