id: monsters.tarrasque.multiattack
type: monsterAction
fields:
  kind: action
  order: 5
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 4, fields: target }
    results: [done]
    steps:
      - id: bite1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.tarrasque.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: claw }, { id: tail }]
        recommend: "'claw'"
      - id: claw2
        kind: action
        when: "steps.pick2.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.tarrasque.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: tail2
        kind: action
        when: "steps.pick2.picked == 'tail'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.tarrasque.tail)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: pick3
        kind: choice
        options: [{ id: claw }, { id: tail }]
        recommend: "'claw'"
      - id: claw3
        kind: action
        when: "steps.pick3.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.tarrasque.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: tail3
        kind: action
        when: "steps.pick3.picked == 'tail'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.tarrasque.tail)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: pick4
        kind: choice
        options: [{ id: claw }, { id: tail }]
        recommend: "'claw'"
      - id: claw4
        kind: action
        when: "steps.pick4.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.tarrasque.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(3, size(participants.target) - 1)]] : []'
      - id: tail4
        kind: action
        when: "steps.pick4.picked == 'tail'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.tarrasque.tail)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(3, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.bite1.result == 'hit' ? 1 : 0)
              + (has(steps.claw2) && steps.claw2.result == 'hit' ? 1 : 0)
              + (has(steps.tail2) && steps.tail2.result == 'hit' ? 1 : 0)
              + (has(steps.claw3) && steps.claw3.result == 'hit' ? 1 : 0)
              + (has(steps.tail3) && steps.tail3.result == 'hit' ? 1 : 0)
              + (has(steps.claw4) && steps.claw4.result == 'hit' ? 1 : 0)
              + (has(steps.tail4) && steps.tail4.result == 'hit' ? 1 : 0)
