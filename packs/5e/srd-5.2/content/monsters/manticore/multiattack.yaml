id: monsters.manticore.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: rend }, { id: tail-spike }]
        recommend: "'rend'"
      - id: rend1
        kind: action
        when: "steps.pick1.picked == 'rend'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.manticore.rend)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: tailSpike1
        kind: action
        when: "steps.pick1.picked == 'tail-spike'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.manticore.tail-spike)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: rend }, { id: tail-spike }]
        recommend: "'rend'"
      - id: rend2
        kind: action
        when: "steps.pick2.picked == 'rend'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.manticore.rend)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: tailSpike2
        kind: action
        when: "steps.pick2.picked == 'tail-spike'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.manticore.tail-spike)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: pick3
        kind: choice
        options: [{ id: rend }, { id: tail-spike }]
        recommend: "'rend'"
      - id: rend3
        kind: action
        when: "steps.pick3.picked == 'rend'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.manticore.rend)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: tailSpike3
        kind: action
        when: "steps.pick3.picked == 'tail-spike'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.manticore.tail-spike)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(2, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.rend1) && steps.rend1.result == 'hit' ? 1 : 0)
              + (has(steps.tailSpike1) && steps.tailSpike1.result == 'hit' ? 1 : 0)
              + (has(steps.rend2) && steps.rend2.result == 'hit' ? 1 : 0)
              + (has(steps.tailSpike2) && steps.tailSpike2.result == 'hit' ? 1 : 0)
              + (has(steps.rend3) && steps.rend3.result == 'hit' ? 1 : 0)
              + (has(steps.tailSpike3) && steps.tailSpike3.result == 'hit' ? 1 : 0)
