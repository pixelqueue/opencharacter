id: monsters.warrior-veteran.multiattack
type: monsterAction
fields:
  kind: action
  order: 1
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options: [{ id: greatsword }, { id: heavy-crossbow }]
        recommend: "'greatsword'"
      - id: greatsword1
        kind: action
        when: "steps.pick1.picked == 'greatsword'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.warrior-veteran.greatsword)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: heavyCrossbow1
        kind: action
        when: "steps.pick1.picked == 'heavy-crossbow'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.warrior-veteran.heavy-crossbow)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options: [{ id: greatsword }, { id: heavy-crossbow }]
        recommend: "'greatsword'"
      - id: greatsword2
        kind: action
        when: "steps.pick2.picked == 'greatsword'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.warrior-veteran.greatsword)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: heavyCrossbow2
        kind: action
        when: "steps.pick2.picked == 'heavy-crossbow'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.warrior-veteran.heavy-crossbow)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.greatsword1) && steps.greatsword1.result == 'hit' ? 1 : 0)
              + (has(steps.heavyCrossbow1) && steps.heavyCrossbow1.result == 'hit' ? 1 : 0)
              + (has(steps.greatsword2) && steps.greatsword2.result == 'hit' ? 1 : 0)
              + (has(steps.heavyCrossbow2) && steps.heavyCrossbow2.result == 'hit' ? 1 : 0)
