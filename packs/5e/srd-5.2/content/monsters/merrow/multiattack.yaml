id: monsters.merrow.multiattack
type: monsterAction
fields:
  kind: action
  order: 2
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: pick1
        kind: choice
        options:
          - { id: bite }
          - { id: claw }
          - { id: harpoon }
        recommend: "'bite'"
      - id: bite1
        kind: action
        when: "steps.pick1.picked == 'bite'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.merrow.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: claw1
        kind: action
        when: "steps.pick1.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.merrow.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: harpoon1
        kind: action
        when: "steps.pick1.picked == 'harpoon'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.merrow.harpoon)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: pick2
        kind: choice
        options:
          - { id: bite }
          - { id: claw }
          - { id: harpoon }
        recommend: "'bite'"
      - id: bite2
        kind: action
        when: "steps.pick2.picked == 'bite'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.merrow.bite)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: claw2
        kind: action
        when: "steps.pick2.picked == 'claw'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.merrow.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: harpoon2
        kind: action
        when: "steps.pick2.picked == 'harpoon'"
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.merrow.harpoon)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.bite1) && steps.bite1.result == 'hit' ? 1 : 0)
              + (has(steps.claw1) && steps.claw1.result == 'hit' ? 1 : 0)
              + (has(steps.harpoon1) && steps.harpoon1.result == 'hit' ? 1 : 0)
              + (has(steps.bite2) && steps.bite2.result == 'hit' ? 1 : 0)
              + (has(steps.claw2) && steps.claw2.result == 'hit' ? 1 : 0)
              + (has(steps.harpoon2) && steps.harpoon2.result == 'hit' ? 1 : 0)
