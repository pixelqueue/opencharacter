id: monsters.giant-seahorse.ram
type: monsterAction
fields:
  kind: action
  order: 2
  attack: melee
  toHit: 4
  reach: 5
  damage: 2d6 + 2
  damageType: bludgeoning
actions:
  # After moving 20+ feet straight toward the target: the Ram with its charge damage instead.
  - id: charge
    tags: [attack]
    participants:
      target: { max: 1, fields: target }
    results: [hit, miss]
    steps:
      - id: ram
        kind: action
        use: monster-attack
        entry: self.id
        hold: true
        participants:
          target: participants.target
      - id: pass
        kind: changes
        release: { steps: [ram], where: "!('damage' in change.tags)" }
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              critical: "steps.ram.result == 'hit' && steps.ram.data.critical"
      - id: damage
        kind: roll
        when: steps.ram.result == 'hit'
        tags: [damage.weapon]
        parts: [{ dice: 2d8 + 2, tags: [damage.bludgeoning] }]
      - id: deal
        kind: changes
        when: has(steps.damage)
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags: [damage, attack, melee, { formula: "flags.critical ? ['critical'] : []" }]
      - id: result
        kind: outcome
        result: "steps.ram.result == 'hit' ? 'hit' : 'miss'"
        data:
          damage: 'has(steps.damage) ? steps.damage.total : 0'
