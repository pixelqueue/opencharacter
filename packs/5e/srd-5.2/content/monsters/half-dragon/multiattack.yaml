id: monsters.half-dragon.multiattack
type: monsterAction
fields:
  kind: action
  order: 2
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    params:
      damageType: { type: enum, values: [acid, cold, fire, lightning, poison], default: acid }
    results: [done]
    steps:
      - id: claw1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.half-dragon.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: draconic1
        kind: action
        when: steps.claw1.result == 'hit'
        use: draconic-damage
        entry: filterList(character.features, x.item == @monsters.half-dragon.claw)[0].id
        params:
          damageType: params.damageType
          critical: steps.claw1.data.critical
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: claw2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.half-dragon.claw)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: draconic2
        kind: action
        when: steps.claw2.result == 'hit'
        use: draconic-damage
        entry: filterList(character.features, x.item == @monsters.half-dragon.claw)[0].id
        params:
          damageType: params.damageType
          critical: steps.claw2.data.critical
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[min(1, size(participants.target) - 1)]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.claw1.result == 'hit' ? 1 : 0)
              + (steps.claw2.result == 'hit' ? 1 : 0)
