id: monsters.aboleth.multiattack
type: monsterAction
fields:
  kind: action
  order: 6
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2, fields: target }
    results: [done]
    steps:
      - id: tentacle1
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.aboleth.tentacle)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: tentacle2
        kind: action
        use: monster-attack
        entry: filterList(character.features, x.item == @monsters.aboleth.tentacle)[0].id
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)]] : []
      - id: extra
        kind: choice
        options:
          - id: dominate-mind
            when: >-
              countCopies(copy.item == @monsters.aboleth.dominate-mind
                && copy.state.used < copy.state.uses) > 0
          - id: consume-memories
          - id: none
        recommend: options[0]
      - id: dominate
        kind: action
        when: "steps.extra.picked == 'dominate-mind'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.aboleth.dominate-mind)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: consume
        kind: action
        when: "steps.extra.picked == 'consume-memories'"
        use: monster-effect
        entry: filterList(character.features, x.item == @monsters.aboleth.consume-memories)[0].id
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0]] : []'
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (steps.tentacle1.result == 'hit' ? 1 : 0) + (steps.tentacle2.result == 'hit' ? 1 : 0)
