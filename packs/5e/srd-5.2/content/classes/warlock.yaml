id: classes.warlock
type: class
fields:
  hitDie: 1d8
state:
  magicalCunningUsed: { type: boolean, default: false }
  contactPatronUsed: { type: boolean, default: false }
  arcanum6Used: { type: boolean, default: false }
  arcanum7Used: { type: boolean, default: false }
  arcanum8Used: { type: boolean, default: false }
  arcanum9Used: { type: boolean, default: false }
  darkOnesOwnLuckUsed: { type: integer, default: 0, min: 0 }
  hurlThroughHellUsed: { type: boolean, default: false }
  giftOfTheDepthsUsed: { type: boolean, default: false }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - { target: proficiencies.saves, op: grant, value: { tag: save.wis }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.cha }, when: self.startingClass }
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
    when: self.startingClass
grants:
  - { item: features.warlock.eldritch-invocations, when: self.level >= 1 }
  - { item: features.warlock.pact-magic, when: self.level >= 1 }
  - { item: features.warlock.magical-cunning, when: self.level >= 2 }
  - { item: features.warlock.contact-patron, when: self.level >= 9 }
  - { item: features.warlock.mystic-arcanum, when: self.level >= 11 }
  - { item: features.warlock.eldritch-master, when: self.level >= 20 }
  - { item: features.warlock.ability-score-improvement, when: self.level >= 4 }
  - { item: features.warlock.epic-boon, when: self.level >= 19 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      values:
        [
          skill.arcana,
          skill.deception,
          skill.history,
          skill.intimidation,
          skill.investigation,
          skill.nature,
          skill.religion,
        ]
      where: '!(value in proficiencies.skills) || value in choice.picks'
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: subclass
    from: { type: subclass, where: 'item.class == @classes.warlock' }
    when: self.level >= 3
