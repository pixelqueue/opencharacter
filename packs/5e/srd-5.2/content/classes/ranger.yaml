id: classes.ranger
type: class
fields:
  hitDie: 1d10
  startingKit: true
  abilityPriority1: dex
  abilityPriority2: wis
  abilityPriority3: con
  abilityPriority4: str
  abilityPriority5: cha
  abilityPriority6: int
  multiclassAll: [dex, wis]
state:
  favoredEnemySpent: { type: integer, default: 0, min: 0 }
  tirelessSpent: { type: integer, default: 0, min: 0 }
  naturesVeilSpent: { type: integer, default: 0, min: 0 }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
    when: self.startingClass
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'martial'" } }
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - { target: proficiencies.armor, op: grant, value: { tag: medium } }
  - { target: proficiencies.armor, op: grant, value: { tag: shield } }
  - { target: proficiencies.saves, op: grant, value: { tag: save.str }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.dex }, when: self.startingClass }
grants:
  - { item: features.ranger.spellcasting, when: self.level >= 1 }
  - { item: features.ranger.favored-enemy, when: self.level >= 1 }
  - { item: features.ranger.weapon-mastery, when: self.level >= 1 }
  - { item: features.ranger.deft-explorer, when: self.level >= 2 }
  - { item: features.ranger.fighting-style, when: self.level >= 2 }
  - { item: features.ranger.ability-score-improvement, when: self.level >= 4 }
  - { item: features.extra-attack, when: self.level >= 5 }
  - { item: features.ranger.roving, when: self.level >= 6 }
  - { item: features.ranger.expertise, when: self.level >= 9 }
  - { item: features.ranger.tireless, when: self.level >= 10 }
  - { item: features.ranger.relentless-hunter, when: self.level >= 13 }
  - { item: features.ranger.natures-veil, when: self.level >= 14 }
  - { item: features.ranger.precise-hunter, when: self.level >= 17 }
  - { item: features.ranger.feral-senses, when: self.level >= 18 }
  - { item: features.ranger.epic-boon, when: self.level >= 19 }
  - { item: features.ranger.foe-slayer, when: self.level >= 20 }
choices:
  - id: skills
    pick: 3
    unique: skills
    from:
      values: &skills
        - skill.animal-handling
        - skill.athletics
        - skill.insight
        - skill.investigation
        - skill.nature
        - skill.perception
        - skill.stealth
        - skill.survival
      where: '!(value in proficiencies.skills) || value in choice.picks'
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: multiclass-skill
    unique: skills
    from:
      values: *skills
      where: '!(value in proficiencies.skills) || value in choice.picks'
    when: '!self.startingClass'
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: subclass
    from: { type: subclass, where: 'item.class == @classes.ranger' }
    when: self.level >= 3
    recommend: '@subclasses.hunter'
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: ranger
        kind: choice
        options:
          - id: a
            changes:
              - { type: addItem, entry: { item: "'armor.studded-leather'", equipped: true } }
              - { type: addItem, entry: { item: "'weapons.scimitar'", equipped: true } }
              - { type: addItem, entry: { item: "'weapons.shortsword'", equipped: true } }
              - { type: addItem, entry: { item: "'weapons.longbow'", equipped: true } }
              - { type: addItem, entry: { item: "'gear.arrows'", quantity: 20 } }
              - { type: addItem, entry: { item: "'gear.quiver'" } }
              - { type: addItem, entry: { item: "'gear.sprig-of-mistletoe'" } }
              - { type: addItem, entry: { item: "'gear.explorers-pack'" } }
              - { type: adjust, field: coins.gp, by: 7 }
          - id: b
            changes:
              - { type: adjust, field: coins.gp, by: 150 }
        recommend: "'a'"
        random: params.random
