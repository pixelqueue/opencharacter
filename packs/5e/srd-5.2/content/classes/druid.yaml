id: classes.druid
type: class
fields:
  hitDie: 1d8
  startingKit: true
  abilityPriority:
    [
      abilities.wis.score,
      abilities.con.score,
      abilities.int.score,
      abilities.dex.score,
      abilities.cha.score,
      abilities.str.score,
    ]
  multiclassAll: [wis]
state:
  wildShapeSpent: { type: integer, default: 0, min: 0 }
  wildResurgenceUsed: { type: boolean, default: false }
  natureMagicianUsed: { type: boolean, default: false }
  naturalRecoveryCast: { type: boolean, default: false }
  naturalRecoverySlots: { type: boolean, default: false }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - { target: proficiencies.armor, op: grant, value: { tag: shield } }
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
    when: self.startingClass
  - target: proficiencies.tools
    op: grant
    value: { item: tools.herbalism-kit }
    when: self.startingClass
  - { target: proficiencies.saves, op: grant, value: { tag: save.int }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.wis }, when: self.startingClass }
grants:
  - { item: features.druid.spellcasting, when: self.level >= 1 }
  - { item: features.druid.druidic, when: self.level >= 1 }
  - { item: features.druid.primal-order, when: self.level >= 1 }
  - { item: features.druid.wild-shape, when: self.level >= 2 }
  - { item: features.druid.wild-companion, when: self.level >= 2 }
  - { item: features.druid.ability-score-improvement, when: self.level >= 4 }
  - { item: features.druid.wild-resurgence, when: self.level >= 5 }
  - { item: features.druid.elemental-fury, when: self.level >= 7 }
  - { item: features.druid.improved-elemental-fury, when: self.level >= 15 }
  - { item: features.druid.beast-spells, when: self.level >= 18 }
  - { item: features.druid.epic-boon, when: self.level >= 19 }
  - { item: features.druid.archdruid, when: self.level >= 20 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      values:
        - skill.animal-handling
        - skill.arcana
        - skill.insight
        - skill.medicine
        - skill.nature
        - skill.perception
        - skill.religion
        - skill.survival
      where: '!(value in proficiencies.skills) || value in choice.picks'
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: subclass
    from: { type: subclass, where: 'item.class == @classes.druid' }
    when: self.level >= 3
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: druid
        kind: choice
        options:
          - id: a
            changes:
              - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
              - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }
              - { type: addItem, entry: { item: "'weapons.sickle'", equipped: true } }
              - {
                  type: addItem,
                  entry:
                    {
                      item: "'weapons.quarterstaff'",
                      equipped: true,
                      templates: ['gear.wooden-staff'],
                    },
                }
              - { type: addItem, entry: { item: "'gear.explorers-pack'" } }
              - { type: addItem, entry: { item: "'tools.herbalism-kit'" } }
              - { type: adjust, field: coins.gp, by: 9 }
          - id: b
            changes:
              - { type: adjust, field: coins.gp, by: 50 }
        recommend: "'a'"
        random: params.random
