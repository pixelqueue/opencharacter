id: classes.bard
type: class
fields:
  hitDie: 1d8
  startingKit: true
  abilityPriority1: cha
  abilityPriority2: dex
  abilityPriority3: int
  abilityPriority4: con
  abilityPriority5: wis
  abilityPriority6: str
  multiclassAll: [cha]
state:
  bardicInspirationSpent: { type: integer, default: 0, min: 0 }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
    when: self.startingClass
  - { target: proficiencies.saves, op: grant, value: { tag: save.dex }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.cha }, when: self.startingClass }
grants:
  - { item: features.bard.bardic-inspiration, when: self.level >= 1 }
  - { item: features.bard.spellcasting, when: self.level >= 1 }
  - { item: features.bard.expertise, when: self.level >= 2 }
  - { item: features.bard.jack-of-all-trades, when: self.level >= 2 }
  - { item: features.bard.ability-score-improvement, when: self.level >= 4 }
  - { item: features.bard.font-of-inspiration, when: self.level >= 5 }
  - { item: features.bard.countercharm, when: self.level >= 7 }
  - { item: features.bard.magical-secrets, when: self.level >= 10 }
  - { item: features.bard.superior-inspiration, when: self.level >= 18 }
  - { item: features.bard.epic-boon, when: self.level >= 19 }
  - { item: features.bard.words-of-creation, when: self.level >= 20 }
choices:
  - id: skills
    pick: 3
    unique: skills
    from:
      values: &skills
        - skill.acrobatics
        - skill.animal-handling
        - skill.arcana
        - skill.athletics
        - skill.deception
        - skill.history
        - skill.insight
        - skill.intimidation
        - skill.investigation
        - skill.medicine
        - skill.nature
        - skill.perception
        - skill.performance
        - skill.persuasion
        - skill.religion
        - skill.sleight-of-hand
        - skill.stealth
        - skill.survival
      where: '!(value in proficiencies.skills) || value in choice.picks'
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: multiclass-skill
    unique: skills
    from:
      values: *skills
      where: '!(value in proficiencies.skills) || value in choice.picks'
    when: '!self.startingClass'
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: instruments
    pick: 3
    from: { type: tool, where: "item.category == 'musical-instrument'" }
    activate: false
    eligible: '!(item.id in proficiencies.tools) || item.id in choice.picks'
    when: self.startingClass
    effects:
      - { target: proficiencies.tools, op: grant, value: { formula: pick.id } }
  - id: multiclass-instrument
    from: { type: tool, where: "item.category == 'musical-instrument'" }
    activate: false
    eligible: '!(item.id in proficiencies.tools) || item.id in choice.picks'
    when: '!self.startingClass'
    effects:
      - { target: proficiencies.tools, op: grant, value: { formula: pick.id } }
  - id: subclass
    from: { type: subclass, where: 'item.class == @classes.bard' }
    when: self.level >= 3
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: bard
        kind: choice
        options:
          - id: a
            changes:
              - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
              - { type: addItem, entry: { item: "'weapons.dagger'", quantity: 2, equipped: true } }
              - { type: addItem, entry: { item: "'gear.entertainers-pack'" } }
              - { type: adjust, field: coins.gp, by: 19 }
          - id: b
            changes:
              - { type: adjust, field: coins.gp, by: 90 }
        recommend: "'a'"
        random: params.random
      - id: bardInstrument
        kind: choice
        when: "steps.bard.picked == 'a'"
        sheet: proposed
        options: { content: { type: tool, where: "item.category == 'musical-instrument'" } }
        recommend: >-
          countList(options, x in proficiencies.tools) > 0
            ? filterList(options, x in proficiencies.tools)[0] : options[0]
        random: params.random && countList(options, x in proficiencies.tools) == 0
        changes:
          - { type: addItem, entry: { item: picked.id } }
