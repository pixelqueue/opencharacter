id: classes.sorcerer
type: class
fields:
  hitDie: 1d6
state:
  innateSorceryUsed: { type: integer, default: 0, min: 0 }
  sorceryPointsSpent: { type: integer, default: 0, min: 0 }
  sorcerousRestorationUsed: { type: boolean, default: false }
  dragonWingsUsed: { type: boolean, default: false }
  dragonCompanionUsed: { type: boolean, default: false }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - { target: proficiencies.saves, op: grant, value: { tag: save.con }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.cha }, when: self.startingClass }
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
    when: self.startingClass
grants:
  - { item: features.sorcerer.spellcasting, when: self.level >= 1 }
  - { item: features.sorcerer.innate-sorcery, when: self.level >= 1 }
  - { item: features.sorcerer.font-of-magic, when: self.level >= 2 }
  - { item: features.sorcerer.metamagic, when: self.level >= 2 }
  - { item: features.sorcerer.sorcerous-restoration, when: self.level >= 5 }
  - { item: features.sorcerer.sorcery-incarnate, when: self.level >= 7 }
  - { item: features.sorcerer.arcane-apotheosis, when: self.level >= 20 }
  - { item: features.sorcerer.ability-score-improvement, when: self.level >= 4 }
  - { item: features.sorcerer.epic-boon, when: self.level >= 19 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      values:
        [
          skill.arcana,
          skill.deception,
          skill.insight,
          skill.intimidation,
          skill.persuasion,
          skill.religion,
        ]
      where: '!(value in proficiencies.skills) || value in choice.picks'
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: subclass
    from: { type: subclass, where: 'item.class == @classes.sorcerer' }
    when: self.level >= 3
