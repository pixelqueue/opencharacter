id: species.goliath
type: species
fields:
  speed: 35
  size: medium
suppress: [size]
effects:
  - { target: creature.type, op: set, value: "'humanoid'" }
grants:
  # The trait takes the lineage from its grant.
  - item: traits.giant-ancestry
    state: { lineage: "size(picksOf('lineage')) > 0 ? picksOf('lineage')[0] : ''" }
  - item: traits.large-form
  - item: traits.powerful-build
choices:
  - id: lineage
    from: { type: lineage, where: 'item.species == @species.goliath' }
