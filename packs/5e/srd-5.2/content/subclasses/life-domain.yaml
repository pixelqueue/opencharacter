id: subclasses.life-domain
type: subclass
fields:
  class: classes.cleric
grants:
  - { item: features.cleric.disciple-of-life, when: self.level >= 3 }
  - { item: features.cleric.life-domain-spells, when: self.level >= 3 }
  - { item: features.cleric.preserve-life, when: self.level >= 3 }
  - { item: features.cleric.blessed-healer, when: self.level >= 6 }
  - { item: features.cleric.supreme-healing, when: self.level >= 17 }
