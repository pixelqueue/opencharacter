id: subclasses.oath-of-devotion
type: subclass
fields:
  class: classes.paladin
grants:
  - { item: features.paladin.oath-of-devotion-spells, when: self.level >= 3 }
  - { item: features.paladin.sacred-weapon, when: self.level >= 3 }
  - { item: features.paladin.aura-of-devotion, when: self.level >= 7 }
  - { item: features.paladin.smite-of-protection, when: self.level >= 15 }
  - { item: features.paladin.holy-nimbus, when: self.level >= 20 }
