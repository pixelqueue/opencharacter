id: subclasses.champion
type: subclass
fields:
  class: classes.fighter
grants:
  - { item: features.fighter.improved-critical, when: self.level >= 3 }
  - { item: features.fighter.remarkable-athlete, when: self.level >= 3 }
  - { item: features.fighter.additional-fighting-style, when: self.level >= 7 }
  - { item: features.fighter.heroic-warrior, when: self.level >= 10 }
  - { item: features.fighter.superior-critical, when: self.level >= 15 }
  - { item: features.fighter.survivor, when: self.level >= 18 }
