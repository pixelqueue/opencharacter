id: subclasses.hunter
type: subclass
fields:
  class: classes.ranger
grants:
  - { item: features.ranger.hunters-lore, when: self.level >= 3 }
  - { item: features.ranger.hunters-prey, when: self.level >= 3 }
  - { item: features.ranger.defensive-tactics, when: self.level >= 7 }
  - { item: features.ranger.superior-hunters-prey, when: self.level >= 11 }
  - { item: features.ranger.superior-hunters-defense, when: self.level >= 15 }
