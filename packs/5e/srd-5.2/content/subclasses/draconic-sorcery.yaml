id: subclasses.draconic-sorcery
type: subclass
fields:
  class: classes.sorcerer
grants:
  - { item: features.sorcerer.draconic-resilience, when: self.level >= 3 }
  - { item: features.sorcerer.draconic-spells, when: self.level >= 3 }
  - { item: features.sorcerer.elemental-affinity, when: self.level >= 6 }
  - { item: features.sorcerer.dragon-wings, when: self.level >= 14 }
  - { item: features.sorcerer.dragon-companion, when: self.level >= 18 }
