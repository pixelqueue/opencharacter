id: subclasses.fiend-patron
type: subclass
fields:
  class: classes.warlock
grants:
  - { item: features.warlock.dark-ones-blessing, when: self.level >= 3 }
  - { item: features.warlock.fiend-spells, when: self.level >= 3 }
  - { item: features.warlock.dark-ones-own-luck, when: self.level >= 6 }
  - { item: features.warlock.fiendish-resilience, when: self.level >= 10 }
  - { item: features.warlock.hurl-through-hell, when: self.level >= 14 }
