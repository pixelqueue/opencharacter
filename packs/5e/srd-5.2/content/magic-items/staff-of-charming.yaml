id: magic-items.staff-of-charming
type: template
tags:
  [
    magic,
    staff,
    attunement.bard,
    attunement.cleric,
    attunement.druid,
    attunement.sorcerer,
    attunement.warlock,
    attunement.wizard,
  ]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields: { rarity: rare, requiresAttunement: true, maxCharges: 10, recharge: 1d8 + 2 }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
  usedToday: { type: set, of: string, default: [] }
grants:
  - { item: spells.charm-person, when: self.equipped && self.attuned }
  - { item: spells.command, when: self.equipped && self.attuned }
  - { item: spells.comprehend-languages, when: self.equipped && self.attuned }
effects:
  - target: { choices: [failed-save] }
    op: option
    when: "self.equipped && self.attuned && !('resist' in self.usedToday)"
    value:
      id: resist-enchantment
      flags: { addBonus: 'has(params.dc) ? max(0, params.dc - flags.total) : 0' }
      changes:
        - { type: setState, entry: self, key: usedToday, value: "self.usedToday + ['resist']" }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.attuned && action.item.id in [@spells.charm-person, @spells.command, @spells.comprehend-languages]
        && self.charges >= [1, 1, 1][indexOf([@spells.charm-person, @spells.command, @spells.comprehend-languages], action.item.id)]
    value:
      id: charges
      flags:
        slot: '[1, 1, 1][indexOf([@spells.charm-person, @spells.command, @spells.comprehend-languages], action.item.id)]'
      changes:
        - type: adjustState
          entry: self
          key: charges
          by: '-[1, 1, 1][indexOf([@spells.charm-person, @spells.command, @spells.comprehend-languages], action.item.id)]'
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
