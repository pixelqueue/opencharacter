id: magic-items.boots-of-speed
type: magicItem
fields:
  category: wondrous-item
  rarity: rare
  requiresAttunement: true
# `active` while the heels are clicked; `minutesUsed` counts toward the 10 minutes a Long Rest restores.
state:
  active: { type: boolean, default: false }
  minutesUsed: { type: integer, min: 0, max: 10, default: 0 }
effects:
  - target: combat.speed
    op: multiply
    value: 2
    when: self.equipped && self.attuned && self.active && self.minutesUsed < 10
  - target: { steps: [rest.long] }
    op: changes
    when: self.minutesUsed > 0
    value:
      changes:
        - { type: setState, entry: self, key: minutesUsed, value: 0 }
