id: magic-items.dwarven-thrower
type: template
tags: [magic, thrown, property.range]
appliesTo: { type: weapon, where: 'item.id in [@weapons.warhammer]' }
fields:
  {
    rarity: very-rare,
    requiresAttunement: true,
    attackBonus: 3,
    damageBonus: 3,
    normalRange: 20,
    longRange: 60,
  }
prerequisites:
  - id: attunement
    when: >-
      !self.attuned || creature.species == @species.dwarf
        || countCopies(copy.item == @magic-items.belt-of-dwarvenkind && has(copy.state.attuned)
          && copy.state.attuned) > 0
effects:
  - target: { rolls: [damage.weapon], from: self }
    op: add
    value: >-
      has(participants.target) && size(participants.target) > 0
        && has(participants.target[0].creature.type)
        && participants.target[0].creature.type == 'giant' ? 2d8 : 1d8
    tags: [damage.force]
    when: self.attuned && has(params.thrown) && params.thrown
