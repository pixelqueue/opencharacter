id: magic-items.sword-of-wounding
type: template
tags: [magic]
appliesTo:
  {
    type: weapon,
    where: 'item.id in [@weapons.glaive, @weapons.greatsword, @weapons.longsword, @weapons.rapier, @weapons.scimitar, @weapons.shortsword]',
  }
fields: { rarity: rare, requiresAttunement: true }
effects:
  - target: { rolls: [damage.weapon], from: self }
    op: add
    value: 2d6
    tags: [damage.necrotic]
    when: self.attuned
actions:
  - id: wound
    tags: [magic-item]
    available: self.attuned
    results: [used, no-charges, used-today]
    participants:
      target: {}
    steps:
      - id: power
        kind: action
        use: item-power
        params: { save: "'con'", dc: 15 }
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.power.result
