id: magic-items.necklace-of-fireballs
type: magicItem
fields:
  category: wondrous-item
  rarity: rare
  maxCharges: 9
  saveDc: 15
  spells: [spells.fireball]
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.fireball, when: self.equipped }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && action.item.id == @spells.fireball
        && flags.slot >= 3 && flags.slot <= 7 && self.charges >= flags.slot - 2
    value:
      id: charges
      changes:
        - { type: adjustState, entry: self, key: charges, by: -(flags.slot - 2) }
actions:
  - use: use-charges
