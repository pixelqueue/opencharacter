id: magic-items.staff-of-fire
type: template
tags: [magic, staff]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields:
  {
    attunementClasses: [classes.druid, classes.sorcerer, classes.warlock, classes.wizard],
    rarity: very-rare,
    requiresAttunement: true,
    maxCharges: 10,
    recharge: 1d6 + 4,
  }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.burning-hands, when: self.equipped && self.attuned }
  - { item: spells.fireball, when: self.equipped && self.attuned }
  - { item: spells.wall-of-fire, when: self.equipped && self.attuned }
effects:
  - target: damage.resistances
    op: grant
    value: { tag: damage.fire }
    when: self.equipped && self.attuned
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.attuned && action.item.id in [@spells.burning-hands, @spells.fireball, @spells.wall-of-fire]
        && self.charges >= [1, 3, 4][indexOf([@spells.burning-hands, @spells.fireball, @spells.wall-of-fire], action.item.id)]
    value:
      id: charges
      flags:
        slot: '[1, 3, 4][indexOf([@spells.burning-hands, @spells.fireball, @spells.wall-of-fire], action.item.id)]'
      changes:
        - type: adjustState
          entry: self
          key: charges
          by: '-[1, 3, 4][indexOf([@spells.burning-hands, @spells.fireball, @spells.wall-of-fire], action.item.id)]'
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
