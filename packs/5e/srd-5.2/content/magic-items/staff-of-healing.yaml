id: magic-items.staff-of-healing
type: template
tags: [magic, staff, attunement.bard, attunement.cleric, attunement.druid]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields: { rarity: rare, requiresAttunement: true, maxCharges: 10, recharge: 1d6 + 4 }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.cure-wounds, when: self.equipped && self.attuned }
  - { item: spells.lesser-restoration, when: self.equipped && self.attuned }
  - { item: spells.mass-cure-wounds, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.attuned && action.item.id == @spells.cure-wounds
        && flags.slot >= 1 && flags.slot <= 4 && self.charges >= flags.slot
    value:
      id: cure-wounds
      changes:
        - { type: adjustState, entry: self, key: charges, by: -flags.slot }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.attuned && action.item.id in [@spells.lesser-restoration, @spells.mass-cure-wounds]
        && self.charges >= [2, 5][indexOf([@spells.lesser-restoration, @spells.mass-cure-wounds], action.item.id)]
    value:
      id: charges
      flags:
        slot: '[2, 5][indexOf([@spells.lesser-restoration, @spells.mass-cure-wounds], action.item.id)]'
      changes:
        - type: adjustState
          entry: self
          key: charges
          by: '-[2, 5][indexOf([@spells.lesser-restoration, @spells.mass-cure-wounds], action.item.id)]'
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
