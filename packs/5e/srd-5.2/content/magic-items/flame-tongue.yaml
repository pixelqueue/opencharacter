id: magic-items.flame-tongue
type: template
tags: [magic]
appliesTo: { type: weapon, where: "item.range == 'melee'" }
fields: { rarity: rare, requiresAttunement: true }
state:
  ignited: { type: boolean, default: false }
effects:
  - target: { rolls: [damage.weapon], from: self }
    op: add
    value: 2d6
    tags: [damage.fire]
    when: self.attuned && self.ignited
