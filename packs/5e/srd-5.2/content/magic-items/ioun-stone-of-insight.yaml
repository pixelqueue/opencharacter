id: magic-items.ioun-stone-of-insight
type: magicItem
fields:
  category: wondrous-item
  rarity: very-rare
  requiresAttunement: true
# An increase to a maximum of 20 adds only what fits under 20; an item that sets the score still
# applies after it.
effects:
  - target: abilities.wis.score
    op: add
    value: 'min(2, max(0, 20 - abilities.wis.base))'
    when: self.equipped && self.attuned
