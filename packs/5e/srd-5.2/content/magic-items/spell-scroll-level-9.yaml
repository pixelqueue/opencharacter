id: magic-items.spell-scroll-level-9
type: magicItem
fields:
  category: scroll
  rarity: legendary
  spellLevel: 9
  saveDc: 19
  spellAttackBonus: 11
choices:
  - id: spell
    from: { type: spell, where: item.level == 9 }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.quantity > 0
        && countList(action.item.classes, x in classes.held) > 0
    value:
      id: read
      changes:
        - { type: adjustQuantity, entry: self, by: -1 }
