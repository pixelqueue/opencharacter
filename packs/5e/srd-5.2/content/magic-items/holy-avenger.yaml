id: magic-items.holy-avenger
type: template
tags: [magic]
appliesTo: { type: weapon }
fields:
  {
    attunementClasses: [classes.paladin],
    rarity: legendary,
    requiresAttunement: true,
    attackBonus: 3,
    damageBonus: 3,
  }
effects:
  - target: { rolls: [damage.weapon], from: self }
    op: add
    value: 2d10
    tags: [damage.radiant]
    when: >-
      self.attuned && has(participants.target) && size(participants.target) > 0
        && has(participants.target[0].creature.type)
        && participants.target[0].creature.type in ['fiend', 'undead']
  - { target: items.magicSaveAdvantage, op: set, value: true, when: self.equipped && self.attuned }
