id: magic-items.potion-of-gaseous-form
type: magicItem
fields:
  category: potion
  rarity: rare
  lasting: true
  spells: [spells.gaseous-form]
effects:
  - {
      target: combat.speed,
      op: atMost,
      value: 0,
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - {
      target: combat.climbSpeed,
      op: atMost,
      value: 0,
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - {
      target: combat.swimSpeed,
      op: atMost,
      value: 0,
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - {
      target: combat.burrowSpeed,
      op: atMost,
      value: 0,
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - {
      target: combat.flySpeed,
      op: set,
      value: 10,
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - {
      target: combat.hover,
      op: set,
      value: true,
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - {
      target: damage.resistances,
      op: grant,
      value: { tag: damage.bludgeoning },
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - {
      target: damage.resistances,
      op: grant,
      value: { tag: damage.piercing },
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - {
      target: damage.resistances,
      op: grant,
      value: { tag: damage.slashing },
      scope: applied,
      duration: { amount: 1, unit: hour },
    }
  - target: { rolls: [save.str, save.dex, save.con] }
    op: rollModifier
    value: { kind: advantage }
    scope: applied
    duration: { amount: 1, unit: hour }
immuneTo:
  - { id: prone, items: [conditions.prone], scope: applied }
actions:
  - use: drink-potion
