id: magic-items.ring-of-warmth
type: magicItem
fields:
  category: ring
  rarity: uncommon
  requiresAttunement: true
effects:
  # Reduces the Cold damage by 2d8, never below 0.
  - target: { incoming: { fields: [hp.current], tags: [damage.cold] } }
    op: add
    value: 2d8
    when: self.equipped && self.attuned && incoming.amount < 0
  - target: { incoming: { fields: [hp.current], tags: [damage.cold] } }
    op: atMost
    value: 0
    when: self.equipped && self.attuned && incoming.amount < 0
