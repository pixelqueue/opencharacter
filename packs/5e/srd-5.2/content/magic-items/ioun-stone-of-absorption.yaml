id: magic-items.ioun-stone-of-absorption
type: magicItem
fields:
  category: wondrous-item
  rarity: very-rare
  requiresAttunement: true
# Spell levels canceled so far: at 20 the stone burns out.
state:
  absorbedLevels: { type: integer, min: 0, max: 20, default: 0 }
actions:
  - id: absorb-spell
    tags: [magic-item]
    available: self.equipped && self.attuned && self.absorbedLevels < 20
    params:
      level: { type: integer, default: 1 }
    results: [absorbed]
    steps:
      - id: absorb
        kind: changes
        changes:
          - {
              type: adjustState,
              entry: self,
              key: absorbedLevels,
              by: 'min(params.level, 20 - self.absorbedLevels)',
            }
      - id: result
        kind: outcome
        result: "'absorbed'"
        data:
          left: 20 - self.absorbedLevels - params.level
