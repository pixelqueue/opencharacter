id: magic-items.spell-scroll-level-3
type: magicItem
fields:
  category: scroll
  rarity: uncommon
  spellLevel: 3
  saveDc: 15
  spellAttackBonus: 7
choices:
  - id: spell
    from: { type: spell, where: item.level == 3 }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.quantity > 0
        && countList(action.item.classes, x in classes.held) > 0
    value:
      id: read
      changes:
        - { type: adjustQuantity, entry: self, by: -1 }
