id: magic-items.rod-of-lordly-might
type: template
tags: [magic]
appliesTo: { type: weapon, where: 'item.id == @weapons.mace' }
fields: { rarity: legendary, requiresAttunement: true, attackBonus: 3, damageBonus: 3 }
state:
  button: { type: integer, min: 0, max: 6, default: 0 }
  usedToday: { type: set, of: string, default: [] }
effectsWhen: self.attuned
effects:
  - target: { rolls: [damage.weapon], from: self }
    op: add
    value: 2d6
    tags: [damage.fire]
    when: self.button == 1
  - target: { rolls: [skill.athletics] }
    op: add
    value: 10
    when: self.equipped && self.button == 5
  # Drain Life and Paralyze: `drainLife` or `paralyze` on the rod's own attack, run on a melee hit
  # through item-power (a DC 17 Constitution save, once per dawn each). Drain Life heals half the
  # necrotic damage rolled.
  - target: { actions: [attack], from: self }
    op: params
    when: "!('drain' in self.usedToday)"
    value:
      drainLife: { type: boolean, default: false }
  - target: { actions: [attack], from: self }
    op: params
    when: "!('paralyze' in self.usedToday)"
    value:
      paralyze: { type: boolean, default: false }
  - target: { steps: [attack-hit], from: self }
    op: action
    when: params.drainLife && flags.range == 'melee'
    value:
      id: drain-life
      use: item-power
      params:
        daily: "'drain'"
        dice: 4d6
        damageType: "'necrotic'"
        save: "'con'"
        dc: 17
        half: false
      participants: { target: participants.target }
      to: self
      changes:
        - type: adjust
          when: run.data.failed
          field: hp.current
          by: floor(max(0, run.data.damage) / 2)
          tags: [healing]
  - target: { steps: [attack-hit], from: self }
    op: action
    when: params.paralyze && flags.range == 'melee'
    value:
      id: paralyze
      use: item-power
      params: { daily: "'paralyze'", save: "'con'", dc: 17, condition: "'conditions.paralyzed'" }
      participants: { target: participants.target }
actions:
  - id: terrify
    tags: [magic-item]
    available: "self.equipped && self.attuned && !('terrify' in self.usedToday)"
    results: [used, no-charges, used-today]
    participants:
      target: {}
    steps:
      - id: power
        kind: action
        use: item-power
        params: { daily: "'terrify'", save: "'wis'", dc: 17, condition: "'conditions.frightened'" }
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.power.result
