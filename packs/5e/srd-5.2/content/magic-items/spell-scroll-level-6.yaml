id: magic-items.spell-scroll-level-6
type: magicItem
fields:
  category: scroll
  rarity: very-rare
  spellLevel: 6
  saveDc: 17
  spellAttackBonus: 9
choices:
  - id: spell
    from: { type: spell, where: item.level == 6 }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.quantity > 0
        && countList(action.item.classes, x in classes.held) > 0
    value:
      id: read
      changes:
        - { type: adjustQuantity, entry: self, by: -1 }
