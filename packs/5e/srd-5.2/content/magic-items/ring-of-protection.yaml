id: magic-items.ring-of-protection
type: magicItem
fields:
  category: ring
  rarity: rare
  requiresAttunement: true
effects:
  - { target: combat.ac, op: add, value: 1, when: self.equipped && self.attuned }
  - target: { fields: { where: "'save' in item.tags" } }
    op: add
    value: 1
    when: self.equipped && self.attuned
  - { target: { rolls: [save.death] }, op: add, value: 1, when: self.equipped && self.attuned }
