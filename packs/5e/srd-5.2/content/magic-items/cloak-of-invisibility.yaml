id: magic-items.cloak-of-invisibility
type: magicItem
fields:
  category: wondrous-item
  rarity: legendary
  requiresAttunement: true
  maxCharges: 3
  recharge: 1d3
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
actions:
  # Pulling the hood up: Invisible for 1 hour, until the hood is down or the cloak is off.
  - id: hood
    tags: [magic-item]
    available: self.equipped && self.attuned && self.charges > 0
    results: [invisible]
    steps:
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: charges, by: -1 }
          - type: applyEffect
            source: "'conditions.invisible'"
            state: { magical: true }
      - id: result
        kind: outcome
        result: "'invisible'"
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
