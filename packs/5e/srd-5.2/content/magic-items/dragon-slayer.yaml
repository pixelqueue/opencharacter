id: magic-items.dragon-slayer
type: template
tags: [magic]
appliesTo: { type: weapon }
fields: { rarity: rare, attackBonus: 1, damageBonus: 1 }
effects:
  - target: { rolls: [damage.weapon], from: self }
    op: add
    value: 3d6
    tags: [{ formula: "'damage.' + item.damageType" }]
    when: >-
      has(participants.target) && size(participants.target) > 0
        && has(participants.target[0].creature.type)
        && participants.target[0].creature.type == 'dragon'
