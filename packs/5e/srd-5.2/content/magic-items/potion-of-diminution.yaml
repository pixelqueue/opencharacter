id: magic-items.potion-of-diminution
type: magicItem
fields:
  category: potion
  rarity: rare
  lasting: true
  spells: [spells.enlarge-reduce]
effects:
  - { target: carrying.sizeSteps, op: add, value: -1, scope: applied }
  - target: { rolls: [check.str, save.str] }
    op: rollModifier
    value: { kind: disadvantage }
    scope: applied
  - target: { rolls: [damage.weapon] }
    op: add
    value: -1d4
    tags:
      [
        {
          formula: "has(roll.item.damageType) ? 'damage.' + roll.item.damageType : 'damage.bludgeoning'",
        },
      ]
    scope: applied
  - { target: { rolls: [damage.weapon] }, op: atLeast, value: 1, scope: applied }
actions:
  - use: drink-potion
