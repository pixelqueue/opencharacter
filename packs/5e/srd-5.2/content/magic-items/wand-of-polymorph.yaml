id: magic-items.wand-of-polymorph
type: magicItem
tags: [attunement.spellcaster]
fields:
  category: wand
  rarity: very-rare
  requiresAttunement: true
  maxCharges: 7
  recharge: 1d6 + 1
  saveDc: 15
  spells: [spells.polymorph]
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.polymorph, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && true && action.item.id == @spells.polymorph
        && self.charges >= 1
    value:
      id: charges
      flags: { slot: 4 }
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
