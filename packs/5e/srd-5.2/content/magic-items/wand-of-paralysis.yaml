id: magic-items.wand-of-paralysis
type: magicItem
tags: [attunement.spellcaster]
fields:
  category: wand
  rarity: rare
  requiresAttunement: true
  maxCharges: 7
  recharge: 1d6 + 1
  saveDc: 15
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
  - id: paralysis
    tags: [magic-item]
    available: 'self.equipped && self.attuned && self.charges > 0'
    results: [used, no-charges, used-today]
    participants:
      target: {}
    steps:
      - id: power
        kind: action
        use: item-power
        params: { charges: 1, save: "'con'", dc: 15, condition: "'conditions.paralyzed'" }
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.power.result
