id: magic-items.scarab-of-protection
type: magicItem
fields:
  category: wondrous-item
  rarity: legendary
  requiresAttunement: true
  maxCharges: 12
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
effects:
  - { target: combat.ac, op: add, value: 1 }
  - { target: items.spellSaveAdvantage, op: set, value: true }
  - target: { choices: [failed-save] }
    op: option
    when: self.charges > 0 && has(params.dc)
    value:
      id: preservation
      flags: { addBonus: 'max(0, params.dc - flags.total)' }
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
actions:
  - use: use-charges
