id: magic-items.staff-of-frost
type: template
tags: [magic, staff]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields:
  {
    attunementClasses: [classes.druid, classes.sorcerer, classes.warlock, classes.wizard],
    rarity: very-rare,
    requiresAttunement: true,
    maxCharges: 10,
    recharge: 1d6 + 4,
  }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.cone-of-cold, when: self.equipped && self.attuned }
  - { item: spells.fog-cloud, when: self.equipped && self.attuned }
  - { item: spells.ice-storm, when: self.equipped && self.attuned }
  - { item: spells.wall-of-ice, when: self.equipped && self.attuned }
effects:
  - target: damage.resistances
    op: grant
    value: { tag: damage.cold }
    when: self.equipped && self.attuned
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.attuned && action.item.id in [@spells.cone-of-cold, @spells.fog-cloud, @spells.ice-storm, @spells.wall-of-ice]
        && self.charges >= [5, 1, 4, 4][indexOf([@spells.cone-of-cold, @spells.fog-cloud, @spells.ice-storm, @spells.wall-of-ice], action.item.id)]
    value:
      id: charges
      flags:
        slot: '[5, 1, 4, 6][indexOf([@spells.cone-of-cold, @spells.fog-cloud, @spells.ice-storm, @spells.wall-of-ice], action.item.id)]'
      changes:
        - type: adjustState
          entry: self
          key: charges
          by: '-[5, 1, 4, 4][indexOf([@spells.cone-of-cold, @spells.fog-cloud, @spells.ice-storm, @spells.wall-of-ice], action.item.id)]'
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
