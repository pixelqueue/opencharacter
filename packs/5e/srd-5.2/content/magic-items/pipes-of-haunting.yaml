id: magic-items.pipes-of-haunting
type: magicItem
fields:
  category: wondrous-item
  rarity: uncommon
  maxCharges: 3
  recharge: 1d3
  saveDc: 15
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
  - id: haunting-tune
    tags: [magic-item]
    available: 'self.charges > 0'
    results: [used, no-charges, used-today]
    participants:
      target: {}
    steps:
      - id: power
        kind: action
        use: item-power
        params: { charges: 1, save: "'wis'", dc: 15, condition: "'conditions.frightened'" }
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.power.result
