id: magic-items.helm-of-teleportation
type: magicItem
fields:
  category: wondrous-item
  rarity: rare
  requiresAttunement: true
  maxCharges: 3
  recharge: 1d3
  spells: [spells.teleport]
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.teleport, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id
        && ((action.item.id == @spells.teleport && flags.slot == 7 && self.charges >= 1))
    value:
      id: charges
      changes:
        - type: adjustState
          entry: self
          key: charges
          by: >-
            -1
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
