id: magic-items.staff-of-swarming-insects
type: template
tags:
  [
    magic,
    staff,
    attunement.bard,
    attunement.cleric,
    attunement.druid,
    attunement.sorcerer,
    attunement.warlock,
    attunement.wizard,
  ]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields: { rarity: rare, requiresAttunement: true, maxCharges: 10, recharge: 1d6 + 4 }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.giant-insect, when: self.equipped && self.attuned }
  - { item: spells.insect-plague, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && self.attuned && action.item.id in [@spells.giant-insect, @spells.insect-plague]
        && self.charges >= [4, 5][indexOf([@spells.giant-insect, @spells.insect-plague], action.item.id)]
    value:
      id: charges
      flags:
        slot: '[4, 5][indexOf([@spells.giant-insect, @spells.insect-plague], action.item.id)]'
      changes:
        - type: adjustState
          entry: self
          key: charges
          by: '-[4, 5][indexOf([@spells.giant-insect, @spells.insect-plague], action.item.id)]'
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
  - id: insect-cloud
    tags: [magic-item]
    available: self.equipped && self.attuned && self.charges > 0
    results: [used, no-charges, used-today]
    steps:
      - id: power
        kind: action
        use: item-power
        params: { charges: 1 }
      - id: result
        kind: outcome
        result: steps.power.result
