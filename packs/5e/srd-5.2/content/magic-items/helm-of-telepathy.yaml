id: magic-items.helm-of-telepathy
type: magicItem
fields:
  category: wondrous-item
  rarity: uncommon
  requiresAttunement: true
  spells: [spells.detect-thoughts, spells.suggestion]
  saveDc: 13
state:
  usedToday: { type: set, of: string, default: [] }
grants:
  - { item: spells.detect-thoughts, when: self.equipped && self.attuned }
  - { item: spells.suggestion, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && action.item.id == @spells.detect-thoughts && flags.slot == 2
        && !('detect-thoughts' in self.usedToday)
    value:
      id: daily
      changes:
        - {
            type: setState,
            entry: self,
            key: usedToday,
            value: "self.usedToday + ['detect-thoughts']",
          }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && action.item.id == @spells.suggestion && flags.slot == 2
        && !('suggestion' in self.usedToday)
    value:
      id: daily
      changes:
        - { type: setState, entry: self, key: usedToday, value: "self.usedToday + ['suggestion']" }
