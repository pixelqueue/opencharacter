id: magic-items.mace-of-disruption
type: template
tags: [magic]
appliesTo: { type: weapon, where: 'item.id == @weapons.mace' }
fields: { rarity: rare, requiresAttunement: true }
effects:
  - target: { rolls: [damage.weapon], from: self }
    op: add
    value: 2d6
    tags: [damage.radiant]
    when: >-
      self.attuned && has(participants.target) && size(participants.target) > 0 && has(participants.target[0].creature.type)
        && participants.target[0].creature.type in ['fiend', 'undead']
