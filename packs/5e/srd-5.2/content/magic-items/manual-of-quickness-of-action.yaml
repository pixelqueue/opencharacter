id: magic-items.manual-of-quickness-of-action
type: magicItem
fields:
  category: wondrous-item
  rarity: very-rare
state:
  read: { type: boolean, default: false }
effects:
  - target: abilities.dex.score
    op: add
    value: min(2, max(0, 30 - abilities.dex.base))
    when: self.read
actions:
  - use: study-book
