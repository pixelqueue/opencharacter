id: magic-items.ring-of-elemental-command
type: magicItem
fields:
  category: ring
  rarity: legendary
  requiresAttunement: true
  maxCharges: 5
  recharge: 1d4 + 1
  saveDc: 18
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
choices:
  - id: plane
    from:
      options:
        - id: air
          effects:
            - {
                target: damage.resistances,
                op: grant,
                value: { tag: damage.lightning },
                when: self.equipped && self.attuned,
              }
            - {
                target: combat.flySpeed,
                op: atLeast,
                value: combat.speed,
                when: self.equipped && self.attuned,
              }
            - { target: combat.hover, op: set, value: true, when: self.equipped && self.attuned }
          grants:
            - { item: spells.chain-lightning, when: self.equipped && self.attuned }
            - { item: spells.feather-fall, when: self.equipped && self.attuned }
            - { item: spells.gust-of-wind, when: self.equipped && self.attuned }
            - { item: spells.wind-wall, when: self.equipped && self.attuned }
        - id: earth
          effects:
            - {
                target: damage.resistances,
                op: grant,
                value: { tag: damage.acid },
                when: self.equipped && self.attuned,
              }
          grants:
            - { item: spells.earthquake, when: self.equipped && self.attuned }
            - { item: spells.stone-shape, when: self.equipped && self.attuned }
            - { item: spells.stoneskin, when: self.equipped && self.attuned }
            - { item: spells.wall-of-stone, when: self.equipped && self.attuned }
        - id: fire
          effects:
            - {
                target: damage.immunities,
                op: grant,
                value: { tag: damage.fire },
                when: self.equipped && self.attuned,
              }
          grants:
            - { item: spells.burning-hands, when: self.equipped && self.attuned }
            - { item: spells.fireball, when: self.equipped && self.attuned }
            - { item: spells.fire-storm, when: self.equipped && self.attuned }
            - { item: spells.wall-of-fire, when: self.equipped && self.attuned }
        - id: water
          effects:
            - {
                target: combat.swimSpeed,
                op: atLeast,
                value: 60,
                when: self.equipped && self.attuned,
              }
          grants:
            - { item: spells.create-or-destroy-water, when: self.equipped && self.attuned }
            - { item: spells.ice-storm, when: self.equipped && self.attuned }
            - { item: spells.tsunami, when: self.equipped && self.attuned }
            - { item: spells.wall-of-ice, when: self.equipped && self.attuned }
            - { item: spells.water-walk, when: self.equipped && self.attuned }
effects:
  - target: { rolls: [attack] }
    op: rollModifier
    value: { kind: advantage }
    when: >-
      self.equipped && self.attuned && has(participants.target) && size(participants.target) > 0
        && has(participants.target[0].creature.type)
        && participants.target[0].creature.type == 'elemental'
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && true && action.item.id in [@spells.chain-lightning, @spells.feather-fall, @spells.gust-of-wind, @spells.wind-wall, @spells.earthquake, @spells.stone-shape, @spells.stoneskin, @spells.wall-of-stone, @spells.burning-hands, @spells.fireball, @spells.fire-storm, @spells.wall-of-fire, @spells.create-or-destroy-water, @spells.ice-storm, @spells.tsunami, @spells.wall-of-ice, @spells.water-walk]
        && self.charges >= [3, 0, 2, 1, 5, 2, 3, 3, 1, 2, 4, 3, 1, 2, 5, 3, 2][indexOf([@spells.chain-lightning, @spells.feather-fall, @spells.gust-of-wind, @spells.wind-wall, @spells.earthquake, @spells.stone-shape, @spells.stoneskin, @spells.wall-of-stone, @spells.burning-hands, @spells.fireball, @spells.fire-storm, @spells.wall-of-fire, @spells.create-or-destroy-water, @spells.ice-storm, @spells.tsunami, @spells.wall-of-ice, @spells.water-walk], action.item.id)]
    value:
      id: charges
      flags:
        slot: '[6, 1, 2, 3, 8, 4, 4, 5, 1, 3, 7, 4, 1, 4, 8, 6, 3][indexOf([@spells.chain-lightning, @spells.feather-fall, @spells.gust-of-wind, @spells.wind-wall, @spells.earthquake, @spells.stone-shape, @spells.stoneskin, @spells.wall-of-stone, @spells.burning-hands, @spells.fireball, @spells.fire-storm, @spells.wall-of-fire, @spells.create-or-destroy-water, @spells.ice-storm, @spells.tsunami, @spells.wall-of-ice, @spells.water-walk], action.item.id)]'
      changes:
        - type: adjustState
          entry: self
          key: charges
          by: '-[3, 0, 2, 1, 5, 2, 3, 3, 1, 2, 4, 3, 1, 2, 5, 3, 2][indexOf([@spells.chain-lightning, @spells.feather-fall, @spells.gust-of-wind, @spells.wind-wall, @spells.earthquake, @spells.stone-shape, @spells.stoneskin, @spells.wall-of-stone, @spells.burning-hands, @spells.fireball, @spells.fire-storm, @spells.wall-of-fire, @spells.create-or-destroy-water, @spells.ice-storm, @spells.tsunami, @spells.wall-of-ice, @spells.water-walk], action.item.id)]'
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
  - id: elemental-compulsion
    tags: [magic-item]
    available: 'self.equipped && self.attuned'
    results: [used, no-charges, used-today]
    participants:
      target: {}
    steps:
      - id: power
        kind: action
        use: item-power
        params: { save: "'wis'", dc: 18, condition: "'conditions.charmed'" }
        participants: { target: participants.target }
      - id: result
        kind: outcome
        result: steps.power.result
