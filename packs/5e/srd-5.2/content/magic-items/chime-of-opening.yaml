id: magic-items.chime-of-opening
type: magicItem
fields:
  category: wondrous-item
  rarity: rare
  weight: 1
  maxCharges: 10
  spells: [spells.knock]
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.knock, when: self.equipped }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id
        && ((action.item.id == @spells.knock && flags.slot == 2 && self.charges >= 1))
    value:
      id: charges
      changes:
        - type: adjustState
          entry: self
          key: charges
          by: >-
            -1
actions:
  - use: use-charges
