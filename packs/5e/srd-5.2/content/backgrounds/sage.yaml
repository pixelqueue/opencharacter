id: backgrounds.sage
type: background
fields:
  startingKit: true
effects:
  - { target: proficiencies.skills, op: grant, value: { tag: skill.arcana } }
  - { target: proficiencies.skills, op: grant, value: { tag: skill.history } }
  - { target: proficiencies.tools, op: grant, value: { item: tools.calligraphers-supplies } }
grants:
  - item: feats.magic-initiate
    choices: { list: [{ option: wizard }] }
  - item: languages.common
choices:
  - id: ability-increase
    recommend: "'two-and-one'"
    from:
      options:
        - id: two-and-one
          choices:
            - id: plus-two
              unique: sage-increase
              uniqueScope: owner
              from: { values: [con, int, wis] }
              recommend: "sortList(['con', 'int', 'wis'], -fieldOf('abilities.{ability}.base', x))[0]"
              effects:
                - target:
                    {
                      fields:
                        { where: "item.id == '5e-srd-5.2:abilities.' + pick.value + '.base'" },
                    }
                  op: add
                  value: 2
            - id: plus-one
              unique: sage-increase
              uniqueScope: owner
              from: { values: [con, int, wis] }
              recommend: >-
                sortList(filterList(['con', 'int', 'wis'], !(x in picksOf('plus-two'))),
                  -fieldOf('abilities.{ability}.base', x))[0]
              effects:
                - target:
                    {
                      fields:
                        { where: "item.id == '5e-srd-5.2:abilities.' + pick.value + '.base'" },
                    }
                  op: add
                  value: 1
        - id: one-each
          effects:
            - { target: abilities.con.base, op: add, value: 1 }
            - { target: abilities.int.base, op: add, value: 1 }
            - { target: abilities.wis.base, op: add, value: 1 }
  - id: languages
    pick: 2
    unique: languages
    from: { type: language, where: '!item.rare' }
    eligible: '!(item.id in proficiencies.languages) || item.id in choice.picks'
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: sage
        kind: choice
        options:
          - id: a
            changes:
              - { type: addItem, entry: { item: "'weapons.quarterstaff'", equipped: true } }
              - { type: addItem, entry: { item: "'tools.calligraphers-supplies'" } }
              - { type: addItem, entry: { item: "'gear.book'" } }
              - { type: addItem, entry: { item: "'gear.parchment'", quantity: 8 } }
              - { type: addItem, entry: { item: "'gear.robe'" } }
              - { type: adjust, field: coins.gp, by: 8 }
          - id: b
            changes:
              - { type: adjust, field: coins.gp, by: 50 }
        recommend: "'a'"
        random: params.random
