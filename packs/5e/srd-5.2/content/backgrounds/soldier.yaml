id: backgrounds.soldier
type: background
fields:
  startingKit: true
effects:
  - { target: proficiencies.skills, op: grant, value: { tag: skill.athletics } }
  - { target: proficiencies.skills, op: grant, value: { tag: skill.intimidation } }
grants:
  - item: feats.savage-attacker
  - item: languages.common
choices:
  - id: ability-increase
    recommend: "'two-and-one'"
    from:
      options:
        - id: two-and-one
          choices:
            - id: plus-two
              unique: soldier-increase
              uniqueScope: owner
              from: { values: [str, dex, con] }
              recommend: "sortList(['str', 'dex', 'con'], -fieldOf('abilities.{ability}.base', x))[0]"
              effects:
                - target:
                    {
                      fields:
                        { where: "item.id == '5e-srd-5.2:abilities.' + pick.value + '.base'" },
                    }
                  op: add
                  value: 2
            - id: plus-one
              unique: soldier-increase
              uniqueScope: owner
              from: { values: [str, dex, con] }
              recommend: >-
                sortList(filterList(['str', 'dex', 'con'], !(x in picksOf('plus-two'))),
                  -fieldOf('abilities.{ability}.base', x))[0]
              effects:
                - target:
                    {
                      fields:
                        { where: "item.id == '5e-srd-5.2:abilities.' + pick.value + '.base'" },
                    }
                  op: add
                  value: 1
        - id: one-each
          effects:
            - { target: abilities.str.base, op: add, value: 1 }
            - { target: abilities.dex.base, op: add, value: 1 }
            - { target: abilities.con.base, op: add, value: 1 }
  - id: gaming-set
    from: { type: tool, where: "item.category == 'gaming-set'" }
    activate: false
    eligible: '!(item.id in proficiencies.tools) || item.id in choice.picks'
    effects:
      - { target: proficiencies.tools, op: grant, value: { formula: pick.id } }
  - id: languages
    pick: 2
    unique: languages
    from: { type: language, where: '!item.rare' }
    eligible: '!(item.id in proficiencies.languages) || item.id in choice.picks'
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: soldier
        kind: choice
        options:
          - id: a
            changes:
              - { type: addItem, entry: { item: "'weapons.spear'", equipped: true } }
              - { type: addItem, entry: { item: "'weapons.shortbow'", equipped: true } }
              - { type: addItem, entry: { item: "'gear.arrows'", quantity: 20 } }
              - { type: addItem, entry: { item: "'gear.healers-kit'" } }
              - { type: addItem, entry: { item: "'gear.quiver'" } }
              - { type: addItem, entry: { item: "'gear.travelers-clothes'" } }
              - { type: adjust, field: coins.gp, by: 14 }
          - id: b
            changes:
              - { type: adjust, field: coins.gp, by: 50 }
        recommend: "'a'"
        random: params.random
      - id: soldierGamingSet
        kind: choice
        when: "steps.soldier.picked == 'a'"
        sheet: proposed
        options:
          content:
            type: tool
            where: >-
              item.category in ['gaming-set']
                && (item.id in proficiencies.tools
                  || countList(proficiencies.tools, x in [@tools.dice, @tools.dragonchess, @tools.playing-cards, @tools.three-dragon-ante]) == 0)
        recommend: options[0]
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id } }
