id: backgrounds.criminal
type: background
fields:
  startingKit: true
effects:
  - { target: proficiencies.skills, op: grant, value: { tag: skill.sleight-of-hand } }
  - { target: proficiencies.skills, op: grant, value: { tag: skill.stealth } }
  - { target: proficiencies.tools, op: grant, value: { item: tools.thieves-tools } }
grants:
  - item: feats.alert
  - item: languages.common
choices:
  - id: ability-increase
    recommend: "'two-and-one'"
    from:
      options:
        - id: two-and-one
          choices:
            - id: plus-two
              unique: criminal-increase
              uniqueScope: owner
              from: { values: [dex, con, int] }
              recommend: "sortList(['dex', 'con', 'int'], -fieldOf('abilities.{ability}.base', x))[0]"
              effects:
                - target:
                    {
                      fields:
                        { where: "item.id == '5e-srd-5.2:abilities.' + pick.value + '.base'" },
                    }
                  op: add
                  value: 2
            - id: plus-one
              unique: criminal-increase
              uniqueScope: owner
              from: { values: [dex, con, int] }
              recommend: >-
                sortList(filterList(['dex', 'con', 'int'], !(x in picksOf('plus-two'))),
                  -fieldOf('abilities.{ability}.base', x))[0]
              effects:
                - target:
                    {
                      fields:
                        { where: "item.id == '5e-srd-5.2:abilities.' + pick.value + '.base'" },
                    }
                  op: add
                  value: 1
        - id: one-each
          effects:
            - { target: abilities.dex.base, op: add, value: 1 }
            - { target: abilities.con.base, op: add, value: 1 }
            - { target: abilities.int.base, op: add, value: 1 }
  - id: languages
    pick: 2
    unique: languages
    from: { type: language, where: '!item.rare' }
    eligible: '!(item.id in proficiencies.languages) || item.id in choice.picks'
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: criminal
        kind: choice
        options:
          - id: a
            changes:
              - { type: addItem, entry: { item: "'weapons.dagger'", quantity: 2, equipped: true } }
              - { type: addItem, entry: { item: "'tools.thieves-tools'" } }
              - { type: addItem, entry: { item: "'gear.crowbar'" } }
              - { type: addItem, entry: { item: "'gear.pouch'", quantity: 2 } }
              - { type: addItem, entry: { item: "'gear.travelers-clothes'" } }
              - { type: adjust, field: coins.gp, by: 16 }
          - id: b
            changes:
              - { type: adjust, field: coins.gp, by: 50 }
        recommend: "'a'"
        random: params.random
