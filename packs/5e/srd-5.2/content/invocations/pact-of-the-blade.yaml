id: invocations.pact-of-the-blade
type: invocation
# The weapon conjured or bonded, by kind: proficiency, and Charisma for its attack and damage rolls
# (rules/class-warlock.yaml). Its Necrotic, Psychic or Radiant damage is the app's.
choices:
  - id: weapon
    from: { type: weapon, where: "item.range == 'melee'" }
    activate: false
    effects:
      - { target: proficiencies.weapons, op: grant, value: { formula: pick.id } }
      - { target: warlock.pactWeapons, op: grant, value: { formula: pick.id } }
      - { target: weapons.charismaAttack, op: grant, value: { formula: pick.id } }
