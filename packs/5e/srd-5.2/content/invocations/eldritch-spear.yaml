id: invocations.eldritch-spear
type: invocation
repeatable: true
prerequisites:
  - id: level
    when: self.level >= 2
choices:
  - id: cantrip
    from:
      {
        type: spell,
        where: 'item.level == 0 && has(item.damage) && has(item.range) && item.range >= 10',
      }
    eligible: item.id in spells.warlock
    activate: false
    unique: eldritch-spear
    requiresOption: true
keepsTemplates:
  - template: invocations.eldritch-spear-range
    content: { type: spell, where: "item.id in picksOf('cantrip')" }
    params: { feet: 30 * self.level }
