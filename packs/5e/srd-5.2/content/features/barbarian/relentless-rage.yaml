id: features.barbarian.relentless-rage
type: feature
# The save DC: 10, plus 5 for each use since the last rest.
computed:
  rageDc: { type: integer, formula: 10 + 5 * self.relentlessRageSpent }
effects:
  - target: { steps: [rest.short, rest.long] }
    op: changes
    when: self.relentlessRageSpent > 0
    value:
      changes:
        - { type: setState, entry: self, key: relentlessRageSpent, value: 0 }
followUps:
  - id: relentless-rage
    becomes: hp.current == 0
    when: rage.active
    action: relentless-rage
actions:
  - id: relentless-rage
    tags: [save]
    results: [success, failure]
    available: rage.active && hp.current == 0
    steps:
      - id: save
        kind: action
        use: saving-throw
        params: { ability: "'con'", dc: self.rageDc }
      - id: survive
        kind: changes
        when: "steps.save.result == 'success'"
        changes:
          - { type: set, field: hp.current, value: 2 * self.level }
          - { type: set, field: deathSaves.successes, value: 0 }
          - { type: set, field: deathSaves.failures, value: 0 }
      - id: count
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: relentlessRageSpent, by: 1 }
      - id: result
        kind: outcome
        result: steps.save.result
        data:
          dc: self.rageDc
