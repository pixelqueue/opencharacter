id: features.warlock.hurl-through-hell
type: feature
# `hurlThroughHell` on an attack: on a hit, the feature's use (or, once used, a Pact Magic slot) is
# spent and the target makes a Charisma save against the warlock's spell save DC. On a failure it
# takes 8d10 Psychic damage unless it's a Fiend, and has the Incapacitated condition; its return at
# the end of the warlock's next turn, and once per turn, are the table's.
effects:
  - target: { steps: [rest.long] }
    op: changes
    when: self.hurlThroughHellUsed
    value:
      changes:
        - { type: setState, entry: self, key: hurlThroughHellUsed, value: false }
  - target: { actions: [attack-hit] }
    op: params
    when: '!self.hurlThroughHellUsed || pactSlots.used < pactSlots.max'
    value:
      hurlThroughHell: { type: boolean, default: false }
  - target: { steps: [attack-hit] }
    op: changes
    when: params.hurlThroughHell && !self.hurlThroughHellUsed
    value:
      to: self
      changes:
        - { type: setState, entry: self, key: hurlThroughHellUsed, value: true }
  - target: { steps: [attack-hit] }
    op: action
    when: params.hurlThroughHell && self.hurlThroughHellUsed && pactSlots.used < pactSlots.max
    value:
      id: slot
      use: spend-spell-slot
      params: { slotType: "'pact'" }
  - target: { steps: [attack-hit] }
    op: action
    when: >-
      params.hurlThroughHell && (!self.hurlThroughHellUsed || pactSlots.used < pactSlots.max)
    value:
      id: hurl
      use: saving-throw
      each: target
      as: participant
      params: { ability: "'cha'", dc: spellcasting.warlock.dc }
      changes:
        - type: adjust
          when: run.result == 'failure' && participant.creature.type != 'fiend'
          field: hp.current
          by: -8d10
          tags: [damage, magical, damage.psychic]
        - type: applyEffect
          when: run.result == 'failure'
          source: "'conditions.incapacitated'"
          state: { by: creature.type, magical: true }
