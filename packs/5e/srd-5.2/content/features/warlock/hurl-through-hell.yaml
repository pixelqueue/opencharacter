id: features.warlock.hurl-through-hell
type: feature
effects:
  - target: { steps: [rest.long] }
    op: changes
    when: self.hurlThroughHellUsed
    value:
      changes:
        - { type: setState, entry: self, key: hurlThroughHellUsed, value: false }
actions:
  - id: hurl-through-hell
    tags: [feature]
    results: [no-slot, saved, hurled]
    available: '!self.hurlThroughHellUsed || pactSlots.used < pactSlots.max'
    participants:
      target:
        max: 1
        fields: target
    steps:
      - id: slot
        kind: action
        when: self.hurlThroughHellUsed
        use: spend-spell-slot
        params:
          slotType: "'pact'"
      - id: noSlot
        kind: outcome
        when: has(steps.slot) && steps.slot.result != 'spent'
        result: "'no-slot'"
        data:
          slot: steps.slot.data.slot
      - id: spend
        kind: changes
        changes:
          - { type: setState, entry: self, key: hurlThroughHellUsed, value: true }
      - id: save
        kind: action
        each: target
        as: participant
        use: saving-throw
        params:
          ability: "'cha'"
          dc: spellcasting.warlock.dc
      - id: fail
        kind: branch
        cases:
          - when: size(participants.target) == 0 || steps.save[0].result == 'failure'
            flags:
              hurled: true
              fiend: size(participants.target) > 0 && participants.target[0].creature.type == 'fiend'
        else:
          flags: { hurled: false, fiend: false }
      - id: saved
        kind: outcome
        when: '!flags.hurled'
        result: "'saved'"
        data:
          dc: spellcasting.warlock.dc
      - id: damage
        kind: roll
        when: '!flags.fiend'
        tags: [damage]
        parts:
          - dice: 8d10
            tags: [damage.psychic]
      - id: deal
        kind: changes
        when: has(steps.damage)
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags: [damage, magical]
      - id: incapacitate
        kind: changes
        to: target
        changes:
          - type: applyEffect
            source: "'conditions.incapacitated'"
            state: { by: creature.type, magical: true }
      - id: result
        kind: outcome
        result: "'hurled'"
        data:
          dc: spellcasting.warlock.dc
          damage: 'has(steps.damage) ? steps.damage.total : 0'
