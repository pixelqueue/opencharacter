id: features.monk.deflect-attacks
type: feature
effects:
  - { target: deflectAttacks.known, op: set, value: true }
  - { target: deflectAttacks.bonus, op: set, value: abilities.dex.mod + self.level }
# The reduction is the `deflectAttacks` situational choice; this is the redirect it offers when
# it stops all of an attack's damage (the rules' `deflect-redirect` follow-up runs it): 1 Focus
# Point, then two Martial Arts dice plus the Dexterity modifier against a Dexterity save.
actions:
  - id: deflect-attacks
    tags: [feature]
    results: [redirected]
    available: self.focusSpent + 1 <= focus.points
    participants:
      target:
        max: 1
        fields: target
    steps:
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: focusSpent, by: 1 }
      - id: redirected
        kind: roll
        tags: [damage]
        parts:
          - dice: martialArts.die
          - dice: martialArts.die
          - field: "'abilities.dex.mod'"
      - id: result
        kind: outcome
        result: "'redirected'"
        data:
          redirectDamage: steps.redirected.total
          dc: focus.saveDc
          save: "'dex'"
