id: features.monk.stunning-strike
type: feature
# `stunningStrike` on an attack: on a hit with a Monk weapon or an Unarmed Strike it spends 1
# Focus Point and the target makes a Constitution save or has the Stunned condition. Once per turn,
# and a successful save's halved Speed and Advantage, are the player's.
effects:
  - target: { actions: [attack] }
    op: params
    when: self.focusSpent + 1 <= focus.points
    value:
      stunningStrike: { type: boolean, default: false }
  - target: { steps: [attack-hit] }
    op: changes
    when: &strike 'params.stunningStrike && self.focusSpent + 1 <= focus.points && flags.monk'
    value:
      to: self
      changes:
        - { type: adjustState, entry: self, key: focusSpent, by: 1 }
  - target: { steps: [attack-hit] }
    op: action
    when: *strike
    value:
      id: stun
      use: saving-throw
      each: target
      as: participant
      params: { ability: "'con'", dc: focus.saveDc }
      changes:
        - type: applyEffect
          when: run.result == 'failure'
          source: "'conditions.stunned'"
          state: { by: creature.type }
