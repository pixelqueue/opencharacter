id: features.monk.uncanny-metabolism
type: feature
effects:
  - target: { steps: [rest.long] }
    op: changes
    when: self.uncannyMetabolismUsed
    value:
      changes:
        - { type: setState, entry: self, key: uncannyMetabolismUsed, value: false }
# Run when rolling Initiative.
actions:
  - id: uncanny-metabolism
    tags: [healing]
    results: [healed]
    available: '!self.uncannyMetabolismUsed'
    steps:
      - id: heal
        kind: roll
        tags: [healing]
        parts:
          - dice: martialArts.die
          - value: self.level
      - id: regain
        kind: changes
        changes:
          - { type: adjust, field: hp.current, by: steps.heal.total, tags: [healing] }
          - { type: setState, entry: self, key: focusSpent, value: 0 }
          - { type: setState, entry: self, key: uncannyMetabolismUsed, value: true }
      - id: result
        kind: outcome
        result: "'healed'"
        data:
          healed: steps.heal.total
