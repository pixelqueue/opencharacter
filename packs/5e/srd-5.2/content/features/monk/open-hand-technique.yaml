id: features.monk.open-hand-technique
type: feature
# `openHand` on an attack Flurry of Blows grants: on a hit, Push hands the target a Strength save
# and Topple a Dexterity save, at the monk's DC; a failed Topple save leaves it Prone. Addle, and
# moving a target that fails the Push save up to 15 feet, are the player's.
effects:
  - target: { actions: [attack] }
    op: params
    value:
      openHand: { type: enum, values: [addle, push, topple], optional: true }
  - target: { steps: [attack-hit] }
    op: action
    when: has(params.openHand) && params.openHand != 'addle'
    value:
      id: technique
      use: saving-throw
      each: target
      as: participant
      params:
        ability: "params.openHand == 'push' ? 'str' : 'dex'"
        dc: focus.saveDc
      changes:
        - type: applyEffect
          when: run.result == 'failure' && params.openHand == 'topple'
          source: "'conditions.prone'"
          state: { by: creature.type }
