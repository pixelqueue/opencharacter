id: features.monk.evasion
type: feature
# Save spells and effects tag their damage with the save, so this halves the change again on a
# failure and removes it on a success.
effects:
  - target: { incoming: { fields: [hp.current], tags: [save.dex] } }
    op: multiply
    value: "'save-success' in incoming.tags ? 0 : 0.5"
    when: "'save-half' in incoming.tags && !conditions.incapacitated"
