id: features.druid.spellcasting
type: feature
effects:
  - { target: spellcasting.druid.mod, op: set, value: abilities.wis.mod }
  - { target: spellcasting.druid.dc, op: set, value: 8 + proficiency.bonus + abilities.wis.mod }
  - { target: spellcasting.druid.attack, op: set, value: proficiency.bonus + abilities.wis.mod }
  - { target: spellcasting.casterLevel, op: add, value: self.level }
choices:
  - id: cantrips
    pick: 'self.level >= 10 ? 4 : self.level >= 4 ? 3 : 2'
    from: { type: spell, where: 'item.level == 0 && @classes.druid in item.classes' }
    eligible: '!(item.id in spells.druid) || item.id in choice.picks'
    recommend: >-
      filterList([@spells.druidcraft, @spells.produce-flame], !(x in choice.picks)
        && !(x in spells.druid))[0]
    effects:
      - { target: spells.druid, op: grant, value: { formula: pick.id } }
  - id: spells
    pick: '[4, 5, 6, 7, 9, 10, 11, 12, 14, 15, 16, 16, 17, 17, 18, 18, 19, 20, 21, 22][self.level - 1]'
    from: { type: spell, where: 'item.level >= 1 && @classes.druid in item.classes' }
    eligible: >-
      item.level <= min(9, ceil(self.level / 2))
        && (!(item.id in spells.druid) || item.id in choice.picks)
    recommend: >-
      filterList([@spells.animal-friendship, @spells.cure-wounds, @spells.faerie-fire,
        @spells.thunderwave], !(x in choice.picks) && !(x in spells.druid))[0]
    effects:
      - { target: spells.druid, op: grant, value: { formula: pick.id } }
