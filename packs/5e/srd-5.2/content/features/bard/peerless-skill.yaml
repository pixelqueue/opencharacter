id: features.bard.peerless-skill
type: feature
effects:
  # The use is spent when the die is added, even if the test still fails.
  - target: { choices: [failed-check, failed-attack] }
    op: option
    when: self.bardicInspirationSpent < bardicInspiration.uses
    value:
      id: peerless-skill
      flags: { addDie: bardicInspiration.die }
      changes:
        - { type: adjustState, entry: self, key: bardicInspirationSpent, by: 1 }
