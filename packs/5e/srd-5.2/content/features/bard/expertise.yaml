id: features.bard.expertise
type: feature
choices:
  - id: skills
    recommend: >-
      (filterList(['skill.performance', 'skill.persuasion', 'skill.deception', 'skill.insight'],
        x in options) + options)[0]
    slots: [2, 9]
    pick: 2
    when: self.level >= slot
    from:
      values:
        - skill.acrobatics
        - skill.animal-handling
        - skill.arcana
        - skill.athletics
        - skill.deception
        - skill.history
        - skill.insight
        - skill.intimidation
        - skill.investigation
        - skill.medicine
        - skill.nature
        - skill.perception
        - skill.performance
        - skill.persuasion
        - skill.religion
        - skill.sleight-of-hand
        - skill.stealth
        - skill.survival
      where: value in proficiencies.skills
    eligible: '!(value in proficiencies.expertise) || value in choice.picks'
    effects:
      - { target: proficiencies.expertise, op: grant, value: { formula: pick.value } }
