id: features.bard.spellcasting
type: feature
effects:
  - { target: spellcasting.bard.mod, op: set, value: abilities.cha.mod }
  - { target: spellcasting.bard.dc, op: set, value: 8 + proficiency.bonus + abilities.cha.mod }
  - { target: spellcasting.bard.attack, op: set, value: proficiency.bonus + abilities.cha.mod }
  - { target: spellcasting.casterLevel, op: add, value: self.level }
choices:
  - id: cantrips
    pick: 'self.level >= 10 ? 4 : self.level >= 4 ? 3 : 2'
    from: { type: spell, where: 'item.level == 0 && @classes.bard in item.classes' }
    eligible: '!(item.id in spells.bard) || item.id in choice.picks'
    recommend: >-
      filterList([@spells.dancing-lights, @spells.vicious-mockery], !(x in choice.picks)
        && !(x in spells.bard))[0]
    effects:
      - { target: spells.bard, op: grant, value: { formula: pick.id } }
  - id: spells
    pick: '[4, 5, 6, 7, 9, 10, 11, 12, 14, 15, 16, 16, 17, 17, 18, 18, 19, 20, 21, 22][self.level - 1]'
    from:
      type: spell
      where: >-
        item.level >= 1 && (@classes.bard in item.classes || @classes.cleric in item.classes
          || @classes.druid in item.classes || @classes.wizard in item.classes)
    eligible: >-
      item.level <= min(9, ceil(self.level / 2))
        && (@classes.bard in item.classes || self.level >= 10)
        && (!(item.id in spells.bard) || item.id in choice.picks)
    recommend: >-
      filterList([@spells.charm-person, @spells.color-spray, @spells.dissonant-whispers,
        @spells.healing-word], !(x in choice.picks) && !(x in spells.bard))[0]
    effects:
      - { target: spells.bard, op: grant, value: { formula: pick.id } }
