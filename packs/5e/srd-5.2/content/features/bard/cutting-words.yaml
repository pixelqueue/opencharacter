id: features.bard.cutting-words
type: feature
actions:
  - id: cutting-words
    tags: [feature]
    results: [cut]
    available: self.bardicInspirationSpent < bardicInspiration.uses
    steps:
      - id: die
        kind: roll
        parts:
          - dice: bardicInspiration.die
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: bardicInspirationSpent, by: 1 }
      - id: result
        kind: outcome
        result: "'cut'"
        data:
          penalty: steps.die.total
