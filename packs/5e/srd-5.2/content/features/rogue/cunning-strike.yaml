id: features.rogue.cunning-strike
type: feature
# The save DC: 8 + Dexterity modifier + Proficiency Bonus.
computed:
  strikeDc: { type: integer, formula: 8 + abilities.dex.mod + proficiency.bonus }
# The effect is a parameter of each attack (`cunningStrike`; Improved Cunning Strike adds
# `cunningStrike2`). Its dice come off the Sneak Attack (`rogue.sneakAttack`'s situational), and on
# a hit that deals Sneak Attack damage the target saves against it. An effect the rogue doesn't
# know yet, Poison without a Poisoner's Kit, a Trip against a Huge or larger target, or effects
# costing more dice than the Sneak Attack has do nothing. Withdraw's movement and Stealth Attack's
# Invisible condition are the player's.
effects:
  - { target: rogue.cunningStrikes, op: atLeast, value: 1 }
  - target: { actions: [attack] }
    op: params
    value:
      cunningStrike: &effect
        type: enum
        values: [poison, trip, withdraw, daze, knock-out, obscure, stealth-attack]
        optional: true
  - target: { actions: [attack] }
    op: params
    when: rogue.cunningStrikes >= 2
    value:
      cunningStrike2: *effect
  - target: { steps: [attack-hit] }
    op: action
    when: >-
      has(params.cunningStrike)
        && params.cunningStrike in ['poison', 'trip', 'daze', 'knock-out', 'obscure']
        && situational.sneakAttack && has(action.item) && has(action.item.damageType)
        && (action.item.range == 'ranged' || 'finesse' in action.item.tags)
        && (has(params.cunningStrike) ? (params.cunningStrike == 'knock-out' ? 6 : params.cunningStrike == 'obscure' ? 3 : params.cunningStrike == 'daze' ? 2 : 1) : 0)
          + (has(params.cunningStrike2) ? (params.cunningStrike2 == 'knock-out' ? 6 : params.cunningStrike2 == 'obscure' ? 3 : params.cunningStrike2 == 'daze' ? 2 : 1) : 0) <= rogue.sneakAttack
        && (params.cunningStrike != 'poison' || countCopies(copy.item == @tools.poisoners-kit) > 0)
        && (!(params.cunningStrike in ['daze', 'knock-out', 'obscure']) || rogue.deviousStrikes)
        && (params.cunningStrike != 'trip' || !(participant.creature.size in ['huge', 'gargantuan']))
    value:
      id: strike
      use: saving-throw
      each: target
      as: participant
      params:
        ability: "params.cunningStrike in ['trip', 'obscure'] ? 'dex' : 'con'"
        dc: 8 + abilities.dex.mod + proficiency.bonus
      changes:
        - type: applyEffect
          when: run.result == 'failure' && params.cunningStrike == 'poison'
          source: "'conditions.poisoned'"
          state: { by: creature.type }
        - type: applyEffect
          when: run.result == 'failure' && params.cunningStrike == 'trip'
          source: "'conditions.prone'"
          state: { by: creature.type }
        - type: applyEffect
          when: run.result == 'failure' && params.cunningStrike == 'knock-out'
          source: "'conditions.unconscious'"
          state: { by: creature.type }
        - type: applyEffect
          when: run.result == 'failure' && params.cunningStrike == 'obscure'
          source: "'conditions.blinded'"
          state: { by: creature.type }
  - target: { steps: [attack-hit] }
    op: action
    when: >-
      has(params.cunningStrike2)
        && params.cunningStrike2 in ['poison', 'trip', 'daze', 'knock-out', 'obscure']
        && situational.sneakAttack && has(action.item) && has(action.item.damageType)
        && (action.item.range == 'ranged' || 'finesse' in action.item.tags)
        && (has(params.cunningStrike) ? (params.cunningStrike == 'knock-out' ? 6 : params.cunningStrike == 'obscure' ? 3 : params.cunningStrike == 'daze' ? 2 : 1) : 0)
          + (has(params.cunningStrike2) ? (params.cunningStrike2 == 'knock-out' ? 6 : params.cunningStrike2 == 'obscure' ? 3 : params.cunningStrike2 == 'daze' ? 2 : 1) : 0) <= rogue.sneakAttack
        && (params.cunningStrike2 != 'poison' || countCopies(copy.item == @tools.poisoners-kit) > 0)
        && (!(params.cunningStrike2 in ['daze', 'knock-out', 'obscure']) || rogue.deviousStrikes)
        && (params.cunningStrike2 != 'trip' || !(participant.creature.size in ['huge', 'gargantuan']))
    value:
      id: strike2
      use: saving-throw
      each: target
      as: participant
      params:
        ability: "params.cunningStrike2 in ['trip', 'obscure'] ? 'dex' : 'con'"
        dc: 8 + abilities.dex.mod + proficiency.bonus
      changes:
        - type: applyEffect
          when: run.result == 'failure' && params.cunningStrike2 == 'poison'
          source: "'conditions.poisoned'"
          state: { by: creature.type }
        - type: applyEffect
          when: run.result == 'failure' && params.cunningStrike2 == 'trip'
          source: "'conditions.prone'"
          state: { by: creature.type }
        - type: applyEffect
          when: run.result == 'failure' && params.cunningStrike2 == 'knock-out'
          source: "'conditions.unconscious'"
          state: { by: creature.type }
        - type: applyEffect
          when: run.result == 'failure' && params.cunningStrike2 == 'obscure'
          source: "'conditions.blinded'"
          state: { by: creature.type }
