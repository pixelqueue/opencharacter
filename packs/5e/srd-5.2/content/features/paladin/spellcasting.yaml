id: features.paladin.spellcasting
type: feature
effects:
  - { target: spellcasting.paladin.mod, op: set, value: abilities.cha.mod }
  - { target: spellcasting.paladin.dc, op: set, value: 8 + proficiency.bonus + abilities.cha.mod }
  - { target: spellcasting.paladin.attack, op: set, value: proficiency.bonus + abilities.cha.mod }
  - { target: spellcasting.casterLevel, op: add, value: ceil(self.level / 2) }
choices:
  - id: spells
    pick: '[2, 3, 4, 5, 6, 6, 7, 7, 9, 9, 10, 10, 11, 11, 12, 12, 14, 14, 15, 15][self.level - 1]'
    from: { type: spell, where: 'item.level >= 1 && @classes.paladin in item.classes' }
    # Only spells of a level the Paladin table gives slots for.
    eligible: >-
      item.level <= min(5, ceil(self.level / 4))
        && (!(item.id in spells.paladin) || item.id in choice.picks)
    recommend: >-
      !(@spells.heroism in choice.picks) ? @spells.heroism
        : !(@spells.searing-smite in choice.picks) ? @spells.searing-smite : ''
    effects:
      - { target: spells.paladin, op: grant, value: { formula: pick.id } }
