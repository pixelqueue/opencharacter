id: features.paladin.aura-of-devotion
type: feature
immuneTo:
  - id: charmed
    items: [conditions.charmed]
    when: >-
      countList(character.applied, x.active && x.source in [@conditions.incapacitated,
        @conditions.paralyzed, @conditions.petrified, @conditions.stunned,
        @conditions.unconscious]) == 0
