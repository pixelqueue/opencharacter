id: features.paladin.aura-of-courage
type: feature
immuneTo:
  - id: frightened
    items: [conditions.frightened]
    when: &up >-
      countList(character.applied, x.active && x.source in [@conditions.incapacitated,
        @conditions.paralyzed, @conditions.petrified, @conditions.stunned,
        @conditions.unconscious]) == 0
# Allies in the paladin's Aura of Protection, down while it has the Incapacitated condition.
auras:
  - id: courage
    when: *up
    size: paladin.auraRange
    affects: allies
    immuneTo:
      - { id: frightened, items: [conditions.frightened] }
