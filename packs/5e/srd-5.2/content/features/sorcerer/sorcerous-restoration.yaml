id: features.sorcerer.sorcerous-restoration
type: feature
# Taken on the first Short Rest with points spent.
effects:
  - target: { steps: [rest.short] }
    op: changes
    when: '!self.sorcerousRestorationUsed && self.sorceryPointsSpent > 0'
    value:
      changes:
        - type: adjustState
          entry: self
          key: sorceryPointsSpent
          by: -min(self.sorceryPointsSpent, floor(self.level / 2))
        - { type: setState, entry: self, key: sorcerousRestorationUsed, value: true }
  - target: { steps: [rest.long] }
    op: changes
    when: self.sorcerousRestorationUsed
    value:
      changes:
        - { type: setState, entry: self, key: sorcerousRestorationUsed, value: false }
