id: features.sorcerer.draconic-resilience
type: feature
effects:
  # 3 at Sorcerer level 3, and 1 more each level after.
  - { target: hp.max, op: add, value: self.level }
  - target: combat.ac
    op: set
    value: 10 + abilities.dex.mod + abilities.cha.mod
    when: "!('armor' in equipment.tags)"
