id: features.sorcerer.metamagic
type: feature
effects:
  - { target: sorcery.metamagic, op: set, value: sorcery.left > 0 || sorcery.free }
choices:
  - id: options
    recommend: >-
      (filterList([@metamagic.quickened-spell, @metamagic.twinned-spell, @metamagic.careful-spell,
        @metamagic.subtle-spell, @metamagic.empowered-spell, @metamagic.heightened-spell],
        x in options) + options)[0]
    pick: 'self.level >= 17 ? 6 : self.level >= 10 ? 4 : 2'
    from: { type: metamagic }
