id: features.ranger.weapon-mastery
type: feature
choices:
  - id: weapons
    recommend: '(filterList([@weapons.longbow, @weapons.shortsword], x in options) + options)[0]'
    pick: 2
    from: { type: weapon, where: has(item.mastery) }
    activate: false
    eligible: >-
      item.id in proficiencies.weapons
        && (!(item.id in mastery.weapons) || item.id in choice.picks)
    effects:
      - { target: mastery.weapons, op: grant, value: { formula: pick.id } }
