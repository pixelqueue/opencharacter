id: features.ranger.expertise
type: feature
choices:
  - id: skills
    pick: 2
    from:
      values:
        - skill.acrobatics
        - skill.animal-handling
        - skill.arcana
        - skill.athletics
        - skill.deception
        - skill.history
        - skill.insight
        - skill.intimidation
        - skill.investigation
        - skill.medicine
        - skill.nature
        - skill.perception
        - skill.performance
        - skill.persuasion
        - skill.religion
        - skill.sleight-of-hand
        - skill.stealth
        - skill.survival
      where: value in proficiencies.skills
    eligible: '!(value in proficiencies.expertise) || value in choice.picks'
    effects:
      - { target: proficiencies.expertise, op: grant, value: { formula: pick.value } }
