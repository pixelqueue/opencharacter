id: features.fighter.action-surge
type: feature
effects:
  - { id: uses, target: actionSurge.uses, op: set, value: 'self.level >= 17 ? 2 : 1' }
  - id: rest
    target: { steps: [rest.short, rest.long] }
    op: changes
    when: self.actionSurgeSpent > 0
    value:
      changes:
        - { type: setState, entry: self, key: actionSurgeSpent, value: 0 }
actions:
  - id: action-surge
    tags: [feature]
    results: [surged]
    available: self.actionSurgeSpent < actionSurge.uses
    steps:
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: actionSurgeSpent, by: 1 }
      - id: result
        kind: outcome
        result: "'surged'"
