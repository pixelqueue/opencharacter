id: features.fighter.weapon-mastery
type: feature
choices:
  - id: weapons
    pick: 'self.level >= 16 ? 6 : self.level >= 10 ? 5 : self.level >= 4 ? 4 : 3'
    from: { type: weapon, where: "has(item.mastery) && !('magic' in item.tags)" }
    activate: false
    eligible: '!(item.id in mastery.weapons) || item.id in choice.picks'
    recommend: >-
      countList([@weapons.greatsword, @weapons.flail, @weapons.javelin, @weapons.longsword, @weapons.longbow, @weapons.shortsword], !(x in choice.picks) && !(x in mastery.weapons)) > 0
        ? filterList([@weapons.greatsword, @weapons.flail, @weapons.javelin, @weapons.longsword, @weapons.longbow, @weapons.shortsword], !(x in choice.picks) && !(x in mastery.weapons))[0] : ''
    effects:
      - { target: mastery.weapons, op: grant, value: { formula: pick.id } }
