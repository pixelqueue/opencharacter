id: features.wizard.signature-spells
type: feature
effects:
  - target: { steps: [rest.short, rest.long] }
    op: changes
    when: self.signatureSpell1Used || self.signatureSpell2Used
    value:
      changes:
        - { type: setState, entry: self, key: signatureSpell1Used, value: false }
        - { type: setState, entry: self, key: signatureSpell2Used, value: false }
choices:
  - id: first
    unique: signature-spells
    from: { type: spell, where: 'item.level == 3 && @classes.wizard in item.classes' }
    eligible: item.id in spells.wizardBook
    effects:
      - { target: spells.wizard, op: grant, value: { formula: pick.id } }
      - { target: spells.free, op: grant, value: { formula: pick.id } }
      - target: { choices: [spell-cost] }
        op: option
        when: >-
          action.item.id == pick.id && !self.signatureSpell1Used
            && (!has(params.slot) || params.slot == 3)
        value:
          id: first
          flags: { slot: 3 }
          changes:
            - { type: setState, entry: self, key: signatureSpell1Used, value: true }
  - id: second
    unique: signature-spells
    from: { type: spell, where: 'item.level == 3 && @classes.wizard in item.classes' }
    eligible: item.id in spells.wizardBook
    effects:
      - { target: spells.wizard, op: grant, value: { formula: pick.id } }
      - { target: spells.free, op: grant, value: { formula: pick.id } }
      - target: { choices: [spell-cost] }
        op: option
        when: >-
          action.item.id == pick.id && !self.signatureSpell2Used
            && (!has(params.slot) || params.slot == 3)
        value:
          id: second
          flags: { slot: 3 }
          changes:
            - { type: setState, entry: self, key: signatureSpell2Used, value: true }
