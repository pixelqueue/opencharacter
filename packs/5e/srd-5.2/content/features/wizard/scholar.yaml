id: features.wizard.scholar
type: feature
choices:
  - id: expertise
    recommend: "(filterList(['skill.arcana', 'skill.investigation'], x in options) + options)[0]"
    from:
      values:
        [
          skill.arcana,
          skill.history,
          skill.investigation,
          skill.medicine,
          skill.nature,
          skill.religion,
        ]
      where: >-
        (value in proficiencies.skills && !(value in proficiencies.expertise))
          || value in choice.picks
    pick: >-
      countList(['skill.arcana', 'skill.history', 'skill.investigation', 'skill.medicine',
        'skill.nature', 'skill.religion'], x in proficiencies.skills) > 0 ? 1 : 0
    effects:
      - { target: proficiencies.expertise, op: grant, value: { formula: pick.value } }
