id: features.wizard.arcane-recovery
type: feature
effects:
  - target: { steps: [rest.long] }
    op: changes
    when: self.arcaneRecoveryUsed
    value:
      changes:
        - { type: setState, entry: self, key: arcaneRecoveryUsed, value: false }
actions:
  - id: arcane-recovery
    tags: [feature]
    results: [recovered]
    available: >-
      !self.arcaneRecoveryUsed
        && spellSlots.level1.used + spellSlots.level2.used + spellSlots.level3.used
          + spellSlots.level4.used + spellSlots.level5.used > 0
    steps:
      - id: slots
        kind: choice
        options:
          values: [1, 2, 3, 4, 5]
          where: >-
            countList(steps.slots.values, x == value)
                < fieldOf('spellSlots.level{slot}.used', value)
              && sumList(steps.slots.values, x) + value <= ceil(self.level / 2)
        repeat: { max: ceil(self.level / 2), min: 1 }
        prefer: value
        changes:
          - type: adjust
            field: { formula: "'spellSlots.level' + string(picked.value) + '.used'" }
            by: -1
      - id: recover
        kind: changes
        changes:
          - { type: setState, entry: self, key: arcaneRecoveryUsed, value: true }
      - id: result
        kind: outcome
        result: "'recovered'"
        data:
          levels: sumList(steps.slots.values, x)
