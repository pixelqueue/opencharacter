id: features.cleric.preserve-life
type: feature
# The healing to divide: five times the Cleric level.
computed:
  healingPool: { type: integer, formula: 5 * self.level }
actions:
  - id: preserve-life
    tags: [feature, healing]
    results: [healing]
    available: self.channelDivinitySpent < cleric.channelDivinity
    steps:
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: channelDivinitySpent, by: 1 }
      - id: result
        kind: outcome
        result: "'healing'"
        data:
          pool: self.healingPool
