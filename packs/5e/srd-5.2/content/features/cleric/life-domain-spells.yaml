id: features.cleric.life-domain-spells
type: feature
grants:
  - { item: spells.aid, when: self.level >= 3 }
  - { item: spells.bless, when: self.level >= 3 }
  - { item: spells.cure-wounds, when: self.level >= 3 }
  - { item: spells.lesser-restoration, when: self.level >= 3 }
  - { item: spells.mass-healing-word, when: self.level >= 5 }
  - { item: spells.revivify, when: self.level >= 5 }
  - { item: spells.aura-of-life, when: self.level >= 7 }
  - { item: spells.death-ward, when: self.level >= 7 }
  - { item: spells.greater-restoration, when: self.level >= 9 }
  - { item: spells.mass-cure-wounds, when: self.level >= 9 }
effects:
  - { target: spells.cleric, op: grant, value: { item: spells.aid }, when: self.level >= 3 }
  - { target: spells.cleric, op: grant, value: { item: spells.bless }, when: self.level >= 3 }
  - { target: spells.cleric, op: grant, value: { item: spells.cure-wounds }, when: self.level >= 3 }
  - target: spells.cleric
    op: grant
    value: { item: spells.lesser-restoration }
    when: self.level >= 3
  - target: spells.cleric
    op: grant
    value: { item: spells.mass-healing-word }
    when: self.level >= 5
  - { target: spells.cleric, op: grant, value: { item: spells.revivify }, when: self.level >= 5 }
  - {
      target: spells.cleric,
      op: grant,
      value: { item: spells.aura-of-life },
      when: self.level >= 7,
    }
  - { target: spells.cleric, op: grant, value: { item: spells.death-ward }, when: self.level >= 7 }
  - target: spells.cleric
    op: grant
    value: { item: spells.greater-restoration }
    when: self.level >= 9
  - target: spells.cleric
    op: grant
    value: { item: spells.mass-cure-wounds }
    when: self.level >= 9
