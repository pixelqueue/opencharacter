id: features.cleric.spellcasting
type: feature
effects:
  - { target: spellcasting.cleric.mod, op: set, value: abilities.wis.mod }
  - { target: spellcasting.cleric.dc, op: set, value: 8 + proficiency.bonus + abilities.wis.mod }
  - { target: spellcasting.cleric.attack, op: set, value: proficiency.bonus + abilities.wis.mod }
  - { target: spellcasting.casterLevel, op: add, value: self.level }
choices:
  - id: cantrips
    pick: 'self.level >= 10 ? 5 : self.level >= 4 ? 4 : 3'
    from: { type: spell, where: 'item.level == 0 && @classes.cleric in item.classes' }
    eligible: '!(item.id in spells.cleric) || item.id in choice.picks'
    recommend: >-
      filterList([@spells.guidance, @spells.sacred-flame, @spells.thaumaturgy],
        !(x in choice.picks) && !(x in spells.cleric))[0]
    effects:
      - { target: spells.cleric, op: grant, value: { formula: pick.id } }
  - id: spells
    pick: '[4, 5, 6, 7, 9, 10, 11, 12, 14, 15, 16, 16, 17, 17, 18, 18, 19, 20, 21, 22][self.level - 1]'
    from: { type: spell, where: 'item.level >= 1 && @classes.cleric in item.classes' }
    eligible: >-
      item.level <= min(9, ceil(self.level / 2))
        && (!(item.id in spells.cleric) || item.id in choice.picks)
    recommend: >-
      filterList([@spells.bless, @spells.cure-wounds, @spells.guiding-bolt, @spells.shield-of-faith],
        !(x in choice.picks) && !(x in spells.cleric))[0]
    effects:
      - { target: spells.cleric, op: grant, value: { formula: pick.id } }
