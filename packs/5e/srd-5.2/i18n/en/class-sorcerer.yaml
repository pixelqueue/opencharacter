features.sorcerer.metamagic.name: 'Metamagic'
features.sorcerer.metamagic.description: |-
  Because your magic flows from within, you can alter your spells to suit your needs; you gain two Metamagic options of your choice from “Metamagic Options” later in this class’s description. You use the chosen options to temporarily modify spells you cast. To use an option, you must spend the number of Sorcery Points that it costs.

  You can use only one Metamagic option on a spell when you cast it unless otherwise noted in one of those options.

  Whenever you gain a Sorcerer level, you can replace one of your Metamagic options with one you don’t know. You gain two more options at Sorcerer level 10 and two more at Sorcerer level 17.
features.sorcerer.metamagic.choices.options.prompt: 'Choose Metamagic options'

features.sorcerer.ability-score-improvement.name: 'Ability Score Improvement'
features.sorcerer.ability-score-improvement.description: 'You gain the Ability Score Improvement feat (see “Feats”) or another feat of your choice for which you qualify. You gain this feature again at Sorcerer levels 8, 12, and 16.'
features.sorcerer.ability-score-improvement.choices.feat.prompt: 'Choose a feat (level {slot})'

features.sorcerer.sorcerous-restoration.name: 'Sorcerous Restoration'
features.sorcerer.sorcerous-restoration.description: 'When you finish a Short Rest, you can regain expended Sorcery Points, but no more than a number equal to half your Sorcerer level (round down). Once you use this feature, you can’t do so again until you finish a Long Rest.'

features.sorcerer.sorcery-incarnate.name: 'Sorcery Incarnate'
features.sorcerer.sorcery-incarnate.description: |-
  If you have no uses of Innate Sorcery left, you can use it if you spend 2 Sorcery Points when you take the Bonus Action to activate it.

  In addition, while your Innate Sorcery feature is active, you can use up to two of your Metamagic options on each spell you cast.

features.sorcerer.epic-boon.name: 'Epic Boon'
features.sorcerer.epic-boon.description: 'You gain an Epic Boon feat (see “Feats”) or another feat of your choice for which you qualify. Boon of Dimensional Travel is recommended.'
features.sorcerer.epic-boon.choices.feat.prompt: 'Choose an Epic Boon or another feat'

features.sorcerer.arcane-apotheosis.name: 'Arcane Apotheosis'
features.sorcerer.arcane-apotheosis.description: 'While your Innate Sorcery feature is active, you can use one Metamagic option on each of your turns without spending Sorcery Points on it.'

metamagic.careful-spell.name: 'Careful Spell'
metamagic.careful-spell.description: |-
  *Cost: 1 Sorcery Point*

  When you cast a spell that forces other creatures to make a saving throw, you can protect some of those creatures from the spell’s full force. To do so, spend 1 Sorcery Point and choose a number of those creatures up to your Charisma modifier (minimum of one creature). A chosen creature automatically succeeds on its saving throw against the spell, and it takes no damage if it would normally take half damage on a successful save.
metamagic.careful-spell.options.careful.name: 'Careful Spell (1 Sorcery Point)'
metamagic.distant-spell.name: 'Distant Spell'
metamagic.distant-spell.description: |-
  *Cost: 1 Sorcery Point*

  When you cast a spell that has a range of at least 5 feet, you can spend 1 Sorcery Point to double the spell’s range. Or when you cast a spell that has a range of Touch, you can spend 1 Sorcery Point to make the spell’s range 30 feet.
metamagic.distant-spell.options.distant.name: 'Distant Spell (1 Sorcery Point)'
metamagic.empowered-spell.name: 'Empowered Spell'
metamagic.empowered-spell.description: |-
  *Cost: 1 Sorcery Point*

  When you roll damage for a spell, you can spend 1 Sorcery Point to reroll a number of the damage dice up to your Charisma modifier (minimum of one), and you must use the new rolls.

  You can use Empowered Spell even if you’ve already used a different Metamagic option during the casting of the spell.
metamagic.empowered-spell.options.empowered.name: 'Empowered Spell (1 Sorcery Point)'
metamagic.extended-spell.name: 'Extended Spell'
metamagic.extended-spell.description: |-
  *Cost: 1 Sorcery Point*

  When you cast a spell that has a duration of 1 minute or longer, you can spend 1 Sorcery Point to double its duration to a maximum duration of 24 hours.

  If the affected spell requires Concentration, you have Advantage on any saving throw you make to maintain that Concentration.
metamagic.extended-spell.options.extended.name: 'Extended Spell (1 Sorcery Point)'
metamagic.heightened-spell.name: 'Heightened Spell'
metamagic.heightened-spell.description: |-
  *Cost: 2 Sorcery Points*

  When you cast a spell that forces a creature to make a saving throw, you can spend 2 Sorcery Points to give one target of the spell Disadvantage on saves against the spell.
metamagic.heightened-spell.options.heightened.name: 'Heightened Spell (2 Sorcery Points)'
metamagic.quickened-spell.name: 'Quickened Spell'
metamagic.quickened-spell.description: |-
  *Cost: 2 Sorcery Points*

  When you cast a spell that has a casting time of an action, you can spend 2 Sorcery Points to change the casting time to a Bonus Action for this casting. You can’t modify a spell in this way if you’ve already cast a level 1+ spell on the current turn, nor can you cast a level 1+ spell on this turn after modifying a spell in this way.
metamagic.quickened-spell.options.quickened.name: 'Quickened Spell (2 Sorcery Points)'
metamagic.seeking-spell.name: 'Seeking Spell'
metamagic.seeking-spell.description: |-
  *Cost: 1 Sorcery Point*

  If you make an attack roll for a spell and miss, you can spend 1 Sorcery Point to reroll the d20, and you must use the new roll.

  You can use Seeking Spell even if you’ve already used a different Metamagic option during the casting of the spell.
metamagic.seeking-spell.options.seeking.name: 'Seeking Spell: reroll (1 Sorcery Point)'
metamagic.subtle-spell.name: 'Subtle Spell'
metamagic.subtle-spell.description: |-
  *Cost: 1 Sorcery Point*

  When you cast a spell, you can spend 1 Sorcery Point to cast it without any Verbal, Somatic, or Material components, except Material components that are consumed by the spell or that have a cost specified in the spell.
metamagic.subtle-spell.options.subtle.name: 'Subtle Spell (1 Sorcery Point)'
metamagic.transmuted-spell.name: 'Transmuted Spell'
metamagic.transmuted-spell.description: |-
  *Cost: 1 Sorcery Point*

  When you cast a spell that deals a type of damage from the following list, you can spend 1 Sorcery Point to change that damage type to one of the other listed types: Acid, Cold, Fire, Lightning, Poison, Thunder.
metamagic.transmuted-spell.options.to-acid.name: 'Transmuted Spell to Acid (1 Sorcery Point)'
metamagic.transmuted-spell.options.to-cold.name: 'Transmuted Spell to Cold (1 Sorcery Point)'
metamagic.transmuted-spell.options.to-fire.name: 'Transmuted Spell to Fire (1 Sorcery Point)'
metamagic.transmuted-spell.options.to-lightning.name: 'Transmuted Spell to Lightning (1 Sorcery Point)'
metamagic.transmuted-spell.options.to-poison.name: 'Transmuted Spell to Poison (1 Sorcery Point)'
metamagic.transmuted-spell.options.to-thunder.name: 'Transmuted Spell to Thunder (1 Sorcery Point)'
metamagic.twinned-spell.name: 'Twinned Spell'
metamagic.twinned-spell.description: |-
  *Cost: 1 Sorcery Point*

  When you cast a spell, such as *Charm Person*, that can be cast with a higher-level spell slot to target an additional creature, you can spend 1 Sorcery Point to increase the spell’s effective level by 1.
metamagic.twinned-spell.options.twinned.name: 'Twinned Spell (1 Sorcery Point)'

subclasses.draconic-sorcery.name: 'Draconic Sorcery'
subclasses.draconic-sorcery.description: |-
  **Breathe the Magic of Dragons**

  Your innate magic comes from the gift of a dragon. Perhaps an ancient dragon facing death bequeathed some of its magical power to you or your ancestor. You might have absorbed magic from a site infused with dragons’ power. Or perhaps you handled a treasure taken from a dragon’s hoard that was steeped in draconic power. Or you might have a dragon for an ancestor.

features.sorcerer.draconic-resilience.name: 'Draconic Resilience'
features.sorcerer.draconic-resilience.description: |-
  The magic in your body manifests physical traits of your draconic gift. Your Hit Point maximum increases by 3, and it increases by 1 whenever you gain another Sorcerer level.

  Parts of you are also covered by dragon-like scales. While you aren’t wearing armor, your base Armor Class equals 10 plus your Dexterity and Charisma modifiers.

features.sorcerer.draconic-spells.name: 'Draconic Spells'
features.sorcerer.draconic-spells.description: |-
  When you reach a Sorcerer level specified in the Draconic Spells table, you thereafter always have the listed spells prepared.

  **Draconic Spells**

  | Sorcerer Level | Spells |
  | --- | --- |
  | 3 | *Alter Self*, *Chromatic Orb*, *Command*, *Dragon’s Breath* |
  | 5 | *Fear*, *Fly* |
  | 7 | *Arcane Eye*, *Charm Monster* |
  | 9 | *Legend Lore*, *Summon Dragon* |

features.sorcerer.elemental-affinity.name: 'Elemental Affinity'
features.sorcerer.elemental-affinity.description: |-
  Your draconic magic has an affinity with a damage type associated with dragons. Choose one of those types: Acid, Cold, Fire, Lightning, or Poison.

  You have Resistance to that damage type, and when you cast a spell that deals damage of that type, you can add your Charisma modifier to one damage roll of that spell.
features.sorcerer.elemental-affinity.choices.damage-type.prompt: 'Choose a damage type'
features.sorcerer.elemental-affinity.choices.damage-type.options.acid.name: 'Acid'
features.sorcerer.elemental-affinity.choices.damage-type.options.cold.name: 'Cold'
features.sorcerer.elemental-affinity.choices.damage-type.options.fire.name: 'Fire'
features.sorcerer.elemental-affinity.choices.damage-type.options.lightning.name: 'Lightning'
features.sorcerer.elemental-affinity.choices.damage-type.options.poison.name: 'Poison'

features.sorcerer.dragon-wings.name: 'Dragon Wings'
features.sorcerer.dragon-wings.description: |-
  As a Bonus Action, you can cause draconic wings to appear on your back. The wings last for 1 hour or until you dismiss them (no action required). For the duration, you have a Fly Speed of 60 feet.

  Once you use this feature, you can’t use it again until you finish a Long Rest unless you spend 3 Sorcery Points (no action required) to restore your use of it.
features.sorcerer.dragon-wings.actions.dragon-wings.name: 'Dragon Wings'
features.sorcerer.dragon-wings.actions.dragon-wings.results.winged.name: 'Wings out'

features.sorcerer.dragon-companion.name: 'Dragon Companion'
features.sorcerer.dragon-companion.description: |-
  You can cast *Summon Dragon* without a Material component. You can also cast it once without a spell slot, and you regain the ability to cast it in this way when you finish a Long Rest.

  Whenever you start casting the spell, you can modify it so that it doesn’t require Concentration. If you do so, the spell’s duration becomes 1 minute for that casting.
features.sorcerer.dragon-companion.options.free.name: 'Dragon Companion (no slot)'
