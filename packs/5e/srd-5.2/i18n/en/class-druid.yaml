features.druid.wild-companion.name: 'Wild Companion'
features.druid.wild-companion.description: |-
  You can summon a nature spirit that assumes an animal form to aid you. As a Magic action, you can expend a spell slot or a use of Wild Shape to cast the *Find Familiar* spell without Material components.

  When you cast the spell in this way, the familiar is Fey and disappears when you finish a Long Rest.
features.druid.wild-companion.options.wild-shape.name: 'Wild Companion: expend a use of Wild Shape'

features.druid.ability-score-improvement.name: 'Ability Score Improvement'
features.druid.ability-score-improvement.description: 'You gain the Ability Score Improvement feat or another feat of your choice for which you qualify. You gain this feature again at Druid levels 8, 12, and 16.'
features.druid.ability-score-improvement.choices.feat.prompt: 'Choose a feat (level {slot})'

features.druid.wild-resurgence.name: 'Wild Resurgence'
features.druid.wild-resurgence.description: |-
  Once on each of your turns, if you have no uses of Wild Shape left, you can give yourself one use by expending a spell slot (no action required).

  In addition, you can expend one use of Wild Shape (no action required) to give yourself a level 1 spell slot, but you can't do so again until you finish a Long Rest.
