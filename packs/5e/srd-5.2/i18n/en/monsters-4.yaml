monsters.salamander.name: 'Salamander'
monsters.salamander.fire-aura.name: 'Fire Aura'
monsters.salamander.fire-aura.description: "At the end of each of the salamander's turns, each creature of the salamander's choice in a 5-foot Emanation originating from the salamander takes 7 (2d6) Fire damage."
monsters.salamander.multiattack.name: 'Multiattack'
monsters.salamander.multiattack.description: 'The salamander makes two Flame Spear attacks. It can replace one attack with a use of Constrict.'
