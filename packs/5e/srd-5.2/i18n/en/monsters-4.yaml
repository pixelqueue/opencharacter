monsters.merfolk-skirmisher.name: 'Merfolk Skirmisher'
monsters.merfolk-skirmisher.amphibious.name: 'Amphibious'
monsters.merfolk-skirmisher.amphibious.description: 'The merfolk can breathe air and water.'
monsters.merfolk-skirmisher.ocean-spear.name: 'Ocean Spear'
monsters.merfolk-skirmisher.ocean-spear.description: "*Melee or Ranged Attack Roll:* +2, reach 5 ft. or range 20/60 ft. *Hit:* 3 (1d6) Piercing damage plus 2 (1d4) Cold damage. If the target is a creature, its Speed decreases by 10 feet until the end of its next turn. *Hit or Miss:* The spear magically returns to the merfolk's hand immediately after a ranged attack."

monsters.merrow.name: 'Merrow'
monsters.merrow.amphibious.name: 'Amphibious'
monsters.merrow.amphibious.description: 'The merrow can breathe air and water.'
monsters.merrow.multiattack.name: 'Multiattack'
monsters.merrow.multiattack.description: 'The merrow makes two attacks, using Bite, Claw, or Harpoon in any combination.'
monsters.merrow.bite.name: 'Bite'
monsters.merrow.bite.description: "*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 6 (1d4 + 4) Piercing damage, and the target has the Poisoned condition until the end of the merrow's next turn."
monsters.merrow.claw.name: 'Claw'
monsters.merrow.claw.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 9 (2d4 + 4) Slashing damage.'
monsters.merrow.harpoon.name: 'Harpoon'
monsters.merrow.harpoon.description: '*Melee or Ranged Attack Roll:* +6, reach 5 ft. or range 20/60 ft. *Hit:* 11 (2d6 + 4) Piercing damage. If the target is a Large or smaller creature, the merrow pulls the target up to 15 feet straight toward itself.'
