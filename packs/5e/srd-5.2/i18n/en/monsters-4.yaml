monsters.mule.name: 'Mule'
monsters.mule.beast-of-burden.name: 'Beast of Burden'
monsters.mule.beast-of-burden.description: 'The mule counts as one size larger for the purpose of determining its carrying capacity.'
monsters.mule.hooves.name: 'Hooves'
monsters.mule.hooves.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 4 (1d4 + 2) Bludgeoning damage.'

monsters.mummy.name: 'Mummy'
monsters.mummy.multiattack.actions.multiattack.name: 'Multiattack'
monsters.mummy.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.mummy.multiattack.name: 'Multiattack'
monsters.mummy.multiattack.description: 'The mummy makes two Rotting Fist attacks and uses Dreadful Glare.'
monsters.mummy.rotting-fist.name: 'Rotting Fist'
monsters.mummy.rotting-fist.description: "*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 8 (1d10 + 3) Bludgeoning damage plus 10 (3d6) Necrotic damage. If the target is a creature, it is cursed. While cursed, the target can't regain Hit Points, its Hit Point maximum doesn't return to normal when finishing a Long Rest, and its Hit Point maximum decreases by 10 (3d6) every 24 hours that elapse. A creature dies and turns to dust if reduced to 0 Hit Points by this attack."
monsters.mummy.dreadful-glare.name: 'Dreadful Glare'
monsters.mummy.dreadful-glare.description: "*Wisdom Saving Throw:* DC 11, one creature the mummy can see within 60 feet. *Failure:* The target has the Frightened condition until the end of the mummy's next turn. *Success:* The target is immune to this mummy's Dreadful Glare for 24 hours."

monsters.mummy-lord.name: 'Mummy Lord'
monsters.mummy-lord.legendary-resistance.name: 'Legendary Resistance'
monsters.mummy-lord.legendary-resistance.description: 'If the mummy fails a saving throw, it can choose to succeed instead.'
monsters.mummy-lord.magic-resistance.name: 'Magic Resistance'
monsters.mummy-lord.magic-resistance.description: 'The mummy has Advantage on saving throws against spells and other magical effects.'
monsters.mummy-lord.undead-restoration.name: 'Undead Restoration'
monsters.mummy-lord.undead-restoration.description: "If destroyed, the mummy gains a new body in 24 hours if its heart is intact, reviving with all its Hit Points. The new body appears in an unoccupied space within the mummy's lair. The heart is a Tiny object that has AC 17, HP 10, and Immunity to all damage except Fire."
monsters.mummy-lord.multiattack.name: 'Multiattack'
monsters.mummy-lord.multiattack.description: 'The mummy makes one Rotting Fist or Channel Negative Energy attack, and it uses Dreadful Glare.'
monsters.mummy-lord.rotting-fist.name: 'Rotting Fist'
monsters.mummy-lord.rotting-fist.description: "*Melee Attack Roll:* +9, reach 5 ft. *Hit:* 15 (2d10 + 4) Bludgeoning damage plus 10 (3d6) Necrotic damage. If the target is a creature, it is cursed. While cursed, the target can't regain Hit Points, it gains no benefit from finishing a Long Rest, and its Hit Point maximum decreases by 10 (3d6) every 24 hours that elapse. A creature dies and turns to dust if reduced to 0 Hit Points by this attack."
monsters.mummy-lord.channel-negative-energy.name: 'Channel Negative Energy'
monsters.mummy-lord.channel-negative-energy.description: '*Ranged Attack Roll:* +9, range 60 ft. *Hit:* 25 (6d6 + 4) Necrotic damage.'
monsters.mummy-lord.dreadful-glare.name: 'Dreadful Glare'
monsters.mummy-lord.dreadful-glare.description: "*Wisdom Saving Throw:* DC 17, one creature the mummy can see within 60 feet. *Failure:* 25 (6d6 + 4) Psychic damage, and the target has the Paralyzed condition until the end of the mummy's next turn."
monsters.mummy-lord.insect-plague.name: 'Insect Plague (level 7 version)'
monsters.mummy-lord.insect-plague.description: "A spell of the mummy lord's Spellcasting, cast at level 7."
monsters.mummy-lord.spellcasting.name: 'Spellcasting'
monsters.mummy-lord.spellcasting.description: |-
  The mummy casts one of the following spells, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 17, +9 to hit with spell attacks):

  *At Will:* *Dispel Magic*, *Thaumaturgy*

  *1/Day Each:* *Animate Dead*, *Harm*, *Insect Plague* (level 7 version)
monsters.mummy-lord.whirlwind-of-sand.name: 'Whirlwind of Sand'
monsters.mummy-lord.whirlwind-of-sand.description: "*Trigger:* The mummy is hit by an attack roll. *Response:* The mummy adds 2 to its AC against the attack, possibly causing the attack to miss, and the mummy teleports up to 60 feet to an unoccupied space it can see. Each creature of its choice that it can see within 5 feet of its destination space has the Blinded condition until the end of the mummy's next turn."
monsters.mummy-lord.dread-command.name: 'Dread Command'
monsters.mummy-lord.dread-command.description: "The mummy casts *Command* (level 2 version), using the same spellcasting ability as Spellcasting. The mummy can't take this action again until the start of its next turn."
monsters.mummy-lord.glare.name: 'Glare'
monsters.mummy-lord.glare.description: "The mummy uses Dreadful Glare. The mummy can't take this action again until the start of its next turn."
monsters.mummy-lord.necrotic-strike.name: 'Necrotic Strike'
monsters.mummy-lord.necrotic-strike.description: 'The mummy makes one Rotting Fist or Channel Negative Energy attack.'
monsters.mummy-lord.texts.legendary: "Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the mummy can expend a use to take one of the following actions. The mummy regains all expended uses at the start of each of its turns."
