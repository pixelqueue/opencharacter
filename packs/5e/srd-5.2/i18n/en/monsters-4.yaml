monsters.roper.name: 'Roper'
monsters.roper.spider-climb.name: 'Spider Climb'
monsters.roper.spider-climb.description: 'The roper can climb difficult surfaces, including along ceilings, without needing to make an ability check.'
monsters.roper.multiattack.actions.multiattack.name: 'Multiattack'
monsters.roper.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.roper.multiattack.name: 'Multiattack'
monsters.roper.multiattack.description: 'The roper makes two Tentacle attacks, uses Reel, and makes two Bite attacks.'
monsters.roper.bite.name: 'Bite'
monsters.roper.bite.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 17 (3d8 + 4) Piercing damage.'
monsters.roper.tentacle.name: 'Tentacle'
monsters.roper.tentacle.description: |-
  *Melee Attack Roll:* +7, reach 60 ft. *Hit:* The target has the Grappled condition (escape DC 14) from one of six tentacles, and the target has the Poisoned condition until the grapple ends.

  The tentacle can be damaged, freeing a creature it has Grappled when destroyed (AC 20, HP 10, Immunity to Poison and Psychic damage). Damaging the tentacle deals no damage to the roper, and a destroyed tentacle regrows at the start of the roper's next turn.
monsters.roper.reel.name: 'Reel'
monsters.roper.reel.description: 'The roper pulls each creature Grappled by it up to 30 feet straight toward it.'

monsters.rust-monster.name: 'Rust Monster'
monsters.rust-monster.iron-scent.name: 'Iron Scent'
monsters.rust-monster.iron-scent.description: 'The rust monster can pinpoint the location of ferrous metal within 30 feet of itself.'
monsters.rust-monster.multiattack.name: 'Multiattack'
monsters.rust-monster.multiattack.description: 'The rust monster makes one Bite attack and uses Antennae twice.'
monsters.rust-monster.bite.name: 'Bite'
monsters.rust-monster.bite.description: '*Melee Attack Roll:* +3, reach 5 ft. *Hit:* 5 (1d8 + 1) Piercing damage.'
monsters.rust-monster.antennae.name: 'Antennae'
monsters.rust-monster.antennae.description: 'The rust monster targets one nonmagical metal object—armor or a weapon—worn or carried by a creature within 5 feet of itself. *Dexterity Saving Throw:* DC 11, the creature with the object. *Failure:* The object takes a -1 penalty to the AC it offers (armor) or to its attack rolls (weapon). Armor is destroyed if the penalty reduces its AC to 10, and a weapon is destroyed if its penalty reaches -5. The penalty can be removed by casting the Mending spell on the armor or weapon.'
monsters.rust-monster.destroy-metal.name: 'Destroy Metal'
monsters.rust-monster.destroy-metal.description: "The rust monster touches a nonmagical metal object within 5 feet of itself that isn't being worn or carried. The touch destroys a 1-foot Cube of the object."
monsters.rust-monster.reflexive-antennae.name: 'Reflexive Antennae'
monsters.rust-monster.reflexive-antennae.description: '*Trigger:* An attack roll hits the rust monster. *Response:* The rust monster uses Antennae.'
monsters.rust-monster.multiattack.actions.multiattack.name: 'Multiattack'
monsters.rust-monster.multiattack.actions.multiattack.results.done.name: 'Done'

monsters.saber-toothed-tiger.name: 'Saber-Toothed Tiger'
monsters.saber-toothed-tiger.running-leap.name: 'Running Leap'
monsters.saber-toothed-tiger.running-leap.description: 'With a 10-foot running start, the tiger can Long Jump up to 25 feet.'
monsters.saber-toothed-tiger.multiattack.actions.multiattack.name: 'Multiattack'
