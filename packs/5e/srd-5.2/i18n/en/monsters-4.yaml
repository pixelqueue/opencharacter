monsters.marilith.name: 'Marilith'
monsters.marilith.demonic-restoration.name: 'Demonic Restoration'
monsters.marilith.demonic-restoration.description: 'If the marilith dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.'
monsters.marilith.magic-resistance.name: 'Magic Resistance'
monsters.marilith.magic-resistance.description: 'The marilith has Advantage on saving throws against spells and other magical effects.'
monsters.marilith.reactive.name: 'Reactive'
monsters.marilith.reactive.description: 'The marilith can take one Reaction on every turn of combat.'
monsters.marilith.multiattack.actions.multiattack.name: 'Multiattack'
monsters.marilith.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.marilith.multiattack.name: 'Multiattack'
monsters.marilith.multiattack.description: 'The marilith makes six Pact Blade attacks and uses Constrict.'
monsters.marilith.pact-blade.name: 'Pact Blade'
monsters.marilith.pact-blade.description: '*Melee Attack Roll:* +10, reach 5 ft. *Hit:* 10 (1d10 + 5) Slashing damage plus 7 (2d6) Necrotic damage.'
monsters.marilith.constrict.name: 'Constrict'
monsters.marilith.constrict.description: '*Strength Saving Throw:* DC 17, one Medium or smaller creature the marilith can see within 5 feet. *Failure:* 15 (2d10 + 4) Bludgeoning damage. The target has the Grappled condition (escape DC 14), and it has the Restrained condition until the grapple ends.'
monsters.marilith.teleport.name: 'Teleport'
monsters.marilith.teleport.description: 'The marilith teleports up to 120 feet to an unoccupied space it can see.'
monsters.marilith.parry.name: 'Parry'
monsters.marilith.parry.description: '*Trigger:* The marilith is hit by a melee attack roll while holding a weapon. *Response:* The marilith adds 5 to its AC against that attack, possibly causing it to miss.'

monsters.mastiff.name: 'Mastiff'
monsters.mastiff.bite.name: 'Bite'
monsters.mastiff.bite.description: '*Melee Attack Roll:* +3, reach 5 ft. *Hit:* 4 (1d6 + 1) Piercing damage. If the target is a Medium or smaller creature, it has the Prone condition.'

monsters.medusa.name: 'Medusa'
monsters.medusa.multiattack.name: 'Multiattack'
monsters.medusa.multiattack.description: 'The medusa makes two Claw attacks and one Snake Hair attack, or it makes three Poison Ray attacks.'
monsters.medusa.claw.name: 'Claw'
monsters.medusa.claw.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 10 (2d6 + 3) Slashing damage.'
monsters.medusa.snake-hair.name: 'Snake Hair'
monsters.medusa.snake-hair.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 5 (1d4 + 3) Piercing damage plus 14 (4d6) Poison damage.'
monsters.medusa.poison-ray.name: 'Poison Ray'
monsters.medusa.poison-ray.description: '*Ranged Attack Roll:* +5, range 150 ft. *Hit:* 11 (2d8 + 2) Poison damage.'
monsters.medusa.petrifying-gaze.name: 'Petrifying Gaze'
monsters.medusa.petrifying-gaze.description: '*Constitution Saving Throw:* DC 13, each creature in a 30-foot Cone. If the medusa sees its reflection in the Cone, the medusa must make this save. *First Failure:* The target has the Restrained condition and repeats the save at the end of its next turn if it is still Restrained, ending the effect on itself on a success. *Second Failure:* The target has the Petrified condition instead of the Restrained condition.'
