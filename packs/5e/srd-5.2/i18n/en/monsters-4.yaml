monsters.mimic.name: 'Mimic'
monsters.mimic.adhesive.texts.note: 'Object Form Only'
monsters.mimic.adhesive.name: 'Adhesive'
monsters.mimic.adhesive.description: 'The mimic adheres to anything that touches it. A Huge or smaller creature adhered to the mimic has the Grappled condition (escape DC 13). Ability checks made to escape this grapple have Disadvantage.'
monsters.mimic.bite.name: 'Bite'
monsters.mimic.bite.description: '*Melee Attack Roll:* +5 (with Advantage if the target is Grappled by the mimic), reach 5 ft. *Hit:* 7 (1d8 + 3) Piercing damage—or 12 (2d8 + 3) Piercing damage if the target is Grappled by the mimic—plus 4 (1d8) Acid damage.'
monsters.mimic.pseudopod.name: 'Pseudopod'
monsters.mimic.pseudopod.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 7 (1d8 + 3) Bludgeoning damage plus 4 (1d8) Acid damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). Ability checks made to escape this grapple have Disadvantage.'
monsters.mimic.shape-shift.name: 'Shape-Shift'
monsters.mimic.shape-shift.description: "The mimic shape-shifts to resemble a Medium or Small object while retaining its game statistics, or it returns to its true blob form. Any equipment it is wearing or carrying isn't transformed."

monsters.minotaur-of-baphomet.name: 'Minotaur of Baphomet'
monsters.minotaur-of-baphomet.abyssal-glaive.name: 'Abyssal Glaive'
monsters.minotaur-of-baphomet.abyssal-glaive.description: '*Melee Attack Roll:* +6, reach 10 ft. *Hit:* 10 (1d12 + 4) Slashing damage plus 10 (3d6) Necrotic damage.'
monsters.minotaur-of-baphomet.gore.name: 'Gore'
monsters.minotaur-of-baphomet.gore.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 18 (4d6 + 4) Piercing damage. If the target is a Large or smaller creature and the minotaur moved 10+ feet straight toward it immediately before the hit, the target takes an extra 10 (3d6) Piercing damage and has the Prone condition.'
monsters.minotaur-of-baphomet.gore.actions.charge.name: 'Gore after a charge'
