monsters.pseudodragon.bite.name: 'Bite'
monsters.pseudodragon.bite.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 4 (1d4 + 2) Piercing damage.'
monsters.pseudodragon.sting.name: 'Sting'
monsters.pseudodragon.sting.description: '*Constitution Saving Throw:* DC 12, one creature the pseudodragon can see within 5 feet. *Failure:* 5 (2d4) Poison damage, and the target has the Poisoned condition for 1 hour. Failure by 5 or More: While Poisoned, the target also has the Unconscious condition, which ends early if the target takes damage or a creature within 5 feet of it takes an action to wake it.'

monsters.pteranodon.name: 'Pteranodon'
monsters.pteranodon.flyby.name: 'Flyby'
monsters.pteranodon.flyby.description: "The pteranodon doesn't provoke an Opportunity Attack when it flies out of an enemy's reach."
monsters.pteranodon.bite.name: 'Bite'
monsters.pteranodon.bite.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 6 (1d8 + 2) Piercing damage.'

monsters.purple-worm.name: 'Purple Worm'
monsters.purple-worm.tunneler.name: 'Tunneler'
monsters.purple-worm.tunneler.description: 'The worm can burrow through solid rock at half its Burrow Speed and leaves a 10-foot-diameter tunnel in its wake.'
monsters.purple-worm.multiattack.actions.multiattack.name: 'Multiattack'
monsters.purple-worm.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.purple-worm.multiattack.name: 'Multiattack'
monsters.purple-worm.multiattack.description: 'The worm makes one Bite attack and one Tail Stinger attack.'
monsters.purple-worm.bite.name: 'Bite'
monsters.purple-worm.bite.description: '*Melee Attack Roll:* +14, reach 10 ft. *Hit:* 22 (3d8 + 9) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 19), and it has the Restrained condition until the grapple ends.'
monsters.purple-worm.tail-stinger.name: 'Tail Stinger'
monsters.purple-worm.tail-stinger.description: '*Melee Attack Roll:* +14, reach 10 ft. *Hit:* 16 (2d6 + 9) Piercing damage plus 35 (10d6) Poison damage.'
monsters.purple-worm.swallow.name: 'Swallow'
monsters.purple-worm.swallow.description: |-
  *Strength Saving Throw:* DC 19, one Large or smaller creature Grappled by the worm (it can have up to three creatures swallowed at a time). *Failure:* The target is swallowed by the worm, and the Grappled condition ends. A swallowed creature has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the worm, and takes 17 (5d6) Acid damage at the start of each of the worm's turns.

  If the worm takes 30 damage or more on a single turn from a creature inside it, the worm must succeed on a DC 21 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 5 feet of the worm and has the Prone condition. If the worm dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse using 20 feet of movement, exiting Prone.

monsters.quasit.name: 'Quasit'
monsters.quasit.magic-resistance.name: 'Magic Resistance'
monsters.quasit.magic-resistance.description: 'The quasit has Advantage on saving throws against spells and other magical effects.'
monsters.quasit.rend.name: 'Rend'
monsters.quasit.rend.description: "*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 5 (1d4 + 3) Slashing damage, and the target has the Poisoned condition until the start of the quasit's next turn."
monsters.quasit.invisibility.name: 'Invisibility'
monsters.quasit.invisibility.description: 'The quasit casts *Invisibility* on itself, requiring no spell components and using Charisma as the spellcasting ability.'
monsters.quasit.scare.name: 'Scare'
monsters.quasit.scare.description: '*Wisdom Saving Throw:* DC 10, one creature within 20 feet. *Failure:* The target has the Frightened condition. At the end of each of its turns, the target repeats the save, ending the effect on itself on a success. After 1 minute, it succeeds automatically.'
monsters.quasit.shape-shift.name: 'Shape-Shift'
monsters.quasit.shape-shift.description: "The quasit shape-shifts to resemble a bat (Speed 10 ft., Fly 40 ft.), a centipede (40 ft., Climb 40 ft.), or a toad (40 ft., Swim 40 ft.), or it returns to its true form. Its game statistics are the same in each form, except for its Speed. Any equipment it is wearing or carrying isn't transformed."

monsters.rakshasa.name: 'Rakshasa'
monsters.rakshasa.greater-magic-resistance.name: 'Greater Magic Resistance'
monsters.rakshasa.greater-magic-resistance.description: "The rakshasa automatically succeeds on saving throws against spells and other magical effects, and the attack rolls of spells automatically miss it. Without the rakshasa's permission, no spell can observe the rakshasa remotely or detect its thoughts, creature type, or alignment."
monsters.rakshasa.fiendish-restoration.name: 'Fiendish Restoration'
monsters.rakshasa.fiendish-restoration.description: 'If the rakshasa dies outside the Nine Hells, its body turns to ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.'
monsters.rakshasa.multiattack.actions.multiattack.name: 'Multiattack'
monsters.rakshasa.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.rakshasa.multiattack.name: 'Multiattack'
monsters.rakshasa.multiattack.description: 'The rakshasa makes three Cursed Touch attacks.'
monsters.rakshasa.cursed-touch.name: 'Cursed Touch'
monsters.rakshasa.cursed-touch.description: '*Melee Attack Roll:* +10, reach 5 ft. *Hit:* 12 (2d6 + 5) Slashing damage plus 19 (3d12) Necrotic damage. If the target is a creature, it is cursed. While cursed, the target gains no benefit from finishing a Short or Long Rest.'
monsters.rakshasa.baleful-command.name: 'Baleful Command'
monsters.rakshasa.baleful-command.description: "*Wisdom Saving Throw:* DC 18, each enemy in a 30-foot Emanation originating from the rakshasa. *Failure:* 28 (8d6) Psychic damage, and the target has the Frightened and Incapacitated conditions until the start of the rakshasa's next turn."
monsters.rakshasa.spellcasting.name: 'Spellcasting'
monsters.rakshasa.spellcasting.description: |-
  The rakshasa casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 18):

  *At Will:* *Detect Magic*, *Detect Thoughts*, *Disguise Self*, *Mage Hand*, *Minor Illusion*

  *1/Day Each:* *Fly*, *Invisibility*, *Major Image*, *Plane Shift*
monsters.rakshasa.greater-magic-resistance.options.greater-magic-resistance.name: 'Greater Magic Resistance: succeed (spell or magical effect)'

monsters.rat.name: 'Rat'
monsters.rat.agile.name: 'Agile'
monsters.rat.agile.description: "The rat doesn't provoke an Opportunity Attack when it moves out of an enemy's reach."
monsters.rat.bite.name: 'Bite'
monsters.rat.bite.description: '*Melee Attack Roll:* +2, reach 5 ft. *Hit:* 1 Piercing damage.'

monsters.raven.name: 'Raven'
monsters.raven.mimicry.name: 'Mimicry'
monsters.raven.mimicry.description: 'The raven can mimic simple sounds it has heard, such as a whisper or chitter. A hearer can discern the sounds are imitations with a successful DC 10 Wisdom (Insight) check.'
monsters.raven.beak.name: 'Beak'
monsters.raven.beak.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 1 Piercing damage.'

monsters.red-dragon-wyrmling.name: 'Red Dragon Wyrmling'
monsters.red-dragon-wyrmling.multiattack.actions.multiattack.name: 'Multiattack'
monsters.red-dragon-wyrmling.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.red-dragon-wyrmling.multiattack.name: 'Multiattack'
monsters.red-dragon-wyrmling.multiattack.description: 'The dragon makes two Rend attacks.'
monsters.red-dragon-wyrmling.rend.name: 'Rend'
monsters.red-dragon-wyrmling.rend.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 9 (1d10 + 4) Slashing damage plus 3 (1d6) Fire damage.'
monsters.red-dragon-wyrmling.fire-breath.name: 'Fire Breath'
monsters.red-dragon-wyrmling.fire-breath.description: '*Dexterity Saving Throw:* DC 13, each creature in a 15-foot Cone. *Failure:* 24 (7d6) Fire damage. *Success:* Half damage.'

monsters.reef-shark.name: 'Reef Shark'
monsters.reef-shark.pack-tactics.name: 'Pack Tactics'
monsters.reef-shark.pack-tactics.description: "The shark has Advantage on an attack roll against a creature if at least one of the shark's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."
monsters.reef-shark.water-breathing.name: 'Water Breathing'
monsters.reef-shark.water-breathing.description: 'The shark can breathe only underwater.'
monsters.reef-shark.bite.name: 'Bite'
monsters.reef-shark.bite.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 7 (2d4 + 2) Piercing damage.'

monsters.remorhaz.name: 'Remorhaz'
monsters.remorhaz.heat-aura.name: 'Heat Aura'
monsters.remorhaz.heat-aura.description: "At the end of each of the remorhaz's turns, each creature in a 5-foot Emanation originating from the remorhaz takes 16 (3d10) Fire damage."
monsters.remorhaz.bite.name: 'Bite'
monsters.remorhaz.bite.description: '*Melee Attack Roll:* +11, reach 10 ft. *Hit:* 18 (2d10 + 7) Piercing damage plus 14 (4d6) Fire damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 17), and it has the Restrained condition until the grapple ends.'
monsters.remorhaz.swallow.name: 'Swallow'
monsters.remorhaz.swallow.description: |-
  *Strength Saving Throw:* DC 19, one Large or smaller creature Grappled by the remorhaz (it can have up to two creatures swallowed at a time). *Failure:* The target is swallowed by the remorhaz, and the Grappled condition ends. A swallowed creature has the Blinded and Restrained conditions, it has Total Cover against attacks and other effects outside the remorhaz, and it takes 10 (3d6) Acid damage plus 10 (3d6) Fire damage at the start of each of the remorhaz's turns.

  If the remorhaz takes 30 damage or more on a single turn from a creature inside it, the remorhaz must succeed on a DC 15 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 5 feet of the remorhaz and has the Prone condition. If the remorhaz dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse by using 15 feet of movement, exiting Prone.

monsters.rhinoceros.name: 'Rhinoceros'
monsters.rhinoceros.gore.name: 'Gore'
monsters.rhinoceros.gore.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 14 (2d8 + 5) Piercing damage. If target is a Large or smaller creature and the rhinoceros moved 20+ feet straight toward it immediately before the hit, the target takes an extra 9 (2d8) Piercing damage and has the Prone condition.'
monsters.rhinoceros.gore.actions.charge.name: 'Gore after a charge'
