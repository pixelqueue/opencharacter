monsters.sea-hag.name: 'Sea Hag'
monsters.sea-hag.amphibious.name: 'Amphibious'
monsters.sea-hag.amphibious.description: 'The hag can breathe air and water.'
monsters.sea-hag.coven-magic.name: 'Coven Magic'
monsters.sea-hag.coven-magic.description: "While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 11): Augury, Find Familiar, Identify, Locate Object, Scrying, or Unseen Servant. The hag must finish a Long Rest before using this trait to cast that spell again."
monsters.sea-hag.vile-appearance.name: 'Vile Appearance'
monsters.sea-hag.vile-appearance.description: "*Wisdom Saving Throw:* DC 11, any Beast or Humanoid that starts its turn within 30 feet of the hag and can see the hag's true form. *Failure:* The target has the Frightened condition until the start of its next turn. *Success:* The target is immune to this hag's Vile Appearance for 24 hours."
monsters.sea-hag.claw.name: 'Claw'
monsters.sea-hag.claw.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 10 (2d6 + 3) Slashing damage.'
monsters.sea-hag.death-glare.name: 'Death Glare'
monsters.sea-hag.death-glare.description: '*Wisdom Saving Throw:* DC 11, one Frightened creature the hag can see within 30 feet. *Failure:* If the target has 20 Hit Points or fewer, it drops to 0 Hit Points. Otherwise, the target takes 13 (3d8) Psychic damage.'
monsters.sea-hag.illusory-appearance.name: 'Illusory Appearance'
monsters.sea-hag.illusory-appearance.description: "The hag casts *Disguise Self*, using Constitution as the spellcasting ability (spell save DC 13). The spell's duration is 24 hours."
monsters.sea-hag.death-glare.actions.glare.name: 'Death Glare'
monsters.sea-hag.death-glare.actions.glare.results.used.name: 'Used'

monsters.seahorse.name: 'Seahorse'
monsters.seahorse.water-breathing.name: 'Water Breathing'
monsters.seahorse.water-breathing.description: 'The seahorse can breathe only underwater.'
monsters.seahorse.bubble-dash.name: 'Bubble Dash'
monsters.seahorse.bubble-dash.description: 'While underwater, the seahorse moves up to its Swim Speed without provoking Opportunity Attacks.'

monsters.shadow.name: 'Shadow'
monsters.shadow.amorphous.name: 'Amorphous'
monsters.shadow.amorphous.description: 'The shadow can move through a space as narrow as 1 inch without expending extra movement to do so.'
monsters.shadow.sunlight-weakness.name: 'Sunlight Weakness'
monsters.shadow.sunlight-weakness.description: 'While in sunlight, the shadow has Disadvantage on D20 Tests.'
monsters.shadow.draining-swipe.name: 'Draining Swipe'
monsters.shadow.draining-swipe.description: "*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 5 (1d6 + 2) Necrotic damage, and the target's Strength score decreases by 1d4. The target dies if this reduces that score to 0. If a Humanoid is slain by this attack, a Shadow rises from the corpse 1d4 hours later."
monsters.shadow.shadow-stealth.name: 'Shadow Stealth'
monsters.shadow.shadow-stealth.description: 'While in Dim Light or Darkness, the shadow takes the Hide action.'

monsters.shambling-mound.name: 'Shambling Mound'
monsters.shambling-mound.lightning-absorption.name: 'Lightning Absorption'
monsters.shambling-mound.lightning-absorption.description: 'Whenever the shambling mound is subjected to Lightning damage, it regains a number of Hit Points equal to the Lightning damage dealt.'
monsters.shambling-mound.multiattack.name: 'Multiattack'
monsters.shambling-mound.multiattack.description: 'The shambling mound makes three Charged Tendril attacks. It can replace one attack with a use of Engulf.'
monsters.shambling-mound.charged-tendril.name: 'Charged Tendril'
monsters.shambling-mound.charged-tendril.description: '*Melee Attack Roll:* +7, reach 10 ft. *Hit:* 7 (1d6 + 4) Bludgeoning damage plus 5 (2d4) Lightning damage. If the target is a Medium or smaller creature, the shambling mound pulls the target 5 feet straight toward itself.'
monsters.shambling-mound.engulf.name: 'Engulf'
monsters.shambling-mound.engulf.description: "*Strength Saving Throw:* DC 15, one Medium or smaller creature within 5 feet. *Failure:* The target is pulled into the shambling mound's space and has the Grappled condition (escape DC 14). Until the grapple ends, the target has the Blinded and Restrained conditions, and it takes 10 (3d6) Lightning damage at the start of each of its turns. When the shambling mound moves, the Grappled target moves with it, costing it no extra movement. The shambling mound can have only one creature Grappled by this action at a time."
monsters.shambling-mound.multiattack.actions.multiattack.name: 'Multiattack'
monsters.shambling-mound.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.shambling-mound.multiattack.actions.multiattack.options.charged-tendril.name: 'Charged Tendril'
monsters.shambling-mound.multiattack.actions.multiattack.options.engulf.name: 'Engulf'
monsters.shambling-mound.multiattack.actions.multiattack.steps.pick3.prompt: 'Attack'

monsters.shield-guardian.name: 'Shield Guardian'
monsters.shield-guardian.bound.name: 'Bound'
monsters.shield-guardian.bound.description: "The guardian is magically bound to an amulet. While the guardian and its amulet are on the same plane of existence, the amulet's wearer can telepathically call the guardian to travel to it, and the guardian knows the distance and direction to the amulet. If the guardian is within 60 feet of the amulet's wearer, half of any damage the wearer takes (round up) is transferred to the guardian."
monsters.shield-guardian.regeneration.name: 'Regeneration'
monsters.shield-guardian.regeneration.description: 'The guardian regains 10 Hit Points at the start of each of its turns if it has at least 1 Hit Point.'
monsters.shield-guardian.spell-storing.name: 'Spell Storing'
monsters.shield-guardian.spell-storing.description: "A spellcaster who wears the guardian's amulet can cause the guardian to store one spell of level 4 or lower. To do so, the wearer must cast the spell on the guardian while within 5 feet of it. The spell has no effect but is stored within the guardian. Any previously stored spell is lost when a new spell is stored. The guardian can cast the spell stored with any parameters set by the original caster, requiring no spell components and using the caster's spellcasting ability. The stored spell is then lost."
monsters.shield-guardian.multiattack.actions.multiattack.name: 'Multiattack'
monsters.shield-guardian.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.shield-guardian.multiattack.name: 'Multiattack'
monsters.shield-guardian.multiattack.description: 'The guardian makes two Fist attacks.'
monsters.shield-guardian.fist.name: 'Fist'
monsters.shield-guardian.fist.description: '*Melee Attack Roll:* +7, reach 10 ft. *Hit:* 11 (2d6 + 4) Bludgeoning damage plus 7 (2d6) Force damage.'
monsters.shield-guardian.protection.name: 'Protection'
monsters.shield-guardian.protection.description: "*Trigger:* An attack roll hits the wearer of the guardian's amulet while the wearer is within 5 feet of the guardian. *Response:* The wearer gains a +5 bonus to AC, including against the triggering attack and possibly causing it to miss, until the start of the guardian's next turn."

monsters.shrieker-fungus.name: 'Shrieker Fungus'
monsters.shrieker-fungus.shriek.name: 'Shriek'
monsters.shrieker-fungus.shriek.description: '*Trigger:* A creature or a source of Bright Light moves within 30 feet of the shrieker. *Response:* The shrieker emits a shriek audible within 300 feet of itself for 1 minute or until the shrieker dies.'

monsters.silver-dragon-wyrmling.name: 'Silver Dragon Wyrmling'
monsters.silver-dragon-wyrmling.multiattack.actions.multiattack.name: 'Multiattack'
monsters.silver-dragon-wyrmling.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.silver-dragon-wyrmling.multiattack.name: 'Multiattack'
monsters.silver-dragon-wyrmling.multiattack.description: 'The dragon makes two Rend attacks.'
monsters.silver-dragon-wyrmling.rend.name: 'Rend'
monsters.silver-dragon-wyrmling.rend.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 9 (1d10 + 4) Piercing damage.'
monsters.silver-dragon-wyrmling.cold-breath.name: 'Cold Breath'
monsters.silver-dragon-wyrmling.cold-breath.description: '*Constitution Saving Throw:* DC 13, each creature in a 15-foot Cone. *Failure:* 18 (4d8) Cold damage. *Success:* Half damage.'
monsters.silver-dragon-wyrmling.paralyzing-breath.name: 'Paralyzing Breath'
monsters.silver-dragon-wyrmling.paralyzing-breath.description: '*Constitution Saving Throw:* DC 13, each creature in a 15-foot Cone. *First Failure:* The target has the Incapacitated condition until the end of its next turn, when it repeats the save. *Second Failure:* The target has the Paralyzed condition, and it repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.'

monsters.skeleton.name: 'Skeleton'
monsters.skeleton.shortsword.name: 'Shortsword'
monsters.skeleton.shortsword.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 6 (1d6 + 3) Piercing damage.'
monsters.skeleton.shortbow.name: 'Shortbow'
monsters.skeleton.shortbow.description: '*Ranged Attack Roll:* +5, range 80/320 ft. *Hit:* 6 (1d6 + 3) Piercing damage.'
