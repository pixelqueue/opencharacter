monsters.roc.talons.name: 'Talons'
monsters.roc.talons.description: '*Melee Attack Roll:* +13, reach 5 ft. *Hit:* 23 (4d6 + 9) Slashing damage. If the target is a Huge or smaller creature, it has the Grappled condition (escape DC 19) from both talons, and it has the Restrained condition until the grapple ends.'
monsters.roc.swoop.name: 'Swoop'
monsters.roc.swoop.description: 'If the roc has a creature Grappled, the roc flies up to half its Fly Speed without provoking Opportunity Attacks and drops that creature.'
