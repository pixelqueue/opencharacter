monsters.mage.fireball.name: 'Fireball (level 4 version)'
monsters.mage.fireball.description: "A spell of the mage's Spellcasting, cast at level 4."
monsters.mage.spellcasting.name: 'Spellcasting'
monsters.mage.spellcasting.description: |-
  The mage casts one of the following spells, using Intelligence as the spellcasting ability (spell save DC 14):

  *At Will:* *Detect Magic*, *Light*, *Mage Armor* (included in AC), *Mage Hand*, *Prestidigitation*

  *2/Day Each:* *Fireball* (level 4 version), *Invisibility*

  *1/Day Each:* *Cone of Cold*, *Fly*
monsters.mage.misty-step.name: 'Misty Step'
monsters.mage.misty-step.description: 'The mage casts *Misty Step*, using the same spellcasting ability as Spellcasting.'
monsters.mage.protective-magic.name: 'Protective Magic'
monsters.mage.protective-magic.description: "The mage casts *Counterspell* or *Shield* in response to the spell's trigger, using the same spellcasting ability as Spellcasting."

monsters.magma-mephit.name: 'Magma Mephit'
monsters.magma-mephit.death-burst.name: 'Death Burst'
monsters.magma-mephit.death-burst.description: 'The mephit explodes when it dies. *Dexterity Saving Throw:* DC 11, each creature in a 5-foot Emanation originating from the mephit. *Failure:* 7 (2d6) Fire damage. *Success:* Half damage.'
monsters.magma-mephit.claw.name: 'Claw'
monsters.magma-mephit.claw.description: '*Melee Attack Roll:* +3, reach 5 ft. *Hit:* 3 (1d4 + 1) Slashing damage plus 3 (1d6) Fire damage.'
monsters.magma-mephit.fire-breath.name: 'Fire Breath'
monsters.magma-mephit.fire-breath.description: '*Dexterity Saving Throw:* DC 11, each creature in a 15-foot Cone. *Failure:* 7 (2d6) Fire damage. *Success:* Half damage.'

monsters.magmin.name: 'Magmin'
monsters.magmin.death-burst.name: 'Death Burst'
monsters.magmin.death-burst.description: 'The magmin explodes when it dies. *Dexterity Saving Throw:* DC 11, each creature in a 10-foot Emanation originating from the magmin. *Failure:* 7 (2d6) Fire damage. *Success:* Half damage.'
monsters.magmin.touch.name: 'Touch'
monsters.magmin.touch.description: "*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 7 (2d4 + 2) Fire damage. If the target is a creature or a flammable object that isn't being worn or carried, it starts burning."
monsters.magmin.ignited-illumination.name: 'Ignited Illumination'
monsters.magmin.ignited-illumination.description: 'The magmin sets itself ablaze or extinguishes its flames. While ablaze, the magmin sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.'

