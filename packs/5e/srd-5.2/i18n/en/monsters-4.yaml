monsters.nalfeshnee.name: 'Nalfeshnee'
monsters.nalfeshnee.demonic-restoration.name: 'Demonic Restoration'
monsters.nalfeshnee.demonic-restoration.description: 'If the nalfeshnee dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.'
monsters.nalfeshnee.magic-resistance.name: 'Magic Resistance'
monsters.nalfeshnee.magic-resistance.description: 'The nalfeshnee has Advantage on saving throws against spells and other magical effects.'
monsters.nalfeshnee.multiattack.actions.multiattack.name: 'Multiattack'
monsters.nalfeshnee.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.nalfeshnee.multiattack.name: 'Multiattack'
monsters.nalfeshnee.multiattack.description: 'The nalfeshnee makes three Rend attacks.'
monsters.nalfeshnee.rend.name: 'Rend'
monsters.nalfeshnee.rend.description: '*Melee Attack Roll:* +10, reach 10 ft. *Hit:* 16 (2d10 + 5) Slashing damage plus 11 (2d10) Force damage.'
monsters.nalfeshnee.teleport.name: 'Teleport'
monsters.nalfeshnee.teleport.description: 'The nalfeshnee teleports up to 120 feet to an unoccupied space it can see.'
monsters.nalfeshnee.horror-nimbus.name: 'Horror Nimbus'
monsters.nalfeshnee.horror-nimbus.description: "*Wisdom Saving Throw:* DC 15, each creature in a 15-foot Emanation originating from the nalfeshnee. *Failure:* 28 (8d6) Psychic damage, and the target has the Frightened condition for 1 minute, until it takes damage, or until it ends its turn with the nalfeshnee out of line of sight. *Success:* The target is immune to this nalfeshnee's Horror Nimbus for 24 hours."
monsters.nalfeshnee.pursuit.name: 'Pursuit'
monsters.nalfeshnee.pursuit.description: '*Trigger:* Another creature the nalfeshnee can see ends its move within 120 feet of the nalfeshnee. *Response:* The nalfeshnee uses Teleport, but its destination space must be within 10 feet of the triggering creature.'

monsters.night-hag.name: 'Night Hag'
monsters.night-hag.coven-magic.name: 'Coven Magic'
monsters.night-hag.coven-magic.description: "While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 14): Augury, Find Familiar, Identify, Locate Object, Scrying, or Unseen Servant. The hag must finish a Long Rest before using this trait to cast that spell again."
monsters.night-hag.magic-resistance.name: 'Magic Resistance'
monsters.night-hag.magic-resistance.description: 'The hag has Advantage on saving throws against spells and other magical effects.'
monsters.night-hag.soul-bag.name: 'Soul Bag'
monsters.night-hag.soul-bag.description: |-
  The hag has a soul bag. While holding or carrying the bag, the hag can use its Nightmare Haunting action.

  The bag has AC 15, HP 20, and Resistance to all damage. The bag turns to dust if reduced to 0 Hit Points. If the bag is destroyed, any souls the bag is holding are released. The hag can create a new bag after 7 days.
monsters.night-hag.multiattack.actions.multiattack.name: 'Multiattack'
monsters.night-hag.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.night-hag.multiattack.name: 'Multiattack'
monsters.night-hag.multiattack.description: 'The hag makes two Claw attacks.'
monsters.night-hag.claw.name: 'Claw'
monsters.night-hag.claw.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 13 (2d8 + 4) Slashing damage.'
monsters.night-hag.magic-missile.name: 'Magic Missile (level 4 version)'
monsters.night-hag.magic-missile.description: "A spell of the night hag's Spellcasting, cast at level 4."
monsters.night-hag.spellcasting.name: 'Spellcasting'
monsters.night-hag.spellcasting.description: |-
  The hag casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 14):

  *At Will:* *Detect Magic*, *Etherealness*, *Magic Missile* (level 4 version)

  *2/Day Each:* *Phantasmal Killer*, *Plane Shift* (self only)
monsters.night-hag.shape-shift.name: 'Shape-Shift'
monsters.night-hag.shape-shift.description: "The hag shape-shifts into a Small or Medium Humanoid, or it returns to its true form. Other than its size, its game statistics are the same in each form. Any equipment it is wearing or carrying isn't transformed."
monsters.night-hag.nightmare-haunting.name: 'Nightmare Haunting'
monsters.night-hag.nightmare-haunting.texts.note: 'Requires Soul Bag'
monsters.night-hag.nightmare-haunting.description: |-
  While on the Ethereal Plane, the hag casts *Dream*, using the same spellcasting ability as Spellcasting. Only the hag can serve as the spell's messenger, and the target must be a creature the hag can see on the Material Plane. The spell fails and is wasted if the target is under the effect of the *Protection from Evil and Good* spell or within a *Magic Circle* spell.

  If the target takes damage from the *Dream* spell, the target's Hit Point maximum decreases by an amount equal to that damage. If the spell kills the target, its soul is trapped in the hag's soul bag, and the target can't be raised from the dead until its soul is released.

monsters.nightmare.name: 'Nightmare'
