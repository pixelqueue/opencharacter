monsters.saber-toothed-tiger.nimble-escape.name: 'Nimble Escape'
monsters.saber-toothed-tiger.nimble-escape.description: 'The tiger takes the Disengage or Hide action.'

monsters.sahuagin-warrior.name: 'Sahuagin Warrior'
monsters.sahuagin-warrior.blood-frenzy.name: 'Blood Frenzy'
monsters.sahuagin-warrior.blood-frenzy.description: "The sahuagin has Advantage on attack rolls against any creature that doesn't have all its Hit Points."
monsters.sahuagin-warrior.limited-amphibiousness.name: 'Limited Amphibiousness'
monsters.sahuagin-warrior.limited-amphibiousness.description: 'The sahuagin can breathe air and water, but it must be submerged at least once every 4 hours to avoid suffocating outside water.'
monsters.sahuagin-warrior.shark-telepathy.name: 'Shark Telepathy'
monsters.sahuagin-warrior.shark-telepathy.description: 'The sahuagin can magically control sharks within 120 feet of itself, using a special telepathy.'
monsters.sahuagin-warrior.multiattack.actions.multiattack.name: 'Multiattack'
monsters.sahuagin-warrior.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.sahuagin-warrior.multiattack.name: 'Multiattack'
monsters.sahuagin-warrior.multiattack.description: 'The sahuagin makes two Claw attacks.'
monsters.sahuagin-warrior.claw.name: 'Claw'
monsters.sahuagin-warrior.claw.description: '*Melee Attack Roll:* +3, reach 5 ft. *Hit:* 4 (1d6 + 1) Slashing damage.'
monsters.sahuagin-warrior.aquatic-charge.name: 'Aquatic Charge'
monsters.sahuagin-warrior.aquatic-charge.description: 'The sahuagin swims up to its Swim Speed straight toward an enemy it can see.'
