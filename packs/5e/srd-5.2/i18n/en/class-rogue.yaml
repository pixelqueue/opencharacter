classes.rogue.name: 'Rogue'
classes.rogue.description: |-
  | Core Rogue Traits | |
  | --- | --- |
  | Primary Ability | Dexterity |
  | Hit Point Die | D8 per Rogue level |
  | Saving Throw Proficiencies | Dexterity and Intelligence |
  | Skill Proficiencies | *Choose 4:* Acrobatics, Athletics, Deception, Insight, Intimidation, Investigation, Perception, Persuasion, Sleight of Hand, or Stealth |
  | Weapon Proficiencies | Simple weapons and Martial weapons that have the Finesse or Light property |
  | Tool Proficiencies | Thieves’ Tools |
  | Armor Training | Light armor |
  | Starting Equipment | *Choose A or B:* (A) Leather Armor, 2 Daggers, Shortsword, Shortbow, 20 Arrows, Quiver, Thieves’ Tools, Burglar’s Pack, and 8 GP; or (B) 100 GP |

  ***As a Level 1 Character.*** Gain all the traits in the Core Rogue Traits table. Gain the Rogue’s level 1 features, which are listed in the Rogue Features table.

  ***As a Multiclass Character.*** Gain the following traits from the Core Rogue Traits table: Hit Point Die, proficiency in one skill of your choice from the Rogue’s skill list, proficiency with Thieves’ Tools, and training with Light armor. Gain the Rogue’s level 1 features, which are listed in the Rogue Features table.
classes.rogue.prerequisites.multiclass: 'Multiclassing into or out of Rogue needs Dexterity 13.'
