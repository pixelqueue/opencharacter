features.monk.martial-arts.name: 'Martial Arts'
features.monk.martial-arts.description: |-
  Your practice of martial arts gives you mastery of combat styles that use your Unarmed Strike and Monk weapons, which are the following:

  - Simple Melee weapons
  - Martial Melee weapons that have the Light property

  You gain the following benefits while you are unarmed or wielding only Monk weapons and you aren’t wearing armor or wielding a Shield.

  ***Bonus Unarmed Strike.*** You can make an Unarmed Strike as a Bonus Action.

  ***Martial Arts Die.*** You can roll 1d6 in place of the normal damage of your Unarmed Strike or Monk weapons. This die changes as you gain Monk levels, as shown in the Martial Arts column of the Monk Features table.

  ***Dexterous Attacks.*** You can use your Dexterity modifier instead of your Strength modifier for the attack and damage rolls of your Unarmed Strikes and Monk weapons. In addition, when you use the Grapple or Shove option of your Unarmed Strike, you can use your Dexterity modifier instead of your Strength modifier to determine the save DC.

features.monk.unarmored-defense.name: 'Unarmored Defense'
features.monk.unarmored-defense.description: |-
  While you aren’t wearing armor or wielding a Shield, your base Armor Class equals 10 plus your Dexterity and Wisdom modifiers.

features.monk.monks-focus.name: 'Monk’s Focus'
features.monk.monks-focus.description: |-
  Your focus and martial training allow you to harness a well of extraordinary energy within yourself. This energy is represented by Focus Points. Your Monk level determines the number of points you have, as shown in the Focus Points column of the Monk Features table.

  You can expend these points to enhance or fuel certain Monk features. You start knowing three such features: Flurry of Blows, Patient Defense, and Step of the Wind, each of which is detailed below.

  When you expend a Focus Point, it is unavailable until you finish a Short or Long Rest, at the end of which you regain all your expended points.

  Some features that use Focus Points require your target to make a saving throw. The save DC equals 8 plus your Wisdom modifier and Proficiency Bonus.

  ***Flurry of Blows.*** You can expend 1 Focus Point to make two Unarmed Strikes as a Bonus Action.

  ***Patient Defense.*** You can take the Disengage action as a Bonus Action. Alternatively, you can expend 1 Focus Point to take both the Disengage and the Dodge actions as a Bonus Action.

  ***Step of the Wind.*** You can take the Dash action as a Bonus Action. Alternatively, you can expend 1 Focus Point to take both the Disengage and Dash actions as a Bonus Action, and your jump distance is doubled for the turn.
features.monk.monks-focus.actions.flurry-of-blows.name: 'Flurry of Blows'
features.monk.monks-focus.actions.flurry-of-blows.results.spent.name: 'Focus Point expended'
features.monk.monks-focus.actions.patient-defense.name: 'Patient Defense'
features.monk.monks-focus.actions.patient-defense.results.spent.name: 'Focus Point expended'
features.monk.monks-focus.actions.step-of-the-wind.name: 'Step of the Wind'
features.monk.monks-focus.actions.step-of-the-wind.results.spent.name: 'Focus Point expended'

features.monk.unarmored-movement.name: 'Unarmored Movement'
features.monk.unarmored-movement.description: |-
  Your speed increases by 10 feet while you aren’t wearing armor or wielding a Shield. This bonus increases when you reach certain Monk levels, as shown on the Monk Features table.

features.monk.uncanny-metabolism.name: 'Uncanny Metabolism'
features.monk.uncanny-metabolism.description: |-
  When you roll Initiative, you can regain all expended Focus Points. When you do so, roll your Martial Arts die, and regain a number of Hit Points equal to your Monk level plus the number rolled.

  Once you use this feature, you can’t use it again until you finish a Long Rest.
features.monk.uncanny-metabolism.actions.uncanny-metabolism.name: 'Uncanny Metabolism'
features.monk.uncanny-metabolism.actions.uncanny-metabolism.results.healed.name: 'Focus regained and healed'

features.monk.deflect-attacks.name: 'Deflect Attacks'
features.monk.deflect-attacks.description: |-
  When an attack roll hits you and its damage includes Bludgeoning, Piercing, or Slashing damage, you can take a Reaction to reduce the attack’s total damage against you. The reduction equals 1d10 plus your Dexterity modifier and Monk level.

  If you reduce the damage to 0, you can expend 1 Focus Point to redirect some of the attack’s force. If you do so, choose a creature you can see within 5 feet of yourself if the attack was a melee attack or a creature you can see within 60 feet of yourself that isn’t behind Total Cover if the attack was a ranged attack. That creature must succeed on a Dexterity saving throw or take damage equal to two rolls of your Martial Arts die plus your Dexterity modifier. The damage is the same type dealt by the attack.
features.monk.deflect-attacks.actions.deflect-attacks.name: 'Deflect Attacks'
features.monk.deflect-attacks.actions.deflect-attacks.params.damage.name: 'The attack’s damage'
features.monk.deflect-attacks.actions.deflect-attacks.results.deflected.name: 'Deflected'
features.monk.deflect-attacks.actions.deflect-attacks.results.redirected.name: 'Redirected'
features.monk.deflect-attacks.actions.deflect-attacks.steps.redirect.prompt: 'Expend 1 Focus Point to redirect the attack?'
features.monk.deflect-attacks.actions.deflect-attacks.options.keep.name: "Don't redirect"
features.monk.deflect-attacks.actions.deflect-attacks.options.redirect.name: 'Redirect'

features.monk.ability-score-improvement.name: 'Ability Score Improvement'
features.monk.ability-score-improvement.description: |-
  You gain the Ability Score Improvement feat (see “Feats”) or another feat of your choice for which you qualify. You gain this feature again at Monk levels 8, 12, and 16.
features.monk.ability-score-improvement.choices.feat.prompt: 'Choose a feat (Monk level {slot})'

features.monk.slow-fall.name: 'Slow Fall'
features.monk.slow-fall.description: |-
  You can take a Reaction when you fall to reduce any damage you take from the fall by an amount equal to five times your Monk level.
features.monk.slow-fall.actions.slow-fall.name: 'Fall with Slow Fall'
features.monk.slow-fall.actions.slow-fall.params.feet.name: 'Feet fallen'
features.monk.slow-fall.actions.slow-fall.results.fell.name: 'Fell'
features.monk.slow-fall.actions.slow-fall.results.landed.name: 'Landed unhurt'

features.monk.stunning-strike.name: 'Stunning Strike'
features.monk.stunning-strike.description: |-
  Once per turn when you hit a creature with a Monk weapon or an Unarmed Strike, you can expend 1 Focus Point to attempt a stunning strike. The target must make a Constitution saving throw. On a failed save, the target has the Stunned condition until the start of your next turn. On a successful save, the target’s Speed is halved until the start of your next turn, and the next attack roll made against the target before then has Advantage.
features.monk.stunning-strike.actions.stunning-strike.name: 'Stunning Strike'
features.monk.stunning-strike.actions.stunning-strike.results.stunning.name: 'Stunning strike'

features.monk.empowered-strikes.name: 'Empowered Strikes'
features.monk.empowered-strikes.description: |-
  Whenever you deal damage with your Unarmed Strike, it can deal your choice of Force damage or its normal damage type.
features.monk.empowered-strikes.options.force.name: 'Force damage'

features.monk.evasion.name: 'Evasion'
features.monk.evasion.description: |-
  When you’re subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw and only half damage if you fail.

  You don’t benefit from this feature if you have the Incapacitated condition.

features.monk.acrobatic-movement.name: 'Acrobatic Movement'
features.monk.acrobatic-movement.description: |-
  While you aren’t wearing armor or wielding a Shield, you gain the ability to move along vertical surfaces and across liquids on your turn without falling during the movement.

features.monk.heightened-focus.name: 'Heightened Focus'
features.monk.heightened-focus.description: |-
  Your Flurry of Blows, Patient Defense, and Step of the Wind gain the following benefits.

  ***Flurry of Blows.*** You can expend 1 Focus Point to use Flurry of Blows and make three Unarmed Strikes with it instead of two.

  ***Patient Defense.*** When you expend a Focus Point to use Patient Defense, you gain a number of Temporary Hit Points equal to two rolls of your Martial Arts die.

  ***Step of the Wind.*** When you expend a Focus Point to use Step of the Wind, you can choose a willing creature within 5 feet of yourself that is Large or smaller. You move the creature with you until the end of your turn. The creature’s movement doesn’t provoke Opportunity Attacks.

features.monk.self-restoration.name: 'Self-Restoration'
features.monk.self-restoration.description: |-
  Through sheer force of will, you can remove one of the following conditions from yourself at the end of each of your turns: Charmed, Frightened, or Poisoned.

  In addition, forgoing food and drink doesn’t give you levels of Exhaustion.
features.monk.self-restoration.actions.self-restoration.name: 'Self-Restoration'
features.monk.self-restoration.actions.self-restoration.params.condition.name: 'Condition'
features.monk.self-restoration.actions.self-restoration.results.ended.name: 'Condition ended'

features.monk.deflect-energy.name: 'Deflect Energy'
features.monk.deflect-energy.description: |-
  You can now use your Deflect Attacks feature against attacks that deal any damage type, not just Bludgeoning, Piercing, or Slashing.

features.monk.disciplined-survivor.name: 'Disciplined Survivor'
features.monk.disciplined-survivor.description: |-
  Your physical and mental discipline grant you proficiency in all saving throws.

  Additionally, whenever you make a saving throw and fail, you can expend 1 Focus Point to reroll it, and you must use the new roll.
features.monk.disciplined-survivor.options.reroll.name: 'Disciplined Survivor: reroll (1 Focus Point)'

features.monk.perfect-focus.name: 'Perfect Focus'
features.monk.perfect-focus.description: |-
  When you roll Initiative and don’t use Uncanny Metabolism, you regain expended Focus Points until you have 4 if you have 3 or fewer.

features.monk.superior-defense.name: 'Superior Defense'
features.monk.superior-defense.description: |-
  At the start of your turn, you can expend 3 Focus Points to bolster yourself against harm for 1 minute or until you have the Incapacitated condition. During that time, you have Resistance to all damage except Force damage.
features.monk.superior-defense.actions.superior-defense.name: 'Superior Defense'
features.monk.superior-defense.actions.superior-defense.results.bolstered.name: 'Bolstered'
features.monk.superior-defense.actions.end-superior-defense.name: 'End Superior Defense'
features.monk.superior-defense.actions.end-superior-defense.results.ended.name: 'Ended'
features.monk.superior-defense.followUps.incapacitated.name: 'Incapacitated: Superior Defense ends'

features.monk.epic-boon.name: 'Epic Boon'
features.monk.epic-boon.description: |-
  You gain an Epic Boon feat (see “Feats”) or another feat of your choice for which you qualify. Boon of Irresistible Offense is recommended.
features.monk.epic-boon.choices.feat.prompt: 'Choose an Epic Boon or another feat'

features.monk.body-and-mind.name: 'Body and Mind'
features.monk.body-and-mind.description: |-
  You have developed your body and mind to new heights. Your Dexterity and Wisdom scores increase by 4, to a maximum of 25.

subclasses.warrior-of-the-open-hand.name: 'Warrior of the Open Hand'
subclasses.warrior-of-the-open-hand.description: |-
  **Master Unarmed Combat Techniques**

  Warriors of the Open Hand are masters of unarmed combat. They learn techniques to push and trip their opponents and manipulate their own energy to protect themselves from harm.

features.monk.open-hand-technique.name: 'Open Hand Technique'
features.monk.open-hand-technique.description: |-
  Whenever you hit a creature with an attack granted by your Flurry of Blows, you can impose one of the following effects on that target.

  ***Addle.*** The target can’t make Opportunity Attacks until the start of its next turn.

  ***Push.*** The target must succeed on a Strength saving throw or be pushed up to 15 feet away from you.

  ***Topple.*** The target must succeed on a Dexterity saving throw or have the Prone condition.
features.monk.open-hand-technique.actions.open-hand-technique.name: 'Open Hand Technique'
features.monk.open-hand-technique.actions.open-hand-technique.params.technique.name: 'Effect'
features.monk.open-hand-technique.actions.open-hand-technique.params.technique.values.addle.name: 'Addle'
features.monk.open-hand-technique.actions.open-hand-technique.params.technique.values.push.name: 'Push'
features.monk.open-hand-technique.actions.open-hand-technique.params.technique.values.topple.name: 'Topple'
features.monk.open-hand-technique.actions.open-hand-technique.results.addle.name: 'Addled'
features.monk.open-hand-technique.actions.open-hand-technique.results.push.name: 'Push'
features.monk.open-hand-technique.actions.open-hand-technique.results.topple.name: 'Topple'

features.monk.wholeness-of-body.name: 'Wholeness of Body'
features.monk.wholeness-of-body.description: |-
  You gain the ability to heal yourself. As a Bonus Action, you can roll your Martial Arts die. You regain a number of Hit Points equal to the number rolled plus your Wisdom modifier (minimum of 1 Hit Point regained).

  You can use this feature a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.
features.monk.wholeness-of-body.actions.wholeness-of-body.name: 'Wholeness of Body'
features.monk.wholeness-of-body.actions.wholeness-of-body.results.healed.name: 'Healed'

features.monk.fleet-step.name: 'Fleet Step'
features.monk.fleet-step.description: |-
  When you take a Bonus Action other than Step of the Wind, you can also use Step of the Wind immediately after that Bonus Action.

features.monk.quivering-palm.name: 'Quivering Palm'
features.monk.quivering-palm.description: |-
  You gain the ability to set up lethal vibrations in someone’s body. When you hit a creature with an Unarmed Strike, you can expend 4 Focus Points to start these imperceptible vibrations, which last for a number of days equal to your Monk level. The vibrations are harmless unless you take an action to end them. Alternatively, when you take the Attack action on your turn, you can forgo one of the attacks to end the vibrations. To end them, you and the target must be on the same plane of existence. When you end them, the target must make a Constitution saving throw, taking 10d12 Force damage on a failed save or half as much damage on a successful one.

  You can have only one creature under the effect of this feature at a time. You can end the vibrations harmlessly (no action required).
features.monk.quivering-palm.actions.quivering-palm.name: 'Quivering Palm'
features.monk.quivering-palm.actions.quivering-palm.results.set.name: 'Vibrations started'
features.monk.quivering-palm.actions.end-quivering-palm.name: 'End the vibrations'
features.monk.quivering-palm.actions.end-quivering-palm.results.ended.name: 'Vibrations ended'
