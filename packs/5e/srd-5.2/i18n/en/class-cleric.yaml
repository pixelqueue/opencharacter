features.cleric.greater-divine-intervention.actions.wish-rests.results.rolled.name: 'Rolled'

subclasses.life-domain.name: 'Life Domain'
subclasses.life-domain.description: |-
  ***Soothe the Hurts of the World***

  The Life Domain focuses on the positive energy that helps sustain all life in the multiverse. Clerics who tap into this domain are masters of healing, using that life force to cure many hurts.

  Existence itself relies on the positive energy associated with this domain, so a Cleric of almost any religious tradition might choose it. This domain is particularly associated with agricultural deities, gods of healing or endurance, and gods of home and community. Religious orders of healing also seek the magic of this domain.

features.cleric.disciple-of-life.name: 'Disciple of Life'
features.cleric.disciple-of-life.description: "When a spell you cast with a spell slot restores Hit Points to a creature, that creature regains additional Hit Points on the turn you cast the spell. The additional Hit Points equal 2 plus the spell slot's level."

features.cleric.life-domain-spells.name: 'Life Domain Spells'
features.cleric.life-domain-spells.description: |-
  Your connection to this divine domain ensures you always have certain spells ready. When you reach a Cleric level specified in the Life Domain Spells table, you thereafter always have the listed spells prepared.

  | Cleric Level | Prepared Spells |
  | --- | --- |
  | 3 | *Aid*, *Bless*, *Cure Wounds*, *Lesser Restoration* |
  | 5 | *Mass Healing Word*, *Revivify* |
  | 7 | *Aura of Life*, *Death Ward* |
  | 9 | *Greater Restoration*, *Mass Cure Wounds* |

features.cleric.preserve-life.name: 'Preserve Life'
features.cleric.preserve-life.description: 'As a Magic action, you present your Holy Symbol and expend a use of your Channel Divinity to evoke healing energy that can restore a number of Hit Points equal to five times your Cleric level. Choose Bloodied creatures within 30 feet of yourself (which can include you), and divide those Hit Points among them. This feature can restore a creature to no more than half its Hit Point maximum.'
features.cleric.preserve-life.actions.preserve-life.name: 'Preserve Life'
features.cleric.preserve-life.actions.preserve-life.results.healing.name: 'Hit Points to divide'

features.cleric.blessed-healer.name: 'Blessed Healer'
features.cleric.blessed-healer.description: "The healing spells you cast on others heal you as well. Immediately after you cast a spell with a spell slot that restores Hit Points to one or more creatures other than yourself, you regain Hit Points equal to 2 plus the spell slot's level."

features.cleric.supreme-healing.name: 'Supreme Healing'
features.cleric.supreme-healing.description: "When you would normally roll one or more dice to restore Hit Points to a creature with a spell or Channel Divinity, don't roll those dice for the healing; instead use the highest number possible for each die. For example, instead of restoring 2d6 Hit Points to a creature with a spell, you restore 12."
