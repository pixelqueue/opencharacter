features.cleric.ability-score-improvement.name: 'Ability Score Improvement'
features.cleric.ability-score-improvement.description: 'You gain the Ability Score Improvement feat or another feat of your choice for which you qualify. You gain this feature again at Cleric levels 8, 12, and 16.'
features.cleric.ability-score-improvement.choices.feat.prompt: 'Choose a feat (level {slot})'

features.cleric.sear-undead.name: 'Sear Undead'
features.cleric.sear-undead.description: "Whenever you use Turn Undead, you can roll a number of d8s equal to your Wisdom modifier (minimum of 1d8) and add the rolls together. Each Undead that fails its saving throw against that use of Turn Undead takes Radiant damage equal to the roll's total. This damage doesn't end the turn effect."

features.cleric.blessed-strikes.name: 'Blessed Strikes'
features.cleric.blessed-strikes.description: |-
  Divine power infuses you in battle. You gain one of the following options of your choice (if you get either option from a Cleric subclass in an older book, use only the option you choose for this feature).

  ***Divine Strike.*** Once on each of your turns when you hit a creature with an attack roll using a weapon, you can cause the target to take an extra 1d8 Necrotic or Radiant damage (your choice).

  ***Potent Spellcasting.*** Add your Wisdom modifier to the damage you deal with any Cleric cantrip.
features.cleric.blessed-strikes.choices.option.prompt: 'Choose a Blessed Strikes option'
features.cleric.blessed-strikes.choices.option.options.divine-strike.name: 'Divine Strike'
features.cleric.blessed-strikes.choices.option.options.potent-spellcasting.name: 'Potent Spellcasting'

features.cleric.divine-intervention.name: 'Divine Intervention'
features.cleric.divine-intervention.description: "You can call on your deity or pantheon to intervene on your behalf. As a Magic action, choose any Cleric spell of level 5 or lower that doesn't require a Reaction to cast. As part of the same action, you cast that spell without expending a spell slot or needing Material components. You can't use this feature again until you finish a Long Rest."
features.cleric.divine-intervention.options.divine-intervention.name: 'Divine Intervention'

features.cleric.improved-blessed-strikes.name: 'Improved Blessed Strikes'
features.cleric.improved-blessed-strikes.description: |-
  The option you chose for Blessed Strikes grows more powerful.

  ***Divine Strike.*** The extra damage of your Divine Strike increases to 2d8.

  ***Potent Spellcasting.*** When you cast a Cleric cantrip and deal damage to a creature with it, you can give vitality to yourself or another creature within 60 feet of yourself, granting a number of Temporary Hit Points equal to twice your Wisdom modifier.
features.cleric.improved-blessed-strikes.actions.potent-spellcasting.name: 'Potent Spellcasting: give vitality'
features.cleric.improved-blessed-strikes.actions.potent-spellcasting.results.granted.name: 'Temporary Hit Points granted'

features.cleric.epic-boon.name: 'Epic Boon'
features.cleric.epic-boon.description: 'You gain an Epic Boon feat or another feat of your choice for which you qualify. Boon of Fate is recommended.'
features.cleric.epic-boon.choices.feat.prompt: 'Choose an Epic Boon or another feat'

features.cleric.greater-divine-intervention.name: 'Greater Divine Intervention'
features.cleric.greater-divine-intervention.description: "You can call on even more powerful divine intervention. When you use your Divine Intervention feature, you can choose *Wish* when you select a spell. If you do so, you can't use Divine Intervention again until you finish 2d4 Long Rests."
features.cleric.greater-divine-intervention.options.wish.name: 'Greater Divine Intervention'
