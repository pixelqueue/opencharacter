features.wizard.arcane-recovery.actions.arcane-recovery.results.too-many.name: 'Too many levels, or slots not expended'

features.wizard.scholar.name: 'Scholar'
features.wizard.scholar.description: 'While studying magic, you also specialized in another field of study. Choose one of the following skills in which you have proficiency: Arcana, History, Investigation, Medicine, Nature, or Religion. You have Expertise in the chosen skill.'
features.wizard.scholar.choices.expertise.prompt: 'Choose a skill for Expertise'

features.wizard.ability-score-improvement.name: 'Ability Score Improvement'
features.wizard.ability-score-improvement.description: 'You gain the Ability Score Improvement feat (see “Feats”) or another feat of your choice for which you qualify. You gain this feature again at Wizard levels 8, 12, and 16.'
features.wizard.ability-score-improvement.choices.feat.prompt: 'Choose a feat (level {slot})'

features.wizard.memorize-spell.name: 'Memorize Spell'
features.wizard.memorize-spell.description: 'Whenever you finish a Short Rest, you can study your spellbook and replace one of the level 1+ Wizard spells you have prepared for your Spellcasting feature with another level 1+ spell from the book.'

features.wizard.spell-mastery.name: 'Spell Mastery'
features.wizard.spell-mastery.description: |-
  You have achieved such mastery over certain spells that you can cast them at will. Choose a level 1 and a level 2 spell in your spellbook that have a casting time of an action. You always have those spells prepared, and you can cast them at their lowest level without expending a spell slot. To cast either spell at a higher level, you must expend a spell slot.

  Whenever you finish a Long Rest, you can study your spellbook and replace one of those spells with an eligible spell of the same level from the book.
features.wizard.spell-mastery.choices.spell.prompt: 'Choose a level {slot} spell to master'
features.wizard.spell-mastery.options.spell-mastery.name: 'Spell Mastery (no slot)'

features.wizard.epic-boon.name: 'Epic Boon'
features.wizard.epic-boon.description: 'You gain an Epic Boon feat (see “Feats”) or another feat of your choice for which you qualify. Boon of Spell Recall is recommended.'
features.wizard.epic-boon.choices.feat.prompt: 'Choose an Epic Boon or another feat'

features.wizard.signature-spells.name: 'Signature Spells'
features.wizard.signature-spells.description: 'Choose two level 3 spells in your spellbook as your signature spells. You always have these spells prepared, and you can cast each of them once at level 3 without expending a spell slot. When you do so, you can’t cast them in this way again until you finish a Short or Long Rest. To cast either spell at a higher level, you must expend a spell slot.'
features.wizard.signature-spells.choices.first.prompt: 'Choose your first signature spell'
features.wizard.signature-spells.choices.second.prompt: 'Choose your second signature spell'
features.wizard.signature-spells.options.first.name: 'Signature spell (no slot)'
features.wizard.signature-spells.options.second.name: 'Signature spell (no slot)'

subclasses.evoker.name: 'Evoker'
subclasses.evoker.description: |-
  **Create Explosive Elemental Effects**

  Your studies focus on magic that creates powerful elemental effects such as bitter cold, searing flame, rolling thunder, crackling lightning, and burning acid. Some Evokers find employment in military forces, serving as artillery to blast armies from afar. Others use their power to protect others, while some seek their own gain.

features.wizard.evocation-savant.name: 'Evocation Savant'
features.wizard.evocation-savant.description: |-
  Choose two Wizard spells from the Evocation school, each of which must be no higher than level 2, and add them to your spellbook for free.

  In addition, whenever you gain access to a new level of spell slots in this class, you can add one Wizard spell from the Evocation school to your spellbook for free. The chosen spell must be of a level for which you have spell slots.
features.wizard.evocation-savant.choices.spells.prompt: 'Choose two Evocation spells for your spellbook'
features.wizard.evocation-savant.choices.new-level.prompt: 'Choose an Evocation spell for your spellbook (Wizard level {slot})'

features.wizard.potent-cantrip.name: 'Potent Cantrip'
features.wizard.potent-cantrip.description: 'Your damaging cantrips affect even creatures that avoid the brunt of the effect. When you cast a cantrip at a creature and you miss with the attack roll or the target succeeds on a saving throw against the cantrip, the target takes half the cantrip’s damage (if any) but suffers no additional effect from the cantrip.'

features.wizard.sculpt-spells.name: 'Sculpt Spells'
features.wizard.sculpt-spells.description: 'You can create pockets of relative safety within the effects of your evocations. When you cast an Evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 plus the spell’s level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save.'
features.wizard.sculpt-spells.options.spare.name: 'Spare this creature (Sculpt Spells)'

features.wizard.empowered-evocation.name: 'Empowered Evocation'
features.wizard.empowered-evocation.description: 'Whenever you cast a Wizard spell from the Evocation school, you can add your Intelligence modifier to one damage roll of that spell.'

features.wizard.overchannel.name: 'Overchannel'
features.wizard.overchannel.description: |-
  You can increase the power of your spells. When you cast a Wizard spell with a spell slot of levels 1–5 that deals damage, you can deal maximum damage with that spell on the turn you cast it.

  The first time you do so, you suffer no adverse effect. If you use this feature again before you finish a Long Rest, you take 2d12 Necrotic damage for each level of the spell slot immediately after you cast it. This damage ignores Resistance and Immunity.

  Each time you use this feature again before finishing a Long Rest, the Necrotic damage per spell level increases by 1d12.
features.wizard.overchannel.actions.overchannel.name: 'Overchannel'
features.wizard.overchannel.actions.overchannel.params.slot.name: 'Spell slot level'
features.wizard.overchannel.actions.overchannel.results.overchanneled.name: 'Overchanneled'
situational.overchannel.name: 'Overchannel (maximum damage)'
