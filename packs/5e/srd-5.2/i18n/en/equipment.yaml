tags.simple.description: 'Simple weapons. Weapon proficiencies are usually tied to a category: Simple or Martial.'
tags.martial.description: 'Martial weapons. Weapon proficiencies are usually tied to a category: Simple or Martial.'
tags.melee.description: 'A Melee weapon is used to attack a target within 5 feet.'
tags.ranged.description: 'A Ranged weapon is used to attack at a greater distance.'
tags.ammunition.description: "You can use a weapon that has the Ammunition property to make a ranged attack only if you have ammunition to fire from it. The type of ammunition required is specified with the weapon's range. Each attack expends one piece of ammunition. Drawing the ammunition is part of the attack (you need a free hand to load a one-handed weapon). After a fight, you can spend 1 minute to recover half the ammunition (round down) you used in the fight; the rest is lost."
tags.finesse.description: 'When making an attack with a Finesse weapon, use your choice of your Strength or Dexterity modifier for the attack and damage rolls. You must use the same modifier for both rolls.'
tags.property.heavy.description: "You have Disadvantage on attack rolls with a Heavy weapon if it's a Melee weapon and your Strength score isn't at least 13 or if it's a Ranged weapon and your Dexterity score isn't at least 13."
tags.property.light.description: "When you take the Attack action on your turn and attack with a Light weapon, you can make one extra attack as a Bonus Action later on the same turn. That extra attack must be made with a different Light weapon, and you don't add your ability modifier to the extra attack's damage unless that modifier is negative. For example, you can attack with a Shortsword in one hand and a Dagger in the other using the Attack action and a Bonus Action, but you don't add your Strength or Dexterity modifier to the damage roll of the Bonus Action unless that modifier is negative."
tags.loading.description: 'You can fire only one piece of ammunition from a Loading weapon when you use an action, a Bonus Action, or a Reaction to fire it, regardless of the number of attacks you can normally make.'
tags.property.range.description: "A Range weapon has a range in parentheses after the Ammunition or Thrown property. The range lists two numbers. The first is the weapon's normal range in feet, and the second is the weapon's long range. When attacking a target beyond normal range, you have Disadvantage on the attack roll. You can't attack a target beyond the long range."
tags.reach.description: 'A Reach weapon adds 5 feet to your reach when you attack with it, as well as when determining your reach for Opportunity Attacks with it.'
tags.thrown.description: 'If a weapon has the Thrown property, you can throw the weapon to make a ranged attack, and you can draw that weapon as part of the attack. If the weapon is a Melee weapon, use the same ability modifier for the attack and damage rolls that you use for a melee attack with that weapon.'
tags.two-handed.description: 'A Two-Handed weapon requires two hands when you attack with it.'
tags.versatile.description: 'A Versatile weapon can be used with one or two hands. A damage value in parentheses appears with the property. The weapon deals that damage when used with two hands to make a melee attack.'
tags.arcane-focus.name: 'Arcane Focus'
tags.arcane-focus.description: 'A Sorcerer, Warlock, or Wizard can use it as a Spellcasting Focus.'
tags.druidic-focus.name: 'Druidic Focus'
tags.druidic-focus.description: 'A Druid or Ranger can use it as a Spellcasting Focus.'

types.weapon.fields.mastery.description: 'Usable only by a character who has a feature, such as Weapon Mastery, that unlocks the property.'
tags.mastery.name: 'Mastery property'
tags.mastery.cleave.name: 'Cleave'
tags.mastery.graze.name: 'Graze'
tags.mastery.nick.name: 'Nick'
tags.mastery.push.name: 'Push'
tags.mastery.sap.name: 'Sap'
tags.mastery.slow.name: 'Slow'
tags.mastery.topple.name: 'Topple'
tags.mastery.vex.name: 'Vex'
types.weapon.fields.mastery.values.cleave.name: 'Cleave'
tags.mastery.cleave.description: "If you hit a creature with a melee attack roll using this weapon, you can make a melee attack roll with the weapon against a second creature within 5 feet of the first that is also within your reach. On a hit, the second creature takes the weapon's damage, but don't add your ability modifier to that damage unless that modifier is negative. You can make this extra attack only once per turn."
types.weapon.fields.mastery.values.graze.name: 'Graze'
tags.mastery.graze.description: 'If your attack roll with this weapon misses a creature, you can deal damage to that creature equal to the ability modifier you used to make the attack roll. This damage is the same type dealt by the weapon, and the damage can be increased only by increasing the ability modifier.'
types.weapon.fields.mastery.values.nick.name: 'Nick'
tags.mastery.nick.description: 'When you make the extra attack of the Light property, you can make it as part of the Attack action instead of as a Bonus Action. You can make this extra attack only once per turn.'
types.weapon.fields.mastery.values.push.name: 'Push'
tags.mastery.push.description: 'If you hit a creature with this weapon, you can push the creature up to 10 feet straight away from yourself if it is Large or smaller.'
types.weapon.fields.mastery.values.sap.name: 'Sap'
tags.mastery.sap.description: 'If you hit a creature with this weapon, that creature has Disadvantage on its next attack roll before the start of your next turn.'
types.weapon.fields.mastery.values.slow.name: 'Slow'
tags.mastery.slow.description: "If you hit a creature with this weapon and deal damage to it, you can reduce its Speed by 10 feet until the start of your next turn. If the creature is hit more than once by weapons that have this property, the Speed reduction doesn't exceed 10 feet."
types.weapon.fields.mastery.values.topple.name: 'Topple'
tags.mastery.topple.description: 'If you hit a creature with this weapon, you can force the creature to make a Constitution saving throw (DC 8 plus the ability modifier used to make the attack roll and your Proficiency Bonus). On a failed save, the creature has the Prone condition.'
types.weapon.fields.mastery.values.vex.name: 'Vex'
tags.mastery.vex.description: 'If you hit a creature with this weapon and deal damage to the creature, you have Advantage on your next attack roll against that creature before the end of your next turn.'

