types.monsterAction.name: 'Monster trait or action'
# The entry's name with its limited usage, as the stat block prints it.
types.monsterAction.block: >-
  ***{name}{has_perDay, select,
    true { ({perDay}/Day{has_perDayLair, select, true {, or {perDayLair}/Day in Lair} other {}})}
    other {}}{has_recharge, select,
    true { (Recharge {recharge, select, 6 {6} other {{recharge}–6}})}
    other {}}{perRest, select, true { (Recharge after a Short or Long Rest)} other {}}{has_texts_note, select,
    true { ({texts_note})} other {}}.***
