monsters.iron-golem.multiattack.actions.multiattack.options.fiery-bolt.name: 'Fiery Bolt'
monsters.iron-golem.multiattack.name: 'Multiattack'
monsters.iron-golem.multiattack.description: 'The golem makes two attacks, using Bladed Arm or Fiery Bolt in any combination.'
