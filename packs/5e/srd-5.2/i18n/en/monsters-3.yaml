monsters.invisible-stalker.air-form.description: "The stalker can enter an enemy's space and stop there. It can move through a space as narrow as 1 inch without expending extra movement to do so."
monsters.invisible-stalker.invisibility.name: 'Invisibility'
monsters.invisible-stalker.invisibility.description: 'The stalker has the Invisible condition.'
