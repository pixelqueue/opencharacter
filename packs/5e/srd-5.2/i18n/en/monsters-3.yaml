monsters.knight.heavy-crossbow.name: 'Heavy Crossbow'
monsters.knight.heavy-crossbow.description: '*Ranged Attack Roll:* +2, range 100/400 ft. *Hit:* 11 (2d10) Piercing damage plus 4 (1d8) Radiant damage.'
monsters.knight.parry.name: 'Parry'
monsters.knight.parry.description: '*Trigger:* The knight is hit by a melee attack roll while holding a weapon. *Response:* The knight adds 2 to its AC against that attack, possibly causing it to miss.'

monsters.kobold-warrior.name: 'Kobold Warrior'
monsters.kobold-warrior.pack-tactics.name: 'Pack Tactics'
monsters.kobold-warrior.pack-tactics.description: "The kobold has Advantage on an attack roll against a creature if at least one of the kobold's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."
monsters.kobold-warrior.sunlight-sensitivity.name: 'Sunlight Sensitivity'
monsters.kobold-warrior.sunlight-sensitivity.description: 'While in sunlight, the kobold has Disadvantage on ability checks and attack rolls.'
monsters.kobold-warrior.dagger.name: 'Dagger'
monsters.kobold-warrior.dagger.description: '*Melee or Ranged Attack Roll:* +4, reach 5 ft. or range 20/60 ft. *Hit:* 4 (1d4 + 2) Piercing damage.'

monsters.kraken.name: 'Kraken'
monsters.kraken.amphibious.name: 'Amphibious'
monsters.kraken.amphibious.description: 'The kraken can breathe air and water.'
monsters.kraken.legendary-resistance.name: 'Legendary Resistance'
monsters.kraken.legendary-resistance.description: 'If the kraken fails a saving throw, it can choose to succeed instead.'
monsters.kraken.siege-monster.name: 'Siege Monster'
monsters.kraken.siege-monster.description: 'The kraken deals double damage to objects and structures.'
monsters.kraken.multiattack.actions.multiattack.name: 'Multiattack'
monsters.kraken.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.kraken.multiattack.name: 'Multiattack'
monsters.kraken.multiattack.description: 'The kraken makes two Tentacle attacks and uses Fling, Lightning Strike, or Swallow.'
monsters.kraken.tentacle.name: 'Tentacle'
monsters.kraken.tentacle.description: '*Melee Attack Roll:* +17, reach 30 ft. *Hit:* 24 (4d6 + 10) Bludgeoning damage. The target has the Grappled condition (escape DC 20) from one of ten tentacles, and it has the Restrained condition until the grapple ends.'
monsters.kraken.fling.name: 'Fling'
monsters.kraken.fling.description: "The kraken throws a Large or smaller creature Grappled by it to a space it can see within 60 feet of itself that isn't in the air. *Dexterity Saving Throw:* DC 25, the creature thrown and each creature in the destination space. *Failure:* 18 (4d8) Bludgeoning damage, and the target has the Prone condition. *Success:* Half damage only."
monsters.kraken.lightning-strike.name: 'Lightning Strike'
monsters.kraken.lightning-strike.description: '*Dexterity Saving Throw:* DC 23, one creature the kraken can see within 120 feet. *Failure:* 33 (6d10) Lightning damage. *Success:* Half damage.'
monsters.kraken.swallow.name: 'Swallow'
monsters.kraken.swallow.description: |-
  *Dexterity Saving Throw:* DC 25, one creature Grappled by the kraken (it can have up to four creatures swallowed at a time). *Failure:* 23 (3d8 + 10) Piercing damage. If the target is Large or smaller, it is swallowed and no longer Grappled. A swallowed creature has the Restrained condition, has Total Cover against attacks and other effects outside the kraken, and takes 24 (7d6) Acid damage at the start of each of its turns.

  If the kraken takes 50 damage or more on a single turn from a creature inside it, the kraken must succeed on a DC 25 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 10 feet of the kraken with the Prone condition. If the kraken dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse using 15 feet of movement, exiting Prone.
monsters.kraken.storm-bolt.name: 'Storm Bolt'
monsters.kraken.storm-bolt.description: 'The kraken uses Lightning Strike.'
monsters.kraken.toxic-ink.name: 'Toxic Ink'
monsters.kraken.toxic-ink.description: "*Constitution Saving Throw:* DC 23, each creature in a 15-foot Emanation originating from the kraken while it is underwater. *Failure:* The target has the Blinded and Poisoned conditions until the end of the kraken's next turn. The kraken then moves up to its Speed. *Failure or Success:* The kraken can't take this action again until the start of its next turn."
monsters.kraken.texts.legendary: "Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the kraken can expend a use to take one of the following actions. The kraken regains all expended uses at the start of each of its turns."
monsters.kraken.multiattack.actions.multiattack.steps.extra.prompt: 'Also use'
