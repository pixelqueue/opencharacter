monsters.lich.spirit-jar.name: 'Spirit Jar'
monsters.lich.spirit-jar.description: "If destroyed, the lich reforms in 1d10 days if it has a spirit jar, reviving with all its Hit Points. The new body appears in an unoccupied space within the lich's lair."
monsters.lich.multiattack.actions.multiattack.name: 'Multiattack'
