monsters.gorgon.petrifying-breath.description: '*Constitution Saving Throw:* DC 15, each creature in a 30-foot Cone. *First Failure:* The target has the Restrained condition and repeats the save at the end of its next turn if it is still Restrained, ending the effect on itself on a success. *Second Failure:* The target has the Petrified condition instead of the Restrained condition.'
monsters.gorgon.trample.name: 'Trample'
monsters.gorgon.trample.description: '*Dexterity Saving Throw:* DC 16, one creature within 5 feet that has the Prone condition. *Failure:* 16 (2d10 + 5) Bludgeoning damage. *Success:* Half damage.'
