monsters.horned-devil.multiattack.description: 'The devil makes three attacks, using Searing Fork or Hurl Flame in any combination. It can replace one attack with a use of Infernal Tail.'
monsters.horned-devil.searing-fork.name: 'Searing Fork'
monsters.horned-devil.searing-fork.description: '*Melee Attack Roll:* +10, reach 10 ft. *Hit:* 15 (2d8 + 6) Piercing damage plus 9 (2d8) Fire damage.'
monsters.horned-devil.hurl-flame.name: 'Hurl Flame'
monsters.horned-devil.hurl-flame.description: "*Ranged Attack Roll:* +8, range 150 ft. *Hit:* 26 (5d8 + 4) Fire damage. If the target is a flammable object that isn't being worn or carried, it starts burning."
monsters.horned-devil.infernal-tail.name: 'Infernal Tail'
monsters.horned-devil.infernal-tail.description: "*Dexterity Saving Throw:* DC 17, one creature the devil can see within 10 feet. *Failure:* 10 (1d8 + 6) Necrotic damage, and the target receives an infernal wound if it doesn't have one. While wounded, the target loses 10 (3d6) Hit Points at the start of each of its turns. The wound closes after 1 minute, after a spell restores Hit Points to the target, or after the target or a creature within 5 feet of it takes an action to stanch the wound, doing so by succeeding on a DC 17 Wisdom (Medicine) check."

monsters.hunter-shark.name: 'Hunter Shark'
monsters.hunter-shark.water-breathing.name: 'Water Breathing'
monsters.hunter-shark.water-breathing.description: 'The shark can breathe only underwater.'
monsters.hunter-shark.bite.name: 'Bite'
monsters.hunter-shark.bite.description: "*Melee Attack Roll:* +6 (with Advantage if the target doesn't have all its Hit Points), reach 5 ft. *Hit:* 14 (3d6 + 4) Piercing damage."

monsters.hydra.name: 'Hydra'
monsters.hydra.hold-breath.name: 'Hold Breath'
monsters.hydra.hold-breath.description: 'The hydra can hold its breath for 1 hour.'
monsters.hydra.multiple-heads.name: 'Multiple Heads'
monsters.hydra.multiple-heads.description: 'The hydra has five heads. Whenever the hydra takes 25 damage or more on a single turn, one of its heads dies. The hydra dies if all its heads are dead. At the end of each of its turns when it has at least one living head, the hydra grows two heads for each of its heads that died since its last turn, unless it has taken Fire damage since its last turn. The hydra regains 20 Hit Points when it grows new heads.'
monsters.hydra.reactive-heads.name: 'Reactive Heads'
monsters.hydra.reactive-heads.description: 'For each head the hydra has beyond one, it gets an extra Reaction that can be used only for Opportunity Attacks.'
monsters.hydra.multiattack.name: 'Multiattack'
monsters.hydra.multiattack.description: 'The hydra makes as many Bite attacks as it has heads.'
monsters.hydra.bite.name: 'Bite'
monsters.hydra.bite.description: '*Melee Attack Roll:* +8, reach 10 ft. *Hit:* 10 (1d10 + 5) Piercing damage.'
monsters.hydra.multiattack.actions.multiattack.name: 'Multiattack'
monsters.hydra.multiattack.actions.multiattack.params.heads.name: 'Heads'
monsters.hydra.multiattack.actions.multiattack.results.done.name: 'Done'

monsters.hyena.name: 'Hyena'
monsters.hyena.pack-tactics.name: 'Pack Tactics'
monsters.hyena.pack-tactics.description: "The hyena has Advantage on an attack roll against a creature if at least one of the hyena's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."
monsters.hyena.bite.name: 'Bite'
monsters.hyena.bite.description: '*Melee Attack Roll:* +2, reach 5 ft. *Hit:* 3 (1d6) Piercing damage.'

monsters.ice-devil.name: 'Ice Devil'
monsters.ice-devil.diabolical-restoration.name: 'Diabolical Restoration'
monsters.ice-devil.diabolical-restoration.description: 'If the devil dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.'
monsters.ice-devil.magic-resistance.name: 'Magic Resistance'
monsters.ice-devil.magic-resistance.description: 'The devil has Advantage on saving throws against spells and other magical effects.'
monsters.ice-devil.multiattack.actions.multiattack.name: 'Multiattack'
monsters.ice-devil.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.ice-devil.multiattack.name: 'Multiattack'
monsters.ice-devil.multiattack.description: 'The devil makes three Ice Spear attacks. It can replace one attack with a Tail attack.'
monsters.ice-devil.ice-spear.name: 'Ice Spear'
monsters.ice-devil.ice-spear.description: "*Melee or Ranged Attack Roll:* +10, reach 5 ft. or range 30/120 ft. *Hit:* 14 (2d8 + 5) Piercing damage plus 10 (3d6) Cold damage. Until the end of its next turn, the target can't take a Bonus Action or Reaction, its Speed decreases by 10 feet, and it can move or take one action on its turn, not both. *Hit or Miss:* The spear magically returns to the devil's hand immediately after a ranged attack."
monsters.ice-devil.tail.name: 'Tail'
monsters.ice-devil.tail.description: '*Melee Attack Roll:* +10, reach 10 ft. *Hit:* 15 (3d6 + 5) Bludgeoning damage plus 18 (4d8) Cold damage.'
monsters.ice-devil.ice-wall.name: 'Ice Wall'
monsters.ice-devil.ice-wall.description: 'The devil casts *Wall of Ice* (level 8 version), requiring no spell components and using Intelligence as the spellcasting ability (spell save DC 17).'
