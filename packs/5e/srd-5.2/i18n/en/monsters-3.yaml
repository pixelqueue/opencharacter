monsters.iron-golem.bladed-arm.description: '*Melee Attack Roll:* +12, reach 10 ft. *Hit:* 20 (3d8 + 7) Slashing damage plus 10 (3d6) Fire damage.'
monsters.iron-golem.fiery-bolt.name: 'Fiery Bolt'
monsters.iron-golem.fiery-bolt.description: '*Ranged Attack Roll:* +10, range 120 ft. *Hit:* 36 (8d8) Fire damage.'
monsters.iron-golem.poison-breath.name: 'Poison Breath'
monsters.iron-golem.poison-breath.description: '*Constitution Saving Throw:* DC 18, each creature in a 60-foot Cone. *Failure:* 55 (10d10) Poison damage. *Success:* Half damage.'

monsters.jackal.name: 'Jackal'
monsters.jackal.bite.name: 'Bite'
monsters.jackal.bite.description: '*Melee Attack Roll:* +1, reach 5 ft. *Hit:* 1 (1d4 – 1) Piercing damage.'

monsters.killer-whale.name: 'Killer Whale'
monsters.killer-whale.hold-breath.name: 'Hold Breath'
monsters.killer-whale.hold-breath.description: 'The whale can hold its breath for 30 minutes.'
monsters.killer-whale.bite.name: 'Bite'
monsters.killer-whale.bite.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 21 (5d6 + 4) Piercing damage.'

