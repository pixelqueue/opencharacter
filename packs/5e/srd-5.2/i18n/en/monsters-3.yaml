monsters.lich.texts.legendary: "Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the lich can expend a use to take one of the following actions. The lich regains all expended uses at the start of each of its turns."

monsters.lion.name: 'Lion'
monsters.lion.pack-tactics.name: 'Pack Tactics'
monsters.lion.pack-tactics.description: "The lion has Advantage on an attack roll against a creature if at least one of the lion's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."
monsters.lion.running-leap.name: 'Running Leap'
monsters.lion.running-leap.description: 'With a 10-foot running start, the lion can Long Jump up to 25 feet.'
monsters.lion.multiattack.actions.multiattack.name: 'Multiattack'
monsters.lion.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.lion.multiattack.actions.multiattack.steps.pick2.prompt: 'Attack'
monsters.lion.multiattack.actions.multiattack.options.rend.name: 'Rend'
monsters.lion.multiattack.actions.multiattack.options.roar.name: 'Roar'
monsters.lion.multiattack.name: 'Multiattack'
monsters.lion.multiattack.description: 'The lion makes two Rend attacks. It can replace one attack with a use of Roar.'
monsters.lion.rend.name: 'Rend'
monsters.lion.rend.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 7 (1d8 + 3) Slashing damage.'
monsters.lion.roar.name: 'Roar'
monsters.lion.roar.description: "*Wisdom Saving Throw:* DC 11, one creature within 15 feet. *Failure:* The target has the Frightened condition until the start of the lion's next turn."

monsters.lizard.name: 'Lizard'
monsters.lizard.spider-climb.name: 'Spider Climb'
monsters.lizard.spider-climb.description: 'The lizard can climb difficult surfaces, including along ceilings, without needing to make an ability check.'
monsters.lizard.bite.name: 'Bite'
monsters.lizard.bite.description: '*Melee Attack Roll:* +2, reach 5 ft. *Hit:* 1 Piercing damage.'
