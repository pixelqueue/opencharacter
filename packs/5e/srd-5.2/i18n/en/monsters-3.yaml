  The lich casts one of the following spells, using Intelligence as the spellcasting ability (spell save DC 20):

  *At Will:* *Detect Magic*, *Detect Thoughts*, *Dispel Magic*, *Fireball* (level 5 version), *Invisibility*, *Lightning Bolt* (level 5 version), *Mage Hand*, *Prestidigitation*

  *2/Day Each:* *Animate Dead*, *Dimension Door*, *Plane Shift*

  *1/Day Each:* *Chain Lightning*, *Finger of Death*, *Power Word Kill*, *Scrying*
monsters.lich.protective-magic.name: 'Protective Magic'
monsters.lich.protective-magic.description: "The lich casts *Counterspell* or *Shield* in response to the spell's trigger, using the same spellcasting ability as Spellcasting."
monsters.lich.deathly-teleport.name: 'Deathly Teleport'
monsters.lich.deathly-teleport.description: 'The lich teleports up to 60 feet to an unoccupied space it can see, and each creature within 10 feet of the space it left takes 11 (2d10) Necrotic damage.'
monsters.lich.disrupt-life.name: 'Disrupt Life'
monsters.lich.disrupt-life.description: "*Constitution Saving Throw:* DC 20, each creature that isn't an Undead in a 20-foot Emanation originating from the lich. *Failure:* 31 (9d6) Necrotic damage. *Success:* Half damage. *Failure or Success:* The lich can't take this action again until the start of its next turn."
monsters.lich.frightening-gaze.name: 'Frightening Gaze'
