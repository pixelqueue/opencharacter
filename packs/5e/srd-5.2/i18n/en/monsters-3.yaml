monsters.invisible-stalker.wind-swipe.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 11 (2d6 + 4) Force damage.'
monsters.invisible-stalker.vortex.name: 'Vortex'
monsters.invisible-stalker.vortex.description: "*Constitution Saving Throw:* DC 14, one Large or smaller creature in the stalker's space. *Failure:* 7 (1d8 + 3) Thunder damage, and the target has the Grappled condition (escape DC 13). Until the grapple ends, the target can't cast spells with a Verbal component and takes 7 (2d6) Thunder damage at the start of each of the stalker's turns."

monsters.iron-golem.name: 'Iron Golem'
monsters.iron-golem.fire-absorption.name: 'Fire Absorption'
monsters.iron-golem.fire-absorption.description: 'Whenever the golem is subjected to Fire damage, it regains a number of Hit Points equal to the Fire damage dealt.'
monsters.iron-golem.immutable-form.name: 'Immutable Form'
monsters.iron-golem.immutable-form.description: "The golem can't shape-shift."
monsters.iron-golem.magic-resistance.name: 'Magic Resistance'
monsters.iron-golem.magic-resistance.description: 'The golem has Advantage on saving throws against spells and other magical effects.'
monsters.iron-golem.multiattack.actions.multiattack.name: 'Multiattack'
