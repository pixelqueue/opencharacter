monsters.ice-mephit.name: 'Ice Mephit'
monsters.ice-mephit.death-burst.name: 'Death Burst'
monsters.ice-mephit.death-burst.description: 'The mephit explodes when it dies. *Constitution Saving Throw:* DC 10, each creature in a 5-foot Emanation originating from the mephit. *Failure:* 5 (2d4) Cold damage. *Success:* Half damage.'
monsters.ice-mephit.claw.name: 'Claw'
monsters.ice-mephit.claw.description: '*Melee Attack Roll:* +3, reach 5 ft. *Hit:* 3 (1d4 + 1) Slashing damage plus 2 (1d4) Cold damage.'
monsters.ice-mephit.fog-cloud.name: 'Fog Cloud'
monsters.ice-mephit.fog-cloud.description: 'The mephit casts *Fog Cloud*, requiring no spell components and using Charisma as the spellcasting ability.'
monsters.ice-mephit.frost-breath.name: 'Frost Breath'
monsters.ice-mephit.frost-breath.description: '*Constitution Saving Throw:* DC 10, each creature in a 15-foot Cone. *Failure:* 7 (3d4) Cold damage. *Success:* Half damage.'

monsters.imp.name: 'Imp'
monsters.imp.magic-resistance.name: 'Magic Resistance'
monsters.imp.magic-resistance.description: 'The imp has Advantage on saving throws against spells and other magical effects.'
monsters.imp.sting.name: 'Sting'
monsters.imp.sting.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 6 (1d6 + 3) Piercing damage plus 7 (2d6) Poison damage.'
monsters.imp.invisibility.name: 'Invisibility'
monsters.imp.invisibility.description: 'The imp casts *Invisibility* on itself, requiring no spell components and using Charisma as the spellcasting ability.'
monsters.imp.shape-shift.name: 'Shape-Shift'
monsters.imp.shape-shift.description: "The imp shape-shifts to resemble a rat (Speed 20 ft.), a raven (20 ft., Fly 60 ft.), or a spider (20 ft., Climb 20 ft.), or it returns to its true form. Its game statistics are the same in each form, except for its Speed. Any equipment it is wearing or carrying isn't transformed."

monsters.incubus.name: 'Incubus'
monsters.incubus.succubus-form.name: 'Succubus Form'
monsters.incubus.succubus-form.description: "When the incubus finishes a Long Rest, it can shape-shift into a Succubus, using that stat block instead of this one. Any equipment it is wearing or carrying isn't transformed."
monsters.incubus.multiattack.actions.multiattack.name: 'Multiattack'
monsters.incubus.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.incubus.multiattack.name: 'Multiattack'
monsters.incubus.multiattack.description: 'The incubus makes two Restless Touch attacks.'
monsters.incubus.restless-touch.name: 'Restless Touch'
monsters.incubus.restless-touch.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 15 (3d6 + 5) Psychic damage, and the target is cursed for 24 hours or until the incubus dies. Until the curse ends, the target gains no benefit from finishing Short Rests.'
monsters.incubus.spellcasting.name: 'Spellcasting'
monsters.incubus.spellcasting.description: |-
  The incubus casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 15):

  *At Will:* *Disguise Self*, *Etherealness*

  *1/Day Each:* *Dream*, *Hypnotic Pattern*
monsters.incubus.nightmare.name: 'Nightmare'
monsters.incubus.nightmare.description: '*Wisdom Saving Throw:* DC 15, one creature the incubus can see within 60 feet. *Failure:* If the target has 20 Hit Points or fewer, it has the Unconscious condition for 1 hour, until it takes damage, or until a creature within 5 feet of it takes an action to wake it. Otherwise, the target takes 18 (4d8) Psychic damage.'
monsters.incubus.nightmare.actions.nightmare.name: 'Nightmare'
monsters.incubus.nightmare.actions.nightmare.results.used.name: 'Used'

