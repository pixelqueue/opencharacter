monsters.lamia.leap.name: 'Leap'
monsters.lamia.leap.description: 'The lamia jumps up to 30 feet by spending 10 feet of movement.'

monsters.lemure.name: 'Lemure'
monsters.lemure.hellish-restoration.name: 'Hellish Restoration'
monsters.lemure.hellish-restoration.description: 'If the lemure dies in the Nine Hells, it revives with all its Hit Points in 1d10 days unless it is killed by a creature under the effects of a Bless spell or its remains are sprinkled with Holy Water.'
monsters.lemure.vile-slime.name: 'Vile Slime'
monsters.lemure.vile-slime.description: '*Melee Attack Roll:* +2, reach 5 ft. *Hit:* 2 (1d4) Poison damage.'

