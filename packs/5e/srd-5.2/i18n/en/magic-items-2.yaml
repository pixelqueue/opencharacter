  | 5 | Rare | 17 | +9 |
  | 6 | Very Rare | 17 | +9 |
  | 7 | Very Rare | 18 | +10 |
  | 8 | Very Rare | 18 | +10 |
  | 9 | Legendary | 19 | +11 |

