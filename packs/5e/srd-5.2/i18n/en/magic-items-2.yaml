  | Cantrip | Common | 13 | +5 |
  | 1 | Common | 13 | +5 |
  | 2 | Uncommon | 13 | +5 |
  | 3 | Uncommon | 15 | +7 |
  | 4 | Rare | 15 | +7 |
  | 5 | Rare | 17 | +9 |
  | 6 | Very Rare | 17 | +9 |
  | 7 | Very Rare | 18 | +10 |
  | 8 | Very Rare | 18 | +10 |
