monsters.spirit-naga.spellcasting.description: |-
  The naga casts one of the following spells, requiring no Somatic or Material components and using Intelligence as the spellcasting ability (spell save DC 14):

  *At Will:* *Detect Magic*, *Mage Hand*, *Minor Illusion*, *Water Breathing*

  *2/Day Each:* *Detect Thoughts*, *Dimension Door*, *Hold Person* (level 3 version), *Lightning Bolt* (level 4 version)

monsters.sprite.name: 'Sprite'
monsters.sprite.needle-sword.name: 'Needle Sword'
monsters.sprite.needle-sword.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 6 (1d4 + 4) Piercing damage.'
monsters.sprite.enchanting-bow.name: 'Enchanting Bow'
monsters.sprite.enchanting-bow.description: "*Ranged Attack Roll:* +6, range 40/160 ft. *Hit:* 1 Piercing damage, and the target has the Charmed condition until the start of the sprite's next turn."
monsters.sprite.heart-sight.name: 'Heart Sight'
monsters.sprite.heart-sight.description: "*Charisma Saving Throw:* DC 10, one creature within 5 feet the sprite can see (Celestials, Fiends, and Undead automatically fail the save). *Failure:* The sprite knows the target's emotions and alignment."
monsters.sprite.invisibility.name: 'Invisibility'
monsters.sprite.invisibility.description: 'The sprite casts *Invisibility* on itself, requiring no spell components and using Charisma as the spellcasting ability.'

monsters.spy.name: 'Spy'
monsters.spy.shortsword.name: 'Shortsword'
monsters.spy.shortsword.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 5 (1d6 + 2) Piercing damage plus 7 (2d6) Poison damage.'
monsters.spy.hand-crossbow.name: 'Hand Crossbow'
monsters.spy.hand-crossbow.description: '*Ranged Attack Roll:* +4, range 30/120 ft. *Hit:* 5 (1d6 + 2) Piercing damage plus 7 (2d6) Poison damage.'
monsters.spy.cunning-action.name: 'Cunning Action'
monsters.spy.cunning-action.description: 'The spy takes the Dash, Disengage, or Hide action.'

monsters.steam-mephit.name: 'Steam Mephit'
monsters.steam-mephit.blurred-form.name: 'Blurred Form'
monsters.steam-mephit.blurred-form.description: 'Attack rolls against the mephit are made with Disadvantage unless the mephit has the Incapacitated condition.'
monsters.steam-mephit.death-burst.name: 'Death Burst'
monsters.steam-mephit.death-burst.description: 'The mephit explodes when it dies. *Dexterity Saving Throw:* DC 10, each creature in a 5-foot Emanation originating from the mephit. *Failure:* 5 (2d4) Fire damage. *Success:* Half damage.'
monsters.steam-mephit.claw.name: 'Claw'
monsters.steam-mephit.claw.description: '*Melee Attack Roll:* +2, reach 5 ft. *Hit:* 2 (1d4) Slashing damage plus 2 (1d4) Fire damage.'
monsters.steam-mephit.steam-breath.name: 'Steam Breath'
monsters.steam-mephit.steam-breath.description: "*Constitution Saving Throw:* DC 10, each creature in a 15-foot Cone. *Failure:* 5 (2d4) Fire damage, and the target's Speed decreases by 10 feet until the end of the mephit's next turn. *Success:* Half damage only. *Failure or Success:* Being underwater doesn't grant Resistance to this Fire damage."

monsters.stirge.name: 'Stirge'
monsters.stirge.proboscis.name: 'Proboscis'
monsters.stirge.proboscis.description: |-
  *Melee Attack Roll:* +5, reach 5 ft. *Hit:* 6 (1d6 + 3) Piercing damage, and the stirge attaches to the target. While attached, the stirge can't make Proboscis attacks, and the target takes 5 (2d4) Necrotic damage at the start of each of the stirge's turns.

  The stirge can detach itself by spending 5 feet of its movement. The target or a creature within 5 feet of it can detach the stirge as an action.

