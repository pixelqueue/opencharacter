monsters.warrior-veteran.parry.description: '*Trigger:* The warrior is hit by a melee attack roll while holding a weapon. *Response:* The warrior adds 2 to its AC against that attack, possibly causing it to miss.'

monsters.water-elemental.name: 'Water Elemental'
