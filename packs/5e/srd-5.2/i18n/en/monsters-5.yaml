monsters.water-elemental.freeze.description: 'If the elemental takes Cold damage, its Speed decreases by 20 feet until the end of its next turn.'
monsters.water-elemental.water-form.name: 'Water Form'
monsters.water-elemental.water-form.description: "The elemental can enter an enemy's space and stop there. It can move through a space as narrow as 1 inch without expending extra movement to do so."
