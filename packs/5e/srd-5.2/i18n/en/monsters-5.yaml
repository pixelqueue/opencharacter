monsters.tough-boss.multiattack.actions.multiattack.options.heavy-crossbow.name: 'Heavy Crossbow'
monsters.tough-boss.multiattack.name: 'Multiattack'
monsters.tough-boss.multiattack.description: 'The tough makes two attacks, using Warhammer or Heavy Crossbow in any combination.'
monsters.tough-boss.warhammer.name: 'Warhammer'
monsters.tough-boss.warhammer.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 12 (2d8 + 3) Bludgeoning damage. If the target is a Large or smaller creature, the tough pushes the target up to 10 feet straight away from itself.'
monsters.tough-boss.heavy-crossbow.name: 'Heavy Crossbow'
monsters.tough-boss.heavy-crossbow.description: '*Ranged Attack Roll:* +4, range 100/400 ft. *Hit:* 13 (2d10 + 2) Piercing damage.'

monsters.treant.name: 'Treant'
monsters.treant.siege-monster.name: 'Siege Monster'
monsters.treant.siege-monster.description: 'The treant deals double damage to objects and structures.'
monsters.treant.multiattack.actions.multiattack.name: 'Multiattack'
monsters.treant.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.treant.multiattack.name: 'Multiattack'
monsters.treant.multiattack.description: 'The treant makes two Slam attacks.'
monsters.treant.slam.name: 'Slam'
monsters.treant.slam.description: '*Melee Attack Roll:* +10, reach 5 ft. *Hit:* 16 (3d6 + 6) Bludgeoning damage.'
monsters.treant.hail-of-bark.name: 'Hail of Bark'
monsters.treant.hail-of-bark.description: '*Ranged Attack Roll:* +10, range 180 ft. *Hit:* 28 (4d10 + 6) Piercing damage.'
monsters.treant.animate-trees.name: 'Animate Trees'
monsters.treant.animate-trees.description: "The treant magically animates up to two trees it can see within 60 feet of itself. Each tree uses the Treant stat block, except it has Intelligence and Charisma scores of 1, it can't speak, and it lacks this action. The tree takes its turn immediately after the treant on the same Initiative count, and it obeys the treant. A tree remains animate for 1 day or until it dies, the treant dies, or it is more than 120 feet from the treant. The tree then takes root if possible."

monsters.triceratops.name: 'Triceratops'
monsters.triceratops.multiattack.actions.multiattack.name: 'Multiattack'
monsters.triceratops.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.triceratops.multiattack.name: 'Multiattack'
monsters.triceratops.multiattack.description: 'The triceratops makes two Gore attacks.'
monsters.triceratops.gore.name: 'Gore'
monsters.triceratops.gore.description: '*Melee Attack Roll:* +9, reach 5 ft. *Hit:* 19 (2d12 + 6) Piercing damage. If the target is Huge or smaller and the triceratops moved 20+ feet straight toward it immediately before the hit, the target takes an extra 9 (2d8) Piercing damage and has the Prone condition.'
monsters.triceratops.gore.actions.charge.name: 'Gore after a charge'
monsters.triceratops.gore.actions.charge.params.targetAc.name: "Target's AC"
monsters.triceratops.gore.actions.charge.results.hit.name: 'Hit'
monsters.triceratops.gore.actions.charge.results.miss.name: 'Miss'

monsters.troll.name: 'Troll'
monsters.troll.loathsome-limbs.name: 'Loathsome Limbs'
monsters.troll.loathsome-limbs.description: "If the troll ends any turn Bloodied and took 15+ Slashing damage during that turn, one of the troll's limbs is severed, falls into the troll's space, and becomes a Troll Limb. The limb acts immediately after the troll's turn. The troll has 1 Exhaustion level for each missing limb, and it grows replacement limbs the next time it regains Hit Points."
monsters.troll.regeneration.name: 'Regeneration'
monsters.troll.regeneration.description: "The troll regains 15 Hit Points at the start of each of its turns. If the troll takes Acid or Fire damage, this trait doesn't function on the troll's next turn. The troll dies only if it starts its turn with 0 Hit Points and doesn't regenerate."
monsters.troll.multiattack.actions.multiattack.name: 'Multiattack'
monsters.troll.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.troll.multiattack.name: 'Multiattack'
monsters.troll.multiattack.description: 'The troll makes three Rend attacks.'
monsters.troll.rend.name: 'Rend'
monsters.troll.rend.description: '*Melee Attack Roll:* +7, reach 10 ft. *Hit:* 11 (2d6 + 4) Slashing damage.'
monsters.troll.charge.name: 'Charge'
monsters.troll.charge.description: 'The troll moves up to half its Speed straight toward an enemy it can see.'

monsters.troll-limb.name: 'Troll Limb'
monsters.troll-limb.regeneration.name: 'Regeneration'
monsters.troll-limb.regeneration.description: "The limb regains 5 Hit Points at the start of each of its turns. If the limb takes Acid or Fire damage, this trait doesn't function on the limb's next turn. The limb dies only if it starts its turn with 0 Hit Points and doesn't regenerate."
monsters.troll-limb.troll-spawn.name: 'Troll Spawn'
monsters.troll-limb.troll-spawn.description: "The limb uncannily has the same senses as a whole troll. If the limb isn't destroyed within 24 hours, roll 1d12. On a 12, the limb turns into a Troll. Otherwise, the limb withers away."
monsters.troll-limb.rend.name: 'Rend'
monsters.troll-limb.rend.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 9 (2d4 + 4) Slashing damage.'

monsters.tyrannosaurus-rex.name: 'Tyrannosaurus Rex'
monsters.tyrannosaurus-rex.multiattack.actions.multiattack.name: 'Multiattack'
monsters.tyrannosaurus-rex.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.tyrannosaurus-rex.multiattack.name: 'Multiattack'
monsters.tyrannosaurus-rex.multiattack.description: 'The tyrannosaurus makes one Bite attack and one Tail attack.'
monsters.tyrannosaurus-rex.bite.name: 'Bite'
monsters.tyrannosaurus-rex.bite.description: "*Melee Attack Roll:* +10, reach 10 ft. *Hit:* 33 (4d12 + 7) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 17). While Grappled, the target has the Restrained condition and can't be targeted by the tyrannosaurus's Tail."
monsters.tyrannosaurus-rex.tail.name: 'Tail'
monsters.tyrannosaurus-rex.tail.description: '*Melee Attack Roll:* +10, reach 15 ft. *Hit:* 25 (4d8 + 7) Bludgeoning damage. If the target is a Huge or smaller creature, it has the Prone condition.'

monsters.unicorn.name: 'Unicorn'
monsters.unicorn.legendary-resistance.name: 'Legendary Resistance'
monsters.unicorn.legendary-resistance.description: 'If the unicorn fails a saving throw, it can choose to succeed instead.'
monsters.unicorn.magic-resistance.name: 'Magic Resistance'
monsters.unicorn.magic-resistance.description: 'The unicorn has Advantage on saving throws against spells and other magical effects.'
monsters.unicorn.multiattack.actions.multiattack.name: 'Multiattack'
monsters.unicorn.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.unicorn.multiattack.name: 'Multiattack'
monsters.unicorn.multiattack.description: 'The unicorn makes one Hooves attack and one Radiant Horn attack.'
monsters.unicorn.hooves.name: 'Hooves'
monsters.unicorn.hooves.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 11 (2d6 + 4) Bludgeoning damage.'
monsters.unicorn.radiant-horn.name: 'Radiant Horn'
monsters.unicorn.radiant-horn.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 9 (1d10 + 4) Radiant damage.'
monsters.unicorn.spellcasting.name: 'Spellcasting'
monsters.unicorn.spellcasting.description: |-
  The unicorn casts one of the following spells, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 14):

  *At Will:* *Detect Evil and Good*, *Druidcraft*

  *1/Day Each:* *Calm Emotions*, *Dispel Evil and Good*, *Entangle*, *Pass without Trace*, *Word of Recall*
monsters.unicorn.unicorns-blessing.name: 'Unicorn’s Blessing'
monsters.unicorn.unicorns-blessing.description: 'The unicorn touches another creature with its horn and casts *Cure Wounds* or *Lesser Restoration* on that creature, using the same spellcasting ability as Spellcasting.'
monsters.unicorn.charging-horn.name: 'Charging Horn'
monsters.unicorn.charging-horn.description: 'The unicorn moves up to half its Speed without provoking Opportunity Attacks, and it makes one Radiant Horn attack.'
monsters.unicorn.shimmering-shield.name: 'Shimmering Shield'
monsters.unicorn.shimmering-shield.description: "The unicorn targets itself or one creature it can see within 60 feet of itself. The target gains 10 (3d6) Temporary Hit Points, and its AC increases by 2 until the end of the unicorn's next turn. The unicorn can't take this action again until the start of its next turn."
monsters.unicorn.texts.legendary: "Legendary Action Uses: 3. Immediately after another creature's turn, the unicorn can expend a use to take one of the following actions. The unicorn regains all expended uses at the start of each of its turns."

monsters.vampire.name: 'Vampire'
monsters.vampire.legendary-resistance.name: 'Legendary Resistance'
monsters.vampire.legendary-resistance.description: 'If the vampire fails a saving throw, it can choose to succeed instead.'
monsters.vampire.misty-escape.name: 'Misty Escape'
monsters.vampire.misty-escape.description: |-
  If the vampire drops to 0 Hit Points outside its resting place, the vampire uses Shape-Shift to become mist (no action required). If it can't use Shape-Shift, it is destroyed.

  While it has 0 Hit Points in mist form, it can't return to its vampire form, and it must reach its resting place within 2 hours or be destroyed. Once in its resting place, it returns to its vampire form and has the Paralyzed condition until it regains any Hit Points, and it regains 1 Hit Point after spending 1 hour there.
monsters.vampire.spider-climb.name: 'Spider Climb'
monsters.vampire.spider-climb.description: 'The vampire can climb difficult surfaces, including along ceilings, without needing to make an ability check.'
monsters.vampire.vampire-weakness.name: 'Vampire Weakness'
monsters.vampire.vampire-weakness.description: 'The vampire has these weaknesses:'
monsters.vampire.forbiddance.name: 'Forbiddance'
monsters.vampire.forbiddance.description: "The vampire can't enter a residence without an invitation from an occupant."
monsters.vampire.running-water.name: 'Running Water'
monsters.vampire.running-water.description: 'The vampire takes 20 Acid damage if it ends its turn in running water.'
monsters.vampire.stake-to-the-heart.name: 'Stake to the Heart'
monsters.vampire.stake-to-the-heart.description: "If a weapon that deals Piercing damage is driven into the vampire's heart while the vampire has the Incapacitated condition in its resting place, the vampire has the Paralyzed condition until the weapon is removed."
monsters.vampire.sunlight.name: 'Sunlight'
monsters.vampire.sunlight.description: 'The vampire takes 20 Radiant damage if it starts its turn in sunlight. While in sunlight, it has Disadvantage on attack rolls and ability checks.'
monsters.vampire.multiattack.texts.note: 'Vampire Form Only'
monsters.vampire.multiattack.actions.multiattack.name: 'Multiattack'
monsters.vampire.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.vampire.multiattack.name: 'Multiattack'
monsters.vampire.multiattack.description: 'The vampire makes two Grave Strike attacks and uses Bite.'
monsters.vampire.grave-strike.texts.note: 'Vampire Form Only'
monsters.vampire.grave-strike.name: 'Grave Strike'
monsters.vampire.grave-strike.description: '*Melee Attack Roll:* +9, reach 5 ft. *Hit:* 8 (1d8 + 4) Bludgeoning damage plus 7 (2d6) Necrotic damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of two hands.'
monsters.vampire.bite.texts.note: 'Bat or Vampire Form Only'
monsters.vampire.bite.name: 'Bite'
monsters.vampire.bite.description: "*Constitution Saving Throw:* DC 17, one creature within 5 feet that is willing or that has the Grappled, Incapacitated, or Restrained condition. *Failure:* 6 (1d4 + 4) Piercing damage plus 13 (3d8) Necrotic damage. The target's Hit Point maximum decreases by an amount equal to the Necrotic damage taken, and the vampire regains Hit Points equal to that amount. A Humanoid reduced to 0 Hit Points by this damage and then buried rises the following sunset as a Vampire Spawn under the vampire's control."
monsters.vampire.charm.name: 'Charm'
monsters.vampire.charm.description: "The vampire casts *Charm Person*, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 17), and the duration is 24 hours. The Charmed target is a willing recipient of the vampire's Bite, the damage of which doesn't end the spell. When the spell ends, the target is unaware it was Charmed by the vampire."
monsters.vampire.shape-shift.name: 'Shape-Shift'
monsters.vampire.shape-shift.description: |-
  If the vampire isn't in sunlight or running water, it shape-shifts into a Tiny bat (Speed 5 ft., Fly Speed 30 ft.) or a Medium cloud of mist (Speed 5 ft., Fly Speed 20 ft. [hover]), or it returns to its vampire form. Anything it is wearing transforms with it.

  While in bat form, the vampire can't speak. Its game statistics, other than its size and Speed, are unchanged.

  While in mist form, the vampire can't take any actions, speak, or manipulate objects. It is weightless and can enter an enemy's space and stop there. If air can pass through a space, the mist can do so, but it can't pass through liquid. It has Resistance to all damage, except the damage it takes from sunlight.
monsters.vampire.beguile.name: 'Beguile'
monsters.vampire.beguile.description: "The vampire casts *Command*, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 17). The vampire can't take this action again until the start of its next turn."
monsters.vampire.deathless-strike.name: 'Deathless Strike'
monsters.vampire.deathless-strike.description: 'The vampire moves up to half its Speed, and it makes one Grave Strike attack.'
monsters.vampire.texts.legendary: "Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the vampire can expend a use to take one of the following actions. The vampire regains all expended uses at the start of each of its turns."

monsters.vampire-familiar.name: 'Vampire Familiar'
monsters.vampire-familiar.vampiric-connection.name: 'Vampiric Connection'
monsters.vampire-familiar.vampiric-connection.description: "While the familiar and its vampire master are on the same plane of existence, the vampire can communicate with the familiar telepathically, and the vampire can perceive through the familiar's senses."
monsters.vampire-familiar.multiattack.actions.multiattack.name: 'Multiattack'
monsters.vampire-familiar.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.vampire-familiar.multiattack.name: 'Multiattack'
monsters.vampire-familiar.multiattack.description: 'The familiar makes two Umbral Dagger attacks.'
monsters.vampire-familiar.umbral-dagger.name: 'Umbral Dagger'
monsters.vampire-familiar.umbral-dagger.description: '*Melee or Ranged Attack Roll:* +5, reach 5 ft. or range 20/60 ft. *Hit:* 5 (1d4 + 3) Piercing damage plus 7 (3d4) Necrotic damage. If the target is reduced to 0 Hit Points by this attack, the target becomes Stable but has the Poisoned condition for 1 hour. While it has the Poisoned condition, the target has the Paralyzed condition.'
monsters.vampire-familiar.deathless-agility.name: 'Deathless Agility'
monsters.vampire-familiar.deathless-agility.description: 'The familiar takes the Dash or Disengage action.'

monsters.vampire-spawn.name: 'Vampire Spawn'
monsters.vampire-spawn.spider-climb.name: 'Spider Climb'
monsters.vampire-spawn.spider-climb.description: 'The vampire can climb difficult surfaces, including along ceilings, without needing to make an ability check.'
monsters.vampire-spawn.vampire-weakness.name: 'Vampire Weakness'
monsters.vampire-spawn.vampire-weakness.description: 'The vampire has these weaknesses:'
monsters.vampire-spawn.forbiddance.name: 'Forbiddance'
monsters.vampire-spawn.forbiddance.description: "The vampire can't enter a residence without an invitation from an occupant."
monsters.vampire-spawn.running-water.name: 'Running Water'
monsters.vampire-spawn.running-water.description: 'The vampire takes 20 Acid damage if it ends its turn in running water.'
monsters.vampire-spawn.stake-to-the-heart.name: 'Stake to the Heart'
monsters.vampire-spawn.stake-to-the-heart.description: "The vampire is destroyed if a weapon that deals Piercing damage is driven into the vampire's heart while the vampire has the Incapacitated condition."
monsters.vampire-spawn.sunlight.name: 'Sunlight'
monsters.vampire-spawn.sunlight.description: 'The vampire takes 20 Radiant damage if it starts its turn in sunlight. While in sunlight, it has Disadvantage on attack rolls and ability checks.'
monsters.vampire-spawn.multiattack.actions.multiattack.name: 'Multiattack'
monsters.vampire-spawn.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.vampire-spawn.multiattack.name: 'Multiattack'
monsters.vampire-spawn.multiattack.description: 'The vampire makes two Claw attacks and uses Bite.'
monsters.vampire-spawn.claw.name: 'Claw'
monsters.vampire-spawn.claw.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 8 (2d4 + 3) Slashing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 13) from one of two claws.'
monsters.vampire-spawn.bite.name: 'Bite'
monsters.vampire-spawn.bite.description: "*Constitution Saving Throw:* DC 14, one creature within 5 feet that is willing or that has the Grappled, Incapacitated, or Restrained condition. *Failure:* 5 (1d4 + 3) Piercing damage plus 10 (3d6) Necrotic damage. The target's Hit Point maximum decreases by an amount equal to the Necrotic damage taken, and the vampire regains Hit Points equal to that amount."
monsters.vampire-spawn.deathless-agility.name: 'Deathless Agility'
monsters.vampire-spawn.deathless-agility.description: 'The vampire takes the Dash or Disengage action.'

monsters.venomous-snake.name: 'Venomous Snake'
monsters.venomous-snake.bite.name: 'Bite'
monsters.venomous-snake.bite.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 4 (1d4 + 2) Piercing damage plus 3 (1d6) Poison damage.'

monsters.violet-fungus.name: 'Violet Fungus'
monsters.violet-fungus.multiattack.actions.multiattack.name: 'Multiattack'
monsters.violet-fungus.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.violet-fungus.multiattack.name: 'Multiattack'
monsters.violet-fungus.multiattack.description: 'The fungus makes two Rotting Touch attacks.'
monsters.violet-fungus.rotting-touch.name: 'Rotting Touch'
monsters.violet-fungus.rotting-touch.description: '*Melee Attack Roll:* +2, reach 10 ft. *Hit:* 4 (1d8) Necrotic damage.'

monsters.vrock.name: 'Vrock'
monsters.vrock.demonic-restoration.name: 'Demonic Restoration'
monsters.vrock.demonic-restoration.description: 'If the vrock dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.'
monsters.vrock.magic-resistance.name: 'Magic Resistance'
monsters.vrock.magic-resistance.description: 'The vrock has Advantage on saving throws against spells and other magical effects.'
monsters.vrock.multiattack.actions.multiattack.name: 'Multiattack'
monsters.vrock.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.vrock.multiattack.name: 'Multiattack'
monsters.vrock.multiattack.description: 'The vrock makes two Shred attacks.'
monsters.vrock.shred.name: 'Shred'
monsters.vrock.shred.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 10 (2d6 + 3) Piercing damage plus 10 (3d6) Poison damage.'
monsters.vrock.spores.name: 'Spores'
monsters.vrock.spores.description: '*Constitution Saving Throw:* DC 15, each creature in a 20-foot Emanation originating from the vrock. *Failure:* The target has the Poisoned condition and repeats the save at the end of each of its turns, ending the effect on itself on a success. While Poisoned, the target takes 5 (1d10) Poison damage at the start of each of its turns. Emptying a flask of Holy Water on the target ends the effect early.'
monsters.vrock.stunning-screech.name: 'Stunning Screech'
monsters.vrock.stunning-screech.description: "*Constitution Saving Throw:* DC 15, each creature in a 20-foot Emanation originating from the vrock (demons succeed automatically). *Failure:* 10 (3d6) Thunder damage, and the target has the Stunned condition until the end of the vrock's next turn."

monsters.vulture.name: 'Vulture'
monsters.vulture.pack-tactics.name: 'Pack Tactics'
monsters.vulture.pack-tactics.description: "The vulture has Advantage on an attack roll against a creature if at least one of the vulture's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."
monsters.vulture.beak.name: 'Beak'
monsters.vulture.beak.description: '*Melee Attack Roll:* +2, reach 5 ft. *Hit:* 2 (1d4) Piercing damage.'

monsters.warhorse.name: 'Warhorse'
monsters.warhorse.hooves.name: 'Hooves'
monsters.warhorse.hooves.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 9 (2d4 + 4) Bludgeoning damage. If the target is a Large or smaller creature and the horse moved 20+ feet straight toward it immediately before the hit, the target takes an extra 5 (2d4) Bludgeoning damage and has the Prone condition.'
