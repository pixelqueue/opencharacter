monsters.water-elemental.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.water-elemental.multiattack.name: 'Multiattack'
monsters.water-elemental.multiattack.description: 'The elemental makes two Slam attacks.'
monsters.water-elemental.slam.name: 'Slam'
monsters.water-elemental.slam.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 13 (2d8 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition.'
monsters.water-elemental.whelm.name: 'Whelm'
monsters.water-elemental.whelm.description: "*Strength Saving Throw:* DC 15, each creature in the elemental's space. *Failure:* 22 (4d8 + 4) Bludgeoning damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14). Until the grapple ends, the target has the Restrained condition, is suffocating unless it can breathe water, and takes 9 (2d8) Bludgeoning damage at the start of each of the elemental's turns. The elemental can grapple one Large creature or up to two Medium or smaller creatures at a time with Whelm. As an action, a creature within 5 feet of the elemental can pull a creature out of it by succeeding on a DC 14 Strength (Athletics) check. *Success:* Half damage only."

