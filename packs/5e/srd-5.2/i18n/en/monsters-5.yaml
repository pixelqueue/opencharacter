monsters.tiger.name: 'Tiger'
monsters.tiger.rend.name: 'Rend'
monsters.tiger.rend.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 10 (2d6 + 3) Slashing damage. If the target is a Large or smaller creature, it has the Prone condition.'
monsters.tiger.nimble-escape.name: 'Nimble Escape'
monsters.tiger.nimble-escape.description: 'The tiger takes the Disengage or Hide action.'

monsters.tough.name: 'Tough'
monsters.tough.pack-tactics.name: 'Pack Tactics'
monsters.tough.pack-tactics.description: "The tough has Advantage on an attack roll against a creature if at least one of the tough's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."
monsters.tough.mace.name: 'Mace'
monsters.tough.mace.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 5 (1d6 + 2) Bludgeoning damage.'
monsters.tough.heavy-crossbow.name: 'Heavy Crossbow'
monsters.tough.heavy-crossbow.description: '*Ranged Attack Roll:* +3, range 100/400 ft. *Hit:* 6 (1d10 + 1) Piercing damage.'

monsters.tough-boss.name: 'Tough Boss'
monsters.tough-boss.pack-tactics.name: 'Pack Tactics'
monsters.tough-boss.pack-tactics.description: "The tough has Advantage on an attack roll against a creature if at least one of the tough's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."
