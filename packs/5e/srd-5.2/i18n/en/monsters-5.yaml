monsters.wight.multiattack.description: 'The wight makes two attacks, using Necrotic Sword or Necrotic Bow in any combination. It can replace one attack with a use of Life Drain.'
monsters.wight.necrotic-sword.name: 'Necrotic Sword'
monsters.wight.necrotic-sword.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 6 (1d8 + 2) Slashing damage plus 4 (1d8) Necrotic damage.'
monsters.wight.necrotic-bow.name: 'Necrotic Bow'
monsters.wight.necrotic-bow.description: '*Ranged Attack Roll:* +4, range 150/600 ft. *Hit:* 6 (1d8 + 2) Piercing damage plus 4 (1d8) Necrotic damage.'
monsters.wight.life-drain.name: 'Life Drain'
monsters.wight.life-drain.description: |-
  *Constitution Saving Throw:* DC 13, one creature within 5 feet. *Failure:* 6 (1d8 + 2) Necrotic damage, and the target's Hit Point maximum decreases by an amount equal to the damage taken.

  A Humanoid slain by this attack rises 24 hours later as a Zombie under the wight's control, unless the Humanoid is restored to life or its body is destroyed. The wight can have no more than twelve zombies under its control at a time.

monsters.will-o-wisp.name: 'Will-o’-Wisp'
monsters.will-o-wisp.ephemeral.name: 'Ephemeral'
monsters.will-o-wisp.ephemeral.description: "The wisp can't wear or carry anything."
monsters.will-o-wisp.illumination.name: 'Illumination'
monsters.will-o-wisp.illumination.description: 'The wisp sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet.'
monsters.will-o-wisp.incorporeal-movement.name: 'Incorporeal Movement'
monsters.will-o-wisp.incorporeal-movement.description: 'The wisp can move through other creatures and objects as if they were Difficult Terrain. It takes 5 (1d10) Force damage if it ends its turn inside an object.'
monsters.will-o-wisp.shock.name: 'Shock'
monsters.will-o-wisp.shock.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 11 (2d8 + 2) Lightning damage.'
monsters.will-o-wisp.consume-life.name: 'Consume Life'
monsters.will-o-wisp.consume-life.description: '*Constitution Saving Throw:* DC 10, one living creature the wisp can see within 5 feet that has 0 Hit Points. *Failure:* The target dies, and the wisp regains 10 (3d6) Hit Points.'
monsters.will-o-wisp.vanish.name: 'Vanish'
monsters.will-o-wisp.vanish.description: "The wisp and its light have the Invisible condition until the wisp's Concentration ends on this effect, which ends early immediately after the wisp makes an attack roll or uses Consume Life."

monsters.winter-wolf.name: 'Winter Wolf'
monsters.winter-wolf.pack-tactics.name: 'Pack Tactics'
monsters.winter-wolf.pack-tactics.description: "The wolf has Advantage on an attack roll against a creature if at least one of the wolf's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."
monsters.winter-wolf.bite.name: 'Bite'
monsters.winter-wolf.bite.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 11 (2d6 + 4) Piercing damage. If the target is a Large or smaller creature, it has the Prone condition.'
monsters.winter-wolf.cold-breath.name: 'Cold Breath'
monsters.winter-wolf.cold-breath.description: '*Constitution Saving Throw:* DC 12, each creature in a 15-foot Cone. *Failure:* 18 (4d8) Cold damage. *Success:* Half damage.'

