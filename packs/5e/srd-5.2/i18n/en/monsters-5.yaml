monsters.swarm-of-bats.name: 'Swarm of Bats'
monsters.swarm-of-bats.swarm.name: 'Swarm'
monsters.swarm-of-bats.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny bat. The swarm can't regain Hit Points or gain Temporary Hit Points."
monsters.swarm-of-bats.bites.name: 'Bites'
monsters.swarm-of-bats.bites.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 5 (2d4) Piercing damage, or 2 (1d4) Piercing damage if the swarm is Bloodied.'

monsters.swarm-of-crawling-claws.name: 'Swarm of Crawling Claws'
monsters.swarm-of-crawling-claws.swarm.name: 'Swarm'
monsters.swarm-of-crawling-claws.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny creature. The swarm can't regain Hit Points or gain Temporary Hit Points."
monsters.swarm-of-crawling-claws.swarm-of-grasping-hands.name: 'Swarm of Grasping Hands'
monsters.swarm-of-crawling-claws.swarm-of-grasping-hands.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 20 (4d8 + 2) Necrotic damage, or 11 (2d8 + 2) Necrotic damage if the swarm is Bloodied. If the target is a Medium or smaller creature, it has the Prone condition.'

monsters.swarm-of-insects.name: 'Swarm of Insects'
monsters.swarm-of-insects.spider-climb.name: 'Spider Climb'
monsters.swarm-of-insects.spider-climb.description: 'If the swarm has a Climb Speed, the swarm can climb difficult surfaces, including along ceilings, without needing to make an ability check.'
monsters.swarm-of-insects.swarm.name: 'Swarm'
monsters.swarm-of-insects.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny insect. The swarm can't regain Hit Points or gain Temporary Hit Points."
monsters.swarm-of-insects.bites.name: 'Bites'
monsters.swarm-of-insects.bites.description: '*Melee Attack Roll:* +3, reach 5 ft. *Hit:* 6 (2d4 + 1) Poison damage, or 3 (1d4 + 1) Poison damage if the swarm is Bloodied.'

monsters.swarm-of-piranhas.name: 'Swarm of Piranhas'
monsters.swarm-of-piranhas.swarm.name: 'Swarm'
monsters.swarm-of-piranhas.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny piranha. The swarm can't regain Hit Points or gain Temporary Hit Points."
monsters.swarm-of-piranhas.water-breathing.name: 'Water Breathing'
monsters.swarm-of-piranhas.water-breathing.description: 'The swarm can breathe only underwater.'
monsters.swarm-of-piranhas.bites.name: 'Bites'
monsters.swarm-of-piranhas.bites.description: "*Melee Attack Roll:* +5 (with Advantage if the target doesn't have all its Hit Points), reach 5 ft. *Hit:* 8 (2d4 + 3) Piercing damage, or 5 (1d4 + 3) Piercing damage if the swarm is Bloodied."

monsters.swarm-of-rats.name: 'Swarm of Rats'
monsters.swarm-of-rats.swarm.name: 'Swarm'
monsters.swarm-of-rats.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny rat. The swarm can't regain Hit Points or gain Temporary Hit Points."
monsters.swarm-of-rats.bites.name: 'Bites'
monsters.swarm-of-rats.bites.description: '*Melee Attack Roll:* +2, reach 5 ft. *Hit:* 5 (2d4) Piercing damage, or 2 (1d4) Piercing damage if the swarm is Bloodied.'

monsters.swarm-of-ravens.name: 'Swarm of Ravens'
monsters.swarm-of-ravens.swarm.name: 'Swarm'
monsters.swarm-of-ravens.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny raven. The swarm can't regain Hit Points or gain Temporary Hit Points."
monsters.swarm-of-ravens.beaks.name: 'Beaks'
monsters.swarm-of-ravens.beaks.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 5 (1d6 + 2) Piercing damage, or 2 (1d4) Piercing damage if the swarm is Bloodied.'
monsters.swarm-of-ravens.cacophony.name: 'Cacophony'
monsters.swarm-of-ravens.cacophony.description: "*Wisdom Saving Throw:* DC 10, one creature in the swarm's space. *Failure:* The target has the Deafened condition until the start of the swarm's next turn. While Deafened, the target also has Disadvantage on ability checks and attack rolls."

monsters.swarm-of-venomous-snakes.name: 'Swarm of Venomous Snakes'
monsters.swarm-of-venomous-snakes.swarm.name: 'Swarm'
monsters.swarm-of-venomous-snakes.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny snake. The swarm can't regain Hit Points or gain Temporary Hit Points."
monsters.swarm-of-venomous-snakes.bites.name: 'Bites'
monsters.swarm-of-venomous-snakes.bites.description: '*Melee Attack Roll:* +6, reach 5 ft. *Hit:* 8 (1d8 + 4) Piercing damage—or 6 (1d4 + 4) Piercing damage if the swarm is Bloodied—plus 10 (3d6) Poison damage.'

monsters.tarrasque.name: 'Tarrasque'
monsters.tarrasque.legendary-resistance.name: 'Legendary Resistance'
monsters.tarrasque.legendary-resistance.description: 'If the tarrasque fails a saving throw, it can choose to succeed instead.'
monsters.tarrasque.magic-resistance.name: 'Magic Resistance'
monsters.tarrasque.magic-resistance.description: 'The tarrasque has Advantage on saving throws against spells and other magical effects.'
monsters.tarrasque.reflective-carapace.name: 'Reflective Carapace'
monsters.tarrasque.reflective-carapace.description: 'If the tarrasque is targeted by a Magic Missile spell or a spell that requires a ranged attack roll, roll 1d6. On a 1–5, the tarrasque is unaffected. On a 6, the tarrasque is unaffected and reflects the spell, turning the caster into the target.'
monsters.tarrasque.siege-monster.name: 'Siege Monster'
monsters.tarrasque.siege-monster.description: 'The tarrasque deals double damage to objects and structures.'
monsters.tarrasque.multiattack.actions.multiattack.name: 'Multiattack'
monsters.tarrasque.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.tarrasque.multiattack.name: 'Multiattack'
monsters.tarrasque.multiattack.description: 'The tarrasque makes one Bite attack and three other attacks, using Claw or Tail in any combination.'
monsters.tarrasque.bite.name: 'Bite'
monsters.tarrasque.bite.description: "*Melee Attack Roll:* +19, reach 15 ft. *Hit:* 36 (4d12 + 10) Piercing damage, and the target has the Grappled condition (escape DC 20). Until the grapple ends, the target has the Restrained condition and can't teleport."
monsters.tarrasque.claw.name: 'Claw'
monsters.tarrasque.claw.description: '*Melee Attack Roll:* +19, reach 15 ft. *Hit:* 28 (4d8 + 10) Slashing damage.'
monsters.tarrasque.tail.name: 'Tail'
monsters.tarrasque.tail.description: '*Melee Attack Roll:* +19, reach 30 ft. *Hit:* 23 (3d8 + 10) Bludgeoning damage. If the target is a Huge or smaller creature, it has the Prone condition.'
monsters.tarrasque.thunderous-bellow.name: 'Thunderous Bellow'
monsters.tarrasque.thunderous-bellow.description: "*Constitution Saving Throw:* DC 27, each creature and each object that isn't being worn or carried in a 150-foot Cone. *Failure:* 78 (12d12) Thunder damage, and the target has the Deafened and Frightened conditions until the end of its next turn. *Success:* Half damage only."
monsters.tarrasque.swallow.name: 'Swallow'
monsters.tarrasque.swallow.description: |-
  *Strength Saving Throw:* DC 27, one Large or smaller creature Grappled by the tarrasque (it can have up to six creatures swallowed at a time). *Failure:* The target is swallowed, and the Grappled condition ends. A swallowed creature has the Blinded and Restrained conditions and can't teleport, it has Total Cover against attacks and other effects outside the tarrasque, and it takes 56 (16d6) Acid damage at the start of each of the tarrasque's turns.

  If the tarrasque takes 60 damage or more on a single turn from a creature inside it, the tarrasque must succeed on a DC 20 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 10 feet of the tarrasque and has the Prone condition. If the tarrasque dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse using 20 feet of movement, exiting Prone.
monsters.tarrasque.onslaught.name: 'Onslaught'
monsters.tarrasque.onslaught.description: 'The tarrasque moves up to half its Speed, and it makes one Claw or Tail attack.'
monsters.tarrasque.world-shaking-movement.name: 'World-Shaking Movement'
monsters.tarrasque.world-shaking-movement.description: "The tarrasque moves up to its Speed. At the end of this movement, the tarrasque creates an instantaneous shock wave in a 60-foot Emanation originating from itself. Creatures in that area lose Concentration and, if Medium or smaller, have the Prone condition. The tarrasque can't take this action again until the start of its next turn."
monsters.tarrasque.texts.legendary: "Legendary Action Uses: 3. Immediately after another creature's turn, the tarrasque can expend a use to take one of the following actions. The tarrasque regains all expended uses at the start of each of its turns."
