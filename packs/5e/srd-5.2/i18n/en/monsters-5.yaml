monsters.solar.name: 'Solar'
monsters.solar.divine-awareness.name: 'Divine Awareness'
monsters.solar.divine-awareness.description: 'The solar knows if it hears a lie.'
monsters.solar.exalted-restoration.name: 'Exalted Restoration'
monsters.solar.exalted-restoration.description: 'If the solar dies outside Mount Celestia, its body disappears, and it gains a new body instantly, reviving with all its Hit Points somewhere in Mount Celestia.'
monsters.solar.legendary-resistance.name: 'Legendary Resistance'
monsters.solar.legendary-resistance.description: 'If the solar fails a saving throw, it can choose to succeed instead.'
monsters.solar.magic-resistance.name: 'Magic Resistance'
monsters.solar.magic-resistance.description: 'The solar has Advantage on saving throws against spells and other magical effects.'
monsters.solar.multiattack.actions.multiattack.name: 'Multiattack'
monsters.solar.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.solar.multiattack.actions.multiattack.steps.pick2.prompt: 'Attack'
monsters.solar.multiattack.actions.multiattack.options.flying-sword.name: 'Flying Sword'
monsters.solar.multiattack.actions.multiattack.options.slaying-bow.name: 'Slaying Bow'
monsters.solar.multiattack.name: 'Multiattack'
monsters.solar.multiattack.description: 'The solar makes two Flying Sword attacks. It can replace one attack with a use of Slaying Bow.'
monsters.solar.flying-sword.name: 'Flying Sword'
monsters.solar.flying-sword.description: "*Melee or Ranged Attack Roll:* +15, reach 10 ft. or range 120 ft. *Hit:* 22 (4d6 + 8) Slashing damage plus 36 (8d8) Radiant damage. *Hit or Miss:* The sword magically returns to the solar's hand or hovers within 5 feet of the solar immediately after a ranged attack."
monsters.solar.slaying-bow.name: 'Slaying Bow'
monsters.solar.slaying-bow.description: '*Dexterity Saving Throw:* DC 21, one creature the solar can see within 600 feet. *Failure:* If the creature has 100 Hit Points or fewer, it dies. It otherwise takes 24 (4d8 + 6) Piercing damage plus 36 (8d8) Radiant damage.'
monsters.solar.spellcasting.name: 'Spellcasting'
monsters.solar.spellcasting.description: |-
  The solar casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 25):

  *At Will:* *Detect Evil and Good*

  *1/Day Each:* *Commune*, *Control Weather*, *Dispel Evil and Good*, *Resurrection*
monsters.solar.divine-aid.name: 'Divine Aid'
monsters.solar.divine-aid.description: 'The solar casts *Cure Wounds* (level 2 version), *Lesser Restoration*, or *Remove Curse*, using the same spellcasting ability as Spellcasting.'
monsters.solar.blinding-gaze.name: 'Blinding Gaze'
monsters.solar.blinding-gaze.description: "*Constitution Saving Throw:* DC 25, one creature the solar can see within 120 feet. *Failure:* The target has the Blinded condition for 1 minute. *Failure or Success:* The solar can't take this action again until the start of its next turn."
monsters.solar.radiant-teleport.name: 'Radiant Teleport'
monsters.solar.radiant-teleport.description: 'The solar teleports up to 60 feet to an unoccupied space it can see. *Dexterity Saving Throw:* DC 25, each creature in a 10-foot Emanation originating from the solar at its destination space. *Failure:* 11 (2d10) Radiant damage. *Success:* Half damage.'
monsters.solar.texts.legendary: "Legendary Action Uses: 3. Immediately after another creature's turn, the solar can expend a use to take one of the following actions. The solar regains all expended uses at the start of each of its turns."

monsters.specter.name: 'Specter'
monsters.specter.incorporeal-movement.name: 'Incorporeal Movement'
monsters.specter.incorporeal-movement.description: 'The specter can move through other creatures and objects as if they were Difficult Terrain. It takes 5 (1d10) Force damage if it ends its turn inside an object.'
monsters.specter.sunlight-sensitivity.name: 'Sunlight Sensitivity'
monsters.specter.sunlight-sensitivity.description: 'While in sunlight, the specter has Disadvantage on ability checks and attack rolls.'
monsters.specter.life-drain.name: 'Life Drain'
monsters.specter.life-drain.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 7 (2d6) Necrotic damage. If the target is a creature, its Hit Point maximum decreases by an amount equal to the damage taken.'

monsters.sphinx-of-lore.name: 'Sphinx of Lore'
monsters.sphinx-of-lore.inscrutable.name: 'Inscrutable'
monsters.sphinx-of-lore.inscrutable.description: 'No magic can observe the sphinx remotely or detect its thoughts without its permission. Wisdom (Insight) checks made to ascertain its intentions or sincerity are made with Disadvantage.'
monsters.sphinx-of-lore.legendary-resistance.name: 'Legendary Resistance'
monsters.sphinx-of-lore.legendary-resistance.description: 'If the sphinx fails a saving throw, it can choose to succeed instead.'
monsters.sphinx-of-lore.multiattack.actions.multiattack.name: 'Multiattack'
monsters.sphinx-of-lore.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.sphinx-of-lore.multiattack.name: 'Multiattack'
monsters.sphinx-of-lore.multiattack.description: 'The sphinx makes three Claw attacks.'
monsters.sphinx-of-lore.claw.name: 'Claw'
monsters.sphinx-of-lore.claw.description: '*Melee Attack Roll:* +8, reach 5 ft. *Hit:* 14 (3d6 + 4) Slashing damage.'
monsters.sphinx-of-lore.mind-rending-roar.name: 'Mind-Rending Roar'
monsters.sphinx-of-lore.mind-rending-roar.description: "*Wisdom Saving Throw:* DC 16, each enemy in a 300-foot Emanation originating from the sphinx. *Failure:* 35 (10d6) Psychic damage, and the target has the Incapacitated condition until the start of the sphinx's next turn."
monsters.sphinx-of-lore.spellcasting.name: 'Spellcasting'
monsters.sphinx-of-lore.spellcasting.description: |-
  The sphinx casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 16):

  *At Will:* *Detect Magic*, *Identify*, *Mage Hand*, *Minor Illusion*, *Prestidigitation*

  *1/Day Each:* *Dispel Magic*, *Legend Lore*, *Locate Object*, *Plane Shift*, *Remove Curse*, *Tongues*
monsters.sphinx-of-lore.arcane-prowl.name: 'Arcane Prowl'
monsters.sphinx-of-lore.arcane-prowl.description: 'The sphinx can teleport up to 30 feet to an unoccupied space it can see, and it makes one Claw attack.'
monsters.sphinx-of-lore.weight-of-years.name: 'Weight of Years'
monsters.sphinx-of-lore.weight-of-years.description: "*Constitution Saving Throw:* DC 16, one creature the sphinx can see within 120 feet. *Failure:* The target gains 1 Exhaustion level. While the target has any Exhaustion levels, it appears 3d10 years older. *Failure or Success:* The sphinx can't take this action again until the start of its next turn."
monsters.sphinx-of-lore.texts.legendary: "Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the sphinx can expend a use to take one of the following actions. The sphinx regains all expended uses at the start of each of its turns."

monsters.sphinx-of-valor.name: 'Sphinx of Valor'
monsters.sphinx-of-valor.inscrutable.name: 'Inscrutable'
monsters.sphinx-of-valor.inscrutable.description: 'No magic can observe the sphinx remotely or detect its thoughts without its permission. Wisdom (Insight) checks made to ascertain its intentions or sincerity are made with Disadvantage.'
monsters.sphinx-of-valor.legendary-resistance.name: 'Legendary Resistance'
monsters.sphinx-of-valor.legendary-resistance.description: 'If the sphinx fails a saving throw, it can choose to succeed instead.'
monsters.sphinx-of-valor.multiattack.actions.multiattack.name: 'Multiattack'
monsters.sphinx-of-valor.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.sphinx-of-valor.multiattack.name: 'Multiattack'
monsters.sphinx-of-valor.multiattack.description: 'The sphinx makes two Claw attacks and uses Roar.'
monsters.sphinx-of-valor.claw.name: 'Claw'
monsters.sphinx-of-valor.claw.description: '*Melee Attack Roll:* +12, reach 5 ft. *Hit:* 20 (4d6 + 6) Slashing damage.'
monsters.sphinx-of-valor.roar.name: 'Roar'
monsters.sphinx-of-valor.roar.description: 'The sphinx emits a magical roar. Whenever it roars, the roar has a different effect, as detailed below (the sequence resets when it takes a Long Rest):'
monsters.sphinx-of-valor.first-roar.name: 'First Roar'
monsters.sphinx-of-valor.first-roar.description: '*Wisdom Saving Throw:* DC 20, each enemy in a 500-foot Emanation originating from the sphinx. *Failure:* The target has the Frightened condition for 1 minute.'
monsters.sphinx-of-valor.second-roar.name: 'Second Roar'
monsters.sphinx-of-valor.second-roar.description: '*Wisdom Saving Throw:* DC 20, each enemy in a 500-foot Emanation originating from the sphinx. *Failure:* The target has the Paralyzed condition, and it repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.'
monsters.sphinx-of-valor.third-roar.name: 'Third Roar'
monsters.sphinx-of-valor.third-roar.description: '*Constitution Saving Throw:* DC 20, each enemy in a 500-foot Emanation originating from the sphinx. *Failure:* 44 (8d10) Thunder damage, and the target has the Prone condition. *Success:* Half damage only.'
monsters.sphinx-of-valor.spellcasting.name: 'Spellcasting'
monsters.sphinx-of-valor.spellcasting.description: |-
  The sphinx casts one of the following spells, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 20):

  *At Will:* *Detect Evil and Good*, *Thaumaturgy*

  *1/Day Each:* *Detect Magic*, *Dispel Magic*, *Greater Restoration*, *Heroes' Feast*, *Zone of Truth*
monsters.sphinx-of-valor.arcane-prowl.name: 'Arcane Prowl'
monsters.sphinx-of-valor.arcane-prowl.description: 'The sphinx can teleport up to 30 feet to an unoccupied space it can see, and it makes one Claw attack.'
monsters.sphinx-of-valor.weight-of-years.name: 'Weight of Years'
monsters.sphinx-of-valor.weight-of-years.description: "*Constitution Saving Throw:* DC 16, one creature the sphinx can see within 120 feet. *Failure:* The target gains 1 Exhaustion level. While the target has any Exhaustion levels, it appears 3d10 years older. *Failure or Success:* The sphinx can't take this action again until the start of its next turn."
monsters.sphinx-of-valor.texts.legendary: "Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the sphinx can expend a use to take one of the following actions. The sphinx regains all expended uses at the start of each of its turns."
