monsters.spirit-naga.multiattack.description: 'The naga makes three attacks, using Bite or Necrotic Ray in any combination.'
monsters.spirit-naga.bite.name: 'Bite'
monsters.spirit-naga.bite.description: '*Melee Attack Roll:* +7, reach 10 ft. *Hit:* 7 (1d6 + 4) Piercing damage plus 14 (4d6) Poison damage.'
monsters.spirit-naga.necrotic-ray.name: 'Necrotic Ray'
monsters.spirit-naga.necrotic-ray.description: '*Ranged Attack Roll:* +6, range 60 ft. *Hit:* 21 (6d6) Necrotic damage.'
monsters.spirit-naga.hold-person.name: 'Hold Person (level 3 version)'
monsters.spirit-naga.hold-person.description: "A spell of the spirit naga's Spellcasting, cast at level 3."
monsters.spirit-naga.lightning-bolt.name: 'Lightning Bolt (level 4 version)'
monsters.spirit-naga.lightning-bolt.description: "A spell of the spirit naga's Spellcasting, cast at level 4."
