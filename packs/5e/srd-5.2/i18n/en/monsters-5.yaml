monsters.sphinx-of-wonder.name: 'Sphinx of Wonder'
monsters.sphinx-of-wonder.magic-resistance.name: 'Magic Resistance'
monsters.sphinx-of-wonder.magic-resistance.description: 'The sphinx has Advantage on saving throws against spells and other magical effects.'
monsters.sphinx-of-wonder.rend.name: 'Rend'
monsters.sphinx-of-wonder.rend.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 5 (1d4 + 3) Slashing damage plus 7 (2d6) Radiant damage.'
monsters.sphinx-of-wonder.burst-of-ingenuity.name: 'Burst of Ingenuity'
monsters.sphinx-of-wonder.burst-of-ingenuity.description: '*Trigger:* The sphinx or another creature within 30 feet makes an ability check or a saving throw. *Response:* The sphinx adds 2 to the roll.'

monsters.spider.name: 'Spider'
monsters.spider.spider-climb.name: 'Spider Climb'
monsters.spider.spider-climb.description: 'The spider can climb difficult surfaces, including along ceilings, without needing to make an ability check.'
monsters.spider.web-walker.name: 'Web Walker'
monsters.spider.web-walker.description: 'The spider ignores movement restrictions caused by webs, and the spider knows the location of any other creature in contact with the same web.'
monsters.spider.bite.name: 'Bite'
monsters.spider.bite.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 1 Piercing damage plus 2 (1d4) Poison damage.'

monsters.spirit-naga.name: 'Spirit Naga'
monsters.spirit-naga.fiendish-restoration.name: 'Fiendish Restoration'
monsters.spirit-naga.fiendish-restoration.description: 'If it dies, the naga returns to life in 1d6 days and regains all its Hit Points. Only a Wish spell can prevent this trait from functioning.'
monsters.spirit-naga.multiattack.actions.multiattack.name: 'Multiattack'
monsters.spirit-naga.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.spirit-naga.multiattack.actions.multiattack.steps.pick1.prompt: 'Attack'
monsters.spirit-naga.multiattack.actions.multiattack.steps.pick2.prompt: 'Attack'
monsters.spirit-naga.multiattack.actions.multiattack.steps.pick3.prompt: 'Attack'
monsters.spirit-naga.multiattack.actions.multiattack.options.bite.name: 'Bite'
monsters.spirit-naga.multiattack.actions.multiattack.options.necrotic-ray.name: 'Necrotic Ray'
