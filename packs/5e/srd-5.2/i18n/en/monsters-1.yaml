monsters.archmage.spellcasting.name: 'Spellcasting'
monsters.archmage.spellcasting.description: |-
  The archmage casts one of the following spells, using Intelligence as the spellcasting ability (spell save DC 17):

  *At Will:* *Detect Magic*, *Detect Thoughts*, *Disguise Self*, *Invisibility*, *Light*, *Mage Armor* (included in AC), *Mage Hand*, *Prestidigitation*

  *2/Day Each:* *Fly*, *Lightning Bolt* (level 7 version)

  *1/Day Each:* *Cone of Cold* (level 9 version), *Mind Blank* (cast before combat), *Scrying*, *Teleport*
monsters.archmage.misty-step.name: 'Misty Step'
monsters.archmage.misty-step.description: 'The mage casts *Misty Step*, using the same spellcasting ability as Spellcasting.'
monsters.archmage.protective-magic.name: 'Protective Magic'
monsters.archmage.protective-magic.description: "The archmage casts *Counterspell* or *Shield* in response to the spell's trigger, using the same spellcasting ability as Spellcasting."

