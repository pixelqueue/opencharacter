monsters.aboleth.name: 'Aboleth'
monsters.aboleth.amphibious.name: 'Amphibious'
monsters.aboleth.amphibious.description: 'The aboleth can breathe air and water.'
monsters.aboleth.eldritch-restoration.name: 'Eldritch Restoration'
monsters.aboleth.eldritch-restoration.description: 'If destroyed, the aboleth gains a new body in 5d10 days, reviving with all its Hit Points in the Far Realm or another location chosen by the GM.'
monsters.aboleth.legendary-resistance.name: 'Legendary Resistance'
monsters.aboleth.legendary-resistance.description: 'If the aboleth fails a saving throw, it can choose to succeed instead.'
monsters.aboleth.mucus-cloud.name: 'Mucus Cloud'
monsters.aboleth.mucus-cloud.description: |-
  While underwater, the aboleth is surrounded by mucus. *Constitution Saving Throw:* DC 14, each creature in a 5-foot Emanation originating from the aboleth at the end of the aboleth's turn. *Failure:* The target is cursed. Until the curse ends, the target's skin becomes slimy, the target can breathe air and water, and it can't regain Hit Points unless it is underwater.

  While the cursed creature is outside a body of water, the creature takes 6 (1d12) Acid damage at the end of every 10 minutes unless moisture is applied to its skin before those minutes have passed.
monsters.aboleth.probing-telepathy.name: 'Probing Telepathy'
monsters.aboleth.probing-telepathy.description: "If a creature the aboleth can see communicates telepathically with the aboleth, the aboleth learns the creature's greatest desires."
monsters.aboleth.multiattack.actions.multiattack.name: 'Multiattack'
monsters.aboleth.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.aboleth.multiattack.name: 'Multiattack'
monsters.aboleth.multiattack.description: 'The aboleth makes two Tentacle attacks and uses either Consume Memories or Dominate Mind if available.'
monsters.aboleth.tentacle.name: 'Tentacle'
monsters.aboleth.tentacle.description: '*Melee Attack Roll:* +9, reach 15 ft. *Hit:* 12 (2d6 + 5) Bludgeoning damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of four tentacles.'
monsters.aboleth.consume-memories.name: 'Consume Memories'
monsters.aboleth.consume-memories.description: "*Intelligence Saving Throw:* DC 16, one creature within 30 feet that is Charmed or Grappled by the aboleth. *Failure:* 10 (3d6) Psychic damage. *Success:* Half damage. *Failure or Success:* The aboleth gains the target's memories if the target is a Humanoid and is reduced to 0 Hit Points by this action."
monsters.aboleth.dominate-mind.name: 'Dominate Mind'
monsters.aboleth.dominate-mind.description: |-
  *Wisdom Saving Throw:* DC 16, one creature the aboleth can see within 30 feet. *Failure:* The target has the Charmed condition until the aboleth dies or is on a different plane of existence from the target. While Charmed, the target acts as an ally to the aboleth and is under its control while within 60 feet of it. In addition, the aboleth and the target can communicate telepathically with each other over any distance.

  The target repeats the save whenever it takes damage as well as after every 24 hours it spends at least 1 mile away from the aboleth, ending the effect on itself on a success.
monsters.aboleth.lash.name: 'Lash'
monsters.aboleth.lash.description: 'The aboleth makes one Tentacle attack.'
monsters.aboleth.psychic-drain.name: 'Psychic Drain'
monsters.aboleth.psychic-drain.description: 'If the aboleth has at least one creature Charmed or Grappled, it uses Consume Memories and regains 5 (1d10) Hit Points.'
monsters.aboleth.texts.legendary: "Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the aboleth can expend a use to take one of the following actions. The aboleth regains all expended uses at the start of each of its turns."
monsters.aboleth.multiattack.actions.multiattack.steps.extra.prompt: 'Also use'
monsters.aboleth.multiattack.actions.multiattack.options.dominate-mind.name: 'Dominate Mind'
monsters.aboleth.multiattack.actions.multiattack.options.consume-memories.name: 'Consume Memories'
monsters.aboleth.multiattack.actions.multiattack.options.none.name: 'Neither'

