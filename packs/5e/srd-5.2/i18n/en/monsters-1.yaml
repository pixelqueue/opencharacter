monsters.balor.death-throes.name: 'Death Throes'
monsters.balor.death-throes.description: 'The balor explodes when it dies. *Dexterity Saving Throw:* DC 20, each creature in a 30-foot Emanation originating from the balor. *Failure:* 31 (9d6) Fire damage plus 31 (9d6) Force damage. *Success:* Half damage. *Failure or Success:* If the balor dies outside the Abyss, it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.'
monsters.balor.fire-aura.name: 'Fire Aura'
monsters.balor.fire-aura.description: "At the end of each of the balor's turns, each creature in a 5-foot Emanation originating from the balor takes 13 (3d8) Fire damage."
