monsters.bugbear-stalker.javelin.description: '*Melee or Ranged Attack Roll:* +5, reach 10 ft. or range 30/120 ft. *Hit:* 13 (3d6 + 3) Piercing damage.'
monsters.bugbear-stalker.morningstar.name: 'Morningstar'
monsters.bugbear-stalker.morningstar.description: '*Melee Attack Roll:* +5 (with Advantage if the target is Grappled by the bugbear), reach 10 ft. *Hit:* 12 (2d8 + 3) Piercing damage.'
monsters.bugbear-stalker.quick-grapple.name: 'Quick Grapple'
monsters.bugbear-stalker.quick-grapple.description: '*Dexterity Saving Throw:* DC 13, one Medium or smaller creature the bugbear can see within 10 feet. *Failure:* The target has the Grappled condition (escape DC 13).'

monsters.bugbear-warrior.name: 'Bugbear Warrior'
monsters.bugbear-warrior.abduct.name: 'Abduct'
monsters.bugbear-warrior.abduct.description: "The bugbear needn't spend extra movement to move a creature it is grappling."
monsters.bugbear-warrior.grab.name: 'Grab'
monsters.bugbear-warrior.grab.description: '*Melee Attack Roll:* +4, reach 10 ft. *Hit:* 9 (2d6 + 2) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 12).'
monsters.bugbear-warrior.light-hammer.name: 'Light Hammer'
monsters.bugbear-warrior.light-hammer.description: '*Melee or Ranged Attack Roll:* +4 (with Advantage if the target is Grappled by the bugbear), reach 10 ft. or range 20/60 ft. *Hit:* 9 (3d4 + 2) Bludgeoning damage.'

monsters.bulette.name: 'Bulette'
monsters.bulette.multiattack.actions.multiattack.name: 'Multiattack'
monsters.bulette.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.bulette.multiattack.name: 'Multiattack'
monsters.bulette.multiattack.description: 'The bulette makes two Bite attacks.'
monsters.bulette.bite.name: 'Bite'
monsters.bulette.bite.description: '*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 17 (2d12 + 4) Piercing damage.'
monsters.bulette.deadly-leap.name: 'Deadly Leap'
monsters.bulette.deadly-leap.description: "The bulette spends 5 feet of movement to jump to a space within 15 feet that contains one or more Large or smaller creatures. *Dexterity Saving Throw:* DC 15, each creature in the bulette's destination space. *Failure:* 19 (3d12) Bludgeoning damage, and the target has the Prone condition. *Success:* Half damage, and the target is pushed 5 feet straight away from the bulette."
monsters.bulette.leap.name: 'Leap'
monsters.bulette.leap.description: 'The bulette jumps up to 30 feet by spending 10 feet of movement.'
