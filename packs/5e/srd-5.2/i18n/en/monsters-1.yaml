monsters.basilisk.name: 'Basilisk'
monsters.basilisk.bite.name: 'Bite'
monsters.basilisk.bite.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 10 (2d6 + 3) Piercing damage plus 7 (2d6) Poison damage.'
monsters.basilisk.petrifying-gaze.name: 'Petrifying Gaze'
monsters.basilisk.petrifying-gaze.description: '*Constitution Saving Throw:* DC 12, each creature in a 30-foot Cone. If the basilisk sees its reflection in the Cone, the basilisk must make this save. *First Failure:* The target has the Restrained condition and repeats the save at the end of its next turn if it is still Restrained, ending the effect on itself on a success. *Second Failure:* The target has the Petrified condition instead of the Restrained condition.'

monsters.bearded-devil.name: 'Bearded Devil'
monsters.bearded-devil.magic-resistance.name: 'Magic Resistance'
