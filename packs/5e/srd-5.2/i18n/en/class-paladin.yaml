classes.paladin.name: 'Paladin'
classes.paladin.description: |-
  | Core Paladin Traits | |
  | --- | --- |
  | Primary Ability | Strength and Charisma |
  | Hit Point Die | D10 per Paladin level |
  | Saving Throw Proficiencies | Wisdom and Charisma |
  | Skill Proficiencies | *Choose 2:* Athletics, Insight, Intimidation, Medicine, Persuasion, or Religion |
  | Weapon Proficiencies | Simple and Martial weapons |
  | Armor Training | Light, Medium, and Heavy armor and Shields |
  | Starting Equipment | *Choose A or B:* (A) Chain Mail, Shield, Longsword, 6 Javelins, Holy Symbol, Priest’s Pack, and 9 GP; or (B) 150 GP |

  ***As a Level 1 Character.*** Gain all the traits in the Core Paladin Traits table. Gain the Paladin’s level 1 features, which are listed in the Paladin Features table.

  ***As a Multiclass Character.*** Gain the following traits from the Core Paladin Traits table: Hit Point Die, proficiency with Martial weapons, and training with Light and Medium armor and Shields. Gain the Paladin’s level 1 features, which are listed in the Paladin Features table. See the multiclassing rules in “Character Creation” to determine your available spell slots.
classes.paladin.prerequisites.multiclass: 'Strength 13 and Charisma 13 to multiclass'
