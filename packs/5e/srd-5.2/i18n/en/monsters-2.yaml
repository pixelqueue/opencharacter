monsters.centaur-trooper.trampling-charge.description: 'The centaur moves up to its Speed without provoking Opportunity Attacks and can move through the spaces of Medium or smaller creatures. Each creature whose space the centaur enters is targeted once by the following effect. *Strength Saving Throw:* DC 14. *Failure:* 7 (1d6 + 4) Bludgeoning damage, and the target has the Prone condition.'

monsters.chain-devil.name: 'Chain Devil'
monsters.chain-devil.diabolical-restoration.name: 'Diabolical Restoration'
monsters.chain-devil.diabolical-restoration.description: 'If the devil dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.'
monsters.chain-devil.magic-resistance.name: 'Magic Resistance'
monsters.chain-devil.magic-resistance.description: 'The devil has Advantage on saving throws against spells and other magical effects.'
monsters.chain-devil.multiattack.actions.multiattack.name: 'Multiattack'
monsters.chain-devil.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.chain-devil.multiattack.name: 'Multiattack'
monsters.chain-devil.multiattack.description: 'The devil makes two Chain attacks and uses Conjure Infernal Chain.'
monsters.chain-devil.chain.name: 'Chain'
monsters.chain-devil.chain.description: '*Melee Attack Roll:* +7, reach 10 ft. *Hit:* 11 (2d6 + 4) Slashing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of two chains, and it has the Restrained condition until the grapple ends.'
monsters.chain-devil.conjure-infernal-chain.name: 'Conjure Infernal Chain'
monsters.chain-devil.conjure-infernal-chain.description: "The devil conjures a fiery chain to bind a creature. *Dexterity Saving Throw:* DC 15, one creature the devil can see within 60 feet. *Failure:* 9 (2d4 + 4) Fire damage, and the target has the Restrained condition until the end of the devil's next turn, at which point the chain disappears. If the target is Large or smaller, the devil moves the target up to 30 feet straight toward itself. *Success:* The chain disappears."
monsters.chain-devil.unnerving-gaze.name: 'Unnerving Gaze'
monsters.chain-devil.unnerving-gaze.description: "*Trigger:* A creature the devil can see starts its turn within 30 feet of the devil and can see the devil. Response—*Wisdom Saving Throw:* DC 15, the triggering creature. *Failure:* The target has the Frightened condition until the end of its turn. *Success:* The target is immune to this devil's Unnerving Gaze for 24 hours."

monsters.chimera.name: 'Chimera'
monsters.chimera.multiattack.actions.multiattack.name: 'Multiattack'
