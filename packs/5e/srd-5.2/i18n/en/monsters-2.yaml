monsters.ettercap.spider-climb.description: 'The ettercap can climb difficult surfaces, including along ceilings, without needing to make an ability check.'
monsters.ettercap.web-walker.name: 'Web Walker'
monsters.ettercap.web-walker.description: 'The ettercap ignores movement restrictions caused by webs, and the ettercap knows the location of any other creature in contact with the same web.'
