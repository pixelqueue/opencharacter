monsters.chuul.pincer.description: '*Melee Attack Roll:* +6, reach 10 ft. *Hit:* 9 (1d10 + 4) Bludgeoning damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of two pincers.'
monsters.chuul.paralyzing-tentacles.name: 'Paralyzing Tentacles'
monsters.chuul.paralyzing-tentacles.description: '*Constitution Saving Throw:* DC 13, one creature Grappled by the chuul. *Failure:* The target has the Poisoned condition and repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically. While Poisoned, the target has the Paralyzed condition.'

monsters.clay-golem.name: 'Clay Golem'
monsters.clay-golem.acid-absorption.name: 'Acid Absorption'
monsters.clay-golem.acid-absorption.description: 'Whenever the golem is subjected to Acid damage, it takes no damage and instead regains a number of Hit Points equal to the Acid damage dealt.'
monsters.clay-golem.berserk.name: 'Berserk'
monsters.clay-golem.berserk.description: 'Whenever the golem starts its turn Bloodied, roll 1d6. On a 6, the golem goes berserk. On each of its turns while berserk, the golem attacks the nearest creature it can see. If no creature is near enough to move to and attack, the golem attacks an object. Once the golem goes berserk, it continues to be berserk until it is destroyed or it is no longer Bloodied.'
monsters.clay-golem.immutable-form.name: 'Immutable Form'
monsters.clay-golem.immutable-form.description: "The golem can't shape-shift."
monsters.clay-golem.magic-resistance.name: 'Magic Resistance'
monsters.clay-golem.magic-resistance.description: 'The golem has Advantage on saving throws against spells and other magical effects.'
monsters.clay-golem.multiattack.actions.multiattack.name: 'Multiattack'
monsters.clay-golem.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.clay-golem.multiattack.name: 'Multiattack'
monsters.clay-golem.multiattack.description: 'The golem makes two Slam attacks, or it makes three Slam attacks if it used Hasten this turn.'
monsters.clay-golem.slam.name: 'Slam'
monsters.clay-golem.slam.description: "*Melee Attack Roll:* +9, reach 5 ft. *Hit:* 10 (1d10 + 5) Bludgeoning damage plus 6 (1d12) Acid damage, and the target's Hit Point maximum decreases by an amount equal to the Acid damage taken."
monsters.clay-golem.hasten.name: 'Hasten'
monsters.clay-golem.hasten.description: 'The golem takes the Dash and Disengage actions.'
monsters.clay-golem.multiattack.actions.multiattack.steps.mode.prompt: 'Attacks'
