monsters.gelatinous-cube.name: 'Gelatinous Cube'
monsters.gelatinous-cube.ooze-cube.name: 'Ooze Cube'
monsters.gelatinous-cube.ooze-cube.description: |-
  The cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to the cube's Engulf and has Disadvantage on the saving throw.

  Creatures inside the cube have Total Cover, and the cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time.

  As an action, a creature within 5 feet of the cube can pull a creature or an object out of the cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.
monsters.gelatinous-cube.transparent.name: 'Transparent'
monsters.gelatinous-cube.transparent.description: "Even when the cube is in plain sight, a creature must succeed on a DC 15 Wisdom (Perception) check to notice the cube if the creature hasn't witnessed the cube move or otherwise act."
monsters.gelatinous-cube.pseudopod.name: 'Pseudopod'
monsters.gelatinous-cube.pseudopod.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 12 (3d6 + 2) Acid damage.'
monsters.gelatinous-cube.engulf.name: 'Engulf'
monsters.gelatinous-cube.engulf.description: "The cube moves up to its Speed without provoking Opportunity Attacks. The cube can move through the spaces of Large or smaller creatures if it has room inside itself to contain them (see the Ooze Cube trait). *Dexterity Saving Throw:* DC 12, each creature whose space the cube enters for the first time during this move. *Failure:* 10 (3d6) Acid damage, and the target is engulfed. An engulfed target is suffocating, can't cast spells with a Verbal component, has the Restrained condition, and takes 10 (3d6) Acid damage at the start of each of the cube's turns. When the cube moves, the engulfed target moves with it. An engulfed target can try to escape by taking an action to make a DC 12 Strength (Athletics) check. On a successful check, the target escapes and enters the nearest unoccupied space. *Success:* Half damage, and the target moves to an unoccupied space within 5 feet of the cube. If there is no unoccupied space, the target fails the save instead."

monsters.ghast.name: 'Ghast'
monsters.ghast.stench.name: 'Stench'
monsters.ghast.stench.description: "*Constitution Saving Throw:* DC 10, any creature that starts its turn in a 5-foot Emanation originating from the ghast. *Failure:* The target has the Poisoned condition until the start of its next turn. *Success:* The target is immune to this ghast's Stench for 24 hours."
monsters.ghast.bite.name: 'Bite'
monsters.ghast.bite.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 7 (1d8 + 3) Piercing damage plus 9 (2d8) Necrotic damage.'
monsters.ghast.claw.name: 'Claw'
monsters.ghast.claw.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 10 (2d6 + 3) Slashing damage. If the target is a non-Undead creature, it is subjected to the following effect. *Constitution Saving Throw:* DC 10. *Failure:* The target has the Paralyzed condition until the end of its next turn.'

monsters.ghost.name: 'Ghost'
monsters.ghost.ethereal-sight.name: 'Ethereal Sight'
monsters.ghost.ethereal-sight.description: 'The ghost can see 60 feet into the Ethereal Plane when it is on the Material Plane.'
monsters.ghost.incorporeal-movement.name: 'Incorporeal Movement'
monsters.ghost.incorporeal-movement.description: 'The ghost can move through other creatures and objects as if they were Difficult Terrain. It takes 5 (1d10) Force damage if it ends its turn inside an object.'
monsters.ghost.multiattack.actions.multiattack.name: 'Multiattack'
monsters.ghost.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.ghost.multiattack.name: 'Multiattack'
monsters.ghost.multiattack.description: 'The ghost makes two Withering Touch attacks.'
monsters.ghost.withering-touch.name: 'Withering Touch'
monsters.ghost.withering-touch.description: '*Melee Attack Roll:* +5, reach 5 ft. *Hit:* 19 (3d10 + 3) Necrotic damage.'
monsters.ghost.etherealness.name: 'Etherealness'
monsters.ghost.etherealness.description: "The ghost casts the *Etherealness* spell, requiring no spell components and using Charisma as the spellcasting ability. The ghost is visible on the Material Plane while on the Border Ethereal and vice versa, but it can't affect or be affected by anything on the other plane."
monsters.ghost.horrific-visage.name: 'Horrific Visage'
monsters.ghost.horrific-visage.description: "*Wisdom Saving Throw:* DC 13, each creature in a 60-foot Cone that can see the ghost and isn't an Undead. *Failure:* 10 (2d6 + 3) Psychic damage, and the target has the Frightened condition until the start of the ghost's next turn. *Success:* The target is immune to this ghost's Horrific Visage for 24 hours."
monsters.ghost.possession.name: 'Possession'
monsters.ghost.possession.description: |-
  *Charisma Saving Throw:* DC 13, one Humanoid the ghost can see within 5 feet. *Failure:* The target is possessed by the ghost; the ghost disappears, and the target has the Incapacitated condition and loses control of its body. The ghost now controls the body, but the target retains awareness. The ghost can't be targeted by any attack, spell, or other effect, except ones that specifically target Undead. The ghost's game statistics are the same, except it uses the possessed target's Speed, as well as the target's Strength, Dexterity, and Constitution modifiers.

  The possession lasts until the body drops to 0 Hit Points or the ghost leaves as a Bonus Action. When the possession ends, the ghost appears in an unoccupied space within 5 feet of the target, and the target is immune to this ghost's Possession for 24 hours.

  *Success:* The target is immune to this ghost's Possession for 24 hours.

