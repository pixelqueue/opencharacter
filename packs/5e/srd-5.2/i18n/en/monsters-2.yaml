monsters.erinyes.diabolical-restoration.name: 'Diabolical Restoration'
monsters.erinyes.diabolical-restoration.description: 'If the erinyes dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.'
monsters.erinyes.magic-resistance.name: 'Magic Resistance'
monsters.erinyes.magic-resistance.description: 'The erinyes has Advantage on saving throws against spells and other magical effects.'
monsters.erinyes.magic-rope.name: 'Magic Rope'
monsters.erinyes.magic-rope.description: 'The erinyes has a magic rope. While bearing it, the erinyes can use the Entangling Rope action. The rope has AC 20, HP 90, and Immunity to Poison and Psychic damage. The rope turns to dust if reduced to 0 Hit Points, if it is 5+ feet away from the erinyes for 1 hour or more, or if the erinyes dies. If the rope is damaged or destroyed, the erinyes can fully restore it when finishing a Short or Long Rest.'
monsters.erinyes.multiattack.actions.multiattack.name: 'Multiattack'
monsters.erinyes.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.erinyes.multiattack.name: 'Multiattack'
monsters.erinyes.multiattack.description: 'The erinyes makes three Withering Sword attacks and can use Entangling Rope.'
monsters.erinyes.withering-sword.name: 'Withering Sword'
monsters.erinyes.withering-sword.description: '*Melee Attack Roll:* +8, reach 5 ft. *Hit:* 13 (2d8 + 4) Slashing damage plus 11 (2d10) Necrotic damage.'
monsters.erinyes.entangling-rope.texts.note: 'Requires Magic Rope'
