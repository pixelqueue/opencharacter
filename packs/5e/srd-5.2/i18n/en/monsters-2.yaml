monsters.clay-golem.multiattack.actions.multiattack.options.two.name: 'Two Slams'

monsters.cloaker.name: 'Cloaker'
monsters.cloaker.light-sensitivity.name: 'Light Sensitivity'
monsters.cloaker.light-sensitivity.description: 'While in Bright Light, the cloaker has Disadvantage on attack rolls.'
monsters.cloaker.multiattack.actions.multiattack.name: 'Multiattack'
monsters.cloaker.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.cloaker.multiattack.name: 'Multiattack'
monsters.cloaker.multiattack.description: 'The cloaker makes one Attach attack and two Tail attacks.'
monsters.cloaker.attach.name: 'Attach'
monsters.cloaker.attach.description: |-
  *Melee Attack Roll:* +6, reach 5 ft. *Hit:* 13 (3d6 + 3) Piercing damage. If the target is a Large or smaller creature, the cloaker attaches to it. While the cloaker is attached, the target has the Blinded condition, and the cloaker can't make Attach attacks against other targets. In addition, the cloaker halves the damage it takes (round down), and the target takes the same amount of damage.

  The cloaker can detach itself by spending 5 feet of movement. The target or a creature within 5 feet of it can take an action to try to detach the cloaker, doing so by succeeding on a DC 14 Strength (Athletics) check.
monsters.cloaker.tail.name: 'Tail'
monsters.cloaker.tail.description: '*Melee Attack Roll:* +6, reach 10 ft. *Hit:* 8 (1d10 + 3) Slashing damage.'
monsters.cloaker.moan.name: 'Moan'
monsters.cloaker.moan.description: "*Wisdom Saving Throw:* DC 13, each creature in a 60-foot Emanation originating from the cloaker. *Failure:* The target has the Frightened condition until the end of the cloaker's next turn. *Success:* The target is immune to this cloaker's Moan for the next 24 hours."
monsters.cloaker.phantasms.name: 'Phantasms'
monsters.cloaker.phantasms.description: 'The cloaker casts the *Mirror Image* spell, requiring no spell components and using Wisdom as the spellcasting ability. The spell ends early if the cloaker starts or ends its turn in Bright *Light*.'

monsters.cloud-giant.name: 'Cloud Giant'
monsters.cloud-giant.multiattack.actions.multiattack.name: 'Multiattack'
monsters.cloud-giant.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.cloud-giant.multiattack.actions.multiattack.steps.pick1.prompt: 'Attack'
monsters.cloud-giant.multiattack.actions.multiattack.steps.pick2.prompt: 'Attack'
