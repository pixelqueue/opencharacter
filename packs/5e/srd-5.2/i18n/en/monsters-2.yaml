monsters.cloud-giant.multiattack.actions.multiattack.options.thundercloud.name: 'Thundercloud'
monsters.cloud-giant.multiattack.actions.multiattack.options.fog-cloud.name: 'Cast Fog Cloud'
monsters.cloud-giant.multiattack.name: 'Multiattack'
monsters.cloud-giant.multiattack.description: 'The giant makes two attacks, using Thunderous Mace or Thundercloud in any combination. It can replace one attack with a use of Spellcasting to cast Fog Cloud.'
monsters.cloud-giant.thunderous-mace.name: 'Thunderous Mace'
monsters.cloud-giant.thunderous-mace.description: '*Melee Attack Roll:* +12, reach 10 ft. *Hit:* 21 (3d8 + 8) Bludgeoning damage plus 7 (2d6) Thunder damage.'
monsters.cloud-giant.thundercloud.name: 'Thundercloud'
monsters.cloud-giant.thundercloud.description: '*Ranged Attack Roll:* +12, range 240 ft. *Hit:* 18 (3d6 + 8) Thunder damage, and the target has the Incapacitated condition until the end of its next turn.'
monsters.cloud-giant.spellcasting.name: 'Spellcasting'
monsters.cloud-giant.spellcasting.description: |-
  The giant casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 15):

  *At Will:* *Detect Magic*, *Fog Cloud*, *Light*

  *1/Day Each:* *Control Weather*, *Gaseous Form*, *Telekinesis*
monsters.cloud-giant.misty-step.name: 'Misty Step'
monsters.cloud-giant.misty-step.description: 'The giant casts the *Misty Step* spell, using the same spellcasting ability as Spellcasting.'

monsters.cockatrice.name: 'Cockatrice'
monsters.cockatrice.petrifying-bite.name: 'Petrifying Bite'
monsters.cockatrice.petrifying-bite.description: '*Melee Attack Roll:* +3, reach 5 ft. *Hit:* 3 (1d4 + 1) Piercing damage. If the target is a creature, it is subjected to the following effect. *Constitution Saving Throw:* DC 11. *First Failure:* The target has the Restrained condition. The target repeats the save at the end of its next turn if it is still Restrained, ending the effect on itself on a success. *Second Failure:* The target has the Petrified condition, instead of the Restrained condition, for 24 hours.'

monsters.commoner.name: 'Commoner'
monsters.commoner.training.name: 'Training'
monsters.commoner.training.description: "The commoner has proficiency in one skill of the GM's choice and has Advantage whenever it makes an ability check using that skill."
monsters.commoner.club.name: 'Club'
monsters.commoner.club.description: '*Melee Attack Roll:* +2, reach 5 ft. *Hit:* 2 (1d4) Bludgeoning damage.'

monsters.constrictor-snake.name: 'Constrictor Snake'
monsters.constrictor-snake.bite.name: 'Bite'
monsters.constrictor-snake.bite.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 6 (1d8 + 2) Piercing damage.'
monsters.constrictor-snake.constrict.name: 'Constrict'
monsters.constrictor-snake.constrict.description: '*Strength Saving Throw:* DC 12, one Medium or smaller creature the snake can see within 5 feet. *Failure:* 7 (3d4) Bludgeoning damage, and the target has the Grappled condition (escape DC 12).'

monsters.copper-dragon-wyrmling.name: 'Copper Dragon Wyrmling'
monsters.copper-dragon-wyrmling.rend.name: 'Rend'
monsters.copper-dragon-wyrmling.rend.description: '*Melee Attack Roll:* +4, reach 5 ft. *Hit:* 7 (1d10 + 2) Slashing damage.'
monsters.copper-dragon-wyrmling.acid-breath.name: 'Acid Breath'
monsters.copper-dragon-wyrmling.acid-breath.description: '*Dexterity Saving Throw:* DC 11, each creature in a 20-foot-long, 5-foot-wide Line. *Failure:* 18 (4d8) Acid damage. *Success:* Half damage.'
monsters.copper-dragon-wyrmling.slowing-breath.name: 'Slowing Breath'
monsters.copper-dragon-wyrmling.slowing-breath.description: "*Constitution Saving Throw:* DC 11, each creature in a 15-foot Cone. *Failure:* The target can't take Reactions; its Speed is halved; and it can take either an action or a Bonus Action on its turn, not both. This effect lasts until the end of its next turn."

monsters.couatl.name: 'Couatl'
monsters.couatl.shielded-mind.name: 'Shielded Mind'
monsters.couatl.shielded-mind.description: "The couatl's thoughts can't be read by any means, and other creatures can communicate with it telepathically only if it allows them."
monsters.couatl.bite.name: 'Bite'
monsters.couatl.bite.description: "*Melee Attack Roll:* +7, reach 5 ft. *Hit:* 11 (1d12 + 5) Piercing damage, and the target has the Poisoned condition until the end of the couatl's next turn."
monsters.couatl.constrict.name: 'Constrict'
monsters.couatl.constrict.description: '*Strength Saving Throw:* DC 15, one Medium or smaller creature the couatl can see within 5 feet. *Failure:* 8 (1d6 + 5) Bludgeoning damage. The target has the Grappled condition (escape DC 13), and it has the Restrained condition until the grapple ends.'
monsters.couatl.spellcasting.name: 'Spellcasting'
monsters.couatl.spellcasting.description: |-
  The couatl casts one of the following spells, requiring no spell components and using Wisdom as the spellcasting ability (spell save DC 15):

  *At Will:* *Detect Evil and Good*, *Detect Magic*, *Detect Thoughts*, *Shapechange* (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell)

  *1/Day Each:* *Create Food and Water*, *Dream*, *Greater Restoration*, *Scrying*, *Sleep*
monsters.couatl.divine-aid.name: 'Divine Aid'
monsters.couatl.divine-aid.description: 'The couatl casts *Bless*, *Lesser Restoration*, or *Sanctuary*, requiring no spell components and using the same spellcasting ability as Spellcasting.'

