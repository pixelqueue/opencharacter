monsters.fire-elemental.fire-aura.description: "At the end of each of the elemental's turns, each creature in a 10-foot Emanation originating from the elemental takes 5 (1d10) Fire damage. Creatures and flammable objects in the Emanation start burning."
monsters.fire-elemental.fire-form.name: 'Fire Form'
monsters.fire-elemental.fire-form.description: "The elemental can move through a space as narrow as 1 inch without expending extra movement to do so, and it can enter a creature's space and stop there. The first time it enters a creature's space on a turn, that creature takes 5 (1d10) Fire damage."
monsters.fire-elemental.illumination.name: 'Illumination'
