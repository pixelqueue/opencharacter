monsters.fire-elemental.water-susceptibility.name: 'Water Susceptibility'
monsters.fire-elemental.water-susceptibility.description: 'The elemental takes 3 (1d6) Cold damage for every 5 feet the elemental moves in water or for every gallon of water splashed on it.'
