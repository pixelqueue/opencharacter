subclasses.fiend-patron.name: 'Fiend Patron'
subclasses.fiend-patron.description: |-
  **Make a Deal with the Lower Planes**

  Your pact draws on the Lower Planes, the realms of perdition. You might forge a bargain with a demon lord, an archdevil, or another fiend that is especially mighty. That patron’s aims are evil—the corruption or destruction of all things, ultimately including you—and your path is defined by the extent to which you strive against those aims.

features.warlock.dark-ones-blessing.name: 'Dark One’s Blessing'
features.warlock.dark-ones-blessing.description: 'When you reduce an enemy to 0 Hit Points, you gain Temporary Hit Points equal to your Charisma modifier plus your Warlock level (minimum of 1 Temporary Hit Point). You also gain this benefit if someone else reduces an enemy within 10 feet of you to 0 Hit Points.'
features.warlock.dark-ones-blessing.actions.dark-ones-blessing.name: 'Dark One’s Blessing'
features.warlock.dark-ones-blessing.actions.dark-ones-blessing.results.blessed.name: 'Temporary Hit Points gained'

features.warlock.fiend-spells.name: 'Fiend Spells'
features.warlock.fiend-spells.description: |-
  The magic of your patron ensures you always have certain spells ready; when you reach a Warlock level specified in the Fiend Spells table, you thereafter always have the listed spells prepared.

  **Fiend Spells**

  | Warlock Level | Spells |
  | --- | --- |
  | 3 | *Burning Hands*, *Command*, *Scorching Ray*, *Suggestion* |
  | 5 | *Fireball*, *Stinking Cloud* |
  | 7 | *Fire Shield*, *Wall of Fire* |
  | 9 | *Geas*, *Insect Plague* |

features.warlock.dark-ones-own-luck.name: 'Dark One’s Own Luck'
features.warlock.dark-ones-own-luck.description: |-
  You can call on your fiendish patron to alter fate in your favor. When you make an ability check or a saving throw, you can use this feature to add 1d10 to your roll. You can do so after seeing the roll but before any of the roll’s effects occur.

  You can use this feature a number of times equal to your Charisma modifier (minimum of once), but you can use it no more than once per roll. You regain all expended uses when you finish a Long Rest.
features.warlock.dark-ones-own-luck.options.luck.name: 'Dark One’s Own Luck (+1d10)'

features.warlock.fiendish-resilience.name: 'Fiendish Resilience'
features.warlock.fiendish-resilience.description: 'Choose one damage type, other than Force, whenever you finish a Short or Long Rest. You have Resistance to that damage type until you choose a different one with this feature.'
features.warlock.fiendish-resilience.choices.damage-type.prompt: 'Choose a damage type to resist'
