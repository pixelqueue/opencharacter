spells.arcane-hand.actions.clenched-fist.results.miss.name: 'Miss'
spells.arcane-hand.actions.forceful-hand.name: 'Forceful Hand'
spells.arcane-hand.actions.forceful-hand.results.save.name: 'Targets make a saving throw'
