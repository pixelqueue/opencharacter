classes.fighter.name: 'Fighter'
classes.fighter.description: |-
  **Core Fighter Traits**

  | | |
  | --- | --- |
  | Primary Ability | Strength or Dexterity |
  | Hit Point Die | D10 per Fighter level |
  | Saving Throw Proficiencies | Strength and Constitution |
  | Skill Proficiencies | *Choose 2:* Acrobatics, Animal Handling, Athletics, History, Insight, Intimidation, Persuasion, Perception, or Survival |
  | Weapon Proficiencies | Simple and Martial weapons |
  | Armor Training | Light, Medium, and Heavy armor and Shields |
  | Starting Equipment | *Choose A, B, or C:* (A) Chain Mail, Greatsword, Flail, 8 Javelins, Dungeoneer’s Pack, and 4 GP; (B) Studded Leather Armor, Scimitar, Shortsword, Longbow, 20 Arrows, Quiver, Dungeoneer’s Pack, and 11 GP; or (C) 155 GP |

  **Becoming a Fighter …**

  ***As a Level 1 Character***

  - Gain all the traits in the Core Fighter Traits table.
  - Gain the Fighter’s level 1 features, which are listed in the Fighter Features table.

  ***As a Multiclass Character***

  - Gain the following traits from the Core Fighter Traits table: Hit Point Die, proficiency with Martial weapons, and training with Light and Medium armor and Shields.
  - Gain the Fighter’s level 1 features, which are listed in the Fighter Features table.
classes.fighter.prerequisites.multiclass: 'Strength or Dexterity 13 to multiclass'
classes.fighter.choices.skills.prompt: 'Choose two Fighter skills'
classes.fighter.choices.subclass.prompt: 'Choose a Fighter subclass'
classes.fighter.state.secondWindSpent.name: 'Second Wind uses expended'
classes.fighter.state.actionSurgeSpent.name: 'Action Surge uses expended'
classes.fighter.state.indomitableSpent.name: 'Indomitable uses expended'

fields.secondWind.uses.name: 'Second Wind uses'
fields.actionSurge.uses.name: 'Action Surge uses'
fields.indomitable.uses.name: 'Indomitable uses'

features.fighter.fighting-style.name: 'Fighting Style'
features.fighter.fighting-style.description: |-
  You have honed your martial prowess and gain a Fighting Style feat of your choice (see “Feats”). Defense is recommended.

  Whenever you gain a Fighter level, you can replace the feat you chose with a different Fighting Style feat.
features.fighter.fighting-style.choices.style.prompt: 'Choose a Fighting Style feat'

features.fighter.second-wind.name: 'Second Wind'
features.fighter.second-wind.description: |-
  You have a limited well of physical and mental stamina that you can draw on. As a Bonus Action, you can use it to regain Hit Points equal to 1d10 plus your Fighter level.

  You can use this feature twice. You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest.

  When you reach certain Fighter levels, you gain more uses of this feature, as shown in the Second Wind column of the Fighter Features table.
features.fighter.second-wind.actions.second-wind.name: 'Second Wind'
features.fighter.second-wind.actions.second-wind.results.healed.name: 'Healed'

features.fighter.weapon-mastery.name: 'Weapon Mastery'
features.fighter.weapon-mastery.description: |-
  Your training with weapons allows you to use the mastery properties of three kinds of Simple or Martial weapons of your choice. Whenever you finish a Long Rest, you can practice weapon drills and change one of those weapon choices.

  When you reach certain Fighter levels, you gain the ability to use the mastery properties of more kinds of weapons, as shown in the Weapon Mastery column of the Fighter Features table.
features.fighter.weapon-mastery.choices.weapons.prompt: 'Choose the kinds of weapons whose mastery properties you can use'

features.fighter.action-surge.name: 'Action Surge'
features.fighter.action-surge.description: |-
  You can push yourself beyond your normal limits for a moment. On your turn, you can take one additional action, except the Magic action.

  Once you use this feature, you can’t do so again until you finish a Short or Long Rest. Starting at level 17, you can use it twice before a rest but only once on a turn.
features.fighter.action-surge.actions.action-surge.name: 'Action Surge'
features.fighter.action-surge.actions.action-surge.results.surged.name: 'One more action'

features.fighter.tactical-mind.name: 'Tactical Mind'
features.fighter.tactical-mind.description: |-
  You have a mind for tactics on and off the battlefield. When you fail an ability check, you can expend a use of your Second Wind to push yourself toward success. Rather than regaining Hit Points, you roll 1d10 and add the number rolled to the ability check, potentially turning it into a success. If the check still fails, this use of Second Wind isn’t expended.
features.fighter.tactical-mind.options.tactical-mind.name: 'Tactical Mind: add 1d10 (a Second Wind use)'

features.fighter.ability-score-improvement.name: 'Ability Score Improvement'
features.fighter.ability-score-improvement.description: |-
  You gain the Ability Score Improvement feat (see “Feats”) or another feat of your choice for which you qualify. You gain this feature again at Fighter levels 6, 8, 12, 14, and 16.
features.fighter.ability-score-improvement.choices.feat.prompt: 'Choose a feat (Fighter level {slot})'

features.fighter.tactical-shift.name: 'Tactical Shift'
features.fighter.tactical-shift.description: |-
  Whenever you activate your Second Wind with a Bonus Action, you can move up to half your Speed without provoking Opportunity Attacks.

features.fighter.indomitable.name: 'Indomitable'
features.fighter.indomitable.description: |-
  If you fail a saving throw, you can reroll it with a bonus equal to your Fighter level. You must use the new roll, and you can’t use this feature again until you finish a Long Rest.

  You can use this feature twice before a Long Rest starting at level 13 and three times before a Long Rest starting at level 17.
features.fighter.indomitable.options.indomitable.name: 'Indomitable: reroll with your Fighter level'

features.fighter.tactical-master.name: 'Tactical Master'
features.fighter.tactical-master.description: |-
  When you attack with a weapon whose mastery property you can use, you can replace that property with the Push, Sap, or Slow property for that attack.
features.fighter.tactical-master.options.push.name: 'Tactical Master: Push'
features.fighter.tactical-master.options.sap.name: 'Tactical Master: Sap'
features.fighter.tactical-master.options.slow.name: 'Tactical Master: Slow'

features.fighter.two-extra-attacks.name: 'Two Extra Attacks'
features.fighter.two-extra-attacks.description: |-
  You can attack three times instead of once whenever you take the Attack action on your turn.

features.fighter.studied-attacks.name: 'Studied Attacks'
features.fighter.studied-attacks.description: |-
  You study your opponents and learn from each attack you make. If you make an attack roll against a creature and miss, you have Advantage on your next attack roll against that creature before the end of your next turn.
features.fighter.studied-attacks.options.studied.name: 'Studied Attacks: Advantage on your next attack against it'

features.fighter.epic-boon.name: 'Epic Boon'
features.fighter.epic-boon.description: |-
  You gain an Epic Boon feat (see “Feats”) or another feat of your choice for which you qualify. Boon of Combat Prowess is recommended.
features.fighter.epic-boon.choices.feat.prompt: 'Choose an Epic Boon or another feat'

features.fighter.three-extra-attacks.name: 'Three Extra Attacks'
features.fighter.three-extra-attacks.description: |-
  You can attack four times instead of once whenever you take the Attack action on your turn.

subclasses.champion.name: 'Champion'
subclasses.champion.description: |-
  **Pursue Physical Excellence in Combat**

  A Champion focuses on the development of martial prowess in a relentless pursuit of victory. Champions combine rigorous training with physical excellence to deal devastating blows, withstand peril, and garner glory. Whether in athletic contests or bloody battle, Champions strive for the crown of the victor.

features.fighter.improved-critical.name: 'Improved Critical'
features.fighter.improved-critical.description: |-
  Your attack rolls with weapons and Unarmed Strikes can score a Critical Hit on a roll of 19 or 20 on the d20.

features.fighter.remarkable-athlete.name: 'Remarkable Athlete'
features.fighter.remarkable-athlete.description: |-
  Thanks to your athleticism, you have Advantage on Initiative rolls and Strength (Athletics) checks.

  In addition, immediately after you score a Critical Hit, you can move up to half your Speed without provoking Opportunity Attacks.

features.fighter.additional-fighting-style.name: 'Additional Fighting Style'
features.fighter.additional-fighting-style.description: |-
  You gain another Fighting Style feat of your choice.
features.fighter.additional-fighting-style.choices.style.prompt: 'Choose another Fighting Style feat'

features.fighter.heroic-warrior.name: 'Heroic Warrior'
features.fighter.heroic-warrior.description: |-
  The thrill of battle drives you toward victory. During combat, you can give yourself Heroic Inspiration whenever you start your turn without it.
features.fighter.heroic-warrior.actions.heroic-warrior.name: 'Heroic Warrior'
features.fighter.heroic-warrior.actions.heroic-warrior.results.inspired.name: 'Heroic Inspiration gained'

features.fighter.superior-critical.name: 'Superior Critical'
features.fighter.superior-critical.description: |-
  Your attack rolls with weapons and Unarmed Strikes can now score a Critical Hit on a roll of 18–20 on the d20.

features.fighter.survivor.name: 'Survivor'
features.fighter.survivor.description: |-
  You attain the pinnacle of resilience in battle, giving you these benefits.

  ***Defy Death.*** You have Advantage on Death Saving Throws. Moreover, when you roll 18–20 on a Death Saving Throw, you gain the benefit of rolling a 20 on it.

  ***Heroic Rally.*** At the start of each of your turns, you regain Hit Points equal to 5 plus your Constitution modifier if you are Bloodied and have at least 1 Hit Point.
features.fighter.survivor.actions.heroic-rally.name: 'Heroic Rally'
features.fighter.survivor.actions.heroic-rally.results.healed.name: 'Healed'
