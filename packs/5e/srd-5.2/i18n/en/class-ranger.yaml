classes.ranger.name: 'Ranger'
classes.ranger.description: |-
  | Core Ranger Traits | |
  | --- | --- |
  | Primary Ability | Dexterity and Wisdom |
  | Hit Point Die | D10 per Ranger level |
  | Saving Throw Proficiencies | Strength and Dexterity |
  | Skill Proficiencies | *Choose 3:* Animal Handling, Athletics, Insight, Investigation, Nature, Perception, Stealth, or Survival |
  | Weapon Proficiencies | Simple and Martial weapons |
  | Armor Training | Light and Medium armor and Shields |
  | Starting Equipment | *Choose A or B:* (A) Studded Leather Armor, Scimitar, Shortsword, Longbow, 20 Arrows, Quiver, Druidic Focus (sprig of mistletoe), Explorer’s Pack, and 7 GP; or (B) 150 GP |

  ***As a Level 1 Character.*** Gain all the traits in the Core Ranger Traits table. Gain the Ranger’s level 1 features, which are listed in the Ranger Features table.

  ***As a Multiclass Character.*** Gain the following traits from the Core Ranger Traits table: Hit Point Die, proficiency with Martial weapons, proficiency in one skill of your choice from the Ranger’s skill list, and training with Light and Medium armor and Shields. Gain the Ranger’s level 1 features, which are listed in the Ranger Features table. See the multiclassing rules in “Character Creation” to determine your available spell slots.
classes.ranger.prerequisites.multiclass: 'Dexterity 13 and Wisdom 13 to multiclass'
