pack.name: '5E System Reference Document 5.2'

# The character's headline: a monster's name and challenge rating; else the species and the class
# with the character level, or each class with its level when multiclassed. "Level 3 Elf Wizard",
# "Elf Wizard 2 / Fighter 1", "Goblin Warrior, CR 1/4".
headline: >-
  {has_type_monster, select,
    true {{type_monster}, CR {field_challenge_rating_text}}
    other {{type_class_count, plural, one {Level {field_level_total}} other {}}
      {type_species} {type_class_count, plural, one {{type_class}} other {{type_class_each}}}}}
headline.separator: ' / '
types.class.headline: '{name} {self_level}'

