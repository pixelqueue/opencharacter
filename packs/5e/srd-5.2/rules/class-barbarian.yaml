tags:
  - rage

fields:
  rage.active: { type: boolean, input: true, default: false }
  rage.uses: { type: integer, formula: 0 }
  rage.damage: { type: integer, formula: 0 }
  barbarian.recklessAttack: { type: boolean, formula: false }
  # Brutal Strike's extra d10s.
  barbarian.brutalStrike: { type: integer, formula: 0 }
  barbarian.frenzy: { type: boolean, formula: false }

# Reckless Attack, Brutal Strike and Frenzy are picked per attack; the Advantage that attack rolls
# against the barbarian gain is the app's. An attack roll is the nested d20-test's, so it reads the
# ability from its params; the damage roll reads weapon-attack's flags.
situational:
  - id: recklessAttack
    type: boolean
    default: false
    available: barbarian.recklessAttack
    rolls: [attack.melee, attack.ranged]
    effects:
      - target: { rolls: [attack.melee, attack.ranged] }
        op: rollModifier
        value: { kind: advantage }
        when: situational.recklessAttack && has(params.ability) && params.ability == 'str'
  - id: brutalStrike
    type: boolean
    default: false
    available: barbarian.brutalStrike > 0
    rolls: [attack.melee, attack.ranged, damage.weapon]
    effects:
      - target: { rolls: [attack.melee, attack.ranged] }
        op: rollModifier
        value: { kind: noAdvantage }
        when: >-
          situational.brutalStrike && situational.recklessAttack && has(params.ability)
            && params.ability == 'str'
      - target: { rolls: [damage.weapon] }
        op: add
        value: (barbarian.brutalStrike)d10
        tags:
          [
            {
              formula: "'damage.' + (has(flags.damageType) ? flags.damageType : 'unarmed' in roll.tags ? 'bludgeoning' : roll.item.damageType)",
            },
          ]
        when: >-
          situational.brutalStrike && situational.recklessAttack && has(flags.ability)
            && flags.ability == 'str'
  - id: frenzy
    type: boolean
    default: false
    available: barbarian.frenzy
    rolls: [damage.weapon]
    effects:
      - target: { rolls: [damage.weapon] }
        op: add
        value: (rage.damage)d6
        tags:
          [
            {
              formula: "'damage.' + (has(flags.damageType) ? flags.damageType : 'unarmed' in roll.tags ? 'bludgeoning' : roll.item.damageType)",
            },
          ]
        when: >-
          situational.frenzy && situational.recklessAttack && rage.active && has(flags.ability)
            && flags.ability == 'str'

display:
  fields:
    rage.active: { groups: [class-features], priority: 0, showWhen: rage.uses > 0 }
    rage.uses: { groups: [class-features], priority: 1, showWhen: rage.uses > 0 }
    rage.damage: { groups: [class-features], priority: 1, format: signed, showWhen: rage.uses > 0 }
    barbarian.recklessAttack: { hidden: true }
    barbarian.brutalStrike:
      { groups: [class-features], priority: 2, showWhen: barbarian.brutalStrike > 0 }
    barbarian.frenzy: { hidden: true }
