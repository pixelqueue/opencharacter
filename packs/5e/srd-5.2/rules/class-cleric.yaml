fields:
  cleric.channelDivinity: { type: integer, formula: 0 }
  cleric.channelDivinityLeft:
    type: integer
    formula: >-
      max(0, cleric.channelDivinity - sumCopies(copy.state.channelDivinitySpent,
        copy.item == @classes.cleric))
  cleric.divineSpark: { type: integer, formula: 0 }
  cleric.searUndead: { type: integer, formula: 0 }
  cleric.blessedStrikes:
    { type: enum, values: [none, divine-strike, potent-spellcasting], formula: "'none'" }
  cleric.divineStrike: { type: integer, formula: 0 }

situational:
  - id: divineStrike
    type: enum
    values: [none, necrotic, radiant]
    default: none
    available: cleric.divineStrike > 0
    rolls: [damage.weapon]
    effects:
      - target: { rolls: [damage.weapon] }
        op: add
        value: (cleric.divineStrike)d8
        tags: [{ formula: "'damage.' + situational.divineStrike" }]
        when: situational.divineStrike != 'none'

display:
  fields:
    cleric.channelDivinity:
      { groups: [class-features], priority: 1, showWhen: cleric.channelDivinity > 0 }
    cleric.channelDivinityLeft:
      { groups: [class-features], priority: 1, showWhen: cleric.channelDivinity > 0 }
    cleric.divineSpark: { groups: [class-features], priority: 2, showWhen: cleric.divineSpark > 0 }
    cleric.searUndead: { groups: [class-features], priority: 2, showWhen: cleric.searUndead > 0 }
    cleric.blessedStrikes:
      { groups: [class-features], priority: 2, showWhen: "cleric.blessedStrikes != 'none'" }
    cleric.divineStrike:
      { groups: [class-features], priority: 2, showWhen: cleric.divineStrike > 0 }
