tags:
  - repeatable
  - spell-recall

fields:
  feats.held: { type: set, of: feat }
  initiate.clericUsed: { type: boolean, input: true, default: false }
  initiate.druidUsed: { type: boolean, input: true, default: false }
  initiate.wizardUsed: { type: boolean, input: true, default: false }
  boons.fateUsed: { type: boolean, input: true, default: false }

situational:
  - id: savageAttacker
    type: boolean
    default: false
    rolls: [damage.weapon]
    available: '@feats.savage-attacker in feats.held'
    effects:
      - target: { rolls: [damage.weapon] }
        op: rollModifier
        value: { kind: advantage }
        when: situational.savageAttacker
  - id: grappledByYou
    type: boolean
    default: false
    rolls: [attack]
    available: '@feats.grappler in feats.held'
    effects:
      - target: { rolls: [attack] }
        op: rollModifier
        value: { kind: advantage }
        when: situational.grappledByYou
  - id: inShadows
    type: boolean
    default: false
    incoming: { fields: [hp.current], tags: [damage] }
    available: '@feats.boon-of-the-night-spirit in feats.held'

display:
  fields:
    feats.held: { hidden: true }
    initiate.clericUsed:
      { groups: [spellcasting], priority: 3, showWhen: size(spells.initiateCleric) > 0 }
    initiate.druidUsed:
      { groups: [spellcasting], priority: 3, showWhen: size(spells.initiateDruid) > 0 }
    initiate.wizardUsed:
      { groups: [spellcasting], priority: 3, showWhen: size(spells.initiateWizard) > 0 }
    boons.fateUsed:
      { groups: [class-features], priority: 3, showWhen: '@feats.boon-of-fate in feats.held' }
