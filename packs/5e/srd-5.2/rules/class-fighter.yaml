    secondWind.uses: { groups: [class-features], priority: 1, showWhen: secondWind.uses > 0 }
    actionSurge.uses: { groups: [class-features], priority: 1, showWhen: actionSurge.uses > 0 }
    indomitable.uses: { groups: [class-features], priority: 1, showWhen: indomitable.uses > 0 }
