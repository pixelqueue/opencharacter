  senses.passivePerception: { type: integer, formula: 10 + skills.perception }

  combat.initiative: { type: integer, formula: abilities.dex.mod }

actions:
  - id: ability-check
    tags: [check]
    params:
      ability: { type: enum, values: [str, dex, con, int, wis, cha] }
      dc: { type: integer, optional: true }
      advantage: { type: boolean, optional: true }
      disadvantage: { type: boolean, optional: true }
    results: [rolled, success, failure]
    steps:
      - id: test
        kind: action
        use: d20-test
        tags: [check, { formula: "'check.' + params.ability" }]
        params:
          kind: "'check'"
          ability: params.ability
          dc: 'has(params.dc) ? params.dc : null'
          advantage: 'has(params.advantage) && params.advantage'
          disadvantage: 'has(params.disadvantage) && params.disadvantage'
      - id: result
        kind: outcome
        result: steps.test.result
        data:
          total: steps.test.data.total

  - id: skill-check
    tags: [check]
    params:
      skill:
        type: enum
        values:
          [
            acrobatics,
            animal-handling,
            arcana,
            athletics,
            deception,
            history,
            insight,
            intimidation,
            investigation,
            medicine,
            nature,
            perception,
            performance,
            persuasion,
            religion,
            sleight-of-hand,
            stealth,
            survival,
          ]
      dc: { type: integer, optional: true }
      advantage: { type: boolean, optional: true }
      disadvantage: { type: boolean, optional: true }
    results: [rolled, success, failure]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              ability: >-
                params.skill == 'athletics' ? 'str'
                  : params.skill in ['acrobatics', 'sleight-of-hand', 'stealth'] ? 'dex'
                  : params.skill in ['arcana', 'history', 'investigation', 'nature', 'religion'] ? 'int'
                  : params.skill in ['animal-handling', 'insight', 'medicine', 'perception', 'survival'] ? 'wis'
                  : 'cha'
              field: >-
                'skills.' + ['acrobatics', 'animalHandling', 'arcana', 'athletics', 'deception',
                  'history', 'insight', 'intimidation', 'investigation', 'medicine', 'nature',
                  'perception', 'performance', 'persuasion', 'religion', 'sleightOfHand', 'stealth',
                  'survival'][indexOf(['acrobatics', 'animal-handling', 'arcana', 'athletics',
                  'deception', 'history', 'insight', 'intimidation', 'investigation', 'medicine',
                  'nature', 'perception', 'performance', 'persuasion', 'religion', 'sleight-of-hand',
                  'stealth', 'survival'], params.skill)]
      - id: test
        kind: action
        use: d20-test
        tags:
          [check, { formula: "'check.' + flags.ability" }, { formula: "'skill.' + params.skill" }]
        params:
          kind: "'check'"
          ability: flags.ability
          field: flags.field
          dc: 'has(params.dc) ? params.dc : null'
          advantage: 'has(params.advantage) && params.advantage'
          disadvantage: 'has(params.disadvantage) && params.disadvantage'
      - id: result
        kind: outcome
        result: steps.test.result
        data:
          total: steps.test.data.total

  - id: tool-check
    tags: [check]
    params:
      ability: { type: enum, values: [str, dex, con, int, wis, cha], optional: true }
      skill:
        type: enum
        optional: true
        values:
          [
            acrobatics,
            animal-handling,
            arcana,
            athletics,
            deception,
            history,
            insight,
            intimidation,
            investigation,
            medicine,
            nature,
            perception,
            performance,
            persuasion,
            religion,
            sleight-of-hand,
            stealth,
            survival,
          ]
      dc: { type: integer, optional: true }
    results: [rolled, success, failure]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              ability: 'has(params.ability) ? params.ability : item.ability'
              skilled: >-
                item.id in proficiencies.tools && has(params.skill)
                  && ('skill.' + params.skill) in proficiencies.skills
      - id: test
        kind: action
        use: d20-test
        tags: [check, { formula: "'check.' + flags.ability" }, tool]
        params:
          kind: "'check'"
          ability: flags.ability
          proficiency: 'item.id in proficiencies.tools ? 1 : 0'
          dc: 'has(params.dc) ? params.dc : null'
          advantage: flags.skilled
      - id: result
        kind: outcome
        result: steps.test.result
        data:
          total: steps.test.data.total

  - id: initiative
    tags: [check]
    results: [rolled]
    steps:
      - id: test
        kind: action
        use: d20-test
        tags: [check, check.dex, initiative]
        params:
          kind: "'check'"
          ability: "'dex'"
          field: "'combat.initiative'"
      - id: rolled
        kind: changes
        tags: [initiative]
      - id: result
        kind: outcome
        result: "'rolled'"
        data:
          total: steps.test.data.total
