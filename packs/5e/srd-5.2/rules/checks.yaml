fields:
  proficiencies.skills:
    { type: set, of: tag, input: true, default: [], members: { under: [skill] } }
  proficiencies.expertise:
    { type: set, of: tag, input: true, default: [], members: { under: [skill] } }
  proficiencies.tools: { type: set, of: tool, input: true, default: [] }

  skills.unproficientBonus: { type: integer, formula: 0 }
  skills.acrobatics:
    type: integer
    tags: [skill, skill.acrobatics]
    formula: >-
      abilities.dex.mod
        + ('skill.acrobatics' in proficiencies.skills ? proficiency.bonus : skills.unproficientBonus)
        + ('skill.acrobatics' in proficiencies.expertise ? proficiency.bonus : 0)
  skills.animalHandling:
    type: integer
    tags: [skill, skill.animal-handling]
