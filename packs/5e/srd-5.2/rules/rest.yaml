# Each rest proposes its changes in a step tagged `rest.short` or `rest.long`; a feature that
# recharges on a rest adds its own changes there (a `changes` effect on that step).
fields:
  deathSaves.successes: { type: integer, input: true, default: 0, min: 0, max: 3 }
  deathSaves.failures: { type: integer, input: true, default: 0, min: 0, max: 3 }
  # The lowest d20 that counts as rolling a 20 on a Death Saving Throw (Defy Death: 18).
  deathSaves.twentyOn: { type: integer, formula: 20, min: 2, max: 20 }
  rest.longRestHeals: { type: boolean, formula: true }
  hitDice.max: { type: integer, formula: level.total }
  hitDice.spent:
    type: integer
    formula: "sumCopies(copy.state.hitDiceSpent, copy.type == 'class')"

followUps:
  # Only damage that reached hit points already at 0 counts, so temporary hit points that absorb it
  # all, or damage resisted to nothing, don't. One per batch, so one per hit however many damage
  # types it deals; a Critical Hit counts twice.
  - id: damage-while-dying
    on: { field: hp.current, tags: [damage], once: true }
    required: true
    when: >-
      !sheet.monster && change.taken < 0 && change.by == 0 && change.clamped && hp.current == 0
        && deathSaves.failures < 3
    changes:
      - type: adjust
        field: deathSaves.failures
        by: "'critical' in change.tags ? 2 : 1"

actions:
  - id: death-save
    tags: [save]
    # Monsters die at 0 hit points, so they never make one.
    available: >-
      !sheet.monster && hp.current == 0 && deathSaves.successes < 3 && deathSaves.failures < 3
    results: [revived, stable, success, failure, dead]
    steps:
      - id: test
        kind: action
        use: d20-test
        tags: [save, save.death]
        params:
          kind: "'save'"
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              natural: 'steps.test.data.natural >= deathSaves.twentyOn ? 20 : steps.test.data.natural'
              total: steps.test.data.total
      - id: revive
        kind: changes
        when: flags.natural == 20
        changes:
          - { type: set, field: hp.current, value: 1 }
          - { type: set, field: deathSaves.successes, value: 0 }
          - { type: set, field: deathSaves.failures, value: 0 }
      - id: success
        kind: changes
        when: flags.natural != 20 && flags.total >= 10
        changes:
          - { type: adjust, field: deathSaves.successes, by: 1 }
      - id: failure
        kind: changes
        when: flags.natural != 20 && flags.total < 10
        changes:
          - { type: adjust, field: deathSaves.failures, by: 'flags.natural == 1 ? 2 : 1' }
      - id: result
        kind: outcome
        result: >-
          flags.natural == 20 ? 'revived'
            : flags.total >= 10 ? (deathSaves.successes + 1 >= 3 ? 'stable' : 'success')
            : deathSaves.failures + (flags.natural == 1 ? 2 : 1) >= 3 ? 'dead' : 'failure'
        data:
          total: flags.total

  - id: spend-hit-die
    tags: [healing]
    available: self.hitDiceSpent < self.level && hp.current > 0
    results: [healed]
    steps:
      - id: heal
        kind: roll
        tags: [hit-die]
        parts:
          - dice: item.hitDie
          - value: abilities.con.mod
      - id: regain
        kind: changes
        changes:
          - type: adjust
            field: hp.current
            by: 'max(1, steps.heal.total)'
            tags: [healing.hit-die]
          - { type: adjustState, entry: self, key: hitDiceSpent, by: 1 }
      - id: result
        kind: outcome
        result: "'healed'"
        data:
          healed: max(1, steps.heal.total)

  - id: short-rest
    tags: [rest]
    results: [rested]
    steps:
      - id: rest
        kind: changes
        tags: [rest.short]
        changes:
          - { type: set, field: pactSlots.used, value: 0, when: pactSlots.used > 0 }
      - id: result
        kind: outcome
        result: "'rested'"

  - id: long-rest
    tags: [rest]
    results: [rested]
    steps:
      - id: rest
        kind: changes
        tags: [rest.long]
        changes:
          - { type: set, field: hp.current, value: hp.max, when: rest.longRestHeals }
          - { type: set, field: deathSaves.successes, value: 0 }
          - { type: set, field: deathSaves.failures, value: 0 }
          - { type: adjust, field: conditions.exhaustion, by: -1, when: conditions.exhaustion > 0 }
          - { type: set, field: spellSlots.level1.used, value: 0, when: spellSlots.level1.used > 0 }
          - { type: set, field: spellSlots.level2.used, value: 0, when: spellSlots.level2.used > 0 }
          - { type: set, field: spellSlots.level3.used, value: 0, when: spellSlots.level3.used > 0 }
          - { type: set, field: spellSlots.level4.used, value: 0, when: spellSlots.level4.used > 0 }
          - { type: set, field: spellSlots.level5.used, value: 0, when: spellSlots.level5.used > 0 }
          - { type: set, field: spellSlots.level6.used, value: 0, when: spellSlots.level6.used > 0 }
          - { type: set, field: spellSlots.level7.used, value: 0, when: spellSlots.level7.used > 0 }
          - { type: set, field: spellSlots.level8.used, value: 0, when: spellSlots.level8.used > 0 }
          - { type: set, field: spellSlots.level9.used, value: 0, when: spellSlots.level9.used > 0 }
          - { type: set, field: pactSlots.used, value: 0, when: pactSlots.used > 0 }
          - type: setState
            when: hitDice.spent > 0
            copies: { type: class, where: self.hitDiceSpent > 0 }
            key: hitDiceSpent
            value: 0
      - id: result
        kind: outcome
        result: "'rested'"
