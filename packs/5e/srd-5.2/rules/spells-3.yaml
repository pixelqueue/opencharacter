tags:
  - sorcerous-burst

# The characters whose Hex or Hunter's Mark is on this creature, by character ID: each entry's
# applier, else the `caster` state of an entry saved before appliers were recorded.
fields:
  hex.cursedBy:
    type: set
    of: string
    formula: >-
      mapList(filterList(character.applied, x.active && x.source == @spells.hex
        && (x.appliedBy != '' || x.state.caster != '')),
        x.appliedBy != '' ? x.appliedBy : x.state.caster)
  huntersMark.markedBy:
    type: set
    of: string
    formula: >-
      mapList(filterList(character.applied, x.active && x.source == @spells.hunters-mark
        && (x.appliedBy != '' || x.state.caster != '')),
        x.appliedBy != '' ? x.appliedBy : x.state.caster)

display:
  fields:
    hex.cursedBy: { hidden: true }
    huntersMark.markedBy: { hidden: true }
