fields:
  warlock.invocations: { type: set, of: invocation }
  warlock.pactWeapons: { type: set, of: weapon }
  warlock.lessons: { type: set, of: feat }

contentTypes:
  invocation:
    copies: { max: 0 }
    fields:
      spell: { type: id, of: spell }
    grants:
      - item: { formula: "has(item.spell) ? item.spell : ''" }
    effects:
      - target: warlock.invocations
        op: grant
        value: { formula: item.id }
      - target: spells.free
        op: grant
        value: { formula: item.spell }
        when: has(item.spell)
      - target: spells.limited
        op: grant
        value: { formula: item.spell }
        when: >-
          has(item.spell)
            && countList(keysOf('caster'), item.spell in fieldOf('spells.{caster}', x)) == 0
      - target: { choices: [spell-cost] }
        op: option
        when: >-
          has(item.spell) && action.item.id == item.spell
            && (!has(params.slot) || params.slot == action.item.level)
        value:
          id: at-will
          flags: { slot: action.item.level, castAbility: "'warlock'" }

display:
  fields:
    warlock.invocations: { hidden: true }
    warlock.pactWeapons: { hidden: true }
    warlock.lessons: { hidden: true }
