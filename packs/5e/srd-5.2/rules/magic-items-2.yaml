tags:
  - staff
  - attunement.spellcaster

contentTypes:
  storedSpell:
    carried: false
    state:
      slot: { type: integer, min: 1, max: 9, default: 1 }
      dc: { type: integer, default: 0 }
      attack: { type: integer, default: 0 }
      mod: { type: integer, default: 0 }
      storedIn: { type: string, default: '' }

fields:
  attunement.classUnmet: { type: integer, formula: 0 }
  items.swornEnemy: { type: boolean, formula: false }
  items.sphereControl: { type: boolean, formula: false }
  items.climbAdvantage: { type: boolean, formula: false }

display:
  fields:
    items.swornEnemy: { hidden: true }
    items.sphereControl: { hidden: true }
    items.climbAdvantage: { hidden: true }

situational:
  - id: swornEnemy
    type: boolean
    default: false
    available: items.swornEnemy
    rolls: [attack.ranged, damage.weapon]
  - id: sphereControl
    type: boolean
    default: false
    available: items.sphereControl
    rolls: [skill.arcana]
    effects:
      - target: { rolls: [skill.arcana] }
        op: rollModifier
        value: { kind: advantage }
        when: situational.sphereControl
  - id: climb
    type: boolean
    default: false
    available: items.climbAdvantage
    rolls: [skill.athletics]
    effects:
      - target: { rolls: [skill.athletics] }
        op: rollModifier
        value: { kind: advantage }
        when: situational.climb

constraints:
  - id: attunement-requirement
    check: >-
      attunement.classUnmet == 0
        && countCopies(has(copy.state.attuned) && copy.state.attuned
          && 'attunement.spellcaster' in copy.tags && !items.spellcaster) == 0
