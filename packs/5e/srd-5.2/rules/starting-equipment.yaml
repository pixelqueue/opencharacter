# The starting class and background bring their own kits: each with `startingKit` runs its own
# `kit` action, on the copies the creation added.
actions:
  - id: starting-equipment
    available: false
    params:
      random: { type: boolean, default: false }
    results: [equipped]
    steps:
      - id: class
        kind: action
        sheet: proposed
        when: countCopies(copy.id == 'class' && copy.fields.startingKit) > 0
        entry: "'class'"
        use: kit
        params: { random: params.random }
      - id: background
        kind: action
        sheet: proposed
        when: countCopies(copy.id == 'background' && copy.fields.startingKit) > 0
        entry: "'background'"
        use: kit
        params: { random: params.random }
      - id: result
        kind: outcome
        result: "'equipped'"
