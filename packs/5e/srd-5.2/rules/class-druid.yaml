fields:
  wildShape.active: { type: boolean, input: true, default: false }
  wildShape.uses: { type: integer, formula: 0 }
  wildShape.left:
    type: integer
    formula: >-
      max(0, wildShape.uses - sumCopies(copy.state.wildShapeSpent,
        copy.item == @classes.druid))
  wildShape.forms: { type: integer, formula: 0 }
  wildShape.maxCr: { type: decimal, formula: 0 }
  wildShape.flying: { type: boolean, formula: false }
  wildShape.hours: { type: integer, formula: 0 }
  wildShape.beastSpells: { type: boolean, formula: false }
  druid.elementalFury:
    { type: enum, values: [none, potent-spellcasting, primal-strike], formula: "'none'" }
  druid.primalStrike: { type: integer, formula: 0 }
  druid.land: { type: enum, values: [none, arid, polar, temperate, tropical], formula: "'none'" }
  druid.circleSpells: { type: set, of: spell }
  druid.landsAid: { type: integer, formula: 0 }

situational:
  - id: primalStrike
    type: enum
    values: [none, cold, fire, lightning, thunder]
    default: none
    available: druid.primalStrike > 0
    rolls: [damage.weapon]
    effects:
      - target: { rolls: [damage.weapon] }
        op: add
        value: (druid.primalStrike)d8
        tags: [{ formula: "'damage.' + situational.primalStrike" }]
        when: situational.primalStrike != 'none'

display:
  fields:
    wildShape.active: { groups: [class-features], priority: 0, showWhen: wildShape.uses > 0 }
    wildShape.uses: { groups: [class-features], priority: 1, showWhen: wildShape.uses > 0 }
    wildShape.left: { groups: [class-features], priority: 1, showWhen: wildShape.uses > 0 }
    wildShape.forms: { groups: [class-features], priority: 2, showWhen: wildShape.uses > 0 }
    wildShape.maxCr:
      { groups: [class-features], priority: 1, format: fraction, showWhen: wildShape.uses > 0 }
    wildShape.flying: { groups: [class-features], priority: 2, showWhen: wildShape.uses > 0 }
    wildShape.hours: { groups: [class-features], priority: 2, showWhen: wildShape.uses > 0 }
    wildShape.beastSpells: { hidden: true }
    druid.elementalFury:
      { groups: [class-features], priority: 2, showWhen: "druid.elementalFury != 'none'" }
    druid.primalStrike: { groups: [class-features], priority: 2, showWhen: druid.primalStrike > 0 }
    druid.land: { groups: [class-features], priority: 1, showWhen: "druid.land != 'none'" }
    druid.circleSpells: { hidden: true }
    druid.landsAid: { groups: [class-features], priority: 2, showWhen: druid.landsAid > 0 }
