pack: 5e-srd-5.2
from: 0.3.0
to: 0.4.0
steps:
  # The monster item set AC, senses, XP and Legendary Action uses; they are inputs create-monster
  # copies now. A saved monster keeps its stat block's values; a character with no monster gets 0.
  - op: setDefault
    field: combat.printedAc
    value: "maxCopies(copy.fields.ac, copy.type == 'monster')"
  - op: setDefault
    field: senses.darkvision
    value: "maxCopies(copy.fields.darkvision, copy.type == 'monster' && has(copy.fields.darkvision))"
  - op: setDefault
    field: senses.blindsight
    value: "maxCopies(copy.fields.blindsight, copy.type == 'monster' && has(copy.fields.blindsight))"
  - op: setDefault
    field: senses.tremorsense
    value: "maxCopies(copy.fields.tremorsense, copy.type == 'monster' && has(copy.fields.tremorsense))"
  - op: setDefault
    field: senses.truesight
    value: "maxCopies(copy.fields.truesight, copy.type == 'monster' && has(copy.fields.truesight))"
  - op: setDefault
    field: senses.telepathy
    value: "maxCopies(copy.fields.telepathy, copy.type == 'monster' && has(copy.fields.telepathy))"
  - op: setDefault
    field: challenge.xp
    value: "maxCopies(copy.fields.xp, copy.type == 'monster')"
  - op: setDefault
    field: challenge.xpLair
    value: "maxCopies(copy.fields.xpLair, copy.type == 'monster' && has(copy.fields.xpLair))"
  - op: setDefault
    field: legendary.actions
    value: >-
      maxCopies(copy.fields.legendaryActions,
        copy.type == 'monster' && has(copy.fields.legendaryActions))
  - op: setDefault
    field: legendary.actionsLair
    value: >-
      maxCopies(copy.fields.legendaryActionsLair,
        copy.type == 'monster' && has(copy.fields.legendaryActionsLair))
