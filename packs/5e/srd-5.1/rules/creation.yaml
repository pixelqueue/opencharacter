creation:
  - { id: standard, action: create-character }
  - { id: random, action: create-random-character, random: true }

constraints:
  - id: creation-race-and-class
    check: >-
      !character.creating || (creature.race != '' && level.total > 0)
        || (sheet.monster && level.total == 0)

actions:
  - id: create-character
    tags: [creation]
    available: character.creating
    steps:
      - id: race
        kind: choice
        options: { content: { type: race } }
        changes:
          - type: addItem
            entry: { id: race, item: picked.id }
      - id: subrace
        kind: choice
        options: { content: { type: subrace, where: item.race == steps.race.picked } }
        changes:
          - type: choose
            path: { entry: { formula: 'steps.race.added[0]' }, choice: [subrace] }
            option: picked.id
      - id: class
        kind: choice
        options: { content: { type: class } }
        changes:
          - type: addItem
            entry: { id: class, item: picked.id, state: { level: 1, startingClass: true } }
      - id: background
        kind: choice
        options: { content: { type: background } }
        changes:
          - type: addItem
            entry: { id: background, item: picked.id }
      - id: method
        kind: choice
        options: [{ id: roll }, { id: point-buy }, { id: standard-array }]
        recommend: "'standard-array'"
      - id: scores
        kind: branch
        cases:
          - when: "steps.method.picked == 'roll'"
            steps:
              - { id: roll1, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
              - { id: roll2, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
              - { id: roll3, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
              - { id: roll4, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
              - { id: roll5, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
              - { id: roll6, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
              - id: rolled
                kind: allocate
                fields: { type: field, where: "'ability-base' in item.tags" }
                values:
                  - steps.roll1.total
                  - steps.roll2.total
                  - steps.roll3.total
                  - steps.roll4.total
                  - steps.roll5.total
                  - steps.roll6.total
          - when: "steps.method.picked == 'point-buy'"
            steps:
              - id: eights
                kind: changes
                changes:
                  - { type: set, field: abilities.str.base, value: 8 }
                  - { type: set, field: abilities.dex.base, value: 8 }
                  - { type: set, field: abilities.con.base, value: 8 }
                  - { type: set, field: abilities.int.base, value: 8 }
                  - { type: set, field: abilities.wis.base, value: 8 }
                  - { type: set, field: abilities.cha.base, value: 8 }
              - id: points
                kind: allocate
                sheet: proposed
                fields: { type: field, where: "'ability-base' in item.tags" }
                budget: 27
                spend: upTo
                limit: 7
                cost: '[0, 1, 2, 3, 4, 5, 7, 9][amount]'
          - when: "steps.method.picked == 'standard-array'"
            steps:
              - id: array
                kind: allocate
                fields: { type: field, where: "'ability-base' in item.tags" }
                values: [15, 14, 13, 12, 10, 8]
      - id: picks
        kind: choice
        options: { pending: {} }
      # After the picks, so "if proficient" sees them.
      - id: equipment
        kind: action
        use: starting-equipment
      - id: hitDie
        kind: changes
        changes:
          - { type: set, field: hp.base, value: maxOf(steps.class.item.hitDie) }
      - id: finish
        kind: changes
        sheet: proposed
        changes:
          - { type: set, field: hp.current, value: hp.max }
          - { type: finishCreation }

  # Every pick is recommended, so an automatic run finishes a legal 1st-level character; the engine
  # draws each uniformly among the options offered.
  - id: create-random-character
    tags: [creation]
    available: character.creating
    steps:
      - { id: roll1, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
      - { id: roll2, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
      - { id: roll3, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
      - { id: roll4, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
      - { id: roll5, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
      - { id: roll6, kind: roll, tags: [creation], parts: [{ dice: 4d6dl1 }] }
      - id: race
        kind: choice
        options: { content: { type: race } }
        random: true
        changes:
          - type: addItem
            entry: { id: race, item: picked.id }
      - id: subrace
        kind: choice
        options: { content: { type: subrace, where: item.race == steps.race.picked } }
        random: true
        changes:
          - type: choose
            path: { entry: { formula: 'steps.race.added[0]' }, choice: [subrace] }
            option: picked.id
      - id: class
        kind: choice
        options: { content: { type: class } }
        random: true
        changes:
          - type: addItem
            entry: { id: class, item: picked.id, state: { level: 1, startingClass: true } }
      - id: background
        kind: choice
        options: { content: { type: background } }
        random: true
        changes:
          - type: addItem
            entry: { id: background, item: picked.id }
      # The class's ability priority (its abilityPriority fields): the highest roll goes to its
      # first ability, the next to its second, and so on.
      - id: priority
        kind: branch
        cases:
          - when: true
            flags:
              sorted: >-
                sortList([steps.roll1.total, steps.roll2.total, steps.roll3.total,
                  steps.roll4.total, steps.roll5.total, steps.roll6.total], -x)
              priority: >-
                [steps.class.item.abilityPriority1, steps.class.item.abilityPriority2,
                  steps.class.item.abilityPriority3, steps.class.item.abilityPriority4,
                  steps.class.item.abilityPriority5, steps.class.item.abilityPriority6]
      - id: scores
        kind: allocate
        fields: { type: field, where: "'ability-base' in item.tags" }
        values:
          - steps.roll1.total
          - steps.roll2.total
          - steps.roll3.total
          - steps.roll4.total
          - steps.roll5.total
          - steps.roll6.total
        recommend:
          'abilities.{ability}.base': flags.sorted[indexOf(flags.priority, '{ability}')]
      - id: picks
        kind: choice
        options: { pending: {} }
        random: "!(choice.owner == @races.half-elf && choice.id == 'ability-scores')"
        recommend: flags.priority[minList(options, indexOf(flags.priority, x))]
      - id: equipment
        kind: action
        use: starting-equipment
        params: { random: true }
      - id: hitDie
        kind: changes
        changes:
          - { type: set, field: hp.base, value: maxOf(steps.class.item.hitDie) }
      - id: finish
        kind: changes
        sheet: proposed
        changes:
          - { type: set, field: hp.current, value: hp.max }
          - { type: finishCreation }
