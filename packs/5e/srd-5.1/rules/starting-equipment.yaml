# Each written choice recommends (a), the book's first. The starting gold is the app's: the pack
# doesn't track coins.
actions:
  - id: starting-equipment
    available: false
    params:
      class: { type: id, of: class }
      background: { type: id, of: background, optional: true }
      random: { type: boolean, default: false }
    results: [equipped]
    steps:
      - id: byClass
        kind: branch
        cases:
          - when: 'params.class == @classes.barbarian'
            steps:
              - id: barbarianWeapon
                kind: choice
                options:
                  - id: greataxe
                    changes:
                      - { type: addItem, entry: { item: "'weapons.greataxe'", equipped: true } }
                  - id: martial-melee
                recommend: options[0]
                random: params.random
              - id: barbarianMartial
                kind: choice
                when: "steps.barbarianWeapon.picked == 'martial-melee'"
                options:
                  content:
                    { type: weapon, where: "item.category == 'martial' && item.range == 'melee'" }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: barbarianSecond
                kind: choice
                options:
                  - id: two-handaxes
                    changes:
                      - type: addItem
                        entry: { item: "'weapons.handaxe'", quantity: 2, equipped: true }
                  - id: simple
                recommend: options[0]
                random: params.random
              - id: barbarianSimple
                kind: choice
                when: "steps.barbarianSecond.picked == 'simple'"
                options: { content: { type: weapon, where: "item.category == 'simple'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: barbarianKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'gear.explorers-pack'" } }
                  - type: addItem
                    entry: { item: "'weapons.javelin'", quantity: 4, equipped: true }

          - when: 'params.class == @classes.bard'
            steps:
              - id: bardWeapon
                kind: choice
                options:
                  - id: rapier
                    changes:
                      - { type: addItem, entry: { item: "'weapons.rapier'", equipped: true } }
                  - id: longsword
                    changes:
                      - { type: addItem, entry: { item: "'weapons.longsword'", equipped: true } }
                  - id: simple
                recommend: options[0]
                random: params.random
              - id: bardSimple
                kind: choice
                when: "steps.bardWeapon.picked == 'simple'"
                options: { content: { type: weapon, where: "item.category == 'simple'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: bardPack
                kind: choice
                options:
                  - id: diplomats-pack
                    changes: [{ type: addItem, entry: { item: "'gear.diplomats-pack'" } }]
                  - id: entertainers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.entertainers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: bardInstrument
                kind: choice
                options:
                  - id: lute
                    changes: [{ type: addItem, entry: { item: "'tools.lute'" } }]
                  - id: other-instrument
                recommend: options[0]
                random: params.random
              - id: bardOtherInstrument
                kind: choice
                when: "steps.bardInstrument.picked == 'other-instrument'"
                options:
                  content:
                    type: tool
                    where: "item.category == 'musical-instrument' && item.id != @tools.lute"
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id } }
              - id: bardKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
                  - { type: addItem, entry: { item: "'weapons.dagger'", equipped: true } }

          - when: 'params.class == @classes.cleric'
            steps:
              - id: clericWeapon
                kind: choice
                sheet: proposed
                options:
                  - id: mace
                    changes:
                      - { type: addItem, entry: { item: "'weapons.mace'", equipped: true } }
                  - id: warhammer
                    when: '@weapons.warhammer in proficiencies.weapons'
                    changes:
                      - { type: addItem, entry: { item: "'weapons.warhammer'", equipped: true } }
                recommend: options[0]
                random: params.random
              - id: clericArmor
                kind: choice
                sheet: proposed
                options:
                  - id: scale-mail
                    changes:
                      - { type: addItem, entry: { item: "'armor.scale-mail'", equipped: true } }
                  - id: leather-armor
                    changes:
                      - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
                  - id: chain-mail
                    when: "'heavy' in proficiencies.armor"
                    changes:
                      - { type: addItem, entry: { item: "'armor.chain-mail'", equipped: true } }
                recommend: options[0]
                random: params.random
              - id: clericRanged
                kind: choice
                options:
                  - id: light-crossbow
                    changes:
                      - type: addItem
                        entry: { item: "'weapons.light-crossbow'", equipped: true }
                      - { type: addItem, entry: { item: "'gear.crossbow-bolts'", quantity: 20 } }
                  - id: simple
                recommend: options[0]
                random: params.random
              - id: clericSimple
                kind: choice
                when: "steps.clericRanged.picked == 'simple'"
                options: { content: { type: weapon, where: "item.category == 'simple'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: clericPack
                kind: choice
                options:
                  - id: priests-pack
                    changes: [{ type: addItem, entry: { item: "'gear.priests-pack'" } }]
                  - id: explorers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: clericSymbol
                kind: choice
                options: { content: { type: gear, where: "item.category == 'holy-symbol'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id } }
              - id: clericKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }

          - when: 'params.class == @classes.druid'
            steps:
              - id: druidFirst
                kind: choice
                options:
                  - id: wooden-shield
                    changes:
                      - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }
                  - id: simple
                recommend: options[0]
                random: params.random
              - id: druidSimple
                kind: choice
                when: "steps.druidFirst.picked == 'simple'"
                options: { content: { type: weapon, where: "item.category == 'simple'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: druidWeapon
                kind: choice
                options:
                  - id: scimitar
                    changes:
                      - { type: addItem, entry: { item: "'weapons.scimitar'", equipped: true } }
                  - id: simple-melee
                recommend: options[0]
                random: params.random
              - id: druidSimpleMelee
                kind: choice
                when: "steps.druidWeapon.picked == 'simple-melee'"
                options:
                  content:
                    { type: weapon, where: "item.category == 'simple' && item.range == 'melee'" }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: druidFocus
                kind: choice
                options: { content: { type: gear, where: "item.category == 'druidic-focus'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id } }
              - id: druidKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
                  - { type: addItem, entry: { item: "'gear.explorers-pack'" } }

          - when: 'params.class == @classes.fighter'
            steps:
              - id: fighterArmor
                kind: choice
                options:
                  - id: chain-mail
                    changes:
                      - { type: addItem, entry: { item: "'armor.chain-mail'", equipped: true } }
                  - id: leather-longbow
                    changes:
                      - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
                      - { type: addItem, entry: { item: "'weapons.longbow'", equipped: true } }
                      - { type: addItem, entry: { item: "'gear.arrows'", quantity: 20 } }
                recommend: options[0]
                random: params.random
              - id: fighterWeapons
                kind: choice
                options:
                  - id: martial-and-shield
                    changes:
                      - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }
                  - id: two-martial
                recommend: options[0]
                random: params.random
              - id: fighterMartial
                kind: choice
                options: { content: { type: weapon, where: "item.category == 'martial'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: fighterMartial2
                kind: choice
                when: "steps.fighterWeapons.picked == 'two-martial'"
                options: { content: { type: weapon, where: "item.category == 'martial'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: fighterRanged
                kind: choice
                options:
                  - id: light-crossbow
                    changes:
                      - type: addItem
                        entry: { item: "'weapons.light-crossbow'", equipped: true }
                      - { type: addItem, entry: { item: "'gear.crossbow-bolts'", quantity: 20 } }
                  - id: two-handaxes
                    changes:
                      - type: addItem
                        entry: { item: "'weapons.handaxe'", quantity: 2, equipped: true }
                recommend: options[0]
                random: params.random
              - id: fighterPack
                kind: choice
                options:
                  - id: dungeoneers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
                  - id: explorers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
                recommend: options[0]
                random: params.random

          - when: 'params.class == @classes.monk'
            steps:
              - id: monkWeapon
                kind: choice
                options:
                  - id: shortsword
                    changes:
                      - { type: addItem, entry: { item: "'weapons.shortsword'", equipped: true } }
                  - id: simple
                recommend: options[0]
                random: params.random
              - id: monkSimple
                kind: choice
                when: "steps.monkWeapon.picked == 'simple'"
                options: { content: { type: weapon, where: "item.category == 'simple'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: monkPack
                kind: choice
                options:
                  - id: dungeoneers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
                  - id: explorers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: monkKit
                kind: changes
                changes:
                  - type: addItem
                    entry: { item: "'weapons.dart'", quantity: 10, equipped: true }

          - when: 'params.class == @classes.paladin'
            steps:
              - id: paladinWeapons
                kind: choice
                options:
                  - id: martial-and-shield
                    changes:
                      - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }
                  - id: two-martial
                recommend: options[0]
                random: params.random
              - id: paladinMartial
                kind: choice
                options: { content: { type: weapon, where: "item.category == 'martial'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: paladinMartial2
                kind: choice
                when: "steps.paladinWeapons.picked == 'two-martial'"
                options: { content: { type: weapon, where: "item.category == 'martial'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: paladinSecond
                kind: choice
                options:
                  - id: five-javelins
                    changes:
                      - type: addItem
                        entry: { item: "'weapons.javelin'", quantity: 5, equipped: true }
                  - id: simple-melee
                recommend: options[0]
                random: params.random
              - id: paladinSimpleMelee
                kind: choice
                when: "steps.paladinSecond.picked == 'simple-melee'"
                options:
                  content:
                    { type: weapon, where: "item.category == 'simple' && item.range == 'melee'" }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: paladinPack
                kind: choice
                options:
                  - id: priests-pack
                    changes: [{ type: addItem, entry: { item: "'gear.priests-pack'" } }]
                  - id: explorers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: paladinSymbol
                kind: choice
                options: { content: { type: gear, where: "item.category == 'holy-symbol'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id } }
              - id: paladinKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'armor.chain-mail'", equipped: true } }

          - when: 'params.class == @classes.ranger'
            steps:
              - id: rangerArmor
                kind: choice
                options:
                  - id: scale-mail
                    changes:
                      - { type: addItem, entry: { item: "'armor.scale-mail'", equipped: true } }
                  - id: leather-armor
                    changes:
                      - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
                recommend: options[0]
                random: params.random
              - id: rangerWeapons
                kind: choice
                options:
                  - id: two-shortswords
                    changes:
                      - type: addItem
                        entry: { item: "'weapons.shortsword'", quantity: 2, equipped: true }
                  - id: two-simple-melee
                recommend: options[0]
                random: params.random
              - id: rangerSimpleMelee
                kind: choice
                when: "steps.rangerWeapons.picked == 'two-simple-melee'"
                options:
                  content:
                    { type: weapon, where: "item.category == 'simple' && item.range == 'melee'" }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: rangerSimpleMelee2
                kind: choice
                when: "steps.rangerWeapons.picked == 'two-simple-melee'"
                options:
                  content:
                    { type: weapon, where: "item.category == 'simple' && item.range == 'melee'" }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: rangerPack
                kind: choice
                options:
                  - id: dungeoneers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
                  - id: explorers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: rangerKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'weapons.longbow'", equipped: true } }
                  - { type: addItem, entry: { item: "'gear.quiver'" } }
                  - { type: addItem, entry: { item: "'gear.arrows'", quantity: 20 } }

          - when: 'params.class == @classes.rogue'
            steps:
              - id: rogueWeapon
                kind: choice
                options:
                  - id: rapier
                    changes:
                      - { type: addItem, entry: { item: "'weapons.rapier'", equipped: true } }
                  - id: shortsword
                    changes:
                      - { type: addItem, entry: { item: "'weapons.shortsword'", equipped: true } }
                recommend: options[0]
                random: params.random
              - id: rogueSecond
                kind: choice
                options:
                  - id: shortbow
                    changes:
                      - { type: addItem, entry: { item: "'weapons.shortbow'", equipped: true } }
                      - { type: addItem, entry: { item: "'gear.quiver'" } }
                      - { type: addItem, entry: { item: "'gear.arrows'", quantity: 20 } }
                  - id: shortsword
                    changes:
                      - { type: addItem, entry: { item: "'weapons.shortsword'", equipped: true } }
                recommend: options[0]
                random: params.random
              - id: roguePack
                kind: choice
                options:
                  - id: burglars-pack
                    changes: [{ type: addItem, entry: { item: "'gear.burglars-pack'" } }]
                  - id: dungeoneers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
                  - id: explorers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: rogueKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
                  - type: addItem
                    entry: { item: "'weapons.dagger'", quantity: 2, equipped: true }
                  - { type: addItem, entry: { item: "'tools.thieves-tools'" } }

          - when: 'params.class == @classes.sorcerer'
            steps:
              - id: sorcererWeapon
                kind: choice
                options:
                  - id: light-crossbow
                    changes:
                      - type: addItem
                        entry: { item: "'weapons.light-crossbow'", equipped: true }
                      - { type: addItem, entry: { item: "'gear.crossbow-bolts'", quantity: 20 } }
                  - id: simple
                recommend: options[0]
                random: params.random
              - id: sorcererSimple
                kind: choice
                when: "steps.sorcererWeapon.picked == 'simple'"
                options: { content: { type: weapon, where: "item.category == 'simple'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: sorcererFocus
                kind: choice
                options:
                  - id: component-pouch
                    changes: [{ type: addItem, entry: { item: "'gear.component-pouch'" } }]
                  - id: arcane-focus
                recommend: options[0]
                random: params.random
              - id: sorcererArcaneFocus
                kind: choice
                when: "steps.sorcererFocus.picked == 'arcane-focus'"
                options: { content: { type: gear, where: "item.category == 'arcane-focus'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id } }
              - id: sorcererPack
                kind: choice
                options:
                  - id: dungeoneers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
                  - id: explorers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: sorcererKit
                kind: changes
                changes:
                  - type: addItem
                    entry: { item: "'weapons.dagger'", quantity: 2, equipped: true }

          - when: 'params.class == @classes.warlock'
            steps:
              - id: warlockWeapon
                kind: choice
                options:
                  - id: light-crossbow
                    changes:
                      - type: addItem
                        entry: { item: "'weapons.light-crossbow'", equipped: true }
                      - { type: addItem, entry: { item: "'gear.crossbow-bolts'", quantity: 20 } }
                  - id: simple
                recommend: options[0]
                random: params.random
              - id: warlockSimple
                kind: choice
                when: "steps.warlockWeapon.picked == 'simple'"
                options: { content: { type: weapon, where: "item.category == 'simple'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: warlockFocus
                kind: choice
                options:
                  - id: component-pouch
                    changes: [{ type: addItem, entry: { item: "'gear.component-pouch'" } }]
                  - id: arcane-focus
                recommend: options[0]
                random: params.random
              - id: warlockArcaneFocus
                kind: choice
                when: "steps.warlockFocus.picked == 'arcane-focus'"
                options: { content: { type: gear, where: "item.category == 'arcane-focus'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id } }
              - id: warlockPack
                kind: choice
                options:
                  - id: scholars-pack
                    changes: [{ type: addItem, entry: { item: "'gear.scholars-pack'" } }]
                  - id: dungeoneers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: warlockExtra
                kind: choice
                options: { content: { type: weapon, where: "item.category == 'simple'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id, equipped: true } }
              - id: warlockKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
                  - type: addItem
                    entry: { item: "'weapons.dagger'", quantity: 2, equipped: true }

          - when: 'params.class == @classes.wizard'
            steps:
              - id: wizardWeapon
                kind: choice
                options:
                  - id: quarterstaff
                    changes:
                      - { type: addItem, entry: { item: "'weapons.quarterstaff'", equipped: true } }
                  - id: dagger
                    changes:
                      - { type: addItem, entry: { item: "'weapons.dagger'", equipped: true } }
                recommend: options[0]
                random: params.random
              - id: wizardFocus
                kind: choice
                options:
                  - id: component-pouch
                    changes: [{ type: addItem, entry: { item: "'gear.component-pouch'" } }]
                  - id: arcane-focus
                recommend: options[0]
                random: params.random
              - id: wizardArcaneFocus
                kind: choice
                when: "steps.wizardFocus.picked == 'arcane-focus'"
                options: { content: { type: gear, where: "item.category == 'arcane-focus'" } }
                random: params.random
                changes:
                  - { type: addItem, entry: { item: picked.id } }
              - id: wizardPack
                kind: choice
                options:
                  - id: scholars-pack
                    changes: [{ type: addItem, entry: { item: "'gear.scholars-pack'" } }]
                  - id: explorers-pack
                    changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
                recommend: options[0]
                random: params.random
              - id: wizardKit
                kind: changes
                changes:
                  - { type: addItem, entry: { item: "'gear.spellbook'" } }

      - id: acolyteSymbol
        kind: choice
        when: 'has(params.background) && params.background == @backgrounds.acolyte'
        options: { content: { type: gear, where: "item.category == 'holy-symbol'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id } }
      - id: acolyteKit
        kind: changes
        when: 'has(params.background) && params.background == @backgrounds.acolyte'
        changes:
          - { type: addItem, entry: { item: "'gear.book'" } }
          - { type: addItem, entry: { item: "'gear.incense'", quantity: 5 } }
          - { type: addItem, entry: { item: "'gear.vestments'" } }
          - { type: addItem, entry: { item: "'gear.common-clothes'" } }
          - { type: addItem, entry: { item: "'gear.pouch'" } }
      - id: result
        kind: outcome
        result: "'equipped'"
