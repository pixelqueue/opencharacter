contentTypes:
  weapon:
    carried: true
    equippable: true
    fields:
      category: { type: enum, values: [simple, martial], required: true }
      range: { type: enum, values: [melee, ranged], required: true }
      damage: { type: dice, required: true }
      damageType:
        {
          type: enum,
          values:
            [
              acid,
              bludgeoning,
              cold,
              fire,
              force,
              lightning,
              necrotic,
              piercing,
              poison,
              psychic,
              radiant,
              slashing,
              thunder,
            ],
          required: true,
        }
      versatileDamage: { type: dice }
      normalRange: { type: integer }
      longRange: { type: integer }
      ammunition: { type: enum, values: [arrow, blowgun-needle, crossbow-bolt, sling-bullet] }
      weight: { type: decimal } # pounds
      cost: { type: decimal } # gold pieces
    state:
      wielding: { type: enum, values: [one-handed, two-handed], default: one-handed }
      attuned: { type: boolean, default: false }
      stowed: { type: boolean, default: false } # in an extradimensional container (equipment.yaml)
      quivered: { type: boolean, default: false } # in an Efficient Quiver (equipment.yaml)
    actions:
      - use: weapon-attack
    effects:
      - id: magic-attack
        target: { rolls: [attack.melee, attack.ranged], from: self }
        op: add
        value: item.attackBonus
        when: item.attackBonus != 0 && (!item.requiresAttunement || self.attuned)
      - id: magic-damage
        target: { rolls: [damage.weapon], from: self }
        op: add
        value: item.damageBonus
        tags: [{ formula: "'damage.' + roll.item.damageType" }]
        when: item.damageBonus != 0 && (!item.requiresAttunement || self.attuned)
    # Once per batch of damage. Whether the damage came from within 5 feet, and whether the reaction
    # is spent, are the player's.
    followUps:
      - id: retaliation
        on: { field: hp.current, tags: [damage], once: true }
        when: >-
          barbarian.retaliation && self.equipped && item.range == 'melee'
            && change.taken < 0 && hp.current > 0
        action: weapon-attack

  armor:
    carried: true
    equippable: true
    fields:
      category: { type: enum, values: [light, medium, heavy, shield], required: true }
      baseAc: { type: integer, required: true }
      addDex: { type: boolean }
      maxDex: { type: integer }
      strength: { type: integer }
      stealthDisadvantage: { type: boolean }
      weight: { type: decimal } # pounds
      cost: { type: decimal } # gold pieces
    state:
      attuned: { type: boolean, default: false }
      stowed: { type: boolean, default: false } # in an extradimensional container (equipment.yaml)
    # Every armor item has these effects; the shield switches off the first three (`suppress`).
    effects:
      - id: base-ac
        target: combat.ac
        op: set
        value: >-
          item.baseAc + (has(item.addDex) && item.addDex
            ? (has(item.maxDex) ? min(abilities.dex.mod, item.maxDex) : abilities.dex.mod)
            : 0)
        when: self.equipped
      - id: wearing-armor
        target: equipment.tags
        op: grant
        value: { tag: armor }
        when: self.equipped
      - id: armor-category
        target: equipment.tags
        op: grant
        value: { formula: item.category }
        when: self.equipped
      - id: too-heavy
        target: combat.speed
        op: add
        value: -10
        when: >-
          self.equipped && has(item.strength) && abilities.str.score < item.strength
            && !combat.ignoreArmorStrength
      - id: noisy
        target: { rolls: [skill.stealth] }
        op: rollModifier
        value: { kind: disadvantage }
        when: >-
          self.equipped && has(item.stealthDisadvantage) && item.stealthDisadvantage
      - id: magic-ac
        target: combat.ac
        op: add
        value: item.acBonus
        when: >-
          self.equipped && item.acBonus != 0 && (!item.requiresAttunement || self.attuned)

  class:
    copies: { perItem: 1 }
    fields:
      hitDie: { type: dice, required: true }
      # Its own starting-equipment action gives its starting kit.
      startingKit: { type: boolean, default: false }
      # The abilities multiclassing into it needs 13 in: all of these, and one of those.
      multiclassAll: { type: set, of: string, default: [] }
      multiclassAny: { type: set, of: string, default: [] }
      # The abilities a random start raises first, in order.
      abilityPriority1: { type: enum, values: [str, dex, con, int, wis, cha], default: str }
      abilityPriority2: { type: enum, values: [str, dex, con, int, wis, cha], default: con }
      abilityPriority3: { type: enum, values: [str, dex, con, int, wis, cha], default: dex }
      abilityPriority4: { type: enum, values: [str, dex, con, int, wis, cha], default: wis }
      abilityPriority5: { type: enum, values: [str, dex, con, int, wis, cha], default: cha }
      abilityPriority6: { type: enum, values: [str, dex, con, int, wis, cha], default: int }
    state:
      level: { type: integer, default: 1, min: 1, max: 20 }
      startingClass: { type: boolean, default: false }
      hitDiceSpent: { type: integer, default: 0, min: 0 }
    effects:
      - { target: classes.held, op: grant, value: { formula: item.id } }
    actions:
      - use: spend-hit-die

  subclass:
    copies: { max: 0 }
    fields:
      class: { type: id, of: class, required: true }

  fightingStyle:
    copies: { max: 0 }

  feature: {}

  improvement:
    copies: { max: 0 }

  spell:
    texts: [material, trigger]
    # The slot the spell was cast with: 0 when unknown, read as the spell's own level.
    state:
      castSlot: { type: integer, default: 0, min: 0, max: 9 }
    fields:
      level: { type: integer, required: true, min: 0, max: 9 }
      school:
        {
          type: enum,
          values:
            [
              abjuration,
              conjuration,
              divination,
              enchantment,
              evocation,
              illusion,
              necromancy,
              transmutation,
            ],
          required: true,
        }
      classes: { type: set, of: class }
      ritual: { type: boolean }
      concentration: { type: boolean }
      castingTime:
        {
          type: enum,
          values:
            [
              action,
              bonus-action,
              reaction,
              1-minute,
              10-minutes,
              1-hour,
              8-hours,
              12-hours,
              24-hours,
            ],
        }
      rangeKind: { type: enum, values: [self, touch, ranged, sight, unlimited, special] }
      range: { type: integer } # feet
      verbal: { type: boolean }
      somatic: { type: boolean }
      material: { type: boolean }
      durationUnit:
        { type: enum, values: [instantaneous, round, minute, hour, day, until-dispelled, special] }
      durationAmount: { type: integer }
      areaShape: { type: enum, values: [cone, cube, cylinder, line, sphere] }
      areaSize: { type: integer } # feet
      attack: { type: enum, values: [melee, ranged] }
      save: { type: enum, values: [str, dex, con, int, wis, cha] }
      saveEffect: { type: enum, values: [half, none] }
      condition: { type: id, of: condition }
      applied: { type: boolean }
      maxHp: { type: integer }
      upcastMaxHp: { type: integer }
      damageType:
        {
          type: enum,
          values:
            [
              acid,
              bludgeoning,
              cold,
              fire,
              force,
              lightning,
              necrotic,
              piercing,
              poison,
              psychic,
              radiant,
              slashing,
              thunder,
            ],
        }
      damage: { type: dice }
      damageBonus: { type: integer }
      damageAddsMod: { type: boolean }
      upcastDice: { type: integer }
      upcastBonus: { type: integer }
      upcastEvery: { type: integer }
      cantripScaling: { type: boolean }
      damage2Type:
        {
          type: enum,
          values:
            [
              acid,
              bludgeoning,
              cold,
              fire,
              force,
              lightning,
              necrotic,
              piercing,
              poison,
              psychic,
              radiant,
              slashing,
              thunder,
            ],
        }
      damage2: { type: dice }
      upcast2Dice: { type: integer }
      heal: { type: dice }
      healBonus: { type: integer }
      healAddsMod: { type: boolean }
      upcastHealDice: { type: integer }
      upcastHealBonus: { type: integer }

  trait: {}

  race:
    copies: { max: 1 }
    fields:
      speed: { type: integer, required: true }
      size: { type: enum, values: [small, medium], required: true }
    effects:
      - { id: speed, target: combat.speed, op: set, value: item.speed }
      - { id: size, target: creature.size, op: set, value: item.size }
      - { id: race, target: creature.race, op: set, value: item.id }

  subrace:
    copies: { max: 0 }
    fields:
      race: { type: id, of: race, required: true }

  language:
    fields:
      exotic: { type: boolean }
    effects:
      - target: proficiencies.languages
        op: grant
        value: { formula: item.id }

  # Each ancestry item carries its resistance, since incoming-change tags can't be computed.
  draconicAncestry:
    copies: { max: 0 }
    fields:
      damageType: { type: enum, values: [acid, cold, fire, lightning, poison], required: true }
      area: { type: enum, values: [line, cone], required: true }
      save: { type: enum, values: [dex, con], required: true }
    # Once until a short or long rest, on the ancestry's pick.
    state:
      used: { type: boolean, default: false }
    actions:
      - use: breath-weapon
    effects:
      - target: { steps: [rest.short, rest.long] }
        op: changes
        when: self.used
        value:
          changes: [{ type: setState, pick: owner, key: used, value: false }]

  background:
    copies: { max: 1 }
    fields:
      startingKit: { type: boolean, default: false }

  backgroundFeature:
    copies: { max: 0 }

  feat: {}
