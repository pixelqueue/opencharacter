    spellcasting.paladin.attack:
      { groups: [spellcasting], priority: 0, format: signed, showWhen: spellcasting.paladin.dc > 0 }
    spellcasting.paladin.mod: { hidden: true }
    spells.paladin: { groups: [spellcasting], priority: 1, showWhen: spellcasting.paladin.dc > 0 }
    spellcasting.ranger.dc:
