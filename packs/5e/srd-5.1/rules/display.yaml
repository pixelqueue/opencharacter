    spells.limited: { hidden: true }
    spells.atWill: { hidden: true }
    spells.warlockExpanded: { hidden: true }
    spellcasting.potentCantrip: { hidden: true }
    spellcasting.overchannel: { hidden: true }
    spellcasting.maximizeHealing: { hidden: true }
    spellcasting.casterLevel: { groups: [spellcasting], priority: 2, visibility: background }
    spellSlots.level1.max:
      { groups: [spellcasting], priority: 1, showWhen: spellSlots.level1.max > 0 }
    spellSlots.level1.used:
      {
        groups: [spellcasting],
        priority: 1,
        showWhen: spellSlots.level1.max > 0,
        input: { widget: track },
        with: [{ field: spellSlots.level1.max, as: max }],
