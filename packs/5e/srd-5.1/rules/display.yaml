    spellcasting.cleric.mod: { hidden: true }
    spells.cleric: { groups: [spellcasting], priority: 1, showWhen: spellcasting.cleric.dc > 0 }
    spellcasting.druid.dc:
      { groups: [spellcasting], priority: 0, showWhen: spellcasting.druid.dc > 0 }
