    spellSlots.level2.max:
      { groups: [spellcasting], priority: 1, showWhen: spellSlots.level2.max > 0 }
    spellSlots.level2.used:
      {
        groups: [spellcasting],
        priority: 1,
        showWhen: spellSlots.level2.max > 0,
        input: { widget: track },
        with: [{ field: spellSlots.level2.max, as: max }],
      }
    spellSlots.level3.max:
      { groups: [spellcasting], priority: 1, showWhen: spellSlots.level3.max > 0 }
    spellSlots.level3.used:
      {
        groups: [spellcasting],
