# Conditions are content applied to a creature (its `applied` list). Exhaustion has levels, so it is
# a field instead.
contentTypes:
  condition:
    carried: false
    state:
      by:
        {
          type: enum,
          values:
            [
              aberration,
              beast,
              celestial,
              construct,
              dragon,
              elemental,
              fey,
              fiend,
              giant,
              humanoid,
              monstrosity,
              ooze,
              plant,
              undead,
            ],
        }
      magical: { type: boolean, default: false }

fields:
  conditions.exhaustion: { type: integer, input: true, default: 0, min: 0, max: 6 }
  conditions.immunities: { type: set, of: condition, input: true, default: [] }
  conditions.prone: { type: boolean, formula: false }
  conditions.restrained: { type: boolean, formula: false }
  conditions.blinded: { type: boolean, formula: false }
  conditions.invisible: { type: boolean, formula: false }
  conditions.incapacitated: { type: boolean, formula: false }

display:
  fields:
    conditions.incapacitated: { hidden: true }
    conditions.prone: { hidden: true }
    conditions.restrained: { hidden: true }
    conditions.blinded: { hidden: true }
    conditions.invisible: { hidden: true }

immuneTo:
  - id: listed
    query: { type: condition, where: item.id in conditions.immunities }

effects:
  - id: exhaustion-checks
    target: { rolls: [check] }
    op: rollModifier
    value: { kind: disadvantage }
    when: conditions.exhaustion >= 1
  - id: exhaustion-speed-halved
    target: combat.speed
    op: multiply
    value: 0.5
    when: conditions.exhaustion >= 2
  - id: exhaustion-attacks-and-saves
    target: { rolls: [attack, save] }
    op: rollModifier
    value: { kind: disadvantage }
    when: conditions.exhaustion >= 3
  - id: exhaustion-hp-max-halved
    target: hp.max
    op: multiply
    value: 0.5
    when: conditions.exhaustion >= 4
  - id: exhaustion-speed-zero
    target: combat.speed
    op: atMost
    value: 0
    when: conditions.exhaustion >= 5
