# Cost (gold pieces) and weight (pounds) are per unit; a copy's `quantity` counts units. `bundle` is
# how many units the SRD's price buys (arrows come 20 for 1 gp).
contentTypes:
  gear:
    carried: true
    fields:
      category:
        {
          type: enum,
          values:
            [
              adventuring-gear,
              ammunition,
              arcane-focus,
              druidic-focus,
              holy-symbol,
              equipment-pack,
              tack,
              trade-good,
            ],
          required: true,
        }
      cost: { type: decimal } # gold pieces, per unit
      weight: { type: decimal } # pounds, per unit
      bundle: { type: integer, min: 1 }
      ammunition: { type: enum, values: [arrow, blowgun-needle, crossbow-bolt, sling-bullet] }
    state:
      stowed: { type: boolean, default: false }
      quivered: { type: boolean, default: false } # in an Efficient Quiver (below)

  tool:
    carried: true
    actions:
      - use: tool-check
    fields:
      category:
        {
          type: enum,
          values: [artisans-tools, gaming-set, musical-instrument, kit, other],
          required: true,
        }
      cost: { type: decimal }
      weight: { type: decimal }
    state:
      stowed: { type: boolean, default: false }

  mount:
    carried: true
    fields:
      cost: { type: decimal }
      speed: { type: integer }
      carryingCapacity: { type: integer }

  vehicle:
    carried: true
    fields:
      category: { type: enum, values: [drawn, waterborne], required: true }
      cost: { type: decimal }
      pulledWeight: { type: decimal }
      speedMph: { type: decimal }

fields:
  carrying.stowed:
    type: decimal
    formula: >-
      sumCopies(copy.fields.weight * copy.quantity, has(copy.fields.weight)
        && has(copy.state.stowed) && copy.state.stowed)
  # What extradimensional containers and quivers hold: each adds its own (content effects).
  carrying.stowCapacity: { type: decimal, formula: 0, min: 0 }
  carrying.stowUnlimited: { type: boolean, formula: false }
  carrying.quivers: { type: integer, formula: 0, min: 0 }
  carrying.quiveredAmmunition:
    type: integer
    formula: >-
      sumCopies(copy.quantity, copy.type == 'gear'
        && has(copy.state.quivered) && copy.state.quivered)
  carrying.quiveredJavelins:
    type: integer
    formula: >-
      sumCopies(copy.quantity, copy.item == @weapons.javelin
        && has(copy.state.quivered) && copy.state.quivered)
  carrying.quiveredLong:
    type: integer
    formula: >-
      sumCopies(copy.quantity, copy.type == 'weapon'
        && copy.item != @weapons.javelin
        && has(copy.state.quivered) && copy.state.quivered)

constraints:
  - id: stowed-without-container
    check: >-
      countCopies(has(copy.state.stowed) && copy.state.stowed) == 0
        || carrying.stowUnlimited || carrying.stowCapacity > 0
  - id: stowed-over-capacity
    check: >-
      carrying.stowUnlimited || carrying.stowed <= carrying.stowCapacity
    data:
      stowed: carrying.stowed
      capacity: carrying.stowCapacity
  - id: quivered-without-quiver
    check: >-
      carrying.quivers > 0
        || countCopies(has(copy.state.quivered) && copy.state.quivered) == 0
  - id: quivered-not-ammunition
    check: >-
      countCopies(copy.type == 'gear' && has(copy.state.quivered)
        && copy.state.quivered && copy.fields.category != 'ammunition') == 0
  - id: quiver-over-capacity
    check: >-
      carrying.quiveredAmmunition <= 60 * carrying.quivers
        && carrying.quiveredJavelins <= 18 * carrying.quivers
        && carrying.quiveredLong <= 6 * carrying.quivers
    data:
      ammunition: carrying.quiveredAmmunition
      javelins: carrying.quiveredJavelins
      long: carrying.quiveredLong
      quivers: carrying.quivers
