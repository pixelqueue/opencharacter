fields:
  xp.current: { type: integer, input: true, default: 0, min: 0 }
  xp.nextLevel:
    type: integer
    formula: >-
      level.total < 1 || level.total >= 20 ? 0
        : [0, 300, 900, 2700, 6500, 14000, 23000, 34000, 48000, 64000, 85000, 100000, 120000,
          140000, 165000, 195000, 225000, 265000, 305000, 355000][level.total]
  xp.levelUp: { type: boolean, formula: 'xp.nextLevel > 0 && xp.current >= xp.nextLevel' }
  # Multiclassing into a class needs 13 in each of its multiclassAll abilities and in one of its
  # multiclassAny ones, when it lists any.
  multiclass.qualified:
    type: set
    of: class
    formula: >-
      filterList(multiclass.classes,
        !(x in multiclass.needs.str && abilities.str.score < 13)
          && !(x in multiclass.needs.dex && abilities.dex.score < 13)
          && !(x in multiclass.needs.con && abilities.con.score < 13)
          && !(x in multiclass.needs.int && abilities.int.score < 13)
          && !(x in multiclass.needs.wis && abilities.wis.score < 13)
          && !(x in multiclass.needs.cha && abilities.cha.score < 13)
          && (!(x in multiclass.oneOfListed)
            || (x in multiclass.oneOf.str && abilities.str.score >= 13)
            || (x in multiclass.oneOf.dex && abilities.dex.score >= 13)
            || (x in multiclass.oneOf.con && abilities.con.score >= 13)
            || (x in multiclass.oneOf.int && abilities.int.score >= 13)
            || (x in multiclass.oneOf.wis && abilities.wis.score >= 13)
            || (x in multiclass.oneOf.cha && abilities.cha.score >= 13)))
  multiclass.classes: { type: set, of: class }
  multiclass.oneOfListed: { type: set, of: class }
  'multiclass.needs.{ability}': { type: set, of: class }
  'multiclass.oneOf.{ability}': { type: set, of: class }

display:
  fields:
    xp.current:
      {
        groups: [summary],
        priority: 1,
        visibility: secondary,
        showWhen: '!sheet.monster',
        with: [{ field: xp.nextLevel, as: max }],
      }
    xp.nextLevel:
      {
        groups: [summary],
        priority: 2,
        visibility: secondary,
        showWhen: '!sheet.monster && xp.nextLevel > 0',
      }
    xp.levelUp: { hidden: true }
    multiclass.qualified: { hidden: true }
    multiclass.classes: { hidden: true }
    multiclass.oneOfListed: { hidden: true }
    'multiclass.needs.{ability}': { hidden: true }
    'multiclass.oneOf.{ability}': { hidden: true }

effects:
  # The families the qualification reads, from each class's multiclassAll and multiclassAny.
  - { target: multiclass.classes, op: grant, value: { query: { type: class } } }
  - target: multiclass.oneOfListed
    op: grant
    value: { query: { type: class, where: size(item.multiclassAny) > 0 } }
  - target: multiclass.needs.str
    op: grant
    value: { query: { type: class, where: "'str' in item.multiclassAll" } }
  - target: multiclass.needs.dex
    op: grant
    value: { query: { type: class, where: "'dex' in item.multiclassAll" } }
  - target: multiclass.needs.con
    op: grant
    value: { query: { type: class, where: "'con' in item.multiclassAll" } }
  - target: multiclass.needs.int
    op: grant
    value: { query: { type: class, where: "'int' in item.multiclassAll" } }
  - target: multiclass.needs.wis
    op: grant
    value: { query: { type: class, where: "'wis' in item.multiclassAll" } }
  - target: multiclass.needs.cha
    op: grant
    value: { query: { type: class, where: "'cha' in item.multiclassAll" } }
  - target: multiclass.oneOf.str
    op: grant
    value: { query: { type: class, where: "'str' in item.multiclassAny" } }
  - target: multiclass.oneOf.dex
    op: grant
    value: { query: { type: class, where: "'dex' in item.multiclassAny" } }
  - target: multiclass.oneOf.con
    op: grant
    value: { query: { type: class, where: "'con' in item.multiclassAny" } }
  - target: multiclass.oneOf.int
    op: grant
    value: { query: { type: class, where: "'int' in item.multiclassAny" } }
  - target: multiclass.oneOf.wis
    op: grant
    value: { query: { type: class, where: "'wis' in item.multiclassAny" } }
  - target: multiclass.oneOf.cha
    op: grant
    value: { query: { type: class, where: "'cha' in item.multiclassAny" } }

followUps:
  - id: level-up
    while: xp.levelUp
    action: level-up

actions:
  - id: level-up
    tags: [level-up]
    available: '!character.creating && level.total > 0 && level.total < 20'
    steps:
      - id: before
        kind: branch
        cases:
          - when: true
            flags: { maxBefore: hp.max }
      - id: class
        tags: [level-up.class]
        kind: choice
        options:
          content:
            type: class
            where: >-
              item.id in classes.held || (item.id in multiclass.qualified
                && countCopies(copy.type == 'class' && !(copy.item in multiclass.qualified)) == 0)
        prefer: sumCopies(copy.state.level, copy.type == 'class' && copy.item == item.id)
      - id: gain
        tags: [level-up.gain]
        kind: changes
        changes:
          - type: adjustState
            when: steps.class.picked in classes.held
            copies: { type: class, where: item.id == steps.class.picked }
            limit: 1
            key: level
            by: 1
          - type: addItem
            when: '!(steps.class.picked in classes.held)'
            entry: { item: steps.class.picked, state: { level: 1 } }
      - id: hitPoints
        tags: [level-up.hit-points]
        kind: choice
        options: [{ id: roll }, { id: fixed }]
        recommend: "'fixed'"
      - id: hitDie
        kind: roll
        when: "steps.hitPoints.picked == 'roll'"
        tags: [level-up]
        parts: [{ dice: steps.class.item.hitDie }]
      - id: hp
        kind: changes
        changes:
          - type: adjust
            field: hp.base
            by: >-
              steps.hitPoints.picked == 'roll' ? steps.hitDie.total
                : floor(maxOf(steps.class.item.hitDie) / 2) + 1
      # Current hit points rise by what the maximum gains: the hit die, Constitution and per-level
      # bonuses (Dwarven Toughness). Read on the proposed sheet, so the new maximum holds them.
      - id: current
        kind: changes
        sheet: proposed
        changes:
          - type: adjust
            when: hp.max > flags.maxBefore
            field: hp.current
            by: hp.max - flags.maxBefore
      - id: picks
        kind: choice
        options: { pending: {} }
