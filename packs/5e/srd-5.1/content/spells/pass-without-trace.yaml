id: spells.pass-without-trace
type: spell
fields:
  level: 2
  school: abjuration
  classes: [classes.druid, classes.ranger]
  concentration: true
  castingTime: action
  rangeKind: self
  verbal: true
  somatic: true
  material: true
  durationUnit: hour
  durationAmount: 1
  applied: true
actions:
  - use: cast-spell
effects:
  - target: { rolls: [skill.stealth] }
    op: add
    value: 10
    scope: applied
    stackKey: source
    duration: { amount: 1, unit: hour, concentration: true }
# Cast with no target, the spell is on the caster and holds the aura up: each creature the caster
# chooses within 30 feet gets the bonus while inside. stackKey source: one +10 however it came.
auras:
  - id: veil
    when: countList(character.applied, x.active && x.source == @spells.pass-without-trace
      && (x.appliedBy == '' || x.appliedBy == character.id)) > 0
    size: 30
    affects: allies
    effects:
      - target: { rolls: [skill.stealth] }
        op: add
        value: 10
        scope: applied
        stackKey: source
