id: spells.blindness-deafness
type: spell
fields:
  level: 2
  school: necromancy
  classes: [classes.bard, classes.cleric, classes.sorcerer, classes.wizard]
  castingTime: action
  rangeKind: ranged
  range: 30
  verbal: true
  somatic: false
  material: false
  durationUnit: minute
  durationAmount: 1
  save: con
  saveEffect: none
  applied: true
  castOptions: [blinded, deafened]
actions:
  - use: cast-spell
grants:
  - { item: conditions.blinded, scope: applied, when: "self.option == 'blinded'" }
  - { item: conditions.deafened, scope: applied, when: "self.option == 'deafened'" }
