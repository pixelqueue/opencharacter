id: spells.hunters-mark
type: spell
fields:
  level: 1
  school: divination
  classes: [classes.ranger]
  concentration: true
  castingTime: bonus-action
  rangeKind: ranged
  range: 90
  verbal: true
  somatic: false
  material: false
  durationUnit: hour
  durationAmount: 1
  applied: true
actions:
  - use: cast-spell
  # A later turn's bonus action, once the marked creature drops to 0 hit points (the player's
  # call): the caster's mark ends wherever it is (the app sends it to whoever holds one), and the
  # new creature is marked.
  - id: move
    tags: [spell]
    available: concentration.active
    params:
      slot: { type: integer, optional: true }
    participants: { target: { max: 1 } }
    results: [moved]
    steps:
      - id: unmark
        kind: changes
        to: applied
        changes:
          - type: removeEffect
            applied: { where: item.id == @spells.hunters-mark }
      - id: mark
        kind: changes
        to: target
        changes:
          - type: applyEffect
            source: item.id
            state: { castSlot: 'has(params.slot) ? params.slot : item.level' }
      - id: result
        kind: outcome
        result: "'moved'"
# The caster's weapon hits on the creature it marked deal an extra 1d6, of the weapon's damage
# type. Finding the quarry (advantage on Perception and Survival checks) is the app's.
effects:
  - target: { rolls: [damage.weapon] }
    op: add
    value: 1d6
    tags:
      [
        {
          formula: "'damage.' + (has(roll.item.damageType) ? roll.item.damageType : 'bludgeoning')",
        },
      ]
    # On a hit: rolled, confirmed by the player, or turned by luck (the same test as the damage
    # step's).
    when: >-
      (has(flags.hit) && flags.hit || has(steps.confirm) && steps.confirm.picked == 'hit'
        || has(steps.luck) && steps.luck.picked != 'miss')
        && has(participants.target) && size(participants.target) > 0
        && character.id in participants.target[0].huntersMark.markedBy
