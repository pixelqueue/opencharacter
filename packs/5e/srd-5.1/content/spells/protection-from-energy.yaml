id: spells.protection-from-energy
type: spell
fields:
  level: 3
  school: abjuration
  classes: [classes.cleric, classes.druid, classes.ranger, classes.sorcerer, classes.wizard]
  concentration: true
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: false
  durationUnit: hour
  durationAmount: 1
  applied: true
  castOptions: [acid, cold, fire, lightning, thunder]
actions:
  - use: cast-spell
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.acid] } }
    op: multiply
    value: 0.5
    when: self.option == 'acid'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { incoming: { fields: [hp.current], tags: [damage.cold] } }
    op: multiply
    value: 0.5
    when: self.option == 'cold'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { incoming: { fields: [hp.current], tags: [damage.fire] } }
    op: multiply
    value: 0.5
    when: self.option == 'fire'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { incoming: { fields: [hp.current], tags: [damage.lightning] } }
    op: multiply
    value: 0.5
    when: self.option == 'lightning'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
  - target: { incoming: { fields: [hp.current], tags: [damage.thunder] } }
    op: multiply
    value: 0.5
    when: self.option == 'thunder'
    scope: applied
    duration: { amount: 1, unit: hour, concentration: true }
