id: spells.bless
type: spell
fields:
  level: 1
  school: enchantment
  classes: [classes.cleric, classes.paladin]
  concentration: true
  castingTime: action
  rangeKind: ranged
  range: 30
  verbal: true
  somatic: true
  material: true
  durationUnit: minute
  durationAmount: 1
  applied: true
actions:
  - use: cast-spell
# Two Blesses share the stack key `source`, whose policy is highestOnly, so they don't stack.
effects:
  - target: { rolls: [attack, save] }
    op: add
    value: 1d4
    stackKey: source
    scope: applied
    duration: { amount: 1, unit: minute, concentration: true }
