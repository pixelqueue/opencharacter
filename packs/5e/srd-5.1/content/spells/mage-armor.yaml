id: spells.mage-armor
type: spell
fields:
  level: 1
  school: abjuration
  classes: [classes.sorcerer, classes.wizard]
  castingTime: action
  rangeKind: touch
  verbal: true
  somatic: true
  material: true
  durationUnit: hour
  durationAmount: 8
  applied: true
actions:
  - use: cast-spell
effects:
  - target: combat.ac
    op: set
    value: 13 + abilities.dex.mod
    when: "!('armor' in equipment.tags)"
    scope: applied
    duration: { amount: 8, unit: hour }
