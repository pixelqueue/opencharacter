id: spells.fire-shield
type: spell
fields:
  level: 4
  school: evocation
  classes: [classes.wizard]
  castingTime: action
  rangeKind: self
  verbal: true
  somatic: true
  material: true
  durationUnit: minute
  durationAmount: 10
  applied: true
  castOptions: [warm, chill]
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.cold] } }
    op: multiply
    value: 0.5
    scope: applied
    when: "self.option == 'warm'"
    duration: { amount: 10, unit: minute }
  - target: { incoming: { fields: [hp.current], tags: [damage.fire] } }
    op: multiply
    value: 0.5
    scope: applied
    when: "self.option == 'chill'"
    duration: { amount: 10, unit: minute }
# A creature that hits you with a melee attack while the shield is up is offered the shield's
# eruption, `change.from` naming it; whether it is within 5 feet is the app's.
followUps:
  - id: erupt
    on: { field: hp.current, tags: [melee], once: true }
    when: change.from != '' && change.from != character.id
    action: erupt
actions:
  - use: cast-spell
  # While the shield is up (its entry on the caster), warm or chill as cast.
  - id: erupt
    tags: [spell]
    available: countList(character.applied, x.active && x.source == @spells.fire-shield) > 0
    participants: { target: {} }
    results: [damage]
    steps:
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              slot: item.level
              critical: 'false'
              chill: >-
                countList(character.applied, x.active && x.source == @spells.fire-shield
                  && has(x.state.option) && x.state.option == 'chill') > 0
      - id: damage
        kind: roll
        tags: [damage.spell]
        parts:
          - dice: 2d8
            tags: [{ formula: "flags.chill ? 'damage.cold' : 'damage.fire'" }]
      - id: deal
        kind: changes
        to: target
        changes:
          - type: adjust
            field: hp.current
            split: { roll: damage, by: damage }
            by: -max(0, part.total)
            tags:
              - damage
              - spell
              - magical
              - { formula: "flags.critical ? ['critical'] : []" }
      - id: result
        kind: outcome
        result: "'damage'"
        data: { damage: steps.damage.total }
