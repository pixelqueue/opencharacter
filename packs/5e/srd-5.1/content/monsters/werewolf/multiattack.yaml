id: monsters.werewolf.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: spear }, { id: bite-and-claws }]
        recommend: "creature.form == 'hybrid' ? 'bite-and-claws' : 'spear'"
      - id: spear1
        kind: action
        when: "steps.form.picked == 'spear'"
        use: monster-attack
        source: "'monsters.werewolf.spear'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: spear2
        kind: action
        when: "steps.form.picked == 'spear'"
        use: monster-attack
        source: "'monsters.werewolf.spear'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: bite1
        kind: action
        when: "steps.form.picked == 'bite-and-claws'"
        use: monster-attack
        source: "'monsters.werewolf.bite'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: claws1
        kind: action
        when: "steps.form.picked == 'bite-and-claws'"
        use: monster-attack
        source: "'monsters.werewolf.claws'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.spear1) && steps.spear1.result == 'hit' ? 1 : 0)
              + (has(steps.spear2) && steps.spear2.result == 'hit' ? 1 : 0)
              + (has(steps.bite1) && steps.bite1.result == 'hit' ? 1 : 0)
              + (has(steps.claws1) && steps.claws1.result == 'hit' ? 1 : 0)
