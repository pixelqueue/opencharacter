id: monsters.vampire.regeneration
type: monsterAction
fields:
  kind: trait
  order: 4
actions:
  - id: regenerate
    tags: [healing]
    available: hp.current >= 1 && hp.current < hp.max
    results: [regenerated]
    steps:
      - id: heal
        kind: changes
        changes:
          - { type: adjust, field: hp.current, by: 20, tags: [healing] }
      - id: result
        kind: outcome
        result: "'regenerated'"
