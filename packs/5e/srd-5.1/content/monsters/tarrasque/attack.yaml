id: monsters.tarrasque.attack
type: monsterAction
fields:
  kind: legendary
  legendaryCost: 1
actions:
  - id: attack
    tags: [legendary]
    participants:
      target: { max: 1 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: claw }, { id: tail }]
        recommend: "'claw'"
      - id: claw
        kind: action
        when: "steps.form.picked == 'claw'"
        use: monster-attack
        source: "'monsters.tarrasque.claw'"
        participants:
          target: participants.target
      - id: tail
        kind: action
        when: "steps.form.picked == 'tail'"
        use: monster-attack
        source: "'monsters.tarrasque.tail'"
        participants:
          target: participants.target
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.claw) && steps.claw.result == 'hit' ? 1 : 0)
              + (has(steps.tail) && steps.tail.result == 'hit' ? 1 : 0)
