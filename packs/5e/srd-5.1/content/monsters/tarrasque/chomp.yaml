id: monsters.tarrasque.chomp
type: monsterAction
fields:
  kind: legendary
  legendaryCost: 2
actions:
  - id: chomp
    tags: [legendary]
    participants:
      target: { max: 1 }
    results: [done]
    steps:
      - id: bite
        kind: action
        use: monster-attack
        source: "'monsters.tarrasque.bite'"
        participants:
          target: participants.target
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.bite) && steps.bite.result == 'hit' ? 1 : 0)
