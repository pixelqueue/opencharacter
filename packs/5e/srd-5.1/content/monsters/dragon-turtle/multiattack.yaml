id: monsters.dragon-turtle.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: claws }, { id: tail }]
        recommend: "'claws'"
      - id: bite1
        kind: action
        when: "steps.form.picked == 'claws'"
        use: monster-attack
        source: "'monsters.dragon-turtle.bite'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: claw1
        kind: action
        when: "steps.form.picked == 'claws'"
        use: monster-attack
        source: "'monsters.dragon-turtle.claw'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: claw2
        kind: action
        when: "steps.form.picked == 'claws'"
        use: monster-attack
        source: "'monsters.dragon-turtle.claw'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: bite2
        kind: action
        when: "steps.form.picked == 'tail'"
        use: monster-attack
        source: "'monsters.dragon-turtle.bite'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: tail
        kind: action
        when: "steps.form.picked == 'tail'"
        use: monster-attack
        source: "'monsters.dragon-turtle.tail'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.bite1) && steps.bite1.result == 'hit' ? 1 : 0)
              + (has(steps.claw1) && steps.claw1.result == 'hit' ? 1 : 0)
              + (has(steps.claw2) && steps.claw2.result == 'hit' ? 1 : 0)
              + (has(steps.bite2) && steps.bite2.result == 'hit' ? 1 : 0)
              + (has(steps.tail) && steps.tail.result == 'hit' ? 1 : 0)
