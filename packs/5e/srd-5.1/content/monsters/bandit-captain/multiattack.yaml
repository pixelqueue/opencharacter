id: monsters.bandit-captain.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: melee }, { id: ranged }]
        recommend: "'melee'"
      - id: scimitar1
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.bandit-captain.scimitar'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: scimitar2
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.bandit-captain.scimitar'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: dagger1
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.bandit-captain.dagger'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: dagger2
        kind: action
        when: "steps.form.picked == 'ranged'"
        use: monster-attack
        source: "'monsters.bandit-captain.dagger'"
        params: { thrown: true }
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: dagger3
        kind: action
        when: "steps.form.picked == 'ranged'"
        use: monster-attack
        source: "'monsters.bandit-captain.dagger'"
        params: { thrown: true }
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.scimitar1) && steps.scimitar1.result == 'hit' ? 1 : 0)
              + (has(steps.scimitar2) && steps.scimitar2.result == 'hit' ? 1 : 0)
              + (has(steps.dagger1) && steps.dagger1.result == 'hit' ? 1 : 0)
              + (has(steps.dagger2) && steps.dagger2.result == 'hit' ? 1 : 0)
              + (has(steps.dagger3) && steps.dagger3.result == 'hit' ? 1 : 0)
