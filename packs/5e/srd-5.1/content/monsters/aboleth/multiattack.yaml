id: monsters.aboleth.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3 }
    results: [done]
    steps:
      - id: tentacle1
        kind: action
        use: monster-attack
        source: "'monsters.aboleth.tentacle'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: tentacle2
        kind: action
        use: monster-attack
        source: "'monsters.aboleth.tentacle'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: tentacle3
        kind: action
        use: monster-attack
        source: "'monsters.aboleth.tentacle'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.tentacle1) && steps.tentacle1.result == 'hit' ? 1 : 0)
              + (has(steps.tentacle2) && steps.tentacle2.result == 'hit' ? 1 : 0)
              + (has(steps.tentacle3) && steps.tentacle3.result == 'hit' ? 1 : 0)
