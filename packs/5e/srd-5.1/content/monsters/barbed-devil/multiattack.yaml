id: monsters.barbed-devil.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: melee }, { id: flame }]
        recommend: "'melee'"
      - id: tail
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.barbed-devil.tail'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: claw1
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.barbed-devil.claw'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: claw2
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.barbed-devil.claw'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: hurlFlame1
        kind: action
        when: "steps.form.picked == 'flame'"
        use: monster-attack
        source: "'monsters.barbed-devil.hurl-flame'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: hurlFlame2
        kind: action
        when: "steps.form.picked == 'flame'"
        use: monster-attack
        source: "'monsters.barbed-devil.hurl-flame'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.tail) && steps.tail.result == 'hit' ? 1 : 0)
              + (has(steps.claw1) && steps.claw1.result == 'hit' ? 1 : 0)
              + (has(steps.claw2) && steps.claw2.result == 'hit' ? 1 : 0)
              + (has(steps.hurlFlame1) && steps.hurlFlame1.result == 'hit' ? 1 : 0)
              + (has(steps.hurlFlame2) && steps.hurlFlame2.result == 'hit' ? 1 : 0)
