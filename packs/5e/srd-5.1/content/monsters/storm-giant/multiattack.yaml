id: monsters.storm-giant.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: greatsword1
        kind: action
        use: monster-attack
        source: "'monsters.storm-giant.greatsword'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: greatsword2
        kind: action
        use: monster-attack
        source: "'monsters.storm-giant.greatsword'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.greatsword1) && steps.greatsword1.result == 'hit' ? 1 : 0)
              + (has(steps.greatsword2) && steps.greatsword2.result == 'hit' ? 1 : 0)
