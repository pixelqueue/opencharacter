id: monsters.bearded-devil.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: beard
        kind: action
        use: monster-attack
        source: "'monsters.bearded-devil.beard'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: glaive
        kind: action
        use: monster-attack
        source: "'monsters.bearded-devil.glaive'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.beard) && steps.beard.result == 'hit' ? 1 : 0)
              + (has(steps.glaive) && steps.glaive.result == 'hit' ? 1 : 0)
