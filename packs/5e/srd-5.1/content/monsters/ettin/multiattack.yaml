id: monsters.ettin.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: battleaxe
        kind: action
        use: monster-attack
        source: "'monsters.ettin.battleaxe'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: morningstar
        kind: action
        use: monster-attack
        source: "'monsters.ettin.morningstar'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.battleaxe) && steps.battleaxe.result == 'hit' ? 1 : 0)
              + (has(steps.morningstar) && steps.morningstar.result == 'hit' ? 1 : 0)
