id: monsters.deep-gnome.innate-spellcasting
type: monsterSpellcasting
fields:
  ability: int
  dc: 11
  innate: true
grants:
  - item: spells.nondetection
effects:
  - { target: spells.monster, op: grant, value: { item: spells.nondetection } }
  - { target: spells.monsterAtWill, op: grant, value: { item: spells.nondetection } }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      countCopies(copy.id == action.self.id && copy.type == 'monsterAction'
        && has(copy.state.usesLeft) && copy.state.usesLeft > 0) > 0
    value:
      id: innate
      changes:
        - type: adjustState
          copies: { type: monsterAction, where: self.id == action.self.id }
          key: usesLeft
          by: -1
