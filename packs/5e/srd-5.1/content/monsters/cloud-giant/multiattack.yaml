id: monsters.cloud-giant.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: morningstar1
        kind: action
        use: monster-attack
        source: "'monsters.cloud-giant.morningstar'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: morningstar2
        kind: action
        use: monster-attack
        source: "'monsters.cloud-giant.morningstar'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.morningstar1) && steps.morningstar1.result == 'hit' ? 1 : 0)
              + (has(steps.morningstar2) && steps.morningstar2.result == 'hit' ? 1 : 0)
