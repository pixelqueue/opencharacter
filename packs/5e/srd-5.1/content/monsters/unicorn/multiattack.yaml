id: monsters.unicorn.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: hooves
        kind: action
        use: monster-attack
        source: "'monsters.unicorn.hooves'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: horn
        kind: action
        use: monster-attack
        source: "'monsters.unicorn.horn'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.hooves) && steps.hooves.result == 'hit' ? 1 : 0)
              + (has(steps.horn) && steps.horn.result == 'hit' ? 1 : 0)
