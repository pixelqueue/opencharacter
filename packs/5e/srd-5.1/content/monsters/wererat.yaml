id: monsters.wererat
type: monster
fields:
  size: medium
  creatureType: humanoid
  subtype: human
  shapechanger: true
  alignment: lawful-evil
  ac: 12
  hp: 33
  hitDice: 6d8 + 6
  speed: 30
  str: 10
  dex: 15
  con: 12
  int: 11
  wis: 10
  cha: 8
  skills: [skill.perception, skill.stealth]
  damageImmunities: [nonmagical-unsilvered]
  languages: [languages.common]
  startingForm: humanoid
  cr: 2
grants:
