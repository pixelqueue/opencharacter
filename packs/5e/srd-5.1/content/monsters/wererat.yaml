            - item: monsters.wererat.shortsword
            - item: monsters.wererat.hand-crossbow
        - id: hybrid
          effects:
            - { target: creature.form, op: set, value: "'hybrid'" }
          grants:
            - item: monsters.wererat.multiattack
            - item: monsters.wererat.bite
            - item: monsters.wererat.shortsword
            - item: monsters.wererat.hand-crossbow
        - id: rat
          effects:
            - { target: creature.form, op: set, value: "'rat'" }
            - { target: creature.size, op: set, value: "'small'" }
            - { target: senses.darkvision, op: atLeast, value: 60 }
          grants:
            - item: monsters.wererat.bite
