id: monsters.glabrezu.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 4 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: four }, { id: spell }]
        recommend: "'four'"
      - id: pincer1
        kind: action
        when: "steps.form.picked == 'four'"
        use: monster-attack
        source: "'monsters.glabrezu.pincer'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: pincer2
        kind: action
        when: "steps.form.picked == 'four'"
        use: monster-attack
        source: "'monsters.glabrezu.pincer'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: fist1
        kind: action
        when: "steps.form.picked == 'four'"
        use: monster-attack
        source: "'monsters.glabrezu.fist'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: fist2
        kind: action
        when: "steps.form.picked == 'four'"
        use: monster-attack
        source: "'monsters.glabrezu.fist'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(3, size(participants.target) - 1)].id] : []
      - id: pincer3
        kind: action
        when: "steps.form.picked == 'spell'"
        use: monster-attack
        source: "'monsters.glabrezu.pincer'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: pincer4
        kind: action
        when: "steps.form.picked == 'spell'"
        use: monster-attack
        source: "'monsters.glabrezu.pincer'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.pincer1) && steps.pincer1.result == 'hit' ? 1 : 0)
              + (has(steps.pincer2) && steps.pincer2.result == 'hit' ? 1 : 0)
              + (has(steps.fist1) && steps.fist1.result == 'hit' ? 1 : 0)
              + (has(steps.fist2) && steps.fist2.result == 'hit' ? 1 : 0)
              + (has(steps.pincer3) && steps.pincer3.result == 'hit' ? 1 : 0)
              + (has(steps.pincer4) && steps.pincer4.result == 'hit' ? 1 : 0)
