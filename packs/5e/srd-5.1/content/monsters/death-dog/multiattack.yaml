id: monsters.death-dog.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: bite1
        kind: action
        use: monster-attack
        source: "'monsters.death-dog.bite'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: bite2
        kind: action
        use: monster-attack
        source: "'monsters.death-dog.bite'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.bite1) && steps.bite1.result == 'hit' ? 1 : 0)
              + (has(steps.bite2) && steps.bite2.result == 'hit' ? 1 : 0)
