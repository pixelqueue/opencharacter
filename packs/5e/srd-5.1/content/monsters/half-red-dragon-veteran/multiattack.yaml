id: monsters.half-red-dragon-veteran.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: longsword }, { id: shortsword }]
        recommend: "'longsword'"
      - id: longsword1
        kind: action
        when: "steps.form.picked == 'longsword'"
        use: monster-attack
        source: "'monsters.half-red-dragon-veteran.longsword'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: longsword2
        kind: action
        when: "steps.form.picked == 'longsword'"
        use: monster-attack
        source: "'monsters.half-red-dragon-veteran.longsword'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: longsword3
        kind: action
        when: "steps.form.picked == 'shortsword'"
        use: monster-attack
        source: "'monsters.half-red-dragon-veteran.longsword'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: longsword4
        kind: action
        when: "steps.form.picked == 'shortsword'"
        use: monster-attack
        source: "'monsters.half-red-dragon-veteran.longsword'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: shortsword
        kind: action
        when: "steps.form.picked == 'shortsword'"
        use: monster-attack
        source: "'monsters.half-red-dragon-veteran.shortsword'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.longsword1) && steps.longsword1.result == 'hit' ? 1 : 0)
              + (has(steps.longsword2) && steps.longsword2.result == 'hit' ? 1 : 0)
              + (has(steps.longsword3) && steps.longsword3.result == 'hit' ? 1 : 0)
              + (has(steps.longsword4) && steps.longsword4.result == 'hit' ? 1 : 0)
              + (has(steps.shortsword) && steps.shortsword.result == 'hit' ? 1 : 0)
