id: monsters.horned-devil.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3 }
    results: [done]
    steps:
      - id: fork1
        kind: action
        use: monster-attack
        source: "'monsters.horned-devil.fork'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: fork2
        kind: action
        use: monster-attack
        source: "'monsters.horned-devil.fork'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: tail
        kind: action
        use: monster-attack
        source: "'monsters.horned-devil.tail'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.fork1) && steps.fork1.result == 'hit' ? 1 : 0)
              + (has(steps.fork2) && steps.fork2.result == 'hit' ? 1 : 0)
              + (has(steps.tail) && steps.tail.result == 'hit' ? 1 : 0)
