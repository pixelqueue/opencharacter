id: monsters.frost-giant.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: greataxe1
        kind: action
        use: monster-attack
        source: "'monsters.frost-giant.greataxe'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: greataxe2
        kind: action
        use: monster-attack
        source: "'monsters.frost-giant.greataxe'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.greataxe1) && steps.greataxe1.result == 'hit' ? 1 : 0)
              + (has(steps.greataxe2) && steps.greataxe2.result == 'hit' ? 1 : 0)
