id: monsters.manticore.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 3 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: melee }, { id: spikes }]
        recommend: "'melee'"
      - id: bite
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.manticore.bite'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: claw1
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.manticore.claw'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: claw2
        kind: action
        when: "steps.form.picked == 'melee'"
        use: monster-attack
        source: "'monsters.manticore.claw'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: tailSpike1
        kind: action
        when: "steps.form.picked == 'spikes'"
        use: monster-attack
        source: "'monsters.manticore.tail-spike'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: tailSpike2
        kind: action
        when: "steps.form.picked == 'spikes'"
        use: monster-attack
        source: "'monsters.manticore.tail-spike'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: tailSpike3
        kind: action
        when: "steps.form.picked == 'spikes'"
        use: monster-attack
        source: "'monsters.manticore.tail-spike'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(2, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.bite) && steps.bite.result == 'hit' ? 1 : 0)
              + (has(steps.claw1) && steps.claw1.result == 'hit' ? 1 : 0)
              + (has(steps.claw2) && steps.claw2.result == 'hit' ? 1 : 0)
              + (has(steps.tailSpike1) && steps.tailSpike1.result == 'hit' ? 1 : 0)
              + (has(steps.tailSpike2) && steps.tailSpike2.result == 'hit' ? 1 : 0)
              + (has(steps.tailSpike3) && steps.tailSpike3.result == 'hit' ? 1 : 0)
