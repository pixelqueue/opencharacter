id: monsters.salamander.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: spear
        kind: action
        use: monster-attack
        source: "'monsters.salamander.spear'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: tail
        kind: action
        use: monster-attack
        source: "'monsters.salamander.tail'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.spear) && steps.spear.result == 'hit' ? 1 : 0)
              + (has(steps.tail) && steps.tail.result == 'hit' ? 1 : 0)
