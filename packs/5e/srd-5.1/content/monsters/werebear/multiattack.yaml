id: monsters.werebear.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: claws }, { id: greataxes }]
        recommend: "creature.form == 'humanoid' ? 'greataxes' : 'claws'"
      - id: claw1
        kind: action
        when: "steps.form.picked == 'claws'"
        use: monster-attack
        source: "'monsters.werebear.claw'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: claw2
        kind: action
        when: "steps.form.picked == 'claws'"
        use: monster-attack
        source: "'monsters.werebear.claw'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: greataxe1
        kind: action
        when: "steps.form.picked == 'greataxes'"
        use: monster-attack
        source: "'monsters.werebear.greataxe'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: greataxe2
        kind: action
        when: "steps.form.picked == 'greataxes'"
        use: monster-attack
        source: "'monsters.werebear.greataxe'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.claw1) && steps.claw1.result == 'hit' ? 1 : 0)
              + (has(steps.claw2) && steps.claw2.result == 'hit' ? 1 : 0)
              + (has(steps.greataxe1) && steps.greataxe1.result == 'hit' ? 1 : 0)
              + (has(steps.greataxe2) && steps.greataxe2.result == 'hit' ? 1 : 0)
