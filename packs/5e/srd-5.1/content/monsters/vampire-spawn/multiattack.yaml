id: monsters.vampire-spawn.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: form
        kind: choice
        options: [{ id: claws }, { id: bite }]
        recommend: "'claws'"
      - id: claws1
        kind: action
        when: "steps.form.picked == 'claws'"
        use: monster-attack
        source: "'monsters.vampire-spawn.claws'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: claws2
        kind: action
        when: "steps.form.picked == 'claws'"
        use: monster-attack
        source: "'monsters.vampire-spawn.claws'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: claws3
        kind: action
        when: "steps.form.picked == 'bite'"
        use: monster-attack
        source: "'monsters.vampire-spawn.claws'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: bite
        kind: action
        when: "steps.form.picked == 'bite'"
        use: monster-attack
        source: "'monsters.vampire-spawn.bite'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.claws1) && steps.claws1.result == 'hit' ? 1 : 0)
              + (has(steps.claws2) && steps.claws2.result == 'hit' ? 1 : 0)
              + (has(steps.claws3) && steps.claws3.result == 'hit' ? 1 : 0)
              + (has(steps.bite) && steps.bite.result == 'hit' ? 1 : 0)
