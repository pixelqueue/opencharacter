id: monsters.night-hag.innate-spellcasting
type: monsterSpellcasting
fields:
  ability: cha
  dc: 14
  attack: 6
  innate: true
grants:
  - item: spells.detect-magic
  - item: spells.magic-missile
effects:
  - { target: spells.monster, op: grant, value: { item: spells.detect-magic } }
  - { target: spells.monster, op: grant, value: { item: spells.magic-missile } }
  - { target: spells.monsterAtWill, op: grant, value: { item: spells.detect-magic } }
  - { target: spells.monsterAtWill, op: grant, value: { item: spells.magic-missile } }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      countCopies(copy.id == action.self.id && copy.type == 'monsterAction'
        && has(copy.state.usesLeft) && copy.state.usesLeft > 0) > 0
    value:
      id: innate
      changes:
        - type: adjustState
          copies: { type: monsterAction, where: self.id == action.self.id }
          key: usesLeft
          by: -1
