id: monsters.giant-ape.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: fist1
        kind: action
        use: monster-attack
        source: "'monsters.giant-ape.fist'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: fist2
        kind: action
        use: monster-attack
        source: "'monsters.giant-ape.fist'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.fist1) && steps.fist1.result == 'hit' ? 1 : 0)
              + (has(steps.fist2) && steps.fist2.result == 'hit' ? 1 : 0)
