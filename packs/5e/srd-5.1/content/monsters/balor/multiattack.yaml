id: monsters.balor.multiattack
type: monsterAction
actions:
  - id: multiattack
    tags: [attack]
    participants:
      target: { max: 2 }
    results: [done]
    steps:
      - id: longsword
        kind: action
        use: monster-attack
        source: "'monsters.balor.longsword'"
        participants:
          target: 'size(participants.target) > 0 ? [participants.target[0].id] : []'
      - id: whip
        kind: action
        use: monster-attack
        source: "'monsters.balor.whip'"
        participants:
          target: >-
            size(participants.target) > 0
              ? [participants.target[min(1, size(participants.target) - 1)].id] : []
      - id: done
        kind: outcome
        result: "'done'"
        data:
          hits: >-
            (has(steps.longsword) && steps.longsword.result == 'hit' ? 1 : 0)
              + (has(steps.whip) && steps.whip.result == 'hit' ? 1 : 0)
