id: subclasses.draconic-bloodline
type: subclass
fields:
  class: classes.sorcerer
grants:
  - { item: features.sorcerer.dragon-ancestor, when: self.level >= 1 }
  - { item: features.sorcerer.draconic-resilience, when: self.level >= 1 }
  - { item: features.sorcerer.elemental-affinity, when: self.level >= 6 }
  - { item: features.sorcerer.dragon-wings, when: self.level >= 14 }
  - { item: features.sorcerer.draconic-presence, when: self.level >= 18 }
