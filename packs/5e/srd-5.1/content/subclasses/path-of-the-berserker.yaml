id: subclasses.path-of-the-berserker
type: subclass
fields:
  class: classes.barbarian
grants:
  - { item: features.barbarian.frenzy, when: self.level >= 3 }
  - { item: features.barbarian.mindless-rage, when: self.level >= 6 }
  - { item: features.barbarian.intimidating-presence, when: self.level >= 10 }
  - { item: features.barbarian.retaliation, when: self.level >= 14 }
