id: subclasses.way-of-the-open-hand
type: subclass
fields:
  class: classes.monk
grants:
  - { item: features.monk.open-hand-technique, when: self.level >= 3 }
  - { item: features.monk.wholeness-of-body, when: self.level >= 6 }
  - { item: features.monk.tranquility, when: self.level >= 11 }
  - { item: features.monk.quivering-palm, when: self.level >= 17 }
