id: subclasses.school-of-evocation
type: subclass
fields:
  class: classes.wizard
grants:
  - { item: features.wizard.evocation-savant, when: self.level >= 2 }
  - { item: features.wizard.sculpt-spells, when: self.level >= 2 }
  - { item: features.wizard.potent-cantrip, when: self.level >= 6 }
  - { item: features.wizard.empowered-evocation, when: self.level >= 10 }
  - { item: features.wizard.overchannel, when: self.level >= 14 }
