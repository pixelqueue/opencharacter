id: subclasses.college-of-lore
type: subclass
fields:
  class: classes.bard
grants:
  - { item: features.bard.bonus-proficiencies, when: self.level >= 3 }
  - { item: features.bard.cutting-words, when: self.level >= 3 }
  - { item: features.bard.additional-magical-secrets, when: self.level >= 6 }
  - { item: features.bard.peerless-skill, when: self.level >= 14 }
