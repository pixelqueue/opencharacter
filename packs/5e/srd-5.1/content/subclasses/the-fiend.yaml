id: subclasses.the-fiend
type: subclass
fields:
  class: classes.warlock
grants:
  - { item: features.warlock.dark-ones-blessing, when: self.level >= 1 }
  - { item: features.warlock.dark-ones-own-luck, when: self.level >= 6 }
  - { item: features.warlock.fiendish-resilience, when: self.level >= 10 }
  - { item: features.warlock.hurl-through-hell, when: self.level >= 14 }
effects:
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.burning-hands } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.command } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.blindness-deafness } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.scorching-ray } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.fireball } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.stinking-cloud } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.fire-shield } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.wall-of-fire } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.flame-strike } }
  - { target: spells.warlockExpanded, op: grant, value: { item: spells.hallow } }
