id: subclasses.hunter
type: subclass
fields:
  class: classes.ranger
choices:
  - id: hunters-prey
    from:
      options:
        - id: colossus-slayer
          effects:
            - { target: hunter.colossusSlayer, op: set, value: true }
        - { id: giant-killer }
        - { id: horde-breaker }
    when: self.level >= 3
  - id: defensive-tactics
    from:
      options:
        - { id: escape-the-horde }
        - { id: multiattack-defense }
        - { id: steel-will }
    when: self.level >= 7
  - id: multiattack
    from:
      options:
        - id: volley
          grants:
            - { item: features.ranger.volley }
        - id: whirlwind-attack
          grants:
            - { item: features.ranger.whirlwind-attack }
    when: self.level >= 11
  - id: superior-hunters-defense
    from:
      options:
        - id: evasion
          grants:
            - { item: features.evasion }
        - { id: stand-against-the-tide }
        - id: uncanny-dodge
          grants:
            - { item: features.rogue.uncanny-dodge }
    when: self.level >= 15
