id: subclasses.hunter
type: subclass
fields:
  class: classes.ranger
choices:
  - id: hunters-prey
    from: { type: hunterTactic, where: "item.feature == 'hunters-prey'" }
    when: self.level >= 3
  - id: defensive-tactics
    from: { type: hunterTactic, where: "item.feature == 'defensive-tactics'" }
    when: self.level >= 7
  - id: multiattack
    from: { type: hunterTactic, where: "item.feature == 'multiattack'" }
    when: self.level >= 11
  - id: superior-hunters-defense
    from: { type: hunterTactic, where: "item.feature == 'superior-hunters-defense'" }
    when: self.level >= 15
