id: invocations.bewitching-whispers
type: invocation
state:
  used: { type: boolean, default: false }
prerequisites:
  - id: level
    when: self.level >= 7
grants:
  - { item: spells.compulsion }
effects:
  - { target: spells.warlock, op: grant, value: { item: spells.compulsion } }
  - { target: spells.limited, op: grant, value: { item: spells.compulsion } }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.item.id == @spells.compulsion && flags.slot == pactSlots.level
        && pactSlots.used < pactSlots.max && !self.used
    value:
      id: invocation
      changes:
        - { type: adjust, field: pactSlots.used, by: 1 }
        - { type: setState, picks: { where: 'item.id == @invocations.bewitching-whispers' }, key: used, value: true }
