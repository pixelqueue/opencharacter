id: invocations.mire-the-mind
type: invocation
state:
  used: { type: boolean, default: false }
prerequisites:
  - id: level
    when: self.level >= 5
grants:
  - { item: spells.slow }
effects:
  - { target: spells.warlock, op: grant, value: { item: spells.slow } }
  - { target: spells.limited, op: grant, value: { item: spells.slow } }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.item.id == @spells.slow && flags.slot == pactSlots.level
        && pactSlots.used < pactSlots.max && !self.used
    value:
      id: invocation
      changes:
        - { type: adjust, field: pactSlots.used, by: 1 }
        - { type: setState, picks: { where: 'item.id == @invocations.mire-the-mind' }, key: used, value: true }
