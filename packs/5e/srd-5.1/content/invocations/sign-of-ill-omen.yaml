id: invocations.sign-of-ill-omen
type: invocation
prerequisites:
  - id: level
    when: self.level >= 5
grants:
  - { item: spells.bestow-curse }
effects:
  - { target: spells.warlock, op: grant, value: { item: spells.bestow-curse } }
  - { target: spells.limited, op: grant, value: { item: spells.bestow-curse } }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.item.id == @spells.bestow-curse && flags.slot == pactSlots.level
        && pactSlots.used < pactSlots.max && !self.signOfIllOmenUsed
    value:
      id: invocation
      changes:
        - { type: adjust, field: pactSlots.used, by: 1 }
        - { type: setState, entry: self, key: signOfIllOmenUsed, value: true }
