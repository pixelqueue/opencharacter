id: invocations.dreadful-word
type: invocation
prerequisites:
  - id: level
    when: self.level >= 7
grants:
  - { item: spells.confusion }
effects:
  - { target: spells.warlock, op: grant, value: { item: spells.confusion } }
  - { target: spells.limited, op: grant, value: { item: spells.confusion } }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.item.id == @spells.confusion && flags.slot == pactSlots.level
        && pactSlots.used < pactSlots.max && !self.dreadfulWordUsed
    value:
      id: invocation
      changes:
        - { type: adjust, field: pactSlots.used, by: 1 }
        - { type: setState, entry: self, key: dreadfulWordUsed, value: true }
