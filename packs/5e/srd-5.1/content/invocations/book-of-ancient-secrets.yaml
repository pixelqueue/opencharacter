id: invocations.book-of-ancient-secrets
type: invocation
prerequisites:
  - id: pact
    when: '@pact-boons.tome in warlock.boons'
choices:
  - id: rituals
    pick: 2
    from: { type: spell, where: item.level == 1 && has(item.ritual) && item.ritual }
    effects:
      - { target: spells.warlock, op: grant, value: { formula: pick.id } }
