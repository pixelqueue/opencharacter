id: invocations.lifedrinker
type: invocation
prerequisites:
  - id: level
    when: self.level >= 12
  - id: pact
    when: '@pact-boons.blade in warlock.boons'
effects:
  # Only the pact weapon: approximated as every melee weapon attack (the app picks the weapon).
  - target: { rolls: [damage.weapon] }
    op: add
    value: max(1, abilities.cha.mod)
    tags: [damage.necrotic]
    when: has(roll.item) && roll.item.range == 'melee'
