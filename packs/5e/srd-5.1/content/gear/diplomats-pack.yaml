id: gear.diplomats-pack
type: gear
tags: [equipment-pack]
fields:
  category: equipment-pack
  cost: 39
actions:
  - id: unpack
    tags: [item]
    available: self.quantity > 0
    steps:
      - id: unpack
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'gear.chest'" } }
          - { type: addItem, entry: { item: "'gear.map-or-scroll-case'", quantity: 2 } }
          - { type: addItem, entry: { item: "'gear.fine-clothes'" } }
          - { type: addItem, entry: { item: "'gear.ink'" } }
          - { type: addItem, entry: { item: "'gear.ink-pen'" } }
          - { type: addItem, entry: { item: "'gear.lamp'" } }
          - { type: addItem, entry: { item: "'gear.oil'", quantity: 2 } }
          - { type: addItem, entry: { item: "'gear.paper'", quantity: 5 } }
          - { type: addItem, entry: { item: "'gear.perfume'" } }
          - { type: addItem, entry: { item: "'gear.sealing-wax'" } }
          - { type: addItem, entry: { item: "'gear.soap'" } }
          - { type: adjustQuantity, entry: self, by: -1, when: self.quantity > 1 }
          - { type: removeItem, entry: self, when: self.quantity <= 1 }
