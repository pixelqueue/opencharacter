id: metamagic.careful-spell
type: metamagic
effects:
  - target: { choices: [metamagic] }
    op: option
    when: 'has(action.item.save) && sorcery.left >= 1'
    value:
      id: careful
      flags: { metamagic: "'careful'" }
      changes:
        - { type: adjustState, entry: self, key: sorceryPointsSpent, by: 1 }
