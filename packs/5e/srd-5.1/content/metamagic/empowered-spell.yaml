id: metamagic.empowered-spell
type: metamagic
# Rerolls, once, the lowest damage dice at or below half their faces, up to the Charisma modifier
# (at least one).
effects:
  - target: { rolls: [damage.spell] }
    op: rollModifier
    value:
      kind: reroll
      below: 'floor(maxOf(dieOf(roll.item.damage)) / 2)'
      once: true
      count: max(1, abilities.cha.mod)
    when: >-
      has(flags.metamagic) && flags.metamagic == 'empowered' && has(roll.item.damage)
  - target: { choices: [metamagic] }
    op: option
    when: 'has(action.item.damage) && sorcery.left >= 1'
    value:
      id: empowered
      flags: { metamagic: "'empowered'" }
      changes:
        - { type: adjustState, entry: self, key: sorceryPointsSpent, by: 1 }
