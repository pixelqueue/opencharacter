id: traits.skill-versatility
type: trait
choices:
  - id: skills
    recommend: >-
      (filterList(['skill.perception', 'skill.persuasion', 'skill.insight', 'skill.stealth'],
        x in options) + options)[0]
    pick: 2
    unique: skills
    from:
      values:
        [
          skill.acrobatics,
          skill.animal-handling,
          skill.arcana,
          skill.athletics,
          skill.deception,
          skill.history,
          skill.insight,
          skill.intimidation,
          skill.investigation,
          skill.medicine,
          skill.nature,
          skill.perception,
          skill.performance,
          skill.persuasion,
          skill.religion,
          skill.sleight-of-hand,
          skill.stealth,
          skill.survival,
        ]
      where: '!(value in proficiencies.skills) || value in choice.picks'
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
