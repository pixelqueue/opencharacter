id: traits.relentless-endurance
type: trait
state:
  used: { type: boolean, default: false }
followUps:
  - id: relentless-endurance
    becomes: hp.current == 0
    when: '!self.used'
    action: relentless-endurance
actions:
  - id: relentless-endurance
    tags: [feature]
    results: [endured]
    available: hp.current == 0 && !self.used
    steps:
      - id: endure
        kind: changes
        changes:
          - { type: set, field: hp.current, value: 1 }
          - { type: setState, grant: self, key: used, value: true }
      - id: result
        kind: outcome
        result: "'endured'"
