id: classes.warlock
type: class
fields:
  hitDie: 1d8
  startingKit: true
  abilityPriority:
    [
      abilities.cha.score,
      abilities.con.score,
      abilities.dex.score,
      abilities.wis.score,
      abilities.int.score,
      abilities.str.score,
    ]
  multiclassAll: [cha]
state:
  arcanum6Used: { type: boolean, default: false }
  arcanum7Used: { type: boolean, default: false }
  arcanum8Used: { type: boolean, default: false }
  arcanum9Used: { type: boolean, default: false }
  eldritchMasterUsed: { type: boolean, default: false }
  darkOnesOwnLuckUsed: { type: boolean, default: false }
  hurlThroughHellUsed: { type: boolean, default: false }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
  - { target: proficiencies.saves, op: grant, value: { tag: save.wis }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.cha }, when: self.startingClass }
grants:
  - { item: features.warlock.pact-magic, when: self.level >= 1 }
  - { item: features.warlock.eldritch-invocations, when: self.level >= 2 }
  - { item: features.warlock.pact-boon, when: self.level >= 3 }
  - { item: features.warlock.mystic-arcanum, when: self.level >= 11 }
  - { item: features.warlock.eldritch-master, when: self.level >= 20 }
  - { item: features.ability-score-improvement, when: self.level >= 4 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      {
        values:
          [
            skill.arcana,
            skill.deception,
            skill.history,
            skill.intimidation,
            skill.investigation,
            skill.nature,
            skill.religion,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: otherworldly-patron
    from: { type: subclass, where: 'item.class == @classes.warlock' }
    when: self.level >= 1
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: warlockWeapon
        kind: choice
        options:
          - id: light-crossbow
            changes:
              - type: addItem
                entry: { item: "'weapons.light-crossbow'", equipped: true }
              - { type: addItem, entry: { item: "'gear.crossbow-bolts'", quantity: 20 } }
          - id: simple
        recommend: options[0]
        random: params.random
      - id: warlockSimple
        kind: choice
        when: "steps.warlockWeapon.picked == 'simple'"
        options: { content: { type: weapon, where: "item.category == 'simple'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: warlockFocus
        kind: choice
        options:
          - id: component-pouch
            changes: [{ type: addItem, entry: { item: "'gear.component-pouch'" } }]
          - id: arcane-focus
        recommend: options[0]
        random: params.random
      - id: warlockArcaneFocus
        kind: choice
        when: "steps.warlockFocus.picked == 'arcane-focus'"
        options: { content: { type: gear, where: "item.category == 'arcane-focus'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id } }
      - id: warlockPack
        kind: choice
        options:
          - id: scholars-pack
            changes: [{ type: addItem, entry: { item: "'gear.scholars-pack'" } }]
          - id: dungeoneers-pack
            changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
        recommend: options[0]
        random: params.random
      - id: warlockExtra
        kind: choice
        options: { content: { type: weapon, where: "item.category == 'simple'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: warlockKit
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
          - type: addItem
            entry: { item: "'weapons.dagger'", quantity: 2, equipped: true }
