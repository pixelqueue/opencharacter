id: classes.druid
type: class
fields:
  hitDie: 1d8
  startingKit: true
  abilityPriority1: wis
  abilityPriority2: con
  abilityPriority3: dex
  abilityPriority4: int
  abilityPriority5: cha
  abilityPriority6: str
state:
  wildShapeSpent: { type: integer, default: 0, min: 0 }
  naturalRecoveryUsed: { type: boolean, default: false }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - { target: proficiencies.armor, op: grant, value: { tag: medium } }
  - { target: proficiencies.armor, op: grant, value: { tag: shield } }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.club },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.dagger },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.dart },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.javelin },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.mace },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.quarterstaff },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.scimitar },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.sickle },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.sling },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.spear },
      when: self.startingClass,
    }
  - {
      target: proficiencies.tools,
      op: grant,
      value: { item: tools.herbalism-kit },
      when: self.startingClass,
    }
  - { target: proficiencies.saves, op: grant, value: { tag: save.int }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.wis }, when: self.startingClass }
grants:
  - { item: features.druid.druidic, when: self.level >= 1 }
  - { item: features.druid.spellcasting, when: self.level >= 1 }
  - { item: features.druid.wild-shape, when: self.level >= 2 }
  - { item: features.druid.timeless-body, when: self.level >= 18 }
  - { item: features.druid.beast-spells, when: self.level >= 18 }
  - { item: features.druid.archdruid, when: self.level >= 20 }
  - { item: features.ability-score-improvement, when: self.level >= 4 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      {
        values:
          [
            skill.arcana,
            skill.animal-handling,
            skill.insight,
            skill.medicine,
            skill.nature,
            skill.perception,
            skill.religion,
            skill.survival,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: druid-circle
    from: { type: subclass, where: 'item.class == @classes.druid' }
    when: self.level >= 2
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: druidFirst
        kind: choice
        options:
          - id: wooden-shield
            changes:
              - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }
          - id: simple
        recommend: options[0]
        random: params.random
      - id: druidSimple
        kind: choice
        when: "steps.druidFirst.picked == 'simple'"
        options: { content: { type: weapon, where: "item.category == 'simple'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: druidWeapon
        kind: choice
        options:
          - id: scimitar
            changes:
              - { type: addItem, entry: { item: "'weapons.scimitar'", equipped: true } }
          - id: simple-melee
        recommend: options[0]
        random: params.random
      - id: druidSimpleMelee
        kind: choice
        when: "steps.druidWeapon.picked == 'simple-melee'"
        options:
          content: { type: weapon, where: "item.category == 'simple' && item.range == 'melee'" }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: druidFocus
        kind: choice
        options: { content: { type: gear, where: "item.category == 'druidic-focus'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id } }
      - id: druidKit
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
          - { type: addItem, entry: { item: "'gear.explorers-pack'" } }
