id: classes.sorcerer
type: class
fields:
  hitDie: 1d6
state:
  sorceryPointsSpent: { type: integer, default: 0, min: 0 }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.dagger },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.dart },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.sling },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.quarterstaff },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.light-crossbow },
      when: self.startingClass,
    }
  - { target: proficiencies.saves, op: grant, value: { tag: save.con }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.cha }, when: self.startingClass }
grants:
  - { item: features.sorcerer.spellcasting, when: self.level >= 1 }
  - { item: features.sorcerer.font-of-magic, when: self.level >= 2 }
  - { item: features.sorcerer.metamagic, when: self.level >= 3 }
  - { item: features.sorcerer.sorcerous-restoration, when: self.level >= 20 }
  - { item: features.ability-score-improvement, when: self.level >= 4 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      {
        values:
          [
            skill.arcana,
            skill.deception,
            skill.insight,
            skill.intimidation,
            skill.persuasion,
            skill.religion,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: sorcerous-origin
    from: { type: subclass, where: 'item.class == @classes.sorcerer' }
    when: self.level >= 1
