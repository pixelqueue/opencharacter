id: classes.sorcerer
type: class
fields:
  hitDie: 1d6
  startingKit: true
  abilityPriority:
    [
      abilities.cha.score,
      abilities.con.score,
      abilities.dex.score,
      abilities.wis.score,
      abilities.int.score,
      abilities.str.score,
    ]
  multiclassAll: [cha]
state:
  sorceryPointsSpent: { type: integer, default: 0, min: 0 }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.dagger },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.dart },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.sling },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.quarterstaff },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.light-crossbow },
      when: self.startingClass,
    }
  - { target: proficiencies.saves, op: grant, value: { tag: save.con }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.cha }, when: self.startingClass }
grants:
  - { item: features.sorcerer.spellcasting, when: self.level >= 1 }
  - { item: features.sorcerer.font-of-magic, when: self.level >= 2 }
  - { item: features.sorcerer.metamagic, when: self.level >= 3 }
  - { item: features.sorcerer.sorcerous-restoration, when: self.level >= 20 }
  - { item: features.ability-score-improvement, when: self.level >= 4 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      {
        values:
          [
            skill.arcana,
            skill.deception,
            skill.insight,
            skill.intimidation,
            skill.persuasion,
            skill.religion,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: sorcerous-origin
    from: { type: subclass, where: 'item.class == @classes.sorcerer' }
    when: self.level >= 1
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: sorcererWeapon
        kind: choice
        options:
          - id: light-crossbow
            changes:
              - type: addItem
                entry: { item: "'weapons.light-crossbow'", equipped: true }
              - { type: addItem, entry: { item: "'gear.crossbow-bolts'", quantity: 20 } }
          - id: simple
        recommend: options[0]
        random: params.random
      - id: sorcererSimple
        kind: choice
        when: "steps.sorcererWeapon.picked == 'simple'"
        options: { content: { type: weapon, where: "item.category == 'simple'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: sorcererFocus
        kind: choice
        options:
          - id: component-pouch
            changes: [{ type: addItem, entry: { item: "'gear.component-pouch'" } }]
          - id: arcane-focus
        recommend: options[0]
        random: params.random
      - id: sorcererArcaneFocus
        kind: choice
        when: "steps.sorcererFocus.picked == 'arcane-focus'"
        options: { content: { type: gear, where: "item.category == 'arcane-focus'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id } }
      - id: sorcererPack
        kind: choice
        options:
          - id: dungeoneers-pack
            changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
          - id: explorers-pack
            changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
        recommend: options[0]
        random: params.random
      - id: sorcererKit
        kind: changes
        changes:
          - type: addItem
            entry: { item: "'weapons.dagger'", quantity: 2, equipped: true }
