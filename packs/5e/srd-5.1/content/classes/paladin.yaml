id: classes.paladin
type: class
fields:
  hitDie: 1d10
  startingKit: true
  abilityPriority1: str
  abilityPriority2: cha
  abilityPriority3: con
  abilityPriority4: wis
  abilityPriority5: dex
  abilityPriority6: int
state:
  divineSenseSpent: { type: integer, default: 0, min: 0 }
  layOnHandsSpent: { type: integer, default: 0, min: 0 }
  channelDivinitySpent: { type: integer, default: 0, min: 0 }
  cleansingTouchSpent: { type: integer, default: 0, min: 0 }
  holyNimbusUsed: { type: boolean, default: false }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'martial'" } }
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - { target: proficiencies.armor, op: grant, value: { tag: medium } }
  - { target: proficiencies.armor, op: grant, value: { tag: shield } }
  - { target: proficiencies.armor, op: grant, value: { tag: heavy }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.wis }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.cha }, when: self.startingClass }
  - { target: channelDivinity.uses, op: atLeast, value: 1, when: self.level >= 3 }
grants:
  - { item: features.paladin.divine-sense, when: self.level >= 1 }
  - { item: features.paladin.lay-on-hands, when: self.level >= 1 }
  - { item: features.paladin.spellcasting, when: self.level >= 2 }
  - { item: features.paladin.divine-smite, when: self.level >= 2 }
  - { item: features.paladin.divine-health, when: self.level >= 3 }
  - { item: features.extra-attack, when: self.level >= 5 }
  - { item: features.paladin.aura-of-protection, when: self.level >= 6 }
  - { item: features.paladin.aura-of-courage, when: self.level >= 10 }
  - { item: features.paladin.improved-divine-smite, when: self.level >= 11 }
  - { item: features.paladin.cleansing-touch, when: self.level >= 14 }
  - { item: features.paladin.aura-improvements, when: self.level >= 18 }
  - { item: features.ability-score-improvement, when: self.level >= 4 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      {
        values:
          [
            skill.athletics,
            skill.insight,
            skill.intimidation,
            skill.medicine,
            skill.persuasion,
            skill.religion,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: fighting-style
    from:
      {
        items:
          [
            fighting-styles.defense,
            fighting-styles.dueling,
            fighting-styles.great-weapon-fighting,
            fighting-styles.protection,
          ],
      }
    when: self.level >= 2
    unique: fighting-style
  - id: sacred-oath
    from: { type: subclass, where: 'item.class == @classes.paladin' }
    when: self.level >= 3
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: paladinWeapons
        kind: choice
        options:
          - id: martial-and-shield
            changes:
              - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }
          - id: two-martial
        recommend: options[0]
        random: params.random
      - id: paladinMartial
        kind: choice
        options: { content: { type: weapon, where: "item.category == 'martial'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: paladinMartial2
        kind: choice
        when: "steps.paladinWeapons.picked == 'two-martial'"
        options: { content: { type: weapon, where: "item.category == 'martial'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: paladinSecond
        kind: choice
        options:
          - id: five-javelins
            changes:
              - type: addItem
                entry: { item: "'weapons.javelin'", quantity: 5, equipped: true }
          - id: simple-melee
        recommend: options[0]
        random: params.random
      - id: paladinSimpleMelee
        kind: choice
        when: "steps.paladinSecond.picked == 'simple-melee'"
        options:
          content: { type: weapon, where: "item.category == 'simple' && item.range == 'melee'" }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: paladinPack
        kind: choice
        options:
          - id: priests-pack
            changes: [{ type: addItem, entry: { item: "'gear.priests-pack'" } }]
          - id: explorers-pack
            changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
        recommend: options[0]
        random: params.random
      - id: paladinSymbol
        kind: choice
        options: { content: { type: gear, where: "item.category == 'holy-symbol'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id } }
      - id: paladinKit
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'armor.chain-mail'", equipped: true } }
