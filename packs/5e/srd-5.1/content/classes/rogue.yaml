id: classes.rogue
type: class
fields:
  hitDie: 1d8
  startingKit: true
  abilityPriority:
    [
      abilities.dex.score,
      abilities.con.score,
      abilities.wis.score,
      abilities.int.score,
      abilities.cha.score,
      abilities.str.score,
    ]
  multiclassAll: [dex]
state:
  strokeOfLuckUsed: { type: boolean, default: false }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - { target: proficiencies.tools, op: grant, value: { item: tools.thieves-tools } }
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
    when: self.startingClass
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.hand-crossbow },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.longsword },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.rapier },
      when: self.startingClass,
    }
  - {
      target: proficiencies.weapons,
      op: grant,
      value: { item: weapons.shortsword },
      when: self.startingClass,
    }
  - { target: proficiencies.saves, op: grant, value: { tag: save.dex }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.int }, when: self.startingClass }
grants:
  - { item: features.rogue.expertise, when: self.level >= 1 }
  - { item: features.rogue.sneak-attack, when: self.level >= 1 }
  - { item: features.rogue.thieves-cant, when: self.level >= 1 }
  - { item: features.rogue.cunning-action, when: self.level >= 2 }
  - { item: features.rogue.uncanny-dodge, when: self.level >= 5 }
  - { item: features.evasion, when: self.level >= 7 }
  - { item: features.rogue.reliable-talent, when: self.level >= 11 }
  - { item: features.rogue.blindsense, when: self.level >= 14 }
  - { item: features.rogue.slippery-mind, when: self.level >= 15 }
  - { item: features.rogue.elusive, when: self.level >= 18 }
  - { item: features.rogue.stroke-of-luck, when: self.level >= 20 }
  - { item: features.rogue.ability-score-improvement, when: self.level >= 4 }
choices:
  - id: skills
    pick: 4
    unique: skills
    from:
      {
        values:
          [
            skill.acrobatics,
            skill.athletics,
            skill.deception,
            skill.insight,
            skill.intimidation,
            skill.investigation,
            skill.perception,
            skill.performance,
            skill.persuasion,
            skill.sleight-of-hand,
            skill.stealth,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: multiclass-skill
    pick: 1
    unique: skills
    from:
      {
        values:
          [
            skill.acrobatics,
            skill.athletics,
            skill.deception,
            skill.insight,
            skill.intimidation,
            skill.investigation,
            skill.perception,
            skill.performance,
            skill.persuasion,
            skill.sleight-of-hand,
            skill.stealth,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: '!self.startingClass'
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: roguish-archetype
    from: { type: subclass, where: 'item.class == @classes.rogue' }
    when: self.level >= 3
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: rogueWeapon
        kind: choice
        options:
          - id: rapier
            changes:
              - { type: addItem, entry: { item: "'weapons.rapier'", equipped: true } }
          - id: shortsword
            changes:
              - { type: addItem, entry: { item: "'weapons.shortsword'", equipped: true } }
        recommend: options[0]
        random: params.random
      - id: rogueSecond
        kind: choice
        options:
          - id: shortbow
            changes:
              - { type: addItem, entry: { item: "'weapons.shortbow'", equipped: true } }
              - { type: addItem, entry: { item: "'gear.quiver'" } }
              - { type: addItem, entry: { item: "'gear.arrows'", quantity: 20 } }
          - id: shortsword
            changes:
              - { type: addItem, entry: { item: "'weapons.shortsword'", equipped: true } }
        recommend: options[0]
        random: params.random
      - id: roguePack
        kind: choice
        options:
          - id: burglars-pack
            changes: [{ type: addItem, entry: { item: "'gear.burglars-pack'" } }]
          - id: dungeoneers-pack
            changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
          - id: explorers-pack
            changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
        recommend: options[0]
        random: params.random
      - id: rogueKit
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
          - type: addItem
            entry: { item: "'weapons.dagger'", quantity: 2, equipped: true }
          - { type: addItem, entry: { item: "'tools.thieves-tools'" } }
