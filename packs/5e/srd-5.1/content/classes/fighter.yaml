id: classes.fighter
type: class
fields:
  hitDie: 1d10
  startingKit: true
state:
  secondWindUsed: { type: boolean, default: false }
  actionSurgeSpent: { type: integer, default: 0, min: 0 }
  indomitableSpent: { type: integer, default: 0, min: 0 }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - target: proficiencies.weapons
    op: grant
    value:
      { query: { type: weapon, where: "item.category == 'simple' || item.category == 'martial'" } }
  - { target: proficiencies.armor, op: grant, value: { tag: light } }
  - { target: proficiencies.armor, op: grant, value: { tag: medium } }
  - { target: proficiencies.armor, op: grant, value: { tag: shield } }
  - { target: proficiencies.armor, op: grant, value: { tag: heavy }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.str }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.con }, when: self.startingClass }
grants:
  - { item: features.fighter.second-wind, when: self.level >= 1 }
  - { item: features.fighter.action-surge, when: self.level >= 2 }
  - { item: features.extra-attack, when: self.level >= 5 }
  - { item: features.fighter.indomitable, when: self.level >= 9 }
  - { item: features.fighter.extra-attack-2, when: self.level >= 11 }
  - { item: features.fighter.extra-attack-3, when: self.level >= 20 }
  - { item: features.fighter.ability-score-improvement, when: self.level >= 4 }
choices:
  - id: fighting-style
    from: { type: fightingStyle }
    when: self.level >= 1
    unique: fighting-style
  - id: martial-archetype
    from: { type: subclass, where: 'item.class == @classes.fighter' }
    when: self.level >= 3
  - id: skills
    pick: 2
    unique: skills
    from:
      {
        values:
          [
            skill.acrobatics,
            skill.animal-handling,
            skill.athletics,
            skill.history,
            skill.insight,
            skill.intimidation,
            skill.perception,
            skill.survival,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: fighterArmor
        kind: choice
        options:
          - id: chain-mail
            changes:
              - { type: addItem, entry: { item: "'armor.chain-mail'", equipped: true } }
          - id: leather-longbow
            changes:
              - { type: addItem, entry: { item: "'armor.leather'", equipped: true } }
              - { type: addItem, entry: { item: "'weapons.longbow'", equipped: true } }
              - { type: addItem, entry: { item: "'gear.arrows'", quantity: 20 } }
        recommend: options[0]
        random: params.random
      - id: fighterWeapons
        kind: choice
        options:
          - id: martial-and-shield
            changes:
              - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }
          - id: two-martial
        recommend: options[0]
        random: params.random
      - id: fighterMartial
        kind: choice
        options: { content: { type: weapon, where: "item.category == 'martial'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: fighterMartial2
        kind: choice
        when: "steps.fighterWeapons.picked == 'two-martial'"
        options: { content: { type: weapon, where: "item.category == 'martial'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: fighterRanged
        kind: choice
        options:
          - id: light-crossbow
            changes:
              - type: addItem
                entry: { item: "'weapons.light-crossbow'", equipped: true }
              - { type: addItem, entry: { item: "'gear.crossbow-bolts'", quantity: 20 } }
          - id: two-handaxes
            changes:
              - type: addItem
                entry: { item: "'weapons.handaxe'", quantity: 2, equipped: true }
        recommend: options[0]
        random: params.random
      - id: fighterPack
        kind: choice
        options:
          - id: dungeoneers-pack
            changes: [{ type: addItem, entry: { item: "'gear.dungeoneers-pack'" } }]
          - id: explorers-pack
            changes: [{ type: addItem, entry: { item: "'gear.explorers-pack'" } }]
        recommend: options[0]
        random: params.random
