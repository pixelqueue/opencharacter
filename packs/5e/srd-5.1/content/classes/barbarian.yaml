id: classes.barbarian
type: class
fields:
  hitDie: 1d12
  startingKit: true
  abilityPriority:
    [
      abilities.str.score,
      abilities.con.score,
      abilities.dex.score,
      abilities.wis.score,
      abilities.cha.score,
      abilities.int.score,
    ]
  multiclassAll: [str]
state:
  rageSpent: { type: integer, default: 0, min: 0 }
  relentlessRageSpent: { type: integer, default: 0, min: 0 }
prerequisites:
  - id: multiclass
    when: (self.startingClass && self.level == level.total) || item.id in multiclass.qualified
effects:
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'simple'" } }
  - target: proficiencies.weapons
    op: grant
    value: { query: { type: weapon, where: "item.category == 'martial'" } }
  - { target: proficiencies.armor, op: grant, value: { tag: shield } }
  - { target: proficiencies.armor, op: grant, value: { tag: light }, when: self.startingClass }
  - { target: proficiencies.armor, op: grant, value: { tag: medium }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.str }, when: self.startingClass }
  - { target: proficiencies.saves, op: grant, value: { tag: save.con }, when: self.startingClass }
grants:
  - { item: features.unarmored-defense, when: self.level >= 1 }
  - { item: features.barbarian.rage, when: self.level >= 1 }
  - { item: features.barbarian.reckless-attack, when: self.level >= 2 }
  - { item: features.barbarian.danger-sense, when: self.level >= 2 }
  - { item: features.extra-attack, when: self.level >= 5 }
  - { item: features.barbarian.fast-movement, when: self.level >= 5 }
  - { item: features.barbarian.feral-instinct, when: self.level >= 7 }
  - { item: features.barbarian.brutal-critical, when: self.level >= 9 }
  - { item: features.barbarian.relentless-rage, when: self.level >= 11 }
  - { item: features.barbarian.persistent-rage, when: self.level >= 15 }
  - { item: features.barbarian.indomitable-might, when: self.level >= 18 }
  - { item: features.barbarian.primal-champion, when: self.level >= 20 }
  - { item: features.ability-score-improvement, when: self.level >= 4 }
choices:
  - id: skills
    pick: 2
    unique: skills
    from:
      {
        values:
          [
            skill.animal-handling,
            skill.athletics,
            skill.intimidation,
            skill.nature,
            skill.perception,
            skill.survival,
          ],
        where: '!(value in proficiencies.skills) || value in choice.picks',
      }
    when: self.startingClass
    effects:
      - { target: proficiencies.skills, op: grant, value: { formula: pick.value } }
  - id: primal-path
    from: { type: subclass, where: 'item.class == @classes.barbarian' }
    when: self.level >= 3
actions:
  - id: kit
    listed: false
    params:
      random: { type: boolean, default: false }
    steps:
      - id: barbarianWeapon
        kind: choice
        options:
          - id: greataxe
            changes:
              - { type: addItem, entry: { item: "'weapons.greataxe'", equipped: true } }
          - id: martial-melee
        recommend: options[0]
        random: params.random
      - id: barbarianMartial
        kind: choice
        when: "steps.barbarianWeapon.picked == 'martial-melee'"
        options:
          content: { type: weapon, where: "item.category == 'martial' && item.range == 'melee'" }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: barbarianSecond
        kind: choice
        options:
          - id: two-handaxes
            changes:
              - type: addItem
                entry: { item: "'weapons.handaxe'", quantity: 2, equipped: true }
          - id: simple
        recommend: options[0]
        random: params.random
      - id: barbarianSimple
        kind: choice
        when: "steps.barbarianSecond.picked == 'simple'"
        options: { content: { type: weapon, where: "item.category == 'simple'" } }
        random: params.random
        changes:
          - { type: addItem, entry: { item: picked.id, equipped: true } }
      - id: barbarianKit
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'gear.explorers-pack'" } }
          - type: addItem
            entry: { item: "'weapons.javelin'", quantity: 4, equipped: true }
