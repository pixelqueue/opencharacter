id: magic-items.ring-of-three-wishes
type: magicItem
fields:
  category: ring
  rarity: legendary
  maxCharges: 3
  spells: [spells.wish]
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.wish, when: self.equipped }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && action.item.id == @spells.wish && flags.slot == 9 &&
      self.charges >= 1
    value:
      id: charges
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
actions:
  - use: use-charges
