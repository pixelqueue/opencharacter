id: magic-items.mantle-of-spell-resistance
type: magicItem
fields:
  category: wondrous-item
  rarity: rare
  requiresAttunement: true
effects:
  - { target: items.spellSave, op: add, value: 1, when: self.equipped }
  - target: { rolls: [save] }
    op: rollModifier
    value: { kind: advantage }
    when: self.equipped && situational.spellSave != 'none'
