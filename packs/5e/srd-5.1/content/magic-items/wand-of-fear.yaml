id: magic-items.wand-of-fear
type: magicItem
fields:
  category: wand
  rarity: rare
  requiresAttunement: true
  maxCharges: 7
  recharge: 1d6 + 1
  spells: [spells.command]
  saveDc: 15
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.command, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && action.item.id == @spells.command && flags.slot == 1
      && self.charges >= 1
    value:
      id: charges
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
  - use: item-power
    params: { charges: 2, save: "'wis'", dc: 15, condition: "'conditions.frightened'" }
