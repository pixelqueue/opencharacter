id: magic-items.cloak-of-arachnida
type: magicItem
fields:
  category: wondrous-item
  rarity: very-rare
  requiresAttunement: true
  spells: [spells.web]
effects:
  - {
      target: combat.climbSpeed,
      op: atLeast,
      value: combat.speed,
      when: self.equipped && self.attuned,
    }
  - {
      target: { incoming: { fields: [hp.current], tags: [damage.poison] } },
      op: multiply,
      value: 0.5,
      when: self.equipped && self.attuned,
    }
