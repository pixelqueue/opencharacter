id: magic-items.armor-of-resistance
type: template
tags: [magic]
appliesTo: { type: armor, where: "item.category != 'shield'" }
fields: { rarity: rare, requiresAttunement: true }
effectsWhen: self.attuned
choices:
  - id: damage-type
    from:
      options:
        - id: acid
          effects:
            - {
                target: { incoming: { fields: [hp.current], tags: [damage.acid] } },
                op: multiply,
                value: 0.5,
                when: self.equipped,
              }
