id: magic-items.staff-of-charming
type: template
tags:
  [
    magic,
    staff,
    attunement.bard,
    attunement.cleric,
    attunement.druid,
    attunement.sorcerer,
    attunement.warlock,
    attunement.wizard,
  ]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields: { rarity: rare, requiresAttunement: true, maxCharges: 10, recharge: 1d8 + 2 }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.charm-person, when: self.equipped && self.attuned }
  - { item: spells.command, when: self.equipped && self.attuned }
  - { item: spells.comprehend-languages, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && ((action.item.id == @spells.charm-person &&
      flags.slot == 1 && self.charges >= 1) || (action.item.id == @spells.command &&
      flags.slot == 1 && self.charges >= 1) || (action.item.id ==
      @spells.comprehend-languages && flags.slot == 1 && self.charges >= 1))
    value:
      id: charges
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
