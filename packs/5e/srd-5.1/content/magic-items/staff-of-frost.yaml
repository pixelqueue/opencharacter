id: magic-items.staff-of-frost
type: template
tags: [magic, staff, attunement.druid, attunement.sorcerer, attunement.warlock, attunement.wizard]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields: { rarity: very-rare, requiresAttunement: true, maxCharges: 10, recharge: 1d6 + 4 }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.cone-of-cold, when: self.equipped && self.attuned }
  - { item: spells.fog-cloud, when: self.equipped && self.attuned }
  - { item: spells.ice-storm, when: self.equipped && self.attuned }
  - { item: spells.wall-of-ice, when: self.equipped && self.attuned }
effects:
  - {
      target: { incoming: { fields: [hp.current], tags: [damage.cold] } },
      op: multiply,
      value: 0.5,
      when: self.equipped && self.attuned,
    }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && ((action.item.id == @spells.cone-of-cold &&
      flags.slot == 5 && self.charges >= 5) || (action.item.id == @spells.fog-cloud &&
      flags.slot == 1 && self.charges >= 1) || (action.item.id == @spells.ice-storm &&
      flags.slot == 4 && self.charges >= 4) || (action.item.id == @spells.wall-of-ice
      && flags.slot == 6 && self.charges >= 4))
    value:
      id: charges
      changes:
        - {
            type: adjustState,
            entry: self,
            key: charges,
            by: '-(action.item.id == @spells.cone-of-cold ? 5 : action.item.id ==
              @spells.fog-cloud ? 1 : action.item.id == @spells.ice-storm
              ? 4 : 4)',
          }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
