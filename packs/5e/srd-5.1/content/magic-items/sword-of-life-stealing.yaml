id: magic-items.sword-of-life-stealing
type: template
tags: [magic]
appliesTo: { type: weapon, where: "'sword' in item.tags" }
fields: { rarity: rare, requiresAttunement: true }
effectsWhen: self.attuned
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 3d6
    tags: [damage.necrotic]
    when: >-
      has(flags.natural20) && flags.natural20
        && !(has(participants.target) && size(participants.target) > 0
        && has(participants.target[0].creature.type) && participants.target[0].creature.type in ['construct', 'undead'])
