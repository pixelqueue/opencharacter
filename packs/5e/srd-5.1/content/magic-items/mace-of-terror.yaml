id: magic-items.mace-of-terror
type: template
tags: [magic]
appliesTo: { type: weapon, where: 'item.id == @weapons.mace' }
fields: { rarity: rare, requiresAttunement: true, maxCharges: 3, recharge: 1d3 }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
  - use: item-power
    params: { charges: 1, save: "'wis'", dc: 15, condition: "'conditions.frightened'" }
