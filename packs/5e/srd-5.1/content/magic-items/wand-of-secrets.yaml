id: magic-items.wand-of-secrets
type: magicItem
fields:
  category: wand
  rarity: uncommon
  maxCharges: 3
  recharge: 1d3
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
