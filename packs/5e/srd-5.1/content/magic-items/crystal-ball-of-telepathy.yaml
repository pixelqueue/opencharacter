id: magic-items.crystal-ball-of-telepathy
type: magicItem
fields:
  category: wondrous-item
  rarity: legendary
  requiresAttunement: true
  spells: [spells.scrying, spells.suggestion]
  maxCharges: 1
  recharge: 1
  saveDc: 17
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.scrying, when: self.equipped && self.attuned }
  - { item: spells.suggestion, when: self.equipped && self.attuned }
effects:
  - {
      target: spells.atWill,
      op: grant,
      value: { item: spells.scrying },
      when: self.equipped && self.attuned,
    }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && action.item.id == @spells.suggestion && flags.slot
      == 2 && self.charges >= 1
    value:
      id: charges
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
actions:
  - { use: use-charges }
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
