id: magic-items.frost-brand
type: template
tags: [magic]
appliesTo: { type: weapon, where: "'sword' in item.tags" }
fields: { rarity: very-rare, requiresAttunement: true }
effectsWhen: self.attuned
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 1d6
    tags: [damage.cold]
  - {
      target: { incoming: { fields: [hp.current], tags: [damage.fire] } },
      op: multiply,
      value: 0.5,
      when: self.equipped,
    }
