id: magic-items.circlet-of-blasting
type: magicItem
fields:
  category: wondrous-item
  rarity: uncommon
  maxCharges: 1
  recharge: 1
  spells: [spells.scorching-ray]
  spellAttackBonus: 5
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.scorching-ray, when: self.equipped }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && action.item.id == @spells.scorching-ray &&
      flags.slot == 2 && self.charges >= 1
    value:
      id: charges
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
