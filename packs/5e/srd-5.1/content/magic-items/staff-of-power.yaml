id: magic-items.staff-of-power
type: template
tags: [magic, staff]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields:
  {
    attunementClasses: [classes.sorcerer, classes.warlock, classes.wizard],
    rarity: very-rare,
    requiresAttunement: true,
    maxCharges: 20,
    recharge: 2d8 + 4,
    attackBonus: 2,
    damageBonus: 2,
  }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.cone-of-cold, when: self.equipped && self.attuned }
  - { item: spells.fireball, when: self.equipped && self.attuned }
  - { item: spells.globe-of-invulnerability, when: self.equipped && self.attuned }
  - { item: spells.hold-monster, when: self.equipped && self.attuned }
  - { item: spells.levitate, when: self.equipped && self.attuned }
  - { item: spells.lightning-bolt, when: self.equipped && self.attuned }
  - { item: spells.magic-missile, when: self.equipped && self.attuned }
  - { item: spells.ray-of-enfeeblement, when: self.equipped && self.attuned }
  - { item: spells.wall-of-force, when: self.equipped && self.attuned }
effects:
  - { target: combat.ac, op: add, value: 2, when: self.equipped && self.attuned }
  - { target: { rolls: [save] }, op: add, value: 2, when: self.equipped && self.attuned }
  - target: { fields: { where: "'save' in item.tags" } }
    op: add
    value: 2
    when: self.equipped && self.attuned
  - { target: { rolls: [attack.spell] }, op: add, value: 2, when: self.equipped && self.attuned }
  - {
      target: combat.hitOptions,
      op: add,
      value: 1,
      when: self.equipped && self.attuned && self.charges > 0,
    }
  - target: { choices: [weapon-hit] }
    op: option
    when: action.self.id == self.id && self.attuned && self.charges >= 1
    value:
      id: power-strike
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
  - target: { rolls: [damage.weapon], from: self }
    op: add
    value: 1d6
    tags: [damage.force]
    when: has(steps.onHit) && steps.onHit.picked == '5e-srd-5.1:magic-items.staff-of-power#power-strike'
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && (
        (action.item.id == @spells.cone-of-cold && self.charges >= 5) ||
        (action.item.id == @spells.fireball && self.charges >= 5) ||
        (action.item.id == @spells.globe-of-invulnerability && self.charges >= 6) ||
        (action.item.id == @spells.hold-monster && self.charges >= 5) ||
        (action.item.id == @spells.levitate && self.charges >= 2) ||
        (action.item.id == @spells.lightning-bolt && self.charges >= 5) ||
        (action.item.id == @spells.magic-missile && self.charges >= 1) ||
        (action.item.id == @spells.ray-of-enfeeblement && self.charges >= 1) ||
        (action.item.id == @spells.wall-of-force && self.charges >= 5)
      )
    value:
      id: charges
      flags:
        slot: >-
          action.item.id == @spells.cone-of-cold ? 5
            : action.item.id == @spells.fireball ? 5
            : action.item.id == @spells.globe-of-invulnerability ? 6
            : action.item.id == @spells.hold-monster ? 5
            : action.item.id == @spells.levitate ? 2
            : action.item.id == @spells.lightning-bolt ? 5
            : action.item.id == @spells.magic-missile ? 1
            : action.item.id == @spells.ray-of-enfeeblement ? 2
            : action.item.id == @spells.wall-of-force ? 5
            : flags.slot
      changes:
        - {
            type: adjustState,
            entry: self,
            key: charges,
            by: '-(action.item.id == @spells.cone-of-cold ? 5 : action.item.id ==
              @spells.fireball ? 5 : action.item.id ==
              @spells.globe-of-invulnerability ? 6 : action.item.id ==
              @spells.hold-monster ? 5 : action.item.id ==
              @spells.levitate ? 2 : action.item.id ==
              @spells.lightning-bolt ? 5 : action.item.id ==
              @spells.magic-missile ? 1 : action.item.id ==
              @spells.ray-of-enfeeblement ? 1 : 5)',
          }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
