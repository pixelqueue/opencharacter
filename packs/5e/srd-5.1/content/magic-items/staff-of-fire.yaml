id: magic-items.staff-of-fire
type: template
tags: [magic, staff, attunement.druid, attunement.sorcerer, attunement.warlock, attunement.wizard]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields: { rarity: very-rare, requiresAttunement: true, maxCharges: 10, recharge: 1d6 + 4 }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.burning-hands, when: self.equipped && self.attuned }
  - { item: spells.fireball, when: self.equipped && self.attuned }
  - { item: spells.wall-of-fire, when: self.equipped && self.attuned }
effects:
  - {
      target: { incoming: { fields: [hp.current], tags: [damage.fire] } },
      op: multiply,
      value: 0.5,
      when: self.equipped && self.attuned,
    }
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && ((action.item.id == @spells.burning-hands &&
      flags.slot == 1 && self.charges >= 1) || (action.item.id == @spells.fireball &&
      flags.slot == 3 && self.charges >= 3) || (action.item.id == @spells.wall-of-fire
      && flags.slot == 4 && self.charges >= 4))
    value:
      id: charges
      changes:
        - {
            type: adjustState,
            entry: self,
            key: charges,
            by: '-(action.item.id == @spells.burning-hands ? 1 : action.item.id ==
              @spells.fireball ? 3 : 4)',
          }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
