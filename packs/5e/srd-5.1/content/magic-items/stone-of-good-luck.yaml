id: magic-items.stone-of-good-luck
type: magicItem
fields:
  category: wondrous-item
  rarity: uncommon
  requiresAttunement: true
effects:
  - { target: { rolls: [check] }, op: add, value: 1, when: self.equipped && self.attuned }
  - target: { fields: { where: "'skill' in item.tags" } }
    op: add
    value: 1
    when: self.equipped && self.attuned
  - { target: combat.initiative, op: add, value: 1, when: self.equipped && self.attuned }
  - { target: { rolls: [save] }, op: add, value: 1, when: self.equipped && self.attuned }
  - target: { fields: { where: "'save' in item.tags" } }
    op: add
    value: 1
    when: self.equipped && self.attuned
