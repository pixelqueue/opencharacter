id: magic-items.arrow-of-slaying
type: template
tags: [magic]
appliesTo: { type: gear, where: "item.category == 'ammunition'" }
fields: { rarity: very-rare }
# One template covers every creature type, so the type is the copy's state, not a field.
state:
  slays:
    type: enum
    open: true
    values:
      [
        aberration,
        beast,
        celestial,
        construct,
        dragon,
        elemental,
        fey,
        fiend,
        giant,
        humanoid,
        monstrosity,
        ooze,
        plant,
        undead,
      ]
