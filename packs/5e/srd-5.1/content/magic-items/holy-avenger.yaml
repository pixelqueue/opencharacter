id: magic-items.holy-avenger
type: template
tags: [magic, attunement.paladin]
appliesTo: { type: weapon, where: "'sword' in item.tags" }
fields: { rarity: legendary, requiresAttunement: true, attackBonus: 3, damageBonus: 3 }
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 2d10
    tags: [damage.radiant]
    when: "self.attuned && has(participants.target) && size(participants.target) > 0
      && has(participants.target[0].creature.type) && participants.target[0].creature.type in ['fiend', 'undead']"
