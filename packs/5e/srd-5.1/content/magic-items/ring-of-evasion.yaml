id: magic-items.ring-of-evasion
type: magicItem
fields:
  category: ring
  rarity: rare
  requiresAttunement: true
  maxCharges: 3
  recharge: 1d3
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
actions:
  - id: evade
    tags: [save]
    available: self.equipped && self.attuned && self.charges > 0
    results: [success]
    steps:
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: charges, by: -1 }
      - id: result
        kind: outcome
        result: "'success'"
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
