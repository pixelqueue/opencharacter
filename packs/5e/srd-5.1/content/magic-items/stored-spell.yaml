id: magic-items.stored-spell
type: storedSpell
choices:
  - id: spell
    from: { type: spell, where: item.level >= 1 }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id
        && countCopies(copy.id == self.storedIn && copy.equipped
          && has(copy.state.attuned) && copy.state.attuned) > 0
    value:
      id: release
      changes:
        - { type: removeItem, entry: self }
