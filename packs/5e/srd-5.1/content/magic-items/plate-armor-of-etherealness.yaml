id: magic-items.plate-armor-of-etherealness
type: template
tags: [magic]
appliesTo: { type: armor, where: 'item.id == @armor.plate' }
fields: { rarity: legendary, requiresAttunement: true, maxCharges: 1, recharge: 1 }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.etherealness, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && action.item.id == @spells.etherealness && flags.slot
      == 7 && self.charges >= 1
    value:
      id: charges
      changes:
        - { type: adjustState, entry: self, key: charges, by: -1 }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
