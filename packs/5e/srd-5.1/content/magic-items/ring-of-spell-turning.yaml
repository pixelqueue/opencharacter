id: magic-items.ring-of-spell-turning
type: magicItem
fields:
  category: ring
  rarity: legendary
  requiresAttunement: true
effects:
  - { target: items.spellSave, op: add, value: 1, when: self.equipped && self.attuned }
  - target: { rolls: [save] }
    op: rollModifier
    value: { kind: advantage }
    when: self.equipped && self.attuned && situational.spellSave == 'only-you'
