id: magic-items.wand-of-fireballs
type: magicItem
tags: [attunement.spellcaster]
fields:
  category: wand
  rarity: rare
  requiresAttunement: true
  maxCharges: 7
  recharge: 1d6 + 1
  saveDc: 15
  spells: [spells.fireball]
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.fireball, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: action.self.id == self.id && flags.slot >= 3 && self.charges >= flags.slot - 2
    value:
      id: charges
      changes:
        - { type: adjustState, entry: self, key: charges, by: -(flags.slot - 2) }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
