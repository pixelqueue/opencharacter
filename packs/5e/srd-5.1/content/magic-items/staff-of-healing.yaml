id: magic-items.staff-of-healing
type: template
tags: [magic, staff]
appliesTo: { type: weapon, where: 'item.id == @weapons.quarterstaff' }
fields:
  {
    attunementClasses: [classes.bard, classes.cleric, classes.druid],
    rarity: rare,
    requiresAttunement: true,
    maxCharges: 10,
    recharge: 1d6 + 4,
  }
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.cure-wounds, when: self.equipped && self.attuned }
  - { item: spells.lesser-restoration, when: self.equipped && self.attuned }
  - { item: spells.mass-cure-wounds, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && ((action.item.id == @spells.cure-wounds &&
      flags.slot >= 1 && flags.slot <= 4 && self.charges >= flags.slot) || (action.item.id ==
      @spells.lesser-restoration && flags.slot == 2 && self.charges >= 2) ||
      (action.item.id == @spells.mass-cure-wounds && flags.slot == 5 && self.charges >=
      5))
    value:
      id: charges
      changes:
        - {
            type: adjustState,
            entry: self,
            key: charges,
            by: '-(action.item.id == @spells.cure-wounds ? flags.slot : action.item.id ==
              @spells.lesser-restoration ? 2 : 5)',
          }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
