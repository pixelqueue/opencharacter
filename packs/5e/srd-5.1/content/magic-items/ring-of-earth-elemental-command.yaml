id: magic-items.ring-of-earth-elemental-command
type: magicItem
fields:
  category: ring
  rarity: legendary
  requiresAttunement: true
  maxCharges: 5
  recharge: 1d4 + 1
  saveDc: 17
  spells: [spells.dominate-monster, spells.stone-shape, spells.stoneskin, spells.wall-of-stone]
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
  elementalSlain: { type: boolean, default: false }
grants:
  - { item: spells.dominate-monster, when: self.equipped && self.attuned }
  - { item: spells.stone-shape, when: self.equipped && self.attuned }
  - { item: spells.stoneskin, when: self.equipped && self.attuned }
  - { item: spells.wall-of-stone, when: self.equipped && self.attuned }
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.acid] } }
    op: multiply
    value: 0.5
    when: self.equipped && self.attuned && self.elementalSlain
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && ((action.item.id == @spells.dominate-monster &&
      flags.slot == 8 && self.charges >= 2) || (action.item.id == @spells.stone-shape
      && flags.slot == 4 && self.charges >= 2 && self.elementalSlain) || (action.item.id ==
      @spells.stoneskin && flags.slot == 4 && self.charges >= 3 && self.elementalSlain)
      || (action.item.id == @spells.wall-of-stone && flags.slot == 5 && self.charges >=
      3 && self.elementalSlain))
    value:
      id: charges
      changes:
        - {
            type: adjustState,
            entry: self,
            key: charges,
            by: '-(action.item.id == @spells.dominate-monster ? 2 : action.item.id ==
              @spells.stone-shape ? 2 : action.item.id ==
              @spells.stoneskin ? 3 : 3)',
          }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
