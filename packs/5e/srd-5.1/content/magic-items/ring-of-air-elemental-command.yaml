id: magic-items.ring-of-air-elemental-command
type: magicItem
fields:
  category: ring
  rarity: legendary
  requiresAttunement: true
  maxCharges: 5
  recharge: 1d4 + 1
  saveDc: 17
  spells: [spells.dominate-monster, spells.chain-lightning, spells.gust-of-wind, spells.wind-wall]
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
  elementalSlain: { type: boolean, default: false }
grants:
  - { item: spells.dominate-monster, when: self.equipped && self.attuned }
  - { item: spells.chain-lightning, when: self.equipped && self.attuned }
  - { item: spells.gust-of-wind, when: self.equipped && self.attuned }
  - { item: spells.wind-wall, when: self.equipped && self.attuned }
effects:
  - target: { incoming: { fields: [hp.current], tags: [damage.lightning] } }
    op: multiply
    value: 0.5
    when: self.equipped && self.attuned && self.elementalSlain
  - target: combat.flySpeed
    op: atLeast
    value: combat.speed
    when: self.equipped && self.attuned && self.elementalSlain
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && ((action.item.id == @spells.dominate-monster &&
      flags.slot == 8 && self.charges >= 2) || (action.item.id ==
      @spells.chain-lightning && flags.slot == 6 && self.charges >= 3 &&
      self.elementalSlain) || (action.item.id == @spells.gust-of-wind && flags.slot ==
      2 && self.charges >= 2 && self.elementalSlain) || (action.item.id ==
      @spells.wind-wall && flags.slot == 3 && self.charges >= 1 &&
      self.elementalSlain))
    value:
      id: charges
      changes:
        - {
            type: adjustState,
            entry: self,
            key: charges,
            by: '-(action.item.id == @spells.dominate-monster ? 2 : action.item.id ==
              @spells.chain-lightning ? 3 : action.item.id ==
              @spells.gust-of-wind ? 2 : 1)',
          }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
