id: magic-items.wand-of-binding
type: magicItem
tags: [attunement.spellcaster]
fields:
  category: wand
  rarity: rare
  requiresAttunement: true
  maxCharges: 7
  recharge: 1d6 + 1
  spells: [spells.hold-monster, spells.hold-person]
  saveDc: 17
state:
  charges: { type: integer, min: 0, max: item.maxCharges, default: item.maxCharges }
grants:
  - { item: spells.hold-monster, when: self.equipped && self.attuned }
  - { item: spells.hold-person, when: self.equipped && self.attuned }
effects:
  - target: { choices: [spell-cost] }
    op: option
    when: >-
      action.self.id == self.id && ((action.item.id == @spells.hold-monster &&
      flags.slot == 5 && self.charges >= 5) || (action.item.id == @spells.hold-person
      && flags.slot == 2 && self.charges >= 2))
    value:
      id: charges
      changes:
        - {
            type: adjustState,
            entry: self,
            key: charges,
            by: '-(action.item.id == @spells.hold-monster ? 5 : 2)',
          }
actions:
  - use: use-charges
  - use: regain-charges
    params: { max: item.maxCharges, dice: item.recharge }
