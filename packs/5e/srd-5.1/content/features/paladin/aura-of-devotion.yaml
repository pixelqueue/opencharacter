id: features.paladin.aura-of-devotion
type: feature
immuneTo:
  - id: charmed
    items: [conditions.charmed]
    when: &conscious >-
      countList(character.applied,
        x.active && x.source == @conditions.unconscious) == 0
  # For `ally` entries saved before the aura: they keep the immunity.
  - { id: ally-charmed, items: [conditions.charmed], scope: applied }
# Friendly creatures within the paladin's aura while it is conscious.
auras:
  - id: devotion
    when: *conscious
    size: aura.range
    affects: allies
    immuneTo:
      - { id: charmed, items: [conditions.charmed] }
