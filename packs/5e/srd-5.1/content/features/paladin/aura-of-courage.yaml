id: features.paladin.aura-of-courage
type: feature
immuneTo:
  - id: frightened
    items: [conditions.frightened]
    when: &conscious >-
      countList(character.applied,
        x.active && x.source == @conditions.unconscious) == 0
  # For `ally` entries saved before the aura: they keep the immunity.
  - { id: ally-frightened, items: [conditions.frightened], scope: applied }
# Friendly creatures within the paladin's aura while it is conscious.
auras:
  - id: courage
    when: *conscious
    size: aura.range
    affects: allies
    immuneTo:
      - { id: frightened, items: [conditions.frightened] }
