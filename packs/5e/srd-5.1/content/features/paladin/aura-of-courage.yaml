id: features.paladin.aura-of-courage
type: feature
immuneTo:
  - id: frightened
    items: [conditions.frightened]
    when: >-
      countList(character.applied,
        x.active && x.source == @conditions.unconscious) == 0
  - { id: ally-frightened, items: [conditions.frightened], scope: applied }
actions:
  - id: aura-of-courage
    tags: [feature]
    results: [extended]
    participants:
      ally: {}
    steps:
      - id: extend
        kind: changes
        to: ally
        changes:
          - { type: applyEffect, source: item.id }
      - id: result
        kind: outcome
        result: "'extended'"
