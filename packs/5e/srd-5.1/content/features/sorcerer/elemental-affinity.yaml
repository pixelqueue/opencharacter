id: features.sorcerer.elemental-affinity
type: feature
effects:
  - target: { rolls: [damage.spell] }
    op: add
    value: abilities.cha.mod
    tags:
      - formula: >-
          mapList(picksOf('features.sorcerer.dragon-ancestor', 'dragon'),
            'damage.' + itemField(x, 'damageType'))
    when: >-
      has(roll.item.damageType)
        && roll.item.damageType in mapList(picksOf('features.sorcerer.dragon-ancestor', 'dragon'),
          itemField(x, 'damageType'))
  - target: { incoming: { fields: [hp.current], tags: [damage.acid] } }
    op: multiply
    value: 0.5
    when: >-
      elementalAffinity.resistant
        && 'acid' in mapList(picksOf('features.sorcerer.dragon-ancestor', 'dragon'),
          itemField(x, 'damageType'))
  - target: { incoming: { fields: [hp.current], tags: [damage.cold] } }
    op: multiply
    value: 0.5
    when: >-
      elementalAffinity.resistant
        && 'cold' in mapList(picksOf('features.sorcerer.dragon-ancestor', 'dragon'),
          itemField(x, 'damageType'))
  - target: { incoming: { fields: [hp.current], tags: [damage.fire] } }
    op: multiply
    value: 0.5
    when: >-
      elementalAffinity.resistant
        && 'fire' in mapList(picksOf('features.sorcerer.dragon-ancestor', 'dragon'),
          itemField(x, 'damageType'))
  - target: { incoming: { fields: [hp.current], tags: [damage.lightning] } }
    op: multiply
    value: 0.5
    when: >-
      elementalAffinity.resistant
        && 'lightning' in mapList(picksOf('features.sorcerer.dragon-ancestor', 'dragon'),
          itemField(x, 'damageType'))
  - target: { incoming: { fields: [hp.current], tags: [damage.poison] } }
    op: multiply
    value: 0.5
    when: >-
      elementalAffinity.resistant
        && 'poison' in mapList(picksOf('features.sorcerer.dragon-ancestor', 'dragon'),
          itemField(x, 'damageType'))
actions:
  - id: elemental-resistance
    tags: [feature]
    results: [resistant]
    available: >-
      size(picksOf('features.sorcerer.dragon-ancestor', 'dragon')) > 0 && !elementalAffinity.resistant
        && self.sorceryPointsSpent < sorcery.points
    steps:
      - id: spend
        kind: changes
        changes:
          - { type: adjustState, entry: self, key: sorceryPointsSpent, by: 1 }
          - { type: set, field: elementalAffinity.resistant, value: true }
      - id: result
        kind: outcome
        result: "'resistant'"
        data:
          hours: 1
