id: features.barbarian.brutal-critical
type: feature
# The extra dice are a field set from the class level, since a roll effect's `self` is the weapon's
# copy. The critical hit doesn't double them.
effects:
  - id: dice
    target: brutalCritical.dice
    op: set
    value: 'self.level >= 17 ? 3 : self.level >= 13 ? 2 : 1'
  - id: damage
    target: { rolls: [damage.weapon] }
    op: add
    value: >-
      dieOf(roll.self.wielding == 'two-handed' && has(roll.item.versatileDamage)
        ? roll.item.versatileDamage : roll.item.damage, brutalCritical.dice)
    tags: [{ formula: "'damage.' + roll.item.damageType" }]
    multiplied: false
    when: has(flags.critical) && flags.critical && has(roll.item) && roll.item.range == 'melee'
