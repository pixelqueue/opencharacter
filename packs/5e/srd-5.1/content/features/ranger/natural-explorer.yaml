id: features.ranger.natural-explorer
type: feature
choices:
  - id: terrains
    pick: 'self.level >= 10 ? 3 : self.level >= 6 ? 2 : 1'
    from:
      options:
        - { id: arctic }
        - { id: coast }
        - { id: desert }
        - { id: forest }
        - { id: grassland }
        - { id: mountain }
        - { id: swamp }
        - { id: underdark }
