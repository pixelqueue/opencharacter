id: features.wizard.spell-mastery
type: feature
choices:
  - id: level
    recommend: >-
      (filterList([@spells.magic-missile, @spells.shield, @spells.misty-step, @spells.invisibility],
        x in options) + options)[0]
    slots: [1, 2]
    pick: 1
    from: { type: spell, where: 'item.level == slot && item.id in spells.wizardBook' }
    effects:
      - { target: spells.wizard, op: grant, value: { formula: pick.id } }
