id: features.monk.deflect-missiles
type: feature
actions:
  - id: deflect-missiles
    tags: [feature]
    results: [deflected]
    params:
      damage: { type: integer, min: 0 }
    steps:
      - id: reduce
        kind: roll
        parts:
          - dice: 1d10
          - field: "'abilities.dex.mod'"
          - value: self.level
      - id: result
        kind: outcome
        result: "'deflected'"
        data:
          reduced: steps.reduce.total
          remaining: max(0, params.damage - steps.reduce.total)
          caught: params.damage <= steps.reduce.total
