id: features.warlock.dark-ones-own-luck
type: feature
effects:
  - { target: checks.addDie, op: set, value: true, when: '!self.darkOnesOwnLuckUsed' }
  - target: { choices: [failed-check, failed-save] }
    op: option
    when: '!self.darkOnesOwnLuckUsed'
    value:
      id: luck
      flags: { luckDie: 1d10 }
      changes:
        - { type: setState, entry: self, key: darkOnesOwnLuckUsed, value: true }
