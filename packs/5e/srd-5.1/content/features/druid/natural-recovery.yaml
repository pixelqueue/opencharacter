id: features.druid.natural-recovery
type: feature
actions:
  - id: natural-recovery
    tags: [feature]
    results: [recovered]
    available: >-
      !self.naturalRecoveryUsed
        && spellSlots.level1.used + spellSlots.level2.used + spellSlots.level3.used
          + spellSlots.level4.used + spellSlots.level5.used > 0
    steps:
      # One spent slot per pick, of 5th level or lower, while the levels fit under half the
      # druid level.
      - id: slots
        kind: choice
        options:
          values: [1, 2, 3, 4, 5]
          where: >-
            picks < fieldOf('spellSlots.level{slot}.used', value)
              && value + sumList(steps.slots.picked, indexOf(['1', '2', '3', '4', '5'], x) + 1)
                <= ceil(self.level / 2)
        repeat: { max: ceil(self.level / 2), min: 1 }
        prefer: value
        changes:
          - type: adjust
            field: { formula: "'spellSlots.level' + string(picked.value) + '.used'" }
            by: -1
      - id: recover
        kind: changes
        changes:
          - { type: setState, entry: self, key: naturalRecoveryUsed, value: true }
      - id: result
        kind: outcome
        result: "'recovered'"
        data:
          levels: sumList(steps.slots.picked, indexOf(['1', '2', '3', '4', '5'], x) + 1)
