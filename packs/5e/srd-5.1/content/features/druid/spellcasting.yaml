id: features.druid.spellcasting
type: feature
effects:
  - { target: spellcasting.druid.mod, op: set, value: abilities.wis.mod }
  - { target: spellcasting.druid.dc, op: set, value: 8 + proficiency.bonus + abilities.wis.mod }
  - { target: spellcasting.druid.attack, op: set, value: proficiency.bonus + abilities.wis.mod }
  - { target: spellcasting.classes, op: add, value: 1 }
  - { target: spellcasting.casterLevel, op: add, value: self.level }
choices:
  - id: cantrips
    pick: 'self.level >= 10 ? 4 : self.level >= 4 ? 3 : 2'
    from: { type: spell, where: 'item.level == 0 && @classes.druid in item.classes' }
    effects:
      - { target: spells.druid, op: grant, value: { formula: pick.id } }
  - id: spells
    pick: 'max(1, abilities.wis.mod + self.level)'
    from:
      {
        type: spell,
        where: 'item.level >= 1 && item.level <= min(9, ceil(self.level / 2)) && @classes.druid in item.classes',
      }
    effects:
      - { target: spells.druid, op: grant, value: { formula: pick.id } }
