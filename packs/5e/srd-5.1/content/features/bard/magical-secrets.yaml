id: features.bard.magical-secrets
type: feature
choices:
  - id: secrets
    slots: [10, 14, 18]
    pick: 2
    from: { type: spell, where: 'item.level <= min(9, ceil(self.level / 2))' }
    when: self.level >= slot
    effects:
      - { target: spells.bard, op: grant, value: { formula: pick.id } }
