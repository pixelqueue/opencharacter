id: features.bard.additional-magical-secrets
type: feature
choices:
  - id: secrets
    recommend: "sortList(options, -itemField(x, 'level'))[0]"
    pick: 2
    from: { type: spell, where: 'item.level <= min(9, ceil(self.level / 2))' }
    effects:
      - { target: spells.bard, op: grant, value: { formula: pick.id } }
