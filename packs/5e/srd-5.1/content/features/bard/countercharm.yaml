id: features.bard.countercharm
type: feature
effects:
  - { target: items.charmSave, op: add, value: 1, scope: applied, stackKey: source }
  - { target: items.frightSave, op: add, value: 1, scope: applied, stackKey: source }
  - target: { rolls: [save] }
    op: rollModifier
    value: { kind: advantage }
    when: situational.charmSave || situational.frightSave
    scope: applied
# While the bard performs (its own entry), friendly creatures within 30 feet who can hear it; ending
# the performance drops the aura, so the app removes its entries.
auras:
  - id: performance
    when: >-
      countList(character.applied, x.active && x.source == @features.bard.countercharm
        && (x.appliedBy == '' || x.appliedBy == character.id)) > 0
    size: 30
    affects: allies
    effects:
      - { target: items.charmSave, op: add, value: 1, scope: applied, stackKey: source }
      - { target: items.frightSave, op: add, value: 1, scope: applied, stackKey: source }
      - target: { rolls: [save] }
        op: rollModifier
        value: { kind: advantage }
        when: situational.charmSave || situational.frightSave
        scope: applied
actions:
  - id: countercharm
    tags: [feature]
    results: [performing]
    available: >-
      countList(character.applied, x.source == @features.bard.countercharm
        && (x.appliedBy == '' || x.appliedBy == character.id)) == 0
    participants:
      ally: {}
    steps:
      - id: perform
        kind: changes
        changes:
          - { type: applyEffect, source: item.id }
      - id: allies
        kind: changes
        to: ally
        changes:
          - { type: applyEffect, source: item.id }
      - id: result
        kind: outcome
        result: "'performing'"
  - id: end-countercharm
    tags: [feature]
    results: [ended]
    available: >-
      countList(character.applied, x.source == @features.bard.countercharm
        && (x.appliedBy == '' || x.appliedBy == character.id)) > 0
    steps:
      - id: end
        kind: changes
        changes:
          - type: removeEffect
            applied: { where: 'item.id == @features.bard.countercharm' }
      - id: result
        kind: outcome
        result: "'ended'"
