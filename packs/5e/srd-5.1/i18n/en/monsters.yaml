monsters.killer-whale.echolocation.name: 'Echolocation'
monsters.killer-whale.echolocation.description: "The whale can't use its blindsight while deafened."
monsters.killer-whale.hold-breath.name: 'Hold Breath'
monsters.killer-whale.hold-breath.description: 'The whale can hold its breath for 30 minutes.'
monsters.killer-whale.keen-hearing.name: 'Keen Hearing'
monsters.killer-whale.keen-hearing.description: 'The whale has advantage on Wisdom (Perception) checks that rely on hearing.'
monsters.killer-whale.bite.name: 'Bite'
monsters.killer-whale.bite.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 21 (5d6 + 4) piercing damage.'
monsters.knight.name: 'Knight'
monsters.knight.brave.name: 'Brave'
monsters.knight.brave.description: 'The knight has advantage on saving throws against being frightened.'
monsters.knight.multiattack.name: 'Multiattack'
monsters.knight.multiattack.description: 'The knight makes two melee attacks.'
monsters.knight.multiattack.actions.multiattack.name: 'Multiattack'
monsters.knight.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.knight.greatsword.name: 'Greatsword'
monsters.knight.greatsword.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 10 (2d6 + 3) slashing damage.'
monsters.knight.heavy-crossbow.name: 'Heavy Crossbow'
monsters.knight.heavy-crossbow.description: '*Ranged Weapon Attack:* +2 to hit, range 100/400 ft., one target. *Hit:* 5 (1d10) piercing damage.'
monsters.knight.leadership.name: 'Leadership (Recharges after a Short or Long Rest)'
monsters.knight.leadership.description: 'For 1 minute, the knight can utter a special command or warning whenever a nonhostile creature that it can see within 30 feet of it makes an attack roll or a saving throw. The creature can add a d4 to its roll provided it can hear and understand the knight. A creature can benefit from only one Leadership die at a time. This effect ends if the knight is incapacitated.'
monsters.knight.parry.name: 'Parry'
monsters.knight.parry.description: 'The knight adds 2 to its AC against one melee attack that would hit it. To do so, the knight must see the attacker and be wielding a melee weapon.'
monsters.kobold.name: 'Kobold'
monsters.kobold.sunlight-sensitivity.name: 'Sunlight Sensitivity'
monsters.kobold.sunlight-sensitivity.description: 'While in sunlight, the kobold has disadvantage on attack rolls, as well as on Wisdom (Perception) checks that rely on sight.'
monsters.kobold.pack-tactics.name: 'Pack Tactics'
monsters.kobold.pack-tactics.description: "The kobold has advantage on an attack roll against a creature if at least one of the kobold's allies is within 5 feet of the creature and the ally isn't incapacitated."
monsters.kobold.dagger.name: 'Dagger'
monsters.kobold.dagger.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 4 (1d4 + 2) piercing damage.'
monsters.kobold.sling.name: 'Sling'
monsters.kobold.sling.description: '*Ranged Weapon Attack:* +4 to hit, range 30/120 ft., one target. *Hit:* 4 (1d4 + 2) bludgeoning damage.'
monsters.kraken.name: 'Kraken'
monsters.kraken.amphibious.name: 'Amphibious'
monsters.kraken.amphibious.description: 'The kraken can breathe air and water.'
monsters.kraken.freedom-of-movement.name: 'Freedom of Movement'
monsters.kraken.freedom-of-movement.description: "The kraken ignores difficult terrain, and magical effects can't reduce its speed or cause it to be restrained. It can spend 5 feet of movement to escape from nonmagical restraints or being grappled."
monsters.kraken.siege-monster.name: 'Siege Monster'
monsters.kraken.siege-monster.description: 'The kraken deals double damage to objects and structures.'
monsters.kraken.multiattack.name: 'Multiattack'
monsters.kraken.multiattack.description: 'The kraken makes three tentacle attacks, each of which it can replace with one use of Fling.'
monsters.kraken.multiattack.actions.multiattack.name: 'Multiattack'
monsters.kraken.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.kraken.bite.name: 'Bite'
monsters.kraken.bite.description: |-
  *Melee Weapon Attack:* +17 to hit, reach 5 ft., one target. *Hit:* 23 (3d8 + 10) piercing damage. If the target is a Large or smaller creature grappled by the kraken, that creature is swallowed, and the grapple ends. While swallowed, the creature is blinded and restrained, it has total cover against attacks and other effects outside the kraken, and it takes 42 (12d6) acid damage at the start of each of the kraken's turns.

  If the kraken takes 50 damage or more on a single turn from a creature inside it, the kraken must succeed on a DC 25 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall prone in a space within 10 feet of the kraken. If the kraken dies, a swallowed creature is no longer restrained by it and can escape from the corpse using 15 feet of movement, exiting prone.
monsters.kraken.tentacle.name: 'Tentacle'
monsters.kraken.tentacle.description: '*Melee Weapon Attack:* +17 to hit, reach 30 ft., one target. *Hit:* 20 (3d6 + 10) bludgeoning damage, and the target is grappled (escape DC 18). Until this grapple ends, the target is restrained. The kraken has ten tentacles, each of which can grapple one target.'
monsters.kraken.fling.name: 'Fling'
monsters.kraken.fling.description: 'One Large or smaller object held or creature grappled by the kraken is thrown up to 60 feet in a random direction and knocked prone. If a thrown target strikes a solid surface, the target takes 3 (1d6) bludgeoning damage for every 10 feet it was thrown. If the target is thrown at another creature, that creature must succeed on a DC 18 Dexterity saving throw or take the same damage and be knocked prone.'
monsters.kraken.lightning-storm.name: 'Lightning Storm'
monsters.kraken.lightning-storm.description: 'The kraken magically creates three bolts of lightning, each of which can strike a target the kraken can see within 120 feet of it. A target must make a DC 23 Dexterity saving throw, taking 22 (4d10) lightning damage on a failed save, or half as much damage on a successful one.'
monsters.kraken.tentacle-attack-or-fling.name: 'Tentacle Attack or Fling'
monsters.kraken.tentacle-attack-or-fling.description: 'The kraken makes one tentacle attack or uses its Fling.'
monsters.kraken.tentacle-attack-or-fling.actions.tentacle-attack-or-fling.name: 'Tentacle Attack or Fling'
monsters.kraken.tentacle-attack-or-fling.actions.tentacle-attack-or-fling.results.done.name: 'Done'
monsters.kraken.lightning-storm-legendary.name: 'Lightning Storm'
monsters.kraken.lightning-storm-legendary.description: 'The kraken uses Lightning Storm.'
monsters.kraken.lightning-storm-legendary.actions.lightning-storm-legendary.name: 'Lightning Storm'
monsters.kraken.ink-cloud.name: 'Ink Cloud'
monsters.kraken.ink-cloud.description: "While underwater, the kraken expels an ink cloud in a 60-foot radius. The cloud spreads around corners, and that area is heavily obscured to creatures other than the kraken. Each creature other than the kraken that ends its turn there must succeed on a DC 23 Constitution saving throw, taking 16 (3d10) poison damage on a failed save, or half as much damage on a successful one. A strong current disperses the cloud, which otherwise disappears at the end of the kraken's next turn."
monsters.lamia.name: 'Lamia'
monsters.lamia.innate-spellcasting.name: 'Innate Spellcasting'
monsters.lamia.innate-spellcasting.description: |-
  The lamia's innate spellcasting ability is Charisma (spell save DC 13). It can innately cast the following spells, requiring no material components.

  - At will: *disguise self* (any humanoid form), *major image*
  - 3/day each: *charm person*, *mirror image*, *scrying*, *suggestion*
  - 1/day: *geas*
monsters.lamia.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.lamia.multiattack.name: 'Multiattack'
monsters.lamia.multiattack.description: 'The lamia makes two attacks: one with its claws and one with its dagger or Intoxicating Touch.'
monsters.lamia.multiattack.actions.multiattack.name: 'Multiattack'
monsters.lamia.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.lamia.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.lamia.multiattack.actions.multiattack.options.dagger.name: 'Claws and dagger'
monsters.lamia.multiattack.actions.multiattack.options.touch.name: 'Claws and Intoxicating Touch'
monsters.lamia.claws.name: 'Claws'
monsters.lamia.claws.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 14 (2d10 + 3) slashing damage.'
monsters.lamia.dagger.name: 'Dagger'
monsters.lamia.dagger.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 5 (1d4 + 3) piercing damage.'
monsters.lamia.intoxicating-touch.name: 'Intoxicating Touch'
monsters.lamia.intoxicating-touch.description: '*Melee Spell Attack:* +5 to hit, reach 5 ft., one creature. *Hit:* The target is magically cursed for 1 hour. Until the curse ends, the target has disadvantage on Wisdom saving throws and all ability checks.'
monsters.lemure.name: 'Lemure'
monsters.lemure.devils-sight.name: "Devil's Sight"
monsters.lemure.devils-sight.description: "Magical darkness doesn't impede the lemure's darkvision."
monsters.lemure.hellish-rejuvenation.name: 'Hellish Rejuvenation'
monsters.lemure.hellish-rejuvenation.description: 'A lemure that dies in the Nine Hells comes back to life with all its hit points in 1d10 days unless it is killed by a good-aligned creature with a *bless* spell cast on that creature or its remains are sprinkled with holy water.'
monsters.lemure.fist.name: 'Fist'
monsters.lemure.fist.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 2 (1d4) bludgeoning damage.'
monsters.lich.name: 'Lich'
monsters.lich.legendary-resistance.name: 'Legendary Resistance (3/Day)'
monsters.lich.legendary-resistance.description: 'If the lich fails a saving throw, it can choose to succeed instead.'
monsters.lich.rejuvenation.name: 'Rejuvenation'
monsters.lich.rejuvenation.description: 'If it has a phylactery, a destroyed lich gains a new body in 1d10 days, regaining all its hit points and becoming active again. The new body appears within 5 feet of the phylactery.'
monsters.lich.spellcasting.name: 'Spellcasting'
monsters.lich.spellcasting.description: |-
  The lich is an 18th-level spellcaster. Its spellcasting ability is Intelligence (spell save DC 20, +12 to hit with spell attacks). The lich has the following wizard spells prepared:

  - Cantrips (at will): *mage hand*, *prestidigitation*, *ray of frost*
  - 1st level (4 slots): *detect magic*, *magic missile*, *shield*, *thunderwave*
  - 2nd level (3 slots): *acid arrow*, *detect thoughts*, *invisibility*, *mirror image*
  - 3rd level (3 slots): *animate dead*, *counterspell*, *dispel magic*, *fireball*
  - 4th level (3 slots): *blight*, *dimension door*
  - 5th level (3 slots): *cloudkill*, *scrying*
  - 6th level (1 slot): *disintegrate*, *globe of invulnerability*
  - 7th level (1 slot): *finger of death*, *plane shift*
  - 8th level (1 slot): *dominate monster*, *power word stun*
  - 9th level (1 slot): *power word kill*
monsters.lich.turn-resistance.name: 'Turn Resistance'
monsters.lich.turn-resistance.description: 'The lich has advantage on saving throws against any effect that turns undead.'
monsters.lich.paralyzing-touch.name: 'Paralyzing Touch'
monsters.lich.paralyzing-touch.description: '*Melee Spell Attack:* +12 to hit, reach 5 ft., one creature. *Hit:* 10 (3d6) cold damage. The target must succeed on a DC 18 Constitution saving throw or be paralyzed for 1 minute. The target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.lich.cantrip.name: 'Cantrip'
monsters.lich.cantrip.description: 'The lich casts a cantrip.'
monsters.lich.paralyzing-touch-legendary.name: 'Paralyzing Touch'
monsters.lich.paralyzing-touch-legendary.description: 'The lich uses its Paralyzing Touch.'
monsters.lich.paralyzing-touch-legendary.actions.paralyzing-touch-legendary.name: 'Paralyzing Touch'
monsters.lich.paralyzing-touch-legendary.actions.paralyzing-touch-legendary.results.done.name: 'Done'
monsters.lich.frightening-gaze.name: 'Frightening Gaze'
monsters.lich.frightening-gaze.description: "The lich fixes its gaze on one creature it can see within 10 feet of it. The target must succeed on a DC 18 Wisdom saving throw against this magic or become frightened for 1 minute. The frightened target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success. If a target's saving throw is successful or the effect ends for it, the target is immune to the lich's gaze for the next 24 hours."
monsters.lich.disrupt-life.name: 'Disrupt Life'
monsters.lich.disrupt-life.description: 'Each non-undead creature within 20 feet of the lich must make a DC 18 Constitution saving throw against this magic, taking 21 (6d6) necrotic damage on a failed save, or half as much damage on a successful one.'
monsters.lion.name: 'Lion'
monsters.lion.keen-smell.name: 'Keen Smell'
monsters.lion.keen-smell.description: 'The lion has advantage on Wisdom (Perception) checks that rely on smell.'
monsters.lion.pack-tactics.name: 'Pack Tactics'
monsters.lion.pack-tactics.description: "The lion has advantage on an attack roll against a creature if at least one of the lion's allies is within 5 feet of the creature and the ally isn't incapacitated."
monsters.lion.pounce.name: 'Pounce'
monsters.lion.pounce.description: 'If the lion moves at least 20 feet straight toward a creature and then hits it with a claw attack on the same turn, that target must succeed on a DC 13 Strength saving throw or be knocked prone. If the target is prone, the lion can make one bite attack against it as a bonus action.'
monsters.lion.running-leap.name: 'Running Leap'
monsters.lion.running-leap.description: 'With a 10-foot running start, the lion can long jump up to 25 feet.'
monsters.lion.bite.name: 'Bite'
monsters.lion.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 7 (1d8 + 3) piercing damage.'
monsters.lion.claw.name: 'Claw'
monsters.lion.claw.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 6 (1d6 + 3) slashing damage.'
monsters.lizard.name: 'Lizard'
monsters.lizard.bite.name: 'Bite'
monsters.lizard.bite.description: '*Melee Weapon Attack:* +0 to hit, reach 5 ft., one target. *Hit:* 1 piercing damage.'
monsters.lizardfolk.name: 'Lizardfolk'
monsters.lizardfolk.hold-breath.name: 'Hold Breath'
monsters.lizardfolk.hold-breath.description: 'The lizardfolk can hold its breath for 15 minutes.'
monsters.lizardfolk.multiattack.name: 'Multiattack'
monsters.lizardfolk.multiattack.description: 'The lizardfolk makes two melee attacks, each one with a different weapon.'
