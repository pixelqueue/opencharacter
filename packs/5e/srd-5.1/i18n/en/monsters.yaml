monsters.mummy-lord.attack.actions.attack.options.glare.name: 'Dreadful Glare'
monsters.mummy-lord.blinding-dust.name: 'Blinding Dust'
monsters.mummy-lord.blinding-dust.description: "Blinding dust and sand swirls magically around the mummy lord. Each creature within 5 feet of the mummy lord must succeed on a DC 16 Constitution saving throw or be blinded until the end of the creature's next turn."
monsters.mummy-lord.blasphemous-word.name: 'Blasphemous Word'
monsters.mummy-lord.blasphemous-word.description: "The mummy lord utters a blasphemous word. Each non-undead creature within 10 feet of the mummy lord that can hear the magical utterance must succeed on a DC 16 Constitution saving throw or be stunned until the end of the mummy lord's next turn."
monsters.mummy-lord.channel-negative-energy.name: 'Channel Negative Energy'
monsters.mummy-lord.channel-negative-energy.description: "The mummy lord magically unleashes negative energy. Creatures within 60 feet of the mummy lord, including ones behind barriers and around corners, can't regain hit points until the end of the mummy lord's next turn."
monsters.mummy-lord.whirlwind-of-sand.name: 'Whirlwind of Sand'
monsters.mummy-lord.whirlwind-of-sand.description: "The mummy lord magically transforms into a whirlwind of sand, moves up to 60 feet, and reverts to its normal form. While in whirlwind form, the mummy lord is immune to all damage, and it can't be grappled, petrified, knocked prone, restrained, or stunned. Equipment worn or carried by the mummy lord remain in its possession."
monsters.nalfeshnee.name: 'Nalfeshnee'
monsters.nalfeshnee.magic-resistance.name: 'Magic Resistance'
monsters.nalfeshnee.magic-resistance.description: 'The nalfeshnee has advantage on saving throws against spells and other magical effects.'
monsters.nalfeshnee.multiattack.name: 'Multiattack'
monsters.nalfeshnee.multiattack.description: 'The nalfeshnee uses Horror Nimbus if it can. It then makes three attacks: one with its bite and two with its claws.'
monsters.nalfeshnee.multiattack.actions.multiattack.name: 'Multiattack'
monsters.nalfeshnee.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.nalfeshnee.bite.name: 'Bite'
monsters.nalfeshnee.bite.description: '*Melee Weapon Attack:* +10 to hit, reach 5 ft., one target. *Hit:* 32 (5d10 + 5) piercing damage.'
monsters.nalfeshnee.claw.name: 'Claw'
monsters.nalfeshnee.claw.description: '*Melee Weapon Attack:* +10 to hit, reach 10 ft., one target. *Hit:* 15 (3d6 + 5) slashing damage.'
monsters.nalfeshnee.horror-nimbus.name: 'Horror Nimbus'
monsters.nalfeshnee.horror-nimbus.description: "The nalfeshnee magically emits scintillating, multicolored light. Each creature within 15 feet of the nalfeshnee that can see the light must succeed on a DC 15 Wisdom saving throw or be frightened for 1 minute. A creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success. If a creature's saving throw is successful or the effect ends for it, the creature is immune to the nalfeshnee's Horror Nimbus for the next 24 hours."
monsters.nalfeshnee.teleport.name: 'Teleport'
monsters.nalfeshnee.teleport.description: 'The nalfeshnee magically teleports, along with any equipment it is wearing or carrying, up to 120 feet to an unoccupied space it can see.'
monsters.night-hag.name: 'Night Hag'
monsters.night-hag.innate-spellcasting.name: 'Innate Spellcasting'
monsters.night-hag.innate-spellcasting.description: |-
  The hag's innate spellcasting ability is Charisma (spell save DC 14, +6 to hit with spell attacks). She can innately cast the following spells, requiring no material components:

  - At will: *detect magic*, *magic missile*
  - 2/day each: *plane shift* (self only), *ray of enfeeblement*, *sleep*
monsters.night-hag.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.night-hag.magic-resistance.name: 'Magic Resistance'
monsters.night-hag.magic-resistance.description: 'The hag has advantage on saving throws against spells and other magical effects.'
monsters.night-hag.claws.name: 'Claws (Hag Form Only)'
monsters.night-hag.claws.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) slashing damage.'
monsters.night-hag.change-shape.name: 'Change Shape'
monsters.night-hag.change-shape.description: "The hag magically polymorphs into a Small or Medium female humanoid, or back into her true form. Her statistics are the same in each form. Any equipment she is wearing or carrying isn't transformed. She reverts to her true form if she dies."
monsters.night-hag.etherealness.name: 'Etherealness'
monsters.night-hag.etherealness.description: 'The hag magically enters the Ethereal Plane from the Material Plane, or vice versa. To do so, the hag must have a *heartstone* in her possession.'
monsters.night-hag.nightmare-haunting.name: 'Nightmare Haunting (1/Day)'
monsters.night-hag.nightmare-haunting.description: "While on the Ethereal Plane, the hag magically touches a sleeping humanoid on the Material Plane. A *protection from evil and good* spell cast on the target prevents this contact, as does a *magic circle*. As long as the contact persists, the target has dreadful visions. If these visions last for at least 1 hour, the target gains no benefit from its rest, and its hit point maximum is reduced by 5 (1d10). If this effect reduces the target's hit point maximum to 0, the target dies, and if the target was evil, its soul is trapped in the hag's *soul bag*. The reduction to the target's hit point maximum lasts until removed by the *greater restoration* spell or similar magic."
monsters.nightmare.name: 'Nightmare'
monsters.nightmare.confer-fire-resistance.name: 'Confer Fire Resistance'
monsters.nightmare.confer-fire-resistance.description: 'The nightmare can grant resistance to fire damage to anyone riding it.'
monsters.nightmare.illumination.name: 'Illumination'
monsters.nightmare.illumination.description: 'The nightmare sheds bright light in a 10- foot radius and dim light for an additional 10 feet.'
monsters.nightmare.hooves.name: 'Hooves'
monsters.nightmare.hooves.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) bludgeoning damage plus 7 (2d6) fire damage.'
monsters.nightmare.ethereal-stride.name: 'Ethereal Stride'
monsters.nightmare.ethereal-stride.description: 'The nightmare and up to three willing creatures within 5 feet of it magically enter the Ethereal Plane from the Material Plane, or vice versa.'
monsters.noble.name: 'Noble'
monsters.noble.rapier.name: 'Rapier'
monsters.noble.rapier.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 5 (1d8 + 1) piercing damage.'
monsters.noble.parry.name: 'Parry'
monsters.noble.parry.description: 'The noble adds 2 to its AC against one melee attack that would hit it. To do so, the noble must see the attacker and be wielding a melee weapon.'
monsters.ochre-jelly.name: 'Ochre Jelly'
monsters.ochre-jelly.amorphous.name: 'Amorphous'
monsters.ochre-jelly.amorphous.description: 'The jelly can move through a space as narrow as 1 inch wide without squeezing.'
monsters.ochre-jelly.spider-climb.name: 'Spider Climb'
monsters.ochre-jelly.spider-climb.description: 'The jelly can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.ochre-jelly.pseudopod.name: 'Pseudopod'
monsters.ochre-jelly.pseudopod.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 9 (2d6 + 2) bludgeoning damage plus 3 (1d6) acid damage.'
monsters.ochre-jelly.split.name: 'Split'
monsters.ochre-jelly.split.description: "When a jelly that is Medium or larger is subjected to lightning or slashing damage, it splits into two new jellies if it has at least 10 hit points. Each new jelly has hit points equal to half the original jelly's, rounded down. New jellies are one size smaller than the original jelly."
monsters.octopus.name: 'Octopus'
monsters.octopus.hold-breath.name: 'Hold Breath'
monsters.octopus.hold-breath.description: 'While out of water, the octopus can hold its breath for 30 minutes.'
monsters.octopus.underwater-camouflage.name: 'Underwater Camouflage'
monsters.octopus.underwater-camouflage.description: 'The octopus has advantage on Dexterity (Stealth) checks made while underwater.'
monsters.octopus.water-breathing.name: 'Water Breathing'
monsters.octopus.water-breathing.description: 'The octopus can breathe only underwater.'
monsters.octopus.tentacles.name: 'Tentacles'
monsters.octopus.tentacles.description: "*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 1 bludgeoning damage, and the target is grappled (escape DC 10). Until this grapple ends, the octopus can't use its tentacles on another target."
monsters.octopus.ink-cloud.name: 'Ink Cloud (Recharges after a Short or Long Rest)'
monsters.octopus.ink-cloud.description: 'A 5- foot-radius cloud of ink extends all around the octopus if it is underwater. The area is heavily obscured for 1 minute, although a significant current can disperse the ink. After releasing the ink, the octopus can use the Dash action as a bonus action.'
monsters.ogre.name: 'Ogre'
monsters.ogre.greatclub.name: 'Greatclub'
monsters.ogre.greatclub.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) bludgeoning damage.'
monsters.ogre.javelin.name: 'Javelin'
monsters.ogre.javelin.description: '*Melee or Ranged Weapon Attack:* +6 to hit, reach 5 ft. or range 30/120 ft., one target. *Hit:* 11 (2d6 + 4) piercing damage.'
monsters.ogre-zombie.name: 'Ogre Zombie'
monsters.ogre-zombie.undead-fortitude.name: 'Undead Fortitude'
monsters.ogre-zombie.undead-fortitude.description: 'If damage reduces the zombie to 0 hit points, it must make a Constitution saving throw with a DC of 5 + the damage taken, unless the damage is radiant or from a critical hit. On a success, the zombie drops to 1 hit point instead.'
monsters.ogre-zombie.undead-fortitude.actions.undead-fortitude.name: 'Undead Fortitude'
monsters.ogre-zombie.undead-fortitude.actions.undead-fortitude.params.damage.name: 'Damage taken'
monsters.ogre-zombie.undead-fortitude.actions.undead-fortitude.results.success.name: 'Drops to 1 hit point'
monsters.ogre-zombie.undead-fortitude.actions.undead-fortitude.results.failure.name: 'Drops to 0 hit points'
monsters.ogre-zombie.morningstar.name: 'Morningstar'
monsters.ogre-zombie.morningstar.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) bludgeoning damage.'
monsters.oni.name: 'Oni'
monsters.oni.innate-spellcasting.name: 'Innate Spellcasting'
monsters.oni.innate-spellcasting.description: |-
  The oni's innate spellcasting ability is Charisma (spell save DC 13). The oni can innately cast the following spells, requiring no material components:

  - At will: *darkness*, *invisibility*
  - 1/day each: *charm person*, *cone of cold*, *gaseous form*, *sleep*
monsters.oni.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.oni.magic-weapons.name: 'Magic Weapons'
monsters.oni.magic-weapons.description: "The oni's weapon attacks are magical."
monsters.oni.regeneration.name: 'Regeneration'
monsters.oni.regeneration.description: 'The oni regains 10 hit points at the start of its turn if it has at least 1 hit point.'
monsters.oni.regeneration.actions.regenerate.name: 'Regenerate'
monsters.oni.regeneration.actions.regenerate.results.regenerated.name: 'Regenerated'
monsters.oni.multiattack.name: 'Multiattack'
monsters.oni.multiattack.description: 'The oni makes two attacks, either with its claws or its glaive.'
monsters.oni.multiattack.actions.multiattack.name: 'Multiattack'
monsters.oni.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.oni.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.oni.multiattack.actions.multiattack.options.claws.name: 'Two claw attacks'
monsters.oni.multiattack.actions.multiattack.options.glaive.name: 'Two glaive attacks'
monsters.oni.claw.name: 'Claw (Oni Form Only)'
monsters.oni.claw.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 8 (1d8 + 4) slashing damage.'
monsters.oni.glaive.name: 'Glaive'
monsters.oni.glaive.description: '*Melee Weapon Attack:* +7 to hit, reach 10 ft., one target. *Hit:* 15 (2d10 + 4) slashing damage, or 9 (1d10 + 4) slashing damage in Small or Medium form.'
monsters.oni.change-shape.name: 'Change Shape'
monsters.oni.change-shape.description: 'The oni magically polymorphs into a Small or Medium humanoid, into a Large giant, or back into its true form. Other than its size, its statistics are the same in each form. The only equipment that is transformed is its glaive, which shrinks so that it can be wielded in humanoid form. If the oni dies, it reverts to its true form, and its glaive reverts to its normal size.'
monsters.orc.name: 'Orc'
monsters.orc.aggressive.name: 'Aggressive'
monsters.orc.aggressive.description: 'As a bonus action, the orc can move up to its speed toward a hostile creature that it can see.'
monsters.orc.greataxe.name: 'Greataxe'
monsters.orc.greataxe.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 9 (1d12 + 3) slashing damage.'
monsters.orc.javelin.name: 'Javelin'
monsters.orc.javelin.description: '*Melee or Ranged Weapon Attack:* +5 to hit, reach 5 ft. or range 30/120 ft., one target. *Hit:* 6 (1d6 + 3) piercing damage.'
monsters.otyugh.name: 'Otyugh'
monsters.otyugh.limited-telepathy.name: 'Limited Telepathy'
monsters.otyugh.limited-telepathy.description: "The otyugh can magically transmit simple messages and images to any creature within 120 feet of it that can understand a language. This form of telepathy doesn't allow the receiving creature to telepathically respond."
monsters.otyugh.multiattack.name: 'Multiattack'
monsters.otyugh.multiattack.description: 'The otyugh makes three attacks: one with its bite and two with its tentacles.'
monsters.otyugh.multiattack.actions.multiattack.name: 'Multiattack'
monsters.otyugh.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.otyugh.bite.name: 'Bite'
monsters.otyugh.bite.description: "*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 12 (2d8 + 3) piercing damage. If the target is a creature, it must succeed on a DC 15 Constitution saving throw against disease or become poisoned until the disease is cured. Every 24 hours that elapse, the target must repeat the saving throw, reducing its hit point maximum by 5 (1d10) on a failure. The disease is cured on a success. The target dies if the disease reduces its hit point maximum to 0. This reduction to the target's hit point maximum lasts until the disease is cured."
monsters.otyugh.tentacle.name: 'Tentacle'
monsters.otyugh.tentacle.description: '*Melee Weapon Attack:* +6 to hit, reach 10 ft., one target. *Hit:* 7 (1d8 + 3) bludgeoning damage plus 4 (1d8) piercing damage. If the target is Medium or smaller, it is grappled (escape DC 13) and restrained until the grapple ends. The otyugh has two tentacles, each of which can grapple one target.'
monsters.otyugh.tentacle-slam.name: 'Tentacle Slam'
monsters.otyugh.tentacle-slam.description: "The otyugh slams creatures grappled by it into each other or a solid surface. Each creature must succeed on a DC 14 Constitution saving throw or take 10 (2d6 + 3) bludgeoning damage and be stunned until the end of the otyugh's next turn. On a successful save, the target takes half the bludgeoning damage and isn't stunned."
monsters.owl.name: 'Owl'
monsters.owl.flyby.name: 'Flyby'
monsters.owl.flyby.description: "The owl doesn't provoke opportunity attacks when it flies out of an enemy's reach."
monsters.owl.keen-hearing-and-sight.name: 'Keen Hearing and Sight'
monsters.owl.keen-hearing-and-sight.description: 'The owl has advantage on Wisdom (Perception) checks that rely on hearing or sight.'
monsters.owl.talons.name: 'Talons'
monsters.owl.talons.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 1 slashing damage.'
monsters.owlbear.name: 'Owlbear'
monsters.owlbear.keen-sight-and-smell.name: 'Keen Sight and Smell'
monsters.owlbear.keen-sight-and-smell.description: 'The owlbear has advantage on Wisdom (Perception) checks that rely on sight or smell.'
monsters.owlbear.multiattack.name: 'Multiattack'
monsters.owlbear.multiattack.description: 'The owlbear makes two attacks: one with its beak and one with its claws.'
monsters.owlbear.multiattack.actions.multiattack.name: 'Multiattack'
monsters.owlbear.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.owlbear.beak.name: 'Beak'
monsters.owlbear.beak.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one creature. *Hit:* 10 (1d10 + 5) piercing damage.'
monsters.owlbear.claws.name: 'Claws'
monsters.owlbear.claws.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 14 (2d8 + 5) slashing damage.'
monsters.panther.name: 'Panther'
monsters.panther.keen-smell.name: 'Keen Smell'
monsters.panther.keen-smell.description: 'The panther has advantage on Wisdom (Perception) checks that rely on smell.'
monsters.panther.pounce.name: 'Pounce'
monsters.panther.pounce.description: 'If the panther moves at least 20 feet straight toward a creature and then hits it with a claw attack on the same turn, that target must succeed on a DC 12 Strength saving throw or be knocked prone. If the target is prone, the panther can make one bite attack against it as a bonus action.'
monsters.panther.bite.name: 'Bite'
monsters.panther.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.panther.claw.name: 'Claw'
monsters.panther.claw.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 4 (1d4 + 2) slashing damage.'
monsters.pegasus.name: 'Pegasus'
monsters.pegasus.hooves.name: 'Hooves'
monsters.pegasus.hooves.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) bludgeoning damage.'
monsters.phase-spider.name: 'Phase Spider'
monsters.phase-spider.ethereal-jaunt.name: 'Ethereal Jaunt'
monsters.phase-spider.ethereal-jaunt.description: 'As a bonus action, the spider can magically shift from the Material Plane to the Ethereal Plane, or vice versa.'
monsters.phase-spider.spider-climb.name: 'Spider Climb'
monsters.phase-spider.spider-climb.description: 'The spider can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.phase-spider.web-walker.name: 'Web Walker'
monsters.phase-spider.web-walker.description: 'The spider ignores movement restrictions caused by webbing.'
monsters.phase-spider.bite.name: 'Bite'
monsters.phase-spider.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 7 (1d10 + 2) piercing damage, and the target must make a DC 11 Constitution saving throw, taking 18 (4d8) poison damage on a failed save, or half as much damage on a successful one. If the poison damage reduces the target to 0 hit points, the target is stable but poisoned for 1 hour, even after regaining hit points, and is paralyzed while poisoned in this way.'
monsters.pit-fiend.name: 'Pit Fiend'
monsters.pit-fiend.fear-aura.name: 'Fear Aura'
monsters.pit-fiend.fear-aura.description: "Any creature hostile to the pit fiend that starts its turn within 20 feet of the pit fiend must make a DC 21 Wisdom saving throw, unless the pit fiend is incapacitated. On a failed save, the creature is frightened until the start of its next turn. If a creature's saving throw is successful, the creature is immune to the pit fiend's Fear Aura for the next 24 hours."
monsters.pit-fiend.magic-resistance.name: 'Magic Resistance'
monsters.pit-fiend.magic-resistance.description: 'The pit fiend has advantage on saving throws against spells and other magical effects.'
monsters.pit-fiend.magic-weapons.name: 'Magic Weapons'
monsters.pit-fiend.magic-weapons.description: "The pit fiend's weapon attacks are magical."
monsters.pit-fiend.innate-spellcasting.name: 'Innate Spellcasting'
monsters.pit-fiend.innate-spellcasting.description: |-
  The pit fiend's spellcasting ability is Charisma (spell save DC 21). The pit fiend can innately cast the following spells, requiring no material components:

  - At will: *detect magic*, *fireball*
  - 3/day each: *hold monster*, *wall of fire*
monsters.pit-fiend.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.pit-fiend.multiattack.name: 'Multiattack'
monsters.pit-fiend.multiattack.description: 'The pit fiend makes four attacks: one with its bite, one with its claw, one with its mace, and one with its tail.'
monsters.pit-fiend.multiattack.actions.multiattack.name: 'Multiattack'
monsters.pit-fiend.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.pit-fiend.bite.name: 'Bite'
monsters.pit-fiend.bite.description: "*Melee Weapon Attack:* +14 to hit, reach 5 ft., one target. *Hit:* 22 (4d6 + 8) piercing damage. The target must succeed on a DC 21 Constitution saving throw or become poisoned. While poisoned in this way, the target can't regain hit points, and it takes 21 (6d6) poison damage at the start of each of its turns. The poisoned target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success."
monsters.pit-fiend.claw.name: 'Claw'
monsters.pit-fiend.claw.description: '*Melee Weapon Attack:* +14 to hit, reach 10 ft., one target. *Hit:* 17 (2d8 + 8) slashing damage.'
monsters.pit-fiend.mace.name: 'Mace'
monsters.pit-fiend.mace.description: '*Melee Weapon Attack:* +14 to hit, reach 10 ft., one target. *Hit:* 15 (2d6 + 8) bludgeoning damage plus 21 (6d6) fire damage.'
monsters.pit-fiend.tail.name: 'Tail'
monsters.pit-fiend.tail.description: '*Melee Weapon Attack:* +14 to hit, reach 10 ft., one target. *Hit:* 24 (3d10 + 8) bludgeoning damage.'
monsters.planetar.name: 'Planetar'
monsters.planetar.angelic-weapons.name: 'Angelic Weapons'
monsters.planetar.angelic-weapons.description: "The planetar's weapon attacks are magical. When the planetar hits with any weapon, the weapon deals an extra 5d8 radiant damage (included in the attack)."
monsters.planetar.divine-awareness.name: 'Divine Awareness'
monsters.planetar.divine-awareness.description: 'The planetar knows if it hears a lie.'
monsters.planetar.innate-spellcasting.name: 'Innate Spellcasting'
monsters.planetar.innate-spellcasting.description: |-
  The planetar's spellcasting ability is Charisma (spell save DC 20). The planetar can innately cast the following spells, requiring no material components:

  - At will: *detect evil and good*, *invisibility* (self only)
  - 3/day each: *blade barrier*, *dispel evil and good*, *flame strike*, *raise dead*
  - 1/day each: *commune*, *control weather*, *insect plague*
monsters.planetar.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.planetar.magic-resistance.name: 'Magic Resistance'
monsters.planetar.magic-resistance.description: 'The planetar has advantage on saving throws against spells and other magical effects.'
monsters.planetar.multiattack.name: 'Multiattack'
monsters.planetar.multiattack.description: 'The planetar makes two melee attacks.'
monsters.planetar.multiattack.actions.multiattack.name: 'Multiattack'
monsters.planetar.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.planetar.greatsword.name: 'Greatsword'
monsters.planetar.greatsword.description: '*Melee Weapon Attack:* +12 to hit, reach 5 ft., one target. *Hit:* 21 (4d6 + 7) slashing damage plus 22 (5d8) radiant damage.'
monsters.planetar.healing-touch.name: 'Healing Touch (4/Day)'
monsters.planetar.healing-touch.description: 'The planetar touches another creature. The target magically regains 30 (6d8 + 3) hit points and is freed from any curse, disease, poison, blindness, or deafness.'
monsters.plesiosaurus.name: 'Plesiosaurus'
monsters.plesiosaurus.hold-breath.name: 'Hold Breath'
monsters.plesiosaurus.hold-breath.description: 'The plesiosaurus can hold its breath for 1 hour.'
monsters.plesiosaurus.bite.name: 'Bite'
monsters.plesiosaurus.bite.description: '*Melee Weapon Attack:* +6 to hit, reach 10 ft., one target. *Hit:* 14 (3d6 + 4) piercing damage.'
monsters.poisonous-snake.name: 'Poisonous Snake'
monsters.poisonous-snake.bite.name: 'Bite'
monsters.poisonous-snake.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 1 piercing damage, and the target must make a DC 10 Constitution saving throw, taking 5 (2d4) poison damage on a failed save, or half as much damage on a successful one.'
monsters.polar-bear.name: 'Polar Bear'
monsters.polar-bear.keen-smell.name: 'Keen Smell'
monsters.polar-bear.keen-smell.description: 'The bear has advantage on Wisdom (Perception) checks that rely on smell.'
monsters.polar-bear.multiattack.name: 'Multiattack'
monsters.polar-bear.multiattack.description: 'The bear makes two attacks: one with its bite and one with its claws.'
monsters.polar-bear.multiattack.actions.multiattack.name: 'Multiattack'
monsters.polar-bear.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.polar-bear.bite.name: 'Bite'
monsters.polar-bear.bite.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 9 (1d8 + 5) piercing damage.'
monsters.polar-bear.claws.name: 'Claws'
monsters.polar-bear.claws.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 12 (2d6 + 5) slashing damage.'
monsters.pony.name: 'Pony'
monsters.pony.hooves.name: 'Hooves'
monsters.pony.hooves.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (2d4 + 2) bludgeoning damage.'
monsters.priest.name: 'Priest'
monsters.priest.divine-eminence.name: 'Divine Eminence'
monsters.priest.divine-eminence.description: 'As a bonus action, the priest can expend a spell slot to cause its melee weapon attacks to magically deal an extra 10 (3d6) radiant damage to a target on a hit. This benefit lasts until the end of the turn. If the priest expends a spell slot of 2nd level or higher, the extra damage increases by 1d6 for each level above 1st.'
monsters.priest.spellcasting.name: 'Spellcasting'
monsters.priest.spellcasting.description: |-
  The priest is a 5th-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 13, +5 to hit with spell attacks). The priest has the following cleric spells prepared:

  - Cantrips (at will): *light*, *sacred flame*, *thaumaturgy*
  - 1st level (4 slots): *cure wounds*, *guiding bolt*, *sanctuary*
  - 2nd level (3 slots): *lesser restoration*, *spiritual weapon*
  - 3rd level (2 slots): *dispel magic*, *spirit guardians*
monsters.priest.mace.name: 'Mace'
monsters.priest.mace.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one target. *Hit:* 3 (1d6) bludgeoning damage.'
monsters.pseudodragon.name: 'Pseudodragon'
monsters.pseudodragon.keen-senses.name: 'Keen Senses'
monsters.pseudodragon.keen-senses.description: 'The pseudodragon has advantage on Wisdom (Perception) checks that rely on sight, hearing, or smell.'
monsters.pseudodragon.magic-resistance.name: 'Magic Resistance'
monsters.pseudodragon.magic-resistance.description: 'The pseudodragon has advantage on saving throws against spells and other magical effects.'
monsters.pseudodragon.limited-telepathy.name: 'Limited Telepathy'
monsters.pseudodragon.limited-telepathy.description: 'The pseudodragon can magically communicate simple ideas, emotions, and images telepathically with any creature within 100 feet of it that can understand a language.'
monsters.pseudodragon.bite.name: 'Bite'
monsters.pseudodragon.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 4 (1d4 + 2) piercing damage.'
monsters.pseudodragon.sting.name: 'Sting'
monsters.pseudodragon.sting.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 4 (1d4 + 2) piercing damage, and the target must succeed on a DC 11 Constitution saving throw or become poisoned for 1 hour. If the saving throw fails by 5 or more, the target falls unconscious for the same duration, or until it takes damage or another creature uses an action to shake it awake.'
monsters.purple-worm.name: 'Purple Worm'
monsters.purple-worm.tunneler.name: 'Tunneler'
monsters.purple-worm.tunneler.description: '. The worm can burrow through solid rock at half its burrow speed and leaves a 10-foot-diameter tunnel in its wake.'
monsters.purple-worm.multiattack.name: 'Multiattack'
monsters.purple-worm.multiattack.description: 'The worm makes two attacks: one with its bite and one with its stinger.'
monsters.purple-worm.multiattack.actions.multiattack.name: 'Multiattack'
monsters.purple-worm.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.purple-worm.bite.name: 'Bite'
monsters.purple-worm.bite.description: |-
  *Melee Weapon Attack:* +9 to hit, reach 10 ft., one target. *Hit:* 22 (3d8 + 9) piercing damage. If the target is a Large or smaller creature, it must succeed on a DC 19 Dexterity saving throw or be swallowed by the worm. A swallowed creature is blinded and restrained, it has total cover against attacks and other effects outside the worm, and it takes 21 (6d6) acid damage at the start of each of the worm's turns.

  If the worm takes 30 damage or more on a single turn from a creature inside it, the worm must succeed on a DC 21 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall prone in a space within 10 feet of the worm. If the worm dies, a swallowed creature is no longer restrained by it and can escape from the corpse by using 20 feet of movement, exiting prone.
monsters.purple-worm.tail-stinger.name: 'Tail Stinger'
monsters.purple-worm.tail-stinger.description: '*Melee Weapon Attack:* +9 to hit, reach 10 ft., one creature. *Hit:* 19 (3d6 + 9) piercing damage, and the target must make a DC 19 Constitution saving throw, taking 42 (12d6) poison damage on a failed save, or half as much damage on a successful one.'
monsters.quasit.name: 'Quasit'
monsters.quasit.shapechanger.name: 'Shapechanger'
monsters.quasit.shapechanger.description: "The quasit can use its action to polymorph into a beast form that resembles a bat (speed 10 ft. fly 40 ft.), a centipede (40 ft., climb 40 ft.), or a toad (40 ft., swim 40 ft.), or back into its true form. Its statistics are the same in each form, except for the speed changes noted. Any equipment it is wearing or carrying isn't transformed. It reverts to its true form if it dies."
monsters.quasit.magic-resistance.name: 'Magic Resistance'
monsters.quasit.magic-resistance.description: 'The quasit has advantage on saving throws against spells and other magical effects.'
monsters.quasit.claws.name: 'Claws (Bite in Beast Form)'
monsters.quasit.claws.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d4 + 3) piercing damage, and the target must succeed on a DC 10 Constitution saving throw or take 5 (2d4) poison damage and become poisoned for 1 minute. The target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.quasit.scare.name: 'Scare (1/Day)'
monsters.quasit.scare.description: "One creature of the quasit's choice within 20 feet of it must succeed on a DC 10 Wisdom saving throw or be frightened for 1 minute. The target can repeat the saving throw at the end of each of its turns, with disadvantage if the quasit is within line of sight, ending the effect on itself on a success."
monsters.quasit.invisibility.name: 'Invisibility'
monsters.quasit.invisibility.description: 'The quasit magically turns invisible until it attacks or uses Scare, or until its concentration ends (as if concentrating on a spell). Any equipment the quasit wears or carries is invisible with it.'
monsters.quipper.name: 'Quipper'
monsters.quipper.blood-frenzy.name: 'Blood Frenzy'
monsters.quipper.blood-frenzy.description: "The quipper has advantage on melee attack rolls against any creature that doesn't have all its hit points."
monsters.quipper.water-breathing.name: 'Water Breathing'
monsters.quipper.water-breathing.description: 'The quipper can breathe only underwater.'
monsters.quipper.bite.name: 'Bite'
monsters.quipper.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 1 piercing damage.'
monsters.rakshasa.name: 'Rakshasa'
monsters.rakshasa.limited-magic-immunity.name: 'Limited Magic Immunity'
monsters.rakshasa.limited-magic-immunity.description: "The rakshasa can't be affected or detected by spells of 6th level or lower unless it wishes to be. It has advantage on saving throws against all other spells and magical effects."
monsters.rakshasa.innate-spellcasting.name: 'Innate Spellcasting'
monsters.rakshasa.innate-spellcasting.description: |-
  The rakshasa's innate spellcasting ability is Charisma (spell save DC 18, +10 to hit with spell attacks). The rakshasa can innately cast the following spells, requiring no material components:

  - At will: *detect thoughts*, *disguise self*, *mage hand*, *minor illusion*
  - 3/day each: *charm person*, *detect magic*, *invisibility*, *major image*, *suggestion*
  - 1/day each: *dominate person*, *fly*, *plane shift*, *true seeing*
monsters.rakshasa.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.rakshasa.multiattack.name: 'Multiattack'
monsters.rakshasa.multiattack.description: 'The rakshasa makes two claw attacks.'
monsters.rakshasa.multiattack.actions.multiattack.name: 'Multiattack'
monsters.rakshasa.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.rakshasa.claw.name: 'Claw'
monsters.rakshasa.claw.description: "*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 9 (2d6 + 2) slashing damage, and the target is cursed if it is a creature. The magical curse takes effect whenever the target takes a short or long rest, filling the target's thoughts with horrible images and dreams. The cursed target gains no benefit from finishing a short or long rest. The curse lasts until it is lifted by a *remove curse* spell or similar magic."
monsters.rat.name: 'Rat'
monsters.rat.keen-smell.name: 'Keen Smell'
monsters.rat.keen-smell.description: 'The rat has advantage on Wisdom (Perception) checks that rely on smell.'
monsters.rat.bite.name: 'Bite'
monsters.rat.bite.description: '*Melee Weapon Attack:* +0 to hit, reach 5 ft., one target. *Hit:* 1 piercing damage.'
monsters.raven.name: 'Raven'
monsters.raven.mimicry.name: 'Mimicry'
monsters.raven.mimicry.description: 'The raven can mimic simple sounds it has heard, such as a person whispering, a baby crying, or an animal chittering. A creature that hears the sounds can tell they are imitations with a successful DC 10 Wisdom (Insight) check.'
monsters.raven.beak.name: 'Beak'
monsters.raven.beak.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 1 piercing damage.'
monsters.red-dragon-wyrmling.name: 'Red Dragon Wyrmling'
monsters.red-dragon-wyrmling.bite.name: 'Bite'
monsters.red-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 9 (1d10 + 4) piercing damage plus 3 (1d6) fire damage.'
monsters.red-dragon-wyrmling.fire-breath.name: 'Fire Breath'
monsters.red-dragon-wyrmling.fire-breath.description: 'The dragon exhales fire in a 15-foot cone. Each creature in that area must make a DC 13 Dexterity saving throw, taking 24 (7d6) fire damage on a failed save, or half as much damage on a successful one.'
monsters.reef-shark.name: 'Reef Shark'
monsters.reef-shark.pack-tactics.name: 'Pack Tactics'
monsters.reef-shark.pack-tactics.description: "The shark has advantage on an attack roll against a creature if at least one of the shark's allies is within 5 feet of the creature and the ally isn't incapacitated."
monsters.reef-shark.water-breathing.name: 'Water Breathing'
monsters.reef-shark.water-breathing.description: 'The shark can breathe only underwater.'
monsters.reef-shark.bite.name: 'Bite'
monsters.reef-shark.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 6 (1d8 + 2) piercing damage.'
monsters.remorhaz.name: 'Remorhaz'
monsters.remorhaz.heated-body.name: 'Heated Body'
monsters.remorhaz.heated-body.description: 'A creature that touches the remorhaz or hits it with a melee attack while within 5 feet of it takes 10 (3d6) fire damage.'
monsters.remorhaz.bite.name: 'Bite'
monsters.remorhaz.bite.description: "*Melee Weapon Attack:* +11 to hit, reach 10 ft., one target. *Hit:* 40 (6d10 + 7) piercing damage plus 10 (3d6) fire damage. If the target is a creature, it is grappled (escape DC 17). Until this grapple ends, the target is restrained, and the remorhaz can't bite another target."
monsters.remorhaz.swallow.name: 'Swallow'
monsters.remorhaz.swallow.description: |-
  The remorhaz makes one bite attack against a Medium or smaller creature it is grappling. If the attack hits, that creature takes the bite's damage and is swallowed, and the grapple ends. While swallowed, the creature is blinded and restrained, it has total cover against attacks and other effects outside the remorhaz, and it takes 21 (6d6) acid damage at the start of each of the remorhaz's turns.

  If the remorhaz takes 30 damage or more on a single turn from a creature inside it, the remorhaz must succeed on a DC 15 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall prone in a space within 10 feet of the remorhaz. If the remorhaz dies, a swallowed creature is no longer restrained by it and can escape from the corpse using 15 feet of movement, exiting prone.
monsters.rhinoceros.name: 'Rhinoceros'
monsters.rhinoceros.charge.name: 'Charge'
monsters.rhinoceros.charge.description: 'If the rhinoceros moves at least 20 feet straight toward a target and then hits it with a gore attack on the same turn, the target takes an extra 9 (2d8) bludgeoning damage. If the target is a creature, it must succeed on a DC 15 Strength saving throw or be knocked prone.'
monsters.rhinoceros.gore.name: 'Gore'
monsters.rhinoceros.gore.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 14 (2d8 + 5) bludgeoning damage.'
monsters.riding-horse.name: 'Riding Horse'
monsters.riding-horse.hooves.name: 'Hooves'
monsters.riding-horse.hooves.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 8 (2d4 + 3) bludgeoning damage.'
monsters.roc.name: 'Roc'
monsters.roc.keen-sight.name: 'Keen Sight'
monsters.roc.keen-sight.description: 'The roc has advantage on Wisdom (Perception) checks that rely on sight.'
monsters.roc.multiattack.name: 'Multiattack'
monsters.roc.multiattack.description: 'The roc makes two attacks: one with its beak and one with its talons.'
monsters.roc.multiattack.actions.multiattack.name: 'Multiattack'
monsters.roc.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.roc.beak.name: 'Beak'
monsters.roc.beak.description: '*Melee Weapon Attack:* +13 to hit, reach 10 ft., one target. *Hit:* 27 (4d8 + 9) piercing damage.'
monsters.roc.talons.name: 'Talons'
monsters.roc.talons.description: "*Melee Weapon Attack:* +13 to hit, reach 5 ft., one target. Hit: 23 (4d6 + 9) slashing damage, and the target is grappled (escape DC 19). Until this grapple ends, the target is restrained, and the roc can't use its talons on another target."
monsters.roper.name: 'Roper'
monsters.roper.false-appearance.name: 'False Appearance'
monsters.roper.false-appearance.description: 'While the roper remains motionless, it is indistinguishable from a normal cave formation, such as a stalagmite.'
monsters.roper.grasping-tendrils.name: 'Grasping Tendrils'
monsters.roper.grasping-tendrils.description: 'The roper can have up to six tendrils at a time. Each tendril can be attacked (AC 20; 10 hit points; immunity to poison and psychic damage). Destroying a tendril deals no damage to the roper, which can extrude a replacement tendril on its next turn. A tendril can also be broken if a creature takes an action and succeeds on a DC 15 Strength check against it.'
monsters.roper.spider-climb.name: 'Spider Climb'
monsters.roper.spider-climb.description: 'The roper can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.roper.multiattack.name: 'Multiattack'
monsters.roper.multiattack.description: 'The roper makes four attacks with its tendrils, uses Reel, and makes one attack with its bite.'
monsters.roper.multiattack.actions.multiattack.name: 'Multiattack'
monsters.roper.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.roper.bite.name: 'Bite'
monsters.roper.bite.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 22 (4d8 + 4) piercing damage.'
monsters.roper.tendril.name: 'Tendril'
monsters.roper.tendril.description: "*Melee Weapon Attack:* +7 to hit, reach 50 ft., one creature. *Hit:* The target is grappled (escape DC 15). Until the grapple ends, the target is restrained and has disadvantage on Strength checks and Strength saving throws, and the roper can't use the same tendril on another target."
monsters.roper.reel.name: 'Reel'
monsters.roper.reel.description: 'The roper pulls each creature grappled by it up to 25 feet straight toward it.'
monsters.rug-of-smothering.name: 'Rug of Smothering'
monsters.rug-of-smothering.antimagic-susceptibility.name: 'Antimagic Susceptibility'
monsters.rug-of-smothering.antimagic-susceptibility.description: "The rug is incapacitated while in the area of an *antimagic field.* If targeted by *dispel magic*, the rug must succeed on a Constitution saving throw against the caster's spell save DC or fall unconscious for 1 minute."
monsters.rug-of-smothering.damage-transfer.name: 'Damage Transfer'
monsters.rug-of-smothering.damage-transfer.description: 'While it is grappling a creature, the rug takes only half the damage dealt to it, and the creature grappled by the rug takes the other half.'
monsters.rug-of-smothering.false-appearance.name: 'False Appearance'
monsters.rug-of-smothering.false-appearance.description: 'While the rug remains motionless, it is indistinguishable from a normal rug.'
monsters.rug-of-smothering.smother.name: 'Smother'
monsters.rug-of-smothering.smother.description: "*Melee Weapon Attack:* +5 to hit, reach 5 ft., one Medium or smaller creature. *Hit:* The creature is grappled (escape DC 13). Until this grapple ends, the target is restrained, blinded, and at risk of suffocating, and the rug can't smother another target. In addition, at the start of each of the target's turns, the target takes 10 (2d6 + 3) bludgeoning damage."
monsters.rust-monster.name: 'Rust Monster'
monsters.rust-monster.iron-scent.name: 'Iron Scent'
monsters.rust-monster.iron-scent.description: 'The rust monster can pinpoint, by scent, the location of ferrous metal within 30 feet of it.'
monsters.rust-monster.rust-metal.name: 'Rust Metal'
monsters.rust-monster.rust-metal.description: 'Any nonmagical weapon made of metal that hits the rust monster corrodes. After dealing damage, the weapon takes a permanent and cumulative -1 penalty to damage rolls. If its penalty drops to -5, the weapon is destroyed. Nonmagical ammunition made of metal that hits the rust monster is destroyed after dealing damage.'
monsters.rust-monster.bite.name: 'Bite'
monsters.rust-monster.bite.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 5 (1d8 + 1) piercing damage.'
monsters.rust-monster.antennae.name: 'Antennae'
monsters.rust-monster.antennae.description: "The rust monster corrodes a nonmagical ferrous metal object it can see within 5 feet of it. If the object isn't being worn or carried, the touch destroys a 1-foot cube of it. If the object is being worn or carried by a creature, the creature can make a DC 11 Dexterity saving throw to avoid the rust monster's touch. If the object touched is either metal armor or a metal shield being worn or carried, its takes a permanent and cumulative -1 penalty to the AC it offers. Armor reduced to an AC of 10 or a shield that drops to a +0 bonus is destroyed. If the object touched is a held metal weapon, it rusts as described in the Rust Metal trait."
monsters.saber-toothed-tiger.name: 'Saber-Toothed Tiger'
monsters.saber-toothed-tiger.keen-smell.name: 'Keen Smell'
monsters.saber-toothed-tiger.keen-smell.description: 'The tiger has advantage on Wisdom (Perception) checks that rely on smell.'
monsters.saber-toothed-tiger.pounce.name: 'Pounce'
monsters.saber-toothed-tiger.pounce.description: 'If the tiger moves at least 20 feet straight toward a creature and then hits it with a claw attack on the same turn, that target must succeed on a DC 14 Strength saving throw or be knocked prone. If the target is prone, the tiger can make one bite attack against it as a bonus action.'
monsters.saber-toothed-tiger.bite.name: 'Bite'
monsters.saber-toothed-tiger.bite.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 10 (1d10 + 5) piercing damage.'
monsters.saber-toothed-tiger.claw.name: 'Claw'
monsters.saber-toothed-tiger.claw.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 12 (2d6 + 5) slashing damage.'
monsters.sahuagin.name: 'Sahuagin'
monsters.sahuagin.blood-frenzy.name: 'Blood Frenzy'
monsters.sahuagin.blood-frenzy.description: "The sahuagin has advantage on melee attack rolls against any creature that doesn't have all its hit points."
monsters.sahuagin.limited-amphibiousness.name: 'Limited Amphibiousness'
monsters.sahuagin.limited-amphibiousness.description: 'The sahuagin can breathe air and water, but it needs to be submerged at least once every 4 hours to avoid suffocating.'
monsters.sahuagin.shark-telepathy.name: 'Shark Telepathy'
monsters.sahuagin.shark-telepathy.description: 'The sahuagin can magically command any shark within 120 feet of it, using a limited telepathy.'
monsters.sahuagin.multiattack.name: 'Multiattack'
monsters.sahuagin.multiattack.description: 'The sahuagin makes two melee attacks: one with its bite and one with its claws or spear.'
monsters.sahuagin.multiattack.actions.multiattack.name: 'Multiattack'
monsters.sahuagin.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.sahuagin.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.sahuagin.multiattack.actions.multiattack.options.claws.name: 'Bite and claws'
monsters.sahuagin.multiattack.actions.multiattack.options.spear.name: 'Bite and spear'
monsters.sahuagin.bite.name: 'Bite'
monsters.sahuagin.bite.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 3 (1d4 + 1) piercing damage.'
monsters.sahuagin.claws.name: 'Claws'
monsters.sahuagin.claws.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 3 (1d4 + 1) slashing damage.'
monsters.sahuagin.spear.name: 'Spear'
monsters.sahuagin.spear.description: '*Melee or Ranged Weapon Attack:* +3 to hit, reach 5 ft. or range 20/60 ft., one target. *Hit:* 4 (1d6 + 1) piercing damage, or 5 (1d8 + 1) piercing damage if used with two hands to make a melee attack.'
monsters.salamander.name: 'Salamander'
monsters.salamander.heated-body.name: 'Heated Body'
monsters.salamander.heated-body.description: 'A creature that touches the salamander or hits it with a melee attack while within 5 feet of it takes 7 (2d6) fire damage.'
monsters.salamander.heated-weapons.name: 'Heated Weapons'
monsters.salamander.heated-weapons.description: 'Any metal melee weapon the salamander wields deals an extra 3 (1d6) fire damage on a hit (included in the attack).'
monsters.salamander.multiattack.name: 'Multiattack'
monsters.salamander.multiattack.description: 'The salamander makes two attacks: one with its spear and one with its tail.'
monsters.salamander.multiattack.actions.multiattack.name: 'Multiattack'
monsters.salamander.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.salamander.spear.name: 'Spear'
monsters.salamander.spear.description: '*Melee or Ranged Weapon Attack:* +7 to hit, reach 5 ft. or range 20 ft./60 ft., one target. *Hit:* 11 (2d6 + 4) piercing damage, or 13 (2d8 + 4) piercing damage if used with two hands to make a melee attack, plus 3 (1d6) fire damage.'
monsters.salamander.tail.name: 'Tail'
monsters.salamander.tail.description: "*Melee Weapon Attack:* +7 to hit, reach 10 ft., one target. *Hit:* 11 (2d6 + 4) bludgeoning damage plus 7 (2d6) fire damage, and the target is grappled (escape DC 14). Until this grapple ends, the target is restrained, the salamander can automatically hit the target with its tail, and the salamander can't make tail attacks against other targets."
monsters.satyr.name: 'Satyr'
monsters.satyr.magic-resistance.name: 'Magic Resistance'
monsters.satyr.magic-resistance.description: 'The satyr has advantage on saving throws against spells and other magical effects.'
monsters.satyr.ram.name: 'Ram'
monsters.satyr.ram.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 6 (2d4 + 1) bludgeoning damage.'
monsters.satyr.shortsword.name: 'Shortsword'
monsters.satyr.shortsword.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 6 (1d6 + 3) piercing damage.'
monsters.satyr.shortbow.name: 'Shortbow'
monsters.satyr.shortbow.description: '*Ranged Weapon Attack:* +5 to hit, range 80/320 ft., one target. *Hit:* 6 (1d6 + 3) piercing damage.'
monsters.scorpion.name: 'Scorpion'
monsters.scorpion.sting.name: 'Sting'
monsters.scorpion.sting.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one creature. *Hit:* 1 piercing damage, and the target must make a DC 9 Constitution saving throw, taking 4 (1d8) poison damage on a failed save, or half as much damage on a successful one.'
monsters.scout.name: 'Scout'
monsters.scout.keen-hearing-and-sight.name: 'Keen Hearing and Sight'
monsters.scout.keen-hearing-and-sight.description: 'The scout has advantage on Wisdom (Perception) checks that rely on hearing or sight.'
monsters.scout.multiattack.name: 'Multiattack'
monsters.scout.multiattack.description: 'The scout makes two melee attacks or two ranged attacks.'
monsters.scout.multiattack.actions.multiattack.name: 'Multiattack'
monsters.scout.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.scout.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.scout.multiattack.actions.multiattack.options.melee.name: 'Two shortsword attacks'
monsters.scout.multiattack.actions.multiattack.options.ranged.name: 'Two longbow attacks'
monsters.scout.shortsword.name: 'Shortsword'
monsters.scout.shortsword.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.scout.longbow.name: 'Longbow'
monsters.scout.longbow.description: '*Ranged Weapon Attack:* +4 to hit, ranged 150/600 ft., one target. *Hit:* 6 (1d8 + 2) piercing damage.'
monsters.sea-hag.name: 'Sea Hag'
monsters.sea-hag.amphibious.name: 'Amphibious'
monsters.sea-hag.amphibious.description: 'The hag can breathe air and water.'
monsters.sea-hag.horrific-appearance.name: 'Horrific Appearance'
monsters.sea-hag.horrific-appearance.description: |-
  Any humanoid that starts its turn within 30 feet of the hag and can see the hag's true form must make a DC 11 Wisdom saving throw. On a failed save, the creature is frightened for 1 minute. A creature can repeat the saving throw at the end of each of its turns, with disadvantage if the hag is within line of sight, ending the effect on itself on a success. If a creature's saving throw is successful or the effect ends for it, the creature is immune to the hag's Horrific Appearance for the next 24 hours.

  Unless the target is surprised or the revelation of the hag's true form is sudden, the target can avert its eyes and avoid making the initial saving throw. Until the start of its next turn, a creature that averts its eyes has disadvantage on attack rolls against the hag.
monsters.sea-hag.claws.name: 'Claws'
monsters.sea-hag.claws.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 10 (2d6 + 3) slashing damage.'
monsters.sea-hag.death-glare.name: 'Death Glare'
monsters.sea-hag.death-glare.description: 'The hag targets one frightened creature she can see within 30 feet of her. If the target can see the hag, it must succeed on a DC 11 Wisdom saving throw against this magic or drop to 0 hit points.'
monsters.sea-hag.illusory-appearance.name: 'Illusory Appearance'
monsters.sea-hag.illusory-appearance.description: |-
  The hag covers herself and anything she is wearing or carrying with a magical illusion that makes her look like an ugly creature of her general size and humanoid shape. The effect ends if the hag takes a bonus action to end it or if she dies.

  The changes wrought by this effect fail to hold up to physical inspection. For example, the hag could appear to have no claws, but someone touching her hand might feel the claws. Otherwise, a creature must take an action to visually inspect the illusion and succeed on a DC 16 Intelligence (Investigation) check to discern that the hag is disguised.
monsters.sea-horse.name: 'Sea Horse'
monsters.sea-horse.water-breathing.name: 'Water Breathing'
monsters.sea-horse.water-breathing.description: 'The sea horse can breathe only underwater.'
monsters.shadow.name: 'Shadow'
monsters.shadow.amorphous.name: 'Amorphous'
monsters.shadow.amorphous.description: 'The shadow can move through a space as narrow as 1 inch wide without squeezing.'
monsters.shadow.shadow-stealth.name: 'Shadow Stealth'
monsters.shadow.shadow-stealth.description: 'While in dim light or darkness, the shadow can take the Hide action as a bonus action.'
monsters.shadow.sunlight-weakness.name: 'Sunlight Weakness'
monsters.shadow.sunlight-weakness.description: 'While in sunlight, the shadow has disadvantage on attack rolls, ability checks, and saving throws.'
monsters.shadow.strength-drain.name: 'Strength Drain'
monsters.shadow.strength-drain.description: |-
  *Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 9 (2d6 + 2) necrotic damage, and the target's Strength score is reduced by 1d4. The target dies if this reduces its Strength to 0. Otherwise, the reduction lasts until the target finishes a short or long rest.

  If a non-evil humanoid dies from this attack, a new shadow rises from the corpse 1d4 hours later.
monsters.shambling-mound.name: 'Shambling Mound'
monsters.shambling-mound.lightning-absorption.name: 'Lightning Absorption'
monsters.shambling-mound.lightning-absorption.description: '. Whenever the shambling mound is subjected to lightning damage, it takes no damage and regains a number of hit points equal to the lightning damage dealt.'
monsters.shambling-mound.multiattack.name: 'Multiattack'
monsters.shambling-mound.multiattack.description: 'The shambling mound makes two slam attacks. If both attacks hit a Medium or smaller target, the target is grappled (escape DC 14), and the shambling mound uses its Engulf on it.'
monsters.shambling-mound.multiattack.actions.multiattack.name: 'Multiattack'
monsters.shambling-mound.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.shambling-mound.slam.name: 'Slam'
monsters.shambling-mound.slam.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) bludgeoning damage.'
monsters.shambling-mound.engulf.name: 'Engulf'
monsters.shambling-mound.engulf.description: "The shambling mound engulfs a Medium or smaller creature grappled by it. The engulfed target is blinded, restrained, and unable to breathe, and it must succeed on a DC 14 Constitution saving throw at the start of each of the mound's turns or take 13 (2d8 + 4) bludgeoning damage. If the mound moves, the engulfed target moves with it. The mound can have only one creature engulfed at a time."
monsters.shield-guardian.name: 'Shield Guardian'
monsters.shield-guardian.bound.name: 'Bound'
monsters.shield-guardian.bound.description: "The shield guardian is magically bound to an amulet. As long as the guardian and its amulet are on the same plane of existence, the amulet's wearer can telepathically call the guardian to travel to it, and the guardian knows the distance and direction to the amulet. If the guardian is within 60 feet of the amulet's wearer, half of any damage the wearer takes (rounded up) is transferred to the guardian."
monsters.shield-guardian.regeneration.name: 'Regeneration'
monsters.shield-guardian.regeneration.description: 'The shield guardian regains 10 hit points at the start of its turn if it has at least 1 hit point.'
monsters.shield-guardian.regeneration.actions.regenerate.name: 'Regenerate'
monsters.shield-guardian.regeneration.actions.regenerate.results.regenerated.name: 'Regenerated'
monsters.shield-guardian.spell-storing.name: 'Spell Storing'
monsters.shield-guardian.spell-storing.description: ". A spellcaster who wears the shield guardian's amulet can cause the guardian to store one spell of 4th level or lower. To do so, the wearer must cast the spell on the guardian. The spell has no effect but is stored within the guardian. When commanded to do so by the wearer or when a situation arises that was predefined by the spellcaster, the guardian casts the stored spell with any parameters set by the original caster, requiring no components. When the spell is cast or a new spell is stored, any previously stored spell is lost."
monsters.shield-guardian.multiattack.name: 'Multiattack'
monsters.shield-guardian.multiattack.description: 'The guardian makes two fist attacks.'
monsters.shield-guardian.multiattack.actions.multiattack.name: 'Multiattack'
monsters.shield-guardian.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.shield-guardian.fist.name: 'Fist'
monsters.shield-guardian.fist.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) bludgeoning damage.'
monsters.shield-guardian.shield.name: 'Shield'
monsters.shield-guardian.shield.description: "When a creature makes an attack against the wearer of the guardian's amulet, the guardian grants a +2 bonus to the wearer's AC if the guardian is within 5 feet of the wearer."
monsters.shrieker.name: 'Shrieker'
monsters.shrieker.false-appearance.name: 'False Appearance'
monsters.shrieker.false-appearance.description: 'While the shrieker remains motionless, it is indistinguishable from an ordinary fungus.'
monsters.shrieker.shriek.name: 'Shriek'
monsters.shrieker.shriek.description: "When bright light or a creature is within 30 feet of the shrieker, it emits a shriek audible within 300 feet of it. The shrieker continues to shriek until the disturbance moves out of range and for 1d4 of the shrieker's turns afterward."
monsters.silver-dragon-wyrmling.name: 'Silver Dragon Wyrmling'
monsters.silver-dragon-wyrmling.bite.name: 'Bite'
monsters.silver-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 9 (1d10 + 4) piercing damage.'
monsters.silver-dragon-wyrmling.breath-weapons.name: 'Breath Weapons'
monsters.silver-dragon-wyrmling.breath-weapons.description: 'The dragon uses one of the following breath weapons.'
monsters.silver-dragon-wyrmling.cold-breath.name: 'Cold Breath'
monsters.silver-dragon-wyrmling.cold-breath.description: 'The dragon exhales an icy blast in a 15- foot cone. Each creature in that area must make a DC 13 Constitution saving throw, taking 18 (4d8) cold damage on a failed save, or half as much damage on a successful one.'
monsters.silver-dragon-wyrmling.paralyzing-breath.name: 'Paralyzing Breath'
monsters.silver-dragon-wyrmling.paralyzing-breath.description: 'The dragon exhales paralyzing gas in a 15-foot cone. Each creature in that area must succeed on a DC 13 Constitution saving throw or be paralyzed for 1 minute. A creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.skeleton.name: 'Skeleton'
monsters.skeleton.shortsword.name: 'Shortsword'
monsters.skeleton.shortsword.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.skeleton.shortbow.name: 'Shortbow'
monsters.skeleton.shortbow.description: '*Ranged Weapon Attack:* +4 to hit, range 80/320 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.solar.name: 'Solar'
monsters.solar.angelic-weapons.name: 'Angelic Weapons'
monsters.solar.angelic-weapons.description: "The solar's weapon attacks are magical. When the solar hits with any weapon, the weapon deals an extra 6d8 radiant damage (included in the attack)."
monsters.solar.divine-awareness.name: 'Divine Awareness'
monsters.solar.divine-awareness.description: 'The solar knows if it hears a lie.'
monsters.solar.innate-spellcasting.name: 'Innate Spellcasting'
monsters.solar.innate-spellcasting.description: |-
  The solar's spellcasting ability is Charisma (spell save DC 25). It can innately cast the following spells, requiring no material components:

  - At will: *detect evil and good*, *invisibility* (self only)
  - 3/day each: *blade barrier*, *dispel evil and good*, *resurrection*
  - 1/day each: *commune*, *control weather*
monsters.solar.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.solar.magic-resistance.name: 'Magic Resistance'
monsters.solar.magic-resistance.description: 'The solar has advantage on saving throws against spells and other magical effects.'
monsters.solar.multiattack.name: 'Multiattack'
monsters.solar.multiattack.description: 'The solar makes two greatsword attacks.'
monsters.solar.multiattack.actions.multiattack.name: 'Multiattack'
monsters.solar.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.solar.greatsword.name: 'Greatsword'
monsters.solar.greatsword.description: '*Melee Weapon Attack:* +15 to hit, reach 5 ft., one target. *Hit:* 22 (4d6 + 8) slashing damage plus 27 (6d8) radiant damage.'
monsters.solar.slaying-longbow.name: 'Slaying Longbow'
monsters.solar.slaying-longbow.description: '*Ranged Weapon Attack:* +13 to hit, range 150/600 ft., one target. *Hit:* 15 (2d8 + 6) piercing damage plus 27 (6d8) radiant damage. If the target is a creature that has 100 hit points or fewer, it must succeed on a DC 15 Constitution saving throw or die.'
monsters.solar.flying-sword.name: 'Flying Sword'
monsters.solar.flying-sword.description: "The solar releases its greatsword to hover magically in an unoccupied space within 5 feet of it. If the solar can see the sword, the solar can mentally command it as a bonus action to fly up to 50 feet and either make one attack against a target or return to the solar's hands. If the hovering sword is targeted by any effect, the solar is considered to be holding it. The hovering sword falls if the solar dies."
monsters.solar.healing-touch.name: 'Healing Touch (4/Day)'
monsters.solar.healing-touch.description: 'The solar touches another creature. The target magically regains 40 (8d8 + 4) hit points and is freed from any curse, disease, poison, blindness, or deafness.'
monsters.solar.teleport.name: 'Teleport'
monsters.solar.teleport.description: 'The solar magically teleports, along with any equipment it is wearing or carrying, up to 120 feet to an unoccupied space it can see.'
monsters.solar.searing-burst.name: 'Searing Burst'
monsters.solar.searing-burst.description: 'The solar emits magical, divine energy. Each creature of its choice in a 10-foot radius must make a DC 23 Dexterity saving throw, taking 14 (4d6) fire damage plus 14 (4d6) radiant damage on a failed save, or half as much damage on a successful one.'
monsters.solar.blinding-gaze.name: 'Blinding Gaze'
monsters.solar.blinding-gaze.description: 'The solar targets one creature it can see within 30 feet of it. If the target can see it, the target must succeed on a DC 15 Constitution saving throw or be blinded until magic such as the *lesser restoration* spell removes the blindness.'
monsters.specter.name: 'Specter'
monsters.specter.incorporeal-movement.name: 'Incorporeal Movement'
monsters.specter.incorporeal-movement.description: 'The specter can move through other creatures and objects as if they were difficult terrain. It takes 5 (1d10) force damage if it ends its turn inside an object.'
monsters.specter.sunlight-sensitivity.name: 'Sunlight Sensitivity'
monsters.specter.sunlight-sensitivity.description: 'While in sunlight, the specter has disadvantage on attack rolls, as well as on Wisdom (Perception) checks that rely on sight.'
monsters.specter.life-drain.name: 'Life Drain'
monsters.specter.life-drain.description: '*Melee Spell Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 10 (3d6) necrotic damage. The target must succeed on a DC 10 Constitution saving throw or its hit point maximum is reduced by an amount equal to the damage taken. This reduction lasts until the creature finishes a long rest. The target dies if this effect reduces its hit point maximum to 0.'
monsters.spider.name: 'Spider'
monsters.spider.spider-climb.name: 'Spider Climb'
monsters.spider.spider-climb.description: 'The spider can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.spider.web-sense.name: 'Web Sense'
monsters.spider.web-sense.description: 'While in contact with a web, the spider knows the exact location of any other creature in contact with the same web.'
monsters.spider.web-walker.name: 'Web Walker'
monsters.spider.web-walker.description: 'The spider ignores movement restrictions caused by webbing.'
monsters.spider.bite.name: 'Bite'
monsters.spider.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 1 piercing damage, and the target must succeed on a DC 9 Constitution saving throw or take 2 (1d4) poison damage.'
monsters.spirit-naga.name: 'Spirit Naga'
monsters.spirit-naga.rejuvenation.name: 'Rejuvenation'
monsters.spirit-naga.rejuvenation.description: 'If it dies, the naga returns to life in 1d6 days and regains all its hit points. Only a *wish* spell can prevent this trait from functioning.'
monsters.spirit-naga.spellcasting.name: 'Spellcasting'
monsters.spirit-naga.spellcasting.description: |-
  The naga is a 10th-level spellcaster. Its spellcasting ability is Intelligence (spell save DC 14, +6 to hit with spell attacks), and it needs only verbal components to cast its spells. It has the following wizard spells prepared:

  - Cantrips (at will): *mage hand*, *minor illusion*, *ray of frost*
  - 1st level (4 slots): *charm person*, *detect magic*, *sleep*
  - 2nd level (3 slots): *detect thoughts*, *hold person*
  - 3rd level (3 slots): *lightning bolt*, *water breathing*
  - 4th level (3 slots): *blight*, *dimension door*
  - 5th level (2 slots): *dominate person*
monsters.spirit-naga.bite.name: 'Bite'
monsters.spirit-naga.bite.description: '*Melee Weapon Attack:* +7 to hit, reach 10 ft., one creature. *Hit:* 7 (1d6 + 4) piercing damage, and the target must make a DC 13 Constitution saving throw, taking 31 (7d8) poison damage on a failed save, or half as much damage on a successful one.'
monsters.sprite.name: 'Sprite'
monsters.sprite.longsword.name: 'Longsword'
monsters.sprite.longsword.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one target. *Hit:* 1 slashing damage.'
monsters.sprite.shortbow.name: 'Shortbow'
monsters.sprite.shortbow.description: '*Ranged Weapon Attack:* +6 to hit, range 40/160 ft., one target. *Hit:* 1 piercing damage, and the target must succeed on a DC 10 Constitution saving throw or become poisoned for 1 minute. If its saving throw result is 5 or lower, the poisoned target falls unconscious for the same duration, or until it takes damage or another creature takes an action to shake it awake.'
monsters.sprite.heart-sight.name: 'Heart Sight'
monsters.sprite.heart-sight.description: "The sprite touches a creature and magically knows the creature's current emotional state. If the target fails a DC 10 Charisma saving throw, the sprite also knows the creature's alignment. Celestials, fiends, and undead automatically fail the saving throw."
monsters.sprite.invisibility.name: 'Invisibility'
monsters.sprite.invisibility.description: 'The sprite magically turns invisible until it attacks or casts a spell, or until its concentration ends (as if concentrating on a spell). Any equipment the sprite wears or carries is invisible with it.'
monsters.spy.name: 'Spy'
monsters.spy.cunning-action.name: 'Cunning Action'
monsters.spy.cunning-action.description: 'On each of its turns, the spy can use a bonus action to take the Dash, Disengage, or Hide action.'
monsters.spy.sneak-attack.name: 'Sneak Attack (1/Turn)'
monsters.spy.sneak-attack.description: "The spy deals an extra 7 (2d6) damage when it hits a target with a weapon attack and has advantage on the attack roll, or when the target is within 5 feet of an ally of the spy that isn't incapacitated and the spy doesn't have disadvantage on the attack roll."
monsters.spy.multiattack.name: 'Multiattack'
monsters.spy.multiattack.description: 'The spy makes two melee attacks.'
monsters.spy.multiattack.actions.multiattack.name: 'Multiattack'
monsters.spy.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.spy.shortsword.name: 'Shortsword'
monsters.spy.shortsword.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.spy.hand-crossbow.name: 'Hand Crossbow'
monsters.spy.hand-crossbow.description: '*Ranged Weapon Attack:* +4 to hit, range 30/120 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.steam-mephit.name: 'Steam Mephit'
monsters.steam-mephit.death-burst.name: 'Death Burst'
monsters.steam-mephit.death-burst.description: 'When the mephit dies, it explodes in a cloud of steam. Each creature within 5 feet of the mephit must succeed on a DC 10 Dexterity saving throw or take 4 (1d8) fire damage.'
monsters.steam-mephit.innate-spellcasting.name: 'Innate Spellcasting (1/Day)'
monsters.steam-mephit.innate-spellcasting.description: 'The mephit can innately cast *blur*, requiring no material components. Its innate spellcasting ability is Charisma.'
monsters.steam-mephit.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.steam-mephit.claws.name: 'Claws'
monsters.steam-mephit.claws.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one creature. *Hit:* 2 (1d4) slashing damage plus 2 (1d4) fire damage.'
monsters.steam-mephit.steam-breath.name: 'Steam Breath'
monsters.steam-mephit.steam-breath.description: 'The mephit exhales a 15- foot cone of scalding steam. Each creature in that area must succeed on a DC 10 Dexterity saving throw, taking 4 (1d8) fire damage on a failed save, or half as much damage on a successful one.'
monsters.stirge.name: 'Stirge'
monsters.stirge.blood-drain.name: 'Blood Drain'
monsters.stirge.blood-drain.description: "*Melee Weapon Attack:* +5 to hit, reach 5 ft., one creature. *Hit:* 5 (1d4 + 3) piercing damage, and the stirge attaches to the target. While attached, the stirge doesn't attack. Instead, at the start of each of the stirge's turns, the target loses 5 (1d4 + 3) hit points due to blood loss. The stirge can detach itself by spending 5 feet of its movement. It does so after it drains 10 hit points of blood from the target or the target dies. A creature, including the target, can use its action to detach the stirge."
monsters.stone-giant.name: 'Stone Giant'
monsters.stone-giant.stone-camouflage.name: 'Stone Camouflage'
monsters.stone-giant.stone-camouflage.description: 'The giant has advantage on Dexterity (Stealth) checks made to hide in rocky terrain.'
monsters.stone-giant.multiattack.name: 'Multiattack'
monsters.stone-giant.multiattack.description: 'The giant makes two greatclub attacks.'
monsters.stone-giant.multiattack.actions.multiattack.name: 'Multiattack'
monsters.stone-giant.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.stone-giant.greatclub.name: 'Greatclub'
monsters.stone-giant.greatclub.description: '*Melee Weapon Attack:* +9 to hit, reach 15 ft., one target. *Hit:* 19 (3d8 + 6) bludgeoning damage.'
monsters.stone-giant.rock.name: 'Rock'
monsters.stone-giant.rock.description: '*Ranged Weapon Attack:* +9 to hit, range 60/240 ft., one target. *Hit:* 28 (4d10 + 6) bludgeoning damage. If the target is a creature, it must succeed on a DC 17 Strength saving throw or be knocked prone.'
monsters.stone-giant.rock-catching.name: 'Rock Catching'
monsters.stone-giant.rock-catching.description: 'If a rock or similar object is hurled at the giant, the giant can, with a successful DC 10 Dexterity saving throw, catch the missile and take no bludgeoning damage from it.'
monsters.stone-golem.name: 'Stone Golem'
monsters.stone-golem.immutable-form.name: 'Immutable Form'
monsters.stone-golem.immutable-form.description: 'The golem is immune to any spell or effect that would alter its form.'
monsters.stone-golem.magic-resistance.name: 'Magic Resistance'
monsters.stone-golem.magic-resistance.description: 'The golem has advantage on saving throws against spells and other magical effects.'
monsters.stone-golem.magic-weapons.name: 'Magic Weapons'
monsters.stone-golem.magic-weapons.description: "The golem's weapon attacks are magical."
monsters.stone-golem.multiattack.name: 'Multiattack'
monsters.stone-golem.multiattack.description: 'The golem makes two slam attacks.'
monsters.stone-golem.multiattack.actions.multiattack.name: 'Multiattack'
monsters.stone-golem.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.stone-golem.slam.name: 'Slam'
monsters.stone-golem.slam.description: '*Melee Weapon Attack:* +10 to hit, reach 5 ft., one target. *Hit:* 19 (3d8 + 6) bludgeoning damage.'
monsters.stone-golem.slow.name: 'Slow'
monsters.stone-golem.slow.description: "The golem targets one or more creatures it can see within 10 feet of it. Each target must make a DC 17 Wisdom saving throw against this magic. On a failed save, a target can't use reactions, its speed is halved, and it can't make more than one attack on its turn. In addition, the target can take either an action or a bonus action on its turn, not both. These effects last for 1 minute. A target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success."
monsters.storm-giant.name: 'Storm Giant'
monsters.storm-giant.amphibious.name: 'Amphibious'
monsters.storm-giant.amphibious.description: 'The giant can breathe air and water.'
monsters.storm-giant.innate-spellcasting.name: 'Innate Spellcasting'
monsters.storm-giant.innate-spellcasting.description: |-
  The giant's innate spellcasting ability is Charisma (spell save DC 17). It can innately cast the following spells, requiring no material components:

  - At will: *detect magic*, *feather fall*, *levitate*, *light*
  - 3/day each: *control weather*, *water breathing*
monsters.storm-giant.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.storm-giant.multiattack.name: 'Multiattack'
monsters.storm-giant.multiattack.description: 'The giant makes two greatsword attacks.'
monsters.storm-giant.multiattack.actions.multiattack.name: 'Multiattack'
monsters.storm-giant.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.storm-giant.greatsword.name: 'Greatsword'
monsters.storm-giant.greatsword.description: '*Melee Weapon Attack:* +14 to hit, reach 10 ft., one target. *Hit:* 30 (6d6 + 9) slashing damage.'
monsters.storm-giant.rock.name: 'Rock'
monsters.storm-giant.rock.description: '*Ranged Weapon Attack:* +14 to hit, range 60/240 ft., one target. *Hit:* 35 (4d12 + 9) bludgeoning damage.'
monsters.storm-giant.lightning-strike.name: 'Lightning Strike'
monsters.storm-giant.lightning-strike.description: 'The giant hurls a magical lightning bolt at a point it can see within 500 feet of it. Each creature within 10 feet of that point must make a DC 17 Dexterity saving throw, taking 54 (12d8) lightning damage on a failed save, or half as much damage on a successful one.'
monsters.succubus-incubus.name: 'Succubus/Incubus'
monsters.succubus-incubus.telepathic-bond.name: 'Telepathic Bond'
monsters.succubus-incubus.telepathic-bond.description: "The fiend ignores the range restriction on its telepathy when communicating with a creature it has charmed. The two don't even need to be on the same plane of existence."
monsters.succubus-incubus.shapechanger.name: 'Shapechanger'
monsters.succubus-incubus.shapechanger.description: "The fiend can use its action to polymorph into a Small or Medium humanoid, or back into its true form. Without wings, the fiend loses its flying speed. Other than its size and speed, its statistics are the same in each form. Any equipment it is wearing or carrying isn't transformed. It reverts to its true form if it dies."
monsters.succubus-incubus.claw.name: 'Claw (Fiend Form Only)'
monsters.succubus-incubus.claw.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 6 (1d6 + 3) slashing damage.'
monsters.succubus-incubus.charm.name: 'Charm'
monsters.succubus-incubus.charm.description: |-
  One humanoid the fiend can see within 30 feet of it must succeed on a DC 15 Wisdom saving throw or be magically charmed for 1 day. The charmed target obeys the fiend's verbal or telepathic commands. If the target suffers any harm or receives a suicidal command, it can repeat the saving throw, ending the effect on a success. If the target successfully saves against the effect, or if the effect on it ends, the target is immune to this fiend's Charm for the next 24 hours.

  The fiend can have only one target charmed at a time. If it charms another, the effect on the previous target ends.
monsters.succubus-incubus.draining-kiss.name: 'Draining Kiss'
monsters.succubus-incubus.draining-kiss.description: "The fiend kisses a creature charmed by it or a willing creature. The target must make a DC 15 Constitution saving throw against this magic, taking 32 (5d10 + 5) psychic damage on a failed save, or half as much damage on a successful one. The target's hit point maximum is reduced by an amount equal to the damage taken. This reduction lasts until the target finishes a long rest. The target dies if this effect reduces its hit point maximum to 0."
monsters.succubus-incubus.etherealness.name: 'Etherealness'
monsters.succubus-incubus.etherealness.description: 'The fiend magically enters the Ethereal Plane from the Material Plane, or vice versa.'
monsters.swarm-of-bats.name: 'Swarm of Bats'
monsters.swarm-of-bats.echolocation.name: 'Echolocation'
monsters.swarm-of-bats.echolocation.description: "The swarm can't use its blindsight while deafened."
monsters.swarm-of-bats.keen-hearing.name: 'Keen Hearing'
monsters.swarm-of-bats.keen-hearing.description: 'The swarm has advantage on Wisdom (Perception) checks that rely on hearing.'
monsters.swarm-of-bats.swarm.name: 'Swarm'
monsters.swarm-of-bats.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny bat. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-bats.bites.name: 'Bites'
monsters.swarm-of-bats.bites.description: "*Melee Weapon Attack:* +4 to hit, reach 0 ft., one creature in the swarm's space. *Hit:* 5 (2d4) piercing damage, or 2 (1d4) piercing damage if the swarm has half of its hit points or fewer."
monsters.swarm-of-beetles.name: 'Swarm of Beetles'
monsters.swarm-of-beetles.swarm.name: 'Swarm'
monsters.swarm-of-beetles.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny insect. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-beetles.bites.name: 'Bites'
monsters.swarm-of-beetles.bites.description: "*Melee Weapon Attack:* +3 to hit, reach 0 ft., one target in the swarm's space. *Hit:* 10 (4d4) piercing damage, or 5 (2d4) piercing damage if the swarm has half of its hit points or fewer."
monsters.swarm-of-centipedes.name: 'Swarm of Centipedes'
monsters.swarm-of-centipedes.swarm.name: 'Swarm'
monsters.swarm-of-centipedes.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny insect. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-centipedes.bites.name: 'Bites'
monsters.swarm-of-centipedes.bites.description: |-
  *Melee Weapon Attack:* +3 to hit, reach 0 ft., one target in the swarm's space. *Hit:* 10 (4d4) piercing damage, or 5 (2d4) piercing damage if the swarm has half of its hit points or fewer.

  A creature reduced to 0 hit points by a swarm of centipedes is stable but poisoned for 1 hour, even after regaining hit points, and paralyzed while poisoned in this way.
monsters.swarm-of-insects.name: 'Swarm of Insects'
monsters.swarm-of-insects.swarm.name: 'Swarm'
monsters.swarm-of-insects.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny insect. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-insects.bites.name: 'Bites'
