monsters.swarm-of-poisonous-snakes.name: 'Swarm of Poisonous Snakes'
monsters.swarm-of-poisonous-snakes.swarm.name: 'Swarm'
monsters.swarm-of-poisonous-snakes.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny snake. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-poisonous-snakes.bites.name: 'Bites'
monsters.swarm-of-poisonous-snakes.bites.description: "*Melee Weapon Attack:* +6 to hit, reach 0 ft., one creature in the swarm's space. *Hit:* 7 (2d6) piercing damage, or 3 (1d6) piercing damage if the swarm has half of its hit points or fewer. The target must make a DC 10 Constitution saving throw, taking 14 (4d6) poison damage on a failed save, or half as much damage on a successful one."
monsters.swarm-of-quippers.name: 'Swarm of Quippers'
monsters.swarm-of-quippers.blood-frenzy.name: 'Blood Frenzy'
monsters.swarm-of-quippers.blood-frenzy.description: "The swarm has advantage on melee attack rolls against any creature that doesn't have all its hit points."
monsters.swarm-of-quippers.swarm.name: 'Swarm'
monsters.swarm-of-quippers.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny quipper. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-quippers.water-breathing.name: 'Water Breathing'
monsters.swarm-of-quippers.water-breathing.description: 'The swarm can breathe only underwater.'
monsters.swarm-of-quippers.bites.name: 'Bites'
monsters.swarm-of-quippers.bites.description: "*Melee Weapon Attack:* +5 to hit, reach 0 ft., one creature in the swarm's space. *Hit:* 14 (4d6) piercing damage, or 7 (2d6) piercing damage if the swarm has half of its hit points or fewer."
monsters.swarm-of-rats.name: 'Swarm of Rats'
monsters.swarm-of-rats.keen-smell.name: 'Keen Smell'
