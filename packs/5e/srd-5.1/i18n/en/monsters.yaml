monsters.lizardfolk.multiattack.actions.multiattack.options.javelin-shield.name: 'Javelin and spiked shield'
monsters.lizardfolk.bite.name: 'Bite'
monsters.lizardfolk.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.lizardfolk.heavy-club.name: 'Heavy Club'
monsters.lizardfolk.heavy-club.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) bludgeoning damage.'
monsters.lizardfolk.javelin.name: 'Javelin'
monsters.lizardfolk.javelin.description: '*Melee or Ranged Weapon Attack:* +4 to hit, reach 5 ft. or range 30/120 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.lizardfolk.spiked-shield.name: 'Spiked Shield'
monsters.lizardfolk.spiked-shield.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.mage.name: 'Mage'
monsters.mage.spellcasting.name: 'Spellcasting'
monsters.mage.spellcasting.description: |-
  The mage is a 9th-level spellcaster. Its spellcasting ability is Intelligence (spell save DC 14, +6 to hit with spell attacks). The mage has the following wizard spells prepared:

  - Cantrips (at will): *fire bolt*, *light*, *mage hand*, *prestidigitation*
  - 1st level (4 slots): *detect magic*, *mage armor*, *magic missile*, *shield*
  - 2nd level (3 slots): *misty step*, *suggestion*
  - 3rd level (3 slots): *counterspell*, *fireball*, *fly*
  - 4th level (3 slots): *greater invisibility*, *ice storm*
  - 5th level (1 slot): *cone of cold*
monsters.mage.dagger.name: 'Dagger'
monsters.mage.dagger.description: '*Melee or Ranged Weapon Attack:* +5 to hit, reach 5 ft. or range 20/60 ft., one target. *Hit:* 4 (1d4 + 2) piercing damage.'
monsters.magma-mephit.name: 'Magma Mephit'
monsters.magma-mephit.death-burst.name: 'Death Burst'
monsters.magma-mephit.death-burst.description: 'When the mephit dies, it explodes in a burst of lava. Each creature within 5 feet of it must make a DC 11 Dexterity saving throw, taking 7 (2d6) fire damage on a failed save, or half as much damage on a successful one.'
monsters.magma-mephit.false-appearance.name: 'False Appearance'
monsters.magma-mephit.false-appearance.description: 'While the mephit remains motionless, it is indistinguishable from an ordinary mound of magma.'
monsters.magma-mephit.innate-spellcasting.name: 'Innate Spellcasting (1/Day)'
monsters.magma-mephit.innate-spellcasting.description: 'The mephit can innately cast *heat metal* (spell save DC 10), requiring no material components. Its innate spellcasting ability is Charisma.'
monsters.magma-mephit.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.magma-mephit.claws.name: 'Claws'
monsters.magma-mephit.claws.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one creature. *Hit:* 3 (1d4 + 1) slashing damage plus 2 (1d4) fire damage.'
monsters.magma-mephit.fire-breath.name: 'Fire Breath'
monsters.magma-mephit.fire-breath.description: 'The mephit exhales a 15-foot cone of fire. Each creature in that area must make a DC 11 Dexterity saving throw, taking 7 (2d6) fire damage on a failed save, or half as much damage on a successful one.'
monsters.magmin.name: 'Magmin'
monsters.magmin.death-burst.name: 'Death Burst'
monsters.magmin.death-burst.description: "When the magmin dies, it explodes in a burst of fire and magma. Each creature within 10 feet of it must make a DC 11 Dexterity saving throw, taking 7 (2d6) fire damage on a failed save, or half as much damage on a successful one. Flammable objects that aren't being worn or carried in that area are ignited."
monsters.magmin.ignited-illumination.name: 'Ignited Illumination'
monsters.magmin.ignited-illumination.description: 'As a bonus action, the magmin can set itself ablaze or extinguish its flames. While ablaze, the magmin sheds bright light in a 10-foot radius and dim light for an additional 10 feet.'
monsters.magmin.touch.name: 'Touch'
monsters.magmin.touch.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (2d6) fire damage. If the target is a creature or a flammable object, it ignites. Until a creature takes an action to douse the fire, the target takes 3 (1d6) fire damage at the end of each of its turns.'
monsters.mammoth.name: 'Mammoth'
monsters.mammoth.trampling-charge.name: 'Trampling Charge'
monsters.mammoth.trampling-charge.description: 'If the mammoth moves at least 20 feet straight toward a creature and then hits it with a gore attack on the same turn, that target must succeed on a DC 18 Strength saving throw or be knocked prone. If the target is prone, the mammoth can make one stomp attack against it as a bonus action.'
monsters.mammoth.gore.name: 'Gore'
monsters.mammoth.gore.description: '*Melee Weapon Attack:* +10 to hit, reach 10 ft., one target. *Hit:* 25 (4d8 + 7) piercing damage.'
monsters.mammoth.stomp.name: 'Stomp'
monsters.mammoth.stomp.description: '*Melee Weapon Attack:* +10 to hit, reach 5 ft., one prone creature. *Hit:* 29 (4d10 + 7) bludgeoning damage.'
monsters.manticore.name: 'Manticore'
monsters.manticore.tail-spike-regrowth.name: 'Tail Spike Regrowth'
monsters.manticore.tail-spike-regrowth.description: 'The manticore has twenty-four tail spikes. Used spikes regrow when the manticore finishes a long rest.'
monsters.manticore.multiattack.name: 'Multiattack'
monsters.manticore.multiattack.description: 'The manticore makes three attacks: one with its bite and two with its claws or three with its tail spikes.'
monsters.manticore.multiattack.actions.multiattack.name: 'Multiattack'
monsters.manticore.multiattack.actions.multiattack.results.done.name: 'Done'
