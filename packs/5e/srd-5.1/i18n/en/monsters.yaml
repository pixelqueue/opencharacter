monsters.brown-bear.claws.name: 'Claws'
monsters.brown-bear.claws.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) slashing damage.'
monsters.bugbear.name: 'Bugbear'
monsters.bugbear.brute.name: 'Brute'
monsters.bugbear.brute.description: 'A melee weapon deals one extra die of its damage when the bugbear hits with it (included in the attack).'
monsters.bugbear.surprise-attack.name: 'Surprise Attack'
monsters.bugbear.surprise-attack.description: 'If the bugbear surprises a creature and hits it with an attack during the first round of combat, the target takes an extra 7 (2d6) damage from the attack.'
monsters.bugbear.morningstar.name: 'Morningstar'
monsters.bugbear.morningstar.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 11 (2d8 + 2) piercing damage.'
monsters.bugbear.javelin.name: 'Javelin'
monsters.bugbear.javelin.description: '*Melee or Ranged Weapon Attack:* +4 to hit, reach 5 ft. or range 30/120 ft., one target. *Hit:* 9 (2d6 + 2) piercing damage in melee or 5 (1d6 + 2) piercing damage at range.'
monsters.bulette.name: 'Bulette'
monsters.bulette.standing-leap.name: 'Standing Leap'
monsters.bulette.standing-leap.description: "The bulette's long jump is up to 30 feet and its high jump is up to 15 feet, with or without a running start."
monsters.bulette.bite.name: 'Bite'
monsters.bulette.bite.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 30 (4d12 + 4) piercing damage.'
monsters.bulette.deadly-leap.name: 'Deadly Leap'
monsters.bulette.deadly-leap.description: "If the bulette jumps at least 15 feet as part of its movement, it can then use this action to land on its feet in a space that contains one or more other creatures. Each of those creatures must succeed on a DC 16 Strength or Dexterity saving throw (target's choice) or be knocked prone and take 14 (3d6 + 4) bludgeoning damage plus 14 (3d6 + 4) slashing damage. On a successful save, the creature takes only half the damage, isn't knocked prone, and is pushed 5 feet out of the bulette's space into an unoccupied space of the creature's choice. If no unoccupied space is within range, the creature instead falls prone in the bulette's space."
monsters.camel.name: 'Camel'
monsters.camel.bite.name: 'Bite'
monsters.camel.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 2 (1d4) bludgeoning damage.'
monsters.cat.name: 'Cat'
monsters.cat.keen-smell.name: 'Keen Smell'
monsters.cat.keen-smell.description: 'The cat has advantage on Wisdom (Perception) checks that rely on smell.'
monsters.cat.claws.name: 'Claws'
monsters.cat.claws.description: '*Melee Weapon Attack:* +0 to hit, reach 5 ft., one target. *Hit:* 1 slashing damage.'
monsters.centaur.name: 'Centaur'
monsters.centaur.charge.name: 'Charge'
monsters.centaur.charge.description: 'If the centaur moves at least 30 feet straight toward a target and then hits it with a pike attack on the same turn, the target takes an extra 10 (3d6) piercing damage.'
monsters.centaur.multiattack.name: 'Multiattack'
monsters.centaur.multiattack.description: 'The centaur makes two attacks: one with its pike and one with its hooves or two with its longbow.'
monsters.centaur.multiattack.actions.multiattack.name: 'Multiattack'
monsters.centaur.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.centaur.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.centaur.multiattack.actions.multiattack.options.melee.name: 'Pike and hooves'
monsters.centaur.multiattack.actions.multiattack.options.ranged.name: 'Two longbow attacks'
monsters.centaur.pike.name: 'Pike'
monsters.centaur.pike.description: '*Melee Weapon Attack:* +6 to hit, reach 10 ft., one target. *Hit:* 9 (1d10 + 4) piercing damage.'
monsters.centaur.hooves.name: 'Hooves'
monsters.centaur.hooves.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) bludgeoning damage.'
monsters.centaur.longbow.name: 'Longbow'
monsters.centaur.longbow.description: '*Ranged Weapon Attack:* +4 to hit, range 150/600 ft., one target. *Hit:* 6 (1d8 + 2) piercing damage.'
monsters.chain-devil.name: 'Chain Devil'
monsters.chain-devil.devils-sight.name: "Devil's Sight"
monsters.chain-devil.devils-sight.description: "Magical darkness doesn't impede the devil's darkvision."
monsters.chain-devil.magic-resistance.name: 'Magic Resistance'
monsters.chain-devil.magic-resistance.description: 'The devil has advantage on saving throws against spells and other magical effects.'
monsters.chain-devil.multiattack.name: 'Multiattack'
monsters.chain-devil.multiattack.description: 'The devil makes two attacks with its chains.'
monsters.chain-devil.multiattack.actions.multiattack.name: 'Multiattack'
monsters.chain-devil.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.chain-devil.chain.name: 'Chain'
monsters.chain-devil.chain.description: "*Melee Weapon Attack:* +8 to hit, reach 10 ft., one target. *Hit:* 11 (2d6 + 4) slashing damage. The target is grappled (escape DC 14) if the devil isn't already grappling a creature. Until this grapple ends, the target is restrained and takes 7 (2d6) piercing damage at the start of each of its turns."
monsters.chain-devil.animate-chains.name: 'Animate Chains (Recharges after a Short or Long Rest)'
monsters.chain-devil.animate-chains.description: |-
  Up to four chains the devil can see within 60 feet of it magically sprout razor-edged barbs and animate under the devil's control, provided that the chains aren't being worn or carried.

  Each animated chain is an object with AC 20, 20 hit points, resistance to piercing damage, and immunity to psychic and thunder damage. When the devil uses Multiattack on its turn, it can use each animated chain to make one additional chain attack. An animated chain can grapple one creature of its own but can't make attacks while grappling. An animated chain reverts to its inanimate state if reduced to 0 hit points or if the devil is incapacitated or dies.
monsters.chain-devil.unnerving-mask.name: 'Unnerving Mask'
monsters.chain-devil.unnerving-mask.description: "When a creature the devil can see starts its turn within 30 feet of the devil, the devil can create the illusion that it looks like one of the creature's departed loved ones or bitter enemies. If the creature can see the devil, it must succeed on a DC 14 Wisdom saving throw or be frightened until the end of its turn."
monsters.chimera.name: 'Chimera'
monsters.chimera.multiattack.name: 'Multiattack'
monsters.chimera.multiattack.description: 'The chimera makes three attacks: one with its bite, one with its horns, and one with its claws. When its fire breath is available, it can use the breath in place of its bite or horns.'
monsters.chimera.multiattack.actions.multiattack.name: 'Multiattack'
monsters.chimera.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.chimera.bite.name: 'Bite'
monsters.chimera.bite.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) piercing damage.'
monsters.chimera.horns.name: 'Horns'
monsters.chimera.horns.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 10 (1d12 + 4) bludgeoning damage.'
monsters.chimera.claws.name: 'Claws'
monsters.chimera.claws.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) slashing damage.'
monsters.chimera.fire-breath.name: 'Fire Breath'
monsters.chimera.fire-breath.description: 'The dragon head exhales fire in a 15-foot cone. Each creature in that area must make a DC 15 Dexterity saving throw, taking 31 (7d8) fire damage on a failed save, or half as much damage on a successful one.'
monsters.chuul.name: 'Chuul'
monsters.chuul.amphibious.name: 'Amphibious'
monsters.chuul.amphibious.description: 'The chuul can breathe air and water.'
monsters.chuul.sense-magic.name: 'Sense Magic'
monsters.chuul.sense-magic.description: "The chuul senses magic within 120 feet of it at will. This trait otherwise works like the *detect magic* spell but isn't itself magical."
monsters.chuul.multiattack.name: 'Multiattack'
monsters.chuul.multiattack.description: 'The chuul makes two pincer attacks. If the chuul is grappling a creature, the chuul can also use its tentacles once.'
monsters.chuul.multiattack.actions.multiattack.name: 'Multiattack'
monsters.chuul.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.chuul.pincer.name: 'Pincer'
monsters.chuul.pincer.description: "*Melee Weapon Attack:* +6 to hit, reach 10 ft., one target. *Hit:* 11 (2d6 + 4) bludgeoning damage. The target is grappled (escape DC 14) if it is a Large or smaller creature and the chuul doesn't have two other creatures grappled."
monsters.chuul.tentacles.name: 'Tentacles'
monsters.chuul.tentacles.description: 'One creature grappled by the chuul must succeed on a DC 13 Constitution saving throw or be poisoned for 1 minute. Until this poison ends, the target is paralyzed. The target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.clay-golem.name: 'Clay Golem'
monsters.clay-golem.acid-absorption.name: 'Acid Absorption'
monsters.clay-golem.acid-absorption.description: '. Whenever the golem is subjected to acid damage, it takes no damage and instead regains a number of hit points equal to the acid damage dealt.'
monsters.clay-golem.berserk.name: 'Berserk'
monsters.clay-golem.berserk.description: 'Whenever the golem starts its turn with 60 hit points or fewer, roll a d6. On a 6, the golem goes berserk. On each of its turns while berserk, the golem attacks the nearest creature it can see. If no creature is near enough to move to and attack, the golem attacks an object, with preference for an object smaller than itself. Once the golem goes berserk, it continues to do so until it is destroyed or regains all its hit points.'
monsters.clay-golem.immutable-form.name: 'Immutable Form'
monsters.clay-golem.immutable-form.description: 'The golem is immune to any spell or effect that would alter its form.'
monsters.clay-golem.magic-resistance.name: 'Magic Resistance'
monsters.clay-golem.magic-resistance.description: 'The golem has advantage on saving throws against spells and other magical effects.'
monsters.clay-golem.magic-weapons.name: 'Magic Weapons'
monsters.clay-golem.magic-weapons.description: "The golem's weapon attacks are magical."
monsters.clay-golem.multiattack.name: 'Multiattack'
monsters.clay-golem.multiattack.description: 'The golem makes two slam attacks.'
monsters.clay-golem.multiattack.actions.multiattack.name: 'Multiattack'
monsters.clay-golem.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.clay-golem.slam.name: 'Slam'
monsters.clay-golem.slam.description: '*Melee Weapon Attack:* +8 to hit, reach 5 ft., one target. *Hit:* 16 (2d10 + 5) bludgeoning damage. If the target is a creature, it must succeed on a DC 15 Constitution saving throw or have its hit point maximum reduced by an amount equal to the damage taken. The target dies if this attack reduces its hit point maximum to 0. The reduction lasts until removed by the *greater restoration* spell or other magic.'
monsters.clay-golem.haste.name: 'Haste'
monsters.clay-golem.haste.description: 'Until the end of its next turn, the golem magically gains a +2 bonus to its AC, has advantage on Dexterity saving throws, and can use its slam attack as a bonus action.'
monsters.cloaker.name: 'Cloaker'
monsters.cloaker.damage-transfer.name: 'Damage Transfer'
monsters.cloaker.damage-transfer.description: 'While attached to a creature, the cloaker takes only half the damage dealt to it (rounded down), and that creature takes the other half.'
monsters.cloaker.false-appearance.name: 'False Appearance'
monsters.cloaker.false-appearance.description: 'While the cloaker remains motionless without its underside exposed, it is indistinguishable from a dark leather cloak.'
monsters.cloaker.light-sensitivity.name: 'Light Sensitivity'
monsters.cloaker.light-sensitivity.description: 'While in bright light, the cloaker has disadvantage on attack rolls and Wisdom (Perception) checks that rely on sight.'
monsters.cloaker.multiattack.name: 'Multiattack'
monsters.cloaker.multiattack.description: 'The cloaker makes two attacks: one with its bite and one with its tail.'
monsters.cloaker.multiattack.actions.multiattack.name: 'Multiattack'
monsters.cloaker.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.cloaker.bite.name: 'Bite'
monsters.cloaker.bite.description: "*Melee Weapon Attack:* +6 to hit, reach 5 ft., one creature. *Hit:* 10 (2d6 + 3) piercing damage, and if the target is Large or smaller, the cloaker attaches to it. If the cloaker has advantage against the target, the cloaker attaches to the target's head, and the target is blinded and unable to breathe while the cloaker is attached. While attached, the cloaker can make this attack only against the target and has advantage on the attack roll. The cloaker can detach itself by spending 5 feet of its movement. A creature, including the target, can take its action to detach the cloaker by succeeding on a DC 16 Strength check."
monsters.cloaker.tail.name: 'Tail'
monsters.cloaker.tail.description: '*Melee Weapon Attack:* +6 to hit, reach 10 ft., one creature. *Hit:* 7 (1d8 + 3) slashing damage.'
monsters.cloaker.moan.name: 'Moan'
monsters.cloaker.moan.description: "Each creature within 60 feet of the cloaker that can hear its moan and that isn't an aberration must succeed on a DC 13 Wisdom saving throw or become frightened until the end of the cloaker's next turn. If a creature's saving throw is successful, the creature is immune to the cloaker's moan for the next 24 hours"
monsters.cloaker.phantasms.name: 'Phantasms (Recharges after a Short or Long Rest)'
monsters.cloaker.phantasms.description: |-
  The cloaker magically creates three illusory duplicates of itself if it isn't in bright light. The duplicates move with it and mimic its actions, shifting position so as to make it impossible to track which cloaker is the real one. If the cloaker is ever in an area of bright light, the duplicates disappear.

  Whenever any creature targets the cloaker with an attack or a harmful spell while a duplicate remains, that creature rolls randomly to determine whether it targets the cloaker or one of the duplicates. A creature is unaffected by this magical effect if it can't see or if it relies on senses other than sight.

  A duplicate has the cloaker's AC and uses its saving throws. If an attack hits a duplicate, or if a duplicate fails a saving throw against an effect that deals damage, the duplicate disappears.
monsters.cloud-giant.name: 'Cloud Giant'
monsters.cloud-giant.keen-smell.name: 'Keen Smell'
monsters.cloud-giant.keen-smell.description: 'The giant has advantage on Wisdom (Perception) checks that rely on smell.'
monsters.cloud-giant.innate-spellcasting.name: 'Innate Spellcasting'
monsters.cloud-giant.innate-spellcasting.description: |-
  The giant's innate spellcasting ability is Charisma. It can innately cast the following spells, requiring no material components:

  - At will: *detect magic*, *fog cloud*, *light*
  - 3/day each: *feather fall*, *fly*, *misty step*, *telekinesis*
  - 1/day each: *control weather*, *gaseous form*
monsters.cloud-giant.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.cloud-giant.multiattack.name: 'Multiattack'
monsters.cloud-giant.multiattack.description: 'The giant makes two morningstar attacks.'
monsters.cloud-giant.multiattack.actions.multiattack.name: 'Multiattack'
monsters.cloud-giant.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.cloud-giant.morningstar.name: 'Morningstar'
monsters.cloud-giant.morningstar.description: '*Melee Weapon Attack:* +12 to hit, reach 10 ft., one target. *Hit:* 21 (3d8 + 8) piercing damage.'
monsters.cloud-giant.rock.name: 'Rock'
monsters.cloud-giant.rock.description: '*Ranged Weapon Attack:* +12 to hit, range 60/240 ft., one target. *Hit:* 30 (4d10 + 8) bludgeoning damage.'
monsters.cockatrice.name: 'Cockatrice'
monsters.cockatrice.bite.name: 'Bite'
monsters.cockatrice.bite.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one creature. *Hit:* 3 (1d4 + 1) piercing damage, and the target must succeed on a DC 11 Constitution saving throw against being magically petrified. On a failed save, the creature begins to turn to stone and is restrained. It must repeat the saving throw at the end of its next turn. On a success, the effect ends. On a failure, the creature is petrified for 24 hours.'
monsters.commoner.name: 'Commoner'
monsters.commoner.club.name: 'Club'
monsters.commoner.club.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one target. *Hit:* 2 (1d4) bludgeoning damage.'
monsters.constrictor-snake.name: 'Constrictor Snake'
monsters.constrictor-snake.bite.name: 'Bite'
monsters.constrictor-snake.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.constrictor-snake.constrict.name: 'Constrict'
monsters.constrictor-snake.constrict.description: "*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 6 (1d8 + 2) bludgeoning damage, and the target is grappled (escape DC 14). Until this grapple ends, the creature is restrained, and the snake can't constrict another target."
monsters.copper-dragon-wyrmling.name: 'Copper Dragon Wyrmling'
monsters.copper-dragon-wyrmling.bite.name: 'Bite'
monsters.copper-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (1d10 + 2) piercing damage.'
monsters.copper-dragon-wyrmling.breath-weapons.name: 'Breath Weapons'
monsters.copper-dragon-wyrmling.breath-weapons.description: 'The dragon uses one of the following breath weapons.'
monsters.copper-dragon-wyrmling.acid-breath.name: 'Acid Breath'
monsters.copper-dragon-wyrmling.acid-breath.description: 'The dragon exhales acid in an 20-foot line that is 5 feet wide. Each creature in that line must make a DC 11 Dexterity saving throw, taking 18 (4d8) acid damage on a failed save, or half as much damage on a successful one.'
monsters.copper-dragon-wyrmling.slowing-breath.name: 'Slowing Breath'
monsters.copper-dragon-wyrmling.slowing-breath.description: "The dragon exhales gas in a 15-foot cone. Each creature in that area must succeed on a DC 11 Constitution saving throw. On a failed save, the creature can't use reactions, its speed is halved, and it can't make more than one attack on its turn. In addition, the creature can use either an action or a bonus action on its turn, but not both. These effects last for 1 minute. The creature can repeat the saving throw at the end of each of its turns, ending the effect on itself with a successful save."
monsters.couatl.name: 'Couatl'
monsters.couatl.innate-spellcasting.name: 'Innate Spellcasting'
monsters.couatl.innate-spellcasting.description: |-
  The couatl's spellcasting ability is Charisma (spell save DC 14). It can innately cast the following spells, requiring only verbal components:

  - At will: *detect evil and good*, *detect magic*, *detect thoughts*
  - 3/day each: *bless*, *create food and water*, *cure wounds*, *lesser restoration*, *protection from poison*, *sanctuary*, *shield*
  - 1/day each: *dream*, *greater restoration*, *scrying*
monsters.couatl.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.couatl.magic-weapons.name: 'Magic Weapons'
monsters.couatl.magic-weapons.description: "The couatl's weapon attacks are magical."
monsters.couatl.shielded-mind.name: 'Shielded Mind'
monsters.couatl.shielded-mind.description: 'The couatl is immune to scrying and to any effect that would sense its emotions, read its thoughts, or detect its location.'
monsters.couatl.bite.name: 'Bite'
monsters.couatl.bite.description: '*Melee Weapon Attack:* +8 to hit, reach 5 ft., one creature. *Hit:* 8 (1d6 + 5) piercing damage, and the target must succeed on a DC 13 Constitution saving throw or be poisoned for 24 hours. Until this poison ends, the target is unconscious. Another creature can use an action to shake the target awake.'
monsters.couatl.constrict.name: 'Constrict'
monsters.couatl.constrict.description: "*Melee Weapon Attack:* +6 to hit, reach 10 ft., one Medium or smaller creature. *Hit:* 10 (2d6 + 3) bludgeoning damage, and the target is grappled (escape DC 15). Until this grapple ends, the target is restrained, and the couatl can't constrict another target."
monsters.couatl.change-shape.name: 'Change Shape'
monsters.couatl.change-shape.description: |-
  The couatl magically polymorphs into a humanoid or beast that has a challenge rating equal to or less than its own, or back into its true form. It reverts to its true form if it dies. Any equipment it is wearing or carrying is absorbed or borne by the new form (the couatl's choice).

  In a new form, the couatl retains its game statistics and ability to speak, but its AC, movement modes, Strength, Dexterity, and other actions are replaced by those of the new form, and it gains any statistics and capabilities (except class features, legendary actions, and lair actions) that the new form has but that it lacks. If the new form has a bite attack, the couatl can use its bite in that form.
monsters.crab.name: 'Crab'
monsters.crab.amphibious.name: 'Amphibious'
monsters.crab.amphibious.description: 'The crab can breathe air and water.'
monsters.crab.claw.name: 'Claw'
monsters.crab.claw.description: '*Melee Weapon Attack:* +0 to hit, reach 5 ft., one target. *Hit:* 1 bludgeoning damage.'
monsters.crocodile.name: 'Crocodile'
monsters.crocodile.hold-breath.name: 'Hold Breath'
monsters.crocodile.hold-breath.description: 'The crocodile can hold its breath for 15 minutes.'
monsters.crocodile.bite.name: 'Bite'
monsters.crocodile.bite.description: "*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 7 (1d10 + 2) piercing damage, and the target is grappled (escape DC 12). Until this grapple ends, the target is restrained, and the crocodile can't bite another target."
monsters.cult-fanatic.name: 'Cult Fanatic'
monsters.cult-fanatic.dark-devotion.name: 'Dark Devotion'
monsters.cult-fanatic.dark-devotion.description: 'The fanatic has advantage on saving throws against being charmed or frightened.'
monsters.cult-fanatic.spellcasting.name: 'Spellcasting'
monsters.cult-fanatic.spellcasting.description: |-
  The fanatic is a 4th-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 11, +3 to hit with spell attacks). The fanatic has the following cleric spells prepared:

  - Cantrips (at will): *light*, *sacred flame*, *thaumaturgy*
  - 1st level (4 slots): *command*, *inflict wounds*, *shield of faith*
  - 2nd level (3 slots): *hold person*, *spiritual weapon*
monsters.cult-fanatic.multiattack.name: 'Multiattack'
monsters.cult-fanatic.multiattack.description: 'The fanatic makes two melee attacks.'
monsters.cult-fanatic.multiattack.actions.multiattack.name: 'Multiattack'
monsters.cult-fanatic.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.cult-fanatic.dagger.name: 'Dagger'
monsters.cult-fanatic.dagger.description: '*Melee or Ranged Weapon Attack:* +4 to hit, reach 5 ft. or range 20/60 ft., one creature. *Hit*: 4 (1d4 + 2) piercing damage.'
monsters.cultist.name: 'Cultist'
monsters.cultist.dark-devotion.name: 'Dark Devotion'
monsters.cultist.dark-devotion.description: 'The cultist has advantage on saving throws against being charmed or frightened.'
monsters.cultist.scimitar.name: 'Scimitar'
monsters.cultist.scimitar.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one creature. *Hit:* 4 (1d6 + 1) slashing damage.'
monsters.darkmantle.name: 'Darkmantle'
monsters.darkmantle.echolocation.name: 'Echolocation'
monsters.darkmantle.echolocation.description: "The darkmantle can't use its blindsight while deafened."
monsters.darkmantle.false-appearance.name: 'False Appearance'
monsters.darkmantle.false-appearance.description: 'While the darkmantle remains motionless, it is indistinguishable from a cave formation such as a stalactite or stalagmite.'
monsters.darkmantle.crush.name: 'Crush'
monsters.darkmantle.crush.description: |-
  *Melee Weapon Attack:* +5 to hit, reach 5 ft., one creature. *Hit:* 6 (1d6 + 3) bludgeoning damage, and the darkmantle attaches to the target. If the target is Medium or smaller and the darkmantle has advantage on the attack roll, it attaches by engulfing the target's head, and the target is also blinded and unable to breathe while the darkmantle is attached in this way.

  While attached to the target, the darkmantle can attack no other creature except the target but has advantage on its attack rolls. The darkmantle's speed also becomes 0, it can't benefit from any bonus to its speed, and it moves with the target.

  A creature can detach the darkmantle by making a successful DC 13 Strength check as an action. On its turn, the darkmantle can detach itself from the target by using 5 feet of movement.
monsters.darkmantle.darkness-aura.name: 'Darkness Aura (1/Day)'
monsters.darkmantle.darkness-aura.description: "A 15-foot radius of magical darkness extends out from the darkmantle, moves with it, and spreads around corners. The darkness lasts as long as the darkmantle maintains concentration, up to 10 minutes (as if concentrating on a spell). Darkvision can't penetrate this darkness, and no natural light can illuminate it. If any of the darkness overlaps with an area of light created by a spell of 2nd level or lower, the spell creating the light is dispelled."
monsters.death-dog.name: 'Death Dog'
monsters.death-dog.two-headed.name: 'Two-Headed'
monsters.death-dog.two-headed.description: 'The dog has advantage on Wisdom (Perception) checks and on saving throws against being blinded, charmed, deafened, frightened, stunned, or knocked unconscious.'
monsters.death-dog.multiattack.name: 'Multiattack'
monsters.death-dog.multiattack.description: 'The dog makes two bite attacks.'
monsters.death-dog.multiattack.actions.multiattack.name: 'Multiattack'
monsters.death-dog.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.death-dog.bite.name: 'Bite'
monsters.death-dog.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage. If the target is a creature, it must succeed on a DC 12 Constitution saving throw against disease or become poisoned until the disease is cured. Every 24 hours that elapse, the creature must repeat the saving throw, reducing its hit point maximum by 5 (1d10) on a failure. This reduction lasts until the disease is cured. The creature dies if the disease reduces its hit point maximum to 0.'
monsters.deep-gnome.name: 'Deep Gnome (Svirfneblin)'
monsters.deep-gnome.stone-camouflage.name: 'Stone Camouflage'
monsters.deep-gnome.stone-camouflage.description: 'The gnome has advantage on Dexterity (Stealth) checks made to hide in rocky terrain.'
monsters.deep-gnome.gnome-cunning.name: 'Gnome Cunning'
monsters.deep-gnome.gnome-cunning.description: 'The gnome has advantage on Intelligence, Wisdom, and Charisma saving throws against magic.'
monsters.deep-gnome.innate-spellcasting.name: 'Innate Spellcasting'
monsters.deep-gnome.innate-spellcasting.description: |-
  The gnome's innate spellcasting ability is Intelligence (spell save DC 11). It can innately cast the following spells, requiring no material components:
  At will: *nondetection* (self only)
  1/day each: *blindness/deafness*, *blur*, *disguise self*
monsters.deep-gnome.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.deep-gnome.war-pick.name: 'War Pick'
monsters.deep-gnome.war-pick.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 6 (1d8 + 2) piercing damage.'
monsters.deep-gnome.poisoned-dart.name: 'Poisoned Dart'
monsters.deep-gnome.poisoned-dart.description: '*Ranged Weapon Attack:* +4 to hit, range 30/120 ft., one creature. *Hit:* 4 (1d4 + 2) piercing damage, and the target must succeed on a DC 12 Constitution saving throw or be poisoned for 1 minute. The target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.deer.name: 'Deer'
monsters.deer.bite.name: 'Bite'
monsters.deer.bite.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one target. *Hit:* 2 (1d4) piercing damage.'
monsters.deva.name: 'Deva'
monsters.deva.angelic-weapons.name: 'Angelic Weapons'
monsters.deva.angelic-weapons.description: "The deva's weapon attacks are magical. When the deva hits with any weapon, the weapon deals an extra 4d8 radiant damage (included in the attack)."
monsters.deva.innate-spellcasting.name: 'Innate Spellcasting'
monsters.deva.innate-spellcasting.description: |-
  The deva's spellcasting ability is Charisma (spell save DC 17). The deva can innately cast the following spells, requiring only verbal components:

  - At will: *detect evil and good*
  - 1/day each: *commune*, *raise dead*
monsters.deva.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.deva.magic-resistance.name: 'Magic Resistance'
monsters.deva.magic-resistance.description: 'The deva has advantage on saving throws against spells and other magical effects.'
monsters.deva.multiattack.name: 'Multiattack'
monsters.deva.multiattack.description: 'The deva makes two melee attacks.'
monsters.deva.multiattack.actions.multiattack.name: 'Multiattack'
monsters.deva.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.deva.mace.name: 'Mace'
monsters.deva.mace.description: '*Melee Weapon Attack:* +8 to hit, reach 5 ft., one target. *Hit:* 7 (1d6 + 4) bludgeoning damage plus 18 (4d8) radiant damage.'
monsters.deva.healing-touch.name: 'Healing Touch (3/Day)'
monsters.deva.healing-touch.description: 'The deva touches another creature. The target magically regains 20 (4d8 + 2) hit points and is freed from any curse, disease, poison, blindness, or deafness.'
monsters.deva.change-shape.name: 'Change Shape'
monsters.deva.change-shape.description: |-
  The deva magically polymorphs into a humanoid or beast that has a challenge rating equal to or less than its own, or back into its true form. It reverts to its true form if it dies. Any equipment it is wearing or carrying is absorbed or borne by the new form (the deva's choice).

  In a new form, the deva retains its game statistics and ability to speak, but its AC, movement modes, Strength, Dexterity, and special senses are replaced by those of the new form, and it gains any statistics and capabilities (except class features, legendary actions, and lair actions) that the new form has but that it lacks.
monsters.dire-wolf.name: 'Dire Wolf'
monsters.dire-wolf.keen-hearing-and-smell.name: 'Keen Hearing and Smell'
monsters.dire-wolf.keen-hearing-and-smell.description: 'The wolf has advantage on Wisdom (Perception) checks that rely on hearing or smell.'
monsters.dire-wolf.pack-tactics.name: 'Pack Tactics'
monsters.dire-wolf.pack-tactics.description: "The wolf has advantage on an attack roll against a creature if at least one of the wolf's allies is within 5 feet of the creature and the ally isn't incapacitated."
monsters.dire-wolf.bite.name: 'Bite'
monsters.dire-wolf.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 10 (2d6 + 3) piercing damage. If the target is a creature, it must succeed on a DC 13 Strength saving throw or be knocked prone.'
monsters.djinni.name: 'Djinni'
monsters.djinni.elemental-demise.name: 'Elemental Demise'
monsters.djinni.elemental-demise.description: 'If the djinni dies, its body disintegrates into a warm breeze, leaving behind only equipment the djinni was wearing or carrying.'
monsters.djinni.innate-spellcasting.name: 'Innate Spellcasting'
monsters.djinni.innate-spellcasting.description: |-
  The djinni's innate spellcasting ability is Charisma (spell save DC 17, +9 to hit with spell attacks). It can innately cast the following spells, requiring no material components:

  - At will: *detect evil and good*, *detect magic*, *thunderwave*
  - 3/day each: *create food and water* (can create wine instead of water), *tongues*, *wind walk*
  - 1/day each: *conjure elemental* (air elemental only), *creation*, *gaseous form*, *invisibility*, *major image*, *plane shift*
monsters.djinni.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.djinni.multiattack.name: 'Multiattack'
monsters.djinni.multiattack.description: 'The djinni makes three scimitar attacks.'
monsters.djinni.multiattack.actions.multiattack.name: 'Multiattack'
monsters.djinni.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.djinni.scimitar.name: 'Scimitar'
monsters.djinni.scimitar.description: "*Melee Weapon Attack:* +9 to hit, reach 5 ft., one target. *Hit:* 12 (2d6 + 5) slashing damage plus 3 (1d6) lightning or thunder damage (djinni's choice)."
monsters.djinni.create-whirlwind.name: 'Create Whirlwind'
monsters.djinni.create-whirlwind.description: |-
  A 5-foot-radius, 30-foot-tall cylinder of swirling air magically forms on a point the djinni can see within 120 feet of it. The whirlwind lasts as long as the djinni maintains concentration (as if concentrating on a spell). Any creature but the djinni that enters the whirlwind must succeed on a DC 18 Strength saving throw or be restrained by it. The djinni can move the whirlwind up to 60 feet as an action, and creatures restrained by the whirlwind move with it. The whirlwind ends if the djinni loses sight of it.

  A creature can use its action to free a creature restrained by the whirlwind, including itself, by succeeding on a DC 18 Strength check. If the check succeeds, the creature is no longer restrained and moves to the nearest space outside the whirlwind.
monsters.doppelganger.name: 'Doppelganger'
monsters.doppelganger.shapechanger.name: 'Shapechanger'
monsters.doppelganger.shapechanger.description: "The doppelganger can use its action to polymorph into a Small or Medium humanoid it has seen, or back into its true form. Its statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn't transformed. It reverts to its true form if it dies."
monsters.doppelganger.ambusher.name: 'Ambusher'
monsters.doppelganger.ambusher.description: 'In the first round of a combat, the doppelganger has advantage on attack rolls against any creature it has surprised.'
monsters.doppelganger.surprise-attack.name: 'Surprise Attack'
monsters.doppelganger.surprise-attack.description: 'If the doppelganger surprises a creature and hits it with an attack during the first round of combat, the target takes an extra 10 (3d6) damage from the attack.'
monsters.doppelganger.multiattack.name: 'Multiattack'
monsters.doppelganger.multiattack.description: 'The doppelganger makes two melee attacks.'
monsters.doppelganger.multiattack.actions.multiattack.name: 'Multiattack'
monsters.doppelganger.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.doppelganger.slam.name: 'Slam'
monsters.doppelganger.slam.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 7 (1d6 + 4) bludgeoning damage.'
monsters.doppelganger.read-thoughts.name: 'Read Thoughts'
monsters.doppelganger.read-thoughts.description: "The doppelganger magically reads the surface thoughts of one creature within 60 feet of it. The effect can penetrate barriers, but 3 feet of wood or dirt, 2 feet of stone, 2 inches of metal, or a thin sheet of lead blocks it. While the target is in range, the doppelganger can continue reading its thoughts, as long as the doppelganger's concentration isn't broken (as if concentrating on a spell). While reading the target's mind, the doppelganger has advantage on Wisdom (Insight) and Charisma (Deception, Intimidation, and Persuasion) checks against the target."
monsters.draft-horse.name: 'Draft Horse'
monsters.draft-horse.hooves.name: 'Hooves'
monsters.draft-horse.hooves.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 9 (2d4 + 4) bludgeoning damage.'
monsters.dragon-turtle.name: 'Dragon Turtle'
monsters.dragon-turtle.amphibious.name: 'Amphibious'
monsters.dragon-turtle.amphibious.description: 'The dragon turtle can breathe air and water.'
monsters.dragon-turtle.multiattack.name: 'Multiattack'
monsters.dragon-turtle.multiattack.description: 'The dragon turtle makes three attacks: one with its bite and two with its claws. It can make one tail attack in place of its two claw attacks.'
monsters.dragon-turtle.multiattack.actions.multiattack.name: 'Multiattack'
monsters.dragon-turtle.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.dragon-turtle.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.dragon-turtle.multiattack.actions.multiattack.options.claws.name: 'Bite and two claws'
monsters.dragon-turtle.multiattack.actions.multiattack.options.tail.name: 'Bite and tail'
monsters.dragon-turtle.bite.name: 'Bite'
monsters.dragon-turtle.bite.description: '*Melee Weapon Attack:* +13 to hit, reach 15 ft., one target. *Hit:* 26 (3d12 + 7) piercing damage.'
monsters.dragon-turtle.claw.name: 'Claw'
monsters.dragon-turtle.claw.description: '*Melee Weapon Attack:* +13 to hit, reach 10 ft., one target. *Hit:* 16 (2d8 + 7) slashing damage.'
monsters.dragon-turtle.tail.name: 'Tail'
monsters.dragon-turtle.tail.description: '*Melee Weapon Attack:* +13 to hit, reach 15 ft., one target. *Hit:* 26 (3d12 + 7) bludgeoning damage. If the target is a creature, it must succeed on a DC 20 Strength saving throw or be pushed up to 10 feet away from the dragon turtle and knocked prone.'
monsters.dragon-turtle.steam-breath.name: 'Steam Breath'
monsters.dragon-turtle.steam-breath.description: "The dragon turtle exhales scalding steam in a 60-foot cone. Each creature in that area must make a DC 18 Constitution saving throw, taking 52 (15d6) fire damage on a failed save, or half as much damage on a successful one. Being underwater doesn't grant resistance against this damage."
monsters.dretch.name: 'Dretch'
monsters.dretch.multiattack.name: 'Multiattack'
monsters.dretch.multiattack.description: 'The dretch makes two attacks: one with its bite and one with its claws.'
monsters.dretch.multiattack.actions.multiattack.name: 'Multiattack'
monsters.dretch.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.dretch.bite.name: 'Bite'
monsters.dretch.bite.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one target. *Hit:* 3 (1d6) piercing damage.'
monsters.dretch.claws.name: 'Claws'
monsters.dretch.claws.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one target. *Hit:* 5 (2d4) slashing damage.'
monsters.dretch.fetid-cloud.name: 'Fetid Cloud (1/Day)'
monsters.dretch.fetid-cloud.description: "A 10-foot radius of disgusting green gas extends out from the dretch. The gas spreads around corners, and its area is lightly obscured. It lasts for 1 minute or until a strong wind disperses it. Any creature that starts its turn in that area must succeed on a DC 11 Constitution saving throw or be poisoned until the start of its next turn. While poisoned in this way, the target can take either an action or a bonus action on its turn, not both, and can't take reactions."
monsters.drider.name: 'Drider'
monsters.drider.fey-ancestry.name: 'Fey Ancestry'
monsters.drider.fey-ancestry.description: "The drider has advantage on saving throws against being charmed, and magic can't put the drider to sleep."
monsters.drider.innate-spellcasting.name: 'Innate Spellcasting'
monsters.drider.innate-spellcasting.description: |-
  The drider's innate spellcasting ability is Wisdom (spell save DC 13). The drider can innately cast the following spells, requiring no material components:

  - At will: *dancing lights*
  - 1/day each: *darkness*, *faerie fire*
monsters.drider.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.drider.spider-climb.name: 'Spider Climb'
monsters.drider.spider-climb.description: 'The drider can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.drider.sunlight-sensitivity.name: 'Sunlight Sensitivity'
monsters.drider.sunlight-sensitivity.description: 'While in sunlight, the drider has disadvantage on attack rolls, as well as on Wisdom (Perception) checks that rely on sight.'
monsters.drider.web-walker.name: 'Web Walker'
monsters.drider.web-walker.description: 'The drider ignores movement restrictions caused by webbing.'
monsters.drider.multiattack.name: 'Multiattack'
monsters.drider.multiattack.description: 'The drider makes three attacks, either with its longsword or its longbow. It can replace one of those attacks with a bite attack.'
monsters.drider.multiattack.actions.multiattack.name: 'Multiattack'
