monsters.swarm-of-rats.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny rat. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-rats.bites.name: 'Bites'
monsters.swarm-of-rats.bites.description: "*Melee Weapon Attack:* +2 to hit, reach 0 ft., one target in the swarm's space. *Hit:* 7 (2d6) piercing damage, or 3 (1d6) piercing damage if the swarm has half of its hit points or fewer."
monsters.swarm-of-ravens.name: 'Swarm of Ravens'
monsters.swarm-of-ravens.swarm.name: 'Swarm'
monsters.swarm-of-ravens.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny raven. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-ravens.beaks.name: 'Beaks'
monsters.swarm-of-ravens.beaks.description: "*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target in the swarm's space. *Hit:* 7 (2d6) piercing damage, or 3 (1d6) piercing damage if the swarm has half of its hit points or fewer."
monsters.swarm-of-spiders.name: 'Swarm of Spiders'
monsters.swarm-of-spiders.swarm.name: 'Swarm'
monsters.swarm-of-spiders.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny insect. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-spiders.spider-climb.name: 'Spider Climb'
monsters.swarm-of-spiders.spider-climb.description: 'The swarm can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.swarm-of-spiders.web-sense.name: 'Web Sense'
monsters.swarm-of-spiders.web-sense.description: 'While in contact with a web, the swarm knows the exact location of any other creature in contact with the same web.'
monsters.swarm-of-spiders.web-walker.name: 'Web Walker'
monsters.swarm-of-spiders.web-walker.description: 'The swarm ignores movement restrictions caused by webbing.'
monsters.swarm-of-spiders.bites.name: 'Bites'
monsters.swarm-of-spiders.bites.description: "*Melee Weapon Attack:* +3 to hit, reach 0 ft., one target in the swarm's space. *Hit:* 10 (4d4) piercing damage, or 5 (2d4) piercing damage if the swarm has half of its hit points or fewer."
monsters.swarm-of-wasps.name: 'Swarm of Wasps'
monsters.swarm-of-wasps.swarm.name: 'Swarm'
monsters.swarm-of-wasps.swarm.description: "The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny insect. The swarm can't regain hit points or gain temporary hit points."
monsters.swarm-of-wasps.bites.name: 'Bites'
monsters.swarm-of-wasps.bites.description: "*Melee Weapon Attack:* +3 to hit, reach 0 ft., one target in the swarm's space. *Hit:* 10 (4d4) piercing damage, or 5 (2d4) piercing damage if the swarm has half of its hit points or fewer."
monsters.tarrasque.name: 'Tarrasque'
monsters.tarrasque.legendary-resistance.name: 'Legendary Resistance (3/Day)'
monsters.tarrasque.legendary-resistance.description: 'If the tarrasque fails a saving throw, it can choose to succeed instead.'
monsters.tarrasque.magic-resistance.name: 'Magic Resistance'
monsters.tarrasque.magic-resistance.description: 'The tarrasque has advantage on saving throws against spells and other magical effects.'
monsters.tarrasque.reflective-carapace.name: 'Reflective Carapace'
monsters.tarrasque.reflective-carapace.description: 'Any time the tarrasque is targeted by a *magic missile* spell, a line spell, or a spell that requires a ranged attack roll, roll a d6. On a 1 to 5, the tarrasque is unaffected. On a 6, the tarrasque is unaffected, and the effect is reflected back at the caster as though it originated from the tarrasque, turning the caster into the target.'
monsters.tarrasque.siege-monster.name: 'Siege Monster'
monsters.tarrasque.siege-monster.description: 'The tarrasque deals double damage to objects and structures.'
monsters.tarrasque.multiattack.name: 'Multiattack'
monsters.tarrasque.multiattack.description: 'The tarrasque can use its Frightful Presence. It then makes five attacks: one with its bite, two with its claws, one with its horns, and one with its tail. It can use its Swallow instead of its bite.'
monsters.tarrasque.multiattack.actions.multiattack.name: 'Multiattack'
monsters.tarrasque.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.tarrasque.bite.name: 'Bite'
monsters.tarrasque.bite.description: "*Melee Weapon Attack:* +19 to hit, reach 10 ft., one target. *Hit:* 36 (4d12 + 10) piercing damage. If the target is a creature, it is grappled (escape DC 20). Until this grapple ends, the target is restrained, and the tarrasque can't bite another target."
monsters.tarrasque.claw.name: 'Claw'
monsters.tarrasque.claw.description: '*Melee Weapon Attack:* +19 to hit, reach 15 ft., one target. *Hit:* 28 (4d8 + 10) slashing damage.'
monsters.tarrasque.horns.name: 'Horns'
monsters.tarrasque.horns.description: '*Melee Weapon Attack:* +19 to hit, reach 10 ft., one target. *Hit:* 32 (4d10 + 10) piercing damage.'
monsters.tarrasque.tail.name: 'Tail'
monsters.tarrasque.tail.description: '*Melee Weapon Attack:* +19 to hit, reach 20 ft., one target. *Hit:* 24 (4d6 + 10) bludgeoning damage. If the target is a creature, it must succeed on a DC 20 Strength saving throw or be knocked prone.'
monsters.tarrasque.frightful-presence.name: 'Frightful Presence'
monsters.tarrasque.frightful-presence.description: "Each creature of the tarrasque's choice within 120 feet of it and aware of it must succeed on a DC 17 Wisdom saving throw or become frightened for 1 minute. A creature can repeat the saving throw at the end of each of its turns, with disadvantage if the tarrasque is within line of sight, ending the effect on itself on a success. If a creature's saving throw is successful or the effect ends for it, the creature is immune to the tarrasque's Frightful Presence for the next 24 hours."
monsters.tarrasque.swallow.name: 'Swallow'
monsters.tarrasque.swallow.description: |-
  The tarrasque makes one bite attack against a Large or smaller creature it is grappling. If the attack hits, the target takes the bite's damage, the target is swallowed, and the grapple ends. While swallowed, the creature is blinded and restrained, it has total cover against attacks and other effects outside the tarrasque, and it takes 56 (16d6) acid damage at the start of each of the tarrasque's turns.

  If the tarrasque takes 60 damage or more on a single turn from a creature inside it, the tarrasque must succeed on a DC 20 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall prone in a space within 10 feet of the tarrasque. If the tarrasque dies, a swallowed creature is no longer restrained by it and can escape from the corpse by using 30 feet of movement, exiting prone.
monsters.tarrasque.attack.name: 'Attack'
monsters.tarrasque.attack.description: 'The tarrasque makes one claw attack or tail attack.'
monsters.tarrasque.attack.actions.attack.name: 'Attack'
monsters.tarrasque.attack.actions.attack.results.done.name: 'Done'
monsters.tarrasque.attack.actions.attack.steps.form.prompt: 'Which attack?'
monsters.tarrasque.attack.actions.attack.options.claw.name: 'Claw'
monsters.tarrasque.attack.actions.attack.options.tail.name: 'Tail'
monsters.tarrasque.move.name: 'Move'
monsters.tarrasque.move.description: 'The tarrasque moves up to half its speed.'
