monsters.black-bear.claws.name: 'Claws'
monsters.black-bear.claws.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 7 (2d4 + 2) slashing damage.'
monsters.black-dragon-wyrmling.name: 'Black Dragon Wyrmling'
monsters.black-dragon-wyrmling.amphibious.name: 'Amphibious'
monsters.black-dragon-wyrmling.amphibious.description: 'The dragon can breathe air and water.'
monsters.black-dragon-wyrmling.bite.name: 'Bite'
monsters.black-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (1d10 + 2) piercing damage plus 2 (1d4) acid damage.'
monsters.black-dragon-wyrmling.acid-breath.name: 'Acid Breath'
monsters.black-dragon-wyrmling.acid-breath.description: 'The dragon exhales acid in a 15-foot line that is 5 feet wide. Each creature in that line must make a DC 11 Dexterity saving throw, taking 22 (5d8) acid damage on a failed save, or half as much damage on a successful one.'
monsters.black-pudding.name: 'Black Pudding'
monsters.black-pudding.amorphous.name: 'Amorphous'
monsters.black-pudding.amorphous.description: 'The pudding can move through a space as narrow as 1 inch wide without squeezing.'
monsters.black-pudding.corrosive-form.name: 'Corrosive Form'
monsters.black-pudding.corrosive-form.description: |-
  A creature that touches the pudding or hits it with a melee attack while within 5 feet of it takes 4 (1d8) acid damage. Any nonmagical weapon made of metal or wood that hits the pudding corrodes. After dealing damage, the weapon takes a permanent and cumulative -1 penalty to damage rolls. If its penalty drops to -5, the weapon is destroyed. Nonmagical ammunition made of metal or wood that hits the pudding is destroyed after dealing damage.

  The pudding can eat through 2-inch-thick, nonmagical wood or metal in 1 round.
monsters.black-pudding.spider-climb.name: 'Spider Climb'
monsters.black-pudding.spider-climb.description: 'The pudding can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.black-pudding.pseudopod.name: 'Pseudopod'
monsters.black-pudding.pseudopod.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 6 (1d6 + 3) bludgeoning damage plus 18 (4d8) acid damage. In addition, nonmagical armor worn by the target is partly dissolved and takes a permanent and cumulative -1 penalty to the AC it offers. The armor is destroyed if the penalty reduces its AC to 10.'
monsters.black-pudding.split.name: 'Split'
monsters.black-pudding.split.description: "When a pudding that is Medium or larger is subjected to lightning or slashing damage, it splits into two new puddings if it has at least 10 hit points. Each new pudding has hit points equal to half the original pudding's, rounded down. New puddings are one size smaller than the original pudding."
monsters.blink-dog.name: 'Blink Dog'
monsters.blink-dog.keen-hearing-and-smell.name: 'Keen Hearing and Smell'
monsters.blink-dog.keen-hearing-and-smell.description: 'The dog has advantage on Wisdom (Perception) checks that rely on hearing or smell.'
monsters.blink-dog.bite.name: 'Bite'
monsters.blink-dog.bite.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 4 (1d6 + 1) piercing damage.'
monsters.blink-dog.teleport.name: 'Teleport'
monsters.blink-dog.teleport.description: 'The dog magically teleports, along with any equipment it is wearing or carrying, up to 40 feet to an unoccupied space it can see. Before or after teleporting, the dog can make one bite attack.'
monsters.blood-hawk.name: 'Blood Hawk'
monsters.blood-hawk.keen-sight.name: 'Keen Sight'
monsters.blood-hawk.keen-sight.description: 'The hawk has advantage on Wisdom (Perception) checks that rely on sight.'
monsters.blood-hawk.pack-tactics.name: 'Pack Tactics'
monsters.blood-hawk.pack-tactics.description: "The hawk has advantage on an attack roll against a creature if at least one of the hawk's allies is within 5 feet of the creature and the ally isn't incapacitated."
monsters.blood-hawk.beak.name: 'Beak'
monsters.blood-hawk.beak.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 4 (1d4 + 2) piercing damage.'
monsters.blue-dragon-wyrmling.name: 'Blue Dragon Wyrmling'
monsters.blue-dragon-wyrmling.bite.name: 'Bite'
monsters.blue-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 8 (1d10 + 3) piercing damage plus 3 (1d6) lightning damage.'
monsters.blue-dragon-wyrmling.lightning-breath.name: 'Lightning Breath'
monsters.blue-dragon-wyrmling.lightning-breath.description: 'The dragon exhales lightning in a 30-foot line that is 5 feet wide. Each creature in that line must make a DC 12 Dexterity saving throw, taking 22 (4d10) lightning damage on a failed save, or half as much damage on a successful one.'
monsters.boar.name: 'Boar'
monsters.boar.charge.name: 'Charge'
monsters.boar.charge.description: 'If the boar moves at least 20 feet straight toward a target and then hits it with a tusk attack on the same turn, the target takes an extra 3 (1d6) slashing damage. If the target is a creature, it must succeed on a DC 11 Strength saving throw or be knocked prone.'
monsters.boar.relentless.name: 'Relentless (Recharges after a Short or Long Rest)'
monsters.boar.relentless.description: 'If the boar takes 7 damage or less that would reduce it to 0 hit points, it is reduced to 1 hit point instead.'
monsters.boar.tusk.name: 'Tusk'
monsters.boar.tusk.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 4 (1d6 + 1) slashing damage.'
monsters.bone-devil.name: 'Bone Devil'
monsters.bone-devil.devils-sight.name: "Devil's Sight"
monsters.bone-devil.devils-sight.description: "Magical darkness doesn't impede the devil's darkvision."
monsters.bone-devil.magic-resistance.name: 'Magic Resistance'
monsters.bone-devil.magic-resistance.description: 'The devil has advantage on saving throws against spells and other magical effects.'
monsters.bone-devil.multiattack.name: 'Multiattack'
monsters.bone-devil.multiattack.description: 'The devil makes three attacks: two with its claws and one with its sting.'
monsters.bone-devil.multiattack.actions.multiattack.name: 'Multiattack'
monsters.bone-devil.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.bone-devil.claw.name: 'Claw'
monsters.bone-devil.claw.description: '*Melee Weapon Attack:* +8 to hit, reach 10 ft., one target. *Hit:* 8 (1d8 + 4) slashing damage.'
monsters.bone-devil.sting.name: 'Sting'
monsters.bone-devil.sting.description: '*Melee Weapon Attack:* +8 to hit, reach 10 ft., one target. *Hit:* 13 (2d8 + 4) piercing damage plus 17 (5d6) poison damage, and the target must succeed on a DC 14 Constitution saving throw or become poisoned for 1 minute. The target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.brass-dragon-wyrmling.name: 'Brass Dragon Wyrmling'
monsters.brass-dragon-wyrmling.bite.name: 'Bite'
monsters.brass-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (1d10 + 2) piercing damage.'
monsters.brass-dragon-wyrmling.breath-weapons.name: 'Breath Weapons'
monsters.brass-dragon-wyrmling.breath-weapons.description: 'The dragon uses one of the following breath weapons.'
monsters.brass-dragon-wyrmling.fire-breath.name: 'Fire Breath'
monsters.brass-dragon-wyrmling.fire-breath.description: 'The dragon exhales fire in an 20-foot line that is 5 feet wide. Each creature in that line must make a DC 11 Dexterity saving throw, taking 14 (4d6) fire damage on a failed save, or half as much damage on a successful one.'
monsters.brass-dragon-wyrmling.sleep-breath.name: 'Sleep Breath'
monsters.brass-dragon-wyrmling.sleep-breath.description: 'The dragon exhales sleep gas in a 15-foot cone. Each creature in that area must succeed on a DC 11 Constitution saving throw or fall unconscious for 1 minute. This effect ends for a creature if the creature takes damage or someone uses an action to wake it.'
monsters.bronze-dragon-wyrmling.name: 'Bronze Dragon Wyrmling'
monsters.bronze-dragon-wyrmling.amphibious.name: 'Amphibious'
monsters.bronze-dragon-wyrmling.amphibious.description: 'The dragon can breathe air and water.'
monsters.bronze-dragon-wyrmling.bite.name: 'Bite'
monsters.bronze-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 8 (1d10 + 3) piercing damage.'
monsters.bronze-dragon-wyrmling.breath-weapons.name: 'Breath Weapons'
monsters.bronze-dragon-wyrmling.breath-weapons.description: 'The dragon uses one of the following breath weapons.'
monsters.bronze-dragon-wyrmling.lightning-breath.name: 'Lightning Breath'
monsters.bronze-dragon-wyrmling.lightning-breath.description: 'The dragon exhales lightning in a 40- foot line that is 5 feet wide. Each creature in that line must make a DC 12 Dexterity saving throw, taking 16 (3d10) lightning damage on a failed save, or half as much damage on a successful one.'
monsters.bronze-dragon-wyrmling.repulsion-breath.name: 'Repulsion Breath'
monsters.bronze-dragon-wyrmling.repulsion-breath.description: 'The dragon exhales repulsion energy in a 30-foot cone. Each creature in that area must succeed on a DC 12 Strength saving throw. On a failed save, the creature is pushed 30 feet away from the dragon.'
monsters.brown-bear.name: 'Brown Bear'
monsters.brown-bear.keen-smell.name: 'Keen Smell'
monsters.brown-bear.keen-smell.description: 'The bear has advantage on Wisdom (Perception) checks that rely on smell.'
monsters.brown-bear.multiattack.name: 'Multiattack'
