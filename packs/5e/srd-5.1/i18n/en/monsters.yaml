monsters.drider.bite.name: 'Bite'
monsters.drider.bite.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one creature. *Hit:* 2 (1d4) piercing damage plus 9 (2d8) poison damage.'
monsters.drider.longsword.name: 'Longsword'
monsters.drider.longsword.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 7 (1d8 + 3) slashing damage, or 8 (1d10 + 3) slashing damage if used with two hands.'
monsters.drider.longbow.name: 'Longbow'
monsters.drider.longbow.description: '*Ranged Weapon Attack:* +6 to hit, range 150/600 ft., one target. *Hit:* 7 (1d8 + 3) piercing damage plus 4 (1d8) poison damage.'
monsters.drow.name: 'Drow'
monsters.drow.fey-ancestry.name: 'Fey Ancestry'
monsters.drow.fey-ancestry.description: "The drow has advantage on saving throws against being charmed, and magic can't put the drow to sleep."
monsters.drow.innate-spellcasting.name: 'Innate Spellcasting'
monsters.drow.innate-spellcasting.description: |-
  The drow's spellcasting ability is Charisma (spell save DC 11). It can innately cast the following spells, requiring no material components:
  At will: *dancing lights*
  1/day each: *darkness*, *faerie fire*
monsters.drow.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.drow.sunlight-sensitivity.name: 'Sunlight Sensitivity'
monsters.drow.sunlight-sensitivity.description: 'While in sunlight, the drow has disadvantage on attack rolls, as well as on Wisdom (Perception) checks that rely on sight.'
monsters.drow.shortsword.name: 'Shortsword'
monsters.drow.shortsword.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.drow.hand-crossbow.name: 'Hand Crossbow'
monsters.drow.hand-crossbow.description: '*Ranged Weapon Attack:* +4 to hit, range 30/120 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage, and the target must succeed on a DC 13 Constitution saving throw or be poisoned for 1 hour. If the saving throw fails by 5 or more, the target is also unconscious while poisoned in this way. The target wakes up if it takes damage or if another creature takes an action to shake it awake.'
monsters.druid.name: 'Druid'
monsters.druid.spellcasting.name: 'Spellcasting'
monsters.druid.spellcasting.description: |-
  The druid is a 4th-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 12, +4 to hit with spell attacks). It has the following druid spells prepared:

  - Cantrips (at will): *druidcraft*, *produce flame*, *shillelagh*
  - 1st level (4 slots): *entangle*, *longstrider*, *speak with animals*, *thunderwave*
  - 2nd level (3 slots): *animal messenger*, *barkskin*
monsters.druid.quarterstaff.name: 'Quarterstaff'
monsters.druid.quarterstaff.description: '*Melee Weapon Attack:* +2 to hit (+4 to hit with *shillelagh*), reach 5 ft., one target. *Hit:* 3 (1d6) bludgeoning damage, 4 (1d8) bludgeoning damage if wielded with two hands, or 6 (1d8 + 2) bludgeoning damage with *shillelagh*.'
monsters.dryad.name: 'Dryad'
monsters.dryad.innate-spellcasting.name: 'Innate Spellcasting'
monsters.dryad.innate-spellcasting.description: |-
  The dryad's innate spellcasting ability is Charisma (spell save DC 14). The dryad can innately cast the following spells, requiring no material components:

  - At will: *druidcraft*
  - 3/day each: *entangle*, *goodberry*
  - 1/day each: *barkskin*, *pass without trace*, *shillelagh*
monsters.dryad.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.dryad.magic-resistance.name: 'Magic Resistance'
monsters.dryad.magic-resistance.description: 'The dryad has advantage on saving throws against spells and other magical effects.'
monsters.dryad.speak-with-beasts-and-plants.name: 'Speak with Beasts and Plants'
monsters.dryad.speak-with-beasts-and-plants.description: 'The dryad can communicate with beasts and plants as if they shared a language.'
monsters.dryad.tree-stride.name: 'Tree Stride'
monsters.dryad.tree-stride.description: 'Once on her turn, the dryad can use 10 feet of her movement to step magically into one living tree within her reach and emerge from a second living tree within 60 feet of the first tree, appearing in an unoccupied space within 5 feet of the second tree. Both trees must be Large or bigger.'
monsters.dryad.club.name: 'Club'
monsters.dryad.club.description: '*Melee Weapon Attack:* +2 to hit (+6 to hit with *shillelagh*), reach 5 ft., one target. *Hit:* 2 (1d4) bludgeoning damage, or 8 (1d8 + 4) bludgeoning damage with *shillelagh*.'
monsters.dryad.fey-charm.name: 'Fey Charm'
monsters.dryad.fey-charm.description: |-
  The dryad targets one humanoid or beast that she can see within 30 feet of her. If the target can see the dryad, it must succeed on a DC 14 Wisdom saving throw or be magically charmed. The charmed creature regards the dryad as a trusted friend to be heeded and protected. Although the target isn't under the dryad's control, it takes the dryad's requests or actions in the most favorable way it can.

  Each time the dryad or its allies do anything harmful to the target, it can repeat the saving throw, ending the effect on itself on a success. Otherwise, the effect lasts 24 hours or until the dryad dies, is on a different plane of existence from the target, or ends the effect as a bonus action. If a target's saving throw is successful, the target is immune to the dryad's Fey Charm for the next 24 hours.

  The dryad can have no more than one humanoid and up to three beasts charmed at a time.
monsters.duergar.name: 'Duergar'
monsters.duergar.duergar-resilience.name: 'Duergar Resilience'
monsters.duergar.duergar-resilience.description: 'The duergar has advantage on saving throws against poison, spells, and illusions, as well as to resist being charmed or paralyzed.'
monsters.duergar.sunlight-sensitivity.name: 'Sunlight Sensitivity'
monsters.duergar.sunlight-sensitivity.description: 'While in sunlight, the duergar has disadvantage on attack rolls, as well as on Wisdom (Perception) checks that rely on sight.'
monsters.duergar.enlarge.name: 'Enlarge (Recharges after a Short or Long Rest)'
monsters.duergar.enlarge.description: 'For 1 minute, the duergar magically increases in size, along with anything it is wearing or carrying. While enlarged, the duergar is Large, doubles its damage dice on Strength-based weapon attacks (included in the attacks), and makes Strength checks and Strength saving throws with advantage. If the duergar lacks the room to become Large, it attains the maximum size possible in the space available.'
monsters.duergar.war-pick.name: 'War Pick'
monsters.duergar.war-pick.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 6 (1d8 + 2) piercing damage, or 11 (2d8 + 2) piercing damage while enlarged.'
monsters.duergar.javelin.name: 'Javelin'
monsters.duergar.javelin.description: '*Melee or Ranged Weapon Attack:* +4 to hit, reach 5 ft. or range 30/120 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage, or 9 (2d6 + 2) piercing damage while enlarged.'
monsters.duergar.invisibility.name: 'Invisibility (Recharges after a Short or Long Rest)'
monsters.duergar.invisibility.description: 'The duergar magically turns invisible until it attacks, casts a spell, or uses its Enlarge, or until its concentration is broken, up to 1 hour (as if concentrating on a spell). Any equipment the duergar wears or carries is invisible with it.'
monsters.dust-mephit.name: 'Dust Mephit'
monsters.dust-mephit.death-burst.name: 'Death Burst'
monsters.dust-mephit.death-burst.description: 'When the mephit dies, it explodes in a burst of dust. Each creature within 5 feet of it must then succeed on a DC 10 Constitution saving throw or be blinded for 1 minute. A blinded creature can repeat the saving throw on each of its turns, ending the effect on itself on a success.'
monsters.dust-mephit.innate-spellcasting.name: 'Innate Spellcasting (1/Day)'
monsters.dust-mephit.innate-spellcasting.description: 'The mephit can innately cast *sleep*, requiring no material components. Its innate spellcasting ability is Charisma.'
monsters.dust-mephit.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.dust-mephit.claws.name: 'Claws'
monsters.dust-mephit.claws.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 4 (1d4 + 2) slashing damage.'
monsters.dust-mephit.blinding-breath.name: 'Blinding Breath'
monsters.dust-mephit.blinding-breath.description: 'The mephit exhales a 15- foot cone of blinding dust. Each creature in that area must succeed on a DC 10 Dexterity saving throw or be blinded for 1 minute. A creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.eagle.name: 'Eagle'
monsters.eagle.keen-sight.name: 'Keen Sight'
monsters.eagle.keen-sight.description: 'The eagle has advantage on Wisdom (Perception) checks that rely on sight.'
monsters.eagle.talons.name: 'Talons'
monsters.eagle.talons.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 4 (1d4 + 2) slashing damage.'
monsters.earth-elemental.name: 'Earth Elemental'
monsters.earth-elemental.earth-glide.name: 'Earth Glide'
monsters.earth-elemental.earth-glide.description: "The elemental can burrow through nonmagical, unworked earth and stone. While doing so, the elemental doesn't disturb the material it moves through."
monsters.earth-elemental.siege-monster.name: 'Siege Monster'
monsters.earth-elemental.siege-monster.description: 'The elemental deals double damage to objects and structures.'
monsters.earth-elemental.multiattack.name: 'Multiattack'
monsters.earth-elemental.multiattack.description: 'The elemental makes two slam attacks.'
monsters.earth-elemental.multiattack.actions.multiattack.name: 'Multiattack'
monsters.earth-elemental.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.earth-elemental.slam.name: 'Slam'
monsters.earth-elemental.slam.description: '*Melee Weapon Attack:* +8 to hit, reach 10 ft., one target. *Hit:* 14 (2d8 + 5) bludgeoning damage.'
monsters.efreeti.name: 'Efreeti'
monsters.efreeti.elemental-demise.name: 'Elemental Demise'
monsters.efreeti.elemental-demise.description: 'If the efreeti dies, its body disintegrates in a flash of fire and puff of smoke, leaving behind only equipment the efreeti was wearing or carrying.'
monsters.efreeti.innate-spellcasting.name: 'Innate Spellcasting'
monsters.efreeti.innate-spellcasting.description: |-
  The efreeti's innate spellcasting ability is Charisma (spell save DC 15, +7 to hit with spell attacks). It can innately cast the following spells, requiring no material components:

  - At will: *detect magic*
  - 3/day: *enlarge/reduce*, *tongues*
  - 1/day each: *conjure elemental* (fire elemental only), *gaseous form, invisibility*, *major image*, *plane shift*, *wall of fire*
monsters.efreeti.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.efreeti.multiattack.name: 'Multiattack'
monsters.efreeti.multiattack.description: 'The efreeti makes two scimitar attacks or uses its Hurl Flame twice.'
monsters.efreeti.multiattack.actions.multiattack.name: 'Multiattack'
monsters.efreeti.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.efreeti.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.efreeti.multiattack.actions.multiattack.options.scimitar.name: 'Two scimitar attacks'
monsters.efreeti.multiattack.actions.multiattack.options.flame.name: 'Hurl Flame twice'
monsters.efreeti.scimitar.name: 'Scimitar'
monsters.efreeti.scimitar.description: '*Melee Weapon Attack:* +10 to hit, reach 5 ft., one target. *Hit:* 13 (2d6 + 6) slashing damage plus 7 (2d6) fire damage.'
monsters.efreeti.hurl-flame.name: 'Hurl Flame'
monsters.efreeti.hurl-flame.description: '*Ranged Spell Attack:* +7 to hit, range 120 ft., one target. *Hit:* 17 (5d6) fire damage.'
monsters.elephant.name: 'Elephant'
monsters.elephant.trampling-charge.name: 'Trampling Charge'
monsters.elephant.trampling-charge.description: 'If the elephant moves at least 20 feet straight toward a creature and then hits it with a gore attack on the same turn, that target must succeed on a DC 12 Strength saving throw or be knocked prone. If the target is prone, the elephant can make one stomp attack against it as a bonus action.'
monsters.elephant.gore.name: 'Gore'
monsters.elephant.gore.description: '*Melee Weapon Attack:* +8 to hit, reach 5 ft., one target. *Hit:* 19 (3d8 + 6) piercing damage.'
monsters.elephant.stomp.name: 'Stomp'
monsters.elephant.stomp.description: '*Melee Weapon Attack:* +8 to hit, reach 5 ft., one prone creature. *Hit:* 22 (3d10 + 6) bludgeoning damage.'
monsters.elk.name: 'Elk'
monsters.elk.charge.name: 'Charge'
monsters.elk.charge.description: 'If the elk moves at least 20 feet straight toward a target and then hits it with a ram attack on the same turn, the target takes an extra 7 (2d6) damage. If the target is a creature, it must succeed on a DC 13 Strength saving throw or be knocked prone.'
monsters.elk.ram.name: 'Ram'
monsters.elk.ram.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 6 (1d6 + 3) bludgeoning damage.'
monsters.elk.hooves.name: 'Hooves'
monsters.elk.hooves.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one prone creature. *Hit:* 8 (2d4 + 3) bludgeoning damage.'
monsters.erinyes.name: 'Erinyes'
monsters.erinyes.hellish-weapons.name: 'Hellish Weapons'
monsters.erinyes.hellish-weapons.description: "The erinyes's weapon attacks are magical and deal an extra 13 (3d8) poison damage on a hit (included in the attacks)."
monsters.erinyes.magic-resistance.name: 'Magic Resistance'
monsters.erinyes.magic-resistance.description: 'The erinyes has advantage on saving throws against spells and other magical effects.'
monsters.erinyes.multiattack.name: 'Multiattack'
monsters.erinyes.multiattack.description: 'The erinyes makes three attacks.'
monsters.erinyes.multiattack.actions.multiattack.name: 'Multiattack'
monsters.erinyes.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.erinyes.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.erinyes.multiattack.actions.multiattack.options.longsword.name: 'Three longsword attacks'
monsters.erinyes.multiattack.actions.multiattack.options.longbow.name: 'Three longbow attacks'
monsters.erinyes.longsword.name: 'Longsword'
monsters.erinyes.longsword.description: '*Melee Weapon Attack:* +8 to hit, reach 5 ft., one target. *Hit:* 8 (1d8 + 4) slashing damage, or 9 (1d10 + 4) slashing damage if used with two hands, plus 13 (3d8) poison damage.'
monsters.erinyes.longbow.name: 'Longbow'
monsters.erinyes.longbow.description: '*Ranged Weapon Attack:* +7 to hit, range 150/600 ft., one target. *Hit:* 7 (1d8 + 3) piercing damage plus 13 (3d8) poison damage, and the target must succeed on a DC 14 Constitution saving throw or be poisoned. The poison lasts until it is removed by the *lesser restoration* spell or similar magic.'
monsters.erinyes.parry.name: 'Parry'
monsters.erinyes.parry.description: 'The erinyes adds 4 to its AC against one melee attack that would hit it. To do so, the erinyes must see the attacker and be wielding a melee weapon.'
monsters.ettercap.name: 'Ettercap'
monsters.ettercap.spider-climb.name: 'Spider Climb'
monsters.ettercap.spider-climb.description: 'The ettercap can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.ettercap.web-sense.name: 'Web Sense'
monsters.ettercap.web-sense.description: 'While in contact with a web, the ettercap knows the exact location of any other creature in contact with the same web.'
monsters.ettercap.web-walker.name: 'Web Walker'
monsters.ettercap.web-walker.description: 'The ettercap ignores movement restrictions caused by webbing.'
monsters.ettercap.multiattack.name: 'Multiattack'
monsters.ettercap.multiattack.description: 'The ettercap makes two attacks: one with its bite and one with its claws.'
monsters.ettercap.multiattack.actions.multiattack.name: 'Multiattack'
monsters.ettercap.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.ettercap.bite.name: 'Bite'
monsters.ettercap.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 6 (1d8 + 2) piercing damage plus 4 (1d8) poison damage. The target must succeed on a DC 11 Constitution saving throw or be poisoned for 1 minute. The creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.ettercap.claws.name: 'Claws'
monsters.ettercap.claws.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (2d4 + 2) slashing damage.'
monsters.ettercap.web.name: 'Web'
monsters.ettercap.web.description: '*Ranged Weapon Attack:* +4 to hit, range 30/60 ft., one Large or smaller creature. *Hit:* The creature is restrained by webbing. As an action, the restrained creature can make a DC 11 Strength check, escaping from the webbing on a success. The effect also ends if the webbing is destroyed. The webbing has AC 10, 5 hit points, vulnerability to fire damage, and immunity to bludgeoning, poison, and psychic damage.'
monsters.ettin.name: 'Ettin'
monsters.ettin.two-heads.name: 'Two Heads'
monsters.ettin.two-heads.description: 'The ettin has advantage on Wisdom (Perception) checks and on saving throws against being blinded, charmed, deafened, frightened, stunned, and knocked unconscious.'
monsters.ettin.wakeful.name: 'Wakeful'
monsters.ettin.wakeful.description: "When one of the ettin's heads is asleep, its other head is awake."
monsters.ettin.multiattack.name: 'Multiattack'
monsters.ettin.multiattack.description: 'The ettin makes two attacks: one with its battleaxe and one with its morningstar.'
monsters.ettin.multiattack.actions.multiattack.name: 'Multiattack'
monsters.ettin.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.ettin.battleaxe.name: 'Battleaxe'
monsters.ettin.battleaxe.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 14 (2d8 + 5) slashing damage.'
monsters.ettin.morningstar.name: 'Morningstar'
monsters.ettin.morningstar.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 14 (2d8 + 5) piercing damage.'
monsters.fire-elemental.name: 'Fire Elemental'
monsters.fire-elemental.fire-form.name: 'Fire Form'
monsters.fire-elemental.fire-form.description: "The elemental can move through a space as narrow as 1 inch wide without squeezing. A creature that touches the elemental or hits it with a melee attack while within 5 feet of it takes 5 (1d10) fire damage. In addition, the elemental can enter a hostile creature's space and stop there. The first time it enters a creature's space on a turn, that creature takes 5 (1d10) fire damage and catches fire; until someone takes an action to douse the fire, the creature takes 5 (1d10) fire damage at the start of each of its turns."
monsters.fire-elemental.illumination.name: 'Illumination'
monsters.fire-elemental.illumination.description: 'The elemental sheds bright light in a 30- foot radius and dim light in an additional 30 feet.'
monsters.fire-elemental.water-susceptibility.name: 'Water Susceptibility'
monsters.fire-elemental.water-susceptibility.description: 'For every 5 feet the elemental moves in water, or for every gallon of water splashed on it, it takes 1 cold damage.'
monsters.fire-elemental.multiattack.name: 'Multiattack'
monsters.fire-elemental.multiattack.description: 'The elemental makes two touch attacks.'
monsters.fire-elemental.multiattack.actions.multiattack.name: 'Multiattack'
monsters.fire-elemental.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.fire-elemental.touch.name: 'Touch'
monsters.fire-elemental.touch.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 10 (2d6 + 3) fire damage. If the target is a creature or a flammable object, it ignites. Until a creature takes an action to douse the fire, the target takes 5 (1d10) fire damage at the start of each of its turns.'
monsters.fire-giant.name: 'Fire Giant'
monsters.fire-giant.multiattack.name: 'Multiattack'
monsters.fire-giant.multiattack.description: 'The giant makes two greatsword attacks.'
monsters.fire-giant.multiattack.actions.multiattack.name: 'Multiattack'
monsters.fire-giant.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.fire-giant.greatsword.name: 'Greatsword'
monsters.fire-giant.greatsword.description: '*Melee Weapon Attack:* +11 to hit, reach 10 ft., one target. *Hit:* 28 (6d6 + 7) slashing damage.'
monsters.fire-giant.rock.name: 'Rock'
monsters.fire-giant.rock.description: '*Ranged Weapon Attack:* +11 to hit, range 60/240 ft., one target. *Hit:* 29 (4d10 + 7) bludgeoning damage.'
monsters.flesh-golem.name: 'Flesh Golem'
monsters.flesh-golem.berserk.name: 'Berserk'
monsters.flesh-golem.berserk.description: |-
  Whenever the golem starts its turn with 40 hit points or fewer, roll a d6. On a 6, the golem goes berserk. On each of its turns while berserk, the golem attacks the nearest creature it can see. If no creature is near enough to move to and attack, the golem attacks an object, with preference for an object smaller than itself. Once the golem goes berserk, it continues to do so until it is destroyed or regains all its hit points.

  The golem's creator, if within 60 feet of the berserk golem, can try to calm it by speaking firmly and persuasively. The golem must be able to hear its creator, who must take an action to make a DC 15 Charisma (Persuasion) check. If the check succeeds, the golem ceases being berserk. If it takes damage while still at 40 hit points or fewer, the golem might go berserk again.
monsters.flesh-golem.aversion-of-fire.name: 'Aversion of Fire'
monsters.flesh-golem.aversion-of-fire.description: 'If the golem takes fire damage, it has disadvantage on attack rolls and ability checks until the end of its next turn.'
monsters.flesh-golem.immutable-form.name: 'Immutable Form'
monsters.flesh-golem.immutable-form.description: 'The golem is immune to any spell or effect that would alter its form.'
monsters.flesh-golem.lightning-absorption.name: 'Lightning Absorption'
monsters.flesh-golem.lightning-absorption.description: '. Whenever the golem is subjected to lightning damage, it takes no damage and instead regains a number of hit points equal to the lightning damage dealt.'
monsters.flesh-golem.magic-resistance.name: 'Magic Resistance'
monsters.flesh-golem.magic-resistance.description: 'The golem has advantage on saving throws against spells and other magical effects.'
monsters.flesh-golem.magic-weapons.name: 'Magic Weapons'
monsters.flesh-golem.magic-weapons.description: "The golem's weapon attacks are magical."
monsters.flesh-golem.multiattack.name: 'Multiattack'
monsters.flesh-golem.multiattack.description: 'The golem makes two slam attacks.'
monsters.flesh-golem.multiattack.actions.multiattack.name: 'Multiattack'
monsters.flesh-golem.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.flesh-golem.slam.name: 'Slam'
monsters.flesh-golem.slam.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) bludgeoning damage.'
monsters.flying-snake.name: 'Flying Snake'
monsters.flying-snake.flyby.name: 'Flyby'
monsters.flying-snake.flyby.description: "The snake doesn't provoke opportunity attacks when it flies out of an enemy's reach."
monsters.flying-snake.bite.name: 'Bite'
monsters.flying-snake.bite.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 1 piercing damage plus 7 (3d4) poison damage.'
monsters.flying-sword.name: 'Flying Sword'
monsters.flying-sword.antimagic-susceptibility.name: 'Antimagic Susceptibility'
monsters.flying-sword.antimagic-susceptibility.description: "The sword is incapacitated while in the area of an *antimagic field.* If targeted by *dispel magic*, the sword must succeed on a Constitution saving throw against the caster's spell save DC or fall unconscious for 1 minute."
monsters.flying-sword.false-appearance.name: 'False Appearance'
monsters.flying-sword.false-appearance.description: "While the sword remains motionless and isn't flying, it is indistinguishable from a normal sword."
monsters.flying-sword.longsword.name: 'Longsword'
monsters.flying-sword.longsword.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 5 (1d8 + 1) slashing damage.'
monsters.frog.name: 'Frog'
monsters.frog.amphibious.name: 'Amphibious'
monsters.frog.amphibious.description: 'The frog can breathe air and water.'
monsters.frog.standing-leap.name: 'Standing Leap'
monsters.frog.standing-leap.description: "The frog's long jump is up to 10 feet and its high jump is up to 5 feet, with or without a running start."
monsters.frost-giant.name: 'Frost Giant'
monsters.frost-giant.multiattack.name: 'Multiattack'
monsters.frost-giant.multiattack.description: 'The giant makes two greataxe attacks.'
monsters.frost-giant.multiattack.actions.multiattack.name: 'Multiattack'
monsters.frost-giant.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.frost-giant.greataxe.name: 'Greataxe'
monsters.frost-giant.greataxe.description: '*Melee Weapon Attack:* +9 to hit, reach 10 ft., one target. *Hit:* 25 (3d12 + 6) slashing damage.'
monsters.frost-giant.rock.name: 'Rock'
monsters.frost-giant.rock.description: '*Ranged Weapon Attack:* +9 to hit, range 60/240 ft., one target. *Hit:* 28 (4d10 + 6) bludgeoning damage.'
monsters.gargoyle.name: 'Gargoyle'
monsters.gargoyle.false-appearance.name: 'False Appearance'
monsters.gargoyle.false-appearance.description: 'While the gargoyle remains motionless, it is indistinguishable from an inanimate statue.'
monsters.gargoyle.multiattack.name: 'Multiattack'
monsters.gargoyle.multiattack.description: 'The gargoyle makes two attacks: one with its bite and one with its claws.'
monsters.gargoyle.multiattack.actions.multiattack.name: 'Multiattack'
