# Monster stat blocks: names, and the SRD 5.1's own text for traits and actions (Markdown).
monsters.aboleth.name: 'Aboleth'
monsters.aboleth.amphibious.name: 'Amphibious'
monsters.aboleth.amphibious.description: 'The aboleth can breathe air and water.'
monsters.aboleth.mucous-cloud.name: 'Mucous Cloud'
monsters.aboleth.mucous-cloud.description: 'While underwater, the aboleth is surrounded by transformative mucus. A creature that touches the aboleth or that hits it with a melee attack while within 5 feet of it must make a DC 14 Constitution saving throw. On a failure, the creature is diseased for 1d4 hours. The diseased creature can breathe only underwater.'
monsters.aboleth.probing-telepathy.name: 'Probing Telepathy'
monsters.aboleth.probing-telepathy.description: "If a creature communicates telepathically with the aboleth, the aboleth learns the creature's greatest desires if the aboleth can see the creature."
monsters.aboleth.multiattack.name: 'Multiattack'
monsters.aboleth.multiattack.description: 'The aboleth makes three tentacle attacks.'
monsters.aboleth.multiattack.actions.multiattack.name: 'Multiattack'
monsters.aboleth.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.aboleth.tentacle.name: 'Tentacle'
monsters.aboleth.tentacle.description: "*Melee Weapon Attack:* +9 to hit, reach 10 ft., one target. *Hit:* 12 (2d6 + 5) bludgeoning damage. If the target is a creature, it must succeed on a DC 14 Constitution saving throw or become diseased. The disease has no effect for 1 minute and can be removed by any magic that cures disease. After 1 minute, the diseased creature's skin becomes translucent and slimy, the creature can't regain hit points unless it is underwater, and the disease can be removed only by *heal* or another disease-curing spell of 6th level or higher. When the creature is outside a body of water, it takes 6 (1d12) acid damage every 10 minutes unless moisture is applied to the skin before 10 minutes have passed."
monsters.aboleth.tail.name: 'Tail'
monsters.aboleth.tail.description: '*Melee Weapon Attack:* +9 to hit, reach 10 ft. one target. *Hit:* 15 (3d6 + 5) bludgeoning damage.'
monsters.aboleth.enslave.name: 'Enslave (3/Day)'
monsters.aboleth.enslave.description: |-
  The aboleth targets one creature it can see within 30 feet of it. The target must succeed on a DC 14 Wisdom saving throw or be magically charmed by the aboleth until the aboleth dies or until it is on a different plane of existence from the target. The charmed target is under the aboleth's control and can't take reactions, and the aboleth and the target can communicate telepathically with each other over any distance.

  Whenever the charmed target takes damage, the target can repeat the saving throw. On a success, the effect ends. No more than once every 24 hours, the target can also repeat the saving throw when it is at least 1 mile away from the aboleth.
monsters.aboleth.detect.name: 'Detect'
monsters.aboleth.detect.description: 'The aboleth makes a Wisdom (Perception) check.'
monsters.aboleth.tail-swipe.name: 'Tail Swipe'
monsters.aboleth.tail-swipe.description: 'The aboleth makes one tail attack.'
monsters.aboleth.tail-swipe.actions.tail-swipe.name: 'Tail Swipe'
monsters.aboleth.tail-swipe.actions.tail-swipe.results.done.name: 'Done'
monsters.aboleth.psychic-drain.name: 'Psychic Drain'
monsters.aboleth.psychic-drain.description: 'One creature charmed by the aboleth takes 10 (3d6) psychic damage, and the aboleth regains hit points equal to the damage the creature takes.'
monsters.acolyte.name: 'Acolyte'
monsters.acolyte.spellcasting.name: 'Spellcasting'
monsters.acolyte.spellcasting.description: |-
  The acolyte is a 1st-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 12, +4 to hit with spell attacks). The acolyte has following cleric spells prepared:

  - Cantrips (at will): *light*, *sacred flame*, *thaumaturgy*
  - 1st level (3 slots): *bless*, *cure wounds*, *sanctuary*
monsters.acolyte.club.name: 'Club'
monsters.acolyte.club.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one target. *Hit:* 2 (1d4) bludgeoning damage.'
