monsters.giant-spider.web-walker.description: 'The spider ignores movement restrictions caused by webbing.'
monsters.giant-spider.bite.name: 'Bite'
monsters.giant-spider.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one creature. *Hit:* 7 (1d8 + 3) piercing damage, and the target must make a DC 11 Constitution saving throw, taking 9 (2d8) poison damage on a failed save, or half as much damage on a successful one. If the poison damage reduces the target to 0 hit points, the target is stable but poisoned for 1 hour, even after regaining hit points, and is paralyzed while poisoned in this way.'
monsters.giant-spider.web.name: 'Web'
monsters.giant-spider.web.description: '*Ranged Weapon Attack:* +5 to hit, range 30/60 ft., one creature. *Hit:* The target is restrained by webbing. As an action, the restrained target can make a DC 12 Strength check, bursting the webbing on a success. The webbing can also be attacked and destroyed (AC 10; hp 5; vulnerability to fire damage; immunity to bludgeoning, poison, and psychic damage).'
monsters.giant-toad.name: 'Giant Toad'
monsters.giant-toad.amphibious.name: 'Amphibious'
monsters.giant-toad.amphibious.description: 'The toad can breathe air and water.'
monsters.giant-toad.standing-leap.name: 'Standing Leap'
monsters.giant-toad.standing-leap.description: "The toad's long jump is up to 20 feet and its high jump is up to 10 feet, with or without a running start."
monsters.giant-toad.bite.name: 'Bite'
monsters.giant-toad.bite.description: "*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (1d10 + 2) piercing damage plus 5 (1d10) poison damage, and the target is grappled (escape DC 13). Until this grapple ends, the target is restrained, and the toad can't bite another target."
monsters.giant-toad.swallow.name: 'Swallow'
monsters.giant-toad.swallow.description: |-
  The toad makes one bite attack against a Medium or smaller target it is grappling. If the attack hits, the target is swallowed, and the grapple ends. The swallowed target is blinded and restrained, it has total cover against attacks and other effects outside the toad, and it takes 10 (3d6) acid damage at the start of each of the toad's turns. The toad can have only one target swallowed at a time.

  If the toad dies, a swallowed creature is no longer restrained by it and can escape from the corpse using 5 feet of movement, exiting prone.
monsters.giant-vulture.name: 'Giant Vulture'
monsters.giant-vulture.keen-sight-and-smell.name: 'Keen Sight and Smell'
monsters.giant-vulture.keen-sight-and-smell.description: 'The vulture has advantage on Wisdom (Perception) checks that rely on sight or smell.'
monsters.giant-vulture.pack-tactics.name: 'Pack Tactics'
monsters.giant-vulture.pack-tactics.description: "The vulture has advantage on an attack roll against a creature if at least one of the vulture's allies is within 5 feet of the creature and the ally isn't incapacitated."
monsters.giant-vulture.multiattack.name: 'Multiattack'
monsters.giant-vulture.multiattack.description: 'The vulture makes two attacks: one with its beak and one with its talons.'
monsters.giant-vulture.multiattack.actions.multiattack.name: 'Multiattack'
monsters.giant-vulture.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.giant-vulture.beak.name: 'Beak'
monsters.giant-vulture.beak.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (2d4 + 2) piercing damage.'
monsters.giant-vulture.talons.name: 'Talons'
monsters.giant-vulture.talons.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 9 (2d6 + 2) slashing damage.'
monsters.giant-wasp.name: 'Giant Wasp'
monsters.giant-wasp.sting.name: 'Sting'
monsters.giant-wasp.sting.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 5 (1d6 + 2) piercing damage, and the target must make a DC 11 Constitution saving throw, taking 10 (3d6) poison damage on a failed save, or half as much damage on a successful one. If the poison damage reduces the target to 0 hit points, the target is stable but poisoned for 1 hour, even after regaining hit points, and is paralyzed while poisoned in this way.'
monsters.giant-weasel.name: 'Giant Weasel'
monsters.giant-weasel.keen-hearing-and-smell.name: 'Keen Hearing and Smell'
monsters.giant-weasel.keen-hearing-and-smell.description: 'The weasel has advantage on Wisdom (Perception) checks that rely on hearing or smell.'
monsters.giant-weasel.bite.name: 'Bite'
monsters.giant-weasel.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 5 (1d4 + 3) piercing damage.'
monsters.giant-wolf-spider.name: 'Giant Wolf Spider'
monsters.giant-wolf-spider.spider-climb.name: 'Spider Climb'
monsters.giant-wolf-spider.spider-climb.description: 'The spider can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.'
monsters.giant-wolf-spider.web-sense.name: 'Web Sense'
monsters.giant-wolf-spider.web-sense.description: 'While in contact with a web, the spider knows the exact location of any other creature in contact with the same web.'
monsters.giant-wolf-spider.web-walker.name: 'Web Walker'
monsters.giant-wolf-spider.web-walker.description: 'The spider ignores movement restrictions caused by webbing.'
monsters.giant-wolf-spider.bite.name: 'Bite'
monsters.giant-wolf-spider.bite.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one creature. *Hit:* 4 (1d6 + 1) piercing damage, and the target must make a DC 11 Constitution saving throw, taking 7 (2d6) poison damage on a failed save, or half as much damage on a successful one. If the poison damage reduces the target to 0 hit points, the target is stable but poisoned for 1 hour, even after regaining hit points, and is paralyzed while poisoned in this way.'
monsters.gibbering-mouther.name: 'Gibbering Mouther'
monsters.gibbering-mouther.aberrant-ground.name: 'Aberrant Ground'
monsters.gibbering-mouther.aberrant-ground.description: 'The ground in a 10-foot radius around the mouther is doughlike difficult terrain. Each creature that starts its turn in that area must succeed on a DC 10 Strength saving throw or have its speed reduced to 0 until the start of its next turn.'
monsters.gibbering-mouther.gibbering.name: 'Gibbering'
monsters.gibbering-mouther.gibbering.description: "The mouther babbles incoherently while it can see any creature and isn't incapacitated. Each creature that starts its turn within 20 feet of the mouther and can hear the gibbering must succeed on a DC 10 Wisdom saving throw. On a failure, the creature can't take reactions until the start of its next turn and rolls a d8 to determine what it does during its turn. On a 1 to 4, the creature does nothing. On a 5 or 6, the creature takes no action or bonus action and uses all its movement to move in a randomly determined direction. On a 7 or 8, the creature makes a melee attack against a randomly determined creature within its reach or does nothing if it can't make such an attack."
monsters.gibbering-mouther.multiattack.name: 'Multiattack'
monsters.gibbering-mouther.multiattack.description: 'The gibbering mouther makes one bite attack and, if it can, uses its Blinding Spittle.'
monsters.gibbering-mouther.multiattack.actions.multiattack.name: 'Multiattack'
monsters.gibbering-mouther.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.gibbering-mouther.bites.name: 'Bites'
monsters.gibbering-mouther.bites.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one creature. *Hit:* 17 (5d6) piercing damage. If the target is Medium or smaller, it must succeed on a DC 10 Strength saving throw or be knocked prone. If the target is killed by this damage, it is absorbed into the mouther.'
monsters.gibbering-mouther.blinding-spittle.name: 'Blinding Spittle'
monsters.gibbering-mouther.blinding-spittle.description: "The mouther spits a chemical glob at a point it can see within 15 feet of it. The glob explodes in a blinding flash of light on impact. Each creature within 5 feet of the flash must succeed on a DC 13 Dexterity saving throw or be blinded until the end of the mouther's next turn."
monsters.glabrezu.name: 'Glabrezu'
monsters.glabrezu.innate-spellcasting.name: 'Innate Spellcasting'
monsters.glabrezu.innate-spellcasting.description: |-
  The glabrezu's spellcasting ability is Intelligence (spell save DC 16). The glabrezu can innately cast the following spells, requiring no material components:

  - At will: *darkness*, *detect magic*, *dispel magic*
  - 1/day each: *confusion*, *fly*, *power word stun*
monsters.glabrezu.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.glabrezu.magic-resistance.name: 'Magic Resistance'
monsters.glabrezu.magic-resistance.description: 'The glabrezu has advantage on saving throws against spells and other magical effects.'
monsters.glabrezu.multiattack.name: 'Multiattack'
monsters.glabrezu.multiattack.description: 'The glabrezu makes four attacks: two with its pincers and two with its fists. Alternatively, it makes two attacks with its pincers and casts one spell.'
monsters.glabrezu.multiattack.actions.multiattack.name: 'Multiattack'
monsters.glabrezu.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.glabrezu.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.glabrezu.multiattack.actions.multiattack.options.four.name: 'Two pincers and two fists'
monsters.glabrezu.multiattack.actions.multiattack.options.spell.name: 'Two pincers and a spell'
monsters.glabrezu.pincer.name: 'Pincer'
monsters.glabrezu.pincer.description: '*Melee Weapon Attack:* +9 to hit, reach 10 ft., one target. *Hit:* 16 (2d10 + 5) bludgeoning damage. If the target is a Medium or smaller creature, it is grappled (escape DC 15). The glabrezu has two pincers, each of which can grapple only one target.'
monsters.glabrezu.fist.name: 'Fist'
monsters.glabrezu.fist.description: '*Melee Weapon Attack:* +9 to hit, reach 5 ft., one target. *Hit:* 7 (2d4 + 2) bludgeoning damage.'
monsters.gladiator.name: 'Gladiator'
monsters.gladiator.brave.name: 'Brave'
monsters.gladiator.brave.description: 'The gladiator has advantage on saving throws against being frightened.'
monsters.gladiator.brute.name: 'Brute'
monsters.gladiator.brute.description: 'A melee weapon deals one extra die of its damage when the gladiator hits with it (included in the attack).'
monsters.gladiator.multiattack.name: 'Multiattack'
monsters.gladiator.multiattack.description: 'The gladiator makes three melee attacks or two ranged attacks.'
monsters.gladiator.multiattack.actions.multiattack.name: 'Multiattack'
monsters.gladiator.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.gladiator.multiattack.actions.multiattack.steps.form.prompt: 'Which attacks?'
monsters.gladiator.multiattack.actions.multiattack.options.melee.name: 'Three spear attacks'
monsters.gladiator.multiattack.actions.multiattack.options.ranged.name: 'Two thrown spears'
monsters.gladiator.spear.name: 'Spear'
monsters.gladiator.spear.description: '*Melee or Ranged Weapon Attack:* +7 to hit, reach 5 ft. and range 20/60 ft., one target. *Hit:* 11 (2d6 + 4) piercing damage, or 13 (2d8 + 4) piercing damage if used with two hands to make a melee attack.'
monsters.gladiator.shield-bash.name: 'Shield Bash'
monsters.gladiator.shield-bash.description: '*Melee Weapon Attack:* +7 to hit, reach 5 ft., one creature. *Hit:* 9 (2d4 + 4) bludgeoning damage. If the target is a Medium or smaller creature, it must succeed on a DC 15 Strength saving throw or be knocked prone.'
monsters.gladiator.parry.name: 'Parry'
monsters.gladiator.parry.description: 'The gladiator adds 3 to its AC against one melee attack that would hit it. To do so, the gladiator must see the attacker and be wielding a melee weapon.'
monsters.gnoll.name: 'Gnoll'
monsters.gnoll.rampage.name: 'Rampage'
monsters.gnoll.rampage.description: 'When the gnoll reduces a creature to 0 hit points with a melee attack on its turn, the gnoll can take a bonus action to move up to half its speed and make a bite attack.'
monsters.gnoll.bite.name: 'Bite'
monsters.gnoll.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 4 (1d4 + 2) piercing damage.'
monsters.gnoll.spear.name: 'Spear'
monsters.gnoll.spear.description: '*Melee or Ranged Weapon Attack:* +4 to hit, reach 5 ft. or range 20/60 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage, or 6 (1d8 + 2) piercing damage if used with two hands to make a melee attack.'
monsters.gnoll.longbow.name: 'Longbow'
monsters.gnoll.longbow.description: '*Ranged Weapon Attack:* +3 to hit, range 150/600 ft., one target. *Hit:* 5 (1d8 + 1) piercing damage.'
monsters.goat.name: 'Goat'
monsters.goat.charge.name: 'Charge'
monsters.goat.charge.description: 'If the goat moves at least 20 feet straight toward a target and then hits it with a ram attack on the same turn, the target takes an extra 2 (1d4) bludgeoning damage. If the target is a creature, it must succeed on a DC 10 Strength saving throw or be knocked prone.'
monsters.goat.sure-footed.name: 'Sure-Footed'
monsters.goat.sure-footed.description: 'The goat has advantage on Strength and Dexterity saving throws made against effects that would knock it prone.'
monsters.goat.ram.name: 'Ram'
monsters.goat.ram.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 3 (1d4 + 1) bludgeoning damage.'
monsters.goblin.name: 'Goblin'
monsters.goblin.scimitar.name: 'Scimitar'
monsters.goblin.scimitar.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) slashing damage.'
monsters.goblin.shortbow.name: 'Shortbow'
monsters.goblin.shortbow.description: '*Ranged Weapon Attack:* +4 to hit, range 80/320 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.gold-dragon-wyrmling.name: 'Gold Dragon Wyrmling'
monsters.gold-dragon-wyrmling.amphibious.name: 'Amphibious'
monsters.gold-dragon-wyrmling.amphibious.description: 'The dragon can breathe air and water.'
monsters.gold-dragon-wyrmling.bite.name: 'Bite'
monsters.gold-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 9 (1d10 + 4) piercing damage.'
monsters.gold-dragon-wyrmling.breath-weapons.name: 'Breath Weapons'
monsters.gold-dragon-wyrmling.breath-weapons.description: 'The dragon uses one of the following breath weapons.'
monsters.gold-dragon-wyrmling.fire-breath.name: 'Fire Breath'
monsters.gold-dragon-wyrmling.fire-breath.description: 'The dragon exhales fire in a 15-foot cone. Each creature in that area must make a DC 13 Dexterity saving throw, taking 22 (4d10) fire damage on a failed save, or half as much damage on a successful one.'
monsters.gold-dragon-wyrmling.weakening-breath.name: 'Weakening Breath'
monsters.gold-dragon-wyrmling.weakening-breath.description: 'The dragon exhales gas in a 15-foot cone. Each creature in that area must succeed on a DC 13 Strength saving throw or have disadvantage on Strength-based attack rolls, Strength checks, and Strength saving throws for 1 minute. A creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.gorgon.name: 'Gorgon'
monsters.gorgon.trampling-charge.name: 'Trampling Charge'
monsters.gorgon.trampling-charge.description: 'If the gorgon moves at least 20 feet straight toward a creature and then hits it with a gore attack on the same turn, that target must succeed on a DC 16 Strength saving throw or be knocked prone. If the target is prone, the gorgon can make one attack with its hooves against it as a bonus action.'
monsters.gorgon.gore.name: 'Gore'
monsters.gorgon.gore.description: '*Melee Weapon Attack:* +8 to hit, reach 5 ft., one target. *Hit:* 18 (2d12 + 5) piercing damage.'
monsters.gorgon.hooves.name: 'Hooves'
monsters.gorgon.hooves.description: '*Melee Weapon Attack:* +8 to hit, reach 5 ft., one target. *Hit:* 16 (2d10 + 5) bludgeoning damage.'
monsters.gorgon.petrifying-breath.name: 'Petrifying Breath'
monsters.gorgon.petrifying-breath.description: 'The gorgon exhales petrifying gas in a 30-foot cone. Each creature in that area must succeed on a DC 13 Constitution saving throw. On a failed save, a target begins to turn to stone and is restrained. The restrained target must repeat the saving throw at the end of its next turn. On a success, the effect ends on the target. On a failure, the target is petrified until freed by the *greater restoration* spell or other magic.'
monsters.gray-ooze.name: 'Gray Ooze'
monsters.gray-ooze.amorphous.name: 'Amorphous'
monsters.gray-ooze.amorphous.description: 'The ooze can move through a space as narrow as 1 inch wide without squeezing.'
monsters.gray-ooze.corrode-metal.name: 'Corrode Metal'
monsters.gray-ooze.corrode-metal.description: |-
  Any nonmagical weapon made of metal that hits the ooze corrodes. After dealing damage, the weapon takes a permanent and cumulative -1 penalty to damage rolls. If its penalty drops to -5, the weapon is destroyed. Nonmagical ammunition made of metal that hits the ooze is destroyed after dealing damage.

  The ooze can eat through 2-inch-thick, nonmagical metal in 1 round.
monsters.gray-ooze.false-appearance.name: 'False Appearance'
monsters.gray-ooze.false-appearance.description: 'While the ooze remains motionless, it is indistinguishable from an oily pool or wet rock.'
monsters.gray-ooze.pseudopod.name: 'Pseudopod'
monsters.gray-ooze.pseudopod.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 4 (1d6 + 1) bludgeoning damage plus 7 (2d6) acid damage, and if the target is wearing nonmagical metal armor, its armor is partly corroded and takes a permanent and cumulative -1 penalty to the AC it offers. The armor is destroyed if the penalty reduces its AC to 10.'
monsters.green-dragon-wyrmling.name: 'Green Dragon Wyrmling'
monsters.green-dragon-wyrmling.amphibious.name: 'Amphibious'
monsters.green-dragon-wyrmling.amphibious.description: 'The dragon can breathe air and water.'
monsters.green-dragon-wyrmling.bite.name: 'Bite'
monsters.green-dragon-wyrmling.bite.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 7 (1d10 + 2) piercing damage plus 3 (1d6) poison damage.'
monsters.green-dragon-wyrmling.poison-breath.name: 'Poison Breath'
monsters.green-dragon-wyrmling.poison-breath.description: 'The dragon exhales poisonous gas in a 15-foot cone. Each creature in that area must make a DC 11 Constitution saving throw, taking 21 (6d6) poison damage on a failed save, or half as much damage on a successful one.'
monsters.green-hag.name: 'Green Hag'
monsters.green-hag.amphibious.name: 'Amphibious'
monsters.green-hag.amphibious.description: 'The hag can breathe air and water.'
monsters.green-hag.innate-spellcasting.name: 'Innate Spellcasting'
monsters.green-hag.innate-spellcasting.description: |-
  The hag's innate spellcasting ability is Charisma (spell save DC 12). She can innately cast the following spells, requiring no material components:

  - At will: *dancing lights*, *minor illusion*, *vicious mockery*
monsters.green-hag.innate-spellcasting.options.innate.name: 'A use of the innate spell'
monsters.green-hag.mimicry.name: 'Mimicry'
monsters.green-hag.mimicry.description: 'The hag can mimic animal sounds and humanoid voices. A creature that hears the sounds can tell they are imitations with a successful DC 14 Wisdom (Insight) check.'
monsters.green-hag.claws.name: 'Claws'
monsters.green-hag.claws.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) slashing damage.'
monsters.green-hag.illusory-appearance.name: 'Illusory Appearance'
monsters.green-hag.illusory-appearance.description: |-
  The hag covers herself and anything she is wearing or carrying with a magical illusion that makes her look like another creature of her general size and humanoid shape. The illusion ends if the hag takes a bonus action to end it or if she dies.

  The changes wrought by this effect fail to hold up to physical inspection. For example, the hag could appear to have smooth skin, but someone touching her would feel her rough flesh. Otherwise, a creature must take an action to visually inspect the illusion and succeed on a DC 20 Intelligence (Investigation) check to discern that the hag is disguised.
monsters.green-hag.invisible-passage.name: 'Invisible Passage'
monsters.green-hag.invisible-passage.description: 'The hag magically turns invisible until she attacks or casts a spell, or until her concentration ends (as if concentrating on a spell). While invisible, she leaves no physical evidence of her passage, so she can be tracked only by magic. Any equipment she wears or carries is invisible with her.'
monsters.grick.name: 'Grick'
monsters.grick.stone-camouflage.name: 'Stone Camouflage'
monsters.grick.stone-camouflage.description: 'The grick has advantage on Dexterity (Stealth) checks made to hide in rocky terrain.'
monsters.grick.multiattack.name: 'Multiattack'
monsters.grick.multiattack.description: 'The grick makes one attack with its tentacles. If that attack hits, the grick can make one beak attack against the same target.'
monsters.grick.multiattack.actions.multiattack.name: 'Multiattack'
monsters.grick.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.grick.tentacles.name: 'Tentacles'
monsters.grick.tentacles.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 9 (2d6 + 2) slashing damage.'
monsters.grick.beak.name: 'Beak'
monsters.grick.beak.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.'
monsters.griffon.name: 'Griffon'
monsters.griffon.keen-sight.name: 'Keen Sight'
monsters.griffon.keen-sight.description: 'The griffon has advantage on Wisdom (Perception) checks that rely on sight.'
monsters.griffon.multiattack.name: 'Multiattack'
monsters.griffon.multiattack.description: 'The griffon makes two attacks: one with its beak and one with its claws.'
monsters.griffon.multiattack.actions.multiattack.name: 'Multiattack'
monsters.griffon.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.griffon.beak.name: 'Beak'
monsters.griffon.beak.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 8 (1d8 + 4) piercing damage.'
monsters.griffon.claws.name: 'Claws'
monsters.griffon.claws.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) slashing damage.'
monsters.grimlock.name: 'Grimlock'
monsters.grimlock.blind-senses.name: 'Blind Senses'
monsters.grimlock.blind-senses.description: "The grimlock can't use its blindsight while deafened and unable to smell."
monsters.grimlock.keen-hearing-and-smell.name: 'Keen Hearing and Smell'
monsters.grimlock.keen-hearing-and-smell.description: 'The grimlock has advantage on Wisdom (Perception) checks that rely on hearing or smell.'
monsters.grimlock.stone-camouflage.name: 'Stone Camouflage'
monsters.grimlock.stone-camouflage.description: 'The grimlock has advantage on Dexterity (Stealth) checks made to hide in rocky terrain.'
monsters.grimlock.spiked-bone-club.name: 'Spiked Bone Club'
monsters.grimlock.spiked-bone-club.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 5 (1d4 + 3) bludgeoning damage plus 2 (1d4) piercing damage.'
monsters.guard.name: 'Guard'
monsters.guard.spear.name: 'Spear'
monsters.guard.spear.description: '*Melee or Ranged Weapon Attack:* +3 to hit, reach 5 ft. or range 20/60 ft., one target. *Hit:* 4 (1d6 + 1) piercing damage, or 5 (1d8 + 1) piercing damage if used with two hands to make a melee attack.'
monsters.guardian-naga.name: 'Guardian Naga'
monsters.guardian-naga.rejuvenation.name: 'Rejuvenation'
monsters.guardian-naga.rejuvenation.description: 'If it dies, the naga returns to life in 1d6 days and regains all its hit points. Only a *wish* spell can prevent this trait from functioning.'
monsters.guardian-naga.spellcasting.name: 'Spellcasting'
monsters.guardian-naga.spellcasting.description: |-
  The naga is an 11th-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 16, +8 to hit with spell attacks), and it needs only verbal components to cast its spells. It has the following cleric spells prepared:

  - Cantrips (at will): *mending*, *sacred flame*, *thaumaturgy*
  - 1st level (4 slots): *command*, *cure wounds*, *shield of faith*
  - 2nd level (3 slots): *calm emotions*, *hold person*
  - 3rd level (3 slots): *bestow curse*, *clairvoyance*
  - 4th level (3 slots): *banishment*, *freedom of movement*
  - 5th level (2 slots): *flame strike*, *geas*
  - 6th level (1 slot): *true seeing*
monsters.guardian-naga.bite.name: 'Bite'
monsters.guardian-naga.bite.description: '*Melee Weapon Attack:* +8 to hit, reach 10 ft., one creature. *Hit:* 8 (1d8 + 4) piercing damage, and the target must make a DC 15 Constitution saving throw, taking 45 (10d8) poison damage on a failed save, or half as much damage on a successful one.'
monsters.guardian-naga.spit-poison.name: 'Spit Poison'
monsters.guardian-naga.spit-poison.description: '*Ranged Weapon Attack:* +8 to hit, range 15/30 ft., one creature. *Hit:* The target must make a DC 15 Constitution saving throw, taking 45 (10d8) poison damage on a failed save, or half as much damage on a successful one.'
monsters.gynosphinx.name: 'Gynosphinx'
monsters.gynosphinx.inscrutable.name: 'Inscrutable'
monsters.gynosphinx.inscrutable.description: "The sphinx is immune to any effect that would sense its emotions or read its thoughts, as well as any divination spell that it refuses. Wisdom (Insight) checks made to ascertain the sphinx's intentions or sincerity have disadvantage."
monsters.gynosphinx.magic-weapons.name: 'Magic Weapons'
monsters.gynosphinx.magic-weapons.description: "The sphinx's weapon attacks are magical."
monsters.gynosphinx.spellcasting.name: 'Spellcasting'
monsters.gynosphinx.spellcasting.description: |-
  The sphinx is a 9th-level spellcaster. Its spellcasting ability is Intelligence (spell save DC 16, +8 to hit with spell attacks). It requires no material components to cast its spells. The sphinx has the following wizard spells prepared:

  - Cantrips (at will): *mage hand*, *minor illusion*, *prestidigitation*
  - 1st level (4 slots): *detect magic*, *identify*, *shield*
  - 2nd level (3 slots): *darkness*, *locate object*, *suggestion*
  - 3rd level (3 slots): *dispel magic*, *remove curse*, *tongues*
  - 4th level (3 slots): *banishment*, *greater invisibility*
  - 5th level (1 slot): *legend lore*
