monsters.gelatinous-cube.name: 'Gelatinous Cube'
monsters.gelatinous-cube.ooze-cube.name: 'Ooze Cube'
monsters.gelatinous-cube.ooze-cube.description: |-
  The cube takes up its entire space. Other creatures can enter the space, but a creature that does so is subjected to the cube's Engulf and has disadvantage on the saving throw.

  Creatures inside the cube can be seen but have total cover. A creature within 5 feet of the cube can take an action to pull a creature or object out of the cube. Doing so requires a successful DC 12 Strength check, and the creature making the attempt takes 10 (3d6) acid damage.

  The cube can hold only one Large creature or up to four Medium or smaller creatures inside it at a time.
monsters.gelatinous-cube.transparent.name: 'Transparent'
monsters.gelatinous-cube.transparent.description: "Even when the cube is in plain sight, it takes a successful DC 15 Wisdom (Perception) check to spot a cube that has neither moved nor attacked. A creature that tries to enter the cube's space while unaware of the cube is surprised by the cube."
monsters.gelatinous-cube.pseudopod.name: 'Pseudopod'
monsters.gelatinous-cube.pseudopod.description: '*Melee Weapon Attack:* +4 to hit, reach 5 ft., one creature. *Hit:* 10 (3d6) acid damage.'
monsters.gelatinous-cube.engulf.name: 'Engulf'
monsters.gelatinous-cube.engulf.description: |-
  The cube moves up to its speed. While doing so, it can enter Large or smaller creatures' spaces. Whenever the cube enters a creature's space, the creature must make a DC 12 Dexterity saving throw.

  On a successful save, the creature can choose to be pushed 5 feet back or to the side of the cube. A creature that chooses not to be pushed suffers the consequences of a failed saving throw.

  On a failed save, the cube enters the creature's space, and the creature takes 10 (3d6) acid damage and is engulfed. The engulfed creature can't breathe, is restrained, and takes 21 (6d6) acid damage at the start of each of the cube's turns. When the cube moves, the engulfed creature moves with it.

  An engulfed creature can try to escape by taking an action to make a DC 12 Strength check. On a success, the creature escapes and enters a space of its choice within 5 feet of the cube.
monsters.ghast.name: 'Ghast'
monsters.ghast.stench.name: 'Stench'
monsters.ghast.stench.description: "Any creature that starts its turn within 5 feet of the ghast must succeed on a DC 10 Constitution saving throw or be poisoned until the start of its next turn. On a successful saving throw, the creature is immune to the ghast's Stench for 24 hours."
monsters.ghast.turning-defiance.name: 'Turning Defiance'
monsters.ghast.turning-defiance.description: 'The ghast and any ghouls within 30 feet of it have advantage on saving throws against effects that turn undead.'
monsters.ghast.bite.name: 'Bite'
monsters.ghast.bite.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one creature. *Hit:* 12 (2d8 + 3) piercing damage.'
monsters.ghast.claws.name: 'Claws'
monsters.ghast.claws.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 10 (2d6 + 3) slashing damage. If the target is a creature other than an undead, it must succeed on a DC 10 Constitution saving throw or be paralyzed for 1 minute. The target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.ghost.name: 'Ghost'
monsters.ghost.ethereal-sight.name: 'Ethereal Sight'
monsters.ghost.ethereal-sight.description: 'The ghost can see 60 feet into the Ethereal Plane when it is on the Material Plane, and vice versa.'
monsters.ghost.incorporeal-movement.name: 'Incorporeal Movement'
monsters.ghost.incorporeal-movement.description: 'The ghost can move through other creatures and objects as if they were difficult terrain. It takes 5 (1d10) force damage if it ends its turn inside an object.'
monsters.ghost.withering-touch.name: 'Withering Touch'
monsters.ghost.withering-touch.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 17 (4d6 + 3) necrotic damage.'
monsters.ghost.etherealness.name: 'Etherealness'
monsters.ghost.etherealness.description: "The ghost enters the Ethereal Plane from the Material Plane, or vice versa. It is visible on the Material Plane while it is in the Border Ethereal, and vice versa, yet it can't affect or be affected by anything on the other plane."
monsters.ghost.horrifying-visage.name: 'Horrifying Visage'
monsters.ghost.horrifying-visage.description: "Each non-undead creature within 60 feet of the ghost that can see it must succeed on a DC 13 Wisdom saving throw or be frightened for 1 minute. If the save fails by 5 or more, the target also ages 1d4 × 10 years. A frightened target can repeat the saving throw at the end of each of its turns, ending the frightened condition on itself on a success. If a target's saving throw is successful or the effect ends for it, the target is immune to this ghost's Horrifying Visage for the next 24 hours. The aging effect can be reversed with a *greater restoration* spell, but only within 24 hours of it occurring."
monsters.ghost.possession.name: 'Possession'
monsters.ghost.possession.description: |-
  One humanoid that the ghost can see within 5 feet of it must succeed on a DC 13 Charisma saving throw or be possessed by the ghost; the ghost then disappears, and the target is incapacitated and loses control of its body. The ghost now controls the body but doesn't deprive the target of awareness. The ghost can't be targeted by any attack, spell, or other effect, except ones that turn undead, and it retains its alignment, Intelligence, Wisdom, Charisma, and immunity to being charmed and frightened. It otherwise uses the possessed target's statistics, but doesn't gain access to the target's knowledge, class features, or proficiencies.

  The possession lasts until the body drops to 0 hit points, the ghost ends it as a bonus action, or the ghost is turned or forced out by an effect like the *dispel evil and good* spell. When the possession ends, the ghost reappears in an unoccupied space within 5 feet of the body. The target is immune to this ghost's Possession for 24 hours after succeeding on the saving throw or after the possession ends.
