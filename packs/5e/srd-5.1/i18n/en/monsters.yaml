monsters.adult-black-dragon.bite.description: '*Melee Weapon Attack:* +11 to hit, reach 10 ft., one target. *Hit:* 17 (2d10 + 6) piercing damage plus 4 (1d8) acid damage.'
monsters.adult-black-dragon.claw.name: 'Claw'
