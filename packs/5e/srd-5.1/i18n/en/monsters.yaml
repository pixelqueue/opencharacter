monsters.manticore.multiattack.actions.multiattack.options.melee.name: 'Bite and two claws'
monsters.manticore.multiattack.actions.multiattack.options.spikes.name: 'Three tail spikes'
monsters.manticore.bite.name: 'Bite'
monsters.manticore.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 7 (1d8 + 3) piercing damage.'
monsters.manticore.claw.name: 'Claw'
monsters.manticore.claw.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 6 (1d6 + 3) slashing damage.'
monsters.manticore.tail-spike.name: 'Tail Spike'
monsters.manticore.tail-spike.description: '*Ranged Weapon Attack:* +5 to hit, range 100/200 ft., one target. *Hit:* 7 (1d8 + 3) piercing damage.'
monsters.marilith.name: 'Marilith'
monsters.marilith.magic-resistance.name: 'Magic Resistance'
monsters.marilith.magic-resistance.description: 'The marilith has advantage on saving throws against spells and other magical effects.'
monsters.marilith.magic-weapons.name: 'Magic Weapons'
monsters.marilith.magic-weapons.description: "The marilith's weapon attacks are magical."
monsters.marilith.reactive.name: 'Reactive'
monsters.marilith.reactive.description: 'The marilith can take one reaction on every turn in a combat.'
monsters.marilith.multiattack.name: 'Multiattack'
monsters.marilith.multiattack.description: 'The marilith makes seven attacks: six with its longswords and one with its tail.'
monsters.marilith.multiattack.actions.multiattack.name: 'Multiattack'
monsters.marilith.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.marilith.longsword.name: 'Longsword'
monsters.marilith.longsword.description: '*Melee Weapon Attack:* +9 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) slashing damage.'
monsters.marilith.tail.name: 'Tail'
monsters.marilith.tail.description: "*Melee Weapon Attack:* +9 to hit, reach 10 ft., one creature. *Hit:* 15 (2d10 + 4) bludgeoning damage. If the target is Medium or smaller, it is grappled (escape DC 19). Until this grapple ends, the target is restrained, the marilith can automatically hit the target with its tail, and the marilith can't make tail attacks against other targets."
monsters.marilith.teleport.name: 'Teleport'
monsters.marilith.teleport.description: 'The marilith magically teleports, along with any equipment it is wearing or carrying, up to 120 feet to an unoccupied space it can see.'
monsters.marilith.parry.name: 'Parry'
monsters.marilith.parry.description: 'The marilith adds 5 to its AC against one melee attack that would hit it. To do so, the marilith must see the attacker and be wielding a melee weapon.'
monsters.mastiff.name: 'Mastiff'
monsters.mastiff.keen-hearing-and-smell.name: 'Keen Hearing and Smell'
monsters.mastiff.keen-hearing-and-smell.description: 'The mastiff has advantage on Wisdom (Perception) checks that rely on hearing or smell.'
monsters.mastiff.bite.name: 'Bite'
monsters.mastiff.bite.description: '*Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 4 (1d6 + 1) piercing damage. If the target is a creature, it must succeed on a DC 11 Strength saving throw or be knocked prone.'
monsters.medusa.name: 'Medusa'
monsters.medusa.petrifying-gaze.name: 'Petrifying Gaze'
monsters.medusa.petrifying-gaze.description: |-
  When a creature that can see the medusa's eyes starts its turn within 30 feet of the medusa, the medusa can force it to make a DC 14 Constitution saving throw if the medusa isn't incapacitated and can see the creature. If the saving throw fails by 5 or more, the creature is instantly petrified. Otherwise, a creature that fails the save begins to turn to stone and is restrained. The restrained creature must repeat the saving throw at the end of its next turn, becoming petrified on a failure or ending the effect on a success. The petrification lasts until the creature is freed by the *greater restoration* spell or other magic.

  Unless surprised, a creature can avert its eyes to avoid the saving throw at the start of its turn. If the creature does so, it can't see the medusa until the start of its next turn, when it can avert its eyes again. If the creature looks at the medusa in the meantime, it must immediately make the save. If the medusa sees itself reflected on a polished surface within 30 feet of it and in an area of bright light, the medusa is, due to its curse, affected by its own gaze.
monsters.medusa.multiattack.name: 'Multiattack'
monsters.medusa.multiattack.description: 'The medusa makes either three melee attacks—one with its snake hair and two with its shortsword—or two ranged attacks with its longbow.'
