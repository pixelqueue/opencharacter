monsters.mummy-lord.dreadful-glare.name: 'Dreadful Glare'
monsters.mummy-lord.dreadful-glare.description: "The mummy lord targets one creature it can see within 60 feet of it. If the target can see the mummy lord, it must succeed on a DC 16 Wisdom saving throw against this magic or become frightened until the end of the mummy's next turn. If the target fails the saving throw by 5 or more, it is also paralyzed for the same duration. A target that succeeds on the saving throw is immune to the Dreadful Glare of all mummies and mummy lords for the next 24 hours."
monsters.mummy-lord.attack.name: 'Attack'
monsters.mummy-lord.attack.description: 'The mummy lord makes one attack with its rotting fist or uses its Dreadful Glare.'
monsters.mummy-lord.attack.actions.attack.name: 'Attack'
