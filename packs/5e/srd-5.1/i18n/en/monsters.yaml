monsters.ancient-bronze-dragon.lightning-breath.name: 'Lightning Breath'
monsters.ancient-bronze-dragon.lightning-breath.description: 'The dragon exhales lightning in a 120-foot line that is 10 feet wide. Each creature in that line must make a DC 23 Dexterity saving throw, taking 88 (16d10) lightning damage on a failed save, or half as much damage on a successful one.'
monsters.ancient-bronze-dragon.repulsion-breath.name: 'Repulsion Breath'
monsters.ancient-bronze-dragon.repulsion-breath.description: 'The dragon exhales repulsion energy in a 30-foot cone. Each creature in that area must succeed on a DC 23 Strength saving throw. On a failed save, the creature is pushed 60 feet away from the dragon.'
monsters.ancient-bronze-dragon.change-shape.name: 'Change Shape'
monsters.ancient-bronze-dragon.change-shape.description: |-
  The dragon magically polymorphs into a humanoid or beast that has a challenge rating no higher than its own, or back into its true form. It reverts to its true form if it dies. Any equipment it is wearing or carrying is absorbed or borne by the new form (the dragon's choice).

  In a new form, the dragon retains its alignment, hit points, Hit Dice, ability to speak, proficiencies, Legendary Resistance, lair actions, and Intelligence, Wisdom, and Charisma scores, as well as this action. Its statistics and capabilities are otherwise replaced by those of the new form, except any class features or legendary actions of that form.
