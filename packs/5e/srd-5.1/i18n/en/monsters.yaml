monsters.mimic.name: 'Mimic'
monsters.mimic.shapechanger.name: 'Shapechanger'
monsters.mimic.shapechanger.description: "The mimic can use its action to polymorph into an object or back into its true, amorphous form. Its statistics are the same in each form. Any equipment it is wearing or carrying isn't transformed. It reverts to its true form if it dies."
monsters.mimic.adhesive.name: 'Adhesive (Object Form Only)'
monsters.mimic.adhesive.description: 'The mimic adheres to anything that touches it. A Huge or smaller creature adhered to the mimic is also grappled by it (escape DC 13). Ability checks made to escape this grapple have disadvantage.'
monsters.mimic.false-appearance.name: 'False Appearance (Object Form Only)'
monsters.mimic.false-appearance.description: 'While the mimic remains motionless, it is indistinguishable from an ordinary object.'
monsters.mimic.grappler.name: 'Grappler'
monsters.mimic.grappler.description: 'The mimic has advantage on attack rolls against any creature grappled by it.'
monsters.mimic.pseudopod.name: 'Pseudopod'
monsters.mimic.pseudopod.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 7 (1d8 + 3) bludgeoning damage. If the mimic is in object form, the target is subjected to its Adhesive trait.'
monsters.mimic.bite.name: 'Bite'
monsters.mimic.bite.description: '*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 7 (1d8 + 3) piercing damage plus 4 (1d8) acid damage.'
monsters.minotaur.name: 'Minotaur'
monsters.minotaur.charge.name: 'Charge'
monsters.minotaur.charge.description: 'If the minotaur moves at least 10 feet straight toward a target and then hits it with a gore attack on the same turn, the target takes an extra 9 (2d8) piercing damage. If the target is a creature, it must succeed on a DC 14 Strength saving throw or be pushed up to 10 feet away and knocked prone.'
monsters.minotaur.labyrinthine-recall.name: 'Labyrinthine Recall'
monsters.minotaur.labyrinthine-recall.description: 'The minotaur can perfectly recall any path it has traveled.'
monsters.minotaur.reckless.name: 'Reckless'
monsters.minotaur.reckless.description: 'At the start of its turn, the minotaur can gain advantage on all melee weapon attack rolls it makes during that turn, but attack rolls against it have advantage until the start of its next turn.'
monsters.minotaur.greataxe.name: 'Greataxe'
monsters.minotaur.greataxe.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 17 (2d12 + 4) slashing damage.'
monsters.minotaur.gore.name: 'Gore'
monsters.minotaur.gore.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) piercing damage.'
monsters.minotaur-skeleton.name: 'Minotaur Skeleton'
monsters.minotaur-skeleton.charge.name: 'Charge'
monsters.minotaur-skeleton.charge.description: 'If the skeleton moves at least 10 feet straight toward a target and then hits it with a gore attack on the same turn, the target takes an extra 9 (2d8) piercing damage. If the target is a creature, it must succeed on a DC 14 Strength saving throw or be pushed up to 10 feet away and knocked prone.'
monsters.minotaur-skeleton.greataxe.name: 'Greataxe'
monsters.minotaur-skeleton.greataxe.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 17 (2d12 + 4) slashing damage.'
monsters.minotaur-skeleton.gore.name: 'Gore'
monsters.minotaur-skeleton.gore.description: '*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 13 (2d8 + 4) piercing damage.'
monsters.mule.name: 'Mule'
monsters.mule.beast-of-burden.name: 'Beast of Burden'
monsters.mule.beast-of-burden.description: 'The mule is considered to be a Large animal for the purpose of determining its carrying capacity.'
monsters.mule.sure-footed.name: 'Sure-Footed'
monsters.mule.sure-footed.description: 'The mule has advantage on Strength and Dexterity saving throws made against effects that would knock it prone.'
monsters.mule.hooves.name: 'Hooves'
monsters.mule.hooves.description: '*Melee Weapon Attack:* +2 to hit, reach 5 ft., one target. *Hit:* 4 (1d4 + 2) bludgeoning damage.'
monsters.mummy.name: 'Mummy'
monsters.mummy.multiattack.name: 'Multiattack'
monsters.mummy.multiattack.description: 'The mummy can use its Dreadful Glare and makes one attack with its rotting fist.'
monsters.mummy.multiattack.actions.multiattack.name: 'Multiattack'
monsters.mummy.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.mummy.rotting-fist.name: 'Rotting Fist'
monsters.mummy.rotting-fist.description: "*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 10 (2d6 + 3) bludgeoning damage plus 10 (3d6) necrotic damage. If the target is a creature, it must succeed on a DC 12 Constitution saving throw or be cursed with mummy rot. The cursed target can't regain hit points, and its hit point maximum decreases by 10 (3d6) for every 24 hours that elapse. If the curse reduces the target's hit point maximum to 0, the target dies, and its body turns to dust. The curse lasts until removed by the *remove curse* spell or other magic."
monsters.mummy.dreadful-glare.name: 'Dreadful Glare'
monsters.mummy.dreadful-glare.description: "The mummy targets one creature it can see within 60 feet of it. If the target can see the mummy, it must succeed on a DC 11 Wisdom saving throw against this magic or become frightened until the end of the mummy's next turn. If the target fails the saving throw by 5 or more, it is also paralyzed for the same duration. A target that succeeds on the saving throw is immune to the Dreadful Glare of all mummies (but not mummy lords) for the next 24 hours."
monsters.mummy-lord.name: 'Mummy Lord'
monsters.mummy-lord.magic-resistance.name: 'Magic Resistance'
monsters.mummy-lord.magic-resistance.description: 'The mummy lord has advantage on saving throws against spells and other magical effects.'
monsters.mummy-lord.rejuvenation.name: 'Rejuvenation'
monsters.mummy-lord.rejuvenation.description: "A destroyed mummy lord gains a new body in 24 hours if its heart is intact, regaining all its hit points and becoming active again. The new body appears within 5 feet of the mummy lord's heart."
monsters.mummy-lord.spellcasting.name: 'Spellcasting'
monsters.mummy-lord.spellcasting.description: |-
  The mummy lord is a 10th-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 17, +9 to hit with spell attacks). The mummy lord has the following cleric spells prepared:

  - Cantrips (at will): *sacred flame*, *thaumaturgy*
  - 1st level (4 slots): *command*, *guiding bolt*, *shield of faith*
  - 2nd level (3 slots): *hold person*, *silence*, *spiritual weapon*
  - 3rd level (3 slots): *animate dead*, *dispel magic*
  - 4th level (3 slots): *divination*, *guardian of faith*
  - 5th level (2 slots): *contagion*, *insect plague*
  - 6th level (1 slot): *harm*
monsters.mummy-lord.multiattack.name: 'Multiattack'
monsters.mummy-lord.multiattack.description: 'The mummy can use its Dreadful Glare and makes one attack with its rotting fist.'
monsters.mummy-lord.multiattack.actions.multiattack.name: 'Multiattack'
monsters.mummy-lord.multiattack.actions.multiattack.results.done.name: 'Done'
