monsters.androsphinx.name: 'Androsphinx'
monsters.androsphinx.inscrutable.name: 'Inscrutable'
monsters.androsphinx.inscrutable.description: "The sphinx is immune to any effect that would sense its emotions or read its thoughts, as well as any divination spell that it refuses. Wisdom (Insight) checks made to ascertain the sphinx's intentions or sincerity have disadvantage."
monsters.androsphinx.magic-weapons.name: 'Magic Weapons'
monsters.androsphinx.magic-weapons.description: "The sphinx's weapon attacks are magical."
monsters.androsphinx.spellcasting.name: 'Spellcasting'
monsters.androsphinx.spellcasting.description: |-
  The sphinx is a 12th-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 18, +10 to hit with spell attacks). It requires no material components to cast its spells. The sphinx has the following cleric spells prepared:

  - Cantrips (at will): *sacred flame*, *spare the dying*, *thaumaturgy*
  - 1st level (4 slots): *command*, *detect evil and good*, *detect magic*
  - 2nd level (3 slots): *lesser restoration*, *zone of truth*
  - 3rd level (3 slots): *dispel magic*, *tongues*
  - 4th level (3 slots): *banishment*, *freedom of movement*
  - 5th level (2 slots): *flame strike*, *greater restoration*
  - 6th level (1 slot): *heroes' feast*
monsters.androsphinx.multiattack.name: 'Multiattack'
monsters.androsphinx.multiattack.description: 'The sphinx makes two claw attacks.'
monsters.androsphinx.multiattack.actions.multiattack.name: 'Multiattack'
monsters.androsphinx.multiattack.actions.multiattack.results.done.name: 'Done'
monsters.androsphinx.claw.name: 'Claw'
monsters.androsphinx.claw.description: '*Melee Weapon Attack:* +12 to hit, reach 5 ft., one target. *Hit:* 17 (2d10 + 6) slashing damage.'
monsters.androsphinx.roar.name: 'Roar (3/Day)'
monsters.androsphinx.roar.description: 'The sphinx emits a magical roar. Each time it roars before finishing a long rest, the roar is louder and the effect is different, as detailed below. Each creature within 500 feet of the sphinx and able to hear the roar must make a saving throw.'
monsters.androsphinx.first-roar.name: 'First Roar'
monsters.androsphinx.first-roar.description: 'Each creature that fails a DC 18 Wisdom saving throw is frightened for 1 minute. A frightened creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.androsphinx.second-roar.name: 'Second Roar'
monsters.androsphinx.second-roar.description: 'Each creature that fails a DC 18 Wisdom saving throw is deafened and frightened for 1 minute. A frightened creature is paralyzed and can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.'
monsters.androsphinx.third-roar.name: 'Third Roar'
monsters.androsphinx.third-roar.description: "Each creature makes a DC 18 Constitution saving throw. On a failed save, a creature takes 44 (8d10) thunder damage and is knocked prone. On a successful save, the creature takes half as much damage and isn't knocked prone."
