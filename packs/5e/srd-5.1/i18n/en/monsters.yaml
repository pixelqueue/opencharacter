monsters.adult-black-dragon.tail.description: '*Melee Weapon Attack:* +11 to hit, reach 15 ft., one target. *Hit:* 15 (2d8 + 6) bludgeoning damage.'
monsters.adult-black-dragon.frightful-presence.name: 'Frightful Presence'
monsters.adult-black-dragon.frightful-presence.description: "Each creature of the dragon's choice that is within 120 feet of the dragon and aware of it must succeed on a DC 16 Wisdom saving throw or become frightened for 1 minute. A creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success. If a creature's saving throw is successful or the effect ends for it, the creature is immune to the dragon's Frightful Presence for the next 24 hours."
monsters.adult-black-dragon.acid-breath.name: 'Acid Breath'
monsters.adult-black-dragon.acid-breath.description: 'The dragon exhales acid in a 60-foot line that is 5 feet wide. Each creature in that line must make a DC 18 Dexterity saving throw, taking 54 (12d8) acid damage on a failed save, or half as much damage on a successful one.'
