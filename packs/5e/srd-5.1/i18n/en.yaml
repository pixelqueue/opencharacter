features.sorcerer.sorcerous-restoration.name: 'Sorcerous Restoration'
features.sorcerer.sorcerous-restoration.description: 'At 20th level, you regain 4 expended sorcery points whenever you finish a short rest.'
features.sorcerer.dragon-ancestor.name: 'Dragon Ancestor'
features.sorcerer.dragon-ancestor.description: |-
  At 1st level, you choose one type of dragon as your ancestor. The damage type associated with each dragon is used by features you gain later. You can speak, read, and write Draconic. Additionally, whenever you make a Charisma check when interacting with dragons, your proficiency bonus is doubled if it applies to the check.

  **Draconic Ancestry**

  | Dragon | Damage Type |
  | --- | --- |
  | Black | Acid |
  | Blue | Lightning |
  | Brass | Fire |
  | Bronze | Lightning |
  | Copper | Acid |
  | Gold | Fire |
  | Green | Poison |
  | Red | Fire |
  | Silver | Cold |
  | White | Cold |
features.sorcerer.dragon-ancestor.choices.dragon.prompt: 'Choose a dragon ancestor'
features.sorcerer.dragon-ancestor.choices.dragon.options.black.name: 'Black'
features.sorcerer.dragon-ancestor.choices.dragon.options.blue.name: 'Blue'
features.sorcerer.dragon-ancestor.choices.dragon.options.brass.name: 'Brass'
features.sorcerer.dragon-ancestor.choices.dragon.options.bronze.name: 'Bronze'
features.sorcerer.dragon-ancestor.choices.dragon.options.copper.name: 'Copper'
features.sorcerer.dragon-ancestor.choices.dragon.options.gold.name: 'Gold'
features.sorcerer.dragon-ancestor.choices.dragon.options.green.name: 'Green'
features.sorcerer.dragon-ancestor.choices.dragon.options.red.name: 'Red'
features.sorcerer.dragon-ancestor.choices.dragon.options.silver.name: 'Silver'
features.sorcerer.dragon-ancestor.choices.dragon.options.white.name: 'White'
features.sorcerer.draconic-resilience.name: 'Draconic Resilience'
features.sorcerer.draconic-resilience.description: |-
  As magic flows through your body, it causes physical traits of your dragon ancestors to emerge. At 1st level, your hit point maximum increases by 1 and increases by 1 again whenever you gain a level in this class.

  Additionally, parts of your skin are covered by a thin sheen of dragon-like scales. When you aren't wearing armor, your AC equals 13 + your Dexterity modifier.
features.sorcerer.elemental-affinity.name: 'Elemental Affinity'
features.sorcerer.elemental-affinity.description: 'Starting at 6th level, when you cast a spell that deals damage of the type associated with your draconic ancestry, you can add your Charisma modifier to one damage roll of that spell. At the same time, you can spend 1 sorcery point to gain resistance to that damage type for 1 hour.'
features.sorcerer.dragon-wings.name: 'Dragon Wings'
features.sorcerer.dragon-wings.description: |-
  At 14th level, you gain the ability to sprout a pair of dragon wings from your back, gaining a flying speed equal to your current speed. You can create these wings as a bonus action on your turn. They last until you dismiss them as a bonus action on your turn.

  You can't manifest your wings while wearing armor unless the armor is made to accommodate them, and clothing not made to accommodate your wings might be destroyed when you manifest them.
features.sorcerer.draconic-presence.name: 'Draconic Presence'
features.sorcerer.draconic-presence.description: 'Beginning at 18th level, you can channel the dread presence of your dragon ancestor, causing those around you to become awestruck or frightened. As an action, you can spend 5 sorcery points to draw on this power and exude an aura of awe or fear (your choice) to a distance of 60 feet. For 1 minute or until you lose your concentration (as if you were casting a concentration spell), each hostile creature that starts its turn in this aura must succeed on a Wisdom saving throw or be charmed (if you chose awe) or frightened (if you chose fear) until the aura ends. A creature that succeeds on this saving throw is immune to your aura for 24 hours.'
features.warlock.pact-magic.name: 'Pact Magic'
features.warlock.pact-magic.description: |-
  Your arcane research and the magic bestowed on you by your patron have given you facility with spells.

  **Cantrips**

  You know two cantrips of your choice from the warlock spell list. You learn additional warlock cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Warlock table.

  **Spell Slots**

  The Warlock table shows how many spell slots you have. The table also shows what the level of those slots is; all of your spell slots are the same level. To cast one of your warlock spells of 1st level or higher, you must expend a spell slot. You regain all expended spell slots when you finish a short or long rest.

  For example, when you are 5th level, you have two 3rd-level spell slots. To cast the 1st-level spell *thunderwave*, you must spend one of those slots, and you cast it as a 3rd-level spell.

  **Spells Known of 1st Level and Higher**

  At 1st level, you know two 1st-level spells of your choice from the warlock spell list.

  The Spells Known column of the Warlock table shows when you learn more warlock spells of your choice of 1st level and higher. A spell you choose must be of a level no higher than what's shown in the table's Slot Level column for your level. When you reach 6th level, for example, you learn a new warlock spell, which can be 1st, 2nd, or 3rd level.

  Additionally, when you gain a level in this class, you can choose one of the warlock spells you know and replace it with another spell from the warlock spell list, which also must be of a level for which you have spell slots.

  **Spellcasting Ability**

  Charisma is your spellcasting ability for your warlock spells, so you use your Charisma whenever a spell refers to your spellcasting ability. In addition, you use your Charisma modifier when setting the saving throw DC for a warlock spell you cast and when making an attack roll with one.

  **Spell save DC** = 8 + your proficiency bonus + your Charisma modifier

  **Spell attack modifier** = your proficiency bonus + your Charisma modifier

  **Spellcasting Focus**

  You can use an arcane focus as a spellcasting focus for your warlock spells.
features.warlock.eldritch-invocations.name: 'Eldritch Invocations'
features.warlock.eldritch-invocations.description: |-
  In your study of occult lore, you have unearthed eldritch invocations, fragments of forbidden knowledge that imbue you with an abiding magical ability.

  At 2nd level, you gain two eldritch invocations of your choice. Your invocation options are detailed at the end of the class description. When you gain certain warlock levels, you gain additional invocations of your choice, as shown in the Invocations Known column of the Warlock table.

  Additionally, when you gain a level in this class, you can choose one of the invocations you know and replace it with another invocation that you could learn at that level.
features.warlock.eldritch-invocations.choices.invocations.prompt: 'Choose eldritch invocations'
features.warlock.pact-boon.name: 'Pact Boon'
features.warlock.pact-boon.description: |-
  At 3rd level, your otherworldly patron bestows a gift upon you for your loyal service. You gain one of the following features of your choice.

  **Pact of the Chain**

  You learn the *find familiar* spell and can cast it as a ritual. The spell doesn't count against your number of spells known.

  When you cast the spell, you can choose one of the normal forms for your familiar or one of the following special forms: imp, pseudodragon, quasit, or sprite.

  Additionally, when you take the Attack action, you can forgo one of your own attacks to allow your familiar to make one attack of its own with its reaction.

  **Pact of the Blade**

  You can use your action to create a pact weapon in your empty hand. You can choose the form that this melee weapon takes each time you create it. You are proficient with it while you wield it. This weapon counts as magical for the purpose of overcoming resistance and immunity to nonmagical attacks and damage.

  Your pact weapon disappears if it is more than 5 feet away from you for 1 minute or more. It also disappears if you use this feature again, if you dismiss the weapon (no action required), or if you die.

  You can transform one magic weapon into your pact weapon by performing a special ritual while you hold the weapon. You perform the ritual over the course of 1 hour, which can be done during a short rest. You can then dismiss the weapon, shunting it into an extradimensional space, and it appears whenever you create your pact weapon thereafter. You can't affect an artifact or a sentient weapon in this way. The weapon ceases being your pact weapon if you die, if you perform the 1-hour ritual on a different weapon, or if you use a 1-hour ritual to break your bond to it. The weapon appears at your feet if it is in the extradimensional space when the bond breaks.

  **Pact of the Tome**

  Your patron gives you a grimoire called a Book of Shadows. When you gain this feature, choose three cantrips from any class's spell list (the three needn't be from the same list). While the book is on your person, you can cast those cantrips at will. They don't count against your number of cantrips known. If they don't appear on the warlock spell list, they are nonetheless warlock spells for you.

  If you lose your Book of Shadows, you can perform a 1-hour ceremony to receive a replacement from your patron. This ceremony can be performed during a short or long rest, and it destroys the previous book. The book turns to ash when you die.
features.warlock.pact-boon.choices.boon.prompt: 'Choose a pact boon'
features.warlock.mystic-arcanum.name: 'Mystic Arcanum'
features.warlock.mystic-arcanum.description: |-
  At 11th level, your patron bestows upon you a magical secret called an arcanum. Choose one 6th-level spell from the warlock spell list as this arcanum.

  You can cast your arcanum spell once without expending a spell slot. You must finish a long rest before you can do so again.

  At higher levels, you gain more warlock spells of your choice that can be cast in this way: one 7th-level spell at 13th level, one 8th-level spell at 15th level, and one 9th-level spell at 17th level. You regain all uses of your Mystic Arcanum when you finish a long rest.
features.warlock.eldritch-master.name: 'Eldritch Master'
features.warlock.eldritch-master.description: 'At 20th level, you can draw on your inner reserve of mystical power while entreating your patron to regain expended spell slots. You can spend 1 minute entreating your patron for aid to regain all your expended spell slots from your Pact Magic feature. Once you regain spell slots with this feature, you must finish a long rest before you can do so again.'
features.warlock.dark-ones-blessing.name: "Dark One's Blessing"
features.warlock.dark-ones-blessing.description: 'Starting at 1st level, when you reduce a hostile creature to 0 hit points, you gain temporary hit points equal to your Charisma modifier + your warlock level (minimum of 1).'
features.warlock.dark-ones-own-luck.name: "Dark One's Own Luck"
features.warlock.dark-ones-own-luck.description: |-
  Starting at 6th level, you can call on your patron to alter fate in your favor. When you make an ability check or a saving throw, you can use this feature to add a d10 to your roll. You can do so after seeing the initial roll but before any of the roll's effects occur.

  Once you use this feature, you can't use it again until you finish a short or long rest.
features.warlock.fiendish-resilience.name: 'Fiendish Resilience'
features.warlock.fiendish-resilience.description: 'Starting at 10th level, you can choose one damage type when you finish a short or long rest. You gain resistance to that damage type until you choose a different one with this feature. Damage from magical weapons or silver weapons ignores this resistance.'
features.warlock.fiendish-resilience.choices.damage-type.prompt: 'Choose a damage type to resist'
features.warlock.fiendish-resilience.choices.damage-type.options.acid.name: 'Acid'
features.warlock.fiendish-resilience.choices.damage-type.options.bludgeoning.name: 'Bludgeoning'
features.warlock.fiendish-resilience.choices.damage-type.options.cold.name: 'Cold'
features.warlock.fiendish-resilience.choices.damage-type.options.fire.name: 'Fire'
features.warlock.fiendish-resilience.choices.damage-type.options.force.name: 'Force'
features.warlock.fiendish-resilience.choices.damage-type.options.lightning.name: 'Lightning'
features.warlock.fiendish-resilience.choices.damage-type.options.necrotic.name: 'Necrotic'
features.warlock.fiendish-resilience.choices.damage-type.options.piercing.name: 'Piercing'
features.warlock.fiendish-resilience.choices.damage-type.options.poison.name: 'Poison'
features.warlock.fiendish-resilience.choices.damage-type.options.psychic.name: 'Psychic'
features.warlock.fiendish-resilience.choices.damage-type.options.radiant.name: 'Radiant'
features.warlock.fiendish-resilience.choices.damage-type.options.slashing.name: 'Slashing'
features.warlock.fiendish-resilience.choices.damage-type.options.thunder.name: 'Thunder'
features.warlock.hurl-through-hell.name: 'Hurl Through Hell'
features.warlock.hurl-through-hell.description: |-
  Starting at 14th level, when you hit a creature with an attack, you can use this feature to instantly transport the target through the lower planes. The creature disappears and hurtles through a nightmare landscape.

  At the end of your next turn, the target returns to the space it previously occupied, or the nearest unoccupied space. If the target is not a fiend, it takes 10d10 psychic damage as it reels from its horrific experience.

  Once you use this feature, you can't use it again until you finish a long rest.
features.wizard.spellcasting.name: 'Spellcasting'
features.wizard.spellcasting.description: |-
  As a student of arcane magic, you have a spellbook containing spells that show the first glimmerings of your true power.

  **Cantrips**

  At 1st level, you know three cantrips of your choice from the wizard spell list. You learn additional wizard cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Wizard table.

  **Spellbook**

  At 1st level, you have a spellbook containing six 1st-level wizard spells of your choice. Your spellbook is the repository of the wizard spells you know, except your cantrips, which are fixed in your mind.

  **Preparing and Casting Spells**

  The Wizard table shows how many spell slots you have to cast your spells of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

  You prepare the list of wizard spells that are available for you to cast. To do so, choose a number of wizard spells from your spellbook equal to your Intelligence modifier + your wizard level (minimum of one spell). The spells must be of a level for which you have spell slots.

  For example, if you're a 3rd-level wizard, you have four 1st-level and two 2nd-level spell slots. With an Intelligence of 16, your list of prepared spells can include six spells of 1st or 2nd level, in any combination, chosen from your spellbook. If you prepare the 1st-level spell *magic missile,* you can cast it using a 1st-level or a 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.

  You can change your list of prepared spells when you finish a long rest. Preparing a new list of wizard spells requires time spent studying your spellbook and memorizing the incantations and gestures you must make to cast the spell: at least 1 minute per spell level for each spell on your list.

  **Spellcasting Ability**

  Intelligence is your spellcasting ability for your wizard spells, since you learn your spells through dedicated study and memorization. You use your Intelligence whenever a spell refers to your spellcasting ability. In addition, you use your Intelligence modifier when setting the saving throw DC for a wizard spell you cast and when making an attack roll with one.

  **Spell save DC** = 8 + your proficiency bonus + your Intelligence modifier

  **Spell attack modifier** = your proficiency bonus + your Intelligence modifier

  **Ritual Casting**

  You can cast a wizard spell as a ritual if that spell has the ritual tag and you have the spell in your spellbook. You don't need to have the spell prepared.

  **Spellcasting Focus**

  You can use an arcane focus as a spellcasting focus for your wizard spells.

  **Learning Spells of 1st Level and Higher**

  Each time you gain a wizard level, you can add two wizard spells of your choice to your spellbook for free. Each of these spells must be of a level for which you have spell slots, as shown on the Wizard table. On your adventures, you might find other spells that you can add to your spellbook (see the "Your Spellbook" sidebar).
features.wizard.arcane-recovery.name: 'Arcane Recovery'
features.wizard.arcane-recovery.description: |-
  You have learned to regain some of your magical energy by studying your spellbook. Once per day when you finish a short rest, you can choose expended spell slots to recover. The spell slots can have a combined level that is equal to or less than half your wizard level (rounded up), and none of the slots can be 6th level or higher.

  For example, if you're a 4th-level wizard, you can recover up to two levels worth of spell slots. You can recover either a 2nd-level spell slot or two 1st-level spell slots.
features.wizard.spell-mastery.name: 'Spell Mastery'
features.wizard.spell-mastery.description: |-
  At 18th level, you have achieved such mastery over certain spells that you can cast them at will. Choose a 1st-level wizard spell and a 2nd-level wizard spell that are in your spellbook. You can cast those spells at their lowest level without expending a spell slot when you have them prepared. If you want to cast either spell at a higher level, you must expend a spell slot as normal.

  By spending 8 hours in study, you can exchange one or both of the spells you chose for different spells of the same levels.
features.wizard.signature-spells.name: 'Signature Spells'
features.wizard.signature-spells.description: |-
  When you reach 20th level, you gain mastery over two powerful spells and can cast them with little effort. Choose two 3rd-level wizard spells in your spellbook as your signature spells. You always have these spells prepared, they don't count against the number of spells you have prepared, and you can cast each of them once at 3rd level without expending a spell slot. When you do so, you can't do so again until you finish a short or long rest.

  If you want to cast either spell at a higher level, you must expend a spell slot as normal.
features.wizard.evocation-savant.name: 'Evocation Savant'
features.wizard.evocation-savant.description: 'Beginning when you select this school at 2nd level, the gold and time you must spend to copy an evocation spell into your spellbook is halved.'
features.wizard.sculpt-spells.name: 'Sculpt Spells'
features.wizard.sculpt-spells.description: "Beginning at 2nd level, you can create pockets of relative safety within the effects of your evocation spells. When you cast an evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 + the spell's level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save."
features.wizard.sculpt-spells.options.spare.name: 'Spare it (Sculpt Spells)'
features.wizard.potent-cantrip.name: 'Potent Cantrip'
features.wizard.potent-cantrip.description: "Starting at 6th level, your damaging cantrips affect even creatures that avoid the brunt of the effect. When a creature succeeds on a saving throw against your cantrip, the creature takes half the cantrip's damage (if any) but suffers no additional effect from the cantrip."
features.wizard.empowered-evocation.name: 'Empowered Evocation'
features.wizard.empowered-evocation.description: 'Beginning at 10th level, you can add your Intelligence modifier to one damage roll of any wizard evocation spell you cast.'
features.wizard.overchannel.name: 'Overchannel'
features.wizard.overchannel.description: |-
  Starting at 14th level, you can increase the power of your simpler spells. When you cast a wizard spell of 1st through 5th level that deals damage, you can deal maximum damage with that spell.

  The first time you do so, you suffer no adverse effect. If you use this feature again before you finish a long rest, you take 2d12 necrotic damage for each level of the spell, immediately after you cast it. Each time you use this feature again before finishing a long rest, the necrotic damage per spell level increases by 1d12. This damage ignores resistance and immunity.

# Fighting styles
fighting-styles.archery.name: 'Archery'
fighting-styles.archery.description: 'You gain a +2 bonus to attack rolls you make with ranged weapons.'
fighting-styles.great-weapon-fighting.name: 'Great Weapon Fighting'
fighting-styles.great-weapon-fighting.description: 'When you roll a 1 or 2 on a damage die for an attack you make with a melee weapon that you are wielding with two hands, you can reroll the die and must use the new roll, even if the new roll is a 1 or a 2. The weapon must have the two-handed or versatile property for you to gain this benefit.'
fighting-styles.protection.name: 'Protection'
fighting-styles.protection.description: 'When a creature you can see attacks a target other than you that is within 5 feet of you, you can use your reaction to impose disadvantage on the attack roll. You must be wielding a shield.'
fighting-styles.two-weapon-fighting.name: 'Two-Weapon Fighting'
fighting-styles.two-weapon-fighting.description: 'When you engage in two-weapon fighting, you can add your ability modifier to the damage of the second attack.'

# Pact boons
