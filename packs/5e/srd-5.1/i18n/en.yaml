magic-items.ring-of-water-elemental-command.name: 'Ring of Water Elemental Command'
magic-items.ring-of-water-elemental-command.description: |-
  This ring is linked to one of the four Elemental Planes. The GM chooses or randomly determines the linked plane.

  While wearing this ring, you have advantage on attack rolls against elementals from the linked plane, and they have disadvantage on attack rolls against you. In addition, you have access to properties based on the linked plane.

  The ring has 5 charges. It regains 1d4 + 1 expended charges daily at dawn. Spells cast from the ring have a save DC of 17.

  ***Ring of Water Elemental Command.*** You can expend 2 of the ring's charges to cast *dominate monster* on a water elemental. In addition, you can stand on and walk across liquid surfaces as if they were solid ground. You can also speak and understand Aquan.

  If you help slay a water elemental while attuned to the ring, you gain access to the following additional properties:

  - You can breathe underwater and have a swimming speed equal to your walking speed.
  - You can cast the following spells from the ring, expending the necessary number of charges: *create or destroy water* (1 charge), *control water* (3 charges), *ice storm* (2 charges), or *wall of ice* (3 charges).
magic-items.ring-of-water-elemental-command.options.charges.name: 'Ring of Water Elemental Command (charges)'
magic-items.ring-of-water-elemental-command.state.charges.name: 'Charges'
magic-items.ring-of-water-elemental-command.state.elementalSlain.name: 'Elemental slain'
magic-items.ring-of-evasion.name: 'Ring of Evasion'
magic-items.ring-of-evasion.description: 'This ring has 3 charges, and it regains 1d3 expended charges daily at dawn. When you fail a Dexterity saving throw while wearing it, you can use your reaction to expend 1 of its charges to succeed on that saving throw instead.'
magic-items.ring-of-evasion.actions.evade.name: 'Succeed on the failed Dexterity save'
magic-items.ring-of-evasion.actions.evade.results.success.name: 'Success'
magic-items.ring-of-evasion.state.charges.name: 'Charges'
magic-items.ring-of-feather-falling.name: 'Ring of Feather Falling'
magic-items.ring-of-feather-falling.description: 'When you fall while wearing this ring, you descend 60 feet per round and take no damage from falling.'
magic-items.ring-of-free-action.name: 'Ring of Free Action'
magic-items.ring-of-free-action.description: "While you wear this ring, difficult terrain doesn't cost you extra movement. In addition, magic can neither reduce your speed nor cause you to be paralyzed or restrained."
magic-items.ring-of-invisibility.name: 'Ring of Invisibility'
magic-items.ring-of-invisibility.description: 'While wearing this ring, you can turn invisible as an action. Anything you are wearing or carrying is invisible with you. You remain invisible until the ring is removed, until you attack or cast a spell, or until you use a bonus action to become visible again.'
magic-items.ring-of-invisibility.state.invisible.name: 'Invisible'
magic-items.ring-of-jumping.name: 'Ring of Jumping'
magic-items.ring-of-jumping.description: 'While wearing this ring, you can cast the *jump* spell from it as a bonus action at will, but can target only yourself when you do so.'
magic-items.ring-of-mind-shielding.name: 'Ring of Mind Shielding'
magic-items.ring-of-mind-shielding.description: |-
  While wearing this ring, you are immune to magic that allows other creatures to read your thoughts, determine whether you are lying, know your alignment, or know your creature type. Creatures can telepathically communicate with you only if you allow it.

  You can use an action to cause the ring to become invisible until you use another action to make it visible, until you remove the ring, or until you die.

  If you die while wearing the ring, your soul enters it, unless it already houses a soul. You can remain in the ring or depart for the afterlife. As long as your soul is in the ring, you can telepathically communicate with any creature wearing it. A wearer can't prevent this telepathic communication.
magic-items.ring-of-protection.name: 'Ring of Protection'
magic-items.ring-of-protection.description: 'You gain a +1 bonus to AC and saving throws while wearing this ring.'
magic-items.ring-of-regeneration.name: 'Ring of Regeneration'
magic-items.ring-of-regeneration.description: 'While wearing this ring, you regain 1d6 hit points every 10 minutes, provided that you have at least 1 hit point. If you lose a body part, the ring causes the missing part to regrow and return to full functionality after 1d6 + 1 days if you have at least 1 hit point the whole time.'
magic-items.ring-of-regeneration.actions.regenerate.name: 'Regenerate (every 10 minutes)'
magic-items.ring-of-regeneration.actions.regenerate.results.healed.name: 'Healed'
magic-items.ring-of-resistance.name: 'Ring of Resistance'
magic-items.ring-of-resistance.description: |-
  You have resistance to one damage type while wearing this ring. The gem in the ring indicates the type, which the GM chooses or determines randomly.

  | d10 | Damage Type | Gem |
  | --- | --- | --- |
  | 1 | Acid | Pearl |
  | 2 | Cold | Tourmaline |
  | 3 | Fire | Garnet |
  | 4 | Force | Sapphire |
  | 5 | Lightning | Citrine |
  | 6 | Necrotic | Jet |
  | 7 | Poison | Amethyst |
  | 8 | Psychic | Jade |
  | 9 | Radiant | Topaz |
  | 10 | Thunder | Spinel |
magic-items.ring-of-resistance.choices.damage-type.prompt: 'Choose the damage type'
magic-items.ring-of-resistance.choices.damage-type.options.acid.name: 'Acid'
magic-items.ring-of-resistance.choices.damage-type.options.cold.name: 'Cold'
magic-items.ring-of-resistance.choices.damage-type.options.fire.name: 'Fire'
magic-items.ring-of-resistance.choices.damage-type.options.force.name: 'Force'
magic-items.ring-of-resistance.choices.damage-type.options.lightning.name: 'Lightning'
magic-items.ring-of-resistance.choices.damage-type.options.necrotic.name: 'Necrotic'
magic-items.ring-of-resistance.choices.damage-type.options.poison.name: 'Poison'
magic-items.ring-of-resistance.choices.damage-type.options.psychic.name: 'Psychic'
magic-items.ring-of-resistance.choices.damage-type.options.radiant.name: 'Radiant'
magic-items.ring-of-resistance.choices.damage-type.options.thunder.name: 'Thunder'
magic-items.ring-of-shooting-stars.name: 'Ring of Shooting Stars'
magic-items.ring-of-shooting-stars.description: |-
  While wearing this ring in dim light or darkness, you can cast *dancing lights* and *light* from the ring at will. Casting either spell from the ring requires an action.

  The ring has 6 charges for the following other properties. The ring regains 1d6 expended charges daily at dawn.

  ***Faerie Fire.*** You can expend 1 charge as an action to cast *faerie fire* from the ring.

  ***Ball Lightning.*** You can expend 2 charges as an action to create one to four 3-foot-diameter spheres of lightning. The more spheres you create, the less powerful each sphere is individually.

  Each sphere appears in an unoccupied space you can see within 120 feet of you. The spheres last as long as you concentrate (as if concentrating on a spell), up to 1 minute. Each sphere sheds dim light in a 30-foot radius.

  As a bonus action, you can move each sphere up to 30 feet, but no farther than 120 feet away from you. When a creature other than you comes within 5 feet of a sphere, the sphere discharges lightning at that creature and disappears. That creature must make a DC 15 Dexterity saving throw. On a failed save, the creature takes lightning damage based on the number of spheres you created.

  | Spheres | Lightning Damage |
  | --- | --- |
  | 4 | 2d4 |
  | 3 | 2d6 |
  | 2 | 5d4 |
  | 1 | 4d12 |

  ***Shooting Stars.*** You can expend 1 to 3 charges as an action. For every charge you expend, you launch a glowing mote of light from the ring at a point you can see within 60 feet of you. Each creature within a 15-foot cube originating from that point is showered in sparks and must make a DC 15 Dexterity saving throw, taking 5d4 fire damage on a failed save, or half as much damage on a successful one.
magic-items.ring-of-shooting-stars.options.charges.name: 'Ring of Shooting Stars (charges)'
magic-items.ring-of-shooting-stars.state.charges.name: 'Charges'
magic-items.ring-of-spell-storing.name: 'Ring of Spell Storing'
magic-items.ring-of-spell-storing.description: |-
  This ring stores spells cast into it, holding them until the attuned wearer uses them. The ring can store up to 5 levels worth of spells at a time. When found, it contains 1d6 − 1 levels of stored spells chosen by the GM.

  Any creature can cast a spell of 1st through 5th level into the ring by touching the ring as the spell is cast. The spell has no effect, other than to be stored in the ring. If the ring can't hold the spell, the spell is expended without effect. The level of the slot used to cast the spell determines how much space it uses.

  While wearing this ring, you can cast any spell stored in it. The spell uses the slot level, spell save DC, spell attack bonus, and spellcasting ability of the original caster, but is otherwise treated as if you cast the spell. The spell cast from the ring is no longer stored in it, freeing up space.
