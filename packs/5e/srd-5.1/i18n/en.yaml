magic-items.potion-of-heroism.name: 'Potion of Heroism'
magic-items.potion-of-heroism.description: 'For 1 hour after drinking it, you gain 10 temporary hit points that last for 1 hour. For the same duration, you are under the effect of the *bless* spell (no concentration required). This blue potion bubbles and steams as if boiling.'
magic-items.potion-of-speed.name: 'Potion of Speed'
magic-items.potion-of-speed.description: "When you drink this potion, you gain the effect of the *haste* spell for 1 minute (no concentration required). The potion's yellow fluid is streaked with black and swirls on its own."
magic-items.potion-of-growth.name: 'Potion of Growth'
magic-items.potion-of-growth.description: 'When you drink this potion, you gain the "enlarge" effect of the *enlarge/reduce* spell for 1d4 hours (no concentration required). The red in the potion''s liquid continuously expands from a tiny bead to color the clear liquid around it and then contracts. Shaking the bottle fails to interrupt this process.'
magic-items.potion-of-diminution.name: 'Potion of Diminution'
magic-items.potion-of-diminution.description: 'When you drink this potion, you gain the "reduce" effect of the *enlarge/reduce* spell for 1d4 hours (no concentration required). The red in the potion''s liquid continuously contracts to a tiny bead and then expands to color the clear liquid around it. Shaking the bottle fails to interrupt this process.'
magic-items.potion-of-animal-friendship.name: 'Potion of Animal Friendship'
magic-items.potion-of-animal-friendship.description: 'When you drink this potion, you can cast the *animal friendship* spell (save DC 13) for 1 hour at will. Agitating this muddy liquid brings little bits into view: a fish scale, a hummingbird tongue, a cat claw, or a squirrel hair.'
magic-items.potion-of-animal-friendship.actions.animal-friendship.name: 'Animal Friendship'
magic-items.potion-of-animal-friendship.actions.animal-friendship.results.used.name: 'Cast'
magic-items.potion-of-clairvoyance.name: 'Potion of Clairvoyance'
magic-items.potion-of-clairvoyance.description: 'When you drink this potion, you gain the effect of the *clairvoyance* spell. An eyeball bobs in this yellowish liquid but vanishes when the potion is opened.'
magic-items.potion-of-climbing.name: 'Potion of Climbing'
magic-items.potion-of-climbing.description: 'When you drink this potion, you gain a climbing speed equal to your walking speed for 1 hour. During this time, you have advantage on Strength (Athletics) checks you make to climb. The potion is separated into brown, silver, and gray layers resembling bands of stone. Shaking the bottle fails to mix the colors.'
magic-items.potion-of-flying.name: 'Potion of Flying'
magic-items.potion-of-flying.description: "When you drink this potion, you gain a flying speed equal to your walking speed for 1 hour and can hover. If you're in the air when the potion wears off, you fall unless you have some other means of staying aloft. This potion's clear liquid floats at the top of its container and has cloudy white impurities drifting in it."
magic-items.potion-of-gaseous-form.name: 'Potion of Gaseous Form'
magic-items.potion-of-gaseous-form.description: "When you drink this potion, you gain the effect of the *gaseous form* spell for 1 hour (no concentration required) or until you end the effect as a bonus action. This potion's container seems to hold fog that moves and pours like water."
magic-items.potion-of-invisibility.name: 'Potion of Invisibility'
magic-items.potion-of-invisibility.description: "This potion's container looks empty but feels as though it holds liquid. When you drink it, you become invisible for 1 hour. Anything you wear or carry is invisible with you. The effect ends early if you attack or cast a spell."
magic-items.potion-of-mind-reading.name: 'Potion of Mind Reading'
magic-items.potion-of-mind-reading.description: "When you drink this potion, you gain the effect of the *detect thoughts* spell (save DC 13). The potion's dense, purple liquid has an ovoid cloud of pink floating in it."
magic-items.potion-of-poison.name: 'Potion of Poison'
magic-items.potion-of-poison.description: |-
  This concoction looks, smells, and tastes like a *potion of healing* or other beneficial potion. However, it is actually poison masked by illusion magic. An *identify* spell reveals its true nature.

  If you drink it, you take 3d6 poison damage, and you must succeed on a DC 13 Constitution saving throw or be poisoned. At the start of each of your turns while you are poisoned in this way, you take 3d6 poison damage. At the end of each of your turns, you can repeat the saving throw. On a successful save, the poison damage you take on your subsequent turns decreases by 1d6. The poison ends when the damage decreases to 0.
magic-items.potion-of-poison.actions.drink.name: 'Drink'
magic-items.potion-of-poison.actions.drink.results.poisoned.name: 'Poisoned'
magic-items.potion-of-poison.actions.drink.results.resisted.name: 'Not poisoned'
magic-items.potion-of-water-breathing.name: 'Potion of Water Breathing'
magic-items.potion-of-water-breathing.description: 'You can breathe underwater for 1 hour after drinking this potion. Its cloudy green fluid smells of the sea and has a jellyfish-like bubble floating in it.'
magic-items.philter-of-love.name: 'Philter of Love'
magic-items.philter-of-love.description: "The next time you see a creature within 10 minutes after drinking this philter, you become charmed by that creature for 1 hour. If the creature is of a species and gender you are normally attracted to, you regard it as your true love while you are charmed. This potion's rose-hued, effervescent liquid contains one easy-to-miss bubble shaped like a heart."
magic-items.oil-of-etherealness.name: 'Oil of Etherealness'
magic-items.oil-of-etherealness.description: "Beads of this cloudy gray oil form on the outside of its container and quickly evaporate. The oil can cover a Medium or smaller creature, along with the equipment it's wearing and carrying (one additional vial is required for each size category above Medium). Applying the oil takes 10 minutes. The affected creature then gains the effect of the *etherealness* spell for 1 hour."
magic-items.oil-of-sharpness.name: 'Oil of Sharpness'
magic-items.oil-of-sharpness.description: 'This clear, gelatinous oil sparkles with tiny, ultrathin silver shards. The oil can coat one slashing or piercing weapon or up to 5 pieces of slashing or piercing ammunition. Applying the oil takes 1 minute. For 1 hour, the coated item is magical and has a +3 bonus to attack and damage rolls.'
magic-items.oil-of-sharpness.actions.coat.name: 'Coat a weapon'
magic-items.oil-of-sharpness.actions.coat.steps.weapon.prompt: 'Which weapon?'
magic-items.oil-of-sharpness.actions.coat.results.coated.name: 'Coated'
magic-items.sharpness-coating.name: '{base} (Oil of Sharpness)'
magic-items.sharpness-coating.description: 'Coated with oil of sharpness: for 1 hour, this weapon is magical and has a +3 bonus to attack and damage rolls.'
magic-items.oil-of-slipperiness.name: 'Oil of Slipperiness'
magic-items.oil-of-slipperiness.description: |-
  This sticky black unguent is thick and heavy in the container, but it flows quickly when poured. The oil can cover a Medium or smaller creature, along with the equipment it's wearing and carrying (one additional vial is required for each size category above Medium). Applying the oil takes 10 minutes. The affected creature then gains the effect of a *freedom of movement* spell for 8 hours.

  Alternatively, the oil can be poured on the ground as an action, where it covers a 10-foot square, duplicating the effect of the *grease* spell in that area for 8 hours.
magic-items.ring-of-animal-influence.name: 'Ring of Animal Influence'
magic-items.ring-of-animal-influence.description: |-
  This ring has 3 charges, and it regains 1d3 expended charges daily at dawn. While wearing the ring, you can use an action to expend 1 of its charges to cast one of the following spells:

  - *Animal friendship* (save DC 13)
  - *Fear* (save DC 13), targeting only beasts that have an Intelligence of 3 or lower
  - *Speak with animals*
magic-items.ring-of-animal-influence.options.charges.name: 'Ring of Animal Influence (charges)'
magic-items.ring-of-animal-influence.state.charges.name: 'Charges'
magic-items.ring-of-djinni-summoning.name: 'Ring of Djinni Summoning'
magic-items.ring-of-djinni-summoning.description: |-
  While wearing this ring, you can speak its command word as an action to summon a particular djinni from the Elemental Plane of Air. The djinni appears in an unoccupied space you choose within 120 feet of you. It remains as long as you concentrate (as if concentrating on a spell), to a maximum of 1 hour, or until it drops to 0 hit points. It then returns to its home plane.

  While summoned, the djinni is friendly to you and your companions. It obeys any commands you give it, no matter what language you use. If you fail to command it, the djinni defends itself against attackers but takes no other actions.

  After the djinni departs, it can't be summoned again for 24 hours, and the ring becomes nonmagical if the djinni dies.
magic-items.ring-of-air-elemental-command.name: 'Ring of Air Elemental Command'
magic-items.ring-of-air-elemental-command.description: |-
  This ring is linked to one of the four Elemental Planes. The GM chooses or randomly determines the linked plane.

  While wearing this ring, you have advantage on attack rolls against elementals from the linked plane, and they have disadvantage on attack rolls against you. In addition, you have access to properties based on the linked plane.

  The ring has 5 charges. It regains 1d4 + 1 expended charges daily at dawn. Spells cast from the ring have a save DC of 17.

  ***Ring of Air Elemental Command.*** You can expend 2 of the ring's charges to cast *dominate monster* on an air elemental. In addition, when you fall, you descend 60 feet per round and take no damage from falling. You can also speak and understand Auran.

  If you help slay an air elemental while attuned to the ring, you gain access to the following additional properties:

  - You have resistance to lightning damage.
  - You have a flying speed equal to your walking speed and can hover.
  - You can cast the following spells from the ring, expending the necessary number of charges: *chain lightning* (3 charges), *gust of wind* (2 charges), or *wind wall* (1 charge).
magic-items.ring-of-air-elemental-command.options.charges.name: 'Ring of Air Elemental Command (charges)'
magic-items.ring-of-air-elemental-command.state.charges.name: 'Charges'
magic-items.ring-of-air-elemental-command.state.elementalSlain.name: 'Elemental slain'
magic-items.ring-of-earth-elemental-command.name: 'Ring of Earth Elemental Command'
magic-items.ring-of-earth-elemental-command.description: |-
  This ring is linked to one of the four Elemental Planes. The GM chooses or randomly determines the linked plane.

  While wearing this ring, you have advantage on attack rolls against elementals from the linked plane, and they have disadvantage on attack rolls against you. In addition, you have access to properties based on the linked plane.

  The ring has 5 charges. It regains 1d4 + 1 expended charges daily at dawn. Spells cast from the ring have a save DC of 17.

  ***Ring of Earth Elemental Command.*** You can expend 2 of the ring's charges to cast *dominate monster* on an earth elemental. In addition, you can move in difficult terrain that is composed of rubble, rocks, or dirt as if it were normal terrain. You can also speak and understand Terran.

  If you help slay an earth elemental while attuned to the ring, you gain access to the following additional properties:

  - You have resistance to acid damage.
  - You can move through solid earth or rock as if those areas were difficult terrain. If you end your turn there, you are shunted out to the nearest unoccupied space you last occupied.
  - You can cast the following spells from the ring, expending the necessary number of charges: *stone shape* (2 charges), *stoneskin* (3 charges), or *wall of stone* (3 charges).
magic-items.ring-of-earth-elemental-command.options.charges.name: 'Ring of Earth Elemental Command (charges)'
magic-items.ring-of-earth-elemental-command.state.charges.name: 'Charges'
