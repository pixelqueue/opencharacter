# Racial and background traits
traits.darkvision.name: 'Darkvision'
traits.darkvision.description: "You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray."
traits.dwarven-speed.name: 'Dwarven Speed'
traits.dwarven-speed.description: 'Your base walking speed is 25 feet. Your speed is not reduced by wearing heavy armor.'
traits.dwarven-resilience.name: 'Dwarven Resilience'
traits.dwarven-resilience.description: 'You have advantage on saving throws against poison, and you have resistance against poison damage.'
traits.dwarven-combat-training.name: 'Dwarven Combat Training'
traits.dwarven-combat-training.description: 'You have proficiency with the battleaxe, handaxe, light hammer, and warhammer.'
traits.tool-proficiency-dwarf.name: 'Tool Proficiency'
traits.tool-proficiency-dwarf.description: "You gain proficiency with the artisan's tools of your choice: smith's tools, brewer's supplies, or mason's tools."
traits.tool-proficiency-dwarf.choices.tool.prompt: "Choose smith's tools, brewer's supplies or mason's tools"
traits.stonecunning.name: 'Stonecunning'
traits.stonecunning.description: 'Whenever you make an Intelligence (History) check related to the origin of stonework, you are considered proficient in the History skill and add double your proficiency bonus to the check, instead of your normal proficiency bonus.'
traits.dwarven-toughness.name: 'Dwarven Toughness'
traits.dwarven-toughness.description: 'Your hit point maximum increases by 1, and it increases by 1 every time you gain a level.'
traits.keen-senses.name: 'Keen Senses'
traits.keen-senses.description: 'You have proficiency in the Perception skill.'
traits.fey-ancestry.name: 'Fey Ancestry'
traits.fey-ancestry.description: "You have advantage on saving throws against being charmed, and magic can't put you to sleep."
traits.trance.name: 'Trance'
traits.trance.description: 'Elves don''t need to sleep. Instead, they meditate deeply, remaining semiconscious, for 4 hours a day. (The Common word for such meditation is "trance.") While meditating, you can dream after a fashion; such dreams are actually mental exercises that have become reflexive through years of practice. After resting in this way, you gain the same benefit that a human does from 8 hours of sleep.'
traits.elf-weapon-training.name: 'Elf Weapon Training'
traits.elf-weapon-training.description: 'You have proficiency with the longsword, shortsword, shortbow, and longbow.'
traits.high-elf-cantrip.name: 'Cantrip'
traits.high-elf-cantrip.description: 'You know one cantrip of your choice from the wizard spell list. Intelligence is your spellcasting ability for it.'
traits.high-elf-cantrip.choices.cantrip.prompt: 'Choose a wizard cantrip'
traits.lucky.name: 'Lucky'
traits.lucky.description: 'When you roll a 1 on the d20 for an attack roll, ability check, or saving throw, you can reroll the die and must use the new roll.'
traits.brave.name: 'Brave'
traits.brave.description: 'You have advantage on saving throws against being frightened.'
traits.halfling-nimbleness.name: 'Halfling Nimbleness'
traits.halfling-nimbleness.description: 'You can move through the space of any creature that is of a size larger than yours.'
traits.naturally-stealthy.name: 'Naturally Stealthy'
traits.naturally-stealthy.description: 'You can attempt to hide even when you are obscured only by a creature that is at least one size larger than you.'
traits.damage-resistance-draconic.name: 'Damage Resistance'
traits.damage-resistance-draconic.description: 'You have resistance to the damage type associated with your draconic ancestry.'
traits.gnome-cunning.name: 'Gnome Cunning'
traits.gnome-cunning.description: 'You have advantage on all Intelligence, Wisdom, and Charisma saving throws against magic.'
traits.artificers-lore.name: "Artificer's Lore"
traits.artificers-lore.description: 'Whenever you make an Intelligence (History) check related to magic items, alchemical objects, or technological devices, you can add twice your proficiency bonus, instead of any proficiency bonus you normally apply.'
traits.tinker.name: 'Tinker'
traits.tinker.description: |-
  You have proficiency with artisan's tools (tinker's tools). Using those tools, you can spend 1 hour and 10 gp worth of materials to construct a Tiny clockwork device (AC 5, 1 hp). The device ceases to function after 24 hours (unless you spend 1 hour repairing it to keep the device functioning), or when you use your action to dismantle it; at that time, you can reclaim the materials used to create it. You can have up to three such devices active at a time.

  When you create a device, choose one of the following options:

  *Clockwork Toy.* This toy is a clockwork animal, monster, or person, such as a frog, mouse, bird, dragon, or soldier. When placed on the ground, the toy moves 5 feet across the ground on each of your turns in a random direction. It makes noises as appropriate to the creature it represents.

  *Fire Starter.* The device produces a miniature flame, which you can use to light a candle, torch, or campfire. Using the device requires your action.

  *Music Box.* When opened, this music box plays a single song at a moderate volume. The box stops playing when it reaches the song's end or when it is closed.
traits.skill-versatility.name: 'Skill Versatility'
traits.skill-versatility.description: 'You gain proficiency in two skills of your choice.'
traits.skill-versatility.choices.skills.prompt: 'Skill Versatility: choose two skills'
traits.menacing.name: 'Menacing'
traits.menacing.description: 'You gain proficiency in the Intimidation skill.'
traits.relentless-endurance.name: 'Relentless Endurance'
traits.relentless-endurance.state.used.name: 'Relentless Endurance used'
traits.relentless-endurance.description: "When you are reduced to 0 hit points but not killed outright, you can drop to 1 hit point instead. You can't use this feature again until you finish a long rest."
traits.relentless-endurance.actions.relentless-endurance.name: 'Relentless Endurance'
traits.relentless-endurance.actions.relentless-endurance.results.endured.name: 'At 1 hit point'
traits.relentless-endurance.followUps.relentless-endurance.name: 'Relentless Endurance'
traits.relentless-endurance.followUps.relentless-endurance.description: 'Drop to 1 hit point instead, once until a long rest'
traits.savage-attacks.name: 'Savage Attacks'
traits.savage-attacks.description: "When you score a critical hit with a melee weapon attack, you can roll one of the weapon's damage dice one additional time and add it to the extra damage of the critical hit."
traits.hellish-resistance.name: 'Hellish Resistance'
traits.hellish-resistance.description: 'You have resistance to fire damage.'
traits.infernal-legacy.name: 'Infernal Legacy'
traits.infernal-legacy.state.hellishRebukeUsed.name: 'Hellish Rebuke used'
traits.infernal-legacy.state.darknessUsed.name: 'Darkness used'
traits.infernal-legacy.description: 'You know the *thaumaturgy* cantrip. When you reach 3rd level, you can cast the *hellish rebuke* spell as a 2nd-level spell once with this trait and regain the ability to do so when you finish a long rest. When you reach 5th level, you can cast the *darkness* spell once with this trait and regain the ability to do so when you finish a long rest. Charisma is your spellcasting ability for these spells.'
traits.infernal-legacy.options.hellish-rebuke.name: 'Infernal Legacy (once per long rest)'
traits.infernal-legacy.options.darkness.name: 'Infernal Legacy (once per long rest)'
traits.extra-language.name: 'Extra Language'
traits.extra-language.description: 'You can speak, read, and write one extra language of your choice.'
traits.extra-language.choices.language.prompt: 'Choose a language'
background-features.shelter-of-the-faithful.name: 'Shelter of the Faithful'
background-features.shelter-of-the-faithful.description: |-
  As an acolyte, you command the respect of those who share your faith, and you can perform the religious ceremonies of your deity. You and your adventuring companions can expect to receive free healing and care at a temple, shrine, or other established presence of your faith, though you must provide any material components needed for spells. Those who share your religion will support you (but only you) at a modest lifestyle.

  You might also have ties to a specific temple dedicated to your chosen deity or pantheon, and you have a residence there. This could be the temple where you used to serve, if you remain on good terms with it, or a temple where you have found a new home. While near your temple, you can call upon the priests for assistance, provided the assistance you ask for is not hazardous and you remain in good standing with your temple.

# Races
races.dwarf.name: 'Dwarf'
races.dwarf.description: |-
  Your dwarf character has an assortment of inborn abilities, part and parcel of dwarven nature.

  ***Ability Score Increase.*** Your Constitution score increases by 2.

  ***Age.*** Dwarves mature at the same rate as humans, but they're considered young until they reach the age of 50. On average, they live about 350 years.

  ***Alignment.*** Most dwarves are lawful, believing firmly in the benefits of a well-ordered society. They tend toward good as well, with a strong sense of fair play and a belief that everyone deserves to share in the benefits of a just order.

  ***Size.*** Dwarves stand between 4 and 5 feet tall and average about 150 pounds. Your size is Medium.

  ***Languages.*** You can speak, read, and write Common and Dwarvish. Dwarvish is full of hard consonants and guttural sounds, and those characteristics spill over into whatever other language a dwarf might speak.
races.dwarf.choices.subrace.prompt: 'Choose a subrace'
races.elf.name: 'Elf'
races.elf.description: |-
  Your elf character has a variety of natural abilities, the result of thousands of years of elven refinement.

  ***Ability Score Increase.*** Your Dexterity score increases by 2.

  ***Age.*** Although elves reach physical maturity at about the same age as humans, the elven understanding of adulthood goes beyond physical growth to encompass worldly experience. An elf typically claims adulthood and an adult name around the age of 100 and can live to be 750 years old.

  ***Alignment.*** Elves love freedom, variety, and self-expression, so they lean strongly toward the gentler aspects of chaos. They value and protect others' freedom as well as their own, and they are more often good than not.

  ***Size.*** Elves range from under 5 to over 6 feet tall and have slender builds. Your size is Medium.

  ***Speed.*** Your base walking speed is 30 feet.

  ***Languages.*** You can speak, read, and write Common and Elvish. Elvish is fluid, with subtle intonations and intricate grammar. Elven literature is rich and varied, and their songs and poems are famous among other races. Many bards learn their language so they can add Elvish ballads to their repertoires.
races.elf.choices.subrace.prompt: 'Choose a subrace'
races.halfling.name: 'Halfling'
races.halfling.description: |-
  Your halfling character has a number of traits in common with all other halflings.

  ***Ability Score Increase.*** Your Dexterity score increases by 2.

  ***Age.*** A halfling reaches adulthood at the age of 20 and generally lives into the middle of his or her second century.

  ***Alignment.*** Most halflings are lawful good. As a rule, they are good-hearted and kind, hate to see others in pain, and have no tolerance for oppression. They are also very orderly and traditional, leaning heavily on the support of their community and the comfort of their old ways.

  ***Size.*** Halflings average about 3 feet tall and weigh about 40 pounds. Your size is Small.

  ***Speed.*** Your base walking speed is 25 feet.

  ***Languages.*** You can speak, read, and write Common and Halfling. The Halfling language isn't secret, but halflings are loath to share it with others. They write very little, so they don't have a rich body of literature. Their oral tradition, however, is very strong. Almost all halflings speak Common to converse with the people in whose lands they dwell or through which they are traveling.
races.halfling.choices.subrace.prompt: 'Choose a subrace'
races.human.name: 'Human'
races.human.description: |-
  It's hard to make generalizations about humans, but your human character has these traits.

  ***Ability Score Increase.*** Your ability scores each increase by 1.

  ***Age.*** Humans reach adulthood in their late teens and live less than a century.

  ***Alignment.*** Humans tend toward no particular alignment. The best and the worst are found among them.

  ***Size.*** Humans vary widely in height and build, from barely 5 feet to well over 6 feet tall. Regardless of your position in that range, your size is Medium.

  ***Speed.*** Your base walking speed is 30 feet.

  ***Languages.*** You can speak, read, and write Common and one extra language of your choice. Humans typically learn the languages of other peoples they deal with, including obscure dialects. They are fond of sprinkling their speech with words borrowed from other tongues: Orc curses, Elvish musical expressions, Dwarvish military phrases, and so on.
races.dragonborn.name: 'Dragonborn'
races.dragonborn.description: |-
  Your draconic heritage manifests in a variety of traits you share with other dragonborn.

  ***Ability Score Increase.*** Your Strength score increases by 2, and your Charisma score increases by 1.

  ***Age.*** Young dragonborn grow quickly. They walk hours after hatching, attain the size and development of a 10-year-old human child by the age of 3, and reach adulthood by 15. They live to be around 80.

  ***Alignment.*** Dragonborn tend to extremes, making a conscious choice for one side or the other in the cosmic war between good and evil. Most dragonborn are good, but those who side with evil can be terrible villains.

  ***Size.*** Dragonborn are taller and heavier than humans, standing well over 6 feet tall and averaging almost 250 pounds. Your size is Medium.

  ***Speed.*** Your base walking speed is 30 feet.

  ***Draconic Ancestry.*** You have draconic ancestry. Choose one type of dragon from the Draconic Ancestry table. Your breath weapon and damage resistance are determined by the dragon type, as shown in the table.

  **Draconic Ancestry**

  | Dragon | Damage Type | Breath Weapon |
  | --- | --- | --- |
  | Black | Acid | 5 by 30 ft. line (Dex. save) |
  | Blue | Lightning | 5 by 30 ft. line (Dex. save) |
  | Brass | Fire | 5 by 30 ft. line (Dex. save) |
  | Bronze | Lightning | 5 by 30 ft. line (Dex. save) |
  | Copper | Acid | 5 by 30 ft. line (Dex. save) |
  | Gold | Fire | 15 ft. cone (Dex. save) |
  | Green | Poison | 15 ft. cone (Con. save) |
  | Red | Fire | 15 ft. cone (Dex. save) |
  | Silver | Cold | 15 ft. cone (Con. save) |
  | White | Cold | 15 ft. cone (Con. save) |

  ***Breath Weapon.*** You can use your action to exhale destructive energy. Your draconic ancestry determines the size, shape, and damage type of the exhalation.

  When you use your breath weapon, each creature in the area of the exhalation must make a saving throw, the type of which is determined by your draconic ancestry. The DC for this saving throw equals 8 + your Constitution modifier + your proficiency bonus. A creature takes 2d6 damage on a failed save, and half as much damage on a successful one. The damage increases to 3d6 at 6th level, 4d6 at 11th level, and 5d6 at 16th level.

  After you use your breath weapon, you can't use it again until you complete a short or long rest.

  ***Languages.*** You can speak, read, and write Common and Draconic. Draconic is thought to be one of the oldest languages and is often used in the study of magic. The language sounds harsh to most other creatures and includes numerous hard consonants and sibilants.
races.dragonborn.choices.draconic-ancestry.prompt: 'Choose a draconic ancestry'
races.gnome.name: 'Gnome'
races.gnome.description: |-
  Your gnome character has certain characteristics in common with all other gnomes.

  ***Ability Score Increase.*** Your Intelligence score increases by 2.

  ***Age.*** Gnomes mature at the same rate humans do, and most are expected to settle down into an adult life by around age 40. They can live 350 to almost 500 years.

  ***Alignment.*** Gnomes are most often good. Those who tend toward law are sages, engineers, researchers, scholars, investigators, or inventors. Those who tend toward chaos are minstrels, tricksters, wanderers, or fanciful jewelers. Gnomes are good-hearted, and even the tricksters among them are more playful than vicious.

  ***Size.*** Gnomes are between 3 and 4 feet tall and average about 40 pounds. Your size is Small.

  ***Speed.*** Your base walking speed is 25 feet.

  ***Languages.*** You can speak, read, and write Common and Gnomish. The Gnomish language, which uses the Dwarvish script, is renowned for its technical treatises and its catalogs of knowledge about the natural world.
races.gnome.choices.subrace.prompt: 'Choose a subrace'
races.half-elf.name: 'Half-elf'
races.half-elf.description: |-
  Your half-elf character has some qualities in common with elves and some that are unique to half-elves.

  ***Ability Score Increase.*** Your Charisma score increases by 2, and two other ability scores of your choice increase by 1.

  ***Age.*** Half-elves mature at the same rate humans do and reach adulthood around the age of 20. They live much longer than humans, however, often exceeding 180 years.

  ***Alignment.*** Half-elves share the chaotic bent of their elven heritage. They value both personal freedom and creative expression, demonstrating neither love of leaders nor desire for followers. They chafe at rules, resent others' demands, and sometimes prove unreliable, or at least unpredictable.

  ***Size.*** Half-elves are about the same size as humans, ranging from 5 to 6 feet tall. Your size is Medium.

  ***Speed.*** Your base walking speed is 30 feet.

  ***Languages.*** You can speak, read, and write Common, Elvish, and one extra language of your choice.
races.half-elf.choices.ability-scores.prompt: 'Choose two ability scores to increase by 1'
races.half-elf.choices.ability-scores.options.str.name: 'Strength'
races.half-elf.choices.ability-scores.options.dex.name: 'Dexterity'
races.half-elf.choices.ability-scores.options.con.name: 'Constitution'
races.half-elf.choices.ability-scores.options.int.name: 'Intelligence'
races.half-elf.choices.ability-scores.options.wis.name: 'Wisdom'
races.half-orc.name: 'Half-orc'
races.half-orc.description: |-
  Your half-orc character has certain traits deriving from your orc ancestry.

  ***Ability Score Increase.*** Your Strength score increases by 2, and your Constitution score increases by 1.

  ***Age.*** Half-orcs mature a little faster than humans, reaching adulthood around age 14. They age noticeably faster and rarely live longer than 75 years.

  ***Alignment.*** Half-orcs inherit a tendency toward chaos from their orc parents and are not strongly inclined toward good. Half-orcs raised among orcs and willing to live out their lives among them are usually evil.

  ***Size.*** Half-orcs are somewhat larger and bulkier than humans, and they range from 5 to well over 6 feet tall. Your size is Medium.

  ***Speed.*** Your base walking speed is 30 feet.

  ***Languages.*** You can speak, read, and write Common and Orc. Orc is a harsh, grating language with hard consonants. It has no script of its own but is written in the Dwarvish script.
races.tiefling.name: 'Tiefling'
races.tiefling.description: |-
  Tieflings share certain racial traits as a result of their infernal descent.

  ***Ability Score Increase.*** Your Intelligence score increases by 1, and your Charisma score increases by 2.

  ***Age.*** Tieflings mature at the same rate as humans but live a few years longer.

  ***Alignment.*** Tieflings might not have an innate tendency toward evil, but many of them end up there. Evil or not, an independent nature inclines many tieflings toward a chaotic alignment.

  ***Size.*** Tieflings are about the same size and build as humans. Your size is Medium.

  ***Speed.*** Your base walking speed is 30 feet.

  ***Languages.*** You can speak, read, and write Common and Infernal.

# Subraces
subraces.hill-dwarf.name: 'Hill dwarf'
subraces.hill-dwarf.description: |-
  As a hill dwarf, you have keen senses, deep intuition, and remarkable resilience.

  ***Ability Score Increase.*** Your Wisdom score increases by 1.
subraces.high-elf.name: 'High elf'
subraces.high-elf.description: |-
  As a high elf, you have a keen mind and a mastery of at least the basics of magic. In many fantasy gaming worlds, there are two kinds of high elves. One type is haughty and reclusive, believing themselves to be superior to non-elves and even other elves. The other type is more common and more friendly, and often encountered among humans and other races.

  ***Ability Score Increase.*** Your Intelligence score increases by 1.
subraces.lightfoot.name: 'Lightfoot halfling'
subraces.lightfoot.description: |-
  As a lightfoot halfling, you can easily hide from notice, even using other people as cover. You're inclined to be affable and get along well with others.

  Lightfoots are more prone to wanderlust than other halflings, and often dwell alongside other races or take up a nomadic life.

  ***Ability Score Increase.*** Your Charisma score increases by 1.
subraces.rock-gnome.name: 'Rock gnome'
subraces.rock-gnome.description: |-
  As a rock gnome, you have a natural inventiveness and hardiness beyond that of other gnomes.

  ***Ability Score Increase.*** Your Constitution score increases by 1.
