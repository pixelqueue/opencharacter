magic-items.armor-of-resistance.choices.damage-type.options.thunder.name: 'Thunder'
magic-items.armor-of-vulnerability.name: 'Armor of Vulnerability'
magic-items.armor-of-vulnerability.description: |-
  While wearing this armor, you have resistance to one of the following damage types: bludgeoning, piercing, or slashing. The GM chooses the type or determines it randomly.

  ***Curse.*** This armor is cursed, a fact that is revealed only when an *identify* spell is cast on the armor or you attune to it. Attuning to the armor curses you until you are targeted by the *remove curse* spell or similar magic; removing the armor fails to end the curse. While cursed, you have vulnerability to two of the three damage types associated with the armor (not the one to which it grants resistance).
magic-items.armor-of-vulnerability.choices.damage-type.prompt: 'Choose the damage type'
magic-items.armor-of-vulnerability.choices.damage-type.options.bludgeoning.name: 'Bludgeoning'
magic-items.armor-of-vulnerability.choices.damage-type.options.piercing.name: 'Piercing'
magic-items.armor-of-vulnerability.choices.damage-type.options.slashing.name: 'Slashing'
magic-items.armor-of-invulnerability.name: 'Armor of Invulnerability'
magic-items.armor-of-invulnerability.description: "You have resistance to nonmagical damage while you wear this armor. Additionally, you can use an action to make yourself immune to nonmagical damage for 10 minutes or until you are no longer wearing the armor. Once this special action is used, it can't be used again until the next dawn."
magic-items.demon-armor.name: 'Demon Armor'
magic-items.demon-armor.description: |-
  While wearing this armor, you gain a +1 bonus to AC, and you can understand and speak Abyssal. In addition, the armor's clawed gauntlets turn unarmed strikes with your hands into magic weapons that deal slashing damage, with a +1 bonus to attack rolls and damage rolls and a damage die of 1d8.

  ***Curse.*** Once you don this cursed armor, you can't doff it unless you are targeted by the *remove curse* spell or similar magic. While wearing the armor, you have disadvantage on attack rolls against demons and on saving throws against their spells and special abilities.
magic-items.dragon-scale-mail.name: 'Dragon Scale Mail'
magic-items.dragon-scale-mail.description: |-
  Dragon scale mail is made of the scales of one kind of dragon. Sometimes dragons collect their cast-off scales and gift them to humanoids. Other times, hunters carefully skin and preserve the hide of a dead dragon. In either case, dragon scale mail is highly valued.

  While wearing this armor, you gain a +1 bonus to AC, you have advantage on saving throws against the Frightful Presence and breath weapons of dragons, and you have resistance to one damage type that is determined by the kind of dragon that provided the scales (see the table).

  Additionally, you can focus your senses as an action to magically discern the distance and direction to the closest dragon within 30 miles of you that is of the same type as the armor. This special action can't be used again until the next dawn.

  | Dragon | Resistance | Dragon | Resistance |
  | --- | --- | --- | --- |
  | Black | Acid | Gold | Fire |
  | Blue | Lightning | Green | Poison |
  | Brass | Fire | Red | Fire |
  | Bronze | Lightning | Silver | Cold |
  | Copper | Acid | White | Cold |
magic-items.dragon-scale-mail.choices.damage-type.prompt: 'Choose the damage type'
magic-items.dragon-scale-mail.choices.damage-type.options.acid.name: 'Acid'
magic-items.dragon-scale-mail.choices.damage-type.options.cold.name: 'Cold'
magic-items.dragon-scale-mail.choices.damage-type.options.fire.name: 'Fire'
magic-items.dragon-scale-mail.choices.damage-type.options.lightning.name: 'Lightning'
magic-items.dragon-scale-mail.choices.damage-type.options.poison.name: 'Poison'
magic-items.dwarven-plate.name: 'Dwarven Plate'
magic-items.dwarven-plate.description: 'While wearing this armor, you gain a +2 bonus to AC. In addition, if an effect moves you against your will along the ground, you can use your reaction to reduce the distance you are moved by up to 10 feet.'
magic-items.elven-chain.name: 'Elven Chain'
magic-items.elven-chain.description: 'You gain a +1 bonus to AC while you wear this armor. You are considered proficient with this armor even if you lack proficiency with medium armor.'
magic-items.glamoured-studded-leather.name: 'Glamoured Studded Leather'
magic-items.glamoured-studded-leather.description: "While wearing this armor, you gain a +1 bonus to AC. You can also use a bonus action to speak the armor's command word and cause the armor to assume the appearance of a normal set of clothing or some other kind of armor. You decide what it looks like, including color, style, and accessories, but the armor retains its normal bulk and weight. The illusory appearance lasts until you use this property again or remove the armor."
magic-items.plate-armor-of-etherealness.name: 'Plate Armor of Etherealness'
magic-items.plate-armor-of-etherealness.description: "While you're wearing this armor, you can speak its command word as an action to gain the effect of the *etherealness* spell, which last for 10 minutes or until you remove the armor or use an action to speak the command word again. This property of the armor can't be used again until the next dawn."
magic-items.plate-armor-of-etherealness.options.charges.name: 'Plate Armor of Etherealness (charges)'
magic-items.plate-armor-of-etherealness.state.charges.name: 'Charges'
magic-items.animated-shield.name: 'Animated {base}'
magic-items.animated-shield.description: 'While holding this shield, you can speak its command word as a bonus action to cause it to animate. The shield leaps into the air and hovers in your space to protect you as if you were wielding it, leaving your hands free. The shield remains animated for 1 minute, until you use a bonus action to end this effect, or until you are incapacitated or die, at which point the shield falls to the ground or into your hand if you have one free.'
magic-items.arrow-catching-shield.name: 'Arrow-Catching {base}'
magic-items.arrow-catching-shield.description: "You gain a +2 bonus to AC against ranged attacks while you wield this shield. This bonus is in addition to the shield's normal bonus to AC. In addition, whenever an attacker makes a ranged attack against a target within 5 feet of you, you can use your reaction to become the target of the attack instead."
magic-items.shield-of-missile-attraction.name: '{base} of Missile Attraction'
magic-items.shield-of-missile-attraction.description: |-
  While holding this shield, you have resistance to damage from ranged weapon attacks.

  ***Curse.*** This shield is cursed. Attuning to it curses you until you are targeted by the *remove curse* spell or similar magic. Removing the shield fails to end the curse on you. Whenever a ranged weapon attack is made against a target within 10 feet of you, the curse causes you to become the target instead.
magic-items.spellguard-shield.name: 'Spellguard {base}'
magic-items.spellguard-shield.description: 'While holding this shield, you have advantage on saving throws against spells and other magical effects, and spell attacks have disadvantage against you.'
magic-items.potion-of-healing.name: 'Potion of Healing'
magic-items.potion-of-healing.description: |-
  You regain hit points when you drink this potion. The number of hit points depends on the potion's rarity, as shown in the Potions of Healing table. Whatever its potency, the potion's red liquid glimmers when agitated.

  **Potions of Healing**

  | Potion of … | Rarity | HP Regained |
  | --- | --- | --- |
  | Healing | Common | 2d4 + 2 |
  | Greater healing | Uncommon | 4d4 + 4 |
  | Superior healing | Rare | 8d4 + 8 |
  | Supreme healing | Very rare | 10d4 + 20 |
