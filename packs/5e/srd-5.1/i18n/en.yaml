magic-items.iron-bands-of-binding.name: 'Iron Bands of Binding'
magic-items.iron-bands-of-binding.description: |-
  This rusty iron sphere measures 3 inches in diameter and weighs 1 pound. You can use an action to speak the command word and throw the sphere at a Huge or smaller creature you can see within 60 feet of you. As the sphere moves through the air, it opens into a tangle of metal bands.

  Make a ranged attack roll with an attack bonus equal to your Dexterity modifier plus your proficiency bonus. On a hit, the target is restrained until you take a bonus action to speak the command word again to release it. Doing so, or missing with the attack, causes the bands to contract and become a sphere once more.

  A creature, including the one restrained, can use an action to make a DC 20 Strength check to break the iron bands. On a success, the item is destroyed, and the restrained creature is freed. If the check fails, any further attempts made by that creature automatically fail until 24 hours have elapsed.

  Once the bands are used, they can't be used again until the next dawn.
magic-items.iron-bands-of-binding.actions.bind.name: 'Throw the bands'
magic-items.iron-bands-of-binding.actions.bind.options.hit.name: 'Hit'
magic-items.iron-bands-of-binding.actions.bind.options.miss.name: 'Miss'
magic-items.iron-bands-of-binding.actions.bind.params.targetAc.name: "Target's Armor Class"
magic-items.iron-bands-of-binding.actions.bind.results.hit.name: 'Bound'
magic-items.iron-bands-of-binding.actions.bind.results.miss.name: 'Miss'
magic-items.iron-bands-of-binding.actions.bind.steps.confirm.prompt: 'Did the bands hit?'
magic-items.iron-bands-of-binding.state.usedToday.name: 'Used since dawn'
magic-items.iron-flask.name: 'Iron Flask'
magic-items.iron-flask.description: |-
  This iron bottle has a brass stopper. You can use an action to speak the flask's command word, targeting a creature that you can see within 60 feet of you. If the target is native to a plane of existence other than the one you're on, the target must succeed on a DC 17 Wisdom saving throw or be trapped in the flask. If the target has been trapped by the flask before, it has advantage on the saving throw. Once trapped, a creature remains in the flask until released. The flask can hold only one creature at a time. A creature trapped in the flask doesn't need to breathe, eat, or drink and doesn't age.

  You can use an action to remove the flask's stopper and release the creature the flask contains. The creature is friendly to you and your companions for 1 hour and obeys your commands for that duration. If you give no commands or give it a command that is likely to result in its death, it defends itself but otherwise takes no actions. At the end of the duration, the creature acts in accordance with its normal disposition and alignment.

  An *identify* spell reveals that a creature is inside the flask, but the only way to determine the type of creature is to open the flask. A newly discovered bottle might already contain a creature chosen by the GM or determined randomly.

  | d100 | Contents |
  | --- | --- |
  | 1‒50 | Empty |
  | 51‒54 | Demon (type 1) |
  | 55‒58 | Demon (type 2) |
  | 59‒62 | Demon (type 3) |
  | 63‒64 | Demon (type 4) |
  | 65 | Demon (type 5) |
  | 66 | Demon (type 6) |
  | 67 | Deva |
  | 68‒69 | Devil (greater) |
  | 70‒73 | Devil (lesser) |
  | 74‒75 | Djinni |
  | 76‒77 | Efreeti |
  | 78‒83 | Elemental (any) |
  | 84‒86 | Invisible stalker |
  | 87‒90 | Night hag |
  | 91 | Planetar |
  | 92‒95 | Salamander |
  | 96 | Solar |
  | 97‒99 | Succubus/incubus |
  | 100 | Xorn |
magic-items.lantern-of-revealing.name: 'Lantern of Revealing'
magic-items.lantern-of-revealing.description: "While lit, this hooded lantern burns for 6 hours on 1 pint of oil, shedding bright light in a 30-foot radius and dim light for an additional 30 feet. Invisible creatures and objects are visible as long as they are in the lantern's bright light. You can use an action to lower the hood, reducing the light to dim light in a 5-foot radius."
magic-items.mantle-of-spell-resistance.name: 'Mantle of Spell Resistance'
magic-items.mantle-of-spell-resistance.description: 'You have advantage on saving throws against spells while you wear this cloak.'
magic-items.manual-of-bodily-health.name: 'Manual of Bodily Health'
magic-items.manual-of-bodily-health.description: "This book contains health and diet tips, and its words are charged with magic. If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Constitution score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century."
