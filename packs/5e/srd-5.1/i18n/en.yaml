magic-items.boots-of-elvenkind.name: 'Boots of Elvenkind'
magic-items.boots-of-elvenkind.description: 'While you wear these boots, your steps make no sound, regardless of the surface you are moving across. You also have advantage on Dexterity (Stealth) checks that rely on moving silently.'
magic-items.boots-of-levitation.name: 'Boots of Levitation'
magic-items.boots-of-levitation.description: 'While you wear these boots, you can use an action to cast the *levitate* spell on yourself at will.'
magic-items.boots-of-speed.name: 'Boots of Speed'
magic-items.boots-of-speed.description: |-
  While you wear these boots, you can use a bonus action and click the boots' heels together. If you do, the boots double your walking speed, and any creature that makes an opportunity attack against you has disadvantage on the attack roll. If you click your heels together again, you end the effect.

  When the boots' property has been used for a total of 10 minutes, the magic ceases to function until you finish a long rest.
magic-items.boots-of-speed.state.active.name: 'Active'
magic-items.boots-of-striding-and-springing.name: 'Boots of Striding and Springing'
magic-items.boots-of-striding-and-springing.description: "While you wear these boots, your walking speed becomes 30 feet, unless your walking speed is higher, and your speed isn't reduced if you are encumbered or wearing heavy armor. In addition, you can jump three times the normal distance, though you can't jump farther than your remaining movement would allow."
magic-items.boots-of-the-winterlands.name: 'Boots of the Winterlands'
magic-items.boots-of-the-winterlands.description: |-
  These furred boots are snug and feel quite warm. While you wear them, you gain the following benefits:

  - You have resistance to cold damage.
  - You ignore difficult terrain created by ice or snow.
  - You can tolerate temperatures as low as −50 degrees Fahrenheit without any additional protection. If you wear heavy clothes, you can tolerate temperatures as low as −100 degrees Fahrenheit.
magic-items.bowl-of-commanding-water-elementals.name: 'Bowl of Commanding Water Elementals'
magic-items.bowl-of-commanding-water-elementals.description: |-
  While this bowl is filled with water, you can use an action to speak the bowl's command word and summon a water elemental, as if you had cast the *conjure elemental* spell. The bowl can't be used this way again until the next dawn.

  The bowl is about 1 foot in diameter and half as deep. It weighs 3 pounds and holds about 3 gallons.
magic-items.bowl-of-commanding-water-elementals.options.charges.name: 'Bowl of Commanding Water Elementals (charges)'
magic-items.bowl-of-commanding-water-elementals.state.charges.name: 'Charges'
magic-items.brazier-of-commanding-fire-elementals.name: 'Brazier of Commanding Fire Elementals'
magic-items.brazier-of-commanding-fire-elementals.description: "While a fire burns in this brass brazier, you can use an action to speak the brazier's command word and summon a fire elemental, as if you had cast the *conjure elemental* spell. The brazier can't be used this way again until the next dawn. The brazier weighs 5 pounds."
magic-items.brazier-of-commanding-fire-elementals.options.charges.name: 'Brazier of Commanding Fire Elementals (charges)'
magic-items.brazier-of-commanding-fire-elementals.state.charges.name: 'Charges'
magic-items.censer-of-controlling-air-elementals.name: 'Censer of Controlling Air Elementals'
magic-items.censer-of-controlling-air-elementals.description: |-
  While incense is burning in this censer, you can use an action to speak the censer's command word and summon an air elemental, as if you had cast the *conjure elemental* spell. The censer can't be used this way again until the next dawn.

  This 6-inch-wide, 1-foot-high vessel resembles a chalice with a decorated lid. It weighs 1 pound.
magic-items.censer-of-controlling-air-elementals.options.charges.name: 'Censer of Controlling Air Elementals (charges)'
magic-items.censer-of-controlling-air-elementals.state.charges.name: 'Charges'
magic-items.stone-of-controlling-earth-elementals.name: 'Stone of Controlling Earth Elementals'
magic-items.stone-of-controlling-earth-elementals.description: "If the stone is touching the ground, you can use an action to speak its command word and summon an earth elemental, as if you had cast the *conjure elemental* spell. The stone can't be used this way again until the next dawn. The stone weighs 5 pounds."
magic-items.stone-of-controlling-earth-elementals.options.charges.name: 'Stone of Controlling Earth Elementals (charges)'
magic-items.stone-of-controlling-earth-elementals.state.charges.name: 'Charges'
magic-items.bracers-of-archery.name: 'Bracers of Archery'
magic-items.bracers-of-archery.description: 'While wearing these bracers, you have proficiency with the longbow and shortbow, and you gain a +2 bonus to damage rolls on ranged attacks made with such weapons.'
magic-items.bracers-of-defense.name: 'Bracers of Defense'
magic-items.bracers-of-defense.description: 'While wearing these bracers, you gain a +2 bonus to AC if you are wearing no armor and using no shield.'
magic-items.brooch-of-shielding.name: 'Brooch of Shielding'
magic-items.brooch-of-shielding.description: 'While wearing this brooch, you have resistance to force damage, and you have immunity to damage from the *magic missile* spell.'
magic-items.broom-of-flying.name: 'Broom of Flying'
magic-items.broom-of-flying.description: |-
  This wooden broom, which weighs 3 pounds, functions like a mundane broom until you stand astride it and speak its command word. It then hovers beneath you and can be ridden in the air. It has a flying speed of 50 feet. It can carry up to 400 pounds, but its flying speed becomes 30 feet while carrying over 200 pounds. The broom stops hovering when you land.

  You can send the broom to travel alone to a destination within 1 mile of you if you speak the command word, name the location, and are familiar with that place. The broom comes back to you when you speak another command word, provided that the broom is still within 1 mile of you.
magic-items.broom-of-flying.state.riding.name: 'Riding'
magic-items.broom-of-flying.state.heavy.name: 'Carrying over 200 pounds'
magic-items.candle-of-invocation.name: 'Candle of Invocation'
magic-items.candle-of-invocation.description: |-
  This slender taper is dedicated to a deity and shares that deity's alignment. The candle's alignment can be detected with the *detect evil and good* spell. The GM chooses the god and associated alignment or determines the alignment randomly.

  | d20 | Alignment |
  | --- | --- |
  | 1–2 | Chaotic evil |
  | 3–4 | Chaotic neutral |
  | 5–7 | Chaotic good |
  | 8–9 | Neutral evil |
  | 10–11 | Neutral |
  | 12–13 | Neutral good |
  | 14–15 | Lawful evil |
  | 16–17 | Lawful neutral |
  | 18–20 | Lawful good |

  The candle's magic is activated when the candle is lit, which requires an action. After burning for 4 hours, the candle is destroyed. You can snuff it out early for use at a later time. Deduct the time it burned in increments of 1 minute from the candle's total burn time.

  While lit, the candle sheds dim light in a 30-foot radius. Any creature within that light whose alignment matches that of the candle makes attack rolls, saving throws, and ability checks with advantage. In addition, a cleric or druid in the light whose alignment matches the candle's can cast 1st-level spells he or she has prepared without expending spell slots, though the spell's effect is as if cast with a 1st-level slot.

  Alternatively, when you light the candle for the first time, you can cast the *gate* spell with it. Doing so destroys the candle.
magic-items.candle-of-invocation.options.candle.name: 'Burn the candle'
magic-items.cape-of-the-mountebank.name: 'Cape of the Mountebank'
magic-items.cape-of-the-mountebank.description: |-
  This cape smells faintly of brimstone. While wearing it, you can use it to cast the *dimension door* spell as an action. This property of the cape can't be used again until the next dawn.

  When you disappear, you leave behind a cloud of smoke, and you appear in a similar cloud of smoke at your destination. The smoke lightly obscures the space you left and the space you appear in, and it dissipates at the end of your next turn. A light or stronger wind disperses the smoke.
magic-items.cape-of-the-mountebank.options.charges.name: 'Cape of the Mountebank (charges)'
magic-items.cape-of-the-mountebank.state.charges.name: 'Charges'
magic-items.carpet-of-flying.name: 'Carpet of Flying'
magic-items.carpet-of-flying.state.size.values.3x5.name: '3 by 5 feet'
magic-items.carpet-of-flying.state.size.values.4x6.name: '4 by 6 feet'
magic-items.carpet-of-flying.state.size.values.5x7.name: '5 by 7 feet'
magic-items.carpet-of-flying.state.size.values.6x9.name: '6 by 9 feet'
magic-items.carpet-of-flying.description: |-
  You can speak the carpet's command word as an action to make the carpet hover and fly. It moves according to your spoken directions, provided that you are within 30 feet of it.

  Four sizes of *carpet of flying* exist. The GM chooses the size of a given carpet or determines it randomly.

  | d100 | Size | Capacity | Flying Speed |
  | --- | --- | --- | --- |
  | 01–20 | 3 ft. × 5 ft. | 200 lb. | 80 feet |
  | 21–55 | 4 ft. × 6 ft. | 400 lb. | 60 feet |
  | 56–80 | 5 ft. × 7 ft. | 600 lb. | 40 feet |
  | 81–100 | 6 ft. × 9 ft. | 800 lb. | 30 feet |

  A carpet can carry up to twice the weight shown on the table, but it flies at half speed if it carries more than its normal capacity.
magic-items.carpet-of-flying.state.size.name: 'Size'
magic-items.carpet-of-flying.state.riding.name: 'Riding'
magic-items.carpet-of-flying.state.overloaded.name: 'Overloaded'
magic-items.chime-of-opening.name: 'Chime of Opening'
magic-items.chime-of-opening.description: |-
  This hollow metal tube measures about 1 foot long and weighs 1 pound. You can strike it as an action, pointing it at an object within 120 feet of you that can be opened, such as a door, lid, or lock. The chime issues a clear tone, and one lock or latch on the object opens unless the sound can't reach the object. If no locks or latches remain, the object itself opens.

  The chime can be used ten times. After the tenth time, it cracks and becomes useless.
magic-items.chime-of-opening.state.charges.name: 'Charges'
magic-items.circlet-of-blasting.name: 'Circlet of Blasting'
magic-items.circlet-of-blasting.description: "While wearing this circlet, you can use an action to cast the *scorching ray* spell with it. When you make the spell's attacks, you do so with an attack bonus of +5. The circlet can't be used this way again until the next dawn."
magic-items.circlet-of-blasting.options.charges.name: 'Circlet of Blasting (charges)'
magic-items.circlet-of-blasting.state.charges.name: 'Charges'
magic-items.cloak-of-arachnida.name: 'Cloak of Arachnida'
magic-items.cloak-of-arachnida.description: |-
  This fine garment is made of black silk interwoven with faint silvery threads. While wearing it, you gain the following benefits:

  - You have resistance to poison damage.
  - You have a climbing speed equal to your walking speed.
  - You can move up, down, and across vertical surfaces and upside down along ceilings, while leaving your hands free.
  - You can't be caught in webs of any sort and can move through webs as if they were difficult terrain.
  - You can use an action to cast the *web* spell (save DC 13). The web created by the spell fills twice its normal area. Once used, this property of the cloak can't be used again until the next dawn.
magic-items.cloak-of-displacement.name: 'Cloak of Displacement'
magic-items.cloak-of-displacement.description: 'While you wear this cloak, it projects an illusion that makes you appear to be standing in a place near your actual location, causing any creature to have disadvantage on attack rolls against you. If you take damage, the property ceases to function until the start of your next turn. This property is suppressed while you are incapacitated, restrained, or otherwise unable to move.'
magic-items.cloak-of-displacement.state.displaced.name: 'Displacement active'
magic-items.cloak-of-elvenkind.name: 'Cloak of Elvenkind'
magic-items.cloak-of-elvenkind.description: "While you wear this cloak with its hood up, Wisdom (Perception) checks made to see you have disadvantage, and you have advantage on Dexterity (Stealth) checks made to hide, as the cloak's color shifts to camouflage you. Pulling the hood up or down requires an action."
magic-items.cloak-of-elvenkind.state.hoodUp.name: 'Hood up'
magic-items.cloak-of-protection.name: 'Cloak of Protection'
magic-items.cloak-of-protection.description: 'You gain a +1 bonus to AC and saving throws while you wear this cloak.'
magic-items.cloak-of-the-bat.name: 'Cloak of the Bat'
magic-items.cloak-of-the-bat.description: |-
  While wearing this cloak, you have advantage on Dexterity (Stealth) checks. In an area of dim light or darkness, you can grip the edges of the cloak with both hands and use it to fly at a speed of 40 feet. If you ever fail to grip the cloak's edges while flying in this way, or if you are no longer in dim light or darkness, you lose this flying speed.

  While wearing the cloak in an area of dim light or darkness, you can use your action to cast *polymorph* on yourself, transforming into a bat. While you are in the form of the bat, you retain your Intelligence, Wisdom, and Charisma scores. The cloak can't be used this way again until the next dawn.
magic-items.cloak-of-the-manta-ray.name: 'Cloak of the Manta Ray'
magic-items.cloak-of-the-manta-ray.description: 'While wearing this cloak with its hood up, you can breathe underwater, and you have a swimming speed of 60 feet. Pulling the hood up or down requires an action.'
magic-items.crystal-ball.name: 'Crystal Ball'
magic-items.crystal-ball.description: |-
  The typical *crystal ball*, a very rare item, is about 6 inches in diameter. While touching it, you can cast the *scrying* spell (save DC 17) with it.

  The following *crystal ball* variants are legendary items and have additional properties.

  ***Crystal Ball of Mind Reading.*** You can use an action to cast the *detect thoughts* spell (save DC 17) while you are scrying with the *crystal ball*, targeting creatures you can see within 30 feet of the spell's sensor. You don't need to concentrate on this *detect thoughts* to maintain it during its duration, but it ends if *scrying* ends.

  ***Crystal Ball of Telepathy.*** While scrying with the crystal ball, you can communicate telepathically with creatures you can see within 30 feet of the spell's sensor. You can also use an action to cast the *suggestion* spell (save DC 17) through the sensor on one of those creatures. You don't need to concentrate on this *suggestion* to maintain it during its duration, but it ends if *scrying* ends. Once used, the *suggestion* power of the *crystal ball* can't be used again until the next dawn.

  ***Crystal Ball of True Seeing.*** While scrying with the crystal ball, you have truesight with a radius of 120 feet centered on the spell's sensor.
magic-items.crystal-ball-of-mind-reading.name: 'Crystal Ball of Mind Reading'
magic-items.crystal-ball-of-mind-reading.description: |-
  The typical *crystal ball*, a very rare item, is about 6 inches in diameter. While touching it, you can cast the *scrying* spell (save DC 17) with it.

