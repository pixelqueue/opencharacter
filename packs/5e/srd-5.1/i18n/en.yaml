magic-items.ring-of-spell-turning.name: 'Ring of Spell Turning'
magic-items.ring-of-spell-turning.description: 'While wearing this ring, you have advantage on saving throws against any spell that targets only you (not in an area of effect). In addition, if you roll a 20 for the save and the spell is 7th level or lower, the spell has no effect on you and instead targets the caster, using the slot level, spell save DC, attack bonus, and spellcasting ability of the caster.'
magic-items.ring-of-swimming.name: 'Ring of Swimming'
magic-items.ring-of-swimming.description: 'You have a swimming speed of 40 feet while wearing this ring.'
magic-items.ring-of-telekinesis.name: 'Ring of Telekinesis'
magic-items.ring-of-telekinesis.description: "While wearing this ring, you can cast the *telekinesis* spell at will, but you can target only objects that aren't being worn or carried."
magic-items.ring-of-the-ram.name: 'Ring of the Ram'
magic-items.ring-of-the-ram.description: |-
  This ring has 3 charges, and it regains 1d3 expended charges daily at dawn. While wearing the ring, you can use an action to expend 1 to 3 of its charges to attack one creature you can see within 60 feet of you. The ring produces a spectral ram's head and makes its attack roll with a +7 bonus. On a hit, for each charge you spend, the target takes 2d10 force damage and is pushed 5 feet away from you.

  Alternatively, you can expend 1 to 3 of the ring's charges as an action to try to break an object you can see within 60 feet of you that isn't being worn or carried. The ring makes a Strength check with a +5 bonus for each charge you spend.
magic-items.ring-of-the-ram.actions.ram.name: 'Spectral ram'
magic-items.ring-of-the-ram.actions.ram.options.hit.name: 'Hit'
magic-items.ring-of-the-ram.actions.ram.options.miss.name: 'Miss'
