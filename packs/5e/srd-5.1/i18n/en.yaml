magic-items.wand-of-binding.name: 'Wand of Binding'
magic-items.wand-of-binding.description: |-
  This wand has 7 charges for the following properties. It regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.

  ***Spells.*** While holding the wand, you can use an action to expend some of its charges to cast one of the following spells (save DC 17): *hold monster* (5 charges) or *hold person* (2 charges).

  ***Assisted Escape.*** While holding the wand, you can use your reaction to expend 1 charge and gain advantage on a saving throw you make to avoid being paralyzed or restrained, or you can expend 1 charge and gain advantage on any check you make to escape a grapple.
magic-items.wand-of-binding.options.charges.name: 'Wand of Binding (charges)'
magic-items.wand-of-binding.state.charges.name: 'Charges'
magic-items.wand-of-enemy-detection.name: 'Wand of Enemy Detection'
magic-items.wand-of-enemy-detection.description: |-
  This wand has 7 charges. While holding it, you can use an action and expend 1 charge to speak its command word. For the next minute, you know the direction of the nearest creature hostile to you within 60 feet, but not its distance from you. The wand can sense the presence of hostile creatures that are ethereal, invisible, disguised, or hidden, as well as those in plain sight. The effect ends if you stop holding the wand.

  The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.
magic-items.wand-of-enemy-detection.state.charges.name: 'Charges'
magic-items.wand-of-fear.name: 'Wand of Fear'
magic-items.wand-of-fear.description: |-
  This wand has 7 charges for the following properties. It regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.

  ***Command.*** While holding the wand, you can use an action to expend 1 charge and command another creature to flee or grovel, as with the *command* spell (save DC 15).

  ***Cone of Fear.*** While holding the wand, you can use an action to expend 2 charges, causing the wand's tip to emit a 60-foot cone of amber light. Each creature in the cone must succeed on a DC 15 Wisdom saving throw or become frightened of you for 1 minute. While it is frightened in this way, a creature must spend its turns trying to move as far away from you as it can, and it can't willingly move to a space within 30 feet of you. It also can't take reactions. For its action, it can use only the Dash action or try to escape from an effect that prevents it from moving. If it has nowhere it can move, the creature can use the Dodge action. At the end of each of its turns, a creature can repeat the saving throw, ending the effect on itself on a success.
magic-items.wand-of-fear.options.charges.name: 'Wand of Fear (charges)'
magic-items.wand-of-fear.state.charges.name: 'Charges'
magic-items.wand-of-fireballs.name: 'Wand of Fireballs'
magic-items.wand-of-fireballs.description: |-
  This wand has 7 charges. While holding it, you can use an action to expend 1 or more of its charges to cast the *fireball* spell (save DC 15) from it. For 1 charge, you cast the 3rd-level version of the spell. You can increase the spell slot level by one for each additional charge you expend.

  The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.
magic-items.wand-of-fireballs.options.charges.name: 'Wand of Fireballs (1 charge, +1 per slot level above 3rd)'
magic-items.wand-of-fireballs.state.charges.name: 'Charges'
magic-items.wand-of-lightning-bolts.name: 'Wand of Lightning Bolts'
magic-items.wand-of-lightning-bolts.description: |-
  This wand has 7 charges. While holding it, you can use an action to expend 1 or more of its charges to cast the *lightning bolt* spell (save DC 15) from it. For 1 charge, you cast the 3rd-level version of the spell. You can increase the spell slot level by one for each additional charge you expend.

  The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.
magic-items.wand-of-lightning-bolts.options.charges.name: 'Wand of Lightning Bolts (1 charge, +1 per slot level above 3rd)'
magic-items.wand-of-lightning-bolts.state.charges.name: 'Charges'
magic-items.wand-of-magic-detection.name: 'Wand of Magic Detection'
magic-items.wand-of-magic-detection.description: 'This wand has 3 charges. While holding it, you can expend 1 charge as an action to cast the *detect magic* spell from it. The wand regains 1d3 expended charges daily at dawn.'
magic-items.wand-of-magic-detection.options.charges.name: 'Wand of Magic Detection (charges)'
magic-items.wand-of-magic-detection.state.charges.name: 'Charges'
magic-items.wand-of-magic-missiles.name: 'Wand of Magic Missiles'
magic-items.wand-of-magic-missiles.description: |-
  This wand has 7 charges. While holding it, you can use an action to expend 1 or more of its charges to cast the *magic missile* spell from it. For 1 charge, you cast the 1st-level version of the spell. You can increase the spell slot level by one for each additional charge you expend.

  The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.
magic-items.wand-of-magic-missiles.options.charges.name: 'Wand of Magic Missiles (1 charge, +1 per slot level above 1st)'
magic-items.wand-of-magic-missiles.state.charges.name: 'Charges'
magic-items.wand-of-paralysis.name: 'Wand of Paralysis'
magic-items.wand-of-paralysis.description: |-
  This wand has 7 charges. While holding it, you can use an action to expend 1 of its charges to cause a thin blue ray to streak from the tip toward a creature you can see within 60 feet of you. The target must succeed on a DC 15 Constitution saving throw or be paralyzed for 1 minute. At the end of each of the target's turns, it can repeat the saving throw, ending the effect on itself on a success.

  The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.
magic-items.wand-of-paralysis.state.charges.name: 'Charges'
magic-items.wand-of-polymorph.name: 'Wand of Polymorph'
magic-items.wand-of-polymorph.description: |-
  This wand has 7 charges. While holding it, you can use an action to expend 1 of its charges to cast the *polymorph* spell (save DC 15) from it.

  The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.
magic-items.wand-of-polymorph.options.charges.name: 'Wand of Polymorph (charges)'
magic-items.wand-of-polymorph.state.charges.name: 'Charges'
magic-items.wand-of-secrets.name: 'Wand of Secrets'
magic-items.wand-of-secrets.description: 'The wand has 3 charges. While holding it, you can use an action to expend 1 of its charges, and if a secret door or trap is within 30 feet of you, the wand pulses and points at the one nearest to you. The wand regains 1d3 expended charges daily at dawn.'
magic-items.wand-of-secrets.state.charges.name: 'Charges'
magic-items.wand-of-web.name: 'Wand of Web'
magic-items.wand-of-web.description: |-
  This wand has 7 charges. While holding it, you can use an action to expend 1 of its charges to cast the *web* spell (save DC 15) from it.

  The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.
magic-items.wand-of-web.options.charges.name: 'Wand of Web (charges)'
magic-items.wand-of-web.state.charges.name: 'Charges'
magic-items.wand-of-wonder.name: 'Wand of Wonder'
magic-items.wand-of-wonder.description: |-
  This wand has 7 charges. While holding it, you can use an action to expend 1 of its charges and choose a target within 120 feet of you. The target can be a creature, an object, or a point in space. Roll d100 and consult the following table to discover what happens.

  If the effect causes you to cast a spell from the wand, the spell's save DC is 15. If the spell normally has a range expressed in feet, its range becomes 120 feet if it isn't already.

  If an effect covers an area, you must center the spell on and include the target. If an effect has multiple possible subjects, the GM randomly determines which ones are affected.

  The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into dust and is destroyed.

  | d100 | Effect |
  | --- | --- |
  | 01–05 | You cast slow. |
  | 06–10 | You cast faerie fire. |
  | 11–15 | You are stunned until the start of your next turn, believing something awesome just happened. |
  | 16–20 | You cast gust of wind. |
  | 21–25 | You cast detect thoughts on the target you chose. If you didn't target a creature, you instead take 1d6 psychic damage. |
  | 26–30 | You cast stinking cloud. |
  | 31–33 | Heavy rain falls in a 60-foot radius centered on the target. The area becomes lightly obscured. The rain falls until the start of your next turn. |
  | 34–36 | An animal appears in the unoccupied space nearest the target. The animal isn't under your control and acts as it normally would. Roll a d100 to determine which animal appears. On a 01–25, a rhinoceros appears; on a 26–50, an elephant appears; and on a 51–100, a rat appears. |
  | 37–46 | You cast lightning bolt. |
  | 47–49 | A cloud of 600 oversized butterflies fills a 30-foot radius centered on the target. The area becomes heavily obscured. The butterflies remain for 10 minutes. |
  | 50–53 | You enlarge the target as if you had cast enlarge/reduce. If the target can't be affected by that spell, or if you didn't target a creature, you become the target. |
  | 54–58 | You cast darkness. |
  | 59–62 | Grass grows on the ground in a 60-foot radius centered on the target. If grass is already there, it grows to ten times its normal size and remains overgrown for 1 minute. |
  | 63–65 | An object of the GM's choice disappears into the Ethereal Plane. The object must be neither worn nor carried, within 120 feet of the target, and no larger than 10 feet in any dimension. |
  | 66–69 | You shrink yourself as if you had cast enlarge/reduce on yourself. |
  | 70–79 | You cast fireball. |
  | 80–84 | You cast invisibility on yourself. |
  | 85–87 | Leaves grow from the target. If you chose a point in space as the target, leaves sprout from the creature nearest to that point. Unless they are picked off, the leaves turn brown and fall off after 24 hours. |
  | 88–90 | A stream of 1d4 × 10 gems, each worth 1 gp, shoots from the wand's tip in a line 30 feet long and 5 feet wide. Each gem deals 1 bludgeoning damage, and the total damage of the gems is divided equally among all creatures in the line. |
  | 91–95 | A burst of colorful shimmering light extends from you in a 30-foot radius. You and each creature in the area that can see must succeed on a DC 15 Constitution saving throw or become blinded for 1 minute. A creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success. |
  | 96–97 | The target's skin turns bright blue for 1d10 days. If you chose a point in space, the creature nearest to that point is affected. |
  | 98–00 | If you targeted a creature, it must make a DC 15 Constitution saving throw. If you didn't target a creature, you become the target and must make the saving throw. If the saving throw fails by 5 or more, the target is instantly petrified. On any other failed save, the target is restrained and begins to turn to stone. While restrained in this way, the target must repeat the saving throw at the end of its next turn, becoming petrified on a failure or ending the effect on a success. The petrification lasts until the target is freed by the greater restoration spell or similar magic. |
magic-items.wand-of-wonder.state.charges.name: 'Charges'
magic-items.wand-of-the-war-mage-plus-one.name: 'Wand of the War Mage +1'
magic-items.wand-of-the-war-mage-plus-one.description: "While holding this wand, you gain a bonus to spell attack rolls determined by the wand's rarity. In addition, you ignore half cover when making a spell attack."
magic-items.wand-of-the-war-mage-plus-two.name: 'Wand of the War Mage +2'
magic-items.wand-of-the-war-mage-plus-two.description: "While holding this wand, you gain a bonus to spell attack rolls determined by the wand's rarity. In addition, you ignore half cover when making a spell attack."
magic-items.wand-of-the-war-mage-plus-three.name: 'Wand of the War Mage +3'
magic-items.wand-of-the-war-mage-plus-three.description: "While holding this wand, you gain a bonus to spell attack rolls determined by the wand's rarity. In addition, you ignore half cover when making a spell attack."
magic-items.amulet-of-health.name: 'Amulet of Health'
magic-items.amulet-of-health.description: 'Your Constitution score is 19 while you wear this amulet. It has no effect on you if your Constitution is already 19 or higher.'
magic-items.amulet-of-proof-against-detection-and-location.name: 'Amulet of Proof against Detection and Location'
magic-items.amulet-of-proof-against-detection-and-location.description: "While wearing this amulet, you are hidden from divination magic. You can't be targeted by such magic or perceived through magical scrying sensors."
magic-items.amulet-of-the-planes.name: 'Amulet of the Planes'
magic-items.amulet-of-the-planes.description: 'While wearing this amulet, you can use an action to name a location that you are familiar with on another plane of existence. Then make a DC 15 Intelligence check. On a successful check, you cast the *plane shift* spell. On a failure, you and each creature and object within 15 feet of you travel to a random destination. Roll a d100. On a 1–60, you travel to a random location on the plane you named. On a 61–100, you travel to a randomly determined plane of existence.'
magic-items.apparatus-of-the-crab.name: 'Apparatus of the Crab'
magic-items.apparatus-of-the-crab.description: |-
  This item first appears to be a Large sealed iron barrel weighing 500 pounds. The barrel has a hidden catch, which can be found with a successful DC 20 Intelligence (Investigation) check. Releasing the catch unlocks a hatch at one end of the barrel, allowing two Medium or smaller creatures to crawl inside. Ten levers are set in a row at the far end, each in a neutral position, able to move either up or down. When certain levers are used, the apparatus transforms to resemble a giant lobster.

  The apparatus of the Crab is a Large object with the following statistics:

  **Armor Class:** 20

  **Hit Points:** 200

  **Speed:** 30 ft., swim 30 ft. (or 0 ft. for both if the legs and tail aren't extended)

  **Damage Immunities:** poison, psychic To be used as a vehicle, the apparatus requires one pilot. While the apparatus's hatch is closed, the compartment is airtight and watertight. The compartment holds enough air for 10 hours of breathing, divided by the number of breathing creatures inside.

  The apparatus floats on water. It can also go underwater to a depth of 900 feet. Below that, the vehicle takes 2d6 bludgeoning damage per minute from pressure.

  A creature in the compartment can use an action to move as many as two of the apparatus's levers up or down. After each use, a lever goes back to its neutral position. Each lever, from left to right, functions as shown in the Apparatus of the Crab Levers table.

  **Apparatus of the Crab Levers**

  | Lever | Up | Down |
  | --- | --- | --- |
  | 1 | Legs and tail extend, allowing the apparatus to walk and swim. | Legs and tail retract, reducing the apparatus's speed to 0 and making it unable to benefit from bonuses to speed. |
  | 2 | Forward window shutter opens. | Forward window shutter closes. |
  | 3 | Side window shutters open (two per side). | Side window shutters close (two per side). |
  | 4 | Two claws extend from the front sides of the apparatus. | The claws retract. |
  | 5 | Each extended claw makes the following melee weapon attack: +8 to hit, reach 5 ft., one target. Hit: 7 (2d6) bludgeoning damage. | Each extended claw makes the following melee weapon attack: +8 to hit, reach 5 ft., one target. Hit: The target is grappled (escape DC 15). |
  | 6 | The apparatus walks or swims forward. | The apparatus walks or swims backward. |
  | 7 | The apparatus turns 90 degrees left. | The apparatus turns 90 degrees right. |
  | 8 | Eyelike fixtures emit bright light in a 30-foot radius and dim light for an additional 30 feet. | The light turns off. |
  | 9 | The apparatus sinks as much as 20 feet in liquid. | The apparatus rises up to 20 feet in liquid. |
  | 10 | The rear hatch unseals and opens. | The rear hatch closes and seals. |
magic-items.bag-of-beans.name: 'Bag of Beans'
magic-items.bag-of-beans.description: |-
  Inside this heavy cloth bag are 3d4 dry beans. The bag weighs 1/2 pound plus 1/4 pound for each bean it contains.

  If you dump the bag's contents out on the ground, they explode in a 10-foot radius, extending from the beans. Each creature in the area, including you, must make a DC 15 Dexterity saving throw, taking 5d4 fire damage on a failed save, or half as much damage on a successful one. The fire ignites flammable objects in the area that aren't being worn or carried.

  If you remove a bean from the bag, plant it in dirt or sand, and then water it, the bean produces an effect 1 minute later from the ground where it was planted. The GM can choose an effect from the following table, determine it randomly, or create an effect.

  | d100 | Effect |
  | --- | --- |
  | 01 | 5d4 toadstools sprout. If a creature eats a toadstool, roll any die. On an odd roll, the eater must succeed on a DC 15 Constitution saving throw or take 5d6 poison damage and become poisoned for 1 hour. On an even roll, the eater gains 5d6 temporary hit points for 1 hour. |
  | 02–10 | A geyser erupts and spouts water, beer, berry juice, tea, vinegar, wine, or oil (GM's choice) 30 feet into the air for 1d12 rounds. |
  | 11–20 | A treant sprouts. There's a 50 percent chance that the treant is chaotic evil and attacks. |
  | 21–30 | An animate, immobile stone statue in your likeness rises. It makes verbal threats against you. If you leave it and others come near, it describes you as the most heinous of villains and directs the newcomers to find and attack you. If you are on the same plane of existence as the statue, it knows where you are. The statue becomes inanimate after 24 hours. |
  | 31–40 | A campfire with blue flames springs forth and burns for 24 hours (or until it is extinguished). |
  | 41–50 | 1d6 + 6 shriekers sprout |
  | 51–60 | 1d4 + 8 bright pink toads crawl forth. Whenever a toad is touched, it transforms into a Large or smaller monster of the GM's choice. The monster remains for 1 minute, then disappears in a puff of bright pink smoke. |
  | 61–70 | A hungry bulette burrows up and attacks. |
  | 71–80 | A fruit tree grows. It has 1d10 + 20 fruit, 1d8 of which act as randomly determined magic potions, while one acts as an ingested poison of the GM's choice. The tree vanishes after 1 hour. Picked fruit remains, retaining any magic for 30 days. |
  | 81–90 | A nest of 1d4 + 3 eggs springs up. Any creature that eats an egg must make a DC 20 Constitution saving throw. On a successful save, a creature permanently increases its lowest ability score by 1, randomly choosing among equally low scores. On a failed save, the creature takes 10d6 force damage from an internal magical explosion. |
  | 91–99 | A pyramid with a 60-foot-square base bursts upward. Inside is a sarcophagus containing a mummy lord. The pyramid is treated as the mummy lord's lair, and its sarcophagus contains treasure of the GM's choice. |
  | 00 | A giant beanstalk sprouts, growing to a height of the GM's choice. The top leads where the GM chooses, such as to a great view, a cloud giant's castle, or a different plane of existence. |
magic-items.bag-of-devouring.name: 'Bag of Devouring'
magic-items.bag-of-devouring.description: |-
  This bag superficially resembles a *bag of holding* but is a feeding orifice for a gigantic extradimensional creature. Turning the bag inside out closes the orifice.

  The extradimensional creature attached to the bag can sense whatever is placed inside the bag. Animal or vegetable matter placed wholly in the bag is devoured and lost forever. When part of a living creature is placed in the bag, as happens when someone reaches inside it, there is a 50 percent chance that the creature is pulled inside the bag. A creature inside the bag can use its action to try to escape with a successful DC 15 Strength check. Another creature can use its action to reach into the bag to pull a creature out, doing so with a successful DC 20 Strength check (provided it isn't pulled inside the bag first). Any creature that starts its turn inside the bag is devoured, its body destroyed.

  Inanimate objects can be stored in the bag, which can hold a cubic foot of such material. However, once each day, the bag swallows any objects inside it and spits them out into another plane of existence. The GM determines the time and plane.

  If the bag is pierced or torn, it is destroyed, and anything contained within it is transported to a random location on the Astral Plane.
magic-items.bag-of-holding.name: 'Bag of Holding'
magic-items.bag-of-holding.description: |-
  This bag has an interior space considerably larger than its outside dimensions, roughly 2 feet in diameter at the mouth and 4 feet deep. The bag can hold up to 500 pounds, not exceeding a volume of 64 cubic feet. The bag weighs 15 pounds, regardless of its contents. Retrieving an item from the bag requires an action.

  If the bag is overloaded, pierced, or torn, it ruptures and is destroyed, and its contents are scattered in the Astral Plane. If the bag is turned inside out, its contents spill forth, unharmed, but the bag must be put right before it can be used again. Breathing creatures inside the bag can survive up to a number of minutes equal to 10 divided by the number of creatures (minimum 1 minute), after which time they begin to suffocate.

  Placing a *bag of holding* inside an extradimensional space created by a *handy haversack*, *portable hole*, or similar item instantly destroys both items and opens a gate to the Astral Plane. The gate originates where the one item was placed inside the other. Any creature within 10 feet of the gate is sucked through it to a random location on the Astral Plane. The gate then closes. The gate is one-way only and can't be reopened.
magic-items.bag-of-tricks.name: 'Bag of Tricks'
magic-items.bag-of-tricks.description: |-
  This ordinary bag, made from gray, rust, or tan cloth, appears empty. Reaching inside the bag, however, reveals the presence of a small, fuzzy object. The bag weighs 1/2 pound.

  You can use an action to pull the fuzzy object from the bag and throw it up to 20 feet. When the object lands, it transforms into a creature you determine by rolling a d8 and consulting the table that corresponds to the bag's color. The creature vanishes at the next dawn or when it is reduced to 0 hit points.

  The creature is friendly to you and your companions, and it acts on your turn. You can use a bonus action to command how the creature moves and what action it takes on its next turn, or to give it general orders, such as to attack your enemies. In the absence of such orders, the creature acts in a fashion appropriate to its nature.

  Once three fuzzy objects have been pulled from the bag, the bag can't be used again until the next dawn.

  **Gray Bag of Tricks**

  | d8 | Creature |
  | --- | --- |
  | 1 | Weasel |
  | 2 | Giant rat |
  | 3 | Badger |
  | 4 | Boar |
  | 5 | Panther |
  | 6 | Giant badger |
  | 7 | Dire wolf |
  | 8 | Giant elk |

  **Rust Bag of Tricks**

  | d8 | Creature |
  | --- | --- |
  | 1 | Rat |
  | 2 | Owl |
  | 3 | Mastiff |
  | 4 | Goat |
  | 5 | Giant goat |
  | 6 | Giant boar |
  | 7 | Lion |
  | 8 | Brown bear |

  **Tan Bag of Tricks**

  | d8 | Creature |
  | --- | --- |
  | 1 | Jackal |
  | 2 | Ape |
  | 3 | Baboon |
  | 4 | Axe beak |
  | 5 | Black bear |
  | 6 | Giant weasel |
  | 7 | Giant hyena |
  | 8 | Tiger |
magic-items.bag-of-tricks.state.charges.name: 'Charges'
magic-items.bead-of-force.name: 'Bead of Force'
magic-items.bead-of-force.description: |-
  This small black sphere measures 3/4 of an inch in diameter and weighs an ounce. Typically, 1d4 + 4 *beads of force* are found together.

  You can use an action to throw the bead up to 60 feet. The bead explodes on impact and is destroyed. Each creature within a 10-foot radius of where the bead landed must succeed on a DC 15 Dexterity saving throw or take 5d4 force damage. A sphere of transparent force then encloses the area for 1 minute. Any creature that failed the save and is completely within the area is trapped inside this sphere. Creatures that succeeded on the save, or are partially within the area, are pushed away from the center of the sphere until they are no longer inside it. Only breathable air can pass through the sphere's wall. No attack or other effect can.

  An enclosed creature can use its action to push against the sphere's wall, moving the sphere up to half the creature's walking speed. The sphere can be picked up, and its magic causes it to weigh only 1 pound, regardless of the weight of creatures inside.
magic-items.belt-of-dwarvenkind.name: 'Belt of Dwarvenkind'
magic-items.belt-of-dwarvenkind.description: |-
  While wearing this belt, you gain the following benefits:

  - Your Constitution score increases by 2, to a maximum of 20.
  - You have advantage on Charisma (Persuasion) checks made to interact with dwarves.

  In addition, while attuned to the belt, you have a 50 percent chance each day at dawn of growing a full beard if you're capable of growing one, or a visibly thicker beard if you already have one.

  If you aren't a dwarf, you gain the following additional benefits while wearing the belt:

  - You have advantage on saving throws against poison, and you have resistance against poison damage.
  - You have darkvision out to a range of 60 feet.
  - You can speak, read, and write Dwarvish.
magic-items.belt-of-stone-giant-strength.name: 'Belt of Stone Giant Strength'
magic-items.belt-of-stone-giant-strength.description: |-
  While wearing this belt, your Strength score changes to a score granted by the belt. If your Strength is already equal to or greater than the belt's score, the item has no effect on you.

  Six varieties of this belt exist, corresponding with and having rarity according to the six kinds of true giants. The *belt of stone giant strength* and the *belt of frost giant strength* look different, but they have the same effect.

  | Type | Strength | Rarity |
  | --- | --- | --- |
  | Hill giant | 21 | Rare |
  | Stone/frost giant | 23 | Very rare |
  | Fire giant | 25 | Very rare |
  | Cloud giant | 27 | Legendary |
  | Storm giant | 29 | Legendary |
magic-items.belt-of-frost-giant-strength.name: 'Belt of Frost Giant Strength'
magic-items.belt-of-frost-giant-strength.description: |-
  While wearing this belt, your Strength score changes to a score granted by the belt. If your Strength is already equal to or greater than the belt's score, the item has no effect on you.

  Six varieties of this belt exist, corresponding with and having rarity according to the six kinds of true giants. The *belt of stone giant strength* and the *belt of frost giant strength* look different, but they have the same effect.

