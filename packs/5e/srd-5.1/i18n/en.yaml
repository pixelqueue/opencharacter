  | --- | --- | --- | --- |
  | 1 | Acid | 6 | Necrotic |
  | 2 | Cold | 7 | Poison |
  | 3 | Fire | 8 | Psychic |
  | 4 | Force | 9 | Radiant |
  | 5 | Lightning | 10 | Thunder |
