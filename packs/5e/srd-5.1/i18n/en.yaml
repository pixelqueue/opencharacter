armor.padded.name: 'Padded armor'
armor.padded.description: 'Padded armor consists of quilted layers of cloth and batting.'
armor.leather.name: 'Leather armor'
armor.leather.description: 'The breastplate and shoulder protectors of this armor are made of leather that has been stiffened by being boiled in oil. The rest of the armor is made of softer and more flexible materials.'
armor.studded-leather.name: 'Studded leather armor'
armor.studded-leather.description: 'Made from tough but flexible leather, studded leather is reinforced with close-set rivets or spikes.'
armor.hide.name: 'Hide armor'
armor.hide.description: 'This crude armor consists of thick furs and pelts. It is commonly worn by barbarian tribes, evil humanoids, and other folk who lack access to the tools and materials needed to create better armor.'
armor.chain-shirt.name: 'Chain shirt'
armor.chain-shirt.description: "Made of interlocking metal rings, a chain shirt is worn between layers of clothing or leather. This armor offers modest protection to the wearer's upper body and allows the sound of the rings rubbing against one another to be muffled by outer layers."
armor.scale-mail.name: 'Scale mail'
armor.scale-mail.description: 'This armor consists of a coat and leggings (and perhaps a separate skirt) of leather covered with overlapping pieces of metal, much like the scales of a fish. The suit includes gauntlets.'
armor.breastplate.name: 'Breastplate'
armor.breastplate.description: "This armor consists of a fitted metal chest piece worn with supple leather. Although it leaves the legs and arms relatively unprotected, this armor provides good protection for the wearer's vital organs while leaving the wearer relatively unencumbered."
armor.half-plate.name: 'Half plate'
armor.half-plate.description: "Half plate consists of shaped metal plates that cover most of the wearer's body. It does not include leg protection beyond simple greaves that are attached with leather straps."
armor.ring-mail.name: 'Ring mail'
armor.ring-mail.description: "This armor is leather armor with heavy rings sewn into it. The rings help reinforce the armor against blows from swords and axes. Ring mail is inferior to chain mail, and it's usually worn only by those who can't afford better armor."
armor.chain-mail.name: 'Chain mail'
armor.chain-mail.description: 'Made of interlocking metal rings, chain mail includes a layer of quilted fabric worn underneath the mail to prevent chafing and to cushion the impact of blows. The suit includes gauntlets.'
armor.splint.name: 'Splint armor'
armor.splint.description: 'This armor is made of narrow vertical strips of metal riveted to a backing of leather that is worn over cloth padding. Flexible chain mail protects the joints.'
armor.plate.name: 'Plate armor'
armor.plate.description: 'Plate consists of shaped, interlocking metal plates to cover the entire body. A suit of plate includes gauntlets, heavy leather boots, a visored helmet, and thick layers of padding underneath the armor. Buckles and straps distribute the weight over the body.'
armor.shield.name: 'Shield'
armor.shield.description: 'A shield is made from wood or metal and is carried in one hand. Wielding a shield increases your Armor Class by 2. You can benefit from only one shield at a time.'

# Adventuring gear, tools, mounts and vehicles, and trade goods
gear.abacus.name: 'Abacus'
gear.acid.name: 'Acid (vial)'
gear.acid.description: 'As an action, you can splash the contents of this vial onto a creature within 5 feet of you or throw the vial up to 20 feet, shattering it on impact. In either case, make a ranged attack against a creature or object, treating the acid as an improvised weapon. On a hit, the target takes 2d6 acid damage.'
gear.alchemists-fire.name: "Alchemist's fire (flask)"
gear.alchemists-fire.description: "This sticky, adhesive fluid ignites when exposed to air. As an action, you can throw this flask up to 20 feet, shattering it on impact. Make a ranged attack against a creature or object, treating the alchemist's fire as an improvised weapon. On a hit, the target takes 1d4 fire damage at the start of each of its turns. A creature can end this damage by using its action to make a DC 10 Dexterity check to extinguish the flames."
gear.arrows.name: 'Arrow'
gear.blowgun-needles.name: 'Blowgun needle'
gear.crossbow-bolts.name: 'Crossbow bolt'
gear.sling-bullets.name: 'Sling bullet'
gear.antitoxin.name: 'Antitoxin (vial)'
gear.antitoxin.description: 'A creature that drinks this vial of liquid gains advantage on saving throws against poison for 1 hour. It confers no benefit to undead or constructs.'
gear.crystal.name: 'Crystal'
gear.crystal.description: 'An arcane focus is a special item—an orb, a crystal, a rod, a specially constructed staff, a wand-like length of wood, or some similar item—designed to channel the power of arcane spells. A sorcerer, warlock, or wizard can use such an item as a spellcasting focus.'
gear.orb.name: 'Orb'
gear.orb.description: 'An arcane focus is a special item—an orb, a crystal, a rod, a specially constructed staff, a wand-like length of wood, or some similar item—designed to channel the power of arcane spells. A sorcerer, warlock, or wizard can use such an item as a spellcasting focus.'
gear.rod.name: 'Rod'
gear.rod.description: 'An arcane focus is a special item—an orb, a crystal, a rod, a specially constructed staff, a wand-like length of wood, or some similar item—designed to channel the power of arcane spells. A sorcerer, warlock, or wizard can use such an item as a spellcasting focus.'
gear.staff.name: 'Staff'
gear.staff.description: 'An arcane focus is a special item—an orb, a crystal, a rod, a specially constructed staff, a wand-like length of wood, or some similar item—designed to channel the power of arcane spells. A sorcerer, warlock, or wizard can use such an item as a spellcasting focus.'
gear.wand.name: 'Wand'
gear.wand.description: 'An arcane focus is a special item—an orb, a crystal, a rod, a specially constructed staff, a wand-like length of wood, or some similar item—designed to channel the power of arcane spells. A sorcerer, warlock, or wizard can use such an item as a spellcasting focus.'
gear.backpack.name: 'Backpack'
gear.backpack.description: 'Capacity: 1 cubic foot/30 pounds of gear. You can also strap items, such as a bedroll or a coil of rope, to the outside of a backpack.'
gear.ball-bearings.name: 'Ball bearings (bag of 1,000)'
gear.ball-bearings.description: "As an action, you can spill these tiny metal balls from their pouch to cover a level, square area that is 10 feet on a side. A creature moving across the covered area must succeed on a DC 10 Dexterity saving throw or fall prone. A creature moving through the area at half speed doesn't need to make the save."
gear.barrel.name: 'Barrel'
gear.barrel.description: 'Capacity: 40 gallons liquid, 4 cubic feet solid.'
gear.basket.name: 'Basket'
gear.basket.description: 'Capacity: 2 cubic feet/40 pounds of gear.'
gear.bedroll.name: 'Bedroll'
gear.bell.name: 'Bell'
gear.blanket.name: 'Blanket'
gear.block-and-tackle.name: 'Block and tackle'
gear.block-and-tackle.description: 'A set of pulleys with a cable threaded through them and a hook to attach to objects, a block and tackle allows you to hoist up to four times the weight you can normally lift.'
gear.book.name: 'Book'
gear.book.description: 'A book might contain poetry, historical accounts, information pertaining to a particular field of lore, diagrams and notes on gnomish contraptions, or just about anything else that can be represented using text or pictures. A book of spells is a spellbook (described later in this section).'
gear.glass-bottle.name: 'Glass bottle'
gear.glass-bottle.description: 'Capacity: 1½ pints liquid.'
gear.bucket.name: 'Bucket'
gear.bucket.description: 'Capacity: 3 gallons liquid, 1/2 cubic foot solid.'
gear.caltrops.name: 'Caltrops (bag of 20)'
gear.caltrops.description: "As an action, you can spread a bag of caltrops to cover a square area that is 5 feet on a side. Any creature that enters the area must succeed on a DC 15 Dexterity saving throw or stop moving this turn and take 1 piercing damage. Taking this damage reduces the creature's walking speed by 10 feet until the creature regains at least 1 hit point. A creature moving through the area at half speed doesn't need to make the save."
gear.candle.name: 'Candle'
gear.candle.description: 'For 1 hour, a candle sheds bright light in a 5-foot radius and dim light for an additional 5 feet.'
gear.crossbow-bolt-case.name: 'Crossbow bolt case'
gear.crossbow-bolt-case.description: 'This wooden case can hold up to twenty crossbow bolts.'
gear.map-or-scroll-case.name: 'Map or scroll case'
gear.map-or-scroll-case.description: 'This cylindrical leather case can hold up to ten rolled-up sheets of paper or five rolled-up sheets of parchment.'
gear.chain.name: 'Chain (10 feet)'
gear.chain.description: 'A chain has 10 hit points. It can be burst with a successful DC 20 Strength check.'
gear.chalk.name: 'Chalk (1 piece)'
gear.chest.name: 'Chest'
gear.chest.description: 'Capacity: 12 cubic feet/300 pounds of gear.'
gear.climbers-kit.name: "Climber's kit"
gear.climbers-kit.description: "A climber's kit includes special pitons, boot tips, gloves, and a harness. You can use the climber's kit as an action to anchor yourself; when you do, you can't fall more than 25 feet from the point where you anchored yourself, and you can't climb more than 25 feet away from that point without undoing the anchor."
gear.common-clothes.name: 'Common clothes'
gear.costume.name: 'Costume'
gear.fine-clothes.name: 'Fine clothes'
gear.travelers-clothes.name: "Traveler's clothes"
gear.component-pouch.name: 'Component pouch'
gear.component-pouch.description: "A component pouch is a small, watertight leather belt pouch that has compartments to hold all the material components and other special items you need to cast your spells, except for those components that have a specific cost (as indicated in a spell's description)."
gear.crowbar.name: 'Crowbar'
gear.crowbar.description: "Using a crowbar grants advantage to Strength checks where the crowbar's leverage can be applied."
gear.sprig-of-mistletoe.name: 'Sprig of mistletoe'
gear.sprig-of-mistletoe.description: 'A druidic focus might be a sprig of mistletoe or holly, a wand or scepter made of yew or another special wood, a staff drawn whole out of a living tree, or a totem object incorporating feathers, fur, bones, and teeth from sacred animals. A druid can use such an object as a spellcasting focus.'
gear.totem.name: 'Totem'
gear.totem.description: 'A druidic focus might be a sprig of mistletoe or holly, a wand or scepter made of yew or another special wood, a staff drawn whole out of a living tree, or a totem object incorporating feathers, fur, bones, and teeth from sacred animals. A druid can use such an object as a spellcasting focus.'
gear.wooden-staff.name: 'Wooden staff'
gear.wooden-staff.description: 'A druidic focus might be a sprig of mistletoe or holly, a wand or scepter made of yew or another special wood, a staff drawn whole out of a living tree, or a totem object incorporating feathers, fur, bones, and teeth from sacred animals. A druid can use such an object as a spellcasting focus.'
gear.yew-wand.name: 'Yew wand'
gear.yew-wand.description: 'A druidic focus might be a sprig of mistletoe or holly, a wand or scepter made of yew or another special wood, a staff drawn whole out of a living tree, or a totem object incorporating feathers, fur, bones, and teeth from sacred animals. A druid can use such an object as a spellcasting focus.'
gear.fishing-tackle.name: 'Fishing tackle'
gear.fishing-tackle.description: 'This kit includes a wooden rod, silken line, corkwood bobbers, steel hooks, lead sinkers, velvet lures, and narrow netting.'
gear.flask-or-tankard.name: 'Flask or tankard'
gear.flask-or-tankard.description: 'Capacity: 1 pint liquid.'
gear.grappling-hook.name: 'Grappling hook'
gear.hammer.name: 'Hammer'
gear.sledgehammer.name: 'Sledgehammer'
gear.healers-kit.name: "Healer's kit"
gear.healers-kit.description: 'This kit is a leather pouch containing bandages, salves, and splints. The kit has ten uses. As an action, you can expend one use of the kit to stabilize a creature that has 0 hit points, without needing to make a Wisdom (Medicine) check.'
gear.amulet.name: 'Amulet'
gear.amulet.description: 'A holy symbol is a representation of a god or pantheon. It might be an amulet depicting a symbol representing a deity, the same symbol carefully engraved or inlaid as an emblem on a shield, or a tiny box holding a fragment of a sacred relic. Appendix PH-B "Fantasy-Historical Pantheons" lists the symbols commonly associated with many gods in the multiverse. A cleric or paladin can use a holy symbol as a spellcasting focus. To use the symbol in this way, the caster must hold it in hand, wear it visibly, or bear it on a shield.'
gear.emblem.name: 'Emblem'
gear.emblem.description: 'A holy symbol is a representation of a god or pantheon. It might be an amulet depicting a symbol representing a deity, the same symbol carefully engraved or inlaid as an emblem on a shield, or a tiny box holding a fragment of a sacred relic. Appendix PH-B "Fantasy-Historical Pantheons" lists the symbols commonly associated with many gods in the multiverse. A cleric or paladin can use a holy symbol as a spellcasting focus. To use the symbol in this way, the caster must hold it in hand, wear it visibly, or bear it on a shield.'
gear.reliquary.name: 'Reliquary'
gear.reliquary.description: 'A holy symbol is a representation of a god or pantheon. It might be an amulet depicting a symbol representing a deity, the same symbol carefully engraved or inlaid as an emblem on a shield, or a tiny box holding a fragment of a sacred relic. Appendix PH-B "Fantasy-Historical Pantheons" lists the symbols commonly associated with many gods in the multiverse. A cleric or paladin can use a holy symbol as a spellcasting focus. To use the symbol in this way, the caster must hold it in hand, wear it visibly, or bear it on a shield.'
gear.holy-water.name: 'Holy water (flask)'
gear.holy-water.description: |-
  As an action, you can splash the contents of this flask onto a creature within 5 feet of you or throw it up to 20 feet, shattering it on impact. In either case, make a ranged attack against a target creature, treating the holy water as an improvised weapon. If the target is a fiend or undead, it takes 2d6 radiant damage.

  A cleric or paladin may create holy water by performing a special ritual. The ritual takes 1 hour to perform, uses 25 gp worth of powdered silver, and requires the caster to expend a 1st-level spell slot.
gear.hourglass.name: 'Hourglass'
gear.hunting-trap.name: 'Hunting trap'
gear.hunting-trap.description: 'When you use your action to set it, this trap forms a saw-toothed steel ring that snaps shut when a creature steps on a pressure plate in the center. The trap is affixed by a heavy chain to an immobile object, such as a tree or a spike driven into the ground. A creature that steps on the plate must succeed on a DC 13 Dexterity saving throw or take 1d4 piercing damage and stop moving. Thereafter, until the creature breaks free of the trap, its movement is limited by the length of the chain (typically 3 feet long). A creature can use its action to make a DC 13 Strength check, freeing itself or another creature within its reach on a success. Each failed check deals 1 piercing damage to the trapped creature.'
gear.ink.name: 'Ink (1-ounce bottle)'
gear.ink-pen.name: 'Ink pen'
gear.jug-or-pitcher.name: 'Jug or pitcher'
gear.jug-or-pitcher.description: 'Capacity: 1 gallon liquid.'
gear.ladder.name: 'Ladder (10-foot)'
gear.lamp.name: 'Lamp'
gear.lamp.description: 'A lamp casts bright light in a 15-foot radius and dim light for an additional 30 feet. Once lit, it burns for 6 hours on a flask (1 pint) of oil.'
gear.bullseye-lantern.name: 'Bullseye lantern'
gear.bullseye-lantern.description: 'A bullseye lantern casts bright light in a 60-foot cone and dim light for an additional 60 feet. Once lit, it burns for 6 hours on a flask (1 pint) of oil.'
gear.hooded-lantern.name: 'Hooded lantern'
gear.hooded-lantern.description: 'A hooded lantern casts bright light in a 30-foot radius and dim light for an additional 30 feet. Once lit, it burns for 6 hours on a flask (1 pint) of oil. As an action, you can lower the hood, reducing the light to dim light in a 5-foot radius.'
gear.lock.name: 'Lock'
gear.lock.description: "A key is provided with the lock. Without the key, a creature proficient with thieves' tools can pick this lock with a successful DC 15 Dexterity check. Your GM may decide that better locks are available for higher prices."
gear.magnifying-glass.name: 'Magnifying glass'
gear.magnifying-glass.description: 'This lens allows a closer look at small objects. It is also useful as a substitute for flint and steel when starting fires. Lighting a fire with a magnifying glass requires light as bright as sunlight to focus, tinder to ignite, and about 5 minutes for the fire to ignite. A magnifying glass grants advantage on any ability check made to appraise or inspect an item that is small or highly detailed.'
gear.manacles.name: 'Manacles'
gear.manacles.description: "These metal restraints can bind a Small or Medium creature. Escaping the manacles requires a successful DC 20 Dexterity check. Breaking them requires a successful DC 20 Strength check. Each set of manacles comes with one key. Without the key, a creature proficient with thieves' tools can pick the manacles' lock with a successful DC 15 Dexterity check. Manacles have 15 hit points."
gear.mess-kit.name: 'Mess kit'
gear.mess-kit.description: 'This tin box contains a cup and simple cutlery. The box clamps together, and one side can be used as a cooking pan and the other as a plate or shallow bowl.'
gear.steel-mirror.name: 'Steel mirror'
gear.oil.name: 'Oil (flask)'
gear.oil.description: 'Oil usually comes in a clay flask that holds 1 pint. As an action, you can splash the oil in this flask onto a creature within 5 feet of you or throw it up to 20 feet, shattering it on impact. Make a ranged attack against a target creature or object, treating the oil as an improvised weapon. On a hit, the target is covered in oil. If the target takes any fire damage before the oil dries (after 1 minute), the target takes an additional 5 fire damage from the burning oil. You can also pour a flask of oil on the ground to cover a 5-foot-square area, provided that the surface is level. If lit, the oil burns for 2 rounds and deals 5 fire damage to any creature that enters the area or ends its turn in the area. A creature can take this damage only once per turn.'
gear.paper.name: 'Paper (one sheet)'
gear.parchment.name: 'Parchment (one sheet)'
gear.perfume.name: 'Perfume (vial)'
gear.miners-pick.name: "Miner's pick"
gear.piton.name: 'Piton'
gear.basic-poison.name: 'Basic poison (vial)'
gear.basic-poison.description: 'You can use the poison in this vial to coat one slashing or piercing weapon or up to three pieces of ammunition. Applying the poison takes an action. A creature hit by the poisoned weapon or ammunition must make a DC 10 Constitution saving throw or take 1d4 poison damage. Once applied, the poison retains potency for 1 minute before drying.'
gear.pole.name: 'Pole (10-foot)'
gear.iron-pot.name: 'Iron pot'
gear.iron-pot.description: 'Capacity: 1 gallon liquid.'
gear.pouch.name: 'Pouch'
gear.pouch.description: |-
  Capacity: 1/5 cubic foot/6 pounds of gear.

  A cloth or leather pouch can hold up to 20 sling bullets or 50 blowgun needles, among other things. A compartmentalized pouch for holding spell components is called a component pouch (described earlier in this section).
gear.quiver.name: 'Quiver'
gear.quiver.description: 'A quiver can hold up to 20 arrows.'
gear.portable-ram.name: 'Portable ram'
gear.portable-ram.description: 'You can use a portable ram to break down doors. When doing so, you gain a +4 bonus on the Strength check. One other character can help you use the ram, giving you advantage on this check.'
gear.rations.name: 'Rations (1 day)'
gear.rations.description: 'Rations consist of dry foods suitable for extended travel, including jerky, dried fruit, hardtack, and nuts.'
gear.robes.name: 'Robes'
gear.hempen-rope.name: 'Hempen rope (50 feet)'
gear.hempen-rope.description: 'Rope, whether made of hemp or silk, has 2 hit points and can be burst with a DC 17 Strength check.'
gear.silk-rope.name: 'Silk rope (50 feet)'
gear.silk-rope.description: 'Rope, whether made of hemp or silk, has 2 hit points and can be burst with a DC 17 Strength check.'
gear.sack.name: 'Sack'
gear.sack.description: 'Capacity: 1 cubic foot/30 pounds of gear.'
gear.merchants-scale.name: "Merchant's scale"
gear.merchants-scale.description: 'A scale includes a small balance, pans, and a suitable assortment of weights up to 2 pounds. With it, you can measure the exact weight of small objects, such as raw precious metals or trade goods, to help determine their worth.'
gear.sealing-wax.name: 'Sealing wax'
gear.shovel.name: 'Shovel'
gear.signal-whistle.name: 'Signal whistle'
gear.signet-ring.name: 'Signet ring'
gear.soap.name: 'Soap'
gear.spellbook.name: 'Spellbook'
gear.spellbook.description: 'Essential for wizards, a spellbook is a leather-bound tome with 100 blank vellum pages suitable for recording spells.'
gear.iron-spikes.name: 'Iron spike'
gear.spyglass.name: 'Spyglass'
gear.spyglass.description: 'Objects viewed through a spyglass are magnified to twice their size.'
gear.two-person-tent.name: 'Two-person tent'
gear.two-person-tent.description: 'A simple and portable canvas shelter, a tent sleeps two.'
gear.tinderbox.name: 'Tinderbox'
gear.tinderbox.description: 'This small container holds flint, fire steel, and tinder (usually dry cloth soaked in light oil) used to kindle a fire. Using it to light a torch—or anything else with abundant, exposed fuel—takes an action. Lighting any other fire takes 1 minute.'
gear.torch.name: 'Torch'
gear.torch.description: 'A torch burns for 1 hour, providing bright light in a 20-foot radius and dim light for an additional 20 feet. If you make a melee attack with a burning torch and hit, it deals 1 fire damage.'
gear.vial.name: 'Vial'
gear.vial.description: 'Capacity: 4 ounces liquid.'
gear.waterskin.name: 'Waterskin'
gear.waterskin.description: 'Capacity: 4 pints liquid.'
gear.whetstone.name: 'Whetstone'
gear.string.name: 'String (10 feet)'
gear.alms-box.name: 'Alms box'
gear.incense.name: 'Block of incense'
gear.censer.name: 'Censer'
gear.vestments.name: 'Vestments'
gear.bag-of-sand.name: 'Little bag of sand'
gear.small-knife.name: 'Small knife'
gear.bit-and-bridle.name: 'Bit and bridle'
gear.exotic-saddle.name: 'Exotic saddle'
gear.exotic-saddle.description: 'An exotic saddle is required for riding any aquatic or flying mount.'
gear.military-saddle.name: 'Military saddle'
gear.military-saddle.description: 'A military saddle braces the rider, helping you keep your seat on an active mount in battle. It gives you advantage on any check you make to remain mounted.'
gear.pack-saddle.name: 'Pack saddle'
gear.riding-saddle.name: 'Riding saddle'
gear.saddlebags.name: 'Saddlebags'
gear.feed.name: 'Feed (per day)'
gear.wheat.name: 'Wheat (1 lb)'
gear.flour.name: 'Flour (1 lb)'
gear.chicken.name: 'Chicken'
gear.salt.name: 'Salt (1 lb)'
gear.iron.name: 'Iron (1 lb)'
gear.canvas.name: 'Canvas (1 sq. yd.)'
gear.copper.name: 'Copper (1 lb)'
gear.cotton-cloth.name: 'Cotton cloth (1 sq. yd.)'
gear.ginger.name: 'Ginger (1 lb)'
gear.goat.name: 'Goat'
gear.cinnamon.name: 'Cinnamon (1 lb)'
gear.pepper.name: 'Pepper (1 lb)'
gear.sheep.name: 'Sheep'
gear.cloves.name: 'Cloves (1 lb)'
gear.pig.name: 'Pig'
gear.silver.name: 'Silver (1 lb)'
gear.linen.name: 'Linen (1 sq. yd.)'
gear.silk.name: 'Silk (1 sq. yd.)'
gear.cow.name: 'Cow'
gear.saffron.name: 'Saffron (1 lb)'
gear.ox.name: 'Ox'
gear.gold.name: 'Gold (1 lb)'
gear.platinum.name: 'Platinum (1 lb)'
gear.burglars-pack.name: "Burglar's pack"
gear.burglars-pack.description: 'Includes a backpack, a bag of 1,000 ball bearings, 10 feet of string, a bell, 5 candles, a crowbar, a hammer, 10 pitons, a hooded lantern, 2 flasks of oil, 5 days rations, a tinderbox, and a waterskin. The pack also has 50 feet of hempen rope strapped to the side of it.'
gear.burglars-pack.actions.unpack.name: 'Unpack'
gear.diplomats-pack.name: "Diplomat's pack"
gear.diplomats-pack.description: 'Includes a chest, 2 cases for maps and scrolls, a set of fine clothes, a bottle of ink, an ink pen, a lamp, 2 flasks of oil, 5 sheets of paper, a vial of perfume, sealing wax, and soap.'
gear.diplomats-pack.actions.unpack.name: 'Unpack'
gear.dungeoneers-pack.name: "Dungeoneer's pack"
gear.dungeoneers-pack.description: 'Includes a backpack, a crowbar, a hammer, 10 pitons, 10 torches, a tinderbox, 10 days of rations, and a waterskin. The pack also has 50 feet of hempen rope strapped to the side of it.'
gear.dungeoneers-pack.actions.unpack.name: 'Unpack'
gear.entertainers-pack.name: "Entertainer's pack"
gear.entertainers-pack.description: 'Includes a backpack, a bedroll, 2 costumes, 5 candles, 5 days of rations, a waterskin, and a disguise kit.'
gear.entertainers-pack.actions.unpack.name: 'Unpack'
gear.explorers-pack.name: "Explorer's pack"
gear.explorers-pack.description: 'Includes a backpack, a bedroll, a mess kit, a tinderbox, 10 torches, 10 days of rations, and a waterskin. The pack also has 50 feet of hempen rope strapped to the side of it.'
gear.explorers-pack.actions.unpack.name: 'Unpack'
gear.priests-pack.name: "Priest's pack"
gear.priests-pack.description: 'Includes a backpack, a blanket, 10 candles, a tinderbox, an alms box, 2 blocks of incense, a censer, vestments, 2 days of rations, and a waterskin.'
gear.priests-pack.actions.unpack.name: 'Unpack'
gear.scholars-pack.name: "Scholar's pack"
gear.scholars-pack.description: 'Includes a backpack, a book of lore, a bottle of ink, an ink pen, 10 sheets of parchment, a little bag of sand, and a small knife.'
gear.scholars-pack.actions.unpack.name: 'Unpack'
tools.alchemists-supplies.name: "Alchemist's supplies"
tools.alchemists-supplies.description: "These special tools include the items needed to pursue a craft or trade. The table shows examples of the most common types of tools, each providing items related to a single craft. Proficiency with a set of artisan's tools lets you add your proficiency bonus to any ability checks you make using the tools in your craft. Each type of artisan's tools requires a separate proficiency."
