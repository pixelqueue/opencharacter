magic-items.armor-plus-one.description: 'You have a bonus to AC while wearing this armor. The bonus is determined by its rarity.'
magic-items.shield-plus-one.name: '{base} +1'
magic-items.shield-plus-one.description: "While holding this shield, you have a bonus to AC determined by the shield's rarity. This bonus is in addition to the shield's normal bonus to AC."
