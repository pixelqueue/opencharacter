features.barbarian.rage.name: 'Rage'
features.barbarian.rage.description: |-
  In battle, you fight with primal ferocity. On your turn, you can enter a rage as a bonus action.

  While raging, you gain the following benefits if you aren't wearing heavy armor:

  - You have advantage on Strength checks and Strength saving throws.
  - When you make a melee weapon attack using Strength, you gain a bonus to the damage roll that increases as you gain levels as a barbarian, as shown in the Rage Damage column of the Barbarian table.
  - You have resistance to bludgeoning, piercing, and slashing damage.

  If you are able to cast spells, you can't cast them or concentrate on them while raging.

  Your rage lasts for 1 minute. It ends early if you are knocked unconscious or if your turn ends and you haven't attacked a hostile creature since your last turn or taken damage since then. You can also end your rage on your turn as a bonus action.

  Once you have raged the number of times shown for your barbarian level in the Rages column of the Barbarian table, you must finish a long rest before you can rage again.
features.barbarian.rage.actions.rage.name: 'Rage'
features.barbarian.rage.actions.end-rage.name: 'End rage'
features.barbarian.reckless-attack.name: 'Reckless Attack'
features.barbarian.reckless-attack.description: 'Starting at 2nd level, you can throw aside all concern for defense to attack with fierce desperation. When you make your first attack on your turn, you can decide to attack recklessly. Doing so gives you advantage on melee weapon attack rolls using Strength during this turn, but attack rolls against you have advantage until your next turn.'
features.barbarian.danger-sense.name: 'Danger Sense'
features.barbarian.danger-sense.description: |-
  At 2nd level, you gain an uncanny sense of when things nearby aren't as they should be, giving you an edge when you dodge away from danger.

  You have advantage on Dexterity saving throws against effects that you can see, such as traps and spells. To gain this benefit, you can't be blinded, deafened, or incapacitated.
features.barbarian.fast-movement.name: 'Fast Movement'
features.barbarian.fast-movement.description: "Starting at 5th level, your speed increases by 10 feet while you aren't wearing heavy armor."
features.barbarian.feral-instinct.name: 'Feral Instinct'
features.barbarian.feral-instinct.description: |-
  By 7th level, your instincts are so honed that you have advantage on initiative rolls.

  Additionally, if you are surprised at the beginning of combat and aren't incapacitated, you can act normally on your first turn, but only if you enter your rage before doing anything else on that turn.
features.barbarian.brutal-critical.name: 'Brutal Critical'
features.barbarian.brutal-critical.description: |-
  Beginning at 9th level, you can roll one additional weapon damage die when determining the extra damage for a critical hit with a melee attack.

  This increases to two additional dice at 13th level and three additional dice at 17th level.
features.barbarian.relentless-rage.name: 'Relentless Rage'
features.barbarian.relentless-rage.description: |-
  Starting at 11th level, your rage can keep you fighting despite grievous wounds. If you drop to 0 hit points while you're raging and don't die outright, you can make a DC 10 Constitution saving throw. If you succeed, you drop to 1 hit point instead.

  Each time you use this feature after the first, the DC increases by 5. When you finish a short or long rest, the DC resets to 10.
features.barbarian.relentless-rage.actions.relentless-rage.name: 'Relentless Rage'
features.barbarian.relentless-rage.followUps.relentless-rage.description: 'Dropped to 0 hit points while raging: make a Constitution save to stay at 1'
features.barbarian.persistent-rage.name: 'Persistent Rage'
features.barbarian.persistent-rage.description: 'Beginning at 15th level, your rage is so fierce that it ends early only if you fall unconscious or if you choose to end it.'
features.barbarian.indomitable-might.name: 'Indomitable Might'
features.barbarian.indomitable-might.description: 'Beginning at 18th level, if your total for a Strength check is less than your Strength score, you can use that score in place of the total.'
features.barbarian.primal-champion.name: 'Primal Champion'
features.barbarian.primal-champion.description: 'At 20th level, you embody the power of the wilds. Your Strength and Constitution scores increase by 4. Your maximum for those scores is now 24.'
features.barbarian.frenzy.name: 'Frenzy'
features.barbarian.frenzy.description: 'Starting when you choose this path at 3rd level, you can go into a frenzy when you rage. If you do so, for the duration of your rage you can make a single melee weapon attack as a bonus action on each of your turns after this one. When your rage ends, you suffer one level of exhaustion (as described in appendix PH-A).'
features.barbarian.frenzy.actions.frenzy.name: 'Frenzy'
features.barbarian.mindless-rage.name: 'Mindless Rage'
features.barbarian.mindless-rage.description: "Beginning at 6th level, you can't be charmed or frightened while raging. If you are charmed or frightened when you enter your rage, the effect is suspended for the duration of the rage."
features.barbarian.intimidating-presence.name: 'Intimidating Presence'
features.barbarian.intimidating-presence.description: |-
  Beginning at 10th level, you can use your action to frighten someone with your menacing presence. When you do so, choose one creature that you can see within 30 feet of you. If the creature can see or hear you, it must succeed on a Wisdom saving throw (DC equal to 8 + your proficiency bonus + your Charisma modifier) or be frightened of you until the end of your next turn. On subsequent turns, you can use your action to extend the duration of this effect on the frightened creature until the end of your next turn. This effect ends if the creature ends its turn out of line of sight or more than 60 feet away from you.

  If the creature succeeds on its saving throw, you can't use this feature on that creature again for 24 hours.
features.barbarian.intimidating-presence.actions.intimidating-presence.name: 'Intimidating Presence'
features.barbarian.retaliation.name: 'Retaliation'
features.barbarian.retaliation.description: 'Starting at 14th level, when you take damage from a creature that is within 5 feet of you, you can use your reaction to make a melee weapon attack against that creature.'
features.bard.spellcasting.name: 'Spellcasting'
features.bard.spellcasting.description: |-
  You have learned to untangle and reshape the fabric of reality in harmony with your wishes and music. Your spells are part of your vast repertoire, magic that you can tune to different situations.

  **Cantrips**

  You know two cantrips of your choice from the bard spell list. You learn additional bard cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Bard table.

  **Spell Slots**

  The Bard table shows how many spell slots you have to cast your spells of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

  For example, if you know the 1st-level spell *cure wounds* and have a 1st-level and a 2nd-level spell slot available, you can cast *cure wounds* using either slot.

  **Spells Known of 1st Level and Higher**

  You know four 1st-level spells of your choice from the bard spell list.

  The Spells Known column of the Bard table shows when you learn more bard spells of your choice. Each of these spells must be of a level for which you have spell slots, as shown on the table. For instance, when you reach 3rd level in this class, you can learn one new spell of 1st or 2nd level.

  Additionally, when you gain a level in this class, you can choose one of the bard spells you know and replace it with another spell from the bard spell list, which also must be of a level for which you have spell slots.

  **Spellcasting Ability**

  Charisma is your spellcasting ability for your bard spells. Your magic comes from the heart and soul you pour into the performance of your music or oration. You use your Charisma whenever a spell refers to your spellcasting ability. In addition, you use your Charisma modifier when setting the saving throw DC for a bard spell you cast and when making an attack roll with one.

  **Spell save DC** = 8 + your proficiency bonus + your Charisma modifier

  **Spell attack modifier** = your proficiency bonus + your Charisma modifier

  **Ritual Casting**

  You can cast any bard spell you know as a ritual if that spell has the ritual tag.

  **Spellcasting Focus**

  You can use a musical instrument (see "Equipment") as a spellcasting focus for your bard spells.
features.bard.bardic-inspiration.name: 'Bardic Inspiration'
features.bard.bardic-inspiration.description: |-
  You can inspire others through stirring words or music. To do so, you use a bonus action on your turn to choose one creature other than yourself within 60 feet of you who can hear you. That creature gains one Bardic Inspiration die, a d6.

  Once within the next 10 minutes, the creature can roll the die and add the number rolled to one ability check, attack roll, or saving throw it makes. The creature can wait until after it rolls the d20 before deciding to use the Bardic Inspiration die, but must decide before the GM says whether the roll succeeds or fails. Once the Bardic Inspiration die is rolled, it is lost. A creature can have only one Bardic Inspiration die at a time.

  You can use this feature a number of times equal to your Charisma modifier (a minimum of once). You regain any expended uses when you finish a long rest.

  Your Bardic Inspiration die changes when you reach certain levels in this class. The die becomes a d8 at 5th level, a d10 at 10th level, and a d12 at 15th level.
features.bard.bardic-inspiration.actions.bardic-inspiration.name: 'Give Bardic Inspiration'
features.bard.jack-of-all-trades.name: 'Jack of All Trades'
features.bard.jack-of-all-trades.description: "Starting at 2nd level, you can add half your proficiency bonus, rounded down, to any ability check you make that doesn't already include your proficiency bonus."
features.bard.song-of-rest.name: 'Song of Rest'
features.bard.song-of-rest.description: |-
  Beginning at 2nd level, you can use soothing music or oration to help revitalize your wounded allies during a short rest. If you or any friendly creatures who can hear your performance regain hit points at the end of the short rest by spending one or more Hit Dice, each of those creatures regains an extra 1d6 hit points.

  The extra hit points increase when you reach certain levels in this class: to 1d8 at 9th level, to 1d10 at 13th level, and to 1d12 at 17th level.
features.bard.song-of-rest.actions.song-of-rest.name: 'Song of Rest'
features.bard.expertise.choices.skills.prompt: 'Choose two skills for expertise (level {slot})'
features.bard.expertise.name: 'Expertise'
features.bard.expertise.description: |-
  At 3rd level, choose two of your skill proficiencies. Your proficiency bonus is doubled for any ability check you make that uses either of the chosen proficiencies.

  At 10th level, you can choose another two skill proficiencies to gain this benefit.
features.bard.font-of-inspiration.name: 'Font of Inspiration'
features.bard.font-of-inspiration.description: 'Beginning when you reach 5th level, you regain all of your expended uses of Bardic Inspiration when you finish a short or long rest.'
features.bard.countercharm.name: 'Countercharm'
features.bard.countercharm.description: 'At 6th level, you gain the ability to use musical notes or words of power to disrupt mind-influencing effects. As an action, you can start a performance that lasts until the end of your next turn. During that time, you and any friendly creatures within 30 feet of you have advantage on saving throws against being frightened or charmed. A creature must be able to hear you to gain this benefit. The performance ends early if you are incapacitated or silenced or if you voluntarily end it (no action required).'
features.bard.countercharm.actions.countercharm.name: 'Countercharm'
features.bard.countercharm.actions.countercharm.results.performing.name: 'Performing'
features.bard.countercharm.actions.end-countercharm.name: 'End Countercharm'
features.bard.countercharm.actions.end-countercharm.results.ended.name: 'Ended'
features.bard.magical-secrets.name: 'Magical Secrets'
features.bard.magical-secrets.description: |-
  By 10th level, you have plundered magical knowledge from a wide spectrum of disciplines. Choose two spells from any class, including this one. A spell you choose must be of a level you can cast, as shown on the Bard table, or a cantrip.

  The chosen spells count as bard spells for you and are included in the number in the Spells Known column of the Bard table.

  You learn two additional spells from any class at 14th level and again at 18th level.
features.bard.superior-inspiration.name: 'Superior Inspiration'
features.bard.superior-inspiration.description: 'At 20th level, when you roll initiative and have no uses of Bardic Inspiration left, you regain one use.'
features.bard.bonus-proficiencies.choices.skills.prompt: 'Bonus Proficiencies: choose three skills'
features.bard.bonus-proficiencies.name: 'Bonus Proficiencies'
features.bard.bonus-proficiencies.description: 'When you join the College of Lore at 3rd level, you gain proficiency with three skills of your choice.'
features.bard.cutting-words.name: 'Cutting Words'
features.bard.cutting-words.description: "Also at 3rd level, you learn how to use your wit to distract, confuse, and otherwise sap the confidence and competence of others. When a creature that you can see within 60 feet of you makes an attack roll, an ability check, or a damage roll, you can use your reaction to expend one of your uses of Bardic Inspiration, rolling a Bardic Inspiration die and subtracting the number rolled from the creature's roll. You can choose to use this feature after the creature makes its roll, but before the GM determines whether the attack roll or ability check succeeds or fails, or before the creature deals its damage. The creature is immune if it can't hear you or if it's immune to being charmed."
features.bard.cutting-words.actions.cutting-words.name: 'Cutting Words'
features.bard.additional-magical-secrets.name: 'Additional Magical Secrets'
features.bard.additional-magical-secrets.description: "At 6th level, you learn two spells of your choice from any class. A spell you choose must be of a level you can cast, as shown on the Bard table, or a cantrip. The chosen spells count as bard spells for you but don't count against the number of bard spells you know."
features.bard.peerless-skill.name: 'Peerless Skill'
features.bard.peerless-skill.description: 'Starting at 14th level, when you make an ability check, you can expend one use of Bardic Inspiration. Roll a Bardic Inspiration die and add the number rolled to your ability check. You can choose to do so after you roll the die for the ability check, but before the GM tells you whether you succeed or fail.'
features.bard.peerless-skill.actions.peerless-skill.name: 'Peerless Skill'
features.cleric.spellcasting.name: 'Spellcasting'
features.cleric.spellcasting.description: |-
  As a conduit for divine power, you can cast cleric spells.

  **Cantrips**

  At 1st level, you know three cantrips of your choice from the cleric spell list. You learn additional cleric cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Cleric table.

  **Preparing and Casting Spells**

  The Cleric table shows how many spell slots you have to cast your spells of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

  You prepare the list of cleric spells that are available for you to cast, choosing from the cleric spell list. When you do so, choose a number of cleric spells equal to your Wisdom modifier + your cleric level (minimum of one spell). The spells must be of a level for which you have spell slots.

  For example, if you are a 3rd-level cleric, you have four 1st-level and two 2nd-level spell slots. With a Wisdom of 16, your list of prepared spells can include six spells of 1st or 2nd level, in any combination. If you prepare the 1st-level spell *cure wounds*, you can cast it using a 1st-level or 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.

  You can change your list of prepared spells when you finish a long rest. Preparing a new list of cleric spells requires time spent in prayer and meditation: at least 1 minute per spell level for each spell on your list.

  **Spellcasting Ability**

  Wisdom is your spellcasting ability for your cleric spells. The power of your spells comes from your devotion to your deity. You use your Wisdom whenever a cleric spell refers to your spellcasting ability. In addition, you use your Wisdom modifier when setting the saving throw DC for a cleric spell you cast and when making an attack roll with one.

  **Spell save DC** = 8 + your proficiency bonus + your Wisdom modifier

  **Spell attack modifier** = your proficiency bonus + your Wisdom modifier

  **Ritual Casting**

  You can cast a cleric spell as a ritual if that spell has the ritual tag and you have the spell prepared.

  **Spellcasting Focus**

  You can use a holy symbol (see "Equipment") as a spellcasting focus for your cleric spells.
features.cleric.channel-divinity.name: 'Channel Divinity'
features.cleric.channel-divinity.description: |-
  At 2nd level, you gain the ability to channel divine energy directly from your deity, using that energy to fuel magical effects. You start with two such effects: Turn Undead and an effect determined by your domain. Some domains grant you additional effects as you advance in levels, as noted in the domain description.

  When you use your Channel Divinity, you choose which effect to create. You must then finish a short or long rest to use your Channel Divinity again.

  Some Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your cleric spell save DC.

  Beginning at 6th level, you can use your Channel Divinity twice between rests, and beginning at 18th level, you can use it three times between rests. When you finish a short or long rest, you regain your expended uses.

  **Channel Divinity: Turn Undead**

  As an action, you present your holy symbol and speak a prayer censuring the undead. Each undead that can see or hear you within 30 feet of you must make a Wisdom saving throw. If the creature fails its saving throw, it is turned for 1 minute or until it takes any damage.

  A turned creature must spend its turns trying to move as far away from you as it can, and it can't willingly move to a space within 30 feet of you. It also can't take reactions. For its action, it can use only the Dash action or try to escape from an effect that prevents it from moving. If there's nowhere to move, the creature can use the Dodge action.
features.cleric.turn-undead.name: 'Turn Undead'
features.cleric.turn-undead.description: |-
  As an action, you present your holy symbol and speak a prayer censuring the undead. Each undead that can see or hear you within 30 feet of you must make a Wisdom saving throw. If the creature fails its saving throw, it is turned for 1 minute or until it takes any damage.

  A turned creature must spend its turns trying to move as far away from you as it can, and it can't willingly move to a space within 30 feet of you. It also can't take reactions. For its action, it can use only the Dash action or try to escape from an effect that prevents it from moving. If there's nowhere to move, the creature can use the Dodge action.
features.cleric.turn-undead.actions.turn-undead.name: 'Turn Undead'
features.cleric.destroy-undead.name: 'Destroy Undead'
features.cleric.destroy-undead.description: |-
  Starting at 5th level, when an undead fails its saving throw against your Turn Undead feature, the creature is instantly destroyed if its challenge rating is at or below a certain threshold, as shown in the Destroy Undead table.

  **Destroy Undead**

  | Cleric Level | Destroys Undead of CR . . . |
  | --- | --- |
  | 5th | 1/2 or lower |
  | 8th | 1 or lower |
  | 11th | 2 or lower |
  | 14th | 3 or lower |
  | 17th | 4 or lower |
features.cleric.divine-intervention.name: 'Divine Intervention'
features.cleric.divine-intervention.description: |-
  Beginning at 10th level, you can call on your deity to intervene on your behalf when your need is great.

  Imploring your deity's aid requires you to use your action. Describe the assistance you seek, and roll percentile dice. If you roll a number equal to or lower than your cleric level, your deity intervenes. The GM chooses the nature of the intervention; the effect of any cleric spell or cleric domain spell would be appropriate.

  If your deity intervenes, you can't use this feature again for 7 days. Otherwise, you can use it again after you finish a long rest.

  At 20th level, your call for intervention succeeds automatically, no roll required.
features.cleric.divine-intervention.actions.divine-intervention.name: 'Divine Intervention'
features.cleric.bonus-proficiency.name: 'Bonus Proficiency'
features.cleric.bonus-proficiency.description: 'When you choose this domain at 1st level, you gain proficiency with heavy armor.'
features.cleric.disciple-of-life.name: 'Disciple of Life'
features.cleric.disciple-of-life.description: "Also starting at 1st level, your healing spells are more effective. Whenever you use a spell of 1st level or higher to restore hit points to a creature, the creature regains additional hit points equal to 2 + the spell's level."
features.cleric.preserve-life.name: 'Channel Divinity: Preserve Life'
features.cleric.preserve-life.description: |-
  Starting at 2nd level, you can use your Channel Divinity to heal the badly injured.

  As an action, you present your holy symbol and evoke healing energy that can restore a number of hit points equal to five times your cleric level. Choose any creatures within 30 feet of you, and divide those hit points among them. This feature can restore a creature to no more than half of its hit point maximum. You can't use this feature on an undead or a construct.
features.cleric.preserve-life.actions.preserve-life.name: 'Preserve Life'
features.cleric.blessed-healer.name: 'Blessed Healer'
features.cleric.blessed-healer.description: "Beginning at 6th level, the healing spells you cast on others heal you as well. When you cast a spell of 1st level or higher that restores hit points to a creature other than you, you regain hit points equal to 2 + the spell's level."
features.cleric.blessed-healer.actions.blessed-healer.name: 'Blessed Healer'
features.cleric.divine-strike.name: 'Divine Strike'
features.cleric.divine-strike.description: 'At 8th level, you gain the ability to infuse your weapon strikes with divine energy. Once on each of your turns when you hit a creature with a weapon attack, you can cause the attack to deal an extra 1d8 radiant damage to the target. When you reach 14th level, the extra damage increases to 2d8.'
features.cleric.supreme-healing.name: 'Supreme Healing'
features.cleric.supreme-healing.description: 'Starting at 17th level, when you would normally roll one or more dice to restore hit points with a spell, you instead use the highest number possible for each die. For example, instead of restoring 2d6 hit points to a creature, you restore 12.'
features.druid.druidic.name: 'Druidic'
features.druid.druidic.description: "You know Druidic, the secret language of druids. You can speak the language and use it to leave hidden messages. You and others who know this language automatically spot such a message. Others spot the message's presence with a successful DC 15 Wisdom (Perception) check but can't decipher it without magic."
features.druid.spellcasting.name: 'Spellcasting'
features.druid.spellcasting.description: |-
  Drawing on the divine essence of nature itself, you can cast spells to shape that essence to your will.

  **Cantrips**

  At 1st level, you know two cantrips of your choice from the druid spell list. You learn additional druid cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Druid table.

  **Preparing and Casting Spells**

  The Druid table shows how many spell slots you have to cast your spells of 1st level and higher. To cast one of these druid spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

  You prepare the list of druid spells that are available for you to cast, choosing from the druid spell list. When you do so, choose a number of druid spells equal to your Wisdom modifier + your druid level (minimum of one spell). The spells must be of a level for which you have spell slots.

  For example, if you are a 3rd-level druid, you have four 1st-level and two 2nd-level spell slots. With a Wisdom of 16, your list of prepared spells can include six spells of 1st or 2nd level, in any combination. If you prepare the 1st-level spell *cure wounds,* you can cast it using a 1st-level or 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.

  You can also change your list of prepared spells when you finish a long rest. Preparing a new list of druid spells requires time spent in prayer and meditation: at least 1 minute per spell level for each spell on your list.

  **Spellcasting Ability**

  Wisdom is your spellcasting ability for your druid spells, since your magic draws upon your devotion and attunement to nature. You use your Wisdom whenever a spell refers to your spellcasting ability. In addition, you use your Wisdom modifier when setting the saving throw DC for a druid spell you cast and when making an attack roll with one.

  **Spell save DC** = 8 + your proficiency bonus + your Wisdom modifier

  **Spell attack modifier** = your proficiency bonus + your Wisdom modifier

  **Ritual Casting**

  You can cast a druid spell as a ritual if that spell has the ritual tag and you have the spell prepared.

  **Spellcasting Focus**

  You can use a druidic focus (see "Equipment") as a spellcasting focus for your druid spells.
features.druid.wild-shape.name: 'Wild Shape'
features.druid.wild-shape.description: |-
  Starting at 2nd level, you can use your action to magically assume the shape of a beast that you have seen before. You can use this feature twice. You regain expended uses when you finish a short or long rest.

  Your druid level determines the beasts you can transform into, as shown in the Beast Shapes table. At 2nd level, for example, you can transform into any beast that has a challenge rating of 1/4 or lower that doesn't have a flying or swimming speed.

  **Beast Shapes**

  | Level | Max. CR | Limitations | Example |
  | --- | --- | --- | --- |
  | 2nd | 1/4 | No flying or swimming speed | Wolf |
  | 4th | 1/2 | No flying speed | Crocodile |
  | 8th | 1 | — | Giant eagle |

  You can stay in a beast shape for a number of hours equal to half your druid level (rounded down). You then revert to your normal form unless you expend another use of this feature. You can revert to your normal form earlier by using a bonus action on your turn. You automatically revert if you fall unconscious, drop to 0 hit points, or die.

  While you are transformed, the following rules apply:

  - Your game statistics are replaced by the statistics of the beast, but you retain your alignment, personality, and Intelligence, Wisdom, and Charisma scores. You also retain all of your skill and saving throw proficiencies, in addition to gaining those of the creature. If the creature has the same proficiency as you and the bonus in its stat block is higher than yours, use the creature's bonus instead of yours. If the creature has any legendary or lair actions, you can't use them.
  - When you transform, you assume the beast's hit points and Hit Dice. When you revert to your normal form, you return to the number of hit points you had before you transformed. However, if you revert as a result of dropping to 0 hit points, any excess damage carries over to your normal form. For example, if you take 10 damage in animal form and have only 1 hit point left, you revert and take 9 damage. As long as the excess damage doesn't reduce your normal form to 0 hit points, you aren't knocked unconscious.
  - You can't cast spells, and your ability to speak or take any action that requires hands is limited to the capabilities of your beast form. Transforming doesn't break your concentration on a spell you've already cast, however, or prevent you from taking actions that are part of a spell, such as *call lightning*, that you've already cast.
  - You retain the benefit of any features from your class, race, or other source and can use them if the new form is physically capable of doing so. However, you can't use any of your special senses, such as darkvision, unless your new form also has that sense.
  - You choose whether your equipment falls to the ground in your space, merges into your new form, or is worn by it. Worn equipment functions as normal, but the GM decides whether it is practical for the new form to wear a piece of equipment, based on the creature's shape and size. Your equipment doesn't change size or shape to match the new form, and any equipment that the new form can't wear must either fall to the ground or merge with it. Equipment that merges with the form has no effect until you leave the form.
features.druid.wild-shape.actions.wild-shape.name: 'Wild Shape'
features.druid.wild-shape.actions.wild-shape.results.transformed.name: 'Transformed'
features.druid.wild-shape.actions.revert.name: 'Revert to normal form'
features.druid.wild-shape.actions.revert.results.reverted.name: 'Reverted'
features.druid.timeless-body.name: 'Timeless Body'
features.druid.timeless-body.description: 'Starting at 18th level, the primal magic that you wield causes you to age more slowly. For every 10 years that pass, your body ages only 1 year.'
features.druid.beast-spells.name: 'Beast Spells'
features.druid.beast-spells.description: "Beginning at 18th level, you can cast many of your druid spells in any shape you assume using Wild Shape. You can perform the somatic and verbal components of a druid spell while in a beast shape, but you aren't able to provide material components."
features.druid.archdruid.name: 'Archdruid'
features.druid.archdruid.description: |-
  At 20th level, you can use your Wild Shape an unlimited number of times.

  Additionally, you can ignore the verbal and somatic components of your druid spells, as well as any material components that lack a cost and aren't consumed by a spell. You gain this benefit in both your normal shape and your beast shape from Wild Shape.
features.druid.bonus-cantrip.name: 'Bonus Cantrip'
features.druid.bonus-cantrip.description: 'When you choose this circle at 2nd level, you learn one additional druid cantrip of your choice.'
features.druid.bonus-cantrip.choices.cantrip.prompt: 'Choose a druid cantrip'
features.druid.natural-recovery.name: 'Natural Recovery'
features.druid.natural-recovery.description: |-
  Starting at 2nd level, you can regain some of your magical energy by sitting in meditation and communing with nature. During a short rest, you choose expended spell slots to recover. The spell slots can have a combined level that is equal to or less than half your druid level (rounded up), and none of the slots can be 6th level or higher. You can't use this feature again until you finish a long rest.

  For example, when you are a 4th-level druid, you can recover up to two levels worth of spell slots. You can recover either a 2nd-level slot or two 1st-level slots.
features.druid.natural-recovery.actions.natural-recovery.name: 'Natural Recovery'
features.druid.natural-recovery.actions.natural-recovery.steps.slots.prompt: 'Choose a spent slot to recover'
features.druid.natural-recovery.actions.natural-recovery.options.1.name: '1st-level slot'
features.druid.natural-recovery.actions.natural-recovery.options.2.name: '2nd-level slot'
features.druid.natural-recovery.actions.natural-recovery.options.3.name: '3rd-level slot'
features.druid.natural-recovery.actions.natural-recovery.options.4.name: '4th-level slot'
features.druid.natural-recovery.actions.natural-recovery.options.5.name: '5th-level slot'
features.druid.natural-recovery.actions.natural-recovery.results.recovered.name: 'Slots recovered'
features.druid.circle-spells.name: 'Circle Spells'
features.druid.circle-spells.description: |-
  Your mystical connection to the land infuses you with the ability to cast certain spells. At 3rd, 5th, 7th, and 9th level you gain access to circle spells connected to the land where you became a druid. Choose that land—arctic, coast, desert, forest, grassland, mountain, or swamp—and consult the associated list of spells.

  Once you gain access to a circle spell, you always have it prepared, and it doesn't count against the number of spells you can prepare each day. If you gain access to a spell that doesn't appear on the druid spell list, the spell is nonetheless a druid spell for you.

  **Arctic**

  | Druid Level | Circle Spells |
  | --- | --- |
  | 3rd | *hold person*, *spike growth* |
  | 5th | *sleet storm*, *slow* |
  | 7th | *freedom of movement*, *ice storm* |
  | 9th | *commune with nature*, *cone of cold* |

  **Coast**

  | Druid Level | Circle Spells |
  | --- | --- |
  | 3rd | *mirror image*, *misty step* |
  | 5th | *water breathing*, *water walk* |
  | 7th | *control water*, *freedom of movement* |
  | 9th | *conjure elemental*, *scrying* |

  **Desert**

  | Druid Level | Circle Spells |
  | --- | --- |
  | 3rd | *blur*, *silence* |
  | 5th | *create food and water*, *protection from energy* |
  | 7th | *blight*, *hallucinatory terrain* |
  | 9th | *insect plague*, *wall of stone* |

  **Forest**

  | Druid Level | Circle Spells |
  | --- | --- |
  | 3rd | *barkskin*, *spider climb* |
  | 5th | *call lightning*, *plant growth* |
  | 7th | *divination*, *freedom of movement* |
  | 9th | *commune with nature*, *tree stride* |

  **Grassland**

  | Druid Level | Circle Spells |
  | --- | --- |
  | 3rd | *invisibility*, *pass without trace* |
  | 5th | *daylight*, *haste* |
  | 7th | *divination*, *freedom of movement* |
  | 9th | *dream*, *insect plague* |

  **Mountain**

  | Druid Level | Circle Spells |
  | --- | --- |
  | 3rd | *spider climb*, *spike growth* |
  | 5th | *lightning bolt*, *meld into stone* |
  | 7th | *stone shape*, *stoneskin* |
  | 9th | *passwall*, *wall of stone* |

  **Swamp**

  | Druid Level | Circle Spells |
  | --- | --- |
  | 3rd | *acid arrow, darkness* |
  | 5th | *water walk*, *stinking cloud* |
  | 7th | *freedom of movement*, *locate creature* |
  | 9th | *insect plague*, *scrying* |
features.druid.lands-stride.name: "Land's Stride"
features.druid.lands-stride.description: |-
  Starting at 6th level, moving through nonmagical difficult terrain costs you no extra movement. You can also pass through nonmagical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.

  In addition, you have advantage on saving throws against plants that are magically created or manipulated to impede movement, such those created by the *entangle* spell.
features.druid.natures-ward.name: "Nature's Ward"
features.druid.natures-ward.description: "When you reach 10th level, you can't be charmed or frightened by elementals or fey, and you are immune to poison and disease."
features.druid.natures-sanctuary.name: "Nature's Sanctuary"
features.druid.natures-sanctuary.description: 'When you reach 14th level, creatures of the natural world sense your connection to nature and become hesitant to attack you. When a beast or plant creature attacks you, that creature must make a Wisdom saving throw against your druid spell save DC. On a failed save, the creature must choose a different target, or the attack automatically misses. On a successful save, the creature is immune to this effect for 24 hours. The creature is aware of this effect before it makes its attack against you.'
features.fighter.second-wind.name: 'Second Wind'
features.fighter.second-wind.description: 'You have a limited well of stamina that you can draw on to protect yourself from harm. On your turn, you can use a bonus action to regain hit points equal to 1d10 + your fighter level. Once you use this feature, you must finish a short or long rest before you can use it again.'
features.fighter.second-wind.actions.second-wind.name: 'Second Wind'
features.fighter.action-surge.name: 'Action Surge'
features.fighter.action-surge.description: |-
  Starting at 2nd level, you can push yourself beyond your normal limits for a moment. On your turn, you can take one additional action on top of your regular action and a possible bonus action.

  Once you use this feature, you must finish a short or long rest before you can use it again. Starting at 17th level, you can use it twice before a rest, but only once on the same turn.
features.fighter.action-surge.actions.action-surge.name: 'Action Surge'
features.fighter.action-surge.actions.action-surge.results.surged.name: 'Extra action'
features.fighter.extra-attack-2.name: 'Extra Attack (2)'
features.fighter.extra-attack-2.description: |-
  Beginning at 5th level, you can attack twice, instead of once, whenever you take the Attack action on your turn.

  The number of attacks increases to three when you reach 11th level in this class and to four when you reach 20th level in this class.
features.fighter.extra-attack-3.name: 'Extra Attack (3)'
features.fighter.extra-attack-3.description: |-
  Beginning at 5th level, you can attack twice, instead of once, whenever you take the Attack action on your turn.

  The number of attacks increases to three when you reach 11th level in this class and to four when you reach 20th level in this class.
features.fighter.indomitable.name: 'Indomitable'
features.fighter.indomitable.description: |-
  Beginning at 9th level, you can reroll a saving throw that you fail. If you do so, you must use the new roll, and you can't use this feature again until you finish a long rest.

  You can use this feature twice between long rests starting at 13th level and three times between long rests starting at 17th level.
features.fighter.indomitable.actions.indomitable.name: 'Indomitable'
features.fighter.indomitable.actions.indomitable.params.ability.name: 'Ability'
features.fighter.indomitable.actions.indomitable.params.dc.name: 'DC'
features.fighter.indomitable.actions.indomitable.results.success.name: 'Success'
features.fighter.indomitable.actions.indomitable.results.failure.name: 'Failure'
features.fighter.remarkable-athlete.name: 'Remarkable Athlete'
features.fighter.remarkable-athlete.description: |-
  Starting at 7th level, you can add half your proficiency bonus (round up) to any Strength, Dexterity, or Constitution check you make that doesn't already use your proficiency bonus.

  In addition, when you make a running long jump, the distance you can cover increases by a number of feet equal to your Strength modifier.
features.fighter.superior-critical.name: 'Superior Critical'
features.fighter.superior-critical.description: 'Starting at 15th level, your weapon attacks score a critical hit on a roll of 18–20.'
features.fighter.survivor.name: 'Survivor'
features.fighter.survivor.description: "At 18th level, you attain the pinnacle of resilience in battle. At the start of each of your turns, you regain hit points equal to 5 + your Constitution modifier if you have no more than half of your hit points left. You don't gain this benefit if you have 0 hit points."
features.fighter.survivor.actions.survivor.name: 'Survivor'
features.fighter.survivor.actions.survivor.results.healed.name: 'Healed'
features.monk.unarmored-defense.name: 'Unarmored Defense'
features.monk.unarmored-defense.description: 'Beginning at 1st level, while you are wearing no armor and not wielding a shield, your AC equals 10 + your Dexterity modifier + your Wisdom modifier.'
features.monk.martial-arts.name: 'Martial Arts'
features.monk.martial-arts.description: |-
  At 1st level, your practice of martial arts gives you mastery of combat styles that use unarmed strikes and monk weapons, which are shortswords and any simple melee weapons that don't have the two-handed or heavy property.

  You gain the following benefits while you are unarmed or wielding only monk weapons and you aren't wearing armor or wielding a shield:

  - You can use Dexterity instead of Strength for the attack and damage rolls of your unarmed strikes and monk weapons.
  - You can roll a d4 in place of the normal damage of your unarmed strike or monk weapon. This die changes as you gain monk levels, as shown in the Martial Arts column of the Monk table.
  - When you use the Attack action with an unarmed strike or a monk weapon on your turn, you can make one unarmed strike as a bonus action. For example, if you take the Attack action and attack with a quarterstaff, you can also make an unarmed strike as a bonus action, assuming you haven't already taken a bonus action this turn.

  Certain monasteries use specialized forms of the monk weapons. For example, you might use a club that is two lengths of wood connected by a short chain (called a nunchaku) or a sickle with a shorter, straighter blade (called a kama). Whatever name you use for a monk weapon, you can use the game statistics provided for the weapon.
features.monk.ki.name: 'Ki'
features.monk.ki.description: |-
  Starting at 2nd level, your training allows you to harness the mystic energy of ki. Your access to this energy is represented by a number of ki points. Your monk level determines the number of points you have, as shown in the Ki Points column of the Monk table.

  You can spend these points to fuel various ki features. You start knowing three such features: Flurry of Blows, Patient Defense, and Step of the Wind. You learn more ki features as you gain levels in this class.

  When you spend a ki point, it is unavailable until you finish a short or long rest, at the end of which you draw all of your expended ki back into yourself. You must spend at least 30 minutes of the rest meditating to regain your ki points.

  Some of your ki features require your target to make a saving throw to resist the feature's effects. The saving throw DC is calculated as follows:

  **Ki save DC** = 8 + your proficiency bonus + your Wisdom modifier

  **Flurry of Blows**

  Immediately after you take the Attack action on your turn, you can spend 1 ki point to make two unarmed strikes as a bonus action.

  **Patient Defense**

  You can spend 1 ki point to take the Dodge action as a bonus action on your turn.

  **Step of the Wind**

  You can spend 1 ki point to take the Disengage or Dash action as a bonus action on your turn, and your jump distance is doubled for the turn.
features.monk.ki.actions.flurry-of-blows.name: 'Flurry of Blows'
features.monk.ki.actions.flurry-of-blows.results.spent.name: 'Ki spent'
features.monk.ki.actions.patient-defense.name: 'Patient Defense'
features.monk.ki.actions.patient-defense.results.spent.name: 'Ki spent'
features.monk.ki.actions.step-of-the-wind.name: 'Step of the Wind'
features.monk.ki.actions.step-of-the-wind.results.spent.name: 'Ki spent'
features.monk.unarmored-movement.name: 'Unarmored Movement'
features.monk.unarmored-movement.description: |-
  Starting at 2nd level, your speed increases by 10 feet while you are not wearing armor or wielding a shield. This bonus increases when you reach certain monk levels, as shown in the Monk table.

  At 9th level, you gain the ability to move along vertical surfaces and across liquids on your turn without falling during the move.
features.monk.deflect-missiles.name: 'Deflect Missiles'
features.monk.deflect-missiles.description: |-
  Starting at 3rd level, you can use your reaction to deflect or catch the missile when you are hit by a ranged weapon attack. When you do so, the damage you take from the attack is reduced by 1d10 + your Dexterity modifier + your monk level.

  If you reduce the damage to 0, you can catch the missile if it is small enough for you to hold in one hand and you have at least one hand free. If you catch a missile in this way, you can spend 1 ki point to make a ranged attack with the weapon or piece of ammunition you just caught, as part of the same reaction. You make this attack with proficiency, regardless of your weapon proficiencies, and the missile counts as a monk weapon for the attack, which has a normal range of 20 feet and a long range of 60 feet.
features.monk.deflect-missiles.actions.deflect-missiles.name: 'Deflect Missiles'
features.monk.deflect-missiles.actions.deflect-missiles.params.damage.name: 'Damage taken'
features.monk.deflect-missiles.actions.deflect-missiles.results.deflected.name: 'Deflected'
features.monk.slow-fall.name: 'Slow Fall'
features.monk.slow-fall.description: 'Beginning at 4th level, you can use your reaction when you fall to reduce any falling damage you take by an amount equal to five times your monk level.'
features.monk.stunning-strike.name: 'Stunning Strike'
features.monk.stunning-strike.description: "Starting at 5th level, you can interfere with the flow of ki in an opponent's body. When you hit another creature with a melee weapon attack, you can spend 1 ki point to attempt a stunning strike. The target must succeed on a Constitution saving throw or be stunned until the end of your next turn."
features.monk.stunning-strike.actions.stunning-strike.name: 'Stunning Strike'
features.monk.stunning-strike.actions.stunning-strike.results.stunning.name: 'Stunning'
features.monk.ki-empowered-strikes.name: 'Ki-Empowered Strikes'
features.monk.ki-empowered-strikes.description: 'Starting at 6th level, your unarmed strikes count as magical for the purpose of overcoming resistance and immunity to nonmagical attacks and damage.'
features.monk.stillness-of-mind.name: 'Stillness of Mind'
features.monk.stillness-of-mind.description: 'Starting at 7th level, you can use your action to end one effect on yourself that is causing you to be charmed or frightened.'
features.monk.tongue-of-the-sun-and-moon.name: 'Tongue of the Sun and Moon'
features.monk.tongue-of-the-sun-and-moon.description: 'Starting at 13th level, you learn to touch the ki of other minds so that you understand all spoken languages. Moreover, any creature that can understand a language can understand what you say.'
features.monk.timeless-body.name: 'Timeless Body'
features.monk.timeless-body.description: "At 15th level, your ki sustains you so that you suffer none of the frailty of old age, and you can't be aged magically. You can still die of old age, however. In addition, you no longer need food or water."
features.monk.empty-body.name: 'Empty Body'
features.monk.empty-body.description: |-
  Beginning at 18th level, you can use your action to spend 4 ki points to become invisible for 1 minute. During that time, you also have resistance to all damage but force damage.

  Additionally, you can spend 8 ki points to cast the *astral projection* spell, without needing material components. When you do so, you can't take any other creatures with you.
features.monk.empty-body.actions.empty-body.name: 'Empty Body'
features.monk.empty-body.actions.empty-body.results.vanished.name: 'Invisible'
features.monk.empty-body.actions.end-empty-body.name: 'End Empty Body'
features.monk.empty-body.actions.end-empty-body.results.ended.name: 'Ended'
features.monk.empty-body.actions.astral-projection.name: 'Astral Projection'
features.monk.empty-body.actions.astral-projection.results.projected.name: 'Projected'
features.monk.perfect-self.name: 'Perfect Self'
features.monk.perfect-self.description: 'At 20th level, when you roll for initiative and have no ki points remaining, you regain 4 ki points.'
features.monk.open-hand-technique.name: 'Open Hand Technique'
features.monk.open-hand-technique.description: |-
  Starting when you choose this tradition at 3rd level, you can manipulate your enemy's ki when you harness your own. Whenever you hit a creature with one of the attacks granted by your Flurry of Blows, you can impose one of the following effects on that target:

  - It must succeed on a Dexterity saving throw or be knocked prone.
  - It must make a Strength saving throw. If it fails, you can push it up to 15 feet away from you.
  - It can't take reactions until the end of your next turn.
features.monk.open-hand-technique.actions.open-hand-technique.name: 'Open Hand Technique'
features.monk.open-hand-technique.actions.open-hand-technique.params.technique.name: 'Technique'
features.monk.open-hand-technique.actions.open-hand-technique.results.prone.name: 'Knocked prone'
features.monk.open-hand-technique.actions.open-hand-technique.results.push.name: 'Pushed 15 feet'
features.monk.open-hand-technique.actions.open-hand-technique.results.no-reactions.name: 'No reactions'
features.monk.wholeness-of-body.name: 'Wholeness of Body'
features.monk.wholeness-of-body.description: 'At 6th level, you gain the ability to heal yourself. As an action, you can regain hit points equal to three times your monk level. You must finish a long rest before you can use this feature again.'
features.monk.wholeness-of-body.actions.wholeness-of-body.name: 'Wholeness of Body'
features.monk.wholeness-of-body.actions.wholeness-of-body.results.healed.name: 'Healed'
features.monk.tranquility.name: 'Tranquility'
features.monk.tranquility.description: 'Beginning at 11th level, you can enter a special meditation that surrounds you with an aura of peace. At the end of a long rest, you gain the effect of a *sanctuary* spell that lasts until the start of your next long rest (the spell can end early as normal). The saving throw DC for the spell equals 8 + your Wisdom modifier + your proficiency bonus.'
features.monk.quivering-palm.name: 'Quivering Palm'
features.monk.quivering-palm.description: |-
  At 17th level, you gain the ability to set up lethal vibrations in someone's body. When you hit a creature with an unarmed strike, you can spend 3 ki points to start these imperceptible vibrations, which last for a number of days equal to your monk level. The vibrations are harmless unless you use your action to end them. To do so, you and the target must be on the same plane of existence. When you use this action, the creature must make a Constitution saving throw. If it fails, it is reduced to 0 hit points. If it succeeds, it takes 10d10 necrotic damage.

  You can have only one creature under the effect of this feature at a time. You can choose to end the vibrations harmlessly without using an action.
features.monk.quivering-palm.actions.quivering-palm.name: 'Quivering Palm'
features.monk.quivering-palm.actions.quivering-palm.results.set.name: 'Vibrations set'
features.monk.quivering-palm.actions.end-quivering-palm.name: 'End Quivering Palm'
features.monk.quivering-palm.actions.end-quivering-palm.results.triggered.name: 'Triggered'
features.monk.purity-of-body.name: 'Purity of Body'
features.monk.purity-of-body.description: 'At 10th level, your mastery of the ki flowing through you makes you immune to disease and poison.'
features.monk.diamond-soul.name: 'Diamond Soul'
features.monk.diamond-soul.description: |-
  Beginning at 14th level, your mastery of ki grants you proficiency in all saving throws.

  Additionally, whenever you make a saving throw and fail, you can spend 1 ki point to reroll it and take the second result.
features.monk.diamond-soul.actions.diamond-soul.name: 'Diamond Soul'
features.monk.diamond-soul.actions.diamond-soul.params.ability.name: 'Ability'
features.monk.diamond-soul.actions.diamond-soul.params.dc.name: 'DC'
features.monk.diamond-soul.actions.diamond-soul.results.success.name: 'Success'
features.monk.diamond-soul.actions.diamond-soul.results.failure.name: 'Failure'
features.paladin.divine-sense.name: 'Divine Sense'
features.paladin.divine-sense.description: |-
  The presence of strong evil registers on your senses like a noxious odor, and powerful good rings like heavenly music in your ears. As an action, you can open your awareness to detect such forces. Until the end of your next turn, you know the location of any celestial, fiend, or undead within 60 feet of you that is not behind total cover. You know the type (celestial, fiend, or undead) of any being whose presence you sense, but not its identity (the vampire Count Strahd von Zarovich, for instance). Within the same radius, you also detect the presence of any place or object that has been consecrated or desecrated, as with the *hallow* spell.

  You can use this feature a number of times equal to 1 + your Charisma modifier. When you finish a long rest, you regain all expended uses.
features.paladin.lay-on-hands.name: 'Lay on Hands'
features.paladin.lay-on-hands.description: |-
  Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you take a long rest. With that pool, you can restore a total number of hit points equal to your paladin level × 5.

  As an action, you can touch a creature and draw power from the pool to restore a number of hit points to that creature, up to the maximum amount remaining in your pool.

  Alternatively, you can expend 5 hit points from your pool of healing to cure the target of one disease or neutralize one poison affecting it. You can cure multiple diseases and neutralize multiple poisons with a single use of Lay on Hands, expending hit points separately for each one.

  This feature has no effect on undead and constructs.
features.paladin.spellcasting.name: 'Spellcasting'
features.paladin.spellcasting.description: |-
  By 2nd level, you have learned to draw on divine magic through meditation and prayer to cast spells as a cleric does.

  **Preparing and Casting Spells**

  The Paladin table shows how many spell slots you have to cast your spells. To cast one of your paladin spells of 1st level or higher, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

  You prepare the list of paladin spells that are available for you to cast, choosing from the paladin spell list. When you do so, choose a number of paladin spells equal to your Charisma modifier + half your paladin level, rounded down (minimum of one spell). The spells must be of a level for which you have spell slots.

  For example, if you are a 5th-level paladin, you have four 1st-level and two 2nd-level spell slots. With a Charisma of 14, your list of prepared spells can include four spells of 1st or 2nd level, in any combination. If you prepare the 1st-level spell *cure wounds,* you can cast it using a 1st-level or a 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.

  You can change your list of prepared spells when you finish a long rest. Preparing a new list of paladin spells requires time spent in prayer and meditation: at least 1 minute per spell level for each spell on your list.

  **Spellcasting Ability**

  Charisma is your spellcasting ability for your paladin spells, since their power derives from the strength of your convictions. You use your Charisma whenever a spell refers to your spellcasting ability. In addition, you use your Charisma modifier when setting the saving throw DC for a paladin spell you cast and when making an attack roll with one.

  **Spell save DC** = 8 + your proficiency bonus + your Charisma modifier

  **Spell attack modifier** = your proficiency bonus + your Charisma modifier

  **Spellcasting Focus**

  You can use a holy symbol as a spellcasting focus for your paladin spells.
features.paladin.divine-smite.name: 'Divine Smite'
features.paladin.divine-smite.description: "Starting at 2nd level, when you hit a creature with a melee weapon attack, you can expend one spell slot to deal radiant damage to the target, in addition to the weapon's damage. The extra damage is 2d8 for a 1st-level spell slot, plus 1d8 for each spell level higher than 1st, to a maximum of 5d8. The damage increases by 1d8 if the target is an undead or a fiend."
features.paladin.divine-health.name: 'Divine Health'
features.paladin.divine-health.description: 'By 3rd level, the divine magic flowing through you makes you immune to disease.'
features.paladin.aura-of-protection.name: 'Aura of Protection'
features.paladin.aura-of-protection.description: |-
  Starting at 6th level, whenever you or a friendly creature within 10 feet of you must make a saving throw, the creature gains a bonus to the saving throw equal to your Charisma modifier (with a minimum bonus of +1). You must be conscious to grant this bonus.

  At 18th level, the range of this aura increases to 30 feet.
features.paladin.aura-of-courage.name: 'Aura of Courage'
features.paladin.aura-of-courage.description: |-
  Starting at 10th level, you and friendly creatures within 10 feet of you can't be frightened while you are conscious.

  At 18th level, the range of this aura increases to 30 feet.
features.paladin.improved-divine-smite.name: 'Improved Divine Smite'
features.paladin.improved-divine-smite.description: 'By 11th level, you are so suffused with righteous might that all your melee weapon strikes carry divine power with them. Whenever you hit a creature with a melee weapon, the creature takes an extra 1d8 radiant damage. If you also use your Divine Smite with an attack, you add this damage to the extra damage of your Divine Smite.'
features.paladin.cleansing-touch.name: 'Cleansing Touch'
features.paladin.cleansing-touch.description: |-
  Beginning at 14th level, you can use your action to end one spell on yourself or on one willing creature that you touch.

  You can use this feature a number of times equal to your Charisma modifier (a minimum of once). You regain expended uses when you finish a long rest.
features.paladin.aura-improvements.name: 'Aura Improvements'
features.paladin.aura-improvements.description: |-
  At 18th level, the range of this aura increases to 30 feet.
features.paladin.sacred-weapon.name: 'Channel Divinity: Sacred Weapon'
features.paladin.sacred-weapon.description: |-
  As an action, you can imbue one weapon that you are holding with positive energy, using your Channel Divinity. For 1 minute, you add your Charisma modifier to attack rolls made with that weapon (with a minimum bonus of +1). The weapon also emits bright light in a 20-foot radius and dim light 20 feet beyond that. If the weapon is not already magical, it becomes magical for the duration.

  You can end this effect on your turn as part of any other action. If you are no longer holding or carrying this weapon, or if you fall unconscious, this effect ends.
features.paladin.turn-the-unholy.name: 'Channel Divinity: Turn the Unholy'
features.paladin.turn-the-unholy.description: |-
  As an action, you present your holy symbol and speak a prayer censuring fiends and undead, using your Channel Divinity. Each fiend or undead that can see or hear you within 30 feet of you must make a Wisdom saving throw. If the creature fails its saving throw, it is turned for 1 minute or until it takes damage.

  A turned creature must spend its turns trying to move as far away from you as it can, and it can't willingly move to a space within 30 feet of you. It also can't take reactions. For its action, it can use only the Dash action or try to escape from an effect that prevents it from moving. If there's nowhere to move, the creature can use the Dodge action.
features.paladin.aura-of-devotion.name: 'Aura of Devotion'
features.paladin.aura-of-devotion.description: |-
  Starting at 7th level, you and friendly creatures within 10 feet of you can't be charmed while you are conscious.

  At 18th level, the range of this aura increases to 30 feet.
features.paladin.purity-of-spirit.name: 'Purity of Spirit'
features.paladin.purity-of-spirit.description: 'Beginning at 15th level, you are always under the effects of a *protection from evil and good* spell.'
features.paladin.holy-nimbus.name: 'Holy Nimbus'
features.paladin.holy-nimbus.description: |-
  At 20th level, as an action, you can emanate an aura of sunlight. For 1 minute, bright light shines from you in a 30-foot radius, and dim light shines 30 feet beyond that.

  Whenever an enemy creature starts its turn in the bright light, the creature takes 10 radiant damage.

  In addition, for the duration, you have advantage on saving throws against spells cast by fiends or undead.

  Once you use this feature, you can't use it again until you finish a long rest.
features.paladin.divine-sense.actions.divine-sense.name: 'Divine Sense'
features.paladin.lay-on-hands.actions.lay-on-hands.name: 'Lay on Hands'
features.paladin.divine-smite.actions.divine-smite.name: 'Divine Smite'
features.paladin.cleansing-touch.actions.cleansing-touch.name: 'Cleansing Touch'
features.paladin.sacred-weapon.actions.sacred-weapon.name: 'Sacred Weapon'
features.paladin.turn-the-unholy.actions.turn-the-unholy.name: 'Turn the Unholy'
features.paladin.holy-nimbus.actions.holy-nimbus.name: 'Holy Nimbus'
features.ranger.favored-enemy.name: 'Favored Enemy'
features.ranger.favored-enemy.description: |-
  Beginning at 1st level, you have significant experience studying, tracking, hunting, and even talking to a certain type of enemy.

  Choose a type of favored enemy: aberrations, beasts, celestials, constructs, dragons, elementals, fey, fiends, giants, monstrosities, oozes, plants, or undead. Alternatively, you can select two races of humanoid (such as gnolls and orcs) as favored enemies.

  You have advantage on Wisdom (Survival) checks to track your favored enemies, as well as on Intelligence checks to recall information about them.

  When you gain this feature, you also learn one language of your choice that is spoken by your favored enemies, if they speak one at all.

  You choose one additional favored enemy, as well as an associated language, at 6th and 14th level. As you gain levels, your choices should reflect the types of monsters you have encountered on your adventures.
features.ranger.natural-explorer.name: 'Natural Explorer'
features.ranger.natural-explorer.description: |-
  You are particularly familiar with one type of natural environment and are adept at traveling and surviving in such regions. Choose one type of favored terrain: arctic, coast, desert, forest, grassland, mountain, or swamp. When you make an Intelligence or Wisdom check related to your favored terrain, your proficiency bonus is doubled if you are using a skill that you're proficient in.

  While traveling for an hour or more in your favored terrain, you gain the following benefits:

  - Difficult terrain doesn't slow your group's travel.
  - Your group can't become lost except by magical means.
  - Even when you are engaged in another activity while traveling (such as foraging, navigating, or tracking), you remain alert to danger.
  - If you are traveling alone, you can move stealthily at a normal pace.
  - When you forage, you find twice as much food as you normally would.
  - While tracking other creatures, you also learn their exact number, their sizes, and how long ago they passed through the area.

  You choose additional favored terrain types at 6th and 10th level.
features.ranger.primeval-awareness.name: 'Primeval Awareness'
features.ranger.primeval-awareness.description: "Beginning at 3rd level, you can use your action and expend one ranger spell slot to focus your awareness on the region around you. For 1 minute per level of the spell slot you expend, you can sense whether the following types of creatures are present within 1 mile of you (or within up to 6 miles if you are in your favored terrain): aberrations, celestials, dragons, elementals, fey, fiends, and undead. This feature doesn't reveal the creatures' location or number."
features.ranger.hide-in-plain-sight.name: 'Hide in Plain Sight'
features.ranger.hide-in-plain-sight.description: |-
  Starting at 10th level, you can spend 1 minute creating camouflage for yourself. You must have access to fresh mud, dirt, plants, soot, and other naturally occurring materials with which to create your camouflage.

  Once you are camouflaged in this way, you can try to hide by pressing yourself up against a solid surface, such as a tree or wall, that is at least as tall and wide as you are. You gain a +10 bonus to Dexterity (Stealth) checks as long as you remain there without moving or taking actions. Once you move or take an action or a reaction, you must camouflage yourself again to gain this benefit.
features.ranger.vanish.name: 'Vanish'
features.ranger.vanish.description: "Starting at 14th level, you can use the Hide action as a bonus action on your turn. Also, you can't be tracked by nonmagical means, unless you choose to leave a trail."
features.ranger.volley.name: 'Volley'
features.ranger.volley.description: "You can use your action to make a ranged attack against any number of creatures within 10 feet of a point you can see within your weapon's range. You must have ammunition for each target, as normal, and you make a separate attack roll for each target."
features.ranger.volley.actions.volley.name: 'Volley'
features.ranger.volley.actions.volley.results.hit.name: 'Hit'
features.ranger.volley.actions.volley.results.miss.name: 'Miss'
features.ranger.volley.actions.volley.steps.weapon.prompt: 'Which ranged weapon?'
features.ranger.whirlwind-attack.name: 'Whirlwind Attack'
features.ranger.whirlwind-attack.description: 'You can use your action to make a melee attack against any number of creatures within 5 feet of you, with a separate attack roll for each target.'
features.ranger.whirlwind-attack.actions.whirlwind-attack.name: 'Whirlwind Attack'
features.ranger.whirlwind-attack.actions.whirlwind-attack.results.hit.name: 'Hit'
features.ranger.whirlwind-attack.actions.whirlwind-attack.results.miss.name: 'Miss'
features.ranger.whirlwind-attack.actions.whirlwind-attack.steps.weapon.prompt: 'Which melee weapon?'
features.ranger.feral-senses.name: 'Feral Senses'
features.ranger.feral-senses.description: |-
  At 18th level, you gain preternatural senses that help you fight creatures you can't see. When you attack a creature you can't see, your inability to see it doesn't impose disadvantage on your attack rolls against it.

  You are also aware of the location of any invisible creature within 30 feet of you, provided that the creature isn't hidden from you and you aren't blinded or deafened.
features.ranger.foe-slayer.name: 'Foe Slayer'
features.ranger.foe-slayer.description: 'At 20th level, you become an unparalleled hunter of your enemies. Once on each of your turns, you can add your Wisdom modifier to the attack roll or the damage roll of an attack you make against one of your favored enemies. You can choose to use this feature before or after the roll, but before any effects of the roll are applied.'
features.ranger.spellcasting.name: 'Spellcasting'
features.ranger.spellcasting.description: |-
  By the time you reach 2nd level, you have learned to use the magical essence of nature to cast spells, much as a druid does.

  **Spell Slots**

  The Ranger table shows how many spell slots you have to cast your spells of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

  For example, if you know the 1st-level spell *animal friendship* and have a 1st-level and a 2nd-level spell slot available, you can cast *animal friendship* using either slot.

  **Spells Known of 1st Level and Higher**

  You know two 1st-level spells of your choice from the ranger spell list.

  The Spells Known column of the Ranger table shows when you learn more ranger spells of your choice. Each of these spells must be of a level for which you have spell slots. For instance, when you reach 5th level in this class, you can learn one new spell of 1st or 2nd level.

  Additionally, when you gain a level in this class, you can choose one of the ranger spells you know and replace it with another spell from the ranger spell list, which also must be of a level for which you have spell slots.

  **Spellcasting Ability**

  Wisdom is your spellcasting ability for your ranger spells, since your magic draws on your attunement to nature. You use your Wisdom whenever a spell refers to your spellcasting ability. In addition, you use your Wisdom modifier when setting the saving throw DC for a ranger spell you cast and when making an attack roll with one.

  **Spell save DC** = 8 + your proficiency bonus + your Wisdom modifier

  **Spell attack modifier** = your proficiency bonus + your Wisdom modifier
features.ranger.lands-stride.name: "Land's Stride"
features.ranger.lands-stride.description: |-
  Starting at 8th level, moving through nonmagical difficult terrain costs you no extra movement. You can also pass through nonmagical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.

  In addition, you have advantage on saving throws against plants that are magically created or manipulated to impede movement, such those created by the *entangle* spell.
features.rogue.expertise.choices.skills.prompt: "Choose two skills, or a skill and thieves' tools, for expertise (level {slot})"
features.rogue.expertise.name: 'Expertise'
features.rogue.expertise.description: |-
  At 1st level, choose two of your skill proficiencies, or one of your skill proficiencies and your proficiency with thieves' tools. Your proficiency bonus is doubled for any ability check you make that uses either of the chosen proficiencies.

  At 6th level, you can choose two more of your proficiencies (in skills or with thieves' tools) to gain this benefit.
features.rogue.sneak-attack.name: 'Sneak Attack'
features.rogue.sneak-attack.description: |-
  Beginning at 1st level, you know how to strike subtly and exploit a foe's distraction. Once per turn, you can deal an extra 1d6 damage to one creature you hit with an attack if you have advantage on the attack roll. The attack must use a finesse or a ranged weapon.

  You don't need advantage on the attack roll if another enemy of the target is within 5 feet of it, that enemy isn't incapacitated, and you don't have disadvantage on the attack roll.

  The amount of the extra damage increases as you gain levels in this class, as shown in the Sneak Attack column of the Rogue table.
features.rogue.thieves-cant.name: "Thieves' Cant"
features.rogue.thieves-cant.description: |-
  During your rogue training you learned thieves' cant, a secret mix of dialect, jargon, and code that allows you to hide messages in seemingly normal conversation. Only another creature that knows thieves' cant understands such messages. It takes four times longer to convey such a message than it does to speak the same idea plainly.

  In addition, you understand a set of secret signs and symbols used to convey short, simple messages, such as whether an area is dangerous or the territory of a thieves' guild, whether loot is nearby, or whether the people in an area are easy marks or will provide a safe house for thieves on the run.
features.rogue.cunning-action.name: 'Cunning Action'
features.rogue.cunning-action.description: 'Starting at 2nd level, your quick thinking and agility allow you to move and act quickly. You can take a bonus action on each of your turns in combat. This action can be used only to take the Dash, Disengage, or Hide action.'
features.rogue.uncanny-dodge.name: 'Uncanny Dodge'
features.rogue.uncanny-dodge.description: "Starting at 5th level, when an attacker that you can see hits you with an attack, you can use your reaction to halve the attack's damage against you."
features.rogue.reliable-talent.name: 'Reliable Talent'
features.rogue.reliable-talent.description: 'By 11th level, you have refined your chosen skills until they approach perfection. Whenever you make an ability check that lets you add your proficiency bonus, you can treat a d20 roll of 9 or lower as a 10.'
features.rogue.blindsense.name: 'Blindsense'
features.rogue.blindsense.description: 'Starting at 14th level, if you are able to hear, you are aware of the location of any hidden or invisible creature within 10 feet of you.'
features.rogue.slippery-mind.name: 'Slippery Mind'
features.rogue.slippery-mind.description: 'By 15th level, you have acquired greater mental strength. You gain proficiency in Wisdom saving throws.'
features.rogue.elusive.name: 'Elusive'
features.rogue.elusive.description: "Beginning at 18th level, you are so evasive that attackers rarely gain the upper hand against you. No attack roll has advantage against you while you aren't incapacitated."
features.rogue.stroke-of-luck.name: 'Stroke of Luck'
features.rogue.stroke-of-luck.options.hit.name: 'Stroke of Luck: turn the miss into a hit'
features.rogue.stroke-of-luck.options.twenty.name: 'Stroke of Luck: treat the d20 as a 20'
features.rogue.stroke-of-luck.description: |-
  At 20th level, you have an uncanny knack for succeeding when you need to. If your attack misses a target within range, you can turn the miss into a hit. Alternatively, if you fail an ability check, you can treat the d20 roll as a 20.

  Once you use this feature, you can't use it again until you finish a short or long rest.
features.rogue.fast-hands.name: 'Fast Hands'
features.rogue.fast-hands.description: "Starting at 3rd level, you can use the bonus action granted by your Cunning Action to make a Dexterity (Sleight of Hand) check, use your thieves' tools to disarm a trap or open a lock, or take the Use an Object action."
features.rogue.second-story-work.name: 'Second-Story Work'
features.rogue.second-story-work.description: |-
  When you choose this archetype at 3rd level, you gain the ability to climb faster than normal; climbing no longer costs you extra movement.

  In addition, when you make a running jump, the distance you cover increases by a number of feet equal to your Dexterity modifier.
features.rogue.use-magic-device.name: 'Use Magic Device'
features.rogue.use-magic-device.description: 'By 13th level, you have learned enough about the workings of magic that you can improvise the use of items even when they are not intended for you. You ignore all class, race, and level requirements on the use of magic items.'
features.rogue.thiefs-reflexes.name: "Thief's Reflexes"
features.rogue.thiefs-reflexes.description: "When you reach 17th level, you have become adept at laying ambushes and quickly escaping danger. You can take two turns during the first round of any combat. You take your first turn at your normal initiative and your second turn at your initiative minus 10. You can't use this feature when you are surprised."
features.rogue.supreme-sneak.name: 'Supreme Sneak'
features.rogue.supreme-sneak.description: 'Starting at 9th level, you have advantage on a Dexterity (Stealth) check if you move no more than half your speed on the same turn.'
features.sorcerer.spellcasting.name: 'Spellcasting'
features.sorcerer.spellcasting.description: |-
  An event in your past, or in the life of a parent or ancestor, left an indelible mark on you, infusing you with arcane magic. This font of magic, whatever its origin, fuels your spells.

  **Cantrips**

  At 1st level, you know four cantrips of your choice from the sorcerer spell list. You learn additional sorcerer cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Sorcerer table.

  **Spell Slots**

  The Sorcerer table shows how many spell slots you have to cast your spells of 1st level and higher. To cast one of these sorcerer spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

  For example, if you know the 1st-level spell *burning hands* and have a 1st-level and a 2nd-level spell slot available, you can cast *burning hands* using either slot.

  **Spells Known of 1st Level and Higher**

  You know two 1st-level spells of your choice from the sorcerer spell list.

  The Spells Known column of the Sorcerer table shows when you learn more sorcerer spells of your choice. Each of these spells must be of a level for which you have spell slots. For instance, when you reach 3rd level in this class, you can learn one new spell of 1st or 2nd level.

  Additionally, when you gain a level in this class, you can choose one of the sorcerer spells you know and replace it with another spell from the sorcerer spell list, which also must be of a level for which you have spell slots.

  **Spellcasting Ability**

  Charisma is your spellcasting ability for your sorcerer spells, since the power of your magic relies on your ability to project your will into the world. You use your Charisma whenever a spell refers to your spellcasting ability. In addition, you use your Charisma modifier when setting the saving throw DC for a sorcerer spell you cast and when making an attack roll with one.

  **Spell save DC** = 8 + your proficiency bonus + your Charisma modifier

  **Spell attack modifier** = your proficiency bonus + your Charisma modifier

  **Spellcasting Focus**

  You can use an arcane focus as a spellcasting focus for your sorcerer spells.
features.sorcerer.font-of-magic.name: 'Font of Magic'
features.sorcerer.font-of-magic.description: |-
  At 2nd level, you tap into a deep wellspring of magic within yourself. This wellspring is represented by sorcery points, which allow you to create a variety of magical effects.

  **Sorcery Points**

  You have 2 sorcery points, and you gain more as you reach higher levels, as shown in the Sorcery Points column of the Sorcerer table. You can never have more sorcery points than shown on the table for your level. You regain all spent sorcery points when you finish a long rest.

  **Flexible Casting**

  You can use your sorcery points to gain additional spell slots, or sacrifice spell slots to gain additional sorcery points. You learn other ways to use your sorcery points as you reach higher levels.

  ***Creating Spell Slots.*** You can transform unexpended sorcery points into one spell slot as a bonus action on your turn. The Creating Spell Slots table shows the cost of creating a spell slot of a given level. You can create spell slots no higher in level than 5th.

  Any spell slot you create with this feature vanishes when you finish a long rest.

  **Creating Spell Slots**

  | Spell Slot Level | Sorcery Point Cost |
  | --- | --- |
  | 1st | 2 |
  | 2nd | 3 |
  | 3rd | 5 |
  | 4th | 6 |
  | 5th | 7 |

  ***Converting a Spell Slot to Sorcery Points.*** As a bonus action on your turn, you can expend one spell slot and gain a number of sorcery points equal to the slot's level.
features.sorcerer.metamagic.name: 'Metamagic'
features.sorcerer.metamagic.description: |-
  At 3rd level, you gain the ability to twist your spells to suit your needs. You gain two of the following Metamagic options of your choice. You gain another one at 10th and 17th level.

  You can use only one Metamagic option on a spell when you cast it, unless otherwise noted.

  **Careful Spell**

  When you cast a spell that forces other creatures to make a saving throw, you can protect some of those creatures from the spell's full force. To do so, you spend 1 sorcery point and choose a number of those creatures up to your Charisma modifier (minimum of one creature). A chosen creature automatically succeeds on its saving throw against the spell.

  **Distant Spell**

  When you cast a spell that has a range of 5 feet or greater, you can spend 1 sorcery point to double the range of the spell.

  When you cast a spell that has a range of touch, you can spend 1 sorcery point to make the range of the spell 30 feet.

  **Empowered Spell**

  When you roll damage for a spell, you can spend 1 sorcery point to reroll a number of the damage dice up to your Charisma modifier (minimum of one). You must use the new rolls.

  You can use Empowered Spell even if you have already used a different Metamagic option during the casting of the spell.

  **Extended Spell**

  When you cast a spell that has a duration of 1 minute or longer, you can spend 1 sorcery point to double its duration, to a maximum duration of 24 hours.

  **Heightened Spell**

  When you cast a spell that forces a creature to make a saving throw to resist its effects, you can spend 3 sorcery points to give one target of the spell disadvantage on its first saving throw made against the spell.

  **Quickened Spell**

  When you cast a spell that has a casting time of 1 action, you can spend 2 sorcery points to change the casting time to 1 bonus action for this casting.

  **Subtle Spell**

  When you cast a spell, you can spend 1 sorcery point to cast it without any somatic or verbal components.

  **Twinned Spell**

  When you cast a spell that targets only one creature and doesn't have a range of self, you can spend a number of sorcery points equal to the spell's level to target a second creature in range with the same spell (1 sorcery point if the spell is a cantrip).

  To be eligible, a spell must be incapable of targeting more than one creature at the spell's current level. For example, *magic missile* and *scorching ray* aren't eligible, but *ray of frost* is.
