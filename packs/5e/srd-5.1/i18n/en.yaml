# Eldritch invocations
invocations.agonizing-blast.name: 'Agonizing Blast'
invocations.agonizing-blast.description: 'When you cast *eldritch blast*, add your Charisma modifier to the damage it deals on a hit.'
invocations.armor-of-shadows.name: 'Armor of Shadows'
invocations.armor-of-shadows.description: 'You can cast *mage armor* on yourself at will, without expending a spell slot or material components.'
invocations.ascendant-step.name: 'Ascendant Step'
invocations.ascendant-step.description: 'You can cast *levitate* on yourself at will, without expending a spell slot or material components.'
invocations.ascendant-step.prerequisites.level: 'Warlock level 9'
invocations.beast-speech.name: 'Beast Speech'
invocations.beast-speech.description: 'You can cast *speak with animals* at will, without expending a spell slot.'
invocations.beguiling-influence.name: 'Beguiling Influence'
invocations.beguiling-influence.description: 'You gain proficiency in the Deception and Persuasion skills.'
invocations.bewitching-whispers.name: 'Bewitching Whispers'
invocations.bewitching-whispers.state.used.name: 'Bewitching Whispers used'
invocations.bewitching-whispers.description: "You can cast *compulsion* once using a warlock spell slot. You can't do so again until you finish a long rest."
invocations.bewitching-whispers.prerequisites.level: 'Warlock level 7'
invocations.book-of-ancient-secrets.name: 'Book of Ancient Secrets'
invocations.book-of-ancient-secrets.description: |-
  You can now inscribe magical rituals in your Book of Shadows. Choose two 1st-level spells that have the ritual tag from any class's spell list (the two needn't be from the same list). The spells appear in the book and don't count against the number of spells you know. With your Book of Shadows in hand, you can cast the chosen spells as rituals. You can't cast the spells except as rituals, unless you've learned them by some other means. You can also cast a warlock spell you know as a ritual if it has the ritual tag.

  On your adventures, you can add other ritual spells to your Book of Shadows. When you find such a spell, you can add it to the book if the spell's level is equal to or less than half your warlock level (rounded up) and if you can spare the time to transcribe the spell. For each level of the spell, the transcription process takes 2 hours and costs 50 gp for the rare inks needed to inscribe it.
invocations.book-of-ancient-secrets.prerequisites.pact: 'Pact of the Tome'
invocations.agonizing-blast.prerequisites.spell: 'Eldritch blast cantrip'
invocations.eldritch-spear.prerequisites.spell: 'Eldritch blast cantrip'
invocations.repelling-blast.prerequisites.spell: 'Eldritch blast cantrip'
invocations.book-of-ancient-secrets.choices.rituals.prompt: 'Choose two 1st-level rituals'
invocations.chains-of-carceri.name: 'Chains of Carceri'
invocations.chains-of-carceri.description: 'You can cast *hold monster* at will—targeting a celestial, fiend, or elemental—without expending a spell slot or material components. You must finish a long rest before you can use this invocation on the same creature again.'
invocations.chains-of-carceri.prerequisites.level: 'Warlock level 15'
invocations.chains-of-carceri.prerequisites.pact: 'Pact of the Chain'
invocations.devils-sight.name: "Devil's Sight"
invocations.devils-sight.description: 'You can see normally in darkness, both magical and nonmagical, to a distance of 120 feet.'
invocations.dreadful-word.name: 'Dreadful Word'
invocations.dreadful-word.state.used.name: 'Dreadful Word used'
invocations.dreadful-word.description: "You can cast *confusion* once using a warlock spell slot. You can't do so again until you finish a long rest."
invocations.dreadful-word.prerequisites.level: 'Warlock level 7'
invocations.eldritch-sight.name: 'Eldritch Sight'
invocations.eldritch-sight.description: 'You can cast *detect magic* at will, without expending a spell slot.'
invocations.eldritch-spear.name: 'Eldritch Spear'
invocations.eldritch-spear.description: 'When you cast *eldritch blast*, its range is 300 feet.'
templates.eldritch-spear.name: '{base}'
invocations.eyes-of-the-rune-keeper.name: 'Eyes of the Rune Keeper'
invocations.eyes-of-the-rune-keeper.description: 'You can read all writing.'
invocations.fiendish-vigor.name: 'Fiendish Vigor'
invocations.fiendish-vigor.description: 'You can cast *false life* on yourself at will as a 1st-level spell, without expending a spell slot or material components.'
invocations.gaze-of-two-minds.name: 'Gaze of Two Minds'
invocations.gaze-of-two-minds.description: "You can use your action to touch a willing humanoid and perceive through its senses until the end of your next turn. As long as the creature is on the same plane of existence as you, you can use your action on subsequent turns to maintain this connection, extending the duration until the end of your next turn. While perceiving through the other creature's senses, you benefit from any special senses possessed by that creature, and you are blinded and deafened to your own surroundings."
invocations.lifedrinker.name: 'Lifedrinker'
invocations.lifedrinker.description: 'When you hit a creature with your pact weapon, the creature takes extra necrotic damage equal to your Charisma modifier (minimum 1).'
invocations.lifedrinker.prerequisites.level: 'Warlock level 12'
invocations.lifedrinker.prerequisites.pact: 'Pact of the Blade'
invocations.mask-of-many-faces.name: 'Mask of Many Faces'
invocations.mask-of-many-faces.description: 'You can cast *disguise self* at will, without expending a spell slot.'
invocations.master-of-myriad-forms.name: 'Master of Myriad Forms'
invocations.master-of-myriad-forms.description: 'You can cast *alter self* at will, without expending a spell slot.'
invocations.master-of-myriad-forms.prerequisites.level: 'Warlock level 15'
invocations.minions-of-chaos.name: 'Minions of Chaos'
invocations.minions-of-chaos.state.used.name: 'Minions of Chaos used'
invocations.minions-of-chaos.description: "You can cast *conjure elemental* once using a warlock spell slot. You can't do so again until you finish a long rest."
invocations.minions-of-chaos.prerequisites.level: 'Warlock level 9'
invocations.mire-the-mind.name: 'Mire the Mind'
invocations.mire-the-mind.state.used.name: 'Mire the Mind used'
invocations.mire-the-mind.description: "You can cast *slow* once using a warlock spell slot. You can't do so again until you finish a long rest."
invocations.mire-the-mind.prerequisites.level: 'Warlock level 5'
invocations.misty-visions.name: 'Misty Visions'
invocations.misty-visions.description: 'You can cast *silent image* at will, without expending a spell slot or material components.'
invocations.one-with-shadows.name: 'One with Shadows'
invocations.one-with-shadows.description: 'When you are in an area of dim light or darkness, you can use your action to become invisible until you move or take an action or a reaction.'
invocations.one-with-shadows.prerequisites.level: 'Warlock level 5'
invocations.otherworldly-leap.name: 'Otherworldly Leap'
invocations.otherworldly-leap.description: 'You can cast *jump* on yourself at will, without expending a spell slot or material components.'
invocations.otherworldly-leap.prerequisites.level: 'Warlock level 9'
invocations.repelling-blast.name: 'Repelling Blast'
invocations.repelling-blast.description: 'When you hit a creature with *eldritch blast*, you can push the creature up to 10 feet away from you in a straight line.'
invocations.sculptor-of-flesh.name: 'Sculptor of Flesh'
invocations.sculptor-of-flesh.state.used.name: 'Sculptor of Flesh used'
invocations.sculptor-of-flesh.description: "You can cast *polymorph* once using a warlock spell slot. You can't do so again until you finish a long rest."
invocations.sculptor-of-flesh.prerequisites.level: 'Warlock level 7'
invocations.sign-of-ill-omen.name: 'Sign of Ill Omen'
invocations.sign-of-ill-omen.state.used.name: 'Sign of Ill Omen used'
invocations.sign-of-ill-omen.description: "You can cast *bestow curse* once using a warlock spell slot. You can't do so again until you finish a long rest."
invocations.sign-of-ill-omen.prerequisites.level: 'Warlock level 5'
invocations.thief-of-five-fates.name: 'Thief of Five Fates'
invocations.thief-of-five-fates.state.used.name: 'Thief of Five Fates used'
invocations.thief-of-five-fates.description: "You can cast *bane* once using a warlock spell slot. You can't do so again until you finish a long rest."
invocations.thirsting-blade.name: 'Thirsting Blade'
invocations.thirsting-blade.description: 'You can attack with your pact weapon twice, instead of once, whenever you take the Attack action on your turn.'
invocations.thirsting-blade.prerequisites.level: 'Warlock level 5'
invocations.thirsting-blade.prerequisites.pact: 'Pact of the Blade'
invocations.visions-of-distant-realms.name: 'Visions of Distant Realms'
invocations.visions-of-distant-realms.description: 'You can cast *arcane eye* at will, without expending a spell slot.'
invocations.visions-of-distant-realms.prerequisites.level: 'Warlock level 15'
invocations.voice-of-the-chain-master.name: 'Voice of the Chain Master'
invocations.voice-of-the-chain-master.description: "You can communicate telepathically with your familiar and perceive through your familiar's senses as long as you are on the same plane of existence. Additionally, while perceiving through your familiar's senses, you can also speak through your familiar in your own voice, even if your familiar is normally incapable of speech."
invocations.voice-of-the-chain-master.prerequisites.pact: 'Pact of the Chain'
invocations.whispers-of-the-grave.name: 'Whispers of the Grave'
invocations.whispers-of-the-grave.description: 'You can cast *speak with dead* at will, without expending a spell slot.'
invocations.whispers-of-the-grave.prerequisites.level: 'Warlock level 9'
invocations.witch-sight.name: 'Witch Sight'
invocations.witch-sight.description: 'You can see the true form of any shapechanger or creature concealed by illusion or transmutation magic while the creature is within 30 feet of you and within line of sight.'
invocations.witch-sight.prerequisites.level: 'Warlock level 15'

