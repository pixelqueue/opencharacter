# Magic items. Template names receive the base item's name as {base}.
magic-items.weapon-plus-one.name: '{base} +1'
magic-items.weapon-plus-one.description: "You have a bonus to attack and damage rolls made with this magic weapon. The bonus is determined by the weapon's rarity."
magic-items.weapon-plus-two.name: '{base} +2'
magic-items.weapon-plus-two.description: "You have a bonus to attack and damage rolls made with this magic weapon. The bonus is determined by the weapon's rarity."
magic-items.weapon-plus-three.name: '{base} +3'
magic-items.weapon-plus-three.description: "You have a bonus to attack and damage rolls made with this magic weapon. The bonus is determined by the weapon's rarity."
magic-items.flame-tongue.name: 'Flame Tongue {base}'
magic-items.flame-tongue.description: "You can use a bonus action to speak this magic sword's command word, causing flames to erupt from the blade. These flames shed bright light in a 40-foot radius and dim light for an additional 40 feet. While the sword is ablaze, it deals an extra 2d6 fire damage to any target it hits. The flames last until you use a bonus action to speak the command word again or until you drop or sheathe the sword."
magic-items.flame-tongue.state.ignited.name: 'Ignited'
magic-items.frost-brand.name: 'Frost Brand {base}'
magic-items.frost-brand.description: |-
  When you hit with an attack using this magic sword, the target takes an extra 1d6 cold damage. In addition, while you hold the sword, you have resistance to fire damage.

  In freezing temperatures, the blade sheds bright light in a 10-foot radius and dim light for an additional 10 feet.

  When you draw this weapon, you can extinguish all nonmagical flames within 30 feet of you. This property can be used no more than once per hour.
magic-items.berserker-axe.name: 'Berserker {base}'
magic-items.berserker-axe.description: |-
  You gain a +1 bonus to attack and damage rolls made with this magic weapon. In addition, while you are attuned to this weapon, your hit point maximum increases by 1 for each level you have attained.

  ***Curse.*** This axe is cursed, and becoming attuned to it extends the curse to you. As long as you remain cursed, you are unwilling to part with the axe, keeping it within reach at all times. You also have disadvantage on attack rolls with weapons other than this one, unless no foe is within 60 feet of you that you can see or hear.

  Whenever a hostile creature damages you while the axe is in your possession, you must succeed on a DC 15 Wisdom saving throw or go berserk. While berserk, you must use your action each round to attack the creature nearest to you with the axe. If you can make extra attacks as part of the Attack action, you use those extra attacks, moving to attack the next nearest creature after you fell your current target. If you have multiple possible targets, you attack one at random. You are berserk until you start your turn with no creatures within 60 feet of you that you can see or hear.
magic-items.berserker-axe.followUps.berserk.name: 'Berserker Axe curse'
magic-items.berserker-axe.followUps.berserk.description: 'A hostile creature damaged you: make a DC 15 Wisdom save or go berserk'
magic-items.dagger-of-venom.name: 'Dagger of Venom'
magic-items.dagger-of-venom.description: |-
  You gain a +1 bonus to attack and damage rolls made with this magic weapon.

  You can use an action to cause thick, black poison to coat the blade. The poison remains for 1 minute or until an attack using this weapon hits a creature. That creature must succeed on a DC 15 Constitution saving throw or take 2d10 poison damage and become poisoned for 1 minute. The dagger can't be used this way again until the next dawn.
magic-items.dagger-of-venom.state.poisonUsed.name: 'Poison used'
magic-items.dancing-sword.name: 'Dancing {base}'
magic-items.dancing-sword.description: |-
  You can use a bonus action to toss this magic sword into the air and speak the command word. When you do so, the sword begins to hover, flies up to 30 feet, and attacks one creature of your choice within 5 feet of it. The sword uses your attack roll and ability score modifier to damage rolls.

  While the sword hovers, you can use a bonus action to cause it to fly up to 30 feet to another spot within 30 feet of you. As part of the same bonus action, you can cause the sword to attack one creature within 5 feet of it.

  After the hovering sword attacks for the fourth time, it flies up to 30 feet and tries to return to your hand. If you have no hand free, it falls to the ground at your feet. If the sword has no unobstructed path to you, it moves as close to you as it can and then falls to the ground. It also ceases to hover if you grasp it or move more than 30 feet away from it.
magic-items.defender.name: 'Defender {base}'
magic-items.defender.description: |-
  You gain a +3 bonus to attack and damage rolls made with this magic weapon.

  The first time you attack with the sword on each of your turns, you can transfer some or all of the sword's bonus to your Armor Class, instead of using the bonus on any attacks that turn. For example, you could reduce the bonus to your attack and damage rolls to +1 and gain a +2 bonus to AC. The adjusted bonuses remain in effect until the start of your next turn, although you must hold the sword to gain a bonus to AC from it.
magic-items.defender.state.defense.name: 'Bonus moved to AC'
magic-items.dragon-slayer.name: 'Dragon Slayer {base}'
magic-items.dragon-slayer.description: |-
  You gain a +1 bonus to attack and damage rolls made with this magic weapon.

  When you hit a dragon with this weapon, the dragon takes an extra 3d6 damage of the weapon's type. For the purpose of this weapon, "dragon" refers to any creature with the dragon type, including dragon turtles and wyverns.
magic-items.dwarven-thrower.name: 'Dwarven Thrower'
magic-items.dwarven-thrower.description: 'You gain a +3 bonus to attack and damage rolls made with this magic weapon. It has the thrown property with a normal range of 20 feet and a long range of 60 feet. When you hit with a ranged attack using this weapon, it deals an extra 1d8 damage or, if the target is a giant, 2d8 damage. Immediately after the attack, the weapon flies back to your hand.'
magic-items.giant-slayer.name: 'Giant Slayer {base}'
magic-items.giant-slayer.description: |-
  You gain a +1 bonus to attack and damage rolls made with this magic weapon.

  When you hit a giant with it, the giant takes an extra 2d6 damage of the weapon's type and must succeed on a DC 15 Strength saving throw or fall prone. For the purpose of this weapon, "giant" refers to any creature with the giant type, including ettins and trolls.
magic-items.hammer-of-thunderbolts.name: 'Hammer of Thunderbolts'
magic-items.hammer-of-thunderbolts.description: |-
  You gain a +1 bonus to attack and damage rolls made with this magic weapon.

  ***Giant's Bane (Requires Attunement).*** You must be wearing a *belt of giant strength* (any variety) and *gauntlets of ogre power* to attune to this weapon. The attunement ends if you take off either of those items. While you are attuned to this weapon and holding it, your Strength score increases by 4 and can exceed 20, but not 30. When you roll a 20 on an attack roll made with this weapon against a giant, the giant must succeed on a DC 17 Constitution saving throw or die.

  The hammer also has 5 charges. While attuned to it, you can expend 1 charge and make a ranged weapon attack with the hammer, hurling it as if it had the thrown property with a normal range of 20 feet and a long range of 60 feet. If the attack hits, the hammer unleashes a thunderclap audible out to 300 feet. The target and every creature within 30 feet of it must succeed on a DC 17 Constitution saving throw or be stunned until the end of your next turn. The hammer regains 1d4 + 1 expended charges daily at dawn.
magic-items.hammer-of-thunderbolts.state.charges.name: 'Charges'
magic-items.holy-avenger.name: 'Holy Avenger {base}'
magic-items.holy-avenger.description: |-
  You gain a +3 bonus to attack and damage rolls made with this magic weapon. When you hit a fiend or an undead with it, that creature takes an extra 2d10 radiant damage.

  While you hold the drawn sword, it creates an aura in a 10-foot radius around you. You and all creatures friendly to you in the aura have advantage on saving throws against spells and other magical effects. If you have 17 or more levels in the paladin class, the radius of the aura increases to 30 feet.
magic-items.javelin-of-lightning.name: 'Javelin of Lightning'
magic-items.javelin-of-lightning.description: |-
  This javelin is a magic weapon. When you hurl it and speak its command word, it transforms into a bolt of lightning, forming a line 5 feet wide that extends out from you to a target within 120 feet. Each creature in the line excluding you and the target must make a DC 13 Dexterity saving throw, taking 4d6 lightning damage on a failed save, and half as much damage on a successful one. The lightning bolt turns back into a javelin when it reaches the target. Make a ranged weapon attack against the target. On a hit, the target takes damage from the javelin plus 4d6 lightning damage.

  The javelin's property can't be used again until the next dawn. In the meantime, the javelin can still be used as a magic weapon.
magic-items.javelin-of-lightning.state.charges.name: 'Charges'
magic-items.luck-blade.name: 'Luck Blade {base}'
magic-items.luck-blade.description: |-
  You gain a +1 bonus to attack and damage rolls made with this magic weapon. While the sword is on your person, you also gain a +1 bonus to saving throws.

  ***Luck.*** If the sword is on your person, you can call on its luck (no action required) to reroll one attack roll, ability check, or saving throw you dislike. You must use the second roll. This property can't be used again until the next dawn.

  ***Wish.*** The sword has 1d4 – 1 charges. While holding it, you can use an action to expend 1 charge and cast the *wish* spell from it. This property can't be used again until the next dawn. The sword loses this property if it has no charges.
magic-items.luck-blade.state.wishes.name: 'Wishes used'
magic-items.mace-of-disruption.name: 'Mace of Disruption'
magic-items.mace-of-disruption.description: |-
  When you hit a fiend or an undead with this magic weapon, that creature takes an extra 2d6 radiant damage. If the target has 25 hit points or fewer after taking this damage, it must succeed on a DC 15 Wisdom saving throw or be destroyed. On a successful save, the creature becomes frightened of you until the end of your next turn.

  While you hold this weapon, it sheds bright light in a 20-foot radius and dim light for an additional 20 feet.
magic-items.mace-of-smiting.name: 'Mace of Smiting'
magic-items.mace-of-smiting.description: |-
  You gain a +1 bonus to attack and damage rolls made with this magic weapon. The bonus increases to +3 when you use the mace to attack a construct.

  When you roll a 20 on an attack roll made with this weapon, the target takes an extra 2d6 bludgeoning damage, or 4d6 bludgeoning damage if it's a construct. If a construct has 25 hit points or fewer after taking this damage, it is destroyed.
magic-items.mace-of-terror.name: 'Mace of Terror'
magic-items.mace-of-terror.description: |-
  This magic weapon has 3 charges. While holding it, you can use an action and expend 1 charge to release a wave of terror. Each creature of your choice in a 30-foot radius extending from you must succeed on a DC 15 Wisdom saving throw or become frightened of you for 1 minute. While it is frightened in this way, a creature must spend its turns trying to move as far away from you as it can, and it can't willingly move to a space within 30 feet of you. It also can't take reactions. For its action, it can use only the Dash action or try to escape from an effect that prevents it from moving. If it has nowhere it can move, the creature can use the Dodge action. At the end of each of its turns, a creature can repeat the saving throw, ending the effect on itself on a success.

  The mace regains 1d3 expended charges daily at dawn.
magic-items.mace-of-terror.state.charges.name: 'Charges'
magic-items.nine-lives-stealer.name: 'Nine Lives Stealer {base}'
magic-items.nine-lives-stealer.description: |-
  You gain a +2 bonus to attack and damage rolls made with this magic weapon.

  The sword has 1d8 + 1 charges. If you score a critical hit against a creature that has fewer than 100 hit points, it must succeed on a DC 15 Constitution saving throw or be slain instantly as the sword tears its life force from its body (a construct or an undead is immune). The sword loses 1 charge if the creature is slain. When the sword has no charges remaining, it loses this property.
magic-items.nine-lives-stealer.state.charges.name: 'Charges'
magic-items.oathbow.name: 'Oathbow'
magic-items.oathbow.description: |-
  When you nock an arrow on this bow, it whispers in Elvish, "Swift defeat to my enemies." When you use this weapon to make a ranged attack, you can, as a command phrase, say, "Swift death to you who have wronged me." The target of your attack becomes your sworn enemy until it dies or until dawn seven days later. You can have only one such sworn enemy at a time. When your sworn enemy dies, you can choose a new one after the next dawn.

  When you make a ranged attack roll with this weapon against your sworn enemy, you have advantage on the roll. In addition, your target gains no benefit from cover, other than total cover, and you suffer no disadvantage due to long range. If the attack hits, your sworn enemy takes an extra 3d6 piercing damage.

  While your sworn enemy lives, you have disadvantage on attack rolls with all other weapons.
magic-items.scimitar-of-speed.name: 'Scimitar of Speed'
magic-items.scimitar-of-speed.description: 'You gain a +2 bonus to attack and damage rolls made with this magic weapon. In addition, you can make one attack with it as a bonus action on each of your turns.'
magic-items.sun-blade.name: 'Sun Blade'
magic-items.sun-blade.description: |-
  This item appears to be a longsword hilt. While grasping the hilt, you can use a bonus action to cause a blade of pure radiance to spring into existence, or make the blade disappear. While the blade exists, this magic longsword has the finesse property. If you are proficient with shortswords or longswords, you are proficient with the *sun blade*.

  You gain a +2 bonus to attack and damage rolls made with this weapon, which deals radiant damage instead of slashing damage. When you hit an undead with it, that target takes an extra 1d8 radiant damage.

  The sword's luminous blade emits bright light in a 15-foot radius and dim light for an additional 15 feet. The light is sunlight. While the blade persists, you can use an action to expand or reduce its radius of bright and dim light by 5 feet each, to a maximum of 30 feet each or a minimum of 10 feet each.
magic-items.sword-of-life-stealing.name: '{base} of Life Stealing'
magic-items.sword-of-life-stealing.description: "When you attack a creature with this magic weapon and roll a 20 on the attack roll, that target takes an extra 3d6 necrotic damage, provided that the target isn't a construct or an undead. You gain temporary hit points equal to the extra damage dealt."
magic-items.sword-of-sharpness.name: '{base} of Sharpness'
magic-items.sword-of-sharpness.description: |-
  When you attack an object with this magic sword and hit, maximize your weapon damage dice against the target.

  When you attack a creature with this weapon and roll a 20 on the attack roll, that target takes an extra 4d6 slashing damage. Then roll another d20. If you roll a 20, you lop off one of the target's limbs, with the effect of such loss determined by the GM. If the creature has no limb to sever, you lop off a portion of its body instead.

  In addition, you can speak the sword's command word to cause the blade to shed bright light in a 10-foot radius and dim light for an additional 10 feet. Speaking the command word again or sheathing the sword puts out the light.
magic-items.sword-of-wounding.name: '{base} of Wounding'
magic-items.sword-of-wounding.description: |-
  Hit points lost to this weapon's damage can be regained only through a short or long rest, rather than by regeneration, magic, or any other means.

  Once per turn, when you hit a creature with an attack using this magic weapon, you can wound the target. At the start of each of the wounded creature's turns, it takes 1d4 necrotic damage for each time you've wounded it, and it can then make a DC 15 Constitution saving throw, ending the effect of all such wounds on itself on a success. Alternatively, the wounded creature, or a creature within 5 feet of it, can use an action to make a DC 15 Wisdom (Medicine) check, ending the effect of such wounds on it on a success.
magic-items.trident-of-fish-command.name: 'Trident of Fish Command'
magic-items.trident-of-fish-command.description: 'This trident is a magic weapon. It has 3 charges. While you carry it, you can use an action and expend 1 charge to cast *dominate beast* (save DC 15) from it on a beast that has an innate swimming speed. The trident regains 1d3 expended charges daily at dawn.'
magic-items.trident-of-fish-command.options.charges.name: 'Trident of Fish Command (charges)'
magic-items.trident-of-fish-command.state.charges.name: 'Charges'
magic-items.vicious-weapon.name: 'Vicious {base}'
magic-items.vicious-weapon.description: "When you roll a 20 on your attack roll with this magic weapon, your critical hit deals an extra 2d6 damage of the weapon's type."
magic-items.vorpal-sword.name: 'Vorpal {base}'
magic-items.vorpal-sword.description: |-
  You gain a +3 bonus to attack and damage rolls made with this magic weapon. In addition, the weapon ignores resistance to slashing damage.

  When you attack a creature that has at least one head with this weapon and roll a 20 on the attack roll, you cut off one of the creature's heads. The creature dies if it can't survive without the lost head. A creature is immune to this effect if it is immune to slashing damage, doesn't have or need a head, has legendary actions, or the GM decides that the creature is too big for its head to be cut off with this weapon. Such a creature instead takes an extra 6d8 slashing damage from the hit.
magic-items.staff-of-charming.name: 'Staff of Charming'
magic-items.staff-of-charming.description: |-
  While holding this staff, you can use an action to expend 1 of its 10 charges to cast *charm person*, *command*, *or comprehend languages* from it using your spell save DC. The staff can also be used as a magic quarterstaff.

  If you are holding the staff and fail a saving throw against an enchantment spell that targets only you, you can turn your failed save into a successful one. You can't use this property of the staff again until the next dawn. If you succeed on a save against an enchantment spell that targets only you, with or without the staff's intervention, you can use your reaction to expend 1 charge from the staff and turn the spell back on its caster as if you had cast the spell.

  The staff regains 1d8 + 2 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff becomes a nonmagical quarterstaff.
magic-items.staff-of-charming.options.charges.name: 'Staff of Charming (charges)'
magic-items.staff-of-charming.state.charges.name: 'Charges'
magic-items.staff-of-fire.name: 'Staff of Fire'
magic-items.staff-of-fire.description: |-
  You have resistance to fire damage while you hold this staff.

  The staff has 10 charges. While holding it, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC: *burning hands* (1 charge), *fireball* (3 charges), or *wall of fire* (4 charges).

  The staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff blackens, crumbles into cinders, and is destroyed.
magic-items.staff-of-fire.options.charges.name: 'Staff of Fire (charges)'
magic-items.staff-of-fire.state.charges.name: 'Charges'
magic-items.staff-of-frost.name: 'Staff of Frost'
magic-items.staff-of-frost.description: |-
  You have resistance to cold damage while you hold this staff.

  The staff has 10 charges. While holding it, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC: *cone of cold* (5 charges), *fog cloud* (1 charge), *ice storm* (4 charges), or *wall of ice* (4 charges).

  The staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff turns to water and is destroyed.
magic-items.staff-of-frost.options.charges.name: 'Staff of Frost (charges)'
magic-items.staff-of-frost.state.charges.name: 'Charges'
magic-items.staff-of-healing.name: 'Staff of Healing'
magic-items.staff-of-healing.description: |-
  This staff has 10 charges. While holding it, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC and spellcasting ability modifier: *cure wounds* (1 charge per spell level, up to 4th), *lesser restoration* (2 charges), or *mass cure wounds* (5 charges).

  The staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff vanishes in a flash of light, lost forever.
magic-items.staff-of-healing.options.charges.name: 'Staff of Healing (charges)'
magic-items.staff-of-healing.state.charges.name: 'Charges'
magic-items.staff-of-power.name: 'Staff of Power'
magic-items.staff-of-power.description: |-
  This staff can be wielded as a magic quarterstaff that grants a +2 bonus to attack and damage rolls made with it. While holding it, you gain a +2 bonus to Armor Class, saving throws, and spell attack rolls.

  The staff has 20 charges for the following properties. The staff regains 2d8 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff retains its +2 bonus to attack and damage rolls but loses all other properties. On a 20, the staff regains 1d8 + 2 charges.

  ***Power Strike.*** When you hit with a melee attack using the staff, you can expend 1 charge to deal an extra 1d6 force damage to the target.

  ***Spells.*** While holding this staff, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC and spell attack bonus: *cone of cold* (5 charges), *fireball* (5th-level version, 5 charges), *globe of invulnerability* (6 charges), *hold monster* (5 charges), *levitate* (2 charges), *lightning bolt* (5th-level version, 5 charges), *magic missile* (1 charge), *ray of enfeeblement* (1 charge), or *wall of force* (5 charges).

  ***Retributive Strike.*** You can use an action to break the staff over your knee or against a solid surface, performing a retributive strike. The staff is destroyed and releases its remaining magic in an explosion that expands to fill a 30-foot-radius sphere centered on it.

  You have a 50 percent chance to instantly travel to a random plane of existence, avoiding the explosion. If you fail to avoid the effect, you take force damage equal to 16 × the number of charges in the staff. Every other creature in the area must make a DC 17 Dexterity saving throw. On a failed save, a creature takes an amount of damage based on how far away it is from the point of origin, as shown in the following table. On a successful save, a creature takes half as much damage.

  | Distance from Origin | Damage |
  | --- | --- |
  | 10 ft. away or closer | 8 × the number of charges in the staff |
  | 11 to 20 ft. away | 6 × the number of charges in the staff |
  | 21 to 30 ft. away | 4 × the number of charges in the staff |
