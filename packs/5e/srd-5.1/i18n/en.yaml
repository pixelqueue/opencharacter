magic-items.adamantine-armor.name: 'Adamantine {base}'
magic-items.adamantine-armor.description: "This suit of armor is reinforced with adamantine, one of the hardest substances in existence. While you're wearing it, any critical hit against you becomes a normal hit."
magic-items.mithral-armor.name: 'Mithral {base}'
magic-items.mithral-armor.description: "Mithral is a light, flexible metal. A mithral chain shirt or breastplate can be worn under normal clothes. If the armor normally imposes disadvantage on Dexterity (Stealth) checks or has a Strength requirement, the mithral version of the armor doesn't."
magic-items.armor-of-resistance.name: '{base} of Resistance'
magic-items.armor-of-resistance.description: |-
  You have resistance to one type of damage while you wear this armor. The GM chooses the type or determines it randomly from the options below.

  | d10 | Damage Type | d10 | Damage Type |
  | --- | --- | --- | --- |
  | 1 | Acid | 6 | Necrotic |
  | 2 | Cold | 7 | Poison |
  | 3 | Fire | 8 | Psychic |
  | 4 | Force | 9 | Radiant |
  | 5 | Lightning | 10 | Thunder |
magic-items.armor-of-resistance.choices.damage-type.prompt: 'Choose the damage type'
magic-items.armor-of-resistance.choices.damage-type.options.acid.name: 'Acid'
magic-items.armor-of-resistance.choices.damage-type.options.cold.name: 'Cold'
