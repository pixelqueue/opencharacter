  ***Crystal Ball of True Seeing.*** While scrying with the crystal ball, you have truesight with a radius of 120 feet centered on the spell's sensor.
magic-items.cube-of-force.name: 'Cube of Force'
magic-items.cube-of-force.description: |-
  This cube is about an inch across. Each face has a distinct marking on it that can be pressed. The cube starts with 36 charges, and it regains 1d20 expended charges daily at dawn.

  You can use an action to press one of the cube's faces, expending a number of charges based on the chosen face, as shown in the Cube of Force Faces table. Each face has a different effect. If the cube has insufficient charges remaining, nothing happens. Otherwise, a barrier of invisible force springs into existence, forming a cube 15 feet on a side. The barrier is centered on you, moves with you, and lasts for 1 minute, until you use an action to press the cube's sixth face, or the cube runs out of charges. You can change the barrier's effect by pressing a different face of the cube and expending the requisite number of charges, resetting the duration.

  If your movement causes the barrier to come into contact with a solid object that can't pass through the cube, you can't move any closer to that object as long as the barrier remains.

  **Cube of Force Faces**

  | Face | Charges | Effect |
  | --- | --- | --- |
  | 1 | 1 | Gases, wind, and fog can't pass through the barrier. |
  | 2 | 2 | Nonliving matter can't pass through the barrier. Walls, floors, and ceilings can pass through at your discretion. |
  | 3 | 3 | Living matter can't pass through the barrier. |
  | 4 | 4 | Spell effects can't pass through the barrier. |
  | 5 | 5 | Nothing can pass through the barrier. Walls, floors, and ceilings can pass through at your discretion. |
  | 6 | 0 | The barrier deactivates. |

  The cube loses charges when the barrier is targeted by certain spells or comes into contact with certain spell or magic item effects, as shown in the table below.

  | Spell or Item | Charges Lost |
  | --- | --- |
  | *Disintegrate* | 1d12 |
  | *Horn of blasting* | 1d10 |
  | *Passwall* | 1d6 |
  | *Prismatic spray* | 1d20 |
  | *Wall of fire* | 1d4 |
magic-items.cube-of-force.state.charges.name: 'Charges'
magic-items.cubic-gate.name: 'Cubic Gate'
magic-items.cubic-gate.description: |-
  This cube is 3 inches across and radiates palpable magical energy. The six sides of the cube are each keyed to a different plane of existence, one of which is the Material Plane. The other sides are linked to planes determined by the GM. You can use an action to press one side of the cube to cast the *gate* spell with it, opening a portal to the plane keyed to that side. Alternatively, if you use an action to press one side twice, you can cast the *plane shift* spell (save DC 17) with the cube and transport the targets to the plane keyed to that side.

  The cube has 3 charges. Each use of the cube expends 1 charge. The cube regains 1d3 expended charges daily at dawn.
magic-items.cubic-gate.options.charges.name: 'Cubic Gate (charges)'
magic-items.cubic-gate.state.charges.name: 'Charges'
magic-items.decanter-of-endless-water.name: 'Decanter of Endless Water'
magic-items.decanter-of-endless-water.description: |-
  This stoppered flask sloshes when shaken, as if it contains water. The decanter weighs 2 pounds.

  You can use an action to remove the stopper and speak one of three command words, whereupon an amount of fresh water or salt water (your choice) pours out of the flask. The water stops pouring out at the start of your next turn. Choose from the following options:

  - "Stream" produces 1 gallon of water.
  - "Fountain" produces 5 gallons of water.
  - "Geyser" produces 30 gallons of water that gushes forth in a geyser 30 feet long and 1 foot wide. As a bonus action while holding the decanter, you can aim the geyser at a creature you can see within 30 feet of you. The target must succeed on a DC 13 Strength saving throw or take 1d4 bludgeoning damage and fall prone. Instead of a creature, you can target an object that isn't being worn or carried and that weighs no more than 200 pounds. The object is either knocked over or pushed up to 15 feet away from you.
magic-items.deck-of-illusions.name: 'Deck of Illusions'
magic-items.deck-of-illusions.description: |-
  This box contains a set of parchment cards. A full deck has 34 cards. A deck found as treasure is usually missing 1d20 − 1 cards.

  The magic of the deck functions only if cards are drawn at random (you can use an altered deck of playing cards to simulate the deck). You can use an action to draw a card at random from the deck and throw it to the ground at a point within 30 feet of you.

  An illusion of one or more creatures forms over the thrown card and remains until dispelled. An illusory creature appears real, of the appropriate size, and behaves as if it were a real creature except that it can do no harm. While you are within 120 feet of the illusory creature and can see it, you can use an action to move it magically anywhere within 30 feet of its card. Any physical interaction with the illusory creature reveals it to be an illusion, because objects pass through it. Someone who uses an action to visually inspect the creature identifies it as illusory with a successful DC 15 Intelligence (Investigation) check. The creature then appears translucent.

  The illusion lasts until its card is moved or the illusion is dispelled. When the illusion ends, the image on its card disappears, and that card can't be used again.

  | Playing Card | Illusion |
  | --- | --- |
  | Ace of hearts | Red dragon |
  | King of hearts | Knight and four guards |
  | Queen of hearts | Succubus or incubus |
  | Jack of hearts | Druid |
  | Ten of hearts | Cloud giant |
  | Nine of hearts | Ettin |
  | Eight of hearts | Bugbear |
  | Two of hearts | Goblin |
  | Ace of diamonds | Beholder |
  | King of diamonds | Archmage and mage apprentice |
  | Queen of diamonds | Night hag |
  | Jack of diamonds | Assassin |
  | Ten of diamonds | Fire giant |
  | Nine of diamonds | Ogre mage |
  | Eight of diamonds | Gnoll |
  | Two of diamonds | Kobold |
  | Ace of spades | Lich |
  | King of spades | Priest and two acolytes |
  | Queen of spades | Medusa |
  | Jack of spades | Veteran |
  | Ten of spades | Frost giant |
  | Nine of spades | Troll |
  | Eight of spades | Hobgoblin |
  | Two of spades | Goblin |
  | Ace of clubs | Iron golem |
  | King of clubs | Bandit captain and three bandits |
  | Queen of clubs | Erinyes |
  | Jack of clubs | Berserker |
  | Ten of clubs | Hill giant |
  | Nine of clubs | Ogre |
  | Eight of clubs | Orc |
  | Two of clubs | Kobold |
  | Jokers (2) | You (the deck's owner) |
magic-items.deck-of-many-things.name: 'Deck of Many Things'
magic-items.deck-of-many-things.description: |-
  Usually found in a box or pouch, this deck contains a number of cards made of ivory or vellum. Most (75 percent) of these decks have only thirteen cards, but the rest have twenty-two.

  Before you draw a card, you must declare how many cards you intend to draw and then draw them randomly (you can use an altered deck of playing cards to simulate the deck). Any cards drawn in excess of this number have no effect. Otherwise, as soon as you draw a card from the deck, its magic takes effect. You must draw each card no more than 1 hour after the previous draw. If you fail to draw the chosen number, the remaining number of cards fly from the deck on their own and take effect all at once.

  Once a card is drawn, it fades from existence. Unless the card is the Fool or the Jester, the card reappears in the deck, making it possible to draw the same card twice.

  | Playing Card | Card |
  | --- | --- |
  | Ace of diamonds | Vizier\* |
  | King of diamonds | Sun |
  | Queen of diamonds | Moon |
  | Jack of diamonds | Star |
  | Two of diamonds | Comet\* |
  | Ace of hearts | The Fates\* |
  | King of hearts | Throne |
  | Queen of hearts | Key |
  | Jack of hearts | Knight |
  | Two of hearts | Gem\* |
  | Ace of clubs | Talons\* |
  | King of clubs | The Void |
  | Queen of clubs | Flames |
  | Jack of clubs | Skull |
  | Two of clubs | Idiot\* |
  | Ace of spades | Donjon\* |
  | King of spades | Ruin |
  | Queen of spades | Euryale |
  | Jack of spades | Rogue |
  | Two of spades | Balance\* |
  | Joker (with TM) | Fool\* |
  | Joker (without TM) | Jester |

  \*Found only in a deck with twenty-two cards

  ***Balance.*** Your mind suffers a wrenching alteration, causing your alignment to change. Lawful becomes chaotic, good becomes evil, and vice versa. If you are true neutral or unaligned, this card has no effect on you.

  ***Comet.*** If you single-handedly defeat the next hostile monster or group of monsters you encounter, you gain experience points enough to gain one level. Otherwise, this card has no effect.

  ***Donjon.*** You disappear and become entombed in a state of suspended animation in an extradimensional sphere. Everything you were wearing and carrying stays behind in the space you occupied when you disappeared. You remain imprisoned until you are found and removed from the sphere. You can't be located by any divination magic, but a *wish* spell can reveal the location of your prison. You draw no more cards.

  ***Euryale.*** The card's medusa-like visage curses you. You take a −2 penalty on saving throws while cursed in this way. Only a god or the magic of The Fates card can end this curse.

  ***The Fates.*** Reality's fabric unravels and spins anew, allowing you to avoid or erase one event as if it never happened. You can use the card's magic as soon as you draw the card or at any other time before you die.

  ***Flames.*** A powerful devil becomes your enemy. The devil seeks your ruin and plagues your life, savoring your suffering before attempting to slay you. This enmity lasts until either you or the devil dies.

  ***Fool.*** You lose 10,000 XP, discard this card, and draw from the deck again, counting both draws as one of your declared draws. If losing that much XP would cause you to lose a level, you instead lose an amount that leaves you with just enough XP to keep your level.

  ***Gem.*** Twenty-five pieces of jewelry worth 2,000 gp each or fifty gems worth 1,000 gp each appear at your feet.

  ***Idiot.*** Permanently reduce your Intelligence by 1d4 + 1 (to a minimum score of 1). You can draw one additional card beyond your declared draws.

  ***Jester.*** You gain 10,000 XP, or you can draw two additional cards beyond your declared draws.

  ***Key.*** A rare or rarer magic weapon with which you are proficient appears in your hands. The GM chooses the weapon.

  ***Knight.*** You gain the service of a 4th-level fighter who appears in a space you choose within 30 feet of you. The fighter is of the same race as you and serves you loyally until death, believing the fates have drawn him or her to you. You control this character.

  ***Moon.*** You are granted the ability to cast the *wish* spell 1d3 times.

  ***Rogue.*** A nonplayer character of the GM's choice becomes hostile toward you. The identity of your new enemy isn't known until the NPC or someone else reveals it. Nothing less than a *wish* spell or divine intervention can end the NPC's hostility toward you.

  ***Ruin.*** All forms of wealth that you carry or own, other than magic items, are lost to you. Portable property vanishes. Businesses, buildings, and land you own are lost in a way that alters reality the least. Any documentation that proves you should own something lost to this card also disappears.

  ***Skull.*** You summon an avatar of death—a ghostly humanoid skeleton clad in a tattered black robe and carrying a spectral scythe. It appears in a space of the GM's choice within 10 feet of you and attacks you, warning all others that you must win the battle alone. The avatar fights until you die or it drops to 0 hit points, whereupon it disappears. If anyone tries to help you, the helper summons its own avatar of death. A creature slain by an avatar of death can't be restored to life.

  **Avatar of Death**

  *Medium undead, neutral evil*

  **Armor Class** 20

  **Hit Points** half the hit point maximum of its summoner

  **Speed** 60 ft., fly 60 ft. (hover)

  | STR | DEX | CON | INT | WIS | CHA |
  | --- | --- | --- | --- | --- | --- |
  | 16 (+3) | 16 (+3) | 16 (+3) | 16 (+3) | 16 (+3) | 16 (+3) |

  **Damage Immunities** necrotic, poison

  **Condition Immunities** charmed, frightened, paralyzed, petrified, poisoned, unconscious

  **Senses** darkvision 60 ft., truesight 60 ft., passive Perception 13

  **Languages** all languages known to its summoner

  **Challenge** — (0 XP)

  ***Incorporeal Movement.*** The avatar can move through other creatures and objects as if they were difficult terrain. It takes 5 (1d10) force damage if it ends its turn inside an object.

  ***Turning Immunity.*** The avatar is immune to features that turn undead.

  **Actions**

  ***Reaping Scythe.*** The avatar sweeps its spectral scythe through a creature within 5 feet of it, dealing 7 (1d8 + 3) slashing damage plus 4 (1d8) necrotic damage.

  ***Star.*** Increase one of your ability scores by 2. The score can exceed 20 but can't exceed 24.

  ***Sun.*** You gain 50,000 XP, and a wondrous item (which the GM determines randomly) appears in your hands.

  ***Talons.*** Every magic item you wear or carry disintegrates. Artifacts in your possession aren't destroyed but do vanish.

  ***Throne.*** You gain proficiency in the Persuasion skill, and you double your proficiency bonus on checks made with that skill. In addition, you gain rightful ownership of a small keep somewhere in the world. However, the keep is currently in the hands of monsters, which you must clear out before you can claim the keep as yours.

  ***Vizier.*** At any time you choose within one year of drawing this card, you can ask a question in meditation and mentally receive a truthful answer to that question. Besides information, the answer helps you solve a puzzling problem or other dilemma. In other words, the knowledge comes with wisdom on how to apply it.

  ***The Void.*** This black card spells disaster. Your soul is drawn from your body and contained in an object in a place of the GM's choice. One or more powerful beings guard the place. While your soul is trapped in this way, your body is incapacitated. A *wish* spell can't restore your soul, but the spell reveals the location of the object that holds it. You draw no more cards.
magic-items.dimensional-shackles.name: 'Dimensional Shackles'
magic-items.dimensional-shackles.description: |-
  You can use an action to place these shackles on an incapacitated creature. The shackles adjust to fit a creature of Small to Large size. In addition to serving as mundane manacles, the shackles prevent a creature bound by them from using any method of extradimensional movement, including teleportation or travel to a different plane of existence. They don't prevent the creature from passing through an interdimensional portal.

  You and any creature you designate when you use the shackles can use an action to remove them. Once every 30 days, the bound creature can make a DC 30 Strength (Athletics) check. On a success, the creature breaks free and destroys the shackles.
magic-items.dust-of-disappearance.name: 'Dust of Disappearance'
magic-items.dust-of-disappearance.description: 'Found in a small packet, this powder resembles very fine sand. There is enough of it for one use. When you use an action to throw the dust into the air, you and each creature and object within 10 feet of you become invisible for 2d4 minutes. The duration is the same for all subjects, and the dust is consumed when its magic takes effect. If a creature affected by the dust attacks or casts a spell, the invisibility ends for that creature.'
magic-items.dust-of-dryness.name: 'Dust of Dryness'
magic-items.dust-of-dryness.description: |-
  This small packet contains 1d6 + 4 pinches of dust. You can use an action to sprinkle a pinch of it over water. The dust turns a cube of water 15 feet on a side into one marble-sized pellet, which floats or rests near where the dust was sprinkled. The pellet's weight is negligible.

  Someone can use an action to smash the pellet against a hard surface, causing the pellet to shatter and release the water the dust absorbed. Doing so ends that pellet's magic.

  An elemental composed mostly of water that is exposed to a pinch of the dust must make a DC 13 Constitution saving throw, taking 10d6 necrotic damage on a failed save, or half as much damage on a successful one.
magic-items.dust-of-sneezing-and-choking.name: 'Dust of Sneezing and Choking'
magic-items.dust-of-sneezing-and-choking.description: |-
  Found in a small container, this powder resembles very fine sand. It appears to be *dust of disappearance*, and an *identify* spell reveals it to be such. There is enough of it for one use.

  When you use an action to throw a handful of the dust into the air, you and each creature that needs to breathe within 30 feet of you must succeed on a DC 15 Constitution saving throw or become unable to breathe, while sneezing uncontrollably. A creature affected in this way is incapacitated and suffocating. As long as it is conscious, a creature can repeat the saving throw at the end of each of its turns, ending the effect on it on a success. The *lesser restoration* spell can also end the effect on a creature.
magic-items.efficient-quiver.name: 'Efficient Quiver'
magic-items.efficient-quiver.description: |-
  Each of the quiver's three compartments connects to an extradimensional space that allows the quiver to hold numerous items while never weighing more than 2 pounds. The shortest compartment can hold up to sixty arrows, bolts, or similar objects. The midsize compartment holds up to eighteen javelins or similar objects. The longest compartment holds up to six long objects, such as bows, quarterstaffs, or spears.

  You can draw any item the quiver contains as if doing so from a regular quiver or scabbard.
magic-items.efreeti-bottle.name: 'Efreeti Bottle'
magic-items.efreeti-bottle.description: |-
  This painted brass bottle weighs 1 pound. When you use an action to remove the stopper, a cloud of thick smoke flows out of the bottle. At the end of your turn, the smoke disappears with a flash of harmless fire, and an efreeti appears in an unoccupied space within 30 feet of you.

  The first time the bottle is opened, the GM rolls to determine what happens.

  | d100 | Effect |
  | --- | --- |
  | 01–10 | The efreeti attacks you. After fighting for 5 rounds, the efreeti disappears, and the bottle loses its magic. |
  | 11–90 | The efreeti serves you for 1 hour, doing as you command. Then the efreeti returns to the bottle, and a new stopper contains it. The stopper can't be removed for 24 hours. The next two times the bottle is opened, the same effect occurs. If the bottle is opened a fourth time, the efreeti escapes and disappears, and the bottle loses its magic. |
  | 91–00 | The efreeti can cast the wish spell three times for you. It disappears when it grants the final wish or after 1 hour, and the bottle loses its magic. |
magic-items.elemental-gem-blue-sapphire.name: 'Elemental Gem (Blue Sapphire)'
magic-items.elemental-gem-blue-sapphire.description: |-
  This gem contains a mote of elemental energy. When you use an action to break the gem, an elemental is summoned as if you had cast the *conjure elemental* spell, and the gem's magic is lost. The type of gem determines the elemental summoned by the spell.

  | Gem | Summoned Elemental |
  | --- | --- |
  | Blue sapphire | Air elemental |
  | Yellow diamond | Earth elemental |
  | Red corundum | Fire elemental |
  | Emerald | Water elemental |
magic-items.elemental-gem-blue-sapphire.options.gem.name: 'Break the gem'
magic-items.elemental-gem-yellow-diamond.name: 'Elemental Gem (Yellow Diamond)'
magic-items.elemental-gem-yellow-diamond.description: |-
  This gem contains a mote of elemental energy. When you use an action to break the gem, an elemental is summoned as if you had cast the *conjure elemental* spell, and the gem's magic is lost. The type of gem determines the elemental summoned by the spell.

