# pack. Descriptions of spells, equipment, classes, features, races, subraces, draconic ancestries,
# traits, magic items and the diseases, spells' material components and triggers (`texts`) and the
# weapon properties' text are the SRD 5.1's own, descriptions in Markdown; the SRD is CC-BY-4.0 and
# the pack's `credit` gives its attribution.

