pack: 5e-srd-5.1
from: 0.2.0
to: 0.3.0
steps:
  # Metamagic options became metamagic content.
  - op: renameOption
    owner: features.sorcerer.metamagic
    choice: options
    from: careful-spell
    to: metamagic.careful-spell
  - op: renameOption
    owner: features.sorcerer.metamagic
    choice: options
    from: distant-spell
    to: metamagic.distant-spell
  - op: renameOption
    owner: features.sorcerer.metamagic
