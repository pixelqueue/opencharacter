id: classes.wretched-royalty
type: class
fields:
  strength: 3d6
  agility: 3d6
  presence: 3d6
  toughness: 3d6
  hitDie: 1d6
  omensDie: 1d2
  silver: 4d6
  weaponDie: 1d8
  armorDie: 1d3
choices:
  - id: feature
    pick: 2
    from:
      options:
        - id: blade-of-your-ancestors
          effects:
            [
              {
                target: features.weapons,
                op: grant,
                value: { item: weapons.blade-of-your-ancestors },
              },
            ]
        - id: poltroon
          effects: [{ target: companions.poltroon, op: set, value: true }]
        - id: barbarister
          effects: [{ target: companions.barbarister, op: set, value: true }]
        - id: hamfund
          effects:
            - { target: features.weapons, op: grant, value: { item: weapons.eurekia } }
            - { target: companions.hamfund, op: set, value: true }
        - id: snake-skin-gift
          effects:
            [{ target: features.weapons, op: grant, value: { item: weapons.snake-skin-dagger } }]
        - id: horn-of-the-schleswig-lords
          effects: [{ target: features.horn, op: set, value: true }]
