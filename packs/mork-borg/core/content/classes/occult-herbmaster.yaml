id: classes.occult-herbmaster
type: class
fields:
  strength: 3d6-2
  agility: 3d6
  presence: 3d6
  toughness: 3d6+2
  hitDie: 1d6
  omensDie: 1d2
  silver: 2d6
  weaponDie: 1d6
  armorDie: 1d2
actions:
  # Whether the two may be the same isn't settled; two copies of one decoction are fine.
  - id: brew
    tags: [decoction]
    results: [brewed]
    steps:
      - { id: first, kind: roll, tags: [decoction], parts: [{ dice: 1d8 }] }
      - { id: second, kind: roll, tags: [decoction], parts: [{ dice: 1d8 }] }
      - { id: doses, kind: roll, tags: [decoction], parts: [{ dice: 1d4 }] }
      - id: split
        kind: choice
        options: { values: [0, 1, 2, 3, 4], where: value <= steps.doses.total }
        recommend: options[floor((steps.doses.total + 1) / 2)]
      - id: add
        kind: changes
        changes:
          - type: addItem
            when: steps.split.value > 0
            entry:
              item: >-
                [@decoctions.red-poison, @decoctions.ezumiels-vapor, @decoctions.southern-frog-stew,
                @decoctions.elixir-vitalis, @decoctions.spider-owl-soup, @decoctions.fernors-philtre,
                @decoctions.hyphos-enervating-snuff, @decoctions.black-poison][steps.first.total - 1]
              quantity: steps.split.value
          - type: addItem
            when: steps.doses.total - steps.split.value > 0
            entry:
              item: >-
                [@decoctions.red-poison, @decoctions.ezumiels-vapor, @decoctions.southern-frog-stew,
                @decoctions.elixir-vitalis, @decoctions.spider-owl-soup, @decoctions.fernors-philtre,
                @decoctions.hyphos-enervating-snuff, @decoctions.black-poison][steps.second.total - 1]
              quantity: steps.doses.total - steps.split.value
      - id: result
        kind: outcome
        result: "'brewed'"
        data:
          first: steps.first.total
          second: steps.second.total
          doses: steps.doses.total
