# The starting equipment tables' plain gear: names, and the few numbers the tables give. Beasts and
# vehicles don't count toward load.
contentTypes:
  equipment:
    carried: true
    fields:
      load: { type: boolean, default: true }
      damage: { type: dice }
      price: { type: integer, min: 0 }
    state:
      uses: { type: integer, default: 0, min: 0 }
      hours: { type: integer, default: 0, min: 0 }
