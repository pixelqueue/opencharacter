situational:
  # Spends a held Grace for a Sinner (boons.grace) on one roll of this run: its test or its damage.
  - id: grace
    type: enum
    values: [none, test, damage]
    default: none
    rolls: [test, damage]
    available: 'countList(character.applied, x.active && x.source == @boons.grace) > 0'
  - id: omen
    type: boolean
    default: false
    rolls: [test]
    available: omens.current > 0
    effects:
      - target: { rolls: [test] }
        op: add
        value: 4

# The Horn of the Schleswig Lords' blare (boons.horn) makes a test a success.
rollTallies: [horn]

effects:
  - id: crit-damage
    target: { rolls: [damage] }
    op: rollModifier
    value: { kind: multiply, factor: 2 }
    when: "has(steps.check) && steps.check.result == 'crit'"
  - id: fumble-damage
    target: { rolls: [damage.taken] }
    op: rollModifier
    value: { kind: multiply, factor: 2 }
    when: "has(steps.check) && steps.check.result == 'fumble'"

resultBands:
  test:
    - id: crit
      when: roll.kept[0] == 20
    - id: fumble
      when: roll.kept[0] == 1 && roll.tallies.horn == 0
    - id: success
      success: true
      when: roll.total >= flags.dr
    # The horn's tally succeeds whatever the DR; apart, so the DR band's summary is a plain test.
    - id: success
      when: roll.tallies.horn > 0
    - id: failure
      when: true

actions:
  # The app runs it on every character at each turn change. An applied entry that lasts rounds
  # (a `rounds` state) uses one up as its applier's turn starts, and ends with its last, so the
  # holder keeps it through its own turns in between.
  - id: turn-boundary
    clock: turn-boundary
    params:
      ended: { type: string, optional: true }
      started: { type: string, optional: true }
    steps:
      - id: boundary
        kind: changes
        tags: [turn.boundary]
        when: has(params.started)
        to: self
        changes:
          - type: adjustState
            applied:
              where: has(self.rounds) && self.rounds > 1 && self.appliedBy == params.started
            key: rounds
            by: -1
          - type: removeEffect
            applied:
              where: has(self.rounds) && self.rounds <= 1 && self.appliedBy == params.started

  - id: test
    tags: [test]
    params:
      ability: { type: id, of: field, where: "'ability' in item.tags" }
      dr: { type: integer, default: 12, min: 1 }
      defense: { type: boolean, default: false }
      combat: { type: boolean, default: false }
    results: { bands: test }
    steps:
      - id: target
        kind: branch
        cases:
          - when: true
            flags:
              dr: >-
                (condition.hemorrhage >= 2 ? max(params.dr, 16)
                  : condition.hemorrhage == 1 ? max(params.dr, 18) : params.dr)
                + (params.defense ? tests.defenseDr
                : params.ability.id == @abilities.strength ? tests.strengthDr
                : params.ability.id == @abilities.agility ? tests.agilityDr
                : params.ability.id == @abilities.presence ? tests.presenceDr
                : tests.toughnessDr)
                - (situational.barbarister
                  && params.ability.id == @abilities.presence ? 2 : 0)
      - id: omen
        kind: changes
        when: situational.omen
        to: self
        changes:
          - { type: adjust, field: omens.current, by: -1 }
      - id: check
        kind: roll
        tags: [test]
        bands: test
        parts:
          - dice: 1d20
          - field: params.ability.id
      - id: fate
        kind: choice
        sheet: proposed
        when: >-
          omens.current > 0 && (steps.check.band == 'failure' || steps.check.band == 'fumble')
        options:
          - id: keep
          - id: reroll
          - id: cancel
            when: "steps.check.band == 'fumble'"
        recommend: "'keep'"
      - id: spend
        kind: changes
        when: has(steps.fate) && steps.fate.picked != 'keep'
        to: self
        changes:
          - { type: adjust, field: omens.current, by: -1 }
      - id: reroll
        kind: roll
        when: has(steps.fate) && steps.fate.picked == 'reroll'
        tags: [test]
        bands: test
        parts:
          - dice: 1d20
          - field: params.ability.id
      - id: result
        kind: outcome
        result: >-
          has(steps.reroll) ? steps.reroll.band
            : has(steps.fate) && steps.fate.picked == 'cancel' ? 'failure' : steps.check.band
        data:
          total: 'has(steps.reroll) ? steps.reroll.total : steps.check.total'
          dr: flags.dr
          omensSpent: >-
            (situational.omen ? 1 : 0) + (has(steps.fate) && steps.fate.picked != 'keep' ? 1 : 0)

  - id: initiative
    tags: [initiative]
    results: [rolled]
    steps:
      - id: roll
        kind: roll
        tags: [initiative]
        parts:
          - dice: 1d6
          - field: "'abilities.agility'"
      - id: result
        kind: outcome
        result: "'rolled'"
        data:
          total: steps.roll.total
