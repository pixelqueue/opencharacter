creation:
  - { id: guided, action: create-character, params: { choose: true } }
  - { id: classless, action: create-character, params: { classless: true }, random: true }
  - { id: class, action: create-character, random: true }

constraints:
  - id: creation-class
    check: >-
      !character.creating || countCopies(copy.type == 'class' || copy.type == 'companion') == 1
  - id: one-class
    check: "countCopies(copy.type == 'class' || copy.type == 'companion') <= 1"

actions:
  - id: create-character
    tags: [creation]
    available: "character.creating && countCopies(copy.type == 'class' || copy.type == 'companion') == 0"
    params:
      classless: { type: boolean, default: false }
      choose: { type: boolean, default: false }
    results: [rolled]
    steps:
      # The random starts draw the class among those offered: a d6 over the six core classes.
      - id: class
        kind: choice
        options:
          content:
            type: class
            where: >-
              params.choose || params.classless == (item.id == @classes.classless)
        random: '!params.choose'
        recommend: options[0]
        changes:
          - type: addItem
            entry: { item: picked.id }
      - id: best
        kind: choice
        when: has(steps.class.item.bestOf)
        options:
          - { id: strength, when: picks == 0 }
          - { id: agility, when: picks == 0 }
          - { id: presence, when: picks == 0 }
          - { id: toughness, when: picks == 0 }
        repeat: { max: steps.class.item.bestOf, min: steps.class.item.bestOf }
        random: '!params.choose'
        recommend: options[0]
      - id: strength
        kind: roll
        tags: [creation]
        parts:
          - dice: >-
              has(steps.best) && 'strength' in steps.best.picked ? 4d6dl1
                : steps.class.item.strength
      - id: agility
        kind: roll
        tags: [creation]
        parts:
          - dice: >-
              has(steps.best) && 'agility' in steps.best.picked ? 4d6dl1
                : steps.class.item.agility
      - id: presence
        kind: roll
        tags: [creation]
        parts:
          - dice: >-
              has(steps.best) && 'presence' in steps.best.picked ? 4d6dl1
                : steps.class.item.presence
      - id: toughness
        kind: roll
        tags: [creation]
        parts:
          - dice: >-
              has(steps.best) && 'toughness' in steps.best.picked ? 4d6dl1
                : steps.class.item.toughness
      - id: scores
        kind: branch
        cases:
          - when: true
            flags:
              strength: >-
                steps.strength.total <= 4 ? -3 : steps.strength.total <= 6 ? -2
                : steps.strength.total <= 8 ? -1 : steps.strength.total <= 12 ? 0
                : steps.strength.total <= 14 ? 1 : steps.strength.total <= 16 ? 2 : 3
              agility: >-
                steps.agility.total <= 4 ? -3 : steps.agility.total <= 6 ? -2
                : steps.agility.total <= 8 ? -1 : steps.agility.total <= 12 ? 0
                : steps.agility.total <= 14 ? 1 : steps.agility.total <= 16 ? 2 : 3
              presence: >-
                steps.presence.total <= 4 ? -3 : steps.presence.total <= 6 ? -2
                : steps.presence.total <= 8 ? -1 : steps.presence.total <= 12 ? 0
                : steps.presence.total <= 14 ? 1 : steps.presence.total <= 16 ? 2 : 3
              toughness: >-
                steps.toughness.total <= 4 ? -3 : steps.toughness.total <= 6 ? -2
                : steps.toughness.total <= 8 ? -1 : steps.toughness.total <= 12 ? 0
                : steps.toughness.total <= 14 ? 1 : steps.toughness.total <= 16 ? 2 : 3
      - { id: hp, kind: roll, tags: [creation], parts: [{ dice: steps.class.item.hitDie }] }
      - { id: omens, kind: roll, tags: [creation], parts: [{ dice: steps.class.item.omensDie }] }
      - { id: powers, kind: roll, tags: [creation], parts: [{ dice: 1d4 }] }
      - { id: silver, kind: roll, tags: [creation], parts: [{ dice: steps.class.item.silver }] }
      - { id: food, kind: roll, tags: [creation], parts: [{ dice: 1d4 }] }
      # The equipment tables come before the weapon and armor: a classless character with a scroll
      # from them rolls the smaller dice.
      - { id: equipment1, kind: roll, tags: [creation], parts: [{ dice: 1d6 }] }
      - { id: equipment2, kind: roll, tags: [creation], parts: [{ dice: 1d12 }] }
      - { id: equipment3, kind: roll, tags: [creation], parts: [{ dice: 1d12 }] }
      - id: uncleanScroll
        kind: roll
        tags: [creation]
        when: steps.equipment2.total == 5
        parts: [{ dice: 1d10 }]
      - id: poisonDoses
        kind: roll
        tags: [creation]
        when: steps.equipment2.total == 11
        parts: [{ dice: 1d4 }]
      - id: elixirDoses
        kind: roll
        tags: [creation]
        when: steps.equipment3.total == 1
        parts: [{ dice: 1d4 }]
      - id: sacredScroll
        kind: roll
        tags: [creation]
        when: steps.equipment3.total == 2
        parts: [{ dice: 1d10 }]
      - id: monkeys
        kind: roll
        tags: [creation]
        when: steps.equipment3.total == 4
        parts: [{ dice: 1d2 }]
      - id: weapon
        kind: roll
        tags: [creation]
        parts:
          - dice: >-
              (has(steps.uncleanScroll) || has(steps.sacredScroll))
                && has(steps.class.item.scrollWeaponDie)
                ? steps.class.item.scrollWeaponDie : steps.class.item.weaponDie
      - id: armor
        kind: roll
        tags: [creation]
        parts:
          - dice: >-
              (has(steps.uncleanScroll) || has(steps.sacredScroll))
                && has(steps.class.item.scrollArmorDie)
                ? steps.class.item.scrollArmorDie : steps.class.item.armorDie
      # A d2 for the kind (1 unclean, 2 sacred), then a d10 on that kind's table in the book's
      # order.
      - id: scrollKind
        kind: roll
        tags: [creation]
        when: 'steps.class.picked == @classes.esoteric-hermit'
        parts: [{ dice: 1d2 }]
      - id: hermitScroll
        kind: roll
        tags: [creation]
        when: has(steps.scrollKind)
        parts: [{ dice: 1d10 }]
      - id: save
        kind: changes
        changes:
          - { type: set, field: abilities.strength, value: flags.strength }
          - { type: set, field: abilities.agility, value: flags.agility }
          - { type: set, field: abilities.presence, value: flags.presence }
          - { type: set, field: abilities.toughness, value: flags.toughness }
          - { type: set, field: hp.max, value: 'max(1, flags.toughness + steps.hp.total)' }
          - { type: set, field: hp.current, value: 'max(1, flags.toughness + steps.hp.total)' }
          - { type: set, field: omens.max, value: steps.omens.total }
          - { type: set, field: omens.current, value: steps.omens.total }
          - { type: set, field: powers.max, value: 'max(0, flags.presence + steps.powers.total)' }
          - {
              type: set,
              field: powers.current,
              value: 'max(0, flags.presence + steps.powers.total)',
            }
          - { type: set, field: silver.current, value: steps.silver.total * 10 }
      # The tables' results, in the book's order. A guided start offers each item the tables give as
      # a pick among the content of its type (an add-on pack's too), recommending the table's.
      - id: tables
        kind: branch
        cases:
          - when: true
            flags:
              weapon: >-
                [@weapons.femur, @weapons.staff, @weapons.shortsword, @weapons.knife,
                @weapons.warhammer, @weapons.sword, @weapons.bow, @weapons.flail, @weapons.crossbow,
                @weapons.zweihander][steps.weapon.total - 1]
              armor: "steps.armor.total >= 2 ? [@armor.light, @armor.medium, @armor.heavy][steps.armor.total - 2] : ''"
              unclean: >-
                [@scrolls.unclean.palms-open-the-southern-gate, @scrolls.unclean.tongue-of-eris,
                @scrolls.unclean.te-le-kin-esis, @scrolls.unclean.lucy-fires-levitation,
                @scrolls.unclean.daemon-of-capillaries,
                @scrolls.unclean.nine-violet-signs-unknot-the-storm,
                @scrolls.unclean.metzhuotl-blind-your-eye, @scrolls.unclean.eyelid-blinds-the-mind,
                @scrolls.unclean.death, @scrolls.unclean.foul-psychopomp]
              sacred: >-
                [@scrolls.sacred.grace-of-a-dead-saint, @scrolls.sacred.grace-for-a-sinner,
                @scrolls.sacred.whispers-pass-the-gate, @scrolls.sacred.aegis-of-sorrow,
                @scrolls.sacred.unmet-fate, @scrolls.sacred.bestial-speech,
                @scrolls.sacred.false-dawn-nights-chariot, @scrolls.sacred.hermetic-step,
                @scrolls.sacred.roskoes-consuming-glare, @scrolls.sacred.enochian-syntax]
              equipment1: >-
                steps.equipment1.total >= 3 ? [@equipment.backpack, @equipment.sack,
                @equipment.small-wagon, @equipment.donkey][steps.equipment1.total - 3] : ''
              equipment2: >-
                [@equipment.rope, '', '', @equipment.magnesium-strip, '', @equipment.sharp-needle,
                '', @equipment.lockpicks, @equipment.bear-trap, @equipment.bomb, '',
                @equipment.silver-crucifix][steps.equipment2.total - 1]
              equipment3: >-
                ['', '', @equipment.dog, '', @equipment.perfume, @equipment.toolbox,
                @equipment.chain, @equipment.grappling-hook, '', @equipment.crowbar,
                @equipment.lard, @equipment.tent][steps.equipment3.total - 1]
      - id: weaponPick
        kind: choice
        when: params.choose
        options: { content: { type: weapon, where: '!item.fromFeature' } }
        recommend: flags.weapon
      - id: armorPick
        kind: choice
        when: "params.choose && flags.armor != ''"
        options: { content: { type: armor } }
        recommend: flags.armor
      - id: hermitScrollPick
        kind: choice
        when: params.choose && has(steps.hermitScroll)
        options:
          content:
            type: scroll
            where: "item.kind == (steps.scrollKind.total == 1 ? 'unclean' : 'sacred')"
        recommend: >-
          (steps.scrollKind.total == 1 ? flags.unclean : flags.sacred)[steps.hermitScroll.total - 1]
      - id: equipment1Pick
        kind: choice
        when: "params.choose && flags.equipment1 != ''"
        options: { content: { type: equipment } }
        recommend: flags.equipment1
      - id: equipment2Pick
        kind: choice
        when: "params.choose && flags.equipment2 != ''"
        options: { content: { type: equipment } }
        recommend: flags.equipment2
      - id: uncleanScrollPick
        kind: choice
        when: params.choose && has(steps.uncleanScroll)
        options: { content: { type: scroll, where: "item.kind == 'unclean'" } }
        recommend: flags.unclean[steps.uncleanScroll.total - 1]
      - id: sacredScrollPick
        kind: choice
        when: params.choose && has(steps.sacredScroll)
        options: { content: { type: scroll, where: "item.kind == 'sacred'" } }
        recommend: flags.sacred[steps.sacredScroll.total - 1]
      - id: equipment3Pick
        kind: choice
        when: "params.choose && flags.equipment3 != ''"
        options: { content: { type: equipment } }
        recommend: flags.equipment3
      - id: shieldPick
        kind: choice
        when: params.choose && steps.equipment3.total == 9
        options: { content: { type: shield } }
        recommend: '@shields.shield'
      - id: ammo
        kind: branch
        cases:
          - when: true
            flags:
              ammo: >-
                has(steps.weaponPick) ? (has(steps.weaponPick.item.ammo) ? steps.weaponPick.item.ammo : '')
                  : steps.weapon.total == 7 ? 'arrows' : steps.weapon.total == 9 ? 'bolts' : ''
      - id: gear
        kind: changes
        changes:
          - type: addItem
            entry:
              item: 'has(steps.weaponPick) ? steps.weaponPick.picked : flags.weapon'
              equipped: true
          - type: addItem
            when: "flags.ammo != ''"
            entry: { item: "'ammo.' + flags.ammo", quantity: flags.presence + 10 }
          - type: addItem
            when: "flags.armor != ''"
            entry:
              item: 'has(steps.armorPick) ? steps.armorPick.picked : flags.armor'
              equipped: true
          - type: addItem
            when: has(steps.hermitScroll)
            entry:
              item: >-
                has(steps.hermitScrollPick) ? steps.hermitScrollPick.picked
                  : (steps.scrollKind.total == 1 ? flags.unclean : flags.sacred)[steps.hermitScroll.total - 1]
      # The waterskin and food, then the three equipment tables in the book's order.
      - id: equipment
        kind: changes
        changes:
          - { type: addItem, entry: { item: '@equipment.waterskin' } }
          - { type: addItem, entry: { item: '@equipment.food', quantity: steps.food.total } }
          - type: addItem
            when: "flags.equipment1 != ''"
            entry:
              { item: 'has(steps.equipment1Pick) ? steps.equipment1Pick.picked : flags.equipment1' }
          - type: addItem
            when: "flags.equipment2 != ''"
            entry:
              { item: 'has(steps.equipment2Pick) ? steps.equipment2Pick.picked : flags.equipment2' }
          - type: addItem
            when: steps.equipment2.total == 2
            entry: { item: '@equipment.torch', quantity: flags.presence + 4 }
          - type: addItem
            when: steps.equipment2.total == 3
            entry: { item: '@equipment.lantern', state: { hours: flags.presence + 6 } }
          - type: addItem
            when: steps.equipment2.total == 7
            entry: { item: '@equipment.medicine-chest', state: { uses: flags.presence + 4 } }
          - type: addItem
            when: has(steps.uncleanScroll)
            entry:
              item: >-
                has(steps.uncleanScrollPick) ? steps.uncleanScrollPick.picked
                  : flags.unclean[steps.uncleanScroll.total - 1]
          - type: addItem
            when: has(steps.poisonDoses)
            entry: { item: '@decoctions.red-poison', quantity: steps.poisonDoses.total }
          - type: addItem
            when: has(steps.elixirDoses)
            entry: { item: '@decoctions.elixir-vitalis', quantity: steps.elixirDoses.total }
          - type: addItem
            when: has(steps.sacredScroll)
            entry:
              item: >-
                has(steps.sacredScrollPick) ? steps.sacredScrollPick.picked
                  : flags.sacred[steps.sacredScroll.total - 1]
          - type: addItem
            when: has(steps.monkeys)
            entry: { item: '@equipment.monkey', quantity: steps.monkeys.total }
          - type: addItem
            when: steps.equipment3.total == 9
            entry: { item: 'has(steps.shieldPick) ? steps.shieldPick.picked : @shields.shield' }
          - type: addItem
            when: "flags.equipment3 != ''"
            entry:
              { item: 'has(steps.equipment3Pick) ? steps.equipment3Pick.picked : flags.equipment3' }
      # Each feature is drawn among the class's options, a d6 for the core classes; a picked option
      # isn't offered again, so the Royalty's second is a d5 among the other five.
      - id: features
        kind: choice
        options: { pending: { entry: 'steps.class.added[0]' } }
        random: true
      # The weapons the picked features bring.
      - id: featureWeapons
        kind: changes
        sheet: proposed
        changes:
          - type: addItem
            when: size(features.weapons) > 0
            entry: { item: 'features.weapons[0]' }
          - type: addItem
            when: size(features.weapons) > 1
            entry: { item: 'features.weapons[1]' }
      - id: finish
        kind: changes
        changes:
          - { type: finishCreation }
      - { id: result, kind: outcome, result: "'rolled'" }
