creation:
  - { id: guided, action: roll-character, params: { choose: true } }
  - { id: roll, action: roll-character, random: true }

constraints:
  - id: creation-class
    check: "!character.creating || countCopies(copy.type == 'class') > 0"

actions:
  - id: roll-character
    tags: [creation]
    available: "character.creating && countCopies(copy.type == 'class') == 0"
    params:
      choose: { type: boolean, default: false }
    results: [rolled]
    steps:
      - id: classRoll
        kind: roll
        tags: [creation]
        when: '!params.choose'
        parts: [{ dice: 1d4 }]
      - { id: strength, kind: roll, tags: [creation], parts: [{ dice: 2d10 }, { value: 25 }] }
      - { id: speed, kind: roll, tags: [creation], parts: [{ dice: 2d10 }, { value: 25 }] }
      - { id: intellect, kind: roll, tags: [creation], parts: [{ dice: 2d10 }, { value: 25 }] }
      - { id: combat, kind: roll, tags: [creation], parts: [{ dice: 2d10 }, { value: 25 }] }
      - { id: sanity, kind: roll, tags: [creation], parts: [{ dice: 2d10 }, { value: 10 }] }
      - { id: fear, kind: roll, tags: [creation], parts: [{ dice: 2d10 }, { value: 10 }] }
      - { id: body, kind: roll, tags: [creation], parts: [{ dice: 2d10 }, { value: 10 }] }
      - id: class
        kind: choice
        options: { content: { type: class } }
        recommend: >-
          has(steps.classRoll) ? options[(steps.classRoll.total - 1) % size(options)] : options[0]
        changes:
          - type: addItem
            entry: { item: picked.id }
      - { id: health, kind: roll, tags: [creation], parts: [{ dice: 1d10 }, { value: 10 }] }
      - id: statRoll
        kind: roll
        tags: [creation]
        when: >-
          !params.choose
            && steps.class.picked in [@classes.android, @classes.scientist]
        parts: [{ dice: 1d4 }]
      - id: stat
        kind: choice
        when: 'steps.class.picked in [@classes.android, @classes.scientist]'
        options: [{ id: strength }, { id: speed }, { id: intellect }, { id: combat }]
        recommend: 'has(steps.statRoll) ? options[steps.statRoll.total - 1] : options[0]'
        changes:
          - type: choose
            path:
              entry: { formula: 'steps.class.added[0]' }
              choice: >-
                [steps.class.picked == @classes.android ? 'stat-penalty' : 'stat-bonus']
            option: picked.id
      - id: skills
        kind: choice
        options: { pending: { entry: 'steps.class.added[0]' } }
        recommend: options[0]
      - { id: credits, kind: roll, tags: [creation], parts: [{ dice: 2d10 }] }
      - id: kit
        kind: choice
        options: [{ id: loadout }, { id: credits }]
        recommend: "'loadout'"
      - id: save
        kind: changes
        changes:
          - { type: set, field: stats.strength, value: steps.strength.total }
          - { type: set, field: stats.speed, value: steps.speed.total }
          - { type: set, field: stats.intellect, value: steps.intellect.total }
          - { type: set, field: stats.combat, value: steps.combat.total }
          - { type: set, field: saves.sanity, value: steps.sanity.total }
          - { type: set, field: saves.fear, value: steps.fear.total }
          - { type: set, field: saves.body, value: steps.body.total }
          - { type: set, field: health.max, value: steps.health.total }
          - { type: set, field: health.current, value: steps.health.total }
          - {
              type: set,
              field: credits.current,
              value: "steps.credits.total * (steps.kit.picked == 'credits' ? 100 : 10)",
            }
          - { type: finishCreation }
      - id: result
        kind: outcome
        result: "'rolled'"
        data:
          loadout: "steps.kit.picked == 'loadout'"
