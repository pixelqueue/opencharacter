id: special-abilities.expertise
type: specialAbility
# The chosen action's rating, for the card.
computed:
  action:
    type: string
    formula: "size(picksOf('action')) > 0 ? 'fitd-scoundrel:ratings.' + picksOf('action')[0] : ''"
choices:
  - id: action
    pick: 1
    from:
      options:
        - id: hunt
        - id: study
        - id: survey
        - id: tinker
        - id: finesse
        - id: prowl
        - id: skirmish
        - id: wreck
        - id: attune
        - id: command
        - id: consort
        - id: sway
