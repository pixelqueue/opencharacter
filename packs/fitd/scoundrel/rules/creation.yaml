          ratings.attune: min(max(0, 2 - ratings.attune), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse)))
          ratings.study: min(max(0, 2 - ratings.study), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune)))
          ratings.prowl: min(max(0, 2 - ratings.prowl), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study)))
          ratings.command: min(max(0, 2 - ratings.command), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl)))
          ratings.survey: min(max(0, 2 - ratings.survey), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command)))
          ratings.skirmish: min(max(0, 2 - ratings.skirmish), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey)))
          ratings.consort: min(max(0, 2 - ratings.consort), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish)))
          ratings.tinker: min(max(0, 2 - ratings.tinker), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort)))
          ratings.wreck: min(max(0, 2 - ratings.wreck), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort) - max(0, 2 - ratings.tinker)))
          ratings.sway: min(max(0, 2 - ratings.sway), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort) - max(0, 2 - ratings.tinker) - max(0, 2 - ratings.wreck)))
      - id: backgroundDot
        kind: allocate
        sheet: proposed
        fields: { type: field, where: "'rating' in item.tags" }
        budget: 1
        limit: max(0, 2 - field.value)
        random: params.random
        recommend:
          ratings.hunt: min(max(0, 2 - ratings.hunt), 1)
          ratings.finesse: min(max(0, 2 - ratings.finesse), max(0, 1 - max(0, 2 - ratings.hunt)))
          ratings.attune: min(max(0, 2 - ratings.attune), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse)))
          ratings.study: min(max(0, 2 - ratings.study), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune)))
          ratings.prowl: min(max(0, 2 - ratings.prowl), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study)))
          ratings.command: min(max(0, 2 - ratings.command), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl)))
          ratings.survey: min(max(0, 2 - ratings.survey), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command)))
          ratings.skirmish: min(max(0, 2 - ratings.skirmish), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey)))
          ratings.consort: min(max(0, 2 - ratings.consort), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish)))
          ratings.tinker: min(max(0, 2 - ratings.tinker), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort)))
          ratings.wreck: min(max(0, 2 - ratings.wreck), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort) - max(0, 2 - ratings.tinker)))
          ratings.sway: min(max(0, 2 - ratings.sway), max(0, 1 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort) - max(0, 2 - ratings.tinker) - max(0, 2 - ratings.wreck)))
      - id: dots
        kind: allocate
        sheet: proposed
        fields: { type: field, where: "'rating' in item.tags" }
        budget: 2
        limit: max(0, 2 - field.value)
        random: params.random
        recommend:
          ratings.hunt: min(max(0, 2 - ratings.hunt), 2)
          ratings.finesse: min(max(0, 2 - ratings.finesse), max(0, 2 - max(0, 2 - ratings.hunt)))
          ratings.attune: min(max(0, 2 - ratings.attune), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse)))
          ratings.study: min(max(0, 2 - ratings.study), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune)))
          ratings.prowl: min(max(0, 2 - ratings.prowl), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study)))
          ratings.command: min(max(0, 2 - ratings.command), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl)))
          ratings.survey: min(max(0, 2 - ratings.survey), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command)))
          ratings.skirmish: min(max(0, 2 - ratings.skirmish), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey)))
          ratings.consort: min(max(0, 2 - ratings.consort), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish)))
          ratings.tinker: min(max(0, 2 - ratings.tinker), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort)))
          ratings.wreck: min(max(0, 2 - ratings.wreck), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort) - max(0, 2 - ratings.tinker)))
          ratings.sway: min(max(0, 2 - ratings.sway), max(0, 2 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort) - max(0, 2 - ratings.tinker) - max(0, 2 - ratings.wreck)))
      - id: picks
        kind: choice
        tags: [creation.picks]
        options: { pending: {} }
        random: params.random
        recommend: options[0]
      - id: heritage
        kind: changes
        when: params.heritage != ''
        changes:
          - { type: set, field: identity.heritage, value: params.heritage }
      - id: background
        kind: changes
        when: params.background != ''
        changes:
          - { type: set, field: identity.background, value: params.background }
      - id: alias
        kind: changes
        when: params.alias != ''
        changes:
          - { type: set, field: identity.alias, value: params.alias }
      - id: look
        kind: changes
        when: params.look != ''
        changes:
