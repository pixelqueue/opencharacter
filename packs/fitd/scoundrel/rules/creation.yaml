# The SRD creates scoundrels by choice, so the random start's odds are the pack's: every pick is
# uniform among what the guided start offers, the dots placed one at a time to an action that can
# still take one.
creation:
  - { id: scoundrel, action: create-scoundrel }
  - { id: random, action: create-scoundrel, params: { random: true }, random: true }

actions:
  - id: create-scoundrel
    tags: [creation]
    available: character.creating
    params:
      random: { type: boolean, default: false }
      heritage: { type: string, default: '' }
      background: { type: string, default: '' }
      alias: { type: string, default: '' }
      look: { type: string, default: '' }
      friend: { type: string, default: '' }
      rival: { type: string, default: '' }
      purveyor: { type: string, default: '' }
    steps:
      - id: playbook
        kind: choice
        tags: [creation.playbook]
        options: { content: { type: playbook } }
        random: params.random
        recommend: options[0]
        changes:
          - { type: choose, path: { choice: [playbook] }, option: picked.id }
      - id: poolAbility
        kind: choice
        tags: [creation.ability]
        when: '!has(steps.playbook)'
        options: { content: { type: specialAbility } }
        random: params.random
        recommend: options[0]
        changes:
          - { type: choose, path: { choice: [special-abilities] }, option: picked.id }
      - id: vice
        kind: choice
        tags: [creation.vice]
        options: { content: { type: vice } }
        random: params.random
        recommend: options[0]
        changes:
          - { type: choose, path: { choice: [vice] }, option: picked.id }
      # The guided start recommends each dot to the first action with room, in an order that
      # alternates the attributes (Hunt, Finesse, Attune, Study, Prowl, Command, …), so an
      # automatic run finishes.
      - id: startingDots
        kind: allocate
        when: '!has(steps.playbook)'
        sheet: proposed
        fields: { type: field, where: "'rating' in item.tags" }
        budget: 3
        limit: max(0, 2 - field.value)
        random: params.random
        recommend:
          ratings.hunt: min(max(0, 2 - ratings.hunt), 3)
          ratings.finesse: min(max(0, 2 - ratings.finesse), max(0, 3 - max(0, 2 - ratings.hunt)))
          ratings.attune: min(max(0, 2 - ratings.attune), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse)))
          ratings.study: min(max(0, 2 - ratings.study), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune)))
          ratings.prowl: min(max(0, 2 - ratings.prowl), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study)))
          ratings.command: min(max(0, 2 - ratings.command), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl)))
          ratings.survey: min(max(0, 2 - ratings.survey), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command)))
          ratings.skirmish: min(max(0, 2 - ratings.skirmish), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey)))
          ratings.consort: min(max(0, 2 - ratings.consort), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish)))
          ratings.tinker: min(max(0, 2 - ratings.tinker), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort)))
          ratings.wreck: min(max(0, 2 - ratings.wreck), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort) - max(0, 2 - ratings.tinker)))
          ratings.sway: min(max(0, 2 - ratings.sway), max(0, 3 - max(0, 2 - ratings.hunt) - max(0, 2 - ratings.finesse) - max(0, 2 - ratings.attune) - max(0, 2 - ratings.study) - max(0, 2 - ratings.prowl) - max(0, 2 - ratings.command) - max(0, 2 - ratings.survey) - max(0, 2 - ratings.skirmish) - max(0, 2 - ratings.consort) - max(0, 2 - ratings.tinker) - max(0, 2 - ratings.wreck)))
      - id: heritageDot
        kind: allocate
        sheet: proposed
        fields: { type: field, where: "'rating' in item.tags" }
        budget: 1
        limit: max(0, 2 - field.value)
        random: params.random
        recommend:
