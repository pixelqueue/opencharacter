special-abilities.battleborn.name: Battleborn
special-abilities.battleborn.description: Spend your special armor to shrug off harm in a fight or to push yourself while fighting.
special-abilities.battleborn.options.special-armor.name: 'Mark special armor instead of stress (Battleborn: pushing while fighting)'
special-abilities.mule.name: Mule
special-abilities.mule.description: You can carry more. Your load limits are 5, 7 and 8.
special-abilities.vigorous.name: Vigorous
special-abilities.bodyguard.name: Bodyguard
special-abilities.bodyguard.description: Resistance rolls get an extra die while you protect a teammate, and you get more effect when gathering information about threats.
special-abilities.arcane-fighter.name: Arcane Fighter
special-abilities.arcane-fighter.description: You can charge your hands, melee weapons and tools with spirit energy, and you have potency in combat against the supernatural.
special-abilities.leader.name: Leader
special-abilities.leader.description: Cohorts you command in a fight keep fighting through severe harm, with +1 effect and 1 armor.
special-abilities.not-to-be-trifled-with.name: Not to Be Trifled With
special-abilities.not-to-be-trifled-with.description: Push yourself to perform a feat of near-superhuman strength, or to take on a small gang on equal footing.
special-abilities.savage.name: Savage
special-abilities.savage.description: Your violence frightens onlookers, and you get an extra die to Command someone who fears you.
special-abilities.vigorous.description: One segment of your healing clock is always filled, and recovery rolls for you get an extra die.

special-abilities.arcane-mind.name: Arcane Mind
special-abilities.arcane-mind.description: You always sense supernatural beings nearby, and get an extra die to learn about the supernatural.
special-abilities.iron-will.name: Iron Will
special-abilities.iron-will.description: Supernatural terror doesn't touch you, and resistance rolls with Resolve get an extra die.
special-abilities.ritual.name: Ritual
special-abilities.ritual.description: You can Study and perform rituals to summon supernatural effects or beings, and start with one.
special-abilities.strange-methods.name: Strange Methods
special-abilities.strange-methods.description: Inventing or crafting something arcane improves your result by a level, and you start with one arcane design.
special-abilities.warded.name: Warded
special-abilities.warded.description: Spend your special armor to resist a supernatural consequence, or to push yourself against arcane forces.
special-abilities.warded.options.special-armor.name: 'Mark special armor instead of stress (Warded: pushing against arcane forces)'

special-abilities.sharpshooter.name: 'Sharpshooter'
special-abilities.sharpshooter.description: 'Push yourself to shoot at extreme range, or to lay down suppressing fire.'
special-abilities.focused.name: 'Focused'
special-abilities.focused.description: 'Spend your special armor to resist surprise or mental harm, or to push yourself when shooting or tracking.'
special-abilities.focused.options.special-armor.name: 'Mark special armor instead of stress (Focused: pushing when shooting or tracking)'
special-abilities.scout.name: 'Scout'
special-abilities.scout.description: 'More effect when locating a target, and an extra die to stay hidden from a prepared position.'
special-abilities.tough-as-nails.name: 'Tough as Nails'
special-abilities.tough-as-nails.description: 'Each harm penalty counts as one level less severe; fatal harm is still fatal.'
special-abilities.vengeful.name: 'Vengeful'
special-abilities.vengeful.description: 'You earn xp for getting payback on those who hurt you or yours.'
special-abilities.alchemist.name: 'Alchemist'
special-abilities.alchemist.description: 'Inventing or crafting something alchemical improves your result by a level, and you start with one formula.'
special-abilities.analyst.name: 'Analyst'
special-abilities.analyst.description: 'Each downtime, put two extra ticks on long-term projects about research or new designs.'
special-abilities.artificer.name: 'Artificer'
special-abilities.artificer.description: 'Inventing or crafting something spark-craft improves your result by a level, and you start with one design.'
special-abilities.fortitude.name: 'Fortitude'
special-abilities.fortitude.description: 'Spend your special armor to resist fatigue, weakness or chemicals, or to push yourself on technical or alchemical work.'
special-abilities.fortitude.options.special-armor.name: 'Mark special armor instead of stress (Fortitude: pushing on technical or alchemical work)'
special-abilities.supernatural-ward.name: 'Supernatural Ward'
special-abilities.supernatural-ward.description: 'An area you Wreck with arcane substances becomes repellent or alluring to the supernatural, as you choose.'
special-abilities.saboteur.name: 'Saboteur'
special-abilities.saboteur.description: 'Your Wreck work is quiet, and the damage is hard to spot.'
special-abilities.infiltrator.name: 'Infiltrator'
special-abilities.infiltrator.description: "Quality and Tier don't hinder you when you get past security."
special-abilities.ambush.name: 'Ambush'
special-abilities.ambush.description: 'An extra die when you attack from hiding or spring a trap.'
special-abilities.daredevil.name: 'Daredevil'
special-abilities.daredevil.description: 'On a desperate roll, take an extra die in exchange for one less die to resist what follows.'
special-abilities.devils-footsteps.name: "The Devil's Footsteps"
special-abilities.devils-footsteps.description: 'Push yourself for a near-superhuman athletic feat, or to trick enemies into attacking each other.'
special-abilities.expertise.name: 'Expertise'
special-abilities.expertise.description: 'Pick an action; leading a group action with it costs you at most 1 stress.'
special-abilities.expertise.choices.action.prompt: Choose an action
special-abilities.expertise.choices.action.options.hunt.name: Hunt
special-abilities.expertise.choices.action.options.study.name: Study
special-abilities.expertise.choices.action.options.survey.name: Survey
