special-abilities.reflexes.name: 'Reflexes'
special-abilities.reflexes.description: 'When it matters who acts first, you do.'
special-abilities.shadow.name: 'Shadow'
special-abilities.shadow.description: 'Spend your special armor to resist detection or security, or to push yourself on athletics or stealth.'
special-abilities.shadow.options.special-armor.name: 'Mark special armor instead of stress (Shadow: pushing on athletics or stealth)'
special-abilities.rooks-gambit.name: "Rook's Gambit"
special-abilities.rooks-gambit.description: 'Take 2 stress to roll your best action rating in place of another action.'
special-abilities.rooks-gambit.actions.rooks-gambit.name: "Rook's Gambit"
special-abilities.rooks-gambit.actions.rooks-gambit.steps.pushCost.prompt: How do you pay for pushing yourself?
special-abilities.rooks-gambit.actions.rooks-gambit.options.stress.name: Take 2 stress per push
special-abilities.like-looking-into-a-mirror.name: 'Like Looking into a Mirror'
special-abilities.like-looking-into-a-mirror.description: 'You always know when someone lies to you.'
special-abilities.a-little-something-on-the-side.name: 'A Little Something on the Side'
special-abilities.a-little-something-on-the-side.description: 'You add 2 to your stash at the end of each downtime.'
special-abilities.mesmerism.name: 'Mesmerism'
special-abilities.mesmerism.description: 'Someone you Sway can forget it happened until they next meet you.'
special-abilities.subterfuge.name: 'Subterfuge'
special-abilities.subterfuge.description: 'Spend your special armor to resist suspicion or persuasion, or to push yourself for subterfuge.'
special-abilities.subterfuge.options.special-armor.name: 'Mark special armor instead of stress (Subterfuge: pushing for subterfuge)'
special-abilities.trust-in-me.name: 'Trust in Me'
special-abilities.trust-in-me.description: 'An extra die against someone you have a close relationship with.'
special-abilities.foresight.name: 'Foresight'
special-abilities.foresight.description: 'Twice a score, assist a teammate without paying stress.'
special-abilities.calculating.name: 'Calculating'
special-abilities.calculating.description: 'Give yourself or a crewmate one more downtime activity.'
special-abilities.connected.name: 'Connected'
special-abilities.connected.description: 'Acquiring assets and reducing heat in downtime improve by a result level.'
special-abilities.mastermind.name: 'Mastermind'
special-abilities.mastermind.description: 'Spend your special armor to protect a teammate, or to push yourself on research or a long-term project.'
special-abilities.mastermind.options.special-armor.name: 'Mark special armor instead of stress (Mastermind: pushing on research or a long-term project)'
special-abilities.weaving-the-web.name: 'Weaving the Web'
special-abilities.weaving-the-web.description: "An extra die to Consort for information on a score's target, and to that score's engagement roll."

