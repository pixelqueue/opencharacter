# Every upgrade is an integer (boxes marked), since creation's allocate steps hand out boxes. The
# SRD's examples of a crew type's own upgrades are tagged `upgrade.special` and open to a crew
# without a type.
fields:
  upgrades.lair.carriage:
    { type: integer, input: true, default: 0, min: 0, max: 2, tags: [upgrade] }
  upgrades.lair.boat: { type: integer, input: true, default: 0, min: 0, max: 2, tags: [upgrade] }
  upgrades.lair.hidden: { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.lair.quarters:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.lair.secure: { type: integer, input: true, default: 0, min: 0, max: 2, tags: [upgrade] }
  upgrades.lair.vault: { type: integer, input: true, default: 0, min: 0, max: 2, tags: [upgrade] }
  upgrades.lair.workshop:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }

  # Personal is the SRD's Playbook training.
  upgrades.training.insight:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.training.prowess:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.training.resolve:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.training.personal:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.training.mastery:
    { type: integer, input: true, default: 0, min: 0, max: 4, tags: [upgrade] }

  upgrades.quality.documents:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.quality.gear: { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.quality.implements:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.quality.supplies:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.quality.tools:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }
  upgrades.quality.weapons:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade] }

  upgrades.hardened:
    { type: integer, input: true, default: 0, min: 0, max: 3, tags: [upgrade.special] }
  upgrades.composed:
    { type: integer, input: true, default: 0, min: 0, max: 3, tags: [upgrade.special] }
  upgrades.rigging:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }
  upgrades.prisonContacts:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }
  upgrades.undergroundMaps:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }
  upgrades.camouflage:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }
  upgrades.elite.adepts:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }
  upgrades.elite.rooks:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }
  upgrades.elite.rovers:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }
  upgrades.elite.skulks:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }
  upgrades.elite.thugs:
    { type: integer, input: true, default: 0, min: 0, max: 1, tags: [upgrade.special] }

  upgrades.workshop: { type: boolean, formula: upgrades.lair.workshop >= 1 }
  upgrades.mastery: { type: boolean, formula: upgrades.training.mastery >= 4 }

  quality.documents: { type: integer, formula: tier + upgrades.quality.documents, tags: [quality] }
  quality.gear: { type: integer, formula: tier + upgrades.quality.gear, tags: [quality] }
  quality.implements:
    { type: integer, formula: tier + upgrades.quality.implements, tags: [quality] }
  quality.supplies: { type: integer, formula: tier + upgrades.quality.supplies, tags: [quality] }
  quality.tools: { type: integer, formula: tier + upgrades.quality.tools, tags: [quality] }
  quality.weapons: { type: integer, formula: tier + upgrades.quality.weapons, tags: [quality] }

  members.trauma.bonus: { type: integer, formula: 'upgrades.hardened >= 3 ? 1 : 0' }
  members.stress.bonus: { type: integer, formula: 'upgrades.composed >= 3 ? 1 : 0' }

  rigging.kinds: { type: set, of: string }

  upgrades.marked:
    type: integer
    formula: >-
      sumFields(f.value, 'upgrade' in f.tags || 'upgrade.special' in f.tags)
        + cohorts.boxes
  upgrades.starting: { type: integer, formula: 2 }
  upgrades.earned: { type: integer, formula: 'upgrades.starting + 2 + 2 * advances.upgrades' }

choices:
  - id: rigging
    pick: 'upgrades.rigging > 0 ? 2 : 0'
    from: { values: [documents, gear, implements, supplies, tools, weapons] }
    effects:
      - { target: rigging.kinds, op: grant, value: { formula: pick.value } }

actions:
  - id: relocate-lair
    tags: [downtime]
    available: upgrades.lair.hidden > 0 && coin.current >= tier
    results: [relocated]
    steps:
      - id: pay
        kind: changes
        when: tier > 0
        changes:
          - { type: adjust, field: coin.current, by: -tier }
      - { id: result, kind: outcome, result: "'relocated'" }

constraints:
  - id: upgrade-boxes
    check: upgrades.marked <= upgrades.earned
    data: { marked: upgrades.marked, earned: upgrades.earned }
  - id: special-upgrades
    check: >-
      countPicks(pick.type == 'crewType') == 0
        || sumFields(f.id in crewType.upgrades ? 0 : f.value, 'upgrade.special' in f.tags) == 0

display:
  groups:
    - id: lair
      priority: 1
    - id: training
      priority: 1
    - id: quality
      priority: 1
      members: { type: field, where: "'quality' in item.tags" }
    - id: special-upgrades
      priority: 1
  fields:
    upgrades.lair.carriage: { groups: [lair], priority: 0, input: { widget: track } }
    upgrades.lair.boat: { groups: [lair], priority: 0, input: { widget: track } }
    upgrades.lair.hidden: { groups: [lair], priority: 0, input: { widget: track } }
    upgrades.lair.quarters: { groups: [lair], priority: 0, input: { widget: track } }
    upgrades.lair.secure: { groups: [lair], priority: 0, input: { widget: track } }
    upgrades.lair.vault: { groups: [lair], priority: 0, input: { widget: track } }
    upgrades.lair.workshop: { groups: [lair], priority: 0, input: { widget: track } }
    upgrades.training.insight: { groups: [training], priority: 0, input: { widget: track } }
    upgrades.training.prowess: { groups: [training], priority: 0, input: { widget: track } }
    upgrades.training.resolve: { groups: [training], priority: 0, input: { widget: track } }
    upgrades.training.personal: { groups: [training], priority: 0, input: { widget: track } }
    upgrades.training.mastery: { groups: [training], priority: 0, input: { widget: track } }
    upgrades.quality.documents: { groups: [quality], priority: 1, input: { widget: track } }
    upgrades.quality.gear: { groups: [quality], priority: 1, input: { widget: track } }
    upgrades.quality.implements: { groups: [quality], priority: 1, input: { widget: track } }
    upgrades.quality.supplies: { groups: [quality], priority: 1, input: { widget: track } }
    upgrades.quality.tools: { groups: [quality], priority: 1, input: { widget: track } }
    upgrades.quality.weapons: { groups: [quality], priority: 1, input: { widget: track } }
    quality.documents: { groups: [quality], priority: 2 }
    quality.gear: { groups: [quality], priority: 2 }
    quality.implements: { groups: [quality], priority: 2 }
    quality.supplies: { groups: [quality], priority: 2 }
    quality.tools: { groups: [quality], priority: 2 }
    quality.weapons: { groups: [quality], priority: 2 }
    upgrades.hardened:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.hardened in crewType.upgrades",
      }
    upgrades.composed:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.composed in crewType.upgrades",
      }
    upgrades.rigging:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.rigging in crewType.upgrades",
      }
    rigging.kinds: { groups: [special-upgrades], priority: 2, showWhen: upgrades.rigging > 0 }
    upgrades.prisonContacts:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.prisonContacts in crewType.upgrades",
      }
    upgrades.undergroundMaps:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.undergroundMaps in crewType.upgrades",
      }
    upgrades.camouflage:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.camouflage in crewType.upgrades",
      }
    upgrades.elite.adepts:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.elite.adepts in crewType.upgrades",
      }
    upgrades.elite.rooks:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.elite.rooks in crewType.upgrades",
      }
    upgrades.elite.rovers:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.elite.rovers in crewType.upgrades",
      }
    upgrades.elite.skulks:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.elite.skulks in crewType.upgrades",
      }
    upgrades.elite.thugs:
      {
        groups: [special-upgrades],
        priority: 0,
        input: { widget: track },
        showWhen: "countPicks(pick.type == 'crewType') == 0 || @upgrades.elite.thugs in crewType.upgrades",
      }
    upgrades.workshop: { hidden: true }
    upgrades.mastery: { hidden: true }
    members.trauma.bonus:
      { groups: [special-upgrades], priority: 2, showWhen: members.trauma.bonus != 0 }
    members.stress.bonus:
      { groups: [special-upgrades], priority: 2, showWhen: members.stress.bonus != 0 }
    upgrades.marked: { groups: [advancement], priority: 1, visibility: background }
    upgrades.earned: { groups: [advancement], priority: 1, visibility: background }
    upgrades.starting: { hidden: true }
