contentTypes:
  # `startingUpgrades` are field IDs, qualified at load.
  crewType:
    grantOnly: true
    copies: { max: 0 }
    fields:
      upgrades: { type: set, of: field, required: true }
      startingUpgrades: { type: set, of: field, required: true }
      startingCohort:
        {
          type: enum,
          values: [none, adepts, rooks, rovers, skulks, thugs],
          default: none,
          open: true,
        }
      claims: { type: set, of: claim, default: [] }
    effects:
      - id: starting
        target: upgrades.starting
        op: set
        value: "size(item.startingUpgrades) + (item.startingCohort != 'none' ? 2 : 0)"
  crewAbility:
    grantOnly: true
    effects:
      - target: abilities.crew
        op: grant
        value: { formula: item.id }
  operation:
    grantOnly: true
  contact:
    nameFrom: label
    state:
      label: { type: string, default: '' }
      favorite: { type: boolean, default: false }

fields:
  abilities.crew: { type: set, of: crewAbility }

choices:
  - id: crew-type
    pick: { min: 0, max: 1 }
    required: false
    from: { type: crewType }
  - id: crew-abilities
    pick: "size(picksOf('crew-type')) == 0 ? 1 + advances.abilities : 0"
    from: { type: crewAbility }
  - id: operation
    pick: "size(picksOf('crew-type')) == 0 ? 1 : 0"
    from: { type: operation }

constraints:
  - id: favorite-contact
    check: "countCopies(copy.type == 'contact' && copy.state.favorite) <= 1"

display:
  groups:
    - id: crew-type
      priority: 0
  fields:
    abilities.crew: { hidden: true }
