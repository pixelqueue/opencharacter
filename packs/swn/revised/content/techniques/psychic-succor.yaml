id: techniques.psychic-succor
type: technique
fields:
  discipline: biopsionics
  level: 0
  core: true
# The healing at the biopsion's Biopsionics level, shown on the technique: none at level-0, which
# only stabilizes.
computed:
  healDice:
    type: integer
    formula: '[0, 1, 2, 2, 3][max(0, min(4, skills.biopsionics.level))]'
  healBonus:
    type: integer
    formula: '[0, 1, 2, 6, 8][max(0, min(4, skills.biopsionics.level))]'
actions:
  # Heals and adds System Strain to the target: two points if they were mortally wounded. The
  # first use in a scene Commits Effort for the day (none with Mastered Succor); later uses in
  # the scene are free. A target whose System Strain can't take it isn't helped.
  - id: succor
    tags: [psionics]
    available: psionics.masteredSuccor || scene.succor || effort.available > 0
    params:
      mortallyWounded: { type: boolean, default: false }
    participants:
      target:
        max: 1
        fields:
          strain.total: { type: integer }
          strain.max: { type: integer }
    results: [healed, failed]
    steps:
      - id: strained
        kind: outcome
        when: >-
          size(participants.target) > 0 && has(participants.target[0].strain.total)
            && has(participants.target[0].strain.max)
            && participants.target[0].strain.total + (params.mortallyWounded ? 2 : 1)
              > participants.target[0].strain.max
        result: "'failed'"
      # Torched Effort lasts only for the scene, whatever it is Committed for.
      - id: source
        kind: branch
        cases:
          - when: true
            flags:
              pay: '!psionics.masteredSuccor && !scene.succor'
              day: effort.max - effort.scene - effort.day - effort.active > 0
      - id: commit
        kind: changes
        when: flags.pay
        changes:
          - { type: adjust, field: effort.day, by: 1, when: flags.day }
          - { type: adjust, field: effort.scene, by: 1, when: '!flags.day' }
          - { type: set, field: scene.succor, value: true }
      - id: heal
        kind: roll
        when: self.healDice > 0
        tags: [healing]
        parts:
          - dice: (self.healDice)d6
          - value: self.healBonus
      - id: apply
        kind: changes
        to: target
        changes:
          - type: adjust
            when: has(steps.heal)
            field: hp.current
            by: steps.heal.total
            tags: [healing]
          - { type: adjust, field: strain.current, by: 'params.mortallyWounded ? 2 : 1' }
      - id: result
        kind: outcome
        result: "'healed'"
        data: { healed: 'has(steps.heal) ? steps.heal.total : 0' }
