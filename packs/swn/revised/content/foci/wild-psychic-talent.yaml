id: foci.wild-psychic-talent
type: focus
tags: [no-psionics]
fields:
  kind: psychic
  skill: none
prerequisites:
  - id: not-psychic
    when: "psionics.access == 'none'"
effects:
  - { target: effort.wild, op: atLeast, value: self.level }
choices:
  - id: power
    from: { type: technique, where: item.level <= 1 }
    waivePrerequisites: true
    recommend: >-
      @techniques.telekinetic-manipulation in options ? @techniques.telekinetic-manipulation
        : options[0]
  - id: second
    when: self.level >= 2
    from: { type: technique, where: item.level <= 1 }
    waivePrerequisites: true
    recommend: >-
      @techniques.telekinetic-armory in options ? @techniques.telekinetic-armory : options[0]
