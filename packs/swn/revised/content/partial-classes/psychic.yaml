id: partial-classes.psychic
type: partialClass
effects:
  - { target: psionics.access, op: set, value: "'restricted'" }
choices:
  - id: discipline
    from:
      { values: [biopsionics, metapsionics, precognition, telekinesis, telepathy, teleportation] }
    recommend: "'biopsionics'"
    effects:
      - { target: psionics.discipline, op: set, value: pick.value }
grants:
  # Each discipline the psychic has grants its core technique, an add-on's discipline too.
  - forEach: keysOf('psychic')
    when: "fieldOf('skills.{psychic}.level', x) >= 0"
    item: { query: { type: technique, where: item.core && item.discipline == x } }
