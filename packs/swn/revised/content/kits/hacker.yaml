          - { type: addItem, entry: { item: "'gear.postech-toolkit'" } }
          - { type: addItem, entry: { item: "'gear.spare-parts'", quantity: 3 } }
          - { type: addItem, entry: { item: "'gear.power-cell-a'", quantity: 2 } }
          - { type: addItem, entry: { item: "'gear.dataslab'" } }
          - { type: addItem, entry: { item: "'gear.metatool'" } }
          - { type: addItem, entry: { item: "'gear.line-shunt'", quantity: 2 } }
          - { type: set, field: credits.current, value: 100 }
