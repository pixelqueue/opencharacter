id: kits.soldier
type: kit
actions:
  - id: unpack
    listed: false
    steps:
      - id: gear
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'weapons.combat-rifle'", equipped: true } }
          - { type: addItem, entry: { item: "'armor.woven-body-armor'", equipped: true } }
          - { type: addItem, entry: { item: "'weapons.knife'", equipped: true } }
          - { type: addItem, entry: { item: "'gear.ammo-20-rounds'", quantity: 4 } }
          - { type: addItem, entry: { item: "'gear.backpack-tl0'", equipped: true } }
          - { type: addItem, entry: { item: "'gear.compad'" } }
          - { type: set, field: credits.current, value: 100 }
