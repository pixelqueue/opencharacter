id: kits.blade
type: kit
actions:
  - id: unpack
    listed: false
    steps:
      - id: gear
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'weapons.monoblade-sword'", equipped: true } }
          - { type: addItem, entry: { item: "'armor.woven-body-armor'", equipped: true } }
          - { type: addItem, entry: { item: "'armor.secure-clothing'" } }
          - { type: addItem, entry: { item: "'weapons.thermal-knife'", equipped: true } }
          - { type: addItem, entry: { item: "'gear.backpack-tl0'", equipped: true } }
          - { type: addItem, entry: { item: "'gear.compad'" } }
          - { type: addItem, entry: { item: "'gear.lazarus-patch'" } }
          - { type: set, field: credits.current, value: 50 }
