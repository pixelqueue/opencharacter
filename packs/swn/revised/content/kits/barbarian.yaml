id: kits.barbarian
type: kit
actions:
  - id: unpack
    listed: false
    steps:
      - id: gear
        kind: changes
        changes:
          - { type: addItem, entry: { item: "'weapons.spear'", equipped: true } }
          - { type: addItem, entry: { item: "'armor.light-primitive-armor'", equipped: true } }
          - { type: addItem, entry: { item: "'armor.shield'", equipped: true } }
          - { type: addItem, entry: { item: "'weapons.knife'", equipped: true } }
          - { type: addItem, entry: { item: "'gear.backpack-tl0'", equipped: true } }
          - { type: addItem, entry: { item: "'gear.rations-1-day'", quantity: 7 } }
          - { type: addItem, entry: { item: "'gear.rope-tl0'" } }
          - { type: set, field: credits.current, value: 500 }
