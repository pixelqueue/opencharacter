id: classes.psychic
type: class
fields:
  kit: kits.medic
effects:
  - { target: psionics.access, op: set, value: "'unrestricted'" }
grants:
  # Each discipline the psychic has grants its core technique, an add-on's discipline too.
  - forEach: keysOf('psychic')
    when: "fieldOf('skills.{psychic}.level', x) >= 0"
    item: { query: { type: technique, where: item.core && item.discipline == x } }
