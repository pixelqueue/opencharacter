id: classes.warrior
type: class
fields:
  kit: kits.soldier
effects:
  - { target: class.focus.combat, op: add, value: 1 }
  - { target: hp.perLevel, op: add, value: 2 }
  - { target: combat.attackBonus, op: set, value: level }
  # Once a scene: a missed attack hits. Or a hit against the warrior is negated: the
  # `warriorLuck` situational choice (rules/combat.yaml).
  - target: { choices: [missed-attack] }
    op: option
    when: '!scene.warriorLuck'
    value:
      id: luck
      flags: { hit: true }
      changes:
        - { type: set, field: scene.warriorLuck, value: true }
