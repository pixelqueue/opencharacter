# Two ways to start: the full procedure (attributes rolled or from the array, a background with
# its skills picked, taken as quick skills or rolled, a class, foci and a hobby skill) and the
# quick tables (class and style, background, psychic disciplines, foci and bonus skill, each
# rolled or picked). The quick tables are the book's random creation.
creation:
  - { id: standard, action: create-character }
  - { id: quick, action: quick-character }
  - { id: random, action: quick-character, params: { random: true }, random: true }

actions:
  # One skill pick at creation: a skill's first pick is level-0, the second level-1, and a third
  # is any other non-psychic skill below level-1. Also the attribute picks of the Growth table.
  - id: gain-skill
    tags: [creation]
    params:
      entry:
        {
          type: enum,
          required: true,
          values:
            [
              administer,
              connect,
              exert,
              fix,
              heal,
              know,
              lead,
              notice,
              perform,
              pilot,
              program,
              punch,
              shoot,
              sneak,
              stab,
              survive,
              talk,
              trade,
              work,
              biopsionics,
              metapsionics,
              precognition,
              telekinesis,
              telepathy,
              teleportation,
              any-combat,
              any-skill,
              stab-or-shoot,
              shoot-or-trade,
              punch-or-stab,
              any-psychic,
              raise-zero,
              any-stat,
              physical,
              mental,
              none,
            ],
        }
      random: { type: boolean, default: false }
    results: [gained]
    steps:
      - id: start
        kind: branch
        sheet: proposed
        cases:
          - when: true
            flags:
              stat: "params.entry in ['any-stat', 'physical', 'mental']"
              pool: >-
                params.entry == 'any-combat' ? ['punch', 'shoot', 'stab']
                  : params.entry == 'stab-or-shoot' ? ['stab', 'shoot']
                  : params.entry == 'shoot-or-trade' ? ['shoot', 'trade']
                  : params.entry == 'punch-or-stab' ? ['punch', 'stab']
                  : params.entry == 'any-psychic' ? keysOf('psychic')
                  : params.entry == 'any-skill' ? keysOf('general') + keysOf('combat')
                  : params.entry == 'raise-zero'
                    ? filterList(keysOf('general') + keysOf('combat'),
                      fieldOf('skills.{skill}.level', x) == 0)
                  : params.entry in keysOf('skill') ? [params.entry] : []
              str: 0
              dex: 0
              con: 0
              int: 0
              wis: 0
              cha: 0
      - id: candidates
        kind: branch
        sheet: proposed
        cases:
          - when: true
            flags:
              open: >-
                flags.stat || params.entry == 'none' ? []
                  : countList(flags.pool, fieldOf('skills.{skill}.level', x) < 1) > 0
                    ? filterList(flags.pool, fieldOf('skills.{skill}.level', x) < 1)
                  : filterList(keysOf('general') + keysOf('combat'),
                    fieldOf('skills.{skill}.level', x) < 1)
      - id: choose
        kind: choice
        when: size(flags.open) > 1
        random: params.random
        recommend: flags.open[0]
        options:
          - { id: administer, when: "'administer' in flags.open" }
          - { id: connect, when: "'connect' in flags.open" }
          - { id: exert, when: "'exert' in flags.open" }
          - { id: fix, when: "'fix' in flags.open" }
          - { id: heal, when: "'heal' in flags.open" }
          - { id: know, when: "'know' in flags.open" }
          - { id: lead, when: "'lead' in flags.open" }
          - { id: notice, when: "'notice' in flags.open" }
          - { id: perform, when: "'perform' in flags.open" }
          - { id: pilot, when: "'pilot' in flags.open" }
          - { id: program, when: "'program' in flags.open" }
          - { id: punch, when: "'punch' in flags.open" }
          - { id: shoot, when: "'shoot' in flags.open" }
          - { id: sneak, when: "'sneak' in flags.open" }
          - { id: stab, when: "'stab' in flags.open" }
          - { id: survive, when: "'survive' in flags.open" }
          - { id: talk, when: "'talk' in flags.open" }
          - { id: trade, when: "'trade' in flags.open" }
          - { id: work, when: "'work' in flags.open" }
          - { id: biopsionics, when: "'biopsionics' in flags.open" }
          - { id: metapsionics, when: "'metapsionics' in flags.open" }
          - { id: precognition, when: "'precognition' in flags.open" }
          - { id: telekinesis, when: "'telekinesis' in flags.open" }
          - { id: telepathy, when: "'telepathy' in flags.open" }
          - { id: teleportation, when: "'teleportation' in flags.open" }
      - id: picked
        kind: branch
        cases:
          - when: true
            flags:
              skill: "size(flags.open) == 1 ? flags.open[0] : has(steps.choose) ? steps.choose.picked : ''"
      - id: gain
        kind: changes
        when: flags.skill != ''
        changes:
          - { type: adjust, field: { formula: "'skills.' + flags.skill + '.level'" }, by: 1 }
      # A psychic skill raised to level-1 brings a level-1 technique of its discipline.
      - id: technique
        kind: choice
        sheet: proposed
        when: "flags.skill in keysOf('psychic') && fieldOf('skills.{psychic}.level', flags.skill) >= 1"
        random: params.random
        recommend: options[0]
        options:
          content:
            type: technique
            where: >-
              item.discipline == flags.skill && !item.core
                && item.level <= fieldOf('skills.{psychic}.level', flags.skill)
                && countCopies(copy.item == item.id) == 0
        changes:
          - { type: addItem, entry: { item: picked.id } }
      - id: attribute
        kind: choice
        sheet: proposed
        when: flags.stat
        random: params.random
        recommend: options[0]
        options:
          - {
              id: str,
              when: "params.entry == 'any-stat' && attributes.str.score < 18",
              flags: { str: 1 },
            }
          - {
              id: dex,
              when: "params.entry == 'any-stat' && attributes.dex.score < 18",
              flags: { dex: 1 },
            }
          - {
              id: con,
              when: "params.entry == 'any-stat' && attributes.con.score < 18",
              flags: { con: 1 },
            }
          - {
              id: int,
              when: "params.entry == 'any-stat' && attributes.int.score < 18",
              flags: { int: 1 },
            }
          - {
              id: wis,
              when: "params.entry == 'any-stat' && attributes.wis.score < 18",
              flags: { wis: 1 },
            }
          - {
              id: cha,
              when: "params.entry == 'any-stat' && attributes.cha.score < 18",
              flags: { cha: 1 },
            }
          - { id: str2, when: "params.entry == 'physical'", flags: { str: 2 } }
          - { id: dex2, when: "params.entry == 'physical'", flags: { dex: 2 } }
          - { id: con2, when: "params.entry == 'physical'", flags: { con: 2 } }
          - { id: str-dex, when: "params.entry == 'physical'", flags: { str: 1, dex: 1 } }
          - { id: str-con, when: "params.entry == 'physical'", flags: { str: 1, con: 1 } }
          - { id: dex-con, when: "params.entry == 'physical'", flags: { dex: 1, con: 1 } }
          - { id: int2, when: "params.entry == 'mental'", flags: { int: 2 } }
          - { id: wis2, when: "params.entry == 'mental'", flags: { wis: 2 } }
          - { id: cha2, when: "params.entry == 'mental'", flags: { cha: 2 } }
          - { id: int-wis, when: "params.entry == 'mental'", flags: { int: 1, wis: 1 } }
          - { id: int-cha, when: "params.entry == 'mental'", flags: { int: 1, cha: 1 } }
          - { id: wis-cha, when: "params.entry == 'mental'", flags: { wis: 1, cha: 1 } }
      - id: raise
        kind: changes
        sheet: proposed
        when: flags.stat
        changes:
          - {
              type: set,
              field: attributes.str.score,
              value: 'min(18, attributes.str.score + flags.str)',
              when: flags.str > 0,
            }
          - {
              type: set,
              field: attributes.dex.score,
              value: 'min(18, attributes.dex.score + flags.dex)',
              when: flags.dex > 0,
            }
          - {
              type: set,
              field: attributes.con.score,
              value: 'min(18, attributes.con.score + flags.con)',
              when: flags.con > 0,
            }
          - {
              type: set,
              field: attributes.int.score,
              value: 'min(18, attributes.int.score + flags.int)',
              when: flags.int > 0,
            }
          - {
              type: set,
              field: attributes.wis.score,
              value: 'min(18, attributes.wis.score + flags.wis)',
              when: flags.wis > 0,
            }
          - {
              type: set,
              field: attributes.cha.score,
              value: 'min(18, attributes.cha.score + flags.cha)',
              when: flags.cha > 0,
            }
      - id: result
        kind: outcome
        result: "'gained'"
        data: { skill: flags.skill }

  # A focus level: a new focus, or the next level of one already held. A new focus's bonus skill
  # is a skill pick at creation and three skill points on advancement.
  - id: gain-focus
    tags: [creation, level-up]
    params:
      kind: { type: enum, values: [any, combat, noncombat], default: any }
      # The new copy's instance ID.
      copy:
        {
          type: enum,
          required: true,
          values:
            [
              focus-1,
              focus-2,
              focus-3,
              focus-level-2,
              focus-level-5,
              focus-level-7,
              focus-level-10,
            ],
        }
      advancement: { type: boolean, default: false }
      random: { type: boolean, default: false }
    results: [gained]
    steps:
      - id: focus
        kind: choice
        sheet: proposed
        random: params.random
        recommend: options[0]
        options:
          content:
            type: focus
            where: >-
              (params.kind == 'any' || item.kind == params.kind)
                && (item.id != @foci.psychic-training || psionics.access != 'none')
                && (item.id != @foci.wild-psychic-talent || psionics.access == 'none')
                && (item.repeatable || countCopies(copy.item == item.id
                  && copy.state.level >= item.maxLevel) == 0)
        changes:
          - type: adjustState
            when: '!steps.focus.item.repeatable && countCopies(copy.item == picked.id) > 0'
            copies: { type: focus, where: item.id == steps.focus.picked }
            limit: 1
            key: level
            by: 1
          - type: addItem
            when: >-
              params.copy == 'focus-1' && (steps.focus.item.repeatable
                || countCopies(copy.item == picked.id) == 0)
            entry: { id: focus-1, item: picked.id }
          - type: addItem
            when: >-
              params.copy == 'focus-2' && (steps.focus.item.repeatable
                || countCopies(copy.item == picked.id) == 0)
            entry: { id: focus-2, item: picked.id }
          - type: addItem
            when: >-
              params.copy == 'focus-3' && (steps.focus.item.repeatable
                || countCopies(copy.item == picked.id) == 0)
            entry: { id: focus-3, item: picked.id }
          - type: addItem
            when: >-
              params.copy == 'focus-level-2' && (steps.focus.item.repeatable
                || countCopies(copy.item == picked.id) == 0)
            entry: { id: focus-level-2, item: picked.id }
          - type: addItem
            when: >-
              params.copy == 'focus-level-5' && (steps.focus.item.repeatable
                || countCopies(copy.item == picked.id) == 0)
            entry: { id: focus-level-5, item: picked.id }
          - type: addItem
            when: >-
              params.copy == 'focus-level-7' && (steps.focus.item.repeatable
                || countCopies(copy.item == picked.id) == 0)
            entry: { id: focus-level-7, item: picked.id }
          - type: addItem
            when: >-
              params.copy == 'focus-level-10' && (steps.focus.item.repeatable
                || countCopies(copy.item == picked.id) == 0)
            entry: { id: focus-level-10, item: picked.id }
      - id: picks
        kind: choice
        sheet: proposed
        when: countCopies(copy.id == params.copy) > 0
        random: params.random
        options: { pending: { entry: params.copy } }
      - id: bonus
        kind: branch
        sheet: proposed
        cases:
          - when: true
            flags:
              entry: >-
                countCopies(copy.id == params.copy) == 0 ? 'none'
                  : steps.focus.item.skill != 'chosen' ? steps.focus.item.skill
                  : size(steps.picks.picked) > 0 ? steps.picks.picked[0] : 'any-skill'
      - id: skill
        kind: action
        when: "!params.advancement && flags.entry != 'none'"
        use: gain-skill
        params: { entry: flags.entry, random: params.random }
      - id: points
        kind: action
        when: "params.advancement && flags.entry != 'none'"
        use: focus-skill-points
        params: { entry: flags.entry, random: params.random }
      - { id: result, kind: outcome, result: "'gained'" }

  - id: starting-gear
    tags: [creation]
    params:
      random: { type: boolean, default: false }
    results: [equipped]
    steps:
      - id: kit
        kind: choice
        random: params.random
        recommend: >-
          countCopies(copy.item == @classes.warrior) > 0 ? 'soldier'
            : countCopies(copy.item == @classes.psychic) > 0 ? 'medic'
            : countCopies(copy.item == @classes.expert) > 0 ? 'technician' : 'gunslinger'
