# Two ways to start: the full procedure (attributes rolled or from the array, a background with
# its skills picked, taken as quick skills or rolled, a class, foci and a hobby skill) and the
# quick tables (class and style, background, psychic disciplines, foci and bonus skill, each
# rolled or picked). The quick tables are the book's random creation.
creation:
  - { id: standard, action: create-character }
  - { id: quick, action: quick-character }
  - { id: random, action: quick-character, params: { random: true }, random: true }

actions:
  # One skill pick at creation: a skill's first pick is level-0, the second level-1, and a third
  # is any other non-psychic skill below level-1. Also the attribute picks of the Growth table.
  - id: gain-skill
    tags: [creation]
    params:
      entry:
        {
          type: enum,
          open: true,
          required: true,
          values:
            [
              administer,
              connect,
              exert,
              fix,
              heal,
              know,
              lead,
              notice,
              perform,
              pilot,
              program,
              punch,
              shoot,
              sneak,
              stab,
              survive,
              talk,
              trade,
              work,
              biopsionics,
              metapsionics,
              precognition,
              telekinesis,
              telepathy,
              teleportation,
              any-combat,
              any-skill,
              stab-or-shoot,
              shoot-or-trade,
              punch-or-stab,
              any-psychic,
              raise-zero,
              any-stat,
              physical,
              mental,
              none,
            ],
        }
      random: { type: boolean, default: false }
    results: [gained]
    steps:
      - id: start
        kind: branch
        sheet: proposed
        cases:
          - when: true
            flags:
              stat: "params.entry in ['any-stat', 'physical', 'mental']"
              pool: >-
                params.entry == 'any-combat' ? ['punch', 'shoot', 'stab']
                  : params.entry == 'stab-or-shoot' ? ['stab', 'shoot']
                  : params.entry == 'shoot-or-trade' ? ['shoot', 'trade']
                  : params.entry == 'punch-or-stab' ? ['punch', 'stab']
                  : params.entry == 'any-psychic' ? keysOf('psychic')
                  : params.entry == 'any-skill' ? keysOf('general') + keysOf('combat')
                  : params.entry == 'raise-zero'
                    ? filterList(keysOf('general') + keysOf('combat'),
                      fieldOf('skills.{skill}.level', x) == 0)
                  : params.entry in keysOf('skill') ? [params.entry] : []
              str: 0
              dex: 0
              con: 0
              int: 0
              wis: 0
              cha: 0
      - id: candidates
        kind: branch
        sheet: proposed
        cases:
          - when: true
            flags:
              open: >-
                flags.stat || params.entry == 'none' ? []
                  : countList(flags.pool, fieldOf('skills.{skill}.level', x) < 1) > 0
                    ? filterList(flags.pool, fieldOf('skills.{skill}.level', x) < 1)
                  : filterList(keysOf('general') + keysOf('combat'),
                    fieldOf('skills.{skill}.level', x) < 1)
      - id: choose
        kind: choice
        when: size(flags.open) > 1
        random: params.random
        recommend: flags.open[0]
        options: { values: { formula: flags.open } }
      - id: picked
        kind: branch
        cases:
          - when: true
            flags:
              skill: "size(flags.open) == 1 ? flags.open[0] : has(steps.choose) ? steps.choose.picked : ''"
      - id: gain
        kind: changes
        when: flags.skill != ''
        changes:
          - {
              type: adjust,
              field: { formula: "fieldId('skills.{skill}.level', flags.skill)" },
              by: 1,
            }
      # A psychic skill raised to level-1 brings a level-1 technique of its discipline.
      - id: technique
        kind: choice
        sheet: proposed
        when: "flags.skill in keysOf('psychic') && fieldOf('skills.{psychic}.level', flags.skill) >= 1"
        random: params.random
        recommend: options[0]
        options:
          content:
            type: technique
            where: >-
              item.discipline == flags.skill && !item.core
                && item.level <= fieldOf('skills.{psychic}.level', flags.skill)
                && countCopies(copy.item == item.id) == 0
        changes:
          - { type: addItem, entry: { item: picked.id } }
      # +1 to any attribute below 18, or one of the +2 pairs of the physical or mental ones.
      - id: attribute
        kind: choice
        sheet: proposed
        when: "params.entry == 'any-stat'"
        random: params.random
        recommend: options[0]
        options:
          values:
            { formula: "filterList(keysOf('attr'), fieldOf('attributes.{attr}.score', x) < 18)" }
        changes:
          - type: set
            field: { formula: "'attributes.' + picked.value + '.score'" }
            value: "fieldOf('attributes.{attr}.score', picked.value) + 1"
      - id: pair
        kind: choice
        sheet: proposed
        when: "params.entry in ['physical', 'mental']"
        random: params.random
        recommend: options[0]
        options:
          - { id: str2, when: "params.entry == 'physical'", flags: { str: 2 } }
          - { id: dex2, when: "params.entry == 'physical'", flags: { dex: 2 } }
          - { id: con2, when: "params.entry == 'physical'", flags: { con: 2 } }
          - { id: str-dex, when: "params.entry == 'physical'", flags: { str: 1, dex: 1 } }
          - { id: str-con, when: "params.entry == 'physical'", flags: { str: 1, con: 1 } }
          - { id: dex-con, when: "params.entry == 'physical'", flags: { dex: 1, con: 1 } }
          - { id: int2, when: "params.entry == 'mental'", flags: { int: 2 } }
          - { id: wis2, when: "params.entry == 'mental'", flags: { wis: 2 } }
          - { id: cha2, when: "params.entry == 'mental'", flags: { cha: 2 } }
          - { id: int-wis, when: "params.entry == 'mental'", flags: { int: 1, wis: 1 } }
          - { id: int-cha, when: "params.entry == 'mental'", flags: { int: 1, cha: 1 } }
          - { id: wis-cha, when: "params.entry == 'mental'", flags: { wis: 1, cha: 1 } }
      - id: raise
        kind: changes
        sheet: proposed
        when: has(steps.pair)
        changes:
          - type: set
            when: flags.str > 0
            field: attributes.str.score
            value: 'min(18, attributes.str.score + flags.str)'
          - type: set
            when: flags.dex > 0
            field: attributes.dex.score
            value: 'min(18, attributes.dex.score + flags.dex)'
          - type: set
            when: flags.con > 0
            field: attributes.con.score
            value: 'min(18, attributes.con.score + flags.con)'
          - type: set
            when: flags.int > 0
            field: attributes.int.score
            value: 'min(18, attributes.int.score + flags.int)'
          - type: set
            when: flags.wis > 0
            field: attributes.wis.score
            value: 'min(18, attributes.wis.score + flags.wis)'
          - type: set
            when: flags.cha > 0
            field: attributes.cha.score
            value: 'min(18, attributes.cha.score + flags.cha)'
      - id: result
        kind: outcome
        result: "'gained'"
        data: { skill: flags.skill }

  # A focus level: a new focus, or the next level of one already held. A new focus's bonus skill
  # is a skill pick at creation and three skill points on advancement.
  - id: gain-focus
    tags: [creation, level-up]
    params:
      kind: { type: enum, values: [any, combat, noncombat], default: any }
      advancement: { type: boolean, default: false }
      random: { type: boolean, default: false }
    results: [gained]
    steps:
      - id: focus
        kind: choice
        tags: [{ formula: "params.advancement ? 'level-up.focus' : 'creation.focus'" }]
        sheet: proposed
        random: params.random
        recommend: options[0]
        options:
          content:
            type: focus
            where: >-
              (params.kind == 'any' || item.kind == params.kind)
                && !('needs-psionics' in item.tags && psionics.access == 'none')
                && !('no-psionics' in item.tags && psionics.access != 'none')
                && (item.repeatable || countCopies(copy.item == item.id
                  && copy.state.level >= item.maxLevel) == 0)
        changes:
          - type: adjustState
            when: >-
              has(picked.item) && !picked.item.repeatable
                && countCopies(copy.item == picked.id) > 0
            copies: { type: focus, where: item.id == steps.focus.picked }
            limit: 1
            key: level
            by: 1
          - type: addItem
            when: >-
              has(picked.item)
                && (picked.item.repeatable || countCopies(copy.item == picked.id) == 0)
            entry: { item: picked.id }
      - id: picks
        kind: choice
        sheet: proposed
        when: size(steps.focus.added) > 0
        random: params.random
        options: { pending: { entry: 'steps.focus.added[0]' } }
      - id: bonus
        kind: branch
        sheet: proposed
        cases:
          - when: true
            flags:
              entry: >-
                size(steps.focus.added) == 0 ? 'none'
                  : steps.focus.item.skill != 'chosen' ? steps.focus.item.skill
                  : size(steps.picks.picked) > 0 ? steps.picks.picked[0] : 'any-skill'
      - id: skill
        kind: action
        when: "!params.advancement && flags.entry != 'none'"
        use: gain-skill
        params: { entry: flags.entry, random: params.random }
      - id: points
        kind: action
        when: "params.advancement && flags.entry != 'none'"
        use: focus-skill-points
        params: { entry: flags.entry, random: params.random }
      - { id: result, kind: outcome, result: "'gained'" }

  - id: starting-gear
    tags: [creation]
    params:
      random: { type: boolean, default: false }
    results: [equipped]
    steps:
      # A package (an add-on pack's too), or credits instead: the class's own package is
      # recommended. The package's own action adds its gear and credits.
      - id: kit
        tags: [creation.kit]
        kind: choice
        sheet: proposed
        random: params.random
        options: { content: { type: kit } }
        prefer: "countCopies(copy.type == 'class' && copy.fields.kit == item.id)"
        changes:
          - type: addItem
            when: has(picked.item)
            entry: { id: kit, item: picked.id }
      - id: unpack
        kind: action
        when: has(steps.kit.item)
        sheet: proposed
        entry: "'kit'"
        use: unpack
      - id: unpacked
        kind: changes
        when: has(steps.kit.item)
        changes:
          - { type: removeItem, entry: kit }
      # A kit may ready more than half Strength. Readied gear, then all but one weapon (the
      # weakest first), are stowed while they fit within Strength, so play starts within the
      # limits where the kit allows; armor stays worn.
      - id: stowGear
        kind: choice
        sheet: proposed
        repeat: { max: 20, min: 20 }
        options:
          copies:
            type: gear
            where: >-
              self.equipped && has(item.enc) && item.enc > 0
                && encumbrance.readied > encumbrance.readiedLimit
                && encumbrance.stowed + item.enc * ceil(self.quantity / item.bundle)
                  <= encumbrance.stowedLimit
        prefer: item.enc
        changes:
          - { type: equip, entry: picked, equipped: false }
      - id: stowWeapon
        kind: choice
        sheet: proposed
        repeat: { max: 20, min: 20 }
        options:
          copies:
            type: weapon
            where: >-
              self.equipped && has(item.enc) && item.enc > 0
                && countCopies(copy.type == 'weapon' && copy.equipped && has(copy.fields.enc)
                  && copy.fields.enc > 0) > 1
                && encumbrance.readied > encumbrance.readiedLimit
                && encumbrance.stowed + item.enc * ceil(self.quantity / item.bundle)
                  <= encumbrance.stowedLimit
        prefer: -maxOf(item.damage)
        changes:
          - { type: equip, entry: picked, equipped: false }
      - { id: result, kind: outcome, result: "'equipped'" }
