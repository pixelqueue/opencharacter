settings:
  rounding: floor

families:
  attribute: [str, dex, con, wis, int, cha]
  factLevel: [2, 3, 4, 5, 6, 7, 8, 9, 10]

fields:
  # The rolled or assigned score is the base; Words and gifts raise the score.
  'attributes.{attribute}.base':
    { type: integer, input: true, default: 10, min: 3, max: 18, tags: [attribute-base] }
  'attributes.{attribute}.score':
    type: integer
    formula: 'attributes.{attribute}.base'
    tags: [attribute, 'attr.{attribute}']
  # A score of 19 (the Word of Might) is +4.
  'attributes.{attribute}.mod':
    type: integer
    formula: >-
      attributes.{attribute}.score <= 3 ? -3
        : attributes.{attribute}.score <= 5 ? -2
        : attributes.{attribute}.score <= 8 ? -1
        : attributes.{attribute}.score <= 12 ? 0
        : attributes.{attribute}.score <= 15 ? 1
        : attributes.{attribute}.score <= 17 ? 2
        : attributes.{attribute}.score == 18 ? 3 : 4
    tags: [attribute-mod, 'attr.{attribute}']
  'attributes.{attribute}.check':
    type: integer
    formula: '21 - attributes.{attribute}.score'
    tags: [attribute-check, 'attr.{attribute}']

  facts.origin: { type: string, input: true, default: '' }
  facts.career: { type: string, input: true, default: '' }
  facts.relationship: { type: string, input: true, default: '' }
  # One more Fact each level.
  'facts.level{factLevel}': { type: string, input: true, default: '' }
  goal: { type: string, input: true, default: '' }

  level: { type: integer, input: true, default: 1, min: 1, max: 10 }
  xp.current: { type: integer, input: true, default: 0, min: 0 }
  # Experience and Dominion spent the next level needs.
  xp.next:
    type: integer
    formula: 'level >= 10 ? 0 : [3, 6, 12, 24, 48, 72, 96, 130, 170][level - 1]'
  dominion.current: { type: integer, input: true, default: 0, min: 0 }
  dominion.spent: { type: integer, input: true, default: 0, min: 0 }
  dominion.next:
    type: integer
    formula: 'level >= 10 ? 0 : [2, 4, 10, 22, 38, 57, 76, 95, 124][level - 1]'
  # A free divinity has no worshipers and no gifts of Apotheosis, and gains Dominion each month.
  apotheosis.free: { type: boolean, input: true, default: false }
  dominion.monthly:
    type: integer
    formula: 'apotheosis.free && level >= 2 ? 1 + floor(level / 3) : 0'
  wealth.current: { type: integer, input: true, default: 0, min: 0 }

  influence.max: { type: integer, formula: 2 + (level - 1) }
  influence.committed: { type: integer, input: true, default: 0, min: 0 }
  influence.free: { type: integer, formula: influence.max - influence.committed }

followUps:
  - id: level-up
    while: '!character.creating && level < 10 && xp.current >= xp.next && dominion.spent >= dominion.next'
    action: level-up

constraints:
  - id: influence-limit
    check: influence.committed <= influence.max
