id: abilities.giant.fire-giant-chief.burning-kick
type: ability
grantOnly: false
tags:
  - kw.charge
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  distanceKind: melee
  distance: 4
  rollBonus: 5
  t1Damage: 14
  t1AddsChar: false
  t1Move: push
  t1MoveDistance: 5
  t2Damage: 19
  t2AddsChar: false
  t2Move: push
  t2MoveDistance: 10
  t3Damage: 23
  t3AddsChar: false
  t3Move: push
  t3MoveDistance: 15
# A < 3/4/5 by tier: 9 more fire damage.
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 9
    tags: [damage.fire]
    when: >-
      flags.tier > 0 && participant.characteristics.agility.score + participant.potency.resistBonus.agility
        < [3, 4, 5][flags.tier - 1] + steps.roll.tallies.potencyBonus
