# Each target makes an Agility or an Intuition test (they pick: `either-test`). The ability makes
# its own hand-off, so tier 1 can land prone (no duration) and weakened (save ends) as two entries;
# the tier fields stay empty, so the pack's target-test and fixed-effect rules land nothing.
id: abilities.giant.fire-giant-chief.roiling-fist
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.ranged
  - kw.weapon
  - target-test
fields:
  usage: main-action
  kind: signature
  distanceKind: cube
  distance: 3
  within: 4
  damageType: fire
effects:
  - target: { steps: [ability.hit], from: self }
    op: action
    value:
      id: roiling-fist-test
      use: either-test
      as: participant
      params: { first: "'agility'", second: "'intuition'" }
      changes:
        - type: adjust
          field: stamina.current
          by: '-[18, 14, 9][min(3, max(1, run.data.tier)) - 1]'
          tags: [damage, damage.fire]
        - type: applyEffect
          when: run.data.tier <= 2
          source: '@conditions.prone'
          appliedBy: character.id
        - type: applyEffect
          when: run.data.tier <= 1
          source: '@conditions.weakened'
          state: { duration: "'save'" }
          appliedBy: character.id
