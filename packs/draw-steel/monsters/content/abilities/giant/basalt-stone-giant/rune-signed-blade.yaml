# A target already slowed stays slowed and has speed 0 until the end of their next turn (applied as
# the target's own, so 'next-end' ends it then).
id: abilities.giant.basalt-stone-giant.rune-signed-blade
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 3
  rollBonus: 4
  t1Damage: 12
  t1AddsChar: false
  t1Condition: conditions.slowed
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 2
  t2Damage: 17
  t2AddsChar: false
  t2Condition: conditions.slowed
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 3
  t3Damage: 21
  t3AddsChar: false
  t3Condition: conditions.slowed
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 4
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.common.speed-zero'
          state: { duration: "'next-end'" }
          appliedBy: participant.id
    when: flags.tier > 0 && participant.conditions.slowed
