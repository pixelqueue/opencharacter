# The target is marked (until Ajax is no longer marked: the table's). Ajax gains an edge on power
# rolls against a creature marked this way (a rule on all his rolls). The free strike when the
# target uses a triggered action through their mark is the table's.
id: abilities.ajax-the-invincible.ajax-the-invincible.is-this-what-they-taught-you
type: ability
grantOnly: false
tags:
  - kw.ranged
fields:
  usage: triggered
  distanceKind: ranged
  distance: 10
  t1Effect: effects.ajax-the-invincible.marked
  t1Duration: until
effects:
  - target: { rolls: [power-target], tally: edges }
    op: add
    value: 1
    when: character.id in participant.powerRoll.edgesAgainstFor
