id: abilities.retainer.high-elf-weatherwise.autumns-decay
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: main-action
  level: 10
  resource: encounter
  cost: 1
  distanceKind: cube
  distance: 3
  within: 1
  damageType: corruption
  t1Damage: 6
  t1AddsChar: false
  t2Damage: 10
  t2AddsChar: false
  t3Damage: 14
  t3AddsChar: false
  rollChars:
    - might
    - agility
    - reason
    - intuition
    - presence
  t1Condition: conditions.prone
  t1PotencyChar: presence
  t1Potency: weak
  t2Condition: conditions.prone
  t2PotencyChar: presence
  t2Potency: average
  t3Condition: conditions.prone
  t3PotencyChar: presence
  t3Potency: strong
effects:
  # Prone and can't stand (save ends), behind the tier's potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.common.cant-stand'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier > 0 && flags.landed
