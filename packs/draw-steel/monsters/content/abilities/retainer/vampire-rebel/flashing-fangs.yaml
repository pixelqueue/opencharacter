# Temporary Stamina equal to the corruption damage dealt is the table's (the damage after immunity).
id: abilities.retainer.vampire-rebel.flashing-fangs
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 5
  t2AddsChar: false
  t3Damage: 5
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: might
  t3Potency: strong
  rollChars:
    - might
    - agility
    - reason
    - intuition
    - presence
effects:
  # Tiers 2 and 3: 3 or 6 corruption damage besides.
  - target: { rolls: [damage], from: self }
    op: add
    value: '[0, 3, 6][flags.tier - 1]'
    tags: [damage.corruption]
    when: flags.tier >= 2
