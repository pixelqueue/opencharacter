# The damage type the retainer can choose is the `element` parameter (untyped by default).
id: abilities.retainer.role-controller.elemental-blast
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
  - kw.ranged
fields:
  usage: main-action
  level: 4
  resource: encounter
  cost: 1
  distanceKind: cube
  distance: 3
  within: 10
  t1Damage: 4
  t1AddsChar: false
  t1Move: push
  t1MoveDistance: 2
  t2Damage: 6
  t2AddsChar: false
  t2Move: push
  t2MoveDistance: 3
  t3Damage: 10
  t3AddsChar: false
  t3Move: push
  t3MoveDistance: 5
  rollChars:
    - might
    - agility
    - reason
    - intuition
    - presence
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      element:
        type: enum
        values: [untyped, acid, cold, fire, lightning, poison, sonic]
        default: untyped
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value: [{ formula: "params.element == 'untyped' ? [] : ['damage.' + params.element]" }]
