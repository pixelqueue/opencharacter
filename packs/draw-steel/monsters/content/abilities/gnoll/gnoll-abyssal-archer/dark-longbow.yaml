id: abilities.gnoll.gnoll-abyssal-archer.dark-longbow
type: ability
grantOnly: false
tags:
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: ranged
  distance: 10
  rollBonus: 2
  damageType: corruption
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 6
  t2AddsChar: false
  t3Damage: 8
  t3AddsChar: false
  t3Condition: conditions.slowed
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 2
# An edge against any target not at full Stamina.
effects:
  - target: { rolls: [power-target], tally: edges, from: self }
    op: add
    value: 1
    when: participant.stamina.current < participant.stamina.max
