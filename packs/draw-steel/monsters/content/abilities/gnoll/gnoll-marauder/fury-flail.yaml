# 2+ Malice: more targets, the table's.
id: abilities.gnoll.gnoll-marauder.fury-flail
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  spendPlus: true
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 5
  t2AddsChar: false
  t3Damage: 7
  t3AddsChar: false
  t3Condition: conditions.prone
# Tier 3: prone (the tier field), and bleeding (save ends) if A < 2.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.bleeding'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier == 3 && participant.characteristics.agility.score
        < 2 + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
