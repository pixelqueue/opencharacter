# Each ally gains an edge on strikes against the target until the end of the round
# (`effects.undead.fetid-wrapped`).
id: abilities.undead.mummy-rotwrap.fetid-wrappings
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 2
  rollBonus: 4
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 7
  t2AddsChar: false
  t2Move: pull
  t2MoveDistance: 1
  t3Damage: 8
  t3AddsChar: false
  t3Move: pull
  t3MoveDistance: 3
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.undead.fetid-wrapped'
          appliedBy: character.id
    when: flags.tier > 0
