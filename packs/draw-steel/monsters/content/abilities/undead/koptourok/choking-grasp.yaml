# Suffocating while grabbed this way is `effects.undead.choked` (text); two grabs at once are the
# table's.
id: abilities.undead.koptourok.choking-grasp
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 5
  rollBonus: 4
  t1Damage: 7
  t1AddsChar: false
  t1Condition: conditions.grabbed
  t1PotencyChar: might
  t1PotencyValue: 2
  t2Damage: 10
  t2AddsChar: false
  t2Condition: conditions.grabbed
  t2PotencyChar: might
  t2PotencyValue: 3
  t3Damage: 11
  t3AddsChar: false
  t3Condition: conditions.grabbed
  t3PotencyChar: might
  t3PotencyValue: 4
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.undead.choked'
          appliedBy: character.id
    when: flags.tier > 0 && flags.landed
