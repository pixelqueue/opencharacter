# 5 corruption damage to a target with M < 2, 3 or 4 by tier: the tier damage is 0, the 5 a roll
# effect. The edge against a grabbed target and the flight are the table's.
id: abilities.undead.koptourok.inhale
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: main-action
  resource: malice
  cost: 3
  distanceKind: burst
  distance: 5
  rollBonus: 4
  damageType: corruption
  t1Move: pull
  t1MoveDistance: 3
  t1Damage: 0
  t1AddsChar: false
  t2Move: pull
  t2MoveDistance: 5
  t2Damage: 0
  t2AddsChar: false
  t3Move: pull
  t3MoveDistance: 7
  t3Damage: 0
  t3AddsChar: false
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 5
    tags: [damage.corruption]
    when: >-
      flags.tier > 0 && (participant.characteristics.might.score + participant.potency.resistBonus.might) < flags.tier + 1 + steps.roll.tallies.potencyBonus
