# A target grabbed this way takes 2 corruption damage when they start their turn grabbed by the
# zombie (`effects.undead.clutched`).
id: abilities.undead.zombie.clobber-and-clutch
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 6
  t2AddsChar: false
  t3Damage: 7
  t3AddsChar: false
  t3Condition: conditions.grabbed
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.undead.clutched'
          appliedBy: character.id
    when: flags.tier == 3
