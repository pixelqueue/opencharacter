# Tier 3: frightened and restrained (save ends), behind I < 4.
id: abilities.undead.mummy-lord.unbound-horrors
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: no-action
  kind: villain
  resource: villain-action
  cost: 3
  distanceKind: burst
  distance: 5
  rollBonus: 4
  damageType: corruption
  t1Damage: 5
  t1AddsChar: false
  t1Condition: conditions.frightened
  t1Duration: save
  t1PotencyChar: intuition
  t1PotencyValue: 2
  t2Damage: 8
  t2AddsChar: false
  t2Condition: conditions.frightened
  t2Duration: save
  t2PotencyChar: intuition
  t2PotencyValue: 3
  t3Damage: 10
  t3AddsChar: false
  t3Condition: conditions.frightened
  t3Duration: save
  t3PotencyChar: intuition
  t3PotencyValue: 4
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.restrained'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier == 3 && flags.landed
