id: abilities.undead.fleshflayed-shambler-zombie.bone-carvers
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 3
  t1AddsChar: false
  t2Damage: 5
  t2AddsChar: false
  t3Damage: 7
  t3AddsChar: false
effects:
  # An edge (or a double edge) on the roll: the target is bleeding (save ends).
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.bleeding'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier > 0 && min(2, steps.roll.tallies.edges) > min(2, steps.roll.tallies.banes)
