# A target made bleeding this way who is already bleeding is instead knocked prone and can't stand
# until the end of their next turn (the can't stand is `own-next-end`); the bleeding isn't
# withheld.
id: abilities.undead.blood-starved-vampire.feeding-frenzy
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 4
  t1Damage: 3
  t1AddsChar: false
  t2Damage: 6
  t2AddsChar: false
  t3Damage: 7
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: eot
  t3PotencyChar: might
  t3PotencyValue: 4
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.prone'
          appliedBy: character.id
        - type: applyEffect
          source: '@effects.common.cant-stand'
          state: { duration: "'own-next-end'" }
          appliedBy: character.id
    when: flags.tier == 3 && flags.landed && participant.conditions.bleeding
