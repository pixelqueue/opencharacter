# 2 Malice: the potency rises by 1 (the dead rising as specters is the table's).
id: abilities.undead.specter.decaying-touch
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.melee
  - kw.strike
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  distanceKind: melee
  distance: 1
  rollBonus: 2
  damageType: corruption
  t1Damage: 3
  t1AddsChar: false
  t1Condition: conditions.weakened
  t1Duration: save
  t1PotencyChar: presence
  t1PotencyValue: 0
  t2Damage: 4
  t2AddsChar: false
  t2Condition: conditions.weakened
  t2Duration: save
  t2PotencyChar: presence
  t2PotencyValue: 1
  t3Damage: 5
  t3AddsChar: false
  t3Condition: conditions.weakened
  t3Duration: save
  t3PotencyChar: presence
  t3PotencyValue: 2
effects:
  - target: { rolls: [power-roll.ability], tally: potencyBonus, from: self }
    op: add
    value: 1
    when: has(params.malice) && params.malice >= 2
