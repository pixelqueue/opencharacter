# The target can't shift until the end of their next turn. 1 Malice: one more target (the table's).
id: abilities.undead.flesh-mournling.multiarm-strike
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 1
  distanceKind: melee
  distance: 2
  rollBonus: 3
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 7
  t2AddsChar: false
  t3Damage: 9
  t3AddsChar: false
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.common.cant-shift'
          state: { duration: "'eot'" }
          appliedBy: character.id
    when: >-
      flags.tier > 0
