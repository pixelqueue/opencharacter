# The basilisk's Malice feature as an ability every basilisk holds (`malice-feature`), paid from
# the Director's sheet. A < 1 / A < 2: 2 or 5 damage more (a roll effect behind the tier's
# potency) with prone, or prone and can't stand (save ends).
id: abilities.basilisk.malice.upchuck
type: ability
grantOnly: false
tags: [malice-feature, creature.basilisk, kw.area, kw.weapon]
fields:
  usage: main-action
  resource: malice
  cost: 5
  distanceKind: cube
  distance: 3
  within: 10
  rollBonus: 2
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 4
  t2AddsChar: false
  t2Condition: conditions.prone
  t2PotencyChar: agility
  t2PotencyValue: 1
  t3Damage: 4
  t3AddsChar: false
  t3Effect: effects.common.prone-cant-stand
  t3Duration: save
  t3PotencyChar: agility
  t3PotencyValue: 2
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: '[0, 2, 5][flags.tier - 1]'
    when: >-
      flags.tier >= 2 && participant.characteristics.agility.score + participant.potency.resistBonus.agility
        < flags.tier - 1 + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
