id: abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: maneuver
  distanceKind: line
  distance: 5
  areaWidth: 2
  within: 1
  rollBonus: 2
  t1Condition: conditions.restrained
  t1Duration: save
  t1PotencyChar: agility
  t1PotencyValue: 0
  t2Condition: conditions.restrained
  t2Duration: save
  t2PotencyChar: agility
  t2PotencyValue: 1
  t3Condition: conditions.restrained
  t3Duration: save
  t3PotencyChar: agility
  t3PotencyValue: 2
# Tier 3: restrained if A < 2, else slowed. The potency rising against a slowed target, the
# area's special targeting and the petrification are the table's.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.slowed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier == 3 && !flags.landed
