# The free strike is the table's. Bleeding until the end of the target's next turn
# (`own-next-end`).
id: abilities.dragon.thorn-dragon.thorny-scales
type: ability
grantOnly: false
tags:
  - kw.melee
fields:
  usage: free-triggered
  resource: malice
  cost: 1
  distanceKind: melee
  distance: 1
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.bleeding'
          state: { duration: "'own-next-end'" }
          appliedBy: character.id
    when: >-
      participant.characteristics.might.score + participant.potency.resistBonus.might < 2 + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
