id: abilities.wode-elf.wode-elf-gweiadur.you-activated-my-trap
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
  - kw.ranged
fields:
  usage: maneuver
  resource: malice
  cost: 3
  distanceKind: cube
  distance: 3
  within: 10
  rollBonus: 2
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 6
  t2AddsChar: false
  t3Damage: 9
  t3AddsChar: false
  t2Condition: conditions.slowed
  t2Duration: save
  t2PotencyChar: reason
  t2PotencyValue: 1
  t3Condition: conditions.slowed
  t3Duration: save
  t3PotencyChar: reason
  t3PotencyValue: 2
# Marked (save ends) behind R < 0 / 1 / 2, with the slowed at tiers 2 and 3.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.wode-elf.marked'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier > 0 && participant.characteristics.reason.score
        < [0, 1, 2][flags.tier - 1] + steps.roll.tallies.potencyBonus
