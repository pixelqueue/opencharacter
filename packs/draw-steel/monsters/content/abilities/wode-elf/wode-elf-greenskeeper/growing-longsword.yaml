id: abilities.wode-elf.wode-elf-greenskeeper.growing-longsword
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 7
  t2AddsChar: false
  t3Damage: 9
  t3AddsChar: false
# The target is taunted until the end of their next turn (EoT). The 2 Malice reach is the table's.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.taunted'
          state: { duration: "'eot'" }
          appliedBy: character.id
    when: flags.tier > 0
