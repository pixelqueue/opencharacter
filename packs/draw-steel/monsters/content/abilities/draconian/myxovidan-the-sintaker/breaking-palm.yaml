# Tier 3's damage is corruption, tiers 1 and 2 untyped: tier 3's damage part is tagged. The 2 Malice
# healing is the table's.
id: abilities.draconian.myxovidan-the-sintaker.breaking-palm
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 10
  t1AddsChar: false
  t1Condition: conditions.weakened
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 1
  t2Damage: 15
  t2AddsChar: false
  t2Condition: conditions.weakened
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 2
  t3Damage: 18
  t3AddsChar: false
  t3Condition: conditions.weakened
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 3
effects:
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value:
      - formula: "flags.tier == 3 ? ['damage.corruption'] : []"
