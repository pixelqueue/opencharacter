# Tier 1 heals; tiers 2 and 3 deal different types (12 corruption, 12 lightning): typed roll
# effects over a 0 base (the damage roll needs a tier-1 value). Reusing the first roll's outcome,
# and the 2+ Malice targets, are the table's.
id: abilities.draconian.aeolyxria-the-uncanny.experimental-treasure
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  spendCost: 2
  spendPlus: true
  distanceKind: ranged
  distance: 10
  rollBonus: 3
  t2Damage: 0
  t2AddsChar: false
  t2Condition: conditions.weakened
  t2Duration: save
  t2PotencyChar: agility
  t2PotencyValue: 2
  t3Damage: 0
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: agility
  t3PotencyValue: 2
  t1Damage: 0
  t1AddsChar: false
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - { type: adjust, field: stamina.current, by: 10, tags: [healing] }
    when: flags.tier == 1
  - target: { rolls: [damage], from: self }
    op: add
    value: 12
    tags: [damage.corruption]
    when: flags.tier == 2
  - target: { rolls: [damage], from: self }
    op: add
    value: 12
    tags: [damage.lightning]
    when: flags.tier == 3
