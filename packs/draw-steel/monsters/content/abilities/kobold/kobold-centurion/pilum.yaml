# The free strikes of allies adjacent to a target are the table's.
id: abilities.kobold.kobold-centurion.pilum
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 3
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 10
  rollBonus: 3
  t1Damage: 7
  t1AddsChar: false
  t1Condition: conditions.weakened
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 1
  t2Damage: 10
  t2AddsChar: false
  t2Condition: conditions.weakened
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 1
  t3Damage: 13
  t3AddsChar: false
  t3Condition: conditions.weakened
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 1
# 3 Malice: while weakened this way, the target is also restrained (its own save: that it ends with
# the weakened is the table's).
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.restrained'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.landed && has(params.malice) && params.malice >= 3
