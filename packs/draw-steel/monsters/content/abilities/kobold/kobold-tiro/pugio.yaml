# Tier 2 and 3's shift is the tiro's own move: the table's.
id: abilities.kobold.kobold-tiro.pugio
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 1
  t1AddsChar: false
  t2Damage: 2
  t2AddsChar: false
  t3Damage: 3
  t3AddsChar: false
# Effect: until the start of the tiro's next turn, on any tier.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.common.cant-shift'
          state: { duration: "'next-start'" }
          appliedBy: character.id
    when: flags.tier > 0
