# Tiers 2 and 3: M < 1 or 2 restrained (save ends). With 3 Malice a target restrained this way also
# takes 2 fire damage at the start of each of their turns: one entry for both
# (`effects.kobold.burning-net`), so the save ends both.
id: abilities.kobold.kobold-venator.dolabra-and-net
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 3
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 6
  t2AddsChar: false
  t3Damage: 7
  t3AddsChar: false
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: >-
            has(params.malice) && params.malice >= 3 ? @effects.kobold.burning-net : @conditions.restrained
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier >= 2
        && participant.characteristics.might.score + participant.potency.resistBonus.might
          < flags.tier - 1 + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
