id: abilities.kobold.kobold-veles.pilum
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 5
  rollBonus: 2
  t1Damage: 1
  t1AddsChar: false
  t2Damage: 2
  t2AddsChar: false
  t3Damage: 3
  t3AddsChar: false
# Effect: until the start of the veles's next turn, on any tier.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.kobold.no-opportunity-attacks'
          state: { duration: "'next-start'" }
          appliedBy: character.id
    when: flags.tier > 0
