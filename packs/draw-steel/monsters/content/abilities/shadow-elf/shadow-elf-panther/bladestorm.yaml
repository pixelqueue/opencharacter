# Dazed this way is `effects.shadow-elf.bladestorm-dazed`; the panther's double edge on strikes
# against such a target is this ability's rule on all their strikes (only the panther who dazed
# them: their ID in the target's `edgesAgainstFor`).
id: abilities.shadow-elf.shadow-elf-panther.bladestorm
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.weapon
fields:
  usage: main-action
  resource: malice
  cost: 3
  distanceKind: burst
  distance: 2
  rollBonus: 3
  damageType: corruption
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 8
  t2AddsChar: false
  t2Effect: effects.shadow-elf.bladestorm-dazed
  t2Duration: save
  t2PotencyChar: intuition
  t2PotencyValue: 2
  t3Damage: 10
  t3AddsChar: false
  t3Effect: effects.shadow-elf.bladestorm-dazed
  t3Duration: save
  t3PotencyChar: intuition
  t3PotencyValue: 3
effects:
  - target: { rolls: [power-target], tally: edges }
    op: add
    value: 2
    when: >-
      'kw.strike' in action.item.tags && character.id in participant.powerRoll.edgesAgainstFor
