id: abilities.olothec.olothec.devolving-tentacles
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 3
  rollBonus: 4
  t1Damage: 11
  t1AddsChar: false
  t1Condition: conditions.weakened
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 2
  t2Damage: 17
  t2AddsChar: false
  t2Condition: conditions.weakened
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 3
  t3Damage: 20
  t3AddsChar: false
  t3Condition: conditions.weakened
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 4
# Tiers 1 and 2: weakened or slimed (the Director's pick: weakened here, slimed is the table's);
# tier 3: weakened and slimed, both behind M < 4.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.olothec.slimed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier == 3 && flags.landed
