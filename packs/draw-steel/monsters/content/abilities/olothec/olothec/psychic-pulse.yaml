# Each target takes 12 psychic damage and, if M < 3, is weakened and slimed (save ends); the
# olothec has damage immunity 4 until the start of their next turn. The slide is the table's.
id: abilities.olothec.olothec.psychic-pulse
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.psionic
fields:
  usage: no-action
  kind: villain
  resource: villain-action
  cost: 2
  distanceKind: burst
  distance: 10
  damageType: psychic
  t1Damage: 12
  t1Condition: conditions.weakened
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 3
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.olothec.slimed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: participant.characteristics.might.score + participant.potency.resistBonus.might < 3
  - target: { steps: [ability.after], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.olothec.pulse-shield'
          state: { duration: "'next-start'" }
          appliedBy: character.id
