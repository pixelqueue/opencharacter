# The damage type is the `element` parameter, picked on each use (as the heroes pack's Hurl
# Element).
id: abilities.bugbear.bugbear-channeler.blistering-element
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: main-action
  distanceKind: burst
  distance: 3
  rollBonus: 2
  t1Damage: 2
  t1AddsChar: false
  t1Condition: conditions.bleeding
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 0
  t2Damage: 3
  t2AddsChar: false
  t2Condition: conditions.bleeding
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 1
  t3Damage: 4
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 2
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      element: { type: enum, values: [acid, cold, corruption, fire, poison], default: fire }
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value: [{ formula: "'damage.' + params.element" }]
