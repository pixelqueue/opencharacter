id: abilities.bugbear.bugbear-knightmare.corrosive-blade
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 4
  damageType: corruption
  t1Damage: 3
  t1AddsChar: false
  t2Damage: 6
  t2AddsChar: false
  t2Condition: conditions.bleeding
  t2Duration: save
  t2PotencyChar: presence
  t2PotencyValue: 3
  t3Damage: 8
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: presence
  t3PotencyValue: 4
# Tier 3: grabbed beside the bleeding.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.grabbed'
          appliedBy: character.id
    when: flags.tier == 3
