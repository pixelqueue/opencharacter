# Tier 3: push 3 or prone, the razor's pick: the table's.
id: abilities.orc.orc-razor.boot-and-blade
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 2
  t1AddsChar: false
  t2Damage: 4
  t2AddsChar: false
  t2Move: push
  t2MoveDistance: 3
  t3Damage: 5
  t3AddsChar: false
# An edge against any target affected by a condition.
effects:
  - target: { rolls: [power-target], tally: edges, from: self }
    op: add
    value: 1
    when: >-
      participant.conditions.bleeding || participant.conditions.dazed
        || participant.conditions.frightened || participant.conditions.grabbed
        || participant.conditions.prone || participant.conditions.restrained
        || participant.conditions.slowed || participant.conditions.taunted
        || participant.conditions.weakened
