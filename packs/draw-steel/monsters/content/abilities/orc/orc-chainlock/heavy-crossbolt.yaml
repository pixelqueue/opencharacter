id: abilities.orc.orc-chainlock.heavy-crossbolt
type: ability
grantOnly: false
tags:
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  resource: malice
  cost: 3
  distanceKind: ranged
  distance: 5
  rollBonus: 2
  t1Damage: 5
  t1AddsChar: false
  t1Condition: conditions.slowed
  t1Duration: save
  t1PotencyChar: agility
  t1PotencyValue: 0
  t2Damage: 7
  t2AddsChar: false
  t2Condition: conditions.slowed
  t2Duration: save
  t2PotencyChar: agility
  t2PotencyValue: 1
  t3Damage: 9
  t3AddsChar: false
  t3Condition: conditions.prone
# Tier 3: prone (the tier field), and slowed (save ends) if A < 2.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.slowed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier == 3 && participant.characteristics.agility.score + participant.potency.resistBonus.agility
        < 2 + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
