# The garroter's shift is the table's.
id: abilities.orc.orc-garotter.dagger-feint
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 6
  t1AddsChar: false
  t2Damage: 9
  t2AddsChar: false
  t3Damage: 12
  t3AddsChar: false
# An edge (or a double edge) against the target: 4 more damage.
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 4
    when: min(2, steps.tier.tallies.edges) > min(2, steps.tier.tallies.banes)
