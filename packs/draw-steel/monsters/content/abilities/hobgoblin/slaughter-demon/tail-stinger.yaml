id: abilities.hobgoblin.slaughter-demon.tail-stinger
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  resource: malice
  cost: 3
  distanceKind: melee
  distance: 5
  rollBonus: 3
  damageType: poison
  t1Damage: 10
  t1AddsChar: false
  t1Condition: conditions.weakened
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 1
  t2Damage: 16
  t2AddsChar: false
  t2Condition: conditions.weakened
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 2
  t3Damage: 20
  t3AddsChar: false
  t3Condition: conditions.weakened
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 3
# A target weakened this way also has damage weakness 3 (save ends: its own save; that it ends
# with the weakened is the table's).
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.hobgoblin.stinger-weakness'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.landed
