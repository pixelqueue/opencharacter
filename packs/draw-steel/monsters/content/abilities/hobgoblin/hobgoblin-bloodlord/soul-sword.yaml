# 2 Malice: each target is marked until the end of the encounter (`effects.hobgoblin.soul-marked`,
# on any tier). Ending at their death and the three-mark limit are the table's.
id: abilities.hobgoblin.hobgoblin-bloodlord.soul-sword
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  distanceKind: melee
  distance: 1
  rollBonus: 4
  damageType: corruption
  t1Damage: 11
  t1AddsChar: false
  t1Condition: conditions.bleeding
  t1Duration: save
  t1PotencyChar: presence
  t1PotencyValue: 2
  t2Damage: 16
  t2AddsChar: false
  t2Condition: conditions.bleeding
  t2Duration: save
  t2PotencyChar: presence
  t2PotencyValue: 3
  t3Damage: 19
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: presence
  t3PotencyValue: 4
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.hobgoblin.soul-marked'
          state: { duration: "'encounter'" }
          appliedBy: character.id
    when: flags.tier > 0 && has(params.malice) && params.malice >= 2
