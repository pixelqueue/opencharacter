# A target grabbed this way takes a bane on the Escape Grab maneuver.
id: abilities.ogre.ogre-goon.grabby-hand
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: maneuver
  resource: malice
  cost: 1
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 7
  t1AddsChar: false
  t2Damage: 11
  t2AddsChar: false
  t2Condition: conditions.grabbed
  t3Damage: 14
  t3AddsChar: false
  t3Condition: conditions.grabbed
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.common.escape-grab-bane'
          appliedBy: character.id
    when: flags.landed
