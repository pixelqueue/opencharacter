id: abilities.ogre.ogre-blue-blood.crush-underfoot
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 2
  rollBonus: 4
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 7
  t2AddsChar: false
  t2Condition: conditions.prone
  t2PotencyChar: might
  t2PotencyValue: 3
  t3Damage: 8
  t3AddsChar: false
  t3Condition: conditions.prone
# A target who is already prone takes an extra 4 damage.
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 4
    when: flags.tier > 0 && participant.conditions.prone
