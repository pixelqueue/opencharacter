id: abilities.ogre.ogre-juggernaut.pitchfork-catapult
type: ability
grantOnly: false
tags:
  - kw.charge
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 1
  distanceKind: melee
  distance: 2
  rollBonus: 2
  t1Damage: 7
  t1AddsChar: false
  t2Damage: 10
  t2AddsChar: false
  t2Move: push
  t2MoveDistance: 2
  t2MoveVertical: true
  t2PotencyChar: agility
  t2PotencyValue: 1
  t2MovePotency: true
  t3Damage: 13
  t3AddsChar: false
  t3Move: slide
  t3MoveDistance: 3
  t3MoveVertical: true
  t3PotencyChar: agility
  t3PotencyValue: 2
  t3MovePotency: true
# 1 Malice: each target who has M < 1 is bleeding (save ends).
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.bleeding'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier > 0 && has(params.malice) && params.malice >= 1
        && (participant.characteristics.might.score + participant.potency.resistBonus.might) < 1 + steps.roll.tallies.potencyBonus
