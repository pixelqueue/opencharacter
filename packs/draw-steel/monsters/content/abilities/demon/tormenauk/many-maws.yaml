# Tier 3's grab carries a bane on the Escape Grab maneuver. The 4 psychic damage at the start of
# the tormenauk's turns to a target grabbed this way is the table's.
id: abilities.demon.tormenauk.many-maws
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 7
  t1AddsChar: false
  t2Damage: 9
  t2AddsChar: false
  t3Damage: 11
  t3AddsChar: false
  t3Condition: conditions.grabbed
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.common.escape-grab-bane'
          appliedBy: character.id
    when: flags.tier == 3 && flags.landed
