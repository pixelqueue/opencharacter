# The potency is 1 higher against a target the tormenauk has grabbed (that target's own tier).
id: abilities.demon.tormenauk.agony-wail
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: maneuver
  resource: malice
  cost: 5
  distanceKind: burst
  distance: 3
  rollBonus: 3
  damageType: psychic
  t1Damage: 4
  t1AddsChar: false
  t1Condition: conditions.dazed
  t1Duration: save
  t1PotencyChar: intuition
  t1PotencyValue: 1
  t2Damage: 6
  t2AddsChar: false
  t2Condition: conditions.dazed
  t2Duration: save
  t2PotencyChar: intuition
  t2PotencyValue: 2
  t3Damage: 8
  t3AddsChar: false
  t3Condition: conditions.dazed
  t3Duration: save
  t3PotencyChar: intuition
  t3PotencyValue: 3
effects:
  - target: { rolls: [power-target], tally: potencyBonus, from: self }
    op: add
    value: 1
    when: character.id in participant.conditions.grabbedBy
