# 2 Malice: a target dazed this way can't gain Heroic Resources while dazed.
id: abilities.demon.aurumvas.covetous-bolts
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  resource: malice
  cost: 3
  spendCost: 2
  distanceKind: ranged
  distance: 20
  rollBonus: 5
  damageType: psychic
  t1Damage: 15
  t1AddsChar: false
  t1Condition: conditions.dazed
  t1Duration: save
  t1PotencyChar: presence
  t1PotencyValue: 4
  t2Damage: 20
  t2AddsChar: false
  t2Condition: conditions.dazed
  t2Duration: save
  t2PotencyChar: presence
  t2PotencyValue: 5
  t3Damage: 24
  t3AddsChar: false
  t3Condition: conditions.dazed
  t3Duration: save
  t3PotencyChar: presence
  t3PotencyValue: 6
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.demon.covetous-daze'
          appliedBy: character.id
    when: flags.landed && has(params.malice) && params.malice >= 2
