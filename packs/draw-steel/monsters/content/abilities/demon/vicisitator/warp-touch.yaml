# Tier 3: slowed and weakened (save ends), behind I < 5; that they can't be ignored is the table's.
id: abilities.demon.vicisitator.warp-touch
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 10
  rollBonus: 5
  t1Damage: 9
  t1AddsChar: false
  t2Damage: 12
  t2AddsChar: false
  t3Damage: 14
  t3AddsChar: false
  t3Condition: conditions.slowed
  t3Duration: save
  t3PotencyChar: intuition
  t3PotencyValue: 5
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.weakened'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier == 3 && flags.landed
