# Corruption weakness 5 (EoT); 2 Malice: (save ends) instead if the target has I < 2.
id: abilities.demon.bale-eye.wilting-visions
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  distanceKind: ranged
  distance: 15
  rollBonus: 3
  damageType: psychic
  t1Damage: 6
  t1AddsChar: false
  t2Damage: 8
  t2AddsChar: false
  t3Damage: 9
  t3AddsChar: false
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.demon.corruption-weakness'
          state:
            {
              duration: "has(params.malice) && params.malice >= 2 && (participant.characteristics.intuition.score + participant.potency.resistBonus.intuition) < 2 + steps.roll.tallies.potencyBonus ? 'save' : 'eot'",
            }
          appliedBy: character.id
    when: flags.tier > 0
