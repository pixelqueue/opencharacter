id: abilities.bredbeddle.bredbeddle.executioners-swing
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 3
  distanceKind: burst
  distance: 2
  rollBonus: 3
  t1Damage: 2
  t1AddsChar: false
  t1Condition: conditions.bleeding
  t1Duration: save
  t1PotencyChar: agility
  t1PotencyValue: 1
  t2Damage: 4
  t2AddsChar: false
  t2Condition: conditions.bleeding
  t2Duration: save
  t2PotencyChar: agility
  t2PotencyValue: 2
  t3Damage: 5
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: agility
  t3PotencyValue: 3
# Tier 3: also M < 2 dazed (save ends). The 3 Malice shift and extra targets are the table's.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.dazed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier == 3 && participant.characteristics.might.score + participant.potency.resistBonus.might
        < 2 + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
