id: abilities.bredbeddle.bredbeddle.turn-green
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: no-action
  kind: villain
  resource: villain-action
  cost: 1
  distanceKind: burst
  distance: 3
  rollBonus: 3
  t1Effect: effects.bredbeddle.green
  t1Duration: save
  t1PotencyChar: presence
  t1PotencyValue: 1
  t2Effect: effects.bredbeddle.green
  t2Duration: save
  t2PotencyChar: presence
  t2PotencyValue: 2
  t3Effect: effects.bredbeddle.green
  t3Duration: encounter
  t3PotencyChar: presence
  t3PotencyValue: 3
# The bredbeddle's double edge on power rolls against a creature turned green (all its rolls).
effects:
  - target: { rolls: [power-target], tally: edges }
    op: add
    value: 2
    when: character.id in participant.powerRoll.edgesAgainstFor
