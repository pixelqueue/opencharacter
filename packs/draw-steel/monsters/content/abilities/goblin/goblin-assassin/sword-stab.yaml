id: abilities.goblin.goblin-assassin.sword-stab
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 6
  t2AddsChar: false
  t3Damage: 7
  t3AddsChar: false
# An edge (or a double edge) on the roll: 2 more damage.
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 2
    when: min(2, steps.tier.tallies.edges) > min(2, steps.tier.tallies.banes)
