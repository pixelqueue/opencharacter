# The second corruption damage is behind its own P < 1/2/3 potency. The edge against a target
# with a soul and the 3 Malice healing are the table's.
id: abilities.hag.wode-hag.soul-steal
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: main-action
  spendCost: 3
  distanceKind: cube
  distance: 4
  within: 1
  rollBonus: 3
  damageType: corruption
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 8
  t2AddsChar: false
  t3Damage: 10
  t3AddsChar: false
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: adjust
          field: stamina.current
          by: '-[4, 5, 6][flags.tier - 1]'
          tags: [damage, damage.corruption]
    when: >-
      flags.tier > 0 && participant.characteristics.presence.score + participant.potency.resistBonus.presence
        < flags.tier + steps.roll.tallies.potencyBonus
