id: abilities.valok.servok-miner.drill-press
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 2
  rollBonus: 4
  t1Damage: 13
  t1Condition: conditions.restrained
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 2
  t1AddsChar: false
  t2Damage: 18
  t2Condition: conditions.restrained
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 3
  t2AddsChar: false
  t3Damage: 22
  t3AddsChar: false
  t3Condition: conditions.restrained
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 4
# Prone with the restrained at tiers 1 and 2 (behind its potency), always at tier 3.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.prone'
          state: { duration: "'until'" }
          appliedBy: character.id
    when: flags.tier == 3 || (flags.tier > 0 && flags.landed)
