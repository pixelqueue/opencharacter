# A target must be grabbed by the hulking brain (the table's); the roll ends the brain's grab only.
id: abilities.voiceless-talker.hulking-brain.cerebral-suplex
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
fields:
  usage: main-action
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 7
  t1AddsChar: false
  t2Damage: 10
  t2AddsChar: false
  t3Damage: 13
  t3AddsChar: false
# M < 1 / 2 / 3: 3, 3 or 6 more damage.
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: '[3, 3, 6][flags.tier - 1]'
    when: >-
      flags.tier > 0 && participant.characteristics.might.score + participant.potency.resistBonus.might
        < [1, 2, 3][flags.tier - 1] + steps.roll.tallies.potencyBonus
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: removeEffect
          applied: { where: 'item.id == @conditions.grabbed', appliedBy: self }
