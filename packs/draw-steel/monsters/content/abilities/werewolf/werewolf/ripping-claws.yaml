id: abilities.werewolf.werewolf.ripping-claws
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 8
  t1AddsChar: false
  t1Condition: conditions.bleeding
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 1
  t2Damage: 11
  t2AddsChar: false
  t2Condition: conditions.bleeding
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 2
  t3Damage: 14
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 3
effects:
  # Rage: 1 or 3 at tiers 2 and 3, 1 more in wolf form.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.werewolf.rage'
          state:
            {
              amount: '[0, 1, 3][flags.tier - 1] + (countList(character.applied, x.active && x.source == @effects.werewolf.full-wolf) > 0 ? 1 : 0)',
            }
          appliedBy: character.id
    when: 'flags.tier > 0 && [0, 1, 3][flags.tier - 1] + (countList(character.applied, x.active && x.source == @effects.werewolf.full-wolf) > 0 ? 1 : 0) > 0'
