id: abilities.werewolf.werewolf.berserker-slash
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.weapon
fields:
  usage: main-action
  resource: malice
  cost: 3
  distanceKind: burst
  distance: 1
  rollBonus: 3
  t1Damage: 4
  t1AddsChar: false
  t1Move: push
  t1MoveDistance: 2
  t2Damage: 6
  t2AddsChar: false
  t2Move: push
  t2MoveDistance: 3
  t3Damage: 7
  t3AddsChar: false
  t3Move: slide
  t3MoveDistance: 3
effects:
  # Rage: 1 or 3 at tiers 2 and 3 (not a strike).
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.werewolf.rage'
          state: { amount: '[0, 1, 3][flags.tier - 1]' }
          appliedBy: character.id
    when: 'flags.tier > 0 && [0, 1, 3][flags.tier - 1] > 0'
