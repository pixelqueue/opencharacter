# The edge on power rolls against the target is the table's.
id: abilities.time-raider.time-raider-vertex.psionic-slam
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.psionic
  - kw.strike
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 2
  rollBonus: 2
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 7
  t2AddsChar: false
  t3Damage: 9
  t3AddsChar: false
# The psychic damage beside the untyped damage.
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: '[2, 3, 4][flags.tier - 1]'
    tags: [damage.psychic]
    when: flags.tier > 0
