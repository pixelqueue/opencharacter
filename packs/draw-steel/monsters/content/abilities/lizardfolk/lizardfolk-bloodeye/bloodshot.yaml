id: abilities.lizardfolk.lizardfolk-bloodeye.bloodshot
type: ability
grantOnly: false
tags:
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  resource: malice
  cost: 2
  distanceKind: ranged
  distance: 10
  rollBonus: 2
  damageType: acid
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 7
  t2AddsChar: false
  t3Damage: 9
  t3AddsChar: false
# Line of effect only within 4, 3 or 2 squares (save ends), behind M < 0, 1 or 2.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.lizardfolk.bloodshot'
          state: { squares: '[4, 3, 2][flags.tier - 1]', duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier > 0 && participant.characteristics.might.score + participant.potency.resistBonus.might
        < [0, 1, 2][flags.tier - 1] + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
