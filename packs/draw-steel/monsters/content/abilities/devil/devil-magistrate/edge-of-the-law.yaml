id: abilities.devil.devil-magistrate.edge-of-the-law
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 10
  t1AddsChar: false
  t2Damage: 15
  t2AddsChar: false
  t3Damage: 18
  t3AddsChar: false
  t3Condition: conditions.dazed
  t3Duration: save
  t3PotencyChar: reason
  t3PotencyValue: 3
# Tier 3's 18 damage is fire, tiers 1 and 2 untyped: an `op: tag` types the tier's damage.
effects:
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value: [{ formula: "flags.tier == 3 ? ['damage.fire'] : []" }]
