# A size 1 target (1L or smaller) with A < 3 (A < 4 if the mound has them grabbed) is engulfed.
# "2+ Malice" (another target per 2 Malice) is the `malice` parameter; the targets are the
# table's. The +1 for a grabbed target reads any grab: who grabbed isn't in the target's view.
id: abilities.shambling-mound.shambling-mound.engulf
type: ability
grantOnly: false
tags:
  - kw.melee
fields:
  usage: main-action
  resource: malice
  cost: 2
  spendCost: 2
  spendPlus: true
  distanceKind: melee
  distance: 6
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.shambling-mound.engulfed'
          appliedBy: character.id
    when: >-
      participant.size.value in ['1t', '1s', '1m', '1l']
        && participant.characteristics.agility.score + participant.potency.resistBonus.agility
          < 3 + (participant.conditions.grabbed ? 1 : 0)
