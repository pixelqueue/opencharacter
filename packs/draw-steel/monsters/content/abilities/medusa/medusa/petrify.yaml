# Tier 3: restrained if M < 4, else slowed. The potency changes for cover and slowed targets and
# the petrification after two turns restrained are the table's.
id: abilities.medusa.medusa.petrify
type: ability
grantOnly: false
tags:
  - kw.area
  - kw.magic
fields:
  usage: main-action
  resource: malice
  cost: 5
  distanceKind: burst
  distance: 3
  rollBonus: 4
  t1Condition: conditions.restrained
  t1Duration: save
  t1PotencyChar: might
  t1PotencyValue: 2
  t2Condition: conditions.restrained
  t2Duration: save
  t2PotencyChar: might
  t2PotencyValue: 3
  t3Condition: conditions.restrained
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 4
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.slowed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier == 3 && !flags.landed
