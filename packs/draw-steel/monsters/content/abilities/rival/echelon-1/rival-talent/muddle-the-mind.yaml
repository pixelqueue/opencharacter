id: abilities.rival.echelon-1.rival-talent.muddle-the-mind
type: ability
grantOnly: false
tags:
  - kw.psionic
  - kw.ranged
  - kw.telepathy
fields:
  usage: maneuver
  resource: malice
  cost: 2
  distanceKind: ranged
  distance: 10
  rollBonus: 2
  t1Condition: conditions.slowed
  t1Duration: save
  t1PotencyChar: reason
  t1PotencyValue: 0
  t2Condition: conditions.dazed
  t2Duration: save
  t2PotencyChar: reason
  t2PotencyValue: 1
  t3Condition: conditions.dazed
  t3Duration: save
  t3PotencyChar: reason
  t3PotencyValue: 2
effects:
  # Tier 3: slowed (save ends) too, behind the same potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.slowed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier == 3 && flags.landed
