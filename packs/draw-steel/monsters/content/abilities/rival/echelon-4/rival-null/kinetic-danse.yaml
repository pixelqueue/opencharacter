# The null's shift is the table's.
id: abilities.rival.echelon-4.rival-null.kinetic-danse
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 5
  t1Damage: 15
  t1AddsChar: false
  t2Damage: 20
  t2AddsChar: false
  t3Damage: 24
  t3AddsChar: false
effects:
  # A < 3/4/5: 10, 15 or 19 damage besides.
  - target: { rolls: [damage], from: self }
    op: add
    value: '[10, 15, 19][flags.tier - 1]'
    when: >-
      flags.tier > 0 && has(participant)
        && participant.characteristics.agility.score < [3, 4, 5][flags.tier - 1] + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
