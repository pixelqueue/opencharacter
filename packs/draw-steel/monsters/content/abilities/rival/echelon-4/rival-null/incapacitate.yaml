  - kw.psionic
  - kw.strike
  - kw.weapon
fields:
  usage: maneuver
  resource: malice
  cost: 5
  distanceKind: melee
  distance: 1
  rollBonus: 5
  t1Damage: 13
  t1AddsChar: false
  t2Damage: 17
  t2AddsChar: false
  t3Damage: 20
  t3AddsChar: false
  t1Condition: conditions.dazed
  t1Duration: save
  t1PotencyChar: reason
