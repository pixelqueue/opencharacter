# An ally ending all conditions is the table's.
id: abilities.rival.echelon-4.rival-elementalist.viridescent-storm
type: ability
grantOnly: false
tags:
  - kw.green
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: signature
  distanceKind: ranged
  distance: 10
  rollBonus: 5
  t1Damage: 15
  t1AddsChar: false
  t1Move: slide
  t1MoveDistance: 3
  t2Damage: 20
  t2AddsChar: false
  t2Move: slide
  t2MoveDistance: 4
  t3Damage: 24
  t3AddsChar: false
  t3Move: slide
  t3MoveDistance: 5
effects:
  # M < 3/4/5: 5, 7 or 9 acid damage besides.
  - target: { rolls: [damage], from: self }
    op: add
    value: '[5, 7, 9][flags.tier - 1]'
    tags: [damage.acid]
    when: >-
      flags.tier > 0 && has(participant)
        && participant.characteristics.might.score + participant.potency.resistBonus.might < [3, 4, 5][flags.tier - 1] + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
