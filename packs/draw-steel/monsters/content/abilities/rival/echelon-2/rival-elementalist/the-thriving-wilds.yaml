id: abilities.rival.echelon-2.rival-elementalist.the-thriving-wilds
type: ability
grantOnly: false
tags:
  - kw.green
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: signature
  distanceKind: ranged
  distance: 10
  rollBonus: 3
  t1Damage: 9
  t1AddsChar: false
  t1Move: slide
  t1MoveDistance: 1
  t2Damage: 14
  t2AddsChar: false
  t2Move: slide
  t2MoveDistance: 2
  t3Damage: 17
  t3AddsChar: false
  t3Move: slide
  t3MoveDistance: 3
effects:
  # M < 1/2/3: 3, 5 or 7 acid damage besides.
  - target: { rolls: [damage], from: self }
    op: add
    value: '[3, 5, 7][flags.tier - 1]'
    tags: [damage.acid]
    when: >-
      flags.tier > 0 && has(participant)
        && participant.characteristics.might.score < [1, 2, 3][flags.tier - 1] + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
