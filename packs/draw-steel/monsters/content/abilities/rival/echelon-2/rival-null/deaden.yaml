id: abilities.rival.echelon-2.rival-null.deaden
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.psionic
  - kw.strike
  - kw.weapon
fields:
  usage: maneuver
  resource: malice
  cost: 2
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 9
  t1AddsChar: false
  t1Condition: conditions.dazed
  t1Duration: eot
  t1PotencyChar: reason
  t1PotencyValue: 1
  t2Damage: 14
  t2AddsChar: false
  t2Condition: conditions.dazed
  t2Duration: save
  t2PotencyChar: reason
  t2PotencyValue: 2
  t3Damage: 17
  t3AddsChar: false
  t3Condition: conditions.dazed
  t3Duration: save
  t3PotencyChar: reason
  t3PotencyValue: 3
effects:
  # Tier 3: restrained (save ends) too, behind the same potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.restrained'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier == 3 && flags.landed
