id: abilities.rival.echelon-2.rival-fury.thunderous-slam
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 10
  t1AddsChar: false
  t1Move: push
  t1MoveDistance: 2
  t2Damage: 15
  t2AddsChar: false
  t2Move: push
  t2MoveDistance: 3
  t3Damage: 18
  t3AddsChar: false
  t3Move: push
  t3MoveDistance: 4
effects:
  # 2 Malice: each target who has M < 2 is slowed (save ends).
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.slowed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: >-
      flags.tier > 0 && has(params.malice) && params.malice >= 2
        && participant.characteristics.might.score + participant.potency.resistBonus.might < 2 + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
