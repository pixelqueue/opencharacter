id: abilities.rival.echelon-2.rival-talent.disarrange-thoughts
type: ability
grantOnly: false
tags:
  - kw.psionic
  - kw.ranged
  - kw.telepathy
fields:
  usage: maneuver
  resource: malice
  cost: 2
  distanceKind: ranged
  distance: 10
  rollBonus: 3
  damageType: psychic
  t1Damage: 6
  t1AddsChar: false
  t1Condition: conditions.dazed
  t1Duration: save
  t1PotencyChar: reason
  t1PotencyValue: 1
  t2Damage: 6
  t2AddsChar: false
  t2Condition: conditions.dazed
  t2Duration: save
  t2PotencyChar: reason
  t2PotencyValue: 2
  t3Damage: 6
  t3AddsChar: false
  t3Condition: conditions.dazed
  t3Duration: save
  t3PotencyChar: reason
  t3PotencyValue: 3
effects:
  # Tier 3: slowed (save ends) too, behind the same potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.slowed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier == 3 && flags.landed
