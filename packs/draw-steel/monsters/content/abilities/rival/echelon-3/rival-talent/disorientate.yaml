id: abilities.rival.echelon-3.rival-talent.disorientate
type: ability
grantOnly: false
tags:
  - kw.psionic
  - kw.ranged
  - kw.telepathy
fields:
  usage: maneuver
  resource: malice
  cost: 2
  distanceKind: ranged
  distance: 10
  rollBonus: 4
  damageType: psychic
  t1Damage: 8
  t1AddsChar: false
  t1Condition: conditions.dazed
  t1Duration: save
  t1PotencyChar: reason
  t1PotencyValue: 2
  t2Damage: 8
  t2AddsChar: false
  t3Damage: 8
  t3AddsChar: false
  t2Condition: conditions.dazed
  t2Duration: save
  t2PotencyChar: reason
  t2PotencyValue: 3
  t3Condition: conditions.dazed
  t3Duration: save
  t3PotencyChar: reason
  t3PotencyValue: 4
effects:
  # Tiers 2 and 3: slowed (save ends) too, behind the same potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.slowed'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: (flags.tier == 2 || flags.tier == 3) && flags.landed
