# The null's shift is the table's.
id: abilities.rival.echelon-3.rival-null.inertial-flow
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 4
  t1Damage: 12
  t1AddsChar: false
  t2Damage: 17
  t2AddsChar: false
  t3Damage: 21
  t3AddsChar: false
effects:
  # A < 2/3/4: 8, 13 or 17 damage besides.
  - target: { rolls: [damage], from: self }
    op: add
    value: '[8, 13, 17][flags.tier - 1]'
    when: >-
      flags.tier > 0 && has(participant)
        && participant.characteristics.agility.score + participant.potency.resistBonus.agility < [2, 3, 4][flags.tier - 1] + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
