id: abilities.angulotl.angulotl-dart.poison-dart
type: ability
grantOnly: false
tags:
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: ranged
  distance: 8
  rollBonus: 2
  damageType: poison
  t1Damage: 2
  t1AddsChar: false
  t2Damage: 4
  t2AddsChar: false
  t3Damage: 5
  t3AddsChar: false
# An edge against a target below full Stamina.
effects:
  - target: { rolls: [power-target], tally: edges, from: self }
    op: add
    value: 1
    when: participant.stamina.current < participant.stamina.max
