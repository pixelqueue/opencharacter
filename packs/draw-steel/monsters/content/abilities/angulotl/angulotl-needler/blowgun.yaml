id: abilities.angulotl.angulotl-needler.blowgun
type: ability
grantOnly: false
tags:
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  distanceKind: ranged
  distance: 15
  rollBonus: 2
  damageType: poison
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 6
  t2AddsChar: false
  t3Damage: 7
  t3AddsChar: false
# 2 Malice: weakened (save ends) if M < 2, with 2 poison damage each turn while it lasts.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.weakened'
          state: { duration: "'save'" }
          appliedBy: character.id
        - type: applyEffect
          source: '@effects.angulotl.envenomed'
          appliedBy: character.id
    when: >-
      flags.tier > 0 && has(params.malice) && params.malice >= 2
        && participant.characteristics.might.score + participant.potency.resistBonus.might
          < 2 + (has(steps.roll) ? steps.roll.tallies.potencyBonus : 0)
