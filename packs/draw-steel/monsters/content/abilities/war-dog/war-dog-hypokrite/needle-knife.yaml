# The extra 6 damage while hidden or disguised is the table's.
id: abilities.war-dog.war-dog-hypokrite.needle-knife
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 3
  t1Damage: 6
  t1AddsChar: false
  t2Damage: 8
  t2AddsChar: false
  t2Condition: conditions.bleeding
  t2Duration: save
  t2PotencyChar: agility
  t2PotencyValue: 2
  t3Damage: 10
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: agility
  t3PotencyValue: 3
effects:
  # Tier 3: weakened too, behind the same potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.weakened'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier == 3 && flags.landed
