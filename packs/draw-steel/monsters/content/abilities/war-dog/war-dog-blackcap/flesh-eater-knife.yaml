# The teleport and ash clone are the table's.
id: abilities.war-dog.war-dog-blackcap.flesh-eater-knife
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 5
  rollBonus: 4
  t1Damage: 8
  t1AddsChar: false
  t2Damage: 11
  t2AddsChar: false
  t3Damage: 12
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: might
  t3PotencyValue: 4
effects:
  # Tier 3: weakened too, behind the same potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@conditions.weakened'
          state: { duration: "'save'" }
          appliedBy: character.id
    when: flags.tier == 3 && flags.landed
