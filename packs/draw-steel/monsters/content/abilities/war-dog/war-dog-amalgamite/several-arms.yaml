# 3 Malice: each target the amalgamite grabs with this ability or already grabs takes 3 damage,
# and the amalgamite regains that much Stamina; other creatures they grab are the table's, as is
# grabbing up to four.
id: abilities.war-dog.war-dog-amalgamite.several-arms
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 3
  distanceKind: melee
  distance: 2
  rollBonus: 2
  t1Damage: 4
  t1AddsChar: false
  t2Damage: 5
  t2AddsChar: false
  t2Condition: conditions.grabbed
  t2PotencyChar: agility
  t2PotencyValue: 1
  t3Damage: 6
  t3AddsChar: false
  t3Condition: conditions.grabbed
  t3PotencyChar: agility
  t3PotencyValue: 2
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - { type: adjust, field: stamina.current, by: -3, tags: [damage] }
    when: >-
      has(params.malice) && params.malice >= 3 && flags.tier > 0
        && (flags.landed || character.id in participant.conditions.grabbedBy)
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      to: self
      changes:
        - { type: adjust, field: stamina.current, by: 3, tags: [healing] }
    when: >-
      has(params.malice) && params.malice >= 3 && flags.tier > 0
        && (flags.landed || character.id in participant.conditions.grabbedBy)
