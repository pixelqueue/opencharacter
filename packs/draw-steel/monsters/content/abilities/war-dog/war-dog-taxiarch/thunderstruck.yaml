# Thunderstruck lands on the target; the teleport is the table's. The taxiarch's edge on power
# rolls against a creature they made thunderstruck is this ability's rule on all their rolls (it
# reads their ID in the target's `edgesAgainstFor`).
id: abilities.war-dog.war-dog-taxiarch.thunderstruck
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.melee
fields:
  usage: triggered
  distanceKind: melee
  distance: 1
  t1Effect: effects.war-dog.thunderstruck
  t1Duration: save
effects:
  - target: { rolls: [power-target], tally: edges }
    op: add
    value: 1
    when: character.id in participant.powerRoll.edgesAgainstFor
