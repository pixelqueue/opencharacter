id: abilities.war-dog.iron-champion-doru.houndaxe
type: ability
grantOnly: false
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 3
  distanceKind: melee
  distance: 2
  rollBonus: 5
  t1Damage: 15
  t1AddsChar: false
  t2Damage: 21
  t2AddsChar: false
  t2Move: slide
  t2MoveDistance: 3
  t2PotencyChar: might
  t2PotencyValue: 4
  t2MovePotency: true
  t3Damage: 25
  t3AddsChar: false
  t3Move: slide
  t3MoveDistance: 5
  t3PotencyChar: might
  t3PotencyValue: 5
  t3MovePotency: true
effects:
  # Tiers 2 and 3: an edge, or a double edge, on Doru's next power roll (once per use).
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      to: self
      changes:
        - type: applyEffect
          source: '@effects.war-dog.next-roll-edge'
          state: { amount: flags.tier - 1, duration: "'encounter'" }
          appliedBy: character.id
    when: flags.tier >= 2 && participant.id == participants.target[0].id
