# The damage type the arachnite chooses is the `element` parameter. Ignoring cover and
# concealment and the 2 Malice option are the table's.
id: abilities.war-dog.war-dog-arachnite.longarm-shrikegun
type: ability
grantOnly: false
tags:
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  spendCost: 2
  distanceKind: ranged
  distance: 15
  rollBonus: 3
  t1Damage: 7
  t1AddsChar: false
  t2Damage: 9
  t2AddsChar: false
  t3Damage: 11
  t3AddsChar: false
  t3Condition: conditions.bleeding
  t3Duration: save
  t3PotencyChar: agility
  t3PotencyValue: 3
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      element:
        type: enum
        values: [acid, cold, fire, lightning, poison, psychic, sonic]
        default: acid
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value: [{ formula: "'damage.' + params.element" }]
