id: abilities.high-elf.high-elf-ordinator.lightning-rod
type: ability
grantOnly: false
tags:
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: signature
  distanceKind: ranged
  distance: 10
  rollBonus: 3
  damageType: lightning
  t1Damage: 9
  t1AddsChar: false
  t1Condition: conditions.dazed
  t1Duration: save
  t1PotencyChar: reason
  t1PotencyValue: 1
  t2Damage: 14
  t2AddsChar: false
  t2Condition: conditions.dazed
  t2Duration: save
  t2PotencyChar: reason
  t2PotencyValue: 2
  t3Damage: 17
  t3AddsChar: false
  t3Condition: conditions.dazed
  t3Duration: save
  t3PotencyChar: reason
  t3PotencyValue: 3
# For any tier: the high elves' edge against the target until the start of the ordinator's next
# turn (beside the tier's dazed). Any ally of the ordinator gains it, not only high elves.
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: '@effects.high-elf.lightning-rod'
          state: { duration: "'next-start'" }
          appliedBy: character.id
    when: flags.tier > 0
