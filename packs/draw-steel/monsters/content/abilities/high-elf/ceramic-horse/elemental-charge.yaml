# Tier 1 is untyped, tier 2 fire and tier 3 lightning: the tier's damage part is tagged by tier.
id: abilities.high-elf.ceramic-horse.elemental-charge
type: ability
grantOnly: false
tags:
  - kw.charge
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 7
  t2AddsChar: false
  t3Damage: 9
  t3AddsChar: false
  t3Condition: conditions.prone
  t3PotencyChar: might
  t3PotencyValue: 2
effects:
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value:
      - formula: "flags.tier == 2 ? ['damage.fire'] : flags.tier == 3 ? ['damage.lightning'] : []"
