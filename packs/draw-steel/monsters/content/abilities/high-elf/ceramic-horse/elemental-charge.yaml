# Each tier has its own type (5 damage, 7 fire, 9 lightning): the typed damage of tiers 2 and 3
# is a roll effect over a 0 base.
id: abilities.high-elf.ceramic-horse.elemental-charge
type: ability
grantOnly: false
tags:
  - kw.charge
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  distanceKind: melee
  distance: 1
  rollBonus: 2
  t1Damage: 5
  t1AddsChar: false
  t2Damage: 0
  t2AddsChar: false
  t3Damage: 0
  t3AddsChar: false
  t3Condition: conditions.prone
  t3PotencyChar: might
  t3PotencyValue: 2
effects:
  - target: { rolls: [damage], from: self }
    op: add
    value: 7
    tags: [damage.fire]
    when: flags.tier == 2
  - target: { rolls: [damage], from: self }
    op: add
    value: 9
    tags: [damage.lightning]
    when: flags.tier == 3
