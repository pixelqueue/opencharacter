# Roughed Up: grabbed (granted, with its rules; the entry's applier is the grabber), and the fury
# and their allies (the Director's side) gain an edge on strikes against the creature while the
# grab lasts.
id: effects.rival.fury-grab
type: effect
grants:
  - { item: conditions.grabbed, scope: applied }
effects:
  - { target: powerRoll.strikeEdgesAgainstSide.director, op: add, value: 1, scope: applied }
