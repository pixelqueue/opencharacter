# Steelfist and Death Grip: grabbed (granted, with its rules; the entry's applier is the
# grabber), and the fury and their allies (the Director's side) have a double edge on strikes
# against the creature while the grab lasts: this entry's edge, and the second is the rule
# `fury-grab-double-edge`.
id: effects.rival.fury-grab-double
type: effect
grants:
  - { item: conditions.grabbed, scope: applied }
effects:
  - target: powerRoll.strikeEdgesAgainstFor
    op: grant
    value: { formula: "'director'" }
    scope: applied
