# Steelfist and Death Grip: grabbed (granted, with its rules; the entry's applier is the
# grabber), and strikes against the creature have a double edge while the grab lasts. The edge is
# any attacker's: strikes against a grabbed hero come from the fury's side.
id: effects.rival.fury-grab-double
type: effect
grants:
  - { item: conditions.grabbed, scope: applied }
effects:
  - { target: powerRoll.strikeEdgesAgainst, op: add, value: 2, scope: applied }
