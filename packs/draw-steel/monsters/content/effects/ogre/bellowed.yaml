# Horrible Bellow: frightened (granted, with its rules; the bellower is its source), and while
# frightened this way, any ogre (the Director's side) gains an edge on strikes against them.
id: effects.ogre.bellowed
type: effect
grants:
  - { item: conditions.frightened, scope: applied }
effects:
  - target: powerRoll.strikeEdgesAgainstFor
    op: grant
    value: { formula: "'director'" }
    scope: applied
