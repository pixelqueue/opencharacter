# Twin Flamebelchers: a bane on strikes and damage weakness 5.
id: effects.war-dog.seared
type: effect
effects:
  - target: { rolls: [power-roll.ability], tally: banes }
    op: add
    value: 1
    scope: applied
    when: "'kw.strike' in roll.item.tags"
  - { target: weakness.all, op: add, value: 5, scope: applied }
