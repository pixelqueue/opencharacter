# Sparkling Tail Whip: a bane on the creature's strikes; line of effect only within 1 square is
# the table's.
id: effects.lightbender.dazzled
type: effect
effects:
  - target: { rolls: [power-roll.ability], tally: banes }
    op: add
    value: 1
    scope: applied
    when: "'kw.strike' in roll.item.tags"
