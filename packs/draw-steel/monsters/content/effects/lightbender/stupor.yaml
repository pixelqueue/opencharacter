# Hypnotic Mane, Illusory Feint: speed 0 while dazed this way. The dazed condition ending when the
# creature takes damage or is shaken out of it is the table's; this ends at the end of a turn the
# creature isn't dazed.
id: effects.lightbender.stupor
type: effect
effects:
  - { target: speed, op: atMost, value: 0, scope: applied, when: conditions.dazed }
  - target: { steps: [turn.end] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'item.id == @effects.lightbender.stupor' }
    when: '!conditions.dazed'
