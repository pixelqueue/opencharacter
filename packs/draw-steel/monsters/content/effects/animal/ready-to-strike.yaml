# Ready to Strike: an edge on the predator's next strike, which ends it.
id: effects.animal.ready-to-strike
type: effect
effects:
  - target: { rolls: [power-roll.ability], tally: edges }
    op: add
    value: 1
    scope: applied
    when: "'kw.strike' in roll.item.tags"
  - target: { steps: [ability.after] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'item.id == @effects.animal.ready-to-strike' }
    when: "'kw.strike' in action.item.tags"
