# Knife in the Dark: the mournblade (the entry's applier) is invisible to the creature, so the
# creature's strikes against the mournblade take a bane. Invisibility's other parts are the table's.
id: effects.shadow-elf.mournblade-unseen
type: effect
effects:
  - target: { rolls: [power-target], tally: banes }
    op: add
    value: 1
    scope: applied
    when: "participant.id == self.appliedBy && 'kw.strike' in action.item.tags"
