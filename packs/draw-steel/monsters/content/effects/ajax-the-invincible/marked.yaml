# Is This What They Taught You?: the creature is marked while Ajax is marked. Ajax's edge on power
# rolls against them: his ID in `edgesAgainstFor`, read by the ability's rule. The free strike is
# the table's.
id: effects.ajax-the-invincible.marked
type: effect
effects:
  - target: powerRoll.edgesAgainstFor
    op: grant
    value: { formula: self.appliedBy }
    scope: applied
