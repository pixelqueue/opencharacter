# Burning Oil: 1d6 fire damage at the start of each of the creature's turns.
id: effects.valok.burning
type: effect
effects:
  - target: { steps: [turn.start] }
    op: action
    scope: applied
    value:
      id: burning
      use: ongoing-damage
      params: { dice: 1d6, damageType: "'fire'" }
