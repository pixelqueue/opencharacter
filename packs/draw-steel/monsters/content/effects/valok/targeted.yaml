# Targeting Beam: slowed (granted, with its rules), and any strike against the creature has a
# double edge, one entry (save ends).
id: effects.valok.targeted
type: effect
grants:
  - { item: conditions.slowed, scope: applied }
effects:
  - { target: powerRoll.strikeEdgesAgainst, op: add, value: 2, scope: applied }
