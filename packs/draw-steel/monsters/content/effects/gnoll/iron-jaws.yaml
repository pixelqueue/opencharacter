# Iron Jaws: bleeding (granted, with its rules), and while bleeding this way strikes against the
# creature gain an edge. The book gives the edge to gnolls; the field is any attacker's.
id: effects.gnoll.iron-jaws
type: effect
grants:
  - { item: conditions.bleeding, scope: applied }
effects:
  - { target: powerRoll.strikeEdgesAgainst, op: add, value: 1, scope: applied }
