# Iron Jaws: bleeding (granted, with its rules), and while bleeding this way each gnoll (the
# Director's side) gains an edge on strikes against the creature.
id: effects.gnoll.iron-jaws
type: effect
grants:
  - { item: conditions.bleeding, scope: applied }
effects:
  - target: powerRoll.strikeEdgesAgainstFor
    op: grant
    value: { formula: "'director'" }
    scope: applied
