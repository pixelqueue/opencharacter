# Eager Claws: a bane on the creature's next strike, which ends it.
id: effects.voiceless-talker.next-strike-bane
type: effect
effects:
  - target: { rolls: [power-roll.ability], tally: banes }
    op: add
    value: 1
    scope: applied
    when: "'kw.strike' in roll.item.tags"
  - target: { steps: [ability.after] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'item.id == @effects.voiceless-talker.next-strike-bane' }
    when: "'kw.strike' in action.item.tags"
