# Tail Spike's 1 Malice: 1d6 poison damage at the start of each of the creature's turns while
# weakened; it ends at the end of a turn the creature isn't weakened.
id: effects.manticore.spike-poison
type: effect
effects:
  - target: { steps: [turn.start] }
    op: action
    scope: applied
    value: { id: spike-poison, use: ongoing-damage, params: { dice: 1d6, damageType: "'poison'" } }
    when: conditions.weakened
  - target: { steps: [turn.end] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'self.source == @effects.manticore.spike-poison' }
    when: '!conditions.weakened'
