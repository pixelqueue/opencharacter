# Exposed Crux: a double edge on the mound's power rolls, and strikes made against them gain an
# edge. Melee 10 is the table's.
id: effects.shambling-mound.exposed-crux
type: effect
effects:
  - target: { rolls: [power-roll.ability], tally: edges }
    op: add
    value: 2
    scope: applied
  - { target: powerRoll.strikeEdgesAgainst, op: add, value: 1, scope: applied }
