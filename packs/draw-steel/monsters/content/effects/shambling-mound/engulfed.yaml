# Engulf: restrained (restrained's speed and banes as the heroes condition has them) and 3 poison
# damage at the start of each of the creature's turns, until freed (the table's: the sack
# destroyed or the mound dead). Immunity to damage from outside the sack is the table's.
id: effects.shambling-mound.engulfed
type: effect
effects:
  - target: conditions.active
    op: grant
    value: { formula: '@conditions.restrained' }
    scope: applied
  - { target: speed, op: atMost, value: 0, scope: applied }
  - target: { rolls: [power-roll.ability, test.might, test.agility], tally: banes }
    op: add
    value: 1
    scope: applied
  - target: { steps: [turn.start] }
    op: changes
    scope: applied
    value:
      changes:
        - type: adjust
          field: stamina.current
          by: -3
          tags: [damage, damage.poison]
