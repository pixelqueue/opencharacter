# "Ability rolls against the creature take a bane" (or a double bane: `amount` 2) for a while:
# Battlefield Medic, Defensive Fighting, riding the Nameless.
id: effects.retainer.banes-against
type: effect
state:
  amount: { type: integer, default: 1, min: 1 }
effects:
  - { target: powerRoll.banesAgainst, op: add, value: self.amount, scope: applied }
