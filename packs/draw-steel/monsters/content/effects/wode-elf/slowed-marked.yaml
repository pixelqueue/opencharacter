# You Activated My Trap! tiers 2 and 3: slowed (granted, with its rules) and marked, one saving
# throw for both; the wode elves' allies gain an edge on abilities against the creature.
id: effects.wode-elf.slowed-marked
type: effect
grants:
  - { item: conditions.slowed, scope: applied }
effects:
  - target: powerRoll.edgesAgainstFor
    op: grant
    value: { formula: "'director'" }
    scope: applied
