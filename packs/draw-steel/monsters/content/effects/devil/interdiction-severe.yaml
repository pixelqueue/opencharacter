# Adjudicator's Interdiction (tier 1): slowed (granted, with its rule), a bane on power rolls, and
# no regaining Stamina (the table's), one saving throw for all three.
id: effects.devil.interdiction-severe
type: effect
grants:
  - { item: conditions.slowed, scope: applied }
effects:
  - { target: { rolls: [power-roll], tally: banes }, op: add, value: 1, scope: applied }
