# Adjudicator's Interdiction (tier 2): slowed and a bane on power rolls, one saving throw for both.
id: effects.devil.interdiction
type: effect
effects:
  - target: conditions.active
    op: grant
    value: { formula: '@conditions.slowed' }
    scope: applied
  - { target: speed, op: atMost, value: speed.slowedMax, scope: applied }
  - { target: { rolls: [power-roll], tally: banes }, op: add, value: 1, scope: applied }
