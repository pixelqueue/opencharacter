# Burning: 1d6 fire damage at the start of each of the creature's turns (an object's at the end of
# each round is the table's).
id: effects.hobgoblin.burning
type: effect
effects:
  - target: { steps: [turn.start] }
    op: action
    scope: applied
    value: { id: burning, use: ongoing-damage, params: { dice: 1d6, damageType: "'fire'" } }
