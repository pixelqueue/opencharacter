# Soul Sword's mark: the bloodlord's allies (the Director's side) gain an edge on strikes against
# the creature. The three-mark limit is the table's.
id: effects.hobgoblin.soul-marked
type: effect
effects:
  - target: powerRoll.strikeEdgesAgainstFor
    op: grant
    value: { formula: "'director'" }
    scope: applied
