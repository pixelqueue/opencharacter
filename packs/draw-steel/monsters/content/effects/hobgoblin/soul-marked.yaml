# Soul Sword's mark: strikes against the creature gain an edge. The book gives the edge to the
# bloodlord's allies; the field is any attacker's (strikes against a marked hero come from the
# Director's side). The three-mark limit is the table's.
id: effects.hobgoblin.soul-marked
type: effect
effects:
  - { target: powerRoll.strikeEdgesAgainst, op: add, value: 1, scope: applied }
