# Smoke Bomb: a double bane on the creature's next power roll, which ends it.
id: effects.hobgoblin.smoke-double-bane
type: effect
effects:
  - target: { rolls: [power-roll], tally: banes }
    op: add
    value: 2
    scope: applied
  - target: { steps: [ability.after] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'self.source == @effects.hobgoblin.smoke-double-bane' }
    when: has(steps.roll)
