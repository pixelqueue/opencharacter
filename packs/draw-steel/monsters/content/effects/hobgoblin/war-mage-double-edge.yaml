# Enchantments of War: a double edge on the creature's next power roll, which ends it.
id: effects.hobgoblin.war-mage-double-edge
type: effect
effects:
  - target: { rolls: [power-roll], tally: edges }
    op: add
    value: 2
    scope: applied
  - target: { steps: [ability.after] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'item.id == @effects.hobgoblin.war-mage-double-edge' }
    when: has(steps.roll)
