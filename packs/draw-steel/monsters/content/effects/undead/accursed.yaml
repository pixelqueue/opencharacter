# Accursed Slam: bleeding (granted, with its rules), and while bleeding this way the potency of any
# ability used against the creature is 1 higher for them (they resist as if 1 lower).
id: effects.undead.accursed
type: effect
grants:
  - { item: conditions.bleeding, scope: applied }
effects:
  - { target: potency.resistBonus.might, op: add, value: -1, scope: applied }
  - { target: potency.resistBonus.agility, op: add, value: -1, scope: applied }
  - { target: potency.resistBonus.reason, op: add, value: -1, scope: applied }
  - { target: potency.resistBonus.intuition, op: add, value: -1, scope: applied }
  - { target: potency.resistBonus.presence, op: add, value: -1, scope: applied }
