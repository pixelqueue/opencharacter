# Eldritch Curse: bleeding and weakened (granted, each with its rules), one saving throw for both,
# and the mummy's allies (the Director's side) gain an edge on strikes against the creature.
id: effects.undead.cursed
type: effect
grants:
  - { item: conditions.bleeding, scope: applied }
  - { item: conditions.weakened, scope: applied }
effects:
  - { target: powerRoll.strikeEdgesAgainstSide.director, op: add, value: 1, scope: applied }
