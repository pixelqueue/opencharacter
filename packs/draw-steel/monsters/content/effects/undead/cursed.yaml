# Eldritch Curse: bleeding and weakened, one saving throw for both (each condition's rule rides
# along: weakened's bane), and the mummy's allies gain an edge on strikes against the creature.
# The edge is any attacker's: strikes against a cursed hero come from the Director's side.
id: effects.undead.cursed
type: effect
effects:
  - target: conditions.active
    op: grant
    value: { formula: '@conditions.bleeding' }
    scope: applied
  - target: conditions.active
    op: grant
    value: { formula: '@conditions.weakened' }
    scope: applied
  - { target: { rolls: [power-roll], tally: banes }, op: add, value: 1, scope: applied }
  - { target: powerRoll.strikeEdgesAgainst, op: add, value: 1, scope: applied }
