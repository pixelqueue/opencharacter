# Eldritch Curse: bleeding and weakened (granted, each with its rules), one saving throw for both,
# and the mummy's allies gain an edge on strikes against the creature. The edge is any
# attacker's: strikes against a cursed hero come from the Director's side.
id: effects.undead.cursed
type: effect
grants:
  - { item: conditions.bleeding, scope: applied }
  - { item: conditions.weakened, scope: applied }
effects:
  - { target: powerRoll.strikeEdgesAgainst, op: add, value: 1, scope: applied }
