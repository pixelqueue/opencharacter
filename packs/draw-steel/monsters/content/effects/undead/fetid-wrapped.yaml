# Fetid Wrappings: strikes against the creature gain an edge until the end of the round (the entry
# ends when the next round starts). The book gives the edge to the rotwrap's allies; the strike
# field is anyone's.
id: effects.undead.fetid-wrapped
type: effect
effects:
  - { target: powerRoll.strikeEdgesAgainst, op: add, value: 1, scope: applied }
  - target: { steps: [round.start] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'item.id == @effects.undead.fetid-wrapped' }
