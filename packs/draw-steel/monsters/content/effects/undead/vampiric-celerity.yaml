# Vampiric Celerity: an edge on the vampire spawn's next ability (before the start of their next
# turn), which ends it.
id: effects.undead.vampiric-celerity
type: effect
effects:
  - target: { rolls: [power-roll.ability], tally: edges }
    op: add
    value: 1
    scope: applied
  - target: { steps: [ability.after] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'item.id == @effects.undead.vampiric-celerity' }
