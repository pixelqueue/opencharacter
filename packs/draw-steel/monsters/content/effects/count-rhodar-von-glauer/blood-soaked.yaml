# Red Tide: Rhodar has a double edge on abilities used against the creature: his ID in
# `edgesAgainstFor` (one edge), and Red Tide's rule adds the second.
id: effects.count-rhodar-von-glauer.blood-soaked
type: effect
effects:
  - target: powerRoll.edgesAgainstFor
    op: grant
    value: { formula: self.appliedBy }
    scope: applied
