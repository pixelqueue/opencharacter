# Bite: while grabbed this way, a size 1 creature takes 3 acid damage at the start of each of
# their turns. Ends at a turn start when the arixx who applied it no longer grabs them.
id: effects.arixx.digesting
type: effect
effects:
  - target: { steps: [turn.start] }
    op: changes
    scope: applied
    value:
      changes:
        - type: adjust
          field: stamina.current
          by: -3
          tags: [damage, damage.acid]
    when: self.appliedBy in conditions.grabbedBy
  - target: { steps: [turn.start] }
    op: changes
    scope: applied
    value:
      changes:
        - type: removeEffect
          applied: { where: 'item.id == @effects.arixx.digesting' }
    when: '!(self.appliedBy in conditions.grabbedBy)'
