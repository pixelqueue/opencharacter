# Food Frenzy: a double edge on the glutton's strikes. That strikes against the glutton gain an
# edge is the table's (the heroes pack has no edge against a creature).
id: effects.troll.food-frenzy
type: effect
effects:
  - target: { rolls: [power-roll.ability], tally: edges }
    op: add
    value: 2
    scope: applied
    when: "'kw.strike' in roll.item.tags"
