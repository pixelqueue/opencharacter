# Shadow Cloak: the sneak (the entry's applier) has concealment from the creature, so the
# creature's strikes against the sneak take a bane. Concealment's other parts are the table's.
id: effects.bugbear.sneak-concealed
type: effect
effects:
  - target: { rolls: [power-target], tally: banes }
    op: add
    value: 1
    scope: applied
    when: "participant.id == self.appliedBy && 'kw.strike' in action.item.tags"
