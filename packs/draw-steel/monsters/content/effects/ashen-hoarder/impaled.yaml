# Impale: an impaled creature is restrained and bleeding while it lasts (restrained's speed and
# banes as the heroes condition has them).
id: effects.ashen-hoarder.impaled
type: effect
effects:
  - target: conditions.active
    op: grant
    value: { formula: '@conditions.restrained' }
    scope: applied
  - target: conditions.active
    op: grant
    value: { formula: '@conditions.bleeding' }
    scope: applied
  - { target: speed, op: atMost, value: 0, scope: applied }
  - target: { rolls: [power-roll.ability, test.might, test.agility], tally: banes }
    op: add
    value: 1
    scope: applied
