# A Deathcount (omen dragon): the lowest one imposed counts. Its countdown in the dragon's aura,
# the death at 0 and losing every Deathcount when the dragon is reduced to 0 Stamina are the
# table's.
id: effects.dragon.deathcount
type: effect
state:
  amount: { type: integer, default: 12, min: 0 }
reapply: { state: { amount: lowest, duration: replace } }
