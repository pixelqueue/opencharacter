# Convocation of Quartz: melee strikes against the creature take a bane (unless they already have
# one or a double bane). The heroes field is a bane on every ability roll against the creature:
# that it's melee strikes only is the table's.
id: effects.elemental.quartz
type: effect
effects:
  - { target: powerRoll.banesAgainst, op: add, value: 1, scope: applied }
