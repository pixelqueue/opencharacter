# Convocation of Quartz: melee strikes against the creature take a bane (unless they already have
# one or a double bane). The heroes pack has a bane on strikes against a creature, not on melee
# strikes alone: that a ranged strike takes none is the table's.
id: effects.elemental.quartz
type: effect
effects:
  - { target: powerRoll.strikeBanesAgainst, op: add, value: 1, scope: applied }
