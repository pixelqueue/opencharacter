# Disemboweling Horns: while bleeding this way, 1d6 damage at the start of each of the target's
# turns (save ends, with the bleeding).
id: effects.minotaur.disemboweled
type: effect
effects:
  - target: { steps: [turn.start] }
    op: action
    scope: applied
    value: { id: disemboweled, use: ongoing-damage, params: { dice: 1d6 } }
