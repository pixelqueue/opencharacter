# Disemboweling Horns: bleeding (granted, with its rules), and while bleeding this way, 1d6 damage
# at the start of each of the target's turns. One saving throw ends both.
id: effects.minotaur.disemboweled
type: effect
grants:
  - { item: conditions.bleeding, scope: applied }
effects:
  - target: { steps: [turn.start] }
    op: action
    scope: applied
    value: { id: disemboweled, use: ongoing-damage, params: { dice: 1d6 } }
