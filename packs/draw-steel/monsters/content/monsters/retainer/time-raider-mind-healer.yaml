id: monsters.retainer.time-raider-mind-healer
type: monster
tags:
  - creature.humanoid
  - creature.time-raider
fields:
  level: 3
  organization: retainer
  role: support
  size: 1m
  speed: 5
  stamina: 39
  freeStrike: 4
  might: 0
  agility: 2
  reason: 2
  intuition: 2
  presence: 0
  psychicImmunity: 5
  traits:
    - traits.retainer.time-raider-mind-healer.foresight
  abilities:
    - abilities.retainer.time-raider-mind-healer.laser-lancet
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'agility'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [4, 7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.time-raider-mind-healer.stim-charge, @abilities.retainer.role-support.battlefield-medic, @abilities.retainer.time-raider-mind-healer.mind-whelm, @abilities.retainer.role-support.focus-fire, @abilities.retainer.time-raider-mind-healer.psychic-short-circuit, @abilities.retainer.role-support.back-from-the-dead]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.time-raider-mind-healer.stim-charge, @abilities.retainer.time-raider-mind-healer.mind-whelm, @abilities.retainer.time-raider-mind-healer.psychic-short-circuit][indexOf([4, 7, 10], slot)]
