id: monsters.retainer.radenwight-sidekick
type: monster
tags:
  - creature.humanoid
  - creature.radenwight
fields:
  level: 1
  organization: retainer
  role: support
  size: 1s
  speed: 5
  movement:
    - move.climb
  stamina: 21
  freeStrike: 2
  might: 0
  agility: 2
  reason: 0
  intuition: 1
  presence: 0
  traits: []
  abilities:
    - abilities.retainer.radenwight-sidekick.daggers-bite
    - abilities.retainer.radenwight-sidekick.ready-rodent
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase2
    when: item.level >= 2
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'intuition'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase2'" }
        op: set
        value: 'true'
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'agility'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [4, 7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.radenwight-sidekick.boost, @abilities.retainer.role-support.battlefield-medic, @abilities.retainer.radenwight-sidekick.bug-bag, @abilities.retainer.role-support.focus-fire, @abilities.retainer.radenwight-sidekick.triumphant-squeak, @abilities.retainer.role-support.back-from-the-dead]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.radenwight-sidekick.boost, @abilities.retainer.radenwight-sidekick.bug-bag, @abilities.retainer.radenwight-sidekick.triumphant-squeak][indexOf([4, 7, 10], slot)]
