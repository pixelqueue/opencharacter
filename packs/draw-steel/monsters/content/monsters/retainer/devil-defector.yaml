id: monsters.retainer.devil-defector
type: monster
tags:
  - creature.devil
  - creature.infernal
fields:
  level: 5
  organization: retainer
  role: hexer
  size: 1m
  speed: 6
  movement:
    - move.fly
  stamina: 57
  freeStrike: 5
  might: 3
  agility: 2
  reason: 3
  intuition: 1
  presence: 2
  fireImmunity: 5
  traits:
    - traits.retainer.devil-defector.true-name
  abilities:
    - abilities.retainer.devil-defector.black-flame
    - abilities.retainer.devil-defector.tempting-offer
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'might'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.devil-defector.flames-of-revenge, @abilities.retainer.role-hexer.take-root, @abilities.retainer.devil-defector.hell-on-earth, @abilities.retainer.role-hexer.mazed]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.devil-defector.flames-of-revenge, @abilities.retainer.devil-defector.hell-on-earth][indexOf([7, 10], slot)]
