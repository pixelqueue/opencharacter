id: monsters.retainer.goblin-guide
type: monster
tags:
  - creature.goblin
  - creature.humanoid
fields:
  level: 1
  organization: retainer
  role: harrier
  size: 1s
  speed: 5
  movement:
    - move.climb
  stamina: 21
  freeStrike: 2
  might: -1
  agility: 1
  reason: 0
  intuition: 0
  presence: 1
  traits:
    - traits.retainer.goblin-guide.crafty
  abilities:
    - abilities.retainer.goblin-guide.stabbity-stab
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase2
    when: item.level >= 2
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'agility'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase2'" }
        op: set
        value: 'true'
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'agility'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [4, 7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.goblin-guide.weaving-knives, @abilities.retainer.role-harrier.tackle, @abilities.retainer.goblin-guide.sneak-and-stab, @abilities.retainer.role-harrier.meet-you-there, @abilities.retainer.goblin-guide.poison-blade, @abilities.retainer.role-harrier.nab-and-stab]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.goblin-guide.weaving-knives, @abilities.retainer.goblin-guide.sneak-and-stab, @abilities.retainer.goblin-guide.poison-blade][indexOf([4, 7, 10], slot)]
