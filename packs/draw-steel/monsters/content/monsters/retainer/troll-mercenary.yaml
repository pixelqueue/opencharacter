id: monsters.retainer.troll-mercenary
type: monster
tags:
  - creature.giant
  - creature.troll
fields:
  level: 5
  organization: retainer
  role: brute
  size: '2'
  speed: 6
  stamina: 57
  stability: 4
  freeStrike: 6
  might: 3
  agility: 1
  reason: -1
  intuition: 0
  presence: 1
  acidWeakness: 5
  traits:
    - traits.retainer.troll-mercenary.relentless-hunger
  abilities:
    - abilities.retainer.troll-mercenary.big-bite
    - abilities.retainer.troll-mercenary.troll-roar
  fireWeakness: 5
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'might'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.troll-mercenary.hangry-frenzy, @abilities.retainer.role-brute.overhand-swat, @abilities.retainer.troll-mercenary.fire-bad, @abilities.retainer.role-brute.dizzying-sweep]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.troll-mercenary.hangry-frenzy, @abilities.retainer.troll-mercenary.fire-bad][indexOf([7, 10], slot)]
