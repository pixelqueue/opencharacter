id: monsters.retainer.human-warrior
type: monster
tags:
  - creature.human
  - creature.humanoid
fields:
  level: 1
  organization: retainer
  role: defender
  size: 1m
  speed: 5
  stamina: 21
  freeStrike: 2
  might: 2
  agility: 0
  reason: 0
  intuition: 0
  presence: 1
  traits:
    - traits.retainer.human-warrior.supernatural-insight
  abilities:
    - abilities.retainer.human-warrior.chop
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase2
    when: item.level >= 2
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'presence'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase2'" }
        op: set
        value: 'true'
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'might'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [4, 7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.human-warrior.scuse-me-boss, @abilities.retainer.role-defender.watch-out, @abilities.retainer.human-warrior.defensive-fighting, @abilities.retainer.role-defender.its-me-you-want, @abilities.retainer.human-warrior.whirlwind-of-steel, @abilities.retainer.role-defender.last-stand]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.human-warrior.scuse-me-boss, @abilities.retainer.human-warrior.defensive-fighting, @abilities.retainer.human-warrior.whirlwind-of-steel][indexOf([4, 7, 10], slot)]
