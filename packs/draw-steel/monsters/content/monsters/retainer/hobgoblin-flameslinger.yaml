id: monsters.retainer.hobgoblin-flameslinger
type: monster
tags:
  - creature.goblin
  - creature.hobgoblin
  - creature.humanoid
  - creature.infernal
fields:
  level: 4
  organization: retainer
  role: controller
  size: 1m
  speed: 5
  stamina: 48
  freeStrike: 5
  might: 1
  agility: 0
  reason: 2
  intuition: 1
  presence: 3
  fireImmunity: 4
  traits:
    - traits.retainer.hobgoblin-flameslinger.infernal-ichor
  abilities:
    - abilities.retainer.hobgoblin-flameslinger.fire-curse
    - abilities.retainer.hobgoblin-flameslinger.fuel-for-the-fire
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'reason'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.hobgoblin-flameslinger.unholy-attraction, @abilities.retainer.role-controller.oil-slick, @abilities.retainer.hobgoblin-flameslinger.fire-spiral, @abilities.retainer.role-controller.shattering-shards]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.hobgoblin-flameslinger.unholy-attraction, @abilities.retainer.hobgoblin-flameslinger.fire-spiral][indexOf([7, 10], slot)]
