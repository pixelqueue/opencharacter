id: monsters.retainer.minotaur-gorer
type: monster
tags:
  - creature.accursed
  - creature.humanoid
  - creature.minotaur
fields:
  level: 3
  organization: retainer
  role: brute
  size: '2'
  speed: 6
  stamina: 39
  stability: 2
  freeStrike: 6
  might: 2
  agility: 1
  reason: 0
  intuition: 1
  presence: 0
  traits:
    - traits.retainer.minotaur-gorer.minotaur-sense
  abilities:
    - abilities.retainer.minotaur-gorer.gore
    - abilities.retainer.minotaur-gorer.retaliatory-strike
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'might'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [4, 7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.minotaur-gorer.horn-toss, @abilities.retainer.role-brute.big-windup, @abilities.retainer.minotaur-gorer.triumphant-bay, @abilities.retainer.role-brute.overhand-swat, @abilities.retainer.minotaur-gorer.horn-rake, @abilities.retainer.role-brute.dizzying-sweep]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.minotaur-gorer.horn-toss, @abilities.retainer.minotaur-gorer.triumphant-bay, @abilities.retainer.minotaur-gorer.horn-rake][indexOf([4, 7, 10], slot)]
