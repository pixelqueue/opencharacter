id: monsters.retainer.dwarf-mortar
type: monster
tags:
  - creature.dwarf
  - creature.humanoid
fields:
  level: 1
  organization: retainer
  role: hexer
  size: 1m
  speed: 5
  stamina: 21
  stability: 3
  freeStrike: 3
  might: 2
  agility: 0
  reason: 0
  intuition: 1
  presence: 0
  traits:
    - traits.retainer.dwarf-mortar.voice-rune
  abilities:
    - abilities.retainer.dwarf-mortar.mortar
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase2
    when: item.level >= 2
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'intuition'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase2'" }
        op: set
        value: 'true'
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'might'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [4, 7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.dwarf-mortar.signal-shell, @abilities.retainer.role-hexer.backfire-curse, @abilities.retainer.dwarf-mortar.screaming-shell, @abilities.retainer.role-hexer.take-root, @abilities.retainer.dwarf-mortar.pacifier-shell, @abilities.retainer.role-hexer.mazed]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.dwarf-mortar.signal-shell, @abilities.retainer.dwarf-mortar.screaming-shell, @abilities.retainer.dwarf-mortar.pacifier-shell][indexOf([4, 7, 10], slot)]
