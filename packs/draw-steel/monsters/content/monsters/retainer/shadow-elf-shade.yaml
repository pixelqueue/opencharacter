id: monsters.retainer.shadow-elf-shade
type: monster
tags:
  - creature.fey
  - creature.humanoid
  - creature.shadow-elf
fields:
  level: 4
  organization: retainer
  role: ambusher
  size: 1m
  speed: 5
  movement:
    - move.climb
  stamina: 48
  freeStrike: 5
  might: 1
  agility: 3
  reason: 0
  intuition: 2
  presence: 1
  traits:
    - traits.retainer.shadow-elf-shade.of-the-umbra
  abilities:
    - abilities.retainer.shadow-elf-shade.gloom-dagger
    - abilities.retainer.shadow-elf-shade.duskfall
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'agility'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.shadow-elf-shade.slow-poison-needle, @abilities.retainer.role-ambusher.hamstring-slice, @abilities.retainer.shadow-elf-shade.shadow-dagger, @abilities.retainer.role-ambusher.hold-em-down]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.shadow-elf-shade.slow-poison-needle, @abilities.retainer.shadow-elf-shade.shadow-dagger][indexOf([7, 10], slot)]
