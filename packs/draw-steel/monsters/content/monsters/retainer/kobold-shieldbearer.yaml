# The source data has size 2, stability 4 and free strike 6; the book prints 1S, 0 and 2.
id: monsters.retainer.kobold-shieldbearer
type: monster
tags:
  - creature.humanoid
  - creature.kobold
fields:
  level: 1
  organization: retainer
  role: defender
  size: '1s'
  speed: 5
  stamina: 21
  freeStrike: 2
  might: 2
  agility: 1
  reason: 0
  intuition: 0
  presence: 0
  traits:
    - traits.retainer.kobold-shieldbearer.shield-boss
  abilities:
    - abilities.retainer.kobold-shieldbearer.gladius
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase2
    when: item.level >= 2
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'agility'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase2'" }
        op: set
        value: 'true'
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'might'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [4, 7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.kobold-shieldbearer.shield-block, @abilities.retainer.role-defender.watch-out, @abilities.retainer.kobold-shieldbearer.living-backpack, @abilities.retainer.role-defender.its-me-you-want, @abilities.retainer.kobold-shieldbearer.lets-go-sledding, @abilities.retainer.role-defender.last-stand]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.kobold-shieldbearer.shield-block, @abilities.retainer.kobold-shieldbearer.living-backpack, @abilities.retainer.kobold-shieldbearer.lets-go-sledding][indexOf([4, 7, 10], slot)]
