id: monsters.retainer.the-nameless
type: monster
tags:
  - creature.draconian
  - creature.dragon
  - creature.humanoid
fields:
  level: 6
  organization: retainer
  role: defender
  size: 1m
  speed: 5
  movement:
    - move.fly
  stamina: 66
  stability: 4
  freeStrike: 6
  might: 3
  agility: 2
  reason: 1
  intuition: 1
  presence: 2
  corruptionImmunity: 6
  traits:
    - traits.retainer.the-nameless.wing-block
  abilities:
    - abilities.retainer.the-nameless.baneful-blade
    - abilities.retainer.the-nameless.im-not-a-steed-youre-equipment
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'might'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.the-nameless.looming-wings, @abilities.retainer.role-defender.its-me-you-want, @abilities.retainer.the-nameless.spew-death, @abilities.retainer.role-defender.last-stand]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.the-nameless.looming-wings, @abilities.retainer.the-nameless.spew-death][indexOf([7, 10], slot)]
