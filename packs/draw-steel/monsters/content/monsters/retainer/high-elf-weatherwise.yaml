id: monsters.retainer.high-elf-weatherwise
type: monster
tags:
  - creature.fey
  - creature.high-elf
  - creature.humanoid
fields:
  level: 1
  organization: retainer
  role: controller
  size: 1m
  speed: 5
  stamina: 21
  freeStrike: 2
  might: -1
  agility: 1
  reason: 2
  intuition: 0
  presence: 1
  traits:
    - traits.retainer.high-elf-weatherwise.otherworldly-grace
  abilities:
    - abilities.retainer.high-elf-weatherwise.summers-bolt
# Retainer advancement (rules/retainer.yaml): a characteristic +1 at 2nd and 8th level, and an
# advancement ability at 4th, 7th and 10th level, the retainer's own or their role's.
choices:
  - id: increase2
    when: item.level >= 2
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'agility'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase2'" }
        op: set
        value: 'true'
  - id: increase8
    when: item.level >= 8
    from: { values: [might, agility, reason, intuition, presence] }
    recommend: "'agility'"
    effects:
      - target: { formula: "'retainer.' + pick.value + '.increase8'" }
        op: set
        value: 'true'
  - id: advancement
    slots: [4, 7, 10]
    when: item.level >= slot
    from:
      type: ability
      where: >-
        item.id in [@abilities.retainer.high-elf-weatherwise.winters-breath, @abilities.retainer.role-controller.elemental-blast, @abilities.retainer.high-elf-weatherwise.springs-rebirth, @abilities.retainer.role-controller.oil-slick, @abilities.retainer.high-elf-weatherwise.autumns-decay, @abilities.retainer.role-controller.shattering-shards]
    eligible: item.level == slot
    recommend: >-
      [@abilities.retainer.high-elf-weatherwise.winters-breath, @abilities.retainer.high-elf-weatherwise.springs-rebirth, @abilities.retainer.high-elf-weatherwise.autumns-decay][indexOf([4, 7, 10], slot)]
