effects.orc.hooked.name: Hooked
effects.orc.hooked.description: A hooked target can't move more than 3 squares away from the
  chainlock's position when this ability is used.
effects.orc.courtesy-call.name: Courtesy Call
effects.orc.courtesy-call.description: The target has a double edge on their next power roll before the end of the encounter.
effects.orc.strangled.name: Strangled
effects.orc.strangled.description: "While grabbed this way, a target can't communicate or use magic abilities."
