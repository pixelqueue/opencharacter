abilities.orc.mohler.earth-bump.texts.tier2: 4 damage
abilities.orc.mohler.earth-bump.texts.tier3: 5 damage
abilities.orc.mohler.earth-bump.texts.effect: 'Effect: The distance increases to melee 2. If the
  mohler is 1 or more squares beneath the target before they use this ability, a target who has M <
