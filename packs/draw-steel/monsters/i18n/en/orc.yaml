traits.orc.orc-bloodrunner.relentless.description: If the bloodrunner is reduced to 0 Stamina, they
  can make a free strike before dying. If the target of the free strike is reduced to 0 Stamina, the
  bloodrunner is reduced to 1 Stamina instead.
