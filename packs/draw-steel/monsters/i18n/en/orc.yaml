malice.orc.overwhelming-march.name: Overwhelming March
malice.orc.overwhelming-march.description: Each orc shifts up to their speed, moving through enemy
  spaces if they can. Each enemy passed through during this movement makes a Might test.
malice.orc.overwhelming-march.texts.tier1: 6 damage; prone
malice.orc.overwhelming-march.texts.tier2: 4 damage; prone
malice.orc.overwhelming-march.texts.tier3: Push 2
malice.orc.mohler-trench.name: Mohler Trench
malice.orc.mohler-trench.description: An orc acting this turn summons 2 mohlers out of the ground,
  who dig a trench that is a 10 x 1 line within 10 squares when they appear. The trench is 2 squares
  deep and is difficult terrain. The trench can't be created directly underneath creatures.
malice.orc.mohler-cavity.name: Mohler Cavity
malice.orc.mohler-cavity.description: The ground shakes as a group of mohlers dig a 5 cube pit
  beneath an area where at least one creature is on the ground. The area is difficult terrain. Each
  orc in the area can shift into the nearest unoccupied space outside the pit before it is
  completed. Each nonorc in the area makes an Agility test.
malice.orc.mohler-cavity.texts.tier1: 4 damage; the target falls; prone and can't stand (EoT)
malice.orc.mohler-cavity.texts.tier2: 4 damage; the target falls
malice.orc.mohler-cavity.texts.tier3: The target can shift into the nearest unoccupied space outside the pit.
monsters.orc.mohler.texts.withCaptain: +2 bonus to speed
abilities.orc.mohler.earth-bump.name: Earth Bump
abilities.orc.mohler.earth-bump.texts.target: One creature or object per minion
