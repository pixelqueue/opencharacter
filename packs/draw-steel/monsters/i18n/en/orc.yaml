abilities.orc.orc-warleader.familial-reinforcements.texts.target: Self
abilities.orc.orc-warleader.familial-reinforcements.texts.distance: Ranged 10
abilities.orc.orc-warleader.familial-reinforcements.texts.effect: 'Effect: The warleader shifts up
  to their speed, and four orc blitzers appear in unoccupied spaces within distance.'
abilities.orc.orc-warleader.ill-do-this-myself.name: I'll Do This Myself
abilities.orc.orc-warleader.ill-do-this-myself.texts.target: Self
abilities.orc.orc-warleader.ill-do-this-myself.texts.distance: Self
abilities.orc.orc-warleader.ill-do-this-myself.texts.effect: 'Effect: Three times in succession, the
  warleader shifts up to their speed and can use Mace Lariat.'
traits.orc.orc-warleader.end-effect.name: End Effect
traits.orc.orc-warleader.end-effect.description: At the end of each of their turns, the warleader
  can take 5 damage to end one effect on them that can be ended by a saving throw. This damage can't
  be reduced in any way.
traits.orc.orc-warleader.relentless.name: Relentless
traits.orc.orc-warleader.relentless.description: If the warleader is reduced to 0 Stamina, they can
  make a free strike before dying. If the target of the free strike is reduced to 0 Stamina, the
  warleader is reduced to 1 Stamina instead.
