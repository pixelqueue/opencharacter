traits.orc.mohler.ground-grinder.name: Ground Grinder
traits.orc.mohler.ground-grinder.description: The mohler can use the Dig maneuver at the start of
  the encounter. Additionally, while the mohler burrows within 1 square below the ground, the ground
  above where they burrow is difficult terrain.
