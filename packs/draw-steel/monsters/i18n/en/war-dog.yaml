traits.war-dog.war-dog-blackcap.duplicating-loyalty-collar.description: When the blackcap or any of
  their ash clones is reduced to 0 Stamina, that creature's loyalty collar explodes, dealing 3d6
  poison damage to each adjacent enemy and object. If any adjacent enemy has A < 3 they are also
  weakened (save ends)
