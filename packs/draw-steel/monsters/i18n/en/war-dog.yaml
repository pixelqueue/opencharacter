abilities.war-dog.war-dog-blackcap.flesh-eater-knife.texts.tier1: 8 damage
abilities.war-dog.war-dog-blackcap.flesh-eater-knife.texts.tier2: 11 damage
abilities.war-dog.war-dog-blackcap.flesh-eater-knife.texts.tier3: 12 damage; M < 4 bleeding and weakened (save ends)
abilities.war-dog.war-dog-blackcap.flesh-eater-knife.texts.effect: 'Effect: The blackcap can
  teleport up to their speed before using this ability, creating an ash clone (see below) in their
  original square.'
