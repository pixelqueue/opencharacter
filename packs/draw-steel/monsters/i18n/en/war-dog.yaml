malice.war-dog.level-10.prior-malice-features.name: Prior Malice Features
malice.war-dog.level-10.prior-malice-features.description: The war dog activates a Malice feature available to war dogs of level 9 or lower.
malice.war-dog.level-10.cry-havoc.name: Cry Havoc
malice.war-dog.level-10.cry-havoc.description: >-
  | Area, Magic |                  Maneuver |


  |-----------------|------------------------------:|


  | 📏 3 burst  | 🎯 Each enemy in the area |


  Power Roll + 5:


  Effect: Each war dog within distance deals an extra 15 damage with strikes until the end of their
  next turn. Additionally, they end any effect on them that can be ended by a saving throw or that
  ends at the end of their turn, then shift up to their speed and can make a free strike.


  Special: This ability can't be used by a minion.
malice.war-dog.level-10.cry-havoc.texts.tier1: 7 psychic damage
malice.war-dog.level-10.cry-havoc.texts.tier2: 11 psychic damage; P < 4 frightened (save ends)
malice.war-dog.level-10.cry-havoc.texts.tier3: 14 psychic damage; P < 5 frightened (save ends)
effects.war-dog.soulbound.name: Soulbound
effects.war-dog.soulbound.description: A soulbound creature can't benefit from edges or double edges, and can't gain or use surges.
effects.war-dog.seared.name: Seared
effects.war-dog.seared.description: A seared creature takes a bane on strikes and has damage weakness 5.
effects.war-dog.thunderstruck.name: Thunderstruck
effects.war-dog.thunderstruck.description: A thunderstruck creature has lightning weakness 5, and the taxiarch gains an edge on power rolls against them.
effects.war-dog.marked.name: Marked
effects.war-dog.marked.description: Strikes made against a target marked this way gain an edge. Additionally, whenever the tormentite takes damage, each target marked by them takes 3 damage.
effects.war-dog.next-roll-edge.name: Edge on next power roll
effects.war-dog.next-roll-edge.description: Doru gains an edge on his next power roll, or has a double edge on it.
effects.war-dog.next-roll-edge.state.amount.name: Edges
