abilities.war-dog.war-dog-taxiarch.overcharge.texts.target: Each war dog in the area
abilities.war-dog.war-dog-taxiarch.overcharge.texts.distance: 4 cube within 10
abilities.war-dog.war-dog-taxiarch.overcharge.texts.effect: 'Effect: Each target shifts up to their
  speed and can make a free strike that deals an extra 5 lightning damage.'
abilities.war-dog.war-dog-taxiarch.thunderstruck.name: Thunderstruck
abilities.war-dog.war-dog-taxiarch.thunderstruck.texts.trigger: An enemy within distance deals damage to the taxiarch.
abilities.war-dog.war-dog-taxiarch.thunderstruck.texts.target: The triggering enemy
abilities.war-dog.war-dog-taxiarch.thunderstruck.texts.distance: Melee 1
abilities.war-dog.war-dog-taxiarch.thunderstruck.texts.effect: 'Effect: After the ability is
  resolved, the target is teleported up to 5 squares and is thunderstruck (save ends). A
  thunderstruck creature has lightning weakness 5, and the taxiarch gains an edge on power rolls
  against them.'
traits.war-dog.war-dog-taxiarch.end-effect.name: End Effect
traits.war-dog.war-dog-taxiarch.end-effect.description: At the end of each of their turns, the
  taxiarch can take 15 damage to end one effect on them that can be ended by a saving throw. This
  damage can't be reduced in any way.
abilities.war-dog.war-dog-taxiarch.magnetic-trickery.name: Magnetic Trickery
abilities.war-dog.war-dog-taxiarch.magnetic-trickery.texts.target: Each enemy in the area
abilities.war-dog.war-dog-taxiarch.magnetic-trickery.texts.distance: 10 burst
abilities.war-dog.war-dog-taxiarch.magnetic-trickery.texts.effect: 'Effect: Slide 5, and if the the target has M < 4, they fall prone.'
abilities.war-dog.war-dog-taxiarch.conductor-of-combat.name: Conductor of Combat
abilities.war-dog.war-dog-taxiarch.conductor-of-combat.texts.target: Each war dog in the area
abilities.war-dog.war-dog-taxiarch.conductor-of-combat.texts.distance: 5 burst
abilities.war-dog.war-dog-taxiarch.conductor-of-combat.texts.effect: 'Effect: Each target shifts up to their speed, then can make a free strike or use a maneuver.'
abilities.war-dog.war-dog-taxiarch.unlimited-power.name: Unlimited Power!
abilities.war-dog.war-dog-taxiarch.unlimited-power.texts.target: Each creature in the area
abilities.war-dog.war-dog-taxiarch.unlimited-power.texts.distance: 3 burst
abilities.war-dog.war-dog-taxiarch.unlimited-power.texts.roll: Agility test
abilities.war-dog.war-dog-taxiarch.unlimited-power.texts.tier1: 18 lightning damage; the target is thunderstruck (save ends)
abilities.war-dog.war-dog-taxiarch.unlimited-power.texts.tier2: 14 lightning damage; the target is thunderstruck (EoT)
abilities.war-dog.war-dog-taxiarch.unlimited-power.texts.tier3: 9 lightning damage
abilities.war-dog.war-dog-taxiarch.unlimited-power.texts.effect: >-
  Effect: Each target makes an Agility test.


  See Thunderstruck. Additionally, until the end of the encounter, any enemy who moves within 3
  squares of the taxiarch for the first time in a round or starts their turn there takes 3 lightning
  damage.
monsters.war-dog.war-dog-taxiarch.name: War Dog Taxiarch
malice.war-dog.level-7.prior-malice-features.name: Prior Malice Features
malice.war-dog.level-7.prior-malice-features.description: The war dog activates a Malice feature available to war dogs of level 6 or lower.
malice.war-dog.level-7.alchemical-cloud.name: Alchemical Cloud
malice.war-dog.level-7.alchemical-cloud.description: A bank of choking chemicals sweeps across the
  area of the encounter map. Each enemy in the encounter makes a Might test.
malice.war-dog.level-7.alchemical-cloud.texts.tier1: 8 poison damage; dazed (EoT)
malice.war-dog.level-7.alchemical-cloud.texts.tier2: 7 poison damage; weakened (EoT)
malice.war-dog.level-7.alchemical-cloud.texts.tier3: 4 poison damage
abilities.war-dog.castellan-hoplon.inspiring-strike.name: Inspiring Strike
abilities.war-dog.castellan-hoplon.inspiring-strike.texts.target: Two creatures or objects
abilities.war-dog.castellan-hoplon.inspiring-strike.texts.distance: Melee 1
abilities.war-dog.castellan-hoplon.inspiring-strike.texts.roll: Power Roll + 5
abilities.war-dog.castellan-hoplon.inspiring-strike.texts.tier1: 15 damage
abilities.war-dog.castellan-hoplon.inspiring-strike.texts.tier2: 20 damage; push 3
abilities.war-dog.castellan-hoplon.inspiring-strike.texts.tier3: 24 damage; push 5
abilities.war-dog.castellan-hoplon.inspiring-strike.texts.effect: 'Effect: Two allies within 10
  squares of Hoplon each shift up to their speed, then can take the Defend main action or make a
  free strike.'
abilities.war-dog.castellan-hoplon.summon-the-onyx-tower.name: Summon the Onyx Tower
abilities.war-dog.castellan-hoplon.summon-the-onyx-tower.texts.target: Special
abilities.war-dog.castellan-hoplon.summon-the-onyx-tower.texts.distance: Ranged 15
abilities.war-dog.castellan-hoplon.summon-the-onyx-tower.texts.effect: 'Effect: A 10-square-tall
  tower made of black stone shimmers into being in an unoccupied space that is 5 squares on a side.
  The tower has three floors, an entrance in the middle of each side on the ground floor, and a
  crenelated rooftop. Any war dog inside or adjacent to the tower has damage immunity 2 and regains
  5 Stamina at the start of each of their turns, and war dogs inside the tower can observe through
  and have line of effect through its walls. This ability can be used only once per encounter.'
abilities.war-dog.castellan-hoplon.shield-warden.name: Shield Warden
abilities.war-dog.castellan-hoplon.shield-warden.texts.target: Each enemy in the area
abilities.war-dog.castellan-hoplon.shield-warden.texts.distance: 3 burst
abilities.war-dog.castellan-hoplon.shield-warden.texts.roll: Power Roll + 5
abilities.war-dog.castellan-hoplon.shield-warden.texts.tier1: R < 3 taunted (EoT)
abilities.war-dog.castellan-hoplon.shield-warden.texts.tier2: R < 4 taunted (EoT)
abilities.war-dog.castellan-hoplon.shield-warden.texts.tier3: R < 5 taunted (EoT)
abilities.war-dog.castellan-hoplon.shield-warden.texts.effect: "Effect: Until the start of Hoplon's
  next turn, any enemy ability that includes him as a target takes a bane."
abilities.war-dog.castellan-hoplon.timely-intervention.name: Timely Intervention
abilities.war-dog.castellan-hoplon.timely-intervention.texts.trigger: An enemy within 10 squares targets an ally with an ability.
abilities.war-dog.castellan-hoplon.timely-intervention.texts.target: Self
abilities.war-dog.castellan-hoplon.timely-intervention.texts.distance: Self
abilities.war-dog.castellan-hoplon.timely-intervention.texts.effect: 'Effect: Hoplon teleports to an
  unoccupied space adjacent to the enemy and becomes the new target of the ability. He can then make
  a free strike against the enemy, and if that enemy has R < 4 they are taunted until the end of
  their next turn.'
traits.war-dog.castellan-hoplon.hold-the-line.name: Hold the Line
traits.war-dog.castellan-hoplon.hold-the-line.description: Each ally within 3 squares of Hoplon has cover and damage immunity 2.
traits.war-dog.castellan-hoplon.last-stand.name: Last Stand
traits.war-dog.castellan-hoplon.last-stand.description: The first time in an encounter that Hoplon
  is reduced to 0 Stamina, he instead has 1 Stamina and gains damage immunity 10 until the end of
  his next turn. When Hoplon is reduced to 0 Stamina again, each ally within 5 squares of him gains
  damage immunity 3 and deals an extra 5 damage on strikes, all until the end of the encounter.
monsters.war-dog.castellan-hoplon.name: Castellan Hoplon
abilities.war-dog.iron-champion-doru.houndaxe.name: Houndaxe
abilities.war-dog.iron-champion-doru.houndaxe.texts.target: Two creatures or objects
abilities.war-dog.iron-champion-doru.houndaxe.texts.distance: Melee 2
abilities.war-dog.iron-champion-doru.houndaxe.texts.roll: Power Roll + 5
abilities.war-dog.iron-champion-doru.houndaxe.texts.tier1: 15 damage
abilities.war-dog.iron-champion-doru.houndaxe.texts.tier2: 21 damage; Doru gains an edge on his next power roll; M < 4 slide 3
abilities.war-dog.iron-champion-doru.houndaxe.texts.tier3: 25 damage; Doru has a double edge on his next power roll; M < 5 slide 5
abilities.war-dog.iron-champion-doru.houndaxe.texts.effect: |-
  Effect: The damage from this ability can't be reduced in any way.

  3 Malice: This ability targets one additional target.
abilities.war-dog.iron-champion-doru.bloody-whirlwind.name: Bloody Whirlwind
abilities.war-dog.iron-champion-doru.bloody-whirlwind.texts.target: Each creature and object in the area
abilities.war-dog.iron-champion-doru.bloody-whirlwind.texts.distance: 3 burst
abilities.war-dog.iron-champion-doru.bloody-whirlwind.texts.roll: Power Roll + 5
abilities.war-dog.iron-champion-doru.bloody-whirlwind.texts.tier1: 5 damage; A < 3 bleeding (save ends)
abilities.war-dog.iron-champion-doru.bloody-whirlwind.texts.tier2: 11 damage; A < 4 bleeding (save ends)
abilities.war-dog.iron-champion-doru.bloody-whirlwind.texts.tier3: 15 damage; A < 5 bleeding (save ends)
abilities.war-dog.iron-champion-doru.bloody-whirlwind.texts.effect: 'Effect: This ability deals an extra 5 damage for each winded target in the area.'
abilities.war-dog.iron-champion-doru.hunting-leap.name: Hunting Leap
abilities.war-dog.iron-champion-doru.hunting-leap.texts.target: One creature or object
abilities.war-dog.iron-champion-doru.hunting-leap.texts.distance: Ranged 5
abilities.war-dog.iron-champion-doru.hunting-leap.texts.effect: 'Effect: Doru jumps to an unoccupied
  space adjacent to the target, then can make a free strike against them. If the target is bleeding
  or winded, the distance of the ability becomes Ranged 10 and the free strike deals an extra 5
  damage.'
abilities.war-dog.iron-champion-doru.laugh-it-off.name: Laugh It Off
abilities.war-dog.iron-champion-doru.laugh-it-off.texts.trigger: An enemy makes a strike against Doru.
abilities.war-dog.iron-champion-doru.laugh-it-off.texts.target: Self
abilities.war-dog.iron-champion-doru.laugh-it-off.texts.distance: Self
abilities.war-dog.iron-champion-doru.laugh-it-off.texts.effect: 'Effect: The triggering strike takes a bane and Doru gains an edge on his next power roll.'
traits.war-dog.iron-champion-doru.iron-juggernaut.name: Iron Juggernaut
traits.war-dog.iron-champion-doru.iron-juggernaut.description: Doru can't be made slowed or
  restrained. Additionally, he can move while grabbed, and a creature grabbing him moves along with
  him unless they let go.
traits.war-dog.iron-champion-doru.the-scarless.name: The Scarless
traits.war-dog.iron-champion-doru.the-scarless.description: Doru regains 10 Stamina at the start of
  each of his turns unless he took acid or fire damage since the start of his previous turn.
  Whenever he regains Stamina this way, the Director can spend 2 Malice to end one effect on Doru
  that can be ended by a saving throw.
traits.war-dog.iron-champion-doru.champions-loyalty-collar.name: Champion's Loyalty Collar
traits.war-dog.iron-champion-doru.champions-loyalty-collar.description: When Doru is reduced to 0
  Stamina, his loyalty collar explodes, dealing 20 damage to each enemy and object within 3 squares
  of him.
monsters.war-dog.iron-champion-doru.name: Iron Champion Doru
abilities.war-dog.logostician-vesper.portal-to-the-firing-line.name: Portal to the Firing Line
abilities.war-dog.logostician-vesper.portal-to-the-firing-line.texts.target: Each creature and object in the area
abilities.war-dog.logostician-vesper.portal-to-the-firing-line.texts.distance: 5 x 3 line within 15
abilities.war-dog.logostician-vesper.portal-to-the-firing-line.texts.roll: Power Roll + 5
abilities.war-dog.logostician-vesper.portal-to-the-firing-line.texts.tier1: 8 damage
abilities.war-dog.logostician-vesper.portal-to-the-firing-line.texts.tier2: 12 damage; I < 4 slowed (save ends)
abilities.war-dog.logostician-vesper.portal-to-the-firing-line.texts.tier3: 15 damage; I < 5 slowed (save ends)
abilities.war-dog.logostician-vesper.portal-to-the-firing-line.texts.effect: >-
  Special: This ability targets only non-prone creatures.


  Effect: A target creature can choose to drop prone, in which case the ability takes a bane against
  them.


  2 Malice: The area remains active until Vesper is reduced to 0 Stamina or until the end of the
  encounter. Any non-prone enemy who enters the area for the first time in a round or starts their
  turn there takes 15 damage, or 7 damage if they choose to fall prone.
abilities.war-dog.logostician-vesper.portal-to-the-mantle.name: Portal to the Mantle
abilities.war-dog.logostician-vesper.portal-to-the-mantle.texts.target: Each creature and object in the area
abilities.war-dog.logostician-vesper.portal-to-the-mantle.texts.distance: 3 cube within 15
abilities.war-dog.logostician-vesper.portal-to-the-mantle.texts.roll: Power Roll + 5
abilities.war-dog.logostician-vesper.portal-to-the-mantle.texts.tier1: 8 fire damage
abilities.war-dog.logostician-vesper.portal-to-the-mantle.texts.tier2: 12 fire damage
abilities.war-dog.logostician-vesper.portal-to-the-mantle.texts.tier3: 15 fire damage
abilities.war-dog.logostician-vesper.portal-to-the-mantle.texts.effect: 'Effect: The area is
  difficult terrain. Any creature who enters the area for the first time in a round or starts their
  turn there takes 10 fir damage. Until the end of the encounter, the size of the area increases by
  1 at the start of each round.'
abilities.war-dog.logostician-vesper.portal-to-the-void.name: Portal to the Void
abilities.war-dog.logostician-vesper.portal-to-the-void.texts.target: Each creature and object in the area
abilities.war-dog.logostician-vesper.portal-to-the-void.texts.distance: 5 cube within 15
abilities.war-dog.logostician-vesper.portal-to-the-void.texts.roll: Power Roll + 5
abilities.war-dog.logostician-vesper.portal-to-the-void.texts.tier1: A < 4 pull 3 toward the center of the area
abilities.war-dog.logostician-vesper.portal-to-the-void.texts.tier2: A < 5 pull 3 toward the center of the area
abilities.war-dog.logostician-vesper.portal-to-the-void.texts.tier3: Pull 3 toward the center of the area
abilities.war-dog.logostician-vesper.portal-to-the-void.texts.effect: >-
  Effect: A portal appears at the center of the area. Any creature at the center of the area when
  this ability is used or who is pulled into the center for the first time in a round takes 10 sonic
  damage.


  2 Malice: The area remains active and deals its damage until Vesper is reduced to 0 Stamina or
  until the end of the encounter. Any creature who enters the area and has A < 4 is pulled 3 squares
  toward the center of the area. Any creature who starts their turn in the area and has M < 4 is
  slowed until the end of their turn.
abilities.war-dog.logostician-vesper.portal-to-the-sky.name: Portal to the Sky
abilities.war-dog.logostician-vesper.portal-to-the-sky.texts.trigger: The target moves within distance of Vesper.
abilities.war-dog.logostician-vesper.portal-to-the-sky.texts.target: One enemy
abilities.war-dog.logostician-vesper.portal-to-the-sky.texts.distance: Ranged 3
abilities.war-dog.logostician-vesper.portal-to-the-sky.texts.effect: 'Effect: The target is dropped
  through a portal, which teleports them up to 7 squares above a space within 15 squares.'
traits.war-dog.logostician-vesper.living-logistics-network.name: Living Logistics Network
traits.war-dog.logostician-vesper.living-logistics-network.description: Each ally who starts their
  turn within 10 squares of Vesper can teleport whenever they willingly move until the end of their
  turn. Whenever an affected ally teleports, they deal an extra 5 damage on their next strike.
traits.war-dog.logostician-vesper.crash-and-burn.name: Crash and Burn
traits.war-dog.logostician-vesper.crash-and-burn.description: When Vesper is reduced to 0 Stamina,
  they move up to their speed and then explode, dealing 4d6 damage to each adjacent enemy and
  object. Any enemy who takes more than 14 damage this way vertically slides 5 squares.
monsters.war-dog.logostician-vesper.name: Logostician Vesper
abilities.war-dog.soulbinder-psyche.soulbind.name: Soulbind
abilities.war-dog.soulbinder-psyche.soulbind.texts.target: Two creatures or objects
abilities.war-dog.soulbinder-psyche.soulbind.texts.distance: Ranged 10
abilities.war-dog.soulbinder-psyche.soulbind.texts.roll: Power Roll + 5
abilities.war-dog.soulbinder-psyche.soulbind.texts.tier1: 15 holy damage; R < 3 the target is soulbound (save ends)
abilities.war-dog.soulbinder-psyche.soulbind.texts.tier2: 20 holy damage; R < 4 the target is soulbound (save ends)
abilities.war-dog.soulbinder-psyche.soulbind.texts.tier3: 24 holy damage; R < 5 the target is soulbound (save ends)
abilities.war-dog.soulbinder-psyche.soulbind.texts.effect: "Effect: A soulbound creature can't
  benefit from edges or double edges, and can't gain or use surges."
abilities.war-dog.soulbinder-psyche.soulstorm.name: Soulstorm
abilities.war-dog.soulbinder-psyche.soulstorm.texts.target: Each enemy in the area
abilities.war-dog.soulbinder-psyche.soulstorm.texts.distance: 3 cube within 10
abilities.war-dog.soulbinder-psyche.soulstorm.texts.roll: Power Roll + 5
abilities.war-dog.soulbinder-psyche.soulstorm.texts.tier1: 8 corruption damage; P < 3 weakened (EoT)
abilities.war-dog.soulbinder-psyche.soulstorm.texts.tier2: 12 corruption damage; P < 4 weakened (EoT)
abilities.war-dog.soulbinder-psyche.soulstorm.texts.tier3: 15 corruption damage; P < 5 weakened (EoT)
abilities.war-dog.soulbinder-psyche.soulstorm.texts.effect: >-
  Effect: The area is difficult terrain until the start of Psyche's next turn At the start of each
  of her turns, Psyche can use a maneuver to maintain this effect, move the area up to 5 squares,
  and make the power roll against each creature in the area's new location.


  1 Malice: Until the start of Psyche's next turn, if this ability makes a creature weakened, that
  creature is also soulbound (save ends; see Soulbind above).
abilities.war-dog.soulbinder-psyche.command-the-awakened.name: Command the Awakened
abilities.war-dog.soulbinder-psyche.command-the-awakened.texts.target: Each soulbound enemy in the area
abilities.war-dog.soulbinder-psyche.command-the-awakened.texts.distance: 5 burst
abilities.war-dog.soulbinder-psyche.command-the-awakened.texts.effect: 'Effect: Each target takes 5
  damage from a self-inflicted wound, and if they have M < 4 Psyche slides them up to 5 squares.'
abilities.war-dog.soulbinder-psyche.spirit-form.name: Spirit Form
abilities.war-dog.soulbinder-psyche.spirit-form.texts.trigger: An enemy moves within 2 squares of Psyche.
abilities.war-dog.soulbinder-psyche.spirit-form.texts.target: Self
abilities.war-dog.soulbinder-psyche.spirit-form.texts.distance: Self
abilities.war-dog.soulbinder-psyche.spirit-form.texts.effect: 'Effect: Psyche moves up to 5 squares,
  and has damage immunity 5 and ignores difficult terrain during this movement. The first time she
  moves through any creature during this movement, that creature takes 5 corruption damage.'
abilities.war-dog.soulbinder-psyche.vengeance-for-the-slain.name: Vengeance for the Slain
abilities.war-dog.soulbinder-psyche.vengeance-for-the-slain.texts.trigger: A war dog within distance is made winded or reduced to 0 Stamina.
abilities.war-dog.soulbinder-psyche.vengeance-for-the-slain.texts.target: One enemy
abilities.war-dog.soulbinder-psyche.vengeance-for-the-slain.texts.distance: Ranged 10
abilities.war-dog.soulbinder-psyche.vengeance-for-the-slain.texts.effect: |-
  Effect: The target loses all their surges and takes 5 corruption damage.

  1 Malice: The target also takes a bane on their next strike.
traits.war-dog.soulbinder-psyche.immortal-soul.name: Immortal Soul
traits.war-dog.soulbinder-psyche.immortal-soul.description: When Psyche is reduced to 0 Stamina, her
  spirit surrounds the nearest war dog, who has damage immunity 2, deals an extra 5 damage on
  strikes, and can use the following Immortal Flare maneuver until the end of the encounter. That
  war dog also gains the Immortal Soul trait, and transfers this effect to the nearest war dog when
  they die.
abilities.war-dog.soulbinder-psyche.immortal-flare.name: Immortal Flare
abilities.war-dog.soulbinder-psyche.immortal-flare.texts.target: One creature or object
abilities.war-dog.soulbinder-psyche.immortal-flare.texts.distance: Ranged 10
abilities.war-dog.soulbinder-psyche.immortal-flare.texts.effect: 'Effect: The target takes 10 psychic damage.'
monsters.war-dog.soulbinder-psyche.name: Soulbinder Psyche
abilities.war-dog.strategos-alkestis.houndgun-and-houndblade.name: Houndgun and Houndblade
abilities.war-dog.strategos-alkestis.houndgun-and-houndblade.texts.target: Two creatures or objects
abilities.war-dog.strategos-alkestis.houndgun-and-houndblade.texts.distance: Melee 1 or ranged 10
abilities.war-dog.strategos-alkestis.houndgun-and-houndblade.texts.roll: Power Roll + 5
abilities.war-dog.strategos-alkestis.houndgun-and-houndblade.texts.tier1: 15 damage; M < 4 bleeding (save ends)
abilities.war-dog.strategos-alkestis.houndgun-and-houndblade.texts.tier2: 21 damage; M < 5 bleeding (save ends)
abilities.war-dog.strategos-alkestis.houndgun-and-houndblade.texts.tier3: 25 damage; M < 6 bleeding (save ends)
abilities.war-dog.strategos-alkestis.houndgun-and-houndblade.texts.effect: >-
  Effect: Each target loses 1d3 Recoveries.


  2 Malice: When a target is made bleeding this way, each ally adjacent to them can make a free
  strike against the target.
abilities.war-dog.strategos-alkestis.focus-fire.name: Focus Fire
abilities.war-dog.strategos-alkestis.focus-fire.texts.target: One creature or object
abilities.war-dog.strategos-alkestis.focus-fire.texts.distance: Ranged 15
abilities.war-dog.strategos-alkestis.focus-fire.texts.effect: "Effect: Until the start of Alkestis's
  next turn, any effect that reduces the damage taken by the target has no effect."
abilities.war-dog.strategos-alkestis.artillery-enfilade.name: Artillery Enfilade
abilities.war-dog.strategos-alkestis.artillery-enfilade.texts.trigger: An ally is reduced to 0 Stamina within 10 squares of Alkestis.
abilities.war-dog.strategos-alkestis.artillery-enfilade.texts.target: Each creature and object in the area
abilities.war-dog.strategos-alkestis.artillery-enfilade.texts.distance: 7 x 3 line within 10
abilities.war-dog.strategos-alkestis.artillery-enfilade.texts.roll: Power Roll + 5
abilities.war-dog.strategos-alkestis.artillery-enfilade.texts.tier1: 8 damage; A < 4 slowed (save ends)
abilities.war-dog.strategos-alkestis.artillery-enfilade.texts.tier2: 13 damage; A < 5 slowed (save ends)
abilities.war-dog.strategos-alkestis.artillery-enfilade.texts.tier3: 16 damage; A < 6 slowed (save ends)
abilities.war-dog.strategos-alkestis.artillery-enfilade.texts.effect: 'Effect: The area is difficult terrain until the start of the next round.'
traits.war-dog.strategos-alkestis.end-effect.name: End Effect
traits.war-dog.strategos-alkestis.end-effect.description: At the end of each of her turns, Alkestis
  can take 20 damage to end one effect on her that can be ended by a saving throw. This damage can't
  be reduced in any way.
traits.war-dog.strategos-alkestis.tactical-brilliance.name: Tactical Brilliance
traits.war-dog.strategos-alkestis.tactical-brilliance.description: At the start of each of
  Alkestis's turns, the Director gains 2 Malice. While Alkestis is alive and in the encounter, the
  Director also gains 1 Malice whenever a war dog in the encounter obtains a tier 3 outcome on a
  power roll.
abilities.war-dog.strategos-alkestis.fog-of-war.name: Fog of War
abilities.war-dog.strategos-alkestis.fog-of-war.texts.target: Each ally in the encounter
abilities.war-dog.strategos-alkestis.fog-of-war.texts.distance: Special
abilities.war-dog.strategos-alkestis.fog-of-war.texts.effect: 'Effect: Each target can disappear,
  then reappear anywhere on the encounter map 3 or more squares away from any enemy. Additionally,
  each target has a double edge on their next power roll.'
abilities.war-dog.strategos-alkestis.send-in-the-second-wave.name: Send in the Second Wave
abilities.war-dog.strategos-alkestis.send-in-the-second-wave.texts.target: Special
abilities.war-dog.strategos-alkestis.send-in-the-second-wave.texts.distance: Ranged 15
abilities.war-dog.strategos-alkestis.send-in-the-second-wave.texts.effect: 'Effect: For each war dog
  reduced to 0 Stamina in the encounter, a war dog shriketrooper appears in an unoccupied space
  within distance.'
abilities.war-dog.strategos-alkestis.the-silver-wolfs-final-stratagem.name: The Silver Wolf's Final Stratagem
abilities.war-dog.strategos-alkestis.the-silver-wolfs-final-stratagem.texts.target: Each creature in the area
abilities.war-dog.strategos-alkestis.the-silver-wolfs-final-stratagem.texts.distance: 5 burst
abilities.war-dog.strategos-alkestis.the-silver-wolfs-final-stratagem.texts.effect:
  "Effect: Until the start of the next round, each target enemy who has I < 4 is dazed, each target
  enemy who has M < 4 is restrained, and each target enemy who has A < 4 can't use triggered
  actions. Additionally, until the end of the encounter, Alkestis and each target ally have damage
  immunity 3 and deal an extra 5 damage with strikes."
monsters.war-dog.strategos-alkestis.name: Strategos Alkestis
