traits.war-dog.war-dog-ballistite.set-up-and-tear-down.description: At the start of each of the
  ballistite's turns, they can gain a +4 bonus to speed until the end of their turn. While their
  speed is greater than 0 by any means, they can't use main actions or maneuvers.
traits.war-dog.war-dog-ballistite.loyalty-collar.name: Loyalty Collar
traits.war-dog.war-dog-ballistite.loyalty-collar.description: When the ballistite is reduced to 0
