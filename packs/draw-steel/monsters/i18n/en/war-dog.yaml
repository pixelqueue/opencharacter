malice.war-dog.level-4.loyalty-unto-death.name: Loyalty Unto Death
malice.war-dog.level-4.loyalty-unto-death.description: >-
  | Magic, Ranged |        Maneuver |


  |-------------------|--------------------:|


  | 📏 Ranged 10  | 🎯 Two war dogs |


  Effect: Each target who has a loyalty collar shifts up to their speed, then is reduced to 0
  Stamina. After each target's Loyalty Collar trait is resolved, each enemy adjacent to either
  target makes a Presence test.
