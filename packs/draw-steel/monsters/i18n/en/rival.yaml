abilities.rival.echelon-4.rival-elementalist.viridescent-storm.texts.distance: Ranged 10
abilities.rival.echelon-4.rival-elementalist.viridescent-storm.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-elementalist.viridescent-storm.texts.tier1: 15 damage; slide 3; M < 3 5 acid damage
abilities.rival.echelon-4.rival-elementalist.viridescent-storm.texts.tier2: 20 damage; slide 4; M < 4 7 acid damage
abilities.rival.echelon-4.rival-elementalist.viridescent-storm.texts.tier3: 24 damage; slide 5; M < 5 9 acid damage
abilities.rival.echelon-4.rival-elementalist.viridescent-storm.texts.effect: 'Effect: One ally within distance ends all conditions on themself.'
abilities.rival.echelon-4.rival-elementalist.the-world-consumes.name: The World Consumes
abilities.rival.echelon-4.rival-elementalist.the-world-consumes.texts.target: Each enemy in the area
abilities.rival.echelon-4.rival-elementalist.the-world-consumes.texts.distance: 3 cube within 10
abilities.rival.echelon-4.rival-elementalist.the-world-consumes.texts.effect: 'Effect: The area
  becomes overgrown with caustic vines until the end of the encounter. While in the area, any enemy
  has acid weakness 5 and is slowed. Any enemy who ends their turn in the area and has M < 4 is
  restrained (save ends).'
abilities.rival.echelon-4.rival-elementalist.breach-of-nihility.name: Breach of Nihility
abilities.rival.echelon-4.rival-elementalist.breach-of-nihility.texts.trigger: The elementalist takes damage.
abilities.rival.echelon-4.rival-elementalist.breach-of-nihility.texts.target: Self
abilities.rival.echelon-4.rival-elementalist.breach-of-nihility.texts.distance: Self
abilities.rival.echelon-4.rival-elementalist.breach-of-nihility.texts.effect: 'Effect: The
  elementalist can teleport up to 5 squares. Each creature adjacent to the space they leave or
  appear in takes 5 corruption damage.'
traits.rival.echelon-4.rival-elementalist.rivalry.name: Rivalry
traits.rival.echelon-4.rival-elementalist.rivalry.description: At the start of an encounter, the
  elementalist chooses one creature within their line of effect. Both the elementalist and the
  creature can add a d3 roll to power rolls they make against each other.
monsters.rival.echelon-4.rival-elementalist.name: Rival Elementalist
abilities.rival.echelon-4.rival-fury.seismic-crush.name: Seismic Crush
abilities.rival.echelon-4.rival-fury.seismic-crush.texts.target: Two creatures or objects
abilities.rival.echelon-4.rival-fury.seismic-crush.texts.distance: Melee 1
abilities.rival.echelon-4.rival-fury.seismic-crush.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-fury.seismic-crush.texts.tier1: 15 damage; push 4
abilities.rival.echelon-4.rival-fury.seismic-crush.texts.tier2: 21 damage; push 5
abilities.rival.echelon-4.rival-fury.seismic-crush.texts.tier3: 25 damage; push 6
abilities.rival.echelon-4.rival-fury.seismic-crush.texts.effect: '2 Malice: Each target who has M < 4 is bleeding and slowed (save ends).'
abilities.rival.echelon-4.rival-fury.death-grip.name: Death Grip
abilities.rival.echelon-4.rival-fury.death-grip.texts.target: One creature
abilities.rival.echelon-4.rival-fury.death-grip.texts.distance: Melee 1
abilities.rival.echelon-4.rival-fury.death-grip.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-fury.death-grip.texts.tier1: 17 damage; M < 3 grabbed
abilities.rival.echelon-4.rival-fury.death-grip.texts.tier2: 24 damage; M < 4 grabbed
abilities.rival.echelon-4.rival-fury.death-grip.texts.tier3: 30 damage; M < 5 grabbed
abilities.rival.echelon-4.rival-fury.death-grip.texts.effect: "Effect: The target must be the fury's
  size or smaller. While the target is grabbed this way, the fury and their allies have a double
  edge on strikes against them."
traits.rival.echelon-4.rival-fury.devastate.name: Devastate
traits.rival.echelon-4.rival-fury.devastate.description: Once per turn, when the fury force moves a
  creature or object, or shifts adjacent to a creature or object, they can use a signature ability
  against that creature or object that has a double edge.
traits.rival.echelon-4.rival-fury.rivalry.name: Rivalry
traits.rival.echelon-4.rival-fury.rivalry.description: At the start of an encounter, the fury
  chooses one creature within their line of effect. Both the fury and the creature can add a d3 roll
  to power rolls they make against each other.
monsters.rival.echelon-4.rival-fury.name: Rival Fury
abilities.rival.echelon-4.rival-null.kinetic-danse.name: Kinetic Danse
abilities.rival.echelon-4.rival-null.kinetic-danse.texts.target: Two creatures or objects
abilities.rival.echelon-4.rival-null.kinetic-danse.texts.distance: Melee 1
abilities.rival.echelon-4.rival-null.kinetic-danse.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-null.kinetic-danse.texts.tier1: 15 damage; the null shifts up to 4 squares; A < 3 10 damage
abilities.rival.echelon-4.rival-null.kinetic-danse.texts.tier2: 20 damage; the null shifts up to 5 squares; A < 4 15 damage
abilities.rival.echelon-4.rival-null.kinetic-danse.texts.tier3: 24 damage; the null shifts up to 6 squares; A < 5 19 damage
abilities.rival.echelon-4.rival-null.incapacitate.name: Incapacitate
abilities.rival.echelon-4.rival-null.incapacitate.texts.target: Two creatures or objects
abilities.rival.echelon-4.rival-null.incapacitate.texts.distance: Melee 1
abilities.rival.echelon-4.rival-null.incapacitate.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-null.incapacitate.texts.tier1: 13 damage; R < 3 dazed and restrained (save ends)
abilities.rival.echelon-4.rival-null.incapacitate.texts.tier2: 17 damage; R < 4 dazed and restrained (save ends)
abilities.rival.echelon-4.rival-null.incapacitate.texts.tier3: 20 damage; R < 5 dazed and restrained (save ends)
traits.rival.echelon-4.rival-null.energy-conservation.name: Energy Conservation
traits.rival.echelon-4.rival-null.energy-conservation.description: The first time each round that
  the null is targeted by a strike, it takes a bane and the null halves the damage from it. The
  creature making the strike takes 10 damage.
traits.rival.echelon-4.rival-null.rivalry.name: Rivalry
traits.rival.echelon-4.rival-null.rivalry.description: At the start of an encounter, the null
  chooses one creature within their line of effect. Both the null and the creature can add a d3 roll
  to power rolls they make against each other.
monsters.rival.echelon-4.rival-null.name: Rival Null
abilities.rival.echelon-4.rival-shadow.a-hush-of-ash.name: A Hush of Ash
abilities.rival.echelon-4.rival-shadow.a-hush-of-ash.texts.target: Two creatures or objects
abilities.rival.echelon-4.rival-shadow.a-hush-of-ash.texts.distance: Melee 1
abilities.rival.echelon-4.rival-shadow.a-hush-of-ash.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-shadow.a-hush-of-ash.texts.tier1: 15 damage; A < 3 bleeding (save ends)
abilities.rival.echelon-4.rival-shadow.a-hush-of-ash.texts.tier2: 21 damage; A < 4 bleeding (save ends)
abilities.rival.echelon-4.rival-shadow.a-hush-of-ash.texts.tier3: 25 damage; A < 5 bleeding (save ends)
abilities.rival.echelon-4.rival-shadow.a-hush-of-ash.texts.effect: '1 Malice: The shadow can teleport up to 10 squares, then can attempt to hide.'
abilities.rival.echelon-4.rival-shadow.envenomed-steel.name: Envenomed Steel
abilities.rival.echelon-4.rival-shadow.envenomed-steel.texts.target: Self
abilities.rival.echelon-4.rival-shadow.envenomed-steel.texts.distance: Self
abilities.rival.echelon-4.rival-shadow.envenomed-steel.texts.effect: 'Effect: The shadow coats their
  weapon with poison. They have a double edge on their next strike, any potency for that strike
  increases by 2, and if the target has M < 4, they are weakened (save ends).'
traits.rival.echelon-4.rival-shadow.exploit-weakness.name: Exploit Weakness
traits.rival.echelon-4.rival-shadow.exploit-weakness.description: The shadow deals an extra 10 damage to any target affected by a condition.
traits.rival.echelon-4.rival-shadow.rivalry.name: Rivalry
traits.rival.echelon-4.rival-shadow.rivalry.description: At the start of an encounter, the shadow
  chooses one creature within their line of effect. Both the shadow and the creature can add a d3
  roll to power rolls they make against each other.
monsters.rival.echelon-4.rival-shadow.name: Rival Shadow
abilities.rival.echelon-4.rival-tactician.forward-assault.name: Forward Assault
abilities.rival.echelon-4.rival-tactician.forward-assault.texts.target: Two creatures or objects
abilities.rival.echelon-4.rival-tactician.forward-assault.texts.distance: Ranged 10
abilities.rival.echelon-4.rival-tactician.forward-assault.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-tactician.forward-assault.texts.tier1: 15 damage
abilities.rival.echelon-4.rival-tactician.forward-assault.texts.tier2: 21 damage; A < 4 prone and can't stand (EoT)
abilities.rival.echelon-4.rival-tactician.forward-assault.texts.tier3: 25 damage; prone; A < 5 can't stand (EoT)
abilities.rival.echelon-4.rival-tactician.forward-assault.texts.effect: '5 Malice: Two allies within
  distance move up to their speed and can use a signature ability that has a double edge.'
abilities.rival.echelon-4.rival-tactician.guardian-from-afar.name: Guardian From Afar
abilities.rival.echelon-4.rival-tactician.guardian-from-afar.texts.target: One creature in the area
abilities.rival.echelon-4.rival-tactician.guardian-from-afar.texts.distance: 3 cube within 10
abilities.rival.echelon-4.rival-tactician.guardian-from-afar.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-tactician.guardian-from-afar.texts.tier1: 10 damage; M < 3 weakened (save ends)
abilities.rival.echelon-4.rival-tactician.guardian-from-afar.texts.tier2: 16 damage; M < 4 weakened (save ends)
abilities.rival.echelon-4.rival-tactician.guardian-from-afar.texts.tier3: 20 damage; M < 5 weakened (save ends)
abilities.rival.echelon-4.rival-tactician.guardian-from-afar.texts.effect: 'Effect: Each ally in the area regains 10 Stamina.'
abilities.rival.echelon-4.rival-tactician.battlefield-control.name: Battlefield Control
abilities.rival.echelon-4.rival-tactician.battlefield-control.texts.trigger: An enemy within distance willingly moves.
abilities.rival.echelon-4.rival-tactician.battlefield-control.texts.target: The triggering enemy
abilities.rival.echelon-4.rival-tactician.battlefield-control.texts.distance: Ranged 10
abilities.rival.echelon-4.rival-tactician.battlefield-control.texts.effect: 'Effect: At any point
  during the movement, the tactician and one ally within distance can use a signature ability
  against the target.'
traits.rival.echelon-4.rival-tactician.rivalry.name: Rivalry
traits.rival.echelon-4.rival-tactician.rivalry.description: At the start of an encounter, the
  tactician chooses one creature within their line of effect. Both the tactician and the creature
  can add a d3 roll to power rolls they make against each other.
monsters.rival.echelon-4.rival-tactician.name: Rival Tactician
abilities.rival.echelon-4.rival-talent.override.name: Override
abilities.rival.echelon-4.rival-talent.override.texts.target: Two creatures or objects
abilities.rival.echelon-4.rival-talent.override.texts.distance: Ranged 10
abilities.rival.echelon-4.rival-talent.override.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-talent.override.texts.tier1: 15 psychic damage
abilities.rival.echelon-4.rival-talent.override.texts.tier2: 20 psychic damage
abilities.rival.echelon-4.rival-talent.override.texts.tier3: 24 psychic damage
abilities.rival.echelon-4.rival-talent.override.texts.effect: "4 Malice: Each target moves up to
  their speed and can make a free strike against one creature of the talent's choice. The target's
  movement can provoke opportunity attacks, but they can't otherwise be moved in a way that would
  harm them."
abilities.rival.echelon-4.rival-talent.steal-time.name: Steal Time
abilities.rival.echelon-4.rival-talent.steal-time.texts.target: One creature or object
abilities.rival.echelon-4.rival-talent.steal-time.texts.distance: Ranged 10
abilities.rival.echelon-4.rival-talent.steal-time.texts.roll: Power Roll + 5
abilities.rival.echelon-4.rival-talent.steal-time.texts.tier1: R < 3 slowed (save ends)
abilities.rival.echelon-4.rival-talent.steal-time.texts.tier2: R < 4 restrained (save ends)
abilities.rival.echelon-4.rival-talent.steal-time.texts.tier3: R < 5 restrained (save ends)
abilities.rival.echelon-4.rival-talent.steal-time.texts.effect: 'Effect: One ally within distance can use an additional main action on their next turn.'
abilities.rival.echelon-4.rival-talent.psionic-retribution.name: Psionic Retribution
abilities.rival.echelon-4.rival-talent.psionic-retribution.texts.trigger: A creature deals damage to the talent.
abilities.rival.echelon-4.rival-talent.psionic-retribution.texts.target: Self
abilities.rival.echelon-4.rival-talent.psionic-retribution.texts.distance: Self; see below
abilities.rival.echelon-4.rival-talent.psionic-retribution.texts.effect: 'Effect: The talent halves
  the damage and shifts up to 2 squares. The triggering creature takes psychic damage equal to half
  the damage dealt and is pushed up to 5 squares.'
traits.rival.echelon-4.rival-talent.rivalry.name: Rivalry
traits.rival.echelon-4.rival-talent.rivalry.description: At the start of an encounter, the talent
  chooses one creature within their line of effect. Both the talent and the creature can add a d3
  roll to power rolls they make against each other.
monsters.rival.echelon-4.rival-talent.name: Rival Talent
malice.rival.level-1.work-as-one.name: Work as One
malice.rival.level-1.work-as-one.description: Until the end of the round, each rival can impose a
  bane on a strike made against an adjacent rival as a free triggered action.
malice.rival.level-1.we-just-do-it-better.name: We Just Do It Better
malice.rival.level-1.we-just-do-it-better.description: Until the end of the round, whenever any
  rival makes a power roll against the target of their Rivalry trait, they roll a d3 and add it to
  the power roll.
malice.rival.level-1.check-out-our-loot.name: Check Out Our Loot
malice.rival.level-1.check-out-our-loot.description: 'One rival pulls out a magic consumable and
  hurls it, targeting a 5 x 1 line within 1 square of them or a 3 cube within 10 squares of them.
  Each enemy in the area makes an Agility test. The rival chooses a damage type and a condition for
  the outcome of the test from one of the following pairs: sonic damage and dazed, poison damage and
  weakened, or fire damage and frightened.'
malice.rival.level-1.check-out-our-loot.texts.tier1: 11 damage; the condition affects the target (save ends)
malice.rival.level-1.check-out-our-loot.texts.tier2: 8 damage; the condition affects the target (EoT)
malice.rival.level-1.check-out-our-loot.texts.tier3: 5 damage
malice.rival.level-1.calling-the-shots.name: Calling the Shots
malice.rival.level-1.calling-the-shots.description: Each rival regains 10 Stamina. Until the end of
  the round, whenever a rival uses an ability against an enemy, each other rival adjacent to that
  enemy can make a free strike against them.
malice.rival.level-1.coordinated-takedown.name: Coordinated Takedown
malice.rival.level-1.coordinated-takedown.description: Each rival moves up to their speed and uses a main action or maneuver that doesn't cost Malice.
abilities.rival.echelon-3.rival-null.inertial-flow.name: Inertial Flow
abilities.rival.echelon-3.rival-null.inertial-flow.texts.target: Two creatures or objects
abilities.rival.echelon-3.rival-null.inertial-flow.texts.distance: Melee 1
abilities.rival.echelon-3.rival-null.inertial-flow.texts.roll: Power Roll + 4
abilities.rival.echelon-3.rival-null.inertial-flow.texts.tier1: 12 damage; the null shifts up to 3 squares; A < 2 8 damage
abilities.rival.echelon-3.rival-null.inertial-flow.texts.tier2: 17 damage; the null shifts up to 4 squares; A < 3 13 damage
abilities.rival.echelon-3.rival-null.inertial-flow.texts.tier3: 21 damage; the null shifts up to 5 squares; A < 4 17 damage
effects.rival.imbued.name: Imbue with Might
effects.rival.imbued.description: The target gains an edge on their next strike.
effects.rival.imbued-double.name: Imbue with Power
effects.rival.imbued-double.description: The target has a double edge on their next strike.
effects.rival.empyrean-boon.name: Empyrean Boon
effects.rival.empyrean-boon.description: The target has a double edge on their next strike, and that
  strike deals an extra 10 holy damage. Additionally, they can vertical slide each creature targeted
  by the strike up to 2 squares.
effects.rival.poisoned-blade.name: Poisoned blade
effects.rival.poisoned-blade.description: The shadow gains an edge on their next strike, and any potency for that strike increases by 1.
effects.rival.poisoned-blade-double.name: Poisoned blade
effects.rival.poisoned-blade-double.description: The shadow has a double edge on their next strike, and any potency for that strike increases by 2.
