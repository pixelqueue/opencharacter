effects.olothec.devolved.name: Devolved
effects.olothec.devolved.description: A devolved creature has a −1 score for all their characteristics other than Reason.
effects.olothec.psychic-weakness.name: Liquified
effects.olothec.psychic-weakness.description: The creature has psychic weakness 3.
effects.olothec.pulse-shield.name: Psychic Pulse
effects.olothec.pulse-shield.description: The olothec has damage immunity 4.
