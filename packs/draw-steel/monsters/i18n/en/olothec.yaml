malice.olothec.solo-action.name: Solo Action
malice.olothec.solo-action.description: The olothec takes an additional main action on their turn.
  They can use this feature even if they are dazed.
malice.olothec.writhing-envelopment.name: Writhing Envelopment
malice.olothec.writhing-envelopment.description: >-
  Keywords: Melee, Strike, Weapon · Main action


  Distance: Melee 3 · Target: One slimed, transformed, or devolved creature


  Power Roll + 4


  Effect: The olothec can pull a target grabbed this way adjacent to them. While grabbed this way, a
  target can't make saving throws to end any other effects, and the olothec has a double edge on
  strikes against them.
malice.olothec.writhing-envelopment.texts.tier1: 11 psychic damage; A < 2 grabbed
malice.olothec.writhing-envelopment.texts.tier2: 17 psychic damage; A < 3 grabbed
malice.olothec.writhing-envelopment.texts.tier3: 20 psychic damage; A < 4 grabbed
malice.olothec.memory-of-chaos.name: Memory of Chaos
malice.olothec.memory-of-chaos.description: The olothec broadcasts their memory of the universe in
  its primordial state—a sweeping cacophony of transcendental irrationality and unceasing change.
  Until the end of the encounter, any creature who starts their turn within 3 squares of the olothec
  and has R < 3 is dazed and slowed until the end of their next turn.
traits.olothec.olothec.solo-monster.name: Solo Monster
traits.olothec.olothec.solo-monster.description: >-
  End Effect: At the end of each of their turns, the olothec can take 10 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The olothec can take two turns each round. They can't take turns consecutively.
traits.olothec.olothec.gelatinosis.name: Gelatinosis
traits.olothec.olothec.gelatinosis.description: A creature permanently devolves into a slime servant
  if they spend 1 continuous minute weakened by Devolving Tentacles, they are reduced to 0 Stamina
  by the psychic damage from Devolving Tentacles, or they suffer all three transformations from
  Oozing Transformation.
abilities.olothec.olothec.devolving-tentacles.name: Devolving Tentacles
abilities.olothec.olothec.devolving-tentacles.texts.target: Two creatures or objects
abilities.olothec.olothec.devolving-tentacles.texts.distance: Melee 3
abilities.olothec.olothec.devolving-tentacles.texts.roll: Power Roll + 4
abilities.olothec.olothec.devolving-tentacles.texts.tier1: 11 damage; M < 2 weakened or the target is slimed (save ends)
abilities.olothec.olothec.devolving-tentacles.texts.tier2: 17 damage; M < 3 weakened or the target is slimed (save ends)
abilities.olothec.olothec.devolving-tentacles.texts.tier3: 20 damage; M < 4 weakened and the target is slimed (save ends)
abilities.olothec.olothec.devolving-tentacles.texts.effect: 'Effect: A slimed target takes 4 psychic damage whenever they make a power roll.'
abilities.olothec.olothec.slime-spew.name: Slime Spew
abilities.olothec.olothec.slime-spew.texts.target: Each creature and object in the area
abilities.olothec.olothec.slime-spew.texts.distance: 7 × 2 line within 1
abilities.olothec.olothec.slime-spew.texts.roll: Power Roll + 4
abilities.olothec.olothec.slime-spew.texts.tier1: 6 acid damage; A < 2 push special
abilities.olothec.olothec.slime-spew.texts.tier2: 10 acid damage; A < 3 push special
abilities.olothec.olothec.slime-spew.texts.tier3: 13 acid damage; A < 4 push special and prone
abilities.olothec.olothec.slime-spew.texts.effect: >-
  Effect: Each creature pushed this way is pushed to an unoccupied space in the area as far as
  possible from the olothec.


  1 Malice: The area is difficult terrain. Any creature who enters the area or moves within it for
  the first time on a turn and has A < 3 is knocked prone.
abilities.olothec.olothec.oozing-transformation.name: Oozing Transformation
abilities.olothec.olothec.oozing-transformation.texts.target: One creature
abilities.olothec.olothec.oozing-transformation.texts.distance: Ranged 10
abilities.olothec.olothec.oozing-transformation.texts.roll: Power Roll + 4
abilities.olothec.olothec.oozing-transformation.texts.tier1: 13 psychic damage; I < 2 the target is transformed (save ends)
abilities.olothec.olothec.oozing-transformation.texts.tier2: 20 psychic damage; I < 3 the target is transformed (save ends)
abilities.olothec.olothec.oozing-transformation.texts.tier3: 23 psychic damage; I < 4 the target is transformed (save ends)
abilities.olothec.olothec.oozing-transformation.texts.effect: >-
  Effect: Each time a target is transformed, the Director chooses one of the following
  transformations. When a target ends the transformed effect, all transformations on them end.


  Head: The target's head becomes a ball of slime. They can't communicate and have line of effect
  only within 3 squares.


  Legs: The target's legs become pillars of ooze. They are slowed while on land and can
  automatically swim at full speed while moving.


  Torso: The target's arms become gelatinous. They can't benefit from edges or double edges and
  can't gain or use surges.
abilities.olothec.olothec.jaunt.name: Jaunt
abilities.olothec.olothec.jaunt.texts.target: Self
abilities.olothec.olothec.jaunt.texts.distance: Self
abilities.olothec.olothec.jaunt.texts.effect: 'Effect: The olothec teleports to an unoccupied space
  within 10 squares. Alternatively, they swap places with a creature or object within 5 squares of
  them.'
abilities.olothec.olothec.liquify.name: Liquify
abilities.olothec.olothec.liquify.texts.trigger: An enemy within distance deals damage to the olothec.
abilities.olothec.olothec.liquify.texts.target: Each enemy
abilities.olothec.olothec.liquify.texts.distance: Ranged 5
abilities.olothec.olothec.liquify.texts.effect: "Effect: The target takes 8 psychic damage and has
  psychic weakness 3 until the end of the olothec's next turn."
traits.olothec.olothec.primordial-mind.name: Primordial Mind
traits.olothec.olothec.primordial-mind.description: The olothec can't be made frightened or taunted.
traits.olothec.olothec.slime-sense.name: Slime Sense
traits.olothec.olothec.slime-sense.description: A slimed or transformed creature can't have concealment from or be hidden from the olothec.
abilities.olothec.olothec.horrifying-form.name: Horrifying Form
abilities.olothec.olothec.horrifying-form.texts.target: Each enemy
abilities.olothec.olothec.horrifying-form.texts.distance: Ranged 20
abilities.olothec.olothec.horrifying-form.texts.roll: Power Roll + 4
abilities.olothec.olothec.horrifying-form.texts.tier1: 10 psychic damage; P < 2 frightened (save ends)
abilities.olothec.olothec.horrifying-form.texts.tier2: 14 psychic damage; P < 3 frightened (save ends)
abilities.olothec.olothec.horrifying-form.texts.tier3: 17 psychic damage; P < 4 frightened (save ends)
abilities.olothec.olothec.horrifying-form.texts.effect: "Effect: While frightened this way, a target can't make saving throws to end any other effects."
abilities.olothec.olothec.psychic-pulse.name: Psychic Pulse
abilities.olothec.olothec.psychic-pulse.texts.target: Each creature in the area
abilities.olothec.olothec.psychic-pulse.texts.distance: 10 burst
abilities.olothec.olothec.psychic-pulse.texts.effect: 'Effect: The olothec slides each target up to
  5 squares. Each target takes 12 psychic damage, and if they have M < 3 they are weakened and
  slimed (save ends). A slimed target takes 4 psychic damage whenever they make a power roll.
  Additionally, until the start of their next turn, the olothec has damage immunity 4.'
abilities.olothec.olothec.return-to-perfection.name: Return to Perfection
abilities.olothec.olothec.return-to-perfection.texts.target: Each creature in the area
abilities.olothec.olothec.return-to-perfection.texts.distance: 10 burst
abilities.olothec.olothec.return-to-perfection.texts.roll: Power Roll + 4
abilities.olothec.olothec.return-to-perfection.texts.tier1: 7 psychic damage; R < 2 the target is devolved (save ends)
abilities.olothec.olothec.return-to-perfection.texts.tier2: 13 psychic damage; R < 3 the target is devolved (save ends)
abilities.olothec.olothec.return-to-perfection.texts.tier3: 16 psychic damage; R < 3 the target is devolved (save ends)
abilities.olothec.olothec.return-to-perfection.texts.effect: 'Effect: A devolved creature has a −1 score for all their characteristics other than Reason.'
monsters.olothec.olothec.name: Olothec
effects.olothec.slimed.name: Slimed
effects.olothec.slimed.description: A slimed target takes 4 psychic damage whenever they make a power roll.
