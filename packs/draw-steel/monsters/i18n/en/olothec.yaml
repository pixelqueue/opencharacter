abilities.olothec.malice.writhing-envelopment.texts.target: One slimed, transformed, or devolved creature
abilities.olothec.malice.writhing-envelopment.texts.distance: Melee 3
abilities.olothec.malice.writhing-envelopment.texts.roll: Power Roll + 4
abilities.olothec.malice.writhing-envelopment.texts.tier1: 11 psychic damage; A < 2 grabbed
abilities.olothec.malice.writhing-envelopment.texts.tier2: 17 psychic damage; A < 3 grabbed
