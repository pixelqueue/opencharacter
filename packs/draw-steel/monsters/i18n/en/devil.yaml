abilities.devil.devil-notary.importunity.texts.distance: Ranged 5
abilities.devil.devil-notary.importunity.texts.roll: Power Roll + 3
abilities.devil.devil-notary.importunity.texts.tier1: 3 fire damage
abilities.devil.devil-notary.importunity.texts.tier2: 5 fire damage; R < 2 the target takes a bane on their next strike
abilities.devil.devil-notary.importunity.texts.tier3: 6 fire damage; R < 3 the target takes a bane on their next strike
abilities.devil.devil-notary.importunity.texts.effect: 'Effect: One non-minion devil within 5 squares of the notary gains an edge on their next strike.'
