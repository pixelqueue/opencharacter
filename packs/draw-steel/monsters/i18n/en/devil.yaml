malice.devil.bureaucratic-tape.name: Bureaucratic Tape
malice.devil.bureaucratic-tape.description: One devil acting this turn uses a signature ability
  against an adjacent creature. On a tier 3 outcome, the target of the ability has a double bane on
  strikes (save ends).
malice.devil.underhanded-tactics.name: Underhanded Tactics
malice.devil.underhanded-tactics.description: One or two devils can teleport to a space adjacent to
  one or more creatures who aren't hidden and make a free strike. For each 2 additional Malice spent
  on this feature, one additional devil can teleport.
malice.devil.read-the-small-print.name: Read the Small Print
malice.devil.read-the-small-print.description: Each enemy in the encounter is subject to a bad deal
  proposed by the devils. An enemy must choose between having damage weakness 5 or taking a bane on
  power rolls. The bad deal lasts until the end of the encounter.
abilities.devil.devil-adjudicator.infernal-injunction.name: Infernal Injunction
abilities.devil.devil-adjudicator.infernal-injunction.texts.target: Two creatures or objects
abilities.devil.devil-adjudicator.infernal-injunction.texts.distance: Ranged 10
abilities.devil.devil-adjudicator.infernal-injunction.texts.roll: Power Roll + 3
abilities.devil.devil-adjudicator.infernal-injunction.texts.tier1: 10 fire damage; I < 1 frightened (save ends)
abilities.devil.devil-adjudicator.infernal-injunction.texts.tier2: 15 fire damage; I < 1 frightened (save ends)
abilities.devil.devil-adjudicator.infernal-injunction.texts.tier3: 18 fire damage; I < 1 frightened (save ends)
abilities.devil.devil-adjudicator.infernal-injunction.texts.effect: 'Effect: The adjudicator can slide a target frightened by this ability up to 2 squares.'
abilities.devil.devil-adjudicator.adjudicators-interdiction.name: Adjudicator's Interdiction
abilities.devil.devil-adjudicator.adjudicators-interdiction.texts.target: One creature
abilities.devil.devil-adjudicator.adjudicators-interdiction.texts.distance: Ranged 10
abilities.devil.devil-adjudicator.adjudicators-interdiction.texts.roll: Presence test
abilities.devil.devil-adjudicator.adjudicators-interdiction.texts.tier1: The target is slowed, takes a bane on power rolls, and can't regain Stamina (save ends).
abilities.devil.devil-adjudicator.adjudicators-interdiction.texts.tier2: The target is slowed and takes a bane on power rolls (save ends).
abilities.devil.devil-adjudicator.adjudicators-interdiction.texts.tier3: Slowed (save ends)
abilities.devil.devil-adjudicator.adjudicators-interdiction.texts.effect: 'Effect: The target makes a Presence test.'
abilities.devil.devil-adjudicator.quid-pro-quo.name: Quid Pro Quo
abilities.devil.devil-adjudicator.quid-pro-quo.texts.target: One ally or frightened creature
abilities.devil.devil-adjudicator.quid-pro-quo.texts.distance: Ranged 10
abilities.devil.devil-adjudicator.quid-pro-quo.texts.effect: 'Effect: The adjudicator and the target teleport to switch places.'
abilities.devil.devil-adjudicator.devilish-charm.name: Devilish Charm
abilities.devil.devil-adjudicator.devilish-charm.texts.trigger: A creature targets the adjudicator with a strike.
abilities.devil.devil-adjudicator.devilish-charm.texts.target: The triggering creature
abilities.devil.devil-adjudicator.devilish-charm.texts.distance: Ranged 5
abilities.devil.devil-adjudicator.devilish-charm.texts.roll: Presence test
abilities.devil.devil-adjudicator.devilish-charm.texts.tier1: The adjudicator chooses a new target for the strike.
abilities.devil.devil-adjudicator.devilish-charm.texts.tier2: The adjudicator halves the triggering damage.
abilities.devil.devil-adjudicator.devilish-charm.texts.tier3: The target takes a bane on the strike.
abilities.devil.devil-adjudicator.devilish-charm.texts.effect: 'Effect: The target makes a Presence test.'
traits.devil.devil-adjudicator.vexatious-litigation.name: Vexatious Litigation
traits.devil.devil-adjudicator.vexatious-litigation.description: Any creature within 10 squares of
  the adjudicator who has P < 3 takes a −2 penalty to saving throws.
traits.devil.devil-adjudicator.true-name.name: True Name
traits.devil.devil-adjudicator.true-name.description: If a creature within 10 squares speaks the
  adjudicator's true name, the adjudicator loses their damage immunities, any nondamaging effects of
  their signature ability, and their Devilish Charm ability until the end of the encounter.
monsters.devil.devil-adjudicator.name: Devil Adjudicator
monsters.devil.devil-clerk.texts.withCaptain: +2 damage bonus to strikes
abilities.devil.devil-clerk.quill-pushing.name: Quill Pushing
abilities.devil.devil-clerk.quill-pushing.texts.target: One creature or object per minion
abilities.devil.devil-clerk.quill-pushing.texts.distance: Melee 1
abilities.devil.devil-clerk.quill-pushing.texts.roll: Power Roll + 3
abilities.devil.devil-clerk.quill-pushing.texts.tier1: 3 damage; push 1
abilities.devil.devil-clerk.quill-pushing.texts.tier2: 6 damage; push 2
abilities.devil.devil-clerk.quill-pushing.texts.tier3: 7 damage; push 3
abilities.devil.devil-clerk.quill-pushing.texts.effect: 'Effect: Any target adjacent to two or more clerks is taunted until the end of their next turn.'
traits.devil.devil-clerk.true-name.name: True Name
traits.devil.devil-clerk.true-name.description: If a creature within 10 squares speaks the clerk's
  true name, the clerk loses their fire immunity and any nondamaging effects of their signature
  ability until the end of the encounter.
monsters.devil.devil-clerk.name: Devil Clerk
abilities.devil.devil-high-judge.infernal-decree.name: Infernal Decree
abilities.devil.devil-high-judge.infernal-decree.texts.target: Three creatures or objects
abilities.devil.devil-high-judge.infernal-decree.texts.distance: Ranged 12
abilities.devil.devil-high-judge.infernal-decree.texts.roll: Power Roll + 4
abilities.devil.devil-high-judge.infernal-decree.texts.tier1: 10 damage; P < 2 the target can't hide (save ends)
abilities.devil.devil-high-judge.infernal-decree.texts.tier2: 15 damage; P < 3 the target can't hide (save ends)
abilities.devil.devil-high-judge.infernal-decree.texts.tier3: 19 damage; P < 4 the target can't hide (save ends)
abilities.devil.devil-high-judge.infernal-decree.texts.effect: '2 Malice: While a target is unable
  to hide this way, any strike against them made by a devil gains an edge.'
abilities.devil.devil-high-judge.compel-the-jury.name: Compel the Jury
abilities.devil.devil-high-judge.compel-the-jury.texts.target: Two creatures
abilities.devil.devil-high-judge.compel-the-jury.texts.distance: Ranged 12
abilities.devil.devil-high-judge.compel-the-jury.texts.roll: Power Roll + 4
abilities.devil.devil-high-judge.compel-the-jury.texts.tier1: I < 2 the target is charmed (save ends)
abilities.devil.devil-high-judge.compel-the-jury.texts.tier2: I < 3 the target is charmed (save ends)
abilities.devil.devil-high-judge.compel-the-jury.texts.tier3: I < 4 the target is charmed (save ends)
abilities.devil.devil-high-judge.compel-the-jury.texts.effect: 'Effect: While charmed this way, a
  creature treats the high judge as an ally, and the high judge can spend 1 Malice on their turn to
  make that creature move up to 3 squares.'
abilities.devil.devil-high-judge.devilish-suggestion.name: Devilish Suggestion
abilities.devil.devil-high-judge.devilish-suggestion.texts.trigger: A creature targets the high judge with a strike.
abilities.devil.devil-high-judge.devilish-suggestion.texts.target: The triggering creature
abilities.devil.devil-high-judge.devilish-suggestion.texts.distance: Ranged 5
abilities.devil.devil-high-judge.devilish-suggestion.texts.roll: Presence test
abilities.devil.devil-high-judge.devilish-suggestion.texts.tier1: The target is charmed (save ends).
abilities.devil.devil-high-judge.devilish-suggestion.texts.tier2: The high judge chooses a new target for the strike.
abilities.devil.devil-high-judge.devilish-suggestion.texts.tier3: The target takes a bane on the strike.
abilities.devil.devil-high-judge.devilish-suggestion.texts.effect: >-
  Effect: The target makes a Presence test.


  While charmed this way, a creature treats the high judge as an ally, and the high judge can spend
  1 Malice on their turn to make that creature move up to 3 squares.
traits.devil.devil-high-judge.end-effect.name: End Effect
traits.devil.devil-high-judge.end-effect.description: At the end of each of their turns, the high
  judge can take 10 damage to end one effect on them that can be ended by a saving throw. This
  damage can't be reduced in any way.
traits.devil.devil-high-judge.true-name.name: True Name
traits.devil.devil-high-judge.true-name.description: If a creature within 10 squares speaks the high
  judge's true name, the high judge loses their damage immunities, any nondamaging effects of their
  signature ability, and their Devilish Suggestion triggered action until the end of the encounter.
abilities.devil.devil-high-judge.all-rise.name: All Rise
abilities.devil.devil-high-judge.all-rise.texts.target: Each enemy in the area
abilities.devil.devil-high-judge.all-rise.texts.distance: 3 burst
abilities.devil.devil-high-judge.all-rise.texts.roll: Presence test
abilities.devil.devil-high-judge.all-rise.texts.tier1: 15 psychic damage; the target is charmed (save ends)
abilities.devil.devil-high-judge.all-rise.texts.tier2: 12 psychic damage; the target is charmed (save ends)
abilities.devil.devil-high-judge.all-rise.texts.tier3: 7 psychic damage
abilities.devil.devil-high-judge.all-rise.texts.effect: >-
  Effect: The target makes a Presence test.


  While charmed this way, a creature treats the high judge as an ally, and the high judge can spend
  1 Malice on their turn to make that creature move up to 3 squares.
abilities.devil.devil-high-judge.heed-my-decree.name: Heed My Decree
abilities.devil.devil-high-judge.heed-my-decree.texts.target: Self and each ally in the area
abilities.devil.devil-high-judge.heed-my-decree.texts.distance: 5 burst
abilities.devil.devil-high-judge.heed-my-decree.texts.effect: "Effect: Each target shifts up to
  their speed. The high judge can make each creature charmed by All Rise, Compel the Jury, or
  Devilish Suggestion move up to half that creature's speed."
abilities.devil.devil-high-judge.deceptive-stratagem.name: Deceptive Stratagem
abilities.devil.devil-high-judge.deceptive-stratagem.texts.target: One creature
abilities.devil.devil-high-judge.deceptive-stratagem.texts.distance: Ranged 12
abilities.devil.devil-high-judge.deceptive-stratagem.texts.effect: "Effect: If the target is an ally
  or a creature charmed by All Rise, Compel the Jury, or Devilish Suggestion, the high judge and the
  target teleport to swap places. Each ally within 12 squares of the high judge can then make a free
  strike against a target of the high judge's choice. Each creature charmed by All Rise, Compel the
  Jury, or Devilish Suggestion makes a free strike against a target of the high judge's choice."
monsters.devil.devil-high-judge.name: Devil High Judge
traits.devil.devil-jurist.hellfire.name: Hellfire
traits.devil.devil-jurist.hellfire.description: Fire damage dealt by the jurist ignores damage immunity.
abilities.devil.devil-jurist.fire-and-brimstone.name: Fire and Brimstone
abilities.devil.devil-jurist.fire-and-brimstone.texts.target: Two creatures or objects
abilities.devil.devil-jurist.fire-and-brimstone.texts.distance: Ranged 12
abilities.devil.devil-jurist.fire-and-brimstone.texts.roll: Power Roll + 3
abilities.devil.devil-jurist.fire-and-brimstone.texts.tier1: 10 fire damage
abilities.devil.devil-jurist.fire-and-brimstone.texts.tier2: 15 fire damage; A < 2 burning (save ends)
abilities.devil.devil-jurist.fire-and-brimstone.texts.tier3: 18 fire damage; A < 3 burning (save ends)
abilities.devil.devil-jurist.fire-and-brimstone.texts.effect: >-
  Effect: A burning creature takes 1d6 fire damage at the start of each of their turns. A burning
  object takes 1d6 fire damage at the end of each round.


  1+ Malice: The jurist can target one additional creature or object for each Malice spent.
abilities.devil.devil-jurist.dismissal-with-prejudice.name: Dismissal with Prejudice
abilities.devil.devil-jurist.dismissal-with-prejudice.texts.target: Each enemy in the area
abilities.devil.devil-jurist.dismissal-with-prejudice.texts.distance: 2 burst
abilities.devil.devil-jurist.dismissal-with-prejudice.texts.roll: Power Roll + 3
abilities.devil.devil-jurist.dismissal-with-prejudice.texts.tier1: 6 damage; slide 1
abilities.devil.devil-jurist.dismissal-with-prejudice.texts.tier2: 10 damage; slide 3
abilities.devil.devil-jurist.dismissal-with-prejudice.texts.tier3: 12 damage; slide 5
abilities.devil.devil-jurist.dismissal-with-prejudice.texts.effect: 'Effect: If the target has M < 2, the forced distance movement gains a +3 bonus.'
abilities.devil.devil-jurist.ashes-to-ashes.name: Ashes to Ashes
abilities.devil.devil-jurist.ashes-to-ashes.texts.target: One creature
abilities.devil.devil-jurist.ashes-to-ashes.texts.distance: Ranged 12
abilities.devil.devil-jurist.ashes-to-ashes.texts.effect: 'If the target is burning (see Fire and Brimstone), they take 6 fire damage.'
abilities.devil.devil-jurist.devilish-charm.name: Devilish Charm
abilities.devil.devil-jurist.devilish-charm.texts.trigger: A creature targets the jurist with a strike.
abilities.devil.devil-jurist.devilish-charm.texts.target: The triggering creature
abilities.devil.devil-jurist.devilish-charm.texts.distance: Ranged 5
abilities.devil.devil-jurist.devilish-charm.texts.roll: Presence test
abilities.devil.devil-jurist.devilish-charm.texts.tier1: The jurist chooses a new target for the strike.
abilities.devil.devil-jurist.devilish-charm.texts.tier2: The jurist halves the triggering damage.
abilities.devil.devil-jurist.devilish-charm.texts.tier3: The target takes a bane on the strike.
abilities.devil.devil-jurist.devilish-charm.texts.effect: 'Effect: The target makes a Presence test.'
traits.devil.devil-jurist.true-name.name: True Name
traits.devil.devil-jurist.true-name.description: If a creature within 10 squares speaks the jurist's
  true name, the jurist loses their fire immunity, any nondamaging effects of their signature
  ability, and their Devilish Charm ability until the end of the encounter.
monsters.devil.devil-jurist.name: Devil Jurist
abilities.devil.devil-legate.infernal-pike.name: Infernal Pike
abilities.devil.devil-legate.infernal-pike.texts.target: Two creatures or objects
abilities.devil.devil-legate.infernal-pike.texts.distance: Melee 2
abilities.devil.devil-legate.infernal-pike.texts.roll: Power Roll + 3
abilities.devil.devil-legate.infernal-pike.texts.tier1: 9 damage
abilities.devil.devil-legate.infernal-pike.texts.tier2: 14 damage; A < 2 slowed (save ends)
abilities.devil.devil-legate.infernal-pike.texts.tier3: 17 damage; A < 3 slowed (save ends)
abilities.devil.devil-legate.infernal-pike.texts.effect: 'Effect: If the targets are adjacent to each other, this ability deals an extra 3 damage.'
abilities.devil.devil-legate.writ-of-execution.name: Writ of Execution
abilities.devil.devil-legate.writ-of-execution.texts.target: Two creatures or objects
abilities.devil.devil-legate.writ-of-execution.texts.distance: Melee 2
abilities.devil.devil-legate.writ-of-execution.texts.roll: Power Roll + 3
abilities.devil.devil-legate.writ-of-execution.texts.tier1: 6 damage; M < 1 prone
abilities.devil.devil-legate.writ-of-execution.texts.tier2: 11 damage; M < 2 prone and can't stand (save ends)
abilities.devil.devil-legate.writ-of-execution.texts.tier3: 14 damage; M < 3 prone and can't stand (save ends)
abilities.devil.devil-legate.writ-of-execution.texts.effect: 'Effect: If this ability is used as
  part of the Charge main action, the legate ignores difficult terrain during the charge. Each
  creature and object whose space the legate moves through takes the damage from this ability, but
  not its additional effects.'
abilities.devil.devil-legate.law-and-order.name: Law and Order
abilities.devil.devil-legate.law-and-order.texts.target: One creature
abilities.devil.devil-legate.law-and-order.texts.distance: Melee 1
abilities.devil.devil-legate.law-and-order.texts.effect: 'Effect: The target is taunted by the
  legate (save ends). The legate can have only one creature taunted at a time.'
abilities.devil.devil-legate.devilish-charm.name: Devilish Charm
abilities.devil.devil-legate.devilish-charm.texts.trigger: A creature targets the legate with a strike.
abilities.devil.devil-legate.devilish-charm.texts.target: The triggering creature
abilities.devil.devil-legate.devilish-charm.texts.distance: Ranged 5
abilities.devil.devil-legate.devilish-charm.texts.roll: Presence test
abilities.devil.devil-legate.devilish-charm.texts.tier1: The legate chooses a new target for the strike.
abilities.devil.devil-legate.devilish-charm.texts.tier2: The legate halves the triggering damage.
abilities.devil.devil-legate.devilish-charm.texts.tier3: The target takes a bane on the strike.
abilities.devil.devil-legate.devilish-charm.texts.effect: 'Effect: The target makes a Presence test.'
traits.devil.devil-legate.hellish-bailiff.name: Hellish Bailiff
traits.devil.devil-legate.hellish-bailiff.description: The legate has damage immunity 3 while in one
  of the Seven Cities of Hell or within 10 squares of a non-minion devil who is of a higher level
  than them.
traits.devil.devil-legate.true-name.name: True Name
traits.devil.devil-legate.true-name.description: If a creature within 10 squares speaks the legate's
  true name, the legate loses their damage immunities, any nondamaging effects of their signature
  ability, and their Devilish Charm ability until the end of the encounter.
monsters.devil.devil-legate.name: Devil Legate
abilities.devil.devil-magistrate.edge-of-the-law.name: Edge of the Law
abilities.devil.devil-magistrate.edge-of-the-law.texts.target: Two creatures or objects
abilities.devil.devil-magistrate.edge-of-the-law.texts.distance: Melee 1
abilities.devil.devil-magistrate.edge-of-the-law.texts.roll: Power Roll + 3
abilities.devil.devil-magistrate.edge-of-the-law.texts.tier1: 10 damage
abilities.devil.devil-magistrate.edge-of-the-law.texts.tier2: 15 damage
abilities.devil.devil-magistrate.edge-of-the-law.texts.tier3: 18 fire damage; R < 3 dazed (save ends)
abilities.devil.devil-magistrate.edge-of-the-law.texts.effect: 'Effect: The magistrate shifts up to
  3 squares before or after using this ability, or between each strike.'
abilities.devil.devil-magistrate.verdict.name: Verdict
abilities.devil.devil-magistrate.verdict.texts.target: One creature
abilities.devil.devil-magistrate.verdict.texts.distance: Melee 1
abilities.devil.devil-magistrate.verdict.texts.roll: Power Roll + 3
abilities.devil.devil-magistrate.verdict.texts.tier1: 11 damage
abilities.devil.devil-magistrate.verdict.texts.tier2: 17 damage
abilities.devil.devil-magistrate.verdict.texts.tier3: 21 damage
abilities.devil.devil-magistrate.verdict.texts.effect: 'Effect: This ability has a double edge if
  the magistrate was hidden from the target, and deals an extra 5 damage if the target is dazed.'
abilities.devil.devil-magistrate.justice-turns-its-gaze.name: Justice Turns Its Gaze
abilities.devil.devil-magistrate.justice-turns-its-gaze.texts.target: Self
abilities.devil.devil-magistrate.justice-turns-its-gaze.texts.distance: Self
abilities.devil.devil-magistrate.justice-turns-its-gaze.texts.effect: 'Effect: The magistrate turns
  invisible until the start of their next turn, and can attempt to hide as a free maneuver before
  the end of the current turn.'
abilities.devil.devil-magistrate.devilish-charm.name: Devilish Charm
abilities.devil.devil-magistrate.devilish-charm.texts.trigger: A creature targets the magistrate with a strike.
abilities.devil.devil-magistrate.devilish-charm.texts.target: The triggering creature
abilities.devil.devil-magistrate.devilish-charm.texts.distance: Ranged 5
abilities.devil.devil-magistrate.devilish-charm.texts.roll: Presence test
abilities.devil.devil-magistrate.devilish-charm.texts.tier1: The magistrate chooses a new target for the strike.
abilities.devil.devil-magistrate.devilish-charm.texts.tier2: The magistrate halves the triggering damage.
abilities.devil.devil-magistrate.devilish-charm.texts.tier3: The target takes a bane on the strike.
abilities.devil.devil-magistrate.devilish-charm.texts.effect: 'Effect: The target makes a Presence test.'
traits.devil.devil-magistrate.leading.name: Leading
traits.devil.devil-magistrate.leading.description: Whenever the magistrate moves away from an enemy
  who is adjacent to one of the magistrate's allies, they can shift instead.
traits.devil.devil-magistrate.true-name.name: True Name
traits.devil.devil-magistrate.true-name.description: If a creature within 10 squares speaks the
  magistrate's true name, the magistrate loses their damage immunities, any nondamaging effects of
  their signature ability, and their Devilish Charm ability until the end of the encounter.
monsters.devil.devil-magistrate.name: Devil Magistrate
monsters.devil.devil-notary.texts.withCaptain: +5 bonus to ranged distance
