abilities.devil.devil-scrivener.litigation.texts.tier1: 3 corruption damage
abilities.devil.devil-scrivener.litigation.texts.tier2: 5 corruption damage; slowed (EoT)
abilities.devil.devil-scrivener.litigation.texts.tier3: 6 corruption damage; slowed (EoT)
abilities.devil.devil-scrivener.litigation.texts.effect: 'Effect: The scrivener can shift 1 square.'
