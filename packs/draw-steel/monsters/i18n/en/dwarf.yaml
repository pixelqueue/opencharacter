abilities.dwarf.dwarf-reel-winch.snaring-crossbow.texts.target: One creature or object
abilities.dwarf.dwarf-reel-winch.snaring-crossbow.texts.distance: Ranged 10
abilities.dwarf.dwarf-reel-winch.snaring-crossbow.texts.roll: Power Roll + 2
abilities.dwarf.dwarf-reel-winch.snaring-crossbow.texts.tier1: 5 damage; M < 0 slowed (save ends)
abilities.dwarf.dwarf-reel-winch.snaring-crossbow.texts.tier2: 7 damage; M < 1 slowed (save ends)
abilities.dwarf.dwarf-reel-winch.snaring-crossbow.texts.tier3: 9 damage; M < 2 slowed (save ends)
abilities.dwarf.dwarf-reel-winch.snaring-crossbow.texts.effect: "Effect: The target is pulled up to
  5 squares. A target restrained by a dwarf can be force moved by this ability. This forced movement
