traits.dwarf.servitor-war-walker.cupola.description: While riding the war walker, three size 1
  allies can occupy the same space. Creatures riding the war walker have cover.
traits.dwarf.servitor-war-walker.mobile-prison-harness.name: Mobile Prison Harness
traits.dwarf.servitor-war-walker.mobile-prison-harness.description: Any restrained or slowed
  creature who comes adjacent to the war walker is automatically restrained (save ends) and takes a
  bane on power rolls. A creature restrained this way moves with the war walker.
monsters.dwarf.servitor-war-walker.name: Servitor War Walker
