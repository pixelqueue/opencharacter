abilities.dwarf.dwarf-stone-whisperer.stone-wave.texts.tier2: 6 damage; push 3; R < 2 slowed (save ends)
abilities.dwarf.dwarf-stone-whisperer.stone-wave.texts.tier3: 9 damage; push 3; R < 3 slowed (save ends)
abilities.dwarf.dwarf-stone-whisperer.stone-wave.texts.effect: "Effect: The area is difficult
