abilities.dwarf.dwarf-reel-winch.reel-them-in.name: Reel Them In
abilities.dwarf.dwarf-reel-winch.reel-them-in.texts.target: Three creatures
abilities.dwarf.dwarf-reel-winch.reel-them-in.texts.distance: Ranged 10
abilities.dwarf.dwarf-reel-winch.reel-them-in.texts.effect: "Effect: The target is pulled up to 8
  squares. A restrained or slowed target can be pulled an additional 2 squares. A target restrained
  by a dwarf can be force moved by this ability. This forced movement doesn't end the restrained
  condition unless the Director determines otherwise."
traits.dwarf.dwarf-reel-winch.we-have-a-quota.name: We Have a Quota!
traits.dwarf.dwarf-reel-winch.we-have-a-quota.description: If a target made slowed by the reel winch
  is already grabbed or slowed, the grabbed and slowed conditions end and the target is restrained
  (save ends).
monsters.dwarf.dwarf-reel-winch.name: Dwarf Reel Winch
