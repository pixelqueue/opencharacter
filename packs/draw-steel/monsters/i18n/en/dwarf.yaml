abilities.dwarf.dwarf-launcher.sleep-grenade.texts.tier3: 8 poison damage; I < 2 dazed (save ends)
abilities.dwarf.dwarf-launcher.sleep-grenade.texts.effect: 'Effect: A target dazed this way treats
  their characteristic scores as 1 lower for the purpose of resisting potencies.'
traits.dwarf.dwarf-launcher.indirect-fire.name: Indirect Fire
traits.dwarf.dwarf-launcher.indirect-fire.description: The launcher ignores concealment and cover,
  and doesn't need line of effect to use their abilities as long as a size 1 opening exists between
  the dwarf and the target.
monsters.dwarf.dwarf-launcher.name: Dwarf Launcher
abilities.dwarf.dwarf-marauder-lord.levitating-axes.name: Levitating Axes
abilities.dwarf.dwarf-marauder-lord.levitating-axes.texts.target: Two creatures or objects
abilities.dwarf.dwarf-marauder-lord.levitating-axes.texts.distance: Melee 1 or ranged 10
abilities.dwarf.dwarf-marauder-lord.levitating-axes.texts.roll: Power Roll + 3
abilities.dwarf.dwarf-marauder-lord.levitating-axes.texts.tier1: 8 damage; slide 1
abilities.dwarf.dwarf-marauder-lord.levitating-axes.texts.tier2: 12 damage; slide 3
abilities.dwarf.dwarf-marauder-lord.levitating-axes.texts.tier3: 15 damage; slide 5
abilities.dwarf.dwarf-marauder-lord.levitating-axes.texts.effect: >-
  Effect: A target restrained by a dwarf can be force moved by this ability. This forced movement
  doesn't end the restrained condition unless the Director determines otherwise.


  3 Malice: A target force moved adjacent to an ally of the marauder lord is restrained until the
  end of their next turn.
abilities.dwarf.dwarf-marauder-lord.magnetomancy.name: Magnetomancy
abilities.dwarf.dwarf-marauder-lord.magnetomancy.texts.target: One creature or object
abilities.dwarf.dwarf-marauder-lord.magnetomancy.texts.distance: Ranged 10
abilities.dwarf.dwarf-marauder-lord.magnetomancy.texts.effect: >-
  Effect: The target vertical slides up to 5 squares. A target restrained by a dwarf can be force
  moved by this ability. This forced movement doesn't end the restrained condition unless the
  Director determines otherwise.


  5 Malice: This ability takes the Area keyword and loses the Ranged keyword, its distance becomes a
  10 burst, and it targets each restrained creature in the area.
abilities.dwarf.dwarf-marauder-lord.your-weapon-is-useless.name: Your Weapon Is Useless
abilities.dwarf.dwarf-marauder-lord.your-weapon-is-useless.texts.trigger: A creature makes a melee strike against the target.
abilities.dwarf.dwarf-marauder-lord.your-weapon-is-useless.texts.target: Self or one ally
abilities.dwarf.dwarf-marauder-lord.your-weapon-is-useless.texts.distance: Ranged 10
abilities.dwarf.dwarf-marauder-lord.your-weapon-is-useless.texts.effect: 'Effect: The target halves any damage from the strike and the triggering creature takes 4 damage.'
traits.dwarf.dwarf-marauder-lord.end-effect.name: End Effect
traits.dwarf.dwarf-marauder-lord.end-effect.description: At the end of each of their turns, the
  marauder lord can take 5 damage to end one effect on them that can be ended by a saving throw.
  This damage can't be reduced in any way.
abilities.dwarf.dwarf-marauder-lord.ajax-will-pay-well-for-these-specimens.name: Ajax Will Pay Well for These Specimens
abilities.dwarf.dwarf-marauder-lord.ajax-will-pay-well-for-these-specimens.texts.target: Each enemy in the area
abilities.dwarf.dwarf-marauder-lord.ajax-will-pay-well-for-these-specimens.texts.distance: 5 cube within 10
abilities.dwarf.dwarf-marauder-lord.ajax-will-pay-well-for-these-specimens.texts.effect:
  'Effect: The marauder lord uses Levitating Axes against each target, making one power roll against
  all targets.'
abilities.dwarf.dwarf-marauder-lord.dont-let-them-escape.name: Don't Let Them Escape!
abilities.dwarf.dwarf-marauder-lord.dont-let-them-escape.texts.target: Each ally in the area
abilities.dwarf.dwarf-marauder-lord.dont-let-them-escape.texts.distance: 5 burst
abilities.dwarf.dwarf-marauder-lord.dont-let-them-escape.texts.effect: 'Effect: Each target shifts up to their speed. The marauder lord then uses Levitating Axes.'
abilities.dwarf.dwarf-marauder-lord.test-your-metal.name: Test Your Metal!
abilities.dwarf.dwarf-marauder-lord.test-your-metal.texts.target: Special
abilities.dwarf.dwarf-marauder-lord.test-your-metal.texts.distance: Ranged 10
abilities.dwarf.dwarf-marauder-lord.test-your-metal.texts.effect: 'Effect: The marauder lord creates
  three size 2 metal objects in unoccupied spaces within distance. Whenever the marauder lord uses
  Magnetomancy, they can additionally target one of these objects.'
monsters.dwarf.dwarf-marauder-lord.name: Dwarf Marauder Lord
