abilities.dwarf.dwarf-gunner.portable-ballista.name: Portable Ballista
abilities.dwarf.dwarf-gunner.portable-ballista.texts.target: One creature or object
abilities.dwarf.dwarf-gunner.portable-ballista.texts.distance: Ranged 10
abilities.dwarf.dwarf-gunner.portable-ballista.texts.roll: Power Roll + 2
abilities.dwarf.dwarf-gunner.portable-ballista.texts.tier1: 6 damage; push 1
abilities.dwarf.dwarf-gunner.portable-ballista.texts.tier2: 9 damage; push 3
abilities.dwarf.dwarf-gunner.portable-ballista.texts.tier3: 12 damage; push 5
abilities.dwarf.dwarf-gunner.portable-ballista.texts.effect: >-
  Effect: If the target is adjacent to an object or a wall after the power roll is resolved, they
  are restrained until the end of their next turn. A target restrained by a dwarf can be force moved
  by this ability. This forced movement doesn't end the restrained condition unless the Director
  determines otherwise.


  5 Malice: If the target is pushed into another creature, the target and the creature are each
  restrained until the end of their next turn.
abilities.dwarf.dwarf-gunner.ensnaring-chains.name: Ensnaring Chains
abilities.dwarf.dwarf-gunner.ensnaring-chains.texts.target: One prone, restrained, or slowed creature
abilities.dwarf.dwarf-gunner.ensnaring-chains.texts.distance: Ranged 10
abilities.dwarf.dwarf-gunner.ensnaring-chains.texts.effect: 'Effect: The gunner makes a free strike
  against the target, and the prone, restrained, and slowed conditions on the target end. The target
