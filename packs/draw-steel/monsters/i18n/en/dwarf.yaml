malice.dwarf.breaching-charge.name: Breaching Charge
malice.dwarf.breaching-charge.description: A dwarf can destroy one adjacent object or square of wall
  for each 3 Malice spent. Each enemy adjacent to the destroyed object or square takes the object's
  Stamina in damage (3 for wood, 6 for stone, or 9 for metal).
malice.dwarf.rappelling-barrage.name: Rappelling Barrage
malice.dwarf.rappelling-barrage.description: Each dwarf acting this turn can automatically climb at
  full speed while moving. At any point during this movement, they can make a free strike.
malice.dwarf.snaring-line.name: Snaring Line
malice.dwarf.snaring-line.description: >-
  | Area, Magic, Ranged      |               Main action |


  |------------------------------|------------------------------:|


  | 📏 10 × 1 line within 10 | 🎯 Each enemy in the area |


  Effect: Each target makes an Agility test.


  The snaring line remains until the end of the encounter. Any enemy who moves into the area for the
  first time in a round or starts their turn there must make the test.


  Special: This ability can't be used by a minion.
malice.dwarf.snaring-line.texts.tier1: 8 damage; restrained (EoT)
malice.dwarf.snaring-line.texts.tier2: 6 damage; slowed (EoT)
malice.dwarf.snaring-line.texts.tier3: No effect.
