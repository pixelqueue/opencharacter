malice.count-rhodar-von-glauer.slip.name: Slip
malice.count-rhodar-von-glauer.slip.description: During this turn, Rhodar can move through creatures
  and objects at his usual speed, but can't end his turn inside a creature or object. Additionally,
  he doesn't take damage from being force moved.
malice.count-rhodar-von-glauer.solo-action.name: Solo Action
malice.count-rhodar-von-glauer.solo-action.description: Rhodar takes an additional main action on his turn. He can use this feature even if he is dazed.
malice.count-rhodar-von-glauer.suffocating-dark.name: Suffocating Dark
malice.count-rhodar-von-glauer.suffocating-dark.description: Rhodar throws one of his spears into an
  unoccupied space within 10 squares, or chooses one of his spears that he has already thrown. Until
  that spear returns to him or he uses this feature again, the spear emanates magical darkness in a
  5 aura. Rhodar can see through this darkness, and any enemy is suffocating while in the darkness.
malice.count-rhodar-von-glauer.the-mirror-lies.name: The Mirror Lies
malice.count-rhodar-von-glauer.the-mirror-lies.description: Rhodar chooses two creatures or objects
  within 20 squares of him. The targets immediately teleport to swap places. Any enemy teleported by
  this feature who has I < 5 is dazed until the end of their next turn.
traits.count-rhodar-von-glauer.count-rhodar-von-glauer.solo-monster.name: Solo Monster
traits.count-rhodar-von-glauer.count-rhodar-von-glauer.solo-monster.description: >-
  End Effect: At the end of each of his turns, Rhodar can take 20 damage to end one effect on him
  that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: Rhodar can take two turns each round. He can't take turns consecutively.
traits.count-rhodar-von-glauer.count-rhodar-von-glauer.grave-ward.name: Grave Ward
traits.count-rhodar-von-glauer.count-rhodar-von-glauer.grave-ward.description: Rhodar has damage
  immunity 5. If he takes holy damage, he loses this immunity until the end of the round.
traits.count-rhodar-von-glauer.count-rhodar-von-glauer.thin-the-blood.name: Thin the Blood
traits.count-rhodar-von-glauer.count-rhodar-von-glauer.thin-the-blood.description: Each enemy within 10 squares of Rhodar takes a -2 penalty to saving throws.
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.spear-of-the-damned.name: Spear of the Damned
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.spear-of-the-damned.texts.target: Three creatures or objects
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.spear-of-the-damned.texts.distance: Melee 2 or ranged 15
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.spear-of-the-damned.texts.roll: Power Roll + 5
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.spear-of-the-damned.texts.tier1: 13 damage; A < 4 restrained (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.spear-of-the-damned.texts.tier2: 18 damage; A < 5 restrained (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.spear-of-the-damned.texts.tier3: 21 damage; A < 6 restrained (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.spear-of-the-damned.texts.effect:
  'Effect: A target restrained this way is impaled by a spear. Rhodar has four spears, each of which
  can be used to impale a target. At the start of each of his turns, Rhodar can summon any of his
  spears back to himself, ending the restrained condition on an impaled target.'
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.disarming-glare.name: Disarming Glare
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.disarming-glare.texts.target: Each enemy in the area
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.disarming-glare.texts.distance: 5 burst
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.disarming-glare.texts.roll: Intuition test
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.disarming-glare.texts.tier1: 16 corruption damage; frightened (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.disarming-glare.texts.tier2: 13 corruption damage; frightened (EoT)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.disarming-glare.texts.tier3: 8 corruption damage
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.disarming-glare.texts.effect: >-
  Effect: Each target makes an Intuition test.


  While a target is frightened this way, Rhodar ignores banes and double banes on abilities used
  against them.
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vermilion-fangs.name: Vermilion Fangs
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vermilion-fangs.texts.target: One creature
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vermilion-fangs.texts.distance: Melee 1
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vermilion-fangs.texts.roll: Power Roll + 5
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vermilion-fangs.texts.tier1: 17 corruption damage; M < 4 bleeding (save ends) and prone
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vermilion-fangs.texts.tier2: 24 corruption damage; prone; M < 5 bleeding (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vermilion-fangs.texts.tier3: 30 corruption damage; prone; M < 6 the target is bleeding until the end of the encounter
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vermilion-fangs.texts.effect: 'Effect: Rhodar regains Stamina equal to half the damage dealt.'
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguineous-flourish.name: Sanguineous Flourish
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguineous-flourish.texts.target: Each enemy in the area
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguineous-flourish.texts.distance: 2 burst
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguineous-flourish.texts.roll: Power Roll + 5
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguineous-flourish.texts.tier1: 6 damage, 2 corruption damage; push 2; M < 4 bleeding (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguineous-flourish.texts.tier2: 6 damage, 7 corruption damage; push 5; M < 5 bleeding (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguineous-flourish.texts.tier3: 6 damage, 10 corruption damage; push 7; M < 6 bleeding (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguineous-flourish.texts.effect:
  'Effect: Rhodar shifts up to his speed before or after using this ability. He regains Stamina
  equal to half the total corruption damage dealt.'
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vengeance-of-rhol.name: Vengeance of Rhöl
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vengeance-of-rhol.texts.target: Special
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vengeance-of-rhol.texts.distance: Two 3 cubes within 5
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.vengeance-of-rhol.texts.effect:
  'Effect: Each area is saturated with vengeful spirits until the end of the round. Any enemy who
  enters the area for the first time in a round or starts their turn there takes 5 corruption
  damage. At the end of the round, the spirits violently disperse. Each enemy within 2 squares of an
  area and has P < 5 is weakened (save ends).'
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.reactive-rebuke.name: Reactive Rebuke
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.reactive-rebuke.texts.trigger: A creature within distance makes a strike against Rhodar.
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.reactive-rebuke.texts.target: The triggering creature
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.reactive-rebuke.texts.distance: Ranged 10
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.reactive-rebuke.texts.effect:
  'Effect: A target who has I < 5 is frightened. This effect ends if the target is 11 or more
  squares from Rhodar.'
traits.count-rhodar-von-glauer.count-rhodar-von-glauer.lords-bloodthirst.name: Lord's Bloodthirst
traits.count-rhodar-von-glauer.count-rhodar-von-glauer.lords-bloodthirst.description:
  Rhodar has speed 15 and an edge on power rolls while any creature within 20 squares of him is
  bleeding. Any bleeding creature within 10 squares of Rhodar can't hide.
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.red-tide.name: Red Tide
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.red-tide.texts.target: Each enemy in the area
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.red-tide.texts.distance: 8 cube within 15
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.red-tide.texts.roll: Power Roll + 5
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.red-tide.texts.tier1: 8 corruption damage; A < 4 the target is blood soaked (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.red-tide.texts.tier2: 13 corruption damage; A < 5 the target is blood soaked (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.red-tide.texts.tier3: 16 corruption damage; A < 6 the target is blood soaked until the end of the encounter
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.red-tide.texts.effect:
  'Effect: While a creature is blood soaked, Rhodar has a double edge on abilities used against
  them.'
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguine-mist.name: Sanguine Mist
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguine-mist.texts.target: Each enemy in the area
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguine-mist.texts.distance: 5 burst
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguine-mist.texts.roll: Presence test
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguine-mist.texts.tier1: 16 corruption damage; the target is bleeding until the end of the encounter
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguine-mist.texts.tier2: 13 corruption damage; bleeding (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguine-mist.texts.tier3: 8 corruption damage
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.sanguine-mist.texts.effect: >-
  Effect: Each target makes a Presence test.


  Effect: Rhodar teleports to an unoccupied space in the area. If he has lost the damage immunity
  from his Grave Ward trait, he regains it.
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.fires-of-dracul.name: Fires of Dracul
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.fires-of-dracul.texts.target: Each enemy in the area
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.fires-of-dracul.texts.distance: 15 × 3 line within 1
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.fires-of-dracul.texts.roll: Power Roll + 5
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.fires-of-dracul.texts.tier1: 10 fire damage; R < 4 weakened (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.fires-of-dracul.texts.tier2: 16 fire damage; R < 5 weakened (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.fires-of-dracul.texts.tier3: 20 fire damage; R < 6 weakened (save ends)
abilities.count-rhodar-von-glauer.count-rhodar-von-glauer.fires-of-dracul.texts.effect:
  'Effect: Rhodar teleports to an unoccupied space adjacent to one target after the ability
  resolves.'
monsters.count-rhodar-von-glauer.count-rhodar-von-glauer.name: Count Rhodar von Glauer
effects.count-rhodar-von-glauer.blood-soaked.name: Blood soaked
effects.count-rhodar-von-glauer.blood-soaked.description: While a creature is blood soaked, Rhodar has a double edge on abilities used against them.
effects.count-rhodar-von-glauer.disarmed.name: Frightened (Disarming Glare)
effects.count-rhodar-von-glauer.disarmed.description: The target is frightened. While a target is frightened this way, Rhodar ignores banes and double banes on abilities used against them.
