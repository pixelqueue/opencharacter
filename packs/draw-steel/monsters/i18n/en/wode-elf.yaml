abilities.wode-elf.wodenelg.where-i-end-the-woods-begin.name: Where I End the Woods Begin
abilities.wode-elf.wodenelg.where-i-end-the-woods-begin.texts.target: Self
abilities.wode-elf.wodenelg.where-i-end-the-woods-begin.texts.distance: Self
abilities.wode-elf.wodenelg.where-i-end-the-woods-begin.texts.effect: "Effect: The wodenelg and
  their rider become invisible until the start of the wodenelg's next turn."
traits.wode-elf.wodenelg.mounted-stability.name: Mounted Stability
traits.wode-elf.wodenelg.mounted-stability.description: The wodenelg's rider has damage immunity 2.
traits.wode-elf.wodenelg.shared-glamor.name: Shared Glamor
traits.wode-elf.wodenelg.shared-glamor.description: If the wodenelg's rider has the Masking Glamor trait, the wodenelg also has that trait.
monsters.wode-elf.wodenelg.name: Wodenelg
malice.wode-elf.forest-network.name: Forest Network
malice.wode-elf.forest-network.description: Each wode elf who ends this turn hidden can shift up to their speed while remaining hidden.
malice.wode-elf.punishing-regrowth.name: Punishing Regrowth
malice.wode-elf.punishing-regrowth.description: Until the end of the round, each wode elf gains an
  edge on abilities, and their strikes can slide a target up to 2 squares in addition to their usual
  effects. If a strike already imposes forced movement, this slide happens after that forced
  movement. A creature force moved by a wode elf's strike who ends this forced movement in difficult
  terrain is restrained until the end of their next turn.
malice.wode-elf.vines-everywhere.name: Vines Everywhere
malice.wode-elf.vines-everywhere.description: Vines rapidly grow across the entire encounter map.
  Each enemy in the encounter makes an Agility test.
malice.wode-elf.vines-everywhere.texts.tier1: 8 damage; restrained (save ends)
malice.wode-elf.vines-everywhere.texts.tier2: Restrained (EoT)
malice.wode-elf.vines-everywhere.texts.tier3: No effect.
effects.wode-elf.marked.name: Marked
effects.wode-elf.marked.description: Allies gain an edge on abilities against a target marked by any wode elf.
effects.wode-elf.slowed-marked.name: Slowed and marked
effects.wode-elf.slowed-marked.description: >-
  The creature is slowed and marked. Allies gain an edge on abilities against a target marked by any
  wode elf.
effects.wode-elf.entangled.name: Entangled
effects.wode-elf.entangled.description: The creature is slowed and can't search for hidden creatures.
effects.wode-elf.embraced.name: Embraced by the forest
effects.wode-elf.embraced.description: The creature is restrained and can't search for hidden creatures.
