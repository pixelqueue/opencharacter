abilities.wyvern.wyvern-lurker.agonizing-stinger.name: Agonizing Stinger
abilities.wyvern.wyvern-lurker.agonizing-stinger.texts.target: Two creatures or objects
abilities.wyvern.wyvern-lurker.agonizing-stinger.texts.distance: Melee 2
abilities.wyvern.wyvern-lurker.agonizing-stinger.texts.roll: Power Roll + 3
abilities.wyvern.wyvern-lurker.agonizing-stinger.texts.tier1: 9 damage
abilities.wyvern.wyvern-lurker.agonizing-stinger.texts.tier2: 14 damage; M < 2 bleeding (save ends)
abilities.wyvern.wyvern-lurker.agonizing-stinger.texts.tier3: 17 damage; M < 3 bleeding (save ends)
abilities.wyvern.wyvern-lurker.agonizing-stinger.texts.effect: '1 Malice: One target hidden from the lurker takes an extra 6 acid damage.'
abilities.wyvern.wyvern-lurker.acidic-anguish.name: Acidic Anguish
abilities.wyvern.wyvern-lurker.acidic-anguish.texts.target: One creature or object
abilities.wyvern.wyvern-lurker.acidic-anguish.texts.distance: Melee 2
abilities.wyvern.wyvern-lurker.acidic-anguish.texts.roll: Power Roll + 3
abilities.wyvern.wyvern-lurker.acidic-anguish.texts.tier1: 10 acid damage; M < 1 weakened (save ends)
abilities.wyvern.wyvern-lurker.acidic-anguish.texts.tier2: 16 acid damage; M < 2 weakened (save ends)
abilities.wyvern.wyvern-lurker.acidic-anguish.texts.tier3: 20 acid damage; M < 3 weakened (save ends)
abilities.wyvern.wyvern-lurker.acidic-anguish.texts.effect: 'Effect: A target weakened this way takes 1d4 acid damage at the start of each of their turns.'
abilities.wyvern.wyvern-lurker.swooping-torment.name: Swooping Torment
abilities.wyvern.wyvern-lurker.swooping-torment.texts.target: Self
abilities.wyvern.wyvern-lurker.swooping-torment.texts.distance: Self
abilities.wyvern.wyvern-lurker.swooping-torment.texts.effect: 'Effect: The lurker flies up to their
  speed, then can attempt to hide. Each enemy the lurker moves adjacent to during this movement can
  choose to take 3 sonic damage or fall prone.'
abilities.wyvern.wyvern-lurker.retaliatory-dive.name: Retaliatory Dive
abilities.wyvern.wyvern-lurker.retaliatory-dive.texts.trigger: A creature within distance deals damage to the lurker with a ranged ability.
abilities.wyvern.wyvern-lurker.retaliatory-dive.texts.target: The triggering creature
abilities.wyvern.wyvern-lurker.retaliatory-dive.texts.distance: Ranged 5
abilities.wyvern.wyvern-lurker.retaliatory-dive.texts.effect: 'Effect: The lurker flies adjacent to the target and can make a free strike against them.'
traits.wyvern.wyvern-lurker.ruthless-rage.name: Ruthless Rage
traits.wyvern.wyvern-lurker.ruthless-rage.description: While within 10 squares of another wyvern, the lurker deals an extra 3 damage with strikes.
traits.wyvern.wyvern-lurker.tenacious-hunter.name: Tenacious Hunter
traits.wyvern.wyvern-lurker.tenacious-hunter.description: Any creature affected by a condition imposed by a wyvern can't be hidden from the lurker.
monsters.wyvern.wyvern-lurker.name: Wyvern Lurker
abilities.wyvern.wyvern-predator.sedating-stinger.name: Sedating Stinger
abilities.wyvern.wyvern-predator.sedating-stinger.texts.target: Two creatures or objects
abilities.wyvern.wyvern-predator.sedating-stinger.texts.distance: Melee 3
abilities.wyvern.wyvern-predator.sedating-stinger.texts.roll: Power Roll + 3
abilities.wyvern.wyvern-predator.sedating-stinger.texts.tier1: 9 damage
abilities.wyvern.wyvern-predator.sedating-stinger.texts.tier2: 14 damage; M < 2 slowed (save ends)
abilities.wyvern.wyvern-predator.sedating-stinger.texts.tier3: 17 damage; M < 3 slowed (save ends)
abilities.wyvern.wyvern-predator.sedating-stinger.texts.effect: 'Effect: If a target slowed this way is already slowed, they are instead restrained (save ends).'
abilities.wyvern.wyvern-predator.tail-sweep.name: Tail Sweep
abilities.wyvern.wyvern-predator.tail-sweep.texts.target: Each enemy and object in the area
abilities.wyvern.wyvern-predator.tail-sweep.texts.distance: 6 × 3 line within 1
abilities.wyvern.wyvern-predator.tail-sweep.texts.roll: Power Roll + 3
abilities.wyvern.wyvern-predator.tail-sweep.texts.tier1: 6 damage; A < 1 3 acid damage
abilities.wyvern.wyvern-predator.tail-sweep.texts.tier2: 11 damage; A < 2 3 acid damage
abilities.wyvern.wyvern-predator.tail-sweep.texts.tier3: 14 damage; A < 3 3 acid damage
abilities.wyvern.wyvern-predator.tail-sweep.texts.effect: '5 Malice: The predator uses this ability
  a second time, either recreating the same line or creating a new line.'
abilities.wyvern.wyvern-predator.grasping-jaws.name: Grasping Jaws
abilities.wyvern.wyvern-predator.grasping-jaws.texts.target: One creature or object
abilities.wyvern.wyvern-predator.grasping-jaws.texts.distance: Melee 2
abilities.wyvern.wyvern-predator.grasping-jaws.texts.roll: Power Roll + 3
abilities.wyvern.wyvern-predator.grasping-jaws.texts.tier1: 9 damage; A < 1 grabbed
abilities.wyvern.wyvern-predator.grasping-jaws.texts.tier2: 14 damage; A < 2 grabbed
abilities.wyvern.wyvern-predator.grasping-jaws.texts.tier3: 17 damage; A < 3 grabbed and the target takes a bane on the Escape Grab maneuver
abilities.wyvern.wyvern-predator.deterring-sting.name: Deterring Sting
abilities.wyvern.wyvern-predator.deterring-sting.texts.trigger: A creature within distance deals damage to the predator with a melee ability.
abilities.wyvern.wyvern-predator.deterring-sting.texts.target: The triggering creature
abilities.wyvern.wyvern-predator.deterring-sting.texts.distance: Melee 3
abilities.wyvern.wyvern-predator.deterring-sting.texts.effect: 'Effect: The predator uses Sedating Stinger against the target, then shifts up to 3 squares.'
traits.wyvern.wyvern-predator.stubborn-rage.name: Stubborn Rage
traits.wyvern.wyvern-predator.stubborn-rage.description: While winded or within 10 squares of
  another wyvern, the predator can't be made dazed or frightened.
traits.wyvern.wyvern-predator.tenacious-hunter.name: Tenacious Hunter
traits.wyvern.wyvern-predator.tenacious-hunter.description: Any creature affected by a condition imposed by a wyvern can't be hidden from the predator.
monsters.wyvern.wyvern-predator.name: Wyvern Predator
malice.wyvern.simmering-anger.name: Simmering Anger
malice.wyvern.simmering-anger.description: One wyvern in the encounter can make a free strike against each enemy adjacent to them.
malice.wyvern.boiling-fury.name: Boiling Fury
malice.wyvern.boiling-fury.description: Until the end of the round, each wyvern in the encounter has
  a double edge on strikes and can use their signature ability instead of a free strike when making
  opportunity attacks.
malice.wyvern.overflowing-rage.name: Overflowing Rage
malice.wyvern.overflowing-rage.description: Every wyvern's anger fills the encounter map with a
  thick miasma of hatred. Each enemy in the encounter makes an Intuition test.
malice.wyvern.overflowing-rage.texts.tier1: The target is taunted by the nearest creature or object
  (save ends). While the target is taunted this way, power rolls against them have a double edge.
malice.wyvern.overflowing-rage.texts.tier2: The target is taunted by the nearest creature or object (save ends).
malice.wyvern.overflowing-rage.texts.tier3: No effect.
effects.wyvern.acidic-anguish.name: Acidic anguish
effects.wyvern.acidic-anguish.description: A target weakened this way takes 1d4 acid damage at the start of each of their turns.
