malice.goblin.goblin-mode.name: Goblin Mode
malice.goblin.goblin-mode.description: Each goblin in the encounter gains a +2 bonus to speed until the end of the round.
malice.goblin.tiny-stabs.name: Tiny Stabs
malice.goblin.tiny-stabs.description: Each enemy in the encounter takes 1 damage for each goblin adjacent to them.
malice.goblin.swamp-stink.name: Swamp Stink
malice.goblin.swamp-stink.description: The encounter map is covered in a green mist that lasts until
  the end of the round, and which can't be dispersed by wind. All areas of the map are difficult
  terrain for non-goblins, and each non-goblin on the map makes a Might test.
malice.goblin.swamp-stink.texts.tier1: 5 poison damage; the creature is weakened until the mist disappears.
malice.goblin.swamp-stink.texts.tier2: The creature is weakened until the mist disappears.
malice.goblin.swamp-stink.texts.tier3: No effect.
