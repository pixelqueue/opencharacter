malice.minotaur.bull-rush.name: Bull Rush
malice.minotaur.bull-rush.description: For each 3 Malice spent, one minotaur acting this turn gains
  a +4 bonus to speed and ignores difficult terrain until the start of their next turn.
malice.minotaur.cut-the-nonsense.name: Cut the … Nonsense!
malice.minotaur.cut-the-nonsense.description: One minotaur acting this turn halves any damage they
  take, and can use the Knockback maneuver as a free triggered action whenever an enemy comes
  adjacent to them, all until the start of their next turn.
malice.minotaur.bullseye.name: Bullseye
malice.minotaur.bullseye.description: All minotaurs in the encounter fill the area around them with
  psychic impressions of feeling lost and isolated. Each enemy within 5 squares of a minotaur is
  teleported up to 5 squares and makes an Intuition test.
malice.minotaur.bullseye.texts.tier1: The target has line of effect only within 3 squares and is frightened of all minotaurs (save ends).
malice.minotaur.bullseye.texts.tier2: The target has line of effect only within 3 squares (EoT).
malice.minotaur.bullseye.texts.tier3: No effect.
monsters.minotaur.minotaur-bully.texts.withCaptain: +3 damage bonus to strikes
abilities.minotaur.minotaur-bully.javelin-and-bellow.name: Javelin and Bellow
abilities.minotaur.minotaur-bully.javelin-and-bellow.texts.target: One creature or object per minion
abilities.minotaur.minotaur-bully.javelin-and-bellow.texts.distance: Melee 2 or ranged 5
abilities.minotaur.minotaur-bully.javelin-and-bellow.texts.roll: Power Roll + 4
abilities.minotaur.minotaur-bully.javelin-and-bellow.texts.tier1: 4 damage
abilities.minotaur.minotaur-bully.javelin-and-bellow.texts.tier2: 7 damage
abilities.minotaur.minotaur-bully.javelin-and-bellow.texts.tier3: 9 damage; I < 4 taunted (EoT) or frightened of all minotaurs (save ends)
traits.minotaur.minotaur-bully.minotaur-sense.name: Minotaur Sense
traits.minotaur.minotaur-bully.minotaur-sense.description: The bully can't obtain less than a tier 2 outcome when making tests to navigate, search, or seek.
monsters.minotaur.minotaur-bully.name: Minotaur Bully
monsters.minotaur.minotaur-lackey.texts.withCaptain: +2 bonus to speed
abilities.minotaur.minotaur-lackey.horn-vault.name: Horn Vault
abilities.minotaur.minotaur-lackey.horn-vault.texts.target: One creature or object per minion
abilities.minotaur.minotaur-lackey.horn-vault.texts.distance: Melee 2
abilities.minotaur.minotaur-lackey.horn-vault.texts.roll: Power Roll + 4
abilities.minotaur.minotaur-lackey.horn-vault.texts.tier1: 3 damage
abilities.minotaur.minotaur-lackey.horn-vault.texts.tier2: 6 damage; slide 1
abilities.minotaur.minotaur-lackey.horn-vault.texts.tier3: 8 damage; slide 3
abilities.minotaur.minotaur-lackey.horn-vault.texts.effect: 'Effect: A target who is force moved into an obstacle and has M < 3 is bleeding (save ends).'
traits.minotaur.minotaur-lackey.minotaur-sense.name: Minotaur Sense
traits.minotaur.minotaur-lackey.minotaur-sense.description: The lackey can't obtain less than a tier 2 outcome when making tests to navigate, search, or seek.
monsters.minotaur.minotaur-lackey.name: Minotaur Lackey
monsters.minotaur.minotaur-stampede.texts.withCaptain: Gain an edge on strikes
abilities.minotaur.minotaur-stampede.bull-rush.name: Bull Rush
abilities.minotaur.minotaur-stampede.bull-rush.texts.target: One creature or object per minion
abilities.minotaur.minotaur-stampede.bull-rush.texts.distance: Melee 2
abilities.minotaur.minotaur-stampede.bull-rush.texts.roll: Power Roll + 5
abilities.minotaur.minotaur-stampede.bull-rush.texts.tier1: 4 damage
abilities.minotaur.minotaur-stampede.bull-rush.texts.tier2: 7 damage; prone
abilities.minotaur.minotaur-stampede.bull-rush.texts.tier3: 9 damage; prone; M < 5 can't stand (save ends)
abilities.minotaur.minotaur-stampede.bull-rush.texts.effect: 'Effect: If this ability is used as
  part of the Charge main action, each creature the stampede moves through who has M < 4 is knocked
  prone.'
traits.minotaur.minotaur-stampede.swarm.name: Swarm
traits.minotaur.minotaur-stampede.swarm.description: The stampede can move through spaces as if they
  were a size 2 creature, and can occupy other creatures' spaces. At the start of each of the
  stampede's turns, they can make a free strike against each creature whose space they share.
monsters.minotaur.minotaur-stampede.name: Minotaur Stampede
abilities.minotaur.minotaur-sunderer.spiked-maul.name: Spiked Maul
abilities.minotaur.minotaur-sunderer.spiked-maul.texts.target: Two creatures or objects
abilities.minotaur.minotaur-sunderer.spiked-maul.texts.distance: Melee 2
abilities.minotaur.minotaur-sunderer.spiked-maul.texts.roll: Power Roll + 2
abilities.minotaur.minotaur-sunderer.spiked-maul.texts.tier1: 8 damage; pull 1
abilities.minotaur.minotaur-sunderer.spiked-maul.texts.tier2: 12 damage; pull 2
abilities.minotaur.minotaur-sunderer.spiked-maul.texts.tier3: 15 damage; pull 3
abilities.minotaur.minotaur-sunderer.spiked-maul.texts.effect: 'Effect: A target pulled adjacent to the sunderer is automatically grabbed.'
abilities.minotaur.minotaur-sunderer.fearsome-bay.name: Fearsome Bay
abilities.minotaur.minotaur-sunderer.fearsome-bay.texts.target: Each enemy in the area
abilities.minotaur.minotaur-sunderer.fearsome-bay.texts.distance: 3 burst
abilities.minotaur.minotaur-sunderer.fearsome-bay.texts.roll: Power Roll + 2
abilities.minotaur.minotaur-sunderer.fearsome-bay.texts.tier1: I < 0 frightened (save ends)
abilities.minotaur.minotaur-sunderer.fearsome-bay.texts.tier2: I < 1 frightened (save ends)
abilities.minotaur.minotaur-sunderer.fearsome-bay.texts.tier3: I < 2 frightened (save ends)
abilities.minotaur.minotaur-sunderer.fearsome-bay.texts.effect: 'Effect: Until the end of their next
  turn, the minotaur has damage immunity 2 and deals an extra 5 damage with strikes.'
abilities.minotaur.minotaur-sunderer.disemboweling-horns.name: Disemboweling Horns
abilities.minotaur.minotaur-sunderer.disemboweling-horns.texts.target: One creature
abilities.minotaur.minotaur-sunderer.disemboweling-horns.texts.distance: Melee 2
abilities.minotaur.minotaur-sunderer.disemboweling-horns.texts.roll: Power Roll + 2
abilities.minotaur.minotaur-sunderer.disemboweling-horns.texts.tier1: 5 damage; M < 0 bleeding (save ends)
abilities.minotaur.minotaur-sunderer.disemboweling-horns.texts.tier2: 8 damage; M < 1 bleeding (save ends)
abilities.minotaur.minotaur-sunderer.disemboweling-horns.texts.tier3: 9 damage; M < 2 bleeding (save ends)
abilities.minotaur.minotaur-sunderer.disemboweling-horns.texts.effect: |-
  Special: The target must be grabbed by the sunderer.

  Effect: While bleeding this way, the target takes 1d6 damage at the start of each of their turns.
abilities.minotaur.minotaur-sunderer.retaliatory-strike.name: Retaliatory Strike
abilities.minotaur.minotaur-sunderer.retaliatory-strike.texts.trigger: A creature within distance deals damage to the sunderer.
abilities.minotaur.minotaur-sunderer.retaliatory-strike.texts.target: The triggering creature
abilities.minotaur.minotaur-sunderer.retaliatory-strike.texts.distance: Ranged 6
abilities.minotaur.minotaur-sunderer.retaliatory-strike.texts.effect: 'Effect: The sunderer uses the Charge main action and Spiked Maul against the target.'
traits.minotaur.minotaur-sunderer.minotaur-sense.name: Minotaur Sense
traits.minotaur.minotaur-sunderer.minotaur-sense.description: The sunderer can't obtain less than a
  tier 2 outcome when making tests to navigate, search, or seek.
monsters.minotaur.minotaur-sunderer.name: Minotaur Sunderer
abilities.minotaur.minotaur.flail-and-blade.name: Flail and Blade
abilities.minotaur.minotaur.flail-and-blade.texts.target: Two creatures or objects
abilities.minotaur.minotaur.flail-and-blade.texts.distance: Melee 2
abilities.minotaur.minotaur.flail-and-blade.texts.roll: Power Roll + 2
abilities.minotaur.minotaur.flail-and-blade.texts.tier1: 7 damage; push 1
abilities.minotaur.minotaur.flail-and-blade.texts.tier2: 11 damage; push 2
abilities.minotaur.minotaur.flail-and-blade.texts.tier3: 14 damage; push 3
abilities.minotaur.minotaur.flail-and-blade.texts.effect: 'Effect: The minotaur shifts up to 3 squares.'
abilities.minotaur.minotaur.primal-bay.name: Primal Bay
abilities.minotaur.minotaur.primal-bay.texts.target: Self
abilities.minotaur.minotaur.primal-bay.texts.distance: Self
abilities.minotaur.minotaur.primal-bay.texts.effect: 'Effect: Until the end of their next turn, the
  minotaur has damage immunity 2 and deals an extra 5 damage with strikes. On their next turn, the
  minotaur can use one additional maneuver.'
abilities.minotaur.minotaur.goring-horns.name: Goring Horns
abilities.minotaur.minotaur.goring-horns.texts.target: One creature or object
abilities.minotaur.minotaur.goring-horns.texts.distance: Melee 2
abilities.minotaur.minotaur.goring-horns.texts.roll: Power Roll + 2
abilities.minotaur.minotaur.goring-horns.texts.tier1: 5 damage; I < 0 dazed (save ends)
abilities.minotaur.minotaur.goring-horns.texts.tier2: 8 damage; I < 1 dazed (save ends)
abilities.minotaur.minotaur.goring-horns.texts.tier3: 9 damage; I < 2 dazed (save ends)
abilities.minotaur.minotaur.goring-horns.texts.effect: 'Effect: If this ability is used as part of the Charge main action, its potency increases by 1.'
abilities.minotaur.minotaur.retaliatory-strike.name: Retaliatory Strike
abilities.minotaur.minotaur.retaliatory-strike.texts.trigger: A creature within distance deals damage to the minotaur.
abilities.minotaur.minotaur.retaliatory-strike.texts.target: The triggering creature
abilities.minotaur.minotaur.retaliatory-strike.texts.distance: Ranged 8
abilities.minotaur.minotaur.retaliatory-strike.texts.effect: 'Effect: The minotaur uses the Charge
  main action and either Flail and Blade or Goring Horns against the target.'
traits.minotaur.minotaur.minotaur-sense.name: Minotaur Sense
traits.minotaur.minotaur.minotaur-sense.description: The minotaur can't obtain less than a tier 2
  outcome when making tests to navigate, search, or seek.
monsters.minotaur.minotaur.name: Minotaur
effects.minotaur.bay.name: Bay
effects.minotaur.bay.description: The minotaur has damage immunity 2 and deals an extra 5 damage with strikes.
effects.minotaur.disemboweled.name: Disemboweled
effects.minotaur.disemboweled.description: While bleeding this way, the target takes 1d6 damage at the start of each of their turns.
