malice.draconian.guarding-gale.name: Guarding Gale
malice.draconian.guarding-gale.description: A draconian acting this turn flaps their wings and
  creates a mighty gale. Each creature adjacent to the draconian is pushed up to 4 squares, and if
  they have M < 2, they are knocked prone.
malice.draconian.breath-weapon.name: Breath Weapon
malice.draconian.breath-weapon.description: >-
  Special: The damage dealt by this ability matches a damage type the draconian has immunity to.
malice.draconian.breath-weapon.texts.tier1: 6 damage
malice.draconian.breath-weapon.texts.tier2: 10 damage
malice.draconian.breath-weapon.texts.tier3: 13 damage
malice.draconian.scaleshatter-burst.name: Scaleshatter Burst
malice.draconian.scaleshatter-burst.description: >-
  | Area, Magic |             Free maneuver |


  |-----------------|------------------------------:|


  | 📏 2 burst  | 🎯 Each enemy in the area |


  Power Roll + 3:


  Effect: The draconian's scales shatter from battle damage. The draconian has damage weakness 5 but
  can take two turns per round until the end of the encounter.
malice.draconian.scaleshatter-burst.texts.tier1: 7 damage
malice.draconian.scaleshatter-burst.texts.tier2: 13 damage
malice.draconian.scaleshatter-burst.texts.tier3: 16 damage
abilities.draconian.aeolyxria-the-uncanny.spittlesplash.name: Spittlesplash
abilities.draconian.aeolyxria-the-uncanny.spittlesplash.texts.target: Two enemies
abilities.draconian.aeolyxria-the-uncanny.spittlesplash.texts.distance: Ranged 10
abilities.draconian.aeolyxria-the-uncanny.spittlesplash.texts.roll: Power Roll + 3
abilities.draconian.aeolyxria-the-uncanny.spittlesplash.texts.tier1: 10 poison damage; M < 1 slowed (save ends)
abilities.draconian.aeolyxria-the-uncanny.spittlesplash.texts.tier2: 15 poison damage; M < 2 slowed (save ends)
abilities.draconian.aeolyxria-the-uncanny.spittlesplash.texts.tier3: 18 poison damage; M < 3 slowed (save ends)
abilities.draconian.aeolyxria-the-uncanny.experimental-treasure.name: Experimental Treasure
abilities.draconian.aeolyxria-the-uncanny.experimental-treasure.texts.target: Two creature or objects
abilities.draconian.aeolyxria-the-uncanny.experimental-treasure.texts.distance: Ranged 10
abilities.draconian.aeolyxria-the-uncanny.experimental-treasure.texts.roll: Power Roll + 3
abilities.draconian.aeolyxria-the-uncanny.experimental-treasure.texts.tier1: The target regains 10 Stamina.
abilities.draconian.aeolyxria-the-uncanny.experimental-treasure.texts.tier2: 12 corruption damage; A < 2 weakened (save ends)
abilities.draconian.aeolyxria-the-uncanny.experimental-treasure.texts.tier3: 12 lightning damage; A < 2 bleeding (save ends)
abilities.draconian.aeolyxria-the-uncanny.experimental-treasure.texts.effect: >-
  Effect: The first time in an encounter that Aeolyxria makes a power roll for this ability, she can
  subsequently use the outcome of that roll instead of rolling whenever she uses this ability until
  the end of the encounter.


  2+ Malice: The ability targets one additional target for each 2 Malice spent.
abilities.draconian.aeolyxria-the-uncanny.elevate.name: Elevate
abilities.draconian.aeolyxria-the-uncanny.elevate.texts.target: Special
abilities.draconian.aeolyxria-the-uncanny.elevate.texts.distance: 1 cube within 5
abilities.draconian.aeolyxria-the-uncanny.elevate.texts.effect: >-
  Effect: The ground in the area rises 5 squares, creating a pillar of dirt. Any creature in the
  area moves with the ground to its new elevation.


  1+ Malice: Aeolyxria creates an additional pillar for each Malice spent.
abilities.draconian.aeolyxria-the-uncanny.blood-for-blood.name: Blood For Blood
abilities.draconian.aeolyxria-the-uncanny.blood-for-blood.texts.trigger: An ally is made bleeding by the target.
abilities.draconian.aeolyxria-the-uncanny.blood-for-blood.texts.target: One creature
abilities.draconian.aeolyxria-the-uncanny.blood-for-blood.texts.distance: Ranged 5
abilities.draconian.aeolyxria-the-uncanny.blood-for-blood.texts.roll: Power Roll + 3
abilities.draconian.aeolyxria-the-uncanny.blood-for-blood.texts.tier1: 7 poison damage; A < 2 bleeding (save ends)
abilities.draconian.aeolyxria-the-uncanny.blood-for-blood.texts.tier2: 12 poison damage; A < 3 bleeding (save ends)
abilities.draconian.aeolyxria-the-uncanny.blood-for-blood.texts.tier3: 15 poison damage; bleeding (save ends)
traits.draconian.aeolyxria-the-uncanny.thats-our-opening.name: That's Our Opening!
traits.draconian.aeolyxria-the-uncanny.thats-our-opening.description: The Director gains 1 Malice whenever Aeolyxria imposes a condition on an enemy.
monsters.draconian.aeolyxria-the-uncanny.name: Aeolyxria the Uncanny
abilities.draconian.dorzinuuth-the-base.punishing-flail.name: Punishing Flail
abilities.draconian.dorzinuuth-the-base.punishing-flail.texts.target: Two creatures or objects
abilities.draconian.dorzinuuth-the-base.punishing-flail.texts.distance: Melee 1
abilities.draconian.dorzinuuth-the-base.punishing-flail.texts.roll: Power Roll + 4
abilities.draconian.dorzinuuth-the-base.punishing-flail.texts.tier1: 11 damage; M < 2 prone
abilities.draconian.dorzinuuth-the-base.punishing-flail.texts.tier2: 16 damage; M < 3 prone
abilities.draconian.dorzinuuth-the-base.punishing-flail.texts.tier3: 19 damage; M < 4 prone
abilities.draconian.dorzinuuth-the-base.punishing-flail.texts.effect: '2 Malice: If the target has M < 4, they are also bleeding (save ends).'
abilities.draconian.dorzinuuth-the-base.ill-cut-a-path.name: I'll Cut A Path
abilities.draconian.dorzinuuth-the-base.ill-cut-a-path.texts.target: Each enemy in the area
abilities.draconian.dorzinuuth-the-base.ill-cut-a-path.texts.distance: 5 × 2 line within 1
abilities.draconian.dorzinuuth-the-base.ill-cut-a-path.texts.roll: Power Roll + 4
abilities.draconian.dorzinuuth-the-base.ill-cut-a-path.texts.tier1: 7 damage
abilities.draconian.dorzinuuth-the-base.ill-cut-a-path.texts.tier2: 13 damage; M < 3 prone
abilities.draconian.dorzinuuth-the-base.ill-cut-a-path.texts.tier3: 15 damage; M < 4 prone
abilities.draconian.dorzinuuth-the-base.ill-cut-a-path.texts.effect: 'Effect: Before the power roll
  is made, Dorzinuuth shifts to an unoccupied space adjacent to the end of the line.'
abilities.draconian.dorzinuuth-the-base.watch-your-six.name: Watch Your Six!
abilities.draconian.dorzinuuth-the-base.watch-your-six.texts.trigger: An ally within distance takes damage while Dorzinuuth isn't flying.
abilities.draconian.dorzinuuth-the-base.watch-your-six.texts.target: One ally
abilities.draconian.dorzinuuth-the-base.watch-your-six.texts.distance: Melee 1
abilities.draconian.dorzinuuth-the-base.watch-your-six.texts.effect: 'Effect: Dorzinuuth shields the triggering ally with his wings, halving the damage.'
traits.draconian.dorzinuuth-the-base.end-effect.name: End Effect
traits.draconian.dorzinuuth-the-base.end-effect.description: At the end of each of his turns,
  Dorzinuuth can take 10 damage to end one effect on him that can be ended by a saving throw. This
  damage can't be reduced in any way.
traits.draconian.dorzinuuth-the-base.remember-your-oath.name: Remember Your Oath
traits.draconian.dorzinuuth-the-base.remember-your-oath.description: If Dorzinuuth hears a creature
  recite the Dragon Phalanx oath, he takes a bane on strikes made against that character until the
  end of the encounter.
traits.draconian.dorzinuuth-the-base.sheltering-wings.name: Sheltering Wings
traits.draconian.dorzinuuth-the-base.sheltering-wings.description: While Dorzinuuth isn't flying, strikes made against him take a bane.
abilities.draconian.dorzinuuth-the-base.roaring-gambit.name: Roaring Gambit
abilities.draconian.dorzinuuth-the-base.roaring-gambit.texts.target: Each enemy in the area
abilities.draconian.dorzinuuth-the-base.roaring-gambit.texts.distance: 5 burst
abilities.draconian.dorzinuuth-the-base.roaring-gambit.texts.roll: Reason test
abilities.draconian.dorzinuuth-the-base.roaring-gambit.texts.tier1: Frightened (save ends)
abilities.draconian.dorzinuuth-the-base.roaring-gambit.texts.tier2: Frightened (EoT)
abilities.draconian.dorzinuuth-the-base.roaring-gambit.texts.tier3: No effect.
abilities.draconian.dorzinuuth-the-base.roaring-gambit.texts.effect: |-
  Effect: Dorzinuuth lets loose a powerful roar. Each target makes a Reason test.

  Effect: Each ally in the area gains an edge on their next strike.
abilities.draconian.dorzinuuth-the-base.wings-of-second-wind.name: Wings of Second Wind
abilities.draconian.dorzinuuth-the-base.wings-of-second-wind.texts.target: Self and each ally in the area
abilities.draconian.dorzinuuth-the-base.wings-of-second-wind.texts.distance: 10 burst
abilities.draconian.dorzinuuth-the-base.wings-of-second-wind.texts.effect: 'Effect: Each target shifts or flies up to their speed and regains 10 Stamina.'
abilities.draconian.dorzinuuth-the-base.snap-crackle-pop.name: Snap, Crackle, Pop
abilities.draconian.dorzinuuth-the-base.snap-crackle-pop.texts.target: Each ally in the area
abilities.draconian.dorzinuuth-the-base.snap-crackle-pop.texts.distance: 5 burst
abilities.draconian.dorzinuuth-the-base.snap-crackle-pop.texts.effect: 'Effect: Dorzinuuth covers
  the targets in an electrifying mesh. Whenever a target takes damage from a melee ability, the
  attacker takes 6 lightning damage.'
monsters.draconian.dorzinuuth-the-base.name: Dorzinuuth the Base
abilities.draconian.locratix-the-morningstar.skewer.name: Skewer
abilities.draconian.locratix-the-morningstar.skewer.texts.target: Two creatures or objects
abilities.draconian.locratix-the-morningstar.skewer.texts.distance: Melee 1
abilities.draconian.locratix-the-morningstar.skewer.texts.roll: Power Roll + 3
abilities.draconian.locratix-the-morningstar.skewer.texts.tier1: 10 damage
abilities.draconian.locratix-the-morningstar.skewer.texts.tier2: 15 damage; M < 1 slowed (save ends)
abilities.draconian.locratix-the-morningstar.skewer.texts.tier3: 18 damage; M < 2 slowed (save ends)
abilities.draconian.locratix-the-morningstar.skewer.texts.effect: 'Effect: Locratix deals 6 damage to each creature or object in a 2 × 1 line behind the target.'
abilities.draconian.locratix-the-morningstar.acidic-stun.name: Acidic Stun
abilities.draconian.locratix-the-morningstar.acidic-stun.texts.target: Each enemy in the area
abilities.draconian.locratix-the-morningstar.acidic-stun.texts.distance: 3 × 1 line within 1
abilities.draconian.locratix-the-morningstar.acidic-stun.texts.roll: Power Roll + 3
abilities.draconian.locratix-the-morningstar.acidic-stun.texts.tier1: 7 acid damage; M < 1 dazed (save ends)
abilities.draconian.locratix-the-morningstar.acidic-stun.texts.tier2: 12 acid damage; M < 2 dazed (save ends)
abilities.draconian.locratix-the-morningstar.acidic-stun.texts.tier3: 15 acid damage; M < 3 dazed (save ends)
abilities.draconian.locratix-the-morningstar.acidic-stun.texts.effect: "Effect: While dazed this way, a target takes an extra 6 damage from Locratix's abilities."
abilities.draconian.locratix-the-morningstar.takeoff.name: Takeoff
abilities.draconian.locratix-the-morningstar.takeoff.texts.target: Self
abilities.draconian.locratix-the-morningstar.takeoff.texts.distance: Self
abilities.draconian.locratix-the-morningstar.takeoff.texts.effect: 'Effect: Locratix flies up to her
  speed. Any creature adjacent to the space on the ground she took off from who has A < 2 is knocked
  prone.'
abilities.draconian.locratix-the-morningstar.stay-back.name: Stay Back!
abilities.draconian.locratix-the-morningstar.stay-back.texts.trigger: A creature within distance moves or is forced moved.
abilities.draconian.locratix-the-morningstar.stay-back.texts.target: The triggering creature
abilities.draconian.locratix-the-morningstar.stay-back.texts.distance: Melee 2
abilities.draconian.locratix-the-morningstar.stay-back.texts.roll: Power Roll + 3
abilities.draconian.locratix-the-morningstar.stay-back.texts.tier1: 7 acid damage; A < 1 the target's speed is 0 (EoT)
abilities.draconian.locratix-the-morningstar.stay-back.texts.tier2: 12 acid damage; A < 2 the target's speed is 0 (EoT)
abilities.draconian.locratix-the-morningstar.stay-back.texts.tier3: 15 acid damage; A < 3 the target's speed is 0 (EoT)
traits.draconian.locratix-the-morningstar.flighty.name: Flighty
traits.draconian.locratix-the-morningstar.flighty.description: When Locratix deals rolled damage to
  an enemy, that enemy can't use Locratix as the trigger for any of their triggered actions until
  the start of Locratix's next turn.
traits.draconian.locratix-the-morningstar.absorbing-scales.name: Absorbing Scales
traits.draconian.locratix-the-morningstar.absorbing-scales.description: When Locratix takes damage
  of any type for which she has damage immunity, she has damage immunity 6 against the next strike
  made against her.
monsters.draconian.locratix-the-morningstar.name: Locratix the Morningstar
abilities.draconian.lydixavus-the-deadeye.breathsnipe.name: Breathsnipe
abilities.draconian.lydixavus-the-deadeye.breathsnipe.texts.target: One enemy
abilities.draconian.lydixavus-the-deadeye.breathsnipe.texts.distance: Ranged 15
abilities.draconian.lydixavus-the-deadeye.breathsnipe.texts.roll: Power Roll + 3
abilities.draconian.lydixavus-the-deadeye.breathsnipe.texts.tier1: 10 cold damage
abilities.draconian.lydixavus-the-deadeye.breathsnipe.texts.tier2: 16 cold damage; the target takes a bane on their next strike
abilities.draconian.lydixavus-the-deadeye.breathsnipe.texts.tier3: 19 cold damage; the target has a double bane on their next strike
abilities.draconian.lydixavus-the-deadeye.ice-lob.name: Ice Lob
abilities.draconian.lydixavus-the-deadeye.ice-lob.texts.target: Each enemy and object in the area
abilities.draconian.lydixavus-the-deadeye.ice-lob.texts.distance: 2 cube within 10
abilities.draconian.lydixavus-the-deadeye.ice-lob.texts.roll: Power Roll + 3
abilities.draconian.lydixavus-the-deadeye.ice-lob.texts.tier1: 7 cold damage; M < 1 dazed (save ends)
abilities.draconian.lydixavus-the-deadeye.ice-lob.texts.tier2: 12 cold damage; M < 2 dazed (save ends)
abilities.draconian.lydixavus-the-deadeye.ice-lob.texts.tier3: 15 cold damage; M < 3 dazed (save ends)
abilities.draconian.lydixavus-the-deadeye.parting-gift.name: Parting Gift
abilities.draconian.lydixavus-the-deadeye.parting-gift.texts.target: Self
abilities.draconian.lydixavus-the-deadeye.parting-gift.texts.distance: Self
abilities.draconian.lydixavus-the-deadeye.parting-gift.texts.effect: 'Effect: Lydixavus flies up to
  their speed, leaving a size 1S ice mine in the space they took off from. The ice mine explodes
  when an enemy enters its space, using the power roll for the Ice Lob ability, and targeting the
  triggering creature and each creature and object adjacent to the ice mine.'
abilities.draconian.lydixavus-the-deadeye.wasnt-aiming-for-you.name: Wasn't Aiming For You
abilities.draconian.lydixavus-the-deadeye.wasnt-aiming-for-you.texts.trigger: Lydixavus obtains a tier 1 outcome on their signature ability.
abilities.draconian.lydixavus-the-deadeye.wasnt-aiming-for-you.texts.target: Self
abilities.draconian.lydixavus-the-deadeye.wasnt-aiming-for-you.texts.distance: Self
abilities.draconian.lydixavus-the-deadeye.wasnt-aiming-for-you.texts.effect: 'Effect: Lydixavus uses
  their signature ability again, targeting a creature within 5 squares of the original target.'
traits.draconian.lydixavus-the-deadeye.scorekeeping-scales.name: Scorekeeping Scales
traits.draconian.lydixavus-the-deadeye.scorekeeping-scales.description: Lydixavus knows the location
  of every creature who has ever dealt damage to them. If any of those creatures are within 20
  squares of Lydixavus, Lydixavus always has line of effect to them as long as a size 1 opening
  exists between Lydixavus and the target.
monsters.draconian.lydixavus-the-deadeye.name: Lydixavus the Deadeye
abilities.draconian.myxovidan-the-sintaker.breaking-palm.name: Breaking Palm
abilities.draconian.myxovidan-the-sintaker.breaking-palm.texts.target: Two enemies
abilities.draconian.myxovidan-the-sintaker.breaking-palm.texts.distance: Melee 1
abilities.draconian.myxovidan-the-sintaker.breaking-palm.texts.roll: Power Roll + 3
abilities.draconian.myxovidan-the-sintaker.breaking-palm.texts.tier1: 10 damage; M < 1 weakened (save ends)
abilities.draconian.myxovidan-the-sintaker.breaking-palm.texts.tier2: 15 damage; M < 2 weakened (save ends)
abilities.draconian.myxovidan-the-sintaker.breaking-palm.texts.tier3: 18 corruption damage; M < 3 weakened (save ends)
abilities.draconian.myxovidan-the-sintaker.breaking-palm.texts.effect: '2 Malice: Myxovidan regains Stamina equal to half the damage dealt.'
abilities.draconian.myxovidan-the-sintaker.expunging-exhalation.name: Expunging Exhalation
abilities.draconian.myxovidan-the-sintaker.expunging-exhalation.texts.target: Each enemy in the area
abilities.draconian.myxovidan-the-sintaker.expunging-exhalation.texts.distance: 2 burst
abilities.draconian.myxovidan-the-sintaker.expunging-exhalation.texts.roll: Power Roll + 3
abilities.draconian.myxovidan-the-sintaker.expunging-exhalation.texts.tier1: 7 corruption damage; M < 1 the target has corruption weakness 3 (save ends)
abilities.draconian.myxovidan-the-sintaker.expunging-exhalation.texts.tier2: 12 corruption damage; M < 2 the target has corruption weakness 3 (save ends)
abilities.draconian.myxovidan-the-sintaker.expunging-exhalation.texts.tier3: 15 corruption damage; M < 3 the target has corruption weakness 3 (save ends)
abilities.draconian.myxovidan-the-sintaker.step-and-swap.name: Step and Swap
abilities.draconian.myxovidan-the-sintaker.step-and-swap.texts.target: One ally
abilities.draconian.myxovidan-the-sintaker.step-and-swap.texts.distance: Ranged 3
abilities.draconian.myxovidan-the-sintaker.step-and-swap.texts.effect: 'Effect: Myxovidan and the target shift to swap places.'
abilities.draconian.myxovidan-the-sintaker.anyone-can-do-that.name: Anyone Can Do That
abilities.draconian.myxovidan-the-sintaker.anyone-can-do-that.texts.trigger: An adjacent creature damages Myxovidan with a melee ability.
abilities.draconian.myxovidan-the-sintaker.anyone-can-do-that.texts.target: Self
abilities.draconian.myxovidan-the-sintaker.anyone-can-do-that.texts.distance: Self
abilities.draconian.myxovidan-the-sintaker.anyone-can-do-that.texts.effect: 'Effect: Myxovidan
  recreates the ability to use it against the triggering creature. If the ability has a power roll,
  Myxovidan uses his highest characteristic score for the roll. If Myxovidan gets a higher tier
  outcome than the triggering creature, the Director gains 2 Malice.'
traits.draconian.myxovidan-the-sintaker.stench-of-death.name: Stench of Death
traits.draconian.myxovidan-the-sintaker.stench-of-death.description: Whenever an enemy regains Stamina while within 5 squares of Myxovidan, they regain 3 less Stamina.
monsters.draconian.myxovidan-the-sintaker.name: Myxovidan the Sintaker
abilities.draconian.phrrygalax-the-subduer.baneful-blade.name: Baneful Blade
abilities.draconian.phrrygalax-the-subduer.baneful-blade.texts.target: Two creatures or objects
abilities.draconian.phrrygalax-the-subduer.baneful-blade.texts.distance: Melee 1
abilities.draconian.phrrygalax-the-subduer.baneful-blade.texts.roll: Power Roll + 3
abilities.draconian.phrrygalax-the-subduer.baneful-blade.texts.tier1: 10 damage
abilities.draconian.phrrygalax-the-subduer.baneful-blade.texts.tier2: 16 damage; M < 1 bleeding (save ends)
abilities.draconian.phrrygalax-the-subduer.baneful-blade.texts.tier3: 19 damage; M < 2 3 damage, bleeding (save ends)
abilities.draconian.phrrygalax-the-subduer.spinning-spit.name: Spinning Spit
abilities.draconian.phrrygalax-the-subduer.spinning-spit.texts.target: Each enemy in the area
abilities.draconian.phrrygalax-the-subduer.spinning-spit.texts.distance: 1 burst
abilities.draconian.phrrygalax-the-subduer.spinning-spit.texts.roll: Power Roll + 3
abilities.draconian.phrrygalax-the-subduer.spinning-spit.texts.tier1: 7 fire damage
abilities.draconian.phrrygalax-the-subduer.spinning-spit.texts.tier2: 13 fire damage
abilities.draconian.phrrygalax-the-subduer.spinning-spit.texts.tier3: 16 fire damage
abilities.draconian.phrrygalax-the-subduer.heavy-landing.name: Heavy Landing
abilities.draconian.phrrygalax-the-subduer.heavy-landing.texts.target: Self
abilities.draconian.phrrygalax-the-subduer.heavy-landing.texts.distance: Self
abilities.draconian.phrrygalax-the-subduer.heavy-landing.texts.effect: 'Effect: Phrrygalax flies up
  to his speed and lands in an unoccupied space on the ground. Each creature adjacent to where he
  lands who has A < 2 is knocked prone.'
abilities.draconian.phrrygalax-the-subduer.armor-of-the-ancients.name: Armor of the Ancients
abilities.draconian.phrrygalax-the-subduer.armor-of-the-ancients.texts.trigger: Phrrygalax takes acid, cold, corruption, fire, lightning, or poison damage.
abilities.draconian.phrrygalax-the-subduer.armor-of-the-ancients.texts.target: Self
abilities.draconian.phrrygalax-the-subduer.armor-of-the-ancients.texts.distance: Self
abilities.draconian.phrrygalax-the-subduer.armor-of-the-ancients.texts.effect: 'Effect: Phrrygalax
  takes no damage and instead regains the same amount of Stamina. He then swaps his current damage
  immunity with the triggering damage type.'
abilities.draconian.phrrygalax-the-subduer.still-your-tongue.name: Still Your Tongue!
abilities.draconian.phrrygalax-the-subduer.still-your-tongue.texts.trigger: Phrrygalax hears a creature within 5 squares reciting the oath of Good King Omund's Dragon Phalanx.
abilities.draconian.phrrygalax-the-subduer.still-your-tongue.texts.target: Self
abilities.draconian.phrrygalax-the-subduer.still-your-tongue.texts.distance: Self
abilities.draconian.phrrygalax-the-subduer.still-your-tongue.texts.effect: 'Effect: Phrrygalax
  shifts up to his speed and uses Baneful Blade against the triggering creature. That ability deals
  an extra 7 damage.'
traits.draconian.phrrygalax-the-subduer.oathbreakers-vengeance.name: Oathbreaker's Vengeance
traits.draconian.phrrygalax-the-subduer.oathbreakers-vengeance.description: Whenever Phrrygalax fails a saving throw, he deals an additional 7 damage on his next strike.
monsters.draconian.phrrygalax-the-subduer.name: Phrrygalax the Subduer
effects.draconian.corruption-weakness.name: Corruption weakness
effects.draconian.corruption-weakness.description: The creature has corruption weakness 3.
effects.draconian.acid-dazed.name: Dazed (Acidic Stun)
effects.draconian.acid-dazed.description: >-
  The creature is dazed, and takes an extra 6 damage from Locratix's abilities.
abilities.draconian.malice.breath-weapon.name: Breath Weapon
abilities.draconian.malice.breath-weapon.texts.target: Each enemy in the area
