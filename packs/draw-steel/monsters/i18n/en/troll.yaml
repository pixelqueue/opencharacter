abilities.troll.troll-butcher.savoring-bite.name: Savoring Bite
abilities.troll.troll-butcher.savoring-bite.texts.target: Two creatures or objects
abilities.troll.troll-butcher.savoring-bite.texts.distance: Melee 1
abilities.troll.troll-butcher.savoring-bite.texts.roll: Power Roll + 3
abilities.troll.troll-butcher.savoring-bite.texts.tier1: 9 damage; M < 1 bleeding (save ends)
abilities.troll.troll-butcher.savoring-bite.texts.tier2: 14 damage; M < 2 bleeding (save ends)
abilities.troll.troll-butcher.savoring-bite.texts.tier3: 17 damage; M < 3 bleeding (save ends)
abilities.troll.troll-butcher.savoring-bite.texts.effect: '1 Malice: The butcher regains Stamina equal to the damage dealt.'
abilities.troll.troll-butcher.rotten-scraps.name: Rotten Scraps
abilities.troll.troll-butcher.rotten-scraps.texts.target: Each creature in the area
abilities.troll.troll-butcher.rotten-scraps.texts.distance: 3 cube within 10
abilities.troll.troll-butcher.rotten-scraps.texts.roll: Power Roll + 3
abilities.troll.troll-butcher.rotten-scraps.texts.tier1: 5 poison damage; M < 1 weakened (save ends)
abilities.troll.troll-butcher.rotten-scraps.texts.tier2: 9 poison damage; M < 2 weakened (save ends)
abilities.troll.troll-butcher.rotten-scraps.texts.tier3: 11 poison damage; M < 3 weakened (save ends)
abilities.troll.troll-butcher.rotten-scraps.texts.effect: 'Effect: Each troll in the area ignores the damage and instead regains 3 Stamina.'
abilities.troll.troll-butcher.gourmet-flesh.name: Gourmet Flesh
abilities.troll.troll-butcher.gourmet-flesh.texts.target: Self
abilities.troll.troll-butcher.gourmet-flesh.texts.distance: Self
abilities.troll.troll-butcher.gourmet-flesh.texts.effect: 'Effect: The butcher enhances their next
  use of Savoring Bite, changing the damage type and condition imposed to one of the following
  pairs: corruption damage and dazed, acid damage and restrained, or lightning damage and
  frightened.'
abilities.troll.troll-butcher.acquired-taste.name: Acquired Taste
abilities.troll.troll-butcher.acquired-taste.texts.trigger: A creature within distance deals damage
  to the butcher with an ability that gains an edge, has a double edge, or uses a surge.
abilities.troll.troll-butcher.acquired-taste.texts.target: The triggering creature
abilities.troll.troll-butcher.acquired-taste.texts.distance: Melee 1
abilities.troll.troll-butcher.acquired-taste.texts.effect: 'Effect: The butcher makes a free strike
  against the target. Until the end of their next turn, the butcher gains an edge on power rolls and
  deals an extra 3 damage with strikes.'
traits.troll.troll-butcher.bloody-feast.name: Bloody Feast
traits.troll.troll-butcher.bloody-feast.description: Each ally within 5 squares of the butcher gains
  an edge on power rolls against any enemy affected by a condition.
traits.troll.troll-butcher.relentless-hunger.name: Relentless Hunger
traits.troll.troll-butcher.relentless-hunger.description: The butcher dies only if they are reduced
  to 0 Stamina by acid or fire damage, if they end their turn with 0 Stamina, or if they take acid
  or fire damage while at 0 Stamina.
monsters.troll.troll-butcher.name: Troll Butcher
monsters.troll.troll-crack-trooper.texts.withCaptain: +3 bonus to Stamina
abilities.troll.troll-crack-trooper.charging-chomp.name: Charging Chomp
abilities.troll.troll-crack-trooper.charging-chomp.texts.target: One creature or object per minion
abilities.troll.troll-crack-trooper.charging-chomp.texts.distance: Melee 1
abilities.troll.troll-crack-trooper.charging-chomp.texts.roll: Power Roll + 4
abilities.troll.troll-crack-trooper.charging-chomp.texts.tier1: 5 damage; push 2
abilities.troll.troll-crack-trooper.charging-chomp.texts.tier2: 7 damage; push 3; A < 3 3 damage
abilities.troll.troll-crack-trooper.charging-chomp.texts.tier3: 9 damage; push 4; A < 4 5 damage
abilities.troll.troll-crack-trooper.charging-chomp.texts.effect: "Effect: The crack trooper's squad's Stamina pool regains Stamina equal to half the damage dealt."
traits.troll.troll-crack-trooper.group-appetite.name: Group Appetite
traits.troll.troll-crack-trooper.group-appetite.description: The crack trooper dies only if their
  squad's Stamina pool is reduced to 0 Stamina by acid or fire damage, if they end their turn with 0
  Stamina in their squad's Stamina pool, or if they take acid or fire damage while their squad's
  Stamina pool is at 0 Stamina.
monsters.troll.troll-crack-trooper.name: Troll Crack Trooper
abilities.troll.troll-glutton.voracious-mastication.name: Voracious Mastication
abilities.troll.troll-glutton.voracious-mastication.texts.target: Two creatures or objects
abilities.troll.troll-glutton.voracious-mastication.texts.distance: Melee 1
abilities.troll.troll-glutton.voracious-mastication.texts.roll: Power Roll + 3
abilities.troll.troll-glutton.voracious-mastication.texts.tier1: 10 damage
abilities.troll.troll-glutton.voracious-mastication.texts.tier2: 15 damage; M < 2 slowed (save ends)
abilities.troll.troll-glutton.voracious-mastication.texts.tier3: 18 damage; M < 3 slowed (save ends)
abilities.troll.troll-glutton.voracious-mastication.texts.effect: '1 Malice: The glutton regains Stamina equal to the damage dealt.'
abilities.troll.troll-glutton.crash-through.name: Crash Through
abilities.troll.troll-glutton.crash-through.texts.target: Self
abilities.troll.troll-glutton.crash-through.texts.distance: Self
abilities.troll.troll-glutton.crash-through.texts.effect: "Effect: The glutton shifts up to their
  speed in a straight line, ignoring difficult terrain. The first time during this movement that the
  glutton moves through the space of a creature or object their size or smaller, that creature or
  object takes 10 damage, or a creature can choose to fall prone instead. If the glutton moves into
  a creature or object larger than them and doesn't knock the creature prone or destroy the object,
  the glutton's movement ends and they are dazed until the end of their next turn."
abilities.troll.troll-glutton.food-frenzy.name: Food Frenzy
abilities.troll.troll-glutton.food-frenzy.texts.target: Self
abilities.troll.troll-glutton.food-frenzy.texts.distance: Self
abilities.troll.troll-glutton.food-frenzy.texts.effect: 'Effect: Until the start of their next turn,
  the glutton has a double edge on strikes, and strikes made against them gain an edge.'
abilities.troll.troll-glutton.spiteful-retort.name: Spiteful Retort
abilities.troll.troll-glutton.spiteful-retort.texts.trigger: The glutton is reduced to 0 Stamina but doesn't die.
abilities.troll.troll-glutton.spiteful-retort.texts.target: The triggering creature
abilities.troll.troll-glutton.spiteful-retort.texts.distance: Melee 1
abilities.troll.troll-glutton.spiteful-retort.texts.effect: 'Effect: The glutton uses Voracious Mastication against an adjacent creature.'
traits.troll.troll-glutton.insatiable-appetite.name: Insatiable Appetite
traits.troll.troll-glutton.insatiable-appetite.description: Once per turn, the glutton can use the
  Charge main action as a free maneuver if they target a winded creature.
traits.troll.troll-glutton.relentless-hunger.name: Relentless Hunger
traits.troll.troll-glutton.relentless-hunger.description: The glutton dies only if they are reduced
  to 0 Stamina by acid or fire damage, if they end their turn with 0 Stamina, or if they take acid
  or fire damage while at 0 Stamina.
monsters.troll.troll-glutton.name: Troll Glutton
monsters.troll.troll-limbjumble.texts.withCaptain: Gain an edge on strikes
abilities.troll.troll-limbjumble.arm-and-a-leg.name: Arm and a Leg
abilities.troll.troll-limbjumble.arm-and-a-leg.texts.target: One creature or object per minion
abilities.troll.troll-limbjumble.arm-and-a-leg.texts.distance: Melee 1
abilities.troll.troll-limbjumble.arm-and-a-leg.texts.roll: Power Roll + 3
abilities.troll.troll-limbjumble.arm-and-a-leg.texts.tier1: 3 damage; A < 2 prone
abilities.troll.troll-limbjumble.arm-and-a-leg.texts.tier2: 5 damage; A < 3 prone
abilities.troll.troll-limbjumble.arm-and-a-leg.texts.tier3: 6 damage; prone
abilities.troll.troll-limbjumble.arm-and-a-leg.texts.effect: 'Effect: If a target made prone this way is already prone, they are grabbed instead.'
traits.troll.troll-limbjumble.hyper-regeneration.name: Hyper-Regeneration
traits.troll.troll-limbjumble.hyper-regeneration.description: At the start of each of the
  limbjumble's squad's turns, the squad's Stamina pool increases as if each limbjumble were at full
  Stamina.
monsters.troll.troll-limbjumble.name: Troll Limbjumble
monsters.troll.troll-ravager.texts.withCaptain: +2 bonus to speed
abilities.troll.troll-ravager.dine-and-dash.name: Dine and Dash
abilities.troll.troll-ravager.dine-and-dash.texts.target: One creature or object per minion
abilities.troll.troll-ravager.dine-and-dash.texts.distance: Melee 1
abilities.troll.troll-ravager.dine-and-dash.texts.roll: Power Roll + 4
abilities.troll.troll-ravager.dine-and-dash.texts.tier1: 4 damage; the ravager can shift 1 square
abilities.troll.troll-ravager.dine-and-dash.texts.tier2: 6 damage; the ravager shifts up to 2 squares
abilities.troll.troll-ravager.dine-and-dash.texts.tier3: 8 damage; the ravager shifts up to 3 squares
abilities.troll.troll-ravager.dine-and-dash.texts.effect: "Effect: The ravager's squad's Stamina pool regains Stamina equal to half the damage dealt."
traits.troll.troll-ravager.group-appetite.name: Group Appetite
traits.troll.troll-ravager.group-appetite.description: The ravager dies only if their squad's
  Stamina pool is reduced to 0 Stamina by acid or fire damage, if they end their turn with 0 Stamina
  in their squad's Stamina pool, or if they take acid or fire damage while their squad's Stamina
  pool is at 0 Stamina.
monsters.troll.troll-ravager.name: Troll Ravager
monsters.troll.troll-whelp.texts.withCaptain: +2 damage bonus to strikes
abilities.troll.troll-whelp.jaws-and-claws.name: Jaws and Claws
abilities.troll.troll-whelp.jaws-and-claws.texts.target: One creature or object per minion
abilities.troll.troll-whelp.jaws-and-claws.texts.distance: Melee 1
abilities.troll.troll-whelp.jaws-and-claws.texts.roll: Power Roll + 3
abilities.troll.troll-whelp.jaws-and-claws.texts.tier1: 3 damage
abilities.troll.troll-whelp.jaws-and-claws.texts.tier2: 6 damage; slide 1
abilities.troll.troll-whelp.jaws-and-claws.texts.tier3: 7 damage; slide 2; M < 2 bleeding (save ends)
traits.troll.troll-whelp.lingering-hunger.name: Lingering Hunger
traits.troll.troll-whelp.lingering-hunger.description: Whenever two or more whelps are
  simultaneously reduced to 0 Stamina by damage that isn't acid or fire damage, half of those whelps
  become troll limbjumbles with 4 Stamina.
monsters.troll.troll-whelp.name: Troll Whelp
malice.troll.foul-spew.name: Foul Spew
malice.troll.foul-spew.description: One troll acting this turn spews out a half-digested meal in a 5
  × 1 line within 1 square of them. Each troll in the area regains 3 Stamina. Each enemy in the area
  makes a Might test.
malice.troll.foul-spew.texts.tier1: 12 acid damage; dazed (EoT)
malice.troll.foul-spew.texts.tier2: 10 acid damage; weakened (EoT)
malice.troll.foul-spew.texts.tier3: 6 acid damage
malice.troll.emergency-meal.name: Emergency Meal
malice.troll.emergency-meal.description: Each troll in the encounter can make a free strike against
  a creature adjacent to them, and regains Stamina equal to the damage dealt.
malice.troll.bloody-banquet.name: Bloody Banquet
malice.troll.bloody-banquet.description: Each winded troll in the encounter disgorges the contents
  of their stomach onto the ground around them, creating a 1 burst of foul vomitus that lasts until
  the end of the encounter. Each non-troll who enters this area for the first time in a round or
  starts their turn there takes 5 acid damage. Each troll in the area has a double edge on power
  rolls.
effects.troll.acquired-taste.name: Acquired taste
effects.troll.acquired-taste.description: The butcher gains an edge on power rolls and deals an extra 3 damage with strikes.
effects.troll.food-frenzy.name: Food frenzy
effects.troll.food-frenzy.description: The glutton has a double edge on strikes, and strikes made against them gain an edge.
