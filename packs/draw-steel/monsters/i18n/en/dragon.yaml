malice.dragon.crucible-dragon.swordfall.name: Swordfall
malice.dragon.crucible-dragon.swordfall.description: While the dragon is flying, they shape themself
  into a blade and fall. Each creature and object in the dragon's space when they hit the ground and
  in a 6 × 4 line within 1 square of the dragon takes 7 damage. A creature who takes this damage and
  has A < 4 takes 4 extra damage per square the dragon fell and is restrained (save ends). A
  creature not restrained this way can move into the nearest unoccupied space.
malice.dragon.crucible-dragon.shower-of-blades.name: Shower of Blades
malice.dragon.crucible-dragon.shower-of-blades.description: The dragon shakes loose a cloud of
  shattered weapons in a 6 × 4 line within 1 square of them. Each creature and object in the area
  makes an Agility test.
malice.dragon.crucible-dragon.shower-of-blades.texts.tier1: 16 damage; bleeding (save ends)
malice.dragon.crucible-dragon.shower-of-blades.texts.tier2: 13 damage; bleeding (EoT)
malice.dragon.crucible-dragon.shower-of-blades.texts.tier3: 7 damage
malice.dragon.crucible-dragon.solo-action.name: Solo Action
malice.dragon.crucible-dragon.solo-action.description: The dragon takes an additional main action on
  their turn. They can use this feature even if they are dazed.
malice.dragon.crucible-dragon.meltdown.name: Meltdown
malice.dragon.crucible-dragon.meltdown.description: The dragon superheats the ground across the
  encounter map until the end of the round. Any enemy who starts their turn on the ground is slagged
  as if affected by the dragon's Slag Spew ability.
malice.dragon.gloom-dragon.dread-and-terror.name: Dread and Terror
malice.dragon.gloom-dragon.dread-and-terror.description: The dragon thickens the fog of their
  Gloaming Wyrmscale Aura trait and the horrors within it. Each creature in the area takes a bane on
  strikes made against the dragon until the start of the dragon's next turn.
malice.dragon.gloom-dragon.doleful-visions.name: Doleful Visions
malice.dragon.gloom-dragon.doleful-visions.description: The dragon manifests four 2 cubes of
  nightmarish apparitions anywhere on the encounter map. Each creature in the area when it appears
  makes an Intuition test.
malice.dragon.gloom-dragon.doleful-visions.texts.tier1: 14 damage; dazed (save ends)
malice.dragon.gloom-dragon.doleful-visions.texts.tier2: 11 damage; dazed (EoT)
malice.dragon.gloom-dragon.doleful-visions.texts.tier3: 6 damage
malice.dragon.gloom-dragon.solo-action.name: Solo Action
malice.dragon.gloom-dragon.solo-action.description: The dragon takes an additional main action on
  their turn. They can use this feature even if they are dazed.
malice.dragon.gloom-dragon.phantasmagoria.name: Phantasmagoria!
malice.dragon.gloom-dragon.phantasmagoria.description: The dragon summons macabre, disquieting
  phantasms in a 10 cube within 1 square that lasts until the end of the encounter. Any enemy who
  enters the area for the first time in a round or starts their turn there takes 6 psychic damage,
  or 8 psychic damage if they are dragonsealed by the gloom dragon. Additionally, the enemy's
  Intuition score is treated as 1 lower for the purpose of resisting potencies until the end of the
  encounter.
malice.dragon.meteor-dragon.liftoff.name: Liftoff
malice.dragon.meteor-dragon.liftoff.description: The next time the dragon uses their Crescent Claws
  ability, they can also slide the target up to 5 squares. If the target is dragonsealed, the dragon
  can vertical slide them instead.
malice.dragon.meteor-dragon.solo-action.name: Solo Action
malice.dragon.meteor-dragon.solo-action.description: The dragon takes an additional main action on
  their turn. They can use this feature even if they are dazed.
malice.dragon.meteor-dragon.starfall.name: Starfall
malice.dragon.meteor-dragon.starfall.description: The dragon drops stars into five 2 cubes anywhere
  on the encounter map. The area is difficult terrain, and each creature and object in the area when
  it appears makes an Agility test.
malice.dragon.meteor-dragon.starfall.texts.tier1: 20 holy damage; slowed (save ends), prone
malice.dragon.meteor-dragon.starfall.texts.tier2: 16 holy damage; slowed (save ends)
malice.dragon.meteor-dragon.starfall.texts.tier3: 10 holy damage
malice.dragon.meteor-dragon.event-horizon.name: Event Horizon
malice.dragon.meteor-dragon.event-horizon.description: A black hole manifests as a 1 cube within 20
  squares of the dragon in an unoccupied space. Each creature who has M < 5 and each object of size
  3 or smaller is vertical pulled 2 squares toward the area at the start of each round, ignoring
  stability. Any creature who starts their turn in the area or any object in the area at the end of
  the round suffers the effect of the dragon's Voidlight Breath ability, and the black hole
  disappears.
malice.dragon.omen-dragon.black-skies.name: Black Skies
malice.dragon.omen-dragon.black-skies.description: The dragon expands their wings to create a shroud
  of shadow. Until the start of the dragon's next turn, any strike made against them takes a bane.
malice.dragon.omen-dragon.rise-and-fall.name: Rise and Fall
malice.dragon.omen-dragon.rise-and-fall.description: The dragon flies up to 10 squares and carries
  fated souls with them. Each creature in the area of the dragon's Stagnant Wyrmscale Aura trait
  makes a Presence test.
malice.dragon.omen-dragon.rise-and-fall.texts.tier1: Vertical pull 10
malice.dragon.omen-dragon.rise-and-fall.texts.tier2: Vertical pull 6
malice.dragon.omen-dragon.rise-and-fall.texts.tier3: Vertical pull 4
malice.dragon.omen-dragon.solo-action.name: Solo Action
malice.dragon.omen-dragon.solo-action.description: The dragon takes an additional main action on
  their turn. They can use this feature even if they are dazed.
malice.dragon.omen-dragon.burn-it-right-down.name: Burn It Right Down
malice.dragon.omen-dragon.burn-it-right-down.description: Each edge of the encounter map burns with
  intangible purple flames until the end of the encounter. The flames expand by 1 square at the end
  of every turn. Any enemy takes 5 corruption damage for each square of flames they enter.
traits.dragon.crucible-dragon.solo-monster.name: Solo Monster
traits.dragon.crucible-dragon.solo-monster.description: >-
  End Effect: At the end of each of their turns, the dragon can take 10 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The dragon can take two turns each round. They can't take turns consecutively.
traits.dragon.crucible-dragon.magnetized-wyrmscale-aura.name: Magnetized Wyrmscale Aura
traits.dragon.crucible-dragon.magnetized-wyrmscale-aura.description: The dragon's scales create a 3
  aura of magnetism around them that affects large masses of metal. Any creature who enters the area
  for the first time in a round or starts their turn there while wearing metal or while slagged (see
  Slag Spew) is pulled up to 2 squares toward the dragon. A creature pulled this way who has M < 3
  is unable to willingly move away from the dragon.
abilities.dragon.crucible-dragon.slag-spew.name: Slag Spew
abilities.dragon.crucible-dragon.slag-spew.texts.target: Each creature and object in the area
abilities.dragon.crucible-dragon.slag-spew.texts.distance: 10 × 2 line within 1
abilities.dragon.crucible-dragon.slag-spew.texts.roll: Agility test
abilities.dragon.crucible-dragon.slag-spew.texts.tier1: 13 fire damage; the target is slagged (save ends)
abilities.dragon.crucible-dragon.slag-spew.texts.tier2: 10 fire damage; the target is slagged (save ends)
abilities.dragon.crucible-dragon.slag-spew.texts.tier3: 6 fire damage
abilities.dragon.crucible-dragon.slag-spew.texts.effect: >-
  Effect: Each target makes an Agility test.


  A slagged target is coated in molten metal and takes 2d6 fire damage at the start of each of their
  turns. If a slagged target has M < 3 they are restrained (save ends) whenever they take cold
  damage.
abilities.dragon.crucible-dragon.forge-hammer-tail-slam.name: Forge Hammer Tail Slam
abilities.dragon.crucible-dragon.forge-hammer-tail-slam.texts.target: Two creatures or objects
abilities.dragon.crucible-dragon.forge-hammer-tail-slam.texts.distance: Melee 3
abilities.dragon.crucible-dragon.forge-hammer-tail-slam.texts.roll: Power Roll + 4
abilities.dragon.crucible-dragon.forge-hammer-tail-slam.texts.tier1: 11 damage; M < 2 prone
abilities.dragon.crucible-dragon.forge-hammer-tail-slam.texts.tier2: 17 damage; M < 3 prone
abilities.dragon.crucible-dragon.forge-hammer-tail-slam.texts.tier3: 20 damage; M < 4 prone
abilities.dragon.crucible-dragon.forge-hammer-tail-slam.texts.effect: |-
  Effect: The dragon can make a free strike against each slagged target knocked prone this way.

  1 Malice: The strike deals 1d6 cold damage.
traits.dragon.crucible-dragon.heat-buffer.name: Heat Buffer
traits.dragon.crucible-dragon.heat-buffer.description: Once per round while the dragon is flying
  using their Thermodynamic Flight ability, they give off a blast of steam to extend the duration of
  their flight until the end of the next round. Each creature in a 4 cube within 1 underneath the
  dragon when they use this ability takes 7 fire damage.
abilities.dragon.crucible-dragon.thermodynamic-flight.name: Thermodynamic Flight
abilities.dragon.crucible-dragon.thermodynamic-flight.texts.target: Each enemy in the area
abilities.dragon.crucible-dragon.thermodynamic-flight.texts.distance: 2 burst
abilities.dragon.crucible-dragon.thermodynamic-flight.texts.effect: 'Effect: The dragon expels
  blistering steam, dealing 7 fire damage to each target in the area. The dragon then shifts up to
  their speed vertically and can fly until the end of the round.'
abilities.dragon.crucible-dragon.hammer-and-anvil.name: Hammer and Anvil
abilities.dragon.crucible-dragon.hammer-and-anvil.texts.trigger: While flying, the dragon starts their turn or moves.
abilities.dragon.crucible-dragon.hammer-and-anvil.texts.target: Self
abilities.dragon.crucible-dragon.hammer-and-anvil.texts.distance: Self
abilities.dragon.crucible-dragon.hammer-and-anvil.texts.effect: 'Effect: The dragon drops to the
  ground and uses Forge Hammer Tail Slam, which deals an extra 4 damage for each square they
  descended.'
abilities.dragon.crucible-dragon.polarize-aura.name: Polarize Aura
abilities.dragon.crucible-dragon.polarize-aura.texts.trigger: The dragon is targeted by two melee strikes in the current turn.
abilities.dragon.crucible-dragon.polarize-aura.texts.target: Each creature and object in the area
abilities.dragon.crucible-dragon.polarize-aura.texts.distance: 3 burst
abilities.dragon.crucible-dragon.polarize-aura.texts.roll: Power Roll + 4
abilities.dragon.crucible-dragon.polarize-aura.texts.tier1: Push 5
abilities.dragon.crucible-dragon.polarize-aura.texts.tier2: Push 7
abilities.dragon.crucible-dragon.polarize-aura.texts.tier3: Push 10, ignoring stability
abilities.dragon.crucible-dragon.polarize-aura.texts.effect: 'Special: The target must be size 2 or smaller.'
abilities.dragon.crucible-dragon.heart-of-the-forge.name: Heart of the Forge
abilities.dragon.crucible-dragon.heart-of-the-forge.texts.target: Each enemy in the area
abilities.dragon.crucible-dragon.heart-of-the-forge.texts.distance: 6 burst
abilities.dragon.crucible-dragon.heart-of-the-forge.texts.roll: Power Roll + 4
abilities.dragon.crucible-dragon.heart-of-the-forge.texts.tier1: 4 fire damage; I < 2 frightened (save ends)
abilities.dragon.crucible-dragon.heart-of-the-forge.texts.tier2: 6 fire damage; I < 3 frightened (save ends)
abilities.dragon.crucible-dragon.heart-of-the-forge.texts.tier3: 8 fire damage; I < 4 frightened (save ends)
abilities.dragon.crucible-dragon.subdermal-shielding.name: Subdermal Shielding
abilities.dragon.crucible-dragon.subdermal-shielding.texts.target: Self
abilities.dragon.crucible-dragon.subdermal-shielding.texts.distance: Self
abilities.dragon.crucible-dragon.subdermal-shielding.texts.effect: "Effect: Shields embedded under
  the dragon's scales emerge, and the dragon gains damage immunity 6 at the start of each round
  until the end of the encounter. If the dragon takes any damage, they lose this immunity until the
  end of the current round."
abilities.dragon.crucible-dragon.polarity-chaos.name: Polarity Chaos
abilities.dragon.crucible-dragon.polarity-chaos.texts.target: Each creature and object in the area
abilities.dragon.crucible-dragon.polarity-chaos.texts.distance: 10 burst
abilities.dragon.crucible-dragon.polarity-chaos.texts.roll: Might test
abilities.dragon.crucible-dragon.polarity-chaos.texts.tier1: 16 damage; pull 10 or push 10
abilities.dragon.crucible-dragon.polarity-chaos.texts.tier2: 13 damage; pull 8 or push 8
abilities.dragon.crucible-dragon.polarity-chaos.texts.tier3: 7 damage; pull 5 or push 5.
abilities.dragon.crucible-dragon.polarity-chaos.texts.effect: 'Effect: Each target makes a Might test.'
monsters.dragon.crucible-dragon.name: Crucible Dragon
traits.dragon.gloom-dragon.solo-monster.name: Solo Monster
traits.dragon.gloom-dragon.solo-monster.description: >-
  End Effect: At the end of each of their turns, the dragon can take 10 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The dragon can take two turns each round. They can't take turns consecutively.
traits.dragon.gloom-dragon.gloaming-wyrmscale-aura.name: Gloaming Wyrmscale Aura
traits.dragon.gloom-dragon.gloaming-wyrmscale-aura.description: The dragon's scales create a 3 aura
  of dark supernatural fog around them that feeds on their victims' fears and provides concealment
  to the dragon only. Each enemy who starts their turn in the area takes 2 psychic damage.
  Additionally, whenever one or more enemies is in the area, the dragon's abilities deal an extra 3
  psychic damage.
abilities.dragon.gloom-dragon.breath-of-brume.name: Breath of Brume
abilities.dragon.gloom-dragon.breath-of-brume.texts.target: Each enemy and object in the area
abilities.dragon.gloom-dragon.breath-of-brume.texts.distance: 4 cube within 10
abilities.dragon.gloom-dragon.breath-of-brume.texts.roll: Agility test
abilities.dragon.gloom-dragon.breath-of-brume.texts.tier1: 14 cold damage; the target is dragonsealed (save ends)
abilities.dragon.gloom-dragon.breath-of-brume.texts.tier2: 11 cold damage; the target is dragonsealed (save ends)
abilities.dragon.gloom-dragon.breath-of-brume.texts.tier3: 6 cold damage
abilities.dragon.gloom-dragon.breath-of-brume.texts.effect: >-
  Effect: Each target makes an Agility test.


  A dragonsealed creature has psychic weakness 3 and cold weakness 3. Additionally, the area is
  filled with magical darkness. The dragon ignores concealment created by this darkness.
abilities.dragon.gloom-dragon.phantom-tail-swing.name: Phantom Tail Swing
abilities.dragon.gloom-dragon.phantom-tail-swing.texts.target: Two creatures or objects
abilities.dragon.gloom-dragon.phantom-tail-swing.texts.distance: Melee 3
abilities.dragon.gloom-dragon.phantom-tail-swing.texts.roll: Power Roll + 4
abilities.dragon.gloom-dragon.phantom-tail-swing.texts.tier1: 10 psychic damage; pull 2
abilities.dragon.gloom-dragon.phantom-tail-swing.texts.tier2: 15 psychic damage; pull 4
abilities.dragon.gloom-dragon.phantom-tail-swing.texts.tier3: 18 psychic damage; pull 6
abilities.dragon.gloom-dragon.phantom-tail-swing.texts.effect: '3 Malice: The pull becomes a vertical slide.'
traits.dragon.gloom-dragon.shadow-skulk.name: Shadow Skulk
traits.dragon.gloom-dragon.shadow-skulk.description: Once per turn, the dragon can shift up to their
  speed, leaving behind a 4 cube area of magical darkness in their starting space that lasts until
  the end of the encounter. The dragon ignores concealment created by this darkness. Any enemy who
  ends their turn in the area and has I < 3 is frightened of the dragon until the end of their next
  turn.
abilities.dragon.gloom-dragon.visions-in-the-dark.name: Visions in the Dark
abilities.dragon.gloom-dragon.visions-in-the-dark.texts.target: Each enemy in the area
abilities.dragon.gloom-dragon.visions-in-the-dark.texts.distance: 10 burst
abilities.dragon.gloom-dragon.visions-in-the-dark.texts.effect: "Effect: Each target must be
  dragonsealed. Each target takes 3 psychic damage, and if they have I < 3 they immediately make a
  free strike against one ally of the dragon's choice."
abilities.dragon.gloom-dragon.encroaching-darkness.name: Encroaching Darkness
abilities.dragon.gloom-dragon.encroaching-darkness.texts.trigger: A creature within 10 squares moves.
abilities.dragon.gloom-dragon.encroaching-darkness.texts.target: Self
abilities.dragon.gloom-dragon.encroaching-darkness.texts.distance: Self
abilities.dragon.gloom-dragon.encroaching-darkness.texts.effect: 'Effect: The dragon moves two
  existing cubes of magical darkness they created up to 10 squares each.'
abilities.dragon.gloom-dragon.enveloping-umbrage.name: Enveloping Umbrage
abilities.dragon.gloom-dragon.enveloping-umbrage.texts.target: Each enemy in the area
abilities.dragon.gloom-dragon.enveloping-umbrage.texts.distance: 5 burst
abilities.dragon.gloom-dragon.enveloping-umbrage.texts.roll: Power Roll + 4
abilities.dragon.gloom-dragon.enveloping-umbrage.texts.tier1: Pull 2; I < 2 frightened (EoT)
abilities.dragon.gloom-dragon.enveloping-umbrage.texts.tier2: Pull 4; I < 3 frightened (save ends)
abilities.dragon.gloom-dragon.enveloping-umbrage.texts.tier3: Pull 6; I < 4 frightened (save ends)
abilities.dragon.gloom-dragon.pall-of-nightmares.name: Pall of Nightmares
abilities.dragon.gloom-dragon.pall-of-nightmares.texts.target: Each enemy in the area
abilities.dragon.gloom-dragon.pall-of-nightmares.texts.distance: 10 burst
abilities.dragon.gloom-dragon.pall-of-nightmares.texts.roll: Power Roll + 4
abilities.dragon.gloom-dragon.pall-of-nightmares.texts.tier1: 6 psychic damage
abilities.dragon.gloom-dragon.pall-of-nightmares.texts.tier2: 11 psychic damage
abilities.dragon.gloom-dragon.pall-of-nightmares.texts.tier3: 14 psychic damage
abilities.dragon.gloom-dragon.pall-of-nightmares.texts.effect: 'Effect: Each target must be dragonsealed. Any target who has I < 3 is also dazed (save ends).'
abilities.dragon.gloom-dragon.absence-of-all-light.name: Absence of All Light
abilities.dragon.gloom-dragon.absence-of-all-light.texts.target: Special
abilities.dragon.gloom-dragon.absence-of-all-light.texts.distance: Special
abilities.dragon.gloom-dragon.absence-of-all-light.texts.effect: "Effect: The dragon disappears from
  the encounter map. The dragon and three hallucinatory illusions of themself then immediately
  reappear in unoccupied spaces on the encounter map, and the dragon and each illusion uses Breath
  of Brume. Each illusion is indistinguishable from the dragon except by supernatural means, has 1
  Stamina, and has the dragon's speed. An illusion acts on the dragon's turns but can take only move
  actions. Once per round before or after using an ability, the dragon can trade places with any
  duplicate."
monsters.dragon.gloom-dragon.name: Gloom Dragon
traits.dragon.meteor-dragon.solo-monster.name: Solo Monster
traits.dragon.meteor-dragon.solo-monster.description: >-
  End Effect: At the end of each of their turns, the dragon can take 20 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The dragon can take two turns each round. They can't take turns consecutively.
traits.dragon.meteor-dragon.voidshroud-wyrmscale-aura.name: Voidshroud Wyrmscale Aura
traits.dragon.meteor-dragon.voidshroud-wyrmscale-aura.description: The dragon's scales create a 1
  aura of void space around them. Any enemy who starts their turn in the area takes 10 cold damage
  and is suffocating. Each time the dragon takes damage, the area of the aura increases by 1 (to a
  maximum of 5), and they deal an extra 5 damage the next time they use an ability that deals rolled
  damage.
abilities.dragon.meteor-dragon.gravity-well.name: Gravity Well
abilities.dragon.meteor-dragon.gravity-well.texts.target: Each creature and object in the area
abilities.dragon.meteor-dragon.gravity-well.texts.distance: 4 cube within 10
abilities.dragon.meteor-dragon.gravity-well.texts.roll: Might test
abilities.dragon.meteor-dragon.gravity-well.texts.tier1: 20 sonic damage; the target is dragonsealed (save ends)
abilities.dragon.meteor-dragon.gravity-well.texts.tier2: 16 sonic damage; the target is dragonsealed (save ends)
abilities.dragon.meteor-dragon.gravity-well.texts.tier3: 10 sonic damage
abilities.dragon.meteor-dragon.gravity-well.texts.effect: >-
  Effect: Each target makes a Might test.


  A dragonsealed target emits a golden aura, and takes 2 damage per square moved when falling or
  when force moved into an obstacle.
abilities.dragon.meteor-dragon.cosmic-tail-ray.name: Cosmic Tail Ray
abilities.dragon.meteor-dragon.cosmic-tail-ray.texts.target: Two creatures or objects
abilities.dragon.meteor-dragon.cosmic-tail-ray.texts.distance: Melee 2 or ranged 15
abilities.dragon.meteor-dragon.cosmic-tail-ray.texts.roll: Power Roll + 5
abilities.dragon.meteor-dragon.cosmic-tail-ray.texts.tier1: 15 holy damage; A < 4 weakened (save ends)
abilities.dragon.meteor-dragon.cosmic-tail-ray.texts.tier2: 21 holy damage; A < 5 weakened (save ends)
abilities.dragon.meteor-dragon.cosmic-tail-ray.texts.tier3: 25 holy damage; A < 6 weakened (save ends)
abilities.dragon.meteor-dragon.cosmic-tail-ray.texts.effect: 'Effect: If a target made weakened this
  way is already weakened, they are instead dazed until the end of their next turn.'
traits.dragon.meteor-dragon.crescent-claws.name: Crescent Claws
traits.dragon.meteor-dragon.crescent-claws.description: Once per turn, the dragon chooses a target
  within 3 squares. The dragon can make a free strike against the target, and ignores banes when
  using abilities against the target until the start of their next turn.
abilities.dragon.meteor-dragon.investiture-of-gravity.name: Investiture of Gravity
abilities.dragon.meteor-dragon.investiture-of-gravity.texts.target: Each enemy in the area
abilities.dragon.meteor-dragon.investiture-of-gravity.texts.distance: 15 burst
abilities.dragon.meteor-dragon.investiture-of-gravity.texts.effect: 'Effect: Each target must be
  dragonsealed. The dragon chooses a direction and vertical slides each target 10 squares in that
  direction, ignoring stability. A target who strikes an obstacle takes damage as if they had fallen
  the forced movement distance.'
abilities.dragon.meteor-dragon.field-collapse.name: Field Collapse
abilities.dragon.meteor-dragon.field-collapse.texts.trigger: The dragon takes damage from an ability
  while the area of their Voidshroud Wyrmscale Aura is 2 or more.
abilities.dragon.meteor-dragon.field-collapse.texts.target: Self
abilities.dragon.meteor-dragon.field-collapse.texts.distance: Self
abilities.dragon.meteor-dragon.field-collapse.texts.effect: "Effect: The dragon halves the damage.
  Each enemy and object in the area of the dragon's Voidshroud Wyrmscale Aura trait takes 5 sonic
  damage and is pulled up to 5 squares toward the dragon. The area of the wyrmscale aura then resets
  to 1."
abilities.dragon.meteor-dragon.a-hero-faces-the-void.name: A Hero Faces the Void
abilities.dragon.meteor-dragon.a-hero-faces-the-void.texts.trigger: A creature within distance spends their Heroic Resource to use an ability.
abilities.dragon.meteor-dragon.a-hero-faces-the-void.texts.target: The triggering creature
abilities.dragon.meteor-dragon.a-hero-faces-the-void.texts.distance: Ranged 5
abilities.dragon.meteor-dragon.a-hero-faces-the-void.texts.roll: Power Roll + 5
abilities.dragon.meteor-dragon.a-hero-faces-the-void.texts.tier1: 10 psychic damage; P < 4 frightened (save ends)
abilities.dragon.meteor-dragon.a-hero-faces-the-void.texts.tier2: 16 psychic damage; P < 5 frightened (save ends)
abilities.dragon.meteor-dragon.a-hero-faces-the-void.texts.tier3: 20 psychic damage; P < 6 frightened (save ends)
abilities.dragon.meteor-dragon.a-hero-faces-the-void.texts.effect: "Effect: While frightened this way, the target can't use the triggering ability."
abilities.dragon.meteor-dragon.impactful-arrival.name: Impactful Arrival
abilities.dragon.meteor-dragon.impactful-arrival.texts.target: Each creature and object in the area
abilities.dragon.meteor-dragon.impactful-arrival.texts.distance: 1-mile burst
abilities.dragon.meteor-dragon.impactful-arrival.texts.effect: |-
  Effect: Each target takes 30 fire damage, and if they have M < 5, they are knocked prone.

  Special: The dragon can use this ability before the encounter begins.
abilities.dragon.meteor-dragon.burning-aurora.name: Burning Aurora
abilities.dragon.meteor-dragon.burning-aurora.texts.target: Self
abilities.dragon.meteor-dragon.burning-aurora.texts.distance: Self
abilities.dragon.meteor-dragon.burning-aurora.texts.effect: 'Effect: Until the end of the encounter,
  each enemy who is dragonsealed and weakened and who the dragon has line of effect to loses 1 of
  their Heroic Resource at the start of each of their turns (to a minimum of 0). The dragon then
  uses their Cosmic Tail Ray ability with a double edge, targeting four creatures or objects.'
abilities.dragon.meteor-dragon.voidlight-breath.name: Voidlight Breath
abilities.dragon.meteor-dragon.voidlight-breath.texts.target: Each enemy and object in the area
abilities.dragon.meteor-dragon.voidlight-breath.texts.distance: ∞ × 3 line within 1
abilities.dragon.meteor-dragon.voidlight-breath.texts.roll: Agility test
abilities.dragon.meteor-dragon.voidlight-breath.texts.tier1: 25 damage; I < 6 the target is annihilated
abilities.dragon.meteor-dragon.voidlight-breath.texts.tier2: 21 damage; I < 5 the target is annihilated
abilities.dragon.meteor-dragon.voidlight-breath.texts.tier3: 15 damage; I < 4 the target is annihilated
abilities.dragon.meteor-dragon.voidlight-breath.texts.effect: >-
  Effect: Each target makes an Agility test.


  An annihilated target must make the test again, decreasing the potency for themself by 2 each time
  they are annihilated. A creature reduced to 0 Stamina by this dies and their soul is destroyed.
monsters.dragon.meteor-dragon.name: Meteor Dragon
traits.dragon.omen-dragon.solo-monster.name: Solo Monster
traits.dragon.omen-dragon.solo-monster.description: >-
  End Effect: At the end of each of their turns, the dragon can take 15 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The dragon can take two turns each round. They can't take turns consecutively.
traits.dragon.omen-dragon.deathcount.name: Deathcount
traits.dragon.omen-dragon.deathcount.description: Several of the dragon's abilities impose a
  Deathcount on a target. At the end of every turn, a creature with a Deathcount who is within the
  area of the dragon's Stagnant Wyrmscale Aura has that Deathcount reduced by 1. When a creature's
  Deathcount hits 0, they die. If multiple Deathcounts are imposed on a creature, they don't stack.
  Only the lowest Deathcount takes effect. All Deathcounts are lost when the dragon is reduced to 0
  Stamina.
traits.dragon.omen-dragon.stagnant-wyrmscale-aura.name: Stagnant Wyrmscale Aura
traits.dragon.omen-dragon.stagnant-wyrmscale-aura.description: The dragon's scales create a 4 aura
  of supernatural stagnancy around them. The area is difficult terrain for enemies, and no creature
  except the omen dragon can regain Stamina while in the area. Any creature dragonsealed by the omen
  dragon who starts their turn in the dragon's aura and doesn't have a Deathcount gains a Deathcount
  of 12.
abilities.dragon.omen-dragon.corroding-breath.name: Corroding Breath
abilities.dragon.omen-dragon.corroding-breath.texts.target: Each creature and object in the area
abilities.dragon.omen-dragon.corroding-breath.texts.distance: 5 cube within 10
abilities.dragon.omen-dragon.corroding-breath.texts.roll: Agility test
abilities.dragon.omen-dragon.corroding-breath.texts.tier1: 18 corruption damage; the target is dragonsealed (save ends)
abilities.dragon.omen-dragon.corroding-breath.texts.tier2: 14 corruption damage; the target is dragonsealed (save ends)
abilities.dragon.omen-dragon.corroding-breath.texts.tier3: 9 corruption damage
abilities.dragon.omen-dragon.corroding-breath.texts.effect: >-
  Effect: Each target makes an Agility test.


  Only creatures with souls can be dragonsealed by the omen dragon. A dragonsealed creature appears
  ghastly and pale, their Presence score is treated as 1 lower for the purpose of resisting
  potencies, and they can't treat other creatures as allies.
abilities.dragon.omen-dragon.barbed-tail-swing.name: Barbed Tail Swing
abilities.dragon.omen-dragon.barbed-tail-swing.texts.target: Two creatures or objects
abilities.dragon.omen-dragon.barbed-tail-swing.texts.distance: Melee 4
abilities.dragon.omen-dragon.barbed-tail-swing.texts.roll: Power Roll + 5
abilities.dragon.omen-dragon.barbed-tail-swing.texts.tier1: 14 damage; M < 3 bleeding (save ends)
abilities.dragon.omen-dragon.barbed-tail-swing.texts.tier2: 19 damage; M < 4 bleeding (save ends)
abilities.dragon.omen-dragon.barbed-tail-swing.texts.tier3: 23 damage; M < 5 bleeding (save ends)
abilities.dragon.omen-dragon.barbed-tail-swing.texts.effect: '3 Malice: The potency increases by 2, and each target is also pulled up to 5 squares.'
traits.dragon.omen-dragon.death-or-victory.name: Death or Victory
traits.dragon.omen-dragon.death-or-victory.description: Once per turn, the dragon chooses one
  creature with a Deathcount within line of effect. That creature can choose to take 1d6 damage and
  lose a recovery to increase their Deathcount by 5.
abilities.dragon.omen-dragon.detonation.name: Detonation
abilities.dragon.omen-dragon.detonation.texts.target: Each enemy in the area
abilities.dragon.omen-dragon.detonation.texts.distance: 10 burst
abilities.dragon.omen-dragon.detonation.texts.effect: 'Effect: Each target must be dragonsealed.
  Each target takes 9 corruption damage, and the omen dragon regains Stamina equal to half the total
  damage dealt. The target then loses their dragonseal.'
abilities.dragon.omen-dragon.dont-turn-away.name: Don't Turn Away
abilities.dragon.omen-dragon.dont-turn-away.texts.trigger: A creature leaves the area of the dragon's Stagnant Wyrmscale Aura trait.
abilities.dragon.omen-dragon.dont-turn-away.texts.target: Self
abilities.dragon.omen-dragon.dont-turn-away.texts.distance: Self
abilities.dragon.omen-dragon.dont-turn-away.texts.effect: 'Effect: The dragon shifts up to their
  speed, and the Deathcount of each dragonsealed creature who comes adjacent to the dragon during
  this shift is reduced by 1.'
abilities.dragon.omen-dragon.repent.name: Repent!
abilities.dragon.omen-dragon.repent.texts.trigger: A dragonsealed creature within distance deals damage to the dragon.
abilities.dragon.omen-dragon.repent.texts.target: The triggering creature
abilities.dragon.omen-dragon.repent.texts.distance: Ranged 5
abilities.dragon.omen-dragon.repent.texts.effect: 'Effect: The target must choose between making a
  free strike against themself or gaining a Deathcount of 5.'
abilities.dragon.omen-dragon.what-you-deserve.name: What You Deserve
abilities.dragon.omen-dragon.what-you-deserve.texts.target: Each enemy in the area
abilities.dragon.omen-dragon.what-you-deserve.texts.distance: 5 burst
abilities.dragon.omen-dragon.what-you-deserve.texts.roll: Power Roll + 5
abilities.dragon.omen-dragon.what-you-deserve.texts.tier1: Pull 1; the target has a Deathcount of 10
abilities.dragon.omen-dragon.what-you-deserve.texts.tier2: Pull 2; the target has a Deathcount of 8
abilities.dragon.omen-dragon.what-you-deserve.texts.tier3: Pull 3; the target has a Deathcount of 6
abilities.dragon.omen-dragon.what-you-deserve.texts.effect: 'Effect: Each target receives a premonition of their imminent death.'
abilities.dragon.omen-dragon.souls-of-the-broken.name: Souls of the Broken
abilities.dragon.omen-dragon.souls-of-the-broken.texts.target: Five creatures
abilities.dragon.omen-dragon.souls-of-the-broken.texts.distance: Ranged 10
abilities.dragon.omen-dragon.souls-of-the-broken.texts.roll: Power Roll + 5
abilities.dragon.omen-dragon.souls-of-the-broken.texts.tier1: P < 5 frightened (save ends)
abilities.dragon.omen-dragon.souls-of-the-broken.texts.tier2: P < 5 the target moves up to their speed toward the dragon
abilities.dragon.omen-dragon.souls-of-the-broken.texts.tier3: P < 5 the target makes a free strike against the nearest ally
abilities.dragon.omen-dragon.souls-of-the-broken.texts.effect: 'Effect: The dragon spits fragments
  of souls to attempt to possess the targets, making a separate power roll for each target.'
abilities.dragon.omen-dragon.so-long-and-goodnight.name: So Long and Goodnight
abilities.dragon.omen-dragon.so-long-and-goodnight.texts.target: Each creature in the area
abilities.dragon.omen-dragon.so-long-and-goodnight.texts.distance: 6 burst
abilities.dragon.omen-dragon.so-long-and-goodnight.texts.effect: "Effect: Each target must be
  dragonsealed. The dragon's eyes glow with unequalled malevolence, and any target who has a
  Deathcount has that Deathcount reduced to 1."
monsters.dragon.omen-dragon.name: Omen Dragon
traits.dragon.thorn-dragon.solo-monster.name: Solo Monster
traits.dragon.thorn-dragon.solo-monster.description: >-
  End Effect: At the end of each of their turns, the dragon can take 10 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The dragon can take two turns each round. They can't take turns consecutively.
traits.dragon.thorn-dragon.withering-wyrmscale-aura.name: Withering Wyrmscale Aura
traits.dragon.thorn-dragon.withering-wyrmscale-aura.description: The dragon's scales create a 2 aura
  of withering green magic around them. Any creature other than the dragon who regains Stamina in
  the area regains only half the expected amount. Any winded creature who enters the area for the
  first time in a round or starts their turn there takes 1d3 corruption damage.
abilities.dragon.thorn-dragon.virulent-breath.name: Virulent Breath
abilities.dragon.thorn-dragon.virulent-breath.texts.target: Each enemy and object in the area
abilities.dragon.thorn-dragon.virulent-breath.texts.distance: 10 × 1 line within 1
abilities.dragon.thorn-dragon.virulent-breath.texts.roll: Might test
abilities.dragon.thorn-dragon.virulent-breath.texts.tier1: 12 poison damage; the target is dragonsealed (save ends)
abilities.dragon.thorn-dragon.virulent-breath.texts.tier2: 9 poison damage; the target is dragonsealed (save ends)
abilities.dragon.thorn-dragon.virulent-breath.texts.tier3: 5 poison damage
abilities.dragon.thorn-dragon.virulent-breath.texts.effect: >-
  Effect: Each target makes a Might test.


  A dragonsealed creature has their wounds bound by nettles and thorns, causing them to take an
  extra 1d3 damage whenever they take damage rolled as a d6 or a d3.
abilities.dragon.thorn-dragon.spinous-tail-swing.name: Spinous Tail Swing
abilities.dragon.thorn-dragon.spinous-tail-swing.texts.target: Two creatures or objects
abilities.dragon.thorn-dragon.spinous-tail-swing.texts.distance: Melee 2
abilities.dragon.thorn-dragon.spinous-tail-swing.texts.roll: Power Roll + 3
abilities.dragon.thorn-dragon.spinous-tail-swing.texts.tier1: 8 damage; push 2
abilities.dragon.thorn-dragon.spinous-tail-swing.texts.tier2: 12 damage; push 4
abilities.dragon.thorn-dragon.spinous-tail-swing.texts.tier3: 15 damage; push 8
abilities.dragon.thorn-dragon.spinous-tail-swing.texts.effect: '2 Malice: Each target takes an extra
  1d3 damage, and if they have A < 2, they are bleeding (save ends).'
traits.dragon.thorn-dragon.provoking-nettles.name: Provoking Nettles
traits.dragon.thorn-dragon.provoking-nettles.description: Once per turn, the dragon shifts up to 5
  squares and can move through enemies' spaces at their usual speed. The first time the dragon moves
  through an enemy's space during this movement, the enemy takes 3 damage.
abilities.dragon.thorn-dragon.investiture-of-verdure.name: Investiture of Verdure
abilities.dragon.thorn-dragon.investiture-of-verdure.texts.target: Each enemy in the area
abilities.dragon.thorn-dragon.investiture-of-verdure.texts.distance: 10 burst
abilities.dragon.thorn-dragon.investiture-of-verdure.texts.effect: 'Effect: Each target must be
  dragonsealed. Each target is pulled up to 5 squares toward the dragon, who gains 5 temporary
  Stamina for each target pulled.'
abilities.dragon.thorn-dragon.prickly-situation.name: Prickly Situation
abilities.dragon.thorn-dragon.prickly-situation.texts.trigger: A dragonsealed creature within distance ends the dragonsealed effect.
abilities.dragon.thorn-dragon.prickly-situation.texts.target: The triggering creature
abilities.dragon.thorn-dragon.prickly-situation.texts.distance: Ranged 10
abilities.dragon.thorn-dragon.prickly-situation.texts.effect: 'Effect: The target is pulled up to 5
  squares toward the dragon, and if they have A < 2, they are restrained until the end of their next
  turn.'
abilities.dragon.thorn-dragon.thorny-scales.name: Thorny Scales
abilities.dragon.thorn-dragon.thorny-scales.texts.trigger: A creature within distance deals damage to the dragon with a melee strike.
abilities.dragon.thorn-dragon.thorny-scales.texts.target: The triggering creature
abilities.dragon.thorn-dragon.thorny-scales.texts.distance: Melee 1
abilities.dragon.thorn-dragon.thorny-scales.texts.effect: 'Effect: The dragon makes a free strike
  against the target, and if the target has M < 2, they are bleeding until the end of their next
  turn.'
abilities.dragon.thorn-dragon.briar-bindings.name: Briar Bindings
abilities.dragon.thorn-dragon.briar-bindings.texts.target: Each enemy in the area
abilities.dragon.thorn-dragon.briar-bindings.texts.distance: 4 burst
abilities.dragon.thorn-dragon.briar-bindings.texts.roll: Power Roll + 3
abilities.dragon.thorn-dragon.briar-bindings.texts.tier1: 5 damage; A < 1 restrained (save ends)
abilities.dragon.thorn-dragon.briar-bindings.texts.tier2: 9 damage; A < 2 restrained (save ends)
abilities.dragon.thorn-dragon.briar-bindings.texts.tier3: 12 damage; A < 3 restrained (save ends)
abilities.dragon.thorn-dragon.thorned-armor.name: Thorned Armor
abilities.dragon.thorn-dragon.thorned-armor.texts.target: Self
abilities.dragon.thorn-dragon.thorned-armor.texts.distance: Self
abilities.dragon.thorn-dragon.thorned-armor.texts.effect: "Effect: The thorns upon the dragon's
  scales grow longer and sharper. Until the end of the encounter, any adjacent creature who targets
  the dragon with a melee strike takes 3 damage. The dragon then uses their Provoking Nettles
  ability."
abilities.dragon.thorn-dragon.malign-thicket.name: Malign Thicket
abilities.dragon.thorn-dragon.malign-thicket.texts.target: Special
abilities.dragon.thorn-dragon.malign-thicket.texts.distance: Special
abilities.dragon.thorn-dragon.malign-thicket.texts.effect: >-
  Effect: Poisonous overgrowth and seeking vines cover all surfaces on the encounter map. The dragon
  uses their Bramble Barricade Malice feature twice at no cost. Until the end of the encounter, any
  creature force moved by the dragon takes 1d3 poison damage, and if they have M < 2, they are
  weakened (save ends).


  Special: If the Thorn Dragon's Domain trait is in effect, any creature other than the dragon who
  starts their turn on the encounter map takes 1d3 poison damage.
monsters.dragon.thorn-dragon.name: Thorn Dragon
malice.dragon.thorn-dragon.cage-of-thorns.name: Cage of Thorns
malice.dragon.thorn-dragon.cage-of-thorns.description: A cage of thorns grows around one
  dragonsealed enemy on the encounter map, making that enemy restrained until the end of their next
  turn.
malice.dragon.thorn-dragon.bramble-barricade.name: Bramble Barricade
malice.dragon.thorn-dragon.bramble-barricade.description: The dragon grows a 10 wall of briars in
  unoccupied spaces on the encounter map. The wall blocks line of effect for all creatures except
  the dragon. Each square of the wall has 5 Stamina and fire weakness 5. The area can be moved
  through but is difficult terrain. Any creature who is force moved into or within the area takes 1
  damage for each square of the area entered and is bleeding until the end of their next turn.
malice.dragon.thorn-dragon.solo-action.name: Solo Action
malice.dragon.thorn-dragon.solo-action.description: The dragon takes an additional main action on
  their turn. They can use this feature even if they are dazed.
malice.dragon.thorn-dragon.afflictive-overgrowth.name: Afflictive Overgrowth
malice.dragon.thorn-dragon.afflictive-overgrowth.description: The dragon summons poisonous, biting
  thorns around their foes. Each enemy on the encounter map makes an Agility test.
malice.dragon.thorn-dragon.afflictive-overgrowth.texts.tier1: 12 poison damage; restrained (save ends)
malice.dragon.thorn-dragon.afflictive-overgrowth.texts.tier2: 9 poison damage; bleeding (save ends)
malice.dragon.thorn-dragon.afflictive-overgrowth.texts.tier3: 5 poison damage; bleeding (EoT)
traits.dragon.thorn-dragon.thorn-dragons-domain.name: Thorn Dragon's Domain
traits.dragon.thorn-dragon.thorn-dragons-domain.description: If the encounter map is a location the dragon has occupied for 1 week or more, all surfaces on the map are covered in overgrowth. Any creature other than the dragon who starts their turn on the encounter map has their speed reduced by 2 (to a minimum of 1). Any creature made restrained while on the ground is also made bleeding.
effects.dragon.thorn-dragonsealed.name: Dragonsealed
effects.dragon.thorn-dragonsealed.description: A dragonsealed creature has their wounds bound by nettles and thorns, causing them to take an extra 1d3 damage whenever they take damage rolled as a d6 or a d3.
traits.dragon.gloom-dragon.gloom-dragons-domain.name: Gloom Dragon's Domain
traits.dragon.gloom-dragon.gloom-dragons-domain.description: If the encounter map is a location the dragon has occupied for 1 week or more, illusory magic suffuses the location with shadowy malevolence. Each creature on the encounter map other than the dragon takes a −2 penalty to saving throws made to end the frightened condition. Additionally, whenever a frightened enemy on the encounter map takes damage, they take an extra 3 psychic damage.
effects.dragon.gloom-dragonsealed.name: Dragonsealed
effects.dragon.gloom-dragonsealed.description: A dragonsealed creature has psychic weakness 3 and cold weakness 3.
traits.dragon.crucible-dragon.crucible-dragons-domain.name: Crucible Dragon's Domain
traits.dragon.crucible-dragon.crucible-dragons-domain.description: If the encounter map is a location the dragon has occupied for 1 week or more, melted metal and blades coat nearly every surface. Any creature other than the dragon who starts their turn in physical contact with a surface on the encounter map takes 5 damage. Such creatures take an additional 5 damage when they take damage from being force moved into a surface on the map. Whenever an enemy in the encounter uses an ability that deals lightning damage, they take 1d6 damage to themself and each enemy and object adjacent to them.
effects.dragon.slagged.name: Slagged
effects.dragon.slagged.description: A slagged target is coated in molten metal and takes 2d6 fire damage at the start of each of their turns. If a slagged target has M < 3 they are restrained (save ends) whenever they take cold damage.
effects.dragon.subdermal-shielding.name: Subdermal Shielding
effects.dragon.subdermal-shielding.description: The dragon gains damage immunity 6 at the start of each round until the end of the encounter. If the dragon takes any damage, they lose this immunity until the end of the current round.
traits.dragon.omen-dragon.omen-dragons-domain.name: Omen Dragon's Domain
traits.dragon.omen-dragon.omen-dragons-domain.description: If the encounter map is a location the dragon has occupied for 1 week or more, any creature on the map who regains Stamina regains only half the expected amount. Additionally, when a creature on the map who has a soul dies, the dragon absorbs the soul, granting the Director 1 Malice. The creature can't be brought back to life until the dragon is destroyed.
effects.dragon.omen-dragonsealed.name: Dragonsealed
effects.dragon.omen-dragonsealed.description: A dragonsealed creature appears ghastly and pale, their Presence score is treated as 1 lower for the purpose of resisting potencies, and they can't treat other creatures as allies.
effects.dragon.deathcount.name: Deathcount
effects.dragon.deathcount.description: At the end of every turn, a creature with a Deathcount who is within the area of the omen dragon's Stagnant Wyrmscale Aura has that Deathcount reduced by 1. When a creature's Deathcount hits 0, they die. If multiple Deathcounts are imposed on a creature, they don't stack. Only the lowest Deathcount takes effect. All Deathcounts are lost when the dragon is reduced to 0 Stamina.
effects.dragon.deathcount.state.amount.name: Deathcount
traits.dragon.meteor-dragon.meteor-dragons-domain.name: Meteor Dragon's Domain
traits.dragon.meteor-dragon.meteor-dragons-domain.description: If the encounter map is a location the dragon has occupied for 1 week or more, each creature other than the dragon has their stability reduced to 0 and automatically obtains a tier 1 outcome on Agility tests. Additionally, any creature who is suffocating during the encounter takes an extra 1d6 damage at the end of each round.
effects.dragon.meteor-dragonsealed.name: Dragonsealed
effects.dragon.meteor-dragonsealed.description: A dragonsealed target emits a golden aura, and takes 2 damage per square moved when falling or when force moved into an obstacle.
abilities.dragon.malice.black-skies.name: Black Skies
abilities.dragon.malice.black-skies.texts.target: Self
abilities.dragon.malice.black-skies.texts.distance: Self
abilities.dragon.malice.black-skies.texts.effect: >-
  The dragon expands their wings to create a shroud of shadow. Until the start of the
  dragon's next turn, any strike made against them takes a bane.
effects.dragon.black-skies.name: Black Skies
effects.dragon.black-skies.description: Any strike made against the dragon takes a bane.
