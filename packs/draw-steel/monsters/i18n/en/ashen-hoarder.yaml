malice.ashen-hoarder.relentless-strikes.name: Relentless Strikes
malice.ashen-hoarder.relentless-strikes.description: The ashen hoarder moves up to their speed and can make a free strike against two targets.
malice.ashen-hoarder.blade-wall.name: Blade Wall
malice.ashen-hoarder.blade-wall.description: The ashen hoarder summons a 10 wall of bones and blades
  into unoccupied squares within 5 squares of them. Each square of the wall has 5 Stamina. An enemy
  who comes adjacent to the wall for the first time in a round or starts their turn there takes 3
  damage.
malice.ashen-hoarder.solo-action.name: Solo Action
malice.ashen-hoarder.solo-action.description: The ashen hoarder takes an additional main action on
  their turn. They can use this feature even if they are dazed.
malice.ashen-hoarder.bone-storm.name: Bone Storm
malice.ashen-hoarder.bone-storm.description: The ashen hoarder launches bone lances into the air,
  raining them down on enemies and impaling those unlucky enough to be on the receiving end. Each
  enemy within 20 squares of the ashen hoarder makes an Agility test.
malice.ashen-hoarder.bone-storm.texts.tier1: 14 damage; restrained and bleeding (save ends)
malice.ashen-hoarder.bone-storm.texts.tier2: 11 damage; bleeding (EoT)
malice.ashen-hoarder.bone-storm.texts.tier3: 6 damage
traits.ashen-hoarder.ashen-hoarder.solo-monster.name: Solo Monster
traits.ashen-hoarder.ashen-hoarder.solo-monster.description: >-
  End Effect: At the end of each of their turns, the ashen hoarder can take 10 damage to end one
  effect on them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The ashen hoarder can take two turns each round. They can't take turns consecutively.
abilities.ashen-hoarder.ashen-hoarder.claw-and-blade.name: Claw and Blade
abilities.ashen-hoarder.ashen-hoarder.claw-and-blade.texts.target: Two creatures or objects
abilities.ashen-hoarder.ashen-hoarder.claw-and-blade.texts.distance: Melee 2
abilities.ashen-hoarder.ashen-hoarder.claw-and-blade.texts.roll: Power Roll + 4
abilities.ashen-hoarder.ashen-hoarder.claw-and-blade.texts.tier1: 10 damage; if one target has M < 2
  they are bleeding (save ends); if the other target has A < 2 they are grabbed
abilities.ashen-hoarder.ashen-hoarder.claw-and-blade.texts.tier2: 15 damage; if one target has M < 3
  they are bleeding (save ends); if the other target has A < 3 they are grabbed
abilities.ashen-hoarder.ashen-hoarder.claw-and-blade.texts.tier3: 18 damage; M < 4 bleeding (save ends); A < 2 grabbed
abilities.ashen-hoarder.ashen-hoarder.claw-and-blade.texts.effect: 'Effect: The ashen hoarder can have up to two size 1 creatures grabbed at a time.'
abilities.ashen-hoarder.ashen-hoarder.corpse-bomb.name: Corpse Bomb
abilities.ashen-hoarder.ashen-hoarder.corpse-bomb.texts.target: Each enemy in the area
abilities.ashen-hoarder.ashen-hoarder.corpse-bomb.texts.distance: 4 cube within 20
abilities.ashen-hoarder.ashen-hoarder.corpse-bomb.texts.roll: Power Roll + 4
abilities.ashen-hoarder.ashen-hoarder.corpse-bomb.texts.tier1: 4 damage; A < 2 weakened (save ends)
abilities.ashen-hoarder.ashen-hoarder.corpse-bomb.texts.tier2: 8 damage; A < 3 weakened (save ends)
abilities.ashen-hoarder.ashen-hoarder.corpse-bomb.texts.tier3: 11 damage; A < 4 weakened (save ends)
abilities.ashen-hoarder.ashen-hoarder.corpse-bomb.texts.effect: |-
  2 Malice: Any enemy weakened this way is instead slowed and weakened (save ends).

  3 Malice: The ashen hoarder targets a second 4 cube within distance.
abilities.ashen-hoarder.ashen-hoarder.impale.name: Impale
abilities.ashen-hoarder.ashen-hoarder.impale.texts.target: Each creature in the area
abilities.ashen-hoarder.ashen-hoarder.impale.texts.distance: 4 × 1 line within 1
abilities.ashen-hoarder.ashen-hoarder.impale.texts.roll: Power Roll + 4
abilities.ashen-hoarder.ashen-hoarder.impale.texts.tier1: 6 corruption damage; M < 2 the target is impaled (save ends)
abilities.ashen-hoarder.ashen-hoarder.impale.texts.tier2: 11 corruption damage; M < 3 the target is impaled (save ends)
abilities.ashen-hoarder.ashen-hoarder.impale.texts.tier3: 14 corruption damage; M < 4 the target is impaled (save ends)
abilities.ashen-hoarder.ashen-hoarder.impale.texts.effect: 'Effect: An impaled creature is
  restrained and bleeding, and moves with the ashen hoarder. The ashen hoarder can have three
  creatures impaled with this ability at a time.'
abilities.ashen-hoarder.ashen-hoarder.bone-dozer.name: Bone Dozer
abilities.ashen-hoarder.ashen-hoarder.bone-dozer.texts.target: Self
abilities.ashen-hoarder.ashen-hoarder.bone-dozer.texts.distance: Self
abilities.ashen-hoarder.ashen-hoarder.bone-dozer.texts.effect: 'Effect: The ashen hoarder moves up
  to twice their speed in a straight line. Each creature or object in the path of this movement is
  either pushed into the nearest unoccupied space outside the path, or if they have M < 3 is pushed
  forward until the movement ends. Any creature who is force moved forward into an obstacle is dazed
  (save ends).'
abilities.ashen-hoarder.ashen-hoarder.armor-of-corpses.name: Armor of Corpses
abilities.ashen-hoarder.ashen-hoarder.armor-of-corpses.texts.trigger: The ashen hoarder takes damage.
abilities.ashen-hoarder.ashen-hoarder.armor-of-corpses.texts.target: Self
abilities.ashen-hoarder.ashen-hoarder.armor-of-corpses.texts.distance: Self
abilities.ashen-hoarder.ashen-hoarder.armor-of-corpses.texts.effect: 'Effect: The ashen hoarder
  halves the damage. If the ashen hoarder has one or more creatures impaled, the Malice cost of this
  feature is reduced by 1 and one impaled creature takes the other half of the damage.'
traits.ashen-hoarder.ashen-hoarder.bladed-body.name: Bladed Body
traits.ashen-hoarder.ashen-hoarder.bladed-body.description: An adjacent enemy who grabs the ashen hoarder or uses a melee ability against them takes 3 damage.
traits.ashen-hoarder.ashen-hoarder.soul-singularity.name: Soul Singularity
traits.ashen-hoarder.ashen-hoarder.soul-singularity.description: When the ashen hoarder is reduced
  to 0 Stamina, they explode in a swirling singularity of bone shards and soul energy. Each creature
  within 5 squares of the ashen hoarder who has M < 3 takes 11 corruption damage. A creature killed
  by this damage has their soul sucked into the vortex and lost somewhere in the Abyssal Wasteland,
  and can't be brought back to life until their soul is recovered.
abilities.ashen-hoarder.ashen-hoarder.skeletal-eruption.name: Skeletal Eruption
abilities.ashen-hoarder.ashen-hoarder.skeletal-eruption.texts.target: Each creature and object in the area
abilities.ashen-hoarder.ashen-hoarder.skeletal-eruption.texts.distance: 8 × 3 line within 1
abilities.ashen-hoarder.ashen-hoarder.skeletal-eruption.texts.roll: Power Roll + 4
abilities.ashen-hoarder.ashen-hoarder.skeletal-eruption.texts.tier1: 6 damage, vertical push 2
abilities.ashen-hoarder.ashen-hoarder.skeletal-eruption.texts.tier2: 11 damage, vertical push 2
abilities.ashen-hoarder.ashen-hoarder.skeletal-eruption.texts.tier3: 14 damage, vertical push 3
abilities.ashen-hoarder.ashen-hoarder.skeletal-eruption.texts.effect: 'Effect: Each target is force
  moved straight up, then falls. A target who would normally land prone after falling is instead
  restrained (save ends).'
abilities.ashen-hoarder.ashen-hoarder.mobile-mine-field.name: Mobile Mine Field
abilities.ashen-hoarder.ashen-hoarder.mobile-mine-field.texts.target: 'Special'
abilities.ashen-hoarder.ashen-hoarder.mobile-mine-field.texts.distance: 10 cube within 20
abilities.ashen-hoarder.ashen-hoarder.mobile-mine-field.texts.effect: "Effect: The ashen hoarder
  sprays out six size 1M zombie mines that appear in unoccupied squares within distance. Any enemy
  who moves adjacent to a zombie mine for the first time in a round or starts their turn there
  causes the mine to explode, dealing 4 corruption damage to each creature adjacent to the mine. Any
  other zombie mines adjacent to the exploding mine also explode. At the start of each of the ashen
  hoarder's turns, each unexploded zombie mine can be moved up to 2 squares."
abilities.ashen-hoarder.ashen-hoarder.ossuary-assault.name: Ossuary Assault
abilities.ashen-hoarder.ashen-hoarder.ossuary-assault.texts.target: Self
abilities.ashen-hoarder.ashen-hoarder.ossuary-assault.texts.distance: Self; see below
abilities.ashen-hoarder.ashen-hoarder.ossuary-assault.texts.effect: 'Effect: The ashen hoarder moves
  up to their speed and uses Claw and Blade with a double edge against one target. On a tier 3
  outcome, the ashen hoarder can use Impale without spending Malice.'
monsters.ashen-hoarder.ashen-hoarder.name: Ashen Hoarder
effects.ashen-hoarder.impaled.name: Impaled
effects.ashen-hoarder.impaled.description: An impaled creature is restrained and bleeding, and moves with the ashen hoarder.
