abilities.valok.multivok-bodyguard.gatling-bolt-gun.name: Gatling Bolt Gun
abilities.valok.multivok-bodyguard.gatling-bolt-gun.texts.target: Two creatures or objects
abilities.valok.multivok-bodyguard.gatling-bolt-gun.texts.distance: Ranged 10
abilities.valok.multivok-bodyguard.gatling-bolt-gun.texts.roll: Power Roll + 4
abilities.valok.multivok-bodyguard.gatling-bolt-gun.texts.tier1: 13 damage
abilities.valok.multivok-bodyguard.gatling-bolt-gun.texts.tier2: 18 damage
abilities.valok.multivok-bodyguard.gatling-bolt-gun.texts.tier3: 22 damage; A < 4 bleeding (save ends)
abilities.valok.multivok-bodyguard.valiar-axe.name: Valiar Axe
abilities.valok.multivok-bodyguard.valiar-axe.texts.target: One creature or object
abilities.valok.multivok-bodyguard.valiar-axe.texts.distance: Melee 2
abilities.valok.multivok-bodyguard.valiar-axe.texts.roll: Power Roll + 4
abilities.valok.multivok-bodyguard.valiar-axe.texts.tier1: 15 damage; M < 2 weakened (save ends)
abilities.valok.multivok-bodyguard.valiar-axe.texts.tier2: 21 damage; M < 3 weakened (save ends)
abilities.valok.multivok-bodyguard.valiar-axe.texts.tier3: 26 damage; prone; M < 4 weakened (save ends)
abilities.valok.multivok-bodyguard.valiar-axe.texts.effect: 'Effect: The bodyguard has a double edge
  on this ability if it was previously used against the same target in this encounter.'
abilities.valok.multivok-bodyguard.magnetic-pull.name: Magnetic Pull
abilities.valok.multivok-bodyguard.magnetic-pull.texts.target: Each enemy and object in the area
abilities.valok.multivok-bodyguard.magnetic-pull.texts.distance: 10 burst
abilities.valok.multivok-bodyguard.magnetic-pull.texts.effect: >-
  Special: This ability targets only metal-clad enemies and metal objects of size 3 or smaller.


  Effect: Each target is pulled up to 8 squares, or if they have M < 3, they are pulled up to 15
  squares. The bodyguard can make a free strike against each target who ends this forced movement
  adjacent to them.
abilities.valok.multivok-bodyguard.valiar-cloak.name: Valiar Cloak
abilities.valok.multivok-bodyguard.valiar-cloak.texts.trigger: One ally within distance is targeted
  by an enemy's ability. The bodyguard can use this ability after seeing the outcome of the power
  roll.
abilities.valok.multivok-bodyguard.valiar-cloak.texts.target: Self
abilities.valok.multivok-bodyguard.valiar-cloak.texts.distance: Melee 2
abilities.valok.multivok-bodyguard.valiar-cloak.texts.effect: "Effect: The bodyguard becomes the triggering ability's target instead."
traits.valok.multivok-bodyguard.multivok-maintenance.name: Multivok Maintenance
traits.valok.multivok-bodyguard.multivok-maintenance.description: At the start of the bodyguard's turn, each servok within 2 squares of them regains 15 Stamina.
traits.valok.multivok-bodyguard.crafted-to-perfection.name: Crafted to Perfection
traits.valok.multivok-bodyguard.crafted-to-perfection.description: The bodyguard's shape can't be changed by any external effect.
traits.valok.multivok-bodyguard.valiar-might.name: Valiar Might
traits.valok.multivok-bodyguard.valiar-might.description: While the bodyguard isn't bleeding,
  weakened, or winded, any power roll made against them is automatically a tier 1 outcome. A
  critical hit still grants its additional main action.
monsters.valok.multivok-bodyguard.name: Multivok Bodyguard
abilities.valok.multivok-chief.pneumatic-punch.name: Pneumatic Punch
abilities.valok.multivok-chief.pneumatic-punch.texts.target: Two creatures or objects
abilities.valok.multivok-chief.pneumatic-punch.texts.distance: Melee 2
abilities.valok.multivok-chief.pneumatic-punch.texts.roll: Power Roll + 4
abilities.valok.multivok-chief.pneumatic-punch.texts.tier1: 13 damage; push 3
abilities.valok.multivok-chief.pneumatic-punch.texts.tier2: 18 damage; push 5
abilities.valok.multivok-chief.pneumatic-punch.texts.tier3: 22 damage; push 8
abilities.valok.multivok-chief.targeting-beam.name: Targeting Beam
abilities.valok.multivok-chief.targeting-beam.texts.target: One creature or object
abilities.valok.multivok-chief.targeting-beam.texts.distance: Ranged 10
abilities.valok.multivok-chief.targeting-beam.texts.roll: Power Roll + 4
abilities.valok.multivok-chief.targeting-beam.texts.tier1: 15 damage; A < 2 slowed (save ends)
abilities.valok.multivok-chief.targeting-beam.texts.tier2: 21 damage; A < 3 slowed (save ends)
abilities.valok.multivok-chief.targeting-beam.texts.tier3: 26 damage; A < 4 slowed (save ends)
abilities.valok.multivok-chief.targeting-beam.texts.effect: "Effect: This damage can't be reduced in
  any way. While a target is slowed this way, any strike against them has a double edge."
abilities.valok.multivok-chief.chiefs-command.name: Chief's Command
abilities.valok.multivok-chief.chiefs-command.texts.target: One ally
abilities.valok.multivok-chief.chiefs-command.texts.distance: Ranged 5
abilities.valok.multivok-chief.chiefs-command.texts.effect: 'Effect: The target shifts up to their speed and can use a main action.'
abilities.valok.multivok-chief.quick-shield.name: Quick Shield
abilities.valok.multivok-chief.quick-shield.texts.trigger: The chief or an ally within distance is
  subject to an effect that can be ended by a saving throw or that ends at the end of their turn.
abilities.valok.multivok-chief.quick-shield.texts.target: The triggering creature
abilities.valok.multivok-chief.quick-shield.texts.distance: Ranged 10
abilities.valok.multivok-chief.quick-shield.texts.effect: 'Effect: The target gains 15 temporary
  Stamina. Each time this triggered action is used, the amount of temporary Stamina received
  decreases by 3 (to a minimum of 0).'
traits.valok.multivok-chief.multivok-maintenance.name: Multivok Maintenance
traits.valok.multivok-chief.multivok-maintenance.description: At the start of the chief's turn, each servok within 2 squares of them regains 15 Stamina.
traits.valok.multivok-chief.crafted-to-perfection.name: Crafted to Perfection
traits.valok.multivok-chief.crafted-to-perfection.description: The chief's shape can't be changed by any external effect.
traits.valok.multivok-chief.valiar-might.name: Valiar Might
traits.valok.multivok-chief.valiar-might.description: While the chief isn't bleeding, weakened, or
  winded, any power roll made against them is automatically a tier 1 outcome. A critical hit still
  grants its additional main action.
monsters.valok.multivok-chief.name: Multivok Chief
abilities.valok.servok-builder.wrecking-ball.name: Wrecking Ball
abilities.valok.servok-builder.wrecking-ball.texts.target: Each enemy and object in the area
abilities.valok.servok-builder.wrecking-ball.texts.distance: 3 cube within 5
abilities.valok.servok-builder.wrecking-ball.texts.tier1: 15 damage; push 5, prone
abilities.valok.servok-builder.wrecking-ball.texts.tier2: 12 damage; push 3
abilities.valok.servok-builder.wrecking-ball.texts.tier3: 8 damage
abilities.valok.servok-builder.wrecking-ball.texts.effect: 'Effect: Each target must make either an Agility test or an Intuition test.'
abilities.valok.servok-builder.construction-arm.name: Construction Arm
abilities.valok.servok-builder.construction-arm.texts.target: One creature or object
abilities.valok.servok-builder.construction-arm.texts.distance: Melee 3
abilities.valok.servok-builder.construction-arm.texts.roll: Power Roll + 4
abilities.valok.servok-builder.construction-arm.texts.tier1: 16 damage
abilities.valok.servok-builder.construction-arm.texts.tier2: 23 damage; grabbed
abilities.valok.servok-builder.construction-arm.texts.tier3: 28 damage; grabbed; M < 4 vertical push 5
abilities.valok.servok-builder.lay-the-foundation.name: Lay the Foundation
abilities.valok.servok-builder.lay-the-foundation.texts.target: Special
abilities.valok.servok-builder.lay-the-foundation.texts.distance: 6 × 3 line within 1
abilities.valok.servok-builder.lay-the-foundation.texts.roll: Might test
abilities.valok.servok-builder.lay-the-foundation.texts.tier1: Restrained (EoT)
abilities.valok.servok-builder.lay-the-foundation.texts.tier2: Slowed (EoT)
abilities.valok.servok-builder.lay-the-foundation.texts.tier3: No effect
abilities.valok.servok-builder.lay-the-foundation.texts.effect: 'Effect: The area is covered in wet
  concrete and is difficult terrain. An enemy who starts their turn in the concrete makes a Might
  test.'
abilities.valok.servok-builder.build-wall.name: Build Wall
abilities.valok.servok-builder.build-wall.texts.target: Special
abilities.valok.servok-builder.build-wall.texts.distance: 6 wall within 3
abilities.valok.servok-builder.build-wall.texts.effect: 'Effect: The builder creates a concrete
  wall. They can also remove any unoccupied squares of wet concrete within 3 squares of them,
  creating two additional squares of wall for each square of concrete removed.'
abilities.valok.servok-builder.sputter.name: Sputter
abilities.valok.servok-builder.sputter.texts.trigger: A creature or object within distance deals damage to the builder.
abilities.valok.servok-builder.sputter.texts.target: The triggering creature or object
abilities.valok.servok-builder.sputter.texts.distance: Melee 3
abilities.valok.servok-builder.sputter.texts.roll: Power Roll + 4
abilities.valok.servok-builder.sputter.texts.tier1: A < 2 restrained (save ends)
abilities.valok.servok-builder.sputter.texts.tier2: A < 3 restrained (save ends)
abilities.valok.servok-builder.sputter.texts.tier3: A < 4 restrained (save ends)
abilities.valok.servok-builder.sputter.texts.effect: 'Effect: While a creature is restrained this
  way, or if the target is an object, the target and their space are encased in wet concrete. A
  creature no longer restrained leaves squares of wet concrete behind.'
traits.valok.servok-builder.servok-siege-machine.name: Servok Siege Machine
traits.valok.servok-builder.servok-siege-machine.description: The builder ignores difficult terrain, and their abilities deal an extra 15 damage to objects.
traits.valok.servok-builder.crafted-to-perfection.name: Crafted to Perfection
traits.valok.servok-builder.crafted-to-perfection.description: The builder's shape can't be changed by any external effect.
traits.valok.servok-builder.valiar-might.name: Valiar Might
traits.valok.servok-builder.valiar-might.description: While the builder isn't bleeding, weakened, or
  winded, any power roll made against them is automatically a tier 1 outcome. A critical hit still
  grants its additional main action.
monsters.valok.servok-builder.name: Servok Builder
abilities.valok.servok-miner.drill-press.name: Drill Press
abilities.valok.servok-miner.drill-press.texts.target: Two creatures or objects
abilities.valok.servok-miner.drill-press.texts.distance: Melee 2
abilities.valok.servok-miner.drill-press.texts.roll: Power Roll + 4
abilities.valok.servok-miner.drill-press.texts.tier1: 13 damage; M < 2 restrained (save ends) and prone
abilities.valok.servok-miner.drill-press.texts.tier2: 18 damage; M < 3 restrained (save ends) and prone
abilities.valok.servok-miner.drill-press.texts.tier3: 22 damage; prone; M < 4 restrained (save ends)
abilities.valok.servok-miner.drill-press.texts.effect: 'Effect: In suitably soft ground, a target
  restrained this way is etrenched in a 1-square-deep hole.'
abilities.valok.servok-miner.unload-rocks.name: Unload Rocks
abilities.valok.servok-miner.unload-rocks.texts.target: Each enemy and object in the area
abilities.valok.servok-miner.unload-rocks.texts.distance: 4 cube within 1
abilities.valok.servok-miner.unload-rocks.texts.roll: Agility test
abilities.valok.servok-miner.unload-rocks.texts.tier1: 14 damage; slide 4; the miner's allies have concealment from the target (save ends)
abilities.valok.servok-miner.unload-rocks.texts.tier2: 11 damage; slide 2
abilities.valok.servok-miner.unload-rocks.texts.tier3: 7 damage
abilities.valok.servok-miner.unload-rocks.texts.effect: |-
  Effect: Each target makes an Agility test.

  The area is difficult terrain.
abilities.valok.servok-miner.break-ground.name: Break Ground
abilities.valok.servok-miner.break-ground.texts.target: Each enemy and object in the area
abilities.valok.servok-miner.break-ground.texts.distance: 20 × 1 line within 1
abilities.valok.servok-miner.break-ground.texts.roll: Agility test
abilities.valok.servok-miner.break-ground.texts.tier1: 14 damage; the target falls into the fissure, and is prone and can't stand (EoT)
abilities.valok.servok-miner.break-ground.texts.tier2: 11 damage; the target is prone and hanging onto the edge of the fissure
abilities.valok.servok-miner.break-ground.texts.tier3: 7 damage; the target can shift into the nearest unoccupied space outside the fissure
abilities.valok.servok-miner.break-ground.texts.effect: 'Effect: A 5-square-deep fissure opens along
  the ground in the area. Each ally in the area can shift into the nearest unoccupied space outside
  the fissure. Each target makes an Agility test.'
abilities.valok.servok-miner.miner-inconvenience.name: Miner Inconvenience
abilities.valok.servok-miner.miner-inconvenience.texts.trigger: The miner is targeted by a strike.
abilities.valok.servok-miner.miner-inconvenience.texts.target: Self
abilities.valok.servok-miner.miner-inconvenience.texts.distance: Self
abilities.valok.servok-miner.miner-inconvenience.texts.effect: "Effect: Until the end of the round,
  dust and dirt billow in a 2 burst around the miner's initial space. While the miner is in the
  area, they ignore the nondamaging effects of any strike made against them, including the
  triggering strike."
traits.valok.servok-miner.valiar-tunneler.name: Valiar Tunneler
traits.valok.servok-miner.valiar-tunneler.description: The miner can burrow through stone and metal.
  When the miner burrows, they create a stable size 2 tunnel in their wake.
traits.valok.servok-miner.servok-siege-machine.name: Servok Siege Machine
traits.valok.servok-miner.servok-siege-machine.description: The miner ignores difficult terrain, and their abilities deal an extra 15 damage to objects.
traits.valok.servok-miner.crafted-to-perfection.name: Crafted to Perfection
traits.valok.servok-miner.crafted-to-perfection.description: The miner's shape can't be changed by any external effect.
traits.valok.servok-miner.valiar-might.name: Valiar Might
traits.valok.servok-miner.valiar-might.description: While the miner isn't bleeding, weakened, or
  winded, any power roll made against them is automatically a tier 1 outcome. A critical hit still
  grants its additional main action.
monsters.valok.servok-miner.name: Servok Miner
abilities.valok.servok-war-engine.blade-rake.name: Blade Rake
abilities.valok.servok-war-engine.blade-rake.texts.target: Two creatures or objects
abilities.valok.servok-war-engine.blade-rake.texts.distance: Melee 3
abilities.valok.servok-war-engine.blade-rake.texts.roll: Power Roll + 5
abilities.valok.servok-war-engine.blade-rake.texts.tier1: 15 damage
abilities.valok.servok-war-engine.blade-rake.texts.tier2: 21 damage; pull 3
abilities.valok.servok-war-engine.blade-rake.texts.tier3: 25 damage; pull 6
abilities.valok.servok-war-engine.prismacore-cannon.name: Prismacore Cannon
abilities.valok.servok-war-engine.prismacore-cannon.texts.target: One creature or object
abilities.valok.servok-war-engine.prismacore-cannon.texts.distance: Ranged 20
abilities.valok.servok-war-engine.prismacore-cannon.texts.roll: Power Roll + 5
abilities.valok.servok-war-engine.prismacore-cannon.texts.tier1: 22 damage
abilities.valok.servok-war-engine.prismacore-cannon.texts.tier2: 29 damage; I < 4 dazed (save ends)
abilities.valok.servok-war-engine.prismacore-cannon.texts.tier3: 34 damage; I < 5 dazed (save ends)
abilities.valok.servok-war-engine.prismacore-cannon.texts.effect: "Effect: This damage can't be
  reduced in any way. This ability can't be used again until the start of the next round."
abilities.valok.servok-war-engine.destructive-rollout.name: Destructive Rollout
abilities.valok.servok-war-engine.destructive-rollout.texts.target: Self
abilities.valok.servok-war-engine.destructive-rollout.texts.distance: Self
abilities.valok.servok-war-engine.destructive-rollout.texts.effect: "Effect: The war engine moves up
  to their speed in a straight line, automatically destroying mundane size 1 objects or walls in
  their path. The first time the war engine moves through a creature's space during this movement,
  that creature can choose to either fall prone or take 10 damage."
abilities.valok.servok-war-engine.burning-oil.name: Burning Oil
abilities.valok.servok-war-engine.burning-oil.texts.target: Each enemy and object in the area
abilities.valok.servok-war-engine.burning-oil.texts.distance: 20 × 1 line within 1
abilities.valok.servok-war-engine.burning-oil.texts.roll: Agility test
abilities.valok.servok-war-engine.burning-oil.texts.tier1: 16 fire damage; the target is burning (save ends)
abilities.valok.servok-war-engine.burning-oil.texts.tier2: 12 fire damage; the target is burning (EoT)
abilities.valok.servok-war-engine.burning-oil.texts.tier3: 8 fire damage
abilities.valok.servok-war-engine.burning-oil.texts.effect: >-
  Effect: Each target makes an Agility test.


  A burning creature takes 1d6 fire damage at the start of each of their turns. A burning object
  takes 1d6 fire damage at the end of each round. Additionally, the area is burning until the end of
  the encounter. While the area is burning, it is difficult terrain and any enemy takes 3 fire
  damage for each square of the area they enter.
abilities.valok.servok-war-engine.quick-blast.name: Quick Blast
abilities.valok.servok-war-engine.quick-blast.texts.trigger: The target deals damage to the war engine.
abilities.valok.servok-war-engine.quick-blast.texts.target: One creature or object
abilities.valok.servok-war-engine.quick-blast.texts.distance: Ranged 20
abilities.valok.servok-war-engine.quick-blast.texts.roll: Power Roll + 5
abilities.valok.servok-war-engine.quick-blast.texts.tier1: 8 damage; push 2
abilities.valok.servok-war-engine.quick-blast.texts.tier2: 12 damage; push 5
abilities.valok.servok-war-engine.quick-blast.texts.tier3: 16 damage; push 8
abilities.valok.servok-war-engine.quick-blast.texts.effect: "Effect: This damage can't be reduced in any way."
traits.valok.servok-war-engine.servok-siege-machine.name: Servok Siege Machine
traits.valok.servok-war-engine.servok-siege-machine.description: The war engine ignores difficult terrain, and their abilities deal an extra 15 damage to objects.
traits.valok.servok-war-engine.crafted-to-perfection.name: Crafted to Perfection
traits.valok.servok-war-engine.crafted-to-perfection.description: The war engine's shape can't be changed by any external effect.
traits.valok.servok-war-engine.valiar-might.name: Valiar Might
traits.valok.servok-war-engine.valiar-might.description: While the war engine isn't bleeding,
  weakened, or winded, any power roll made against them is automatically a tier 1 outcome. A
  critical hit still grants its additional main action.
monsters.valok.servok-war-engine.name: Servok War Engine
malice.valok.repeater.name: Repeater
malice.valok.repeater.description: One valok acting this turn takes an additional main action.
malice.valok.i-was-not-commanded-to-wait.name: I Was Not Commanded to Wait
malice.valok.i-was-not-commanded-to-wait.description: At the end of each turn until the end of the
  round, one valok can either shift up to 2 squares or make a free strike.
malice.valok.rapid-logic-overdrive.name: Rapid Logic Overdrive
malice.valok.rapid-logic-overdrive.description: Each valok in the encounter can end one effect on
  them that can be ended by a saving throw, and can move up to their speed (making use of the bonus
  below). Additionally, until the end of the encounter, all valok deal an extra 5 damage on strikes
  and gain a +5 bonus to speed. This feature can be activated multiples times, stacking the effects.
effects.valok.rock-cover.name: Rock cover
effects.valok.rock-cover.description: The miner's allies have concealment from the target.
effects.valok.targeted.name: Targeted
effects.valok.targeted.description: The target is slowed. While a target is slowed this way, any strike against them has a double edge.
