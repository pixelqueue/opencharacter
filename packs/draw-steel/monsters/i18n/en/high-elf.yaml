abilities.high-elf.brambleguard.wall-of-roses.texts.effect: "Effect: Until the start of the
  brambleguard's next turn, their speed is 0 and they extend themself into a 5 wall. Each ally who
  starts their turn adjacent to the brambleguard regains 5 Stamina and can apply the Magic keyword
  to their weapon abilities until the end of their turn."
