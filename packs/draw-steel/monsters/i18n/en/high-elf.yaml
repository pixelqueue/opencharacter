malice.high-elf.chaincast.name: Chaincast
malice.high-elf.chaincast.description: Until the end of the round, whenever a high elf uses a magic
  ability, they can use it as if they were occupying the square of another high elf on the encounter
  map to whom they have line of effect.
malice.high-elf.gift-from-an-accursed-tome.name: Gift From an Accursed Tome
malice.high-elf.gift-from-an-accursed-tome.description: >-
  | Area, Magic            |               Main action |


  |----------------------------|------------------------------:|


  | 📏 5 × 1 line within 1 | 🎯 Each enemy in the area |


  Effect: The high elf chooses a damage type and condition from one of the following combinations:
  cold damage and slowed, poison damage and weakened, or corruption damage and frightened.


  Power Roll + 2:


  Special: This ability can't be used by a minion.
malice.high-elf.gift-from-an-accursed-tome.texts.tier1: 5 damage; R < 1 chosen condition (save ends)
malice.high-elf.gift-from-an-accursed-tome.texts.tier2: 9 damage; R < 2 chosen condition (save ends)
malice.high-elf.gift-from-an-accursed-tome.texts.tier3: 12 damage; R < 3 chosen condition (save ends)
malice.high-elf.in-defiance-of-time.name: In Defiance of Time
malice.high-elf.in-defiance-of-time.description: Until the end of the round, each high elf in the
  encounter gains a +4 bonus to speed, and whenever a high elf uses an ability against an enemy,
  each high elf adjacent to that enemy can make a free strike against them.
