abilities.shadow-elf.shadow-elf-panther.bladestorm.texts.target: Each enemy in the area
abilities.shadow-elf.shadow-elf-panther.bladestorm.texts.distance: 2 burst
abilities.shadow-elf.shadow-elf-panther.bladestorm.texts.roll: Power Roll + 3
abilities.shadow-elf.shadow-elf-panther.bladestorm.texts.tier1: 5 corruption damage
abilities.shadow-elf.shadow-elf-panther.bladestorm.texts.tier2: 8 corruption damage; I < 2 dazed (save ends)
abilities.shadow-elf.shadow-elf-panther.bladestorm.texts.tier3: 10 corruption damage; I < 3 dazed (save ends)
abilities.shadow-elf.shadow-elf-panther.bladestorm.texts.effect: 'Effect: The panther has a double edge on strikes against targets dazed this way.'
traits.shadow-elf.shadow-elf-panther.of-the-umbra.name: Of the Umbra
traits.shadow-elf.shadow-elf-panther.of-the-umbra.description: The panther ignores concealment
  created by darkness. While the panther is in direct sunlight, they have damage weakness 3. While
  the panther has concealment, they have damage immunity 3.
monsters.shadow-elf.shadow-elf-panther.name: Shadow Elf Panther
monsters.shadow-elf.shadow-elf-sniper.texts.withCaptain: +2 damage bonus to strikes
abilities.shadow-elf.shadow-elf-sniper.lumina-arrow.name: Lumina Arrow
abilities.shadow-elf.shadow-elf-sniper.lumina-arrow.texts.target: One creature or object per minion
abilities.shadow-elf.shadow-elf-sniper.lumina-arrow.texts.distance: Ranged 7
abilities.shadow-elf.shadow-elf-sniper.lumina-arrow.texts.roll: Power Roll + 3
abilities.shadow-elf.shadow-elf-sniper.lumina-arrow.texts.tier1: 3 damage
abilities.shadow-elf.shadow-elf-sniper.lumina-arrow.texts.tier2: 5 damage
abilities.shadow-elf.shadow-elf-sniper.lumina-arrow.texts.tier3: 7 damage
abilities.shadow-elf.shadow-elf-sniper.lumina-arrow.texts.effect: 'Effect: The next strike made against the target gains an edge.'
traits.shadow-elf.shadow-elf-sniper.of-the-umbra.name: Of the Umbra
traits.shadow-elf.shadow-elf-sniper.of-the-umbra.description: The sniper ignores concealment created
  by darkness. While the sniper is in direct sunlight, they have damage weakness 3. While the sniper
  has concealment, they have damage immunity 3.
monsters.shadow-elf.shadow-elf-sniper.name: Shadow Elf Sniper
effects.shadow-elf.next-ability-double-bane.name: Blotted (double bane)
effects.shadow-elf.next-ability-double-bane.description: The creature has a double bane on the next ability they use.
