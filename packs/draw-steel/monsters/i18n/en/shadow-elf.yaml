effects.shadow-elf.next-strike-edge.description: The creature gains an edge on their next strike.
effects.shadow-elf.bladestorm-dazed.name: Dazed (Bladestorm)
effects.shadow-elf.bladestorm-dazed.description: >-
  The creature is dazed, and the panther has a double edge on strikes against them.
