malice.shadow-elf.watch-me-disappear.name: Watch Me Disappear
malice.shadow-elf.watch-me-disappear.description: Each shadow elf acting this turn can attempt to hide as a free maneuver if they have concealment.
malice.shadow-elf.extra-dimension.name: Extra Dimension
malice.shadow-elf.extra-dimension.description: When any shadow elf acting this turn makes a strike
  against a target who has I < 2 in addition to the strike's regular effects, the target is bleeding
  (save ends) or slowed (save ends).
malice.shadow-elf.home-is-where-the-hurt-is.name: Home Is Where the Hurt Is
malice.shadow-elf.home-is-where-the-hurt-is.description: The shadow elves synthesize a concentrated
  pocket manifold reminiscent of Equinox and graft it onto the encounter map. Until the end of the
  encounter, all creatures can see shadow elves in full color, and shadow elves no longer benefit
  from their Of the Umbra trait. Additionally, the potency of all shadow elf abilities increases by
  2, and any enemy making a saving throw against an effect imposed by a shadow elf ability must roll
  an 8 or higher as they feel the effect across two worlds.
