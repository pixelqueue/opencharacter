malice.elemental.elemental-swap.name: Elemental Swap
malice.elemental.elemental-swap.description: Two elementals on the encounter map teleport to swap
  places, and each has damage immunity 2 until the end of the round.
malice.elemental.split.name: Split
malice.elemental.split.description: An elemental acting this turn cleaves themself into two separate
  elementals. Each elemental has the same statistics as the original, except that each has half the
  original's current Stamina and is one size smaller. Both elementals can then shift up to their
  speed.
malice.elemental.convocation-of-chaos.name: Convocation of Chaos
malice.elemental.convocation-of-chaos.description: >-
  | Magic, Ranged |                 Maneuver |


  |-------------------|-----------------------------:|


  | 📏 Ranged 8   | 🎯 Self or one elemental |


  Effect: Until the end of the encounter, the target has a +5 bonus to speed and a +5 damage bonus
  to strikes. Additionally, whenever an elemental within the target's line of effect uses an ability
  with "Convocation" in the name, the target also gains the effects of that ability.
abilities.elemental.crux-of-fire.spitfire.name: Spitfire
abilities.elemental.crux-of-fire.spitfire.texts.target: Two creatures or objects
abilities.elemental.crux-of-fire.spitfire.texts.distance: Ranged 12
abilities.elemental.crux-of-fire.spitfire.texts.roll: Power Roll + 2
abilities.elemental.crux-of-fire.spitfire.texts.tier1: 8 fire damage
abilities.elemental.crux-of-fire.spitfire.texts.tier2: 12 fire damage; A < 1 the target is burning (save ends)
abilities.elemental.crux-of-fire.spitfire.texts.tier3: 15 fire damage; A < 2 the target is burning (save ends)
abilities.elemental.crux-of-fire.spitfire.texts.effect: 'Effect: A burning creature takes 1d6 fire
  damage at the start of each of their turns. A burning object takes 1d6 fire damage at the end of
  each round.'
abilities.elemental.crux-of-fire.convocation-of-flames.name: Convocation of Flames
abilities.elemental.crux-of-fire.convocation-of-flames.texts.target: Self or one elemental
abilities.elemental.crux-of-fire.convocation-of-flames.texts.distance: Ranged 5
abilities.elemental.crux-of-fire.convocation-of-flames.texts.effect: >-
  Effect: Until the start of the crux's next turn, the target has fire immunity 5.


  3 Malice: Until the end of the encounter, the ground within 3 squares of the target is wreathed in
  fire. Any enemy who enters that area for the first time in a round or starts their turn there
  takes 3 fire damage.
abilities.elemental.crux-of-fire.flame-jet.name: Flame Jet
abilities.elemental.crux-of-fire.flame-jet.texts.trigger: The crux takes damage.
abilities.elemental.crux-of-fire.flame-jet.texts.target: Self
abilities.elemental.crux-of-fire.flame-jet.texts.distance: Self
abilities.elemental.crux-of-fire.flame-jet.texts.effect: "Effect: The crux ignores any effects
  associated with the damage and can fly up to their speed. If the crux doesn't end this movement on
  solid ground, they fall."
traits.elemental.crux-of-fire.fickle-and-free.name: Fickle and Free
traits.elemental.crux-of-fire.fickle-and-free.description: The crux can't be restrained, slowed, or knocked prone, and they ignore difficult terrain.
monsters.elemental.crux-of-fire.name: Crux of Fire
abilities.elemental.essence-of-storms.bluster.name: Bluster
abilities.elemental.essence-of-storms.bluster.texts.target: Each enemy in the area
abilities.elemental.essence-of-storms.bluster.texts.distance: 1 burst
abilities.elemental.essence-of-storms.bluster.texts.roll: Power Roll + 2
abilities.elemental.essence-of-storms.bluster.texts.tier1: 5 damage
abilities.elemental.essence-of-storms.bluster.texts.tier2: 5 damage, 4 lightning damage; push 1
abilities.elemental.essence-of-storms.bluster.texts.tier3: 5 damage, 7 lightning damage; push 3
abilities.elemental.essence-of-storms.bluster.texts.effect: 'Effect: The essence shifts up to 3 squares before or after using this ability.'
abilities.elemental.essence-of-storms.convocation-of-squalls.name: Convocation of Squalls
abilities.elemental.essence-of-storms.convocation-of-squalls.texts.target: Self or one elemental
abilities.elemental.essence-of-storms.convocation-of-squalls.texts.distance: Ranged 5
abilities.elemental.essence-of-storms.convocation-of-squalls.texts.effect: >-
  Effect: Until the start of the essence's next turn, the target has lightning immunity 5.


  3 Malice: Until the end of the encounter, a vortex surrounds the target in a 3 aura. The area is
  difficult terrain for enemies. Additionally, at the end of each of the target's turns, they can
  push one creature in the area up to 5 squares.
abilities.elemental.essence-of-storms.thunderclap.name: Thunderclap
abilities.elemental.essence-of-storms.thunderclap.texts.trigger: A creature within distance deals damage to the essence.
abilities.elemental.essence-of-storms.thunderclap.texts.target: The triggering creature
abilities.elemental.essence-of-storms.thunderclap.texts.distance: Ranged 5
abilities.elemental.essence-of-storms.thunderclap.texts.effect: 'Effect: The target takes 5 lightning damage.'
traits.elemental.essence-of-storms.fickle-and-free.name: Fickle and Free
traits.elemental.essence-of-storms.fickle-and-free.description: The essence can't be restrained, slowed, or knocked prone, and they ignore difficult terrain.
monsters.elemental.essence-of-storms.name: Essence of Storms
abilities.elemental.essence-of-tides.water-wing.name: Water Wing
abilities.elemental.essence-of-tides.water-wing.texts.target: Two creatures or objects
abilities.elemental.essence-of-tides.water-wing.texts.distance: Melee 1
abilities.elemental.essence-of-tides.water-wing.texts.roll: Power Roll + 2
abilities.elemental.essence-of-tides.water-wing.texts.tier1: 7 damage; slide 1
abilities.elemental.essence-of-tides.water-wing.texts.tier2: 11 damage; slide 2
abilities.elemental.essence-of-tides.water-wing.texts.tier3: 14 damage; slide 3
abilities.elemental.essence-of-tides.water-wing.texts.effect: 'Effect: If a target has P < 2, their
  stability is reduced to 0 and they move 2 additional squares whenever they are force moved (save
  ends).'
abilities.elemental.essence-of-tides.convocation-of-waves.name: Convocation of Waves
abilities.elemental.essence-of-tides.convocation-of-waves.texts.target: Self or one elemental
abilities.elemental.essence-of-tides.convocation-of-waves.texts.distance: Ranged 5
abilities.elemental.essence-of-tides.convocation-of-waves.texts.effect: >-
  Effect: Until the start of the essence's next turn, the target has cold immunity 5.


  3 Malice: Until the end of the encounter, the ground within 1 square of the target is a pool of
  water that is difficult terrain. This water extends out behind the target as they move, creating a
  stream that lasts until the end of the encounter. Any enemy who ends their turn in the stream and
  has M < 2 is slowed (save ends).
abilities.elemental.essence-of-tides.sea-salted-wounds.name: Sea-Salted Wounds
abilities.elemental.essence-of-tides.sea-salted-wounds.texts.trigger: An ally deals rolled damage to the target.
abilities.elemental.essence-of-tides.sea-salted-wounds.texts.target: One enemy
abilities.elemental.essence-of-tides.sea-salted-wounds.texts.distance: Melee 1
abilities.elemental.essence-of-tides.sea-salted-wounds.texts.effect: 'Effect: The essence makes a free strike against the target.'
traits.elemental.essence-of-tides.fickle-and-free.name: Fickle and Free
traits.elemental.essence-of-tides.fickle-and-free.description: The essence can't be restrained, slowed, or knocked prone, and they ignore difficult terrain.
traits.elemental.essence-of-tides.water-glide.name: Water Glide
traits.elemental.essence-of-tides.water-glide.description: Whenever the essence starts their turn in
  a space containing water, they can fly until the end of their turn. While flying, the essence
  doesn't provoke opportunity attacks.
monsters.elemental.essence-of-tides.name: Essence of Tides
abilities.elemental.field-of-growth.hampering-roots.name: Hampering Roots
abilities.elemental.field-of-growth.hampering-roots.texts.target: Two creatures or objects
abilities.elemental.field-of-growth.hampering-roots.texts.distance: Ranged 8
abilities.elemental.field-of-growth.hampering-roots.texts.roll: Power Roll + 2
abilities.elemental.field-of-growth.hampering-roots.texts.tier1: 8 damage
abilities.elemental.field-of-growth.hampering-roots.texts.tier2: 13 damage; R < 1 prone and can't stand (save ends)
abilities.elemental.field-of-growth.hampering-roots.texts.tier3: 16 damage; R < 2 prone and can't stand (save ends)
abilities.elemental.field-of-growth.hampering-roots.texts.effect: 'Effect: If a target made prone
  this way is already prone, they are instead restrained (save ends). If the target was also unable
  to stand, that effect ends when they are no longer restrained this way.'
abilities.elemental.field-of-growth.convocation-of-verdure.name: Convocation of Verdure
abilities.elemental.field-of-growth.convocation-of-verdure.texts.target: Self or one elemental
abilities.elemental.field-of-growth.convocation-of-verdure.texts.distance: Ranged 5
abilities.elemental.field-of-growth.convocation-of-verdure.texts.effect: >-
  Effect: The target gains 15 temporary Stamina that lasts until the start of the field's next turn.


  3 Malice: Until the end of the encounter, the ground within 1 square of the target is overgrown
  with underbrush and vines. Whenever any enemy makes a strike against the target while within line
  of effect of that area, the enemy is pulled 5 squares toward the area after the strike is
  resolved. Any enemy who enters the area for the first time in a round or starts their turn there
  is knocked prone.
abilities.elemental.field-of-growth.rose-thorn-lash.name: Rose Thorn Lash
abilities.elemental.field-of-growth.rose-thorn-lash.texts.trigger: A creature or object within distance deals damage to the field.
abilities.elemental.field-of-growth.rose-thorn-lash.texts.target: The triggering creature or object
abilities.elemental.field-of-growth.rose-thorn-lash.texts.distance: Melee 3
abilities.elemental.field-of-growth.rose-thorn-lash.texts.effect: 'Effect: The target takes 6 damage, and if they have A < 2, they are bleeding (save ends).'
traits.elemental.field-of-growth.fickle-and-free.name: Fickle and Free
traits.elemental.field-of-growth.fickle-and-free.description: The field can't be restrained, slowed, or knocked prone, and they ignore difficult terrain.
traits.elemental.field-of-growth.roots-run-deep.name: Roots Run Deep
traits.elemental.field-of-growth.roots-run-deep.description: The field can target any creature
  touching the ground with their abilities, even if they don't have line of effect to that creature.
monsters.elemental.field-of-growth.name: Field of Growth
abilities.elemental.force-of-earth.slam-into-dirt.name: Slam Into Dirt
abilities.elemental.force-of-earth.slam-into-dirt.texts.target: Two creatures or objects
abilities.elemental.force-of-earth.slam-into-dirt.texts.distance: Melee 2
abilities.elemental.force-of-earth.slam-into-dirt.texts.roll: Power Roll + 2
abilities.elemental.force-of-earth.slam-into-dirt.texts.tier1: 8 damage
abilities.elemental.force-of-earth.slam-into-dirt.texts.tier2: 12 damage; M < 1 restrained (save ends)
abilities.elemental.force-of-earth.slam-into-dirt.texts.tier3: 15 damage; M < 2 restrained (save ends)
abilities.elemental.force-of-earth.slam-into-dirt.texts.effect: "Effect: The target's space is difficult terrain."
abilities.elemental.force-of-earth.convocation-of-quartz.name: Convocation of Quartz
abilities.elemental.force-of-earth.convocation-of-quartz.texts.target: Self or one elemental
abilities.elemental.force-of-earth.convocation-of-quartz.texts.distance: Ranged 5
abilities.elemental.force-of-earth.convocation-of-quartz.texts.effect: >-
  Effect: Until the start of the force's next turn, any melee strike made against the target takes a
  bane if it doesn't already have a bane or double bane.


  3 Malice: Until the end of the encounter, the target grows a carapace of stone. They have a +3
  bonus to stability and gain 15 temporary Stamina.
abilities.elemental.force-of-earth.break-armor.name: Break Armor
abilities.elemental.force-of-earth.break-armor.texts.trigger: The force takes damage.
abilities.elemental.force-of-earth.break-armor.texts.target: Self
abilities.elemental.force-of-earth.break-armor.texts.distance: Self
abilities.elemental.force-of-earth.break-armor.texts.effect: 'Effect: The force halves the damage,
  and has damage weakness 3 and a +3 bonus to speed until the end of the encounter. This damage
  weakness increases by 3 each time the force uses this ability in the same encounter.'
traits.elemental.force-of-earth.fickle-and-free.name: Fickle and Free
traits.elemental.force-of-earth.fickle-and-free.description: The force can't be restrained, slowed, or knocked prone, and they ignore difficult terrain.
traits.elemental.force-of-earth.primordial-strength.name: Primordial Strength
traits.elemental.force-of-earth.primordial-strength.description: The force's strikes gain a +6 damage bonus against objects.
traits.elemental.force-of-earth.stone-swim.name: Stone Swim
traits.elemental.force-of-earth.stone-swim.description: The force can burrow through stone, but can't drag other creatures underground when they do so.
monsters.elemental.force-of-earth.name: Force of Earth
effects.elemental.unmoored.name: Unmoored
effects.elemental.unmoored.description: The creature's stability is reduced to 0 and they move 2 additional squares whenever they are force moved.
effects.elemental.quartz.name: Quartz ward
effects.elemental.quartz.description: Any melee strike made against the creature takes a bane if it doesn't already have a bane or double bane.
effects.elemental.carapace.name: Carapace of stone
effects.elemental.carapace.description: The creature has a +3 bonus to stability.
