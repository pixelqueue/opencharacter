malice.radenwight.trouser-cut.name: Trouser Cut
malice.radenwight.trouser-cut.description: >-
  Melee, Strike, Weapon · Main action


  Melee 1 · One creature


  Power Roll + 2:


  Effect: If the target is wearing clothing covering the lower half of their body, they must use a
  maneuver once to pull that clothing up before they can move.


  Special: This ability can't be used by a minion.
malice.radenwight.trouser-cut.texts.tier1: 7 damage; push 3
malice.radenwight.trouser-cut.texts.tier2: 10 damage; push 3, taunted (EoT)
malice.radenwight.trouser-cut.texts.tier3: 13 damage; push 5, taunted (EoT)
malice.radenwight.rat-race.name: Rat Race
malice.radenwight.rat-race.description: Each radenwight in the encounter shifts up to their speed.
  If a radenwight ends this shift adjacent to one or more radenwights, they can make a melee free
  strike against each enemy adjacent to them.
malice.radenwight.rally-the-rodents.name: Rally the Rodents
malice.radenwight.rally-the-rodents.description: >-
  A radenwight uses music to coordinate living rats, forming a 10 wall of rats scurrying atop one
  another into unoccupied spaces anywhere on the encounter map. The wall doesn't block line of
  effect for radenwights and their allies, but it does for other creatures as the rats coordinate
  their movements with the radenwights. Each square of the wall has 10 Stamina.


  If the last radenwight in the encounter dies and the wall is still standing, the rats let out a
  hideous screech as they disperse. Each enemy on the encounter map makes an Intuition test.
malice.radenwight.rally-the-rodents.texts.tier1: 7 sonic damage; the target can't take a respite activity during their next respite
malice.radenwight.rally-the-rodents.texts.tier2: 5 sonic damage
malice.radenwight.rally-the-rodents.texts.tier3: No effect.
