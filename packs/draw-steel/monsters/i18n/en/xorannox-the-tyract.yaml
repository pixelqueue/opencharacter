abilities.xorannox-the-tyract.compulsion-eye.compulsion-beam.texts.tier3: I < 4 the target is charmed
abilities.xorannox-the-tyract.compulsion-eye.compulsion-beam.texts.effect: "Effect: As a free
  triggered action, a charmed target immediately moves up to their speed and can make a free strike
  against an enemy of Xorannox's choice. The target is then no longer charmed."
traits.xorannox-the-tyract.compulsion-eye.psionic-barrier.name: Psionic Barrier
traits.xorannox-the-tyract.compulsion-eye.psionic-barrier.description: The compulsion eye has damage
