abilities.xorannox-the-tyract.compulsion-eye.compulsion-beam.texts.distance: Ranged 6
abilities.xorannox-the-tyract.compulsion-eye.compulsion-beam.texts.roll: Power Roll + 4
abilities.xorannox-the-tyract.compulsion-eye.compulsion-beam.texts.tier1: I < 2 the target is charmed
