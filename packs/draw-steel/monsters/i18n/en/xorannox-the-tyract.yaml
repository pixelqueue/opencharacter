traits.xorannox-the-tyract.xorannox-the-tyract.solo-monster.name: Solo Monster
traits.xorannox-the-tyract.xorannox-the-tyract.solo-monster.description: >-
  End Effect: At the end of each of his turns, Xorannox can take 10 damage to end one effect on him
  that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: Xorannox can take two turns each round. He can't take turns consecutively.
traits.xorannox-the-tyract.xorannox-the-tyract.eyes-of-the-tyract.name: Eyes of the Tyract
traits.xorannox-the-tyract.xorannox-the-tyract.eyes-of-the-tyract.description: Six unique eyestalks
  float around Xorannox, acting on his turn at his command until they are reduced to 0 Stamina. On
  each of Xorannox's turns, he directs one eyestalk to move and use a signature ability.
abilities.xorannox-the-tyract.xorannox-the-tyract.toothful-thrashing.name: Toothful Thrashing
abilities.xorannox-the-tyract.xorannox-the-tyract.toothful-thrashing.texts.target: One creature or object
abilities.xorannox-the-tyract.xorannox-the-tyract.toothful-thrashing.texts.distance: Melee 1
abilities.xorannox-the-tyract.xorannox-the-tyract.toothful-thrashing.texts.roll: Power Roll + 4
abilities.xorannox-the-tyract.xorannox-the-tyract.toothful-thrashing.texts.tier1: 12 damage; slide 2; M < 2 bleeding (EoT)
abilities.xorannox-the-tyract.xorannox-the-tyract.toothful-thrashing.texts.tier2: 20 damage; slide 3; M < 3 bleeding (EoT)
abilities.xorannox-the-tyract.xorannox-the-tyract.toothful-thrashing.texts.tier3: 23 damage; vertical slide 3; M < 4 bleeding (EoT)
abilities.xorannox-the-tyract.xorannox-the-tyract.grav-spike.name: Grav Spike
abilities.xorannox-the-tyract.xorannox-the-tyract.grav-spike.texts.target: Each enemy in the area
abilities.xorannox-the-tyract.xorannox-the-tyract.grav-spike.texts.distance: 2 burst
abilities.xorannox-the-tyract.xorannox-the-tyract.grav-spike.texts.roll: Power Roll + 4
abilities.xorannox-the-tyract.xorannox-the-tyract.grav-spike.texts.tier1: Vertical push 3
abilities.xorannox-the-tyract.xorannox-the-tyract.grav-spike.texts.tier2: Vertical push 5
abilities.xorannox-the-tyract.xorannox-the-tyract.grav-spike.texts.tier3: Vertical push 7
abilities.xorannox-the-tyract.xorannox-the-tyract.grav-spike.texts.effect: 'Effect: Xorannox shifts up to his speed before or after using this ability.'
abilities.xorannox-the-tyract.xorannox-the-tyract.optical-collusion.name: Optical Collusion
abilities.xorannox-the-tyract.xorannox-the-tyract.optical-collusion.texts.target: Self
abilities.xorannox-the-tyract.xorannox-the-tyract.optical-collusion.texts.distance: Self
abilities.xorannox-the-tyract.xorannox-the-tyract.optical-collusion.texts.effect: 'Effect: Xorannox commands all his eyestalks to move up to their speed.'
abilities.xorannox-the-tyract.xorannox-the-tyract.shutout.name: Shutout
abilities.xorannox-the-tyract.xorannox-the-tyract.shutout.texts.target: Special
abilities.xorannox-the-tyract.xorannox-the-tyract.shutout.texts.distance: 5 × 2 line within 1
abilities.xorannox-the-tyract.xorannox-the-tyract.shutout.texts.effect: "Effect: Xorannox ends all
  ongoing supernatural effects and suppresses supernatural effects from treasures in the area. New
  supernatural effects can't be activated in the area until the end of Xorannox's next turn."
abilities.xorannox-the-tyract.xorannox-the-tyract.cower.name: Cower!
abilities.xorannox-the-tyract.xorannox-the-tyract.cower.texts.trigger: A creature within distance deals damage to Xorannox.
abilities.xorannox-the-tyract.xorannox-the-tyract.cower.texts.target: The triggering creature
abilities.xorannox-the-tyract.xorannox-the-tyract.cower.texts.distance: Ranged 10
abilities.xorannox-the-tyract.xorannox-the-tyract.cower.texts.effect: 'Effect: If the target has I < 3 they are frightened (save ends)'
traits.xorannox-the-tyract.xorannox-the-tyract.above-it-all.name: Above It All
traits.xorannox-the-tyract.xorannox-the-tyract.above-it-all.description: Xorannox can't be made frightened or knocked prone, and he can't be flanked.
traits.xorannox-the-tyract.xorannox-the-tyract.natural-enemies.name: Natural Enemies
traits.xorannox-the-tyract.xorannox-the-tyract.natural-enemies.description: If Xorannox perceives
  another overmind or a voiceless talker on the encounter map, he targets that threat one or more
  times on each of his turns.
abilities.xorannox-the-tyract.xorannox-the-tyract.disruption-beam.name: Disruption Beam
abilities.xorannox-the-tyract.xorannox-the-tyract.disruption-beam.texts.target: Three creatures
abilities.xorannox-the-tyract.xorannox-the-tyract.disruption-beam.texts.distance: Ranged 10
abilities.xorannox-the-tyract.xorannox-the-tyract.disruption-beam.texts.roll: Power Roll + 4
abilities.xorannox-the-tyract.xorannox-the-tyract.disruption-beam.texts.tier1: 11 psychic damage; R < 2 dazed (save ends)
abilities.xorannox-the-tyract.xorannox-the-tyract.disruption-beam.texts.tier2: 17 psychic damage; R < 3 dazed (save ends)
abilities.xorannox-the-tyract.xorannox-the-tyract.disruption-beam.texts.tier3: 20 psychic damage; R < 4 dazed (save ends)
abilities.xorannox-the-tyract.xorannox-the-tyract.all-eyes-all-rise.name: All Eyes, All Rise
abilities.xorannox-the-tyract.xorannox-the-tyract.all-eyes-all-rise.texts.target: Self
abilities.xorannox-the-tyract.xorannox-the-tyract.all-eyes-all-rise.texts.distance: Self
abilities.xorannox-the-tyract.xorannox-the-tyract.all-eyes-all-rise.texts.effect:
  'Effect: Xorannox recreates any destroyed eyestalks, which return in unoccupied spaces on the
  encounter map with full Stamina.'
abilities.xorannox-the-tyract.xorannox-the-tyract.panoptibeam.name: Panoptibeam
abilities.xorannox-the-tyract.xorannox-the-tyract.panoptibeam.texts.target: Each enemy in the area
abilities.xorannox-the-tyract.xorannox-the-tyract.panoptibeam.texts.distance: 2 burst
abilities.xorannox-the-tyract.xorannox-the-tyract.panoptibeam.texts.effect: 'Effect: Xorannox directs each of his eyestalks to use a signature ability against any target.'
monsters.xorannox-the-tyract.xorannox-the-tyract.name: Xorannox the Tyract
abilities.xorannox-the-tyract.zapper-eye.lightning-beam.name: Lightning Beam
abilities.xorannox-the-tyract.zapper-eye.lightning-beam.texts.target: Each enemy in the area
abilities.xorannox-the-tyract.zapper-eye.lightning-beam.texts.distance: 10 × 1 line within 1
abilities.xorannox-the-tyract.zapper-eye.lightning-beam.texts.roll: Power Roll + 4
abilities.xorannox-the-tyract.zapper-eye.lightning-beam.texts.tier1: 6 lightning damage
abilities.xorannox-the-tyract.zapper-eye.lightning-beam.texts.tier2: 10 lightning damage
abilities.xorannox-the-tyract.zapper-eye.lightning-beam.texts.tier3: 13 lightning damage
abilities.xorannox-the-tyract.zapper-eye.lightning-beam.texts.effect: 'Effect: Each target loses all their surges.'
traits.xorannox-the-tyract.zapper-eye.psionic-barrier.name: Psionic Barrier
traits.xorannox-the-tyract.zapper-eye.psionic-barrier.description: The zapper eye has damage
  immunity 15. When they use a main action, they lose this immunity until the end of the round.
monsters.xorannox-the-tyract.zapper-eye.name: Zapper Eye
malice.xorannox-the-tyract.gas-belch.name: Gas Belch
malice.xorannox-the-tyract.gas-belch.description: Xorannox lets out a noxious belch. Each
  enemy within 2 squares of him who has M < 3 is weakened (save ends).
malice.xorannox-the-tyract.slime-trail.name: Slime Trail
malice.xorannox-the-tyract.slime-trail.description: Until the end of Xorannox's next turn,
  whenever he or any of his eyes leave their space, they secrete a viscous slime onto the ground in
  that area. Any enemy who enters an affected square has lightning weakness 5 and fire weakness 5
  until the end of the encounter.
malice.xorannox-the-tyract.solo-action.name: Solo Action
malice.xorannox-the-tyract.solo-action.description: Xorannox takes an additional main action on his turn. He can use this feature even if he is dazed.
malice.xorannox-the-tyract.mind-over-matter.name: Mind Over Matter
malice.xorannox-the-tyract.mind-over-matter.description: Xorannox fills the encounter map
  with a powerful telekinetic field. The Director chooses a cardinal direction (north, south, east,
  or west). Whenever a creature in the encounter willingly moves or is force moved, they are pulled
  2 squares in the chosen direction, ignoring stability. Each time this feature is used, its
  previous effect ends.
effects.xorannox-the-tyract.barrier-down.name: Psionic Barrier lost
effects.xorannox-the-tyract.barrier-down.description: The eye has lost their damage immunity 15 until the end of the round.
effects.xorannox-the-tyract.charmed.name: Charmed
effects.xorannox-the-tyract.charmed.description: As a free triggered action, a charmed target immediately moves up to their speed and can make a free strike against an enemy of Xorannox's choice. The target is then no longer charmed.
