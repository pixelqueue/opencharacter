malice.medusa.weakening-glare.name: Weakening Glare
malice.medusa.weakening-glare.description: |-
  Keywords: Magic, Ranged, Strike · Main action

  Distance: Ranged 10 · Target: One creature

  Power Roll + 4
malice.medusa.weakening-glare.texts.tier1: 6 damage; weakened (EoT)
malice.medusa.weakening-glare.texts.tier2: 10 damage; weakened (EoT)
malice.medusa.weakening-glare.texts.tier3: 12 damage; weakened (save ends)
malice.medusa.solo-action.name: Solo Action
malice.medusa.solo-action.description: The medusa takes an additional main action on their turn.
  They can use this feature even if they are dazed.
malice.medusa.ssstop-and-lisssten.name: Ssstop and Lisssten
malice.medusa.ssstop-and-lisssten.description: >-
  Keywords: Magic, Ranged · Main action


  Distance: Ranged 10 · Target: Three creatures


  Power Roll + 4


  Effect: At a time of the medusa's choosing, a charmed creature moves up to their speed and makes a
  free strike against an enemy of the medusa's choice as a free triggered action. The creature is
  then no longer charmed.
malice.medusa.ssstop-and-lisssten.texts.tier1: I < 2 the target is charmed
malice.medusa.ssstop-and-lisssten.texts.tier2: I < 3 the target is charmed
malice.medusa.ssstop-and-lisssten.texts.tier3: I < 4 the target is charmed
malice.medusa.shatter-victims.name: Shatter Victims
malice.medusa.shatter-victims.description: The medusa causes three stone statues within 10 squares
  of them to each shatter in a 2-cube explosion. Each enemy in one of those areas makes a Might
  test. An enemy restrained or slowed by the medusa's Petrify ability has a double bane on the test.
malice.medusa.shatter-victims.texts.tier1: 12 damage; vertical push 3; bleeding (save ends)
malice.medusa.shatter-victims.texts.tier2: 10 damage; vertical push 3
malice.medusa.shatter-victims.texts.tier3: 6 damage
traits.medusa.medusa.solo-monster.name: Solo Monster
traits.medusa.medusa.solo-monster.description: >-
  End Effect: At the end of each of their turns, the medusa can take 10 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The medusa can take two turns each round. They can't take turns consecutively.
abilities.medusa.medusa.snake-bites.name: Snake Bites
abilities.medusa.medusa.snake-bites.texts.target: Two creatures or objects
abilities.medusa.medusa.snake-bites.texts.distance: Melee 1
abilities.medusa.medusa.snake-bites.texts.roll: Power Roll + 4
abilities.medusa.medusa.snake-bites.texts.tier1: 11 damage; M < 2 slowed (save ends)
abilities.medusa.medusa.snake-bites.texts.tier2: 16 damage; M < 3 slowed (save ends)
abilities.medusa.medusa.snake-bites.texts.tier3: 19 damage; M < 4 slowed (save ends)
abilities.medusa.medusa.damning-gaze.name: Damning Gaze
abilities.medusa.medusa.damning-gaze.texts.target: Two creatures or objects
abilities.medusa.medusa.damning-gaze.texts.distance: Ranged 10
abilities.medusa.medusa.damning-gaze.texts.roll: Power Roll + 4
abilities.medusa.medusa.damning-gaze.texts.tier1: 11 damage; push 3
abilities.medusa.medusa.damning-gaze.texts.tier2: 16 damage; push 5
abilities.medusa.medusa.damning-gaze.texts.tier3: 19 damage; push 7
abilities.medusa.medusa.damning-gaze.texts.effect: '3 Malice: The medusa targets two additional creatures or objects.'
abilities.medusa.medusa.petrify.name: Petrify
abilities.medusa.medusa.petrify.texts.target: Each enemy in the area
abilities.medusa.medusa.petrify.texts.distance: 3 burst
abilities.medusa.medusa.petrify.texts.roll: Power Roll + 4
abilities.medusa.medusa.petrify.texts.tier1: M < 2 restrained (save ends)
abilities.medusa.medusa.petrify.texts.tier2: M < 3 restrained (save ends)
abilities.medusa.medusa.petrify.texts.tier3: Slowed (save ends); or if M < 4 restrained (save ends)
abilities.medusa.medusa.petrify.texts.effect: 'Effect: A target with cover reduces the potency by 1,
  while a slowed target increases the potency by 1. A target restrained this way magically begins to
  turn to stone, and a target who ends two consecutive turns restrained this way is petrified.'
abilities.medusa.medusa.nimble-escape.name: Nimble Escape
abilities.medusa.medusa.nimble-escape.texts.target: Self
abilities.medusa.medusa.nimble-escape.texts.distance: Self
abilities.medusa.medusa.nimble-escape.texts.effect: 'Effect: The medusa shifts up to 3 squares and can attempt to hide even if observed.'
abilities.medusa.medusa.venomous-spit.name: Venomous Spit
abilities.medusa.medusa.venomous-spit.texts.trigger: A creature within distance deals damage to the medusa.
abilities.medusa.medusa.venomous-spit.texts.target: The triggering creature
abilities.medusa.medusa.venomous-spit.texts.distance: Melee 1
abilities.medusa.medusa.venomous-spit.texts.roll: Power Roll + 4
abilities.medusa.medusa.venomous-spit.texts.tier1: 13 acid damage
abilities.medusa.medusa.venomous-spit.texts.tier2: 18 acid damage
abilities.medusa.medusa.venomous-spit.texts.tier3: 22 acid damage
traits.medusa.medusa.cunning-edge.name: Cunning Edge
traits.medusa.medusa.cunning-edge.description: The medusa gains an edge on power rolls against any
  creature who is restrained or slowed by Petrify.
traits.medusa.medusa.many-peering-eyes.name: Many Peering Eyes
traits.medusa.medusa.many-peering-eyes.description: The medusa can't be flanked.
abilities.medusa.medusa.mass-petrify.name: Mass Petrify
abilities.medusa.medusa.mass-petrify.texts.target: Each enemy
abilities.medusa.medusa.mass-petrify.texts.distance: Ranged 50
abilities.medusa.medusa.mass-petrify.texts.effect: "Effect: The medusa can use Petrify against each
  target without spending Malice. A target who doesn't have cover increases the potency by 1."
abilities.medusa.medusa.serpent-wings.name: Serpent Wings
abilities.medusa.medusa.serpent-wings.texts.target: Self
abilities.medusa.medusa.serpent-wings.texts.distance: Self
abilities.medusa.medusa.serpent-wings.texts.effect: 'Effect: The medusa temporarily manifests wings
  and flies up to their speed without provoking opportunity attacks. During or after this movement,
  they can use Snake Bites and Damning Gaze once each.'
abilities.medusa.medusa.stone-puppets.name: Stone Puppets
abilities.medusa.medusa.stone-puppets.texts.target: Special
abilities.medusa.medusa.stone-puppets.texts.distance: 10 burst
abilities.medusa.medusa.stone-puppets.texts.effect: "Effect: As a free triggered action, each stone
  statue and creature restrained or slowed by Petrify within distance moves up to their speed and
  uses a signature ability that gains an edge, targeting an enemy of the medusa's choice. A stone
  statue without its own statistics has speed 5 and uses the medusa's free strike."
monsters.medusa.medusa.name: Medusa
