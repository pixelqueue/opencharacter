traits.werewolf.werewolf.solo-monster.name: Solo Monster
traits.werewolf.werewolf.solo-monster.description: >-
  End Effect: At the end of each of their turns, the werewolf can take 5 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The werewolf can take two turns each round. They can't take turns consecutively.
traits.werewolf.werewolf.accursed-rage.name: Accursed Rage
traits.werewolf.werewolf.accursed-rage.description: The werewolf's ferocity is expressed through
  rage, and their abilities can inflict rage points on any enemy except a stormwight fury. A
  creature who starts their turn with 10 or more rage expends their rage. Then before taking their
  turn, they must shift up to their speed toward the nearest creature and make a melee free strike
  against them. A creature who takes damage from this free strike gains 1 rage. Accumulated rage
  disappears after a character finishes a respite.
traits.werewolf.werewolf.shapeshifter.name: Shapeshifter
traits.werewolf.werewolf.shapeshifter.description: The werewolf enters combat in their hybrid
  humanoid form. Their shape can't be changed by any external effect.
traits.werewolf.werewolf.vukenstep.name: Vukenstep
traits.werewolf.werewolf.vukenstep.description: The werewolf ignores difficult terrain.
abilities.werewolf.werewolf.accursed-bite.name: Accursed Bite
abilities.werewolf.werewolf.accursed-bite.texts.target: One creature or object
abilities.werewolf.werewolf.accursed-bite.texts.distance: Melee 1
abilities.werewolf.werewolf.accursed-bite.texts.roll: Power Roll + 3
abilities.werewolf.werewolf.accursed-bite.texts.tier1: 9 damage; the target gains 2 rage
abilities.werewolf.werewolf.accursed-bite.texts.tier2: 13 damage; the target gains 4 rage
abilities.werewolf.werewolf.accursed-bite.texts.tier3: 16 damage; the target gains 5 rage
abilities.werewolf.werewolf.accursed-bite.texts.effect: '2 Malice: If the target has P < 0, they are
  afflicted with lycanthpy. Each time the target is unaffected by the potency effect, the potency
  increases by 1 the next time the werewolf uses the ability against the same target. A creature
  afflicted with lycanthropy gains 2 rage at the end of each of their turns whenever they''re in
  combat. Their rage doesn''t disappear after finishing a respite and they must complete the Find a
  Cure downtime project in "Draw Steel: Heroes" to end this effect.'
abilities.werewolf.werewolf.ripping-claws.name: Ripping Claws
abilities.werewolf.werewolf.ripping-claws.texts.target: Two creatures or objects
abilities.werewolf.werewolf.ripping-claws.texts.distance: Melee 1
abilities.werewolf.werewolf.ripping-claws.texts.roll: Power Roll + 3
abilities.werewolf.werewolf.ripping-claws.texts.tier1: 8 damage; M < 1 bleeding (save ends)
abilities.werewolf.werewolf.ripping-claws.texts.tier2: 11 damage; the target gains 1 rage; M < 2 bleeding (save ends)
abilities.werewolf.werewolf.ripping-claws.texts.tier3: 14 damage; the target gains 3 rage; M < 3 bleeding (save ends)
abilities.werewolf.werewolf.berserker-slash.name: Berserker Slash
abilities.werewolf.werewolf.berserker-slash.texts.target: Each enemy and object in the area
abilities.werewolf.werewolf.berserker-slash.texts.distance: 1 burst
abilities.werewolf.werewolf.berserker-slash.texts.roll: Power Roll + 3
abilities.werewolf.werewolf.berserker-slash.texts.tier1: 4 damage; push 2
abilities.werewolf.werewolf.berserker-slash.texts.tier2: 6 damage; push 3; the target gains 1 rage
abilities.werewolf.werewolf.berserker-slash.texts.tier3: 7 damage; slide 3; the target gains 3 rage
abilities.werewolf.werewolf.berserker-slash.texts.effect: 'Effect: The werewolf shifts up to their speed before using this ability.'
abilities.werewolf.werewolf.wall-leap.name: Wall Leap
abilities.werewolf.werewolf.wall-leap.texts.target: Self
abilities.werewolf.werewolf.wall-leap.texts.distance: Self
abilities.werewolf.werewolf.wall-leap.texts.effect: 'Effect: The werewolf jumps up to 4 squares. If
  they end this jump at a wall, the werewolf jumps off the wall up to 4 squares and can make a melee
  free strike. If the target of the free strike has M < 2, they are knocked prone.'
abilities.werewolf.werewolf.facepalm-and-head-slam.name: Facepalm and Head Slam
abilities.werewolf.werewolf.facepalm-and-head-slam.texts.trigger: A creature within distance targets
  the werewolf with a melee ability after charging or moving 2 or more squares in a straight line
  toward them.
abilities.werewolf.werewolf.facepalm-and-head-slam.texts.target: The triggering creature
abilities.werewolf.werewolf.facepalm-and-head-slam.texts.distance: Melee 1
abilities.werewolf.werewolf.facepalm-and-head-slam.texts.effect: 'Effect: The target is knocked prone and takes 5 damage before the triggered action is resolved.'
abilities.werewolf.werewolf.howl.name: Howl
abilities.werewolf.werewolf.howl.texts.target: Each enemy in the area
abilities.werewolf.werewolf.howl.texts.distance: 5 burst
abilities.werewolf.werewolf.howl.texts.roll: Intuition test
abilities.werewolf.werewolf.howl.texts.tier1: The target must move their speed in a straight line away from the werewolf; frightened (save ends)
abilities.werewolf.werewolf.howl.texts.tier2: Frightened (EoT)
abilities.werewolf.werewolf.howl.texts.tier3: No effect
abilities.werewolf.werewolf.howl.texts.effect: >-
  Effect: Each target makes an Intuition test.


  Effect: Any enemy in the encounter who has 1 or more rage gains 4 rage and howls along with the
  werewolf.
abilities.werewolf.werewolf.full-wolf.name: Full Wolf
abilities.werewolf.werewolf.full-wolf.texts.target: Self
abilities.werewolf.werewolf.full-wolf.texts.distance: Self
abilities.werewolf.werewolf.full-wolf.texts.effect: 'Effect: The werewolf transforms into a massive
  wolf of size 3 until they die or until the end of the encounter. They move to a space that can
  accommodate their new size and push adjacent creatures out of their way. While in wolf form, they
  have speed 10 and stability 2, their strikes gain a +2 damage bonus and bestow an additional 1
  rage, and the potency of Accursed Bite increases by 1.'
abilities.werewolf.werewolf.rampage.name: Rampage
abilities.werewolf.werewolf.rampage.texts.target: Each creature in the area
abilities.werewolf.werewolf.rampage.texts.distance: 2 burst
abilities.werewolf.werewolf.rampage.texts.roll: Power Roll + 3
abilities.werewolf.werewolf.rampage.texts.tier1: 5 damage; the target gains 2 rage; M < 1 bleeding (save ends)
abilities.werewolf.werewolf.rampage.texts.tier2: 8 damage; the target gains 4 rage; M < 2 bleeding (save ends)
abilities.werewolf.werewolf.rampage.texts.tier3: 11 damage; the target gains 8 rage; M < 3 bleeding (save ends)
abilities.werewolf.werewolf.rampage.texts.effect: 'Effect: The werewolf shifts up to their speed before and after using this ability.'
monsters.werewolf.werewolf.name: Werewolf
malice.werewolf.blood-in-their-eyes.name: Blood In Their Eyes
malice.werewolf.blood-in-their-eyes.description: The werewolf gains 10 temporary Stamina and a +3
  bonus to speed until the end of their turn. The werewolf can't use this feature if they took any
  holy damage since ending their last turn.
malice.werewolf.solo-action.name: Solo Action
malice.werewolf.solo-action.description: The werewolf takes an additional main action on their turn.
  They can use this feature even if they are dazed.
malice.werewolf.moonfall.name: Moonfall
malice.werewolf.moonfall.description: Until the end of the encounter, the encounter map turns to
  night and the moon appears impossibly huge in the sky. The werewolf can take an additional move
  action or maneuver on each of their turns while they have line of effect to the moon. Any creature
  who ends their turn with line of effect to the moon with 1 or more rage gains 2 rag.
effects.werewolf.rage.name: Rage
effects.werewolf.rage.description: >-
  A creature who starts their turn with 10 or more rage expends their rage. Then before taking
  their turn, they must shift up to their speed toward the nearest creature and make a melee free
  strike against them. A creature who takes damage from this free strike gains 1 rage. Accumulated
  rage disappears after a character finishes a respite.
effects.werewolf.rage.state.amount.name: Rage
effects.werewolf.lycanthropy.name: Lycanthropy
effects.werewolf.lycanthropy.description: >-
  A creature afflicted with lycanthropy gains 2 rage at the end of each of their turns whenever
  they're in combat. Their rage doesn't disappear after finishing a respite and they must complete
  the Find a Cure downtime project in Draw Steel: Heroes to end this effect.
effects.werewolf.full-wolf.name: Full Wolf
effects.werewolf.full-wolf.description: >-
  The werewolf is a massive wolf of size 3 until they die or until the end of the encounter. While
  in wolf form, they have speed 10 and stability 2, their strikes gain a +2 damage bonus and bestow
  an additional 1 rage, and the potency of Accursed Bite increases by 1.
