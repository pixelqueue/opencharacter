malice.arixx.burning-maw.name: Burning Maw
malice.arixx.burning-maw.description: The arixx dribbles acid over their mandibles, causing the next
  strike they make to gain an edge and deal an extra 3 acid damage.
malice.arixx.geyser.name: Geyser
malice.arixx.geyser.description: The arixx's underground tunnels swell with pressure, causing a
  sudden influx of hot gas to burst from a 3-square-by-3-square area anywhere on the surface. Each
  enemy in the area makes an Agility test.
malice.arixx.geyser.texts.tier1: 4 damage; vertical push 5
malice.arixx.geyser.texts.tier2: 4 damage; vertical push 3
malice.arixx.geyser.texts.tier3: The target shifts to the nearest unoccupied space outside the area.
malice.arixx.solo-action.name: Solo Action
malice.arixx.solo-action.description: The arixx takes an additional main action on their turn. They
  can use this feature even if they are dazed.
malice.arixx.earth-sink.name: Earth Sink
malice.arixx.earth-sink.description: The encounter map suddenly quakes, then begins to sink. Each
  creature on the ground who has A < 1 is knocked prone. Until the end of the encounter, each
  creature who starts their turn on the ground and can't burrow must spend 1 additional square of
  movement to leave their starting position, or 2 squares if they start their turn prone or
  underground. A creature who starts and ends their turn in the same space on the ground and can't
  burrow sinks 1 square into the ground.
traits.arixx.arixx.solo-monster.name: Solo Monster
traits.arixx.arixx.solo-monster.description: >-
  End Effect: At the end of each of their turns, the arixx can take 5 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The arixx can take two turns each round. They can't take turns consecutively.
traits.arixx.arixx.earthwalk.name: Earthwalk
traits.arixx.arixx.earthwalk.description: Difficult terrain composed of earth or loose rock doesn't cost the arixx extra movement.
traits.arixx.arixx.soft-underbelly.name: Soft Underbelly
traits.arixx.arixx.soft-underbelly.description: A prone creature making a melee strike against the
  arixx has a double edge on the strike instead of taking a bane.
abilities.arixx.arixx.bite.name: Bite
abilities.arixx.arixx.bite.texts.target: One creature or object
abilities.arixx.arixx.bite.texts.distance: Melee 2
abilities.arixx.arixx.bite.texts.roll: Power Roll + 3
abilities.arixx.arixx.bite.texts.tier1: 9 damage; grabbed
abilities.arixx.arixx.bite.texts.tier2: 13 damage; grabbed
abilities.arixx.arixx.bite.texts.tier3: 16 damage; grabbed
abilities.arixx.arixx.bite.texts.effect: 'Effect: A size 1 target grabbed this way takes 3 acid damage at the start of each of their turns.'
abilities.arixx.arixx.claw-swing.name: Claw Swing
abilities.arixx.arixx.claw-swing.texts.target: Two creatures or objects
abilities.arixx.arixx.claw-swing.texts.distance: Melee 2
abilities.arixx.arixx.claw-swing.texts.roll: Power Roll + 3
abilities.arixx.arixx.claw-swing.texts.tier1: 5 damage; A < 1 grabbed
abilities.arixx.arixx.claw-swing.texts.tier2: 8 damage; A < 2 grabbed
abilities.arixx.arixx.claw-swing.texts.tier3: 11 damage; A < 3 grabbed
abilities.arixx.arixx.claw-swing.texts.effect: 'Effect: The arixx can have up to two targets grabbed
  at once this way. The arixx can vertically slide each grabbed target up to 3 squares.'
abilities.arixx.arixx.spitfire.name: Spitfire
abilities.arixx.arixx.spitfire.texts.target: Two creatures or objects
abilities.arixx.arixx.spitfire.texts.distance: Ranged 10
abilities.arixx.arixx.spitfire.texts.roll: Power Roll + 3
abilities.arixx.arixx.spitfire.texts.tier1: 4 acid damage
abilities.arixx.arixx.spitfire.texts.tier2: 6 acid damage
abilities.arixx.arixx.spitfire.texts.tier3: 7 acid damage; prone
abilities.arixx.arixx.spitfire.texts.effect: 'Effect: The ground beneath each target is covered in
  burning acid until the end of the encounter. Any enemy who enters an affected space for the first
  time in a round or starts their turn there takes 2 acid damage.'
abilities.arixx.arixx.dirt-devil.name: Dirt Devil
abilities.arixx.arixx.dirt-devil.texts.target: Each enemy in the area
abilities.arixx.arixx.dirt-devil.texts.distance: 3 burst
abilities.arixx.arixx.dirt-devil.texts.roll: Power Roll + 3
abilities.arixx.arixx.dirt-devil.texts.tier1: 4 damage
abilities.arixx.arixx.dirt-devil.texts.tier2: 6 damage; push 2
abilities.arixx.arixx.dirt-devil.texts.tier3: 7 damage; push 4
abilities.arixx.arixx.dirt-devil.texts.effect: 'Effect: The arixx flings rocks and debris to fill
  the area, and has a double edge on the power roll if they started their turn underground. The area
  is difficult terrain.'
abilities.arixx.arixx.dust-cloud.name: Dust Cloud
abilities.arixx.arixx.dust-cloud.texts.target: Special
abilities.arixx.arixx.dust-cloud.texts.distance: 1 burst
abilities.arixx.arixx.dust-cloud.texts.effect: 'Effect: The arixx kicks up dust to fill the area
  until the start of their next turn, then moves up to their speed. Any enemy in the area or who
  targets a creature in the area takes a bane on power rolls.'
abilities.arixx.arixx.skitter.name: Skitter
abilities.arixx.arixx.skitter.texts.trigger: The arixx takes damage.
abilities.arixx.arixx.skitter.texts.target: Self
abilities.arixx.arixx.skitter.texts.distance: Self
abilities.arixx.arixx.skitter.texts.effect: 'Effect: The arixx halves the damage and shifts up to 3
  squares after the triggering effect resolves.'
abilities.arixx.arixx.acid-spew.name: Acid Spew
abilities.arixx.arixx.acid-spew.texts.target: Each creature and object in the area
abilities.arixx.arixx.acid-spew.texts.distance: 10 × 2 line within 1
abilities.arixx.arixx.acid-spew.texts.roll: Power Roll + 3
abilities.arixx.arixx.acid-spew.texts.tier1: 5 acid damage
abilities.arixx.arixx.acid-spew.texts.tier2: 8 acid damage
abilities.arixx.arixx.acid-spew.texts.tier3: 11 acid damage
abilities.arixx.arixx.acid-spew.texts.effect: 'Effect: The ground in the area is covered in a puddle
  of acid until the end of the encounter. Any enemy who enters the area for the first time in a
  round or starts their turn there takes 2 acid damage.'
abilities.arixx.arixx.sinkhole.name: Sinkhole
abilities.arixx.arixx.sinkhole.texts.target: Self
abilities.arixx.arixx.sinkhole.texts.distance: Self
abilities.arixx.arixx.sinkhole.texts.effect: 'Effect: The arixx shifts up to their speed. If they
  end this shift above ground and within 2 squares of a creature, they use Bite against the creature
  and can then use the Dig maneuver.'
abilities.arixx.arixx.acid-and-claws.name: Acid and Claws
abilities.arixx.arixx.acid-and-claws.texts.target: Each creature in the area
abilities.arixx.arixx.acid-and-claws.texts.distance: 2 burst
abilities.arixx.arixx.acid-and-claws.texts.roll: Power Roll + 3
abilities.arixx.arixx.acid-and-claws.texts.tier1: 5 acid damage; M < 1 weakened (save ends)
abilities.arixx.arixx.acid-and-claws.texts.tier2: 8 acid damage; M < 2 weakened (save ends)
abilities.arixx.arixx.acid-and-claws.texts.tier3: 11 acid damage; M < 3 weakened (save ends)
monsters.arixx.arixx.name: Arixx
effects.arixx.digesting.name: Digesting
effects.arixx.digesting.description:
  A size 1 creature grabbed by the arixx's Bite takes 3 acid damage at the start of each of their
  turns.
