abilities.basilisk.basilisk.poison-fumes.name: Poison Fumes
abilities.basilisk.basilisk.poison-fumes.texts.target: Each enemy in the area
abilities.basilisk.basilisk.poison-fumes.texts.distance: 3 cube within 1
abilities.basilisk.basilisk.poison-fumes.texts.roll: Power Roll + 2
abilities.basilisk.basilisk.poison-fumes.texts.tier1: 4 poison damage; M < 0 weakened (save ends)
