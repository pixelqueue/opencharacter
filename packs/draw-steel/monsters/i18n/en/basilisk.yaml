abilities.basilisk.basilisk.poison-fumes.texts.tier3: 9 poison damage; M < 2 weakened and slowed (save ends)
abilities.basilisk.basilisk.lash-out.name: Lash Out
abilities.basilisk.basilisk.lash-out.texts.trigger: The basilisk takes damage from a melee ability.
abilities.basilisk.basilisk.lash-out.texts.target: Each enemy in the area
abilities.basilisk.basilisk.lash-out.texts.distance: 1 burst
abilities.basilisk.basilisk.lash-out.texts.effect: 'Effect: Each target takes 5 damage. Any target who has A < 2 is also bleeding (save ends).'
traits.basilisk.basilisk.calcifying-presence.name: Calcifying Presence
traits.basilisk.basilisk.calcifying-presence.description: The area within 3 squares of the basilisk is difficult terrain for enemies.
