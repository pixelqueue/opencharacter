malice.basilisk.stone-swim.name: Stone Swim
malice.basilisk.stone-swim.description: A basilisk acting this turn can burrow until the start of
  their next turn, and moves up to their speed. They have damage immunity 2 while underground. The
  basilisk can burrow through stone, but can't drag other creatures underground when they do so. At
  the start of each of the basilisk's turns, the Director can spend 1 Malice to let the basilisk
  continue burrowing.
malice.basilisk.upchuck.name: Upchuck
malice.basilisk.upchuck.description: |-
  Keywords: Area, Weapon · Main action

  Distance: 3 cube within 10 · Target: Each enemy in the area

  Effect: The basilisk spits up a chunk of partly digested stone.

  Power Roll + 2
malice.basilisk.upchuck.texts.tier1: 4 damage
malice.basilisk.upchuck.texts.tier2: 4 damage; A < 1 2 damage, prone
malice.basilisk.upchuck.texts.tier3: 4 damage; A < 2 5 damage, prone and can't stand (save ends)
malice.basilisk.walleye.name: Walleye
malice.basilisk.walleye.description: A basilisk spews reflective spittle across an adjacent vertical
  surface in a 3-square-by-3-square area. The basilisk can use their Petrifying Eye Beams ability to
  target a square in the area, causing the area and distance of that ability to become a 20 x 3 line
  within 1 square of the wall.
abilities.basilisk.basilisk-tonguesnapper.prehensile-tongue.name: Prehensile Tongue
abilities.basilisk.basilisk-tonguesnapper.prehensile-tongue.texts.target: One creature or object
abilities.basilisk.basilisk-tonguesnapper.prehensile-tongue.texts.distance: Melee 3
abilities.basilisk.basilisk-tonguesnapper.prehensile-tongue.texts.roll: Power Roll + 2
abilities.basilisk.basilisk-tonguesnapper.prehensile-tongue.texts.tier1: 8 acid damage; pull 1
abilities.basilisk.basilisk-tonguesnapper.prehensile-tongue.texts.tier2: 10 acid damage; pull 2
abilities.basilisk.basilisk-tonguesnapper.prehensile-tongue.texts.tier3: 14 acid damage; pull 3
abilities.basilisk.basilisk-tonguesnapper.prehensile-tongue.texts.effect: >-
  Effect: This ability can pull targets restrained by Petrifying Eye Beams, and ignores stability if
  it does so.


  3 Malice: The tonguesnapper targets two additional creatures or objects.
abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams.name: Petrifying Eye Beams
abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams.texts.target: Special
abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams.texts.distance: 5 × 2 line within 1
abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams.texts.roll: Power Roll + 2
abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams.texts.tier1: A < 0 restrained (save ends)
abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams.texts.tier2: A < 1 restrained (save ends)
abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams.texts.tier3: Slowed (save ends); or if A < 2 restrained (save ends)
abilities.basilisk.basilisk-tonguesnapper.petrifying-eye-beams.texts.effect: >-
  Special: The area extends from both the tonguesnapper’s eyes, and this ability targets the first
  creature without cover on either side of the area.


  Effect: If a target is already slowed, the potency increases by 1 for that target. A target
  restrained this way magically begins to turn to stone, and a target who ends two consecutive turns
  restrained this way is petrified. A target restrained this way or a creature adjacent to them can
  use a main action to cut encroaching stone from the target’s body, dealing 8 damage to the target
  that can’t be reduced in any way and ending this effect.
abilities.basilisk.basilisk-tonguesnapper.wink.name: Wink
abilities.basilisk.basilisk-tonguesnapper.wink.texts.target: One creature
abilities.basilisk.basilisk-tonguesnapper.wink.texts.distance: Melee 1 or ranged 10
abilities.basilisk.basilisk-tonguesnapper.wink.texts.roll: Power Roll + 2
abilities.basilisk.basilisk-tonguesnapper.wink.texts.tier1: 8 corruption damage; R < 0 dazed (save ends)
abilities.basilisk.basilisk-tonguesnapper.wink.texts.tier2: 10 corruption damage; R < 1 dazed (save ends)
abilities.basilisk.basilisk-tonguesnapper.wink.texts.tier3: 14 corruption damage; R < 2 dazed and slowed (save ends)
abilities.basilisk.basilisk-tonguesnapper.wink.texts.effect: 'Effect: A creature dazed this way
  can’t benefit from edges or double edges and can’t gain or use surges.'
abilities.basilisk.basilisk-tonguesnapper.neurotoxin-splash.name: Neurotoxin Splash
abilities.basilisk.basilisk-tonguesnapper.neurotoxin-splash.texts.trigger: The tonguesnapper takes damage from a melee ability.
abilities.basilisk.basilisk-tonguesnapper.neurotoxin-splash.texts.target: Each enemy in the area
abilities.basilisk.basilisk-tonguesnapper.neurotoxin-splash.texts.distance: 2 burst
abilities.basilisk.basilisk-tonguesnapper.neurotoxin-splash.texts.effect: 'Effect: Each target takes 4 acid damage. Any target who has M < 2 is also slowed (save ends).'
traits.basilisk.basilisk-tonguesnapper.petrifying-fumes.name: Petrifying Fumes
traits.basilisk.basilisk-tonguesnapper.petrifying-fumes.description: Any creature who starts their
  turn adjacent to the tonguesnapper and has M < 1 is slowed (save ends).
monsters.basilisk.basilisk-tonguesnapper.name: Basilisk Tonguesnapper
abilities.basilisk.basilisk.noxious-bite.name: Noxious Bite
abilities.basilisk.basilisk.noxious-bite.texts.target: Two creatures or objects
abilities.basilisk.basilisk.noxious-bite.texts.distance: Melee 1
abilities.basilisk.basilisk.noxious-bite.texts.roll: Power Roll + 2
abilities.basilisk.basilisk.noxious-bite.texts.tier1: 7 poison damage
abilities.basilisk.basilisk.noxious-bite.texts.tier2: 10 poison damage
abilities.basilisk.basilisk.noxious-bite.texts.tier3: 13 poison damage
abilities.basilisk.basilisk.noxious-bite.texts.effect: 'Effect: This ability gains an edge against
  targets the basilisk has previously dealt poison damage to.'
