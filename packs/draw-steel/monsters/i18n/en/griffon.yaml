malice.griffon.swoop.name: Swoop
malice.griffon.swoop.description: >-
  Maneuver


  Distance: Self · Target: Self


  Effect: The griffon flies up to their speed, and can make a free strike against each creature who
  makes an opportunity attack against them during this movement.
malice.griffon.piercing-cry.name: Piercing Cry
malice.griffon.piercing-cry.description: A griffon acting this turn unleashes a hideous screech at
  one enemy within 5 squares of them, forcing that creature to make an Intuition test.
malice.griffon.piercing-cry.texts.tier1: Frightened (save ends)
malice.griffon.piercing-cry.texts.tier2: Frightened (EoT)
malice.griffon.piercing-cry.texts.tier3: No effect.
malice.griffon.wildwinds.name: Wildwinds
malice.griffon.wildwinds.description: Winds bluster and blow across the encounter map. Until the end
  of the encounter, each creature who can't fly or isn't mounted on a flying creature takes a −3
  penalty to stability, and any forced movement effect targeting such a creature moves them an
  additional 5 squares.
abilities.griffon.griffon.claw-swipes.name: Claw Swipes
abilities.griffon.griffon.claw-swipes.texts.target: Two creatures or objects
abilities.griffon.griffon.claw-swipes.texts.distance: Melee 1
abilities.griffon.griffon.claw-swipes.texts.roll: Power Roll + 2
abilities.griffon.griffon.claw-swipes.texts.tier1: 7 damage; the griffon can shift 1 square
abilities.griffon.griffon.claw-swipes.texts.tier2: 10 damage; the griffon shifts up to 2 squares
abilities.griffon.griffon.claw-swipes.texts.tier3: 13 damage; the griffon shifts up to 3 squares
abilities.griffon.griffon.claw-swipes.texts.effect: 'Effect: If this ability is used as part of the
  Charge main action, the griffon can grab one of the targets.'
abilities.griffon.griffon.crack-the-earth.name: Crack the Earth
abilities.griffon.griffon.crack-the-earth.texts.target: Each enemy in the area
abilities.griffon.griffon.crack-the-earth.texts.distance: 3 cube within 8
abilities.griffon.griffon.crack-the-earth.texts.roll: Power Roll + 2
abilities.griffon.griffon.crack-the-earth.texts.tier1: 4 damage
abilities.griffon.griffon.crack-the-earth.texts.tier2: 6 damage; A < 1 push 3
abilities.griffon.griffon.crack-the-earth.texts.tier3: 9 damage; A < 2 push 4; prone
abilities.griffon.griffon.crack-the-earth.texts.effect: >-
  Special: The griffon must be flying and must have a creature or object grabbed.


  Effect: The griffon flies up to half their speed toward the ground, then sends the creature or
  object they've grabbed hurtling down. The creature or object hits the ground to turn the area into
  an impact crater, and takes falling damage that can't be reduced in any way.
abilities.griffon.griffon.wing-buffet.name: Wing Buffet
abilities.griffon.griffon.wing-buffet.texts.target: Each creature or object in the area
abilities.griffon.griffon.wing-buffet.texts.distance: 4 × 2 line within 1
abilities.griffon.griffon.wing-buffet.texts.roll: Power Roll + 2
abilities.griffon.griffon.wing-buffet.texts.tier1: Push 3; A < 0 the forced movement is vertical
abilities.griffon.griffon.wing-buffet.texts.tier2: Push 4; A < 1 the forced movement is vertical
abilities.griffon.griffon.wing-buffet.texts.tier3: Push 5; A < 2 the forced movement is vertical
abilities.griffon.griffon.wing-buffet.texts.effect: 'Special: A target object must be size 2 or smaller.'
abilities.griffon.griffon.zephyr-feint.name: Zephyr Feint
abilities.griffon.griffon.zephyr-feint.texts.trigger: The griffon takes damage.
abilities.griffon.griffon.zephyr-feint.texts.target: Self
abilities.griffon.griffon.zephyr-feint.texts.distance: Self
abilities.griffon.griffon.zephyr-feint.texts.effect: 'Effect: The griffon halves the damage, ignores
  any nondamaging effects associated with it, and shifts up to 2 squares.'
traits.griffon.griffon.beast-of-prey.name: Beast of Prey
traits.griffon.griffon.beast-of-prey.description: While grabbed by the griffon, a creature has a double bane on the Escape Grab maneuver.
traits.griffon.griffon.steady.name: Steady
traits.griffon.griffon.steady.description: Any power roll that could knock the griffon or their rider prone takes a bane.
monsters.griffon.griffon.name: Griffon
abilities.griffon.striped-condor-griffon.violent-thrashing.name: Violent Thrashing
abilities.griffon.striped-condor-griffon.violent-thrashing.texts.target: Two creatures or objects
abilities.griffon.striped-condor-griffon.violent-thrashing.texts.distance: Melee 2
abilities.griffon.striped-condor-griffon.violent-thrashing.texts.roll: Power Roll + 2
abilities.griffon.striped-condor-griffon.violent-thrashing.texts.tier1: 7 damage; push 1
abilities.griffon.striped-condor-griffon.violent-thrashing.texts.tier2: 11 damage; one target is
  pushed up to 2 squares; the other target is vertical pushed up to 2 squares
abilities.griffon.striped-condor-griffon.violent-thrashing.texts.tier3: 14 damage; one target is
  pushed up to 2 squares and knocked prone; the other target is vertical pushed up to 3 squares
abilities.griffon.striped-condor-griffon.bound-ahead.name: Bound Ahead
abilities.griffon.striped-condor-griffon.bound-ahead.texts.target: Self
abilities.griffon.striped-condor-griffon.bound-ahead.texts.distance: Self
abilities.griffon.striped-condor-griffon.bound-ahead.texts.effect: 'Effect: The griffon shifts up to
  their speed along the ground in straight line. Each enemy who comes adjacent to the griffon during
  this shift can choose to either take 5 damage or be knocked prone.'
abilities.griffon.striped-condor-griffon.power-wing-buffet.name: Power Wing Buffet
abilities.griffon.striped-condor-griffon.power-wing-buffet.texts.target: Each creature or object in the area
abilities.griffon.striped-condor-griffon.power-wing-buffet.texts.distance: 5 × 3 line within 1
abilities.griffon.striped-condor-griffon.power-wing-buffet.texts.roll: Power Roll + 2
abilities.griffon.striped-condor-griffon.power-wing-buffet.texts.tier1: Push 2; M < 0 the forced movement is vertical
abilities.griffon.striped-condor-griffon.power-wing-buffet.texts.tier2: Push 4; M < 1 the forced movement is vertical
abilities.griffon.striped-condor-griffon.power-wing-buffet.texts.tier3: Push 6; M < 2 the forced movement is vertical
abilities.griffon.striped-condor-griffon.circle-and-strike.name: Circle and Strike
abilities.griffon.striped-condor-griffon.circle-and-strike.texts.trigger: The griffon flies directly above a creature within distance.
abilities.griffon.striped-condor-griffon.circle-and-strike.texts.target: The triggering creature
abilities.griffon.striped-condor-griffon.circle-and-strike.texts.distance: Ranged 5
abilities.griffon.striped-condor-griffon.circle-and-strike.texts.effect: 'Effect: The griffon dives
  down onto the target, taking no damage from falling if they reach the ground. The target takes 3
  damage for each square the griffon dove, and if they have A < 2, they are grabbed or knocked
  prone.'
traits.griffon.striped-condor-griffon.beast-of-prey.name: Beast of Prey
traits.griffon.striped-condor-griffon.beast-of-prey.description: While grabbed by the griffon, a creature has a double bane on the Escape Grab maneuver.
traits.griffon.striped-condor-griffon.steady.name: Steady
traits.griffon.striped-condor-griffon.steady.description: Any power roll that could knock the griffon prone takes a bane.
traits.griffon.striped-condor-griffon.banded-predator.name: Banded Predator
traits.griffon.striped-condor-griffon.banded-predator.description: The griffon can attempt hide even
  while observed. Additionally, while no enemy has line of effect to them, the griffon can attempt
  to hide at the end of their turn.
monsters.griffon.striped-condor-griffon.name: Striped Condor Griffon
