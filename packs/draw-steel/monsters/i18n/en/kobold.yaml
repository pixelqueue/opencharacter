malice.kobold.maniple-tactics.name: Maniple Tactics
malice.kobold.maniple-tactics.description: Up to 3 kobolds make a free strike, swaps positions with
  an adjacent kobold, and then that kobold makes a free strike.
malice.kobold.set-the-initiative.name: Set the Initiative
malice.kobold.set-the-initiative.description: Two kobolds take their turns in a row.
malice.kobold.shield-wall.name: Shield Wall
malice.kobold.shield-wall.description: Until the end of the round, all kobolds with Shield? Shield!
  impose an additional bane on incoming strikes and abilities.
abilities.kobold.kobold-adeptus.shocking-bolt.name: Shocking Bolt
abilities.kobold.kobold-adeptus.shocking-bolt.texts.target: One creature or object
abilities.kobold.kobold-adeptus.shocking-bolt.texts.distance: Ranged 15
abilities.kobold.kobold-adeptus.shocking-bolt.texts.roll: Power Roll + 2
abilities.kobold.kobold-adeptus.shocking-bolt.texts.tier1: 4 lightning damage
abilities.kobold.kobold-adeptus.shocking-bolt.texts.tier2: 6 lightning damage
abilities.kobold.kobold-adeptus.shocking-bolt.texts.tier3: 7 lightning damage
abilities.kobold.kobold-adeptus.shocking-bolt.texts.effect: 'Effect: While the target is adjacent to
  any enemy, the adeptus gains an edge on this ability. Each enemy adjacent to the target takes 2
  lighting damage.'
abilities.kobold.kobold-adeptus.arcane-telum.name: Arcane Telum
abilities.kobold.kobold-adeptus.arcane-telum.texts.target: Three creatures or objects
abilities.kobold.kobold-adeptus.arcane-telum.texts.distance: Ranged 15
abilities.kobold.kobold-adeptus.arcane-telum.texts.roll: Power Roll + 2
abilities.kobold.kobold-adeptus.arcane-telum.texts.tier1: 3 damage
abilities.kobold.kobold-adeptus.arcane-telum.texts.tier2: 5 damage
abilities.kobold.kobold-adeptus.arcane-telum.texts.tier3: 6 damage
abilities.kobold.kobold-adeptus.arcane-telum.texts.effect: 'Effect: This ability ignores banes, double banes, and damage immunity.'
traits.kobold.kobold-adeptus.shield-shield.name: Shield? Shield!
traits.kobold.kobold-adeptus.shield-shield.description: While adjacent to an ally who also has this
  trait, the adeptus has stability 1, has cover, and grants cover to allies.
monsters.kobold.kobold-adeptus.name: Kobold Adeptus
abilities.kobold.kobold-artifex.chain-hook.name: Chain Hook
abilities.kobold.kobold-artifex.chain-hook.texts.target: One creature or object
abilities.kobold.kobold-artifex.chain-hook.texts.distance: Ranged 5
abilities.kobold.kobold-artifex.chain-hook.texts.roll: Power Roll + 2
abilities.kobold.kobold-artifex.chain-hook.texts.tier1: 3 damage; pull 1
abilities.kobold.kobold-artifex.chain-hook.texts.tier2: 4 damage; pull 2
abilities.kobold.kobold-artifex.chain-hook.texts.tier3: 5 damage; pull 3
abilities.kobold.kobold-artifex.chain-hook.texts.effect: 'Effect: If this forced movement triggers a
  trap that uses a power roll, that roll has a double edge.'
abilities.kobold.kobold-artifex.activate-trap.name: Activate Trap
abilities.kobold.kobold-artifex.activate-trap.texts.target: One trap or other terrain object
abilities.kobold.kobold-artifex.activate-trap.texts.distance: Ranged 10
abilities.kobold.kobold-artifex.activate-trap.texts.effect: >-
  Effect: The trap or terrain object instantly triggers.


  3 Malice: The artifex places a new trap in the encounter and can instantly trigger it. The artifex
  prefers working with angry beehives, flammable oil, snare traps, and spike traps (see Dynamic
  Terrain).
traits.kobold.kobold-artifex.shield-shield.name: Shield? Shield!
traits.kobold.kobold-artifex.shield-shield.description: While adjacent to an ally who also has this
  trait, the artifex has stability 1, has cover, and grants cover to allies.
monsters.kobold.kobold-artifex.name: Kobold Artifex
abilities.kobold.kobold-centurion.pilum.name: Pilum
abilities.kobold.kobold-centurion.pilum.texts.target: Two creatures or objects
abilities.kobold.kobold-centurion.pilum.texts.distance: Melee 1 or ranged 10
abilities.kobold.kobold-centurion.pilum.texts.roll: Power Roll + 3
abilities.kobold.kobold-centurion.pilum.texts.tier1: 7 damage; M < 1 weakened (save ends)
abilities.kobold.kobold-centurion.pilum.texts.tier2: 10 damage; M < 1 weakened (save ends)
abilities.kobold.kobold-centurion.pilum.texts.tier3: 13 damage; M < 1 weakened (save ends)
abilities.kobold.kobold-centurion.pilum.texts.effect: |-
  Effect: Each ally adjacent to a target can make a free strike against that target.

  3 Malice: While weakened this way, a target is also restrained.
abilities.kobold.kobold-centurion.concentrate-all-fire-on-that-hero.name: Concentrate All Fire on That Hero!
abilities.kobold.kobold-centurion.concentrate-all-fire-on-that-hero.texts.target: One enemy
abilities.kobold.kobold-centurion.concentrate-all-fire-on-that-hero.texts.distance: Ranged 10
abilities.kobold.kobold-centurion.concentrate-all-fire-on-that-hero.texts.effect:
  "Effect: Until the start of the centurion's next turn, the centurion and their allies gain an edge
  on power rolls against the target."
abilities.kobold.kobold-centurion.testudo.name: Testudo!
abilities.kobold.kobold-centurion.testudo.texts.trigger: A creature uses an ability that targets the centurion or an ally of the centurion within distance.
abilities.kobold.kobold-centurion.testudo.texts.target: Each ally in the area
abilities.kobold.kobold-centurion.testudo.texts.distance: 5 burst
abilities.kobold.kobold-centurion.testudo.texts.effect: 'Effect: Each target shifts up to 2 squares
  before the damage is resolved. Each kobold with the Shield? Shield! trait gains damage immunity 2
  against the triggering ability.'
traits.kobold.kobold-centurion.end-effect.name: End Effect
traits.kobold.kobold-centurion.end-effect.description: At the end of each of their turns, the
  centurion can take 5 damage to end one effect on them that can be ended by a saving throw. This
  damage can't be reduced in any way.
abilities.kobold.kobold-centurion.firetail-pilum.name: Firetail Pilum
abilities.kobold.kobold-centurion.firetail-pilum.texts.target: Special
abilities.kobold.kobold-centurion.firetail-pilum.texts.distance: Special
abilities.kobold.kobold-centurion.firetail-pilum.texts.effect: 'Effect: The centurion moves up to
  their speed, ignoring difficult terrain, and uses Pilum against each creature whose space they
  move through. They make one power roll against all targets, and the ability deals an extra 5
  damage. While weakened by that ability, each target takes 2 fire damage at the start of each of
  their turns.'
abilities.kobold.kobold-centurion.boom-pilum.name: Boom Pilum!
abilities.kobold.kobold-centurion.boom-pilum.texts.target: Each enemy in the area
abilities.kobold.kobold-centurion.boom-pilum.texts.distance: 5 cube within 10
abilities.kobold.kobold-centurion.boom-pilum.texts.effect: 'Effect: The centurion uses Pilum against
  each target and has a double edge. Each target is then pushed up to 3 squares.'
abilities.kobold.kobold-centurion.are-you-not-entertained.name: Are You Not Entertained?!
abilities.kobold.kobold-centurion.are-you-not-entertained.texts.target: Each enemy in the area
abilities.kobold.kobold-centurion.are-you-not-entertained.texts.distance: 10 burst
abilities.kobold.kobold-centurion.are-you-not-entertained.texts.effect: 'Effect: A target who has P
  < 2 is taunted (save ends). Each ally within distance can make a free strike. Additionally, until
  the end of the encounter, the centurion has damage immunity 2.'
traits.kobold.kobold-centurion.shield-shield.name: Shield? Shield!
traits.kobold.kobold-centurion.shield-shield.description: While adjacent to an ally who also has
  this trait, the centurion has stability 3, has cover, and grants cover to allies.
monsters.kobold.kobold-centurion.name: Kobold Centurion
abilities.kobold.kobold-legionary.gladius.name: Gladius
abilities.kobold.kobold-legionary.gladius.texts.target: One creature or object
abilities.kobold.kobold-legionary.gladius.texts.distance: Melee 1
abilities.kobold.kobold-legionary.gladius.texts.roll: Power Roll + 2
abilities.kobold.kobold-legionary.gladius.texts.tier1: 3 damage; taunted (EoT)
abilities.kobold.kobold-legionary.gladius.texts.tier2: 4 damage; taunted (EoT)
abilities.kobold.kobold-legionary.gladius.texts.tier3: 5 damage; taunted (EoT)
abilities.kobold.kobold-legionary.gladius.texts.effect: '3 Malice: If the legionary is acting as a
  captain, they and each member of their squad shift up to 2 squares before this ability is used.'
abilities.kobold.kobold-legionary.shield-bash.name: Shield Bash
abilities.kobold.kobold-legionary.shield-bash.texts.target: One creature or object
abilities.kobold.kobold-legionary.shield-bash.texts.distance: Melee 1
abilities.kobold.kobold-legionary.shield-bash.texts.roll: Power Roll + 2
abilities.kobold.kobold-legionary.shield-bash.texts.tier1: 2 damage; push 1; M < 0 prone
abilities.kobold.kobold-legionary.shield-bash.texts.tier2: 3 damage; push 1; M < 1 prone
abilities.kobold.kobold-legionary.shield-bash.texts.tier3: 4 damage; push 1; M < 2 prone
traits.kobold.kobold-legionary.shield-shield.name: Shield? Shield!
traits.kobold.kobold-legionary.shield-shield.description: While adjacent to an ally who also has
  this trait, the legionary has stability 1, has cover, and grants cover to allies.
monsters.kobold.kobold-legionary.name: Kobold Legionary
monsters.kobold.kobold-princeps.texts.withCaptain: +2 bonus to Stamina
abilities.kobold.kobold-princeps.hasta.name: Hasta
abilities.kobold.kobold-princeps.hasta.texts.target: One creature or object per minion
abilities.kobold.kobold-princeps.hasta.texts.distance: Melee 2
abilities.kobold.kobold-princeps.hasta.texts.roll: Power Roll + 2
abilities.kobold.kobold-princeps.hasta.texts.tier1: 1 damage
abilities.kobold.kobold-princeps.hasta.texts.tier2: 2 damage
abilities.kobold.kobold-princeps.hasta.texts.tier3: 3 damage
abilities.kobold.kobold-princeps.hasta.texts.effect: 'Effect: One ally within 3 squares of the princeps shifts up to 2 squares.'
traits.kobold.kobold-princeps.shield-shield.name: Shield? Shield!
traits.kobold.kobold-princeps.shield-shield.description: While adjacent to an ally who also has this
  trait, the princeps has stability 1, has cover, and grants cover to allies.
monsters.kobold.kobold-princeps.name: Kobold Princeps
monsters.kobold.kobold-sagittarion.texts.withCaptain: +5 bonus to ranged distance
abilities.kobold.kobold-sagittarion.composite-bow.name: Composite Bow
abilities.kobold.kobold-sagittarion.composite-bow.texts.target: One creature or object per minion
abilities.kobold.kobold-sagittarion.composite-bow.texts.distance: Ranged 10
abilities.kobold.kobold-sagittarion.composite-bow.texts.roll: Power Roll + 2
abilities.kobold.kobold-sagittarion.composite-bow.texts.tier1: 2 damage
abilities.kobold.kobold-sagittarion.composite-bow.texts.tier2: 4 damage
abilities.kobold.kobold-sagittarion.composite-bow.texts.tier3: 5 damage
abilities.kobold.kobold-sagittarion.composite-bow.texts.effect: 'Effect: While adjacent to any ally, the sagittarion gains an edge on this ability.'
traits.kobold.kobold-sagittarion.shield-shield.name: Shield? Shield!
traits.kobold.kobold-sagittarion.shield-shield.description: While adjacent to an ally who also has
  this trait, the sagittarion has stability 1, has cover, and grants cover to allies.
monsters.kobold.kobold-sagittarion.name: Kobold Sagittarion
