abilities.kobold.kobold-signifer.signum.texts.target: One creature or object
abilities.kobold.kobold-signifer.signum.texts.distance: Melee 1
abilities.kobold.kobold-signifer.signum.texts.roll: Power Roll + 2
abilities.kobold.kobold-signifer.signum.texts.tier1: 3 damage
abilities.kobold.kobold-signifer.signum.texts.tier2: 4 damage
abilities.kobold.kobold-signifer.signum.texts.tier3: 5 damage
abilities.kobold.kobold-signifer.signum.texts.effect: >-
  Effect: One ally within 10 squares of the signifer can shift up to their speed if they end that
  shift adjacent to an ally.


  2+ Malice: One additional ally can shift for each 2 Malice spent.
abilities.kobold.kobold-signifer.glory-to-the-legion.name: Glory to the Legion
abilities.kobold.kobold-signifer.glory-to-the-legion.texts.target: Each ally in the area
abilities.kobold.kobold-signifer.glory-to-the-legion.texts.distance: 5 burst
abilities.kobold.kobold-signifer.glory-to-the-legion.texts.effect: 'Effect: Each target regains 5 Stamina.'
traits.kobold.kobold-signifer.shield-shield.name: Shield? Shield!
traits.kobold.kobold-signifer.shield-shield.description: While adjacent to an ally who also has this
  trait, the signifer has stability 1, has cover, and grants cover to allies.
traits.kobold.kobold-signifer.upholding-high-standards.name: Upholding High Standards
traits.kobold.kobold-signifer.upholding-high-standards.description: Any ally who starts their turn
  within 5 squares of the signifer gains a +2 bonus to speed and a +2 damage bonus to strikes until
  the end of their turn. Additionally, if the signifer is killed, any kobold minion can enter their
  space during the same encounter to retrieve the signum battle standard they carry (no action
  required) and replace their stat block with the signifer stat block.
monsters.kobold.kobold-signifer.name: Kobold Signifer
monsters.kobold.kobold-tiro.texts.withCaptain: +1 bonus to speed
abilities.kobold.kobold-tiro.pugio.name: Pugio
