abilities.kobold.kobold-tiro.pugio.texts.distance: Melee 1
abilities.kobold.kobold-tiro.pugio.texts.roll: Power Roll + 2
abilities.kobold.kobold-tiro.pugio.texts.tier1: 1 damage
abilities.kobold.kobold-tiro.pugio.texts.tier2: 2 damage; the tiro can shift 1 square
abilities.kobold.kobold-tiro.pugio.texts.tier3: 3 damage; the tiro shifts up to 2 squares
abilities.kobold.kobold-tiro.pugio.texts.effect: "Effect: The target can't shift until the start of the tiro's next turn."
traits.kobold.kobold-tiro.shield-shield.name: Shield? Shield!
traits.kobold.kobold-tiro.shield-shield.description: While adjacent to an ally who also has this
  trait, the tiro has stability 1, has cover, and grants cover to allies.
monsters.kobold.kobold-tiro.name: Kobold Tiro
monsters.kobold.kobold-veles.texts.withCaptain: +1 bonus to speed
abilities.kobold.kobold-veles.pilum.name: Pilum
abilities.kobold.kobold-veles.pilum.texts.target: One creature or object per minion
abilities.kobold.kobold-veles.pilum.texts.distance: Melee 1 or Ranged 5
abilities.kobold.kobold-veles.pilum.texts.roll: Power Roll + 2
abilities.kobold.kobold-veles.pilum.texts.tier1: 1 damage
abilities.kobold.kobold-veles.pilum.texts.tier2: 2 damage
abilities.kobold.kobold-veles.pilum.texts.tier3: 3 damage
abilities.kobold.kobold-veles.pilum.texts.effect: "Effect: Until the start of the veles's next turn,
  the target can't make opportunity attacks against any kobold."
traits.kobold.kobold-veles.shield-shield.name: Shield? Shield!
traits.kobold.kobold-veles.shield-shield.description: While adjacent to an ally who also has this
  trait, the veles has stability 1, has cover, and grants cover to allies.
monsters.kobold.kobold-veles.name: Kobold Veles
abilities.kobold.kobold-venator.dolabra-and-net.name: Dolabra and Net
abilities.kobold.kobold-venator.dolabra-and-net.texts.target: One creature or object
abilities.kobold.kobold-venator.dolabra-and-net.texts.distance: Melee 1
abilities.kobold.kobold-venator.dolabra-and-net.texts.roll: Power Roll + 2
abilities.kobold.kobold-venator.dolabra-and-net.texts.tier1: 4 damage
abilities.kobold.kobold-venator.dolabra-and-net.texts.tier2: 6 damage; M < 1 restrained (save ends)
abilities.kobold.kobold-venator.dolabra-and-net.texts.tier3: 7 damage; M < 2 restrained (save ends)
abilities.kobold.kobold-venator.dolabra-and-net.texts.effect: '3 Malice: The venator lights their
  net on fire, and a target restrained this way takes 2 fire damage at the start of each of their
  turns.'
traits.kobold.kobold-venator.lost-in-the-crowd.name: Lost in the Crowd
traits.kobold.kobold-venator.lost-in-the-crowd.description: While the venator is adjacent to any
  ally who is not hiding, the venator can attempt to hide as if they had concealment, even if
  observed.
traits.kobold.kobold-venator.not-what-i-seem.name: Not What I Seem
traits.kobold.kobold-venator.not-what-i-seem.description: The venator starts the encounter disguised
  as a minion. They have a double edge on their first main action of the encounter, after which they
  reveal themself.
traits.kobold.kobold-venator.shield-shield.name: Shield? Shield!
traits.kobold.kobold-venator.shield-shield.description: While adjacent to an ally who also has this
  trait, the venator has stability 1, has cover, and grants cover to allies.
monsters.kobold.kobold-venator.name: Kobold Venator
abilities.kobold.shieldscale-drangolin.fiery-claws.name: Fiery Claws
abilities.kobold.shieldscale-drangolin.fiery-claws.texts.target: Two creatures or objects
abilities.kobold.shieldscale-drangolin.fiery-claws.texts.distance: Melee 1
abilities.kobold.shieldscale-drangolin.fiery-claws.texts.roll: Power Roll + 2
abilities.kobold.shieldscale-drangolin.fiery-claws.texts.tier1: 7 fire damage
abilities.kobold.shieldscale-drangolin.fiery-claws.texts.tier2: 10 fire damage
abilities.kobold.shieldscale-drangolin.fiery-claws.texts.tier3: 13 fire damage
abilities.kobold.shieldscale-drangolin.fiery-claws.texts.effect: 'Special: If the drangolin is size 3, the distance becomes Melee 2.'
abilities.kobold.shieldscale-drangolin.drangolin-plume.name: Drangolin Plume
abilities.kobold.shieldscale-drangolin.drangolin-plume.texts.target: Self
abilities.kobold.shieldscale-drangolin.drangolin-plume.texts.distance: Self; see below
abilities.kobold.shieldscale-drangolin.drangolin-plume.texts.effect: 'Effect: The drangolin shifts
  up to their speed and uses Fiery Claws against each creature who comes adjacent to them during the
  shift. The drangolin makes one power roll against all targets.'
abilities.kobold.shieldscale-drangolin.erupt.name: Erupt
abilities.kobold.shieldscale-drangolin.erupt.texts.target: Each creature in the area
abilities.kobold.shieldscale-drangolin.erupt.texts.distance: 2 burst
abilities.kobold.shieldscale-drangolin.erupt.texts.roll: Power Roll + 2
abilities.kobold.shieldscale-drangolin.erupt.texts.tier1: 6 damage; push 1; A < 0 prone
abilities.kobold.shieldscale-drangolin.erupt.texts.tier2: 8 damage; push 3; A < 0 prone
abilities.kobold.shieldscale-drangolin.erupt.texts.tier3: 11 damage; push 5; A < 0 prone
abilities.kobold.shieldscale-drangolin.erupt.texts.effect: 'Effect: The drangolin uses the Dig
  maneuver to breach the surface before using this ability. Each target in the area where the
  drangolin breaches takes an extra 2 fire damage.'
traits.kobold.shieldscale-drangolin.ashen-cloud.name: Ashen Cloud
traits.kobold.shieldscale-drangolin.ashen-cloud.description: Any ally adjacent to the drangolin has concealment.
traits.kobold.shieldscale-drangolin.burrow-bond.name: Burrow Bond
traits.kobold.shieldscale-drangolin.burrow-bond.description: When the drangolin burrows, each adjacent size 1S or smaller ally can move with them.
monsters.kobold.shieldscale-drangolin.name: Shieldscale Drangolin
abilities.kobold.trained-gummy-brick.engulf.name: Engulf
abilities.kobold.trained-gummy-brick.engulf.texts.target: One creature or object
abilities.kobold.trained-gummy-brick.engulf.texts.distance: Melee 1
abilities.kobold.trained-gummy-brick.engulf.texts.roll: Power Roll + 2
abilities.kobold.trained-gummy-brick.engulf.texts.tier1: 7 acid damage; A < 0 dazed (save ends)
abilities.kobold.trained-gummy-brick.engulf.texts.tier2: 10 acid damage; A < 1 dazed (save ends)
abilities.kobold.trained-gummy-brick.engulf.texts.tier3: 14 acid damage; A < 2 restrained (save ends)
abilities.kobold.trained-gummy-brick.engulf.texts.effect: >-
  Effect: A size 2 or smaller creature restrained this way is pulled into the brick's space, moves
  with the brick, and takes 4 acid damage at the start of each of their turns. An engulfed creature
  who is no longer restrained moves to the nearest unoccupied space adjacent to the brick. The brick
  can have as many creatures or objects engulfed as will fit within their space.


  2 Malice: This ability targets one additional target.
abilities.kobold.trained-gummy-brick.you-didnt-pay-attention.name: You Didn't Pay Attention!
abilities.kobold.trained-gummy-brick.you-didnt-pay-attention.texts.trigger: A creature moves or is force moved adjacent to the brick.
abilities.kobold.trained-gummy-brick.you-didnt-pay-attention.texts.target: One creature or object
abilities.kobold.trained-gummy-brick.you-didnt-pay-attention.texts.distance: Self
abilities.kobold.trained-gummy-brick.you-didnt-pay-attention.texts.effect: 'Effect: The brick uses Engulf against the triggering creature and has a double edge.'
traits.kobold.trained-gummy-brick.translucent-brick.name: Translucent Brick
traits.kobold.trained-gummy-brick.translucent-brick.description: The brick completely occupies their
  space, blocking line of effect for enemies. The brick is hidden until they act.
monsters.kobold.trained-gummy-brick.name: Trained Gummy Brick
effects.kobold.centurion-immunity.name: Damage immunity 2
effects.kobold.centurion-immunity.description: Until the end of the encounter, the centurion has damage immunity 2.
effects.kobold.no-opportunity-attacks.name: No opportunity attacks
effects.kobold.no-opportunity-attacks.description: Until the start of the veles's next turn, the
  target can't make opportunity attacks against any kobold.
effects.kobold.burning-net.name: Restrained (burning net)
effects.kobold.burning-net.description: A target restrained this way takes 2 fire damage at the start of each of their turns.
effects.kobold.concentrated-fire.name: Concentrated fire
effects.kobold.concentrated-fire.description: Until the start of the centurion's next turn, the centurion and their allies gain an edge on power rolls against the target.
effects.kobold.pinned.name: Weakened and restrained (Pilum)
effects.kobold.pinned.description: 'While weakened this way, a target is also restrained.'
