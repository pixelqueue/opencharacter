pack.name: Draw Steel Monsters
# A monster's sheet: "Goblin Monarch, Level 1 Leader", "Goblin Spinecleaver, Level 1 Minion Brute";
# the Director's: "Director, 9 Malice". A sheet takes the headline of its last pack that has one,
# so a hero's sheet with this pack is worded here too, as the heroes pack words it.
headline: >-
  {has_type_monster, select,
    true {{type_monster_each}}
    other {{has_type_director, select,
      true {Director, {field_malice} Malice}
      other {{has_type_class, select,
        true {Level {field_level} {has_type_ancestry, select, true {{type_ancestry} } other {}}{type_class}{has_type_subclass, select, true { ({type_subclass})} other {}}}
        other {{has_type_ancestry, select, true {{type_ancestry}} other {}}}}}}}}

