effects.ajax-the-invincible.bleeding-slowed.name: Bleeding and slowed
effects.ajax-the-invincible.bleeding-slowed.description: The target is bleeding and slowed (save ends).
effects.ajax-the-invincible.marked.name: Marked by Ajax
effects.ajax-the-invincible.marked.description: The target is marked while Ajax is marked. While the target is marked this way, Ajax gains an edge on power rolls against them, and whenever the target uses a triggered action involving their mark on Ajax, he can make a free strike against them.
