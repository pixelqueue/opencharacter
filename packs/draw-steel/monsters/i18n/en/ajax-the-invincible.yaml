malice.ajax-the-invincible.reason.name: Reason
malice.ajax-the-invincible.reason.description: Ajax attempts to instill doubt into a creature
  within line of effect through logic and reason. The creature and Ajax make an opposed Reason test.
  If Ajax wins, he chooses to either deal 11 extra damage to one target on his next strike or to
  gain an additional triggered action during the current round. Ajax can't use this feature against
  the same creature during the same encounter.
malice.ajax-the-invincible.nexus-jewel.name: Nexus Jewel
malice.ajax-the-invincible.nexus-jewel.description: >-
  Until the end of the round, Ajax chooses one of the following environments he has previously
  visited and overlays that environment on top of the encounter map, temporarily merging multiple
  realities.


  Incredibly High Above the Ground: The winds whip and bluster. Any creature who can't fly takes a
  −3 penalty to stability, and forced movement effects gain a +3 bonus to their distance against
  such creatures.


  Swamp: The ground is difficult terrain for enemies. Any creature who starts and ends their turn in
  the same space is restrained (save ends).


  Volcanic Canyon: The air is stiflingly hot. Each enemy takes 5 fire damage for each square they
  enter.
malice.ajax-the-invincible.solo-action.name: Solo Action
malice.ajax-the-invincible.solo-action.description: Ajax takes an additional main action on his turn. He can use this feature even if he is dazed.
malice.ajax-the-invincible.draw-steel.name: Draw Steel
malice.ajax-the-invincible.draw-steel.description: >-
  Keywords: Area, Magic, Ranged, Weapon · Main action


  Distance: Four 3 cubes within 10 · Target: Each enemy and object in the area


  Effect: Each target makes a test using their highest characteristic.


  Ajax then raises his Blade of the Gol King above his head as four giant blades emerge from the
  ground to fill the area. Each target is pushed into an unoccupied space adjacent to the area after
  the power roll is resolved. Each blade blocks line of effect and can be dismissed by Ajax at will
  (no action required).
malice.ajax-the-invincible.draw-steel.texts.tier1: 26 damage; bleeding and slowed (save ends)
malice.ajax-the-invincible.draw-steel.texts.tier2: 22 damage; bleeding (save ends)
malice.ajax-the-invincible.draw-steel.texts.tier3: 16 damage
traits.ajax-the-invincible.ajax-the-invincible.ajax.name: Ajax
traits.ajax-the-invincible.ajax-the-invincible.ajax.description: >-
  Ajax Turns: Ajax takes up to three turns each round. He can't take turns consecutively.
  Additionally, he can use three triggered actions in a round while he isn't dazed.


  End Effect: At the end of each of his turns, Ajax can take 20 damage to end up to two effects on
  him that can be ended by a saving throw. This damage can't be reduced in any way.
abilities.ajax-the-invincible.ajax-the-invincible.blade-of-the-gol-king.name: Blade of the Gol King
abilities.ajax-the-invincible.ajax-the-invincible.blade-of-the-gol-king.texts.target: Two creatures or objects
abilities.ajax-the-invincible.ajax-the-invincible.blade-of-the-gol-king.texts.distance: Melee 1
abilities.ajax-the-invincible.ajax-the-invincible.blade-of-the-gol-king.texts.roll: Power Roll + 5
abilities.ajax-the-invincible.ajax-the-invincible.blade-of-the-gol-king.texts.tier1: 16 damage; M < 4 the target loses 1d3 Recoveries
abilities.ajax-the-invincible.ajax-the-invincible.blade-of-the-gol-king.texts.tier2: 22 damage; M < 5 the target loses 1d3 Recoveries
abilities.ajax-the-invincible.ajax-the-invincible.blade-of-the-gol-king.texts.tier3: 26 damage; M < 6 prone and the target loses 1d3 Recoveries
abilities.ajax-the-invincible.ajax-the-invincible.blade-of-the-gol-king.texts.effect: |-
  Effect: Ajax shifts up to 2 squares between striking each target.

  1+ Malice: Ajax can strike one additional target for each Malice spent.
abilities.ajax-the-invincible.ajax-the-invincible.decree-by-the-jade-hand.name: Decree by the Jade Hand
abilities.ajax-the-invincible.ajax-the-invincible.decree-by-the-jade-hand.texts.target: Each enemy and object in the area
abilities.ajax-the-invincible.ajax-the-invincible.decree-by-the-jade-hand.texts.distance: 3 cube within 10
abilities.ajax-the-invincible.ajax-the-invincible.decree-by-the-jade-hand.texts.roll: Power Roll + 5
abilities.ajax-the-invincible.ajax-the-invincible.decree-by-the-jade-hand.texts.tier1: 11 holy damage; slide 2; P < 4 the target is hexed (save ends)
abilities.ajax-the-invincible.ajax-the-invincible.decree-by-the-jade-hand.texts.tier2: 17 holy damage; slide 5; P < 5 the target is hexed (save ends)
abilities.ajax-the-invincible.ajax-the-invincible.decree-by-the-jade-hand.texts.tier3: 21 holy damage; slide 8; P < 6 the target is hexed (save ends)
abilities.ajax-the-invincible.ajax-the-invincible.decree-by-the-jade-hand.texts.effect: >-
  Effect: A hexed target glows green, and each of their heroic abilities has its cost increased by
  2.


  3 Malice: The potency increases by 1. Additionally, the ground beneath the area drops 3 squares
  and is difficult terrain. Each flying target who has M < 5 is knocked prone.
abilities.ajax-the-invincible.ajax-the-invincible.divine-vine.name: Divine Vine
abilities.ajax-the-invincible.ajax-the-invincible.divine-vine.texts.target: One creature or object
abilities.ajax-the-invincible.ajax-the-invincible.divine-vine.texts.distance: Ranged 5
abilities.ajax-the-invincible.ajax-the-invincible.divine-vine.texts.roll: Power Roll + 5
abilities.ajax-the-invincible.ajax-the-invincible.divine-vine.texts.tier1: No effect.
abilities.ajax-the-invincible.ajax-the-invincible.divine-vine.texts.tier2: The target is grabbed.
abilities.ajax-the-invincible.ajax-the-invincible.divine-vine.texts.tier3: 11 damage; the target is grabbed.
abilities.ajax-the-invincible.ajax-the-invincible.divine-vine.texts.effect: >-
  Effect: If the target is grabbed, Ajax can choose to keep the vine extended, pull the target
  adjacent to him, or pull himself adjacent to the target. The vine stays attached to a grabbed
  target until it takes damage from a strike, the target escapes the grab, or Ajax causes the vine
  to release the target (no action required).


  Special: This ability can be replaced with the features of a different treasure Ajax has acquired.
abilities.ajax-the-invincible.ajax-the-invincible.bead-of-hell.name: Bead of Hell
abilities.ajax-the-invincible.ajax-the-invincible.bead-of-hell.texts.target: Special
abilities.ajax-the-invincible.ajax-the-invincible.bead-of-hell.texts.distance: 5 cube within 20
abilities.ajax-the-invincible.ajax-the-invincible.bead-of-hell.texts.effect: "Effect: Ajax throws a
  glowing bead to a square within distance, which ignites at the start of Ajax's next turn and
  creates an area around it that lasts until the start of Ajax's following turn. Each enemy in the
  area when the bead ignites takes 20 fire damage, and if they have A < 5, they are dazed (save
  ends). Any enemy who starts their turn in the area takes 10 fire damage."
traits.ajax-the-invincible.ajax-the-invincible.im-not-done-yet.name: I'm Not Done Yet.
traits.ajax-the-invincible.ajax-the-invincible.im-not-done-yet.description: Ajax dies only when his
  Stamina reaches −350. While his Stamina is below 0, Ajax is bleeding, he can choose any two
  options from his Tactical Stance trait each round, and the Director gains 2 additional Malice per
  round.
abilities.ajax-the-invincible.ajax-the-invincible.is-this-what-they-taught-you.name: Is This What They Taught You?
abilities.ajax-the-invincible.ajax-the-invincible.is-this-what-they-taught-you.texts.trigger: A creature within distance marks Ajax.
abilities.ajax-the-invincible.ajax-the-invincible.is-this-what-they-taught-you.texts.target: The triggering creature
abilities.ajax-the-invincible.ajax-the-invincible.is-this-what-they-taught-you.texts.distance: Ranged 10
abilities.ajax-the-invincible.ajax-the-invincible.is-this-what-they-taught-you.texts.effect:
  'Effect: The target is marked while Ajax is marked. While the target is marked this way, Ajax
  gains an edge on power rolls against them, and whenever the target uses a triggered action
  involving their mark on Ajax, he can make a free strike against them.'
abilities.ajax-the-invincible.ajax-the-invincible.shieldbreaker-talisman.name: Shieldbreaker Talisman
abilities.ajax-the-invincible.ajax-the-invincible.shieldbreaker-talisman.texts.trigger: An enemy within distance uses an ability to reduce damage.
abilities.ajax-the-invincible.ajax-the-invincible.shieldbreaker-talisman.texts.target: The triggering creature
abilities.ajax-the-invincible.ajax-the-invincible.shieldbreaker-talisman.texts.distance: Melee 5
abilities.ajax-the-invincible.ajax-the-invincible.shieldbreaker-talisman.texts.effect:
  "Effect: Ajax makes a free strike against the target, dealing extra damage equal to twice the
  amount that was reduced. This extra damage can't be reduced in any way."
abilities.ajax-the-invincible.ajax-the-invincible.whos-hesitating.name: Who's Hesitating?
abilities.ajax-the-invincible.ajax-the-invincible.whos-hesitating.texts.trigger: A creature uses the Hesitation is Weakness ability.
abilities.ajax-the-invincible.ajax-the-invincible.whos-hesitating.texts.target: Self
abilities.ajax-the-invincible.ajax-the-invincible.whos-hesitating.texts.distance: Self
abilities.ajax-the-invincible.ajax-the-invincible.whos-hesitating.texts.effect: 'Effect: Ajax shifts
  up to his speed and can make a free strike. If the target has R < 4, this free strike also makes
  them weakened until the end of their next turn.'
abilities.ajax-the-invincible.ajax-the-invincible.your-obsession-with-me-betrays-you.name: Your Obsession With Me Betrays You
abilities.ajax-the-invincible.ajax-the-invincible.your-obsession-with-me-betrays-you.texts.trigger: Ajax causes a creature within distance to gain ferocity or wrath.
abilities.ajax-the-invincible.ajax-the-invincible.your-obsession-with-me-betrays-you.texts.target: The triggering creature
abilities.ajax-the-invincible.ajax-the-invincible.your-obsession-with-me-betrays-you.texts.distance: Ranged 10
abilities.ajax-the-invincible.ajax-the-invincible.your-obsession-with-me-betrays-you.texts.effect: "Effect: If the target has I < 4, they use a signature ability against a target of Ajax's choice."
abilities.ajax-the-invincible.ajax-the-invincible.you-would-flounder-your-assault.name: You Would Flounder Your Assault?
abilities.ajax-the-invincible.ajax-the-invincible.you-would-flounder-your-assault.texts.trigger: A creature within 10 squares regains Stamina.
abilities.ajax-the-invincible.ajax-the-invincible.you-would-flounder-your-assault.texts.target: Self
abilities.ajax-the-invincible.ajax-the-invincible.you-would-flounder-your-assault.texts.distance: Self
abilities.ajax-the-invincible.ajax-the-invincible.you-would-flounder-your-assault.texts.effect: 'Effect: Ajax regains the same amount of Stamina.'
abilities.ajax-the-invincible.ajax-the-invincible.phoenix-wing-king.name: Phoenix Wing King
abilities.ajax-the-invincible.ajax-the-invincible.phoenix-wing-king.texts.target: Each enemy in the area
abilities.ajax-the-invincible.ajax-the-invincible.phoenix-wing-king.texts.distance: 5 burst
abilities.ajax-the-invincible.ajax-the-invincible.phoenix-wing-king.texts.roll: Power Roll + 5
abilities.ajax-the-invincible.ajax-the-invincible.phoenix-wing-king.texts.tier1: 11 fire damage; A < 4 weakened (save ends)
abilities.ajax-the-invincible.ajax-the-invincible.phoenix-wing-king.texts.tier2: 17 fire damage; A < 5 weakened (save ends)
abilities.ajax-the-invincible.ajax-the-invincible.phoenix-wing-king.texts.tier3: 21 fire damage; A < 6 weakened (save ends)
abilities.ajax-the-invincible.ajax-the-invincible.phoenix-wing-king.texts.effect:
  'Effect: Ajax flies at high speed to cut through each target, then appears in an unoccupied space
  within distance.'
abilities.ajax-the-invincible.ajax-the-invincible.ive-learned-their-tricks.name: I've Learned Their Tricks
abilities.ajax-the-invincible.ajax-the-invincible.ive-learned-their-tricks.texts.target: Each enemy in the area
abilities.ajax-the-invincible.ajax-the-invincible.ive-learned-their-tricks.texts.distance: 3 burst
abilities.ajax-the-invincible.ajax-the-invincible.ive-learned-their-tricks.texts.effect: >-
  Effect: Ajax uses the shadow elf eclipse's technique to reduce each target's surges to 0.
  Additionally, until the end of the round, Ajax ignores edges and double edges on any target's
  abilities, and ignores any nondamaging effects of any target's damage-dealing abilities.


  Special: This villain action can be replaced with a villain action from a creature any target has
  previously encountered.
abilities.ajax-the-invincible.ajax-the-invincible.awe-of-the-iron-crown.name: Awe of the Iron Crown
abilities.ajax-the-invincible.ajax-the-invincible.awe-of-the-iron-crown.texts.target: Each enemy in the area
abilities.ajax-the-invincible.ajax-the-invincible.awe-of-the-iron-crown.texts.distance: 7 burst
abilities.ajax-the-invincible.ajax-the-invincible.awe-of-the-iron-crown.texts.effect:
  "Effect: Each target who has I < 5 is knocked prone and can't stand until Ajax deals damage to
  them. For each target not knocked prone, Ajax can move up to his speed toward that target and use
  Blade of the Gol King against them."
monsters.ajax-the-invincible.ajax-the-invincible.name: Ajax the Invincible
traits.ajax-the-invincible.ajax-the-invincible.tactical-stance.name: Tactical Stance
traits.ajax-the-invincible.ajax-the-invincible.tactical-stance.description: >-
  At the start of each round, Ajax chooses a new stance from one of the following options and gains
  its benefits:


  Insurgent: Ajax automatically treats his initial power roll as a 17. He can still roll to
  determine if he scores a critical hit.


  Mastermind: Before he uses an ability, Ajax can either shift up to 2 squares, or can cause one
  creature within line of effect to slide up to 2 squares, ignoring stability.


  Vanguard: Ajax has damage immunity 5. Additionally, any enemy who makes a power roll that
  includes Ajax as a target has a double bane on the roll.
effects.ajax-the-invincible.insurgent.name: Insurgent
effects.ajax-the-invincible.insurgent.description: Ajax automatically treats his initial power roll
  as a 17. He can still roll to determine if he scores a critical hit.
effects.ajax-the-invincible.mastermind.name: Mastermind
effects.ajax-the-invincible.mastermind.description: Before he uses an ability, Ajax can either shift
  up to 2 squares, or can cause one creature within line of effect to slide up to 2 squares,
  ignoring stability.
effects.ajax-the-invincible.vanguard.name: Vanguard
effects.ajax-the-invincible.vanguard.description:
  Ajax has damage immunity 5. Additionally, any enemy
  who makes a power roll that includes Ajax as a target has a double bane on the roll.
effects.ajax-the-invincible.hexed.name: Hexed
effects.ajax-the-invincible.hexed.description: A hexed target glows green, and each of their heroic
  abilities has its cost increased by 2.
abilities.ajax-the-invincible.malice.draw-steel.name: Draw Steel
abilities.ajax-the-invincible.malice.draw-steel.texts.target: Each enemy and object in the area
abilities.ajax-the-invincible.malice.draw-steel.texts.distance: Four 3 cubes within 10
abilities.ajax-the-invincible.malice.draw-steel.texts.roll: Highest characteristic test
abilities.ajax-the-invincible.malice.draw-steel.texts.tier1: 26 damage; bleeding and slowed (save ends)
abilities.ajax-the-invincible.malice.draw-steel.texts.tier2: 22 damage; bleeding (save ends)
abilities.ajax-the-invincible.malice.draw-steel.texts.tier3: 16 damage
abilities.ajax-the-invincible.malice.draw-steel.texts.effect: >-
  Effect: Each target makes a test using their highest characteristic.


  Ajax then raises his Blade of the Gol King above his head as four giant blades emerge from the
  ground to fill the area. Each target is pushed into an unoccupied space adjacent to the area after
  the power roll is resolved. Each blade blocks line of effect and can be dismissed by Ajax at will
