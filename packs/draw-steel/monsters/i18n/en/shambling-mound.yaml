malice.shambling-mound.poisoned-vines.name: Poisoned Vines
malice.shambling-mound.poisoned-vines.description: The shambling mound seeps noxious residue from
  their vines. The next time they use their Vine Lash ability before the end of their next turn,
  they deal an extra 12 poison damage to each target.
malice.shambling-mound.frenzy-lash.name: Frenzy Lash
malice.shambling-mound.frenzy-lash.description: The shambling mound lashes out at each enemy within
  10 squares of them, driving them back or into the air. Each target makes an Agility test.
malice.shambling-mound.frenzy-lash.texts.tier1: 7 damage; push 7 or vertical push 3; restrained (save ends)
malice.shambling-mound.frenzy-lash.texts.tier2: 6 damage; push 5 or vertical push 2
malice.shambling-mound.frenzy-lash.texts.tier3: 3 damage
malice.shambling-mound.solo-action.name: Solo Action
malice.shambling-mound.solo-action.description: The shambling mound takes an additional main action
  on their turn. They can use this feature even if they are dazed.
malice.shambling-mound.leeching-wilds.name: Leeching Wilds
malice.shambling-mound.leeching-wilds.description: Until the end of the shambling mound's next turn,
  the area within 10 squares of them is difficult terrain for enemies, and any enemy in the area
  takes a bane on power rolls. Any enemy who starts their turn in the area takes 4 acid damage, and
  the shambling mound regains an equal amount of Stamina.
traits.shambling-mound.shambling-mound.solo-monster.name: Solo Monster
traits.shambling-mound.shambling-mound.solo-monster.description: >-
  End Effect: At the end of each of their turns, the shambling mound can take 10 damage to end one
  effect on them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The shambling mound can take two turns each round. They can't take turns
  consecutively.
traits.shambling-mound.shambling-mound.engulfing-sack.name: Engulfing Sack
traits.shambling-mound.shambling-mound.engulfing-sack.description: The shambling mound has a
  vegetative sack on their body where they carry engulfed creatures. The sack has 30 Stamina, damage
  immunity 5, and fire weakness 10. Destroying the sack frees creatures trapped by the shambling
  mound's Engulf ability. The shambling mound regrows a destroyed sack at the start of their next
  turn.
abilities.shambling-mound.shambling-mound.vine-lash.name: Vine Lash
abilities.shambling-mound.shambling-mound.vine-lash.texts.target: Two creatures or objects
abilities.shambling-mound.shambling-mound.vine-lash.texts.distance: Melee 6
abilities.shambling-mound.shambling-mound.vine-lash.texts.roll: Power Roll + 4
abilities.shambling-mound.shambling-mound.vine-lash.texts.tier1: 11 damage; A < 3 grabbed
abilities.shambling-mound.shambling-mound.vine-lash.texts.tier2: 16 damage; A < 4 grabbed
abilities.shambling-mound.shambling-mound.vine-lash.texts.tier3: 19 damage; grabbed
abilities.shambling-mound.shambling-mound.vine-lash.texts.effect: |-
  2 Malice: The shambling mound can slide each target up to 6 squares.

  3 Malice: Each target takes 7 poison damage.
abilities.shambling-mound.shambling-mound.seismic-slam.name: Seismic Slam
abilities.shambling-mound.shambling-mound.seismic-slam.texts.target: Each enemy in the area
abilities.shambling-mound.shambling-mound.seismic-slam.texts.distance: 6 burst
abilities.shambling-mound.shambling-mound.seismic-slam.texts.roll: Power Roll + 4
abilities.shambling-mound.shambling-mound.seismic-slam.texts.tier1: 4 damage; M < 2 dazed (save ends)
abilities.shambling-mound.shambling-mound.seismic-slam.texts.tier2: 6 damage; M < 3 dazed (save ends)
abilities.shambling-mound.shambling-mound.seismic-slam.texts.tier3: 7 damage; M < 4 dazed (save ends)
abilities.shambling-mound.shambling-mound.engulf.name: Engulf
abilities.shambling-mound.shambling-mound.engulf.texts.target: One creature or object
abilities.shambling-mound.shambling-mound.engulf.texts.distance: Melee 6
abilities.shambling-mound.shambling-mound.engulf.texts.effect: >-
  Effect: The target must be size 1L or smaller. The shambling mound reaches out with writhing
  vines, and if the target has A < 3, they are engulfed into the shambling mound's sack. If the
  target is grabbed by the shambling mound, the potency increases by 1. An engulfed creature is
  restrained, takes 3 poison damage at the start of each turn, and can't take damage from abilities
  used from outside the sack. When the shambling mound moves, the engulfed creature moves with them.
  If the shambling mound dies or their sack is destroyed, each engulfed creature is freed and
  appears in an unoccupied space within 2 squares of the shambling mound.


  2+ Malice: The shambling mound can engulf one additional target for each 2 Malice spent.
abilities.shambling-mound.shambling-mound.leech.name: Leech
abilities.shambling-mound.shambling-mound.leech.texts.target: Self
abilities.shambling-mound.shambling-mound.leech.texts.distance: Self
abilities.shambling-mound.shambling-mound.leech.texts.effect: 'Effect: Each creature engulfed by the
  shambling mound takes 5 poison damage. The shambling mound gains 5 temporary Stamina for each
  creature who takes damage this way.'
abilities.shambling-mound.shambling-mound.tether-down.name: Tether Down
abilities.shambling-mound.shambling-mound.tether-down.texts.trigger: A creature within distance willingly moves.
abilities.shambling-mound.shambling-mound.tether-down.texts.target: The triggering creature
abilities.shambling-mound.shambling-mound.tether-down.texts.distance: Melee 6
abilities.shambling-mound.shambling-mound.tether-down.texts.roll: Power Roll + 4
abilities.shambling-mound.shambling-mound.tether-down.texts.tier1: 7 damage; M < 2 restrained (EoT)
abilities.shambling-mound.shambling-mound.tether-down.texts.tier2: 12 damage; M < 3 restrained (EoT)
abilities.shambling-mound.shambling-mound.tether-down.texts.tier3: 15 damage; M < 4 restrained (EoT)
traits.shambling-mound.shambling-mound.false-appearance.name: False Appearance
traits.shambling-mound.shambling-mound.false-appearance.description: While the shambling mound remains motionless, they are indistinguishable from ordinary vegetation.
traits.shambling-mound.shambling-mound.frothing-flora.name: Frothing Flora
traits.shambling-mound.shambling-mound.frothing-flora.description: The area within 6 squares of the shambling mound is difficult terrain.
abilities.shambling-mound.shambling-mound.ravenous-overgrowth.name: Ravenous Overgrowth
abilities.shambling-mound.shambling-mound.ravenous-overgrowth.texts.target: Each creature in the area
abilities.shambling-mound.shambling-mound.ravenous-overgrowth.texts.distance: 10 × 2 line within 1
abilities.shambling-mound.shambling-mound.ravenous-overgrowth.texts.roll: Power Roll + 4
abilities.shambling-mound.shambling-mound.ravenous-overgrowth.texts.tier1: 7 damage, pull 3
abilities.shambling-mound.shambling-mound.ravenous-overgrowth.texts.tier2: 12 damage; pull 4; the target has poison weakness 3 until the end of the encounter
abilities.shambling-mound.shambling-mound.ravenous-overgrowth.texts.tier3: 15 damage; pull 6; the target has poison weakness 5 until the end of the encounter
abilities.shambling-mound.shambling-mound.composting.name: Composting
abilities.shambling-mound.shambling-mound.composting.texts.target: Each enemy
abilities.shambling-mound.shambling-mound.composting.texts.distance: Melee 6
abilities.shambling-mound.shambling-mound.composting.texts.effect: 'Effect: The shambling mound uses Engulf against each target without spending Malice.'
abilities.shambling-mound.shambling-mound.exposed-crux.name: Exposed Crux
abilities.shambling-mound.shambling-mound.exposed-crux.texts.target: Self
abilities.shambling-mound.shambling-mound.exposed-crux.texts.distance: Self
abilities.shambling-mound.shambling-mound.exposed-crux.texts.effect: "Effect: The shambling mound
  rips themself apart, exposing the crux of magic holding them together. The distance of the
  shambling mound's melee abilities increases to melee 10, the creature has a double edge on power
  rolls, and strikes made against them gain an edge."
monsters.shambling-mound.shambling-mound.name: Shambling Mound
effects.shambling-mound.engulfed.name: Engulfed
effects.shambling-mound.engulfed.description:
  An engulfed creature is restrained, takes 3 poison damage at the start of each turn, and can't
  take damage from abilities used from outside the sack. When the shambling mound moves, the
  engulfed creature moves with them. If the shambling mound dies or their sack is destroyed, each
  engulfed creature is freed and appears in an unoccupied space within 2 squares of the shambling
  mound.
effects.shambling-mound.overgrown.name: Poison weakness
effects.shambling-mound.overgrown.description: The creature has poison weakness until the end of the encounter.
effects.shambling-mound.overgrown.state.amount.name: Poison weakness
effects.shambling-mound.exposed-crux.name: Exposed Crux
effects.shambling-mound.exposed-crux.description:
  The distance of the shambling mound's melee abilities increases to melee 10, the creature has a
  double edge on power rolls, and strikes made against them gain an edge.
