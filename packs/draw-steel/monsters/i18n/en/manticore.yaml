malice.manticore.uncanny-mimicry.name: Uncanny Mimicry
malice.manticore.uncanny-mimicry.description: The manticore uses their mimicry in an attempt to
  unnerve one creature within their line of effect. If the target has R < 4, they take a bane on
  power rolls against the manticore (save ends). Each time this feature is used against the same
  target during the encounter, its potency decreases by 2.
malice.manticore.solo-action.name: Solo Action
malice.manticore.solo-action.description: The manticore takes an additional main action on their
  turn. They can use this feature even if they are dazed.
malice.manticore.desperate-howl.name: Desperate Howl
malice.manticore.desperate-howl.description: The manticore lets out an unnerving cry. Each enemy
  within the manticore's line of effect makes an Intuition test.
malice.manticore.desperate-howl.texts.tier1: Frightened (save ends)
malice.manticore.desperate-howl.texts.tier2: Frightened (EoT)
malice.manticore.desperate-howl.texts.tier3: No effect.
malice.manticore.barrage-of-barbs.name: Barrage of Barbs
malice.manticore.barrage-of-barbs.description: The manticore sprays tail spikes across the ground
  within 5 squares of them. Each enemy in that area who has A < 3 is bleeding (save ends).
  Additionally, the area is difficult terrain, and any enemy takes 3 poison damage for each square
  of the area they enter. An enemy who takes 9 poison damage this way on one turn is weakened until
  the end of the encounter.
traits.manticore.manticore.solo-monster.name: Solo Monster
traits.manticore.manticore.solo-monster.description: >-
  End Effect: At the end of each of their turns, the manticore can take 10 damage to end one effect
  on them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The manticore can take two turns each round. They can't take turns consecutively.
traits.manticore.manticore.agile-predator.name: Agile Predator
traits.manticore.manticore.agile-predator.description: Whenever the manticore deals damage to a
  creature, they don't provoke opportunity attacks from that creature during that turn.
abilities.manticore.manticore.carnivorous-bite.name: Carnivorous Bite
abilities.manticore.manticore.carnivorous-bite.texts.target: One creature or object
abilities.manticore.manticore.carnivorous-bite.texts.distance: Melee 1
abilities.manticore.manticore.carnivorous-bite.texts.roll: Power Roll + 4
abilities.manticore.manticore.carnivorous-bite.texts.tier1: 12 damage; A < 2 bleeding (save ends)
abilities.manticore.manticore.carnivorous-bite.texts.tier2: 17 damage; A < 3 bleeding (save ends)
abilities.manticore.manticore.carnivorous-bite.texts.tier3: 21 damage; A < 4 bleeding (save ends)
abilities.manticore.manticore.carnivorous-bite.texts.effect: 'Effect: If the target is frightened, this ability gains an edge.'
abilities.manticore.manticore.tail-spike.name: Tail Spike
abilities.manticore.manticore.tail-spike.texts.target: Two creatures or objects
abilities.manticore.manticore.tail-spike.texts.distance: Ranged 10
abilities.manticore.manticore.tail-spike.texts.roll: Power Roll + 4
abilities.manticore.manticore.tail-spike.texts.tier1: 6 damage; M < 2 4 poison damage
abilities.manticore.manticore.tail-spike.texts.tier2: 11 damage; M < 3 4 poison damage, weakened (save ends)
abilities.manticore.manticore.tail-spike.texts.tier3: 14 damage; M < 4 8 poison damage, weakened (save ends)
abilities.manticore.manticore.tail-spike.texts.effect: '1 Malice: While weakened this way, a target
  takes 1d6 poison damage at the start of each of their turns.'
abilities.manticore.manticore.harrying-claws.name: Harrying Claws
abilities.manticore.manticore.harrying-claws.texts.target: Two creatures or objects
abilities.manticore.manticore.harrying-claws.texts.distance: Melee 1
abilities.manticore.manticore.harrying-claws.texts.roll: Power Roll + 4
abilities.manticore.manticore.harrying-claws.texts.tier1: Slide 1; A < 2 3 damage
abilities.manticore.manticore.harrying-claws.texts.tier2: Slide 2; A < 3 5 damage
abilities.manticore.manticore.harrying-claws.texts.tier3: Slide 4; A < 4 7 damage
abilities.manticore.manticore.reflexive-instinct.name: Reflexive Instinct
abilities.manticore.manticore.reflexive-instinct.texts.trigger: A creature within distance deals damage to the manticore.
abilities.manticore.manticore.reflexive-instinct.texts.target: The triggering creature
abilities.manticore.manticore.reflexive-instinct.texts.distance: Ranged 10
abilities.manticore.manticore.reflexive-instinct.texts.effect: 'Effect: The manticore shifts up to 5
  squares into the air, then can use Tail Spike against the target.'
abilities.manticore.manticore.trumpeting-howl.name: Trumpeting Howl
abilities.manticore.manticore.trumpeting-howl.texts.target: Each creature in the area
abilities.manticore.manticore.trumpeting-howl.texts.distance: 5 burst
abilities.manticore.manticore.trumpeting-howl.texts.roll: Power Roll + 4
abilities.manticore.manticore.trumpeting-howl.texts.tier1: Frightened (EoT); if the target has I < 2 they are instead frightened (save ends)
abilities.manticore.manticore.trumpeting-howl.texts.tier2: Frightened (EoT); if the target has I < 3 they are instead frightened (save ends)
abilities.manticore.manticore.trumpeting-howl.texts.tier3: Frightened (EoT); if the target has I < 4 they are instead dazed (save ends)
abilities.manticore.manticore.cornered-predator.name: Cornered Predator
abilities.manticore.manticore.cornered-predator.texts.target: Self
abilities.manticore.manticore.cornered-predator.texts.distance: Self
abilities.manticore.manticore.cornered-predator.texts.effect: 'Effect: The manticore shifts up to
  their speed, then can use Tail Spike against each enemy within distance of that ability.'
abilities.manticore.manticore.debilitating-poison.name: Debilitating Poison
abilities.manticore.manticore.debilitating-poison.texts.target: Self
abilities.manticore.manticore.debilitating-poison.texts.distance: Self
abilities.manticore.manticore.debilitating-poison.texts.effect: "Effect: The manticore sours their
  poison with enmity. Until the end of the encounter, the manticore has a double edge on power rolls
  against weakened creatures. Additionally, any creature weakened by the manticore's Tail Spike
  ability has their speed halved and takes an extra 3 poison damage at the start of each of their
  turns."
monsters.manticore.manticore.name: Manticore
effects.manticore.spike-poison.name: Tail spike poison
effects.manticore.spike-poison.description: While weakened this way, a target takes 1d6 poison damage at the start of each of their turns.
effects.manticore.debilitating-poison.name: Debilitating Poison
effects.manticore.debilitating-poison.description: >-
  Until the end of the encounter, the manticore has a double edge on power rolls against weakened
  creatures. Additionally, any creature weakened by the manticore's Tail Spike ability has their
  speed halved and takes an extra 3 poison damage at the start of each of their turns.
