malice.kingfissure-worm.aftershock.name: Aftershock
malice.kingfissure-worm.aftershock.description: >-
  Free triggered action


  Distance: Self · Target: Self


  Trigger: A creature deals damage to the kingfissure worm or one of their tongues.


  Effect: Each creature within 5 squares of the kingfissure worm takes 5 damage, and if they have A
  < 4 they are knocked prone. The kingfissure worm can use this ability only once per round.
malice.kingfissure-worm.solo-action.name: Solo Action
malice.kingfissure-worm.solo-action.description: The kingfissure worm takes an additional main
  action on their turn. They can use this feature even if they are dazed.
malice.kingfissure-worm.spontaneous-regeneration.name: Spontaneous Regeneration
malice.kingfissure-worm.spontaneous-regeneration.description: The kingfissure worm loses 35 Stamina
  and regrows one tongue, to a maximum of three tongues. The worm is then dazed until the end of
  their turn.
malice.kingfissure-worm.megaquake.name: Megaquake
malice.kingfissure-worm.megaquake.description: >-
  Keywords: Area, Weapon · Main action


  Distance: 5 burst · Target: Each enemy and object in the area


  Power Roll + 5


  Effect: Until the end of the next round, each target takes a −3 penalty to stability, treats all
  terrain as difficult terrain, and takes 10 damage whenever they are knocked prone.
malice.kingfissure-worm.megaquake.texts.tier1: 8 damage; M < 3 slide 5
malice.kingfissure-worm.megaquake.texts.tier2: 13 damage; M < 4 slide 5
malice.kingfissure-worm.megaquake.texts.tier3: 17 damage; M < 5 slide 5
traits.kingfissure-worm.kingfissure-worm.solo-monster.name: Solo Monster
traits.kingfissure-worm.kingfissure-worm.solo-monster.description: >-
  End Effect: At the end of each of their turns, the kingfissure worm can take 10 damage to end one
  effect on them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The kingfissure worm can take two turns each round. They can't take turns
  consecutively.
traits.kingfissure-worm.kingfissure-worm.multiple-tongues.name: Multiple Tongues
traits.kingfissure-worm.kingfissure-worm.multiple-tongues.description: The kingfissure worm has
  three tongues. Each tongue is a 5 × 1 line within 1 square of the kingfissure worm, has 35 Stamina
  and psychic immunity all, and can't be force moved. Each tongue enables the kingfissure worm to
  grab one size 3 or smaller creature or object. A tongue can be targeted by abilities only while it
  has a target grabbed.
abilities.kingfissure-worm.kingfissure-worm.tongue-grab.name: Tongue Grab
abilities.kingfissure-worm.kingfissure-worm.tongue-grab.texts.target: One creature or object per tongue
abilities.kingfissure-worm.kingfissure-worm.tongue-grab.texts.distance: Melee 5
abilities.kingfissure-worm.kingfissure-worm.tongue-grab.texts.roll: Power Roll + 5
abilities.kingfissure-worm.kingfissure-worm.tongue-grab.texts.tier1: 13 damage; M < 3 grabbed
abilities.kingfissure-worm.kingfissure-worm.tongue-grab.texts.tier2: 18 damage; M < 4 grabbed
abilities.kingfissure-worm.kingfissure-worm.tongue-grab.texts.tier3: 22 damage; M < 5 grabbed and the target takes a bane on the Escape Grab maneuver
abilities.kingfissure-worm.kingfissure-worm.tongue-grab.texts.effect: 'Effect: The kingfissure worm
  must have one or more tongues to use this ability. As a maneuver, the kingfissure worm can pull up
  to two creatures grabbed this way adjacent to them.'
abilities.kingfissure-worm.kingfissure-worm.maw.name: Maw
abilities.kingfissure-worm.kingfissure-worm.maw.texts.target: One creature or object
abilities.kingfissure-worm.kingfissure-worm.maw.texts.distance: Melee 1
abilities.kingfissure-worm.kingfissure-worm.maw.texts.roll: Power Roll + 5
abilities.kingfissure-worm.kingfissure-worm.maw.texts.tier1: 15 damage; push 3
abilities.kingfissure-worm.kingfissure-worm.maw.texts.tier2: 20 damage; push 5, prone
abilities.kingfissure-worm.kingfissure-worm.maw.texts.tier3: 25 damage; the target is swallowed (see Swallowed)
abilities.kingfissure-worm.kingfissure-worm.maw.texts.effect: "2 Malice: When the kingfissure worm
  uses the Charge main action, they ignore difficult terrain and automatically destroy mundane size
  3 and smaller objects in the path of their charge. The first time the kingfissure worm moves
  through a creature's space during this charge, that creature takes 8 damage and is pushed up to 3
  squares."
abilities.kingfissure-worm.kingfissure-worm.consume.name: Consume
abilities.kingfissure-worm.kingfissure-worm.consume.texts.target: One grabbed creature
abilities.kingfissure-worm.kingfissure-worm.consume.texts.distance: Melee 1
abilities.kingfissure-worm.kingfissure-worm.consume.texts.effect: 'Effect: The target is swallowed (see Swallowed).'
abilities.kingfissure-worm.kingfissure-worm.tongue-whip.name: Tongue Whip
abilities.kingfissure-worm.kingfissure-worm.tongue-whip.texts.target: One creature or object
abilities.kingfissure-worm.kingfissure-worm.tongue-whip.texts.distance: Melee 5 or ranged 10
abilities.kingfissure-worm.kingfissure-worm.tongue-whip.texts.effect: 'Effect: The kingfissure worm
  can use this maneuver only while they have a creature or object grabbed. The worm slams the
  grabbed creature or object against the target, dealing 13 damage to both. If this ability is used
  at range, it deals an extra 5 damage and the grabbed creature or object is released.'
abilities.kingfissure-worm.kingfissure-worm.tearing-recoil.name: Tearing Recoil
abilities.kingfissure-worm.kingfissure-worm.tearing-recoil.texts.trigger: A tongue takes damage that doesn't reduce it to 0 Stamina.
abilities.kingfissure-worm.kingfissure-worm.tearing-recoil.texts.target: Special
abilities.kingfissure-worm.kingfissure-worm.tearing-recoil.texts.distance: Self
abilities.kingfissure-worm.kingfissure-worm.tearing-recoil.texts.effect: 'Effect: The kingfissure
  worm deals 5 damage to the creature or object the tongue had grabbed, releases that creature or
  object, then pulls the damaged tongue back into their mouth.'
traits.kingfissure-worm.kingfissure-worm.seismic-king.name: Seismic King
traits.kingfissure-worm.kingfissure-worm.seismic-king.description: The kingfissure worm has line of
  effect only within 3 squares. However, they ignore concealment for creatures touching the ground
  and don't need line of effect to use abilities against those creatures.
traits.kingfissure-worm.kingfissure-worm.swallowed.name: Swallowed
traits.kingfissure-worm.kingfissure-worm.swallowed.description: A creature swallowed by the
  kingfissure worm is restrained and takes 1d6 acid damage at the start of every turn. If the worm
  takes 25 or more damage in a single round from swallowed creatures, they immediately regurgitate
  all creatures they have swallowed, who land prone in unoccupied spaces within 3 squares of the
  kingfissure worm.
traits.kingfissure-worm.kingfissure-worm.titanic-tunneler.name: Titanic Tunneler
traits.kingfissure-worm.kingfissure-worm.titanic-tunneler.description: The kingfissure worm can
  burrow through stone. When the worm burrows, they create a stable size 3 tunnel in the squares
  they move through.
traits.kingfissure-worm.kingfissure-worm.unstoppable-crawler.name: Unstoppable Crawler
traits.kingfissure-worm.kingfissure-worm.unstoppable-crawler.description: The kingfissure worm can't
  be frightened or knocked prone. While the worm is restrained or slowed, they take a −2 penalty to
  speed instead of suffering those conditions' usual effects on speed.
abilities.kingfissure-worm.kingfissure-worm.kings-fissure.name: King's Fissure
abilities.kingfissure-worm.kingfissure-worm.kings-fissure.texts.target: Each creature and object in the area
abilities.kingfissure-worm.kingfissure-worm.kings-fissure.texts.distance: 20 × 4 line within 1
abilities.kingfissure-worm.kingfissure-worm.kings-fissure.texts.roll: Agility test
abilities.kingfissure-worm.kingfissure-worm.kings-fissure.texts.tier1: 10 damage; the target falls into the fissure, lands prone, and can't stand (EoT)
abilities.kingfissure-worm.kingfissure-worm.kings-fissure.texts.tier2: 10 damage; the target is knocked prone and left hanging at the edge of the area
abilities.kingfissure-worm.kingfissure-worm.kings-fissure.texts.tier3: The target shifts to the nearest unoccupied space outside the area.
abilities.kingfissure-worm.kingfissure-worm.kings-fissure.texts.effect: |-
  Special: Each target must be on the ground.

  Effect: The area becomes a 10-square-deep fissure in the earth. Each target makes an Agility test.
abilities.kingfissure-worm.kingfissure-worm.earth-breach.name: Earth Breach
abilities.kingfissure-worm.kingfissure-worm.earth-breach.texts.target: Special
abilities.kingfissure-worm.kingfissure-worm.earth-breach.texts.distance: Self
abilities.kingfissure-worm.kingfissure-worm.earth-breach.texts.effect: 'Effect: The kingfissure worm
  can use this villain action only while burrowing. The worm burrows up to half their speed, then
  breaches the surface and moves 5 squares straight up before dropping back to the ground. Each
  creature or object whose space the worm moves through during this movement takes 10 damage, and if
  they have A < 4 they are knocked prone. Any creature who is made winded by this damage is
  swallowed (see Swallowed).'
abilities.kingfissure-worm.kingfissure-worm.better-out-than-in.name: Better Out Than In
abilities.kingfissure-worm.kingfissure-worm.better-out-than-in.texts.target: Each enemy and object in the area
abilities.kingfissure-worm.kingfissure-worm.better-out-than-in.texts.distance: 5 burst
abilities.kingfissure-worm.kingfissure-worm.better-out-than-in.texts.roll: Power Roll + 5
abilities.kingfissure-worm.kingfissure-worm.better-out-than-in.texts.tier1: 8 acid damage; P < 3 weakened (save ends)
abilities.kingfissure-worm.kingfissure-worm.better-out-than-in.texts.tier2: 13 acid damage; P < 4 weakened (save ends)
abilities.kingfissure-worm.kingfissure-worm.better-out-than-in.texts.tier3: 17 acid damage; P < 5 weakened (save ends)
abilities.kingfissure-worm.kingfissure-worm.better-out-than-in.texts.effect: 'Effect: Each creature
  swallowed by the worm is regurgitated and automatically subject to the tier 3 outcome, then lands
  prone in an unoccupied space within 5 squares of the kingfissure worm.'
monsters.kingfissure-worm.kingfissure-worm.name: Kingfissure Worm
effects.kingfissure-worm.swallowed.name: Swallowed
effects.kingfissure-worm.swallowed.description: A creature swallowed by the kingfissure worm is restrained and takes 1d6 acid damage at the start of every turn. If the worm takes 25 or more damage in a single round from swallowed creatures, they immediately regurgitate all creatures they have swallowed, who land prone in unoccupied spaces within 3 squares of the kingfissure worm.
