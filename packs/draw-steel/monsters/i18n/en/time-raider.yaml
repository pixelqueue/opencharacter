malice.time-raider.gravity-well.name: Gravity Well
malice.time-raider.gravity-well.description: >-
  | Area, Psionic, Ranged, Weapon |   Maneuver |


  |-----------------------------------|---------------:|


  | 📏 5 cube within 3            | 🎯 Special |


  Effect: A time raider acting this turn activates a gravity well in the area. The gravity well sits
  at the center of the cube and lasts until the end of the encounter, or until a creature adjacent
  to the well uses a maneuver to deactivate it. The area is difficult terrain for enemies. Any enemy
  who ends their turn in the area is pulled up to 4 squares toward the well.
malice.time-raider.recall-module.name: Recall Module
malice.time-raider.recall-module.description: Until the end of the round, each time raider gains a
  +3 bonus to speed, and can teleport up to their speed as a move action.
malice.time-raider.psi-cage.name: Psi-Cage
malice.time-raider.psi-cage.description: All time raiders in the encounter collectively create a
  psionic field over the encounter map, which lasts until the first time raider with the highest
  Stamina maximum drops to 0 Stamina or chooses to end the field (no action required). While the
  field is up, each non-time raider on the map makes a Reason test against this psionic effect at
  the start of each round.
malice.time-raider.psi-cage.texts.tier1: 10 psychic damage; slowed (EoT)
malice.time-raider.psi-cage.texts.tier2: 7 psychic damage; slowed (EoT)
malice.time-raider.psi-cage.texts.tier3: No effect.
effects.time-raider.speed-penalty.name: Speed penalty
effects.time-raider.speed-penalty.description: The creature takes a −2 penalty to speed.
