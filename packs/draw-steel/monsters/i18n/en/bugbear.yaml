traits.bugbear.bugbear-knightmare.bugathic-inspiration.name: Bu'gathic Inspiration
traits.bugbear.bugbear-knightmare.bugathic-inspiration.description: Any ally has a +1 bonus to power
  rolls, saving throws, or damage rolled as a d6 or a d3 for each knightmare adjacent to them.
traits.bugbear.bugbear-knightmare.magic-terror.name: Magic Terror
traits.bugbear.bugbear-knightmare.magic-terror.description: Each enemy has a −1 penalty to power
  rolls, saving throws, or damage rolled as a d6 or a d3 for each knightmare adjacent to them.
monsters.bugbear.bugbear-knightmare.name: Bugbear Knightmare
