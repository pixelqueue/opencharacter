abilities.bugbear.bugbear-channeler.twist-shape.texts.tier1: 5 corruption damage; P < 0 slowed (save ends)
abilities.bugbear.bugbear-channeler.twist-shape.texts.tier2: 8 corruption damage; P < 1 the target is shapechanged (save ends)
abilities.bugbear.bugbear-channeler.twist-shape.texts.tier3: 11 corruption damage; P < 2 the target is shapechanged (save ends)
abilities.bugbear.bugbear-channeler.twist-shape.texts.effect: 'Effect: A shapechanged creature is
  slowed and has fire weakness 10 as their limbs stretch and their skin becomes paper thin.'
