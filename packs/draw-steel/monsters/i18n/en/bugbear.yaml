abilities.bugbear.bugbear-channeler.blistering-element.texts.target: Each enemy in the area
abilities.bugbear.bugbear-channeler.blistering-element.texts.distance: 3 burst
abilities.bugbear.bugbear-channeler.blistering-element.texts.roll: Power Roll + 2
abilities.bugbear.bugbear-channeler.blistering-element.texts.tier1: 2 damage; M < 0 bleeding (save ends)
abilities.bugbear.bugbear-channeler.blistering-element.texts.tier2: 3 damage; M < 1 bleeding (save ends)
abilities.bugbear.bugbear-channeler.blistering-element.texts.tier3: 4 damage; M < 2 bleeding (save ends)
abilities.bugbear.bugbear-channeler.blistering-element.texts.effect: 'Effect: The channeler chooses
  one of the following damage types: acid, cold, corruption, fire, or poison.'
