  Effect: The roughneck moves up to their speed across the ground, dragging the target with them.
  The target takes 2 damage for each square they were dragged through. When this movement ends, the
  target is no longer grabbed and falls prone. Each square the target was dragged through is
  difficult terrain for enemies.
