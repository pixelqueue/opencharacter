malice.bugbear.goblin-malice-features.name: Goblin Malice Features
malice.bugbear.goblin-malice-features.description: The bugbear activates a Malice Feature available to goblins.
malice.bugbear.grab-iron-ball.name: Grab Iron Ball
malice.bugbear.grab-iron-ball.description: For every 3 Malice spent, one non-minion bugbear acting
  this turn grabs an iron ball and can use a maneuver to throw it at a creature within 5 squares of
  them. The creature takes damage equal to 8 - the number of squares the iron ball was thrown, and
  if they have M < 1, they are slowed (save ends).
malice.bugbear.grab-javelin.name: Grab Javelin
malice.bugbear.grab-javelin.description: For every 5 Malice spent, one non-minion bugbear acting
  this turn grabs a javelin and can use a maneuver to throw it at a creature within 5 squares of
  them. The creature takes damage equal to 12 - the number of squares the javelin was thrown, and if
  they have M < 1, they are bleeding (save ends). While a creature is bleeding this way, any ally of
  the bugbear within 2 squares of them can use a free maneuver to pull the bleeding creature up to 2
  squares.
malice.bugbear.show-them-the-great-fear.name: Show Them the Great Fear
malice.bugbear.show-them-the-great-fear.description: A bugbear infuses the encounter map with
  bu'gathic magic. Until the end of the encounter, all bugbears and allies have their speed doubled
  and can automatically climb at full speed while moving. Additionally, if the target of any bugbear
  or ally's strike has I < 1, the target is also frightened (save ends) and must move their speed in
  a straight line away from the creature who made the strike.
abilities.bugbear.bugbear-channeler.shadow-drag.name: Shadow Drag
abilities.bugbear.bugbear-channeler.shadow-drag.texts.target: Two creatures or objects
abilities.bugbear.bugbear-channeler.shadow-drag.texts.distance: Ranged 8
abilities.bugbear.bugbear-channeler.shadow-drag.texts.roll: Power Roll + 2
abilities.bugbear.bugbear-channeler.shadow-drag.texts.tier1: 7 damage; pull 2
abilities.bugbear.bugbear-channeler.shadow-drag.texts.tier2: 10 damage; pull 3
abilities.bugbear.bugbear-channeler.shadow-drag.texts.tier3: 13 damage; pull 4
abilities.bugbear.bugbear-channeler.shadow-drag.texts.effect: 'Effect: Each target must be on the
  ground, and each square a target is pulled through is difficult terrain for enemies.'
