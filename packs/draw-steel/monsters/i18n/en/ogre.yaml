malice.ogre.shockwave.name: Shockwave
malice.ogre.shockwave.description: One ogre acting this turn jumps and lands on their rear, causing
  a 3 burst shockwave. Each size 1 creature in the area makes a Might test or Agility test.
malice.ogre.shockwave.texts.tier1: 5 damage; vertical push 3
malice.ogre.shockwave.texts.tier2: 4 damage; vertical push 2
malice.ogre.shockwave.texts.tier3: Push 1
malice.ogre.bully.name: Bully
malice.ogre.bully.description: Each ogre in the encounter shifts up to their speed and can make a
  free strike. If they can, they gang up on the same target rather than picking different targets.
malice.ogre.rampage.name: Rampage
malice.ogre.rampage.description: Until the end of the round, each ogre has damage immunity 5 and
  deals an extra 5 damage with abilities, and heroic abilities that target any ogre have their
  Heroic Resource cost reduced by 1 (to a minimum of 1).
monsters.ogre.cyclops.texts.withCaptain: +4 bonus to speed
abilities.ogre.cyclops.wild-slam.name: Wild Slam
abilities.ogre.cyclops.wild-slam.texts.target: Each enemy and object in the area
abilities.ogre.cyclops.wild-slam.texts.distance: 1 burst
abilities.ogre.cyclops.wild-slam.texts.roll: Power Roll + 5
abilities.ogre.cyclops.wild-slam.texts.tier1: 3 damage; A < 3 3 damage
abilities.ogre.cyclops.wild-slam.texts.tier2: 6 damage; push 3; A < 4 4 damage
abilities.ogre.cyclops.wild-slam.texts.tier3: 7 damage; prone; A < 5 5 damage and restrained (save ends)
abilities.ogre.cyclops.wild-slam.texts.effect: 'Effect: The cyclops automatically treats their
  initial power roll as a 17. They can still roll to determine if they score a critical hit.'
traits.ogre.cyclops.limited-vision.name: Limited Vision
traits.ogre.cyclops.limited-vision.description: The cyclops has line of effect only within 3
  squares. Whenever the cyclops takes damage from a ranged ability, they can move up to 3 squares
  toward the source of the damage.
monsters.ogre.cyclops.name: Cyclops
monsters.ogre.ogre-blue-blood.texts.withCaptain: Gain an edge on strikes
abilities.ogre.ogre-blue-blood.crush-underfoot.name: Crush Underfoot
abilities.ogre.ogre-blue-blood.crush-underfoot.texts.target: One creature or object per minion
abilities.ogre.ogre-blue-blood.crush-underfoot.texts.distance: Melee 2
abilities.ogre.ogre-blue-blood.crush-underfoot.texts.roll: Power Roll + 4
abilities.ogre.ogre-blue-blood.crush-underfoot.texts.tier1: 4 damage
abilities.ogre.ogre-blue-blood.crush-underfoot.texts.tier2: 7 damage; M < 3 prone
abilities.ogre.ogre-blue-blood.crush-underfoot.texts.tier3: 8 damage; prone
abilities.ogre.ogre-blue-blood.crush-underfoot.texts.effect: 'Effect: A target who is already prone takes an extra 4 damage.'
traits.ogre.ogre-blue-blood.in-my-stead.name: In My Stead
traits.ogre.ogre-blue-blood.in-my-stead.description: Whenever the blue blood would make a free
  strike, an ally within 5 squares can make a free strike instead.
traits.ogre.ogre-blue-blood.royal-anger.name: Royal Anger
traits.ogre.ogre-blue-blood.royal-anger.description: The blue blood has damage immunity 2 while their squad has three or fewer minions in it.
monsters.ogre.ogre-blue-blood.name: Ogre Blue Blood
abilities.ogre.ogre-goon.club-swing.name: Club Swing
abilities.ogre.ogre-goon.club-swing.texts.target: Two creatures or objects
abilities.ogre.ogre-goon.club-swing.texts.distance: Melee 2
abilities.ogre.ogre-goon.club-swing.texts.roll: Power Roll + 2
abilities.ogre.ogre-goon.club-swing.texts.tier1: 7 damage; push 2
abilities.ogre.ogre-goon.club-swing.texts.tier2: 11 damage; push 4
abilities.ogre.ogre-goon.club-swing.texts.tier3: 14 damage; push 6, prone
abilities.ogre.ogre-goon.club-swing.texts.effect: 'Effect: Any target who takes damage from this forced movement takes an extra 4 damage.'
abilities.ogre.ogre-goon.grabby-hand.name: Grabby Hand
abilities.ogre.ogre-goon.grabby-hand.texts.target: One creature or object
abilities.ogre.ogre-goon.grabby-hand.texts.distance: Melee 1
abilities.ogre.ogre-goon.grabby-hand.texts.roll: Power Roll + 2
abilities.ogre.ogre-goon.grabby-hand.texts.tier1: 7 damage
abilities.ogre.ogre-goon.grabby-hand.texts.tier2: 11 damage; grabbed
abilities.ogre.ogre-goon.grabby-hand.texts.tier3: 14 damage; grabbed
abilities.ogre.ogre-goon.grabby-hand.texts.effect: 'Effect: A target grabbed this way takes a bane on the Escape Grab maneuver.'
abilities.ogre.ogre-goon.people-bowling.name: People Bowling
abilities.ogre.ogre-goon.people-bowling.texts.target: Each creature and object in the area
abilities.ogre.ogre-goon.people-bowling.texts.distance: 6 × 1 line within 1
abilities.ogre.ogre-goon.people-bowling.texts.roll: Power Roll + 2
abilities.ogre.ogre-goon.people-bowling.texts.tier1: 5 damage
abilities.ogre.ogre-goon.people-bowling.texts.tier2: 9 damage
abilities.ogre.ogre-goon.people-bowling.texts.tier3: 12 damage; prone
abilities.ogre.ogre-goon.people-bowling.texts.effect: "Effect: The goon must have a size 1 creature
  or object grabbed, which they hurl across the area, ending the grab. The hurled creature or object
  is targeted by the ability, and lands in the last square of the line or the nearest unoccupied
  square of the goon's choice."
abilities.ogre.ogre-goon.swat-the-fly.name: Swat the Fly
abilities.ogre.ogre-goon.swat-the-fly.texts.trigger: A creature or object within distance moves or shifts away from the goon.
abilities.ogre.ogre-goon.swat-the-fly.texts.target: The triggering creature or object
abilities.ogre.ogre-goon.swat-the-fly.texts.distance: Melee 1
abilities.ogre.ogre-goon.swat-the-fly.texts.effect: 'Effect: The goon slides the target up to 5 squares.'
traits.ogre.ogre-goon.defiant-anger.name: Defiant Anger
traits.ogre.ogre-goon.defiant-anger.description: While winded, the goon has damage immunity 2.
monsters.ogre.ogre-goon.name: Ogre Goon
abilities.ogre.ogre-juggernaut.pitchfork-catapult.name: Pitchfork Catapult
abilities.ogre.ogre-juggernaut.pitchfork-catapult.texts.target: Two creatures or objects
abilities.ogre.ogre-juggernaut.pitchfork-catapult.texts.distance: Melee 2
abilities.ogre.ogre-juggernaut.pitchfork-catapult.texts.roll: Power Roll + 2
abilities.ogre.ogre-juggernaut.pitchfork-catapult.texts.tier1: 7 damage
abilities.ogre.ogre-juggernaut.pitchfork-catapult.texts.tier2: 10 damage; A < 1 vertical push 2
abilities.ogre.ogre-juggernaut.pitchfork-catapult.texts.tier3: 13 damage; A < 2 vertical slide 3
abilities.ogre.ogre-juggernaut.pitchfork-catapult.texts.effect: '1 Malice: Each target who has M < 1 is bleeding (save ends).'
abilities.ogre.ogre-juggernaut.earth-breaking-jump.name: Earth-Breaking Jump
abilities.ogre.ogre-juggernaut.earth-breaking-jump.texts.target: Each creature in the area
abilities.ogre.ogre-juggernaut.earth-breaking-jump.texts.distance: 3 burst
abilities.ogre.ogre-juggernaut.earth-breaking-jump.texts.roll: Power Roll + 2
abilities.ogre.ogre-juggernaut.earth-breaking-jump.texts.tier1: 4 damage
abilities.ogre.ogre-juggernaut.earth-breaking-jump.texts.tier2: 6 damage; push 2; M < 1 prone
abilities.ogre.ogre-juggernaut.earth-breaking-jump.texts.tier3: 9 damage; push 4; M < 2 prone
abilities.ogre.ogre-juggernaut.earth-breaking-jump.texts.effect: 'Effect: The juggernaut jumps up to 6 squares before using this ability.'
abilities.ogre.ogre-juggernaut.horrible-bellow.name: Horrible Bellow
abilities.ogre.ogre-juggernaut.horrible-bellow.texts.target: Each enemy in the area
abilities.ogre.ogre-juggernaut.horrible-bellow.texts.distance: 3 burst
abilities.ogre.ogre-juggernaut.horrible-bellow.texts.roll: Power Roll + 2
abilities.ogre.ogre-juggernaut.horrible-bellow.texts.tier1: I < 0 frightened (save ends)
abilities.ogre.ogre-juggernaut.horrible-bellow.texts.tier2: I < 1 frightened (save ends)
abilities.ogre.ogre-juggernaut.horrible-bellow.texts.tier3: I < 2 frightened (save ends)
abilities.ogre.ogre-juggernaut.horrible-bellow.texts.effect: 'Effect: While a target is frightened this way, any ogre gains an edge on strikes against them.'
abilities.ogre.ogre-juggernaut.hrraaaaaagh.name: Hrraaaaaagh!
abilities.ogre.ogre-juggernaut.hrraaaaaagh.texts.trigger: The juggernaut takes damage.
abilities.ogre.ogre-juggernaut.hrraaaaaagh.texts.target: Self
abilities.ogre.ogre-juggernaut.hrraaaaaagh.texts.distance: Self
abilities.ogre.ogre-juggernaut.hrraaaaaagh.texts.effect: 'Effect: The juggernaut moves up to their speed and can make a free strike.'
traits.ogre.ogre-juggernaut.destructive-path.name: Destructive Path
traits.ogre.ogre-juggernaut.destructive-path.description: The juggernaut automatically destroys any
  mundane size 1 objects in their path when they move or are force moved. They can break through any
  mundane wall made of wood, stone, or a similarly sturdy material this way as long as the wall is 2
  squares thick or less.
traits.ogre.ogre-juggernaut.defiant-anger.name: Defiant Anger
traits.ogre.ogre-juggernaut.defiant-anger.description: While winded, the juggernaut has damage immunity 2.
monsters.ogre.ogre-juggernaut.name: Ogre Juggernaut
monsters.ogre.ogre-tantrum.texts.withCaptain: +5 bonus to ranged distance
abilities.ogre.ogre-tantrum.throw-fit.name: Throw Fit
abilities.ogre.ogre-tantrum.throw-fit.texts.target: One creature or object per minion
abilities.ogre.ogre-tantrum.throw-fit.texts.distance: Ranged 8
abilities.ogre.ogre-tantrum.throw-fit.texts.roll: Power Roll + 4
abilities.ogre.ogre-tantrum.throw-fit.texts.tier1: 4 damage
abilities.ogre.ogre-tantrum.throw-fit.texts.tier2: 7 damage; push 2
abilities.ogre.ogre-tantrum.throw-fit.texts.tier3: 8 damage; push 4
abilities.ogre.ogre-tantrum.throw-fit.texts.effect: >-
  Effect: The tantrum unearths a rock or a hunk of terrain and tosses it. If a size 1L, 1M, or 1S
  creature or object adjacent to the tantrum has A < 3 the tantrum can grab them to use as the
  projectile for this ability.


  A creature or object used as a projectile is vertically pushed 8 (or 13 with a captain), ignoring
  stability.
traits.ogre.ogre-tantrum.excessive-anger.name: Excessive Anger
traits.ogre.ogre-tantrum.excessive-anger.description: The tantrum has damage immunity 3 and speed 8 while their squad has two or fewer minions in it.
monsters.ogre.ogre-tantrum.name: Ogre Tantrum
