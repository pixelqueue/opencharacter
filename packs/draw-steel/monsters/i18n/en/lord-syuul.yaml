malice.lord-syuul.guise.name: Guise
malice.lord-syuul.guise.description: Lord Syuul projects a psionic screen over his body, preventing
  other creatures from treating him as an enemy until the end of his next turn.
malice.lord-syuul.do-it-for-me.name: Do It for Me
malice.lord-syuul.do-it-for-me.description: Lord Syuul psionically plunders the minds of each
  creature within 2 squares of him. Each such creature makes a Reason test.
malice.lord-syuul.do-it-for-me.texts.tier1: 13 psychic damage; the target uses a signature ability against a creature of Lord Syuul's choice
malice.lord-syuul.do-it-for-me.texts.tier2: 10 psychic damage; the target makes a free strike against a creature of Lord Syuul's choice
malice.lord-syuul.do-it-for-me.texts.tier3: No effect.
malice.lord-syuul.solo-action.name: Solo Action
malice.lord-syuul.solo-action.description: Lord Syuul takes an additional main action on his turn.
  He can use this feature even if he is dazed.
malice.lord-syuul.overpower.name: Overpower
malice.lord-syuul.overpower.description: >-
  Lord Syuul sends out a psionic burst to completely overpower his greatest threats. He makes a
  Reason test (2d10 + 4).


  Once per round as a maneuver, Lord Syuul can repeat this test, replacing the previous Overpower
  effect.


  Whenever an Overpower effect is active, any hero who has one or more psionic abilities can use a
  maneuver to push back by making a Reason test, replacing the previous Overpower effect.

  ≤11: Lord Syuul has damage immunity 5.

  12–16: Lord Syuul has damage immunity 2.

  17+: Lord Syuul has damage weakness 5.


  The Overpower effect lasts until the end of the encounter.
malice.lord-syuul.overpower.texts.tier1: Lord Syuul has damage weakness 5.
malice.lord-syuul.overpower.texts.tier2: Lord Syuul has damage immunity 2.
malice.lord-syuul.overpower.texts.tier3: Lord Syuul has damage immunity 5.
traits.lord-syuul.lord-syuul.solo-monster.name: Solo Monster
traits.lord-syuul.lord-syuul.solo-monster.description: >-
  End Effect: At the end of each of his turns, Lord Syuul can take 10 damage to end one effect on
  him that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: Lord Syuul can take two turns each round. He can't take turns consecutively.
abilities.lord-syuul.lord-syuul.tentacle-grab.name: Tentacle Grab
abilities.lord-syuul.lord-syuul.tentacle-grab.texts.target: Two creatures or objects
abilities.lord-syuul.lord-syuul.tentacle-grab.texts.distance: Melee 2
abilities.lord-syuul.lord-syuul.tentacle-grab.texts.roll: Power Roll + 4
abilities.lord-syuul.lord-syuul.tentacle-grab.texts.tier1: 11 damage; A < 2 grabbed
abilities.lord-syuul.lord-syuul.tentacle-grab.texts.tier2: 17 damage; A < 3 grabbed
abilities.lord-syuul.lord-syuul.tentacle-grab.texts.tier3: 20 damage; A < 4 grabbed
abilities.lord-syuul.lord-syuul.tentacle-grab.texts.effect: 'Effect: Lord Syuul can have up to four
  targets grabbed at once.


  2 Malice: The distance of this ability increases to melee 10. Each target grabbed by Lord Syuul is
  pulled up to 10 squares.'
abilities.lord-syuul.lord-syuul.dampening-grenade.name: Dampening Grenade
abilities.lord-syuul.lord-syuul.dampening-grenade.texts.target: Each enemy in the area
abilities.lord-syuul.lord-syuul.dampening-grenade.texts.distance: 2 cube within 5
abilities.lord-syuul.lord-syuul.dampening-grenade.texts.roll: Power Roll + 4
abilities.lord-syuul.lord-syuul.dampening-grenade.texts.tier1: 6 damage; the effect ends after 2 turns
abilities.lord-syuul.lord-syuul.dampening-grenade.texts.tier2: 10 damage; the effect ends at the end of Lord Syuul's next turn
abilities.lord-syuul.lord-syuul.dampening-grenade.texts.tier3: 13 damage; the effect lasts until the end of the encounter
abilities.lord-syuul.lord-syuul.dampening-grenade.texts.effect: 'Effect: Any supernatural ability
  used by a creature in the area has a double bane. All reactive tests made against magic or psionic
  effects in the area have a double edge.'
abilities.lord-syuul.lord-syuul.mind-blown.name: Mind Blown
abilities.lord-syuul.lord-syuul.mind-blown.texts.target: One grabbed enemy
abilities.lord-syuul.lord-syuul.mind-blown.texts.distance: Melee 1
abilities.lord-syuul.lord-syuul.mind-blown.texts.roll: Power Roll + 4
abilities.lord-syuul.lord-syuul.mind-blown.texts.tier1: 12 damage
abilities.lord-syuul.lord-syuul.mind-blown.texts.tier2: 20 damage
abilities.lord-syuul.lord-syuul.mind-blown.texts.tier3: 24 damage
abilities.lord-syuul.lord-syuul.mind-blown.texts.effect: 'Effect: If this action reduces the target
  to 0 Stamina and they have a brain, their brain explodes, instantly killing them.'
abilities.lord-syuul.lord-syuul.you-come-with-me.name: You Come With Me
abilities.lord-syuul.lord-syuul.you-come-with-me.texts.target: Self
abilities.lord-syuul.lord-syuul.you-come-with-me.texts.distance: Self
abilities.lord-syuul.lord-syuul.you-come-with-me.texts.effect: 'Effect: Lord Syuul can teleport up
  to 5 squares along with each creature and object he has grabbed. He can release grabbed creatures
  and objects before or after teleporting.'
abilities.lord-syuul.lord-syuul.adaptability.name: Adaptability
abilities.lord-syuul.lord-syuul.adaptability.texts.trigger: Lord Syuul takes damage that has a damage type.
abilities.lord-syuul.lord-syuul.adaptability.texts.target: Self
abilities.lord-syuul.lord-syuul.adaptability.texts.distance: Self
abilities.lord-syuul.lord-syuul.adaptability.texts.effect: 'Effect: Until the start of his next
  turn, Lord Syuul gains immunity 5 to the triggering damage type.'
traits.lord-syuul.lord-syuul.mind-over-manners.name: Mind Over Manners
traits.lord-syuul.lord-syuul.mind-over-manners.description: Whenever Lord Syuul uses a psionic
  ability, he can do so as if he were in the space of any creature within his line of effect who he
  has observed using a psionic ability.
abilities.lord-syuul.lord-syuul.see-only-me.name: See Only Me
abilities.lord-syuul.lord-syuul.see-only-me.texts.target: Each enemy in the area
abilities.lord-syuul.lord-syuul.see-only-me.texts.distance: 10 burst
abilities.lord-syuul.lord-syuul.see-only-me.texts.roll: Intuition test
abilities.lord-syuul.lord-syuul.see-only-me.texts.tier1: 16 psychic damage; the target has no line
  of effect to any creature except Lord Syuul, and takes a bane on strikes targeting Lord Syuul
  (save ends)
abilities.lord-syuul.lord-syuul.see-only-me.texts.tier2: 13 psychic damage; the target has no line of effect to any creature except Lord Syuul (save ends)
abilities.lord-syuul.lord-syuul.see-only-me.texts.tier3: 7 psychic damage
abilities.lord-syuul.lord-syuul.see-only-me.texts.effect: 'Effect: Each target makes an Intuition test.'
abilities.lord-syuul.lord-syuul.phantom-pain.name: Phantom Pain
abilities.lord-syuul.lord-syuul.phantom-pain.texts.target: Self
abilities.lord-syuul.lord-syuul.phantom-pain.texts.distance: Self
abilities.lord-syuul.lord-syuul.phantom-pain.texts.effect: "Effect: Lord Syuul becomes invisible,
  can teleport up to 10 squares, and projects an illusory double within 10 squares. The double can't
  move or act, but Lord Syuul can use psionic abilities as if he were in its square. Whenever a
  creature touches or damages the double with a melee strike, they take 10 psychic damage. If Lord
  Syuul takes damage, his invisibility ends and the double disappears."
abilities.lord-syuul.lord-syuul.mindshatter.name: Mindshatter
abilities.lord-syuul.lord-syuul.mindshatter.texts.target: Each creature in the area
abilities.lord-syuul.lord-syuul.mindshatter.texts.distance: 5 burst
abilities.lord-syuul.lord-syuul.mindshatter.texts.roll: Power Roll + 4
abilities.lord-syuul.lord-syuul.mindshatter.texts.tier1: 7 psychic damage
abilities.lord-syuul.lord-syuul.mindshatter.texts.tier2: 13 psychic damage
abilities.lord-syuul.lord-syuul.mindshatter.texts.tier3: 16 psychic damage
abilities.lord-syuul.lord-syuul.mindshatter.texts.effect: 'Effect: Until the end of the encounter, each target has damage weakness 3.'
monsters.lord-syuul.lord-syuul.name: Lord Syuul
effects.lord-syuul.see-only-me.name: See Only Me
effects.lord-syuul.see-only-me.description:
  The creature has no line of effect to any creature except Lord Syuul (and at the worst outcome
  takes a bane on strikes targeting Lord Syuul).
effects.lord-syuul.shattered.name: Mindshattered
effects.lord-syuul.shattered.description: Until the end of the encounter, the creature has damage weakness 3.
