malice.demon.level-10.prior-malice-features.description: The demon activates a Malice feature available to demons of level 9 or lower.
malice.demon.level-10.soul-flense.name: Soul Flense
malice.demon.level-10.soul-flense.description: >-
  One demon acting this turn unleashes their pent-up agony and pain on every non-demon in a 5 burst.
  Each target makes a Presence test.


  Effect: The demon removes all conditions and effects on themself that can be ended by a saving
  throw, and transfers all those effects to each creature soul flensed this way.
