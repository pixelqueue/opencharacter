malice.demon.level-1.soulburn.name: Soulburn
malice.demon.level-1.soulburn.description: Each demon acting this turn has a double edge on abilities.
malice.demon.level-1.abyssal-evolution.name: Abyssal Evolution
malice.demon.level-1.abyssal-evolution.description: A demon minion of your choice transforms into a non-minion horde demon of the same level.
malice.demon.level-1.abyssal-rift.name: Abyssal Rift
malice.demon.level-1.abyssal-rift.description: Two size 2 rifts to the Abyssal Wasteland appear at
  locations of your choice. Any demon can use an abyssal rift as a portal to another abyssal rift in
  the encounter, moving into any space in one rift and appearing immediately in any unoccupied space
  in the other rift. A non-demon who enters a rift for the first time in a round or starts their
  turn there takes corruption damage equal to the level of the highest-level demon on the encounter
  map. An abyssal rift is an immovable object that has 25 Stamina, damage immunity 2, and holy
  weakness 5. The rift closes when there are no demons remaining on the encounter map. Additionally,
  a creature who has the Magic or Psionics skill can make a Reason test or Intuition test as a
  maneuver while adjacent to a rift to destabilize and close it.
malice.demon.level-1.abyssal-rift.texts.tier1: The rift remains open and regains 5 Stamina.
malice.demon.level-1.abyssal-rift.texts.tier2: The rift remains open.
malice.demon.level-1.abyssal-rift.texts.tier3: The rift closes.
