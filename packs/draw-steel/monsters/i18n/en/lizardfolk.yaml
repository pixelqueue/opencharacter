malice.lizardfolk.net-trap.name: Net Trap
malice.lizardfolk.net-trap.description: >-
  Keywords: Area, Ranged, Weapon · Maneuver


  Distance: 1 cube within 3 · Target: Special


  Effect: A lizardfolk acting this turn sets up a net trap into the area. The first time an enemy
  steps into a square with a net trap, they make an Agility test. If the creature was unaware of the
  trap, they take a bane on the test.


  Effect: Any creature not also restrained by a net trap who is adjacent to a creature restrained by
  the trap can free them as a maneuver.
malice.lizardfolk.net-trap.texts.tier1: Restrained (save ends).
malice.lizardfolk.net-trap.texts.tier2: Restrained (Eot).
malice.lizardfolk.net-trap.texts.tier3: No effect.
malice.lizardfolk.water-pit.name: Water Pit
malice.lizardfolk.water-pit.description: A lizardfolk acting this turn unearths a magical size 2 pit
  that is 2 squares deep and filled with water. Any lizardfolk who moves into, then exits the pit on
  their turn gains 10 temporary Stamina, regrows their tail if applicable, and ends one effect on
  them that can be ended by a saving throw. While adjacent to the pit, any creature who can burrow
  or who has the Nature skill can make a Might test or a Reason test to drain it.
malice.lizardfolk.water-pit.texts.tier1: The creature falls into the pit and is knocked prone.
malice.lizardfolk.water-pit.texts.tier2: The creature fails to empty the pit.
malice.lizardfolk.water-pit.texts.tier3: The pit empties of water.
malice.lizardfolk.flood-the-shores.name: Flood the Shores
malice.lizardfolk.flood-the-shores.description: Waist-high water floods the entire encounter map.
  Any lizardfolk submerged in water gains an edge on abilities and doubles their speed while
  swimming. If there are no open water pits on the encounter map, the water drains away at the end
  of the round.
