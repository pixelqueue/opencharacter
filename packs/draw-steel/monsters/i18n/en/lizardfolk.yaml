abilities.lizardfolk.lizardfolk-deathrex.trundle.texts.distance: Self
abilities.lizardfolk.lizardfolk-deathrex.trundle.texts.effect: 'Effect: The deathrex moves up to
  their speed. They can make a free strike against each creature who makes an opportunity attack
  against them during this movement.'
