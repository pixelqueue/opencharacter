abilities.lizardfolk.lizardfolk-deathrex.thresher-thrasher.texts.effect: 'Effect: Each target moves
  up to their speed. Until the end of the encounter, whenever a creature comes adjacent to a target
  or starts their turn there, the target can make a free strike against them.'
