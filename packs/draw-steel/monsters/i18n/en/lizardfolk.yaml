abilities.lizardfolk.lizardfolk-deathrex.swat-the-fly.texts.distance: Melee 1
abilities.lizardfolk.lizardfolk-deathrex.swat-the-fly.texts.effect: 'Effect: The deathrex slides the target up to 5 squares.'
traits.lizardfolk.lizardfolk-deathrex.rex-reptilian-escape.name: Rex Reptilian Escape
traits.lizardfolk.lizardfolk-deathrex.rex-reptilian-escape.description: While the deathrex has a
  tail, whenever they are affected by an effect that can be ended by a saving throw or that ends at
  the end of their turn, they can lose their tail to immediately end that effect, then shift up to 2
  squares.
