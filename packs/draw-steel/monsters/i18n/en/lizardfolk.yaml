abilities.lizardfolk.lizardfolk-deathrex.shed-some-skin.name: Shed Some Skin
abilities.lizardfolk.lizardfolk-deathrex.shed-some-skin.texts.target: Self
abilities.lizardfolk.lizardfolk-deathrex.shed-some-skin.texts.distance: Self
abilities.lizardfolk.lizardfolk-deathrex.shed-some-skin.texts.effect: "Effect: The deathrex shifts
  up to their speed, leaving behind a shed skin duplicate in the space they started in. The
  duplicate acts on the deathrex's turn and has the deathrex's characteristics, but has 10 Stamina
