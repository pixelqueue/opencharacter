malice.gnoll.iron-jaws.name: Iron Jaws
malice.gnoll.iron-jaws.description: >-
  Area, Ranged, Weapon · Maneuver


  1 cube within 3 · Special


  Effect: A gnoll acting this turn drops an iron-jawed snare into the area. The first time any enemy
  moves into the area, they make an Agility test. If they were unaware of the snare, the test takes
  a bane.


  Effect: While an enemy is bleeding this way, each gnoll in the encounter gains an edge on strikes
  made against them.
malice.gnoll.iron-jaws.texts.tier1: 6 damage; bleeding (save ends)
malice.gnoll.iron-jaws.texts.tier2: 4 damage; bleeding (EoT)
malice.gnoll.iron-jaws.texts.tier3: No effect.
malice.gnoll.bloodpool.name: Bloodpool
malice.gnoll.bloodpool.description: One gnoll minion suddenly explodes into a pool of blood,
  splattering the area within 3 squares of them. Any gnoll who starts their turn in this area deals
  an extra 5 damage on their next strike before the end of their turn. Once per round, an abyssal
  hyena who starts their turn in the area turns into a gnoll marauder with 7 Stamina.
malice.gnoll.echoes-of-laughter.name: Echoes of Laughter
malice.gnoll.echoes-of-laughter.description: Until the end of the encounter, the encounter map is
  encased in a soundscape of laughter and howling. Each enemy takes a bane on the first power roll
  they make each round. Whenever a gnoll is killed, this effect is suppressed until the start of the
  next round.
monsters.gnoll.abyssal-hyena.texts.withCaptain: +2 bonus to speed
abilities.gnoll.abyssal-hyena.snapjaw.name: Snapjaw
abilities.gnoll.abyssal-hyena.snapjaw.texts.target: One creature or object per minion
abilities.gnoll.abyssal-hyena.snapjaw.texts.distance: Melee 1
abilities.gnoll.abyssal-hyena.snapjaw.texts.roll: Power Roll + 2
abilities.gnoll.abyssal-hyena.snapjaw.texts.tier1: 3 damage
abilities.gnoll.abyssal-hyena.snapjaw.texts.tier2: 4 damage
abilities.gnoll.abyssal-hyena.snapjaw.texts.tier3: 6 damage; grabbed
traits.gnoll.abyssal-hyena.death-snap.name: Death Snap
traits.gnoll.abyssal-hyena.death-snap.description: When the abyssal hyena is reduced to 0 Stamina, they can make a melee free strike before dying.
monsters.gnoll.abyssal-hyena.name: Abyssal Hyena
abilities.gnoll.gnoll-abyssal-archer.dark-longbow.name: Dark Longbow
abilities.gnoll.gnoll-abyssal-archer.dark-longbow.texts.target: One creature or object
abilities.gnoll.gnoll-abyssal-archer.dark-longbow.texts.distance: Ranged 10
abilities.gnoll.gnoll-abyssal-archer.dark-longbow.texts.roll: Power Roll + 2
abilities.gnoll.gnoll-abyssal-archer.dark-longbow.texts.tier1: 5 corruption damage
abilities.gnoll.gnoll-abyssal-archer.dark-longbow.texts.tier2: 6 corruption damage
abilities.gnoll.gnoll-abyssal-archer.dark-longbow.texts.tier3: 8 corruption damage; M < 2 slowed (save ends)
abilities.gnoll.gnoll-abyssal-archer.dark-longbow.texts.effect: 'Effect: This ability gains an edge against any target not at full Stamina.'
abilities.gnoll.gnoll-abyssal-archer.archers-cackletongue.name: Archer's Cackletongue
abilities.gnoll.gnoll-abyssal-archer.archers-cackletongue.texts.target: Self and each ally in the area
abilities.gnoll.gnoll-abyssal-archer.archers-cackletongue.texts.distance: 2 burst
abilities.gnoll.gnoll-abyssal-archer.archers-cackletongue.texts.effect: "Effect: Until the end of
  their next turn, each target gains an edge on their next strike. If any target hasn't used their
  own Cackletongue maneuver on this turn, they can use it immediately at no cost."
traits.gnoll.gnoll-abyssal-archer.distant-death-frenzy.name: Distant Death Frenzy
traits.gnoll.gnoll-abyssal-archer.distant-death-frenzy.description: Whenever a non-minion ally
  within 5 squares of the abyssal archer is reduced to 0 Stamina, the abyssal archer can make a
  ranged free strike.
traits.gnoll.gnoll-abyssal-archer.bloodscent.name: Bloodscent
traits.gnoll.gnoll-abyssal-archer.bloodscent.description: The abyssal archer doesn't need line of
  effect to use their abilities against any creature who isn't at full Stamina, as long as a size 1
  opening exists between the archer and the target.
monsters.gnoll.gnoll-abyssal-archer.name: Gnoll Abyssal Archer
abilities.gnoll.gnoll-abyssal-summoner.flame-wad.name: Flame Wad
abilities.gnoll.gnoll-abyssal-summoner.flame-wad.texts.target: One creature or object
abilities.gnoll.gnoll-abyssal-summoner.flame-wad.texts.distance: Ranged 5
abilities.gnoll.gnoll-abyssal-summoner.flame-wad.texts.roll: Power Roll + 2
abilities.gnoll.gnoll-abyssal-summoner.flame-wad.texts.tier1: 4 fire damage
abilities.gnoll.gnoll-abyssal-summoner.flame-wad.texts.tier2: 5 fire damage
abilities.gnoll.gnoll-abyssal-summoner.flame-wad.texts.tier3: 7 fire damage; I < 2 the target is burning (save ends)
abilities.gnoll.gnoll-abyssal-summoner.flame-wad.texts.effect: 'Effect: A burning creature takes 1d6
  fire damage at the start of each of their turns. A burning object takes 1d6 fire damage at the end
  of each round.'
abilities.gnoll.gnoll-abyssal-summoner.call-abyssal-hyenas.name: Call Abyssal Hyenas
abilities.gnoll.gnoll-abyssal-summoner.call-abyssal-hyenas.texts.target: Special
abilities.gnoll.gnoll-abyssal-summoner.call-abyssal-hyenas.texts.distance: Ranged 5
abilities.gnoll.gnoll-abyssal-summoner.call-abyssal-hyenas.texts.effect: 'Effect: Two abyssal hyenas claw up from the ground in unoccupied spaces within distance.'
abilities.gnoll.gnoll-abyssal-summoner.summoners-cackletongue.name: Summoner's Cackletongue
abilities.gnoll.gnoll-abyssal-summoner.summoners-cackletongue.texts.target: Each ally in the area
abilities.gnoll.gnoll-abyssal-summoner.summoners-cackletongue.texts.distance: 2 burst
abilities.gnoll.gnoll-abyssal-summoner.summoners-cackletongue.texts.effect: "Effect: One abyssal
  hyena target turns into a gnoll marauder, keeping their current Stamina. If any target hasn't used
  their own Cackletongue maneuver on this turn, they can use it immediately at no cost."
traits.gnoll.gnoll-abyssal-summoner.death-frenzy.name: Death Frenzy
traits.gnoll.gnoll-abyssal-summoner.death-frenzy.description: Whenever a non-minion ally within 5
  squares of the abyssal summoner is reduced to 0 Stamina, the abyssal summoner moves up to their
  speed and can make a melee free strike.
monsters.gnoll.gnoll-abyssal-summoner.name: Gnoll Abyssal Summoner
abilities.gnoll.gnoll-bonesplitter.three-tail-flail.name: Three-Tail Flail
abilities.gnoll.gnoll-bonesplitter.three-tail-flail.texts.target: One creature or object
abilities.gnoll.gnoll-bonesplitter.three-tail-flail.texts.distance: Melee 1
abilities.gnoll.gnoll-bonesplitter.three-tail-flail.texts.roll: Power Roll + 2
abilities.gnoll.gnoll-bonesplitter.three-tail-flail.texts.tier1: 5 damage; push 2
abilities.gnoll.gnoll-bonesplitter.three-tail-flail.texts.tier2: 6 damage; push 2
abilities.gnoll.gnoll-bonesplitter.three-tail-flail.texts.tier3: 8 damage; grabbed; M < 2 the target takes a bane on the Escape Grab maneuver
abilities.gnoll.gnoll-bonesplitter.three-tail-flail.texts.effect: "Effect: While the bonesplitter
  has a target grabbed, they can't use Three-Tail Flail against another target."
abilities.gnoll.gnoll-bonesplitter.bonesplitters-cackletongue.name: Bonesplitter's Cackletongue
abilities.gnoll.gnoll-bonesplitter.bonesplitters-cackletongue.texts.target: Self and each ally in the area
abilities.gnoll.gnoll-bonesplitter.bonesplitters-cackletongue.texts.distance: 2 burst
abilities.gnoll.gnoll-bonesplitter.bonesplitters-cackletongue.texts.effect: "Effect: Up to three
  targets can make a free strike. If any target hasn't used their own Cackletongue maneuver on this
  turn, they can use it immediately at no cost."
traits.gnoll.gnoll-bonesplitter.death-frenzy.name: Death Frenzy
traits.gnoll.gnoll-bonesplitter.death-frenzy.description: Whenever a non-minion ally within 5
  squares of the bonesplitter is reduced to 0 Stamina, the bonesplitter moves up to their speed and
  can make a melee free strike.
monsters.gnoll.gnoll-bonesplitter.name: Gnoll Bonesplitter
abilities.gnoll.gnoll-cackler.moment-of-brutality.name: Moment of Brutality
abilities.gnoll.gnoll-cackler.moment-of-brutality.texts.target: One creature
abilities.gnoll.gnoll-cackler.moment-of-brutality.texts.distance: Ranged 8
abilities.gnoll.gnoll-cackler.moment-of-brutality.texts.roll: Power Roll + 2
abilities.gnoll.gnoll-cackler.moment-of-brutality.texts.tier1: 4 psychic damage; I < 0 the target makes a free strike against a creature of the cackler's choice
abilities.gnoll.gnoll-cackler.moment-of-brutality.texts.tier2: 5 psychic damage; I < 1 the target makes a free strike against a creature of the cackler's choice
abilities.gnoll.gnoll-cackler.moment-of-brutality.texts.tier3: 7 psychic damage; I < 2 the target
  uses a signature ability against a creature of the cackler's choice
abilities.gnoll.gnoll-cackler.moment-of-brutality.texts.effect: 'Effect: An ally targeted by this ability ignores the damage and can make a free strike.'
abilities.gnoll.gnoll-cackler.cacklers-cackletongue.name: Cackler's Cackletongue
abilities.gnoll.gnoll-cackler.cacklers-cackletongue.texts.target: Each creature in the area
abilities.gnoll.gnoll-cackler.cacklers-cackletongue.texts.distance: 2 burst
abilities.gnoll.gnoll-cackler.cacklers-cackletongue.texts.roll: Intuition test
abilities.gnoll.gnoll-cackler.cacklers-cackletongue.texts.tier1: Frightened (save ends)
abilities.gnoll.gnoll-cackler.cacklers-cackletongue.texts.tier2: Frightened (EoT)
abilities.gnoll.gnoll-cackler.cacklers-cackletongue.texts.tier3: No effect
abilities.gnoll.gnoll-cackler.cacklers-cackletongue.texts.effect: "Effect: Each enemy target makes
  an Intuition test. If any target hasn't used their own Cackletongue maneuver on this turn, they
  can use it immediately at no cost."
traits.gnoll.gnoll-cackler.death-frenzy.name: Death Frenzy
traits.gnoll.gnoll-cackler.death-frenzy.description: Whenever a non-minion ally within 5 squares of
  the cackler is reduced to 0 Stamina, the cackler moves up to their speed and can make a melee free
  strike.
monsters.gnoll.gnoll-cackler.name: Gnoll Cackler
abilities.gnoll.gnoll-carnage.shrapnel-whip.name: Shrapnel Whip
abilities.gnoll.gnoll-carnage.shrapnel-whip.texts.target: Two creatures or objects
abilities.gnoll.gnoll-carnage.shrapnel-whip.texts.distance: Melee 2
abilities.gnoll.gnoll-carnage.shrapnel-whip.texts.roll: Power Roll + 3
abilities.gnoll.gnoll-carnage.shrapnel-whip.texts.tier1: 8 damage; A < 1 bleeding (save ends)
abilities.gnoll.gnoll-carnage.shrapnel-whip.texts.tier2: 11 damage; A < 2 bleeding (save ends)
abilities.gnoll.gnoll-carnage.shrapnel-whip.texts.tier3: 14 damage; A < 3 bleeding and dazed (save ends)
abilities.gnoll.gnoll-carnage.shrapnel-whip.texts.effect: 'Effect: An ally targeted by this ability ignores the damage and can make a free strike.'
abilities.gnoll.gnoll-carnage.carnages-cackletongue.name: Carnage's Cackletongue
abilities.gnoll.gnoll-carnage.carnages-cackletongue.texts.target: Self and each ally in the area
abilities.gnoll.gnoll-carnage.carnages-cackletongue.texts.distance: 5 burst
abilities.gnoll.gnoll-carnage.carnages-cackletongue.texts.effect: "Effect: Each target deals an
  extra 3 damage with their next strike until the start of the carnage's next turn. If any target
  hasn't used their own Cackletongue maneuver on this turn, they can use it immediately at no cost."
traits.gnoll.gnoll-carnage.death-rampage.name: Death Rampage
traits.gnoll.gnoll-carnage.death-rampage.description: Whenever a non-minion ally within 5 squares of
  the carnage is reduced to 0 Stamina, the carnage can move up to their speed, then can either make
  a melee free strike against two creatures or use Shrapnel Whip against one creature.
traits.gnoll.gnoll-carnage.end-effect.name: End Effect
traits.gnoll.gnoll-carnage.end-effect.description: At the end of each of their turns, the carnage
  can take 5 damage to end one effect on them that can be ended by a saving throw. This damage can't
  be reduced in any way.
traits.gnoll.gnoll-carnage.endless-hunger.name: Endless Hunger
traits.gnoll.gnoll-carnage.endless-hunger.description: If the carnage is reduced to 0 Stamina while
  there are still gnolls on the encounter map, one gnoll on the map is transformed into a gnoll
  carnage, keeping their current Stamina.
abilities.gnoll.gnoll-carnage.call-up-from-the-abyss.name: Call Up From the Abyss
abilities.gnoll.gnoll-carnage.call-up-from-the-abyss.texts.target: Special
abilities.gnoll.gnoll-carnage.call-up-from-the-abyss.texts.distance: Ranged 10
abilities.gnoll.gnoll-carnage.call-up-from-the-abyss.texts.effect: 'Effect: The carnage summons four abyssal hyenas into unoccupied spaces within distance.'
abilities.gnoll.gnoll-carnage.edacity.name: Edacity
abilities.gnoll.gnoll-carnage.edacity.texts.target: Self and three allies
abilities.gnoll.gnoll-carnage.edacity.texts.distance: 10 burst
abilities.gnoll.gnoll-carnage.edacity.texts.effect: 'Effect: Each target moves up to their speed and
  can make a free strike. Any creature damaged by one of these free strikes who has M < 2 is knocked
  prone.'
abilities.gnoll.gnoll-carnage.deepest-wounds.name: Deepest Wounds
abilities.gnoll.gnoll-carnage.deepest-wounds.texts.target: Each winded enemy in the area
abilities.gnoll.gnoll-carnage.deepest-wounds.texts.distance: 5 burst
abilities.gnoll.gnoll-carnage.deepest-wounds.texts.roll: Presence test
abilities.gnoll.gnoll-carnage.deepest-wounds.texts.tier1: The target can't regain Stamina until the end of the encounter.
abilities.gnoll.gnoll-carnage.deepest-wounds.texts.tier2: The target can't regain Stamina (save ends).
abilities.gnoll.gnoll-carnage.deepest-wounds.texts.tier3: No effect
abilities.gnoll.gnoll-carnage.deepest-wounds.texts.effect: >-
  Effect: The carnage's eyes and all exposed blood within distance glow bright red. Each target
  makes a Presence test.


  Effect: Until the end of the encounter, all gnolls have a double edge on power rolls that target a
  winded enemy.
monsters.gnoll.gnoll-carnage.name: Gnoll Carnage
