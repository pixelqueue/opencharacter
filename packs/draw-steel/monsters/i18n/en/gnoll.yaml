traits.gnoll.gnoll-chainflail.death-circle.description: Whenever a non-minion ally within 5 squares
  of the chainflail is reduced to 0 Stamina, the chainflail can move up to their speed.
monsters.gnoll.gnoll-chainflail.name: Gnoll Chainflail
