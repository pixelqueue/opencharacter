monsters.gnoll.gnoll-wildling.name: Gnoll Wildling
abilities.gnoll.tusker-demon.gore.name: Gore
abilities.gnoll.tusker-demon.gore.texts.target: Two creatures or objects
abilities.gnoll.tusker-demon.gore.texts.distance: Melee 2
abilities.gnoll.tusker-demon.gore.texts.roll: Power Roll + 2
abilities.gnoll.tusker-demon.gore.texts.tier1: 7 damage; push 1
abilities.gnoll.tusker-demon.gore.texts.tier2: 11 damage; push 2
abilities.gnoll.tusker-demon.gore.texts.tier3: 14 damage; push 3, prone
abilities.gnoll.tusker-demon.gore.texts.effect: 'Effect: If this ability is used as part of the Charge main action, it deals an extra 4 damage.'
abilities.gnoll.tusker-demon.vengeful-tusker.name: Vengeful Tusker
abilities.gnoll.tusker-demon.vengeful-tusker.texts.trigger: An enemy within distance deals damage to the tusker.
abilities.gnoll.tusker-demon.vengeful-tusker.texts.target: The triggering enemy
abilities.gnoll.tusker-demon.vengeful-tusker.texts.distance: Ranged 7
abilities.gnoll.tusker-demon.vengeful-tusker.texts.effect: 'Effect: The tusker demon uses the Charge main action and Gore against the target.'
traits.gnoll.tusker-demon.trample.name: Trample
traits.gnoll.tusker-demon.trample.description: The tusker demon can move through enemies' spaces at
  their usual speed. When the tusker enters a creature's space for the first time on a turn, that
  creature takes 5 damage. The tusker demon can end their turn in a prone size 1 creature's space,
  preventing the creature from standing up.
traits.gnoll.tusker-demon.lethe.name: Lethe
traits.gnoll.tusker-demon.lethe.description: While the tusker demon is winded, they gain an edge on
  strikes, and any strike made against them gains an edge.
monsters.gnoll.tusker-demon.name: Tusker Demon
effects.gnoll.burning.name: Burning
effects.gnoll.burning.description: A burning creature takes 1d6 fire damage at the start of each of
  their turns. A burning object takes 1d6 fire damage at the end of each round.
effects.gnoll.deepest-wounds.name: Deepest Wounds
effects.gnoll.deepest-wounds.description: The target can't regain Stamina.
effects.gnoll.no-magic.name: No magic
effects.gnoll.no-magic.description: The target can't use magic abilities.
effects.gnoll.ripper-bane.name: Bane
effects.gnoll.ripper-bane.description: The target takes a bane on their next power roll.
effects.gnoll.carnage-cackle.name: Carnage's Cackletongue
effects.gnoll.carnage-cackle.description: The target deals an extra 3 damage with their next strike
  until the start of the carnage's next turn.
