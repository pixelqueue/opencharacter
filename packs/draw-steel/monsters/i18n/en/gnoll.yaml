abilities.gnoll.gnoll-mage-mauler.wizard-ripper.texts.distance: Melee 1
abilities.gnoll.gnoll-mage-mauler.wizard-ripper.texts.roll: Power Roll + 2
abilities.gnoll.gnoll-mage-mauler.wizard-ripper.texts.tier1: 2 acid damage
abilities.gnoll.gnoll-mage-mauler.wizard-ripper.texts.tier2: 3 cold damage
abilities.gnoll.gnoll-mage-mauler.wizard-ripper.texts.tier3: 5 lightning damage; the target can't use magic abilities (EoT)
abilities.gnoll.gnoll-mage-mauler.wizard-ripper.texts.effect: 'Effect: The target takes a bane on their next power roll.'
traits.gnoll.gnoll-mage-mauler.death-circle.name: Death Circle
traits.gnoll.gnoll-mage-mauler.death-circle.description: Whenever a non-minion ally within 5 squares
  of the mage mauler is reduced to 0 Stamina, the mage mauler can move up to their speed.
monsters.gnoll.gnoll-mage-mauler.name: Gnoll Mage Mauler
abilities.gnoll.gnoll-marauder.fury-flail.name: Fury Flail
abilities.gnoll.gnoll-marauder.fury-flail.texts.target: One creature or object
abilities.gnoll.gnoll-marauder.fury-flail.texts.distance: Melee 1
abilities.gnoll.gnoll-marauder.fury-flail.texts.roll: Power Roll + 2
abilities.gnoll.gnoll-marauder.fury-flail.texts.tier1: 4 damage
abilities.gnoll.gnoll-marauder.fury-flail.texts.tier2: 5 damage
abilities.gnoll.gnoll-marauder.fury-flail.texts.tier3: 7 damage; prone; A < 2 bleeding (save ends)
abilities.gnoll.gnoll-marauder.fury-flail.texts.effect: '2+ Malice: This ability targets one additional target for each 2 Malice spent.'
abilities.gnoll.gnoll-marauder.marauders-cackletongue.name: Marauder's Cackletongue
abilities.gnoll.gnoll-marauder.marauders-cackletongue.texts.target: Self and each ally in the area
abilities.gnoll.gnoll-marauder.marauders-cackletongue.texts.distance: 2 burst
abilities.gnoll.gnoll-marauder.marauders-cackletongue.texts.effect: "Effect: Each target shifts up
  to their speed. If any target hasn't used their own Cackletongue maneuver on this turn, they can
  use it immediately at no cost."
traits.gnoll.gnoll-marauder.death-frenzy.name: Death Frenzy
traits.gnoll.gnoll-marauder.death-frenzy.description: Whenever a non-minion ally within 7 squares of
  the marauder is reduced to 0 Stamina, the marauder moves up to their speed and can make a melee
  free strike.
monsters.gnoll.gnoll-marauder.name: Gnoll Marauder
monsters.gnoll.gnoll-wildling.texts.withCaptain: Gain an edge on strikes
abilities.gnoll.gnoll-wildling.flail.name: Flail
abilities.gnoll.gnoll-wildling.flail.texts.target: One creature or object per minion
abilities.gnoll.gnoll-wildling.flail.texts.distance: Melee 1
abilities.gnoll.gnoll-wildling.flail.texts.roll: Power Roll + 2
abilities.gnoll.gnoll-wildling.flail.texts.tier1: 2 damage
abilities.gnoll.gnoll-wildling.flail.texts.tier2: 3 damage
abilities.gnoll.gnoll-wildling.flail.texts.tier3: 5 damage; the wildling can make a free strike against a creature adjacent to the target
traits.gnoll.gnoll-wildling.death-circle.name: Death Circle
traits.gnoll.gnoll-wildling.death-circle.description: Whenever a non-minion ally within 7 squares of
