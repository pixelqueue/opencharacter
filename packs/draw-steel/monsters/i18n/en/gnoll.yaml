abilities.gnoll.gnoll-chainflail.chain-shotput.texts.tier1: 3 damage
abilities.gnoll.gnoll-chainflail.chain-shotput.texts.tier2: 4 damage; push 1
abilities.gnoll.gnoll-chainflail.chain-shotput.texts.tier3: 6 damage; push 3
