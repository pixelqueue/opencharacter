malice.hag.hag-wyrd.name: Hag Wyrd
malice.hag.hag-wyrd.description: >-
  Keywords: Area, Magic · Main action


  Distance: 10 x 1 line within 1 · Target: Each enemy in the area


  Power Roll + 3


  Effect: After making the power roll, the hag can choose to replace the damage type and condition
  with lightning damage and dazed, or cold damage and slowed.
malice.hag.hag-wyrd.texts.tier1: 5 fire damage; R < 1 frightened (save ends)
malice.hag.hag-wyrd.texts.tier2: 8 fire damage; R < 2 frightened (save ends)
malice.hag.hag-wyrd.texts.tier3: 11 fire damage; R < 3 frightened (save ends)
malice.hag.solo-action.name: Solo Action
malice.hag.solo-action.description: The hag takes an additional main action on their turn. They can
  use this feature even if they are dazed.
malice.hag.house-call.name: House Call
malice.hag.house-call.description: >-
  The hag's hut springs to life. It enters the encounter map within 10 squares of the hag if it
  isn't already there and takes its turn. The hut is size 4, has 75 Stamina and damage immunity 3,
  and has speed 8 from its powerful set of animal legs. This feature can't be used if the hut is
  reduced to 0 Stamina. In addition to its move action, the house can take only the following main
  action.


  Kick (Signature Ability)


  Keywords: Area, Ranged, Weapon · Main action


  Distance: 2 cube within 2 · Target: Each enemy in the area


  Power Roll + 3
traits.hag.wode-hag.solo-monster.name: Solo Monster
traits.hag.wode-hag.solo-monster.description: >-
  End Effect: At the end of each of their turns, the hag can take 5 damage to end one effect on them
  that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The hag can take two turns each round. They can't take turns consecutively.
traits.hag.wode-hag.supernatural-resistance.name: Supernatural Resistance
traits.hag.wode-hag.supernatural-resistance.description: Magic and psionic abilities used against the hag take a bane.
abilities.hag.wode-hag.corrosive-claws.name: Corrosive Claws
abilities.hag.wode-hag.corrosive-claws.texts.target: Two creatures or objects
abilities.hag.wode-hag.corrosive-claws.texts.distance: Melee 1
abilities.hag.wode-hag.corrosive-claws.texts.roll: Power Roll + 3
abilities.hag.wode-hag.corrosive-claws.texts.tier1: 9 corruption damage; A < 1 weakened (save ends)
abilities.hag.wode-hag.corrosive-claws.texts.tier2: 13 corruption damage; A < 2 weakened (save ends)
abilities.hag.wode-hag.corrosive-claws.texts.tier3: 16 corruption damage; A < 3 weakened (save ends)
abilities.hag.wode-hag.soul-steal.name: Soul Steal
abilities.hag.wode-hag.soul-steal.texts.target: Each enemy in the area
abilities.hag.wode-hag.soul-steal.texts.distance: 4 cube within 1
abilities.hag.wode-hag.soul-steal.texts.roll: Power Roll + 3
abilities.hag.wode-hag.soul-steal.texts.tier1: 5 corruption damage; P < 1 4 corruption damage
abilities.hag.wode-hag.soul-steal.texts.tier2: 8 corruption damage; P < 2 5 corruption damage
abilities.hag.wode-hag.soul-steal.texts.tier3: 10 corruption damage; P < 3 6 corruption damage
abilities.hag.wode-hag.soul-steal.texts.effect: |-
  Effect: This ability gains an edge against a target who has a soul.

  3 Malice: The hag regains Stamina equal to half the damage dealt.
abilities.hag.wode-hag.shapeshifter.name: Shapeshifter
abilities.hag.wode-hag.shapeshifter.texts.target: Self
abilities.hag.wode-hag.shapeshifter.texts.distance: Self
abilities.hag.wode-hag.shapeshifter.texts.effect: >-
  Effect: The hag alters their body to become any size 1 creature, from a house cat to a humanoid.
  If the hag uses this ability while outside of any enemy's line of effect, they can choose to be
  automatically hidden. The hag can return to their original form as a free maneuver.


  5 Malice: The hag becomes a size 2 creature instead, from a bear to an ogre. While in this form,
  the hag's melee abilities gain a +1 bonus to distance and deal an extra 4 damage.
abilities.hag.wode-hag.turned-upside-down.name: Turned Upside Down
abilities.hag.wode-hag.turned-upside-down.texts.trigger: A creature targets the hag with a melee strike.
abilities.hag.wode-hag.turned-upside-down.texts.target: Each enemy in the area
abilities.hag.wode-hag.turned-upside-down.texts.distance: 1 burst
abilities.hag.wode-hag.turned-upside-down.texts.roll: Power Roll + 3
abilities.hag.wode-hag.turned-upside-down.texts.tier1: Slide 2; R < 1 the slide is vertical
abilities.hag.wode-hag.turned-upside-down.texts.tier2: Slide 3; R < 2 the slide is vertical, and the target is restrained (EoT)
abilities.hag.wode-hag.turned-upside-down.texts.tier3: Vertical slide 5; R < 3 restrained (EoT)
abilities.hag.wode-hag.turned-upside-down.texts.effect: 'Effect: While restrained this way, a
  creature who is vertical force moved is suspended in midair. The creature falls when the condition
  ends.'
abilities.hag.wode-hag.snackies-for-sweeties.name: Snackies for Sweeties
abilities.hag.wode-hag.snackies-for-sweeties.texts.target: Each creature in the area
abilities.hag.wode-hag.snackies-for-sweeties.texts.distance: 5 burst
abilities.hag.wode-hag.snackies-for-sweeties.texts.roll: Power Roll + 3
abilities.hag.wode-hag.snackies-for-sweeties.texts.tier1: 6 poison damage
abilities.hag.wode-hag.snackies-for-sweeties.texts.tier2: 10 poison damage
abilities.hag.wode-hag.snackies-for-sweeties.texts.tier3: 13 poison damage
abilities.hag.wode-hag.snackies-for-sweeties.texts.effect: >-
  Effect: The hag attaches an ornate explosive pastry to each target who has A < 2. At the end of
  the round, the hag makes one power roll against each creature with a pastry attached to them.


  Special: A creature wearing a pastry or adjacent to a creature wearing a pastry can attempt an
  Agility test to remove the pastry as a maneuver.

  ≤11: The hag makes the power roll for all pastries.

  12–16: The pastry is not removed.

  17+: The pastry is removed and can no longer explode.
abilities.hag.wode-hag.predators-alacrity.name: Predator's Alacrity
abilities.hag.wode-hag.predators-alacrity.texts.target: Each enemy in the area
abilities.hag.wode-hag.predators-alacrity.texts.distance: 1 burst
abilities.hag.wode-hag.predators-alacrity.texts.effect: 'Effect: Before using this villain action,
  the hag shifts up to their speed. They then use Corrosive Claws against each target, push each
  target up to 2 squares, and shift up to their speed again.'
abilities.hag.wode-hag.open-the-oven.name: Open the Oven
abilities.hag.wode-hag.open-the-oven.texts.target: Each creature in the area
abilities.hag.wode-hag.open-the-oven.texts.distance: 5 cube within 1
abilities.hag.wode-hag.open-the-oven.texts.roll: Power Roll + 3
abilities.hag.wode-hag.open-the-oven.texts.tier1: 6 fire damage; A < 1 weakened (save ends)
abilities.hag.wode-hag.open-the-oven.texts.tier2: 10 fire damage; A < 2 weakened (save ends)
abilities.hag.wode-hag.open-the-oven.texts.tier3: 13 fire damage; A < 3 weakened (save ends)
abilities.hag.wode-hag.open-the-oven.texts.effect: "Effect: The hag turns the area into a roiling
  oven until the end of the encounter. Any creature in area takes an extra 5 damage from the hag's
  damage-dealing abilities."
monsters.hag.wode-hag.name: Wode Hag
malice.hag.house-call.texts.tier1: 6 damage; push 3; M < 1 prone
malice.hag.house-call.texts.tier2: 10 damage; push 4; M < 2 prone
malice.hag.house-call.texts.tier3: 13 damage; push 5; M < 3 prone
malice.hag.casting-curses-and-bodies.name: Casting Curses and Bodies
malice.hag.casting-curses-and-bodies.description: The hag utters terrible words that push each enemy within 2 squares of them up to 3 squares.
effects.hag.pastry.name: Pastry
effects.hag.pastry.description: An ornate explosive pastry is attached to the creature. At the end
  of the round, the hag makes one power roll against each creature with a pastry attached to them. A
  creature wearing a pastry or adjacent to a creature wearing a pastry can attempt an Agility test
  to remove the pastry as a maneuver.
effects.hag.large-form.name: Large form
effects.hag.large-form.description: The hag is a size 2 creature, from a bear to an ogre. While in
  this form, the hag's melee abilities gain a +1 bonus to distance and deal an extra 4 damage.
