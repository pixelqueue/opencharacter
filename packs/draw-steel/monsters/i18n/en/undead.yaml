abilities.undead.vampire-lord.arise-my-children.texts.effect: 'Effect: Two blood-starved vampires appear in unoccupied spaces within distance.'
abilities.undead.vampire-lord.redirected-charm.name: Redirected Charm
abilities.undead.vampire-lord.redirected-charm.texts.trigger: A creature makes a strike against the vampire.
abilities.undead.vampire-lord.redirected-charm.texts.target: One enemy
abilities.undead.vampire-lord.redirected-charm.texts.distance: Ranged 5
abilities.undead.vampire-lord.redirected-charm.texts.effect: 'Effect: The target becomes the new target of the strike.'
traits.undead.vampire-lord.lords-bloodthirst.name: Lord's Bloodthirst
traits.undead.vampire-lord.lords-bloodthirst.description: The vampire has speed 15 and an edge on
  power rolls while any creature within 20 squares of them is bleeding. Any bleeding creature within
  5 squares of the vampire can't hide.
abilities.undead.vampire-lord.let-us-feast.name: Let Us Feast!
abilities.undead.vampire-lord.let-us-feast.texts.target: Each enemy in the area
abilities.undead.vampire-lord.let-us-feast.texts.distance: 20 burst
abilities.undead.vampire-lord.let-us-feast.texts.effect: 'Effect: Each target who has P < 4 is now bleeding (save ends).'
abilities.undead.vampire-lord.red-mist-rising.name: Red Mist Rising
abilities.undead.vampire-lord.red-mist-rising.texts.target: Each enemy in the area
abilities.undead.vampire-lord.red-mist-rising.texts.distance: 5 burst
abilities.undead.vampire-lord.red-mist-rising.texts.roll: Power Roll + 5
abilities.undead.vampire-lord.red-mist-rising.texts.tier1: 2 damage; M < 3 6 corruption damage
abilities.undead.vampire-lord.red-mist-rising.texts.tier2: 7 damage; M < 4 6 corruption damage
abilities.undead.vampire-lord.red-mist-rising.texts.tier3: 10 damage; M < 5 6 corruption damage
abilities.undead.vampire-lord.red-mist-rising.texts.effect: "Effect: The vampire turns to mist,
  filling the area. Until the end of the round, the vampire can't move or be targeted by abilities,
  but they can use Crimson Embrace against a target in the area. The vampire reforms in an
  unoccupied space in the area at the end of the round."
abilities.undead.vampire-lord.sacrifice.name: Sacrifice
abilities.undead.vampire-lord.sacrifice.texts.target: Each chosen ally
abilities.undead.vampire-lord.sacrifice.texts.distance: Ranged 20
monsters.undead.vampire-lord.name: Vampire Lord
abilities.undead.vampire.exsanguinating-bite.name: Exsanguinating Bite
abilities.undead.vampire.exsanguinating-bite.texts.target: One creature or object
abilities.undead.vampire.exsanguinating-bite.texts.distance: Melee 1
abilities.undead.vampire.exsanguinating-bite.texts.roll: Power Roll + 4
abilities.undead.vampire.exsanguinating-bite.texts.tier1: 7 damage; M < 2 bleeding (save ends)
abilities.undead.vampire.exsanguinating-bite.texts.tier2: 10 corruption damage; M < 3 5 corruption damage and bleeding (save ends)
abilities.undead.vampire.exsanguinating-bite.texts.tier3: 11 corruption damage; M < 4 7 corruption damage and bleeding (save ends)
abilities.undead.vampire.exsanguinating-bite.texts.effect: 'Effect: The vampire regains Stamina equal to any corruption damage dealt.'
abilities.undead.vampire.vicious-pursuit.name: Vicious Pursuit
abilities.undead.vampire.vicious-pursuit.texts.target: One creature or object
abilities.undead.vampire.vicious-pursuit.texts.distance: Melee 1
abilities.undead.vampire.vicious-pursuit.texts.roll: Power Roll + 4
abilities.undead.vampire.vicious-pursuit.texts.tier1: 7 damage; A < 2 slowed (save ends)
abilities.undead.vampire.vicious-pursuit.texts.tier2: 10 damage; A < 3 slowed (save ends)
abilities.undead.vampire.vicious-pursuit.texts.tier3: 11 damage; A < 4 slowed (save ends)
abilities.undead.vampire.vicious-pursuit.texts.effect: 'Effect: If the target is bleeding, the
  vampire shifts up to their speed before using this ability.'
abilities.undead.vampire.reactive-charm.name: Reactive Charm
abilities.undead.vampire.reactive-charm.texts.trigger: A creature makes a strike against the vampire.
abilities.undead.vampire.reactive-charm.texts.target: One enemy
abilities.undead.vampire.reactive-charm.texts.distance: Ranged 5
abilities.undead.vampire.reactive-charm.texts.effect: 'Effect: The target becomes the new target of the strike.'
traits.undead.vampire.unslakable-bloodthirst.name: Unslakable Bloodthirst
traits.undead.vampire.unslakable-bloodthirst.description: The vampire has speed 10 while any
  creature within 10 squares of them is bleeding. The vampire must make a strike against a bleeding
  creature on their turn if they are able to.
monsters.undead.vampire.name: Vampire
abilities.undead.waxen.wax-fling.name: Wax Fling
abilities.undead.waxen.wax-fling.texts.target: One creature or object
abilities.undead.waxen.wax-fling.texts.distance: Ranged 15
abilities.undead.waxen.wax-fling.texts.roll: Power Roll + 4
abilities.undead.waxen.wax-fling.texts.tier1: 8 damage
abilities.undead.waxen.wax-fling.texts.tier2: 11 damage
abilities.undead.waxen.wax-fling.texts.tier3: 12 damage; A < 4 slowed (save ends)
abilities.undead.waxen.wax-fling.texts.effect: 'Effect: If a target made slowed this way is already
  slowed, they are instead restrained (save ends).'
abilities.undead.waxen.erupt.name: Erupt
abilities.undead.waxen.erupt.texts.target: Each enemy in the area
abilities.undead.waxen.erupt.texts.distance: 2 burst
abilities.undead.waxen.erupt.texts.roll: Agility test
abilities.undead.waxen.erupt.texts.tier1: 10 damage
abilities.undead.waxen.erupt.texts.tier2: 8 damage
abilities.undead.waxen.erupt.texts.tier3: 5 damage
abilities.undead.waxen.erupt.texts.effect: >-
  Effect: If the waxen is ignited (see Burn Bright), they shift up to their speed before using this
  ability. Each target makes an Agility test.


  The waxen is then destroyed and the area is difficult terrain for enemies.
traits.undead.waxen.burn-bright.name: Burn Bright
traits.undead.waxen.burn-bright.description: If the waxen takes fire damage, they ignite. While
  ignited, the waxen takes 4 fire damage at the start of each of their turns and their strikes deal
  an extra 4 fire damage.
monsters.undead.waxen.name: Waxen
malice.undead.level-7.prior-malice-features.name: Prior Malice Features
malice.undead.level-7.prior-malice-features.description: The undead activates a Malice feature available to undead of level 6 or lower.
malice.undead.level-7.necrotic-rupture.name: Necrotic Rupture
malice.undead.level-7.necrotic-rupture.description: Until the end of the round, whenever an undead
  is reduced to 0 Stamina, they deal 8 corruption damage to each enemy within 3 squares of them.
abilities.undead.bonecage.ribcage-chomp.name: Ribcage Chomp
abilities.undead.bonecage.ribcage-chomp.texts.target: Two creatures or objects
abilities.undead.bonecage.ribcage-chomp.texts.distance: Melee 2
abilities.undead.bonecage.ribcage-chomp.texts.roll: Power Roll + 5
abilities.undead.bonecage.ribcage-chomp.texts.tier1: 9 damage; M < 4 grabbed
abilities.undead.bonecage.ribcage-chomp.texts.tier2: 12 damage; M < 5 grabbed
abilities.undead.bonecage.ribcage-chomp.texts.tier3: 14 damage; grabbed
abilities.undead.bonecage.ribcage-chomp.texts.effect: >-
  Effect: The bonecage can have up to four size 1 targets grabbed at once. Any creature grabbed by
  the bonecage takes a bane on the Escape Grab maneuver, and the bonecage has damage immunity 5
  against that creature's abilities. When the bonecage is force moved, any creature or object they
  have grabbed moves with them.


  3 Malice: While grabbed this way, a target can't teleport or be teleported.
abilities.undead.bonecage.labyrinth-of-bone.name: Labyrinth of Bone
abilities.undead.bonecage.labyrinth-of-bone.texts.target: Each enemy in the area
abilities.undead.bonecage.labyrinth-of-bone.texts.distance: Four 10 × 1 lines within 3
abilities.undead.bonecage.labyrinth-of-bone.texts.roll: Agility test
abilities.undead.bonecage.labyrinth-of-bone.texts.tier1: 9 damage
abilities.undead.bonecage.labyrinth-of-bone.texts.tier2: 7 damage
abilities.undead.bonecage.labyrinth-of-bone.texts.tier3: 4 damage
abilities.undead.bonecage.labyrinth-of-bone.texts.effect: >-
  Effect: The bonecage can put up to two 90-degree bends in each of the lines. Each target makes an
  Agility test.


  Effect: The area is difficult terrain for enemies. The effect ends at the end of the encounter or
  when the bonecage uses this ability again.
monsters.undead.bonecage.name: Bonecage
monsters.undead.giant-shambler-zombie.texts.withCaptain: +4 damage bonus to strikes
abilities.undead.giant-shambler-zombie.rotten-kick.name: Rotten Kick
abilities.undead.giant-shambler-zombie.rotten-kick.texts.target: One creature or object per minion
abilities.undead.giant-shambler-zombie.rotten-kick.texts.distance: Melee 2
abilities.undead.giant-shambler-zombie.rotten-kick.texts.roll: Power Roll + 5
abilities.undead.giant-shambler-zombie.rotten-kick.texts.tier1: 5 damage; push 2
abilities.undead.giant-shambler-zombie.rotten-kick.texts.tier2: 8 damage; push 4
abilities.undead.giant-shambler-zombie.rotten-kick.texts.tier3: 10 damage; push 6
traits.undead.giant-shambler-zombie.meat-shield.name: Meat Shield
traits.undead.giant-shambler-zombie.meat-shield.description: Each ally adjacent to the shambler has damage immunity 3.
monsters.undead.giant-shambler-zombie.name: Giant Shambler Zombie
abilities.undead.lithgekh.heartstopper.name: Heartstopper
abilities.undead.lithgekh.heartstopper.texts.target: One creature or object
abilities.undead.lithgekh.heartstopper.texts.distance: Ranged 15
abilities.undead.lithgekh.heartstopper.texts.roll: Power Roll + 5
abilities.undead.lithgekh.heartstopper.texts.tier1: 9 corruption damage; I < 3 frightened (save ends)
abilities.undead.lithgekh.heartstopper.texts.tier2: 12 corruption damage; I < 4 frightened (save ends)
abilities.undead.lithgekh.heartstopper.texts.tier3: 14 corruption damage; I < 5 frightened (save ends)
abilities.undead.lithgekh.heartstopper.texts.effect: 'Effect: A creature frightened this way takes a bane on any ability that targets undead.'
abilities.undead.lithgekh.devour-magic.name: Devour Magic
abilities.undead.lithgekh.devour-magic.texts.trigger: A creature within distance uses a magic ability.
abilities.undead.lithgekh.devour-magic.texts.target: The triggering creature
abilities.undead.lithgekh.devour-magic.texts.distance: Ranged 20
abilities.undead.lithgekh.devour-magic.texts.effect: 'Effect: Any damage dealt by or Stamina
  regained from the ability is halved. The lithgekh regains Stamina equal to the remaining damage
  dealt or Stamina gained.'
traits.undead.lithgekh.mystic-battery.name: Mystic Battery
traits.undead.lithgekh.mystic-battery.description: Each ally within 10 squares of the lithgekh gains an edge on magic abilities.
monsters.undead.lithgekh.name: Lithgekh
monsters.undead.skeleton-knight.texts.withCaptain: Gain an edge on strikes
abilities.undead.skeleton-knight.four-swords-swing.name: Four Swords Swing
abilities.undead.skeleton-knight.four-swords-swing.texts.target: One creature or object per minion
abilities.undead.skeleton-knight.four-swords-swing.texts.distance: Melee 1
abilities.undead.skeleton-knight.four-swords-swing.texts.roll: Power Roll + 5
abilities.undead.skeleton-knight.four-swords-swing.texts.tier1: 4 damage
abilities.undead.skeleton-knight.four-swords-swing.texts.tier2: 7 damage
abilities.undead.skeleton-knight.four-swords-swing.texts.tier3: 9 damage; the target can't shift (EoT)
traits.undead.skeleton-knight.bitter-bones.name: Bitter Bones
traits.undead.skeleton-knight.bitter-bones.description: If the knight is reduced to 0 Stamina, their
  bones collapse to fill their space with an impassable barrier. Any enemy who comes adjacent to the
  barrier for the first time in a round or starts their turn there takes 5 damage.
traits.undead.skeleton-knight.more-swings.name: More Swings
traits.undead.skeleton-knight.more-swings.description: Whenever the knight makes a free strike, they can make two free strikes instead.
monsters.undead.skeleton-knight.name: Skeleton Knight
monsters.undead.wraith-skulker.texts.withCaptain: +3 bonus to speed
abilities.undead.wraith-skulker.draining-rake.name: Draining Rake
abilities.undead.wraith-skulker.draining-rake.texts.target: One creature or object per minion
abilities.undead.wraith-skulker.draining-rake.texts.distance: Melee 1
abilities.undead.wraith-skulker.draining-rake.texts.roll: Power Roll + 5
abilities.undead.wraith-skulker.draining-rake.texts.tier1: 4 cold damage; the wraith can shift 1 square
abilities.undead.wraith-skulker.draining-rake.texts.tier2: 7 cold damage; the wraith shifts up to 2 square
abilities.undead.wraith-skulker.draining-rake.texts.tier3: 9 cold damage; P < 5 slowed (save ends); the wraith shifts up to 3 squares
abilities.undead.wraith-skulker.draining-rake.texts.effect: 'Effect: The wraith turns invisible until the start of their next turn.'
traits.undead.wraith-skulker.corruptive-phasing.name: Corruptive Phasing
traits.undead.wraith-skulker.corruptive-phasing.description: The wraith can move through creatures
  and objects at their usual speed, but can't end their turn inside a creature or object. The first
  time in a round that the wraith moves through a creature, that creature takes 5 corruption damage.
  The wraith doesn't take damage from being force moved into objects.
monsters.undead.wraith-skulker.name: Wraith Skulker
malice.undead.level-10.prior-malice-features.name: Prior Malice Features
malice.undead.level-10.prior-malice-features.description: The undead activates a Malice feature available to undead of level 9 or lower.
malice.undead.level-10.death-tax.name: Death Tax
malice.undead.level-10.death-tax.description: >-
  The undead attempts to rend the vitality of their foes. Each enemy within 5 squares of the undead
  makes a Might test.


  Effect: A target who has fewer Recoveries than they would lose is also weakened (save ends).


  Special: This ability can't be used by a minion.
malice.undead.level-10.death-tax.texts.tier1: 10 corruption damage; the target loses 2 Recoveries
malice.undead.level-10.death-tax.texts.tier2: 8 corruption damage; the target loses 1 Recovery
malice.undead.level-10.death-tax.texts.tier3: 5 corruption damage
effects.undead.levitated.name: Levitated
effects.undead.levitated.description: "A levitated target floats 1 square off the ground when first affected, then rises 1 square at the end of each of their turns. If a levitated target can't already fly, they can fly horizontally (not vertically) but are slowed and weakened while flying this way."
effects.undead.cursed.name: Cursed
effects.undead.cursed.description: 'A cursed target is bleeding and weakened, and allies gain an edge on strikes made against them.'
effects.undead.vampiric-celerity.name: Vampiric celerity
effects.undead.vampiric-celerity.description: 'The next ability the vampire uses before the start of their next turn gains an edge.'
abilities.undead.vampire-lord.sacrifice.texts.effect: "Effect: Each target is marked for sacrifice. At the end of the round, each target who isn't dead or destroyed takes 50 corruption damage. The vampire then uses the following ability."
abilities.undead.vampire-lord.wave-of-blood.name: Wave of Blood
abilities.undead.vampire-lord.wave-of-blood.texts.target: Each enemy in the area
abilities.undead.vampire-lord.wave-of-blood.texts.distance: 20 burst
abilities.undead.vampire-lord.wave-of-blood.texts.roll: Might test
abilities.undead.vampire-lord.wave-of-blood.texts.tier1: 11 corruption damage
abilities.undead.vampire-lord.wave-of-blood.texts.tier2: 8 corruption damage
abilities.undead.vampire-lord.wave-of-blood.texts.tier3: 2 corruption damage
abilities.undead.vampire-lord.wave-of-blood.texts.effect: 'Effect: Each target makes a Might test. This ability deals an extra 5 damage for each creature killed by the Sacrifice villain action.'
