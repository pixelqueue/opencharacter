malice.chimera.defensive-snapping.name: Defensive Snapping
malice.chimera.defensive-snapping.description: The chimera takes up a defensive stance. Until the
  start of their next turn, the chimera can make a free strike against each enemy who comes within 2
  squares of them.
malice.chimera.solo-action.name: Solo Action
malice.chimera.solo-action.description: The chimera takes an additional main action on their turn.
  They can use this feature even if they are dazed.
malice.chimera.unstable-terrain.name: Unstable Terrain
malice.chimera.unstable-terrain.description: The chimera shakes the ground, causing an eruption of
  loose rocks and debris that creates three size 2 stone objects anywhere on the encounter map. Each
  creature adjacent to one or more objects when they appear who has A < 2 takes 5 damage.
malice.chimera.ashen-clouds.name: Ashen Clouds
malice.chimera.ashen-clouds.description: Until the start of the chimera's next turn, all areas of
  the encounter map are shrouded in a thick cloud of ash. All creatures and objects on the map have
  concealment that the chimera ignores. Additionally, each enemy in the cloud who has I < 1 has line
  of effect only within 3 squares. The potency of this feature increases by 1 each time it's used.
traits.chimera.chimera.solo-monster.name: Solo Monster
traits.chimera.chimera.solo-monster.description: >-
  End Effect: At the end of each of their turns, the chimera can take 5 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The chimera can take two turns each round. They can't take turns consecutively.
traits.chimera.chimera.volant.name: Volant
traits.chimera.chimera.volant.description: When the chimera makes a creature winded or reduces them
  to 0 Stamina, they can move their speed toward an enemy.
abilities.chimera.chimera.bite.name: Bite
abilities.chimera.chimera.bite.texts.target: Two creatures or objects
abilities.chimera.chimera.bite.texts.distance: Melee 2
abilities.chimera.chimera.bite.texts.roll: Power Roll + 3
abilities.chimera.chimera.bite.texts.tier1: 9 damage
abilities.chimera.chimera.bite.texts.tier2: 13 damage
abilities.chimera.chimera.bite.texts.tier3: 16 damage
abilities.chimera.chimera.bite.texts.effect: 'Effect: This strike deals an extra 3 damage if it gains an edge or has a double edge.'
abilities.chimera.chimera.dragons-eruption.name: Dragon's Eruption
abilities.chimera.chimera.dragons-eruption.texts.target: Each enemy in the area
abilities.chimera.chimera.dragons-eruption.texts.distance: 3 cube within 10
abilities.chimera.chimera.dragons-eruption.texts.roll: Power Roll + 3
abilities.chimera.chimera.dragons-eruption.texts.tier1: 3 fire damage; A < 1 3 fire damage
abilities.chimera.chimera.dragons-eruption.texts.tier2: 5 fire damage; A < 2 5 fire damage
abilities.chimera.chimera.dragons-eruption.texts.tier3: 7 fire damage; A < 3 7 fire damage
abilities.chimera.chimera.roar.name: Roar
abilities.chimera.chimera.roar.texts.target: Each enemy in the area
abilities.chimera.chimera.roar.texts.distance: 5 burst
abilities.chimera.chimera.roar.texts.roll: Power Roll + 3
abilities.chimera.chimera.roar.texts.tier1: 4 psychic damage
abilities.chimera.chimera.roar.texts.tier2: 8 psychic damage; I < 2 frightened (save ends)
abilities.chimera.chimera.roar.texts.tier3: 10 psychic damage; I < 3 frightened (save ends)
abilities.chimera.chimera.lions-toss.name: Lion's Toss
abilities.chimera.chimera.lions-toss.texts.target: One creature or object
abilities.chimera.chimera.lions-toss.texts.distance: Melee 2
abilities.chimera.chimera.lions-toss.texts.roll: Power Roll + 3
abilities.chimera.chimera.lions-toss.texts.tier1: Vertical push 2
abilities.chimera.chimera.lions-toss.texts.tier2: Vertical push 3
abilities.chimera.chimera.lions-toss.texts.tier3: Vertical push 5
abilities.chimera.chimera.rams-defiance.name: Ram's Defiance
abilities.chimera.chimera.rams-defiance.texts.trigger: A creature makes a strike against the chimera and obtains a tier 1 outcome.
abilities.chimera.chimera.rams-defiance.texts.target: The triggering creature
abilities.chimera.chimera.rams-defiance.texts.distance: Melee 2
abilities.chimera.chimera.rams-defiance.texts.roll: Power Roll + 3
abilities.chimera.chimera.rams-defiance.texts.tier1: 6 damage; M < 1 slowed (save ends)
abilities.chimera.chimera.rams-defiance.texts.tier2: 8 damage; prone; M < 2 slowed (save ends)
abilities.chimera.chimera.rams-defiance.texts.tier3: 10 damage; prone; M < 3 slowed (save ends)
abilities.chimera.chimera.rams-defiance.texts.effect: 'Effect: The chimera shifts up to 5 squares.
  If they end this shift within distance of the target, make a power roll.'
abilities.chimera.chimera.overture-of-destruction.name: Overture of Destruction
abilities.chimera.chimera.overture-of-destruction.texts.target: Each enemy in the area
abilities.chimera.chimera.overture-of-destruction.texts.distance: 1 burst
abilities.chimera.chimera.overture-of-destruction.texts.effect: "Effect: The chimera can use Bite and Lion's Toss against each target."
abilities.chimera.chimera.fire-solo.name: Fire Solo
abilities.chimera.chimera.fire-solo.texts.target: Self
abilities.chimera.chimera.fire-solo.texts.distance: Self
abilities.chimera.chimera.fire-solo.texts.effect: "Effect: The chimera uses Dragon's Eruption and Roar without spending Malice."
abilities.chimera.chimera.chorus-of-destruction.name: Chorus of Destruction
abilities.chimera.chimera.chorus-of-destruction.texts.target: Self
abilities.chimera.chimera.chorus-of-destruction.texts.distance: Self
abilities.chimera.chimera.chorus-of-destruction.texts.effect: "Effect: The chimera uses Roar, then
  shifts up to their speed and can make a free strike against each enemy who comes adjacent to them
  during the shift. When the chimera ends this shift, they use Dragon's Eruption. The use of these
  abilities as part of this villain action costs no Malice."
monsters.chimera.chimera.name: Chimera
