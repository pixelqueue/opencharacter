malice.basic.brutal-effectiveness.name: Brutal Effectiveness
malice.basic.brutal-effectiveness.description: >-
  At the start of any monster's turn: the monster digs into the enemy's weak spot. The next ability
  the monster uses with a potency has that potency increased by 1.
malice.basic.malicious-strike.name: Malicious Strike
malice.basic.malicious-strike.description: >-
  At the start of any monster's turn: the monster pours all their animosity into their attack.
  Their next strike deals extra damage to one target equal to the monster's highest characteristic
  score. The extra damage increases by 1 for each additional Malice spent on this feature (to a
  maximum of three times the monster's highest characteristic). This feature can't be used two
  rounds in a row, even by different monsters.
