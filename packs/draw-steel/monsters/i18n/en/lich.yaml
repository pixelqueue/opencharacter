malice.lich.soul-sip.name: Soul Sip
malice.lich.soul-sip.description: The lich makes a free strike against one enemy within 20 squares.
  They then gain an edge on their next power roll.
malice.lich.solo-action.name: Solo Action
malice.lich.solo-action.description: The lich takes an additional main action on their turn. They
  can use this feature even if they are dazed.
malice.lich.spirit-shell.name: Spirit Shell
malice.lich.spirit-shell.description: The lich summons a swirling cloud of angry spirits to surround
  them until the start of the next round. Any creature who deals damage to the lich with a melee
  strike while the spirit shell is active makes a Presence test.
malice.lich.spirit-shell.texts.tier1: 16 psychic damage, dazed (save ends)
malice.lich.spirit-shell.texts.tier2: Dazed (save ends)
malice.lich.spirit-shell.texts.tier3: No effect.
malice.lich.cloud-of-deceit.name: Cloud of Deceit
malice.lich.cloud-of-deceit.description: >-
  The lich summons a mind-altering mist, turns invisible until the start of their next turn, and
  moves up to half their speed. Each enemy within 20 squares of the lich's starting point who has I
  < 4 is deceived. While deceived, a creature perceives all allies and enemies as the lich, and
  perceives the environment as an unfamiliar wasteland corrupted by necrotic blight. If other
  creatures attempt to communicate with a deceived creature, that creature interprets their words as
  ghastly taunts in the lich's voice.


  This effect lasts until an affected creature takes damage or an ally uses a main action to shake
  them out of it. Each time this feature is used during an encounter, the distance of the effect
  decreases by 5 squares (to a minimum of 5 squares) and the potency increases by 1.
traits.lich.lich.solo-monster.name: Solo Monster
traits.lich.lich.solo-monster.description: >-
  End Effect: At the end of each of their turns, the lich can take 20 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The lich can take two turns each round. They can't take turns consecutively.
abilities.lich.lich.conflagration.name: Conflagration
abilities.lich.lich.conflagration.texts.target: Two creatures or objects
abilities.lich.lich.conflagration.texts.distance: Ranged 20
abilities.lich.lich.conflagration.texts.roll: Power Roll + 5
abilities.lich.lich.conflagration.texts.tier1: 15 fire damage; A < 4 the target is immolated (save ends)
abilities.lich.lich.conflagration.texts.tier2: 21 fire damage; A < 5 the target is immolated (save ends)
abilities.lich.lich.conflagration.texts.tier3: 25 fire damage; A < 6 the target is immolated (save ends)
abilities.lich.lich.conflagration.texts.effect: "Effect: An immolated creature takes 10 fire damage
  whenever they use a main action and a maneuver on their turn. This damage can't be reduced in any
  way."
abilities.lich.lich.hopeless-place.name: Hopeless Place
abilities.lich.lich.hopeless-place.texts.target: Each enemy in the area
abilities.lich.lich.hopeless-place.texts.distance: 10 burst
abilities.lich.lich.hopeless-place.texts.roll: Power Roll + 5
abilities.lich.lich.hopeless-place.texts.tier1: 8 corruption damage; P < 4 the target is hopeless (save ends)
abilities.lich.lich.hopeless-place.texts.tier2: 13 corruption damage; P < 5 the target is hopeless (save ends)
abilities.lich.lich.hopeless-place.texts.tier3: 16 corruption damage; P < 6 the target is hopeless (save ends)
abilities.lich.lich.hopeless-place.texts.effect: >-
  Effect: A hopeless creature can't benefit from edges or double edges, can't gain or use surges,
  and can't gain temporary Stamina.


  3 Malice: The distance of this ability increases to a 20 burst and its potency increases by 1.
abilities.lich.lich.pain-unending.name: Pain Unending
abilities.lich.lich.pain-unending.texts.target: One creature or object
abilities.lich.lich.pain-unending.texts.distance: Ranged 20
abilities.lich.lich.pain-unending.texts.roll: Power Roll + 5
abilities.lich.lich.pain-unending.texts.tier1: 17 psychic damage
abilities.lich.lich.pain-unending.texts.tier2: 24 psychic damage
abilities.lich.lich.pain-unending.texts.tier3: 29 psychic damage
abilities.lich.lich.pain-unending.texts.effect: >-
  Effect: A target who has M < 4 is wracked with pain (save ends). A creature wracked with pain has
  a double bane on abilities.


  3 Malice: The lich chooses one additional target.


  2+ Malice: Each creature wracked with pain gains one of the following conditions of the lich's
  choice for each 2 Malice spent: bleeding, slowed, or prone and can't stand. These conditions end
  when a creature is no longer wracked with pain.
abilities.lich.lich.necrotic-form.name: Necrotic Form
abilities.lich.lich.necrotic-form.texts.target: Self
abilities.lich.lich.necrotic-form.texts.distance: Self
abilities.lich.lich.necrotic-form.texts.effect: 'Effect: The lich becomes spectral, moves up to
  their speed, and becomes corporeal again. While spectral, the lich automatically ends the grabbed
  or restrained conditions, has damage immunity 5, can move through solid matter, and ignores
  difficult terrain. If the lich ends this movement inside solid matter, they are shunted out into
  the space from which they entered it.'
abilities.lich.lich.baleful-swap.name: Baleful Swap
abilities.lich.lich.baleful-swap.texts.trigger: The lich is targeted using an ability by a creature other than the target.
abilities.lich.lich.baleful-swap.texts.target: One enemy
abilities.lich.lich.baleful-swap.texts.distance: Ranged 10
abilities.lich.lich.baleful-swap.texts.effect: 'Effect: If the target has P < 4, they swap places
  with the lich to become the new target of the triggering ability.'
traits.lich.lich.herald-of-oblivion.name: Herald of Oblivion
traits.lich.lich.herald-of-oblivion.description: In the lich's presence, death's call is stronger.
  Any winded creature within 5 squares of the lich is bleeding and can't use the Catch Breath
  maneuver.
traits.lich.lich.glare-of-undeath.name: Glare of Undeath
traits.lich.lich.glare-of-undeath.description: At the start of each round, the lich chooses a
  creature within 10 squares. If that creature has R < 4, they are restrained until the end of the
  lich's next turn. The lich can't choose the same creature two rounds in a row.
traits.lich.lich.rejuvenation.name: Rejuvenation
traits.lich.lich.rejuvenation.description: >-
  The lich has a soulstone, which has 50 Stamina and damage immunity all except to sonic damage and
  holy damage. If the lich is destroyed while their soulstone is intact, their soul retreats into
  the soulstone. Any creature who has P < 5 and who moves within 5 squares of an inhabited soulstone
  for the first time in a round or starts their turn there is compelled (save ends). A compelled
  creature must do everything in their power to move toward and touch the soulstone.


  A creature who touches an inhabited soulstone makes a Might test that takes a bane.

  ≤11: The creature is reduced to 0 Stamina and the lich manifests adjacent to the soulstone with
  full Stamina.

  12–16: The creature is reduced to 0 Stamina and the lich manifests adjacent to the soulstone with
  300 Stamina.

  17+: The creature has their Stamina reduced to their winded value unless it is already lower, and
  the lich manifests adjacent to the soulstone with 100 Stamina.
abilities.lich.lich.cages-of-wasting.name: Cages of Wasting
abilities.lich.lich.cages-of-wasting.texts.target: Each creature in the area
abilities.lich.lich.cages-of-wasting.texts.distance: Two 3 cubes within 10
abilities.lich.lich.cages-of-wasting.texts.roll: Agility test
abilities.lich.lich.cages-of-wasting.texts.tier1: 10 corruption damage; restrained (save ends)
abilities.lich.lich.cages-of-wasting.texts.tier2: 16 corruption damage; restrained (EoT)
abilities.lich.lich.cages-of-wasting.texts.tier3: 20 corruption damage
abilities.lich.lich.cages-of-wasting.texts.effect: |-
  Effect: Each target makes an Agility test.

  Effect: The lich deals an additional 10 corruption damage to each creature restrained this way.
abilities.lich.lich.my-power-alone.name: My Power Alone
abilities.lich.lich.my-power-alone.texts.target: Each enemy in the area
abilities.lich.lich.my-power-alone.texts.distance: 12 burst
abilities.lich.lich.my-power-alone.texts.effect: "Effect: A target can't use heroic abilities until the start of the lich's next turn."
abilities.lich.lich.arms-of-necrosis.name: Arms of Necrosis
abilities.lich.lich.arms-of-necrosis.texts.target: Each creature in the area
abilities.lich.lich.arms-of-necrosis.texts.distance: 6 burst
abilities.lich.lich.arms-of-necrosis.texts.roll: Power Roll + 5
abilities.lich.lich.arms-of-necrosis.texts.tier1: 8 corruption damage; A < 4 frightened (save ends)
abilities.lich.lich.arms-of-necrosis.texts.tier2: 13 corruption damage; A < 5 frightened (save ends)
abilities.lich.lich.arms-of-necrosis.texts.tier3: 16 corruption damage; A < 6 frightened (save ends)
abilities.lich.lich.arms-of-necrosis.texts.effect: "Effect: At the end of each of the lich's turns,
  they regain 10 Stamina for each creature frightened this way."
monsters.lich.lich.name: Lich
effects.lich.immolated.name: Immolated
effects.lich.immolated.description: An immolated creature takes 10 fire damage whenever they use a
  main action and a maneuver on their turn. This damage can't be reduced in any way.
effects.lich.hopeless.name: Hopeless
effects.lich.hopeless.description: A hopeless creature can't benefit from edges or double edges,
  can't gain or use surges, and can't gain temporary Stamina.
effects.lich.wracked-with-pain.name: Wracked with pain
effects.lich.wracked-with-pain.description: A creature wracked with pain has a double bane on abilities.
