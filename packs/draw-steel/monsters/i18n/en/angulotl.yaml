malice.angulotl.leapfrog.name: Leapfrog
malice.angulotl.leapfrog.description: Until the end of the round, when an angulotl moves through an
  inactive angulotl's space, the inactive angulotl can use a free triggered action to jump 3
  squares.
malice.angulotl.resonating-croak.name: Resonating Croak
malice.angulotl.resonating-croak.description: Each angulotl in the encounter puffs out their throat
  and starts loudly droning. Any non-angulotl adjacent to an angulotl makes an Intuition test.
malice.angulotl.resonating-croak.texts.tier1: 5 sonic damage; slowed (EoT)
malice.angulotl.resonating-croak.texts.tier2: 4 sonic damage
malice.angulotl.resonating-croak.texts.tier3: No effect.
malice.angulotl.rainfall.name: Rainfall
malice.angulotl.rainfall.description: An angulotl calls clouds to cover the encounter map and
  unleash rain until the end of the round. Any creature or object that is exposed to the sky is wet
  until the end of the encounter.
monsters.angulotl.angulotl-cleaver.texts.withCaptain: +1 damage bonus to strikes
abilities.angulotl.angulotl-cleaver.hop-and-chop.name: Hop and Chop
abilities.angulotl.angulotl-cleaver.hop-and-chop.texts.target: One creature or object per minion
abilities.angulotl.angulotl-cleaver.hop-and-chop.texts.distance: Melee 1
abilities.angulotl.angulotl-cleaver.hop-and-chop.texts.roll: Power Roll + 2
abilities.angulotl.angulotl-cleaver.hop-and-chop.texts.tier1: 2 damage
abilities.angulotl.angulotl-cleaver.hop-and-chop.texts.tier2: 4 damage
abilities.angulotl.angulotl-cleaver.hop-and-chop.texts.tier3: 5 damage
abilities.angulotl.angulotl-cleaver.hop-and-chop.texts.effect: 'Effect: The cleaver jumps up to 4 squares before or after making this strike.'
traits.angulotl.angulotl-cleaver.toxiferous.name: Toxiferous
traits.angulotl.angulotl-cleaver.toxiferous.description: Whenever an adjacent enemy grabs the
  cleaver or uses a melee ability against them, that enemy takes 1 poison damage.
monsters.angulotl.angulotl-cleaver.name: Angulotl Cleaver
monsters.angulotl.angulotl-dart.texts.withCaptain: +4 bonus to ranged distance
abilities.angulotl.angulotl-dart.poison-dart.name: Poison Dart
abilities.angulotl.angulotl-dart.poison-dart.texts.target: One creature per minion
abilities.angulotl.angulotl-dart.poison-dart.texts.distance: Ranged 8
abilities.angulotl.angulotl-dart.poison-dart.texts.roll: Power Roll + 2
abilities.angulotl.angulotl-dart.poison-dart.texts.tier1: 2 poison damage
abilities.angulotl.angulotl-dart.poison-dart.texts.tier2: 4 poison damage
abilities.angulotl.angulotl-dart.poison-dart.texts.tier3: 5 poison damage
abilities.angulotl.angulotl-dart.poison-dart.texts.effect: 'Effect: The dart gains an edge on this ability against any target who has less than full Stamina.'
traits.angulotl.angulotl-dart.toxiferous.name: Toxiferous
traits.angulotl.angulotl-dart.toxiferous.description: Whenever an adjacent enemy grabs the dart or
  uses a melee ability against them, that enemy takes 1 poison damage.
monsters.angulotl.angulotl-dart.name: Angulotl Dart
abilities.angulotl.angulotl-daybringer.acid-grasp.name: Acid Grasp
abilities.angulotl.angulotl-daybringer.acid-grasp.texts.target: Two creatures or objects
abilities.angulotl.angulotl-daybringer.acid-grasp.texts.distance: Melee 1
abilities.angulotl.angulotl-daybringer.acid-grasp.texts.roll: Power Roll + 3
abilities.angulotl.angulotl-daybringer.acid-grasp.texts.tier1: 7 acid damage; A < 1 dazed (save ends)
abilities.angulotl.angulotl-daybringer.acid-grasp.texts.tier2: 10 acid damage; A < 2 dazed (save ends)
abilities.angulotl.angulotl-daybringer.acid-grasp.texts.tier3: 13 acid damage; A < 3 dazed (save ends)
abilities.angulotl.angulotl-daybringer.acid-grasp.texts.effect: >-
  Effect: The next time the target makes a strike against the daybringer, the target takes 4 acid
  damage after the strike is resolved.


  1 Malice: The daybringer jumps up to 3 squares before or after using this ability.
abilities.angulotl.angulotl-daybringer.sun-lamp.name: Sun Lamp
abilities.angulotl.angulotl-daybringer.sun-lamp.texts.target: Self
abilities.angulotl.angulotl-daybringer.sun-lamp.texts.distance: Self
abilities.angulotl.angulotl-daybringer.sun-lamp.texts.effect: 'Effect: The daybringer expands their
  throat to make it resemble the sun until the start of their next turn. During that time, each
  angulotl who starts their turn within 10 squares of the daybringer regains 5 Stamina and gains a
  +3 bonus to speed until the end of their turn.'
abilities.angulotl.angulotl-daybringer.tongue-slap.name: Tongue Slap
abilities.angulotl.angulotl-daybringer.tongue-slap.texts.trigger: The target makes a strike against the daybringer or an ally that isn't a critical hit.
abilities.angulotl.angulotl-daybringer.tongue-slap.texts.target: One creature
abilities.angulotl.angulotl-daybringer.tongue-slap.texts.distance: Melee 5
abilities.angulotl.angulotl-daybringer.tongue-slap.texts.effect: |-
  Effect: The outcome of the strike's power roll is reduced by one tier.

  2 Malice: The target is pulled up to 4 squares after the strike resolves.
traits.angulotl.angulotl-daybringer.moisturizing-end-effect.name: Moisturizing End Effect
traits.angulotl.angulotl-daybringer.moisturizing-end-effect.description: At the end of each of the
  daybringer's turns, they can either take 5 damage or end the wet effect on an adjacent creature in
  order to end one effect on them that can be ended by a saving throw. This damage can't be reduced
  in any way.
abilities.angulotl.angulotl-daybringer.new-dawn.name: New Dawn
abilities.angulotl.angulotl-daybringer.new-dawn.texts.target: Special
abilities.angulotl.angulotl-daybringer.new-dawn.texts.distance: Ranged 10
abilities.angulotl.angulotl-daybringer.new-dawn.texts.effect: "Effect: Four angulotl pollywogs erupt
  from the daybringer's back and waddle into unoccupied spaces within distance."
abilities.angulotl.angulotl-daybringer.plague-of-frogs.name: Plague of Frogs
abilities.angulotl.angulotl-daybringer.plague-of-frogs.texts.target: Self and each ally in the area
abilities.angulotl.angulotl-daybringer.plague-of-frogs.texts.distance: 8 burst
abilities.angulotl.angulotl-daybringer.plague-of-frogs.texts.effect: 'Effect: Each target can jump
  up to 4 squares. Each non-minion target can make a free strike at the end of the jump.'
abilities.angulotl.angulotl-daybringer.it-is-day.name: It Is Day
abilities.angulotl.angulotl-daybringer.it-is-day.texts.target: Special
abilities.angulotl.angulotl-daybringer.it-is-day.texts.distance: Special
abilities.angulotl.angulotl-daybringer.it-is-day.texts.effect: "Effect: The encounter map dries up
  and each enemy and object on it is illuminated until the end of the encounter. An illuminated
  creature or object can't hide or become invisible, and any strike made against an illuminated
  target gains an edge. Additionally, each enemy in the encounter who is wet has that effect end and
  takes 6 acid damage. Each angulotl in the encounter has a double edge on their next strike."
traits.angulotl.angulotl-daybringer.toxiferous.name: Toxiferous
traits.angulotl.angulotl-daybringer.toxiferous.description: Whenever an adjacent enemy grabs the
  daybringer or uses a melee ability against them, that enemy takes 3 poison damage.
monsters.angulotl.angulotl-daybringer.name: Angulotl Daybringer
abilities.angulotl.angulotl-needler.blowgun.name: Blowgun
abilities.angulotl.angulotl-needler.blowgun.texts.target: One creature
abilities.angulotl.angulotl-needler.blowgun.texts.distance: Ranged 15
abilities.angulotl.angulotl-needler.blowgun.texts.roll: Power Roll + 2
abilities.angulotl.angulotl-needler.blowgun.texts.tier1: 4 poison damage
abilities.angulotl.angulotl-needler.blowgun.texts.tier2: 6 poison damage
abilities.angulotl.angulotl-needler.blowgun.texts.tier3: 7 poison damage
abilities.angulotl.angulotl-needler.blowgun.texts.effect: '2 Malice: A target who has M < 2 is
  weakened (save ends). A target weakened this way takes 2 poison damage at the start of each of
  their turns.'
traits.angulotl.angulotl-needler.toxiferous.name: Toxiferous
traits.angulotl.angulotl-needler.toxiferous.description: Whenever an adjacent enemy grabs the
  needler or uses a melee ability against them, that enemy takes 2 poison damage.
monsters.angulotl.angulotl-needler.name: Angulotl Needler
monsters.angulotl.angulotl-pollywog.texts.withCaptain: +2 bonus to speed
abilities.angulotl.angulotl-pollywog.nip.name: Nip
abilities.angulotl.angulotl-pollywog.nip.texts.target: One creature per minion
abilities.angulotl.angulotl-pollywog.nip.texts.distance: Melee 1
abilities.angulotl.angulotl-pollywog.nip.texts.roll: Power Roll + 2
abilities.angulotl.angulotl-pollywog.nip.texts.tier1: 1 poison damage
abilities.angulotl.angulotl-pollywog.nip.texts.tier2: 2 poison damage; the pollywog can shift 1 square
abilities.angulotl.angulotl-pollywog.nip.texts.tier3: 3 poison damage; the pollywog shifts up to 3 squares
traits.angulotl.angulotl-pollywog.quick-snack.name: Quick Snack
traits.angulotl.angulotl-pollywog.quick-snack.description: Any angulotl who can target the pollywog
  with a melee free strike can eat them as a maneuver. The angulotl regains 4 Stamina and is wet
  until the end of their next turn.
monsters.angulotl.angulotl-pollywog.name: Angulotl Pollywog
abilities.angulotl.angulotl-slink.tonguelash.name: Tonguelash
abilities.angulotl.angulotl-slink.tonguelash.texts.target: One creature or object
abilities.angulotl.angulotl-slink.tonguelash.texts.distance: Melee 6
abilities.angulotl.angulotl-slink.tonguelash.texts.roll: Power Roll + 2
abilities.angulotl.angulotl-slink.tonguelash.texts.tier1: 4 damage; pull 2
abilities.angulotl.angulotl-slink.tonguelash.texts.tier2: 6 damage; pull 4
abilities.angulotl.angulotl-slink.tonguelash.texts.tier3: 7 damage; pull 6
abilities.angulotl.angulotl-slink.tonguelash.texts.effect: 'Effect: The target is wet (save ends).
  Any ally targeted by this ability ignores the damage, is wet until the end of the encounter, and
  is pulled up to 6 squares, ignoring stability.'
abilities.angulotl.angulotl-slink.hop-to-it.name: Hop To It
abilities.angulotl.angulotl-slink.hop-to-it.texts.target: Self
abilities.angulotl.angulotl-slink.hop-to-it.texts.distance: Self
abilities.angulotl.angulotl-slink.hop-to-it.texts.effect: 'Effect: The slink jumps up to 3 squares.
  If they have cover or concealment when they land, they can attempt to hide.'
traits.angulotl.angulotl-slink.adhesive.name: Adhesive
traits.angulotl.angulotl-slink.adhesive.description: The slink excretes a sticky residue into their
  square at the end of each of their turns. Any non-angulotl who enters or leaves the square is
  stuck, and must use a maneuver to break free or be restrained until the end of their turn. Objects
  are likewise affected, and a creature must use a maneuver to remove an object from the square.
traits.angulotl.angulotl-slink.toxiferous.name: Toxiferous
traits.angulotl.angulotl-slink.toxiferous.description: Whenever an adjacent enemy grabs the slink or
  uses a melee ability against them, that enemy takes 2 poison damage.
monsters.angulotl.angulotl-slink.name: Angulotl Slink
abilities.angulotl.angulotl-wave.refulgent-beams.name: Refulgent Beams
abilities.angulotl.angulotl-wave.refulgent-beams.texts.target: Two creatures or objects
abilities.angulotl.angulotl-wave.refulgent-beams.texts.distance: Ranged 8
abilities.angulotl.angulotl-wave.refulgent-beams.texts.roll: Power Roll + 2
abilities.angulotl.angulotl-wave.refulgent-beams.texts.tier1: 3 holy damage
abilities.angulotl.angulotl-wave.refulgent-beams.texts.tier2: 4 holy damage; R < 1 the target is illuminated (save ends)
abilities.angulotl.angulotl-wave.refulgent-beams.texts.tier3: 5 holy damage; R < 2 the target is illuminated (save ends)
abilities.angulotl.angulotl-wave.refulgent-beams.texts.effect: "Effect: An illuminated creature or
  object can't hide or become invisible, and any strike made against an illuminated target gains an
  edge."
abilities.angulotl.angulotl-wave.noxious-bubble.name: Noxious Bubble
abilities.angulotl.angulotl-wave.noxious-bubble.texts.target: Special
abilities.angulotl.angulotl-wave.noxious-bubble.texts.distance: 2 cube of unoccupied space within 10
abilities.angulotl.angulotl-wave.noxious-bubble.texts.roll: Might test
abilities.angulotl.angulotl-wave.noxious-bubble.texts.tier1: 3 poison damage; the target is wet and weakened (save ends)
abilities.angulotl.angulotl-wave.noxious-bubble.texts.tier2: 2 poison damage; the target is wet (save ends)
abilities.angulotl.angulotl-wave.noxious-bubble.texts.tier3: 1 poison damage; the target is wet (EoT)
abilities.angulotl.angulotl-wave.noxious-bubble.texts.effect: 'Effect: A bubble of toxic gas fills
  the area, ready to pop. If any creature or object touches the bubble or if the bubble takes
  damage, it bursts. Each angulotl adjacent to the bubble is wet until the end of the encounter, and
  each enemy adjacent to the bubble makes a Might test.'
traits.angulotl.angulotl-wave.toxiferous.name: Toxiferous
traits.angulotl.angulotl-wave.toxiferous.description: Whenever an adjacent enemy grabs the wave or
  uses a melee ability against them, that enemy takes 2 poison damage.
monsters.angulotl.angulotl-wave.name: Angulotl Wave
monsters.angulotl.clawfish.texts.withCaptain: Gain an edge on strikes
abilities.angulotl.clawfish.hookclaw.name: Hookclaw
abilities.angulotl.clawfish.hookclaw.texts.target: One creature or object per minion
abilities.angulotl.clawfish.hookclaw.texts.distance: Melee 1
abilities.angulotl.clawfish.hookclaw.texts.roll: Power Roll + 2
abilities.angulotl.clawfish.hookclaw.texts.tier1: 2 damage
abilities.angulotl.clawfish.hookclaw.texts.tier2: 4 damage
abilities.angulotl.clawfish.hookclaw.texts.tier3: 5 damage; grabbed
abilities.angulotl.clawfish.hookclaw.texts.effect: 'Effect: Any target grabbed this way takes 2 lightning damage at the start of each of their turns.'
traits.angulotl.clawfish.shocking.name: Shocking
traits.angulotl.clawfish.shocking.description: At the start of each of their turns, the clawfish
  deals 2 lightning damage to each wet enemy within 2 squares.
monsters.angulotl.clawfish.name: Clawfish
effects.angulotl.wet.name: Wet
effects.angulotl.wet.description: While wet, an angulotl doesn't provoke opportunity attacks by
  moving. At the same time, any non-angulotl who is wet and ends their turn with none of their
  movement remaining slips and falls prone.
effects.angulotl.illuminated.name: Illuminated
effects.angulotl.illuminated.description: An illuminated creature or object can't hide or become
  invisible, and any strike made against an illuminated target gains an edge.
effects.angulotl.shocked.name: Hookclaw
effects.angulotl.shocked.description: The target grabbed by the clawfish takes 2 lightning damage at
  the start of each of their turns.
effects.angulotl.envenomed.name: Blowgun venom
effects.angulotl.envenomed.description: A target weakened by the needler's blowgun takes 2 poison
  damage at the start of each of their turns.
effects.angulotl.acid-grasp.name: Acid Grasp
effects.angulotl.acid-grasp.description: The next time the target makes a strike against the
  daybringer, the target takes 4 acid damage after the strike is resolved.
