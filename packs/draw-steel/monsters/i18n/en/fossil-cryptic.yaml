malice.fossil-cryptic.floor-mosaic.name: Floor Mosaic
malice.fossil-cryptic.floor-mosaic.description: The fossil cryptic slides one creature on the ground
  up to 5 squares. If the creature is prone, this forced movement ignores stability.
malice.fossil-cryptic.solo-action.name: Solo Action
malice.fossil-cryptic.solo-action.description: The fossil cryptic takes an additional main action on
  their turn. They can use this feature even if they are dazed.
malice.fossil-cryptic.stone-pillars.name: Stone Pillars
malice.fossil-cryptic.stone-pillars.description: Two pillars of stone 1 square wide either thrust up
  out of the ground or jut down from the ceiling anywhere on the encounter map, to a height of up to
  5 squares. A creature in the area of a pillar before it appears is knocked prone on its surface.
  If the creature comes into contact with the ceiling above or the floor beneath the pillar and has
  M < 2 they are restrained (save ends).
malice.fossil-cryptic.choking-dust.name: Choking Dust
malice.fossil-cryptic.choking-dust.description: The air across the encounter map is thick with dust
  until the end of the encounter. Each enemy in the dust is suffocating. Additionally, at the end of
  each round, each enemy in the dust makes a Might test.
malice.fossil-cryptic.choking-dust.texts.tier1: Until the end of the enemy's next turn, their
  stability is reduced to 0, and any forced movement effects targeting them gain a +2 bonus to the
  distance moved.
malice.fossil-cryptic.choking-dust.texts.tier2: The enemy's stability is halved (EoT).
malice.fossil-cryptic.choking-dust.texts.tier3: No effect.
traits.fossil-cryptic.fossil-cryptic.solo-monster.name: Solo Monster
traits.fossil-cryptic.fossil-cryptic.solo-monster.description: >-
  End Effect: At the end of each of their turns, the cryptic can take 5 damage to end one effect on
  them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The cryptic can take two turns each round. They can't take turns consecutively.
traits.fossil-cryptic.fossil-cryptic.churning-trunk.name: Churning Trunk
traits.fossil-cryptic.fossil-cryptic.churning-trunk.description: The cryptic is constantly
  surrounded by a 1 aura of swirling debris that obscures their form. Ranged abilities that target
  the cryptic take a bane. Additionally, any enemy who enters the aura for the first time in a round
  or starts their turn there takes 5 damage.
traits.fossil-cryptic.fossil-cryptic.seismic-step.name: Seismic Step
traits.fossil-cryptic.fossil-cryptic.seismic-step.description: The cryptic ignores difficult
  terrain. Additionally, they have line of effect to any creature with concealment if that creature
  is touching the ground.
abilities.fossil-cryptic.fossil-cryptic.sand-slam.name: Sand Slam
abilities.fossil-cryptic.fossil-cryptic.sand-slam.texts.target: Two creatures or objects
abilities.fossil-cryptic.fossil-cryptic.sand-slam.texts.distance: Melee 2
abilities.fossil-cryptic.fossil-cryptic.sand-slam.texts.roll: Power Roll + 3
abilities.fossil-cryptic.fossil-cryptic.sand-slam.texts.tier1: 8 damage; A < 1 slide 2
abilities.fossil-cryptic.fossil-cryptic.sand-slam.texts.tier2: 12 damage; A < 2 slide 2, prone
abilities.fossil-cryptic.fossil-cryptic.sand-slam.texts.tier3: 15 damage; A < 3 slide 3, prone and can't stand (EoT)
abilities.fossil-cryptic.fossil-cryptic.sand-slam.texts.effect: 'Effect: If a target made prone this way is already prone, they are instead restrained (EoT).'
abilities.fossil-cryptic.fossil-cryptic.stone-bone-storm.name: Stone Bone Storm
abilities.fossil-cryptic.fossil-cryptic.stone-bone-storm.texts.target: Each enemy in the area
abilities.fossil-cryptic.fossil-cryptic.stone-bone-storm.texts.distance: 6 × 1 line within 1
abilities.fossil-cryptic.fossil-cryptic.stone-bone-storm.texts.roll: Power Roll + 3
abilities.fossil-cryptic.fossil-cryptic.stone-bone-storm.texts.tier1: 4 damage; M < 1 push 2
abilities.fossil-cryptic.fossil-cryptic.stone-bone-storm.texts.tier2: 7 damage; M < 2 prone
abilities.fossil-cryptic.fossil-cryptic.stone-bone-storm.texts.tier3: 10 damage; M < 3 prone
abilities.fossil-cryptic.fossil-cryptic.stone-bone-storm.texts.effect: 'Effect: The cryptic reforms their body and appears in an unoccupied space in the area.'
abilities.fossil-cryptic.fossil-cryptic.stoneshift.name: Stoneshift
abilities.fossil-cryptic.fossil-cryptic.stoneshift.texts.target: One creature or object on the ground
abilities.fossil-cryptic.fossil-cryptic.stoneshift.texts.distance: Ranged 5
abilities.fossil-cryptic.fossil-cryptic.stoneshift.texts.effect: |-
  Effect: The cryptic slides the target up to 3 squares.

  2 Malice: The ability targets one additional target.
abilities.fossil-cryptic.fossil-cryptic.dissipate.name: Dissipate
abilities.fossil-cryptic.fossil-cryptic.dissipate.texts.trigger: The cryptic takes damage.
abilities.fossil-cryptic.fossil-cryptic.dissipate.texts.target: Self
abilities.fossil-cryptic.fossil-cryptic.dissipate.texts.distance: Self
abilities.fossil-cryptic.fossil-cryptic.dissipate.texts.effect: 'Effect: The cryptic halves the
  damage, ignores any nondamaging effects associated with it, and shifts up to 3 squares.'
abilities.fossil-cryptic.fossil-cryptic.shatterstone.name: Shatterstone
abilities.fossil-cryptic.fossil-cryptic.shatterstone.texts.trigger: The cryptic uses the Dig maneuver to resurface.
abilities.fossil-cryptic.fossil-cryptic.shatterstone.texts.target: Each enemy in the area
abilities.fossil-cryptic.fossil-cryptic.shatterstone.texts.distance: 2 burst
abilities.fossil-cryptic.fossil-cryptic.shatterstone.texts.roll: Power Roll + 3
abilities.fossil-cryptic.fossil-cryptic.shatterstone.texts.tier1: 4 damage; push 2
abilities.fossil-cryptic.fossil-cryptic.shatterstone.texts.tier2: 7 damage; push 3, prone
abilities.fossil-cryptic.fossil-cryptic.shatterstone.texts.tier3: 10 damage; push 4, prone
abilities.fossil-cryptic.fossil-cryptic.shatterstone.texts.effect: 'Effect: Before using the Dig
  maneuver, the cryptic moves up to their speed. They then create the burst when they breach the
  surface.'
abilities.fossil-cryptic.fossil-cryptic.first-warning-quake.name: First Warning Quake
abilities.fossil-cryptic.fossil-cryptic.first-warning-quake.texts.target: 'Each enemy in the area'
abilities.fossil-cryptic.fossil-cryptic.first-warning-quake.texts.distance: 10 burst
abilities.fossil-cryptic.fossil-cryptic.first-warning-quake.texts.roll: Might test
abilities.fossil-cryptic.fossil-cryptic.first-warning-quake.texts.tier1: Prone and can't stand (EoT)
abilities.fossil-cryptic.fossil-cryptic.first-warning-quake.texts.tier2: Prone
abilities.fossil-cryptic.fossil-cryptic.first-warning-quake.texts.tier3: No effect.
abilities.fossil-cryptic.fossil-cryptic.first-warning-quake.texts.effect: |-
  Special: A target must be on the ground.

  Effect: Each target makes a Might test.
abilities.fossil-cryptic.fossil-cryptic.final-warning-fissure.name: Final Warning Fissure
abilities.fossil-cryptic.fossil-cryptic.final-warning-fissure.texts.target: Each enemy in the area
abilities.fossil-cryptic.fossil-cryptic.final-warning-fissure.texts.distance: 5 burst
abilities.fossil-cryptic.fossil-cryptic.final-warning-fissure.texts.roll: Agility test
abilities.fossil-cryptic.fossil-cryptic.final-warning-fissure.texts.tier1: 9 damage; prone
abilities.fossil-cryptic.fossil-cryptic.final-warning-fissure.texts.tier2: 5 damage
abilities.fossil-cryptic.fossil-cryptic.final-warning-fissure.texts.tier3: The target moves to the nearest unoccupied space outside the area.
abilities.fossil-cryptic.fossil-cryptic.final-warning-fissure.texts.effect: >-
  Special: A target must be on the ground.


  Effect: The area drops 2 squares and is difficult terrain. Each target enemy falls, while each
  target ally drops safely. Additionally, each target enemy makes an Agility test.
abilities.fossil-cryptic.fossil-cryptic.no-escape.name: No Escape
abilities.fossil-cryptic.fossil-cryptic.no-escape.texts.target: Two creatures or objects
abilities.fossil-cryptic.fossil-cryptic.no-escape.texts.distance: Ranged 10
abilities.fossil-cryptic.fossil-cryptic.no-escape.texts.roll: Power Roll + 3
abilities.fossil-cryptic.fossil-cryptic.no-escape.texts.tier1: 5 damage; prone; M < 1 restrained (save ends)
abilities.fossil-cryptic.fossil-cryptic.no-escape.texts.tier2: 9 damage; prone; M < 2 restrained (save ends)
abilities.fossil-cryptic.fossil-cryptic.no-escape.texts.tier3: 12 damage; prone; M < 3 restrained (save ends)
abilities.fossil-cryptic.fossil-cryptic.no-escape.texts.effect: >-
  Effect: The cryptic makes an initial power roll that calls down stone pillars from the ceiling.


  The cryptic then makes a second power roll that raises stone pillars from the floor. Ranged 10;
  two creatures or objects on the ground.

  ≤11: 2 damage; vertical slide 2

  12–16: 3 damage; vertical slide 4

  17+: 4 damage; vertical slide 6; if this movement brings the target into contact with the ceiling,
  they are restrained (save ends).
monsters.fossil-cryptic.fossil-cryptic.name: Fossil Cryptic
