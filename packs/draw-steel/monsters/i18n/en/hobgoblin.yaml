abilities.hobgoblin.hobgoblin-death-captain.blightblade.texts.distance: Melee 1
abilities.hobgoblin.hobgoblin-death-captain.blightblade.texts.roll: Power Roll + 3
abilities.hobgoblin.hobgoblin-death-captain.blightblade.texts.tier1: 8 damage
abilities.hobgoblin.hobgoblin-death-captain.blightblade.texts.tier2: 8 damage, 4 corruption damage
abilities.hobgoblin.hobgoblin-death-captain.blightblade.texts.tier3: 8 damage, 7 corruption damage
abilities.hobgoblin.hobgoblin-death-captain.blightblade.texts.effect: |-
  Effect: The next strike made against the target has a double edge.

  3 Malice: One ally adjacent to the target can use their signature ability.
