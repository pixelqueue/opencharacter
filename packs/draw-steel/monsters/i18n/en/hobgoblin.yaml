abilities.hobgoblin.hobgoblin-brandbearer.searing-grasp.texts.tier1: 2 fire damage
abilities.hobgoblin.hobgoblin-brandbearer.searing-grasp.texts.tier2: 4 fire damage; M < 2 fire weakness 5 (save ends)
abilities.hobgoblin.hobgoblin-brandbearer.searing-grasp.texts.tier3: 6 fire damage; M < 3 fire weakness 5 (save ends)
traits.hobgoblin.hobgoblin-brandbearer.open-furnace.name: Open Furnace
traits.hobgoblin.hobgoblin-brandbearer.open-furnace.description: Whenever an enemy takes fire
  damage, they take 1 extra fire damage for each brandbearer adjacent to them.
traits.hobgoblin.hobgoblin-brandbearer.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-brandbearer.infernal-ichor.description: When the brandbearer is reduced
  to 0 Stamina, they spray burning blood. Each creature adjacent to the brandbearer takes 2 fire
  damage.
monsters.hobgoblin.hobgoblin-brandbearer.name: Hobgoblin Brandbearer
abilities.hobgoblin.hobgoblin-burning-witch.soul-burn.name: Soul Burn
abilities.hobgoblin.hobgoblin-burning-witch.soul-burn.texts.target: Two creatures or objects
abilities.hobgoblin.hobgoblin-burning-witch.soul-burn.texts.distance: Ranged 10
abilities.hobgoblin.hobgoblin-burning-witch.soul-burn.texts.roll: Power Roll + 3
abilities.hobgoblin.hobgoblin-burning-witch.soul-burn.texts.tier1: 4 corruption or fire damage
abilities.hobgoblin.hobgoblin-burning-witch.soul-burn.texts.tier2: 6 corruption or fire damage
abilities.hobgoblin.hobgoblin-burning-witch.soul-burn.texts.tier3: 8 corruption or fire damage
abilities.hobgoblin.hobgoblin-burning-witch.soul-burn.texts.effect: '2 Malice: Each target who has P
  < 2 is weakened (save ends). Any enemy who starts their turn within 3 squares of a target weakened
  this way and who has P < 2 is weakened (save ends).'
abilities.hobgoblin.hobgoblin-burning-witch.burning-legion.name: Burning Legion
abilities.hobgoblin.hobgoblin-burning-witch.burning-legion.texts.target: Three creatures
abilities.hobgoblin.hobgoblin-burning-witch.burning-legion.texts.distance: Ranged 10
abilities.hobgoblin.hobgoblin-burning-witch.burning-legion.texts.effect: 'Effect: Each target can
  teleport up to 5 squares. Each creature adjacent to a target at their destination takes 3 fire
