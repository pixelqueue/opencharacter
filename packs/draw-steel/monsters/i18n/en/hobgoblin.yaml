traits.hobgoblin.hobgoblin-burning-witch.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-burning-witch.infernal-ichor.description: When the burning witch is
  reduced to 0 Stamina, they spray burning blood. Each creature adjacent to the burning witch takes
  3 fire damage.
monsters.hobgoblin.hobgoblin-burning-witch.name: Hobgoblin Burning Witch
