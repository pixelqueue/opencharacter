traits.hobgoblin.hobgoblin-death-captain.battle-ready.description: Any hidden creature who makes a
  strike against the death captain or any ally within 2 squares of the death captain takes a bane on
  the strike.
traits.hobgoblin.hobgoblin-death-captain.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-death-captain.infernal-ichor.description: When the death captain is
  reduced to 0 Stamina, they spray burning blood. Each creature adjacent to the death captain takes
  3 fire damage.
monsters.hobgoblin.hobgoblin-death-captain.name: Hobgoblin Death Captain
