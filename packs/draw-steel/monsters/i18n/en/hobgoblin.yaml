malice.hobgoblin.goblin-malice-features.name: Goblin Malice Features
malice.hobgoblin.goblin-malice-features.description: The hobgoblin activates a Malice Feature available to goblins.
malice.hobgoblin.operation-goblin-mode.name: Operation Goblin Mode
malice.hobgoblin.operation-goblin-mode.description: Each goblin in the encounter gains a +3 bonus to speed until the end of the round.
malice.hobgoblin.operation-tactical-swarm.name: Operation Tactical Swarm
malice.hobgoblin.operation-tactical-swarm.description: Each hobgoblin in the encounter shifts up to their speed and can take the Defend main action.
malice.hobgoblin.operation-earth-sear.name: Operation Earth Sear
malice.hobgoblin.operation-earth-sear.description: Until the end of the round, the ground throughout
  the encounter map becomes blazing hot. Any enemy takes 1 fire damage for each square of the ground
  they enter. Any enemy who ends their turn on the ground has fire weakness 2 until the start of
  their next turn.
monsters.hobgoblin.grilp.texts.withCaptain: +2 bonus to speed
abilities.hobgoblin.grilp.flyby-bite.name: Flyby Bite
abilities.hobgoblin.grilp.flyby-bite.texts.target: One creature or object per minion
abilities.hobgoblin.grilp.flyby-bite.texts.distance: Melee 1
abilities.hobgoblin.grilp.flyby-bite.texts.roll: Power Roll + 3
abilities.hobgoblin.grilp.flyby-bite.texts.tier1: 3 damage
abilities.hobgoblin.grilp.flyby-bite.texts.tier2: 5 damage
abilities.hobgoblin.grilp.flyby-bite.texts.tier3: 7 damage; the grilp shifts up to 2 squares
abilities.hobgoblin.grilp.flyby-bite.texts.effect: 'Effect: The grilp moves up to their speed and can attempt to hide.'
traits.hobgoblin.grilp.bat-out-of-hell.name: Bat Out Of Hell
traits.hobgoblin.grilp.bat-out-of-hell.description: Any enemy who makes a saving throw takes a −1
  penalty to the saving throw for each grilp adjacent to them.
traits.hobgoblin.grilp.shifting-camouflage.name: Shifting Camouflage
traits.hobgoblin.grilp.shifting-camouflage.description: The grilp has concealment from all creatures.
monsters.hobgoblin.grilp.name: Grilp
abilities.hobgoblin.hobgoblin-bloodlord.soul-sword.name: Soul Sword
abilities.hobgoblin.hobgoblin-bloodlord.soul-sword.texts.target: Two creatures or objects
abilities.hobgoblin.hobgoblin-bloodlord.soul-sword.texts.distance: Melee 1
abilities.hobgoblin.hobgoblin-bloodlord.soul-sword.texts.roll: Power Roll + 4
abilities.hobgoblin.hobgoblin-bloodlord.soul-sword.texts.tier1: 11 corruption damage; P < 2 bleeding (save ends)
abilities.hobgoblin.hobgoblin-bloodlord.soul-sword.texts.tier2: 16 corruption damage; P < 3 bleeding (save ends)
abilities.hobgoblin.hobgoblin-bloodlord.soul-sword.texts.tier3: 19 corruption damage; P < 4 bleeding (save ends)
abilities.hobgoblin.hobgoblin-bloodlord.soul-sword.texts.effect: "2 Malice: Each target is marked
  until the end of the encounter or until they die. The bloodlord's allies gain an edge on strikes
  against any target marked this way. The bloodlord can have up to three targets marked this way. If
  they mark a new target who would exceed the limit, the oldest mark ends."
abilities.hobgoblin.hobgoblin-bloodlord.take-point.name: Take Point!
abilities.hobgoblin.hobgoblin-bloodlord.take-point.texts.target: One ally
abilities.hobgoblin.hobgoblin-bloodlord.take-point.texts.distance: Ranged 10
abilities.hobgoblin.hobgoblin-bloodlord.take-point.texts.effect: 'Effect: The target moves up to their speed and can use a signature ability.'
abilities.hobgoblin.hobgoblin-bloodlord.an-army-from-blood.name: An Army From Blood
abilities.hobgoblin.hobgoblin-bloodlord.an-army-from-blood.texts.trigger: A non-minion hobgoblin within distance takes damage.
abilities.hobgoblin.hobgoblin-bloodlord.an-army-from-blood.texts.target: The triggering creature
abilities.hobgoblin.hobgoblin-bloodlord.an-army-from-blood.texts.distance: Ranged 10
abilities.hobgoblin.hobgoblin-bloodlord.an-army-from-blood.texts.effect: "Effect: Three hobgoblin
  recruits manifest from the target's blood into unoccupied spaces adjacent to the target."
traits.hobgoblin.hobgoblin-bloodlord.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-bloodlord.infernal-ichor.description: When the bloodlord is reduced to 0
  Stamina, they spray burning blood. Each creature adjacent to the bloodlord takes 3 fire damage.
traits.hobgoblin.hobgoblin-bloodlord.end-effect.name: End Effect
traits.hobgoblin.hobgoblin-bloodlord.end-effect.description: At the end of each of their turns, the
  bloodlord can take 10 damage to end one effect on them that can be ended by a saving throw. This
  damage can't be reduced in any way.
abilities.hobgoblin.hobgoblin-bloodlord.advance.name: Advance!
abilities.hobgoblin.hobgoblin-bloodlord.advance.texts.target: Self and each ally in the area
abilities.hobgoblin.hobgoblin-bloodlord.advance.texts.distance: 10 burst
abilities.hobgoblin.hobgoblin-bloodlord.advance.texts.effect: 'Effect: Each target gains 10
  temporary Stamina and can move up to their speed. Then each non-minion target can make a free
  strike.'
abilities.hobgoblin.hobgoblin-bloodlord.skulls-abound.name: Skulls Abound
abilities.hobgoblin.hobgoblin-bloodlord.skulls-abound.texts.target: Self
abilities.hobgoblin.hobgoblin-bloodlord.skulls-abound.texts.distance: 3 aura
abilities.hobgoblin.hobgoblin-bloodlord.skulls-abound.texts.effect: 'Effect: Until the end of the
  encounter, the bloodlord surrounds themself with a storm of flying skulls. Any enemy who enters
  the area for the first time in a round or starts their turn there takes 8 corruption damage and
  takes a bane on their next power roll until the start of their next turn.'
abilities.hobgoblin.hobgoblin-bloodlord.i-am-fire-i-am-death.name: I Am Fire! I Am Death!
abilities.hobgoblin.hobgoblin-bloodlord.i-am-fire-i-am-death.texts.target: Each enemy in the area
abilities.hobgoblin.hobgoblin-bloodlord.i-am-fire-i-am-death.texts.distance: 5 burst
abilities.hobgoblin.hobgoblin-bloodlord.i-am-fire-i-am-death.texts.roll: Power Roll + 4
abilities.hobgoblin.hobgoblin-bloodlord.i-am-fire-i-am-death.texts.tier1: 5 fire damage; P < 2 2 fire damage, push 2, prone
abilities.hobgoblin.hobgoblin-bloodlord.i-am-fire-i-am-death.texts.tier2: 5 fire damage; P < 3 7 fire damage, push 3, prone
abilities.hobgoblin.hobgoblin-bloodlord.i-am-fire-i-am-death.texts.tier3: 5 fire damage; P < 4 10 fire damage, push 5, prone
abilities.hobgoblin.hobgoblin-bloodlord.i-am-fire-i-am-death.texts.effect: 'Effect: Until the end of
  the encounter, the bloodlord is wreathed in black flames. Whenever any adjacent enemy grabs the
  bloodlord or uses a melee ability against them, that enemy takes 5 corruption damage.'
monsters.hobgoblin.hobgoblin-bloodlord.name: Hobgoblin Bloodlord
monsters.hobgoblin.hobgoblin-brandbearer.texts.withCaptain: Gain an edge on strikes
abilities.hobgoblin.hobgoblin-brandbearer.searing-grasp.name: Searing Grasp
