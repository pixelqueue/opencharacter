traits.hobgoblin.hobgoblin-recruit.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-recruit.infernal-ichor.description: When the recruit is reduced to 0
  Stamina, they spray burning blood. Each creature adjacent to the recruit takes 2 fire damage.
monsters.hobgoblin.hobgoblin-recruit.name: Hobgoblin Recruit
abilities.hobgoblin.hobgoblin-redglare.eye-flash.name: Eye Flash
abilities.hobgoblin.hobgoblin-redglare.eye-flash.texts.target: One creature or object
abilities.hobgoblin.hobgoblin-redglare.eye-flash.texts.distance: Ranged 10
abilities.hobgoblin.hobgoblin-redglare.eye-flash.texts.roll: Power Roll + 3
abilities.hobgoblin.hobgoblin-redglare.eye-flash.texts.tier1: 9 corruption damage; P < 1 slowed (save ends)
abilities.hobgoblin.hobgoblin-redglare.eye-flash.texts.tier2: 14 corruption damage; P < 2 restrained (save ends)
abilities.hobgoblin.hobgoblin-redglare.eye-flash.texts.tier3: 17 corruption damage; P < 3 restrained (save ends)
abilities.hobgoblin.hobgoblin-redglare.glare-of-the-old-judgments.name: Glare of the Old Judgments
abilities.hobgoblin.hobgoblin-redglare.glare-of-the-old-judgments.texts.target: One creature
abilities.hobgoblin.hobgoblin-redglare.glare-of-the-old-judgments.texts.distance: Ranged 10
abilities.hobgoblin.hobgoblin-redglare.glare-of-the-old-judgments.texts.roll: Power Roll + 3
abilities.hobgoblin.hobgoblin-redglare.glare-of-the-old-judgments.texts.tier1: 10 corruption damage
abilities.hobgoblin.hobgoblin-redglare.glare-of-the-old-judgments.texts.tier2: 10 corruption damage, or if the target has P < 2 they are judged
abilities.hobgoblin.hobgoblin-redglare.glare-of-the-old-judgments.texts.tier3: The target is judged.
abilities.hobgoblin.hobgoblin-redglare.glare-of-the-old-judgments.texts.effect: 'Effect: Until the
  end of the encounter, a judged target takes 10 corruption damage at the start of each of their
  turns, and regains 5 Stamina each time they use an ability or other effect that allows another
  creature to spend a Recovery.'
traits.hobgoblin.hobgoblin-redglare.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-redglare.infernal-ichor.description: When the redglare is reduced to 0
  Stamina, they spray burning blood. Each creature adjacent to the redglare takes 3 fire damage.
monsters.hobgoblin.hobgoblin-redglare.name: Hobgoblin Redglare
abilities.hobgoblin.hobgoblin-smokebinder.choking-bolt.name: Choking Bolt
abilities.hobgoblin.hobgoblin-smokebinder.choking-bolt.texts.target: One creature or object
abilities.hobgoblin.hobgoblin-smokebinder.choking-bolt.texts.distance: Ranged 5
abilities.hobgoblin.hobgoblin-smokebinder.choking-bolt.texts.roll: Power Roll + 3
abilities.hobgoblin.hobgoblin-smokebinder.choking-bolt.texts.tier1: 9 fire damage
abilities.hobgoblin.hobgoblin-smokebinder.choking-bolt.texts.tier2: 14 fire damage
abilities.hobgoblin.hobgoblin-smokebinder.choking-bolt.texts.tier3: 17 fire damage; R < 3 slowed (save ends)
abilities.hobgoblin.hobgoblin-smokebinder.choking-bolt.texts.effect: "Effect: If this ability gains
  an edge or has a double edge, the target can't communicate with anyone until the end of their next
  turn."
abilities.hobgoblin.hobgoblin-smokebinder.smoke-bomb.name: Smoke Bomb
abilities.hobgoblin.hobgoblin-smokebinder.smoke-bomb.texts.target: Each enemy in the area
abilities.hobgoblin.hobgoblin-smokebinder.smoke-bomb.texts.distance: 3 burst
abilities.hobgoblin.hobgoblin-smokebinder.smoke-bomb.texts.roll: Might test
abilities.hobgoblin.hobgoblin-smokebinder.smoke-bomb.texts.tier1: 11 damage; the target has a double bane on their next power roll
abilities.hobgoblin.hobgoblin-smokebinder.smoke-bomb.texts.tier2: 9 damage; the target takes a bane on their next power roll
abilities.hobgoblin.hobgoblin-smokebinder.smoke-bomb.texts.tier3: 5 damage
abilities.hobgoblin.hobgoblin-smokebinder.smoke-bomb.texts.effect: 'Effect: Each target makes a Might test.'
traits.hobgoblin.hobgoblin-smokebinder.essence-of-smoke.name: Essence of Smoke
traits.hobgoblin.hobgoblin-smokebinder.essence-of-smoke.description: The smokebinder can move
  through spaces as if they were size 1T and can occupy another creature or object's space. At the
  end of their turn, the smokebinder can attempt to hide if they haven't taken any damage since
  their last turn.
traits.hobgoblin.hobgoblin-smokebinder.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-smokebinder.infernal-ichor.description: When the smokebinder is reduced
  to 0 Stamina, they spray burning blood. Each creature adjacent to the smokebinder takes 3 fire
  damage.
monsters.hobgoblin.hobgoblin-smokebinder.name: Hobgoblin Smokebinder
abilities.hobgoblin.hobgoblin-war-mage.hellfire.name: Hellfire
abilities.hobgoblin.hobgoblin-war-mage.hellfire.texts.target: Each enemy in the area
abilities.hobgoblin.hobgoblin-war-mage.hellfire.texts.distance: 3 cube within 10
abilities.hobgoblin.hobgoblin-war-mage.hellfire.texts.roll: Power Roll + 3
abilities.hobgoblin.hobgoblin-war-mage.hellfire.texts.tier1: 5 fire damage; M < 1 weakened (save ends)
abilities.hobgoblin.hobgoblin-war-mage.hellfire.texts.tier2: 9 fire damage; M < 2 weakened (save ends)
abilities.hobgoblin.hobgoblin-war-mage.hellfire.texts.tier3: 11 fire damage; M < 3 weakened (save ends)
abilities.hobgoblin.hobgoblin-war-mage.hellfire.texts.effect: 'Effect: Before using this ability,
  the war mage can teleport a creature within 10 squares of them up to 2 squares.'
abilities.hobgoblin.hobgoblin-war-mage.enchantments-of-war.name: Enchantments of War
abilities.hobgoblin.hobgoblin-war-mage.enchantments-of-war.texts.target: Two allies
abilities.hobgoblin.hobgoblin-war-mage.enchantments-of-war.texts.distance: Ranged 10
abilities.hobgoblin.hobgoblin-war-mage.enchantments-of-war.texts.effect: 'Effect: Each target gains
  10 temporary Stamina and has a double edge on their next power roll. The war mage can spend any
  amount of their current Stamina to increase the temporary Stamina each target gains by an
  equivalent amount.'
abilities.hobgoblin.hobgoblin-war-mage.unhallowed-ground.name: Unhallowed Ground
abilities.hobgoblin.hobgoblin-war-mage.unhallowed-ground.texts.target: Special
abilities.hobgoblin.hobgoblin-war-mage.unhallowed-ground.texts.distance: 5 cube within 10
abilities.hobgoblin.hobgoblin-war-mage.unhallowed-ground.texts.effect: 'Effect: The war mage
  consecrates the area and causes it to smolder until the end of the encounter. The area is
  difficult terrain and any enemy in the area has fire weakness 10.'
abilities.hobgoblin.hobgoblin-war-mage.magic-siphon.name: Magic Siphon
abilities.hobgoblin.hobgoblin-war-mage.magic-siphon.texts.trigger: A creature within distance uses a magic ability.
abilities.hobgoblin.hobgoblin-war-mage.magic-siphon.texts.target: The triggering creature
abilities.hobgoblin.hobgoblin-war-mage.magic-siphon.texts.distance: Ranged 10
abilities.hobgoblin.hobgoblin-war-mage.magic-siphon.texts.effect: "Effect: Any damage dealt or
  Stamina regained from the creature's ability is halved. The war mage regains Stamina equal to the
  remaining damage dealt or Stamina regained."
traits.hobgoblin.hobgoblin-war-mage.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-war-mage.infernal-ichor.description: When the war mage is reduced to 0
  Stamina, they spray burning blood. Each creature adjacent to the war mage takes 3 fire damage.
traits.hobgoblin.hobgoblin-war-mage.despair-you-who-face-death.name: Despair, You Who Face Death
traits.hobgoblin.hobgoblin-war-mage.despair-you-who-face-death.description: Any enemy within 2 squares of the war mage has a −2 penalty to saving throws.
monsters.hobgoblin.hobgoblin-war-mage.name: Hobgoblin War Mage
abilities.hobgoblin.slaughter-demon.steely-skewer.name: Steely Skewer
abilities.hobgoblin.slaughter-demon.steely-skewer.texts.target: Two creatures or objects
abilities.hobgoblin.slaughter-demon.steely-skewer.texts.distance: Melee 3
abilities.hobgoblin.slaughter-demon.steely-skewer.texts.roll: Power Roll + 3
abilities.hobgoblin.slaughter-demon.steely-skewer.texts.tier1: 9 damage
abilities.hobgoblin.slaughter-demon.steely-skewer.texts.tier2: 14 damage; A < 2 bleeding (save ends)
abilities.hobgoblin.slaughter-demon.steely-skewer.texts.tier3: 17 damage; A < 3 bleeding and restrained (save ends)
abilities.hobgoblin.slaughter-demon.steely-skewer.texts.effect: 'Effect: A creature restrained this
  way moves with the slaughter demon. The slaughter demon can have up to six creatures or objects
  restrained at once.'
abilities.hobgoblin.slaughter-demon.tail-stinger.name: Tail Stinger
abilities.hobgoblin.slaughter-demon.tail-stinger.texts.target: One creature or object
abilities.hobgoblin.slaughter-demon.tail-stinger.texts.distance: Melee 5
abilities.hobgoblin.slaughter-demon.tail-stinger.texts.roll: Power Roll + 3
abilities.hobgoblin.slaughter-demon.tail-stinger.texts.tier1: 10 poison damage; M < 1 weakened (save ends)
abilities.hobgoblin.slaughter-demon.tail-stinger.texts.tier2: 16 poison damage; M < 2 weakened (save ends)
abilities.hobgoblin.slaughter-demon.tail-stinger.texts.tier3: 20 poison damage; M < 3 weakened (save ends)
abilities.hobgoblin.slaughter-demon.tail-stinger.texts.effect: 'Effect: A target weakened this way also has damage weakness 3.'
traits.hobgoblin.slaughter-demon.drag-below.name: Drag Below
traits.hobgoblin.slaughter-demon.drag-below.description: The slaughter demon can make a free strike
  as part of using the Dig maneuver. If the target of the free strike has M < 2, they are grabbed
  and take a bane on the Escape Grab maneuver.
abilities.hobgoblin.slaughter-demon.devour-soul.name: Devour Soul
abilities.hobgoblin.slaughter-demon.devour-soul.texts.trigger: A creature within distance who has a soul dies.
abilities.hobgoblin.slaughter-demon.devour-soul.texts.target: The triggering creature
abilities.hobgoblin.slaughter-demon.devour-soul.texts.distance: 5 burst
abilities.hobgoblin.slaughter-demon.devour-soul.texts.effect: "Effect: The target can't be brought
  back to life. Until the end of the encounter, the slaughter demon gains an edge on power rolls."
traits.hobgoblin.slaughter-demon.soulsight.name: Soulsight
traits.hobgoblin.slaughter-demon.soulsight.description: Any creature within 2 squares of the slaughter demon can't be hidden from them.
traits.hobgoblin.slaughter-demon.lethe.name: Lethe
traits.hobgoblin.slaughter-demon.lethe.description: While the slaughter demon is winded, they gain
  an edge on strikes, and any strike made against them gains an edge.
monsters.hobgoblin.slaughter-demon.name: Slaughter Demon
effects.hobgoblin.burning.name: Burning
effects.hobgoblin.burning.description: A burning creature takes 1d6 fire damage at the start of each
  of their turns. A burning object takes 1d6 fire damage at the end of each round.
effects.hobgoblin.judged.name: Judged
effects.hobgoblin.judged.description: Until the end of the encounter, a judged target takes 10
  corruption damage at the start of each of their turns, and regains 5 Stamina each time they use an
  ability or other effect that allows another creature to spend a Recovery.
effects.hobgoblin.fire-weakness.name: Fire weakness 5
effects.hobgoblin.fire-weakness.description: The creature has fire weakness 5.
effects.hobgoblin.stinger-weakness.name: Damage weakness 3
effects.hobgoblin.stinger-weakness.description: A target weakened this way also has damage weakness 3.
effects.hobgoblin.smoke-bane.name: Bane
effects.hobgoblin.smoke-bane.description: The target takes a bane on their next power roll.
effects.hobgoblin.smoke-double-bane.name: Double bane
effects.hobgoblin.smoke-double-bane.description: The target has a double bane on their next power roll.
effects.hobgoblin.war-mage-double-edge.name: Double edge
effects.hobgoblin.war-mage-double-edge.description: The target has a double edge on their next power roll.
effects.hobgoblin.devoured-soul.name: Devoured soul
effects.hobgoblin.devoured-soul.description: Until the end of the encounter, the slaughter demon gains an edge on power rolls.
