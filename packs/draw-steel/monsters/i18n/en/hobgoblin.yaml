abilities.hobgoblin.hobgoblin-firerunner.flaming-kick.texts.tier3: 16 fire damage; A < 3 dazed (EoT)
abilities.hobgoblin.hobgoblin-firerunner.blazing-trail.name: Blazing Trail
abilities.hobgoblin.hobgoblin-firerunner.blazing-trail.texts.target: Self
abilities.hobgoblin.hobgoblin-firerunner.blazing-trail.texts.distance: Self
abilities.hobgoblin.hobgoblin-firerunner.blazing-trail.texts.effect: 'Effect: The firerunner moves
  up to their speed and creates an 8 wall of fire along the path of their movement. Creatures can
  enter and pass through the wall. Any enemy who enters the wall for the first time in a round or
  starts their turn there takes 5 fire damage.'
traits.hobgoblin.hobgoblin-firerunner.hot-to-go.name: Hot to Go
traits.hobgoblin.hobgoblin-firerunner.hot-to-go.description: Whenever the firerunner takes fire
  damage for the first time in a round, their speed and the size of the wall they can create with
  Blazing Trail increases by 4 until the end of their next turn.
traits.hobgoblin.hobgoblin-firerunner.kindlestep.name: Kindlestep
traits.hobgoblin.hobgoblin-firerunner.kindlestep.description: The firerunner ignores difficult terrain.
traits.hobgoblin.hobgoblin-firerunner.infernal-ichor.name: Infernal Ichor
traits.hobgoblin.hobgoblin-firerunner.infernal-ichor.description: When the firerunner is reduced to
