abilities.hobgoblin.hobgoblin-grandguard.thunder-rush.texts.tier1: 6 damage
abilities.hobgoblin.hobgoblin-grandguard.thunder-rush.texts.tier2: 11 damage
abilities.hobgoblin.hobgoblin-grandguard.thunder-rush.texts.tier3: 14 damage
abilities.hobgoblin.hobgoblin-grandguard.thunder-rush.texts.effect: 'Effect: Each target is pushed
  up to 10 squares in the same direction, and the grandguard shifts into the area behind by the
  targets.'
traits.hobgoblin.hobgoblin-grandguard.wide-guard.name: Wide Guard
traits.hobgoblin.hobgoblin-grandguard.wide-guard.description: Any strike made against an ally within 2 squares of the grandguard takes a bane.
