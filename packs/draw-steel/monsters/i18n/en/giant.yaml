malice.giant.hurl-landscape.name: Hurl Landscape
malice.giant.hurl-landscape.description: >-
  | Area, Ranged, Weapon |               Main action |


  |--------------------------|------------------------------:|


  | 📏 4 cube within 10  | 🎯 Each enemy in the area |


  Effect: A giant unearths a structure, hazard, or chunk of the encounter map and launches it to
  fill the area. Each target makes an Agility test.
malice.giant.hurl-landscape.texts.tier1: 18 damage; prone and can't stand (save ends)
malice.giant.hurl-landscape.texts.tier2: 14 damage; prone
malice.giant.hurl-landscape.texts.tier3: 9 damage
malice.giant.bellow.name: Bellow
malice.giant.bellow.description: Each giant in the encounter takes a deep breath and yells, pushing
  each creature within 3 squares of them up to 10 squares. A creature who can be pushed by more than
  one giant is pushed by one giant of your choice.
malice.giant.titanic-tear.name: Titanic Tear
malice.giant.titanic-tear.description: A giant creates a fissure along the ground, either in a 15 ×
  2 line within 1 or a 10 × 3 line within 2, and that opens up to a depth of 6 squares. Each giant
  in the area can shift into the nearest unoccupied space outside the fissure. Each non-giant in the
  area makes an Agility test.
malice.giant.titanic-tear.texts.tier1: 10 damage; the target falls into the fissure, and is prone and can't stand (EoT)
malice.giant.titanic-tear.texts.tier2: 10 damage; the target is prone and hanging onto the edge of the fissure
malice.giant.titanic-tear.texts.tier3: The target can shift into the nearest unoccupied space outside the fissure.
abilities.giant.basalt-stone-giant.rune-signed-blade.name: Rune-Signed Blade
abilities.giant.basalt-stone-giant.rune-signed-blade.texts.target: Two creatures or objects
abilities.giant.basalt-stone-giant.rune-signed-blade.texts.distance: Melee 3
abilities.giant.basalt-stone-giant.rune-signed-blade.texts.roll: Power Roll + 4
abilities.giant.basalt-stone-giant.rune-signed-blade.texts.tier1: 12 damage; M < 2 slowed (save ends)
abilities.giant.basalt-stone-giant.rune-signed-blade.texts.tier2: 17 damage; M < 3 slowed (save ends)
abilities.giant.basalt-stone-giant.rune-signed-blade.texts.tier3: 21 damage; M < 4 slowed (save ends)
abilities.giant.basalt-stone-giant.rune-signed-blade.texts.effect: 'Effect: If a target was already
  slowed, that condition continues but their speed is 0 until the end of their next turn.'
abilities.giant.basalt-stone-giant.forked-knife.name: Forked Knife
abilities.giant.basalt-stone-giant.forked-knife.texts.target: One creature or object
abilities.giant.basalt-stone-giant.forked-knife.texts.distance: Melee 3 or ranged 12
abilities.giant.basalt-stone-giant.forked-knife.texts.roll: Power Roll + 4
abilities.giant.basalt-stone-giant.forked-knife.texts.tier1: 10 damage; A < 2 restrained (save ends)
abilities.giant.basalt-stone-giant.forked-knife.texts.tier2: 16 damage; A < 3 restrained (save ends)
abilities.giant.basalt-stone-giant.forked-knife.texts.tier3: 20 damage; prone; A < 4 restrained (save ends)
abilities.giant.basalt-stone-giant.forked-knife.texts.effect: "Effect: The knife lands in the
  target's square, and has 30 Stamina and damage immunity 5. Whenever the knife takes damage, it
  deals 4 sonic damage to each enemy within 3 squares. The knife lasts until the end of the
  encounter, and can't be picked up or manipulated."
abilities.giant.basalt-stone-giant.cobblestone-shape.name: Cobblestone Shape
abilities.giant.basalt-stone-giant.cobblestone-shape.texts.target: Self
abilities.giant.basalt-stone-giant.cobblestone-shape.texts.distance: Self
abilities.giant.basalt-stone-giant.cobblestone-shape.texts.effect: 'Effect: The basalt stone giant
  moves up to their speed. Each square that they leave during this move is difficult terrain for
  enemies. Giants ignore this difficult terrain.'
abilities.giant.basalt-stone-giant.resonate-rune.name: Resonate Rune
abilities.giant.basalt-stone-giant.resonate-rune.texts.trigger: The basalt stone giant takes damage.
abilities.giant.basalt-stone-giant.resonate-rune.texts.target: Each enemy in the area
abilities.giant.basalt-stone-giant.resonate-rune.texts.distance: 2 burst
abilities.giant.basalt-stone-giant.resonate-rune.texts.effect: 'Effect: The target is pushed up to 3
  squares, or if they have A < 3, they are pushed up to 6 squares and knocked prone.'
traits.giant.basalt-stone-giant.stonebreaker-flesh.name: Stonebreaker Flesh
traits.giant.basalt-stone-giant.stonebreaker-flesh.description: Whenever an enemy obtains a tier 1
  outcome on a melee ability used against the basalt stone giant, they take a bane on that ability
  until the end of the encounter.
traits.giant.basalt-stone-giant.stone-steps.name: Stone Steps
traits.giant.basalt-stone-giant.stone-steps.description: The basalt stone giant ignores difficult terrain.
traits.giant.basalt-stone-giant.stone-swim.name: Stone Swim
traits.giant.basalt-stone-giant.stone-swim.description: The basalt stone giant can burrow through
  stone, but can't drag other creatures underground when they do so.
monsters.giant.basalt-stone-giant.name: Basalt Stone Giant
abilities.giant.fire-giant-chief.roiling-fist.name: Roiling Fist
abilities.giant.fire-giant-chief.roiling-fist.texts.target: Each enemy and object in the area
abilities.giant.fire-giant-chief.roiling-fist.texts.distance: 3 cube within 4
abilities.giant.fire-giant-chief.roiling-fist.texts.tier1: 18 fire damage; prone; weakened (save ends)
abilities.giant.fire-giant-chief.roiling-fist.texts.tier2: 14 fire damage; prone
abilities.giant.fire-giant-chief.roiling-fist.texts.tier3: 9 fire damage
abilities.giant.fire-giant-chief.roiling-fist.texts.effect: 'Effect: Each target makes either an Agility test or an Intuition test.'
abilities.giant.fire-giant-chief.burning-kick.name: Burning Kick
abilities.giant.fire-giant-chief.burning-kick.texts.target: Two creatures or objects
abilities.giant.fire-giant-chief.burning-kick.texts.distance: Melee 4
abilities.giant.fire-giant-chief.burning-kick.texts.roll: Power Roll + 5
abilities.giant.fire-giant-chief.burning-kick.texts.tier1: 14 damage; push 5; A < 3, 9 fire damage
abilities.giant.fire-giant-chief.burning-kick.texts.tier2: 19 damage; push 10; A < 4, 9 fire damage
abilities.giant.fire-giant-chief.burning-kick.texts.tier3: 23 damage; push 15; A < 5, 9 fire damage
abilities.giant.fire-giant-chief.lava-pillar.name: Lava Pillar
abilities.giant.fire-giant-chief.lava-pillar.texts.target: Each enemy and object in the area
abilities.giant.fire-giant-chief.lava-pillar.texts.distance: 3 cube within 10
abilities.giant.fire-giant-chief.lava-pillar.texts.roll: Power Roll + 5
abilities.giant.fire-giant-chief.lava-pillar.texts.tier1: 5 fire damage; M < 3, vertical push 3
abilities.giant.fire-giant-chief.lava-pillar.texts.tier2: 7 fire damage; M < 4, vertical push 4
abilities.giant.fire-giant-chief.lava-pillar.texts.tier3: 9 fire damage; M < 5, vertical push 5
abilities.giant.fire-giant-chief.fuel-the-fire.name: Fuel the Fire
abilities.giant.fire-giant-chief.fuel-the-fire.texts.trigger: A fire giant ally within distance makes a strike.
abilities.giant.fire-giant-chief.fuel-the-fire.texts.target: The triggering ally
abilities.giant.fire-giant-chief.fuel-the-fire.texts.distance: Ranged 12
abilities.giant.fire-giant-chief.fuel-the-fire.texts.effect: 'Effect: The strike has a double edge and deals an extra 10 fire damage.'
abilities.giant.fire-giant-chief.forward.name: Forward!
abilities.giant.fire-giant-chief.forward.texts.target: Self and each ally in the area
abilities.giant.fire-giant-chief.forward.texts.distance: 10 burst
abilities.giant.fire-giant-chief.forward.texts.effect: 'Effect: Each target shifts up to their speed
  and can make a free strike. Any enemy who takes damage from a free strike this way and who has A <
  4 is burning (save ends). A burning enemy takes 1d6 fire damage at the start of each of their
  turns.'
abilities.giant.fire-giant-chief.burning-legion.name: Burning Legion
abilities.giant.fire-giant-chief.burning-legion.texts.target: Special
abilities.giant.fire-giant-chief.burning-legion.texts.distance: Ranged 15
abilities.giant.fire-giant-chief.burning-legion.texts.effect: 'Effect: The chief shifts up to 10
  squares. Five fire giant fireballers then arrive in unoccupied spaces within distance.'
abilities.giant.fire-giant-chief.all-to-cinders.name: All to Cinders
abilities.giant.fire-giant-chief.all-to-cinders.texts.target: Self and each fire giant ally in the area
abilities.giant.fire-giant-chief.all-to-cinders.texts.distance: 10 burst
abilities.giant.fire-giant-chief.all-to-cinders.texts.roll: Agility test
abilities.giant.fire-giant-chief.all-to-cinders.texts.tier1: 18 fire damage
abilities.giant.fire-giant-chief.all-to-cinders.texts.tier2: 14 fire damage
abilities.giant.fire-giant-chief.all-to-cinders.texts.tier3: 9 fire damage
abilities.giant.fire-giant-chief.all-to-cinders.texts.effect: 'Effect: Each target unleashes a wave
  of fire, and each enemy within 2 squares of any target makes an Agility test. An enemy affected by
  two targets takes a bane on the test, while an enemy affected by three or more targets has a
  double bane.'
traits.giant.fire-giant-chief.scorching-skin.name: Scorching Skin
traits.giant.fire-giant-chief.scorching-skin.description: Whenever an adjacent enemy grabs the chief
  or uses a melee ability against them, that enemy takes 9 fire damage, and if they have M < 4 they
  are weakened (save ends)
monsters.giant.fire-giant-chief.name: Fire Giant Chief
monsters.giant.fire-giant-fireballer.texts.withCaptain: +3 bonus to speed
abilities.giant.fire-giant-fireballer.blazing-leap.name: Blazing Leap
abilities.giant.fire-giant-fireballer.blazing-leap.texts.target: Each enemy and object in the area
abilities.giant.fire-giant-fireballer.blazing-leap.texts.distance: 1 burst
abilities.giant.fire-giant-fireballer.blazing-leap.texts.roll: Power Roll + 4
abilities.giant.fire-giant-fireballer.blazing-leap.texts.tier1: 2 fire damage
abilities.giant.fire-giant-fireballer.blazing-leap.texts.tier2: 5 fire damage; push 1
abilities.giant.fire-giant-fireballer.blazing-leap.texts.tier3: 6 fire damage; push 2
abilities.giant.fire-giant-fireballer.blazing-leap.texts.effect: 'Effect: The fireballer can jump up to 4 squares before using this ability.'
traits.giant.fire-giant-fireballer.searing-skin.name: Searing Skin
traits.giant.fire-giant-fireballer.searing-skin.description: Whenever an adjacent enemy grabs the
  fireballer or uses a melee ability against them, that enemy takes 5 fire damage.
monsters.giant.fire-giant-fireballer.name: Fire Giant Fireballer
abilities.giant.fire-giant-lightbearer.flamelash.name: Flamelash
abilities.giant.fire-giant-lightbearer.flamelash.texts.target: Two creatures or objects
abilities.giant.fire-giant-lightbearer.flamelash.texts.distance: Melee 6
abilities.giant.fire-giant-lightbearer.flamelash.texts.roll: Power Roll + 4
abilities.giant.fire-giant-lightbearer.flamelash.texts.tier1: 13 fire damage; slide 2
abilities.giant.fire-giant-lightbearer.flamelash.texts.tier2: 17 fire damage; slide 4
abilities.giant.fire-giant-lightbearer.flamelash.texts.tier3: 22 fire damage; slide 6
abilities.giant.fire-giant-lightbearer.living-blaze.name: Living Blaze
abilities.giant.fire-giant-lightbearer.living-blaze.texts.target: Two creatures or objects
abilities.giant.fire-giant-lightbearer.living-blaze.texts.distance: Ranged 6
abilities.giant.fire-giant-lightbearer.living-blaze.texts.roll: Power Roll + 4
abilities.giant.fire-giant-lightbearer.living-blaze.texts.tier1: 15 fire damage
abilities.giant.fire-giant-lightbearer.living-blaze.texts.tier2: 21 fire damage
abilities.giant.fire-giant-lightbearer.living-blaze.texts.tier3: 26 fire damage
abilities.giant.fire-giant-lightbearer.living-blaze.texts.effect: 'Effect: The blaze ricochets,
  targeting one additional target within 4 squares of an original target and taking a bane against
  that target, or targeting two additional targets within 2 squares of an original target and having
  a double bane against those targets. The lightbearer makes one power roll against all targets.'
abilities.giant.fire-giant-lightbearer.travel-by-fire.name: Travel By Fire
abilities.giant.fire-giant-lightbearer.travel-by-fire.texts.target: Two creatures or objects
abilities.giant.fire-giant-lightbearer.travel-by-fire.texts.distance: Ranged 5
abilities.giant.fire-giant-lightbearer.travel-by-fire.texts.effect: 'Effect: The lightbearer can
  target themself with this ability. Each target takes 1d6 fire damage and teleports in a plume of
  smoke to swap places with the other target.'
abilities.giant.fire-giant-lightbearer.emergency-beacon.name: Emergency Beacon
abilities.giant.fire-giant-lightbearer.emergency-beacon.texts.trigger: The lightbearer takes damage.
abilities.giant.fire-giant-lightbearer.emergency-beacon.texts.target: Self
abilities.giant.fire-giant-lightbearer.emergency-beacon.texts.distance: Self
abilities.giant.fire-giant-lightbearer.emergency-beacon.texts.effect: 'Effect: The lightbearer emits
  a beacon of light until the start of their next turn. Each fire giant who has line of effect to
  the lightbearer has a double edge on abilities.'
traits.giant.fire-giant-lightbearer.healing-heat.name: Healing Heat
traits.giant.fire-giant-lightbearer.healing-heat.description: Any fire giant targeted by the
  lightbearer's damage-dealing abilities ignores the damage and instead regains Stamina equal to the
  damage that would have been dealt. If the lightbearer moves a fire giant using an ability, they
  can choose to ignore stability.
traits.giant.fire-giant-lightbearer.searing-skin.name: Searing Skin
traits.giant.fire-giant-lightbearer.searing-skin.description: Whenever an adjacent enemy grabs the
  lightbearer or uses a melee ability against them, that enemy takes 5 fire damage.
monsters.giant.fire-giant-lightbearer.name: Fire Giant Lightbearer
abilities.giant.fire-giant-red-fist.flaming-punch.name: Flaming Punch
abilities.giant.fire-giant-red-fist.flaming-punch.texts.target: Two creatures or objects
abilities.giant.fire-giant-red-fist.flaming-punch.texts.distance: Melee 3
abilities.giant.fire-giant-red-fist.flaming-punch.texts.roll: Power Roll + 4
abilities.giant.fire-giant-red-fist.flaming-punch.texts.tier1: 14 fire damage; push 2
abilities.giant.fire-giant-red-fist.flaming-punch.texts.tier2: 19 fire damage; push 4; A < 3 burning (save ends)
abilities.giant.fire-giant-red-fist.flaming-punch.texts.tier3: 23 fire damage; push 6; A < 4 burning (save ends)
abilities.giant.fire-giant-red-fist.flaming-punch.texts.effect: 'Effect: A burning creature takes
  1d6 fire damage at the start of each of their turns. A burning object takes 1d6 fire damage at the
  end of each round.'
abilities.giant.fire-giant-red-fist.caldera.name: Caldera
abilities.giant.fire-giant-red-fist.caldera.texts.target: Each enemy and object in the area
abilities.giant.fire-giant-red-fist.caldera.texts.distance: Special
abilities.giant.fire-giant-red-fist.caldera.texts.roll: Power Roll + 4
abilities.giant.fire-giant-red-fist.caldera.texts.tier1: The distance is a 2 burst; 8 fire damage; M < 2 pull 2
abilities.giant.fire-giant-red-fist.caldera.texts.tier2: The distance is a 3 burst; 12 fire damage; M < 3 pull 4
abilities.giant.fire-giant-red-fist.caldera.texts.tier3: The distance is a 4 burst; 15 fire damage; M < 4 pull 6
abilities.giant.fire-giant-red-fist.caldera.texts.effect: 'Effect: The outermost squares of the area
  become a 1-square-tall wall of stone. The rest of the area is on fire until the end of the
  encounter. A creature who enters the area for the first time in a round or starts their turn there
  takes 3 fire damage.'
abilities.giant.fire-giant-red-fist.blazing-leap.name: Blazing Leap
abilities.giant.fire-giant-red-fist.blazing-leap.texts.target: Self
abilities.giant.fire-giant-red-fist.blazing-leap.texts.distance: Self
abilities.giant.fire-giant-red-fist.blazing-leap.texts.effect: 'Effect: The red fist jumps up to 5
  squares. Each creature adjacent to them when they land takes 5 fire damage.'
abilities.giant.fire-giant-red-fist.heat-and-pressure.name: Heat and Pressure
abilities.giant.fire-giant-red-fist.heat-and-pressure.texts.trigger: A creature within distance willingly moves or shifts away from the red fist.
abilities.giant.fire-giant-red-fist.heat-and-pressure.texts.target: The triggering creature
abilities.giant.fire-giant-red-fist.heat-and-pressure.texts.distance: Melee 3
abilities.giant.fire-giant-red-fist.heat-and-pressure.texts.roll: Might test
abilities.giant.fire-giant-red-fist.heat-and-pressure.texts.tier1: Weakened and slowed (save ends)
abilities.giant.fire-giant-red-fist.heat-and-pressure.texts.tier2: Weakened (EoT)
abilities.giant.fire-giant-red-fist.heat-and-pressure.texts.tier3: No effect
abilities.giant.fire-giant-red-fist.heat-and-pressure.texts.effect: 'Effect: The target makes a
  Might test. A target with fire immunity automatically obtains a tier 3 outcome.'
abilities.giant.fire-giant-red-fist.guardian-block.name: Guardian Block
abilities.giant.fire-giant-red-fist.guardian-block.texts.trigger: An ally within distance is targeted by an enemy's ability.
abilities.giant.fire-giant-red-fist.guardian-block.texts.target: Self
abilities.giant.fire-giant-red-fist.guardian-block.texts.distance: Melee 3
abilities.giant.fire-giant-red-fist.guardian-block.texts.effect: 'Effect: The red fist becomes the
  target of the triggering ability, then can make a free strike against the enemy after the ability
  resolves.'
traits.giant.fire-giant-red-fist.searing-skin.name: Searing Skin
traits.giant.fire-giant-red-fist.searing-skin.description: Whenever an adjacent enemy grabs the red
  fist or uses a melee ability against them, that enemy takes 5 fire damage.
monsters.giant.fire-giant-red-fist.name: Fire Giant Red Fist
monsters.giant.frost-giant-snowblaster.texts.withCaptain: +3 damage bonus to strikes
abilities.giant.frost-giant-snowblaster.slushfall.name: Slushfall
abilities.giant.frost-giant-snowblaster.slushfall.texts.target: One creature or object per minion
abilities.giant.frost-giant-snowblaster.slushfall.texts.distance: Ranged 12
abilities.giant.frost-giant-snowblaster.slushfall.texts.roll: Power Roll + 4
abilities.giant.frost-giant-snowblaster.slushfall.texts.tier1: 4 cold damage
abilities.giant.frost-giant-snowblaster.slushfall.texts.tier2: 7 cold damage
abilities.giant.frost-giant-snowblaster.slushfall.texts.tier3: 9 cold damage; prone
traits.giant.frost-giant-snowblaster.kingdom-of-isolation.name: Kingdom of Isolation
traits.giant.frost-giant-snowblaster.kingdom-of-isolation.description: The snowblaster is surrounded
  by a snowstorm. Any enemy who starts their turn within 2 squares of the snowblaster can't shift.
monsters.giant.frost-giant-snowblaster.name: Frost Giant Snowblaster
abilities.giant.frost-giant-storm-hurler.ice-javelins.name: Ice Javelins
abilities.giant.frost-giant-storm-hurler.ice-javelins.texts.target: Two creatures or objects
abilities.giant.frost-giant-storm-hurler.ice-javelins.texts.distance: Ranged 15
abilities.giant.frost-giant-storm-hurler.ice-javelins.texts.roll: Power Roll + 4
abilities.giant.frost-giant-storm-hurler.ice-javelins.texts.tier1: 13 cold damage
abilities.giant.frost-giant-storm-hurler.ice-javelins.texts.tier2: 18 cold damage; M < 3 bleeding (save ends)
abilities.giant.frost-giant-storm-hurler.ice-javelins.texts.tier3: 22 cold damage; M < 4 bleeding (save ends)
abilities.giant.frost-giant-storm-hurler.ice-javelins.texts.effect: 'Effect: Whenever a creature
  bleeding this way takes damage from that condition, their speed decreases by 1 (to a minimum of 0)
  until that condition ends.'
abilities.giant.frost-giant-storm-hurler.flower-of-frost.name: Flower of Frost
abilities.giant.frost-giant-storm-hurler.flower-of-frost.texts.target: Special
abilities.giant.frost-giant-storm-hurler.flower-of-frost.texts.distance: Ranged 15
abilities.giant.frost-giant-storm-hurler.flower-of-frost.texts.roll: Agility test
abilities.giant.frost-giant-storm-hurler.flower-of-frost.texts.tier1: 14 cold damage; push 4; bleeding (save ends)
abilities.giant.frost-giant-storm-hurler.flower-of-frost.texts.tier2: 11 cold damage; push 2; slowed (save ends)
abilities.giant.frost-giant-storm-hurler.flower-of-frost.texts.tier3: 7 cold damage
abilities.giant.frost-giant-storm-hurler.flower-of-frost.texts.effect: "Effect: The storm hurler
  throws three size 1L ice javelins into unoccupied squares within distance. Each javelin has 30
  Stamina and fire weakness 5. At the start of the storm hurler's next turn, all javelins not
  destroyed explode in a shower of icicles. Each enemy and object within 3 squares of an exploding
  javelin makes an Agility test."
abilities.giant.frost-giant-storm-hurler.ice-dance.name: Ice Dance
abilities.giant.frost-giant-storm-hurler.ice-dance.texts.target: One giant ally
abilities.giant.frost-giant-storm-hurler.ice-dance.texts.distance: Melee 1
abilities.giant.frost-giant-storm-hurler.ice-dance.texts.effect: 'Effect: The storm hurler and the
  target each shift up to 6 squares while staying adjacent to each other. The target can then jump
  up to 5 squares and make a free strike.'
abilities.giant.frost-giant-storm-hurler.frozen-retribution.name: Frozen Retribution
abilities.giant.frost-giant-storm-hurler.frozen-retribution.texts.trigger: The storm hurler is targeted by a ranged strike.
abilities.giant.frost-giant-storm-hurler.frozen-retribution.texts.target: Self
abilities.giant.frost-giant-storm-hurler.frozen-retribution.texts.distance: Self
abilities.giant.frost-giant-storm-hurler.frozen-retribution.texts.effect: 'Effect: The triggering
  strike has a double bane. If the strike obtains a tier 1 outcome, the storm hurler uses Ice
  Javelins against the creature who made it.'
traits.giant.frost-giant-storm-hurler.kingdom-of-isolation.name: Kingdom of Isolation
traits.giant.frost-giant-storm-hurler.kingdom-of-isolation.description: The storm hurler is
  surrounded by a snowstorm. Any enemy who starts their turn within 2 squares of the storm hurler
  can't shift.
monsters.giant.frost-giant-storm-hurler.name: Frost Giant Storm Hurler
abilities.giant.frost-giant-wind-sprinter.cold-axe.name: Cold Axe
abilities.giant.frost-giant-wind-sprinter.cold-axe.texts.target: Two creatures or objects
abilities.giant.frost-giant-wind-sprinter.cold-axe.texts.distance: Melee 3
abilities.giant.frost-giant-wind-sprinter.cold-axe.texts.roll: Power Roll + 4
abilities.giant.frost-giant-wind-sprinter.cold-axe.texts.tier1: 12 damage
abilities.giant.frost-giant-wind-sprinter.cold-axe.texts.tier2: 17 damage; A < 3 bleeding (save ends)
abilities.giant.frost-giant-wind-sprinter.cold-axe.texts.tier3: 21 damage; A < 4 bleeding (save ends)
abilities.giant.frost-giant-wind-sprinter.cold-axe.texts.effect: 'Effect: A target who is already bleeding takes an extra 1d6 cold damage.'
abilities.giant.frost-giant-wind-sprinter.blizzard-surge.name: Blizzard Surge
abilities.giant.frost-giant-wind-sprinter.blizzard-surge.texts.target: Self
abilities.giant.frost-giant-wind-sprinter.blizzard-surge.texts.distance: Self
abilities.giant.frost-giant-wind-sprinter.blizzard-surge.texts.effect: 'Effect: The wind sprinter
  shifts up to their speed and uses Cold Axe against each enemy who comes within 2 squares of them
  during the move. The wind sprinter makes one power roll against all targets.'
abilities.giant.frost-giant-wind-sprinter.ice-dance.name: Ice Dance
