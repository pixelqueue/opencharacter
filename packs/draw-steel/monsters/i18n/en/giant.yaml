abilities.giant.frost-giant-wind-sprinter.ice-dance.texts.effect: 'Effect: The wind sprinter and the
  target each shift up to 6 squares while staying adjacent to each other. The target can then jump
  up to 5 squares and make a free strike.'
abilities.giant.frost-giant-wind-sprinter.begone-smallfolk.name: Begone, Smallfolk!
