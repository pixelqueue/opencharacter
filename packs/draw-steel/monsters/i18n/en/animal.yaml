abilities.animal.big-animal-b.trundle.texts.distance: Self
abilities.animal.big-animal-b.trundle.texts.effect: 'Effect: The animal moves up to their speed.
  They can make a free strike against each creature who makes an opportunity attack against them
  during this movement.'
abilities.animal.big-animal-b.animal-rally.name: Animal Rally
abilities.animal.big-animal-b.animal-rally.texts.trigger: The target is knocked prone.
abilities.animal.big-animal-b.animal-rally.texts.target: One ally
abilities.animal.big-animal-b.animal-rally.texts.distance: Ranged 20
abilities.animal.big-animal-b.animal-rally.texts.effect: 'Effect: The animal moves up to their
  speed. If they end their turn adjacent to the target, they can use the Stand Up maneuver to let
  the target stand, then get on to ride them.'
