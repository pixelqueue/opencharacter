abilities.animal.predator-b.swat.texts.distance: Melee 1
abilities.animal.predator-b.swat.texts.effect: 'Effect: The target is pushed up to 5 squares.'
traits.animal.predator-b.trample.name: Trample
traits.animal.predator-b.trample.description: The predator can move through enemies' and objects'
  spaces at their usual speed. Any mundane size 2 or smaller object whose space they move through is
  destroyed. When the predator enters a creature's space for the first time on a turn, that creature
  takes 3 damage.
