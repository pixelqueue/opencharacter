abilities.animal.predator-a.quick-strike.texts.trigger: A creature or object comes within distance.
abilities.animal.predator-a.quick-strike.texts.target: The triggering creature or object
abilities.animal.predator-a.quick-strike.texts.distance: Melee 1
abilities.animal.predator-a.quick-strike.texts.effect: 'Effect: The predator makes a free strike
  against the target. If the predator was hidden from the target, the strike deals an extra 3
  damage.'
