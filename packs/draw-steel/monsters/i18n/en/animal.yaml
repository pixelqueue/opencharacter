abilities.animal.animal-swarm.flurry.name: Flurry
abilities.animal.animal-swarm.flurry.texts.target: Two creatures or objects
abilities.animal.animal-swarm.flurry.texts.distance: Melee 1
abilities.animal.animal-swarm.flurry.texts.roll: Power Roll + 2
abilities.animal.animal-swarm.flurry.texts.tier1: 6 damage
abilities.animal.animal-swarm.flurry.texts.tier2: 9 damage; pull 1
abilities.animal.animal-swarm.flurry.texts.tier3: 12 damage; pull 2
abilities.animal.animal-swarm.flurry.texts.effect: "Effect: If the target is pulled into the animal
  swarm, that forced movement deals damage only at the Director's determination."
traits.animal.animal-swarm.swarm.name: Swarm
traits.animal.animal-swarm.swarm.description: The animal swarm can move through spaces as if they
  were a size 1M creature, and can occupy other creatures' spaces. At the start of each of the
  animal swarm's turns, they can make a free strike against each creature whose space they share.
abilities.animal.animal-swarm.impede.name: Impede
abilities.animal.animal-swarm.impede.texts.target: Special
abilities.animal.animal-swarm.impede.texts.distance: 1 aura
abilities.animal.animal-swarm.impede.texts.effect: "Effect: The area is difficult terrain for
  enemies until the start of the animal swarm's next turn."
traits.animal.animal-swarm.natures-spirit.name: Nature's Spirit
traits.animal.animal-swarm.natures-spirit.description: While outdoors or in a natural environment,
  the animal swarm can negate a bane on their abilities or turn a double bane into a bane.
monsters.animal.animal-swarm.name: Animal Swarm
