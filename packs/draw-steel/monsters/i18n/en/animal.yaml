abilities.animal.big-animal-a.toss.texts.target: One creature or object
abilities.animal.big-animal-a.toss.texts.distance: Melee 1
abilities.animal.big-animal-a.toss.texts.effect: >-
  Special: The target must be the animal's size or smaller.


  Effect: The target vertical slides up to 3 squares. If the target is an ally, they can make a free
  strike at the end of the forced movement, then fall without taking damage.
