malice.bredbeddle.engreen.name: Engreen
malice.bredbeddle.engreen.description: The bredbeddle's axe lengthens and turns a ghastly green,
  granting a +1 bonus to the distance of the bredbeddle's melee strikes and the dimensions of their
  burst area abilities until the end of their turn.
malice.bredbeddle.shadow-stockade.name: Shadow Stockade
malice.bredbeddle.shadow-stockade.description: A ghostly size 1L stockade seeps out from under the
  bredbeddle's feet to fill an unoccupied square within 10 squares. When a size 1L or smaller enemy
  enters the stockade's square, they are restrained (save ends). When a restrained creature is no
  longer restrained, the stockade fades away. At the start of each of the bredbeddle's turns, they
  can slide an active stockade and any creature in it up to 5 squares.
malice.bredbeddle.solo-action.name: Solo Action
malice.bredbeddle.solo-action.description: The bredbeddle takes an additional main action on their
  turn. They can use this feature even if they are dazed.
malice.bredbeddle.green-phantom.name: Green Phantom
malice.bredbeddle.green-phantom.description: A phantom second bredbeddle phases into view, appearing
  in an unoccupied space anywhere on the encounter map, then vanishing at the end of the round. The
  phantom bredbeddle shares the original bredbeddle's statistics but has 24 Stamina, corruption
  immunity 10, and can fly. The phantom bredbeddle can take one turn and use any of the bredbeddle's
  abilities except for villain actions. Only one phantom bredbeddle can be active at a time.
traits.bredbeddle.bredbeddle.solo-monster.name: Solo Monster
traits.bredbeddle.bredbeddle.solo-monster.description: >-
  End Effect: At the end of each of their turns, the bredbeddle can take 5 damage to end one effect
  on them that can be ended by a saving throw. This damage can't be reduced in any way.


  Solo Turns: The bredbeddle can take two turns each round. They can't take turns consecutively.
traits.bredbeddle.bredbeddle.heady-or-not.name: Heady or Not
traits.bredbeddle.bredbeddle.heady-or-not.description: >-
  While headless, the bredbeddle can move into a space containing a severed head and attach it to
  their neck as a main action. Doing so physically transforms the bredbeddle, who takes on the
  appearance, size, weight, and stability of the head's original owner. If the bredbeddle takes the
  form of a creature of size 1L or smaller, the distance of their melee and burst area abilities
  decreases by 1. These effects last until the bredbeddle is killed or beheaded, or until the head
  falls off after 24 hours. A head that falls off this way can no longer be attached to this
  bredbeddle.


  A creature must succeed on a hard Might test made as a maneuver to rip a head off the bredbeddle.
  If they fail, the bredbeddle can make a free strike against them.
traits.bredbeddle.bredbeddle.resilient-form.name: Resilient Form
traits.bredbeddle.bredbeddle.resilient-form.description: The bredbeddle can't be physically transformed in any way except by their Heady or Not trait.
abilities.bredbeddle.bredbeddle.executioners-swing.name: Executioner's Swing
abilities.bredbeddle.bredbeddle.executioners-swing.texts.target: Each enemy in the area
abilities.bredbeddle.bredbeddle.executioners-swing.texts.distance: 2 burst
abilities.bredbeddle.bredbeddle.executioners-swing.texts.roll: Power Roll + 3
abilities.bredbeddle.bredbeddle.executioners-swing.texts.tier1: 2 damage; A < 1 bleeding (save ends)
abilities.bredbeddle.bredbeddle.executioners-swing.texts.tier2: 4 damage; A < 2 bleeding (save ends)
abilities.bredbeddle.bredbeddle.executioners-swing.texts.tier3: 5 damage; A < 3 bleeding (save ends); M < 2 dazed (save ends)
abilities.bredbeddle.bredbeddle.executioners-swing.texts.effect: '3 Malice: The bredbeddle shifts up
  to 2 squares, and can target additional enemies who come within distance of this ability during
  the shift.'
abilities.bredbeddle.bredbeddle.lop.name: Lop
abilities.bredbeddle.bredbeddle.lop.texts.target: One creature
abilities.bredbeddle.bredbeddle.lop.texts.distance: Melee 2
abilities.bredbeddle.bredbeddle.lop.texts.roll: Power Roll + 3
abilities.bredbeddle.bredbeddle.lop.texts.tier1: 9 damage; bleeding (save ends); or if the target has M < 1 they are beheaded
abilities.bredbeddle.bredbeddle.lop.texts.tier2: 13 damage; bleeding (save ends); or if the target has M < 2 they are beheaded
abilities.bredbeddle.bredbeddle.lop.texts.tier3: 16 damage; bleeding (save ends); or if the target has M < 3 they are beheaded
abilities.bredbeddle.bredbeddle.lop.texts.effect: 'Effect: A beheaded target has their head fall
  into an unoccupied square adjacent to the bredbeddle, but they remain alive. While beheaded this
  way, the target is bleeding and has line of effect only to adjacent squares. The beheaded target
  can survive without their head for 24 hours, and can reattach their head as a maneuver by entering
  its square. A target who remains beheaded for 24 hours dies.'
abilities.bredbeddle.bredbeddle.scramble.name: Scramble
abilities.bredbeddle.bredbeddle.scramble.texts.target: Self
abilities.bredbeddle.bredbeddle.scramble.texts.distance: Self
abilities.bredbeddle.bredbeddle.scramble.texts.effect: 'Effect: While the bredbeddle is headless,
  they shift up to their speed. Each time a creature comes adjacent to the bredbeddle during the
  shift, the bredbeddle can push that creature 1 square. Each square the bredbeddle exits during the
  shift is difficult terrain.'
abilities.bredbeddle.bredbeddle.headway.name: Headway
abilities.bredbeddle.bredbeddle.headway.texts.target: One creature or object
abilities.bredbeddle.bredbeddle.headway.texts.distance: Ranged 20
abilities.bredbeddle.bredbeddle.headway.texts.roll: Power Roll + 3
abilities.bredbeddle.bredbeddle.headway.texts.tier1: 9 damage; M < 1 dazed (save ends)
abilities.bredbeddle.bredbeddle.headway.texts.tier2: 13 damage; prone; M < 2 dazed (save ends)
abilities.bredbeddle.bredbeddle.headway.texts.tier3: 16 damage; prone; M < 3 dazed (save ends)
abilities.bredbeddle.bredbeddle.headway.texts.effect: 'Effect: The bredbeddle must have a head in
  their possession (attached to them or not), which they throw at the target. If the head was
  attached, the bredbeddle is left headless.'
abilities.bredbeddle.bredbeddle.envious-imitation.name: Envious Imitation
abilities.bredbeddle.bredbeddle.envious-imitation.texts.trigger: A creature targets the bredbeddle with a ranged strike.
abilities.bredbeddle.bredbeddle.envious-imitation.texts.target: Self
abilities.bredbeddle.bredbeddle.envious-imitation.texts.distance: Self
abilities.bredbeddle.bredbeddle.envious-imitation.texts.effect: "Effect: The bredbeddle uses the
  same ability against the triggering creature after the triggering strike is resolved, using that
  creature's bonus to any power rolls they make."
abilities.bredbeddle.bredbeddle.turn-green.name: Turn Green
abilities.bredbeddle.bredbeddle.turn-green.texts.target: Each enemy in the area
abilities.bredbeddle.bredbeddle.turn-green.texts.distance: 3 burst
abilities.bredbeddle.bredbeddle.turn-green.texts.roll: Power Roll + 3
abilities.bredbeddle.bredbeddle.turn-green.texts.tier1: P < 1 the target turns green (save ends)
abilities.bredbeddle.bredbeddle.turn-green.texts.tier2: P < 2 the target turns green (save ends)
abilities.bredbeddle.bredbeddle.turn-green.texts.tier3: P < 3 the target turns green until the end of the encounter
abilities.bredbeddle.bredbeddle.turn-green.texts.effect: "Effect: Green shadows crawl out from under
  the bredbeddle's feet and turn each target green. The bredbeddle has a double edge on power rolls
  against any target turned green this way."
abilities.bredbeddle.bredbeddle.challenge.name: Challenge
abilities.bredbeddle.bredbeddle.challenge.texts.target: One enemy
abilities.bredbeddle.bredbeddle.challenge.texts.distance: Ranged 5
abilities.bredbeddle.bredbeddle.challenge.texts.roll: Might test
abilities.bredbeddle.bredbeddle.challenge.texts.tier1: The target is beheaded (see Lop).
abilities.bredbeddle.bredbeddle.challenge.texts.tier2: The target makes the test again.
abilities.bredbeddle.bredbeddle.challenge.texts.tier3: The target can choose to deal 40 damage to the bredbeddle or remove the bredbeddle's head.
abilities.bredbeddle.bredbeddle.challenge.texts.effect: 'Effect: The bredbeddle points at the target
  and issues them a challenge. If the target refuses, they turn green until the end of the encounter
  (see Turn Green). If the target accepts the challenge, the bredbeddle shifts adjacent to the
  target, who makes a Might test with no additional modifiers.'
abilities.bredbeddle.bredbeddle.headlam-rampage.name: Headlam Rampage
abilities.bredbeddle.bredbeddle.headlam-rampage.texts.target: Four creatures
abilities.bredbeddle.bredbeddle.headlam-rampage.texts.distance: Melee 2
abilities.bredbeddle.bredbeddle.headlam-rampage.texts.roll: Power Roll + 3
abilities.bredbeddle.bredbeddle.headlam-rampage.texts.tier1: 6 damage; bleeding (save ends); or if the target has A < 1 they are beheaded (see Lop).
abilities.bredbeddle.bredbeddle.headlam-rampage.texts.tier2: 7 damage; bleeding (save ends); or if the target has A < 2 they are beheaded
abilities.bredbeddle.bredbeddle.headlam-rampage.texts.tier3: 8 damage; bleeding (save ends); or if the target has A < 3 they are beheaded
monsters.bredbeddle.bredbeddle.name: Bredbeddle
effects.bredbeddle.beheaded.name: Beheaded
effects.bredbeddle.beheaded.description: >-
  The target's head falls into an unoccupied square adjacent to the bredbeddle, but they remain
  alive. While beheaded this way, the target is bleeding and has line of effect only to adjacent
  squares. The beheaded target can survive without their head for 24 hours, and can reattach their
  head as a maneuver by entering its square. A target who remains beheaded for 24 hours dies.
effects.bredbeddle.green.name: Turned green
effects.bredbeddle.green.description: The bredbeddle has a double edge on power rolls against any target turned green this way.
