abilities.lightbender.lightbender.piercing-tails.texts.tier1: 8 damage
abilities.lightbender.lightbender.piercing-tails.texts.tier2: 12 damage; M < 1 bleeding (save ends)
abilities.lightbender.lightbender.piercing-tails.texts.tier3: 15 damage; M < 2 bleeding (save ends)
abilities.lightbender.lightbender.piercing-tails.texts.effect: 'Effect: While bleeding this way, the
  target takes a bane on tests to search for the lightbender while they are hidden.'
