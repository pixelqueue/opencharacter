malice.lightbender.silent-prowl.name: Silent Prowl
malice.lightbender.silent-prowl.description: Each lightbender acting this turn can teleport up to
  their speed as a move action and attempt to hide as a free maneuver, all until the start of their
  next turn.
malice.lightbender.duplicate.name: Duplicate
malice.lightbender.duplicate.description: Each lightbender acting this turn can create a duplicate
  lightbender in an unoccupied space adjacent to them. The duplicate is indistinguishable from the
  lightbender except by supernatural means, has 1 Stamina, and has the lightbender's speed. A
  duplicate acts on the lightbender's turn but can take only move actions. Once per round before or
  after using an ability, a lightbender can trade places with any lightbender duplicate.
malice.lightbender.everything-the-light-touches.name: Everything the Light Touches
malice.lightbender.everything-the-light-touches.description: Each lightbender in the encounter
  shines radiantly, distorting the senses of any enemy within 5 squares of them. Each affected enemy
  makes a Reason test.
malice.lightbender.everything-the-light-touches.texts.tier1: The target doesn't have line of effect to any lightbender (save ends).
malice.lightbender.everything-the-light-touches.texts.tier2: The target doesn't have line of effect to any lightbender (EoT).
malice.lightbender.everything-the-light-touches.texts.tier3: No effect.
abilities.lightbender.lightbender-pouncer.pounce.name: Pounce
abilities.lightbender.lightbender-pouncer.pounce.texts.target: Two creatures or objects
abilities.lightbender.lightbender-pouncer.pounce.texts.distance: Melee 2
abilities.lightbender.lightbender-pouncer.pounce.texts.roll: Power Roll + 2
abilities.lightbender.lightbender-pouncer.pounce.texts.tier1: 7 damage
abilities.lightbender.lightbender-pouncer.pounce.texts.tier2: 11 damage; A < 1 prone
abilities.lightbender.lightbender-pouncer.pounce.texts.tier3: 14 damage; A < 2 prone
abilities.lightbender.lightbender-pouncer.pounce.texts.effect: 'Effect: The pouncer can make a free strike against each target they knock prone.'
abilities.lightbender.lightbender-pouncer.sparkling-tail-whip.name: Sparkling Tail Whip
abilities.lightbender.lightbender-pouncer.sparkling-tail-whip.texts.target: Each enemy and object in the area
abilities.lightbender.lightbender-pouncer.sparkling-tail-whip.texts.distance: 2 burst
abilities.lightbender.lightbender-pouncer.sparkling-tail-whip.texts.roll: Power Roll + 2
abilities.lightbender.lightbender-pouncer.sparkling-tail-whip.texts.tier1: 4 damage
abilities.lightbender.lightbender-pouncer.sparkling-tail-whip.texts.tier2: 7 damage; A < 1 the target is dazzled (save ends)
abilities.lightbender.lightbender-pouncer.sparkling-tail-whip.texts.tier3: 10 damage; A < 2 the target is dazzled (save ends)
abilities.lightbender.lightbender-pouncer.sparkling-tail-whip.texts.effect: 'Effect: A dazzled target takes a bane on strikes and has line of effect only within 1 square.'
abilities.lightbender.lightbender-pouncer.illusory-feint.name: Illusory Feint
abilities.lightbender.lightbender-pouncer.illusory-feint.texts.target: Each enemy in the area
abilities.lightbender.lightbender-pouncer.illusory-feint.texts.distance: 3 cube within 10
abilities.lightbender.lightbender-pouncer.illusory-feint.texts.roll: Power Roll + 2
abilities.lightbender.lightbender-pouncer.illusory-feint.texts.tier1: I < 0 dazed (save ends)
abilities.lightbender.lightbender-pouncer.illusory-feint.texts.tier2: I < 1 dazed (save ends)
abilities.lightbender.lightbender-pouncer.illusory-feint.texts.tier3: I < 2 dazed (save ends)
abilities.lightbender.lightbender-pouncer.illusory-feint.texts.effect: 'Effect: While dazed this
  way, a target has speed 0. If a target takes damage, or if someone else uses a main action to
  shake the target out of their stupor, the dazed condition ends.'
abilities.lightbender.lightbender-pouncer.striking-afterimage.name: Striking Afterimage
abilities.lightbender.lightbender-pouncer.striking-afterimage.texts.trigger: The pouncer takes damage from a strike.
abilities.lightbender.lightbender-pouncer.striking-afterimage.texts.target: Self
abilities.lightbender.lightbender-pouncer.striking-afterimage.texts.distance: Self
abilities.lightbender.lightbender-pouncer.striking-afterimage.texts.effect: 'Effect: The pouncer
  halves the damage, ignores any nondamaging effects associated with it, and can teleport up to 5
  squares. If they teleport into concealment or cover, the pouncer can immediately attempt to hide
  as a free maneuver.'
traits.lightbender.lightbender-pouncer.avoidance.name: Avoidance
traits.lightbender.lightbender-pouncer.avoidance.description: Any effect on the pouncer that would
  be ended by a saving throw instead ends automatically at the end of their next turn.
monsters.lightbender.lightbender-pouncer.name: Lightbender Pouncer
abilities.lightbender.lightbender.flash-swipe.name: Flash Swipe
abilities.lightbender.lightbender.flash-swipe.texts.target: One creature or object
abilities.lightbender.lightbender.flash-swipe.texts.distance: Melee 2
abilities.lightbender.lightbender.flash-swipe.texts.roll: Power Roll + 2
abilities.lightbender.lightbender.flash-swipe.texts.tier1: 9 damage
abilities.lightbender.lightbender.flash-swipe.texts.tier2: 14 damage
abilities.lightbender.lightbender.flash-swipe.texts.tier3: 18 damage
abilities.lightbender.lightbender.flash-swipe.texts.effect: 'Effect: If this ability gains an edge or has a double edge, it deals an extra 4 damage.'
