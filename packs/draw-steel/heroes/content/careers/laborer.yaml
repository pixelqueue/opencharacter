id: careers.laborer
type: career
fields:
  skills:
    - skills.endurance
  languages: 1
  projectPoints: 120
effects:
  - target: skills.known
    op: grant
    value:
      item: skills.endurance
choices:
  - id: skills
    pick: 2
    from:
      type: skill
      where: item.group in ['crafting', 'exploration']
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.blacksmithing, @skills.lift, @skills.alchemy, @skills.architecture, @skills.carpentry, @skills.cooking, @skills.fletching, @skills.forgery, @skills.jewelry, @skills.mechanics, @skills.tailoring, @skills.climb, @skills.drive, @skills.endurance, @skills.gymnastics, @skills.heal, @skills.jump, @skills.navigate, @skills.ride, @skills.swim], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
  - id: languages
    pick: 1
    from:
      type: language
      where: item.kind != 'dead'
    eligible: '!(item.id in languages.known) || item.id in choice.picks'
    recommend: filterList([@languages.vaslorian, @languages.anjali, @languages.zaliac, @languages.yllyric, @languages.hyrallic, @languages.khoursirian, @languages.kalliak, @languages.vhoric, @languages.vastariax, @languages.axiomatic, @languages.voll, @languages.higaran, @languages.khemharic, @languages.oaxuatl, @languages.phaedran, @languages.riojan, @languages.uvalic, @languages.vaniric, @languages.filliaric, @languages.illyvric, @languages.kethaic, @languages.khelt, @languages.high-kuric, @languages.low-kuric, @languages.variac, @languages.zahariax, @languages.szetch, @languages.tholl, @languages.urollialic, @languages.mindspeech, @languages.proto-ctholl, @languages.the-first-language], !(x in languages.known))[0]
    activate: false
    effects:
      - target: languages.known
        op: grant
        value:
          formula: pick.id
  - id: perk
    unique: perks
    from:
      type: perk
      where: item.group == 'exploration'
    recommend: '@perks.exploration.brawny'
  - id: incident
    from:
      options:
        - id: deep-sentinel
        - id: disaster
        - id: embarrassment
        - id: live-the-dream
        - id: shining-light
        - id: slow-and-steady
    recommend: "'deep-sentinel'"
