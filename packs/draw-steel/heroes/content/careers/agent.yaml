id: careers.agent
type: career
fields:
  skills:
    - skills.sneak
  languages: 2
effects:
  - target: skills.known
    op: grant
    value:
      item: skills.sneak
choices:
  - id: interpersonal
    from:
      type: skill
      where: item.group in ['interpersonal']
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.lie, @skills.brag, @skills.empathize, @skills.flirt, @skills.gamble, @skills.handle-animals, @skills.interrogate, @skills.intimidate, @skills.lead, @skills.music, @skills.perform, @skills.persuade, @skills.read-person], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
  - id: intrigue
    from:
      type: skill
      where: item.group in ['intrigue']
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.disguise, @skills.alertness, @skills.conceal-object, @skills.eavesdrop, @skills.escape-artist, @skills.hide, @skills.pick-lock, @skills.pick-pocket, @skills.sabotage, @skills.search, @skills.sneak, @skills.track], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
  - id: languages
    pick: 2
    from:
      type: language
      where: item.kind != 'dead'
    eligible: '!(item.id in languages.known) || item.id in choice.picks'
    recommend: filterList([@languages.vaslorian, @languages.anjali, @languages.zaliac, @languages.yllyric, @languages.hyrallic, @languages.khoursirian, @languages.kalliak, @languages.vhoric, @languages.vastariax, @languages.axiomatic, @languages.voll, @languages.higaran, @languages.khemharic, @languages.oaxuatl, @languages.phaedran, @languages.riojan, @languages.uvalic, @languages.vaniric, @languages.filliaric, @languages.illyvric, @languages.kethaic, @languages.khelt, @languages.high-kuric, @languages.low-kuric, @languages.variac, @languages.zahariax, @languages.szetch, @languages.tholl, @languages.urollialic, @languages.mindspeech, @languages.proto-ctholl, @languages.the-first-language], !(x in languages.known))[0]
    activate: false
    effects:
      - target: languages.known
        op: grant
        value:
          formula: pick.id
  - id: perk
    unique: perks
    from:
      type: perk
      where: item.group == 'intrigue'
    recommend: '@perks.intrigue.forgettable-face'
  - id: incident
    from:
      options:
        - id: disavowed
        - id: faceless
        - id: free-agent
        - id: informed
        - id: spies-and-lovers
        - id: turncoat
    recommend: "'disavowed'"
