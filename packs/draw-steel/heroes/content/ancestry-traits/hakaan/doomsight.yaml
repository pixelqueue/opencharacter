id: ancestry-traits.hakaan.doomsight
type: ancestryTrait
fields:
  ancestry: ancestries.hakaan
  cost: 2
effects:
  # Doomed: a tier 3 outcome on tests and ability rolls, and no death however low Stamina falls.
  - target: { rolls: [power-roll.test, power-roll.ability], tally: autoTier3 }
    op: add
    value: 1
    when: hakaan.doomed
  - { target: stamina.dead, op: set, value: 'false', when: hakaan.doomed }
actions:
  - id: become-doomed
    available: '!hakaan.doomed'
    results: [doomed]
    steps:
      - id: doom
        kind: changes
        changes:
          - { type: set, field: hakaan.doomed, value: 'true' }
      - { id: done, kind: outcome, result: "'doomed'" }
