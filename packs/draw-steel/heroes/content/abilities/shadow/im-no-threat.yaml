id: abilities.shadow.im-no-threat
type: ability
tags:
  - kw.magic
fields:
  usage: maneuver
  kind: feature
  class: classes.shadow
  subclass: subclasses.shadow.harlequin-mask
  level: 1
  distanceKind: self
  spendCost: 1
effects:
  - target: { steps: [ability.after], from: self }
    op: changes
    value: { changes: [{ type: set, field: shadow.noThreat, value: 'true' }] }
  # While the illusion lasts: an edge on strikes and 1 more square of Disengage.
  - { target: { rolls: [kw.strike], tally: edges }, op: add, value: 1, when: shadow.noThreat }
  - { target: disengage, op: add, value: 1, when: shadow.noThreat }
  # Harming a creature ends it, with a surge.
  - target: { steps: [ability.hit] }
    op: changes
    when: >-
      shadow.noThreat && has(action.item.t1Damage) && flags.tier > 0
        && participant.id == participants.target[0].id
    value:
      to: self
      changes:
        - { type: set, field: shadow.noThreat, value: 'false' }
        - { type: adjust, field: surges.current, by: 1 }
actions:
  # Ending the illusion (no action), or another interaction ending it.
  - id: end-illusion
    available: shadow.noThreat
    results: [ended]
    steps:
      - id: end
        kind: changes
        changes: [{ type: set, field: shadow.noThreat, value: 'false' }]
      - { id: done, kind: outcome, result: "'ended'" }
