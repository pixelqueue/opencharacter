id: abilities.shadow.teamwork-has-its-place
type: ability
tags:
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  class: classes.shadow
  level: 1
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 5
  rollChars:
    - agility
  damageType: untyped
  t1Damage: 3
  t2Damage: 6
  t3Damage: 9
effects:
  - { target: shadow.conditionalSurge, op: set, value: 'true' }
  # The surge when an ally is adjacent to the target, gained before the power roll.
  - target: { steps: [ability.pay], from: self }
    op: changes
    when: situational.shadowConditionMet
    # Set from the value before the step, so the surge can pay for this ability's own surges.
    value:
      changes:
        - { type: set, field: surges.current, value: 'max(0, surges.current + 1 - params.surges)' }
