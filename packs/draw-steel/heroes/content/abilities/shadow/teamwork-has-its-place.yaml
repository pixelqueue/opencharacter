id: abilities.shadow.teamwork-has-its-place
type: ability
tags:
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  class: classes.shadow
  level: 1
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 5
  rollChars:
    - agility
  damageType: untyped
  t1Damage: 3
  t2Damage: 6
  t3Damage: 9
effects:
  - { target: shadow.conditionalSurge, op: set, value: 'true' }
  # The surge when an ally is adjacent to the target, gained before the ability's own surges
  # are spent, so they can use it.
  - target: { steps: [ability.pay], from: self }
    op: changes
    when: situational.shadowConditionMet
    value:
      order: before
      changes: [{ type: adjust, field: surges.current, by: 1 }]
