id: abilities.shadow.you-were-watching-the-wrong-one
type: ability
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: signature
  class: classes.shadow
  level: 1
  distanceKind: melee
  distance: 1
  rollChars:
    - agility
  damageType: untyped
  t1Damage: 3
  t2Damage: 5
  t3Damage: 8
effects:
  - { target: shadow.conditionalSurge, op: set, value: 'true' }
  # The surge when an ally is within 5 squares of the target.
  - target: { steps: [ability.pay], from: self }
    op: changes
    when: situational.shadowConditionMet
    # Before the ability's own surges are spent, so they can use it.
    value:
      order: before
      changes: [{ type: adjust, field: surges.current, by: 1 }]
