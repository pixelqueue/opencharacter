id: abilities.fury.deluge
type: ability
tags:
  - kw.area
  - kw.magic
  - kw.ranged
fields:
  usage: main-action
  kind: heroic
  class: classes.fury
  subclass: subclasses.fury.stormwight
  level: 9
  resource: ferocity
  cost: 11
  distanceKind: cube
  distance: 5
  within: 10
  rollChars:
    - might
  damageType: untyped
  t1Damage: 7
  t1AddsChar: false
  t2Damage: 10
  t2AddsChar: false
  t3Damage: 15
  t3AddsChar: false
effects:
  # The damage is the stormwight kit's primordial damage type, so immunity and weakness see it.
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value: [{ formula: "fury.primordialType == 'none' ? [] : ['damage.' + fury.primordialType]" }]
