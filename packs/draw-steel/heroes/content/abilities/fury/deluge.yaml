id: abilities.fury.deluge
type: ability
tags:
  - kw.area
  - kw.magic
  - kw.ranged
fields:
  usage: main-action
  kind: heroic
  class: classes.fury
  subclass: subclasses.fury.stormwight
  level: 9
  resource: ferocity
  cost: 11
  distanceKind: cube
  distance: 5
  within: 10
  rollChars:
    - might
  damageType: untyped
  t1Damage: 0
  t1AddsChar: false
  t2Damage: 0
  t2AddsChar: false
  t3Damage: 0
  t3AddsChar: false
effects:
  # The damage is the stormwight kit's primordial damage type: the tiers' damage ([7,10,15]) is
  # added here with that type's tag, so immunity and weakness see it.
  - target: { rolls: [damage], from: self }
    op: add
    when: roll.item.id == item.id
    value: 'flags.tier > 0 ? [7,10,15][flags.tier - 1] : 0'
    tags: [{ formula: "fury.primordialType == 'none' ? [] : ['damage.' + fury.primordialType]" }]
