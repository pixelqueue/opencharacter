id: abilities.fury.my-turn
type: ability
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: free-triggered
  kind: heroic
  class: classes.fury
  level: 5
  resource: ferocity
  cost: 9
  distanceKind: melee
  distance: 1
  rollChars:
    - might
  damageType: untyped
  t1Damage: 6
  t2Damage: 9
  t3Damage: 13
effects:
  # You can spend a Recovery.
  - target: { steps: [ability.after], from: self }
    op: changes
    when: >-
      recoveries.current > 0
    value:
      changes:
        - { type: adjust, field: recoveries.spent, by: 1 }
        - { type: adjust, field: stamina.current, by: recoveries.value, tags: [healing] }
