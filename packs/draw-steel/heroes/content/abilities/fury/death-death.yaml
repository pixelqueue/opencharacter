id: abilities.fury.death-death
type: ability
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: heroic
  class: classes.fury
  subclass: subclasses.fury.reaver
  level: 2
  resource: ferocity
  cost: 5
  distanceKind: melee
  distance: 1
  rollChars:
    - might
  damageType: untyped
  t1Damage: 3
  t1PotencyChar: presence
  t1Potency: weak
  t1Condition: conditions.dazed
  t1Duration: save
  t2Damage: 5
  t2PotencyChar: presence
  t2Potency: average
  t2Condition: conditions.dazed
  t2Duration: save
  t3Damage: 8
  t3PotencyChar: presence
  t3Potency: strong
  t3Condition: conditions.dazed
  t3Duration: save
effects:
  # The second condition, behind the same potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: >-
      flags.landed
    value:
      changes:
        - type: applyEffect
          source: "'conditions.frightened'"
          state: { duration: "'save'" }
