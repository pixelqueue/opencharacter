id: abilities.fury.blood-for-blood
type: ability
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: heroic
  class: classes.fury
  level: 1
  resource: ferocity
  cost: 5
  distanceKind: melee
  distance: 1
  rollChars:
    - might
  damageType: untyped
  t1Damage: 4
  t1PotencyChar: might
  t1Potency: weak
  t1Condition: conditions.bleeding
  t1Duration: save
  t2Damage: 6
  t2PotencyChar: might
  t2Potency: average
  t2Condition: conditions.bleeding
  t2Duration: save
  t3Damage: 10
  t3PotencyChar: might
  t3Potency: strong
  t3Condition: conditions.bleeding
  t3Duration: save
effects:
  # The second condition, behind the same potency.
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: >-
      flags.landed
    value:
      changes:
        - type: applyEffect
          source: "'conditions.weakened'"
          state: { duration: "'save'" }
