id: abilities.censor.edict-of-purifying-pacifism
type: ability
tags:
  - censor-aura
  - kw.area
  - kw.magic
fields:
  usage: maneuver
  kind: heroic
  class: classes.censor
  level: 3
  resource: wrath
  cost: 7
  distanceKind: aura
  distance: 2
# The aura is this ability applied to you until the end of the encounter or until you are dying.
state:
  duration: { type: string, default: encounter }
reapply: { state: { duration: replace } }
effects:
  - target: { steps: [ability.after], from: self }
    op: changes
    value:
      changes:
        - {
            type: applyEffect,
            source: "'abilities.censor.edict-of-purifying-pacifism'",
            state: { duration: "'encounter'" },
          }
actions:
  # When a target makes a strike: holy damage equal to twice your Presence score, 2d6 more to the
  # judged creature.
  - id: punish
    scope: applied
    tags: [ability]
    participants:
      target: { fields: creature, min: 1 }
    results: [used]
    steps:
      - id: extra
        kind: roll
        each: target
        tags: [damage]
        parts:
          - value: 0
          - dice: 2d6
            when: (censor.judged != '' && participant.id == censor.judged)
      - id: hit
        kind: changes
        each: target
        to: target
        changes:
          - type: adjust
            field: stamina.current
            by: >-
              -(2 * characteristics.presence.score + steps.extra.total)
            tags: [damage, damage.holy]
      - { id: done, kind: outcome, result: "'used'" }
