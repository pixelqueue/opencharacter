id: abilities.censor.apostate
type: ability
tags:
  - kw.melee
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: heroic
  class: classes.censor
  subclass: subclasses.censor.paragon
  level: 9
  resource: wrath
  cost: 11
  distanceKind: melee
  distance: 1
  rollChars:
    - might
  damageType: holy
  t1Damage: 13
  t2Damage: 19
  t3Damage: 26
# Damage weakness 10 until the end of the encounter: this ability applied to the target.
state:
  duration: { type: string, default: encounter }
  by: { type: string, default: '' }
reapply: { state: { duration: replace, by: replace } }
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: 'action.item.id == item.id && (flags.tier > 0)'
    value:
      changes:
        - type: applyEffect
          source: "'abilities.censor.apostate'"
          state: { duration: "'encounter'", by: character.id }
  - { target: weakness.all, op: add, value: 10, scope: applied }
