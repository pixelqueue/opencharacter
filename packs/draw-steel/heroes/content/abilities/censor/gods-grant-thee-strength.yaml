id: abilities.censor.gods-grant-thee-strength
type: ability
tags:
  - kw.ranged
fields:
  usage: main-action
  kind: heroic
  class: classes.censor
  level: 5
  resource: wrath
  cost: 9
  distanceKind: ranged
  distance: 10
effects:
  # The target (you, with no target given) ends its save-ends and end-of-turn effects, stands up
  # and gains 2 surges.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - { type: adjust, field: surges.current, by: 2 }
        - type: removeEffect
          applied:
            where: >-
              (has(self.duration) && self.duration in ['save', 'eot']) || item.id == @conditions.prone
  - target: { steps: [ability.after], from: self }
    op: changes
    when: 'size(participants.target) == 0'
    value:
      changes:
        - { type: adjust, field: surges.current, by: 2 }
        - type: removeEffect
          applied:
            where: >-
              (has(self.duration) && self.duration in ['save', 'eot']) || item.id == @conditions.prone
