id: abilities.censor.it-is-justice-you-fear
type: ability
tags:
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: heroic
  class: classes.censor
  subclass: subclasses.censor.exorcist
  level: 2
  resource: wrath
  cost: 5
  distanceKind: ranged
  distance: 10
  rollChars:
    - might
  damageType: holy
  t1Damage: 8
  t1PotencyChar: presence
  t1Potency: weak
  t1Condition: conditions.frightened
  t1Duration: save
  t2Damage: 12
  t2PotencyChar: presence
  t2Potency: average
  t2Condition: conditions.frightened
  t2Duration: save
  t3Damage: 15
  t3PotencyChar: presence
  t3Potency: strong
  t3Condition: conditions.frightened
  t3Duration: save
effects:
  # A target already frightened takes psychic damage equal to twice your Presence score instead
  # of being frightened.
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: 'flags.landed && participant.conditions.frightened'
    value:
      flags: { landed: 'false' }
      changes:
        - type: adjust
          field: stamina.current
          by: -2 * characteristics.presence.score
          tags: [damage, damage.psychic]
