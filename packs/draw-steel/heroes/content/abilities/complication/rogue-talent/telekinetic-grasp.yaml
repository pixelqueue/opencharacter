# Used as a ranged free strike; push or pull, chosen on each use.
id: abilities.complication.rogue-talent.telekinetic-grasp
type: ability
tags:
  - kw.psionic
  - kw.ranged
  - kw.strike
fields:
  usage: maneuver
  kind: free-strike
  distanceKind: ranged
  distance: 10
  rollChars:
    - might
    - intuition
    - presence
  t1Move: push
  t1MoveDistance: 1
  t2Move: push
  t2MoveDistance: 2
  t3Move: push
  t3MoveDistance: 3
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      direction: { type: enum, values: [push, pull], default: push }
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: "flags.move != ''"
    value:
      flags: { move: params.direction }
