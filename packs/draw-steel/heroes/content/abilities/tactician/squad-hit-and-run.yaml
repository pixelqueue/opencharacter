# Pass the two allies as targets: each gains 2 surges, and so do you.
id: abilities.tactician.squad-hit-and-run
type: ability
tags:
  - kw.ranged
fields:
  usage: main-action
  kind: heroic
  class: classes.tactician
  subclass: subclasses.tactician.insurgent
  level: 9
  resource: focus
  cost: 11
  distanceKind: ranged
  distance: 10
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value: { changes: [{ type: adjust, field: surges.current, by: 2 }] }
  - target: { steps: [ability.after], from: self }
    op: changes
    value: { changes: [{ type: adjust, field: surges.current, by: 2 }] }
