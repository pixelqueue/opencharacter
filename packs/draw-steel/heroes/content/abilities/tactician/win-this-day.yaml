# Pass the allies in the area as targets: each gains 2 surges, and so do you.
id: abilities.tactician.win-this-day
type: ability
tags:
  - kw.area
fields:
  usage: main-action
  kind: heroic
  class: classes.tactician
  level: 5
  resource: focus
  cost: 9
  distanceKind: burst
  distance: 3
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value: { changes: [{ type: adjust, field: surges.current, by: 2 }] }
  - target: { steps: [ability.after], from: self }
    op: changes
    value: { changes: [{ type: adjust, field: surges.current, by: 2 }] }
