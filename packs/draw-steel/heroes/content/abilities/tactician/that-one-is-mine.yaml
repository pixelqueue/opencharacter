# Marks the target.
id: abilities.tactician.that-one-is-mine
type: ability
tags:
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: heroic
  class: classes.tactician
  subclass: subclasses.tactician.vanguard
  level: 9
  resource: focus
  cost: 11
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 5
  rollChars:
    - might
  damageType: untyped
  t1Damage: 8
  t2Damage: 13
  t3Damage: 17
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: action.item.id == item.id
    value:
      changes:
        - type: applyEffect
          source: "'features.tactician.marked'"
          state: { duration: "'encounter'", by: character.id }
  - target: { steps: [ability.after], from: self }
    op: changes
    when: action.item.id == item.id
    value:
      changes:
        - type: set
          field: tactician.marked
          value: >-
            tactician.marked + filterList(mapList(participants.target, x.id), !(x in tactician.marked))
