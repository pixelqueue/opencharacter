# On a tier 3 outcome you spend a Recovery (on tiers 1 and 2, you or an ally can).
id: abilities.tactician.inspiring-strike
type: ability
tags:
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: heroic
  class: classes.tactician
  level: 1
  resource: focus
  cost: 3
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 5
  rollChars:
    - might
  damageType: untyped
  t1Damage: 3
  t2Damage: 5
  t3Damage: 8
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: >-
      flags.tier == 3 && recoveries.current > 0 && participant.id == participants.target[0].id
    value:
      to: self
      changes:
        - { type: adjust, field: recoveries.spent, by: 1 }
        - { type: adjust, field: stamina.current, by: recoveries.value, tags: [healing] }
