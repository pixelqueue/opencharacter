id: abilities.tactician.inspiring-strike
type: ability
tags:
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: heroic
  class: classes.tactician
  level: 1
  resource: focus
  cost: 3
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 5
  rollChars:
    - might
  damageType: untyped
  t1Damage: 3
  t2Damage: 5
  t3Damage: 8
effects:
  # You or the `ally` participant can spend a Recovery; on tier 3, you both can (the edges are the
  # table's).
  - target: { steps: [ability.after], from: self }
    op: changes
    when: >-
      has(steps.roll) && size(participants.target) > 0 && recoveries.current > 0
        && stamina.current < stamina.max
        && (size(participants.ally) == 0 || steps.roll.bandValue == 3)
    value: { changes: [{ type: offerFollowUp, followUp: spend-recovery }] }
  - target: { steps: [ability.after], from: self }
    op: changes
    when: has(steps.roll) && size(participants.target) > 0 && size(participants.ally) > 0
    value:
      to: ally
      changes:
        - { type: adjust, field: recoveries.spent, by: 1, tags: [recovery.granted] }
