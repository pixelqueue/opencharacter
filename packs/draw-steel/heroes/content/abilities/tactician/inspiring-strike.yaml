# You can spend a Recovery (on tier 3, you and an ally can); the edges on tier 3 are the table's.
id: abilities.tactician.inspiring-strike
type: ability
tags:
  - kw.melee
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: heroic
  class: classes.tactician
  level: 1
  resource: focus
  cost: 3
  distanceKind: melee-or-ranged
  distance: 1
  rangedDistance: 5
  rollChars:
    - might
  damageType: untyped
  t1Damage: 3
  t2Damage: 5
  t3Damage: 8
effects:
  # You can spend a Recovery (an ally's is theirs to take).
  - target: { steps: [ability.after], from: self }
    op: changes
    when: has(steps.roll) && size(participants.target) > 0 && recoveries.current > 0 && stamina.current < stamina.max
    value: { changes: [{ type: offerFollowUp, followUp: spend-recovery }] }
