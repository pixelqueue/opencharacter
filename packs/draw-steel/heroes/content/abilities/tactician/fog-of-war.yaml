# Marks each target.
id: abilities.tactician.fog-of-war
type: ability
tags:
  - kw.ranged
fields:
  usage: maneuver
  kind: heroic
  class: classes.tactician
  subclass: subclasses.tactician.insurgent
  level: 2
  resource: focus
  cost: 5
  distanceKind: ranged
  distance: 10
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: applyEffect
          source: "'features.tactician.marked'"
          state: { duration: "'encounter'" }
