id: abilities.tactician.no-dying-on-my-watch
type: ability
tags:
  - kw.ranged
  - kw.strike
  - kw.weapon
fields:
  usage: triggered
  kind: heroic
  class: classes.tactician
  subclass: subclasses.tactician.vanguard
  level: 2
  resource: focus
  cost: 5
  distanceKind: ranged
  distance: 5
  rollChars:
    - might
  t1PotencyChar: reason
  t1Potency: weak
  t1Condition: conditions.frightened
  t1Duration: save
  t2PotencyChar: reason
  t2Potency: average
  t2Condition: conditions.frightened
  t2Duration: save
  t3PotencyChar: reason
  t3Potency: strong
  t3Condition: conditions.frightened
  t3Duration: save
  allyImposes: true
# The triggering ally is the `ally` participant: the target is frightened of them, and they spend
# a Recovery and gain 5 temporary Stamina for each enemy you came adjacent to (`adjacentEnemies`).
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      adjacentEnemies: { type: integer, default: 0, min: 0 }
  - target: { steps: [ability.after], from: self }
    op: changes
    when: size(participants.ally) > 0
    value:
      to: ally
      changes:
        - { type: adjust, field: recoveries.spent, by: 1, tags: [recovery.granted] }
        - type: adjust
          when: params.adjacentEnemies > 0
          field: stamina.temp
          by: 5 * params.adjacentEnemies
