# Push one creature or object: adjacent, push 3; at 5th level within 3, push 4; at 9th level
# within 6, push 5 and slowed until the end of their next turn.
id: abilities.treasure.kings-roar.roar
type: ability
tags: [kw.magic]
fields: { usage: maneuver, kind: treasure, distanceKind: melee, distance: 1 }
effects:
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      flags: { move: "'push'", moveDistance: 'level >= 9 ? 5 : level >= 5 ? 4 : 3' }
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: level >= 9
    value:
      changes:
        - type: applyEffect
          source: '@conditions.slowed'
          state: { duration: "'eot'" }
