id: abilities.null.inertial-absorption
type: ability
tags:
  - kw.psionic
fields:
  usage: free-triggered
  kind: heroic
  class: classes.null
  subclass: subclasses.null.metakinetic
  level: 9
  resource: discipline
  cost: 11
  distanceKind: self
effects:
  # Halving is the `inertialAbsorption` choice on the damage; the 3 surges come with the use.
  - { target: nullClass.inertialAbsorption, op: set, value: 'true' }
  - target: { steps: [ability.after], from: self }
    op: changes
    value:
      changes:
        - { type: adjust, field: surges.current, by: 3 }
