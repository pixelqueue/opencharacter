id: abilities.null.stunning-blow
type: ability
tags:
  - kw.melee
  - kw.psionic
  - kw.strike
  - kw.weapon
fields:
  usage: main-action
  kind: heroic
  class: classes.null
  level: 1
  resource: discipline
  cost: 3
  distanceKind: melee
  distance: 1
  rollChars:
    - agility
  damageType: untyped
  t1Damage: 4
  t1PotencyChar: intuition
  t1Potency: weak
  t1Condition: conditions.dazed
  t1Duration: save
  t2Damage: 5
  t2PotencyChar: intuition
  t2Potency: average
  t2Condition: conditions.dazed
  t2Duration: save
  t3Damage: 7
  t3PotencyChar: intuition
  t3Potency: strong
  t3Condition: conditions.dazed
  t3Duration: save
effects:
  # Dazed and slowed (save ends): the second condition with the first.
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: flags.landed
    value:
      changes:
        - type: applyEffect
          source: "'conditions.slowed'"
          state: { duration: "'save'" }
