id: abilities.null.null-field
type: ability
tags:
  - kw.area
  - kw.psionic
fields:
  usage: maneuver
  kind: feature
  class: classes.null
  level: 1
  distanceKind: aura
  distance: 1
# The field on each enemy inside: its potencies drop by 1 (once, however many nulls' fields hold
# it), and with Synaptic Break bought, potencies used against it are 1 higher (it resists as if 1
# lower). Inertial Anchor (no shifting for a creature who starts its turn inside) and Gravitic
# Disruption (a slide on damage) need positions and turns, and stay the table's.
auras:
  - id: field
    when: nullClass.fieldActive
    size: nullClass.fieldSize
    affects: enemies
    fields:
      nullClass.fieldEffect:
        type: enum
        values: [none, gravitic-disruption, inertial-anchor, synaptic-break]
        default: none
    effects:
      - { target: potency.bonus, op: add, value: -1, stackKey: null-field }
      - target: 'potency.resistBonus.might'
        op: add
        value: -1
        stackKey: synaptic-break
        when: applier.nullClass.fieldEffect == 'synaptic-break'
      - target: 'potency.resistBonus.agility'
        op: add
        value: -1
        stackKey: synaptic-break
        when: applier.nullClass.fieldEffect == 'synaptic-break'
      - target: 'potency.resistBonus.reason'
        op: add
        value: -1
        stackKey: synaptic-break
        when: applier.nullClass.fieldEffect == 'synaptic-break'
      - target: 'potency.resistBonus.intuition'
        op: add
        value: -1
        stackKey: synaptic-break
        when: applier.nullClass.fieldEffect == 'synaptic-break'
      - target: 'potency.resistBonus.presence'
        op: add
        value: -1
        stackKey: synaptic-break
        when: applier.nullClass.fieldEffect == 'synaptic-break'
effects:
  - target: { steps: [ability.after], from: self }
    op: changes
    value:
      changes:
        - { type: set, field: nullClass.fieldActive, value: 'true' }
actions:
  # Once on each of the null's turns, a free maneuver: 1 discipline for an extra effect until the
  # start of their next turn.
  - id: empower
    available: >-
      combat.active && nullClass.fieldActive && nullClass.fieldEffect == 'none'
        && heroic.current - 1 >= heroic.min
    params:
      effect: { type: enum, values: [gravitic-disruption, inertial-anchor, synaptic-break] }
    results: [empowered]
    steps:
      - id: pay
        kind: changes
        changes:
          - { type: adjust, field: heroic.current, by: -1 }
          - { type: set, field: nullClass.fieldEffect, value: params.effect }
      - { id: done, kind: outcome, result: "'empowered'" }
  # Ending the field willingly (no action).
  - id: end
    available: nullClass.fieldActive
    results: [ended]
    steps:
      - id: end
        kind: changes
        changes:
          - { type: set, field: nullClass.fieldActive, value: 'false' }
      - { id: done, kind: outcome, result: "'ended'" }
followUps:
  # The field ends when the null is dying.
  - id: dying
    becomes: stamina.dying && nullClass.fieldActive
    required: true
    changes:
      - { type: set, field: nullClass.fieldActive, value: 'false' }
