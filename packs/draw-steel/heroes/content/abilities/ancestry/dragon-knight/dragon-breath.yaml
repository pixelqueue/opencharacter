# The damage type is the `breathType` parameter, chosen on each use: it types the ability's damage.
id: abilities.ancestry.dragon-knight.dragon-breath
type: ability
tags: [kw.area, kw.magic]
fields:
  usage: main-action
  kind: signature
  distanceKind: cube
  distance: 3
  within: 1
  rollChars: [might, presence]
  t1Damage: 2
  t2Damage: 4
  t3Damage: 6
  t1AddsChar: false
  t2AddsChar: false
  t3AddsChar: false
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      breathType:
        type: enum
        values: [acid, cold, corruption, fire, lightning, poison]
        default: fire
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value: [{ formula: "'damage.' + params.breathType" }]
