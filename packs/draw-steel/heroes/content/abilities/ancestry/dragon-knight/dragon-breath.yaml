# The damage type is the `breathType` parameter, chosen on each use, so the damage (2/4/6) is
# added by the effect below with that type's tag; the tier fields hold 0, and the card's damage
# values are the item's own.
id: abilities.ancestry.dragon-knight.dragon-breath
type: ability
tags: [kw.area, kw.magic]
fields:
  usage: main-action
  kind: signature
  distanceKind: cube
  distance: 3
  within: 1
  rollChars: [might, presence]
  t1Damage: 0
  t2Damage: 0
  t3Damage: 0
  t1AddsChar: false
  t2AddsChar: false
  t3AddsChar: false
computed:
  damage1: { type: integer, formula: '2' }
  damage2: { type: integer, formula: '4' }
  damage3: { type: integer, formula: '6' }
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      breathType:
        type: enum
        values: [acid, cold, corruption, fire, lightning, poison]
        default: fire
  - target: { rolls: [damage], from: self }
    op: add
    value: '[2, 4, 6][(flags.tier > 0 ? flags.tier : steps.roll.bandValue) - 1]'
    tags: [{ formula: "'damage.' + params.breathType" }]
