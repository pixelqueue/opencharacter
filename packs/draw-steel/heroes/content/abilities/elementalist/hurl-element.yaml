# The damage type is the `element` parameter, chosen on each use, so the damage (2/4/6 + Reason)
# is added by the effect below with that type's tag; the tier fields hold 0, and the card's
# damage values are the item's own.
id: abilities.elementalist.hurl-element
type: ability
tags:
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: free-strike
  class: classes.elementalist
  level: 1
  distanceKind: ranged
  distance: 10
  rollChars:
    - reason
  damageType: untyped
  t1Damage: 0
  t1AddsChar: false
  t2Damage: 0
  t2AddsChar: false
  t3Damage: 0
  t3AddsChar: false
computed:
  damage1: { type: integer, formula: 2 + self.charScore }
  damage2: { type: integer, formula: 4 + self.charScore }
  damage3: { type: integer, formula: 6 + self.charScore }
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      element:
        type: enum
        values: [acid, cold, corruption, fire, lightning, poison, sonic]
        default: fire
  - target: { rolls: [damage], from: self }
    op: add
    value: >-
      [2, 4, 6][(flags.tier > 0 ? flags.tier : steps.roll.bandValue) - 1]
        + (flags.char == 'none' ? 0 : fieldOf('characteristics.{characteristic}.score', flags.char))
    tags: [{ formula: "'damage.' + params.element" }]
