# The damage type is the `element` parameter, chosen on each use: it types the ability's damage.
id: abilities.elementalist.hurl-element
type: ability
tags:
  - kw.magic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: free-strike
  class: classes.elementalist
  level: 1
  distanceKind: ranged
  distance: 10
  rollChars:
    - reason
  damageType: untyped
  t1Damage: 2
  t2Damage: 4
  t3Damage: 6
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      element:
        type: enum
        values: [acid, cold, corruption, fire, lightning, poison, sonic]
        default: fire
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value: [{ formula: "'damage.' + params.element" }]
