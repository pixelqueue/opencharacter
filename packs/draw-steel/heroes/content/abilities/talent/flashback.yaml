id: abilities.talent.flashback
type: ability
tags:
  - kw.chronopathy
  - kw.psionic
  - kw.ranged
fields:
  usage: maneuver
  kind: heroic
  class: classes.talent
  level: 1
  resource: clarity
  cost: 5
  distanceKind: ranged
  distance: 10
effects:
  - target:
      steps:
        - ability.after
      from: self
    op: changes
    when: (combat.active && heroic.current - item.cost - params.spend - flags.extra < 0)
      || (has(params.talentStrain) && params.talentStrain)
    value:
      changes:
        - type: adjust
          field: stamina.current
          by: -1d6
          tags: [damage, talent.strain]
        - type: applyEffect
          source: "'conditions.slowed'"
          state:
            duration: "'save'"
