id: abilities.talent.kinetic-pulse
type: ability
tags:
  - kw.area
  - kw.psionic
  - kw.telepathy
fields:
  usage: main-action
  kind: signature
  class: classes.talent
  level: 1
  distanceKind: burst
  distance: 1
  rollChars:
    - reason
  damageType: psychic
  t1Damage: 2
  t1AddsChar: false
  t2Damage: 5
  t2AddsChar: false
  t2Move: push
  t2MoveDistance: 1
  t3Damage: 7
  t3AddsChar: false
  t3Move: push
  t3MoveDistance: 2
effects:
  - target:
      steps:
        - ability.after
      from: self
    op: changes
    when: (combat.active && heroic.current - item.cost - params.spend - flags.extra < 0)
      || (has(params.talentStrain) && params.talentStrain)
    value:
      changes:
        - type: applyEffect
          source: "'conditions.bleeding'"
          state:
            duration: "'next-start'"
