id: abilities.talent.rejuvenate
type: ability
tags:
  - kw.chronopathy
  - kw.psionic
  - kw.ranged
fields:
  usage: maneuver
  kind: heroic
  class: classes.talent
  level: 8
  resource: clarity
  cost: 11
  distanceKind: ranged
  distance: 10
effects:
  - target:
      steps:
        - ability.after
      from: self
    op: changes
    when: (combat.active && heroic.current - item.cost - params.spend - flags.extra < 0)
      || (has(params.talentStrain) && params.talentStrain)
    value:
      changes:
        - type: applyEffect
          source: "'conditions.weakened'"
          state:
            duration: "'save'"
        - type: applyEffect
          source: "'conditions.slowed'"
          state:
            duration: "'save'"
