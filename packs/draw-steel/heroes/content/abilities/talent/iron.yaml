id: abilities.talent.iron
type: ability
tags:
  - kw.metamorphosis
  - kw.psionic
  - kw.ranged
fields:
  usage: maneuver
  kind: heroic
  class: classes.talent
  level: 1
  resource: clarity
  cost: 5
  distanceKind: ranged
  distance: 10
effects:
  - target:
      steps:
        - ability.hit
      from: self
    op: changes
    value:
      changes:
        - type: set
          field: stamina.temp
          value: 10
        - type: adjust
          field: surges.current
          by: 2
  - target:
      steps:
        - ability.after
      from: self
    op: changes
    when: size(participants.target) == 0
    value:
      changes:
        - type: set
          field: stamina.temp
          value: max(stamina.temp, 10)
        - type: adjust
          field: surges.current
          by: 2
