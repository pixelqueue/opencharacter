id: abilities.talent.smolder
type: ability
tags:
  - kw.psionic
  - kw.pyrokinesis
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: heroic
  class: classes.talent
  level: 1
  resource: clarity
  cost: 3
  distanceKind: ranged
  distance: 10
  rollChars:
    - reason
  damageType: untyped
  t1Damage: 3
  t1PotencyChar: reason
  t1Potency: weak
  t2Damage: 6
  t2PotencyChar: reason
  t2Potency: average
  t3Damage: 9
  t3PotencyChar: reason
  t3Potency: strong
# The damage type and the weakness are the `smolderType` parameter, chosen on each use: it types
# the ability's damage. The weakness is this ability applied to the target (save ends), behind a
# Reason potency.
state:
  duration: { type: string, default: save }
  type: { type: string, default: fire }
  value: { type: integer, default: 5, min: 0 }
reapply: { state: { duration: replace, value: highest } }
effects:
  - target: { actions: [ability], from: self }
    op: params
    value:
      smolderType: { type: enum, values: [acid, corruption, fire], default: fire }
  - target: { rolls: [damage], parts: [ability.damage], from: self }
    op: tag
    value: [{ formula: "'damage.' + params.smolderType" }]
  - target: { steps: [ability.hit], from: self }
    op: changes
    when: >-
      flags.tier > 0
        && participant.characteristics.reason.score + participant.potency.resistBonus.reason
          < [potency.weak, potency.average, potency.strong][flags.tier - 1]
    value:
      changes:
        - type: applyEffect
          source: "'abilities.talent.smolder'"
          state:
            duration: "'save'"
            type: params.smolderType
            value: 'flags.tier == 3 ? 5 + characteristics.reason.score : 5'
  - {
      target: weakness.acid,
      op: atLeast,
      value: self.value,
      when: "self.type == 'acid'",
      scope: applied,
    }
  - target: weakness.corruption
    op: atLeast
    value: self.value
    when: "self.type == 'corruption'"
    scope: applied
  - {
      target: weakness.fire,
      op: atLeast,
      value: self.value,
      when: "self.type == 'fire'",
      scope: applied,
    }
  # Strained: 1d6 damage, and no triggered actions (save ends).
  - target: { steps: [ability.after], from: self }
    op: changes
    when: >-
      (combat.active && heroic.current - item.cost - params.spend - flags.extra < 0)
        || (has(params.talentStrain) && params.talentStrain)
    value:
      changes:
        - { type: adjust, field: stamina.current, by: -1d6, tags: [damage, talent.strain] }
        - type: applyEffect
          source: "'effects.talent.no-triggered'"
          state: { duration: "'save'" }
actions:
  - use: saving-throw
    scope: applied
    available: "self.duration == 'save'"
    params: { entry: self.id }
