id: abilities.talent.spirit-sword
type: ability
tags:
  - kw.animapathy
  - kw.melee
  - kw.psionic
  - kw.strike
fields:
  usage: main-action
  kind: signature
  class: classes.talent
  level: 1
  distanceKind: melee
  distance: 2
  rollChars:
    - presence
  damageType: untyped
  t1Damage: 3
  t2Damage: 6
  t3Damage: 9
effects:
  - target:
      steps:
        - ability.after
      from: self
    op: changes
    value:
      changes:
        - type: adjust
          field: surges.current
          by: 1
  - target:
      rolls:
        - damage
      from: self
    op: add
    value: 3
    when: (combat.active && heroic.current - item.cost - params.spend - flags.extra < 0)
      || (has(params.talentStrain) && params.talentStrain)
  - target:
      steps:
        - ability.after
      from: self
    op: changes
    when: (combat.active && heroic.current - item.cost - params.spend - flags.extra < 0)
      || (has(params.talentStrain) && params.talentStrain)
    value:
      changes:
        - type: adjust
          field: stamina.current
          by: -3
          tags:
            - damage
            - damage.unreducible
            - talent.strain
