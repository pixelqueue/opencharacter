id: abilities.talent.hoarfrost
type: ability
tags:
  - kw.cryokinesis
  - kw.psionic
  - kw.ranged
  - kw.strike
fields:
  usage: main-action
  kind: signature
  class: classes.talent
  level: 1
  distanceKind: ranged
  distance: 10
  rollChars:
    - reason
  damageType: cold
  t1Damage: 2
  t1PotencyChar: might
  t1Potency: weak
  t1Condition: conditions.slowed
  t1Duration: eot
  t2Damage: 4
  t2PotencyChar: might
  t2Potency: average
  t2Condition: conditions.slowed
  t2Duration: eot
  t3Damage: 6
  t3PotencyChar: might
  t3Potency: strong
  t3Condition: conditions.slowed
  t3Duration: eot
effects:
  - target:
      steps:
        - ability.after
      from: self
    op: changes
    when: (combat.active && heroic.current - item.cost - params.spend - flags.extra < 0)
      || (has(params.talentStrain) && params.talentStrain)
    value:
      changes:
        - type: applyEffect
          source: "'conditions.slowed'"
          state:
            duration: "'next-end'"
  - target:
      steps:
        - ability.hit
      from: self
    op: changes
    when: ((combat.active && heroic.current - item.cost - params.spend - flags.extra <
      0) || (has(params.talentStrain) && params.talentStrain)) && flags.landed
    value:
      changes:
        - type: applyEffect
          source: "'conditions.restrained'"
          state:
            duration: "'eot'"
