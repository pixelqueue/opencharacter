id: abilities.troubadour.ballad-of-the-beast
type: ability
tags:
  - kw.area
  - kw.magic
  - kw.performance
fields:
  usage: no-action
  kind: feature
  class: classes.troubadour
  subclass: subclasses.troubadour.virtuoso
  level: 1
  distanceKind: aura
  distance: 5
effects:
  # You start your turns in your own aura: 1 surge.
  - target: { steps: [turn.start] }
    op: changes
    when: (item.id == troubadour.performance || item.id == troubadour.performance2)
    value:
      changes:
        - { type: adjust, field: surges.current, by: 1 }
