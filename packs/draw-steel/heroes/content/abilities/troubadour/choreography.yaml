id: abilities.troubadour.choreography
type: ability
tags:
  - kw.area
  - kw.magic
  - kw.performance
fields:
  usage: no-action
  kind: feature
  class: classes.troubadour
  level: 1
  distanceKind: aura
  distance: 5
effects:
  # You start your turns in your own aura: +2 speed while it's active.
  - {
      target: speed,
      op: add,
      value: 2,
      when: (item.id == troubadour.performance || item.id == troubadour.performance2),
    }
