id: abilities.conduit.hands-of-the-maker
type: ability
tags:
  - kw.magic
fields:
  usage: maneuver
  kind: feature
  class: classes.conduit
  subclass: subclasses.conduit.creation
  level: 1
  distanceKind: self
computed:
  # The holder's characteristic: Intuition, a Censor's Presence.
  domainChar:
    type: string
    formula: "countCopies(copy.item == @classes.censor) > 0 ? 'characteristics.presence.score' : 'characteristics.intuition.score'"
