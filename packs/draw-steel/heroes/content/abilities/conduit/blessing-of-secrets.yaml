id: abilities.conduit.blessing-of-secrets
type: ability
tags:
  - kw.area
  - kw.magic
fields:
  usage: maneuver
  kind: feature
  class: classes.conduit
  subclass: subclasses.conduit.trickery
  level: 4
  distanceKind: aura
  distance: 3
# The aura is this ability applied to you until you end it or someone in it harms a creature or
# object (removing it is the table's): you and each ally inside have a double edge on tests to hide
# or sneak.
state:
  duration: { type: string, default: until }
reapply: { state: { duration: replace } }
auras:
  - id: secrets
    scope: applied
    size: item.distance
    affects: allies
    effects:
      - target: { rolls: [power-roll.test], tally: edges }
        op: add
        value: 2
        when: has(params.skill) && params.skill in [@skills.hide, @skills.sneak]
effects:
  - target: { steps: [ability.after], from: self }
    op: changes
    value:
      changes:
        - {
            type: applyEffect,
            source: "'abilities.conduit.blessing-of-secrets'",
            state: { duration: "'until'" },
          }
  - target: { rolls: [power-roll.test], tally: edges }
    op: add
    value: 2
    when: has(params.skill) && params.skill in [@skills.hide, @skills.sneak]
    scope: applied
