id: abilities.conduit.blessing-of-steel
type: ability
tags:
  - kw.area
  - kw.magic
fields:
  usage: maneuver
  kind: heroic
  class: classes.conduit
  level: 8
  resource: piety
  cost: 11
  distanceKind: aura
  distance: 5
# The aura is this ability applied to you until the end of the encounter: you and each ally inside
# have damage immunity 5, and ability rolls against you take a bane.
state:
  duration: { type: string, default: encounter }
reapply: { state: { duration: replace } }
auras:
  - id: steel
    scope: applied
    size: item.distance
    affects: allies
    effects:
      - { target: immunity.all, op: atLeast, value: 5 }
      - { target: powerRoll.banesAgainst, op: atLeast, value: 1 }
effects:
  - target: { steps: [ability.after], from: self }
    op: changes
    value:
      changes:
        - {
            type: applyEffect,
            source: "'abilities.conduit.blessing-of-steel'",
            state: { duration: "'encounter'" },
          }
  - { target: immunity.all, op: atLeast, value: 5, scope: applied }
  - { target: powerRoll.banesAgainst, op: atLeast, value: 1, scope: applied }
