id: abilities.conduit.healing-grace
type: ability
tags:
  - recovery.granted
  - kw.magic
  - kw.ranged
fields:
  usage: maneuver
  kind: feature
  class: classes.conduit
  level: 1
  distanceKind: ranged
  distance: 10
  spendCost: 1
  spendPlus: true
effects:
  # Spend 1+ piety, one enhancement each: more targets (the participants), a Recovery more for a
  # target, a prone target standing up, or an effect a saving throw or the end of their turn ends
  # (the first such). Pass `spend` for the total: the extra Recoveries, standing and ending fit
  # in it.
  - target: { actions: [ability], from: self }
    op: params
    value:
      graceRecoveries:
        type: integer
        default: 0
        min: 0
        max: 'params.spend - (params.graceStand ? 1 : 0) - (params.graceEnd ? 1 : 0)'
      graceStand: { type: boolean, default: false }
      graceEnd: { type: boolean, default: false }
  # The target can spend a Recovery, and one more for each enhancement.
  - target: { steps: [ability.hit], from: self }
    op: changes
    value:
      changes:
        - type: adjust
          field: recoveries.spent
          by: 1 + params.graceRecoveries
          tags: [recovery.granted]
        - type: removeEffect
          when: params.graceStand
          applied: { where: 'self.source == @conditions.prone' }
        - type: removeEffect
          when: params.graceEnd
          applied:
            where: "has(self.duration) && self.duration in ['save', 'eot']"
            limit: 1
