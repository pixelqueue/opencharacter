id: perks.intrigue.lucky-dog
type: perk
fields:
  group: intrigue
# A failed test using an intrigue skill: lose 1d6 + level Stamina to improve it one tier (once per
# test).
effects:
  - target: { choices: [test.improve] }
    op: option
    when: has(params.skill) && itemField(params.skill, 'group', '') == 'intrigue'
    value:
      id: push-your-luck
      flags: { improve: 1 }
      changes:
        - { type: adjust, field: stamina.current, by: '-(1d6 + level)', tags: [stamina-loss] }
