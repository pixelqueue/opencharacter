id: perks.exploration.brawny
type: perk
fields:
  group: exploration
# A failed Might test: lose 1d6 + level Stamina to improve it one tier (once per test).
effects:
  - target: { choices: [test.improve] }
    op: option
    when: params.characteristic == 'might'
    value:
      id: push-through
      flags: { improve: 1 }
      changes:
        - { type: adjust, field: stamina.current, by: '-(1d6 + level)', tags: [stamina-loss] }
