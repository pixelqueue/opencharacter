id: titles.echelon-3.master-crafter
type: title
fields:
  echelon: 3
choices:
  - id: benefit
    from:
      options:
        - { id: masterpiece }
        - { id: research-dividends }
        # The crafting skill the item's creation used, and a second crafting skill.
        - id: skilled-hands
          choices:
            - id: skills
              pick: 2
              from: { type: skill, where: "item.group == 'crafting'" }
              eligible: '!(item.id in skills.known) || item.id in choice.picks'
              recommend: filterList([@skills.alchemy, @skills.blacksmithing, @skills.architecture, @skills.carpentry, @skills.cooking, @skills.forgery, @skills.fletching, @skills.jewelry, @skills.mechanics, @skills.tailoring], !(x in skills.known) && !(x in choice.picks))[0]
              activate: false
              effects:
                - { target: skills.known, op: grant, value: { formula: pick.id } }
        - { id: strong-hands-make-light-work }
    recommend: "'skilled-hands'"
