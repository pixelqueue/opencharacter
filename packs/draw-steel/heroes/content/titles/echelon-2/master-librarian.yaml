id: titles.echelon-2.master-librarian
type: title
fields:
  echelon: 2
prerequisites:
  - id: ancient-loremaster
    when: countCopies(copy.item == @titles.echelon-1.ancient-loremaster) > 0
choices:
  - id: benefit
    from:
      options:
        - { id: arcane-improvisation }
        - { id: i-have-just-the-book }
        - id: picked-up-a-few-things
          choices:
            - id: skill
              from: { type: skill, where: "item.group == 'lore'" }
              eligible: '!(item.id in skills.known) || item.id in choice.picks'
              recommend: filterList([@skills.criminal-underworld, @skills.culture, @skills.history, @skills.magic, @skills.nature, @skills.monsters, @skills.religion, @skills.psionics, @skills.strategy, @skills.rumors, @skills.society, @skills.timescape], !(x in skills.known))[0]
              activate: false
              effects:
                - { target: skills.known, op: grant, value: { formula: pick.id } }
        - id: polyglot
          choices:
            - id: languages
              pick: 2
              from: { type: language }
              eligible: '!(item.id in languages.known) || item.id in choice.picks'
              recommend: filterList([@languages.caelian, @languages.zaliac, @languages.anjali, @languages.khelt, @languages.high-kuric, @languages.yllyric], !(x in languages.known) && !(x in choice.picks))[0]
              activate: false
              effects:
                - { target: languages.known, op: grant, value: { formula: pick.id } }
    recommend: "'picked-up-a-few-things'"
