id: classes.talent
type: class
fields:
  primaries: [reason, presence]
  potency: reason
  arrayPriority: [intuition, agility, might]
  startingStamina: 18
  staminaPerLevel: 6
  recoveries: 8
  resource: clarity
  turnGain: 1d3
grants:
  - item: features.talent.clarity-in-combat
  - item: features.talent.clarity-outside-of-combat
  - item: features.talent.mind-spike
  - item: features.talent.telepathic-speech
  - item: features.talent.scan
    when: self.level >= 3
  - item: features.talent.mind-projection
    when: self.level >= 4
  - item: features.talent.mind-recovery
    when: self.level >= 4
  - item: features.talent.suspensor-field
    when: self.level >= 4
  - item: features.talent.psi-boost
    when: self.level >= 6
  - item: features.talent.ancestral-memory
    when: self.level >= 7
  - item: features.talent.cascading-strain
    when: self.level >= 7
  - item: features.talent.lucid-mind
    when: self.level >= 7
  - item: features.talent.fortress-of-perfect-thought
    when: self.level >= 9
  - item: features.talent.clear-mind
    when: self.level >= 10
  - item: features.talent.omnisensory
    when: self.level >= 10
  - item: features.talent.psion
    when: self.level >= 10
  - item: features.talent.vision
    when: self.level >= 10
effects:
  # Clarity goes as low as −(1 + Reason).
  - { target: heroic.min, op: set, value: '-(1 + characteristics.reason.score)' }
  - { target: skills.known, op: grant, value: { item: skills.psionics } }
  - { target: skills.known, op: grant, value: { item: skills.read-person } }
choices:
  - id: subclass
    from:
      type: subclass
      where: item.class == @classes.talent
    recommend: '@subclasses.talent.telekinesis'
  - id: skills
    pick: 2
    from: { type: skill, where: "item.group in ['interpersonal', 'lore']" }
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: >-
      filterList([@skills.empathize, @skills.timescape, @skills.persuade, @skills.history,
        @skills.read-person, @skills.lead, @skills.culture, @skills.society,
        @skills.monsters, @skills.nature, @skills.religion, @skills.magic, @skills.brag], !(x in choice.picks) && !(x in skills.known))[0]
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
  - id: augmentation
    from: { type: feature, where: "'talent.augmentation' in item.tags" }
    recommend: '@features.talent.force-augmentation'
  - id: ward
    from: { type: feature, where: "'talent.ward' in item.tags" }
    recommend: '@features.talent.repulsive-ward'
  - id: signature
    pick: 2
    from:
      type: ability
      where: "item.class == @classes.talent && item.kind == 'signature' && !has(item.subclass)"
    recommend: 'filterList([@abilities.talent.incinerate, @abilities.talent.kinetic-grip], !(x in choice.picks))[0]'
  - id: heroic
    slots: [3, 5, 7, 9, 11]
    when: 'self.level >= [1, 1, 3, 5, 8][indexOf([3, 5, 7, 9, 11], slot)]'
    from:
      type: ability
      where: "item.class == @classes.talent && item.kind == 'heroic' && !has(item.subclass)"
    eligible: item.cost == slot
    recommend: >-
      [@abilities.talent.choke, @abilities.talent.inertia-soak, @abilities.talent.force-orbs,
        @abilities.talent.hypersonic, @abilities.talent.steel][indexOf([3, 5, 7, 9, 11], slot)]
  # Perks at 2nd, 6th and 10th level are interpersonal, lore or supernatural; at 4th and 8th, any.
  - id: perk
    unique: perks
    slots: [2, 4, 6, 8, 10]
    when: self.level >= slot
    from: { type: perk }
    eligible: "slot in [4, 8] || item.group in ['interpersonal', 'lore', 'supernatural']"
    # The slot's Quick Build pick, else the first of a few that isn't taken already (a career
    # may take the same perk).
    recommend: >-
      filterList([[@perks.supernatural.psychic-whisper, @perks.supernatural.invisible-force, @perks.interpersonal.lie-detector, @perks.exploration.danger-sense, @perks.lore.eidetic-memory][indexOf([2, 4, 6, 8, 10], slot)],
        @perks.interpersonal.spot-the-tell, @perks.lore.polymath, @perks.supernatural.ritualist, @perks.lore.linguist, @perks.supernatural.arcane-trick, @perks.interpersonal.so-tell-me],
        x in choice.picks || countPicks(pick.item == x) == 0)[0]
  - id: skill
    slots: [4, 7, 10]
    when: self.level >= slot
    from: { type: skill }
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: 'filterList([@skills.persuade, @skills.lie, @skills.history, @skills.magic, @skills.society, @skills.alertness, @skills.culture, @skills.interrogate, @skills.intimidate, @skills.religion, @skills.monsters, @skills.search, @skills.sneak, @skills.nature], !(x in skills.known))[0]'
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
