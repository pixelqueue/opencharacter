id: subclasses.troubadour.duelist
type: subclass
fields:
  class: classes.troubadour
effects:
  - { target: skills.known, op: grant, value: { item: skills.gymnastics } }
grants:
  - item: features.troubadour.acrobatics
  - item: features.troubadour.star-power
  - item: abilities.troubadour.riposte
  - item: features.troubadour.foil
    when: self.level >= 3
  - item: features.troubadour.masterwork
    when: self.level >= 8
choices:
  # Class act abilities at 2nd, 6th and 9th level, and the 5th-level class act feature.
  - id: ability-2
    when: self.level >= 2
    from:
      type: ability
      where: item.subclass == @subclasses.troubadour.duelist && item.level == 2
    recommend: '@abilities.troubadour.en-garde'
  - id: feature-5
    when: self.level >= 5
    from:
      type: feature
      where: item.subclass == @subclasses.troubadour.duelist && item.level == 5
    recommend: '@features.troubadour.we-cant-be-upstaged'
  - id: ability-6
    when: self.level >= 6
    from:
      type: ability
      where: item.subclass == @subclasses.troubadour.duelist && item.level == 6
    recommend: '@abilities.troubadour.blood-on-the-stage'
  - id: ability-9
    when: self.level >= 9
    from:
      type: ability
      where: item.subclass == @subclasses.troubadour.duelist && item.level == 9
    recommend: '@abilities.troubadour.expert-fencer'
