id: subclasses.troubadour.virtuoso
type: subclass
fields:
  class: classes.troubadour
effects:
  - { target: skills.known, op: grant, value: { item: skills.music } }
grants:
  - item: features.troubadour.power-chord
  - item: features.troubadour.virtuoso-performances
  - item: abilities.troubadour.harmonize
  - item: features.troubadour.second-album
    when: self.level >= 3
  - item: features.troubadour.crowd-favorites
    when: self.level >= 8
choices:
  # Class act abilities at 2nd, 6th and 9th level, and the 5th-level class act feature.
  - id: ability-2
    when: self.level >= 2
    from:
      type: ability
      where: item.subclass == @subclasses.troubadour.virtuoso && item.level == 2
    recommend: '@abilities.troubadour.tough-crowd'
  - id: feature-5
    when: self.level >= 5
    from:
      type: feature
      where: item.subclass == @subclasses.troubadour.virtuoso && item.level == 5
    recommend: '@features.troubadour.medley'
  - id: ability-6
    when: self.level >= 6
    from:
      type: ability
      where: item.subclass == @subclasses.troubadour.virtuoso && item.level == 6
    recommend: '@abilities.troubadour.feedback'
  - id: ability-9
    when: self.level >= 9
    from:
      type: ability
      where: item.subclass == @subclasses.troubadour.virtuoso && item.level == 9
    recommend: '@abilities.troubadour.melt-their-faces'
