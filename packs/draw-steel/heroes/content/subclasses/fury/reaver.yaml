id: subclasses.fury.reaver
type: subclass
fields:
  class: classes.fury
grants:
  - { item: features.common.kit }
  - { item: features.fury.primordial-cunning }
  - { item: features.fury.inescapable-wrath, when: self.level >= 2 }
  - { item: features.fury.see-through-their-tricks, when: self.level >= 3 }
  - { item: features.fury.unfettered, when: self.level >= 5 }
  - { item: features.fury.a-step-ahead, when: self.level >= 8 }
  - { item: abilities.fury.unearthly-reflexes }
effects:
  - { target: skills.known, op: grant, value: { item: skills.hide } }
  # Reaver Growing Ferocity. 2: Knockback's forced movement gains the Agility score; 12 (10th
  # level): every power roll's forced movement does.
  - target: { rolls: [power-roll.ability], tally: moveBonus }
    op: add
    value: characteristics.agility.score
    when: >-
      fury.growing >= 2 && (roll.item.id == @abilities.common.knockback
        || (level >= 10 && fury.growing >= 12))
  # 4 and 8: the first time on a turn an ability slides a creature, 1 surge (2 at 4th level).
  - target: { steps: [ability.after] }
    op: changes
    when: >-
      combat.active && fury.growing >= 4 && !fury.surgedThisTurn
        && has(steps.roll) && size(participants.target) > 0
        && countList(flags.move, x in ['slide', 'vertical-slide']) > 0
    value:
      changes:
        - { type: adjust, field: surges.current, by: 'fury.growing >= 8 && level >= 4 ? 2 : 1' }
        - { type: set, field: fury.surgedThisTurn, value: 'true' }
  # 6 and 10: an edge (a double edge at 7th level) on Agility tests and the Knockback maneuver.
  - target: { rolls: [test.agility], tally: edges }
    op: add
    value: 'fury.growing >= 10 && level >= 7 ? 2 : 1'
    when: fury.growing >= 6
  - target: { rolls: [power-roll.ability], tally: edges }
    op: add
    value: 'fury.growing >= 10 && level >= 7 ? 2 : 1'
    when: fury.growing >= 6 && roll.item.id == @abilities.common.knockback
  # 12 (10th level): 10 temporary Stamina for each heroic ability used.
  - target: { steps: [ability.after] }
    op: changes
    when: "combat.active && level >= 10 && fury.growing >= 12 && action.item.kind == 'heroic'"
    value: { changes: [{ type: set, field: stamina.temp, value: 'max(stamina.temp, 10)' }] }
choices:
  - id: ability
    slots: [2, 6, 9]
    when: self.level >= slot
    from:
      type: ability
      where: 'item.class == @classes.fury && has(item.subclass) && item.subclass == @subclasses.fury.reaver'
    eligible: item.level == slot
    recommend: >-
      [@abilities.fury.death-death, @abilities.fury.seek-and-destroy, @abilities.fury.shower-of-blood][indexOf([2, 6, 9], slot)]
