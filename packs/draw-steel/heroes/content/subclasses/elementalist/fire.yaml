id: subclasses.elementalist.fire
type: subclass
fields:
  class: classes.elementalist
grants:
  - { item: features.elementalist.acolyte-of-fire }
  - { item: abilities.elementalist.return-to-formlessness }
  - { item: abilities.elementalist.explosive-assistance }
  - { item: features.elementalist.disciple-of-fire, when: self.level >= 2 }
  - { item: features.elementalist.a-conversation-with-fire, when: self.level >= 3 }
  - { item: features.elementalist.burning-grounds, when: self.level >= 4 }
  - { item: features.elementalist.smoldering-step, when: self.level >= 5 }
  - { item: features.elementalist.the-flame-primordial, when: self.level >= 8 }
  - { item: features.elementalist.master-of-fire, when: self.level >= 10 }
