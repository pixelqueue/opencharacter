id: subclasses.elementalist.earth
type: subclass
fields:
  class: classes.elementalist
grants:
  - { item: features.elementalist.acolyte-of-earth }
  - { item: abilities.elementalist.motivate-earth }
  - { item: abilities.elementalist.skin-like-castle-walls }
  - { item: features.elementalist.disciple-of-earth, when: self.level >= 2 }
  - { item: abilities.elementalist.earth-accepts-me, when: self.level >= 3 }
  - { item: features.elementalist.quaking-earth, when: self.level >= 4 }
  - { item: features.elementalist.the-mountain-does-not-move, when: self.level >= 5 }
  - { item: abilities.elementalist.summon-source-of-earth, when: self.level >= 8 }
  - { item: features.elementalist.master-of-earth, when: self.level >= 10 }
