  - { item: features.elementalist.it-is-the-soul-which-hears }
  - { item: abilities.elementalist.breath-of-dawn-remembered }
  - { item: features.elementalist.disciple-of-the-green, when: self.level >= 2 }
  - { item: abilities.elementalist.remember-growth-and-sun-and-rain, when: self.level >= 3 }
  - { item: features.elementalist.flowering-bed, when: self.level >= 4 }
  - { item: features.elementalist.hide-of-tenfold-shields, when: self.level >= 5 }
  - { item: features.elementalist.chimeric-manifestation, when: self.level >= 8 }
  - { item: features.elementalist.master-of-green, when: self.level >= 10 }
