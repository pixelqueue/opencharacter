id: subclasses.talent.telepathy
type: subclass
fields:
  class: classes.talent
grants:
  - item: features.talent.feedback-loop
  - item: features.talent.remote-assistance
  - { item: features.talent.ease-the-mind, when: self.level >= 2 }
  - { item: features.talent.compulsion, when: self.level >= 5 }
  - { item: features.talent.remote-amplification, when: self.level >= 5 }
  - { item: features.talent.mindlink, when: self.level >= 8 }
  - { item: features.talent.universal-connection, when: self.level >= 8 }
choices:
  - id: ability2
    when: self.level >= 2
    from:
      type: ability
      where: "has(item.subclass) && item.subclass == @subclasses.talent.telepathy && item.kind == 'heroic' && item.level == 2"
    recommend: '@abilities.talent.overwhelm'
  - id: ability6
    when: self.level >= 6
    from:
      type: ability
      where: "has(item.subclass) && item.subclass == @subclasses.talent.telepathy && item.kind == 'heroic' && item.level == 6"
    recommend: '@abilities.talent.synaptic-conditioning'
  - id: ability9
    when: self.level >= 9
    from:
      type: ability
      where: "has(item.subclass) && item.subclass == @subclasses.talent.telepathy && item.kind == 'heroic' && item.level == 9"
    recommend: '@abilities.talent.resonant-mind-spike'
