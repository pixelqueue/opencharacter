id: subclasses.null.chronokinetic
type: subclass
fields:
  class: classes.null
grants:
  - { item: features.null.chronokinetic-mastery }
  - { item: features.null.rapid-processing, when: self.level >= 2 }
  - { item: features.null.instant-action, when: self.level >= 5 }
  - { item: features.null.shared-momentum, when: self.level >= 8 }
choices:
  - id: skill
    from: { type: skill, where: "item.group == 'lore'" }
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: 'filterList([@skills.monsters, @skills.history, @skills.magic], !(x in skills.known) || x in choice.picks)[0]'
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
  - id: ability-2
    when: self.level >= 2
    from:
      type: ability
      where: 'item.subclass == @subclasses.null.chronokinetic && item.level == 2'
    recommend: '@abilities.null.force-redirected'
  - id: ability-6
    when: self.level >= 6
    from:
      type: ability
      where: 'item.subclass == @subclasses.null.chronokinetic && item.level == 6'
    recommend: '@abilities.null.phase-step'
  - id: ability-9
    when: self.level >= 9
    from:
      type: ability
      where: 'item.subclass == @subclasses.null.chronokinetic && item.level == 9'
    recommend: '@abilities.null.time-loop'
