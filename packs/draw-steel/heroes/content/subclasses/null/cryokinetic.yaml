id: subclasses.null.cryokinetic
type: subclass
fields:
  class: classes.null
grants:
  - { item: features.null.cryokinetic-mastery }
  - { item: features.null.entropic-adaptability, when: self.level >= 2 }
  - { item: features.null.chilling-readiness, when: self.level >= 5 }
  - { item: features.null.synaptic-triage, when: self.level >= 8 }
choices:
  - id: skill
    from: { type: skill, where: "item.group == 'crafting'" }
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: 'filterList([@skills.alchemy, @skills.mechanics, @skills.architecture], !(x in skills.known) || x in choice.picks)[0]'
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
  - id: ability-2
    when: self.level >= 2
    from:
      type: ability
      where: 'item.subclass == @subclasses.null.cryokinetic && item.level == 2'
    recommend: '@abilities.null.entropic-field'
  - id: ability-6
    when: self.level >= 6
    from:
      type: ability
      where: 'item.subclass == @subclasses.null.cryokinetic && item.level == 6'
    recommend: '@abilities.null.ice-pillars'
  - id: ability-9
    when: self.level >= 9
    from:
      type: ability
      where: 'item.subclass == @subclasses.null.cryokinetic && item.level == 9'
    recommend: '@abilities.null.absolute-zero'
