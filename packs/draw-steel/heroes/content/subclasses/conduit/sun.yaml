# The sun domain. A Conduit picks two domains (a Censor one); the domain grants its piety and
# prayer effect. Its features and abilities name it in their `subclass` field and are picked by
# level in the class's domain-feature and domain-ability choices.
id: subclasses.conduit.sun
type: subclass
fields:
  class: classes.conduit
grants:
  - item: features.conduit.sun-domain-piety-and-effect
