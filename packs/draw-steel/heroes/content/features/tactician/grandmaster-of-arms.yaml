# A tier 3 outcome on a kit's signature ability and on weapon free strikes; a natural 19 or 20
# still counts as a critical hit.
id: features.tactician.grandmaster-of-arms
type: feature
fields:
  class: classes.tactician
  level: 9
effects:
  - target: { rolls: [power-roll.ability], tally: autoTier3 }
    op: add
    value: 1
    when: "action.item.kind in ['kit', 'free-strike'] && 'kw.weapon' in action.item.tags"
