# Applied to a creature a tactician marks: its `by` is the tactician. A mark by another tactician
# replaces it. It ends with the encounter.
id: features.tactician.marked
type: condition
effects:
  - {
      target: tactician.markedBy,
      op: grant,
      value: { formula: self.by },
      scope: applied,
      when: "self.by != ''",
    }
