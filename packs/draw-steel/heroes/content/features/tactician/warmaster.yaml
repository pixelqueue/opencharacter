# Your own ability rolls against creatures you marked: three dice, the best two kept. Allies'
# rolls and their reduced costs are theirs to apply.
id: features.tactician.warmaster
type: feature
fields:
  class: classes.tactician
  level: 10
effects:
  - target: { rolls: [power-roll.ability] }
    op: rollModifier
    value: { kind: advantage }
    when: >-
      has(participants.target) && size(participants.target) > 0
        && countList(participants.target, character.id in x.tactician.markedBy) == size(participants.target)
