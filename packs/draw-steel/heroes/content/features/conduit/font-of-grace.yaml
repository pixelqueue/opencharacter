id: features.conduit.font-of-grace
type: feature
fields:
  class: classes.conduit
  level: 7
  subclass: subclasses.conduit.life
effects:
  # Healing Grace: 1 free piety for its Spend, on the same turn.
  - target: { steps: [ability.pay] }
    op: changes
    when: action.item.id == @abilities.conduit.healing-grace && combat.active && params.spend > 0
    value: { changes: [{ type: adjust, field: heroic.current, by: 1 }] }
