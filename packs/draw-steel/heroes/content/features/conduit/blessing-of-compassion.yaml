id: features.conduit.blessing-of-compassion
type: feature
fields:
  class: classes.conduit
  level: 1
  subclass: subclasses.conduit.love
choices:
  # The domain's skill, from the interpersonal group: one the hero doesn't have, or any of the group when
  # they have them all (Gods' Library gives every lore skill).
  - id: skill
    from: { type: skill, where: "item.group == 'interpersonal'" }
    eligible: >-
      !(item.id in skills.known) || item.id in choice.picks
        || countList([@skills.brag, @skills.empathize, @skills.flirt, @skills.handle-animals, @skills.gamble, @skills.intimidate, @skills.interrogate, @skills.lie, @skills.lead, @skills.perform, @skills.music, @skills.persuade, @skills.read-person], !(x in skills.known)) == 0
    recommend: >-
      (filterList([@skills.empathize, @skills.persuade, @skills.read-person, @skills.lead,
        @skills.brag, @skills.flirt, @skills.handle-animals, @skills.gamble,
        @skills.intimidate, @skills.interrogate, @skills.lie, @skills.perform, @skills.music],
        !(x in skills.known) || x in choice.picks) + [@skills.empathize])[0]
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
