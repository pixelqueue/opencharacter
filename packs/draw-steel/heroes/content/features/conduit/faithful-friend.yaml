id: features.conduit.faithful-friend
type: feature
fields:
  class: classes.conduit
  level: 1
  subclass: subclasses.conduit.nature
grants:
  - item: abilities.conduit.faithful-friend
choices:
  # The domain's skill, from the exploration group: one the hero doesn't have, or any of the group when
  # they have them all (Gods' Library gives every lore skill).
  - id: skill
    from: { type: skill, where: "item.group == 'exploration'" }
    eligible: >-
      !(item.id in skills.known) || item.id in choice.picks
        || countList([@skills.climb, @skills.endurance, @skills.drive, @skills.gymnastics, @skills.heal, @skills.jump, @skills.lift, @skills.navigate, @skills.ride, @skills.swim], !(x in skills.known)) == 0
    recommend: >-
      (filterList([@skills.navigate, @skills.heal, @skills.endurance, @skills.climb, @skills.drive,
        @skills.gymnastics, @skills.jump, @skills.lift, @skills.ride, @skills.swim],
        !(x in skills.known) || x in choice.picks) + [@skills.navigate])[0]
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
