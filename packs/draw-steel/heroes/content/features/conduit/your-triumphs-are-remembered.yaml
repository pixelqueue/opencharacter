id: features.conduit.your-triumphs-are-remembered
type: feature
fields:
  class: classes.conduit
  level: 7
  subclass: subclasses.conduit.war
effects:
  # After a respite turns Victories into experience, 1 Victory comes back.
  - target: { steps: [respite] }
    op: changes
    value: { changes: [{ type: adjust, field: victories, by: 1 }] }
