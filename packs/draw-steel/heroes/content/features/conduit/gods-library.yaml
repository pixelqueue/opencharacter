id: features.conduit.gods-library
type: feature
fields:
  class: classes.conduit
  level: 7
  subclass: subclasses.conduit.knowledge
effects:
  # Every skill of the lore group (the extra skills from other groups are the player's to add).
  - target: skills.known
    op: grant
    value: { query: { type: skill, where: "item.group == 'lore'" } }
