id: features.conduit.hands-of-the-maker
type: feature
fields:
  class: classes.conduit
  level: 1
  subclass: subclasses.conduit.creation
grants:
  - item: abilities.conduit.hands-of-the-maker
choices:
  # The domain's skill, from the crafting group: one the hero doesn't have, or any of the group when
  # they have them all (Gods' Library gives every lore skill).
  - id: skill
    from: { type: skill, where: "item.group == 'crafting'" }
    eligible: >-
      !(item.id in skills.known) || item.id in choice.picks
        || countList([@skills.alchemy, @skills.carpentry, @skills.architecture, @skills.blacksmithing, @skills.cooking, @skills.fletching, @skills.forgery, @skills.jewelry, @skills.mechanics, @skills.tailoring], !(x in skills.known)) == 0
    recommend: >-
      (filterList([@skills.mechanics, @skills.architecture, @skills.blacksmithing, @skills.carpentry,
        @skills.alchemy, @skills.cooking, @skills.fletching, @skills.forgery,
        @skills.jewelry, @skills.tailoring],
        !(x in skills.known) || x in choice.picks) + [@skills.mechanics])[0]
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
computed:
  domainChar:
    type: string
    formula: "countCopies(copy.item == @classes.censor) > 0 ? 'characteristics.presence.score' : 'characteristics.intuition.score'"
