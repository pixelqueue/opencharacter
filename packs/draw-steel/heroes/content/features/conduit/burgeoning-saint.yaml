id: features.conduit.burgeoning-saint
type: feature
fields:
  class: classes.conduit
  level: 6
effects:
  # An edge on Presence tests made to interact with other creatures.
  # ("to interact with other creatures": a test with an interpersonal skill)
  - target: { rolls: [test.presence], tally: edges }
    op: add
    value: 1
    when: "has(params.skill) && itemField(params.skill, 'group') == 'interpersonal'"
  # Dealing damage to an enemy: the hero can spend a Recovery.
  - target: { steps: [ability.after] }
    op: changes
    when: has(action.item.t1Damage) && size(participants.target) > 0 && recoveries.current > 0
    value: { changes: [{ type: offerFollowUp, followUp: spend-recovery }] }
choices:
  - id: immunity
    from: { values: [corruption, holy] }
    recommend: "'holy'"
    effects:
      - { target: { formula: "'immunity.' + pick.value" }, op: atLeast, value: 10 }
