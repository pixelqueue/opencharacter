id: features.talent.psi-boost
type: feature
fields:
  class: classes.talent
  level: 6
# The psi boosts are parameters of a psionic main action or maneuver; this adds their clarity to
# the ability's cost (which strained effects count).
effects:
  - { target: talent.psiBoost, op: set, value: 'true' }
  - target: { steps: [ability.extra] }
    op: changes
    when: "'kw.psionic' in action.item.tags"
    value:
      flags:
        extra: >-
          ((has(params.psiDynamic) && params.psiDynamic) ? 1 : 0)
              + ((has(params.psiExpanded) && params.psiExpanded) ? 3 : 0)
              + ((has(params.psiExtended) && params.psiExtended) ? 1 : 0)
              + ((has(params.psiHeightened) && params.psiHeightened) ? 1 : 0)
              + ((has(params.psiMagnified) && params.psiMagnified) ? 5 : 0)
              + ((has(params.psiShared) && params.psiShared) ? 5 : 0)
              + ((has(params.psiSharpened) && params.psiSharpened) ? 1 : 0)
