id: features.talent.psi-boost
type: feature
fields:
  class: classes.talent
  level: 6
# The psi boosts are situational choices on the ability's roll; this pays their clarity.
effects:
  - { target: talent.psiBoost, op: set, value: 'true' }
  - target: { steps: [ability.pay] }
    op: changes
    when: >-
      combat.active && 'kw.psionic' in action.item.tags
        && action.item.usage in ['main-action', 'maneuver']
        && ((has(params.psiDynamic) && params.psiDynamic) || (has(params.psiExpanded) && params.psiExpanded) || (has(params.psiExtended) && params.psiExtended)
          || (has(params.psiHeightened) && params.psiHeightened) || (has(params.psiMagnified) && params.psiMagnified) || (has(params.psiShared) && params.psiShared)
          || (has(params.psiSharpened) && params.psiSharpened))
    value:
      changes:
        - type: adjust
          field: heroic.current
          by: >-
            -(((has(params.psiDynamic) && params.psiDynamic) ? 1 : 0) + ((has(params.psiExpanded) && params.psiExpanded) ? 3 : 0)
              + ((has(params.psiExtended) && params.psiExtended) ? 1 : 0) + ((has(params.psiHeightened) && params.psiHeightened) ? 1 : 0)
              + ((has(params.psiMagnified) && params.psiMagnified) ? 5 : 0) + ((has(params.psiShared) && params.psiShared) ? 5 : 0)
              + ((has(params.psiSharpened) && params.psiSharpened) ? 1 : 0))
