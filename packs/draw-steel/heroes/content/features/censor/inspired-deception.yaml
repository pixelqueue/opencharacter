id: features.censor.inspired-deception
type: feature
fields:
  class: classes.censor
  level: 1
  subclass: subclasses.conduit.trickery
choices:
  # The domain's skill, from the intrigue group.
  - id: skill
    from: { type: skill, where: "item.group == 'intrigue'" }
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: >-
      filterList([@skills.sneak, @skills.hide, @skills.alertness, @skills.search,
        @skills.conceal-object, @skills.disguise, @skills.eavesdrop, @skills.escape-artist,
        @skills.pick-lock, @skills.pick-pocket, @skills.sabotage, @skills.track],
        !(x in skills.known) || x in choice.picks)[0]
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
