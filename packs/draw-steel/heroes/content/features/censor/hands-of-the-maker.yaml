id: features.censor.hands-of-the-maker
type: feature
fields:
  class: classes.censor
  level: 1
  subclass: subclasses.conduit.creation
grants:
  - item: abilities.censor.hands-of-the-maker
choices:
  # The domain's skill, from the crafting group.
  - id: skill
    from: { type: skill, where: "item.group == 'crafting'" }
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: >-
      filterList([@skills.mechanics, @skills.architecture, @skills.blacksmithing,
        @skills.carpentry, @skills.alchemy, @skills.cooking, @skills.fletching, @skills.forgery,
        @skills.jewelry, @skills.tailoring],
        !(x in skills.known) || x in choice.picks)[0]
    activate: false
    effects:
      - { target: skills.known, op: grant, value: { formula: pick.id } }
