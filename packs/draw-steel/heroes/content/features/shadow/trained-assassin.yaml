id: features.shadow.trained-assassin
type: feature
fields:
  class: classes.shadow
  subclass: subclasses.shadow.caustic-alchemy
  level: 2
effects:
  # A strike with surges and no bane: one more surge's damage, on that strike only.
  - target: { rolls: [damage] }
    op: add
    when: >-
      params.surges > 0 && 'kw.strike' in action.item.tags && size(participants.target) > 0
        && participant.id == participants.target[0].id
        && min(2, steps.tier.tallies.banes) <= min(2, steps.tier.tallies.edges)
    value: characteristics.highest
