id: culture-aspects.nomadic
type: cultureAspect
fields:
  aspect: environment
  skillGroups:
    - exploration
    - interpersonal
choices:
  - id: skill
    from:
      type: skill
      where: item.group in ['exploration', 'interpersonal']
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.navigate, @skills.climb, @skills.drive, @skills.endurance, @skills.gymnastics, @skills.heal, @skills.jump, @skills.lift, @skills.ride, @skills.swim, @skills.brag, @skills.empathize, @skills.flirt, @skills.gamble, @skills.handle-animals, @skills.interrogate, @skills.intimidate, @skills.lead, @skills.lie, @skills.music, @skills.perform, @skills.persuade, @skills.read-person], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
