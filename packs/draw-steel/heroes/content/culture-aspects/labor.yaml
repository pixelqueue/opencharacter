id: culture-aspects.labor
type: cultureAspect
fields:
  aspect: upbringing
  skillGroups:
    - exploration
  skills:
    - skills.blacksmithing
    - skills.handle-animals
choices:
  - id: skill
    from:
      type: skill
      where: item.group in ['exploration'] || item.id in [@skills.blacksmithing, @skills.handle-animals]
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.lift, @skills.blacksmithing, @skills.handle-animals, @skills.climb, @skills.drive, @skills.endurance, @skills.gymnastics, @skills.heal, @skills.jump, @skills.navigate, @skills.ride, @skills.swim], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
