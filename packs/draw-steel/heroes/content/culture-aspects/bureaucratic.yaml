id: culture-aspects.bureaucratic
type: cultureAspect
fields:
  aspect: organization
  skillGroups:
    - interpersonal
    - intrigue
choices:
  - id: skill
    from:
      type: skill
      where: item.group in ['interpersonal', 'intrigue']
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.persuade, @skills.brag, @skills.empathize, @skills.flirt, @skills.gamble, @skills.handle-animals, @skills.interrogate, @skills.intimidate, @skills.lead, @skills.lie, @skills.music, @skills.perform, @skills.read-person, @skills.alertness, @skills.conceal-object, @skills.disguise, @skills.eavesdrop, @skills.escape-artist, @skills.hide, @skills.pick-lock, @skills.pick-pocket, @skills.sabotage, @skills.search, @skills.sneak, @skills.track], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
