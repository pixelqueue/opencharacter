id: culture-aspects.creative
type: cultureAspect
fields:
  aspect: upbringing
  skillGroups:
    - crafting
  skills:
    - skills.music
    - skills.perform
choices:
  - id: skill
    from:
      type: skill
      where: item.group in ['crafting'] || item.id in [@skills.music, @skills.perform]
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.perform, @skills.music, @skills.alchemy, @skills.architecture, @skills.blacksmithing, @skills.carpentry, @skills.cooking, @skills.fletching, @skills.forgery, @skills.jewelry, @skills.mechanics, @skills.tailoring], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
