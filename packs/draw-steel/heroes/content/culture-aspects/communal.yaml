id: culture-aspects.communal
type: cultureAspect
fields:
  aspect: organization
  skillGroups:
    - crafting
    - exploration
choices:
  - id: skill
    from:
      type: skill
      where: item.group in ['crafting', 'exploration']
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.jump, @skills.alchemy, @skills.architecture, @skills.blacksmithing, @skills.carpentry, @skills.cooking, @skills.fletching, @skills.forgery, @skills.jewelry, @skills.mechanics, @skills.tailoring, @skills.climb, @skills.drive, @skills.endurance, @skills.gymnastics, @skills.heal, @skills.lift, @skills.navigate, @skills.ride, @skills.swim], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
