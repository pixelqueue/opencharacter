id: culture-aspects.rural
type: cultureAspect
fields:
  aspect: environment
  skillGroups:
    - crafting
    - lore
choices:
  - id: skill
    from:
      type: skill
      where: item.group in ['crafting', 'lore']
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.nature, @skills.alchemy, @skills.architecture, @skills.blacksmithing, @skills.carpentry, @skills.cooking, @skills.fletching, @skills.forgery, @skills.jewelry, @skills.mechanics, @skills.tailoring, @skills.criminal-underworld, @skills.culture, @skills.history, @skills.magic, @skills.monsters, @skills.psionics, @skills.religion, @skills.rumors, @skills.society, @skills.strategy, @skills.timescape], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
