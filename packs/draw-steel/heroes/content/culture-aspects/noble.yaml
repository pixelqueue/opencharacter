id: culture-aspects.noble
type: cultureAspect
fields:
  aspect: upbringing
  skillGroups:
    - interpersonal
choices:
  - id: skill
    from:
      type: skill
      where: item.group in ['interpersonal']
    eligible: '!(item.id in skills.known) || item.id in choice.picks'
    recommend: filterList([@skills.lead, @skills.brag, @skills.empathize, @skills.flirt, @skills.gamble, @skills.handle-animals, @skills.interrogate, @skills.intimidate, @skills.lie, @skills.music, @skills.perform, @skills.persuade, @skills.read-person], !(x in skills.known))[0]
    activate: false
    effects:
      - target: skills.known
        op: grant
        value:
          formula: pick.id
