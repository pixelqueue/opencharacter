id: treasures.consumables.timesplitter
type: consumable
tags:
  - kw.psionic
fields:
  echelon: 3
grants:
  - item: abilities.treasure.timesplitter
    when: self.quantity > 0
effects:
  - target:
      steps:
        - ability.after
    op: changes
    when: action.item.id == @abilities.treasure.timesplitter
    value:
      changes:
        - type: adjustQuantity
          entry: self
          by: -1
