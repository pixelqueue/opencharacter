id: treasures.consumables.bull-shot
type: consumable
tags:
  - kw.magic
  - kw.potion
fields:
  echelon: 2
grants:
  - item: abilities.treasure.bull-shot
    when: self.quantity > 0
effects:
  - target:
      steps:
        - ability.after
    op: changes
    when: action.item.id == @abilities.treasure.bull-shot
    value:
      changes:
        - type: adjustQuantity
          entry: self
          by: -1
