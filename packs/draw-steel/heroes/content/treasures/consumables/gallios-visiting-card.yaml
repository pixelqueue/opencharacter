id: treasures.consumables.gallios-visiting-card
type: consumable
tags:
  - kw.magic
fields:
  echelon: 3
grants:
  - item: abilities.treasure.gallios-visiting-card
    when: self.quantity > 0
effects:
  - target:
      steps:
        - ability.after
    op: changes
    when: action.item.id == @abilities.treasure.gallios-visiting-card
    value:
      changes:
        - type: adjustQuantity
          entry: self
          by: -1
