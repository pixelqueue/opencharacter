# +2 speed until the start of your next turn (kept until the end of this one).
id: treasures.consumables.buzz-balm
type: consumable
tags:
  - kw.magic
  - kw.oil
fields:
  echelon: 1
state:
  duration:
    type: enum
    values:
      - eot
      - save
      - encounter
      - until
    default: until
grants:
  - item: abilities.treasure.buzz-balm
    when: self.quantity > 0
effects:
  - target:
      steps:
        - ability.after
    op: changes
    when: action.item.id == @abilities.treasure.buzz-balm
    value:
      changes:
        - type: adjustQuantity
          entry: self
          by: -1
        - type: removeEffect
          applied:
            where: item.id in [@conditions.bleeding, @conditions.weakened]
        - type: applyEffect
          source: item.id
          state:
            duration: "'eot'"
  - target: speed
    op: add
    value: 2
    scope: applied
