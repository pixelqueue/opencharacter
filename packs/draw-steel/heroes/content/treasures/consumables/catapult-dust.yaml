id: treasures.consumables.catapult-dust
type: consumable
tags:
  - kw.magic
fields:
  echelon: 1
grants:
  - item: abilities.treasure.catapult-dust
    when: self.quantity > 0
effects:
  - target:
      steps:
        - ability.after
    op: changes
    when: action.item.id == @abilities.treasure.catapult-dust
    value:
      changes:
        - type: adjustQuantity
          entry: self
          by: -1
