# Any enemy ability that targets you has a double bane: the enemy's roll.
id: treasures.consumables.ward-token
type: consumable
tags:
  - kw.psionic
fields:
  echelon: 3
state:
  duration:
    type: enum
    values:
      - eot
      - save
      - encounter
      - until
    default: until
grants:
  - item: abilities.treasure.ward-token
    when: self.quantity > 0
effects:
  - target:
      steps:
        - ability.after
    op: changes
    when: action.item.id == @abilities.treasure.ward-token
    value:
      changes:
        - type: adjustQuantity
          entry: self
          by: -1
        - type: applyEffect
          source: item.id
          state:
            duration: "'encounter'"
