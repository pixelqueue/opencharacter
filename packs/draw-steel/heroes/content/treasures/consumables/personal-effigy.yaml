id: treasures.consumables.personal-effigy
type: consumable
tags:
  - kw.magic
fields:
  echelon: 3
grants:
  - item: abilities.treasure.personal-effigy
    when: self.quantity > 0
effects:
  - target:
      steps:
        - ability.after
    op: changes
    when: action.item.id == @abilities.treasure.personal-effigy
    value:
      changes:
        - type: adjustQuantity
          entry: self
          by: -1
