id: treasures.leveled.lance-of-the-sundered-star
type: leveledTreasure
tags:
  - kw.magic
  - weapon.polearm
fields:
  category: weapon
effects:
  - target:
      rolls:
        - damage
    op: add
    value: 'level >= 9 ? 3 : level >= 5 ? 2 : 1'
    stackKey: treasure-damage
    when: self.equipped && 'kw.weapon' in action.item.tags
    tags:
      - damage.holy
