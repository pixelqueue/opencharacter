id: treasures.leveled.executioners-blade
type: leveledTreasure
tags:
  - weapon.heavy
  - kw.psionic
fields:
  category: weapon
effects:
  - target:
      rolls:
        - damage
    op: add
    value: '(level >= 9 ? 3 : level >= 5 ? 2 : 1) * (participant.stamina.isWinded ? 2 : 1)'
    stackKey: treasure-damage
    when: self.equipped && countList(item.tags, x in kit.gear) > 0 && 'kw.weapon' in action.item.tags
    tags:
      - damage.psychic
  # 9th level: an edge against a winded target.
  - target: { rolls: [power-target], tally: edges }
    op: add
    value: 1
    when: self.equipped && countList(item.tags, x in kit.gear) > 0 && level >= 9 && 'kw.weapon' in action.item.tags && participant.stamina.isWinded
