id: treasures.leveled.kuranzoi-prismscale
type: leveledTreasure
tags:
  - armor.medium
  - kw.psionic
fields:
  category: armor
grants:
  - item: abilities.treasure.kuranzoi-prismscale.capture-a-moment
    when: self.equipped
effects:
  - target: stamina.bonus
    op: add
    value: 'level >= 9 ? 21 : level >= 5 ? 12 : 6'
    stackKey: treasure-stamina
    when: self.equipped && countList(item.tags, x in kit.gear) > 0
