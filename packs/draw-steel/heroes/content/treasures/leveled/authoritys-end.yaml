# At 9th level it doesn't count against the three leveled treasures (the constraint's exception).
id: treasures.leveled.authoritys-end
type: leveledTreasure
tags:
  - kw.psionic
  - weapon.whip
fields:
  category: weapon
effects:
  - target:
      rolls:
        - damage
    op: add
    value: 'level >= 9 ? 3 : level >= 5 ? 2 : 1'
    stackKey: treasure-damage
    when: self.equipped && 'kw.weapon' in action.item.tags
    tags:
      - formula: "action.item.damageType == 'untyped' ? [] : ['damage.' + action.item.damageType]"
  - target:
      rolls:
        - saving-throw
    op: add
    value: 1
    when: self.equipped && level >= 5
