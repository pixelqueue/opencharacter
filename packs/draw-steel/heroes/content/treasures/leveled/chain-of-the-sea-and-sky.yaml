id: treasures.leveled.chain-of-the-sea-and-sky
type: leveledTreasure
tags:
  - armor.heavy
  - kw.magic
fields:
  category: armor
effects:
  - target: stamina.bonus
    op: add
    value: 'level >= 9 ? 21 : level >= 5 ? 12 : 6'
    stackKey: treasure-stamina
    when: self.equipped
  - target: movement.types
    op: grant
    value:
      tag: move.swim
    when: self.equipped
  - target: immunity.cold
    op: add
    value: 'level >= 9 ? 10 : 5'
    when: self.equipped && level >= 5
