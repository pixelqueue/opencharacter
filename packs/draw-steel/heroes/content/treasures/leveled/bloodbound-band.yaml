id: treasures.leveled.bloodbound-band
type: leveledTreasure
tags:
  - kw.magic
  - kw.ring
fields:
  category: other
effects:
  - target: stamina.bonus
    op: add
    value: 'level >= 9 ? 21 : level >= 5 ? 12 : 6'
    stackKey: treasure-stamina
    when: self.equipped
  - target: immunity.all
    op: atLeast
    value: 2
    when: self.equipped && level >= 5
