id: treasures.leveled.star-hunter
type: leveledTreasure
tags:
  - armor.heavy
  - kw.psionic
fields:
  category: armor
effects:
  - target: stamina.bonus
    op: add
    value: 'level >= 9 ? 21 : level >= 5 ? 12 : 6'
    stackKey: treasure-stamina
    when: self.equipped && countList(item.tags, x in kit.gear) > 0
  - target: immunity.psychic
    op: atLeast
    value: 'level >= 9 ? 10 : 5'
    when: self.equipped && countList(item.tags, x in kit.gear) > 0 && level >= 5
