# The +1 melee distance goes to the kit distance, which weapon abilities add.
id: treasures.leveled.steeltongue
type: leveledTreasure
tags:
  - kw.magic
  - weapon.whip
fields:
  category: weapon
effects:
  - target: kit.meleeDistance
    op: add
    value: 'level >= 9 ? 3 : level >= 5 ? 2 : 1'
    when: self.equipped
  - target:
      steps:
        - ability.hit
    op: changes
    when: self.equipped && 'kw.weapon' in action.item.tags && flags.tier > 0 && has(action.item.t1Damage) && participant.characteristics.agility.score < potency.average
    value:
      changes:
        - type: applyEffect
          source: '@conditions.bleeding'
          state:
            duration: "'save'"
            by: character.id
  - target:
      rolls:
        - damage
    op: add
    value: 3
    stackKey: treasure-damage
    when: self.equipped && level >= 5 && 'kw.weapon' in action.item.tags && participant.conditions.bleeding
    tags:
      - formula: "action.item.damageType == 'untyped' ? [] : ['damage.' + action.item.damageType]"
