id: complications.gnoll-mauled
type: complication
# Not for a hero who can't be dazed (Unstoppable Mind).
prerequisites:
  - id: can-be-dazed
    when: >-
      countPicks(pick.item == @ancestry-traits.high-elf.unstoppable-mind
        || pick.item == @ancestry-traits.time-raider.unstoppable-mind) == 0
