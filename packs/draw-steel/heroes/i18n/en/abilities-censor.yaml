abilities.censor.blessing-and-a-curse.name: Blessing and a Curse
abilities.censor.blessing-and-a-curse.description: '*The gods bless and damn in equal measure.*'
abilities.censor.blessing-and-a-curse.texts.trigger: The target makes a power roll.
abilities.censor.blessing-and-a-curse.texts.target: One creature
abilities.censor.blessing-and-a-curse.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.censor.blessing-and-a-curse.texts.effect: 'Effect: The target obtains a tier 1 or tier 3
  outcome on their power roll (your choice). You can then choose another target within distance, who
  obtains the opposite outcome on their next power roll.'
