abilities.censor.terror-manifest.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + P}} psychic damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.censor.terror-manifest.texts.effect: 'Effect: While frightened this way, if a target who
  is a leader or solo creature is winded, they take an extra 25 psychic damage. If a target
  frightened this way is not a leader or solo creature and is winded, they are reduced to 0
  Stamina.'
abilities.censor.edict-of-unyielding-resolve.name: Edict of Unyielding Resolve
abilities.censor.edict-of-unyielding-resolve.description: '*You and your allies are clad in shimmering armor.*'
abilities.censor.edict-of-unyielding-resolve.texts.target: Self and each ally in the area
abilities.censor.edict-of-unyielding-resolve.texts.distance: 2 aura
abilities.censor.edict-of-unyielding-resolve.texts.effect: 'Effect: Until the end of the encounter
