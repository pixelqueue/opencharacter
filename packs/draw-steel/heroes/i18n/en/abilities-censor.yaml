abilities.censor.gods-grant-thee-strength.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.censor.gods-grant-thee-strength.texts.effect: 'Effect: The target ends any condition or
  effect on them that is ended by a saving throw or that ends at the end of their turn, or a prone
  target can stand up. The target then gains 2 surges, can shift up to their speed while ignoring
  difficult terrain, and can use a strike signature ability as a free triggered action.'
abilities.censor.shield-of-the-righteous.name: Shield of the Righteous
abilities.censor.shield-of-the-righteous.description: '*You strike a foe and create a fleet of divine shields that protect your allies.*'
abilities.censor.shield-of-the-righteous.texts.target: One creature
abilities.censor.shield-of-the-righteous.texts.distance: Melee 1
abilities.censor.shield-of-the-righteous.texts.roll: Power Roll + Might
abilities.censor.shield-of-the-righteous.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + M}} damage; you and each ally adjacent to you gain 10 temporary Stamina'
abilities.censor.shield-of-the-righteous.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14 + M}} damage; you and each ally adjacent to you gain 15 temporary Stamina'
abilities.censor.shield-of-the-righteous.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {20 + M}} damage; you and each ally adjacent to you gain 20 temporary Stamina'
abilities.censor.orison-of-victory.name: Orison of Victory
abilities.censor.orison-of-victory.description: "*You channel your god's will to overcome hardship and inflict pain.*"
abilities.censor.orison-of-victory.texts.target: Self and each ally in the area
abilities.censor.orison-of-victory.texts.distance: 1 burst
abilities.censor.orison-of-victory.texts.roll: Power Roll + Presence
abilities.censor.orison-of-victory.texts.tier1: Each target gains 1 surge.
abilities.censor.orison-of-victory.texts.tier2: Each target gains 2 surges.
abilities.censor.orison-of-victory.texts.tier3: Each target gains 3 surges.
abilities.censor.orison-of-victory.texts.effect: 'Effect: A target can end one effect on them that
  is ended by a saving throw or that ends at the end of their turn, or a prone target can stand up.'
abilities.censor.righteous-judgment.name: Righteous Judgment
abilities.censor.righteous-judgment.description: '*You amplify the power of your judgment.*'
abilities.censor.righteous-judgment.texts.target: One creature
abilities.censor.righteous-judgment.texts.distance: Melee 1
abilities.censor.righteous-judgment.texts.roll: Power Roll + Might
abilities.censor.righteous-judgment.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + M}} damage'
abilities.censor.righteous-judgment.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14 + M}} damage'
abilities.censor.righteous-judgment.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {20 + M}} damage'
abilities.censor.righteous-judgment.texts.effect: 'Effect: Until the end of the encounter, whenever
  any ally deals damage to a target judged by you, that ally gains 1 surge.'
abilities.censor.it-is-justice-you-fear.name: It Is Justice You Fear
abilities.censor.it-is-justice-you-fear.description: '*I am but a vessel. Your own deeds weigh upon you.*'
abilities.censor.it-is-justice-you-fear.texts.target: One creature
abilities.censor.it-is-justice-you-fear.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.censor.it-is-justice-you-fear.texts.roll: Power Roll + Might
abilities.censor.it-is-justice-you-fear.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + M}} holy damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
abilities.censor.it-is-justice-you-fear.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {12 + M}} holy damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, frightened (save ends)'
abilities.censor.it-is-justice-you-fear.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {15 + M}} holy damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.censor.it-is-justice-you-fear.texts.effect: 'Effect: If the target is already frightened
  of you or another creature and this ability would frighten them again, they instead take psychic
  damage equal to twice your Presence score.'
abilities.censor.prescient-grace.name: Prescient Grace
abilities.censor.prescient-grace.description: '*Gifted by a prescient vision, you warn an ally of an impending attack.*'
abilities.censor.prescient-grace.texts.trigger: An enemy within 10 squares starts their turn.
abilities.censor.prescient-grace.texts.target: Self or one ally
abilities.censor.prescient-grace.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.censor.prescient-grace.texts.effect: 'Effect: You can spend a Recovery to allow the target
  to regain Stamina equal to your recovery value. The target can then take their turn immediately
  before the triggering enemy.'
abilities.censor.with-my-blessing.name: With My Blessing
abilities.censor.with-my-blessing.description: '*A word in prayer, and the gods show the way.*'
abilities.censor.with-my-blessing.texts.target: Self or one ally
abilities.censor.with-my-blessing.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.censor.with-my-blessing.texts.effect: 'Effect: The target can use a free triggered action
  to use a strike signature ability or a strike heroic ability, and has a double edge on that
  ability. If a heroic ability is chosen, reduce its Heroic Resource cost by 3 (to a minimum cost of
  0).'
abilities.censor.revelator.name: Revelator
abilities.censor.revelator.description: '*You channel holy energy to harm unbelievers and reveal those hidden from your judgment.*'
abilities.censor.revelator.texts.target: Each enemy in the area
abilities.censor.revelator.texts.distance: 3 burst
abilities.censor.revelator.texts.effect: "Effect: Each target takes holy damage equal to twice your
  Presence score. Additionally, each hidden target is automatically revealed and can't become hidden
  again until the start of your next turn. You can then use your Judgment ability against one target
  as a free triggered action."
abilities.censor.sentenced.name: Sentenced
abilities.censor.sentenced.description: '*The shock of your condemnation freezes your enemy in their boots.*'
abilities.censor.sentenced.texts.target: One creature
abilities.censor.sentenced.texts.distance: Melee 1
abilities.censor.sentenced.texts.roll: Power Roll + Presence
abilities.censor.sentenced.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + P}} damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.censor.sentenced.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + P}} damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.censor.sentenced.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {12 + P}} damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.censor.sentenced.texts.effect: 'Effect: While the target is restrained this way, your
  abilities that impose forced movement can still move them.'
abilities.censor.blessing-of-the-faithful.name: Blessing of the Faithful
abilities.censor.blessing-of-the-faithful.description: '*The gods reward your faith.*'
abilities.censor.blessing-of-the-faithful.texts.target: Self and each ally in the area
abilities.censor.blessing-of-the-faithful.texts.distance: 3 aura
abilities.censor.blessing-of-the-faithful.texts.effect: 'Effect: Until the end of the encounter or
  until you are dying, each target gains 1 surge at the end of each of your turns.'
abilities.censor.edict-of-purifying-pacifism.name: Edict of Purifying Pacifism
abilities.censor.edict-of-purifying-pacifism.description: '*You shed a righteous energy that punishes enemies who would harm you or your allies.*'
abilities.censor.edict-of-purifying-pacifism.texts.target: Each enemy in the area
abilities.censor.edict-of-purifying-pacifism.texts.distance: 2 aura
abilities.censor.edict-of-purifying-pacifism.texts.effect: 'Effect: Until the end of the encounter
  or until you are dying, whenever a target makes a strike, they take holy damage equal to twice
  your Presence score. A target judged by you takes an extra 2d6 holy damage.'
abilities.censor.edict-of-disruptive-isolation.name: Edict of Disruptive Isolation
abilities.censor.edict-of-disruptive-isolation.description: '*The evil within your foes detonates with holy fire that burns only the guilty.*'
abilities.censor.edict-of-disruptive-isolation.texts.target: Each enemy in the area
abilities.censor.edict-of-disruptive-isolation.texts.distance: 2 aura
abilities.censor.edict-of-disruptive-isolation.texts.effect: 'Effect: Until the end of the encounter
  or until you are dying, each target takes holy damage equal to your Presence score at the end of
  each of your turns. A target takes an extra 2d6 holy damage if they are judged by you or if they
  are adjacent to any enemy.'
abilities.censor.edict-of-perfect-order.name: Edict of Perfect Order
abilities.censor.edict-of-perfect-order.description: '*Within the area of your divine presence, your enemies will regret using their fell abilities.*'
abilities.censor.edict-of-perfect-order.texts.target: Each enemy in the area
abilities.censor.edict-of-perfect-order.texts.distance: 2 aura
abilities.censor.edict-of-perfect-order.texts.effect: 'Effect: Until the end of the encounter or
  until you are dying, whenever a target uses an ability that costs Malice (see [Draw Steel:
  Monsters](https://mcdm.gg/DS-Monsters)), they take holy damage equal to three times your Presence
  score. A target judged by you takes an extra 2d6 holy damage.'
abilities.censor.edict-of-stillness.name: Edict of Stillness
abilities.censor.edict-of-stillness.description: '*The holy aura you project makes it painful for evil-doers to leave your reach.*'
abilities.censor.edict-of-stillness.texts.target: Each enemy in the area
abilities.censor.edict-of-stillness.texts.distance: 2 aura
abilities.censor.edict-of-stillness.texts.effect: 'Effect: Until the end of the encounter or until
  you are dying, whenever a target moves or is force moved out of the area, they take holy damage
  equal to twice your Presence score. A target judged by you who moves willingly takes an extra 2d6
  holy damage.'
abilities.censor.banish.name: Banish
abilities.censor.banish.description: "*You sever the target's tenuous connection to the world.*"
abilities.censor.banish.texts.target: One creature
abilities.censor.banish.texts.distance: Melee 1
abilities.censor.banish.texts.roll: Power Roll + Might
abilities.censor.banish.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + M}} damage; P < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, the target is banished (save ends)'
abilities.censor.banish.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {8 + M}} damage; P < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target is banished (save ends)'
abilities.censor.banish.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11 + M}} damage; P < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, the target is banished (save ends)'
abilities.censor.banish.texts.effect: "Effect: This ability gains an edge against demons, devils,
  undead, and creatures not native to your current world. If you know the target's true name, this
  ability has a double edge. While banished, the target is sent to another manifold in the timescape
  and removed from the encounter map. A banished target can do nothing but make saving throws, and
  takes 10 holy damage each time they do so. If the target is reduced to 0 Stamina while banished,
  they are lost to the timescape."
abilities.censor.fulfill-your-destiny.name: Fulfill Your Destiny
abilities.censor.fulfill-your-destiny.description: '*You have looked at various futures, and only this one works.*'
abilities.censor.fulfill-your-destiny.texts.trigger: You or another hero ends their turn.
abilities.censor.fulfill-your-destiny.texts.target: One ally
abilities.censor.fulfill-your-destiny.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.censor.fulfill-your-destiny.texts.effect: 'Effect: The target takes their turn after the
  triggering hero, and immediately removes all conditions and negative effects on themself. During
  their turn, the target has a double edge on power rolls.'
abilities.censor.apostate.name: Apostate
abilities.censor.apostate.description: "*You channel holy energy to seal an enemy's fate.*"
abilities.censor.apostate.texts.target: One creature
abilities.censor.apostate.texts.distance: Melee 1
abilities.censor.apostate.texts.roll: Power Roll + Might
abilities.censor.apostate.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {13 + M}} holy damage'
abilities.censor.apostate.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {19 + M}} holy damage'
abilities.censor.apostate.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {26 + M}} holy damage'
abilities.censor.apostate.texts.effect: 'Effect: Until the end of the encounter or until you are dying, the target has damage weakness 10.'
abilities.censor.terror-manifest.name: Terror Manifest
abilities.censor.terror-manifest.description: '*"I know what you fear."*'
abilities.censor.terror-manifest.texts.target: One creature
abilities.censor.terror-manifest.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.censor.terror-manifest.texts.roll: Power Roll + Presence
abilities.censor.terror-manifest.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + P}} psychic damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
