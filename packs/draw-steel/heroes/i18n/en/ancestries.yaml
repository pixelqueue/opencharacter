ancestry-traits.devil.silver-tongue.name: Silver Tongue
ancestry-traits.devil.silver-tongue.description: "Your innate magic allows you to twist how your
  words are perceived to get a better read on people and convince them to see things your way. You
  have one skill of your choice from the interpersonal skill group (see Skills in Chapter 9: Tests),
  and you gain an edge on tests when attempting to discover an NPC's motivations and pitfalls during
  a negotiation (see Chapter 11: Negotiation)."
ancestry-traits.devil.barbed-tail.name: Barbed Tail
ancestry-traits.devil.barbed-tail.description: Your pointy tail allows you to punctuate all your
  actions. Once per round when you make a melee strike, you can deal extra damage with the strike
  equal to your highest characteristic score.
ancestry-traits.devil.beast-legs.name: Beast Legs
ancestry-traits.devil.beast-legs.description: Your powerful legs make you faster. You have speed 6.
ancestry-traits.devil.glowing-eyes.name: Glowing Eyes
ancestry-traits.devil.glowing-eyes.description: Your eyes are a solid, vibrant color that flares to
  show your excitement or rage. Whenever you take damage from a creature, you can use a triggered
  action to deal that creature psychic damage equal to 1d10 + your level.
ancestry-traits.devil.hellsight.name: Hellsight
ancestry-traits.devil.hellsight.description: Your eyes let you see through darkness, fog, and other
  obscuring effects. You don't take a bane on strikes made against creatures with concealment.
ancestry-traits.devil.impressive-horns.name: Impressive Horns
ancestry-traits.devil.impressive-horns.description: Your cherished horns are larger than the average
  devil's, and a hardened representation of your force of will. Whenever you make a saving throw,
  you succeed on a roll of 5 or higher.
ancestry-traits.devil.prehensile-tail.name: Prehensile Tail
ancestry-traits.devil.prehensile-tail.description: Your prehensile tail allows you to challenge foes on all sides. You can't be flanked.
ancestry-traits.devil.wings.name: Wings
ancestry-traits.devil.wings.description: You possess wings powerful enough to take you airborne.
  While using your wings to fly, you can stay aloft for a number of rounds equal to your Might score
  (minimum 1 round) before you fall. While using your wings to fly at 3rd level or lower, you have
  damage weakness 5.
ancestries.devil.name: Devil
ancestries.devil.description: >-
  The native ancestry of the Seven Cities of Hell, devils are humanoids with red or blue skin
  expressed in a wide variety of hues, from bright crimson to deep purple. Each devil is born with
  some *hellmark*—horns, a tail, cloven hooves, a forked tongue, fanged incisors, or even wings.


  Hell is dominated by the Seven Cities of Hell, each ruled by a different archdevil who constantly
  plots and schemes against the others in the hope of ascending to the Throne of Hell.


  Those devils who join "the trade," as their civil service is called, spend their days in
  bureaucratic service hoping or scheming for promotion. Devils looking for a quick path up the
  bureaucratic ladder sign up for the Exchange, whereby mortals in the mundane world who perform the
  right rituals can summon a devil, who bargains with the supplicant on behalf of their archdevil.
  Archdevils can grant temporary worldly power in exchange for a supplicant's soul, with the
  summoned devil acting as the broker.


  On rare occasions, though, the summoning goes wrong and the supplicant dies before the deal can be
  struck, stranding the summoned devil on Orden permanently. Some stranded devils seek to return to
  Hell, but most prefer life in Orden, where the phrase "stabbed in the back by a colleague" is
  usually a metaphor.


  The majority of devils in Orden are not from, nor have ever been to, the Seven Cities. They are
  descendants of devils who were stranded in the mundane world decades, centuries, even millennia
  ago.
ancestries.devil.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.dragon-knight.wyrmplate.name: Wyrmplate
ancestry-traits.dragon-knight.wyrmplate.description: 'Your hardened scales grant you damage immunity
  equal to your level to one of the following damage types: acid, cold, corruption, fire, lightning,
  or poison. You can change your damage immunity type when you finish a respite.'
ancestry-traits.dragon-knight.draconian-guard.name: Draconian Guard
ancestry-traits.dragon-knight.draconian-guard.description: Whenever you or an adjacent creature
  takes damage from a strike, you can use a triggered action to guard against the blow. You reduce
  any damage from the strike by an amount equal to your level.
ancestry-traits.dragon-knight.draconian-pride.name: Draconian Pride
ancestry-traits.dragon-knight.draconian-pride.description: You have the following signature ability.
ancestry-traits.dragon-knight.dragon-breath.name: Dragon Breath
ancestry-traits.dragon-knight.dragon-breath.description: You have the following signature ability.
ancestry-traits.dragon-knight.prismatic-scales.name: Prismatic Scales
ancestry-traits.dragon-knight.prismatic-scales.description: Select one damage immunity granted by
  your Wyrmplate trait. You always have this immunity, in addition to the immunity granted by
  Wyrmplate.
ancestry-traits.dragon-knight.remember-your-oath.name: Remember Your Oath
ancestry-traits.dragon-knight.remember-your-oath.description: >-
  As a maneuver, you can recite the following oath. Until the start of your next turn, whenever you
  make a saving throw, you succeed on a 4 or higher.


  *Even should the sun stop in the sky Even should the night last a thousand years I will stand
  forever I shall not yield Those who suffer and yearn for justice I am your sword and shield I will
  yield no ground I will speak no lies I will stand against all tyrants Until the last villain dies*
ancestry-traits.dragon-knight.wings.name: Wings
ancestry-traits.dragon-knight.wings.description: You possess wings powerful enough to take you
  airborne. While using your wings to fly, you can stay aloft for a number of rounds equal to your
  Might score (minimum 1 round) before you fall. While using your wings to fly at 3rd level or
  lower, you have damage weakness 5.
ancestries.dragon-knight.name: Dragon Knight
ancestries.dragon-knight.description: >-
  The ritual of Dracogenesis that grants the power to create a generation of dragon knights—also
  known as draconians or wyrmwights—is obscure and supremely difficult for even an experienced
  sorcerer to master. Small populations of draconians in Khemhara, Higara, and Khoursir attest to
  this. Descendants of original generations created millennia ago by powerful wizards, they have
  never been numerous. A typical clutch yields only a single egg. After only a few generations,
  these draconians begin to show new adaptations like feathers or frilled ridges.


  The largest extant population of draconians is the remnants of the Dragon Phalanx in Vasloria.
  Created by Good King Omund's wizard Vitae, the Dragon Phalanx once numbered several thousand of
  the king's greatest knights, ensuring the rule of law across the land.


  Knighthood was a title carried by every member of that first generation of dragon knights. Within
  the Dragon Phalanx were shadows, censors, tacticians, and elementalists. Members of virtually
  every heroic vocation could be found in one of the eight dragonflights that made up the phalanx.
  For over 30 years, these heroes were symbols of justice, protecting the weak from the strong, and
  standing between the common folk and those who sought power over others. Those who grew up in that
  place and time could not imagine any other way of life.


  Then Ajax came.
ancestries.dragon-knight.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.dwarf.runic-carving.name: Runic Carving
ancestry-traits.dwarf.runic-carving.description: >-
  You can carve a rune onto your skin with 10 uninterrupted minutes of work, which is activated by
  the magic within your body. The rune you carve determines the benefit you receive, chosen from
  among the following:


  **Detection:** Pick a specific type of creature (such as goblins or humans) or object (such as
  gems or potions). Your rune glows softly when you are within 20 squares of any creature or object
  of that type, even if you don't have line of effect to the creature or object. You can change the
  type of creature or object as a maneuver.


  **Light:** Your skin sheds light for 10 squares. You can turn this light on and off as a maneuver.


  **Voice:** As a maneuver, you can communicate telepathically with a willing creature you have met
  before and who is within 1 mile of you. You must know the creature's name, and they must speak and
  understand a language you know. You and the creature can respond to one another as if having a
  spoken conversation. You can communicate with a different creature by changing the rune.


  You can have one rune active at a time, and can change or remove a rune with 10 uninterrupted
  minutes of work.
ancestry-traits.dwarf.great-fortitude.name: Great Fortitude
ancestry-traits.dwarf.great-fortitude.description: Your hearty constitution prevents you from losing strength. You can't be made weakened.
ancestry-traits.dwarf.grounded.name: Grounded
ancestry-traits.dwarf.grounded.description: Your heavy stone body and connection to the earth make
  it difficult for others to move you. You have a +1 bonus to stability.
ancestry-traits.dwarf.spark-off-your-skin.name: Spark Off Your Skin
ancestry-traits.dwarf.spark-off-your-skin.description: Your stone skin affords you potent
  protection. You have a +6 bonus to Stamina, and that bonus increases by 6 at 4th, 7th, and 10th
  levels.
ancestry-traits.dwarf.stand-tough.name: Stand Tough
ancestry-traits.dwarf.stand-tough.description: Your body is made to withstand the blows of your
  enemies. Your Might score is treated as 1 higher for the purpose of resisting potencies, and you
  gain an edge on Might tests when called for to resist environmental effects or a creature's traits
  or abilities.
ancestry-traits.dwarf.stone-singer.name: Stone Singer
ancestry-traits.dwarf.stone-singer.description: You have a magic connection to the earth. When you
  spend 1 uninterrupted hour singing, you can reshape any unworked mundane stone within 3 squares.
  You can't destroy this stone, but you can move each square of it anywhere within 3 squares, piling
  it off to one side to dig a hole or building it up to create a wall.
ancestries.dwarf.name: Dwarf
ancestries.dwarf.description: >-
  Possessed of a strength that belies their size, dwarves have flesh infused with stone—a
  silico-organic hybrid making them physically denser than other humanoids. They enjoy a reputation
  in Orden as savvy engineers and technologists thanks to the lore they inherited from their elder
  siblings, the long-extinct steel dwarves.


  Dwarves are the children of the elder god Ord, and a common phrase among dwarves is "Ord made the
  world"-their way of saying, "What will be, will be." They take great pride in knowing that along
  with Aan, Eth, and Kul, their god created the mundane world, and many dwarves leave their homes to
  see the world and seek glory in Ord's name.
ancestries.dwarf.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.hakaan.big.name: Big!
ancestry-traits.hakaan.big.description: Your stature reflects your giant forebears. Your size is 1L.
ancestry-traits.hakaan.all-is-a-feather.name: All Is a Feather
ancestry-traits.hakaan.all-is-a-feather.description: You are exceptionally strong. You gain an edge on tests made to lift and haul heavy objects.
ancestry-traits.hakaan.doomsight.name: Doomsight
ancestry-traits.hakaan.doomsight.description: >-
  Working with your Director, you can predetermine an encounter in which you will die. When that
  encounter begins, you become doomed. While doomed, you automatically obtain a tier 3 outcome on
  tests and ability rolls, and you don't die no matter how low your Stamina falls. You then die
  immediately at the end of the encounter, and can't be returned to life by any means.


  If you don't predetermine your death encounter, you can choose to become doomed while you are
  dying with the Director's approval (no action required). Doing so should be reserved for
  encounters in which you are dying as a result of suitable heroism, such as making a last stand
  against a boss or saving civilians, or when the consequences of your actions have finally caught
  up to you—not because you're playing a one-shot and have nothing to lose, Hacaarl.


  Additionally, when your Stamina reaches the negative of your winded value and you are not doomed,
  you turn to rubble instead of experiencing death. You are unaware of your surroundings in this
  state, and you can't regain Stamina or have this effect undone in any way. After 12 hours, you
  regain Stamina equal to your recovery value.
ancestry-traits.hakaan.forceful.name: Forceful
ancestry-traits.hakaan.forceful.description: Whenever you force move a creature or object, the forced movement distance gains a +1 bonus.
ancestry-traits.hakaan.great-fortitude.name: Great Fortitude
ancestry-traits.hakaan.great-fortitude.description: Your hearty constitution prevents you from losing strength. You can't be made weakened.
ancestry-traits.hakaan.stand-tough.name: Stand Tough
ancestry-traits.hakaan.stand-tough.description: Your body is made to withstand the blows of your
  enemies. Your Might score is treated as 1 higher for the purpose of resisting potencies, and you
  gain an edge on Might tests when called for to resist environmental effects or a creature's traits
  or abilities.
ancestries.hakaan.name: Hakaan
ancestries.hakaan.description: >-
  In spite of their friendly, outgoing nature, the rare presence of a hakaan in human society is
  considered a harbinger. An omen of dark times.


  Descended from a tribe of giants in upper Vanigar, the original Haka'an tribe made a bargain with
  Holkatya the Vanigar trickster god. They traded some of their gigantic size and strength for the
  ability to see the future.


  But Holkatya betrayed them, and the only future a hakaan is allowed to see is the moment and
  nature of their own death. These visions are never of some mundane tragedy. No hakaan ever
  received a vision of dying from choking on a grape. This Doomsight is always momentous. Always
  dramatic.


  The Doomsight can happen at any moment. It does not come for all or even most hakaan, but when it
  comes, it is considered an act of overwhelming hubris to ignore it. Trying to escape the Doomsight
  means a painful, tragic death, and cursing your family to live with shame.


  But the only hakaan the average human meets is one trying to fulfill their doom. The human
  superstition—that the arrival of one or more hakaan in human lands is a sign of great forces
  acting in the world, auspicious times—is literally true. In dark times, many hakaan experience the
  Doomsight and leave their communities to venture out into the mundane world, in search of their
  destiny.


  Humans in Vanigar have their own word for this concept of a personal fate. "Wyrd." Traditional
  hakaan sometimes refer to the Doomsight as "wyrdken."
ancestries.hakaan.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.high-elf.high-elf-glamor.name: High Elf Glamor
ancestry-traits.high-elf.high-elf-glamor.description: A magic glamor makes others perceive you as
  interesting and engaging, granting you an edge on Presence tests using the Flirt or Persuade
  skills. This glamor makes you appear and sound slightly different to each creature you meet, since
  what is engaging to one might be different for another. However, you never appear to be anyone
  other than yourself.
ancestry-traits.high-elf.glamor-of-terror.name: Glamor of Terror
ancestry-traits.high-elf.glamor-of-terror.description: When a foe strikes, you reverse the magic of
  your glamor to instill fear into their heart. Whenever you take damage from a creature, you can
  use a triggered action to make that creature frightened of you until the end of their next turn.
ancestry-traits.high-elf.graceful-retreat.name: Graceful Retreat
ancestry-traits.high-elf.graceful-retreat.description: You gain a +1 bonus to the distance you can shift when you take the Disengage move action.
ancestry-traits.high-elf.high-senses.name: High Senses
ancestry-traits.high-elf.high-senses.description: Your senses are especially keen and perceptive. You gain an edge on tests made to notice threats.
ancestry-traits.high-elf.otherworldly-grace.name: Otherworldly Grace
ancestry-traits.high-elf.otherworldly-grace.description: Your elf body and mind can't be contained
  for long. Whenever you make a saving throw, you succeed on a roll of 5 or higher.
ancestry-traits.high-elf.revisit-memory.name: Revisit Memory
ancestry-traits.high-elf.revisit-memory.description: Accessing memories is as easy as living in the
  present for you. You gain an edge on tests made to recall lore.
ancestry-traits.high-elf.unstoppable-mind.name: Unstoppable Mind
ancestry-traits.high-elf.unstoppable-mind.description: Your mind allows you to maintain your focus in any situation. You can't be made dazed.
ancestries.high-elf.name: High Elf
ancestries.high-elf.description: >-
  Children of the solar celestials created to tend their libraries and attend to the true elves as
  heralds, high elf history describes a better age, before the coming of humans and war. A time when
  the celestials were still in the world, and all that mattered was art and beauty.


  In the millennia since their creators retired to Arcadia, the high elves built a civilization for
  themselves, primarily living in and among the fallen celestial sky cities. With no creators left
  to please, the elves continue as they did before—collecting lore and knowledge, worshipping art,
  and turning more inward and distrusting of outsiders with each generation.
ancestries.high-elf.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.human.detect-the-supernatural.name: Detect the Supernatural
ancestry-traits.human.detect-the-supernatural.description: As a maneuver, you can open your
  awareness to detect supernatural creatures and phenomena. Until the end of your next turn, you
  know the location of any supernatural object, or any undead, construct, or creature from another
  world within 5 squares, even if you don't have line of effect to that object or creature. You know
  if you're detecting an item or a creature, and you know the nature of any creature you detect.
ancestry-traits.human.cant-take-hold.name: Can't Take Hold
ancestry-traits.human.cant-take-hold.description: Your connection to the natural world allows you to
  resist certain supernatural effects. You ignore temporary difficult terrain created by magic and
  psionic abilities. Additionally, when you are force moved by a magic or psionic ability, you can
  reduce the forced movement distance by 1.
ancestry-traits.human.determination.name: Determination
ancestry-traits.human.determination.description: A tolerance for pain and distress allows you to
  push through difficult situations. If you are frightened, slowed, or weakened, you can use a
  maneuver to immediately end one of those conditions.
ancestry-traits.human.perseverance.name: Perseverance
ancestry-traits.human.perseverance.description: Giving up is for other people. You gain an edge on
  tests made using the Endurance skill. Additionally, when you are slowed, your speed is reduced to
  3 instead of 2.
ancestry-traits.human.resist-the-unnatural.name: Resist the Unnatural
ancestry-traits.human.resist-the-unnatural.description: Your instinctive resilience protects you
  from injuries beyond the routine. Whenever you take damage that isn't untyped, you can use a
  triggered action to take half the damage.
ancestry-traits.human.staying-power.name: Staying Power
ancestry-traits.human.staying-power.description: Your human physiology allows you to fight, run, and
  stay awake longer than others. You increase your number of Recoveries by 2.
ancestries.human.name: Human
ancestries.human.description: >-
  Humans belong to the world in a way the other speaking peoples do not. You can sense the presence
  of the supernatural—that... oily smell in the air, as I've heard it described. And the presence of
  deathless causes the hairs on the back of your neck to stand up. Or why do you think graveyards
  affect you so? Whatever magic is, its grip on you is light. Whatever drives the deathless, your
  nature rebels against it.


  "No one knows why this should be. We elves have no such senses. Nor do the elementals or the
  kanin... the dwarves and the orcs as you say. What is it that sets humans apart? I am an
  historian, not a physician. I cannot say. Perhaps some of you will one day find out and teach us
  all the reason."
ancestries.human.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.memonek.fall-lightly.name: Fall Lightly
ancestry-traits.memonek.fall-lightly.description: Your silicone body is low in density. Whenever you
  fall, you reduce the distance of the fall by 2 squares.
ancestry-traits.memonek.lightweight.name: Lightweight
ancestry-traits.memonek.lightweight.description: Your body is light for a creature of your height.
  Whenever another creature attempts to force move you, you treat your size as one size smaller than
  it is.
ancestry-traits.memonek.i-am-law.name: I Am Law
ancestry-traits.memonek.i-am-law.description: Your lawful nature and quick reflexes mean you give no
  quarter to creatures trying to get past you. Enemies can't move through your space unless you
  allow them to do so.
ancestry-traits.memonek.keeper-of-order.name: Keeper of Order
ancestry-traits.memonek.keeper-of-order.description: Your connection to Axiom, the plane of
  Uttermost Law, allows you to manage chaos around you. Once per round when you or an adjacent
  creature makes a power roll, you can use a free triggered action to remove an edge or a bane on
  the roll, to turn a double edge into an edge, or to turn a double bane into a bane.
ancestry-traits.memonek.lightning-nimbleness.name: Lightning Nimbleness
ancestry-traits.memonek.lightning-nimbleness.description: You can push your body to move at incredible speeds. Your speed is 7.
ancestry-traits.memonek.nonstop.name: Nonstop
ancestry-traits.memonek.nonstop.description: Your connection to Axiom allows you to regulate your movement. You can't be made slowed.
ancestry-traits.memonek.systematic-mind.name: Systematic Mind
ancestry-traits.memonek.systematic-mind.description: You gain an edge on tests made to parse
  schematics, maps, and other systematic documents that aren't inherently chaotic. In addition, you
  treat any language you don't know as if you know a related language.
ancestry-traits.memonek.unphased.name: Unphased
ancestry-traits.memonek.unphased.description: Your ordered mind can't be caught off guard. You can't be made surprised.
ancestry-traits.memonek.useful-emotion.name: Useful Emotion
ancestry-traits.memonek.useful-emotion.description: Velloparatha—the worldsickness—might hinder you,
  but you know how to turn your pain into something your enemies feel. At the start of any combat,
  you gain 1 surge.
ancestries.memonek.name: Memonek
ancestries.memonek.description: >-
  The native denizens of Axiom, the Plane of Uttermost Law, memonek dwell in a land with lakes and
  trees and birds and flowers. But on this alien world, the lakes are seas of mercury, the birds
  glitter with wings of glass stretched gossamer thin, and the flowers' petals are iridescent metal
  as flexible and fragile as any earthly rose.


  The minds of memonek are highly ordered. Their reason is their great pride. But when descending to
  the lower planes, including a manifold like Orden where law and chaos mix, a sickness comes over
  them—an uncontrollable sensation called emotion.
ancestries.memonek.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.orc.relentless.name: Relentless
ancestry-traits.orc.relentless.description: Whenever a creature deals damage to you that leaves you
  dying, you can make a free strike against any creature. If the creature is reduced to 0 Stamina by
  your strike, you can spend a Recovery.
ancestry-traits.orc.bloodfire-rush.name: Bloodfire Rush
ancestry-traits.orc.bloodfire-rush.description: The magic coursing through your veins makes you run
  faster in the heat of battle. The first time in any combat round that you take damage, you gain a
  +2 bonus to speed until the end of the round.
ancestry-traits.orc.glowing-recovery.name: Glowing Recovery
ancestry-traits.orc.glowing-recovery.description: Your bloodfire allows you to regain your strength
  quicker than others. Whenever you use the Catch Breath maneuver, you can spend as many Recoveries
  as you like.
ancestry-traits.orc.grounded.name: Grounded
ancestry-traits.orc.grounded.description: The magic in your blood makes it difficult for others to
  move you. You have a +1 bonus to stability.
ancestry-traits.orc.nonstop.name: Nonstop
ancestry-traits.orc.nonstop.description: Your bloodfire supplies you with a constant rush of adrenaline. You can't be made slowed.
ancestry-traits.orc.passionate-artisan.name: Passionate Artisan
ancestry-traits.orc.passionate-artisan.description: When you are stirred by a passion for creation,
  your bloodfire allows you to work longer and harder. When you gain your initial skills from your
  career, culture, class, or other source, choose two skills from the crafting skill group, whether
  you have those skills or not. Whenever you make a project roll for a crafting project that uses
  these skills, you gain a +2 bonus to the roll.
ancestries.orc.name: Orc
ancestries.orc.description: >-
  An anger that cannot be hidden. A fury that drives them in battle. Orcs are famed throughout the
  world as consummate warriors—a reputation that the peace—loving orcs find distasteful.


  The fifth of the speaking peoples, orcs arrived on Orden after humans and elves. They made their
  homes in the borderlands between those two cultures, preferring the natural forests and avoiding
  the elf-haunted wodes. For generations, this put them directly in the path of humans who cut down
  the trees and built roads and farms.


  Each orc has within them a fire that causes their veins to glow once blood is drawn. This anger
  propels them right to the edge of death. The dichotomy between their desire to be left alone and
  their zeal in battle is summarized in a dwarf proverb:


  "Be thankful orcs do not hold grudges."
ancestries.orc.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.polder.shadowmeld.name: Shadowmeld
ancestry-traits.polder.shadowmeld.description: You have the following ability.
ancestry-traits.polder.small.name: Small!
ancestry-traits.polder.small.description: Your diminutive stature lets you easily get out of—or into—trouble. Your size is 1S.
ancestry-traits.polder.corruption-immunity.name: Corruption Immunity
ancestry-traits.polder.corruption-immunity.description: Your innate shadow magic grants you
  resilience against the unnatural. You have corruption immunity equal to your level + 2.
ancestry-traits.polder.fearless.name: Fearless
ancestry-traits.polder.fearless.description: Courage is all you know. You can't be made frightened.
ancestry-traits.polder.graceful-retreat.name: Graceful Retreat
ancestry-traits.polder.graceful-retreat.description: Your small size makes it easier for you to slip
  away from the fray. You gain a +1 bonus to the distance you can shift when you take the Disengage
  move action.
ancestry-traits.polder.nimblestep.name: Nimblestep
ancestry-traits.polder.nimblestep.description: A light step serves you well when speed is of the
  essence. You ignore the effects of difficult terrain and can move at full speed while sneaking.
ancestry-traits.polder.polder-geist.name: Polder Geist
ancestry-traits.polder.polder-geist.description: Evading others' notice gives you freedom to move.
  At the start of each of your turns during combat, if no enemy has line of effect to you or if you
  are hidden from or have concealment from any enemy with line of effect to you, you gain a +3 bonus
  to speed until the end of your turn.
ancestry-traits.polder.reactive-tumble.name: Reactive Tumble
ancestry-traits.polder.reactive-tumble.description: Staying light on your feet lets you quickly get
  back into position. Whenever you are force moved, you can use a free triggered action to shift 1
  square after the forced movement is resolved.
ancestries.polder.name: Polder
ancestries.polder.description: >-
  After humans, polders are the most numerous and diverse ancestry in Orden. They are not humans,
  but they live in and among humans and share their gods and culture. Almost every human culture in
  Orden has a polder saint or a human saint venerated by polder.


  Short, averaging 31/2 feet tall, the polders' origins are obscure. They are a young species who,
  like humans, have no single patron god. Their ability to *shadowmeld* means they enjoy a
  reputation as excellent spies and thieves. Many polders consider this a base slander and point out
  they're also famed as chefs, though polders can be found in every profession, especially in
  cities.
ancestries.polder.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.revenant.former-life.name: Former Life
ancestry-traits.revenant.former-life.description: >-
  Choose the ancestry you were before you died. Your size is that ancestry's size and your speed is
  5. Unless you select one of the Previous Life traits (see below), you don't receive any other
  ancestral traits from your original ancestry.


  **Previous Life: 1 Point (1 Point):** You select a purchased trait that costs 1 ancestry point
  from your previous ancestry. You can take this trait multiple times, selecting a different 1 point
  trait from your previous ancestry each time.


  **Previous Life: 2 Points (2 Points):** You select a purchased trait that costs 2 ancestry points
  from your previous ancestry.
ancestry-traits.revenant.tough-but-withered.name: Tough But Withered
ancestry-traits.revenant.tough-but-withered.description: >-
  Your undead body grants you immunity to cold, corruption, lightning, and poison damage equal to
  your level, but you have fire weakness 5. You can't suffocate, and you don't need to eat or drink
  to stay alive.


  Additionally, when your Stamina reaches the negative of your winded value, you become inert
  instead of dying. You fall prone and can't stand. You continue to observe your surroundings, but
  you can't speak, take main actions, maneuvers, move actions, or triggered actions. While inert
  this way, if you take any fire damage, your body is destroyed and you die. Otherwise, after 12
  hours, you regain Stamina equal to your recovery value.
ancestry-traits.revenant.bloodless.name: Bloodless
ancestry-traits.revenant.bloodless.description: For you, an open wound is indistinguishable from a
  scratch. You can't be made bleeding even while dying.
ancestry-traits.revenant.undead-influence.name: Undead Influence
ancestry-traits.revenant.undead-influence.description: Your supernatural gifts allow you to
  influence other undead. You gain an edge on Reason, Intuition, and Presence tests made to interact
  with undead creatures.
ancestry-traits.revenant.vengeance-mark.name: Vengeance Mark
ancestry-traits.revenant.vengeance-mark.description: >-
  As a maneuver, you place a magic sigil on a creature within 10 squares. When you place a sigil,
  you decide where it appears on the creature's body, and whether the sigil is visible to only you
  or to all creatures.


  You always know the direction to the exact location of a creature who bears one of your sigils and
  is on the same world. You can have a number of active sigils equal to your level, and can remove a
  sigil from a creature at will (no action required). If you already have the maximum number of
  sigils activated and you place a new one, your oldest sigil disappears with no other effect.


  Additionally, you have the following signature ability. Signature abilities can be used at will.
ancestries.revenant.name: Revenant
ancestries.revenant.description: >-
  The dead walk among us. Some of them are happier about it than others.


  Unlike the necromantic rituals that produce wights and wraiths and zombies, revenants rise from
  the grave through a combination of an unjust death and a burning desire for vengeance. Creatures
  sustained on pure will, they have no need of food or water or air—and, unlike their zombified
  cousins, they retain all their memories and personality from life.


  These revenants are rare. Many are hunted by ignorant villagers who see only their dead flesh and
  assume the worst. Those who survive the pitchfork brigade either choose a solitary life, often as
  a wandering soul seeking out living company yet constantly in fear of it, or they migrate to a
  metropolis such as Blackbottom or Capital, where lost souls gather to make a home.
ancestries.revenant.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.time-raider.psychic-scar.name: Psychic Scar
ancestry-traits.time-raider.psychic-scar.description: Your mind is a formidable layer of defense. You have psychic immunity equal to your level.
ancestry-traits.time-raider.beyondsight.name: Beyondsight
ancestry-traits.time-raider.beyondsight.description: As a maneuver, you can adjust your vision to
  allow you to see through mundane obstructions that are 1 square thick or less. While your vision
  is adjusted this way, you can't see the area within 1 square of you and you don't have line of
  effect to any creature or object in that area. You can restore your usual vision as a maneuver.
ancestry-traits.time-raider.foresight.name: Foresight
ancestry-traits.time-raider.foresight.description: Your senses extend past mundane obscuration and
  the veil of the future alike. You automatically know the location of any creature with concealment
  who isn't hidden from you within 20, and you negate the usual bane on strikes against such
  creatures. Additionally, whenever you are targeted by a strike, you can use a triggered action to
  impose a bane on the power roll.
ancestry-traits.time-raider.four-armed-athletics.name: Four-Armed Athletics
ancestry-traits.time-raider.four-armed-athletics.description: Your unique physiology enhances your
  movement. You gain an edge on tests that use the Climb, Gymnastics, or Swim skills when you can
  use all your arms in the attempt.
ancestry-traits.time-raider.four-armed-martial-arts.name: Four-Armed Martial Arts
ancestry-traits.time-raider.four-armed-martial-arts.description: Your multiple arms let you take on
  multiple tasks at the same time. Whenever you use the Grab or Knockback maneuver against an
  adjacent creature, you can target one additional adjacent creature, using the same power roll for
  both targets. Additionally, you can have up to two creatures grabbed at a time.
ancestry-traits.time-raider.psionic-gift.name: Psionic Gift
ancestry-traits.time-raider.psionic-gift.description: Choose one signature ability from the following options. Signature abilities can be used at will.
ancestry-traits.time-raider.unstoppable-mind.name: Unstoppable Mind
ancestry-traits.time-raider.unstoppable-mind.description: Your mind allows you to maintain your focus in any situation. You can't be made dazed.
ancestries.time-raider.name: Time Raider
ancestries.time-raider.description: >-
  The original servitor species of the synliroi—evil psions with near godlike power—the kuran'zoi
  liberated themselves during the First Psychic War. In the centuries since, they built their own
  culture and civilization as nomads of the timescape. The exonym "time raiders" was given to them
  by denizens of the lower worlds who, seeing the advanced technology the kuran'zoi wield, concluded
  they must be from the future.


  Extraordinarily rare in Orden, time raiders thrive on the Sea of Stars, the Sea Between Worlds,
  where the winds of limbo roar.


  In place of eyes, kuran'zoi possess crystalline ocular sensors that grant them high-spectral
  vision and which are hardened against the extreme radiations encountered in the Sea of Stars,
  permitting them to operate freely outside their vessels with only their portable rebreathers. Time
  raiders also have two sets of arms, allowing them to wield melee weapons at the same time as
  ranged weapons. A single well-trained kuran'zoi is like a squad unto themself.
ancestries.time-raider.choices.trait.prompt: Ancestry trait (point {slot})
ancestry-traits.wode-elf.wode-elf-glamor.name: Wode Elf Glamor
ancestry-traits.wode-elf.wode-elf-glamor.description: You can magically alter your appearance to
  better blend in with your surroundings. You gain an edge on tests made to hide and sneak, and
  tests made to search for you while you are hidden take a bane.
ancestry-traits.wode-elf.forest-walk.name: Forest Walk
ancestry-traits.wode-elf.forest-walk.description: You can shift into and while within difficult terrain.
ancestry-traits.wode-elf.quick-and-brutal.name: Quick and Brutal
ancestry-traits.wode-elf.quick-and-brutal.description: Whenever you score a critical hit, you can
  take an additional main action and an additional move action instead of just a main action.
ancestry-traits.wode-elf.otherworldly-grace.name: Otherworldly Grace
ancestry-traits.wode-elf.otherworldly-grace.description: Your elf body and mind can't be contained
  for long. Whenever you make a saving throw, you succeed on a roll of 5 or higher.
ancestry-traits.wode-elf.revisit-memory.name: Revisit Memory
ancestry-traits.wode-elf.revisit-memory.description: Accessing memories is as easy as living in the
  present for you. You gain an edge on tests made to recall lore.
ancestry-traits.wode-elf.swift.name: Swift
ancestry-traits.wode-elf.swift.description: You have speed 6.
ancestry-traits.wode-elf.the-wode-defends.name: The Wode Defends
ancestry-traits.wode-elf.the-wode-defends.description: You have the following signature ability. Signature abilities can be used at will.
ancestries.wode-elf.name: Wode Elf
ancestries.wode-elf.description: >-
  Children of the sylvan celestials and masters of the elf-haunted forests called wodes, wode elves
  see all forests as their domain by birthright. They know and enjoy their reputation among humans
  for snatching children who wander too far into the woods. Humans *should* fear the trees.


  The wode elves' natural ability to mask their presence, called *glamor*, complements their
  guerilla style of fighting, letting them strike quickly from cover and then meld back into the
  underbrush. These traits also make the relatively few wode elves who dwell in cities naturally
  adept at urban warfare.
ancestries.wode-elf.choices.trait.prompt: Ancestry trait (point {slot})
