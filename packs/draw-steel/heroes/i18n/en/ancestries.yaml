  the roll, turn a double edge into an edge, or turn a double bane into a bane.'
abilities.ancestry.polder.shadowmeld.name: Shadowmeld
abilities.ancestry.polder.shadowmeld.description: '*You become an actual shadow.*'
abilities.ancestry.polder.shadowmeld.texts.target: Self
abilities.ancestry.polder.shadowmeld.texts.distance: Self
abilities.ancestry.polder.shadowmeld.texts.effect: >-
  Effect: You flatten yourself into a shadow against a wall or floor you are touching, and become
  hidden from any creature you have cover or concealment from or who isn't observing you. While in
  shadow form, you have full awareness of your surroundings, and strikes made against you and tests
  made to search for you take a bane. You can't move or be force moved, and you can't take main
  actions or maneuvers except to exit this form or to direct creatures under your control, such as
  one you summon using an ability. Any ability or effect that targets more than 1 square affects you
  in this form only if it explicitly affects the surface you are flattened against. You can exit
  this form as a maneuver.


  If the surface you are flattened against is destroyed, this ability ends and you take 1d6 damage
  that can't be reduced in any way.
