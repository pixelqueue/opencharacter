abilities.common.charge.name: Charge
abilities.common.charge.texts.effect: >-
  When a creature takes the Charge main action, they move up to their speed in a straight line, then
  make a melee free strike (see Free Strikes below) against a target when they end their move. If
  the creature has an ability with the Charge keyword, they can use that ability against the target
  instead of a free strike.


  A creature can't move through difficult terrain or shift when they charge. They can fly or burrow
  as part of the Charge main action if they have that movement available to them, but they can't
  climb or swim while charging unless they can automatically use that movement at full speed.
abilities.common.defend.name: Defend
abilities.common.defend.texts.effect: "When a creature takes the Defend main action, ability rolls
  made against them have a double bane until the start of their next turn. Additionally, you have a
  double edge on tests when called for to resist environmental effects or a creature's traits or
  abilities. A creature gains no benefit from this action while another creature is taunted by them
  (see Conditions in Chapter 5: Classes)."
abilities.common.free-strike.name: Free Strike
abilities.common.free-strike.texts.effect: A creature can use this main action to make a free strike
  (see Free Strikes below). Most of the time, you'll want to use the more impactful main actions
  granted by your class, kit, or other feature, just as the Director will use the main actions in a
  creature's stat block, but free strikes are available for when all else fails. For instance, a
  fury who has no other options for ranged strikes might use the Ranged Weapon Free Strike ability
  with an improvised weapon when battling a flying foe.
abilities.common.heal.name: Heal
abilities.common.heal.texts.effect: A creature who uses the Heal main action employs medicine or
  inspiring words to make an adjacent creature feel better and stay in the fight. The target
  creature can spend a Recovery to regain Stamina, or can make a saving throw against one effect
  they are suffering that is ended by a saving throw.
abilities.common.disengage.name: Disengage
abilities.common.disengage.texts.effect: When a creature takes the Disengage move action, they can
  shift 1 square. Certain class features, kits, and other rules allow a creature to shift more than
  1 square when they disengage. A creature who does so can break up their shift with their maneuver
  and main action however they wish.
abilities.common.ride.name: Ride
abilities.common.ride.texts.effect: A creature can take the Ride move action only while mounted on
  another creature (see Mounted Combat below). When a creature takes the Ride move action, they
  cause their mount to move up to the mount's speed, taking the rider with them. Alternatively, a
  creature can use the Ride move action to have their mount use the Disengage move action as a free
  triggered action. A creature can use the Ride move action only once per round. A mounted creature
  can only have this move action applied to them once per round. This movement can be broken up with
  the rider's maneuver and main action however they wish.
abilities.common.advance.name: Advance
abilities.common.advance.texts.effect: When a creature takes the Advance move action, they move a
  number of squares up to their speed. They can break up this movement with their maneuver and main
  action however they wish.
abilities.common.use-consumable.name: Use Consumable
abilities.common.use-consumable.texts.effect: 'Unless otherwise noted in its description, a creature
  can activate a consumable treasure such as a potion with the Use Consumable maneuver. A creature
  can use this maneuver to administer a consumable treasure that benefits the user either to
  themself or to a willing adjacent creature. See Consumables in Chapter 13: Rewards.'
abilities.common.search-for-hidden-creatures.name: Search for Hidden Creatures
abilities.common.search-for-hidden-creatures.texts.effect: 'The Search for Hidden Creatures maneuver
  allows a creature to attempt to locate creatures hidden from them (see Hide and Sneak in Chapter
  9: Tests).'
abilities.common.grab.name: Grab
abilities.common.grab.texts.target: One creature
abilities.common.grab.texts.distance: Melee 1
abilities.common.grab.texts.roll: Power Roll + Might
abilities.common.grab.texts.tier1: No effect.
abilities.common.grab.texts.tier2: You can grab the target, but if you do, the target can make a
  melee free strike against you before they are grabbed.
abilities.common.grab.texts.tier3: The target is grabbed by you.
abilities.common.grab.texts.effect: >-
  A creature seeking to keep a foe close and locked down can attempt to grab a creature using the
  following ability.


  Unless otherwise indicated, a creature can grab only one creature at a time.


  See Conditions in Chapter 5: Classes for information on the grabbed condition.


  Effect: You can usually target only creatures of your size or smaller. If your Might score is 2 or
  higher, you can target any creature with a size equal to or less than your Might score.
abilities.common.escape-grab.name: Escape Grab
abilities.common.escape-grab.texts.target: Self
abilities.common.escape-grab.texts.distance: Self
abilities.common.escape-grab.texts.roll: Power Roll + Might or Agility
abilities.common.escape-grab.texts.tier1: No effect.
abilities.common.escape-grab.texts.tier2: You can escape the grab, but if you do, a creature who has
  you grabbed can make a melee free strike against you before you are no longer grabbed.
abilities.common.escape-grab.texts.tier3: You are no longer grabbed.
abilities.common.escape-grab.texts.effect: >-
  A creature who is grabbed by another creature, an object, or an effect (see Grab below) can
  attempt to escape by using the following ability.


  See Conditions in Chapter 5: Classes for information on the grabbed condition.


  Effect: You take a bane on this maneuver if your size is smaller than the size of the creature,
  object, or effect that has you grabbed.
abilities.common.make-or-assist-a-test.name: Make or Assist a Test
abilities.common.make-or-assist-a-test.texts.effect: >-
  Many tests are maneuvers if made in combat. Searching a chest with a Reason test, picking a door's
  lock with an Agility test, or lifting a portcullis with a Might test would all be maneuvers.
  Assisting a test is also a maneuver in combat (see Assist a Test in Chapter 9: Tests).


  Complex or time-consuming tests might require a main action if made in combat—or could take so
  long that they can't be made during combat at all. Other tests that take no time at all, such as a
  Reason test to recall lore about mummies, are usually free maneuvers in combat. The Director has
  the final say regarding which tests can be made as maneuvers.
abilities.common.aid-attack.name: Aid Attack
abilities.common.aid-attack.texts.effect: A creature who uses the Aid Attack maneuver chooses an
  enemy adjacent to them. The next ability roll an ally makes against that enemy before the start of
  the aiding creature's next turn gains an edge.
abilities.common.stand-up.name: Stand Up
abilities.common.stand-up.texts.effect: A creature can use the Stand Up maneuver to stand up if they
  are prone, ending that condition. Alternatively, they can use this maneuver to make a willing
  adjacent prone creature stand up.
abilities.common.hide.name: Hide
abilities.common.hide.texts.effect: "Using the Hide maneuver, a creature attempts to hide from other
  creatures who aren't observing them while they have cover or concealment. See Hide and Sneak in
  Chapter 9: Tests for full details."
abilities.common.catch-breath.name: Catch Breath
abilities.common.catch-breath.texts.effect: >-
  A creature who uses the Catch Breath maneuver spends a Recovery and regains Stamina equal to their
  recovery value. (See below for Stamina. See Recoveries in Chapter 1: The Basics.)


  A creature who is dying (see Dying and Death in Stamina below) can't use the Catch Breath
  maneuver, but other creatures can help them spend Recoveries in other ways.
abilities.common.knockback.name: Knockback
abilities.common.knockback.texts.target: One creature
abilities.common.knockback.texts.distance: Melee 1
abilities.common.knockback.texts.roll: Power Roll + Might
abilities.common.knockback.texts.tier1: Push 1
abilities.common.knockback.texts.tier2: Push 2
abilities.common.knockback.texts.tier3: Push 3
abilities.common.knockback.texts.effect: >-
  A creature wanting to push an adjacent creature away from them can attempt to shove that creature
  using the following ability.


  Effect: You can usually target only creatures of your size or smaller. If your Might score is 2 or
  higher, you can target any creature with a size equal to or less than your Might score.
abilities.common.melee-weapon-free-strike.name: Melee Weapon Free Strike
abilities.common.melee-weapon-free-strike.texts.target: One creature or object
abilities.common.melee-weapon-free-strike.texts.distance: Melee 1
abilities.common.melee-weapon-free-strike.texts.roll: Power Roll + Might or Agility
abilities.common.melee-weapon-free-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + M or A}} damage'
abilities.common.melee-weapon-free-strike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + M or A}} damage'
abilities.common.melee-weapon-free-strike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7 + M or A}} damage'
abilities.common.ranged-weapon-free-strike.name: Ranged Weapon Free Strike
abilities.common.ranged-weapon-free-strike.texts.target: One creature or object
abilities.common.ranged-weapon-free-strike.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.common.ranged-weapon-free-strike.texts.roll: Power Roll + Might or Agility
abilities.common.ranged-weapon-free-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + M or A}} damage'
abilities.common.ranged-weapon-free-strike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + M or A}} damage'
abilities.common.ranged-weapon-free-strike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + M or A}} damage'
