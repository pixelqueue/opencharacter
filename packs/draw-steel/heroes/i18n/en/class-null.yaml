features.null.psionic-augmentation.name: Psionic Augmentation
features.null.psionic-augmentation.description: Your training has turned your body into the perfect
  psionic weapon, shaping pathways in your mind that enhance your physical form. Choose one of the
  following augmentations. You can change your augmentation by undergoing a psionic meditation as a
  respite activity. (*Quick Build:* Speed Augmentation.)
