subclasses.null.chronokinetic.description: Your training unmoors you from temporal reality, allowing
  you to use the flow of time as another dimension that all things move through. You gain one skill
  from the lore group.
subclasses.null.cryokinetic.description: You can tap into absolute cold, the most essential energy
  of myriad manifolds, and manifest its effects in your body. You gain one skill from the crafting
  group.
subclasses.null.metakinetic.description: You learn to see through the illusions of the universe to
  more fully understand your body and its psionic potential. You gain one skill from the exploration
  group.
