features.null.discipline-mastery-improvement.name: Discipline Mastery Improvement
features.null.discipline-mastery-improvement.description: Your Discipline Mastery feature provides additional benefits when you have 12 or more discipline.
features.null.manifold-body.name: Manifold Body
features.null.manifold-body.description: When you gain discipline at the start of each of your turns
  during combat, you gain 4 discipline instead of 3.
features.null.manifold-resonance.name: Manifold Resonance
features.null.manifold-resonance.description: >-
  Your body becomes perfected matter, beyond the whims and chaos of the timescape and the
  restrictions of the manifolds. Each time you finish a respite, you can shift yourself and any
  creatures in the area of your Null Field ability to any location in the timescape known to you,
  known to any other creature in the area, or where any supernatural treasure in the area has been
  before.


  Whenever you use an ability, you gain 1 discipline that can be used only to apply a benefit from
  your Psi Boost feature to that ability. Additionally, you and allies in the area of your Null
  Field ability ignore banes and double banes on your power rolls.
features.null.order.name: Order
features.null.order.description: >-
  You have an epic resource called order. Each time you finish a respite, you gain order equal to
  the XP you gain. You can spend order on your abilities as if it were discipline.


  At the start of a combat encounter, you can spend 1 order to increase the size of your Null Field
  by 1 until the end of the encounter.


  Order remains until you spend it.
features.null.density-augmentation.name: Density Augmentation
features.null.density-augmentation.description: You gain a +6 bonus to Stamina, and this bonus
  increases by 6 at 4th, 7th, and 10th levels. Additionally, you gain a +1 bonus to stability.
features.null.discipline-outside-of-combat.name: Discipline Outside of Combat
features.null.discipline-outside-of-combat.description: >-
  Though you can't gain discipline outside of combat, you can use your heroic abilities and effects
  that cost discipline without spending it. Whenever you use an ability or effect outside of combat
  that costs discipline, you can't use that same ability or effect outside of combat again until you
  earn 1 or more Victories or finish a respite.


  When you use an ability outside of combat that lets you spend unlimited discipline on its effect,
  you can use it as if you had spent an amount of discipline equal to your Victories. (Such
  abilities aren't part of the core rules for the null, but they might appear in future products.)
features.null.discipline-in-combat.name: Discipline in Combat
features.null.discipline-in-combat.description: >-
  At the start of a combat encounter or some other stressful situation tracked in combat rounds (as
  determined by the Director), you gain discipline equal to your Victories. At the start of each of
  your turns during combat, you gain 2 discipline.


  Additionally, the first time each combat round that an enemy in the area of your Null Field
  ability (see below) uses a main action, you gain 1 discipline. The first time each combat round
  that the Director uses an ability that costs Malice (see *[Draw Steel:
  Monsters](https://mcdm.gg/DS-Monsters)*), you gain 1 discipline.


  You lose any remaining discipline at the end of the encounter.
features.null.force-augmentation.name: Force Augmentation
features.null.force-augmentation.description: Your damage-dealing psionic abilities gain a +1 bonus to rolled damage.
features.null.inertial-shield.name: Inertial Shield
features.null.inertial-shield.description: Your instincts for danger let you predict attacks before they happen.
features.null.null-field.name: Null Field
features.null.null-field.description: You project a psionic field of order around your body,
  dampening the effects of supernatural abilities harmful to you and your allies.
features.null.null-speed.name: Null Speed
features.null.null-speed.description: The flow of psionic power through you allows you to achieve
  high velocity. You gain a bonus to speed and to the number of squares you can shift when you take
  the Disengage move action equal to your Agility score.
features.null.psionic-martial-arts.name: Psionic Martial Arts
features.null.psionic-martial-arts.description: Whenever you use the Knockback or Grab maneuver, you
  use Intuition instead of Might for the power roll and for determining if you can target creatures
  larger than you. Additionally, whenever you use the Knockback maneuver, you can choose to slide
  the target instead of pushing them.
features.null.speed-augmentation.name: Speed Augmentation
features.null.speed-augmentation.description: You gain a +1 bonus to speed and to the distance you
  can shift when you take the Disengage move action.
features.null.entropic-adaptability.name: Entropic Adaptability
features.null.entropic-adaptability.description: You have cold immunity equal to twice your
  Intuition score. Additionally, you ignore difficult terrain related to cold and ice, and you can
  automatically climb at full speed while moving.
features.null.inertial-sink.name: Inertial Sink
features.null.inertial-sink.description: >-
  You add your Intuition score to your effective size for the purpose of interacting with creatures
  and objects, such as for determining whether you can lift an object, whether you are affected by
  forced movement, and so forth. This has no effect on whether you can be grabbed.


  Additionally, when you fall, you reduce the effective height of the fall by 5 squares in addition
  to any other reductions. Whenever you take damage from being force moved, you reduce that damage
  by an amount equal to your level.
features.null.rapid-processing.name: Rapid Processing
features.null.rapid-processing.description: As a maneuver, you can read an entire book or process a
  similar amount of information. Additionally, during any respite, you can take an additional
  respite activity.
features.null.psionic-leap.name: Psionic Leap
features.null.psionic-leap.description: You can long jump and high jump a distance equal to twice
  your Agility score without needing to make a test.
features.null.reorder.name: Reorder
features.null.reorder.description: At the start of each of your turns, you can use a free triggered
  action to end one effect on you that is ended by a saving throw or that ends at the end of your
  turn. Alternatively, you can grant this benefit to one creature in the area of your Null Field
  ability.
features.null.discipline-mastery-improvement-4.name: Discipline Mastery Improvement
features.null.discipline-mastery-improvement-4.description: Your Discipline Mastery feature provides additional benefits when you have 8 or more discipline.
features.null.enhanced-null-field.name: Enhanced Null Field
features.null.enhanced-null-field.description: While using your Null Field ability, you disrupt
  magic and psionic power suffusing the area around you. During combat, any temporary supernatural
  terrain effects of your level or lower are removed when your aura partially or fully overlaps with
  their location. Permanent supernatural terrain effects of your level or lower are temporarily
  negated while your aura overlaps with their location, but return when the aura no longer overlaps
  with them.
features.null.regenerative-field.name: Regenerative Field
features.null.regenerative-field.description: The first time each combat round that an enemy in the
  area of your Null Field ability uses a main action, you gain 2 discipline instead of 1.
features.null.chilling-readiness.name: Chilling Readiness
features.null.chilling-readiness.description: You steel yourself for imminent danger by tapping into
  your body's cold energy. At the start of any combat, you gain a number of surges equal to your
  Victories.
features.null.inertial-fulcrum.name: Inertial Fulcrum
features.null.inertial-fulcrum.description: Whenever you use an ability to reduce damage dealt to
  you or to reduce the distance of forced movement imposed upon you, you can deal damage to one
  enemy in the area of your Null Field ability equal to your Intuition score.
features.null.instant-action.name: Instant Action
features.null.instant-action.description: If you're not surprised at the start of your first turn in
  combat, you gain an edge on ability rolls and gain 2 surges. If you are surprised, you can spend 3
  discipline to no longer be surprised and gain the benefits of this feature.
features.null.elemental-absorption.name: Elemental Absorption
features.null.elemental-absorption.description: Whenever you use your Inertial Shield triggered
  action, you gain immunity to acid, cold, corruption, fire, lightning, poison, and sonic damage
  equal to your Intuition score against the triggering damage.
features.null.elemental-buffer.name: Elemental Buffer
features.null.elemental-buffer.description: Whenever you reduce acid, cold, corruption, fire,
  lightning, poison, or sonic damage with damage immunity, you gain 2 surges that can be used only
  to increase the damage of your next strike.
features.null.discipline-mastery-improvement-7.name: Discipline Mastery Improvement
features.null.discipline-mastery-improvement-7.description: Your Discipline Mastery feature provides additional benefits when you have 10 or more discipline.
features.null.improved-body.name: Improved Body
features.null.improved-body.description: When you gain discipline at the start of each of your turns
  during combat, you gain 3 discipline instead of 2.
features.null.psi-boost.name: Psi Boost
features.null.psi-boost.description: >-
  Whenever you use an ability that is a main action or a maneuver with the Psionic keyword, you can
  spend additional discipline to apply a psi boost to it and enhance its effects. A psi boost's
  effects only last until the end of the turn which the ability is first used. You can apply
  multiple psi boosts to an ability, but only one instance of each specific boost. You can use the
  following psi boosts.


  ##### Dynamic Power (1 Discipline)


  If the ability force moves a target, the forced movement distance gains a bonus equal to your
  Intuition score.


  ##### Expanded Power (3 Discipline)


  If the ability targets an area, you increase the size of the area by 1. If the area is a line, you
  increase the size of one dimension, not both.


  ##### Extended Power (1 Discipline)


  If the ability is ranged, the distance gains a bonus equal to your Intuition score. If the ability
  is melee, the distance gains a +2 bonus.


  ##### Heightened Power (1 Discipline)


  If the ability deals rolled damage, it deals extra damage equal to your Intuition score.


  ##### Magnified Power (5 Discipline)


  If the ability has a potency, you increase that potency by an amount equal to your Intuition
  score.


  ##### Shared Power (5 Discipline)


  If the ability targets individual creatures or objects, you target one additional creature or
  object within distance.


  ##### Sharpened Power (1 Discipline)


  If the ability has any power roll, that roll gains an edge.
features.null.inertial-dampener.name: Inertial Dampener
features.null.inertial-dampener.description: You and each creature or object of your choice in the
  area of your Null Field ability gain a bonus to stability equal to your Intuition score. A
  creature who attempts to force move a target with this bonus takes psychic damage equal to your
  Intuition score.
features.null.shared-momentum.name: Shared Momentum
features.null.shared-momentum.description: When you take the Disengage move action, one ally in the
  area of your Null Field ability can also take the Disengage move action as a free triggered
  action, using your distance for that move action.
features.null.synaptic-triage.name: Synaptic Triage
features.null.synaptic-triage.description: As a free maneuver, you can spend 1d6 Stamina to remove
  one effect on you. Each creature of your choice in the area of your Null Field ability also gains
  this benefit.
features.null.i-am-the-weapon.name: I Am the Weapon
features.null.i-am-the-weapon.description: Your Stamina increases by 21 and you can't be made
  bleeding even while dying. You no longer age or have need of food. Additionally, you can use
  Intuition instead of another characteristic when resisting potencies.
subclasses.null.chronokinetic.name: Chronokinetic
subclasses.null.cryokinetic.name: Cryokinetic
subclasses.null.metakinetic.name: Metakinetic
classes.null.name: 'Null'
classes.null.description: >-
  The mind is not separate from the body. Perfection of one requires perfection of the other. You
  strive for perfect discipline, perfect order, mastery over mind and body, becoming an unarmed
  psionic warrior who dampens and absorbs magic and psionics. You require no weapons, no tools. You
  suffice.


  **As a null, you resist the supernatural forces of the universe with composure and confidence. As
  you strive for perfect order, you are an enemy of the ultimate expression of chaos: the
  supernatural. Those who break the laws of nature using sorcery or psionics should fear you.**


  > "Any weapon can be turned against the hand that wields it."

  >

  > **Ardashir**
features.null.discipline-mastery.name: Discipline Mastery
features.null.discipline-mastery.description: >-
  As you advance in your chosen null tradition, you gain certain benefits in combat, including
  benefits based on the amount of discipline you have. Benefits based on how much discipline you
  have last until the end of your turn, even if a benefit would become unavailable to you because of
  the amount of discipline you spend during your turn.


  Some Discipline Mastery benefits can be applied only if you are a specific level or higher, with
  the level of those benefits noted in your tradition's table.
features.null.chronokinetic-mastery.name: Chronokinetic Mastery
features.null.chronokinetic-mastery.description: >-
  Whenever you use the Inertial Shield ability, you can use the Disengage move action as a free
  triggered action.


  Additionally, as your discipline grows, your psionic mastery of your body intensifies, granting
  benefits from the table below. Benefits are cumulative except where an improved benefit replaces a
  lesser benefit.


  | Discipline | Benefit |

  | --- | --- |

  | 2 | Whenever you use the Knockback maneuver, you can use the Disengage move action as a free
  triggered action either before or after the maneuver. |

  | 4 | The first time on a turn that you willingly move 1 or more squares as part of an ability,
  you gain 1 surge. |

  | 6 | You gain an edge on the Grab and Knockback maneuvers. |

  | 8 (4th level) | The first time on a turn that you willingly move 1 or more squares as part of an
  ability, you gain 2 surges. |

  | 10 (7th level) | You have a double edge on the Grab and Knockback maneuvers. |

  | 12 (10th level) | Whenever you force move a target, the forced movement distance gains a bonus
  equal to your Intuition score. Additionally, whenever you use a heroic ability, you gain 10
  temporary Stamina. |
features.null.cryokinetic-mastery.name: Cryokinetic Mastery
features.null.cryokinetic-mastery.description: >-
  Whenever you use your Inertial Shield ability, you can then use the Grab maneuver as a free
  triggered action.


  Additionally, as your discipline grows, you strengthen the psionic power suffusing you, granting
  benefits from the table below. Benefits are cumulative except where an improved benefit replaces a
  lesser benefit.


  | Discipline | Benefit |

  | --- | --- |

  | 2 | Whenever you use the Knockback maneuver, you can target one additional creature.
  Additionally, whenever you deal untyped damage with a psionic ability, you can change it to cold
  damage instead. |

  | 4 | The first time on a turn that you grab a creature or an enemy moves 1 or more squares in the
  area of your Null Field ability, you gain 1 surge. |

  | 6 | You gain an edge on the Grab and Knockback maneuvers. |

  | 8 (4th level) | The first time on a turn that you grab a creature or an enemy moves 1 or more
  squares in the area of your Null Field ability, you gain 2 surges. |

  | 10 (7th level) | You have a double edge on the Grab and Knockback maneuvers. |

  | 12 (10th level) | Whenever you force move a target, the forced movement distance gains a bonus
  equal to your Intuition score. Additionally, whenever you use a heroic ability, you gain 10
  temporary Stamina. |
features.null.metakinetic-mastery.name: Metakinetic Mastery
features.null.metakinetic-mastery.description: >-
  Whenever you use your Inertial Shield ability, you can then use the Knockback maneuver as a free
  triggered action.


  Additionally, as your discipline grows, your psionic potential is amplified, granting benefits
  from the table below. Benefits are cumulative except where an improved benefit replaces a lesser
  benefit.


  | Discipline | Benefit |

  | --- | --- |

  | 2 | Whenever you use the Knockback maneuver, the forced movement distance gains a bonus equal to
  your Intuition score. |

  | 4 | The first time in a combat round that you take damage or are force moved, you gain 1 surge,
  even if you resist the effect. |

  | 6 | You gain an edge on the Grab and Knockback maneuvers. |

  | 8 (4th level) | The first time in a combat round that you take damage or are force moved, you
  gain 2 surges, even if you resist the effect. |

  | 10 (7th level) | You have a double edge on the Grab and Knockback maneuvers. |

  | 12 (10th level) | Whenever you force move a target, the forced movement distance gains a bonus
  equal to your Intuition score. Additionally, whenever you use a heroic ability, you gain 10
  temporary Stamina. |
