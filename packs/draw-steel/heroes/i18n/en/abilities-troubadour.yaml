abilities.troubadour.fake-your-death.name: Fake Your Death
abilities.troubadour.fake-your-death.description: '*O happy dagger, this is thy sheath!*'
abilities.troubadour.fake-your-death.texts.target: Self
abilities.troubadour.fake-your-death.texts.distance: Self
abilities.troubadour.fake-your-death.texts.effect: 'Effect: You turn invisible and create a magical
  illusion of your corpse falling in your space. While you are invisible, you gain a +3 bonus to
  speed and you ignore difficult terrain. The illusion and your invisibility last until the end of
  your next turn, or until the illusion is interacted with, you take damage, or you use a main
  action or a maneuver.'
abilities.troubadour.ballad-of-the-beast.name: '"Ballad of the Beast"'
abilities.troubadour.ballad-of-the-beast.description: '*Teeth are bare! ♪ Eyes black! ♪ No escaping the beast!♪*'
abilities.troubadour.ballad-of-the-beast.texts.target: Self and each ally in the area
abilities.troubadour.ballad-of-the-beast.texts.distance: 5 aura
abilities.troubadour.ballad-of-the-beast.texts.effect: 'Effect: While this performance is active,
  each target who starts their turn in the area gains 1 surge.'
abilities.troubadour.hypnotic-overtones.name: Hypnotic Overtones
abilities.troubadour.hypnotic-overtones.description: '*You produce an entrancing note that twists the senses in a spectacular fashion.*'
abilities.troubadour.hypnotic-overtones.texts.target: Each enemy in the area
abilities.troubadour.hypnotic-overtones.texts.distance: 2 burst
abilities.troubadour.hypnotic-overtones.texts.roll: Power Roll + Presence
abilities.troubadour.hypnotic-overtones.texts.tier1: 'Slide 1; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, dazed (save ends)'
abilities.troubadour.hypnotic-overtones.texts.tier2: 'Slide 1; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed (save ends)'
abilities.troubadour.hypnotic-overtones.texts.tier3: 'Slide 2; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.troubadour.hypnotic-overtones.texts.effect: 'Spend 2+ Drama: The size of the burst increases by 1 for every 2 drama spent.'
abilities.troubadour.cutting-sarcasm.name: Cutting Sarcasm
abilities.troubadour.cutting-sarcasm.description: '*There you are, radiating your usual charisma.*'
abilities.troubadour.cutting-sarcasm.texts.target: One creature
abilities.troubadour.cutting-sarcasm.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.cutting-sarcasm.texts.roll: Power Roll + Presence
abilities.troubadour.cutting-sarcasm.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + P}} psychic damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, bleeding (save ends)'
abilities.troubadour.cutting-sarcasm.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + P}} psychic damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, bleeding (save ends)'
abilities.troubadour.cutting-sarcasm.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7 + P}} psychic damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, bleeding (save ends)'
abilities.troubadour.harmonize.name: Harmonize
abilities.troubadour.harmonize.description: '*Give the chorus a little punch.*'
abilities.troubadour.harmonize.texts.trigger: The target uses an ability that targets only one enemy
  and costs 3 or fewer of their Heroic Resource.
abilities.troubadour.harmonize.texts.target: One ally
abilities.troubadour.harmonize.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.troubadour.harmonize.texts.effect: >-
  Effect: The target can choose one additional target for the triggering ability. Any damage dealt
  to the additional target is sonic damage.


  Spend 1+ Drama: You can trigger this ability when a target uses an ability that has a Heroic
  Resource cost of 3 + each additional drama spent.
abilities.troubadour.revitalizing-limerick.name: Revitalizing Limerick
abilities.troubadour.revitalizing-limerick.description: '*There once was a man from Capital...*'
abilities.troubadour.revitalizing-limerick.texts.target: Self and each ally in the area
abilities.troubadour.revitalizing-limerick.texts.distance: 5 aura
abilities.troubadour.revitalizing-limerick.texts.effect: 'Effect: At the end of each of your turns
  while this performance is active, you can choose up to a number of targets equal to your Presence
  score. Each chosen target can spend a Recovery.'
abilities.troubadour.dramatic-monologue.name: Dramatic Monologue
abilities.troubadour.dramatic-monologue.description: "*It doesn't need to make sense. Just say it with emotion.*"
abilities.troubadour.dramatic-monologue.texts.target: Special
abilities.troubadour.dramatic-monologue.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.dramatic-monologue.texts.effect: >-
  Effect: Choose one of the following effects:

  - You orate a rousing tale of victory. One ally within distance gains an edge on the next power
  roll they make before the start of your next turn.

  - You weave a tale of high-stakes heroics. One ally within distance gains 1 surge.

  - You insult a foe where they're most vulnerable. One enemy within distance takes a bane on the
  next power roll they make before the end of their next turn.


  Spend 1 Drama: You can choose two targets for the chosen effect.
abilities.troubadour.turnabout-is-fair-play.name: Turnabout Is Fair Play
abilities.troubadour.turnabout-is-fair-play.description: "*All's fair in love and whatever.*"
abilities.troubadour.turnabout-is-fair-play.texts.trigger: The target makes an ability roll that has an edge, a double edge, a bane, or a double bane.
abilities.troubadour.turnabout-is-fair-play.texts.target: One creature
abilities.troubadour.turnabout-is-fair-play.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.turnabout-is-fair-play.texts.effect: >-
  Effect: An edge on the triggering roll becomes a bane, or a double edge becomes an edge. A bane
  becomes an edge, or a double bane becomes a bane.


  Spend 3 Drama: An edge on the triggering roll becomes a double bane, or a double edge is negated.
  A bane becomes a double edge, or a double bane is negated.
abilities.troubadour.power-chord.name: Power Chord
abilities.troubadour.power-chord.description: '*Your instrument rings true and your music blows everyone away.*'
abilities.troubadour.power-chord.texts.target: Each enemy in the area
abilities.troubadour.power-chord.texts.distance: 2 burst
abilities.troubadour.power-chord.texts.roll: Power Roll + Presence
abilities.troubadour.power-chord.texts.tier1: Push 1
abilities.troubadour.power-chord.texts.tier2: Push 2
abilities.troubadour.power-chord.texts.tier3: Push 3
abilities.troubadour.quick-rewrite.name: Quick Rewrite
abilities.troubadour.quick-rewrite.description: '*You write something unexpected into the scene that hinders your enemy.*'
abilities.troubadour.quick-rewrite.texts.target: Each enemy in the area
abilities.troubadour.quick-rewrite.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.troubadour.quick-rewrite.texts.roll: Power Roll + Presence
abilities.troubadour.quick-rewrite.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4}} damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.troubadour.quick-rewrite.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, slowed (save ends)'
abilities.troubadour.quick-rewrite.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6}} damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.troubadour.quick-rewrite.texts.effect: 'Effect: The area is difficult terrain for enemies.'
abilities.troubadour.flip-the-script.name: Flip the Script
abilities.troubadour.flip-the-script.description: '*You try a different take on events, justifying the new locations everyone ended up in.*'
abilities.troubadour.flip-the-script.texts.target: Self and each ally in the area
abilities.troubadour.flip-the-script.texts.distance: 3 burst
abilities.troubadour.flip-the-script.texts.effect: 'Effect: Each target can teleport up to 5
  squares. Any teleported target who was slowed is no longer slowed.'
abilities.troubadour.riposte.name: Riposte
abilities.troubadour.riposte.description: '*"I''d have brought treats had I known I''d be fighting a dog."*'
abilities.troubadour.riposte.texts.trigger: The target takes damage from a melee strike.
abilities.troubadour.riposte.texts.target: Self or one ally
abilities.troubadour.riposte.texts.distance: Melee 1
abilities.troubadour.riposte.texts.effect: 'Effect: The target makes a free strike against the creature who made the triggering strike.'
abilities.troubadour.thunder-mother.name: '"Thunder Mother"'
abilities.troubadour.thunder-mother.description: '*All for thunder motherrr! ♪ Run and hide for coverrr!♪*'
abilities.troubadour.thunder-mother.texts.target: One creature
abilities.troubadour.thunder-mother.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.thunder-mother.texts.roll: Power Roll + Presence
abilities.troubadour.thunder-mother.texts.tier1: Lightning damage equal to your level
abilities.troubadour.thunder-mother.texts.tier2: Lightning damage equal to 5 + your level
abilities.troubadour.thunder-mother.texts.tier3: Lightning damage equal to 10 + your level
abilities.troubadour.thunder-mother.texts.effect: "Effect: At the end of each combat round while
  this performance is active, you can make a power roll against the target that ignores cover. You
  can't target the same creature twice with this effect."
abilities.troubadour.harsh-critic.name: Harsh Critic
abilities.troubadour.harsh-critic.description: '*Just one bad review will ruin their day.*'
abilities.troubadour.harsh-critic.texts.target: One creature or object
abilities.troubadour.harsh-critic.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {10}}'
abilities.troubadour.harsh-critic.texts.roll: Power Roll + Presence
abilities.troubadour.harsh-critic.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + P}} sonic damage'
abilities.troubadour.harsh-critic.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + P}} sonic damage'
abilities.troubadour.harsh-critic.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + P}} sonic damage'
abilities.troubadour.harsh-critic.texts.effect: "Effect: The first time the target uses an ability
  before the start of your next turn, any effects from the ability's tier outcomes other than damage
  are negated for all targets. Ability effects that always happen regardless of the power roll work
  as usual."
abilities.troubadour.dramatic-reversal.name: Dramatic Reversal
abilities.troubadour.dramatic-reversal.description: '*Give the audience a surprise.*'
abilities.troubadour.dramatic-reversal.texts.target: Self and each ally in the area
abilities.troubadour.dramatic-reversal.texts.distance: 3 burst
abilities.troubadour.dramatic-reversal.texts.roll: Power Roll + Presence
abilities.troubadour.dramatic-reversal.texts.tier1: The target can shift 1 square and make a free strike.
abilities.troubadour.dramatic-reversal.texts.tier2: The target can shift up to 2 squares and make a free strike that gains an edge.
abilities.troubadour.dramatic-reversal.texts.tier3: The target can shift up to 3 squares and make a
  free strike that gains an edge, then can spend a Recovery.
abilities.troubadour.instigator.name: Instigator
abilities.troubadour.instigator.description: "*I didn't do it! What?*"
abilities.troubadour.instigator.texts.target: One creature
abilities.troubadour.instigator.texts.distance: Melee 1
abilities.troubadour.instigator.texts.roll: Power Roll + Presence
abilities.troubadour.instigator.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + P}} damage'
abilities.troubadour.instigator.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + P}} damage'
abilities.troubadour.instigator.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + P}} damage'
abilities.troubadour.instigator.texts.effect: "Effect: The target is taunted by you or a willing
  ally adjacent to you until the end of the target's next turn."
abilities.troubadour.artful-flourish.name: Artful Flourish
abilities.troubadour.artful-flourish.description: '*And they said practicing fencing was a waste!*'
abilities.troubadour.artful-flourish.texts.target: Two creatures or objects
abilities.troubadour.artful-flourish.texts.distance: Melee 1
abilities.troubadour.artful-flourish.texts.roll: Power Roll + Agility
abilities.troubadour.artful-flourish.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} damage'
abilities.troubadour.artful-flourish.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} damage'
abilities.troubadour.artful-flourish.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} damage'
abilities.troubadour.artful-flourish.texts.effect: |-
  Effect: You can shift up to 3 squares.

  Spend 2+ Drama: You can target one additional creature or object for every 2 drama spent.
abilities.troubadour.witty-banter.name: Witty Banter
abilities.troubadour.witty-banter.description: '*A lyrical (and physical) jab insults an enemy and inspires an ally.*'
abilities.troubadour.witty-banter.texts.target: One creature
abilities.troubadour.witty-banter.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.troubadour.witty-banter.texts.roll: Power Roll + Presence
abilities.troubadour.witty-banter.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + P}} psychic damage'
abilities.troubadour.witty-banter.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + P}} psychic damage'
abilities.troubadour.witty-banter.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7 + P}} psychic damage'
abilities.troubadour.witty-banter.texts.effect: >-
  Effect: One ally within 10 squares of you can end one effect on them that is ended by a saving
  throw or that ends at the end of their turn.


  Spend 1 Drama: The chosen ally can spend a Recovery.
abilities.troubadour.upstage.name: Upstage
abilities.troubadour.upstage.description: "*As you bob and weave through the crowd, you can't help but leave the audience wanting more.*"
abilities.troubadour.upstage.texts.target: Self
abilities.troubadour.upstage.texts.distance: Self; see below
abilities.troubadour.upstage.texts.roll: Power Roll + Agility or Presence
abilities.troubadour.upstage.texts.tier1: Taunted (EoT); A < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, prone
abilities.troubadour.upstage.texts.tier2: Taunted (EoT); A < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, prone
abilities.troubadour.upstage.texts.tier3: Taunted (EoT); A < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, prone and can't stand (EoT)
abilities.troubadour.upstage.texts.effect: 'Effect: You shift up to your speed. You make one power
  roll that targets each enemy you move adjacent to during this shift.'
abilities.troubadour.choreography.name: Choreography
abilities.troubadour.choreography.description: '*Taps, kicks, steps. It''s all "choreography."*'
abilities.troubadour.choreography.texts.target: Self and each ally in the area
abilities.troubadour.choreography.texts.distance: 5 aura
abilities.troubadour.choreography.texts.effect: 'Effect: While this performance is active, each
  target who starts their turn in the area gains a +2 bonus to speed until the end of their turn.'
abilities.troubadour.method-acting.name: Method Acting
abilities.troubadour.method-acting.description: "*They're so hurt by your performance, you start to believe it yourself.*"
abilities.troubadour.method-acting.texts.target: One creature
abilities.troubadour.method-acting.texts.distance: Melee 1
abilities.troubadour.method-acting.texts.roll: Power Roll + Agility
abilities.troubadour.method-acting.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + A}} damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, weakened (save ends)'
abilities.troubadour.method-acting.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + A}} damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, weakened (save ends)'
abilities.troubadour.method-acting.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {14 + A}} damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, weakened (save ends)'
abilities.troubadour.method-acting.texts.effect: 'Effect: You can become bleeding (save ends) to deal an extra 5 corruption damage to the target.'
abilities.troubadour.blocking.name: Blocking
abilities.troubadour.blocking.description: '*No, no, no, you lose the audience that way. Try it like this...*'
abilities.troubadour.blocking.texts.target: Each creature in the area
abilities.troubadour.blocking.texts.distance: 2 aura
abilities.troubadour.blocking.texts.effect: "Effect: At the end of each of your turns while this
  performance is active, you can choose up to a number of targets equal to your Presence score and
  teleport those targets to unoccupied spaces in the area. A target can't be teleported in a way
  that would harm them (such as over a cliff), leave them dying, or result in them suffering a
  condition or other negative effect."
abilities.troubadour.acrobatics.name: Acrobatics
abilities.troubadour.acrobatics.description: '*Folks love a good tumble.*'
abilities.troubadour.acrobatics.texts.target: Self and each ally in the area
abilities.troubadour.acrobatics.texts.distance: 5 aura
abilities.troubadour.acrobatics.texts.effect: 'Effect: While this performance is active, each target
  who starts their turn in the area can automatically obtain a tier 3 outcome on one test made to
  jump, tumble, or climb as part of their movement before the end of their turn.'
abilities.troubadour.star-power.name: Star Power
abilities.troubadour.star-power.description: '*Your years of practicing fencing and dancing pay off on the battlefield.*'
abilities.troubadour.star-power.texts.target: Self
abilities.troubadour.star-power.texts.distance: Self
abilities.troubadour.star-power.texts.effect: >-
  Effect: You gain a +2 bonus to speed until the end of your turn. Additionally, the next power roll
  you make this turn can't have an outcome lower than tier 2.


  Spend 1 Drama: You gain a +4 bonus to speed instead.
abilities.troubadour.radical-fantasia.name: Radical Fantasia
abilities.troubadour.radical-fantasia.description: '*𝅘𝅥𝅮♪Viras, my Viras, will you hold their hands as they cryyy—aaaiigh?♪*'
abilities.troubadour.radical-fantasia.texts.target: Self and each ally in the area
abilities.troubadour.radical-fantasia.texts.distance: 5 aura
abilities.troubadour.radical-fantasia.texts.effect: 'Effect: While this performance is active, each
  target who starts their turn in the area ignores difficult terrain, and any ability they use that
  imposes forced movement gains a +2 bonus to the forced movement distance until the end of their
  turn. Additionally, once per combat round, each target can use a triggered action as a free
  triggered action.'
abilities.troubadour.the-show-must-go-on.name: The Show Must Go On
abilities.troubadour.the-show-must-go-on.description: '*You shine a bright light on the players on the stage and compel them to finish the performance.*'
abilities.troubadour.the-show-must-go-on.texts.target: Each enemy in the area
abilities.troubadour.the-show-must-go-on.texts.distance: '5 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.troubadour.the-show-must-go-on.texts.roll: Power Roll + Presence
abilities.troubadour.the-show-must-go-on.texts.tier1: "{has_self_damage1, select, true {{self_damage1}} other {6}} damage; P < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, the target can't willingly leave the area (EoT)"
abilities.troubadour.the-show-must-go-on.texts.tier2: "{has_self_damage2, select, true {{self_damage2}} other {8}} damage; P < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target can't willingly leave the area (save ends)"
abilities.troubadour.the-show-must-go-on.texts.tier3: "{has_self_damage3, select, true {{self_damage3}} other {12}} damage; the target can't willingly leave the area (EoT); if P < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, they can't willingly leave the area (save ends)"
abilities.troubadour.the-show-must-go-on.texts.effect: "Effect: Each ally within distance can't
  obtain lower than a tier 2 outcome on the next test they make before the start of your next turn."
abilities.troubadour.moonlight-sonata.name: Moonlight Sonata
abilities.troubadour.moonlight-sonata.description: '*Music pours out of your heart, filling the area with the utmost delicacy and without damper.*'
abilities.troubadour.moonlight-sonata.texts.target: Each ally in the area
abilities.troubadour.moonlight-sonata.texts.distance: 5 aura
abilities.troubadour.moonlight-sonata.texts.effect: "Effect: While this performance is active, each
  target who is dead can choose to continue taking turns after death. On each of their turns, a
  target can move and use either a main action or a maneuver, but can't spend Recoveries or use
  triggered actions. At the end of the encounter, each target who chose to take turns this way turns
  to dust and blows away."
abilities.troubadour.dramatic-reveal.name: Dramatic Reveal
abilities.troubadour.dramatic-reveal.description: '*A little stage trickery, and where once stood a foe, now stands a friend!*'
abilities.troubadour.dramatic-reveal.texts.target: Self
abilities.troubadour.dramatic-reveal.texts.distance: Self
abilities.troubadour.dramatic-reveal.texts.effect: "Effect: Until the end of the encounter, whenever
  you reduce a creature to 0 Stamina using an ability, you can use a free triggered action to
  teleport an ally within distance of that ability into the creature's space in a plume of rose
  petals. You or the teleported ally can then make a melee free strike."
abilities.troubadour.saved-in-the-edit.name: Saved in the Edit
abilities.troubadour.saved-in-the-edit.description: '*You shout a word of power that allows you to rewrite reality to your whims.*'
abilities.troubadour.saved-in-the-edit.texts.target: Self
abilities.troubadour.saved-in-the-edit.texts.distance: Self
abilities.troubadour.saved-in-the-edit.texts.effect: >-
  Effect: Until the end of the encounter, whenever you deal rolled damage to a creature or object,
  or enable a creature to spend a Recovery, you can use a free triggered action to give that
  creature or object one of the following effects until the start of your next turn. If this ability
  is triggered by multiple targets taking damage or multiple creatures spending Recoveries
  simultaneously, each target receives the same effect:

  - The target has damage weakness equal to your Presence score against any magic, psionic, or
  weapon ability.

  - The target has damage immunity equal to your Presence score.

  - The target has a bonus to stability and a penalty to speed equal to your Presence score.

  - The target has a bonus to speed and a penalty to stability equal to your Presence score.
abilities.troubadour.power-ballad.name: Power Ballad
abilities.troubadour.power-ballad.description: '*A song for the brokenhearted wraps itself around the target and blossoms into a ward of thorns.*'
abilities.troubadour.power-ballad.texts.target: Self or one ally
abilities.troubadour.power-ballad.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.power-ballad.texts.effect: 'Effect: Until the end of the encounter, whenever
  the target takes damage while winded, they can use a free triggered action to deal half the damage
  they took to the source of the damage.'
abilities.troubadour.blood-on-the-stage.name: Blood on the Stage
abilities.troubadour.blood-on-the-stage.description: "*It's love and blood or drama and blood. Either way, there's always blood.*"
abilities.troubadour.blood-on-the-stage.texts.target: One creature or object
abilities.troubadour.blood-on-the-stage.texts.distance: Melee 1
abilities.troubadour.blood-on-the-stage.texts.roll: Power Roll + Agility
abilities.troubadour.blood-on-the-stage.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {12 + A}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, bleeding (save ends)'
abilities.troubadour.blood-on-the-stage.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {18 + A}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, bleeding (save ends)'
abilities.troubadour.blood-on-the-stage.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {24 + A}} damage; bleeding (EoT), or if M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, bleeding (save ends)'
abilities.troubadour.heres-how-your-story-ends.name: Here's How Your Story Ends
abilities.troubadour.heres-how-your-story-ends.description: "*You give away the ending of this battle, and it's not great for them.*"
abilities.troubadour.heres-how-your-story-ends.texts.target: Each enemy in the area
abilities.troubadour.heres-how-your-story-ends.texts.distance: 5 burst
abilities.troubadour.heres-how-your-story-ends.texts.roll: Power Roll + Presence
abilities.troubadour.heres-how-your-story-ends.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} psychic damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
abilities.troubadour.heres-how-your-story-ends.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} psychic damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, frightened (save ends)'
abilities.troubadour.heres-how-your-story-ends.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} psychic damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.troubadour.fight-choreography.name: Fight Choreography
abilities.troubadour.fight-choreography.description: '*You and your partner make a flashy show of derring-do, then get back to your corners.*'
abilities.troubadour.fight-choreography.texts.target: One creature
abilities.troubadour.fight-choreography.texts.distance: Melee 1
abilities.troubadour.fight-choreography.texts.effect: "Effect: You and the target each make a melee
  free strike that targets each enemy within 3 squares of either of you, dividing the enemies
  between each of you. You choose which enemies your free strike targets and which enemies the
  target creature's free strike targets. You then slide the target 5 squares, ignoring stability."
abilities.troubadour.youre-all-my-understudies.name: You're All My Understudies
abilities.troubadour.youre-all-my-understudies.description: "*It's important for everyone to know each other's lines, just in case...*"
abilities.troubadour.youre-all-my-understudies.texts.target: Each ally in the area
abilities.troubadour.youre-all-my-understudies.texts.distance: 5 burst
abilities.troubadour.youre-all-my-understudies.texts.effect: "Effect: Until the end of the
  encounter, each target gains the speed bonus, weapon distance bonus, disengage bonus, and
  stability bonus of your currently equipped kit in addition to their own kit's bonuses."
abilities.troubadour.legendary-drum-fill.name: Legendary Drum Fill
abilities.troubadour.legendary-drum-fill.description: '*You start a drumroll that roars like thunder with every impact the heroes make.*'
abilities.troubadour.legendary-drum-fill.texts.target: Self and each ally in the area
abilities.troubadour.legendary-drum-fill.texts.distance: 4 burst
abilities.troubadour.legendary-drum-fill.texts.effect: 'Effect: Each target gains 1 surge, then
  gains 1 surge at the start of each combat round until the end of the encounter.'
abilities.troubadour.spotlight.name: Spotlight
abilities.troubadour.spotlight.description: "*The audience is watching, so you'd better give them a show.*"
abilities.troubadour.spotlight.texts.target: Self and each ally in the area
abilities.troubadour.spotlight.texts.distance: 5 aura
abilities.troubadour.spotlight.texts.effect: "Effect: While this performance is active, each target
  who starts their turn in the area gains 1 of their Heroic Resource. This Heroic Resource
  disappears at the end of the target's turn if they don't spend it."
abilities.troubadour.feedback.name: Feedback
abilities.troubadour.feedback.description: "*Your music pounds the crowd to the beat until their hearts can't stand it anymore.*"
abilities.troubadour.feedback.texts.target: Each enemy in the area
abilities.troubadour.feedback.texts.distance: Three 3 cubes within 1
abilities.troubadour.feedback.texts.roll: Power Roll + Presence
abilities.troubadour.feedback.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7}} sonic damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, prone'
abilities.troubadour.feedback.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10}} sonic damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone'
abilities.troubadour.feedback.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13}} sonic damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone'
abilities.troubadour.feedback.texts.effect: 'Effect: A prone target ignores this ability.'
abilities.troubadour.take-two.name: Take Two!
abilities.troubadour.take-two.description: '*One more, and this time make it interesting.*'
abilities.troubadour.take-two.texts.target: Self and each ally in the area
abilities.troubadour.take-two.texts.distance: 5 aura
abilities.troubadour.take-two.texts.effect: 'Effect: While this performance is active, each target
  who starts their turn in the area can reroll the first power roll that turn that obtains a tier 2
  outcome. They must use the new roll.'
abilities.troubadour.we-cant-be-upstaged.name: We Can't Be Upstaged!
abilities.troubadour.we-cant-be-upstaged.description: '*Swordplay so graceful it looks like you all practiced this.*'
abilities.troubadour.we-cant-be-upstaged.texts.target: Self and each ally in the area
abilities.troubadour.we-cant-be-upstaged.texts.distance: 5 aura
abilities.troubadour.we-cant-be-upstaged.texts.effect: 'Effect: While this performance is active, a
  target who starts their turn in the area gains a bonus to the distance they can shift equal to
  your Presence score until the end of their turn.'
abilities.troubadour.love-song.name: Love Song
abilities.troubadour.love-song.description: "*You play a small ditty that plants you inside your target's heart.*"
abilities.troubadour.love-song.texts.target: One creature or object
abilities.troubadour.love-song.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.love-song.texts.effect: "Effect: The target gains 20 temporary Stamina. Until
  the end of the encounter, whenever the target takes damage while you're within distance, you can
  choose to take the damage instead of the target."
abilities.troubadour.patter-song.name: Patter Song
abilities.troubadour.patter-song.description: '*Dazzle them with your fancy patter and they forget where they were.*'
abilities.troubadour.patter-song.texts.target: Special
abilities.troubadour.patter-song.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.patter-song.texts.roll: Power Roll + Presence
abilities.troubadour.patter-song.texts.tier1: One ally within distance can take their turn immediately after yours.
abilities.troubadour.patter-song.texts.tier2: Two allies within distance can take their turns immediately after yours in any order.
abilities.troubadour.patter-song.texts.tier3: Three allies within distance can take their turns
  immediately after yours in any order. One of those allies can have already taken a turn this
  combat round.
abilities.troubadour.action-hero.name: Action Hero
abilities.troubadour.action-hero.description: '*You wield your weapon at blistering speed, leaving
  everyone around you fighting for their lives.*'
abilities.troubadour.action-hero.texts.target: Each enemy in the area
abilities.troubadour.action-hero.texts.distance: 3 burst
abilities.troubadour.action-hero.texts.roll: Power Roll + Agility
abilities.troubadour.action-hero.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10}} damage'
abilities.troubadour.action-hero.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14}} damage'
abilities.troubadour.action-hero.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {20}} damage'
abilities.troubadour.action-hero.texts.effect: "Effect: Unless you score a critical hit, this
  ability can't reduce a non-minion target below 1 Stamina."
abilities.troubadour.continuity-error.name: Continuity Error
abilities.troubadour.continuity-error.description: '*Your subject is written into two places at once.*'
abilities.troubadour.continuity-error.texts.target: One enemy or object
abilities.troubadour.continuity-error.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.continuity-error.texts.effect: "Effect: The target is split into two separate
  entities, one of which remains in the target's space while the other appears in an unoccupied
  space of your choice within distance. If the target is a creature, this creates a new creature
  under the Director's control. Each entity has half the original target's Stamina, is weakened, and
  takes 1d6 corruption damage at the start of each of their turns. If either entity is reduced to 0
  Stamina, the other entity persists as the original entity and this effect ends. The effect also
  ends if both entities occupy the same space, causing them to automatically merge and combine their
  current Stamina."
abilities.troubadour.encore.name: Encore
abilities.troubadour.encore.description: '*Again! Again!*'
abilities.troubadour.encore.texts.target: Special
abilities.troubadour.encore.texts.distance: Special
abilities.troubadour.encore.texts.effect: 'Effect: You use an ability that you have observed being
  used this combat round. The ability must have the Strike keyword, cost 5 or fewer of a Heroic
  Resource, and cost no Malice. When you make the strike, you use your Presence score for any power
  rolls, and any damage you deal is sonic damage.'
abilities.troubadour.guest-star.name: Guest Star
abilities.troubadour.guest-star.description: "*We offered them a percentage of the gross. So they're working for free!*"
abilities.troubadour.guest-star.texts.target: Special
abilities.troubadour.guest-star.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.guest-star.texts.effect: "Effect: A guest star appears to help you during the
  encounter: either a bystander within distance uplifted by your magic, or a mysterious new hero who
  appears in an unoccupied space within distance. This guest star is controlled by you, has their
  own turn, and shares your characteristics. Their Stamina maximum is half yours. They have no
  abilities other than your melee and ranged free strikes. At the end of the encounter, or when the
  guest star is reduced to 0 Stamina, they retreat or revert to a bystander. The same bystander
  can't be uplifted this way more than once during an encounter."
abilities.troubadour.tough-crowd.name: Tough Crowd
abilities.troubadour.tough-crowd.description: "*Your fans don't seem to like the opening act...*"
abilities.troubadour.tough-crowd.texts.target: Special
abilities.troubadour.tough-crowd.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.troubadour.tough-crowd.texts.roll: Power Roll + Presence
abilities.troubadour.tough-crowd.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5}} corruption damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, pull 1 toward the center of the area'
abilities.troubadour.tough-crowd.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} corruption damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, pull 2 toward the center of the area'
abilities.troubadour.tough-crowd.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {12}} corruption damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, pull 3 toward the center of the area'
abilities.troubadour.tough-crowd.texts.effect: 'Effect: The area is haunted by a swirling horde of
  phantoms until the end of the encounter. Allies can enter any square of the area without spending
  movement. At the end of each of your turns, you can make one power roll that targets each enemy in
  the area.'
abilities.troubadour.twist-at-the-end.name: Twist at the End
abilities.troubadour.twist-at-the-end.description: "*You didn't see that coming, did you?!*"
abilities.troubadour.twist-at-the-end.texts.target: One dead enemy
abilities.troubadour.twist-at-the-end.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.twist-at-the-end.texts.effect: "Effect: A target who is not a leader or solo
  creature comes back to life with half their Stamina and becomes an ally under the Director's
  control. The players can work with the Director to determine when the target takes their turn each
  combat round. At the end of the encounter, the target turns to dust and is blown away."
abilities.troubadour.en-garde.name: En Garde!
abilities.troubadour.en-garde.description: "*Wait, it's... Guard! Turn! Parry! Dodge! Spin! Thrust! Ha!*"
abilities.troubadour.en-garde.texts.target: One creature
abilities.troubadour.en-garde.texts.distance: Melee 1
abilities.troubadour.en-garde.texts.roll: Power Roll + Agility
abilities.troubadour.en-garde.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + A}} damage'
abilities.troubadour.en-garde.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {11 + A}} damage'
abilities.troubadour.en-garde.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {16 + A}} damage'
abilities.troubadour.en-garde.texts.effect: 'Effect: The target can make a melee free strike against
  you. If they do, you can make a melee free strike against the target.'
abilities.troubadour.classic-chandelier-stunt.name: Classic Chandelier Stunt
abilities.troubadour.classic-chandelier-stunt.description: '*Audiences love this bit.*'
abilities.troubadour.classic-chandelier-stunt.texts.target: Self and one willing ally
abilities.troubadour.classic-chandelier-stunt.texts.distance: Melee 1
abilities.troubadour.classic-chandelier-stunt.texts.effect: 'Effect: Each target can shift up to 5
  squares, including vertically, but must end this movement adjacent to the other target and on
  solid ground. Each target can then make a melee free strike that deals extra damage equal to twice
  their highest characteristic score.'
abilities.troubadour.we-meet-at-last.name: We Meet at Last
abilities.troubadour.we-meet-at-last.description: '*You magically intertwine your fate with another creature—for better or worse.*'
abilities.troubadour.we-meet-at-last.texts.target: One creature
abilities.troubadour.we-meet-at-last.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.we-meet-at-last.texts.effect: >-
  Effect: Until the end of the encounter, both you and the target can target each other with
  abilities even if you are beyond distance, with the distance of this ability replacing those
  abilities' distances. The target can't be force moved by an ability used beyond distance this way.

  Additionally, once on each of your turns, you can use a free maneuver to communicate a motivating
  or dispiriting message to the target, either granting them 2 surges or forcing them to take a bane
  on the next ability roll they make before the start of your next turn.
abilities.troubadour.never-ending-hero.name: '"Never-Ending Hero"'
abilities.troubadour.never-ending-hero.description: '*And toniiight we can truly say ♪ They will alllways find a way!♪*'
abilities.troubadour.never-ending-hero.texts.target: Self and each ally in the area
abilities.troubadour.never-ending-hero.texts.distance: 5 aura
abilities.troubadour.never-ending-hero.texts.effect: 'Effect: While this performance is active, each
  target who starts their turn dying while in the area gains an edge on power rolls and ignores the
  effects of bleeding until the end of their turn.'
abilities.troubadour.infernal-gavotte.name: Infernal Gavotte
abilities.troubadour.infernal-gavotte.description: "*A spicy performance lights a fire under your allies' feet.*"
abilities.troubadour.infernal-gavotte.texts.target: Each enemy in the area
abilities.troubadour.infernal-gavotte.texts.distance: 3 burst
abilities.troubadour.infernal-gavotte.texts.roll: Power Roll + Presence
abilities.troubadour.infernal-gavotte.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5}} fire damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, weakened (save ends)'
abilities.troubadour.infernal-gavotte.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {7}} fire damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, weakened (save ends)'
abilities.troubadour.infernal-gavotte.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10}} fire damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, weakened (save ends)'
abilities.troubadour.infernal-gavotte.texts.effect: 'Effect: Each ally in the area can shift up to 2 squares.'
abilities.troubadour.extensive-rewrites.name: Extensive Rewrites
abilities.troubadour.extensive-rewrites.description: "*No, this isn't right. That foe was over there!*"
abilities.troubadour.extensive-rewrites.texts.target: Each enemy in the area
abilities.troubadour.extensive-rewrites.texts.distance: 4 burst
abilities.troubadour.extensive-rewrites.texts.roll: Power Roll + Presence
abilities.troubadour.extensive-rewrites.texts.tier1: Slide 3; P < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, this slide ignores the target's stability
abilities.troubadour.extensive-rewrites.texts.tier2: Slide 5; P < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, this slide ignores the target's stability
abilities.troubadour.extensive-rewrites.texts.tier3: Slide 7; P < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, this slide ignores the target's stability
abilities.troubadour.extensive-rewrites.texts.effect: "Effect: Instead of sliding a target, you can
  swap their location with another target as long as each can fit into the other's space. You can't
  slide targets into other creatures or objects using this ability."
abilities.troubadour.fire-up-the-night.name: '"Fire Up the Night"'
abilities.troubadour.fire-up-the-night.description: '*Maybe you and I ♪ We can still bring the light!♪*'
abilities.troubadour.fire-up-the-night.texts.target: Self and each ally in the area
abilities.troubadour.fire-up-the-night.texts.distance: 5 aura
abilities.troubadour.fire-up-the-night.texts.effect: "Effect: While this performance is active, each
  target who starts their turn in the area doesn't take a bane on strikes against creatures with
  concealment. Once during their turn, they can search for hidden creatures as a free maneuver (see
  Hide and Sneak in Chapter 9: Tests)."
abilities.troubadour.star-solo.name: Star Solo
abilities.troubadour.star-solo.description: "*Your performance travels and doesn't stop moving until your audience is completely rocked.*"
abilities.troubadour.star-solo.texts.target: One creature or object
abilities.troubadour.star-solo.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {10}}'
abilities.troubadour.star-solo.texts.roll: Power Roll + Presence
abilities.troubadour.star-solo.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + P}} damage'
abilities.troubadour.star-solo.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {8 + P}} damage; push 3'
abilities.troubadour.star-solo.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11 + P}} damage; push 5'
abilities.troubadour.star-solo.texts.effect: 'Effect: You can choose to have this ability deal sonic
  damage. Additionally, you can use this ability against the same target for the next 2 combat
  rounds without spending drama.'
abilities.troubadour.jam-session.name: Jam Session
abilities.troubadour.jam-session.description: '*Your jam session creates new genres that compel everyone to get up and move.*'
abilities.troubadour.jam-session.texts.target: Each enemy in the area
abilities.troubadour.jam-session.texts.distance: 5 burst
abilities.troubadour.jam-session.texts.roll: Power Roll + Presence
abilities.troubadour.jam-session.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8}} sonic damage'
abilities.troubadour.jam-session.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {11}} sonic damage'
abilities.troubadour.jam-session.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {15}} sonic damage'
abilities.troubadour.jam-session.texts.effect: 'Effect: Each creature within distance gains a +5
  bonus to speed until the end of their next turn. While under this effect, each target must use
  their full movement during their turn.'
abilities.troubadour.rising-tension.name: Rising Tension
abilities.troubadour.rising-tension.description: '*You narrate the tension of the scene and put all
  hope into your protagonist to turn things around.*'
abilities.troubadour.rising-tension.texts.target: One ally
abilities.troubadour.rising-tension.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.troubadour.rising-tension.texts.effect: 'Effect: The target gains 3 of their Heroic
  Resource, has a double edge on a power roll of their choice made during their next turn, is no
  longer slowed or weakened if they were before, and can immediately take their turn after yours if
  they have not taken their turn already this round.'
abilities.troubadour.renegotiated-contract.name: Renegotiated Contract
abilities.troubadour.renegotiated-contract.description: "*No, no. You don't die until the sequel.*"
abilities.troubadour.renegotiated-contract.texts.target: One creature
abilities.troubadour.renegotiated-contract.texts.distance: Melee 1
abilities.troubadour.renegotiated-contract.texts.roll: Power Roll + Presence
abilities.troubadour.renegotiated-contract.texts.tier1: You and the target can each end one effect
  on yourselves that is ended by a saving throw or that ends at the end of your turns.
abilities.troubadour.renegotiated-contract.texts.tier2: You and the target can end any effects on
  yourselves that are ended by a saving throw or that end at the end of your turns.
abilities.troubadour.renegotiated-contract.texts.tier3: You can choose any of the current effects on
  you and the target that are ended by a saving throw or that end at the end of your turns, apply
  the chosen effects to the target, and end the rest.
abilities.troubadour.renegotiated-contract.texts.effect: "Effect: Add your current Stamina to your
  target's current Stamina, then you have half that total Stamina and the target has the remainder.
  If either of you would gain more Stamina this way than their Stamina maximum, the difference in
  Stamina between what that creature would gain and their maximum is gained by the other creature.
  Neither of you can gain more Stamina than your maximum this way. You then make a power roll."
abilities.troubadour.melt-their-faces.name: Melt Their Faces
abilities.troubadour.melt-their-faces.description: '*The power of music rips through the reality around the target and blows them away.*'
abilities.troubadour.melt-their-faces.texts.target: One creature or object
abilities.troubadour.melt-their-faces.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {10}}'
abilities.troubadour.melt-their-faces.texts.roll: Power Roll + Presence
abilities.troubadour.melt-their-faces.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {12 + P}} sonic damage; push 5'
abilities.troubadour.melt-their-faces.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {16 + P}} sonic damage; push 10'
abilities.troubadour.melt-their-faces.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {22 + P}} sonic damage; push 15'
abilities.troubadour.melt-their-faces.texts.effect: 'Effect: Forced movement from this ability ignores stability.'
abilities.troubadour.epic.name: Epic
abilities.troubadour.epic.description: "*Your story tells a tale of the villain's waning power and
  how the heroes rose to the occasion to stop them.*"
abilities.troubadour.epic.texts.target: One creature
abilities.troubadour.epic.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {10}}'
abilities.troubadour.epic.texts.roll: Power Roll + Presence
abilities.troubadour.epic.texts.tier1: The target takes a bane on ability rolls (save ends).
abilities.troubadour.epic.texts.tier2: The target has a double bane on ability rolls (save ends).
abilities.troubadour.epic.texts.tier3: The target has a double bane on power rolls (save ends).
abilities.troubadour.epic.texts.effect: 'Effect: Choose one ally within distance. While the target
  is affected by this ability, each time they use an ability, that ally can make a free strike
  against them after the ability is resolved.'
