abilities.troubadour.expert-fencer.description: '*If you can land the strike, the crowd goes wild.*'
abilities.troubadour.expert-fencer.texts.target: One creature or object
abilities.troubadour.expert-fencer.texts.distance: Melee 3
abilities.troubadour.expert-fencer.texts.roll: Power Roll + Agility
abilities.troubadour.expert-fencer.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {15 + A}} damage'
abilities.troubadour.expert-fencer.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {21 + A}} damage'
abilities.troubadour.expert-fencer.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {28 + A}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, bleeding (save ends)'
abilities.troubadour.expert-fencer.texts.effect: "Effect: This ability can't obtain better than a
  tier 2 outcome unless the target is at maximum distance. If you obtain a tier 3 outcome with a
  natural 17 or higher, you gain 3 surges that you can use immediately."
