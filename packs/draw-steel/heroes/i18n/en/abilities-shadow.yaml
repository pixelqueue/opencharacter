abilities.shadow.clever-trick.name: Clever Trick
abilities.shadow.clever-trick.description: "*You sow a moment of confusion in combat, to your enemy's peril.*"
abilities.shadow.clever-trick.texts.trigger: An enemy targets you with a strike.
abilities.shadow.clever-trick.texts.target: Self
abilities.shadow.clever-trick.texts.distance: Self
abilities.shadow.clever-trick.texts.effect: 'Effect: Choose an enemy within distance of the
  triggering strike, including the enemy who targeted you. The strike targets that enemy instead.'
abilities.shadow.gasping-in-pain.name: Gasping in Pain
abilities.shadow.gasping-in-pain.description: "*Your precise strikes let your allies take advantage of a target's agony.*"
abilities.shadow.gasping-in-pain.texts.target: One creature
abilities.shadow.gasping-in-pain.texts.distance: Melee 1
abilities.shadow.gasping-in-pain.texts.roll: Power Roll + Agility
abilities.shadow.gasping-in-pain.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + A}} damage'
abilities.shadow.gasping-in-pain.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + A}} damage'
abilities.shadow.gasping-in-pain.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + A}} damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone'
abilities.shadow.gasping-in-pain.texts.effect: 'Effect: One ally within 5 squares of the target gains 1 surge.'
abilities.shadow.teamwork-has-its-place.name: Teamwork Has Its Place
abilities.shadow.teamwork-has-its-place.description: '*You attack an enemy as an ally exposes their weakness.*'
abilities.shadow.teamwork-has-its-place.texts.target: One creature or object
abilities.shadow.teamwork-has-its-place.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.teamwork-has-its-place.texts.roll: Power Roll + Agility
abilities.shadow.teamwork-has-its-place.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + A}} damage'
abilities.shadow.teamwork-has-its-place.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + A}} damage'
abilities.shadow.teamwork-has-its-place.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + A}} damage'
abilities.shadow.teamwork-has-its-place.texts.effect: 'Effect: If any ally is adjacent to the target, you gain 1 surge before making the power roll.'
abilities.shadow.get-in-get-out.name: Get In Get Out
abilities.shadow.get-in-get-out.description: '*Move unexpectedly, strike fast, and be gone!*'
abilities.shadow.get-in-get-out.texts.target: One creature
abilities.shadow.get-in-get-out.texts.distance: Melee 1
abilities.shadow.get-in-get-out.texts.roll: Power Roll + Agility
abilities.shadow.get-in-get-out.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + A}} damage'
abilities.shadow.get-in-get-out.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {8 + A}} damage'
abilities.shadow.get-in-get-out.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11 + A}} damage'
abilities.shadow.get-in-get-out.texts.effect: 'Effect: You can shift up to your speed, dividing that
  movement before or after your strike as desired.'
abilities.shadow.disorienting-strike.name: Disorienting Strike
abilities.shadow.disorienting-strike.description: '*Your attack leaves them reeling, allowing you to follow up.*'
abilities.shadow.disorienting-strike.texts.target: One creature
abilities.shadow.disorienting-strike.texts.distance: Melee 1
abilities.shadow.disorienting-strike.texts.roll: Power Roll + Agility
abilities.shadow.disorienting-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + A}} damage; slide 2'
abilities.shadow.disorienting-strike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + A}} damage; slide 3'
abilities.shadow.disorienting-strike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10 + A}} damage; slide 5'
abilities.shadow.disorienting-strike.texts.effect: 'Effect: You can shift into any square the target leaves when you slide them.'
abilities.shadow.defensive-roll.name: Defensive Roll
abilities.shadow.defensive-roll.description: '*When an enemy attacks, you roll with the impact to reduce the harm.*'
abilities.shadow.defensive-roll.texts.trigger: Another creature damages you.
abilities.shadow.defensive-roll.texts.target: Self
abilities.shadow.defensive-roll.texts.distance: Self
abilities.shadow.defensive-roll.texts.effect: >-
  Effect: You take half the triggering damage, then can shift up to 2 squares after the triggering
  effect resolves. If you end this shift with concealment or cover, you can use the Hide maneuver
  even if you are observed.


  Spend 1 Insight: The potency of any effects associated with the damage are reduced by 1 for you.
abilities.shadow.setup.name: Setup
effects.shadow.setup.name: Set up (damage weakness 5)
abilities.shadow.setup.description: '*Your friends will thank you.*'
abilities.shadow.setup.texts.target: One creature
abilities.shadow.setup.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.shadow.setup.texts.roll: Power Roll + Agility
abilities.shadow.setup.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + A}} damage; R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, the target has damage weakness 5 (save ends)'
abilities.shadow.setup.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + A}} damage; R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, the target has damage weakness 5 (save ends)'
abilities.shadow.setup.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + A}} damage; R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, the target has damage weakness 5 (save ends)'
abilities.shadow.one-hundred-throats.name: One Hundred Throats
abilities.shadow.one-hundred-throats.description: '*As you move across the battlefield, every foe within reach feels your wrath.*'
abilities.shadow.one-hundred-throats.texts.target: Self
abilities.shadow.one-hundred-throats.texts.distance: Self; see below
abilities.shadow.one-hundred-throats.texts.roll: Power Roll + Agility
abilities.shadow.one-hundred-throats.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3}} damage'
abilities.shadow.one-hundred-throats.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} damage'
abilities.shadow.one-hundred-throats.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9}} damage'
abilities.shadow.one-hundred-throats.texts.effect: 'Effect: You shift up to your speed and make one
  power roll that targets up to three enemies who came adjacent to you during the move.'
abilities.shadow.black-ash-teleport.name: Black Ash Teleport
abilities.shadow.black-ash-teleport.description: '*In a swirl of black ash, you step from one place to another.*'
abilities.shadow.black-ash-teleport.texts.target: Self
abilities.shadow.black-ash-teleport.texts.distance: Self
abilities.shadow.black-ash-teleport.texts.effect: >-
  Effect: You teleport up to 5 squares. If you have concealment or cover at your destination, you
  can use the Hide maneuver even if you are observed. If you successfully hide using this maneuver,
  you gain 1 surge.


  Spend 1+ Insight: You teleport 1 additional square for each insight spent.
abilities.shadow.coat-the-blade.name: Coat the Blade
abilities.shadow.coat-the-blade.description: '*A little poison goes a long way.*'
abilities.shadow.coat-the-blade.texts.target: Self
abilities.shadow.coat-the-blade.texts.distance: Self
abilities.shadow.coat-the-blade.texts.effect: >-
  Effect: You gain 2 surges. Additionally, whenever you use a surge before the end of the encounter,
  you can choose to have it deal poison damage.


  Spend 1+ Insight: For each insight you spend, you gain 1 additional surge.
abilities.shadow.im-no-threat.name: I'm No Threat
abilities.shadow.im-no-threat.description: '*Taking on an illusory countenance gives you an advantage on subterfuge.*'
abilities.shadow.im-no-threat.texts.target: Self
abilities.shadow.im-no-threat.texts.distance: Self
abilities.shadow.im-no-threat.texts.effect: >-
  Effect: You envelop yourself in an illusion that makes you appear nonthreatening and harmless to
  your enemies. You might take on the appearance of a harmless animal of your size, such as a sheep
  or capybara, or you might appear as a less heroic and unarmed version of yourself. While this
  illusion lasts, your strikes gain an edge, and when you take the Disengage move action, you gain a
  +1 bonus to the distance you can shift.

  The illusion ends when you harm another creature, when you physically interact with a creature,
  when you use this ability again, or when you end the illusion (no action required). If you end
  this illusion by harming another creature, you gain 1 surge.


  Spend 1 Insight: Choose a creature whose size is no more than 1 greater than yours and who is
  within 10 squares. This ability's illusion makes you appear as that creature. This illusion covers
  your entire body, including clothing and armor, and alters your voice to sound like that of the
  creature. You gain an edge on tests made to convince the creature's allies that you are the
  creature.
abilities.shadow.coup-de-grace.name: Coup de Grace
abilities.shadow.coup-de-grace.description: '*Your blade might be the last thing they see.*'
abilities.shadow.coup-de-grace.texts.target: One creature
abilities.shadow.coup-de-grace.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.coup-de-grace.texts.roll: Power Roll + Agility
abilities.shadow.coup-de-grace.texts.tier1: 2d6 + 7 + A damage
abilities.shadow.coup-de-grace.texts.tier2: 2d6 + 11 + A damage
abilities.shadow.coup-de-grace.texts.tier3: 2d6 + 16 + A damage
abilities.shadow.i-work-better-alone.name: I Work Better Alone
abilities.shadow.i-work-better-alone.description: '*"It''s better, just you and me. Isn''t it?"*'
abilities.shadow.i-work-better-alone.texts.target: One creature
abilities.shadow.i-work-better-alone.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.i-work-better-alone.texts.roll: Power Roll + Agility
abilities.shadow.i-work-better-alone.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + A}} damage'
abilities.shadow.i-work-better-alone.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + A}} damage'
abilities.shadow.i-work-better-alone.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + A}} damage'
abilities.shadow.i-work-better-alone.texts.effect: 'Effect: If the target has none of your allies
  adjacent to them, you gain 1 surge before making the power roll.'
abilities.shadow.hesitation-is-weakness.name: Hesitation Is Weakness
abilities.shadow.hesitation-is-weakness.description: "*Keep up the attack. Never give them a moment's grace.*"
abilities.shadow.hesitation-is-weakness.texts.trigger: Another hero ends their turn. That hero can't have used this ability to start their turn.
abilities.shadow.hesitation-is-weakness.texts.target: Self
abilities.shadow.hesitation-is-weakness.texts.distance: Self
abilities.shadow.hesitation-is-weakness.texts.effect: 'Effect: You take your turn after the triggering hero.'
abilities.shadow.in-all-this-confusion.name: In All This Confusion
abilities.shadow.in-all-this-confusion.description: '*You vanish in a plume of black smoke to avoid danger.*'
abilities.shadow.in-all-this-confusion.texts.trigger: You take damage.
abilities.shadow.in-all-this-confusion.texts.target: Self
abilities.shadow.in-all-this-confusion.texts.distance: Self
abilities.shadow.in-all-this-confusion.texts.effect: >-
  Effect: You take half the damage, then can teleport up to 4 squares after the triggering effect
  resolves.


  Spend 1+ Insight: You teleport 1 additional square for each insight spent.
abilities.shadow.shadowstrike.name: Shadowstrike
abilities.shadow.shadowstrike.description: '*They have no idea what the college taught you.*'
abilities.shadow.shadowstrike.texts.target: Self
abilities.shadow.shadowstrike.texts.distance: Self; see below
abilities.shadow.shadowstrike.texts.effect: 'Effect: You use a strike signature ability twice.'
abilities.shadow.you-were-watching-the-wrong-one.name: You Were Watching the Wrong One
abilities.shadow.you-were-watching-the-wrong-one.description: "*They can't watch both of you at once.*"
abilities.shadow.you-were-watching-the-wrong-one.texts.target: One creature
abilities.shadow.you-were-watching-the-wrong-one.texts.distance: Melee 1
abilities.shadow.you-were-watching-the-wrong-one.texts.roll: Power Roll + Agility
abilities.shadow.you-were-watching-the-wrong-one.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + A}} damage'
abilities.shadow.you-were-watching-the-wrong-one.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + A}} damage'
abilities.shadow.you-were-watching-the-wrong-one.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + A}} damage'
abilities.shadow.you-were-watching-the-wrong-one.texts.effect: 'Effect: As long as you have one or
  more allies within 5 squares of the target, you gain 1 surge. If you are flanking the target when
  you use this ability, choose one ally who is flanking with you. That ally also gains 1 surge.'
abilities.shadow.eviscerate.name: Eviscerate
abilities.shadow.eviscerate.description: '*You leave your foe bleeding out after a devastating attack.*'
abilities.shadow.eviscerate.texts.target: One creature
abilities.shadow.eviscerate.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.eviscerate.texts.roll: Power Roll + Agility
abilities.shadow.eviscerate.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + A}} damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, bleeding (save ends)'
abilities.shadow.eviscerate.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + A}} damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, bleeding (save ends)'
abilities.shadow.eviscerate.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10 + A}} damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, bleeding (save ends)'
abilities.shadow.two-throats-at-once.name: Two Throats at Once
abilities.shadow.two-throats-at-once.description: '*A bargain.*'
abilities.shadow.two-throats-at-once.texts.target: Two creatures or objects
abilities.shadow.two-throats-at-once.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.two-throats-at-once.texts.roll: Power Roll + Agility
abilities.shadow.two-throats-at-once.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4}} damage'
abilities.shadow.two-throats-at-once.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} damage'
abilities.shadow.two-throats-at-once.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10}} damage'
abilities.shadow.shadowgrasp.name: Shadowgrasp
abilities.shadow.shadowgrasp.description: '*The shadows around you give way, allowing the shadow creature within you to grasp at your foes.*'
abilities.shadow.shadowgrasp.texts.target: Each enemy in the area
abilities.shadow.shadowgrasp.texts.distance: 2 burst
abilities.shadow.shadowgrasp.texts.roll: Power Roll + Agility
abilities.shadow.shadowgrasp.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {11}} corruption damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.shadow.shadowgrasp.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {16}} corruption damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.shadow.shadowgrasp.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {21}} corruption damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.shadow.they-always-line-up.name: They Always Line Up
abilities.shadow.they-always-line-up.description: '*You fire a projectile so fast that it passes through a line of foes, hamstringing them.*'
abilities.shadow.they-always-line-up.texts.target: Each enemy in the area
abilities.shadow.they-always-line-up.texts.distance: '5 x 1 line within {has_self_within, select, true {{self_within}} other {5}}'
abilities.shadow.they-always-line-up.texts.roll: Power Roll + Agility
abilities.shadow.they-always-line-up.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {12}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.shadow.they-always-line-up.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {18}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, slowed (save ends)'
abilities.shadow.they-always-line-up.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {24}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, slowed (save ends)'
abilities.shadow.speed-of-shadows.name: Speed of Shadows
abilities.shadow.speed-of-shadows.description: "*You make multiple strikes against a foe before they even notice they're dead.*"
abilities.shadow.speed-of-shadows.texts.target: Self
abilities.shadow.speed-of-shadows.texts.distance: Self
abilities.shadow.speed-of-shadows.texts.effect: 'Effect: You can use a strike signature ability four
  times, use a strike signature ability that gains an edge three times, or use a strike signature
  ability that has a double edge twice. You can shift up to 2 squares between each use.'
abilities.shadow.assassinate.name: Assassinate
abilities.shadow.assassinate.description: '*A practiced attack will instantly kill an already weakened foe.*'
abilities.shadow.assassinate.texts.target: One creature or object
abilities.shadow.assassinate.texts.distance: Melee 1
abilities.shadow.assassinate.texts.roll: Power Roll + Agility
abilities.shadow.assassinate.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {12 + A}} damage'
abilities.shadow.assassinate.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {18 + A}} damage'
abilities.shadow.assassinate.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {24 + A}} damage'
abilities.shadow.assassinate.texts.effect: 'Effect: A target who is not a minion, leader, or solo
  creature and who is winded after taking this damage is reduced to 0 Stamina.'
abilities.shadow.time-bomb.name: Time Bomb
abilities.shadow.time-bomb.description: '*The longer it cooks, the bigger the boom.*'
abilities.shadow.time-bomb.texts.target: Each enemy in the area
abilities.shadow.time-bomb.texts.distance: '2 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.shadow.time-bomb.texts.effect: >-
  Effect: Each target takes acid, fire, or poison damage (your choice) equal to your Agility score.

  For each combat round that has passed since this ability was last used in the current encounter,
  the area increases by 1 and you gain 1 surge that must be used with this ability. After using the
  ability or at the end of the encounter, its area and surges are reset.


  Spend 2+ Insight: For every 2 insight spent, you increase the cube's size by 1 and gain 1 surge
  that can be used only with this ability.
abilities.shadow.look.name: Look!
abilities.shadow.look.description: '*You distract your foes, allowing your allies to take advantage of that distraction.*'
abilities.shadow.look.texts.target: Each enemy in the area
abilities.shadow.look.texts.distance: 5 burst
abilities.shadow.look.texts.effect: 'Effect: Until the start of your next turn, any ability roll made against a target gains an edge.'
abilities.shadow.one-vial-makes-you-better.name: One Vial Makes You Better
abilities.shadow.one-vial-makes-you-better.description: '*A well-timed throw of a potion will keep your allies in the fight.*'
abilities.shadow.one-vial-makes-you-better.texts.target: Three creatures
abilities.shadow.one-vial-makes-you-better.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.shadow.one-vial-makes-you-better.texts.effect: >-
  Effect: You ready, hand, or lob a potion to each target, who can immediately quaff the potion (no
  action required). If they don't drink the potion right away, they must use the Use Consumable
  maneuver to consume it later. The potion loses its potency at the end of the encounter.

  A creature who drinks the potion can spend up to 2 Recoveries, and has acid immunity, fire
  immunity, or poison immunity (their choice) equal to your level until the end of the encounter.
abilities.shadow.black-ash-eruption.name: Black Ash Eruption
abilities.shadow.black-ash-eruption.description: '*Your attack produces a cloud of black ash that launches an enemy into the air.*'
abilities.shadow.black-ash-eruption.texts.target: One creature
abilities.shadow.black-ash-eruption.texts.distance: Melee 1
abilities.shadow.black-ash-eruption.texts.roll: Power Roll + Agility
abilities.shadow.black-ash-eruption.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + A}} damage; vertical push 5'
abilities.shadow.black-ash-eruption.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + A}} damage; vertical push 10'
abilities.shadow.black-ash-eruption.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + A}} damage; vertical push 15'
abilities.shadow.black-ash-eruption.texts.effect: 'Effect: A creature force moved by this ability must be moved straight upward.'
abilities.shadow.puppet-strings.name: Puppet Strings
abilities.shadow.puppet-strings.description: '*You prick little needles on the tips of your fingers
  into the nerves of your enemies and cause them to lose control.*'
abilities.shadow.puppet-strings.texts.target: Two enemies
abilities.shadow.puppet-strings.texts.distance: Melee 1
abilities.shadow.puppet-strings.texts.roll: Power Roll + Agility
abilities.shadow.puppet-strings.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} damage; if the target has R < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, before the damage is resolved, they make a free strike.'
abilities.shadow.puppet-strings.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} damage; if the target has R < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, before the damage is resolved, they use a main action ability of your choice.'
abilities.shadow.puppet-strings.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} damage; if the target has R < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, before the damage is resolved, they can shift up to their speed and use a main action ability of your choice.'
abilities.shadow.puppet-strings.texts.effect: "Effect: You choose the new targets for the original
  target's free strike or ability. Additionally, if you are hidden or disguised, using this ability
  doesn't cause you to be revealed."
abilities.shadow.cinderstorm.name: Cinderstorm
abilities.shadow.cinderstorm.description: '*You teleport your friends in a burst of ash and fire.*'
abilities.shadow.cinderstorm.texts.target: Self and each ally in the area
abilities.shadow.cinderstorm.texts.distance: 4 burst
abilities.shadow.cinderstorm.texts.effect: 'Effect: Each target can teleport up to 5 squares. For
  each target in addition to you who teleports away from or into a space adjacent to an enemy, that
  enemy takes fire damage equal to your Agility score. Additionally, a target who ends this movement
  in concealment or cover can use the Hide maneuver even if they are observed.'
abilities.shadow.one-vial-makes-you-faster.name: One Vial Makes You Faster
abilities.shadow.one-vial-makes-you-faster.description: '*Each ally who catches a potion you throw can take the battle to the next level.*'
abilities.shadow.one-vial-makes-you-faster.texts.target: Three creatures
abilities.shadow.one-vial-makes-you-faster.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.shadow.one-vial-makes-you-faster.texts.roll: Power Roll + Agility
abilities.shadow.one-vial-makes-you-faster.texts.tier1: The creature's speed is increased by 2 until the end of the encounter.
abilities.shadow.one-vial-makes-you-faster.texts.tier2: The creature can fly until the end of the encounter.
abilities.shadow.one-vial-makes-you-faster.texts.tier3: The creature turns invisible until the end of their next turn.
abilities.shadow.one-vial-makes-you-faster.texts.effect: >-
  Effect: You ready, hand, or lob a potion to each target, who can immediately quaff the potion (no
  action required). If they don't drink the potion right away, they must use the Use Consumable
  maneuver to consume it later. The potion loses its potency at the end of the encounter.

  A creature who drinks the potion receives benefits based on your power roll.
abilities.shadow.shadowfall.name: Shadowfall
abilities.shadow.shadowfall.description: '*You vanish. They fall. You reappear.*'
abilities.shadow.shadowfall.texts.target: Each enemy in the area
abilities.shadow.shadowfall.texts.distance: 10 x 1 line within 1
abilities.shadow.shadowfall.texts.roll: Power Roll + Agility
abilities.shadow.shadowfall.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10}} damage'
abilities.shadow.shadowfall.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14}} damage'
abilities.shadow.shadowfall.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {20}} damage'
abilities.shadow.shadowfall.texts.effect: 'Effect: You disappear before making the power roll. After
  the power roll is resolved, you appear in the first unoccupied space at the far end of the line.'
abilities.shadow.blackout.name: Blackout
abilities.shadow.blackout.description: '*You cause a plume of shadow to erupt from your eyes and create a cloud of darkness.*'
abilities.shadow.blackout.texts.target: Special
abilities.shadow.blackout.texts.distance: 3 burst
abilities.shadow.blackout.texts.effect: 'Effect: A black cloud fills the area until the end of your
  next turn, granting you and your allies concealment against enemies. While you are in the area,
  whenever an enemy ends their turn in the area, you can use a free triggered action to shift to a
  new location within the area and make a free strike against them.'
abilities.shadow.into-the-shadows.name: Into the Shadows
abilities.shadow.into-the-shadows.description: '*You sweep your foe off their feet and plunge them into absolute darkness.*'
abilities.shadow.into-the-shadows.texts.target: One creature or object
abilities.shadow.into-the-shadows.texts.distance: Melee 1
abilities.shadow.into-the-shadows.texts.roll: Power Roll + Agility
abilities.shadow.into-the-shadows.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + A}} corruption damage'
abilities.shadow.into-the-shadows.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13 + A}} corruption damage'
abilities.shadow.into-the-shadows.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {17 + A}} corruption damage'
abilities.shadow.into-the-shadows.texts.effect: 'Effect: You and the target are removed from the
  encounter map until the start of your next turn. You reappear in the spaces you left or the
  nearest unoccupied spaces. Make a power roll upon your return.'
abilities.shadow.you-talk-too-much.name: You Talk Too Much
abilities.shadow.you-talk-too-much.description: '*Silence is a virtue. A knife pinning their mouth shut is the next best thing.*'
abilities.shadow.you-talk-too-much.texts.target: One creature
abilities.shadow.you-talk-too-much.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.you-talk-too-much.texts.roll: Power Roll + Agility
abilities.shadow.you-talk-too-much.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + A}} damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, dazed (save ends)'
abilities.shadow.you-talk-too-much.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {15 + A}} damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed (save ends)'
abilities.shadow.you-talk-too-much.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {21 + A}} damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.shadow.you-talk-too-much.texts.effect: "Effect: The target can't communicate with anyone until the end of the encounter."
abilities.shadow.too-slow.name: Too Slow
abilities.shadow.too-slow.description: '*Your foe made a big mistake.*'
abilities.shadow.too-slow.texts.trigger: You use your In All This Confusion ability.
abilities.shadow.too-slow.texts.target: Self
abilities.shadow.too-slow.texts.distance: Self; see below
abilities.shadow.too-slow.texts.effect: 'Effect: You ignore any effects associated with the damage
  that triggered your In All This Confusion ability. Before you teleport, you can make a free strike
  against a creature who damaged you to trigger In All This Confusion. After you teleport, you can
  spend a Recovery.'
abilities.shadow.stink-bomb.name: Stink Bomb
abilities.shadow.stink-bomb.description: '*Putrid yellow gas explodes from a bomb you toss.*'
abilities.shadow.stink-bomb.texts.target: Each creature in the area
abilities.shadow.stink-bomb.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.shadow.stink-bomb.texts.roll: Power Roll + Agility
abilities.shadow.stink-bomb.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} poison damage'
abilities.shadow.stink-bomb.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} poison damage'
abilities.shadow.stink-bomb.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} poison damage'
abilities.shadow.stink-bomb.texts.effect: 'Effect: The gas remains in the area until the end of the
  encounter. Any creature who starts their turn in the area and has M < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}} is weakened (save
  ends).'
abilities.shadow.sticky-bomb.name: Sticky Bomb
abilities.shadow.sticky-bomb.description: "*Explosives are best when they're attached to an enemy.*"
abilities.shadow.sticky-bomb.texts.target: One creature
abilities.shadow.sticky-bomb.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.shadow.sticky-bomb.texts.roll: Power Roll + Agility
abilities.shadow.sticky-bomb.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + A}} fire damage'
abilities.shadow.sticky-bomb.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {7 + A}} fire damage'
abilities.shadow.sticky-bomb.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11 + A}} fire damage'
abilities.shadow.sticky-bomb.texts.effect: "Effect: You attach a small bomb to a creature. If you
  are hidden from the creature, they don't notice the bomb and you remain hidden. The creature
  otherwise notices the bomb and can disarm and remove it as a main action. If they don't, at the
  end of your next turn, the bomb detonates. When the bomb detonates, you make a power roll
  targeting each enemy within 2 squares of it."
abilities.shadow.so-gullible.name: So Gullible
abilities.shadow.so-gullible.description: '*When your enemy strikes, you reveal you were in a different place all along.*'
abilities.shadow.so-gullible.texts.trigger: Another creature targets you with a strike.
abilities.shadow.so-gullible.texts.target: Self
abilities.shadow.so-gullible.texts.distance: Self
abilities.shadow.so-gullible.texts.effect: 'Effect: You use your Clever Trick ability with no
  insight cost against the triggering creature and strike. You can teleport to an unoccupied space
  within 3 squares of that creature and can make a free strike against them. You can then spend a
  Recovery.'
abilities.shadow.machinations-of-sound.name: Machinations of Sound
abilities.shadow.machinations-of-sound.description: '*Illusory sounds make your foes reposition
  themselves as they cower or investigate the disturbance.*'
abilities.shadow.machinations-of-sound.texts.target: Each enemy in the area
abilities.shadow.machinations-of-sound.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.shadow.machinations-of-sound.texts.roll: Power Roll + Agility
abilities.shadow.machinations-of-sound.texts.tier1: Slide 4
abilities.shadow.machinations-of-sound.texts.tier2: Slide 5
abilities.shadow.machinations-of-sound.texts.tier3: Slide 7
abilities.shadow.machinations-of-sound.texts.effect: "Effect: This forced movement ignores
  stability. Instead, the forced movement is reduced by a number equal to the target's Intuition
  score."
abilities.shadow.in-a-puff-of-ash.name: In a Puff of Ash
abilities.shadow.in-a-puff-of-ash.description: '*You enchant a strike with your teleportation magic.*'
abilities.shadow.in-a-puff-of-ash.texts.target: One creature
abilities.shadow.in-a-puff-of-ash.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.in-a-puff-of-ash.texts.roll: Power Roll + Agility
abilities.shadow.in-a-puff-of-ash.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + A}} damage; you can teleport the target 1 square'
abilities.shadow.in-a-puff-of-ash.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + A}} damage; you can teleport the target up to 3 squares'
abilities.shadow.in-a-puff-of-ash.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {14 + A}} damage; you can teleport the target up to 5 squares'
abilities.shadow.pinning-shot.name: Pinning Shot
abilities.shadow.pinning-shot.description: '*One missile—placed well and placed hard.*'
abilities.shadow.pinning-shot.texts.target: One creature
abilities.shadow.pinning-shot.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.shadow.pinning-shot.texts.roll: Power Roll + Agility
abilities.shadow.pinning-shot.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + A}} damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.shadow.pinning-shot.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {12 + A}} damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.shadow.pinning-shot.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {16 + A}} damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.shadow.dancer.name: Dancer
abilities.shadow.dancer.description: '*You enter a flow state that makes you nearly impossible to pin down.*'
abilities.shadow.dancer.texts.target: Self
abilities.shadow.dancer.texts.distance: Self
abilities.shadow.dancer.texts.effect: 'Effect: Until the end of the encounter, whenever an enemy
  moves or is force moved adjacent to you or damages you, you can take the Disengage move action as
  a free triggered action.'
abilities.shadow.careful-observation.name: Careful Observation
abilities.shadow.careful-observation.description: '*A moment of focus leaves a foe firmly in your sights.*'
abilities.shadow.careful-observation.texts.target: One creature
abilities.shadow.careful-observation.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {20}}'
abilities.shadow.careful-observation.texts.effect: 'Effect: As long as you remain within distance of
  the target, maintain line of effect to them, and strike no other creature first, you gain an edge
  on the next strike you make against the assessed creature, and gain 1 surge you can use only on
  that strike.'
abilities.shadow.staggering-blow.name: Staggering Blow
abilities.shadow.staggering-blow.description: "*There's no recovering from this.*"
abilities.shadow.staggering-blow.texts.target: One creature
abilities.shadow.staggering-blow.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.staggering-blow.texts.roll: Power Roll + Agility
abilities.shadow.staggering-blow.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + A}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.shadow.staggering-blow.texts.tier2: "{has_self_damage2, select, true {{self_damage2}} other {11 + A}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone and can't stand (save ends)"
abilities.shadow.staggering-blow.texts.tier3: "{has_self_damage3, select, true {{self_damage3}} other {16 + A}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone and can't stand (save ends)"
abilities.shadow.misdirecting-strike.name: Misdirecting Strike
abilities.shadow.misdirecting-strike.description: '*"Why are you looking at ME?!"*'
abilities.shadow.misdirecting-strike.texts.target: One creature
abilities.shadow.misdirecting-strike.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.shadow.misdirecting-strike.texts.roll: Power Roll + Agility
abilities.shadow.misdirecting-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {9 + A}} damage'
abilities.shadow.misdirecting-strike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13 + A}} damage'
abilities.shadow.misdirecting-strike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {18 + A}} damage'
abilities.shadow.misdirecting-strike.texts.effect: "Effect: The target is taunted by a willing ally
  within 5 squares of you until the end of the target's next turn."
abilities.shadow.i-am-you.name: I Am You
abilities.shadow.i-am-you.description: "*Your mask reflects your foe's face. Surely they won't need it much longer.*"
abilities.shadow.i-am-you.texts.target: One creature
abilities.shadow.i-am-you.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.shadow.i-am-you.texts.effect: "Effect: Until the end of the encounter, you gain the
  target's damage immunities and speed (if they are better than yours), and can use any types of
  movement they can use. You can also use the target's signature ability, using their bonus for the
  power roll."
abilities.shadow.demon-door.name: Demon Door
abilities.shadow.demon-door.description: '*You create a temporary portal to allow a massive demonic hand to reach through.*'
abilities.shadow.demon-door.texts.target: One creature
abilities.shadow.demon-door.texts.distance: Melee 3
abilities.shadow.demon-door.texts.roll: Power Roll + Agility
abilities.shadow.demon-door.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {13 + A}} corruption damage; push 3'
abilities.shadow.demon-door.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {18 + A}} corruption damage; push 5'
abilities.shadow.demon-door.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {25 + A}} corruption damage; push 7'
abilities.shadow.demon-door.texts.effect: 'Effect: On a critical hit, the target is grabbed by the
  demon and pulled through the portal before it closes, never to be seen again.'
abilities.shadow.it-was-me-all-along.name: It Was Me All Along
abilities.shadow.it-was-me-all-along.description: "*After everything you've been through together,
  you twist the blade and make the pain extra personal.*"
abilities.shadow.it-was-me-all-along.texts.target: One creature or object
abilities.shadow.it-was-me-all-along.texts.distance: Melee 1
abilities.shadow.it-was-me-all-along.texts.roll: Power Roll + Agility
abilities.shadow.it-was-me-all-along.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {15 + A}} damage'
abilities.shadow.it-was-me-all-along.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {21 + A}} damage'
abilities.shadow.it-was-me-all-along.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {28 + A}} damage'
abilities.shadow.it-was-me-all-along.texts.effect: "Effect: If you are disguised as a creature the
  target knew using your I'm No Threat ability, this ability deals extra damage equal to three times
  your Agility score."
abilities.shadow.to-the-stars.name: To the Stars
abilities.shadow.to-the-stars.description: "*You attach your most potent explosive to your foe.
  Under less pressing circumstances, you're sure you could launch them into orbit.*"
abilities.shadow.to-the-stars.texts.target: One creature or object
abilities.shadow.to-the-stars.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {10}}'
abilities.shadow.to-the-stars.texts.roll: Power Roll + Agility
abilities.shadow.to-the-stars.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + A}} fire damage; vertical push 8'
abilities.shadow.to-the-stars.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {7 + A}} fire damage; vertical push 10'
abilities.shadow.to-the-stars.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11 + A}} fire damage; vertical push 15'
abilities.shadow.to-the-stars.texts.effect: "Effect: The ground beneath a 3-cube area around the
  target's starting position is difficult terrain."
abilities.shadow.cacophony-of-cinders.name: Cacophony of Cinders
abilities.shadow.cacophony-of-cinders.description: '*You tumble through the battle, stabbing foes and teleporting allies.*'
abilities.shadow.cacophony-of-cinders.texts.target: Self
abilities.shadow.cacophony-of-cinders.texts.distance: Self; see below
abilities.shadow.cacophony-of-cinders.texts.roll: Power Roll + Agility
abilities.shadow.cacophony-of-cinders.texts.tier1: An enemy takes 6 damage; an ally can teleport up to 3 squares.
abilities.shadow.cacophony-of-cinders.texts.tier2: An enemy takes 10 damage; an ally can teleport up to 5 squares.
abilities.shadow.cacophony-of-cinders.texts.tier3: An enemy takes 14 damage; an ally can teleport up to 7 squares.
abilities.shadow.cacophony-of-cinders.texts.effect: 'Effect: You shift up to twice your speed,
  making one power roll that targets each creature you come adjacent to during the shift.'
abilities.shadow.chain-reaction.name: Chain Reaction
abilities.shadow.chain-reaction.description: '*One explosion, an offense. Three explosions, an assault. Nine explosions, a celebration.*'
abilities.shadow.chain-reaction.texts.target: One creature or object
abilities.shadow.chain-reaction.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.shadow.chain-reaction.texts.roll: Power Roll + Agility
abilities.shadow.chain-reaction.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7}} damage'
abilities.shadow.chain-reaction.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10}} damage'
abilities.shadow.chain-reaction.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {15}} damage'
abilities.shadow.chain-reaction.texts.effect: 'Effect: Each enemy within 3 squares of the target who
  is not currently targeted by this ability also becomes targeted by this ability. This effect
  continues until there are no more available targets. The ability deals acid, fire, or poison
  damage (your choice).'
abilities.shadow.night-watch.name: Night Watch
abilities.shadow.night-watch.description: '*A steely dagger from out of the blue knocks another weapon off course.*'
abilities.shadow.night-watch.texts.trigger: The target takes damage from another creature's ability while you are hidden.
abilities.shadow.night-watch.texts.target: One ally
abilities.shadow.night-watch.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.shadow.night-watch.texts.effect: 'Effect: The target takes half the damage. You remain hidden.'
abilities.shadow.im-no-threat.actions.end-illusion.name: End the illusion
abilities.shadow.im-no-threat.actions.end-illusion.results.ended.name: Ended
