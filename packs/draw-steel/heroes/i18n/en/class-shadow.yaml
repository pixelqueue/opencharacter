features.shadow.careful-observation-improvement.name: Careful Observation Improvement
features.shadow.careful-observation-improvement.description: You can target three creatures simultaneously with your Careful Observation ability.
features.shadow.death-pool.name: Death Pool
features.shadow.death-pool.description: The first time each combat round that you deal damage
  incorporating 1 or more surges, you gain 3 insight instead of 2.
features.shadow.improved-umbral-form.name: Improved Umbral Form
features.shadow.improved-umbral-form.description: >-
  You gain full control over the shadow creature you become with your Umbral Form feature, and you
  can end the transformation at will (no action required). Additionally, you are always wreathed in
  darkness that grants you concealment while in this form, and creatures no longer gain an edge on
  strikes against you.


  While you are in your umbral form, you can spend 1 uninterrupted minute concentrating on a
  location where you've been before. At the end of that minute, you and each willing creature of
  your choice within 10 squares of you can teleport to unoccupied spaces of your choice within that
  location. Each creature who teleports this way is invisible for 1 hour or until they use an
  ability.
features.shadow.subterfuge.name: Subterfuge
features.shadow.subterfuge.description: >-
  You have an epic resource called subterfuge. Each time you finish a respite, you gain subterfuge
  equal to the XP you gain. You can spend subterfuge on your abilities as if it were insight.


  Additionally, you can spend subterfuge to take additional maneuvers on your turn. You can use one
  maneuver for each subterfuge you spend.


  Subterfuge remains until you spend it.
features.shadow.black-ash-teleport.name: Black Ash Teleport
features.shadow.black-ash-teleport.description: >-
  You have the following ability.


  > ###### Black Ash Teleport

  >

  > *In a swirl of black ash, you step from one place to another.*

  >

  > | **Magic**   | **Maneuver** |

  > | ----------- | -----------: |

  > | **📏 Self** |  **🎯 Self** |

  >

  > **Effect:** You teleport up to 5 squares. If you have concealment or cover at your destination,
  you can use the Hide maneuver even if you are observed. If you successfully hide using this
  maneuver, you gain 1 surge.

  >

  > **Spend 1+ Insight:** You teleport 1 additional square for each insight spent.
features.shadow.coat-the-blade.name: Coat the Blade
features.shadow.coat-the-blade.description: >-
  You have the following ability.


  > ###### Coat the Blade

  >

  > *A little poison goes a long way.*

  >

  > | **-**       | **Maneuver** |

  > | ----------- | -----------: |

  > | **📏 Self** |  **🎯 Self** |

  >

  > **Effect:** You gain 2 surges. Additionally, whenever you use a surge before the end of the
  encounter, you can choose to have it deal poison damage.

  >

  > **Spend 1+ Insight:** For each insight you spend, you gain 1 additional surge.
features.shadow.hesitation-is-weakness.name: Hesitation Is Weakness
features.shadow.hesitation-is-weakness.description: >-
  You have the following ability.


  > ###### Hesitation Is Weakness (1 Insight)

  >

  > *Keep up the attack. Never give them a moment's grace.*

  >

  > | **-**       | **Free triggered** |

  > | ----------- | -----------------: |

  > | **📏 Self** |        **🎯 Self** |

  >

  > **Trigger:** Another hero ends their turn. That hero can't have used this ability to start their
  turn.

  >

  > **Effect:** You take your turn after the triggering hero.
features.shadow.im-no-threat.name: I'm No Threat
features.shadow.im-no-threat.description: >-
  You have the following ability.


  > ###### I'm No Threat

  >

  > *Taking on an illusory countenance gives you an advantage on subterfuge.*

  >

  > | **Magic**   | **Maneuver** |

  > | ----------- | -----------: |

  > | **📏 Self** |  **🎯 Self** |

  >

  > **Effect:** You envelop yourself in an illusion that makes you appear nonthreatening and
  harmless to your enemies. You might take on the appearance of a harmless animal of your size, such
  as a sheep or capybara, or you might appear as a less heroic and unarmed version of yourself.
  While this illusion lasts, your strikes gain an edge, and when you take the Disengage move action,
  you gain a +1 bonus to the distance you can shift.

  >

  > The illusion ends when you harm another creature, when you physically interact with a creature,
  when you use this ability again, or when you end the illusion (no action required). If you end
  this illusion by harming another creature, you gain 1 surge.

  >

  > **Spend 1 Insight:** Choose a creature whose size is no more than 1 greater than yours and who
  is within 10 squares. This ability's illusion makes you appear as that creature. This illusion
  covers your entire body, including clothing and armor, and alters your voice to sound like that of
  the creature. You gain an edge on tests made to convince the creature's allies that you are the
  creature.
features.shadow.insight-outside-of-combat.name: Insight Outside of Combat
features.shadow.insight-outside-of-combat.description: >-
  Although you can't gain insight outside of combat, you can use your heroic abilities and effects
  that cost insight without spending it. Whenever you use an ability or effect outside of combat
  that costs insight, you can't use that same ability or effect outside of combat again until you
  earn 1 or more Victories or finish a respite.


  When you use an ability outside of combat that lets you spend unlimited insight on its effect,
  such as Black Ash Teleport, you can use it as if you had spent an amount of insight equal to your
  Victories.
features.shadow.insight-in-combat.name: Insight in Combat
features.shadow.insight-in-combat.description: >-
  At the start of a combat encounter or some other stressful situation tracked in combat rounds (as
  determined by the Director), you gain insight equal to your Victories. At the start of each of
  your turns during combat, you gain 1d3 insight.


  Additionally, the first time each combat round that you deal damage incorporating 1 or more
  surges, you gain 1 insight.


  Whenever you use a heroic ability that makes use of a power roll, that ability costs 1 fewer
  insight if you have an edge or double edge on it. If the ability has multiple targets, the cost is
  reduced even if the ability gains an edge or has a double edge against only one target.


  You lose any remaining insight at the end of the encounter.
features.shadow.smoke-bomb.name: Smoke Bomb
features.shadow.smoke-bomb.description: You always carry a supply of smoke bombs to use for
  distractions and easy getaways. You can use the Hide maneuver even if you are observed and don't
  initially have cover or concealment. When you do so, you can shift a number of squares equal to
  your Agility score. If you end this movement with cover or concealment, you are automatically
  hidden.
features.shadow.burning-ash.name: Burning Ash
features.shadow.burning-ash.description: The ash you leave behind burns your foes. The first time on
  a turn that you use a shadow ability to teleport away from or into a space adjacent to an enemy,
  that enemy takes fire damage equal to your Agility score.
features.shadow.friend.name: Friend!
features.shadow.friend.description: >-
  Your illusions make your enemies believe you are their friend in critical moments. Whenever an
  enemy uses an ability or trait that targets multiple allies and you are within distance of the
  effect, you can choose to be a target of the effect as well.


  Additionally, when you use your I'm No Threat ability, you can take the Disengage move action as
  part of that ability.
features.shadow.trained-assassin.name: Trained Assassin
features.shadow.trained-assassin.description: You know just where to cut your enemies. Whenever you
  make a strike that has no bane or double bane, and that incorporates 1 or more surges, you gain 1
  additional surge that you can use only on that strike.
features.shadow.careful-observation.name: Careful Observation
features.shadow.careful-observation.description: >-
  You have the following ability.


  > ###### Careful Observation

  >

  > *A moment of focus leaves a foe firmly in your sights.*

  >

  > | **Ranged**       |        **Maneuver** |

  > | ---------------- | ------------------: |

  > | **📏 Ranged 20** | **🎯 One creature** |

  >

  > **Effect:** As long as you remain within distance of the target, maintain line of effect to
  them, and strike no other creature first, you gain an edge on the next strike you make against the
  assessed creature, and gain 1 surge you can use only on that strike.
features.shadow.keep-it-down.name: Keep It Down
features.shadow.keep-it-down.description: While conversing with any creature you share a language
  with, you can decide whether anyone else can perceive what you're conveying, even while yelling.
features.shadow.night-watch.name: Night Watch
features.shadow.night-watch.description: >-
  Your sense for stealth shows those around you how to evade notice. While you are hidden, enemies
  take a bane on tests made to search for you or other hidden creatures within 10 squares of you.


  Additionally, you have the following ability.


  > ###### Night Watch

  >

  > *A steely dagger from out of the blue knocks another weapon off course.*

  >

  > | **Ranged, Weapon** |   **Triggered** |

  > | ------------------ | --------------: |

  > | **📏 Ranged 5**    | **🎯 One ally** |

  >

  > **Trigger:** The target takes damage from another creature's ability while you are hidden.

  >

  > **Effect:** The target takes half the damage. You remain hidden.
features.shadow.surge-of-insight.name: Surge of Insight
features.shadow.surge-of-insight.description: The first time each combat round that you deal damage
  incorporating 1 or more surges, you gain 2 insight instead of 1.
features.shadow.harlequin-gambit.name: Harlequin Gambit
features.shadow.harlequin-gambit.description: >-
  Whenever you reduce an adjacent non-minion creature to 0 Stamina, you can immediately use a free
  maneuver to use your I'm No Threat ability and then move up to your speed.


  If the creature is the same size as you, you can disguise yourself as them using I'm No Threat
  without spending insight. If you do, while I'm No Threat is active, the creature's body is
  disguised to look like your body. The illusion ends on their body if another creature physically
  interacts with it. When the illusion would end for either you or the creature's body, it ends for
  both.
features.shadow.trail-of-cinders.name: Trail of Cinders
features.shadow.trail-of-cinders.description: >-
  Whenever you reduce a non-minion creature to 0 Stamina, you can immediately use a free maneuver to
  use your Black Ash Teleport ability.


  Additionally, you can now bring an adjacent willing creature along with you whenever you use a
  shadow ability to teleport. The creature appears in an unoccupied space adjacent to the space into
  which you teleported. If no such space exists, they can't teleport with you.
features.shadow.volatile-reagents.name: Volatile Reagents
features.shadow.volatile-reagents.description: >-
  Whenever you take damage, each enemy adjacent to you takes fire, acid, or poison damage (your
  choice) equal to your Agility score.


  Additionally, your Defensive Roll ability now allows you to shift up to 5 squares, including
  shifting vertically. If you don't end this shift on solid ground and are not flying, you fall.
features.shadow.umbral-form.name: Umbral Form
features.shadow.umbral-form.description: >-
  As a maneuver, you lose control of yourself, becoming a shadow creature dripping with ash. This
  transformation lasts until the end of the encounter, until you are dying, or after 1 uninterrupted
  hour of quiet focus outside of combat. You gain the following effects while in this form:


  - You can automatically climb at full speed while moving.

  - Enemies' spaces don't count as difficult terrain for you. An enemy takes corruption damage equal
  to your Agility score the first time you pass through their space on a turn.

  - If you end your turn with cover or concealment from another creature, you are automatically
  hidden from that creature.

  - You gain 1 surge at the start of each of your turns.

  - You have corruption immunity equal to 5 + your level.

  - Creatures gain an edge on strikes against you.

  - You take a bane on Presence tests made to interact with other creatures.
features.shadow.careful-observation-improvement-7.name: Careful Observation Improvement
features.shadow.careful-observation-improvement-7.description: You can target two creatures
  simultaneously with your Careful Observation ability, observing both simultaneously. Making a
  strike against one target doesn't end your observation of the other target.
features.shadow.keen-insight.name: Keen Insight
features.shadow.keen-insight.description: At the start of each of your turns during combat, you gain 1d3 + 1 insight instead of 1d3.
features.shadow.ventriloquist.name: Ventriloquist
features.shadow.ventriloquist.description: Whenever you communicate, you can throw your voice so
  that it seems to originate from a creature or object within 10 squares. If you are hidden, talking
  this way doesn't cause you to be revealed.
features.shadow.cinder-step.name: Cinder Step
features.shadow.cinder-step.description: Whenever you willingly move, you can teleport. When you
  teleport this way, it counts as using a shadow ability for the purpose of using your Burning Ash
  and Trail of Cinders features.
features.shadow.parkour.name: Parkour
features.shadow.parkour.description: Your movement no longer provokes opportunity attacks.
  Additionally, you can use your Harlequin Gambit feature as a free triggered action when a creature
  is reduced to 0 Stamina by your Clever Trick ability.
features.shadow.time-bomb.name: Time Bomb
features.shadow.time-bomb.description: >-
  You have damage immunity against area abilities and effects equal to your Agility score. You also
  have the following ability, which you can use once per round on your turn.


  > ###### Time Bomb

  >

  > *The longer it cooks, the bigger the boom.*

  >

  > | **Area, Ranged**        |             **Free maneuver** |

  > | ----------------------- | ----------------------------: |

  > | **📏 2 cube within 10** | **🎯 Each enemy in the area** |

  >

  > **Effect:** Each target takes acid, fire, or poison damage (your choice) equal to your Agility
  score.

  >

  > For each combat round that has passed since this ability was last used in the current encounter,
  the area increases by 1 and you gain 1 surge that must be used with this ability. After using the
  ability or at the end of the encounter, its area and surges are reset.

  >

  > **Spend 2+ Insight:** For every 2 insight spent, you increase the cube's size by 1 and gain 1
  surge that can be used only with this ability.
features.shadow.gloom-squad.name: Gloom Squad
features.shadow.gloom-squad.description: >-
  At the start of each of your turns, you can forgo gaining insight to create 1d6 clones of yourself
  in unoccupied adjacent spaces. A clone acts on your turn and uses your statistics, except they
  have 1 Stamina. They are affected by any conditions and effects on you, and last until the start
  of your next turn. A clone doesn't have insight and can't use the Careful Observation ability, the
  Umbral Form feature, or any triggered actions. On their turn, a clone has a move action, a
  maneuver, and a main action that they can use only to make a free strike. While making a free
  strike, a clone must choose targets that you or another clone aren't also striking.


  Outside of combat, you can have one clone active for every 2 Victories you have. If a clone is
  destroyed, you must wait 1 hour before creating another one.
classes.shadow.name: Shadow
classes.shadow.description: >-
  Subtlety is your art, the tip of the blade your brush. You studied at a secret college,
  specializing in alchemy, illusion, or shadow-magics. Your training and knowledge place you among
  the elite ranks of assassins, spies, and commandos. But more potent than any weapon or sorcery is
  your insight into your enemies' weaknesses.


  As a shadow, you possess abilities that deal significant damage, enable you to move swiftly
  across the battlefield and evade hazards, and allow you to fade from notice even in the midst of
  the most intense combat encounters. You also possess more skills than any other hero.


  > "Whenever there is doubt, there is no doubt." — *Motto of the College of Black Ash*
