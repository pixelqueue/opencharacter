subclasses.shadow.black-ash.name: College of Black Ash
subclasses.shadow.black-ash.description: >-
  The College of Black Ash founded the art of being a shadow. Its graduates are unmatched in
  mobility, using sorcery to teleport around the battlefield, manipulate shadows, and summon
  darkness. You have the Magic skill.
subclasses.shadow.black-ash.choices.ability2.prompt: 2nd-level Black Ash ability
subclasses.shadow.black-ash.choices.ability6.prompt: 6th-level Black Ash ability
subclasses.shadow.black-ash.choices.ability9.prompt: 9th-level Black Ash ability
subclasses.shadow.caustic-alchemy.name: College of Caustic Alchemy
subclasses.shadow.caustic-alchemy.description: >-
  The College of Caustic Alchemy teaches its students recipes for the acids, bombs, and poisons
  used in their grim work. Graduates of the college are exceptional assassins. You have the Alchemy
  skill.
subclasses.shadow.caustic-alchemy.choices.ability2.prompt: 2nd-level Caustic Alchemy ability
subclasses.shadow.caustic-alchemy.choices.ability6.prompt: 6th-level Caustic Alchemy ability
subclasses.shadow.caustic-alchemy.choices.ability9.prompt: 9th-level Caustic Alchemy ability
subclasses.shadow.harlequin-mask.name: College of the Harlequin Mask
subclasses.shadow.harlequin-mask.description: >-
  Graduates of the College of the Harlequin Mask learn illusion magic, which they use to infiltrate
  enemy strongholds and create orchestrated chaos in combat. You have the Lie skill.
subclasses.shadow.harlequin-mask.choices.ability2.prompt: 2nd-level Harlequin Mask ability
subclasses.shadow.harlequin-mask.choices.ability6.prompt: 6th-level Harlequin Mask ability
subclasses.shadow.harlequin-mask.choices.ability9.prompt: 9th-level Harlequin Mask ability
