features.fury.chaos-incarnate.name: Chaos Incarnate
features.fury.chaos-incarnate.description: >-
  Your mastery of elemental forces protects and emboldens you. If you are a berserker or reaver, you
  have immunity to acid, cold, corruption, fire, lightning, poison, and sonic damage equal to twice
  your Might score. If you are a stormwight, your damage immunity from your Primordial Storm feature
  (see Stormwight Kits) increases to three times your Might score.


  When any elemental or any other creature whose abilities deal acid, cold, corruption, fire,
  lightning, poison, or sonic damage first becomes aware of you in combat, if they have P < STRONG,
  they are frightened of you (save ends).


  Additionally, when you use Primordial Strike, you can spend up to 3 ferocity, gaining 1 surge per
  ferocity spent to use for that strike.
features.fury.growing-ferocity-improvement.name: Growing Ferocity Improvement
features.fury.growing-ferocity-improvement.description: Your Growing Ferocity feature provides additional benefits when you have 12 or more ferocity.
features.fury.primordial-ferocity.name: Primordial Ferocity
features.fury.primordial-ferocity.description: The first time you take damage each combat round, you gain 3 ferocity instead of 2.
features.fury.primordial-power.name: Primordial Power
features.fury.primordial-power.description: >-
  You have an epic resource called primordial power. Each time you finish a respite, you gain
  primordial power equal to the XP you gain. You can spend primordial power on your abilities as if
  it were ferocity.


  Additionally, you can spend any amount of primordial power as a free maneuver, ending one effect
  on you for each primordial power spent.


  You can also spend 3 primordial power to create a portal to Quintessence without needing a source
  of elemental power.


  Primordial power remains until you spend it.
features.fury.beast-shape.name: Beast Shape
features.fury.beast-shape.description: You can use and gain the benefits of a stormwight kit (see
  Stormwight Kits). Your stormwight kit grants you a number of benefits, including benefits tied to
  your Growing Ferocity feature.
features.fury.ferocity-outside-of-combat.name: Ferocity Outside of Combat
features.fury.ferocity-outside-of-combat.description: >-
  Though you can't gain ferocity outside of combat, you can use your heroic abilities and effects
  that cost ferocity without spending it. Whenever you use an ability or effect outside of combat
  that costs ferocity, you can't use that same ability or effect outside of combat again until you
  earn 1 or more Victories or finish a respite.


  When you use an ability outside of combat that lets you spend unlimited ferocity on its effect,
  such as To the Uttermost End, you can use it as if you had spent an amount of ferocity equal to
  your Victories.
features.fury.ferocity-in-combat.name: Ferocity in Combat
features.fury.ferocity-in-combat.description: >-
  At the start of a combat encounter or some other stressful situation tracked in combat rounds (as
  determined by the Director), you gain ferocity equal to your Victories. At the start of each of
  your turns during combat, you gain 1d3 ferocity.


  Additionally, the first time each combat round that you take damage, you gain 1 ferocity. The
  first time you become winded or are dying in an encounter, you gain 1d3 ferocity.


  You lose any remaining ferocity at the end of the encounter.
features.fury.growing-ferocity.name: Growing Ferocity
features.fury.growing-ferocity.description: |-
  You gain certain benefits in combat based on the amount of ferocity you have (see 1st-Level Aspect Features for details). These benefits last until the end of your turn, even if a benefit would become unavailable to you because of the amount of ferocity you spend during your turn.

  Some Growing Ferocity benefits can be applied only if you are a specific level or higher, with the level of those benefits noted in the various Growing Ferocity tables in this section.

  ###### Berserker Growing Ferocity Table

  | Ferocity        | Benefit                                                                                                                                                                                                                        |
  | --------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | 2               | Whenever you use the Knockback maneuver, the forced movement distance gains a bonus equal to your Might score.                                                                                                                 |
  | 4               | The first time you push a creature on a turn, you gain 1 surge.                                                                                                                                                                |
  | 6               | You gain an edge on Might tests and the Knockback maneuver.                                                                                                                                                                    |
  | 8 (4th level)   | The first time you push a creature on a turn, you gain 2 surges.                                                                                                                                                               |
  | 10 (7th level)  | You have a double edge on Might tests and the Knockback maneuver.                                                                                                                                                              |
  | 12 (10th level) | Whenever you use a heroic ability, you gain 10 temporary Stamina. Additionally, whenever you make a power roll that imposes forced movement on a target, the forced movement distance gains a bonus equal to your Might score. |

  ###### Reaver Growing Ferocity Table

  | Ferocity        | Benefit                                                                                                                                                                                                                          |
  | --------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 2               | Whenever you use the Knockback maneuver, the forced movement distance gains a bonus equal to your Agility score.                                                                                                                 |
  | 4               | The first time you slide a creature on a turn, you gain 1 surge.                                                                                                                                                                 |
  | 6               | You gain an edge on Agility tests and the Knockback maneuver.                                                                                                                                                                    |
  | 8 (4th level)   | The first time you slide a creature on a turn, you gain 2 surges.                                                                                                                                                                |
  | 10 (7th level)  | You have a double edge on Agility tests and the Knockback maneuver.                                                                                                                                                              |
  | 12 (10th level) | Whenever you use a heroic ability, you gain 10 temporary Stamina. Additionally, whenever you make a power roll that imposes forced movement on a target, the forced movement distance gains a bonus equal to your Agility score. |
features.fury.mighty-leaps.name: Mighty Leaps
features.fury.mighty-leaps.description: "You can't obtain lower than a tier 2 outcome on any Might
  test made to jump (see Movement Types in Chapter 10: Combat)."
features.fury.primordial-cunning.name: Primordial Cunning
features.fury.primordial-cunning.description: >-
  You are never surprised. Additionally, whenever you would push a target with forced movement, you
  can slide them instead.


  As your ferocity grows, you gain benefits as noted on the Reaver Growing Ferocity table. Benefits
  are cumulative except where an improved benefit replaces a lesser benefit.
features.fury.primordial-strength.name: Primordial Strength
features.fury.primordial-strength.description: >-
  Whenever you damage an object with a weapon strike, the strike deals extra damage equal to your
  Might score. Additionally, whenever you push another creature into an object, the creature takes
  extra damage equal to your Might score.


  As your ferocity grows, you gain benefits as noted on the Berserker Growing Ferocity table.
  Benefits are cumulative except where an improved benefit replaces a lesser benefit.
features.fury.relentless-hunter.name: Relentless Hunter
features.fury.relentless-hunter.description: You gain an edge on tests made using the Track skill.
features.fury.inescapable-wrath.name: Inescapable Wrath
features.fury.inescapable-wrath.description: You have a bonus to speed equal to your Agility score, and you ignore difficult terrain.
features.fury.tooth-and-claw.name: Tooth and Claw
features.fury.tooth-and-claw.description: At the end of each of your turns, each enemy adjacent to
  you takes damage equal to your Might score.
features.fury.unstoppable-force.name: Unstoppable Force
features.fury.unstoppable-force.description: Whenever you use the Charge main action, you can use a
  strike signature ability or a strike heroic ability instead of a free strike. Additionally, you
  can jump as part of your charge.
features.fury.immovable-object.name: Immovable Object
features.fury.immovable-object.description: >-
  You add your level to your effective size for the purpose of interacting with creatures and
  objects, including determining whether you can lift an object, are affected by forced movement,
  and so forth. This has no effect on whether you can be grabbed.


  Additionally, you have a bonus to stability equal to your Might score.
features.fury.natures-knight.name: Nature's Knight
features.fury.natures-knight.description: >-
  You can speak with animals and elementals. Additionally, you automatically sense the presence of
  animals and elementals within 10 squares of you, even if they are hidden.


  When you are in a negotiation with an animal or elemental, you treat your Renown as 1 higher than
  usual. This stacks with the increase to your effective Renown in a negotiation with an animal of
  your type while in animal form (see Stormwight Kits).
features.fury.see-through-their-tricks.name: See Through Their Tricks
features.fury.see-through-their-tricks.description: You have a double edge on tests made to search
  for hidden creatures, discern hidden motives, or detect lies. You also have a double edge on tests
  made to gamble!
features.fury.damaging-ferocity.name: Damaging Ferocity
features.fury.damaging-ferocity.description: The first time you take damage each combat round, you gain 2 ferocity instead of 1.
features.fury.growing-ferocity-improvement-4.name: Growing Ferocity Improvement
features.fury.growing-ferocity-improvement-4.description: Your Growing Ferocity feature provides additional benefits when you have 8 or more ferocity.
features.fury.primordial-attunement.name: Primordial Attunement
features.fury.primordial-attunement.description: As your ferocity manifests elemental forces created
  by the Primordial Chaos, you are aware of how elemental power interacts with those around you. You
  automatically sense whether any creature within 10 squares has damage immunity or damage weakness
  to acid, cold, corruption, fire, lightning, poison, or sonic damage, learning whether they have
  immunity or weakness, the value of that immunity or weakness, and the specific damage type.
  Additionally, you automatically sense any source of one of those damage types within 10 squares,
  such as a fire or a source of elemental power.
features.fury.primordial-strike.name: Primordial Strike
features.fury.primordial-strike.description: You can manifest your ferocity directly as an elemental
  force created by the Primordial Chaos. As part of any strike, you can spend 1 ferocity to gain 1
  surge that must be used for that strike. The extra damage dealt by the surge can be acid, cold,
  corruption, fire, lightning, poison, or sonic (your choice).
features.fury.bounder.name: Bounder
features.fury.bounder.description: 'Your jump distance and height double (see Movement Types in
  Chapter 10: Combat). Additionally, when you fall, you reduce the effective height of your fall by
  a number of squares equal to your jump distance for the purpose of determining damage and whether
  you land prone (see Falling in Chapter 10). You are not prone after falling and landing on another
  creature.'
features.fury.stormborn.name: Stormborn
features.fury.stormborn.description: You and each ally within 5 squares of you ignore negative
  effects from inclement weather, such as banes or environmental damage. Additionally, you can use
  the Blessing of Fortunate Weather feature as if you were a 1st-level conduit (see 1st-Level Domain
  Feature in the Conduit section).
features.fury.unfettered.name: Unfettered
features.fury.unfettered.description: At the start of your turn, you can end any restrained
  condition on you. Additionally, you have a double edge on tests made to escape being confined or
  imprisoned.
features.fury.marauder-of-the-primordial-chaos.name: Marauder of the Primordial Chaos
features.fury.marauder-of-the-primordial-chaos.description: >-
  As your connection to the power of the Primordial Chaos grows ever stronger, you automatically
  sense any elemental creatures or magic sources of elemental power, such as a lava pool or a lake
  overlapping with Quintessence, within 1 mile of you.


  Additionally, you can speak with elemental creatures, and when you are in a negotiation with an
  elemental, you treat your Renown as 1 higher than usual. This stacks with the increase to your
  effective Renown provided by the Nature's Knight aspect feature (see 3rd-Level Features). When any
  elemental first becomes aware of you in combat, if they have P < AVERAGE, they are frightened of
  you (save ends).
features.fury.primordial-portal.name: Primordial Portal
features.fury.primordial-portal.description: >-
  As a main action, you can touch a magic source of elemental power and use it to create a portal to
  Quintessence. You can then use a main action to teleport yourself and any willing creatures within
  10 squares of you through the portal and onto a safe island in Quintessence, or to teleport back
  again. You can maintain a number of portals equal to your Might score, each leading to the same
  safe island in Quintessence. If a portal in your network is destroyed, it is no longer part of the
  network. You can remove a portal from your network no matter your distance from it, including
  across different worlds (no action required).


  (Exploring Quintessence is possible from your island, but continued safety is not guaranteed.)
features.fury.elemental-form.name: Elemental Form
features.fury.elemental-form.description: >-
  You exhibit ever-stronger signs of how the force of the Primordial Chaos flows within you.
  Whenever you show strong emotion or increase your ferocity, elemental motes attuned to your mood
  flit around you, and your skin changes in appearance to reflect an element of your choice.


  Additionally, if you are a berserker or reaver, you have immunity to acid, cold, corruption, fire,
  lightning, poison, and sonic damage equal to your Might score. If you are a stormwight, you have
  immunity to the damage type of your Primordial Storm feature equal to twice your Might score.
features.fury.greater-ferocity.name: Greater Ferocity
features.fury.greater-ferocity.description: When you gain ferocity at the start of each of your
  turns during combat, you gain 1d3 + 1 ferocity instead of 1d3.
features.fury.growing-ferocity-improvement-7.name: Growing Ferocity Improvement
features.fury.growing-ferocity-improvement-7.description: Your Growing Ferocity feature provides additional benefits when you have 10 or more ferocity.
features.fury.a-step-ahead.name: A Step Ahead
features.fury.a-step-ahead.description: You move with legendary grace. Whenever you make an Agility
  test, you can roll three dice and choose which two to use. Additionally, whenever you use the
  Disengage move action, the distance you can shift gains a bonus equal to your Agility score.
features.fury.menagerie.name: Menagerie
features.fury.menagerie.description: You can use all stormwight kits. During a respite, you can
  choose to swap your stormwight kit and still take another respite activity. Your Nature's Knight
  feature now lets you automatically sense the presence of animals within 1 mile of you.
  Additionally, whenever you make a test to track another creature, you can roll three dice and
  choose which two to use.
features.fury.strongest-there-is.name: Strongest There Is
features.fury.strongest-there-is.description: Your strength is unmatched. Whenever you make a Might
  test, you can roll three dice and choose which two to use. Additionally, whenever you use the
  Knockback maneuver, the forced movement distance gains a bonus equal to your Might score.
features.fury.harbinger-of-the-primordial-chaos.name: Harbinger of the Primordial Chaos
features.fury.harbinger-of-the-primordial-chaos.description: You can create a temporary source of
  elemental power as a respite activity. This source of elemental power lasts 24 hours after
  creation, and can be used to create a portal to Quintessence with your Primordial Portal feature.
  If you do so, the source of elemental power lasts as long as the portal is maintained in your
  network.
subclasses.fury.berserker.name: Berserker
subclasses.fury.reaver.name: Reaver
subclasses.fury.stormwight.name: Stormwight
classes.fury.name: Fury
classes.fury.description: >-
  You do not temper the heat of battle within you. You unleash it! Your experience in the wild
  taught you the secrets of predators, and now, like the raptor, the panther, the wolf, you channel
  unfettered anger into martial prowess. Primordial Chaos is your ally. Let others use finesse to
  clean up the wreckage left in your wake.


  **As a fury, you devastate foes with overwhelming might, hurl yourself and enemies around the
  battlefield, and grow stronger as your ferocity increases. Nature has no concept of fairness—and
  neither do you.**


  > "DEATH!"

  >

  > **Khorva**
classes.fury.choices.aspect.prompt: Primordial aspect
kits.stormwight.boren.name: Boren
kits.stormwight.boren.followUps.hybrid-stamina.name: Hybrid form's temporary Stamina
kits.stormwight.boren.description: |-
  With this stormwight kit, you channel your primordial ferocity into the form of a bear, becoming large, durable, and imposing. Boren are tied to the craggy, rocky north, and this aspect is associated with the blizzard's bitter cold.

  #### Aspect Benefits

  Whenever you use forced movement to push a creature, you can pull that creature instead. Whenever you pull a creature adjacent to you and that creature has M < AVERAGE, you can use a free triggered action to make that creature grabbed by you.

  #### Animal Form: Bear

  While you are in your bear form, your size is 2 and you gain a +1 bonus to distance with melee weapon abilities.

  #### Hybrid Form: Bear

  While you are in your hybrid form, your size is 2 and you gain a +1 bonus to distance with melee weapon abilities. At 4th level, the first time you take hybrid form in an encounter, you gain 10 temporary Stamina.

  #### Primordial Storm: Blizzard

  Your primordial damage type is cold.

  #### Kit Bonuses

  - **Stamina Bonus:** +9 per echelon
  - **Stability Bonus:** +2
  - **Melee Damage Bonus:** +0/+0/+4

  #### Growing Ferocity

  As your ferocity grows, you gain benefits as noted on the Boren Growing Ferocity table. Benefits are cumulative except where an improved benefit replaces a lesser benefit.

  ##### Boren Growing Ferocity Table

  | Ferocity        | Benefit                                                                                                                                                                                                                   |
  | --------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 2               | You can have up to two creatures grabbed at a time. Additionally, whenever you make a strike against a creature you have grabbed, you gain 1 surge.                                                                       |
  | 4               | The first time you grab a creature on a turn, you gain 1 surge.                                                                                                                                                           |
  | 6               | You gain an edge on the Grab and Knockback maneuvers.                                                                                                                                                                     |
  | 8 (4th level)   | The first time you grab a creature on a turn, you gain 2 surges instead of 1.                                                                                                                                             |
  | 10 (7th level)  | You have a double edge on the Grab and Knockback maneuvers.                                                                                                                                                               |
  | 12 (10th level) | Whenever you use a heroic ability, you gain 10 temporary Stamina. Additionally, whenever you have a creature grabbed, any ability roll made against that creature gains a bonus to its potency equal to your Might score. |
kits.stormwight.corven.name: Corven
kits.stormwight.corven.description: |-
  With this stormwight kit, you channel your primordial ferocity into the form of a crow, becoming stealthy and quick. Corven are tied to the mountain passes and the hot winds that flow through them. This aspect is associated with the warm and fast-rising anabatic wind.

  #### Aspect Benefits

  You gain an edge on tests made to hide and sneak. Additionally, whenever you fall, you can use a free triggered action to use your Aspect of the Wild ability.

  #### Animal Form: Crow

  While you are in your crow form, your size is 1T and you can fly. You can use the Hide maneuver as a free maneuver, and you can use your allies as cover when you hide. You can't use any abilities while in this form except for Aspect of the Wild.

  #### Hybrid Form: Crow

  While you are in your hybrid form, your size is your choice of 1S or 1M. At 4th level, you can fly.

  #### Primordial Storm: Anabatic Wind

  Your primordial damage type is fire.

  #### Kit Bonuses

  - **Stamina Bonus:** +3 per echelon
  - **Speed Bonus:** +3
  - **Melee Damage Bonus:** +2/+2/+2
  - **Disengage Bonus:** +1

  #### Growing Ferocity

  As your ferocity grows, you gain benefits as noted on the Corven Growing Ferocity table. Benefits are cumulative except where an improved benefit replaces a lesser benefit.

  ##### Corven Growing Ferocity Table

  | Ferocity        | Benefit                                                                                                                                           |
  | --------------- | ------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 2               | Whenever you use the Disengage move action, the distance you can shift gains a bonus equal to your Agility score.                                 |
  | 4               | The first time you shift on a turn, you gain 1 surge.                                                                                             |
  | 6               | You gain an edge on Agility tests, the Escape Grab maneuver, and the Knockback maneuver.                                                          |
  | 8 (4th level)   | The first time you shift on a turn, you gain 2 surges instead of 1.                                                                               |
  | 10 (7th level)  | You have a double edge on Agility tests, the Escape Grab maneuver, and the Knockback maneuver.                                                    |
  | 12 (10th level) | Whenever you use a heroic ability, you gain 10 temporary Stamina. Additionally, the potency of any effects targeting you is reduced by 2 for you. |
kits.stormwight.raden.name: Raden
kits.stormwight.raden.description: |-
  With this stormwight kit, you channel your primordial ferocity into the form of a rat, becoming mobile and elusive. Raden are associated with the wild nature of the rat, before cities became their habitat. This aspect is associated with the rat flood—a surge of corrupted water that draws forth hordes of rats.

  #### Aspect Benefits

  You gain an edge on tests made to hide and sneak. Additionally, you ignore difficult terrain.

  #### Animal Form: Rat

  While you are in your rat form, your size is 1T and you can automatically climb at full speed while moving. You can use the Hide maneuver as a free maneuver, you can use your allies as cover when you hide, and you can stay hidden while you move through squares occupied by any creature. Additionally, you gain an edge on tests made to climb other creatures. You can't use any abilities while in this form except for Aspect of the Wild.

  #### Hybrid Form: Rat

  While you are in your hybrid form, your size is your choice of 1S or 1M. At 4th level, you can automatically climb at full speed while moving.

  #### Primordial Storm: Rat Flood

  Your primordial damage type is corruption.

  #### Kit Bonuses

  - **Stamina Bonus:** +3 per echelon
  - **Speed Bonus:** +3
  - **Melee Damage Bonus:** +2/+2/+2
  - **Disengage Bonus:** +1

  #### Growing Ferocity

  As your ferocity grows, you gain benefits as noted on the Raden Growing Ferocity table. Benefits are cumulative except where an improved benefit replaces a lesser benefit.

  ##### Raden Growing Ferocity Table

  | Ferocity        | Benefit                                                                                                                                           |
  | --------------- | ------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 2               | Whenever you use the Disengage move action, the distance you can shift gains a bonus equal to your Agility score.                                 |
  | 4               | The first time you shift on a turn, you gain 1 surge.                                                                                             |
  | 6               | You gain an edge on Agility tests, the Escape Grab maneuver, and the Knockback maneuver.                                                          |
  | 8 (4th level)   | The first time you shift on a turn, you gain 2 surges instead of 1.                                                                               |
  | 10 (7th level)  | You have a double edge on Agility tests, the Escape Grab maneuver, and the Knockback maneuver                                                     |
  | 12 (10th level) | Whenever you use a heroic ability, you gain 10 temporary Stamina. Additionally, the potency of any effects targeting you is reduced by 2 for you. |
kits.stormwight.vuken.name: Vuken
kits.stormwight.vuken.followUps.hybrid-stamina.name: Hybrid form's temporary Stamina
kits.stormwight.vuken.description: |-
  With this stormwight kit, you channel your primordial ferocity into the form of a wolf, becoming a fleet-footed hunter. Vuken are tied to forests and open steppes, and this aspect is associated with the thunderstorm.

  #### Aspect Benefits

  Whenever you use the Knockback maneuver, you can then use the Aid Attack maneuver as a free triggered action.

  #### Animal Form: Wolf

  While you are in your wolf form, your size is 1L, you have a +2 bonus to speed, and you ignore difficult terrain.

  #### Hybrid Form: Wolf

  While you are in your hybrid form, your size is 1L, you have a +2 bonus to speed, and you ignore difficult terrain. At 4th level, the first time you take hybrid form in an encounter, you gain 10 temporary Stamina.

  #### Primordial Storm: Lightning Storm

  Your primordial damage type is lightning.

  #### Kit Bonuses

  - **Stamina Bonus:** +9 per echelon
  - **Speed Bonus:** +2
  - **Melee Damage Bonus:** +2/+2/+2
  - **Disengage Bonus:** +1

  #### Growing Ferocity

  As your ferocity grows, you gain benefits as noted on the Vuken Growing Ferocity table. Benefits are cumulative except where an improved benefit replaces a lesser benefit.

  ##### Vuken Growing Ferocity Table

  | Ferocity        | Benefit                                                                                                                                                                                                                          |
  | --------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 2               | Whenever you use the Knockback maneuver, you can target one additional creature.                                                                                                                                                 |
  | 4               | The first time on a turn that you push a creature or knock a creature prone, you gain 1 surge.                                                                                                                                   |
  | 6               | You gain an edge on Agility tests and the Knockback maneuver.                                                                                                                                                                    |
  | 8 (4th level)   | The first time on a turn that you push a creature or knock a creature prone, you gain 2 surges.                                                                                                                                  |
  | 10 (7th level)  | You have a double edge on Agility tests and the Knockback maneuver.                                                                                                                                                              |
  | 12 (10th level) | Whenever you use a heroic ability, you gain 10 temporary Stamina. Additionally, whenever you make a power roll that imposes forced movement on a target, the forced movement distance gains a bonus equal to your Agility score. |
