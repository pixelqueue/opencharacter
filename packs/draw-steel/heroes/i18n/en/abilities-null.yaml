  on themself, and gains 5 temporary Stamina for each condition or effect removed.'
abilities.null.phase-leap.name: Phase Leap
abilities.null.phase-leap.description: '*You leap beyond reality, leaving an afterimage of yourself.*'
abilities.null.phase-leap.texts.target: Self
abilities.null.phase-leap.texts.distance: Self
abilities.null.phase-leap.texts.effect: "Effect: You jump up to your speed without provoking
  opportunity attacks. Until the end of your next turn, a static afterimage of you remains in the
  space you left, and any enemy adjacent to your afterimage takes a bane on ability rolls. You can
  use your abilities from your own space or from the space of your afterimage as if you were still
  there. Additionally, if your Null Field ability is active, your afterimage also projects the aura
  from that ability, which you control as if you were in the afterimage's space."
abilities.null.anticipating-strike.name: Anticipating Strike
abilities.null.anticipating-strike.description: '*You suddenly strike an enemy, then grab them in a psionically enhanced grip.*'
abilities.null.anticipating-strike.texts.trigger: The target moves or uses a main action.
abilities.null.anticipating-strike.texts.target: One creature
abilities.null.anticipating-strike.texts.distance: Melee 1
abilities.null.anticipating-strike.texts.roll: Power Roll + Agility
abilities.null.anticipating-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + A}} damage; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.null.anticipating-strike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + A}} damage; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.null.anticipating-strike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + A}} damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.null.anticipating-strike.texts.effect: 'Effect: This strike resolves before the triggering movement or main action.'
abilities.null.iron-grip.name: Iron Grip
abilities.null.iron-grip.description: '*You grab the target with supernatural force.*'
abilities.null.iron-grip.texts.target: One creature
abilities.null.iron-grip.texts.distance: Melee 1
abilities.null.iron-grip.texts.roll: Power Roll + Agility
abilities.null.iron-grip.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + A}} damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, grabbed'
abilities.null.iron-grip.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14 + A}} damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, grabbed'
abilities.null.iron-grip.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {18 + A}} damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, grabbed'
abilities.null.iron-grip.texts.effect: 'Effect: While grabbed this way, the target takes a bane on
  the Escape Grab maneuver. Each time they use that maneuver, they take damage equal to twice your
  Agility score.'
abilities.null.force-redirected.name: Force Redirected
abilities.null.force-redirected.description: '*The force of your strike moves your target in a surprising direction.*'
abilities.null.force-redirected.texts.target: One creature
abilities.null.force-redirected.texts.distance: Melee 3
abilities.null.force-redirected.texts.roll: Power Roll + Agility
abilities.null.force-redirected.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + A}} damage; slide 1'
abilities.null.force-redirected.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {12 + A}} damage; slide 3'
abilities.null.force-redirected.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {16 + A}} damage; slide 5'
abilities.null.entropic-field.name: Entropic Field
abilities.null.entropic-field.description: '*You drastically increase the local entropy.*'
abilities.null.entropic-field.texts.target: Each enemy in the area
abilities.null.entropic-field.texts.distance: 3 cube within 1
abilities.null.entropic-field.texts.roll: Power Roll + Agility
abilities.null.entropic-field.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6}} cold damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.null.entropic-field.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} cold damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, slowed (save ends)'
abilities.null.entropic-field.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13}} cold damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, slowed (save ends)'
abilities.null.kinetic-shield.name: Kinetic Shield
abilities.null.kinetic-shield.description: '*You manifest a force barrier that absorbs incoming kinetic energy.*'
abilities.null.kinetic-shield.texts.target: Self
abilities.null.kinetic-shield.texts.distance: Self
abilities.null.kinetic-shield.texts.roll: Power Roll + Intuition
abilities.null.kinetic-shield.texts.tier1: You gain 10 temporary Stamina.
abilities.null.kinetic-shield.texts.tier2: You gain 15 temporary Stamina.
abilities.null.kinetic-shield.texts.tier3: You gain 20 temporary Stamina.
abilities.null.kinetic-shield.texts.effect: "Effect: While you have temporary Stamina from this
  ability, you can't be made bleeding even while dying."
abilities.null.heat-sink.name: Heat Sink
abilities.null.heat-sink.description: '*You absorb ambient heat, coating the ground in frost and precipitating snow from the air.*'
abilities.null.heat-sink.texts.target: Self
abilities.null.heat-sink.texts.distance: Self
abilities.null.heat-sink.texts.effect: 'Effect: Until the start of your next turn, the size of your
  Null Field ability increases by 1, and you and any ally benefit from concealment while in the
  area. At the end of this turn, each enemy in the area takes cold damage equal to your Intuition
  score.'
abilities.null.blur.name: Blur
abilities.null.blur.description: '*You release stored time, allowing you to act twice.*'
abilities.null.blur.texts.target: Self
abilities.null.blur.texts.distance: Self
abilities.null.blur.texts.effect: "Effect: You can use a signature or heroic ability. You gain an
  edge on that ability's power rolls."
abilities.null.gravitic-strike.name: Gravitic Strike
abilities.null.gravitic-strike.description: '*Your fist emanates gravitic force that pulls a distant enemy closer.*'
abilities.null.gravitic-strike.texts.target: One creature
abilities.null.gravitic-strike.texts.distance: Melee 3
abilities.null.gravitic-strike.texts.roll: Power Roll + Agility
abilities.null.gravitic-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + A}} psychic damage; vertical pull 3'
abilities.null.gravitic-strike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {12 + A}} psychic damage; vertical pull 5'
abilities.null.gravitic-strike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {16 + A}} psychic damage; vertical pull 7'
abilities.null.stabilizing-field.name: Stabilizing Field
abilities.null.stabilizing-field.description: '*You project order, making it harder for your enemies to interfere with you and your allies.*'
abilities.null.stabilizing-field.texts.target: Self
abilities.null.stabilizing-field.texts.distance: Self
abilities.null.stabilizing-field.texts.effect: 'Effect: Until the end of the encounter, the size of
  your Null Field ability increases by 1. While the area of that ability is enlarged this way, you
  ignore difficult terrain and reduce the potency of enemy effects targeting you by 1 for you. You
  can also use a free triggered action at the start of each of your turns to end one effect on you
  that is ended by a saving throw or that ends at the end of your turn. Each ally in the area also
  gains these benefits.'
abilities.null.molecular-rearrangement-field.name: Molecular Rearrangement Field
abilities.null.molecular-rearrangement-field.description: "*Your enemies' wounds open, your allies' wounds close.*"
abilities.null.molecular-rearrangement-field.texts.target: Self
abilities.null.molecular-rearrangement-field.texts.distance: Self
abilities.null.molecular-rearrangement-field.texts.effect: 'Effect: Until the end of the encounter,
  the size of your Null Field ability increases by 1. While the area of that ability is enlarged
  this way, each enemy who has I < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}} and enters the area for the first time in a combat round
  or starts their turn there is bleeding (save ends). Each ally who enters the area for the first
  time in a combat round or starts their turn there gains temporary Stamina equal to your Intuition
  score.'
abilities.null.absorption-field.name: Absorption Field
abilities.null.absorption-field.description: '*Your null field absorbs kinetic energy.*'
abilities.null.absorption-field.texts.target: Self
abilities.null.absorption-field.texts.distance: Self
abilities.null.absorption-field.texts.effect: 'Effect: Until the end of the encounter, the size of
  your Null Field ability increases by 1. While the area of that ability is enlarged this way, each
  enemy in the area takes a bane on ability rolls.'
abilities.null.synapse-field.name: Synapse Field
abilities.null.synapse-field.description: "*Attacks made by allies in your null field disrupt your enemies' thoughts, causing psychic pain.*"
abilities.null.synapse-field.texts.target: Self
abilities.null.synapse-field.texts.distance: Self
abilities.null.synapse-field.texts.effect: 'Effect: Until the end of the encounter, the size of your
  Null Field ability increases by 1. While the area of that ability is enlarged this way, whenever
  an enemy in the area takes rolled damage, they take extra psychic damage equal to twice your
  Intuition score.'
abilities.null.inertial-absorption.name: Inertial Absorption
abilities.null.inertial-absorption.description: '*You absorb an attack to empower your body.*'
abilities.null.inertial-absorption.texts.trigger: Another creature damages you using an ability.
abilities.null.inertial-absorption.texts.target: Self
abilities.null.inertial-absorption.texts.distance: Self
abilities.null.inertial-absorption.texts.effect: 'Effect: You take half the damage, negate any
  effects associated with the damage for you, and gain 3 surges.'
abilities.null.heat-drain.name: Heat Drain
abilities.null.heat-drain.description: '*You drain all the heat from the target.*'
abilities.null.heat-drain.texts.target: One creature
abilities.null.heat-drain.texts.distance: Melee 1
abilities.null.heat-drain.texts.roll: Power Roll + Intuition
abilities.null.heat-drain.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + I}} cold damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.null.heat-drain.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {11 + I}} cold damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.null.heat-drain.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {15 + I}} cold damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.null.heat-drain.texts.effect: 'Effect: While restrained this way, the target takes cold
  damage equal to your Intuition score at the start of each of your turns. Additionally, whenever
  the target damages another creature while restrained this way, any potency associated with the
  damage is reduced by 2.'
abilities.null.realitas.name: Realitas
abilities.null.realitas.description: "*Your essential hyperreality disrupts your enemy's connection to existence.*"
abilities.null.realitas.texts.target: One creature
abilities.null.realitas.texts.distance: Melee 1
abilities.null.realitas.texts.roll: Power Roll + Agility
abilities.null.realitas.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + A}} psychic damage; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, dazed'
abilities.null.realitas.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + A}} psychic damage; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed'
abilities.null.realitas.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + A}} psychic damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed'
abilities.null.realitas.texts.effect: "Effect: While dazed this way, the target takes psychic damage
  equal to twice your Intuition score at the start of each of your turns. If this ability causes a
  creature who is not a leader or solo creature to become winded, they are instead reduced to 0
  Stamina. Any creature reduced to 0 Stamina by this ability is forgotten by all creatures of your
  level or lower in the timescape who are not present in the encounter. Loved ones of the forgotten
  creature retain a faint sense of melancholy. This effect can be reversed only at the Director's
  discretion."
abilities.null.time-loop.name: Time Loop
abilities.null.time-loop.description: '*You show shadows what true speed is.*'
abilities.null.time-loop.texts.trigger: Another creature on the encounter map ends their turn.
abilities.null.time-loop.texts.target: Self
abilities.null.time-loop.texts.distance: Self
abilities.null.time-loop.texts.effect: 'Effect: You take a bonus turn immediately after the
  triggering creature. This ability can be used only once per combat round.'
abilities.null.arrestor-cycle.name: Arrestor Cycle
abilities.null.arrestor-cycle.description: '*You trap your foe in a looping cycle of time, where
  they relive the last few seconds over and over again.*'
abilities.null.arrestor-cycle.texts.trigger: The triggering creature starts their turn.
abilities.null.arrestor-cycle.texts.target: One creature
abilities.null.arrestor-cycle.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.null.arrestor-cycle.texts.roll: Power Roll + Intuition
abilities.null.arrestor-cycle.texts.tier1: I < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, the target loses their turn
abilities.null.arrestor-cycle.texts.tier2: I < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target loses their turn
abilities.null.arrestor-cycle.texts.tier3: I < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, the target loses their turn
abilities.null.arrestor-cycle.texts.effect: "Effect: If the target loses their turn, the round
  continues as if they had acted. A target who doesn't lose their turn takes psychic damage equal to
  twice your Intuition score for each main action they take until the end of their next turn."
abilities.null.absolute-zero.name: Absolute Zero
abilities.null.absolute-zero.description: '*You become the coldest thing in the timescape.*'
abilities.null.absolute-zero.texts.target: Self
abilities.null.absolute-zero.texts.distance: Self
abilities.null.absolute-zero.texts.roll: Power Roll + Intuition
abilities.null.absolute-zero.texts.tier1: You gain 20 temporary Stamina.
abilities.null.absolute-zero.texts.tier2: You gain 30 temporary Stamina.
abilities.null.absolute-zero.texts.tier3: You gain 40 temporary Stamina.
abilities.null.absolute-zero.texts.effect: 'Effect: Until the end of the encounter or until you are
  dead, you become an avatar of uttermost cold. You gain immunity to all damage equal to the cold
  damage immunity granted by your Entropic Adaptability trait, you ignore the negative effects of
  dying, and you have a +2 bonus to potencies.'
