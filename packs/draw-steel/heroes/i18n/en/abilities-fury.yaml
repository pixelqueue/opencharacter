abilities.fury.phalanx-breaker.name: Phalanx-Breaker
abilities.fury.phalanx-breaker.description: '*Organizing your forces like feckless creatures of Law. Pitiful.*'
abilities.fury.phalanx-breaker.texts.target: Self
abilities.fury.phalanx-breaker.texts.distance: Self; see below
abilities.fury.phalanx-breaker.texts.roll: Power Roll + Might
