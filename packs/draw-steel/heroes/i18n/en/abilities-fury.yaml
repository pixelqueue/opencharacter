abilities.fury.demon-unleashed.texts.distance: Self
abilities.fury.demon-unleashed.texts.effect: 'Effect: Until the end of the encounter or until you
  are dying, each enemy who starts their turn adjacent to you and has P < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}} is frightened until
  the end of their turn.'
