abilities.fury.thunder-roar.name: Thunder Roar
abilities.fury.thunder-roar.description: '*You unleash a howl that hurls your enemies back.*'
abilities.fury.thunder-roar.texts.target: Each enemy in the area
abilities.fury.thunder-roar.texts.distance: 5 x 1 line within 1
abilities.fury.thunder-roar.texts.roll: Power Roll + Might
abilities.fury.thunder-roar.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6}} damage; push 2'
abilities.fury.thunder-roar.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} damage; push 4'
abilities.fury.thunder-roar.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13}} damage; push 6'
abilities.fury.thunder-roar.texts.effect: 'Effect: The targets are force moved one at a time,
  starting with the target nearest to you, and can be pushed into other targets in the same line.'
abilities.fury.hit-and-run.name: Hit and Run
abilities.fury.hit-and-run.description: '*Staying in constant motion helps you slip out of reach after a brutal assault.*'
abilities.fury.hit-and-run.texts.target: One creature or object
abilities.fury.hit-and-run.texts.distance: Melee 1
abilities.fury.hit-and-run.texts.roll: Power Roll + Might
abilities.fury.hit-and-run.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + M}} damage'
abilities.fury.hit-and-run.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + M}} damage'
abilities.fury.hit-and-run.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7 + M}} damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, slowed (save ends)'
abilities.fury.hit-and-run.texts.effect: 'Effect: You can shift 1 square.'
abilities.fury.unearthly-reflexes.name: Unearthly Reflexes
abilities.fury.unearthly-reflexes.description: '*You are as elusive as a hummingbird.*'
abilities.fury.unearthly-reflexes.texts.trigger: You take damage.
abilities.fury.unearthly-reflexes.texts.target: Self
abilities.fury.unearthly-reflexes.texts.distance: Self
abilities.fury.unearthly-reflexes.texts.effect: >-
  Effect: You take half the damage from the triggering effect and can shift up to a number of
  squares equal to your Agility score.


  Spend 1 Ferocity: If the damage has any potency effects associated with it, the potency is reduced
  by 1 for you.
abilities.fury.make-peace-with-your-god.name: Make Peace With Your God!
abilities.fury.make-peace-with-your-god.description: '*Anger is your energy.*'
abilities.fury.make-peace-with-your-god.texts.target: Self
abilities.fury.make-peace-with-your-god.texts.distance: Self
abilities.fury.make-peace-with-your-god.texts.effect: 'Effect: You gain 1 surge, and the next
  ability roll you make this turn automatically obtains a tier 3 outcome.'
abilities.fury.blood-for-blood.name: Blood for Blood!
abilities.fury.blood-for-blood.description: "*See how well they fight after you've bled them dry.*"
abilities.fury.blood-for-blood.texts.target: One creature or object
abilities.fury.blood-for-blood.texts.distance: Melee 1
abilities.fury.blood-for-blood.texts.roll: Power Roll + Might
abilities.fury.blood-for-blood.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + M}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, bleeding and weakened (save ends)'
abilities.fury.blood-for-blood.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + M}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, bleeding and weakened (save ends)'
abilities.fury.blood-for-blood.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10 + M}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, bleeding and weakened (save ends)'
abilities.fury.blood-for-blood.texts.effect: 'Effect: You can deal 1d6 damage to yourself to deal an extra 1d6 damage to the target.'
abilities.fury.to-the-death.name: To the Death!
abilities.fury.to-the-death.description: '*Your reckless assault leaves you tactically vulnerable.*'
abilities.fury.to-the-death.texts.target: One creature or object
abilities.fury.to-the-death.texts.distance: Melee 1
abilities.fury.to-the-death.texts.roll: Power Roll + Might
abilities.fury.to-the-death.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + M}} damage'
abilities.fury.to-the-death.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + M}} damage'
abilities.fury.to-the-death.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + M}} damage'
abilities.fury.to-the-death.texts.effect: 'Effect: You gain 2 surges, and the target can make an
  opportunity attack against you as a free triggered action.'
abilities.fury.tide-of-death.name: Tide of Death
abilities.fury.tide-of-death.description: '*Teach them the folly of lining up for you.*'
abilities.fury.tide-of-death.texts.target: Self
abilities.fury.tide-of-death.texts.distance: Self; see below
abilities.fury.tide-of-death.texts.roll: Power Roll + Might
abilities.fury.tide-of-death.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} damage'
abilities.fury.tide-of-death.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3}} damage'
abilities.fury.tide-of-death.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {5}} damage'
abilities.fury.tide-of-death.texts.effect: >-
  Effect: You move up to your speed in a straight line, and enemy squares are not difficult terrain
  for this movement. You can end this movement in a creature's space and move them to an adjacent
  unoccupied space. You make one power roll that targets each enemy whose space you move through.


  Effect: The last target you damage takes extra damage equal to your Might score for each
  opportunity attack you trigger during your move.
abilities.fury.out-of-the-way.name: Out of the Way!
abilities.fury.out-of-the-way.description: '*Your enemies will clear your path—whether they want to or not.*'
abilities.fury.out-of-the-way.texts.target: One creature
abilities.fury.out-of-the-way.texts.distance: Melee 1
abilities.fury.out-of-the-way.texts.roll: Power Roll + Might
abilities.fury.out-of-the-way.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + M}} damage; slide 2'
abilities.fury.out-of-the-way.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + M}} damage; slide 3'
abilities.fury.out-of-the-way.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + M}} damage; slide 5'
abilities.fury.out-of-the-way.texts.effect: 'Effect: When you slide the target, you can move into
  any square they leave. If you take damage from an opportunity attack by moving this way, the
  target takes the same damage.'
abilities.fury.brutal-slam.name: Brutal Slam
abilities.fury.brutal-slam.description: '*The heavy impact of your weapon attacks drives your foes ever back.*'
abilities.fury.brutal-slam.texts.target: One creature or object
abilities.fury.brutal-slam.texts.distance: Melee 1
abilities.fury.brutal-slam.texts.roll: Power Roll + Might
abilities.fury.brutal-slam.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + M}} damage; push 1'
abilities.fury.brutal-slam.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + M}} damage; push 2'
abilities.fury.brutal-slam.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + M}} damage; push 4'
abilities.fury.back.name: Back!
abilities.fury.back.description: '*You hew about you with your mighty weapon, hurling enemies backward.*'
abilities.fury.back.texts.target: Each enemy in the area
abilities.fury.back.texts.distance: 1 burst
abilities.fury.back.texts.roll: Power Roll + Might
abilities.fury.back.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5}} damage'
abilities.fury.back.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {8}} damage; push 1'
abilities.fury.back.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11}} damage; push 3'
abilities.fury.impaled.name: Impaled!
abilities.fury.impaled.description: '*You skewer your enemy like a boar upon a spit.*'
abilities.fury.impaled.texts.target: One creature of your size or smaller
abilities.fury.impaled.texts.distance: Melee 1
abilities.fury.impaled.texts.roll: Power Roll + Might
abilities.fury.impaled.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + M}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, grabbed'
abilities.fury.impaled.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + M}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, grabbed'
abilities.fury.impaled.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7 + M}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, grabbed'
abilities.fury.your-entrails-are-your-extrails.name: Your Entrails Are Your Extrails!
abilities.fury.your-entrails-are-your-extrails.description: "*Hard for them to fight when they're busy holding in their giblets.*"
abilities.fury.your-entrails-are-your-extrails.texts.target: One creature or object
abilities.fury.your-entrails-are-your-extrails.texts.distance: Melee 1
abilities.fury.your-entrails-are-your-extrails.texts.roll: Power Roll + Might
abilities.fury.your-entrails-are-your-extrails.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + M}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, bleeding (save ends)'
abilities.fury.your-entrails-are-your-extrails.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + M}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, bleeding (save ends)'
abilities.fury.your-entrails-are-your-extrails.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + M}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, bleeding (save ends)'
abilities.fury.your-entrails-are-your-extrails.texts.effect: 'Effect: While bleeding this way, the
  target takes damage equal to your Might score at the end of each of your turns.'
abilities.fury.to-the-uttermost-end.name: To the Uttermost End
abilities.fury.to-the-uttermost-end.description: "*You gut your life force to ensure a foe's demise.*"
abilities.fury.to-the-uttermost-end.texts.target: One creature
abilities.fury.to-the-uttermost-end.texts.distance: Melee 1
abilities.fury.to-the-uttermost-end.texts.roll: Power Roll + Might
abilities.fury.to-the-uttermost-end.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + M}} damage'
abilities.fury.to-the-uttermost-end.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {11 + M}} damage'
abilities.fury.to-the-uttermost-end.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {16 + M}} damage'
abilities.fury.to-the-uttermost-end.texts.effect: 'Spend 1+ Ferocity: While you are winded, this
  ability deals an extra 1d6 damage for each ferocity spent. While you are dying, it deals an extra
  1d10 damage for each ferocity spent. In either case, you lose 1d6 Stamina after making this
  strike.'
abilities.fury.lines-of-force.name: Lines of Force
abilities.fury.lines-of-force.description: '*You redirect the energy of motion.*'
abilities.fury.lines-of-force.texts.trigger: The target would be force moved.
abilities.fury.lines-of-force.texts.target: Self or one creature
abilities.fury.lines-of-force.texts.distance: Melee 1
abilities.fury.lines-of-force.texts.effect: >-
  Effect: You can select a new target of the same size or smaller within distance to be force moved
  instead. You become the source of the forced movement, determine the new target's destination, and
  can push the target instead of using the original forced movement type. Additionally, the forced
  movement distance gains a bonus equal to your Might score.


  Spend 1 Ferocity: The forced movement distance gains a bonus equal to twice your Might score
  instead.
abilities.fury.furious-change.name: Furious Change
abilities.fury.furious-change.description: '*In your anger, you revert to a more bestial form.*'
abilities.fury.furious-change.texts.trigger: You lose Stamina and are not dying.
abilities.fury.furious-change.texts.target: Self
abilities.fury.furious-change.texts.distance: Self
abilities.fury.furious-change.texts.effect: >-
  Effect: You gain temporary Stamina equal to your Might score and can enter your animal form or
  hybrid form.


  Spend 1 Ferocity: If you are not dying, you can spend a Recovery.
abilities.fury.relentless-death.name: Relentless Death
abilities.fury.relentless-death.description: "*You won't escape your fate.*"
abilities.fury.relentless-death.texts.target: Self
abilities.fury.relentless-death.texts.distance: Self; see below
abilities.fury.relentless-death.texts.roll: Power Roll + Might
abilities.fury.relentless-death.texts.tier1: Any target whose Stamina is equal to or less than 8 dies.
abilities.fury.relentless-death.texts.tier2: Any target whose Stamina is equal to or less than 11 dies.
abilities.fury.relentless-death.texts.tier3: Any target whose Stamina is equal to or less than 17 dies.
abilities.fury.relentless-death.texts.effect: 'Effect: You shift up to your speed. Each enemy you
  move adjacent to during this movement takes damage equal to twice your Might score. Then make one
  power roll that targets each enemy you move adjacent to during this shift. You gain 1 ferocity for
  each target who dies as a result of this ability (maximum 11 ferocity).'
abilities.fury.primordial-rage.name: Primordial Rage
abilities.fury.primordial-rage.description: '*Your ferocity manifests into primordial power.*'
abilities.fury.primordial-rage.texts.target: Self
abilities.fury.primordial-rage.texts.distance: Self
abilities.fury.primordial-rage.texts.effect: 'Effect: Choose acid, cold, corruption, fire,
  lightning, poison, or sonic damage. Until the end of the encounter or until you are dying, you can
  choose one target of any ability you use, with that target taking an extra 15 damage of the chosen
  type. Additionally, whenever you gain ferocity from taking damage, the source of the damage takes
  5 damage of the chosen type.'
abilities.fury.elemental-ferocity.name: Elemental Ferocity
abilities.fury.elemental-ferocity.description: '*Your primordial energy makes for instant retribution.*'
abilities.fury.elemental-ferocity.texts.target: Self
abilities.fury.elemental-ferocity.texts.distance: Self
abilities.fury.elemental-ferocity.texts.effect: 'Effect: You gain 10 temporary Stamina.
  Additionally, choose acid, cold, corruption, fire, lightning, poison, or sonic damage. Until the
  end of the encounter or until you are dying, whenever an enemy damages you, they take 10 damage of
  the chosen type. If this damage reduces the enemy to 0 Stamina, you gain 10 temporary Stamina.'
abilities.fury.overkill.name: Overkill
abilities.fury.overkill.description: '*You strike so no damage is wasted.*'
abilities.fury.overkill.texts.target: One creature
abilities.fury.overkill.texts.distance: Melee 1
abilities.fury.overkill.texts.roll: Power Roll + Might
abilities.fury.overkill.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + M}} damage'
abilities.fury.overkill.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + M}} damage'
abilities.fury.overkill.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {14 + M}} damage'
abilities.fury.overkill.texts.effect: "Effect: If the target is a minion or is winded but isn't a
  leader or solo creature, they are reduced to 0 Stamina before this ability's damage is dealt. If
  the target is killed by this damage, you can deal any damage over what was required to kill them
  to another creature within 5 squares of the target."
abilities.fury.avalanche-impact.name: Avalanche Impact
abilities.fury.avalanche-impact.description: '*You leap and crash down, causing a shockwave that devastates foes.*'
abilities.fury.avalanche-impact.texts.target: Self
abilities.fury.avalanche-impact.texts.distance: Self
abilities.fury.avalanche-impact.texts.roll: Power Roll + Might
abilities.fury.avalanche-impact.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4}} damage; push 1'
abilities.fury.avalanche-impact.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {7}} damage; push 2'
abilities.fury.avalanche-impact.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11}} damage; push 3'
abilities.fury.avalanche-impact.texts.effect: 'Effect: You jump up to your maximum jump distance and
  make one power roll that targets each creature adjacent to the space where you land.'
abilities.fury.force-of-storms.name: Force of Storms
abilities.fury.force-of-storms.description: '*You strike an enemy hard enough to be a projectile that knocks a crowd of creatures around.*'
abilities.fury.force-of-storms.texts.target: One creature
abilities.fury.force-of-storms.texts.distance: Melee 1
abilities.fury.force-of-storms.texts.roll: Power Roll + Might
abilities.fury.force-of-storms.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + M}} damage; push 3'
abilities.fury.force-of-storms.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {11 + M}} damage; push 5'
abilities.fury.force-of-storms.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {16 + M}} damage; push 7'
abilities.fury.force-of-storms.texts.effect: 'Effect: When the target ends this forced movement,
  each creature within 2 squares of the target is pushed 3 squares.'
abilities.fury.seek-and-destroy.name: Seek and Destroy
abilities.fury.seek-and-destroy.description: '*You break through the enemy lines to make an example.*'
abilities.fury.seek-and-destroy.texts.target: One creature
abilities.fury.seek-and-destroy.texts.distance: Melee 1
abilities.fury.seek-and-destroy.texts.roll: Power Roll + Might
abilities.fury.seek-and-destroy.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + M}} damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
abilities.fury.seek-and-destroy.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + M}} damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, frightened (save ends)'
abilities.fury.seek-and-destroy.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10 + M}} damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.fury.seek-and-destroy.texts.effect: >-
  Effect: You shift up to your speed.


  Effect: If a target who is not a leader or solo creature is winded by this strike, they are
  reduced to 0 Stamina and you choose an enemy within 5 squares of you. If that enemy has P <
  AVERAGE, they are frightened of you (save ends).
abilities.fury.death-strike.name: Death Strike
abilities.fury.death-strike.description: "*Once you taste your foe's blood, you become more
  efficient and turn every killing blow into an opportunity.*"
abilities.fury.death-strike.texts.trigger: You reduce a creature to 0 Stamina with a strike.
abilities.fury.death-strike.texts.target: Self
abilities.fury.death-strike.texts.distance: Melee 1
abilities.fury.death-strike.texts.effect: 'Effect: You target a creature adjacent to you with the
  same strike, using the same power roll as the triggering strike.'
abilities.fury.riders-on-the-storm.name: Riders on the Storm
abilities.fury.riders-on-the-storm.description: '*You focus your connection to the Primordial Chaos into a seething storm.*'
abilities.fury.riders-on-the-storm.texts.target: Each creature in the area
abilities.fury.riders-on-the-storm.texts.distance: 3 aura
abilities.fury.riders-on-the-storm.texts.effect: >-
  Effect: Until the end of the encounter or until you are dying, each enemy target takes damage of
  your primordial damage type equal to twice your Might score at the end of each of your turns.
  Additionally, you can fly while the aura is active. Each ally target who starts or ends their turn
  in the area can also fly until the start of their next turn or until the effect ends.


  Special: When you use this ability outside of combat without spending ferocity, you must spend 1
  uninterrupted minute summoning a primordial storm that fills the area, and you take 1d6 damage
  before the ability takes effect. The storm lasts for 1 hour or until a combat encounter begins.
abilities.fury.pounce.name: Pounce
abilities.fury.pounce.description: '*You strike at the target like the ultimate predator you are.*'
abilities.fury.pounce.texts.target: One creature
abilities.fury.pounce.texts.distance: Melee 1
abilities.fury.pounce.texts.roll: Power Roll + Might
abilities.fury.pounce.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, grabbed'
abilities.fury.pounce.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, grabbed'
abilities.fury.pounce.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {17}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, grabbed'
abilities.fury.pounce.texts.effect: 'Effect: You can shift up to 4 squares, bringing the target with
  you. While grabbed this way, the target takes damage equal to twice your Might score at the start
  of each of your turns.'
abilities.fury.my-turn.name: My Turn!
abilities.fury.my-turn.description: '*You quickly strike back at a foe.*'
abilities.fury.my-turn.texts.trigger: A creature causes you to be winded or dying, or damages you while you are winded or dying.
abilities.fury.my-turn.texts.target: The triggering creature
abilities.fury.my-turn.texts.distance: Melee 1
abilities.fury.my-turn.texts.roll: Power Roll + Might
abilities.fury.my-turn.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + M}} damage'
abilities.fury.my-turn.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + M}} damage'
abilities.fury.my-turn.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + M}} damage'
abilities.fury.my-turn.texts.effect: 'Effect: You can spend a Recovery.'
abilities.fury.rebounding-storm.name: Rebounding Storm
abilities.fury.rebounding-storm.description: '*You knock around enemies like playthings.*'
abilities.fury.rebounding-storm.texts.target: Two creatures or objects
abilities.fury.rebounding-storm.texts.distance: Melee 1
abilities.fury.rebounding-storm.texts.roll: Power Roll + Might
abilities.fury.rebounding-storm.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {9}} damage; push 3'
abilities.fury.rebounding-storm.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14}} damage; push 5'
abilities.fury.rebounding-storm.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {19}} damage; push 7'
abilities.fury.rebounding-storm.texts.effect: 'Effect: When a target would end this forced movement
  by colliding with a creature or object, they take damage as usual, then are pushed the remaining
  distance away from the creature or object in the direction they came from. As long as forced
  movement remains, this effect continues if the target collides with another creature or object.'
abilities.fury.debilitating-strike.name: Debilitating Strike
abilities.fury.debilitating-strike.description: '*You need just one blow to sabotage your target.*'
abilities.fury.debilitating-strike.texts.target: One creature
abilities.fury.debilitating-strike.texts.distance: Melee 1
abilities.fury.debilitating-strike.texts.roll: Power Roll + Might
abilities.fury.debilitating-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + M}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
