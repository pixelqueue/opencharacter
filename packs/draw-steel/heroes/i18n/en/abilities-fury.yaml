abilities.fury.phalanx-breaker.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4}} damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed (save ends)'
abilities.fury.phalanx-breaker.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6}} damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.fury.phalanx-breaker.texts.effect: 'Effect: You shift up to your speed and make one power
