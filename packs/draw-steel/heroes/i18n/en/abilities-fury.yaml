abilities.fury.aspect-of-the-wild.name: Aspect of the Wild
abilities.fury.aspect-of-the-wild.description: '*You assume the form of the animal who channels your ferocity.*'
abilities.fury.aspect-of-the-wild.texts.target: Self
abilities.fury.aspect-of-the-wild.texts.distance: Self
abilities.fury.aspect-of-the-wild.texts.effect: >-
  Effect: You can shapeshift into the animal defined by your stormwight kit, into a hybrid form, or
  back into your true form. While in animal form or hybrid form, you can speak as you usually do,
  and you can also speak to animals who share your form. If you are in a negotiation with an animal
  while in animal form, you treat your Renown as 2 higher than usual.


  Spend 1 Ferocity: As a free maneuver, you can shapeshift a second time, either into another
  animal form, into your hybrid form, or back into your true form.
