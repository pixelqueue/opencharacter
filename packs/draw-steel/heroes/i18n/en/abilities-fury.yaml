abilities.fury.special-delivery.name: Special Delivery
abilities.fury.special-delivery.description: '*You ready?*'
abilities.fury.special-delivery.texts.target: One willing ally
abilities.fury.special-delivery.texts.distance: Melee 1
abilities.fury.special-delivery.texts.effect: "Effect: You vertically push the target up to 4
  squares. This forced movement ignores the target's stability, and the target takes no damage from
  colliding with creatures or objects. At the end of this movement, the target can make a free
  strike that deals extra damage equal to your Might score."
abilities.fury.wrecking-ball.name: Wrecking Ball
abilities.fury.wrecking-ball.description: "*It's easier to destroy than to create. Much easier, in fact!*"
abilities.fury.wrecking-ball.texts.target: Self
abilities.fury.wrecking-ball.texts.distance: Self; see below
abilities.fury.wrecking-ball.texts.roll: Power Roll + Might
abilities.fury.wrecking-ball.texts.tier1: Push 1
abilities.fury.wrecking-ball.texts.tier2: Push 2
abilities.fury.wrecking-ball.texts.tier3: Push 3
abilities.fury.wrecking-ball.texts.effect: >-
  Effect: You move up to your speed in a straight line. During this movement, you can move through
  mundane structures, including walls, which are difficult terrain for you. You automatically
  destroy each square of structure you move through and leave behind a square of difficult terrain.

  Additionally, you make one power roll that targets each enemy you move adjacent to during this
  movement.
