abilities.fury.deluge.texts.tier1: 7 damage
abilities.fury.deluge.texts.tier2: 10 damage
abilities.fury.deluge.texts.tier3: 15 damage
abilities.fury.deluge.texts.effect: 'Effect: This ability deals your primordial damage type and ignores damage immunity.'
abilities.fury.shower-of-blood.name: Shower of Blood
