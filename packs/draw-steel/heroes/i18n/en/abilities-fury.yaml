abilities.fury.steelbreaker.name: Steelbreaker
abilities.fury.steelbreaker.description: '*See how useless their weapons are!*'
abilities.fury.steelbreaker.texts.target: Self
abilities.fury.steelbreaker.texts.distance: Self
abilities.fury.steelbreaker.texts.effect: 'Effect: You gain 20 temporary Stamina.'
abilities.fury.face-the-storm.name: Face the Storm!
abilities.fury.face-the-storm.description: "*Shocked in the face of your naked brutality, your enemy's instincts take over.*"
abilities.fury.face-the-storm.texts.target: Self
abilities.fury.face-the-storm.texts.distance: Self
abilities.fury.face-the-storm.texts.effect: 'Effect: Until the end of the encounter or until you are
  dying, each creature you make a melee strike against who has P < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}} is taunted until the end
  of their next turn. Additionally, when you use an ability that deals rolled damage against any
  enemy taunted by you, the ability deals extra damage equal to twice your Might score and increases
  its potency by 1.'
abilities.fury.you-are-already-dead.name: You Are Already Dead
abilities.fury.you-are-already-dead.description: '*Slash. Walk away.*'
