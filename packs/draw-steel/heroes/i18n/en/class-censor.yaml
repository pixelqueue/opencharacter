subclasses.censor.paragon.name: Paragon
classes.censor.name: Censor
classes.censor.description: >-
  Demons and deathless fear you. Criminals run from the sight of your shadow. Agents of chaos,
  blasphemers, and heretics tremble at the sound of your voice. You carry the power of the gods,
  armed with wrath and sent out into the world first to seek, then censor those whose actions—or
  even existence—are anathema to your church.


  As a censor, you're at your best against the strongest foes. Your judgment terrifies heretics,
  stops enemies in their tracks, and even hurls them across the battlefield.


  > "We FIGHT!

  >

  > Until HELL!

  >

  > Is EMPTY!"

  >

  > **Sir Vaantikalisax**
subclasses.censor.exorcist.description: You specialize in hunting your order's hidden enemies,
  knowing that an open mind is an unguarded fortress. You have the Read Person skill.
subclasses.censor.oracle.description: Corruption has deep tendrils that can be missed, leading you
  to specialize in uncovering clandestine threats to your order. You have the Magic skill.
subclasses.censor.paragon.description: Without a strong example and a firm hand, the weak will be
  corrupted. You specialize in setting an example for your order. You have the Lead skill.
