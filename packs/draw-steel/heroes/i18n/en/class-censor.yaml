features.censor.templar.name: Templar
features.censor.templar.description: >-
  You are the ultimate representation of your god's justice in the timescape. Whenever you use your
  Judgment ability, you can use a free triggered action to use a conduit domain effect (see Domain
  Piety and Effects in the Conduit section) associated with your chosen domain, or a domain you
  access with virtue (see below). If the effect calls for the use of your Intuition score, you use
  your Presence score instead. If the effect uses your conduit level, use your censor level instead.


  Additionally, whenever you take a respite, you can open a portal to rest in the presence of your
  deity and bring along any allies. When you do, you can ask your deity three questions, which the
  Director must answer honestly if your deity knows the answers (though they might answer
  cryptically or incompletely). When you finish your respite, you and your allies can appear at any
  location in the timescape where someone worships your deity.


  While you rest in their presence, your god might also give you priority targets to enact justice
  upon. You and your allies each have a double edge on power rolls made against such targets. If you
  attempt to open a portal to your deity again before you have defeated your priority targets, you
  suffer your god's wrath, as determined by the Director.
features.censor.virtue.name: Virtue
features.censor.virtue.description: >-
  You have an epic resource called virtue. Each time you finish a respite, you gain virtue equal to
  the XP you gain. You can spend virtue on your abilities as if it were wrath.


  Additionally, you can spend 3 virtue to access one of your deity's domains that you usually don't
  have access to. When you do, you can use that domain's features until you finish another respite.


  Virtue remains until you spend it.
features.censor.wrath-of-the-gods.name: Wrath of the Gods
features.censor.wrath-of-the-gods.description: When you gain wrath at the start of each of your
  turns during combat, you gain 4 wrath instead of 3.
features.censor.deity-and-domains.name: Deity and Domains
features.censor.deity-and-domains.description: >-
  Choose a god or saint who your character reveres from Chapter 14: Gods and Religion, or ask your
  Director about the deities in your campaign world. With the Director's permission, you can also
  create your own deity and choose four domains to be part of their portfolio.


  After choosing your deity, pick one domain from their portfolio. Your choice of domain determines
  many of the features you'll gain from this class. (*Quick Build:* Cavall as deity and War as
  domain.)
features.censor.judgment-order-benefit.name: Judgment Order Benefit
features.censor.judgment-order-benefit.description: >-
  The first time on a turn that you use your Judgment ability to judge a creature, you gain the
  following benefit based on your order:


  - **Exorcist:** You can teleport up to a number of squares equal to twice your Presence score.
  This movement must take you closer to the judged creature. You do not need line of effect to your
  destination.

  - **Oracle:** You can deal holy damage equal to twice your Presence score to the judged creature.

  - **Paragon:** You can vertical pull the judged creature up to a number of squares equal to twice
  your Presence score.
features.censor.my-life-for-yours.name: My Life for Yours
features.censor.my-life-for-yours.description: >-
  You channel your will to mend your wounds or the wounds of your allies. You have the following
  ability.


  > ###### My Life for Yours

  >

  > *You channel some of your vitality into more resilience for you or an ally.*

  >

  > | **Magic, Ranged** |           **Triggered** |

  > | ----------------- | ----------------------: |

  > | **📏 Ranged 10**  | **🎯 Self or one ally** |

  >

  > **Trigger:** The target starts their turn or takes damage.

  >

  > **Effect:** You spend a Recovery and the target regains Stamina equal to your recovery value.

  >

  > **Spend 1 Wrath:** You can end one effect on the target that is ended by a saving throw or that
  ends at the end of their turn, or a prone target can stand up.
features.censor.wrath-outside-of-combat.name: Wrath Outside of Combat
features.censor.wrath-outside-of-combat.description: >-
  Though you can't gain wrath outside of combat, you can use your heroic abilities and effects that
  cost wrath without spending it. Whenever you use an ability or effect outside of combat that costs
  wrath, you can't use that same ability or effect outside of combat again until you earn 1 or more
  Victories or finish a respite.


  When you use an ability outside of combat that lets you spend unlimited wrath on its effect, you
  can use it as if you had spent an amount of wrath equal to your Victories. (Such abilities aren't
  part of the core rules for the censor, but they might appear in future products.)
features.censor.wrath-in-combat.name: Wrath in Combat
features.censor.wrath-in-combat.description: >-
  At the start of a combat encounter or some other stressful situation tracked in combat rounds (as
  determined by the Director), you gain wrath equal to your Victories. At the start of each of your
  turns during combat, you gain 2 wrath.


  Additionally, the first time each combat round that a creature judged by you (see Judgment below)
  deals damage to you, you gain 1 wrath. The first time each combat round that you deal damage to a
  creature judged by you, you gain 1 wrath.


  You lose any remaining wrath at the end of the encounter.
features.censor.a-sense-for-truth.name: A Sense for Truth
features.censor.a-sense-for-truth.description: You are trained in secret techniques from your order
  that allow you to discern the truth with supernatural precision. If a creature is of a lower level
  than you, you automatically know when they are lying, though you don't necessarily know the actual
  truth behind their lie. Additionally, you gain an edge on tests made to detect lies or hidden
  motives.
features.censor.it-was-foretold.name: It Was Foretold
features.censor.it-was-foretold.description: Your order has trained you to understand fragments of
  the visions granted to you by your deity, giving you a momentary advantage in challenging
  situations. At the start of an encounter, you can take one main action before any other creature
  and before your first turn. Additionally, whenever the Director calls for a montage test, you can
  make one free test before the montage begins, which counts as an earned success or failure as
  usual.
features.censor.judge-of-character.name: Judge of Character
features.censor.judge-of-character.description: Your focus on your fragmentary visions grants divine
  insight into the world and its creatures beyond your usual senses. Whenever you would make an
  Intuition test, you can make a Presence test instead.
features.censor.lead-by-example.name: Lead by Example
features.censor.lead-by-example.description: Your devotion to your deity allows you to take command
  of the battlefield, letting your allies benefit from your wisdom. While you are adjacent to a
  creature, your allies gain the benefits of flanking against that creature. Additionally, your
  allies gain an edge on tests made to aid other creatures with their tests.
features.censor.saints-vigilance.name: Saint's Vigilance
features.censor.saints-vigilance.description: You have honed your ability to detect sin and can use
  it to find those who hide from justice. Any creature judged by you can't use the Hide maneuver.
  Additionally, you gain an edge when searching for hidden creatures. If you find a hidden creature,
  you can use your Judgment ability against them as a free triggered action.
features.censor.stalwart-icon.name: Stalwart Icon
features.censor.stalwart-icon.description: You exhibit a small spark of your deity's power, causing
  creatures to trust or fear you, depending on what you need. You gain an edge on tests made to
  intimidate or persuade others.
features.censor.look-on-my-work-and-despair.name: Look On My Work and Despair
features.censor.look-on-my-work-and-despair.description: Your judgment has grown in divine power,
  instilling fear in those you condemn. Whenever you use your Judgment ability, you can spend 1
  wrath, and if the target has P < AVERAGE, they are frightened of you (save ends). Additionally,
  whenever a creature judged by you is reduced to 0 Stamina and you use Judgment as a free triggered
  action, if the new target has P < STRONG, they are frightened of you (save ends). If the target is
  already frightened of you, they instead take holy damage equal to twice your Presence score.
features.censor.wrath-beyond-wrath.name: Wrath Beyond Wrath
features.censor.wrath-beyond-wrath.description: The first time each combat round that you deal
  damage to a creature judged by you, you gain 2 wrath instead of 1.
features.censor.evil-revealed.name: Evil Revealed
features.censor.evil-revealed.description: Your order has taught you methods to discern the
  disguises of both mortals and monsters. You automatically see through disguises and illusions
  created by creatures of your level or lower, and you gain an edge on tests made to see through the
  disguises and illusions of more powerful creatures. Whenever you see through a creature's disguise
  or illusion, you can use your Judgment ability against them as a free triggered action.
features.censor.prophecy.name: Prophecy
features.censor.prophecy.description: >-
  You can better sift through the constant fragmentary visions from your deity and act to make them
  manifest. Each time you earn 1 or more Victories, you can make a number of 2d10 rolls equal to the
  number of Victories you earned. Record each roll in order. Then whenever you or a creature within
  10 squares makes a power roll, you can use a free triggered action to replace the total on the
  dice with your first recorded roll.


  You discard each roll as it is used, and each time you earn Victories, you add new rolls to the
  bottom of the list. Any unused rolls are discarded when you finish a respite.
features.censor.stand-fast.name: Stand Fast!
features.censor.stand-fast.description: Your divine spark grows in power, allowing you and your
  allies to focus and endure. At the start of each of your turns, you can spend 1d6 Stamina to end
  one effect on you that is ended by a saving throw or that ends at the end of your turn. Any ally
  who starts their turn within 5 squares of you can also spend Stamina to gain this benefit.
features.censor.implement-of-wrath.name: Implement of Wrath
features.censor.implement-of-wrath.description: >-
  Each time you finish a respite, you can choose one hero's weapon, including your own, to channel
  supernatural power as an implement of your god's wrath. The weapon becomes magic and gains the
  following benefits until your next respite:


  - Strikes with the weapon deal extra holy damage equal to the wielder's highest characteristic
  score.

  - Any creature struck by the weapon who has holy weakness and has P < STRONG is frightened and
  weakened (save ends).

  - Any minion targeted by a strike using the weapon dies. That minion's Stamina maximum is removed
  from the minion Stamina pool before any damage is applied to the rest of the squad.

  - The weapon's wielder can't be made frightened.
features.censor.focused-wrath.name: Focused Wrath
features.censor.focused-wrath.description: When you gain wrath at the start of each of your turns
  during combat, you gain 3 wrath instead of 2.
features.censor.ride-the-lightning.name: Ride the Lightning
features.censor.ride-the-lightning.description: Lightning and thunder infuse your body. Whenever you
  use an ability to deal rolled damage to another creature, the ability deals extra lightning damage
  equal to your Presence score. Additionally, if you use an ability that force moves a creature, the
  forced movement distance gains a bonus equal to your Presence score. While you are under the
  effect of your Windwalk feature, lightning enhances your locomotion to grant you a bonus to speed
  equal to your Might score. If Windwalk already grants you a bonus to speed, this bonus adds to
  that.
features.censor.demonologist.name: Demonologist
features.censor.demonologist.description: The most esoteric secrets of your order teach you that to
  defeat your enemy, you must understand them. You treat your Renown as 2 higher than usual when
  dealing with demons, devils, and other agents of chaos. If you successfully complete a negotiation
  with one of these creatures, you gain an edge on power rolls made against them and can use your
  Judgment ability against them as a free triggered action before an encounter begins.
features.censor.their-past-revealed.name: Their Past Revealed
features.censor.their-past-revealed.description: Your constant fragmentary visions become clearer,
  and can be honed to understand the past of creatures you interact with. While speaking with any
  creature, you can make a medium Presence test to see visions from their past. On a success, you
  see a clear view of any subject related to the creature's past that you wish to understand. On a
  success with a consequence, you see two visions, one false and one true. On a failure, you lose
  2d6 Stamina.
features.censor.vow.name: Vow
features.censor.vow.description: Your words take on the power of your deity, with all the authority
  that entails. If you convince a creature to take an oath, they can't break it for 7 days. If you
  take an oath, you can't break it for 7 days.
features.censor.improved-implement-of-wrath.name: Improved Implement of Wrath
features.censor.improved-implement-of-wrath.description: >-
  The weapon you target with your Implement of Wrath feature gains the following additional
  benefits:


  - The weapon's wielder and each ally adjacent to them gain a +2 bonus to saving throws.

  - At the end of each of the weapon wielder's turns, each ally adjacent to the wielder makes a
  saving throw against each effect on them that is ended by a saving throw.

  - The weapon's wielder has corruption immunity 10.
