features.talent.clear-mind.name: Clear Mind
features.talent.clear-mind.description: The first time each combat round that a creature is force moved, you gain 3 clarity instead of 2.
features.talent.omnisensory.name: Omnisensory
features.talent.omnisensory.description: You have a +10 bonus to the distance of your ranged
  abilities. Additionally, you don't need line of effect to a target of a ranged ability if the
  target is a creature capable of thought who you have previously had line of effect to.
features.talent.psion.name: Psion
features.talent.psion.description: >-
  At the start of each of your turns during combat, you gain 1d3 + 2 clarity instead of 1d3 + 1.


  Additionally, you can choose to not take damage from having negative clarity. You can also choose
  to take on any ability's strained effect even if you're not strained.
features.talent.vision.name: Vision
features.talent.vision.description: >-
  You have an epic resource called vision. Each time you finish a respite, you gain vision equal to
  the XP you gain. You can spend vision on your abilities as if it were clarity.


  Additionally, you can spend vision to use one additional psionic ability on your turn, provided
  you pay the entire cost of the ability in vision. If you choose to use a psionic ability that
  usually costs no clarity, you must spend 1 vision to use it.


  Vision remains until you spend it.
features.talent.accelerate.name: Accelerate
features.talent.accelerate.description: |-
  You have the following ability.

  > ###### Accelerate
  >
  > *To your ally, it seems as though the world has slowed down.*
  >
  > | **Psionic, Ranged** |                **Maneuver** |
  > | ------------------- | --------------------------: |
  > | **📏 Ranged 10**    | **🎯 Self or one creature** |
  >
  > **Effect:** The target shifts up to a number of squares equal to your Reason score.
  >
  > **Spend 2 Clarity:** The target can use a maneuver.
features.talent.again.name: Again
features.talent.again.description: >-
  You have the following ability.


  > ###### Again

  >

  > *You step back a split second to see if things play out a little differently.*

  >

  > | **Psionic, Ranged** |               **Triggered** |

  > | ------------------- | --------------------------: |

  > | **📏 Ranged 10**    | **🎯 Self or one creature** |

  >

  > **Trigger:** The target makes an ability roll.

  >

  > **Effect:** You can use this ability after seeing the result of the triggering roll. The target
  must reroll the power roll and use the new roll.
features.talent.battle-augmentation.name: Battle Augmentation
features.talent.battle-augmentation.description: >-
  You can wear light armor and wield light weapons effectively, even though you don't have a kit.
  While you wear light armor, you gain a +3 bonus to Stamina, and that bonus increases by 3 at 4th,
  7th, and 10th levels. While you wield a light weapon, you gain a +1 damage bonus with weapon
  abilities, including free strikes. You can use light armor treasures and light weapon treasures.


  If you have a kit, you can't take this augmentation.
features.talent.clarity-outside-of-combat.name: Clarity Outside of Combat
features.talent.clarity-outside-of-combat.description: >-
  Though you can't gain clarity outside of combat, you can use your heroic abilities and effects
  that cost clarity without spending it. Whenever you use an ability or effect outside of combat
  that costs clarity, you can't use that same ability or effect outside of combat again until you
  earn 1 or more Victories or finish a respite.


  Additionally, whenever you use any ability or effect that costs clarity within 1 minute of using
  another such ability, you take 1d6 damage and incur any strain effect from using the new ability.
  Whenever you use an ability with a strain effect outside of combat, you can take 1d6 damage and
  incur the effect if you don't incur it for other reasons.


  When you use an ability outside of combat that lets you spend unlimited clarity on its effect,
  such as Minor Telekinesis, you can use it as if you had spent an amount of clarity equal to your
  Victories.
features.talent.clarity-in-combat.name: Clarity in Combat
features.talent.clarity-in-combat.description: >-
  At the start of a combat encounter or some other stressful situation tracked in combat rounds (as
  determined by the Director), you gain clarity equal to your Victories. At the start of each of
  your turns during combat, you gain 1d3 clarity.


  Additionally, the first time each combat round that a creature is force moved, you gain 1 clarity.


  You can spend clarity you don't have, pushing that Heroic Resource into negative numbers to a
  maximum negative value equal to 1 + your Reason score. At the end of each of your turns, you take
  1 damage for each negative point of clarity.


  Whenever you have clarity below 0, you are strained. Some psionic abilities have additional
  effects if you are already strained or become strained when you use them. Strained effects can
  still impact you even after you are no longer strained.


  You lose any remaining clarity or reset any negative clarity at the end of the encounter.
features.talent.density-augmentation.name: Density Augmentation
features.talent.density-augmentation.description: You gain a +6 bonus to Stamina, and this bonus
  increases by 6 at 4th, 7th, and 10th levels. Additionally, you gain a +1 bonus to stability.
features.talent.distance-augmentation.name: Distance Augmentation
features.talent.distance-augmentation.description: Your ranged psionic abilities gain a +2 bonus to distance.
features.talent.entropy-ward.name: Entropy Ward
features.talent.entropy-ward.description: Your ward slows time for your enemies. Whenever a creature
  deals damage to you, their speed is reduced by an amount equal to your Reason score and they can't
  use triggered actions until the end of their next turn.
features.talent.feedback-loop.name: Feedback Loop
features.talent.feedback-loop.description: >-
  You have the following ability.


  > ###### Feedback Loop

  >

  > *Creating a brief psychic link between an enemy and their target gives that foe a taste of their
  own medicine.*

  >

  > | **Psionic, Ranged** |       **Triggered** |

  > | ------------------- | ------------------: |

  > | **📏 Ranged 10**    | **🎯 One creature** |

  >

  > **Trigger:** The target deals damage to an ally.

  >

  > **Effect:** The target takes psychic damage equal to half the triggering damage.
features.talent.force-augmentation.name: Force Augmentation
features.talent.force-augmentation.description: Your damage-dealing psionic abilities gain a +1 bonus to rolled damage.
features.talent.mind-spike.name: Mind Spike
features.talent.mind-spike.description: >-
  You have the following ability, which can be used as a ranged free strike.


  > ###### Mind Spike

  >

  > *A telepathic bolt instantly zaps a creature's brain.*

  >

  > | **Psionic, Ranged**, **Strike, Telepathy** |     **Main action** |

  > | ------------------------------------------ | ------------------: |

  > | **📏 Ranged 10**                           | **🎯 One creature** |

  >

  > **Power Roll + Reason:**

  >

  > - **≤11:** 2 + R psychic damage

  > - **12-16:** 4 + R psychic damage

  > - **17+:** 6 + R psychic damage

  >

  > **Strained:** The target takes an extra 2 psychic damage. You also take 2 psychic damage that
  can't be reduced in any way.
features.talent.minor-telekinesis.name: Minor Telekinesis
features.talent.minor-telekinesis.description: >-
  You have the following ability.


  > ###### Minor Telekinesis

  >

  > *Wisps of psychic energy ripple visibly from your brain as you force the target to move using
  only your mind.*

  >

  > | **Psionic, Ranged** |                                 **Maneuver** |

  > | ------------------- | -------------------------------------------: |

  > | **📏 Ranged 10**    | **🎯 Self or one size 1 creature or object** |

  >

  > **Effect:** You slide the target up to a number of squares equal to your Reason score.

  >

  > **Spend 2+ Clarity:** The size of the creature or object you can target increases by 1 for every
  2 clarity spent.

  >

  > **Spend 3 Clarity:** You can vertical slide the target.
features.talent.remote-assistance.name: Remote Assistance
features.talent.remote-assistance.description: >-
  You have the following ability.


  > ###### Remote Assistance

  >

  > *An ally gains the benefit of your intellect.*

  >

  > | **Psionic, Ranged** |                  **Maneuver** |

  > | ------------------- | ----------------------------: |

  > | **📏 Ranged 10**    | **🎯 One creature or object** |

  >

  > **Effect:** The next ability roll an ally makes against the target before the start of your next
  turn gains an edge.

  >

  > **Spend 1 Clarity:** You target one additional creature or object.
features.talent.repel.name: Repel
features.talent.repel.description: >-
  You have the following ability.


  > ###### Repel

  >

  > *They aren't going anywhere, but you might!*

  >

  > | **Psionic, Ranged** |           **Triggered** |

  > | ------------------- | ----------------------: |

  > | **📏 Ranged 10**    | **🎯 Self or one ally** |

  >

  > **Trigger:** The target takes damage or is force moved.

  >

  > **Effect:** The target takes half the triggering damage, or the distance of the triggering
  forced movement is reduced by a number of squares equal to your Reason score. If the target took
  damage and was force moved, you choose the effect. If the forced movement is reduced to 0 squares,
  the target can push the source of the forced movement a number of squares equal to your Reason
  score.
features.talent.repulsive-ward.name: Repulsive Ward
features.talent.repulsive-ward.description: You surround yourself with an invisible ward of
  telekinetic energy. Whenever an adjacent creature deals damage to you, you can use a free
  triggered action to push them up to a number of squares equal to your Reason score.
features.talent.speed-augmentation.name: Speed Augmentation
features.talent.speed-augmentation.description: You gain a +1 bonus to speed and to the distance you
  can shift when you take the Disengage move action.
features.talent.steel-ward.name: Steel Ward
features.talent.steel-ward.description: Your ward reacts to danger, protecting you from future harm.
  Whenever you take damage, after the damage resolves, you gain damage immunity equal to your Reason
  score until the end of your next turn.
features.talent.telepathic-speech.name: Telepathic Speech
features.talent.telepathic-speech.description: 'You know the Mindspeech language (see Languages in
  Orden in Chapter 4: Background). Additionally, you can telepathically communicate with any
  creatures within distance of your Mind Spike ability if they share a language with you and you
  know of each other. When you communicate with someone this way, they can respond telepathically.'
features.talent.vanishing-ward.name: Vanishing Ward
features.talent.vanishing-ward.description: Your ward allows you to slip away from threats. Whenever
  you take damage, you become invisible until the end of your next turn.
features.talent.ease-their-fall.name: Ease Their Fall
features.talent.ease-their-fall.description: Whenever you land after a fall, or if any falling
  creature lands within 2 squares of you, you can use a free triggered action to reduce the falling
  damage by an amount equal to 2 + your Reason score.
features.talent.ease-the-hours.name: Ease the Hours
features.talent.ease-the-hours.description: You can increase the number of rounds in a montage test
  by 1 if the test would end before the heroes hit the success limit.
features.talent.ease-the-mind.name: Ease the Mind
features.talent.ease-the-mind.description: You gain an edge on tests made to stop combat and start a
  negotiation. Additionally, if you are present during a negotiation, any NPC who has a hostile or
  suspicious starting attitude has their patience increased by 1 (to a maximum of 5).
features.talent.scan.name: Scan
features.talent.scan.description: 'You can extend your psionic senses beyond their usual range. Once
  on each of your turns, you can search for hidden creatures as a free maneuver (see Hide and Sneak
  in Chapter 9: Tests). Additionally, once you establish line of effect to a thinking creature
  within distance of your Mind Spike ability, you always have line of effect to that creature until
  they move beyond that distance.'
features.talent.mind-projection.name: Mind Projection
features.talent.mind-projection.description: >-
  As a maneuver, you project your mind outside your body. While you are in this state, your body
  remains unconscious and prone, and your mind is a separate entity with size 1T. Your mind
  automatically has concealment, and can freely move through solid matter. If you end your turn
  inside solid matter, you are forced out into the space where you entered it.


  Any abilities or features you use originate from your mind. Both your mind and your body can take
  damage while separated, with any such damage applied to your Stamina. Your mind is instantly
  forced back into your body if you take any damage, and you can immediately return to your body as
  a free maneuver.
features.talent.mind-recovery.name: Mind Recovery
features.talent.mind-recovery.description: >-
  Whenever you spend a Recovery to regain Stamina while strained, you can forgo the Stamina and gain
  3 clarity instead.


  Additionally, the first time each combat round that a creature is force moved, you gain 2 clarity
  instead of 1.
features.talent.suspensor-field.name: Suspensor Field
features.talent.suspensor-field.description: >-
  You can fly. While flying, your stability is reduced to 0 and can't be increased. If you can
  already fly, you have a +2 bonus to speed while flying instead.


  If you are strained while flying and are force moved, the forced movement distance gains a +2
  bonus.
features.talent.compulsion.name: Compulsion
features.talent.compulsion.description: Whenever you obtain a success on a test using a skill from
  the interpersonal skill group while interacting with an NPC, you can ask them a question using
  your Telepathic Speech feature. The NPC must answer the question truthfully to the best of their
  ability.
features.talent.distortion-temporal.name: Distortion Temporal
features.talent.distortion-temporal.description: While you are not dying, time behaves irregularly
  around you in a 3 aura. That area is difficult terrain for enemies. Additionally, when an ally
  enters the area for the first time in a combat round or starts their turn there, they gain a +2
  bonus to speed until the end of the turn.
features.talent.kinetic-amplifier.name: Kinetic Amplifier
features.talent.kinetic-amplifier.description: Whenever you force move a creature, you can spend up
  to 2 surges. For each surge spent, the forced movement distance gains a bonus equal to your Reason
  score.
features.talent.remote-amplification.name: Remote Amplification
features.talent.remote-amplification.description: The distance of your ranged psionic abilities
  increases by 5. Additionally, the range of your Telepathic Speech feature increases to 1 mile.
features.talent.speed-of-thought.name: Speed of Thought
features.talent.speed-of-thought.description: Once per combat round while you are not dying, you can
  spend 2 clarity when you use a triggered action to turn it into a free triggered action.
features.talent.triangulate.name: Triangulate
features.talent.triangulate.description: Whenever an ally uses a ranged ability while you are within
  the ability's distance, you can spend 1 clarity as a free triggered action to allow them to use
  the ability as if they were in your space.
features.talent.psi-boost.name: Psi Boost
features.talent.psi-boost.description: >-
  Whenever you use an ability that is a main action or a maneuver with the Psionic keyword, you can
  spend additional discipline to apply a psi boost to it and enhance its effects. A psi boost's
  effects only last until the end of the turn which the ability is first used. You can apply
  multiple psi boosts to an ability, but only one instance of each specific boost. You can use the
  following psi boosts.


  ##### Dynamic Power (1 Clarity)


  If the ability force moves a target, the forced movement distance gains a bonus equal to your
  Reason score.


  ##### Expanded Power (3 Clarity)


  If the ability targets an area, you increase the size of the area by 1. If the area is a line, you
  increase the size of one dimension, not both.


  ##### Extended Power (1 Clarity)


  If the ability is ranged, the distance gains a bonus equal to your Reason score. If the ability is
  melee, the distance gains a +2 bonus.


  ##### Heightened Power (1 Clarity)


  If the ability deals rolled damage, it deals extra damage equal to your Reason score.


  ##### Magnified Power (5 Clarity)


  If the ability has a potency, you increase that potency by an amount equal to your Reason score.


  ##### Shared Power (5 Clarity)


  If the ability targets individual creatures or objects, you target one additional creature or
  object within distance.


  ##### Sharpened Power (1 Clarity)


  If the ability has any power roll, that roll gains an edge.
features.talent.ancestral-memory.name: Ancestral Memory
features.talent.ancestral-memory.description: Each time you finish a respite, you can choose a
  number of skills you have up to your Reason score and replace them with an equal number of skills
  from the interpersonal and lore skill groups. These replacements last until the end of your next
  respite.
features.talent.cascading-strain.name: Cascading Strain
features.talent.cascading-strain.description: Whenever you take damage from a strained effect or
  from having negative clarity, you can choose one enemy within distance of your Mind Spike ability
  to take the same damage.
features.talent.lucid-mind.name: Lucid Mind
features.talent.lucid-mind.description: At the start of each of your turns during combat, you gain 1d3 + 1 clarity instead of 1d3.
features.talent.doubling-the-hours.name: Doubling the Hours
features.talent.doubling-the-hours.description: While you have 5 or more Victories, you can
  undertake an additional respite activity during a respite.
features.talent.levitation-field.name: Levitation Field
features.talent.levitation-field.description: >-
  You have the following ability.


  > ###### Levitation Field

  >

  > *You manipulate the air around your allies so they can move as freely through the sky as you
  can.*

  >

  > | **Area, Psionic** |                 **Maneuver** |

  > | ----------------- | ---------------------------: |

  > | **📏 3 burst**    | **🎯 Each ally in the area** |

  >

  > **Effect:** Each target can fly until the start of your next turn, and can immediately shift up
  to their speed. You can also shift up to your speed. While flying, a target's stability is reduced
  to 0 and can't be increased.

  >

  > **Spend 5 Clarity:** The effects last for 1 hour instead.
features.talent.low-gravity.name: Low Gravity
features.talent.low-gravity.description: Your mind can carry your body through tough times. You
  ignore difficult terrain and don't need to spend additional movement while prone.
features.talent.mindlink.name: Mindlink
features.talent.mindlink.description: During a respite, you can choose a number of creatures up to
  your Reason score who you have communicated with using your Telepathic Speech feature, creating a
  telepathic link among all of you. Whenever a linked creature spends one or more Recoveries, each
  other linked creature can spend a Recovery.
features.talent.stasis-shield.name: Stasis Shield
features.talent.stasis-shield.description: >-
  You have the following ability.


  > ###### Stasis Shield (3 Clarity)

  >

  > *You freeze time just long enough to bring the victim to safety!*

  >

  > | **Psionic, Ranged** |                          **Triggered** |

  > | ------------------- | -------------------------------------: |

  > | **📏 Ranged 10**    | **🎯 Self, or one creature or object** |

  >

  > **Trigger:** The target takes damage.

  >

  > **Effect:** The target is teleported to an unoccupied space adjacent to you, taking no damage
  and suffering no additional effects if this movement would get them out of harm's way.

  >

  > **Strained:** You can't target yourself, and you take the damage and any additional effects
  instead of the target.
features.talent.universal-connection.name: Universal Connection
features.talent.universal-connection.description: The range of your Telepathic Speech feature increases to anywhere on the same world.
features.talent.fortress-of-perfect-thought.name: Fortress of Perfect Thought
features.talent.fortress-of-perfect-thought.description: >-
  Your mind is an impenetrable palace that shields you from danger. You gain the following effects:


  - You can breathe even when there is no breathable air.

  - You have psychic immunity 10.

  - Creatures can't read your thoughts unless you allow them to.

  - Your Reason and Intuition are treated as 2 higher for the purpose of resisting the potency of
  abilities.

  - You can't be made taunted or frightened.
subclasses.talent.chronopathy.name: Chronopathy
subclasses.talent.telekinesis.name: Telekinesis
subclasses.talent.telepathy.name: Telepathy
classes.talent.name: Talent
classes.talent.description: >-
  Arare few people are born with the potential to harness psionic power, but only those who
  experience an awakening, a significant event that activates a talent's abilities, can tap into the
  mind's full potential. You are one of those people—a master of psionics and a source of incredible
  power created through sheer force of will. You can move and change matter, time, gravity, the laws
  of physics, or another creature's mind.


  **As a talent, you are limited only by the strength of your mind. But the ability to wield
  multiple powers at once and change reality at will involves a gamble. Every manifestation has a
  chance of harming you, and talents who use too much power too quickly pay a deadly price.**


  > "I've seen what you can do! There is NO LIMIT to your power! All you have to do... is BELIEVE!"

  >

  > **Khorva**
classes.talent.choices.subclass.prompt: Talent subclass
subclasses.talent.chronopathy.description: Chronopathy abilities allow you to view future and past events, and to manipulate time to aid allies and hinder foes.
subclasses.talent.telekinesis.description: Telekinesis abilities allow you to physically manipulate creatures and objects.
subclasses.talent.telepathy.description: Telepathy abilities allow you to communicate with, read, and influence the minds of other creatures.
