culture-aspects.nomadic.name: Nomadic
culture-aspects.nomadic.description: |-
  A nomadic culture travels from place to place to survive. Members of a nomadic culture might follow animal migrations or the weather, travel to sell their wares or services, or simply enjoy a restless lifestyle full of new experiences and peoples. Those who grow up in nomadic cultures learn to navigate the wilderness and work closely with others to survive.

  **Skill Options:** One skill from the exploration or interpersonal skill groups. (*Quick Build:* Navigate.)
culture-aspects.nomadic.choices.skill.prompt: Nomadic skill
culture-aspects.rural.name: Rural
culture-aspects.rural.description: |-
  A rural culture is one located in a town, village, or smaller settled enclave. People dwelling in such places often cultivate the land, trade goods or services with travelers passing through, harvest fish from the sea, or mine metals and gems from the earth.

  Living among a small population, most folks in a rural community learn a trade and are handed down bits of essential knowledge to help their community survive. For example, when a rural culture has only one blacksmith, it's important to have an apprentice already learning at the anvil well before that smith starts to get old. If the only priest in town gets the sniffles, folks want an acolyte ready to wear the fancy robes should the worst occur.

  **Skill Options:** One skill from the crafting or lore skill groups. (*Quick Build:* Nature.)
culture-aspects.rural.choices.skill.prompt: Rural skill
culture-aspects.secluded.name: Secluded
culture-aspects.secluded.description: |-
  A secluded culture is based in one relatively close-quarters structure—a building, a cavern, and so forth—and interacts with other cultures only rarely. Such places are often buildings or complexes such as monasteries, castles, or prisons. Folk in a secluded culture have little or no reason to leave their home or interact with other cultures on the outside, but might have an awareness of those cultures and of events happening beyond their enclave.

  When people live together in close quarters, they typically learn to get along. They often spend much time in study or introspection, as there is not much else to do in seclusion.

  **Skill Options:** One skill from the interpersonal or lore skill groups. (*Quick Build:* Read Person.)
culture-aspects.secluded.choices.skill.prompt: Secluded skill
culture-aspects.urban.name: Urban
culture-aspects.urban.description: |-
  An urban culture is always centered in a city. Such a culture might arise within the walls of Capital, a massive metropolis with a cosmopolitan population; within a network of caverns that hold an underground city; or in any other place where a large population lives relatively close together. The people of urban cultures often learn to effectively misdirect others in order to navigate the crowds and the political machinations that can come with city life.

  **Skill Options:** One skill from the interpersonal or intrigue skill groups. (*Quick Build:* Alertness.)
culture-aspects.urban.choices.skill.prompt: Urban skill
culture-aspects.wilderness.name: Wilderness
culture-aspects.wilderness.description: |-
  A wilderness culture doesn't try to tame the terrain in which its people live, whether desert, forest, swamp, tundra, ocean, or more exotic climes. Instead, the folk of such a culture thrive amid nature, taking their sustenance and shelter from the land. A wilderness culture might be a circle of druids protecting a remote wode, a band of brigands hiding out in desert caves, or a camp of orc mercenaries who call the trackless mountains home. People in a wilderness culture learn how to use the land for all they need to live, typically crafting their own tools, clothing, and more.

  **Skill Options:** One skill from the crafting or exploration skill groups. (*Quick Build:* Endurance.)
culture-aspects.wilderness.choices.skill.prompt: Wilderness skill
culture-aspects.bureaucratic.name: Bureaucratic
culture-aspects.bureaucratic.description: |-
  Bureaucratic cultures are steeped in official leadership and formally recorded laws. Members of such a culture are often ranked in power according to those laws, with a small group of people holding the power to rule according to birthright, popular vote, or some other official and measurable standard. Many bureaucratic communities have one person at the top, though others might be ruled by a council. A trade guild with a guildmaster, treasurer, secretary, and a charter of rules and regulations for membership; a feudal lord who rules over a group of knights who in turn rule over peasants working the land; and a militaristic society with ranks and rules that its people must abide are all examples of bureaucratic cultures.

  Those who thrive in bureaucratic cultures don't simply follow the rules. They know how to use those rules to their advantage, either bending, changing, or reinterpreting policy to advance their own interests. Schmoozing with those who make the laws is often key to this approach. Others in a bureaucratic culture might specialize in operating outside the strict regulations that govern the culture without getting caught.

  **Skill Options:** One skill from the interpersonal or intrigue skill groups. (*Quick Build:* Persuade.)
culture-aspects.bureaucratic.choices.skill.prompt: Bureaucratic skill
culture-aspects.communal.name: Communal
culture-aspects.communal.description: |-
  A communal culture is a place where all members of the culture are considered equal. The community works together to make important decisions that affect the majority of the culture. While they elect leaders to carry out these decisions and organize their efforts, each person has a relatively equal say in how the culture operates, and everyone contributes to help their people survive and thrive. Individuals often share the burdens of governing, physical labor, childcare, and other duties. A collective of farmers who work together to cultivate and protect their land without a noble, a city of pirates where each person can do as they wish, and a traveling theatrical troupe whose members vote on every artistic and administrative decision are all communal cultures.

  Many communal cultures operate outside settled lands, sticking to the wilds, a specific district in a larger settlement, city sewers, forgotten ruins, or other isolated places. For even when such cultures are harmless, their members know that outsiders might try to impose rules upon them if they live in the same place. As such, many folks in communal cultures focus on fending for themselves while avoiding the danger that other groups can represent.

  **Skill Options:** One skill from the crafting or exploration skill groups. (*Quick Build:* Jump.)
culture-aspects.communal.choices.skill.prompt: Communal skill
culture-aspects.academic.name: Academic
culture-aspects.academic.description: |-
  Your hero was raised by people who collect, study, and share books and other records. Some academics focus on one area of study, such as a college for wizards dedicated to the study of magic, or a church that teaches the word of one deity. People in an academic culture learn how to wield the power that is knowledge.

  **Skill Options:** One skill from the lore skill group. (*Quick Build:* History.)
culture-aspects.academic.choices.skill.prompt: Academic skill
culture-aspects.creative.name: Creative
culture-aspects.creative.description: |-
  A hero with a creative upbringing was raised among folk who create art or other works valuable enough to trade. A creative culture might produce fine art such as dance, music, or sculpture, or more practical wares such as wagons, weapons, tools, or buildings. People in such cultures learn the value of quality crafting and attention to detail.

  **Skill Options:** The Music or Perform skill (from the interpersonal skill group), or one skill from the crafting group. (*Quick Build:* Perform.)
culture-aspects.creative.choices.skill.prompt: Creative skill
culture-aspects.labor.name: Labor
culture-aspects.labor.description: |-
  Your hero came of age in a culture where people labored for a living. They might have been cultivators, typically raising crops or livestock on a farm. They might have harvested natural resources, whether by hunting, trapping, logging, or mining. Or they might have excelled at manual labor tied to settlement and trade, such as construction, carting, loading cargo, and so forth. People with a labor upbringing know the value of hard work.

  **Skill Options:** The Blacksmithing skill (from the crafting skill group), the Handle Animals skill (from the interpersonal group), or a skill from the exploration group. (*Quick Build:* Lift.)
culture-aspects.labor.choices.skill.prompt: Labor skill
culture-aspects.lawless.name: Lawless
culture-aspects.lawless.description: |-
  Your hero grew up among folk who performed activities that other people—whether within or outside their culture—considered unlawful. A band of pirates, a guild of assassins, or an organization of spies all commit unlawful acts for money. And under tyranny, people engaged in rebellion are often considered lawless in their actions and activities. People brought up in a lawless culture typically don't mind breaking the rules when it suits them—and are good at making sure no one finds out they did.

  **Skill Options:** One skill from the intrigue skill group. (*Quick Build:* Sneak.)
culture-aspects.lawless.choices.skill.prompt: Lawless skill
culture-aspects.martial.name: Martial
culture-aspects.martial.description: |-
  A hero with a martial upbringing was raised by warriors. These might have been the soldiers of an established army, a band of mercenaries, a guild of monster-slaying adventurers, or any other folk whose lives revolve around combat. Heroes with a martial upbringing are always ready for a fight—and they know how to finish that fight.

  **Skill Options:** One of the following: Blacksmithing or Fletching from the crafting skill group; Climb, Endurance, or Ride from the exploration group; Intimidate from the interpersonal group; Alertness or Track from the intrigue group; or Monsters or Strategy from the lore skill group (*Quick Build:* Intimidate.)
culture-aspects.martial.choices.skill.prompt: Martial skill
culture-aspects.noble.name: Noble
culture-aspects.noble.description: |-
  Your hero grew up among leaders who rule over others and play the games of politics to maintain power. Many families are nobles by birthright, but some cultures have noble titles earned through deeds or popularity. Whatever the case, heroes with this background understand why the whispered words in the right ear can sometimes be more powerful than any army.

  **Skill Options:** One skill from the interpersonal skill group. (*Quick Build:* Lead.)

  > **But I Really Want Alertness**
  >
  > If the culture you create doesn't grant a skill that you want, check with your Director about modifying what the culture's aspects offer. For instance, you can easily make the case that a culture with the noble upbringing aspect should give a character access to the Alertness skill, given that living among those who covet your power means always being aware of your surroundings.
culture-aspects.noble.choices.skill.prompt: Noble skill
cultures.culture.name: Culture
cultures.culture.choices.language.prompt: Culture language
cultures.culture.choices.environment.prompt: Environment
cultures.culture.choices.organization.prompt: Organization
cultures.culture.choices.upbringing.prompt: Upbringing
careers.agent.name: Agent
careers.agent.description: |
  You worked as a spy for a government or organization. In defining your career, think about the following questions:

  - Who did you work for?
  - Who did you spy on?
  - Who shouldn't know your true identity and allegiance but does?
  - Who did you burn or leave behind to get a job done?

  You gain the following career benefits:

  **Skills:** The Sneak skill from the intrigue skill group, plus one skill from the interpersonal group and one other skill from the intrigue group (*Quick Build:* Disguise, Lie, Sneak.)

  **Languages:** Two languages

  **Perk:** One intrigue perk (*Quick Build:* Forgettable Face.)
careers.aristocrat.name: Aristocrat
careers.aristocrat.description: |
  Career? Who needs a career when you're born into money! Or marry into it! Or con your way into it! Whatever the case, you didn't need to work thanks to (someone's) generational wealth. In defining your career, think about the following questions:

  - How did you become an aristocrat?
  - What did you do to fill your days?
  - Which aristocrats and people who worked for you were your best friends and greatest enemies?
  - What sentimental heirloom from your old estate do you carry, and what does it mean to you?

  You gain the following career benefits:

  **Skills:** One skill from the interpersonal skill group and one skill from the lore group (*Quick Build:* Brag, Society.)

  **Languages:** One language

  **Renown:** +1

  **Wealth:** +1

  **Perk:** One lore perk (*Quick Build:* I've Read About This Place.)
careers.artisan.name: Artisan
careers.artisan.description: |
  You made and sold useful wares. In defining your career, think about the following questions:

  - What did you create?
  - Who taught you your craft?
  - Was there any particular creation you were known for?
  - Did you have a shop, or did you travel to sell your wares?

  You gain the following career benefits:

  **Skills:** Two skills from the crafting skill group (*Quick Build:* Blacksmithing, Carpentry.)

  **Languages:** One language

  **Project Points:** 240

  **Perk:** One crafting perk (*Quick Build:* Area of Expertise.)
careers.beggar.name: Beggar
careers.beggar.description: |
  You lived by going to a tavern, crossroads, city street, or other busy area and begging passersby for money or food. In defining your career, think about the following questions:

  - What unfortunate circumstances led you to become a beggar?
  - Where did you beg?
  - Who made sport out of bullying you?
  - Who showed you the most kindness?

  You gain the following career benefits:

  **Skills:** The Rumors skill (from the lore skill group), plus one skill from the exploration group and one skill from the interpersonal group (*Quick Build:* Empathize, Endurance, Rumors.)

  **Languages:** Two languages

  **Perk:** One interpersonal perk (*Quick Build:* Spot the Tell.)
careers.criminal.name: Criminal
careers.criminal.description: |
  You once worked as a bandit, insurgent, smuggler, outlaw, or even as an assassin. In defining your career, think about the following questions:

  - What crimes did you commit, and why?
  - Did anyone help you perform your illicit activities?
  - What is one crime you botched?
  - Who was your nemesis while you were a criminal?

  You gain the following career benefits:

  **Skills:** The Criminal Underworld skill (from the lore skill group), plus two skills from the intrigue group (*Quick Build:* Criminal Underworld, Pick Lock, Pick Pocket.)

  **Languages:** One language

  **Project Points:** 120

  **Perk:** One intrigue perk (*Quick Build:* Criminal Contacts.)
careers.disciple.name: Disciple
careers.disciple.description: |
  You worked in a church, temple, or other religious institution as part of the clergy. In defining your career, think about the following questions:

  - What gods or saints did your institution venerate?
  - What initiation rites did you undergo to get the job?
  - What were your responsibilities as a disciple?
  - How was your institution viewed by members of the local culture?

  You gain the following career benefits:

  **Skills:** The Religion skill (from the lore skill group), plus two more skills from the lore group (*Quick Build:* Culture, Magic, Religion.)

  **Project Points:** 240

  **Perk:** One supernatural perk (*Quick Build:* Ritualist.)
careers.explorer.name: Explorer
careers.explorer.description: |
  You ventured into uncharted areas and made your living as a cartographer, researcher, resource seeker, or treasure hunter. In defining your career, think about the following questions:

  - For what purpose did you explore the unknown?
  - Who else was part of your exploration team?
  - What types of environments did you explore?
  - What legend or rumor did you search for but never found?
  - What is your greatest discovery?

  You gain the following career benefits:

  **Skills:** The Navigate skill (from the exploration skill group), plus two more skills from the exploration group (*Quick Build:* Climb, Heal, Navigate.)

  **Languages:** Two languages

  **Perk:** One exploration perk (*Quick Build:* Wood Wise.)
careers.farmer.name: Farmer
careers.farmer.description: |
  You grew crops or cared for livestock. In defining your career, think about the following questions:

  - Did you own the land you farmed, or did you farm for another?
  - What crops or livestock did you cultivate?
  - Who else worked on the farm with you?
  - What ill omen did you witness that caused you to have a poor season of farming?

  You gain the following career benefits:

  **Skills:** The Handle Animals skill (from the interpersonal skill group), plus two skills from the exploration group (*Quick Build:* Drive, Handle Animals, Lift.)

  **Languages:** One language

  **Project Points:** 120

  **Perk:** One exploration perk (*Quick Build:* Monster Whisperer.)
careers.gladiator.name: Gladiator
careers.gladiator.description: |
  In the past, you entertained the masses with flashy displays of violence in the arena. In defining your career, think about the following questions:

  - What led you to this life of violent entertainment?
  - What was your gladiator name and persona?
  - Who was your biggest rival?
  - What happened during your most famous match?

  You gain the following career benefits:

  **Skills:** Two skills from the exploration skill group (*Quick Build:* Gymnastics, Jump.)

  **Languages:** One language

  **Renown:** +2

  **Perk:** One exploration perk (*Quick Build:* Friend Catapult.)
careers.laborer.name: Laborer
careers.laborer.description: |
  You worked as a farmer, builder, clothes washer, forester, miner, or some other profession engaged in hard manual labor. In defining your career, think about the following questions:

  - What type of manual labor did you do?
  - What important friendship did you make on the job?
  - Where did you go with your coworkers to blow off steam when the job was done?
  - What aspect of the job was most difficult for you?

  You gain the following career benefits:

  **Skills:** The Endurance skill (from the exploration skill group), plus two skills from either the crafting group or the exploration group (*Quick Build:* Blacksmithing, Endurance, Lift.)

  **Languages:** One language

  **Project Points:** 120

  **Perk:** One exploration perk (*Quick Build:* Brawny.)
careers.mages-apprentice.name: Mage's Apprentice
careers.mages-apprentice.description: |
  For long years, you studied magic under the mentorship of a more experienced mage. In defining your career, think about the following questions:

  - Who did you study under, and what kind of person were they?
  - What were your mentor's areas of expertise?
  - What aspects of magic did you struggle to comprehend?
  - What is your current relationship with your mentor?

  You gain the following career benefits:

  **Skills:** The Magic skill (from the lore skill group), plus two other skills from the lore group (*Quick Build:* Magic, Monsters, Timescape.)

  **Languages:** One language

  **Renown:** +1

  **Perk:** One supernatural perk (*Quick Build:* Arcane Trick.)
careers.performer.name: Performer
careers.performer.description: |
  You can sing, act, or dance well enough that people actually pay you to do it. Imagine that! In defining your career, think about the following questions:

  - What is the tone of your performances?
  - What song, role, or dance are you most known for?
  - Did you perform in the same place throughout your career, or did you travel?
  - Were you part of a troupe, or were you a solo act?

  You gain the following career benefits:

  **Skills:** The Music or Perform skill (from the interpersonal skill group), plus two more skills from the interpersonal group (*Quick Build:* Flirt, Music, Perform.)

  **Renown:** +2

  **Perk:** One interpersonal perk (*Quick Build:* Harmonizer.)
careers.politician.name: Politician
careers.politician.description: |
  You worked as a leader within a formal, bureaucratic organization or government. You might have been appointed, born, or elected into your position, but getting people to agree and making decisions for the people you serve (or who served you) was your job. In defining your career, think about the following questions:

  - Who were you responsible for ruling or representing?
  - What was your official title and how did you earn it?
  - Who was your greatest political rival?
  - What secret do you know that could tear apart the entire system you worked within?

  You gain the following career benefits:

  **Skills:** Two skills from the interpersonal skill group (*Quick Build:* Lead, Lie.)

  **Languages:** One language

  **Renown:** +1

  **Wealth:** +1

  **Perk:** One interpersonal perk (*Quick Build:* Engrossing Monologue.)
careers.sage.name: Sage
careers.sage.description: |
  From an early age, you dedicated yourself to learning, whether you shared the knowledge of the world with others or sought out secret lore only for yourself. In defining your career, think about the following questions:

  - What subjects did you study?
  - Where did your studies take place?
  - How did you acquire the books and other materials you needed for work?
  - Who benefited most from your research?

  You gain the following career benefits:

  **Skills:** Two skills from the lore skill group (*Quick Build:* History, Magic.)

  **Languages:** One language

  **Project Points:** 240

  **Perk:** One lore perk (*Quick Build:* Expert Sage.)
careers.sailor.name: Sailor
careers.sailor.description: |
  You worked on a ship, whether a merchant cog, a mercenary or military craft, or a pirate vessel. You might have been a deckhand, a mate, or even the captain. In defining your career, think about the following questions:

  - What is the name of the vessel you sailed on, and what type of business was the crew engaged in?
  - What was your job aboard the ship?
  - What's the longest amount of time you've spent at sea?
  - Who or what did you lose on your maritime journeys?

  You gain the following career benefits:

  **Skills:** Swim (from the exploration skill group), plus two more skills from the exploration group (*Quick Build:* Climb, Gymnastics, Swim.)

  **Languages:** Two languages

  **Perk:** One exploration perk (*Quick Build:* Put Your Back Into It!)
careers.soldier.name: Soldier
careers.soldier.description: |
  In your formative years, you fought tirelessly in skirmishes and campaigns against enemy forces. In defining your career, think about the following questions:

  - In which army and company did you serve?
  - What conflicts were you a part of?
  - What rank did you achieve?
  - What heroics did you perform in the heat of battle?

  You gain the following career benefits:

  **Skills:** One skill from the exploration skill group and one skill from the intrigue group (*Quick Build:* Alertness, Endurance.)

  **Languages:** Two languages

  **Renown:** +1

  **Perk:** One exploration perk (*Quick Build:* Teamwork.)
careers.warden.name: Warden
careers.warden.description: |
  You protected a wild region from those who sought to harm it, such as poachers and cultists bent on the destruction of the natural world. Knowing your land well, you could also serve as a guide or the leader of a rescue party for those wandering the wilds. In defining your career, think about the following questions:

  - What environment did you protect?
  - Were you part of a formal group of wardens or did you take the job upon yourself?
  - Which animal became your constant companion while you worked in the wild?
  - What mysterious creature or wanderer did you meet in the forest, and what prophecy did they share with you?

  You gain the following career benefits:

  **Skills:** Nature (from the lore skill group), plus one skill from the exploration group and one skill from the intrigue group (*Quick Build:* Nature, Navigate, Track.)

  **Languages:** One language

  **Project Points:** 120

  **Perk:** One exploration perk (*Quick Build:* Camouflage Hunter.)
careers.watch-officer.name: Watch Officer
careers.watch-officer.description: |
  You served as an officer of the law for a local government. You might have been a single person in a much larger city watch or the only constable patrolling a small village. In defining your career, think about the following questions:

  - What type of settlement did you protect?
  - What was your law enforcement style like? Were you a by-the-book officer, a more lenient-but-fair type, or totally corrupt?
  - What criminal still eludes your grasp to this day?
  - Whose life did you save in the line of duty?
  - What is the most absurd call you ever responded to and how did you handle it?

  You gain the following career benefits:

  **Skills:** Alertness (from the intrigue skill group), plus two more skills from the intrigue group (*Quick Build:* Alertness, Search, Track.)

  **Languages:** Two languages

  **Perk:** One exploration perk (*Quick Build:* Team Leader.)
cultures.culture.description: "Your hero's culture: the language they grew up speaking and its environment, organization and upbringing, each of which gives a skill."
careers.agent.choices.interpersonal.prompt: 'Agent: interpersonal skill'
careers.agent.choices.intrigue.prompt: 'Agent: intrigue skill'
careers.agent.choices.languages.prompt: 'Agent: 2 languages'
careers.agent.choices.perk.prompt: 'Agent: perk'
careers.agent.choices.incident.prompt: Inciting incident
careers.agent.choices.incident.options.disavowed.name: Disavowed
careers.agent.choices.incident.options.disavowed.description: 'While on a dangerous espionage assignment, things went sideways. Although you escaped with your life, the mission was a public failure thanks to bad information your agency gave you. They denied you work for them, and you went on the run. Hero work will let you survive and clear your name.'
careers.agent.choices.incident.options.faceless.name: Faceless
careers.agent.choices.incident.options.faceless.description: 'Your identity was always hidden. It was your way of protecting those around you because the work you did spying on powerful entities came with dangers. Then your world came crashing down when an enemy agent unmasked you, causing you to lose everything—your privacy, livelihood, loved ones, all gone in the blink of an eye. Instead of going into hiding, you became a public hero to protect the innocent in the name of those you lost.'
careers.agent.choices.incident.options.free-agent.name: Free Agent
careers.agent.choices.incident.options.free-agent.description: 'There was a time in your life when you used to sell information to the highest bidder. Your acts were unsanctioned by any one organization, but you were well-connected enough to trade in secrets. Politics never mattered much to you until the information you sold wound up causing a ripple effect of harm that eventually destroyed the place you once called home. You became a hero to make up for your past.'
careers.agent.choices.incident.options.informed.name: Informed
careers.agent.choices.incident.options.informed.description: 'After years of cultivating a rich list of informants, one of those informants risked everything to expose the heinous plans of powerful individuals. You promised to protect your informant, but your agency left them hanging—literally. You cut ties with your employer and swore to always make good on your word as a hero.'
careers.agent.choices.incident.options.spies-and-lovers.name: Spies and Lovers
careers.agent.choices.incident.options.spies-and-lovers.description: 'While embedded in an undercover assignment, you fell for someone on the other side. They discovered you were a double agent, and though you insisted your feelings were real, the deceit cut too deep for your love interest to ignore. They exposed you, spurned you, or died because of their closeness to you. You left the espionage business to become a hero with nothing to hide.'
careers.agent.choices.incident.options.turncoat.name: Turncoat
careers.agent.choices.incident.options.turncoat.description: 'You spent your life in service of your country or an organization that upheld your values. During your undercover operations, you discovered that everything you had been told was a lie. Whether you confronted your superiors or were exposed, you were stripped of your service medals before you left to become a true hero.'
careers.aristocrat.choices.interpersonal.prompt: 'Aristocrat: interpersonal skill'
careers.aristocrat.choices.lore.prompt: 'Aristocrat: lore skill'
careers.aristocrat.choices.languages.prompt: 'Aristocrat: language'
careers.aristocrat.choices.perk.prompt: 'Aristocrat: perk'
careers.aristocrat.choices.incident.prompt: Inciting incident
careers.aristocrat.choices.incident.options.blood-money.name: Blood Money
careers.aristocrat.choices.incident.options.blood-money.description: "When you entered adulthood, you heard unsavory whispers about your family's fortune before learning that their wealth came at the cost of others' suffering. Whether you shed light on the secret or not, you left to become a hero stripped of noble title."
careers.aristocrat.choices.incident.options.charmed-life.name: Charmed Life
careers.aristocrat.choices.incident.options.charmed-life.description: 'Whether through some supernatural power or your innate persuasiveness, you were able to defraud other aristocrats. You did it for fun. And when you were found out, you lost your status. Whether you served time or escaped punishment, you decided to rehabilitate yourself and became a hero.'
careers.aristocrat.choices.incident.options.inheritance.name: Inheritance
careers.aristocrat.choices.incident.options.inheritance.description: 'The guardians who instilled in you the virtues of doing the right thing were murdered in a senseless petty robbery. Though their wealth was bequeathed to you, it did little to assuage the guilt you felt for being unable to stop the deadly crime. You decided to use your riches to fund your life as a hero, whether publicly or using an alter ego.'
careers.aristocrat.choices.incident.options.privileged-position.name: Privileged Position
careers.aristocrat.choices.incident.options.privileged-position.description: 'Life outside the manor never piqued your interest. You had everything you wanted. It thus came as a surprise when the peasants came to overthrow your family. You narrowly escaped, and for the first time witnessed the world. It caused you to become a hero for the people, fighting against inequities.'
careers.aristocrat.choices.incident.options.royal-pauper.name: Royal Pauper
careers.aristocrat.choices.incident.options.royal-pauper.description: 'Seeking a break from noble duties, you sought a lookalike to switch identities with. It went so well that you made a habit of switching whenever you were bored. Unfortunately, your counterpart became so good at imitating you that they convinced all those around you that you were an impostor. You lost contact with your family, but now pursue a heroic path free of the pomp of your old life.'
careers.aristocrat.choices.incident.options.wicked-secret.name: Wicked Secret
careers.aristocrat.choices.incident.options.wicked-secret.description: 'One parent passed away when you were a baby and the other remarried years later. Then that parent died under suspicious circumstances. Their spouse ousted you, and you were banished (and possibly hunted). Rising from tragedy, you now seek to right the wrongs of the world.'
careers.artisan.choices.skills.prompt: 'Artisan: skills'
careers.artisan.choices.languages.prompt: 'Artisan: language'
careers.artisan.choices.perk.prompt: 'Artisan: perk'
careers.artisan.choices.incident.prompt: Inciting incident
careers.artisan.choices.incident.options.continue-the-work.name: Continue the Work
careers.artisan.choices.incident.options.continue-the-work.description: "A great hero was a fan of the things you created and gave you a generous commission to create your best work for them. While working on this commission, you and the hero became close friends. The day you finished the work was the same day they disappeared. To honor their legacy, you took up the mantle of a hero with the intent of finishing your friend's work."
careers.artisan.choices.incident.options.inspired.name: Inspired
careers.artisan.choices.incident.options.inspired.description: "As you traveled the road selling your wares, troll bandits attacked you. One of the bandits claimed an item belonging to someone precious to you—or perhaps claimed that person's life—but the rest were driven off or slain by a group of heroes. Seeing the quick work those heroes made of the bandits inspired you to follow in their footsteps."
careers.artisan.choices.incident.options.robbery.name: Robbery
careers.artisan.choices.incident.options.robbery.description: 'A criminal gang stole your goods and harmed a number of people who worked for you. You became a hero to prevent such indignities from being visited upon others, to seek revenge for the assault, or to find the thieves and get your stuff back.'
careers.artisan.choices.incident.options.stolen-passions.name: Stolen Passions
careers.artisan.choices.incident.options.stolen-passions.description: 'Your parents discouraged your artistic talents, instead trying to focus your passions on the family business. You refused to dim your spark and continued your work in secret. Enraged at discovering your disobedience, they sold your work to a traveling merchant. You left your hometown, seeking your lost art and encouraging others to live freely.'
careers.artisan.choices.incident.options.tarnished-honor.name: Tarnished Honor
careers.artisan.choices.incident.options.tarnished-honor.description: 'A new patron commissioned some art, but on completion, they refused to pay you and claimed the work as their own. You were accused of plagiarism and run out of town. For you, heroics are about restoring your name and honor.'
careers.artisan.choices.incident.options.twisted-skill.name: Twisted Skill
careers.artisan.choices.incident.options.twisted-skill.description: 'You had great success that caused an unscrupulous rival to curse you. For a time, everything you tried to create turned to ruin. You broke the curse through adventuring, and in doing so, discovered a new joy and purpose that now defines you.'
careers.beggar.choices.exploration.prompt: 'Beggar: exploration skill'
careers.beggar.choices.interpersonal.prompt: 'Beggar: interpersonal skill'
careers.beggar.choices.languages.prompt: 'Beggar: 2 languages'
careers.beggar.choices.perk.prompt: 'Beggar: perk'
careers.beggar.choices.incident.prompt: Inciting incident
careers.beggar.choices.incident.options.champion.name: Champion
careers.beggar.choices.incident.options.champion.description: 'You were never content with your lot. Watching yet another friend fall to preventable circumstances was your last straw. You gathered up what little you had and set off to become a hero, determined to make real change for those society forgot.'
careers.beggar.choices.incident.options.night-terrors.name: Night Terrors
careers.beggar.choices.incident.options.night-terrors.description: "Something killed the other beggars. It came in the night. You barely saw it, but what you did see of it wasn't natural. You survived by hiding, or perhaps it simply passed you over for reasons unknown to you. It still haunts your nightmares, and you kill monsters so no one else has to experience such horrors."
careers.beggar.choices.incident.options.one-good-deed.name: One Good Deed
careers.beggar.choices.incident.options.one-good-deed.description: "You ran afoul of the local watch by being in the wrong place when they were in a bad mood. A passing hero intervened on your behalf, shaming the guards into moving on, then gave you enough gold to get you back on your feet. Their kindness kindled a spark in you. You took the gold, bought some secondhand gear, and went to pay that hero's kindness forward."
careers.beggar.choices.incident.options.precious.name: Precious
careers.beggar.choices.incident.options.precious.description: "No matter how far you'd fallen, there was one belonging you would never part with, no matter how much money it would bring you. When a pickpocket stole that object, you chased them until you were in a part of the city you no longer recognized. With a jolt, you realized you had no desire to return to your previous stomping grounds. You kept going, and you haven't looked back."
careers.beggar.choices.incident.options.strange-charity.name: Strange Charity
careers.beggar.choices.incident.options.strange-charity.description: "A passerby dropped something in your cup. When you counted your day's collections, you found a magic coin among the coppers. You knew immediately that it was special. When the other beggars—your friends, you thought—showed that they were ready to murder you for it, you killed several of them in self-defense before you fled, leaving behind the only semblance of community you had."
careers.beggar.choices.incident.options.witness.name: Witness
careers.beggar.choices.incident.options.witness.description: "You witnessed something you weren't meant to. Others would kill you if they knew, and they might be searching for you even now. You remain on the move, terrified of remaining in one place too long lest it all catch up to you. Perhaps if you make a big enough name for yourself, you can become untouchable and finally speak of what happened without fear."
careers.criminal.choices.skills.prompt: 'Criminal: skills'
careers.criminal.choices.languages.prompt: 'Criminal: language'
careers.criminal.choices.perk.prompt: 'Criminal: perk'
careers.criminal.choices.incident.prompt: Inciting incident
careers.criminal.choices.incident.options.antiquity-procurement.name: Antiquity Procurement
careers.criminal.choices.incident.options.antiquity-procurement.description: "You stole, smuggled, and sold antiquities. In your haste to make a quick sale, you didn't fully vet a client and they subsequently robbed your warehouse. When the items you had stolen were taken from you, you realized the harm you had caused. Now you adventure to find those items you lost and return them to where they belong."
careers.criminal.choices.incident.options.atonement.name: Atonement
careers.criminal.choices.incident.options.atonement.description: 'The last criminal job you pulled led to the death of someone or the destruction of something you love. To make up for the loss you caused, you left your criminal ways behind and became a hero.'
careers.criminal.choices.incident.options.friendly-priest.name: Friendly Priest
careers.criminal.choices.incident.options.friendly-priest.description: "You went to prison for your crimes and eventually escaped. An elderly priest took you in and shielded you from the law, convinced that your soul wasn't corrupt. They never judged you for your past, speaking only of the future. Eventually, the priest died, imparting final words that inspired you to become a hero."
careers.criminal.choices.incident.options.shadowed-influence.name: Shadowed Influence
careers.criminal.choices.incident.options.shadowed-influence.description: 'You spent years blackmailing and manipulating nobles for influence and wealth until a scheme went wrong. You were publicly exposed, and after a narrow escape, you reevaluated your life. Under a new identity, you work as a hero and hope no one looks at your past too closely.'
careers.criminal.choices.incident.options.simply-survival.name: Simply Survival
careers.criminal.choices.incident.options.simply-survival.description: 'Stealing was a matter of survival for you and not what defined you—at least in your mind. But when your thieving actions led to innocent folk being harmed, you knew you could be better. You turned your back on your old life, though your old skills still come in handy.'
careers.criminal.choices.incident.options.stand-against-tyranny.name: Stand Against Tyranny
careers.criminal.choices.incident.options.stand-against-tyranny.description: "When a tyrant rose to power in your homeland, they began cracking down on all criminals with deadly raids and public executions. The nature of the crime didn't matter, with pickpockets and beggars made to kneel before the axe alongside murderers. After losing enough friends, you stood up and joined the resistance—not just against this tyrant, but against authoritarians anywhere."
careers.disciple.choices.skills.prompt: 'Disciple: skills'
careers.disciple.choices.perk.prompt: 'Disciple: perk'
careers.disciple.choices.incident.prompt: Inciting incident
careers.disciple.choices.incident.options.angels-advocate.name: Angel's Advocate
careers.disciple.choices.incident.options.angels-advocate.description: "Swayed by an evil faith, your cult was about to unleash horrors upon the world when an angel (figurative or literal) intervened. They convinced you to stop your cult's plots. Now you follow in the footsteps of the angel who showed you the righteous path."
careers.disciple.choices.incident.options.dogma.name: Dogma
careers.disciple.choices.incident.options.dogma.description: 'Although you joined your religious institution under the guidance of a kind mentor, others within the house of worship became increasingly fanatical in their convictions. Your mentor sought to be a voice of reason in the rising tide of hatred and was tried as a heretic before being executed. Leaving the institution behind, you became a hero to uphold the beliefs you hold dear.'
careers.disciple.choices.incident.options.freedom-to-worship.name: Freedom to Worship
careers.disciple.choices.incident.options.freedom-to-worship.description: "Your temple was destroyed in a religious conflict. The institution's leaders sought retaliation, but you saw in these actions a ceaseless cycle of destruction that would lead to more conflict. Instead, you became a hero to protect religious freedoms, so all worshippers might practice their faith without fear."
careers.disciple.choices.incident.options.lost-faith.name: Lost Faith
careers.disciple.choices.incident.options.lost-faith.description: 'You devoted your life to ministering to the sick and needy, alongside other charitable work. Time and time again, tragedy struck those you served without rhyme or reason. Your prayers went unanswered, and your efforts went thankless. Eventually, you lost your faith in a higher power, and you left your church or temple to do good outside of any religious affiliation.'
careers.disciple.choices.incident.options.near-death-experience.name: Near-Death Experience
careers.disciple.choices.incident.options.near-death-experience.description: 'While serving at a religious institution, you almost died in an accident. When you woke, you had lost all memory of ever having worked for the church or temple. Though the clergy encouraged you to stay, you left to forge a new path. Your sense of altruism—whether instilled in you by your past work or a part of who you naturally are—guides you in your life.'
careers.disciple.choices.incident.options.taxing-times.name: Taxing Times
careers.disciple.choices.incident.options.taxing-times.description: 'The faith-based organization you were once part of became corrupt. It used its status in the community to accumulate wealth through tithes, while its leaders sought political appointments. During a season of drought, the institution stockpiled resources and refused to give aid, resulting in the deaths of many. You became a hero to fight against such corruption and to honor those you lost.'
careers.explorer.choices.skills.prompt: 'Explorer: skills'
careers.explorer.choices.languages.prompt: 'Explorer: 2 languages'
careers.explorer.choices.perk.prompt: 'Explorer: perk'
careers.explorer.choices.incident.prompt: Inciting incident
careers.explorer.choices.incident.options.awakening.name: Awakening
careers.explorer.choices.incident.options.awakening.description: 'In an uncharted area, you awakened some fell horror. You subsequently turned to the life of a hero to put an end to the dread you unleashed and keep other hidden dangers at bay.'
careers.explorer.choices.incident.options.missing-piece.name: Missing Piece
careers.explorer.choices.incident.options.missing-piece.description: "You made an important but dangerous discovery about a treasure or ancient ritual that could spell mass destruction. Then the unthinkable happened when an unscrupulous colleague, spy, or treasure hunter stole your research notes. You're looking for the thief now, and anyone else who might use such discoveries for ill."
careers.explorer.choices.incident.options.nothing-belongs-in-a-museum.name: Nothing Belongs in a Museum
careers.explorer.choices.incident.options.nothing-belongs-in-a-museum.description: "Exploring distant lands to collect valuable artifacts for cultural institutions was once your way of life. But when people died trying to reclaim one of the objects you took, you realized the truth. Your work was part of a larger problem of cultural theft, and the best place for these significant objects wasn't in a museum but with the people who created them. Setting out to return what had been taken and to protect others from theft set you on the path to become a hero."
careers.explorer.choices.incident.options.unschooled.name: Unschooled
careers.explorer.choices.incident.options.unschooled.description: 'You delved into dungeons and far-off places by studying them in books. You were an explorer who never felt the need to experience the dangers your peers did. Then your theory about a lost world cost you your reputation, and gave you the impetus to go on adventures and stand up for those with different ideas.'
careers.explorer.choices.incident.options.wanderlust.name: Wanderlust
careers.explorer.choices.incident.options.wanderlust.description: 'You saw yourself as an observer and operated within a code of conduct. You swore to never interfere with a group by exposing them to your technology, knowledge, or values. But when faced with a moral conundrum, you either broke your code or stood idly by—and suffered the consequences. During this incident, you lost your observation journal but became a hero who refuses to let evil stand unchecked.'
careers.explorer.choices.incident.options.wind-in-your-sails.name: Wind in Your Sails
careers.explorer.choices.incident.options.wind-in-your-sails.description: "As a seafaring explorer, you lived to chart unknown courses. Though travel on the high seas was fraught with danger, the destination was always rewarding in riches, knowledge, or some other meaningful benefit. But your luck ran out when your ship was destroyed by pirates or other enemy forces. Now you've taken to protecting those who seek safe passage while also hoping to avenge your crew."
careers.farmer.choices.skills.prompt: 'Farmer: skills'
careers.farmer.choices.languages.prompt: 'Farmer: language'
careers.farmer.choices.perk.prompt: 'Farmer: perk'
careers.farmer.choices.incident.prompt: Inciting incident
careers.farmer.choices.incident.options.blight.name: Blight
careers.farmer.choices.incident.options.blight.description: 'A horrible blight swept over your homeland, sickening the livestock and causing crops to rot. No one knows whether the blight is of natural origin or something more malevolent, but you set out in search of a way to cleanse the land of this affliction.'
careers.farmer.choices.incident.options.bored.name: Bored
careers.farmer.choices.incident.options.bored.description: "You've always wanted so much more than gathering eggs and milking cows. You kept a secret journal of your dreams, filled with all the things you wanted. When your parent found the journal, they burned it and told you to keep your head out of the clouds. In response, you gathered what you could in a pack and left everything else behind, seeking a life of adventure."
careers.farmer.choices.incident.options.cursed.name: Cursed
careers.farmer.choices.incident.options.cursed.description: "While tilling your fields, you found something in the dirt. Perhaps it was a chipped and dented weapon, a piece of ancient jewelry, or something altogether unique. Excited by your find, you showed it to a loved one, but when they touched it, something happened. You now know it was a curse conveyed by the item, though you don't know why it affected them and not you. You left your old life in search of answers."
careers.farmer.choices.incident.options.hard-times.name: Hard Times
careers.farmer.choices.incident.options.hard-times.description: 'Your farm had always been prosperous, until the last few years. Changes in the weather caused smaller yields until you could no longer pay your tithe to the local noble. Her soldiers took what items of value they found, including a precious family heirloom. You left the struggling farm behind to find a better life.'
careers.farmer.choices.incident.options.razed.name: Razed
careers.farmer.choices.incident.options.razed.description: "Your animals were killed, your crops and home set ablaze. The culprits might have been wandering bandits, raiders from a nearby kingdom, or hired thugs sent by a rival farm. Whoever they were, they left you with nothing. You couldn't face the thought of starting again from scratch, so you took up a life of heroism to protect others from such villainy."
careers.farmer.choices.incident.options.stolen.name: Stolen
careers.farmer.choices.incident.options.stolen.description: 'Your family bred horses—beautiful creatures that few could rival on the track and in the jousting lists. When a local noble arrived with an offer to buy your prized stallion, your father refused. The noble struck him down where he stood and stole the horse. Without that stallion, the renowned bloodline would end. You intend to get them back—and get revenge.'
careers.gladiator.choices.skills.prompt: 'Gladiator: skills'
careers.gladiator.choices.languages.prompt: 'Gladiator: language'
careers.gladiator.choices.perk.prompt: 'Gladiator: perk'
careers.gladiator.choices.incident.prompt: Inciting incident
careers.gladiator.choices.incident.options.betrayed.name: Betrayed
careers.gladiator.choices.incident.options.betrayed.description: "A local crime lord offered you money to throw your last bout, promising that you'd live through the ordeal and get a cut of all the wagers placed on the match. You upheld your end of the deal—which made the knife in your back after the bout so surprising. You woke in a shallow grave, barely alive, and ready to mete out justice."
careers.gladiator.choices.incident.options.heckler.name: Heckler
careers.gladiator.choices.incident.options.heckler.description: 'As you stood victorious on the arena sands, a voice cried out among the cheering. "This violence is only for show. You should be ashamed. There are people who need you—who need your skills!" Why did that voice ring so clear? And why did it sound so familiar? You never saw the face of the person who uttered those words, but they weighed heavy on you. The next day, you fled the arena to begin a hero''s life.'
careers.gladiator.choices.incident.options.joined-the-arena.name: Joined the Arena
careers.gladiator.choices.incident.options.joined-the-arena.description: 'As a child, you loved gladiatorial matches, captivated by the fierce displays of bravery and bravado, never giving much thought to how the competitors ended up in the ring. Then your friend was wrongly accused of a crime and sentenced to compete. You went in their place. After viewing what life was like for those forced to fight, you survived your sentence and resolved to protect the unfairly condemned.'
careers.gladiator.choices.incident.options.new-challenges.name: New Challenges
careers.gladiator.choices.incident.options.new-challenges.description: 'You earned every title you could. You beat every opponent willing to face you in the arena. Your final battle with your rival ended with you victorious—and still you were unsatisfied. Other, greater foes are out there. And you mean to find them.'
careers.gladiator.choices.incident.options.scions-compassion.name: Scion's Compassion
careers.gladiator.choices.incident.options.scions-compassion.description: 'You were born a noble, but the duplicitous and power-hungry nature of your family had you seeking your own fortune in the arena. You saw that competitors brought there by circumstance and not choice suffered. You gave all you could of your family money to those less fortunate folk, and then set out to make a real difference in this cruel world.'
careers.gladiator.choices.incident.options.warriors-home.name: Warriors' Home
careers.gladiator.choices.incident.options.warriors-home.description: 'The orphanage you grew up in secretly supplied gladiators to the arena. Forced to fight against many childhood friends as an adult, you vowed to dismantle the arena and free other victims. You became a liberator, dedicated to ending the oppression of others until your dying breath.'
careers.laborer.choices.skills.prompt: 'Laborer: skills'
careers.laborer.choices.languages.prompt: 'Laborer: language'
careers.laborer.choices.perk.prompt: 'Laborer: perk'
careers.laborer.choices.incident.prompt: Inciting incident
careers.laborer.choices.incident.options.deep-sentinel.name: Deep Sentinel
careers.laborer.choices.incident.options.deep-sentinel.description: "Spending your days cleaning and maintaining the sewers doesn't make you many friends. But you found companionship among the rats. You fought the monsters that hunted your friends, and which others ignored. After making the sewers safe for the rats, you decided to take your talents to the surface and serve other humanoids who might appreciate your efforts in the same way."
careers.laborer.choices.incident.options.disaster.name: Disaster
careers.laborer.choices.incident.options.disaster.description: "A disaster, such as a cave-in, wildfire, or tidal wave, hit the work crew you were in charge of. You saved as many as you could, but the ones you couldn't save weigh heavily on your mind. You took up the life of a hero to save as many people as possible, vowing that what happened to you then won't happen again."
careers.laborer.choices.incident.options.embarrassment.name: Embarrassment
careers.laborer.choices.incident.options.embarrassment.description: "A noble you worked for admonished you publicly for work done poorly—and more than once. Finally, you'd had enough. You vowed to take up a new path and show this noble you're far more than what they make you out to be."
careers.laborer.choices.incident.options.live-the-dream.name: Live the Dream
careers.laborer.choices.incident.options.live-the-dream.description: "You worked with a good friend, and on the job, you would always fantasize about what it would be like to hit the road as adventuring heroes... someday. You didn't expect that your friend would fall ill and pass away. Now it's time to live out that dream for both of you."
careers.laborer.choices.incident.options.shining-light.name: Shining Light
careers.laborer.choices.incident.options.shining-light.description: "You kept a lighthouse along the constantly stormy cliffs of your village with your mentor. On a clear and sunny day, your mentor vanished. Finding only a cryptic notebook filled with his musings on the supernatural, you left to find out what really happened. The trail has gone cold for now, and you're helping others find their loved ones in the meantime."
careers.laborer.choices.incident.options.slow-and-steady.name: Slow and Steady
careers.laborer.choices.incident.options.slow-and-steady.description: 'You labored silently as an uncaring boss drove those around you into the ground, pushing you to work harder to lessen the burden on your companions. But when the boss pushed too far and killed a friend of yours, you led an uprising against them. That was the start of your adventuring life.'
careers.mages-apprentice.choices.skills.prompt: "Mage's Apprentice: skills"
careers.mages-apprentice.choices.languages.prompt: "Mage's Apprentice: language"
careers.mages-apprentice.choices.perk.prompt: "Mage's Apprentice: perk"
careers.mages-apprentice.choices.incident.prompt: Inciting incident
careers.mages-apprentice.choices.incident.options.forgotten-memories.name: Forgotten Memories
careers.mages-apprentice.choices.incident.options.forgotten-memories.description: 'While practicing a spell, your inexperience caused the magic to backfire and your memories were wiped, leaving you with only fragments of who you once were. Determined to recall your past, you now dedicate yourself to helping others, hoping your actions will spark some remembrance or lead you to a way to reverse the magic.'
careers.mages-apprentice.choices.incident.options.magic-of-friendship.name: Magic of Friendship
careers.mages-apprentice.choices.incident.options.magic-of-friendship.description: "As a sign of your status as a star pupil, your mentor gifted you a familiar as a magic pet. Another jealous apprentice captured the familiar and slipped away in the night. Haunted by your pet's absence, you adventure to find your kidnapped friend and prevent others from feeling your loss."
careers.mages-apprentice.choices.incident.options.missing-mage.name: Missing Mage
careers.mages-apprentice.choices.incident.options.missing-mage.description: "One day you woke up and the mage you worked for was gone. They didn't take any of their belongings and there was no sign of any foul play-only the scent of sulfur in their bedchamber. You set out on your heroic journey in the aftermath and have been looking for them ever since."
careers.mages-apprentice.choices.incident.options.nightmares-made-flesh.name: Nightmares Made Flesh
careers.mages-apprentice.choices.incident.options.nightmares-made-flesh.description: 'Your attempts at magic have always been unpredictable. A powerful mage promised to help you gain control. During your training, a terrible nightmare caused your body to flare with magic and pull the monster of your nightmare into the waking world. The horror escaped. You left, seeking to vanquish their vileness.'
careers.mages-apprentice.choices.incident.options.otherworldly.name: Otherworldly
careers.mages-apprentice.choices.incident.options.otherworldly.description: "While studying magic, you accidentally sent yourself from your original world to this one. Now you're stranded here, hoping to find ancient texts or powerful magic treasures that might transport you back home. A life of adventure it is!"
careers.mages-apprentice.choices.incident.options.ultimate-power.name: Ultimate Power
careers.mages-apprentice.choices.incident.options.ultimate-power.description: "The mage you worked for was a kindly old soul, but the basic magic they taught you always seemed like a small part of something bigger. It wasn't until you met an adventuring elementalist that you realized hitting the road as a hero was the only way to truly improve and hone your skills. You resigned your apprenticeship and found yourself walking the path of a hero the next day."
careers.performer.choices.art.prompt: 'Performer: Music or Perform'
careers.performer.choices.skills.prompt: 'Performer: skills'
careers.performer.choices.perk.prompt: 'Performer: perk'
careers.performer.choices.incident.prompt: Inciting incident
careers.performer.choices.incident.options.cursed-audience.name: Cursed Audience
careers.performer.choices.incident.options.cursed-audience.description: "During a performance, you watched in horror as the audience was suddenly overcome by a curse that caused them to disintegrate before your eyes. You aren't sure what happened, but seeking an answer quickly led you to places where only heroes dare to go."
careers.performer.choices.incident.options.false-accolades.name: False Accolades
careers.performer.choices.incident.options.false-accolades.description: 'After a poor performance, you found a script to a wellwritten play left in your dressing room. The accompanying note asked that if you performed the play, you should give the author credit. But after a commanding performance, you claimed to be star and playwright both and the curse hidden on those pages activated. A small portion of your skin has begun to transform into undead flesh, and the only cure is to prove you have become selfless.'
careers.performer.choices.incident.options.fame-and-fortune.name: Fame and Fortune
careers.performer.choices.incident.options.fame-and-fortune.description: 'You thought you were famous—then that hero came to your show. Suddenly, all eyes were on the dragon-slaying brute instead of on the stage where they belonged. The audience even gave them a standing ovation when they entered the room. All you got was polite applause. Fine. If people want a hero so much, then a hero you shall be.'
careers.performer.choices.incident.options.songs-to-the-dead.name: Songs to the Dead
careers.performer.choices.incident.options.songs-to-the-dead.description: 'Your performances have always been tinged with a bit of melancholy. During a particularly soulful performance, spirits disturbed the living audience and sat in their chairs. They begged you to prevent their demise, providing no other details before disappearing. You set out to determine if you could help your most dedicated fans.'
careers.performer.choices.incident.options.speechless.name: Speechless
careers.performer.choices.incident.options.speechless.description: "A heckler's mocking words left you utterly speechless during a performance, stinging your pride and stirring your arrogance. The incident strained your legendary voice, and you could speak only in soft whispers. The heckler was a fey trickster who stole your voice, promising to give it back after you accomplished real good in the world."
careers.performer.choices.incident.options.tragic-lesson.name: Tragic Lesson
careers.performer.choices.incident.options.tragic-lesson.description: 'When a producer who once shortchanged you shouted out on the street for you to stop a thief who had picked their pocket, your spite toward them inspired you to let the thief run right on by. But that decision led to tragedy when the thief later harmed someone you loved. From that moment on, you made it your responsibility to protect others.'
careers.politician.choices.skills.prompt: 'Politician: skills'
careers.politician.choices.languages.prompt: 'Politician: language'
careers.politician.choices.perk.prompt: 'Politician: perk'
careers.politician.choices.incident.prompt: Inciting incident
careers.politician.choices.incident.options.diplomatic-immunity.name: Diplomatic Immunity
careers.politician.choices.incident.options.diplomatic-immunity.description: 'Your political power allowed you to be foolish without consequence. Through sheer carelessness or on a dare, you accidentally harmed or killed an innocent bystander. Due to your position as an official, you faced no consequences. But this event was the final straw for the person you loved or respected most, and they turned away from you. You left the world of political machinations behind to earn back their trust.'
careers.politician.choices.incident.options.insurrectionist.name: Insurrectionist
careers.politician.choices.incident.options.insurrectionist.description: 'You secretly funded a rebel organization intent on overthrowing the corrupt establishment. Someone discovered your treason, and you were forced to flee or risk execution. You became a hero to live and fight another day on behalf of those who have no power.'
careers.politician.choices.incident.options.respected-consul.name: Respected Consul
careers.politician.choices.incident.options.respected-consul.description: 'You were a seneschal to a leader, able to sway their opinions. But gossip convinced the leader you were plotting a coup, and you were ousted from their circle of influence. You became a hero to continue your work making meaningful change in the world.'
careers.politician.choices.incident.options.right-side-of-history.name: Right Side of History
careers.politician.choices.incident.options.right-side-of-history.description: 'You tried to work on policy change from the inside of a bureaucratic organization. There were others like you who were more vocal. You started to notice those colleagues were disappearing overnight. Not wanting to find out if you were next on the list, you left to enact change in more direct ways.'
careers.politician.choices.incident.options.self-serving.name: Self-Serving
careers.politician.choices.incident.options.self-serving.description: 'You used your skills to collect incriminating or scandalous information about your opponents to blackmail them. A rival got one step ahead of you and stole your book of dirty secrets. But instead of using it against you, they gave you an opportunity to leave the world of politics behind. Saved from public humiliation, you now use your skills for the greater good.'
careers.politician.choices.incident.options.unbound.name: Unbound
careers.politician.choices.incident.options.unbound.description: 'The red tape required to achieve anything through your political position resulted in a crisis being mishandled and countless people harmed or killed. After that unfortunate event, you resolved to live unfettered by bureaucratic interference, seeking to do good through action, not paperwork.'
careers.sage.choices.skills.prompt: 'Sage: skills'
careers.sage.choices.languages.prompt: 'Sage: language'
careers.sage.choices.perk.prompt: 'Sage: perk'
careers.sage.choices.incident.prompt: Inciting incident
careers.sage.choices.incident.options.bookish-ideas.name: Bookish Ideas
careers.sage.choices.incident.options.bookish-ideas.description: "You were always content to live a peaceful life in your library, until you found that one book—the one that told the tale of heroes who had saved the timescape. They didn't spend their days behind a desk. They made a real difference. It was time for you to do the same."
careers.sage.choices.incident.options.cure-the-curse.name: Cure the Curse
careers.sage.choices.incident.options.cure-the-curse.description: "You used to think knowledge could fix everything. You were wrong. When someone you loved fell under a curse, the means to cure them couldn't be found in any of the books you owned. But that wasn't going to stop you. The answers are out there, and you'll find them even if you have to face down death to do so."
careers.sage.choices.incident.options.lost-library.name: Lost Library
careers.sage.choices.incident.options.lost-library.description: "An evil mage took all your books for themself, cackling at your impotence as they raided your shelves. Now, you're off to search through ancient ruins and secret libraries to rebuild your collection of rare tomes and to find the mage who stole from you."
careers.sage.choices.incident.options.paper-guilt.name: Paper Guilt
careers.sage.choices.incident.options.paper-guilt.description: 'While transcribing ancient texts, you and another scribe discovered a shelf of long-forgotten books. At your suggestion, your companion started work on one and vanished along with the tome. Your guilt drove you to seek out your still-missing friend and prevent others from falling to similar dangers.'
careers.sage.choices.incident.options.unforeseen-futures.name: Unforeseen Futures
careers.sage.choices.incident.options.unforeseen-futures.description: 'In your pursuit of ancient knowledge, you discovered a prophecy that has yet to come to pass. And that prophecy involves someone who might be... you. Since your discovery, strange dreams have plagued you, driving you to seek out your destiny.'
careers.sage.choices.incident.options.vanishing.name: Vanishing
careers.sage.choices.incident.options.vanishing.description: 'At first you thought it was your imagination, and you brushed off the disappearance of random sentences in historical books. Then as the books changed to entirely blank pages, the disappearances became difficult to ignore, particularly those involving ancient or critical text. Driven by the desire to preserve knowledge, you have made it your purpose to restore and reverse those vanishing texts before they forever disappear.'
careers.sailor.choices.skills.prompt: 'Sailor: skills'
careers.sailor.choices.languages.prompt: 'Sailor: 2 languages'
careers.sailor.choices.perk.prompt: 'Sailor: perk'
careers.sailor.choices.incident.prompt: Inciting incident
careers.sailor.choices.incident.options.alone.name: Alone
careers.sailor.choices.incident.options.alone.description: "You joined up with your best friend, sibling, or other loved one, the culmination of a lifelong dream to sail the high seas together. When they died, you lost your taste for the seafaring life. You left at the first opportunity and haven't looked back since."
careers.sailor.choices.incident.options.deserter.name: Deserter
careers.sailor.choices.incident.options.deserter.description: "It was in the middle of a pirate raid (whether you were part of it or targeted by it) that you realized you no longer yearned for a sailor's life. You used the chaos of the moment to slip away unnoticed. You now work as a hero in an effort to either end the piracy of others or atone for your past deeds, but you fear the day your old crew finds you and punishes you for your desertion."
careers.sailor.choices.incident.options.forgotten.name: Forgotten
careers.sailor.choices.incident.options.forgotten.description: "You awoke aboard your ship with no memory of who you were. Though the other sailors insisted they knew you, you didn't know them. The next time you went ashore, you decided to stay, determined to find out who you really are."
careers.sailor.choices.incident.options.jealousy.name: Jealousy
careers.sailor.choices.incident.options.jealousy.description: 'You had the favor of your captain, which earned you many rivals aboard your ship. One night, your fellow sailors pulled you from your bunk and threw you overboard. By some miracle, you were scooped from the waters by a passing vessel. You worked off your debt to them, then set out on a new life involving less pettiness.'
careers.sailor.choices.incident.options.marooned.name: Marooned
careers.sailor.choices.incident.options.marooned.description: 'There was a mutiny, and you were on the losing side. You were marooned on an island and escaped when a merchant vessel was blown off course by a storm and found you. Your reputation is ruined among sailors, so you seek adventure elsewhere.'
careers.sailor.choices.incident.options.water-fear.name: Water Fear
careers.sailor.choices.incident.options.water-fear.description: "A catastrophic storm hit while you were at sea, destroying your ship and leaving you as the only survivor. Once you recovered, you tried to sign on with another ship, but the thought of the open water turned your legs to jelly. Instead, you've taken on the role of a traveling hero to make ends meet."
careers.soldier.choices.exploration.prompt: 'Soldier: exploration skill'
careers.soldier.choices.intrigue.prompt: 'Soldier: intrigue skill'
careers.soldier.choices.languages.prompt: 'Soldier: 2 languages'
careers.soldier.choices.perk.prompt: 'Soldier: perk'
careers.soldier.choices.incident.prompt: Inciting incident
careers.soldier.choices.incident.options.dishonorable-discharge.name: Dishonorable Discharge
careers.soldier.choices.incident.options.dishonorable-discharge.description: 'You enlisted in the military to protect others, but your commander ordered you to beat and kill civilians. When you refused, things got violent. You barely escaped the brawl that ensued, but now you vow to help people on your own terms.'
careers.soldier.choices.incident.options.out-of-retirement.name: Out of Retirement
careers.soldier.choices.incident.options.out-of-retirement.description: 'You had a long and storied career as a soldier before deciding to retire to a simpler life. But when you returned to your old home, you found your enemies had laid waste to it. Now the skills you earned on the battlefield are helping you as you become a different kind of warrior one seeking to save others from the fate you suffered.'
careers.soldier.choices.incident.options.peace-through-healing.name: Peace Through Healing
careers.soldier.choices.incident.options.peace-through-healing.description: 'Living with constant bloodshed took its toll on you. You seek peace through healing and have dedicated yourself to ending wars before they begin, to spare those around you from the horror.'
careers.soldier.choices.incident.options.sole-survivor.name: Sole Survivor
careers.soldier.choices.incident.options.sole-survivor.description: 'You were the last surviving member of your unit after an arduous battle or monstrous assault, surviving only through luck. You turned away from the life of a soldier then, seeking to become a hero who could stand against such threats.'
careers.soldier.choices.incident.options.stolen-valor.name: Stolen Valor
careers.soldier.choices.incident.options.stolen-valor.description: 'Tired of eking out an existence on the streets, you enrolled in the military. However, you were unable to escape your lower-status background until the officer leading your unit fell in battle. In the chaos that ensued, you assumed their identity and returned home a hero. But when suspicion arose, you took on the life of an adventurer, staying always on the move.'
careers.soldier.choices.incident.options.vow-of-sacrifice.name: Vow of Sacrifice
careers.soldier.choices.incident.options.vow-of-sacrifice.description: "You promised a fellow soldier that you'd protect his family if he ever fell in battle. When he did, you traveled to his village, but found its people slain or scattered by war. Driven by your vow, you have dedicated your life to finding any survivors and protecting others from a similar fate."
careers.warden.choices.exploration.prompt: 'Warden: exploration skill'
careers.warden.choices.intrigue.prompt: 'Warden: intrigue skill'
careers.warden.choices.languages.prompt: 'Warden: language'
careers.warden.choices.perk.prompt: 'Warden: perk'
careers.warden.choices.incident.prompt: Inciting incident
careers.warden.choices.incident.options.betrayed.name: Betrayed
careers.warden.choices.incident.options.betrayed.description: 'When outsiders arrived in your lands with the intent to exploit the wilds for their resources, you spoke out against them. However, several other wardens spoke in favor of these outsiders, and allowed them in to despoil nature. Refusing to watch your homeland destroyed, you left. Now you help others avoid such a fate.'
careers.warden.choices.incident.options.corruption.name: Corruption
careers.warden.choices.incident.options.corruption.description: "A disease has infected the lands you protect, causing animals to become violent and twisting plants into something sinister. You've tried everything, magical and mundane, to stop the scourge, but it continues to spread. As such, you've set out in search of a cure or an unblighted land to protect."
careers.warden.choices.incident.options.exiled.name: Exiled
careers.warden.choices.incident.options.exiled.description: 'You made a mistake that could not be forgiven. The other wardens of the region decided your fate, exiling you from your lands with an order never to return.'
careers.warden.choices.incident.options.honor-the-fallen.name: Honor the Fallen
careers.warden.choices.incident.options.honor-the-fallen.description: 'A group of heroes arrived in your territory with trouble close on their heels. You fought alongside them to turn back the evil, but it was too much. The heroes fell, and your wilderness was forever altered. Though your lands are beyond saving, there are other lands you can help.'
careers.warden.choices.incident.options.portents.name: Portents
careers.warden.choices.incident.options.portents.description: "There were signs. You tried to ignore them, but when a great beast died at your feet, you had to recognize the truth. You were meant to leave your home territory, meant to fight a battle for the fate of all lands—and so you gave up the only life you've ever known."
careers.warden.choices.incident.options.theft.name: Theft
careers.warden.choices.incident.options.theft.description: "You were responsible for guarding something precious, something vital to your region's survival. But you let someone in, and they betrayed your trust by stealing the thing you were meant to guard. You left your chosen territory to atone for your mistake."
careers.watch-officer.choices.skills.prompt: 'Watch Officer: skills'
careers.watch-officer.choices.languages.prompt: 'Watch Officer: 2 languages'
careers.watch-officer.choices.perk.prompt: 'Watch Officer: perk'
careers.watch-officer.choices.incident.prompt: Inciting incident
careers.watch-officer.choices.incident.options.bigger-fish.name: Bigger Fish
careers.watch-officer.choices.incident.options.bigger-fish.description: "You grew bored and disillusioned with chasing down petty thieves and imprisoning folks just trying to survive. Surely there are greater threats in the world. You will find that evil wherever it may lurk, and you'll be the one to stop it."
careers.watch-officer.choices.incident.options.corruption-within.name: Corruption Within
careers.watch-officer.choices.incident.options.corruption-within.description: "You joined the force to help the helpless and bring justice to those wronged. You weren't prepared for the rampant corruption reaching the top of your organization. You refused to cover for your fellow officers and were told in no uncertain terms to leave town or face the consequences. Now you travel as a hero, acting as the protector you always wanted to be."
careers.watch-officer.choices.incident.options.frame-job.name: Frame Job
careers.watch-officer.choices.incident.options.frame-job.description: "Your partner was murdered. That much is irrefutable. But you didn't do it, despite what the evidence implies. When it became clear you'd take the fall, you fled, leaving everything behind. Not content to cower in the shadows, you decided to adventure under a new name while you work to clear your own."
careers.watch-officer.choices.incident.options.missing-mentor.name: Missing Mentor
careers.watch-officer.choices.incident.options.missing-mentor.description: 'You learned everything you know about the job from someone you always looked up to in a corrupt organization. One night, they sent you a cryptic message saying they had discovered "something big," but before you could find out more, they disappeared. No longer sure who you could trust, you slipped away and sought a new life. Now you do what good you can and search to find the truth.'
careers.watch-officer.choices.incident.options.one-that-got-away.name: One That Got Away
careers.watch-officer.choices.incident.options.one-that-got-away.description: 'A violent or depraved criminal began targeting you—perhaps stealing something personal or hurting someone you love—after slipping through your grasp. You left your career to pursue the criminal, but the trail has gone cold... for now. Might as well help folk in the meantime.'
careers.watch-officer.choices.incident.options.powerful-enemies.name: Powerful Enemies
careers.watch-officer.choices.incident.options.powerful-enemies.description: "You made it your responsibility to root out and bring down the region's foremost crime syndicate. They sent goons to burn down your home and teach you a lesson, leaving you bleeding in the street with nothing left except your life. You've since taken on the life of a hero to gain the power and influence you need to destroy the syndicate once and for all."
