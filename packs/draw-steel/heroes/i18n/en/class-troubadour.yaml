features.troubadour.applause.name: Applause
features.troubadour.applause.description: >-
  You have an epic resource called applause. Each time you finish a respite, you gain applause equal
  to the XP you gain. You can spend applause on your abilities as if it were drama.


  Additionally, whenever you or a creature within 3 squares would obtain a failure or a tier 1
  outcome on a test, you can spend 1 applause to improve the outcome by 1 tier.


  Applause remains until you spend it.
features.troubadour.dramaturgy.name: Dramaturgy
features.troubadour.dramaturgy.description: You gain 1 additional drama or other Heroic Resource
  whenever you use your Appeal to the Muses feature. Additionally, your performances no longer have
  a distance, but can affect any target on the encounter map within your line of effect.
features.troubadour.greatest-of-all-time.name: Greatest of All Time
features.troubadour.greatest-of-all-time.description: Whenever you obtain a success on a test, each
  NPC within your line of effect has their Impression score decreased by 4 during a negotiation (to
  a minimum of 1), and each ally within 3 squares of you gains an edge on their next test. These
  effects last until you start your next respite.
features.troubadour.acrobatics.name: Acrobatics
features.troubadour.acrobatics.description: You have the following performance ability, which is usable with your Routines feature.
features.troubadour.blocking.name: Blocking
features.troubadour.blocking.description: You have the following performance ability, which is usable with your Routines feature.
features.troubadour.drama-outside-of-combat.name: Drama Outside of Combat
features.troubadour.drama-outside-of-combat.description: >-
  Though you can't gain drama outside of combat, you can use your heroic abilities and effects that
  cost drama without spending it. Whenever you use an ability or effect outside of combat that costs
  drama, you can't use that same ability or effect outside of combat again until you earn 1 or more
  Victories or finish a respite.


  When you use an ability outside of combat that lets you spend unlimited drama on its effect, such
  as Artful Flourish, you can use it as if you had spent an amount of drama equal to your Victories.


  > **The Auteur Troubadour**

  >

  > Abilities like Guest Star, Missed Cue, and Twist at the End allow the auteur to rewrite bits of
  what happens in the battle by temporarily removing creatures from an encounter, bringing people
  back to life, or causing a new ally to appear. These abilities and features are no more powerful
  than any other, but they're narratively different from shooting rays of fire or swinging a sword.

  >

  > This is because, uniquely among all the subclasses in *Draw Steel*, the auteur knows that the
  combat encounter playing out at your table is really a story being told sometime later, probably
  in a tavern.

  >

  > When the auteur uses these abilities, they are changing that story. They rewrite stories to make
  them more dramatic in the telling. What *actually* happened is a matter of some debate. Even the
  people who were there don't agree on exactly what took place. How people *remember* it is what's
  important!

  >

  > This is pretty weird, but also very fun. If it's too weird for you or your table, you could
  always interpret those abilities as a kind of magic. A school of conjuring that really does change
  the battlefield, which the auteur merely *flavors* as rewriting the story.
features.troubadour.drama-in-combat.name: Drama in Combat
features.troubadour.drama-in-combat.description: >-
  At the start of a combat encounter or some other stressful situation tracked in combat rounds (as
  determined by the Director), you gain drama equal to your Victories. At the start of each of your
  turns during combat, you gain 1d3 drama.


  Additionally, you gain drama when certain events occur during a combat encounter:


  - The first time three or more heroes use an ability on the same turn, you gain 2 drama.

  - The first time any hero is made winded during the encounter, you gain 2 drama.

  - Whenever a creature within your line of effect rolls a natural 19 or 20, you gain 3 drama.

  - When you or another hero dies, you gain 10 drama.


  When you are dead, you continue to gain drama during combat as long as your body is intact. If you
  have 30 drama during the encounter in which you died, you can come back to life with 1 Stamina and
  0 drama (no action required). If you are still dead after the encounter in which you died, you
  can't gain drama during future encounters.


  You lose any remaining drama at the end of the encounter.
features.troubadour.dramatic-monologue.name: Dramatic Monologue
features.troubadour.dramatic-monologue.description: You have the following ability.
features.troubadour.power-chord.name: Power Chord
features.troubadour.power-chord.description: You have the following ability.
features.troubadour.routines.name: Routines
features.troubadour.routines.description: >-
  You enter every battle with a set of performance abilities at the ready. Performances are magical
  presentations (such as songs, dances, poems, or gymnastic feats) that your allies can participate
  in. These abilities have the Performance keyword. At the start of each combat round, as long as
  you are not dazed, dead, or surprised, you can either choose a new performance or maintain your
  current performance (no action required). Your performance lasts until you are unable to maintain
  it or until the end of the encounter.


  You start off with the Choreography and Revitalizing Limerick performance abilities. Your choice
  of class act grants you additional performances.
features.troubadour.scene-partner.name: Scene Partner
features.troubadour.scene-partner.description: >-
  Whenever you obtain a success on a test to interact with an NPC using a skill from the
  interpersonal group, you can form a bond with that NPC. When you enter into a negotiation with a
  bonded NPC, their patience increases by 1 (to a maximum of 5). Additionally, the first time during
  a negotiation that you personally make an argument that would increase a bonded NPC's interest by
  1, you instead increase their interest by 2 (to a maximum of 5).


  You can have a number of bonds active equal to your level. When you form a bond with a new NPC
  that would exceed the limit, you must choose which of your active bonds to lose.
features.troubadour.star-power.name: Star Power
features.troubadour.star-power.description: You have the following ability.
features.troubadour.troubadour-class-act.name: Troubadour Class Act
features.troubadour.troubadour-class-act.description: >-
  Panache, melody, and depiction. Some troubadours have it all, but everyone starts somewhere. Your
  troubadour class act is your art form, summing up the manner in which the world becomes your
  stage. As you go about unearthing the drama of everyday life and strife, you choose a troubadour
  class act from the following options, each of which grants you a skill. (*Quick Build:* Virtuoso.)


  - **Auteur:** You seek drama from story and recount, using your magic to manipulate the sequence
  of events unfolding before you. You have the Brag skill.

  - **Duelist:** Drama infuses your every movement done in tandem with another. You perform dances
  of death, putting trust in your opponent to return your passion in kind. You have the Gymnastics
  skill.

  - **Virtuoso:** You find drama in music and song, weaving magic between vibrations and filling the
  audience with your pathos. You have the Music skill and can play an instrument.


  Your troubadour class act is your subclass, and your choice of class act determines many of the
  features you'll gain as you gain new levels.
features.troubadour.virtuoso-performances.name: Virtuoso Performances
features.troubadour.virtuoso-performances.description: You have the following performance abilities, which are usable with your Routines feature.
features.troubadour.allow-me-to-introduce-tonights-players.name: Allow Me to Introduce Tonight's Players
features.troubadour.allow-me-to-introduce-tonights-players.description: Whenever you take the first
  turn in a combat encounter, you can use a main action to introduce yourself and your allies to
  your opponents. Each ally can shift up to their speed, and ability rolls made against them have a
  double bane until the end of the combat round. Additionally, any surprised enemy is no longer
  surprised.
features.troubadour.appeal-to-the-muses.name: Appeal to the Muses
features.troubadour.appeal-to-the-muses.description: >-
  You can give a rousing speech, invoke your inspirations, or lift your fellows' spirits, appealing
  to the muses to heighten a battle's drama. However, irony is eager to hand your fortune to the
  villain to achieve the same end.


  Before you roll to gain drama at the start of your turn, you can make your appeal (no action
  required). If you do, your roll gains the following additional effects:


  - If the roll is a 1, you gain 1 additional drama. The Director gains 1d3 Malice (see *[Draw
  Steel: Monsters](https://mcdm.gg/DS-Monsters)*).

  - If the roll is a 2, you gain 1 Heroic Resource, which you can keep or give to an ally within the
  distance of your active performance. The Director gains 1 Malice.

  - If the roll is a 3, you gain 2 of a Heroic Resource, which you can distribute among yourself and
  any allies within the distance of your active performance.
features.troubadour.formal-introductions.name: Formal Introductions
features.troubadour.formal-introductions.description: >-
  As a respite activity, you can scribe a notice of your arrival (such as a calling card or a formal
  letter) addressed to an enemy. You can deliver the notice to the target personally if you are in
  the same general area, send it by courier, or leave it in a covert location for the target to
  find. You can have only one notice active at a time.


  The Director determines when the target receives your notice. When the target receives the notice,
  they become alarmed and take desperate measures to stop you. The Director gains 1 additional
  Malice per combat round during encounters involving the target. The heroes start each such
  encounter with 2 additional hero tokens (Chapter 1: The Basics). These hero tokens disappear at
  the end of the encounter.
features.troubadour.my-reputation-precedes-me.name: My Reputation Precedes Me
features.troubadour.my-reputation-precedes-me.description: >-
  You can invoke your reputation at the start of a social interaction with one or more NPCs who
  haven't met you before, automatically creating a bond with one of those NPCs from that group as if
  using your Scene Partner feature (above). This bond counts against the limit on active bonds from
  your Scene Partner feature. While the bond is active, all heroes present treat their Renown as 2
  higher than usual for the purpose of entering into a negotiation with the bonded NPC.


  The Director can award the heroes 1 hero token to make you infamous among the group of creatures
  instead, and preventing you from forming this bond. Until you take action to improve your
  reputation, all heroes present take a bane on tests made to interact with creatures in the group
  using skills from the interpersonal skill group. You can still use your Scene Partner feature to
  find allies within the group.
features.troubadour.foil.name: Foil
features.troubadour.foil.description: At the start of an encounter, choose one creature within your
  line of effect. You have a double edge on power rolls made against or in competition with that
  creature. The chosen creature also has a double edge on power rolls made against or in competition
  with you. If the chosen creature is reduced to 0 Stamina, you can choose a new foil at the start
  of the next combat round.
features.troubadour.missed-cue.name: Missed Cue
features.troubadour.missed-cue.description: If you aren't surprised at the start of an encounter,
  you can choose one enemy within your line of effect who is not a leader or solo creature. The
  Director temporarily removes the chosen creature from the encounter. The chosen creature enters
  the encounter at the start of the second combat round. You must earn 3 Victories before you can
  use this feature again.
features.troubadour.second-album.name: Second Album
features.troubadour.second-album.description: You have the following performance abilities, which are usable with your Routines feature.
features.troubadour.melodrama.name: Melodrama
features.troubadour.melodrama.description: >-
  You have more ways of getting the most drama out of a situation. Choose two of the following
  events to add to the events that grant you drama during battle:


  - Whenever a creature rolls a natural 2 on a power roll, you gain 2 drama.

  - The first time the Director deals damage to a hero using a Villain action or an ability that
  costs Malice, you gain 2 drama.

  - The first time a hero unwillingly falls 5 or more squares, you gain 2 drama.

  - The first time a hero deals damage with 3 surges, you gain 2 drama.

  - Whenever a hero spends their last Recovery, you gain 2 drama.


  Alternatively, you can forgo choosing a new event to choose one event you already have (including
  an event gained with this feature). Whenever the chosen event grants you drama, you gain 1
  additional drama.
features.troubadour.zeitgeist.name: Zeitgeist
features.troubadour.zeitgeist.description: >-
  You always have your ear to the ground, your finger on the pulse. When you start or finish a
  respite, choose one of the following effects.


  ##### Foreshadowing


  You can ask the Director for two clues regarding an upcoming encounter or negotiation. One of the
  clues can be false.


  ##### Hear Ye, Hear Ye!


  By bragging, intimidating, leading, or lying, you attempt to spread one piece of information into
  the local area. Make a Presence test:


  - **≤11:** Your information reaches no one.

  - **12-16:** Your information reaches the nearest populated area of town size or larger. You and
  each ally present when you make the test gain an edge on Presence tests in that area until one of
  you spends a Recovery.

  - **17+:** Your information reaches the nearest populated area of town size or larger, plus the
  next closest such population. You and allies present for your test gain an edge on Presence tests
  made in those areas until you start your next respite.


  ##### Latest Goss


  You can ask the Director for three rumors regarding the area you're in or an area you plan on
  entering before your next respite. One of the rumors can be false.
features.troubadour.bolstering-banter.name: Bolstering Banter
features.troubadour.bolstering-banter.description: Once on each of your turns, you can use a free
  maneuver to exchange words with a target of your current performance, other than yourself. The
  target can spend a Recovery to gain temporary Stamina equal to their recovery value.
features.troubadour.fix-it-in-post.name: Fix It in Post
features.troubadour.fix-it-in-post.description: 'Once on each of your turns, you can use a free
  maneuver to change one condition affecting a creature within distance of your Dramatic Monologue
  ability. Choose one of the following conditions on the target: bleeding, frightened, prone,
  slowed, or taunted. You change that condition to another of those conditions, maintaining the
  duration and origin of the original condition. A target who is no longer prone can stand up.'
features.troubadour.medley.name: Medley
features.troubadour.medley.description: You can maintain two performances at a time using your Routines feature.
features.troubadour.take-two.name: Take Two!
features.troubadour.take-two.description: You have the following performance ability, which is usable with your Routines feature.
features.troubadour.verbal-duel.name: Verbal Duel
features.troubadour.verbal-duel.description: Once on each of your turns while the target of your
  Foil feature is adjacent to you, you can use a free maneuver to exchange words with them. Make an
  opposed Presence test with the target. Whoever gets the higher result can make a free strike,
  which deals psychic damage instead of its usual damage.
features.troubadour.we-cant-be-upstaged.name: We Can't Be Upstaged!
features.troubadour.we-cant-be-upstaged.description: You have the following performance ability, which is usable with your Routines feature.
features.troubadour.spotlight.name: Spotlight
features.troubadour.spotlight.description: You have the following performance ability, which is usable with your Routines feature.
features.troubadour.a-muses-muse.name: A Muse's Muse
features.troubadour.a-muses-muse.description: At the start of each of your turns during combat, you gain 1d3 + 1 drama instead of 1d3.
features.troubadour.equal-billing.name: Equal Billing
features.troubadour.equal-billing.description: >-
  You can use your Scene Partner feature to form a bond with one willing hero instead of an NPC you
  interact with using a test. If you bond with another hero, you lose your existing bond with a
  hero.


  Additionally, you and creatures you are bonded with gain a +1 bonus to saving throws. Whenever you
  or a bonded creature succeeds on a saving throw, you and each creature you are bonded with gains
  temporary Stamina equal to your level.
features.troubadour.crowd-favorites.name: Crowd Favorites
features.troubadour.crowd-favorites.description: You have the following performance abilities, which are usable with your Routines feature.
features.troubadour.deleted-scene.name: Deleted Scene
features.troubadour.deleted-scene.description: Whenever a creature within distance of your Dramatic
  Monologue ability makes a power roll, you can spend 1 drama as a free triggered action to use
  Dramatic Monologue, targeting only one creature.
features.troubadour.masterwork.name: Masterwork
features.troubadour.masterwork.description: >-
  Choose one of your signature abilities and name it after yourself. You always have this ability
  available, even if it is sourced from a kit you switch out. Whenever you use this ability, you
  gain an edge and 1 surge that you can use only on this ability.


  Additionally, when your named signature ability is the last ability you use in an encounter, you
  can immediately use the Hear Ye, Hear Ye! effect of your Zeitgeist feature to tell tales of your
  exploits after the encounter ends.
features.troubadour.roar-of-the-crowd.name: Roar of the Crowd
features.troubadour.roar-of-the-crowd.description: >-
  You are empowered by your audience, near and far. You can't be made frightened, and if you are
  prone, you can stand up as a free maneuver.


  Additionally, whenever you spend a Recovery, you can forgo regaining Stamina to invoke the roar of
  an invisible applauding audience. You and each ally within 3 squares of you gains temporary
  Stamina equal to 10 + the number of active bonds from your Scene Partner feature + either your
  Victories or the number of players in your game (whichever is higher).
subclasses.troubadour.auteur.name: Auteur
subclasses.troubadour.duelist.name: Duelist
subclasses.troubadour.virtuoso.name: Virtuoso
classes.troubadour.name: Troubadour
classes.troubadour.description: >-
  The whole world's a stage, and everyone on it, an actor. No one knows this better than the
  troubadour. You find energy in the drama of everyday life and know how to draw spectacle forth
  from even the most mundane of situations. You accent highs and deepen lows in service to whoever
  might witness your performance.


  **As a troubadour, you chase drama. The insurmountable dangers of the world might cause many a
  hero to cower. But you take to that world stage not intending to die, but to find out if you are
  truly alive.**


  "History is a tale. Each of us is just a story we tell ourselves. Change the story, and you change
  the world." **Jackson Bootblack**
