features.elementalist.breath.name: Breath
features.elementalist.breath.description: >-
  You have an epic resource called breath. Each time you finish a respite, you gain breath equal to
  the XP you gain. You can spend any number of breath to gain essence (no action required). When you
  do, 1 breath becomes 3 essence.


  Breath remains until you convert it to essence.
features.elementalist.essential-being.name: Essential Being
features.elementalist.essential-being.description: When you gain essence at the start of each of
  your turns during combat, you gain 4 essence instead of 3.
features.elementalist.master-of-earth.name: Master of Earth
features.elementalist.master-of-earth.description: >-
  You have damage immunity 5.


  Additionally, as a respite activity, you can shape the mundane earth around you in a 1-mile
  radius. You can open sinkholes, form mountains, level mundane structures or whole settlements,
  create canyons, raise islands or sink them in the sea, and perform similar feats. You can't use
  this respite activity if another creature within 1 mile is already using it. Once you use this
  respite activity, you can't use it again for 10 days.
features.elementalist.master-of-fire.name: Master of Fire
features.elementalist.master-of-fire.description: >-
  The damage bonus of your Acolyte of Fire feature increases to +5 and applies to all your magic
  abilities.


  Additionally, your Return to Formlessness ability can be used on supernatural objects (but not on
  artifacts). When you melt a treasure (see Chapter 13: Rewards), you gain breath equal to its
  echelon.
features.elementalist.master-of-green.name: Master of Green
features.elementalist.master-of-green.description: >-
  The number of Recoveries you have increases by 2, and each time you finish a respite, you can
  grant each ally who finished the respite with you 2 additional Recoveries. Your allies' additional
  Recoveries disappear when they finish their next respite.


  Additionally, as a respite activity, you can perform a ritual that causes a fruit tree to spring
  from the ground, grow, mature, and produce 1d6 of a treasure called Life Fruit. You can use a
  respite activity to cause an existing tree to produce another 1d6 Life Fruit, but it does not grow
  these magic consumables on its own.


  As a maneuver, a creature can consume a Life Fruit or feed it to an adjacent willing ally. When a
  creature eats a Life Fruit, they restore all their Stamina, they can end all conditions or effects
  on themself, and they can stand up if prone. Additionally, if the creature desires, their aging
  pauses for 1d10 years. If the creature eats additional Life Fruit and chooses to pause their
  aging, the effects don't stack. Instead, the creature gains the benefit from the Life Fruit that
  pauses their aging for the longest time.
features.elementalist.master-of-void.name: Master of Void
features.elementalist.master-of-void.description: >-
  Whenever you willingly move, you can teleport.


  Additionally, your mind is connected to the mystery and helps you find the answers you seek. You
  no longer require project sources for research projects. Whenever you use a respite activity to
  make a project roll for a research project, you automatically complete the project.
features.elementalist.a-beyonding-of-vision.name: A Beyonding of Vision
features.elementalist.a-beyonding-of-vision.description: >-
  You instantly recognize illusions for what they are, you can see invisible creatures, and
  supernatural effects can't conceal creatures and objects from you. Additionally, you always know
  if an area or object you observe is magical or affected by magic, and you know the specifics of
  what that magic can do.


  You also gain the Shared Void Sense ability.
features.elementalist.acolyte-of-earth.name: Acolyte of Earth
features.elementalist.acolyte-of-earth.description: You harness the flow of earth magic to become
  harder to move. Whenever you use an ability that has the Earth and Magic keywords, your stability
  increases by 1 until the start of your next turn. This benefit is cumulative.
features.elementalist.enchantment-of-battle.name: Enchantment of Battle
features.elementalist.enchantment-of-battle.description: >-
  You can wear light armor and wield light weapons effectively, even though you don't have a kit.
  While you wear light armor, you gain a +3 bonus to Stamina, and that bonus increases by 3 at 4th,
  7th, and 10th levels. While you wield a light weapon, you gain a +1 damage bonus with weapon
  abilities, including free strikes. You can use light armor treasures and light weapon treasures.


  If you have a kit, you can't take this enchantment.
features.elementalist.enchantment-of-celerity.name: Enchantment of Celerity
features.elementalist.enchantment-of-celerity.description: You gain a +1 bonus to speed and to the
  distance you can shift when you take the Disengage move action.
features.elementalist.enchantment-of-destruction.name: Enchantment of Destruction
features.elementalist.enchantment-of-destruction.description: You gain a +1 bonus to rolled damage with magic abilities.
features.elementalist.enchantment-of-distance.name: Enchantment of Distance
features.elementalist.enchantment-of-distance.description: You have a +2 bonus to the distance of your ranged magic abilities.
features.elementalist.enchantment-of-permanence.name: Enchantment of Permanence
features.elementalist.enchantment-of-permanence.description: You gain a +6 bonus to Stamina, and
  this bonus increases by 6 at 4th, 7th, and 10th levels. Additionally, you gain a +1 bonus to
  stability.
features.elementalist.essence.name: Essence
features.elementalist.essence.description: >-
  You channel the substance of creation in the form of a Heroic Resource called essence, gathering
  and burning it to cast and maintain spells.


  **Essence in Combat.** At the start of a combat encounter or some other stressful situation
  tracked in combat rounds (as determined by the Director), you gain essence equal to your
  Victories. At the start of each of your turns during combat, you gain 2 essence.


  Additionally, the first time each combat round that you or a creature within 10 squares takes
  damage that isn't untyped or holy damage, you gain 1 essence.


  You lose any remaining essence at the end of the encounter.


  **Essence Outside of Combat.** Though you can't gain essence outside of combat, you can use your
  heroic abilities and effects that cost essence without spending it. Whenever you use an ability or
  effect outside of combat that costs essence, you can't use that same ability or effect outside of
  combat again until you earn 1 or more Victories or finish a respite.


  When you use a persistent ability outside of combat (see Persistent Magic below), you can maintain
  it for a number of rounds equal to your Victories.


  When you use an ability outside of combat that lets you spend unlimited essence on its effect, you
  can use it as if you had spent an amount of essence equal to your Victories.
features.elementalist.acolyte-of-fire.name: Acolyte of Fire
features.elementalist.acolyte-of-fire.description: You become an expert at wielding destructive
  flames. Your abilities that have the Fire and Magic keywords gain a +1 bonus to rolled damage.
  Your Hurl Element ability (see below) also gains this bonus when you use it to deal fire damage.
features.elementalist.acolyte-of-the-green.name: Acolyte of the Green
features.elementalist.acolyte-of-the-green.description: You harness the residual magic from your
  green spells to bolster yourself and your allies. Whenever you deal damage to one or more
  creatures using an ability that has the Green and Magic keywords and that costs essence to use
  (see below), you or one creature within 10 squares of you gains temporary Stamina equal to your
  Reason score.
features.elementalist.hurl-element.name: Hurl Element
features.elementalist.hurl-element.description: You have the Hurl Element ability, which can be used as a ranged free strike.
features.elementalist.it-is-the-soul-which-hears.name: It Is the Soul Which Hears
features.elementalist.it-is-the-soul-which-hears.description: >-
  You can speak with and understand animals, beasts, and plant creatures, even if they don't share a
  language with you. Your ability to communicate with these creatures doesn't make them inherently
  more intelligent, but you can use Reason instead of Presence while making tests to influence them.


  Additionally, you can touch a living plant that is not a plant creature to communicate with it
  telepathically. You can use words to communicate with the plant, but it communicates with you only
  by transmitting feelings and sensations that can't be overly specific.
features.elementalist.persistent-magic.name: Persistent Magic
features.elementalist.persistent-magic.description: >-
  Some of your heroic abilities have a persistent effect entry. For example, the Instantaneous
  Excavation ability has an effect noted as "Persistent 1." Whenever you use a persistent ability,
  you decide whether you want to maintain it, and start doing so immediately after you first use the
  ability. If you maintain a persistent ability in combat, you reduce the amount of essence you earn
  at the start of your turn by an amount equal to the ability's persistent value, which enables the
  ability's persistent effect. All your active persistent abilities end at the end of the encounter.


  You can't maintain any abilities that would make you earn a negative amount of essence at the
  start of your turn. You can stop maintaining an ability at any time (no action required).


  If you maintain the same ability on several targets and the effect includes a power roll, you make
  that roll once and apply the same effect to all targets. A creature can't be affected by multiple
  instances of a persistent ability.


  If you take damage equal to or greater than 5 times your Reason score in one turn, you stop
  maintaining any persistent abilities. For instance, if you have a Reason score of 2 and are
  maintaining Instantaneous Excavation, taking 10 or more damage in one turn causes you to stop
  maintaining the ability.
features.elementalist.acolyte-of-the-mystery.name: Acolyte of the Mystery
features.elementalist.acolyte-of-the-mystery.description: You use your immersion in the mystery of
  void magic to expand the reach of that magic better than other mages. The distance of all your
  abilities that have the Magic, Ranged, and Void keywords increases by 2 squares.
features.elementalist.ward-of-delightful-consequences.name: Ward of Delightful Consequences
features.elementalist.ward-of-delightful-consequences.description: A protective field of void magic
  absorbs violence aimed at you, then lets you hurl it back at your enemies. The first time each
  round that you take damage, you gain 1 surge.
features.elementalist.ward-of-excellent-protection.name: Ward of Excellent Protection
features.elementalist.ward-of-excellent-protection.description: You weave a shield of all the
  elements around yourself, channeling their full protective power. You have immunity to acid, cold,
  corruption, fire, lightning, poison, or sonic damage equal to your Reason score.
features.elementalist.ward-of-natures-affection.name: Ward of Nature's Affection
features.elementalist.ward-of-natures-affection.description: The green energy writhing within your
  body allows you to produce powerful vines when you're in danger. Whenever a creature within a
  number of squares equal to your Reason score deals damage to you, you can use a free triggered
  action to slide that creature up to a number of squares equal to your Reason score.
features.elementalist.ward-of-surprising-reactivity.name: Ward of Surprising Reactivity
features.elementalist.ward-of-surprising-reactivity.description: You use the magic of fire to create
  a ward of explosive energy. Whenever an adjacent creature deals damage to you, you can use a free
  triggered action to push that creature up to a number of squares equal to twice your Reason score.
features.elementalist.disciple-of-earth.name: Disciple of Earth
features.elementalist.disciple-of-earth.description: Your body is strengthened by your mind's
  connection to the element of permanence. You have a +6 bonus to Stamina, and you gain an
  additional +3 bonus to Stamina whenever you gain a level past 2nd.
features.elementalist.disciple-of-fire.name: Disciple of Fire
features.elementalist.disciple-of-fire.description: >-
  Your connection to fire allows you to protect yourself from it, even as you rip away the
  protections of others. You have fire immunity equal to 5 plus your level. Additionally, fire
  damage you deal ignores a target's fire immunity.


  At the start of a combat encounter, you gain a number of surges equal to your Victories. Whenever
  you spend a surge to deal extra damage, you can make that damage fire damage.
features.elementalist.disciple-of-the-green.name: Disciple of the Green
features.elementalist.disciple-of-the-green.description: |-
  You can use a maneuver to shapeshift into a type of creature on the Green Animal Forms table. While in animal form, you can speak, and you use your Reason score to make melee free strikes. Your statistics stay the same except as noted on the table.

  Each form has a prerequisite level that you must attain before you can adopt it. Some animal forms grant you temporary Stamina. You lose this temporary Stamina when you revert back to your true form.

  You choose a specific animal and appearance while in animal form. For example, if you become a rodent, you might become a mouse, a rat, a shrew, or any other size 1T animal who fits the rodent type. When you take on an animal form, your equipment either melds into your new form or falls undamaged to the ground (your choice). When you return to your true form, any melded gear reappears on your person.

  You can revert back to your true form as a maneuver. You can't enter an animal form unless you are in your true form. When you are dying, you revert to your true form and can't turn back into an animal until you are no longer dying.

  ###### Green Animal Forms Table

  | Animal Type           | Level | Temporary Stamina | Speed         | Size | Stability Bonus | Melee Damage Bonus | Special                                                                                                                                                                                                                                                                               |
  | --------------------- | ----- | ----------------- | ------------- | ---- | --------------- | ------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | Canine                | 2nd   | 5                 | 7             | 1M   | +0              | +1/+1/+1           | You gain an edge on tests that involve smell.                                                                                                                                                                                                                                         |
  | Fish                  | 2nd   | 0                 | 5 (swim only) | 1T   | +0              | +0/+0/+0           | You can breathe in water but can't breathe outside of it.                                                                                                                                                                                                                             |
  | Rodent                | 2nd   | 0                 | 5 (climb)     | 1T   | +0              | +0/+0/+0           | You gain an edge on tests that involve smell.                                                                                                                                                                                                                                         |
  | Bird                  | 3rd   | 0                 | 5 (fly)       | 1T   | +0              | +0/+0/+0           | -                                                                                                                                                                                                                                                                                     |
  | Great cat             | 3rd   | 5                 | 6 (climb)     | 2    | +0              | +1/+1/+1           | As a maneuver, you can jump up to 3 squares in any direction. If you land on  an enemy of your size or smaller, that enemy is knocked prone, and you can  make a melee free strike against them (no action required).                                                         |
  | Giant frog            | 4th   | 5                 | 5 (swim)      | 2    | +0              | +0/+0/+0           | Your melee free strike has a distance of melee 3. When you take the Advance  move action, you can high jump or long jump up to half your speed. This  jump can allow you to move more squares than your speed.                                                                |
  | Horse                 | 4th   | 5                 | 8             | 2    | +1              | +0/+0/+0           | You can use the Charge main action as a maneuver. You can't use two Charge  main actions on the same turn.                                                                                                                                                                        |
  | Mohler                | 4th   | 0                 | 7 (burrow)    | 1S   | +1              | +0/+0/+0           | Your melee distance gains a +1 bonus.                                                                                                                                                                                                                                                 |
  | Bear                  | 5th   | 10                | 5 (climb)     | 2    | +1              | +2/+2/+2           | Your melee distance gains a +1 bonus.                                                                                                                                                                                                                                                 |
  | Giant bird            | 5th   | 0                 | 7 (fly)       | 2    | +0              | +1/+1/+1           | After making a melee free strike, you can shift up to 3 squares as a free  triggered action.                                                                                                                                                                                      |
  | Giant  salamander | 6th   | 5                 | 5             | 1L   | +3              | +2/+2/+2           | Your melee free strike deals fire damage. Additionally, you have fire immunity  3.                                                                                                                                                                                                |
  | Giant spider          | 6th   | 0                 | 5 (climb)     | 2    | +0              | +0/+1/+2           | You have a double edge on melee free strikes against creatures you are hidden  from.                                                                                                                                                                                              |
  | Giant snake           | 7th   | 5                 | 5             | 3    | +0              | +0/+1/+2           | Whenever you obtain a tier 2 or tier 3 outcome on a melee free strike, you  can automatically grab the target. While grabbed this way, the target takes 2  damage at the start of each of their turns.                                                                        |
  | Kangaroo              | 7th   | 0                 | 7             | 1L   | +1              | +0/+0/+4           | When you score a critical hit with a melee free strike, the target is dazed (save  ends). When you take the Advance move action, you can high jump or long  jump up to half your speed. This jump can allow you to move more squares  than your speed.                    |
  | Spiny armadillo       | 7th   | 10                | 5             | 1M   | +2              | +0/+0/+0           | Whenever you take damage from an adjacent creature's melee ability, that  creature takes 3 damage.                                                                                                                                                                                |
  | Ostrich               | 8th   | 0                 | 10            | 2    | +0              | +1/+1/+1           | Your movement does not provoke opportunity attacks.                                                                                                                                                                                                                                   |
  | Shark                 | 8th   | 0                 | 8 (swim only) | 2    | +0              | +2/+2/+2           | You can breathe in water but can't breathe outside of it. Additionally, you gain  an edge on strikes against targets who are bleeding or winded.                                                                                                                                  |
  | Giant octopus         | 9th   | 5                 | 5 (swim)      | 3    | +2              | +0/+0/+0           | You can breathe in water. Additionally, you can target two creatures or objects  with your melee free strike. Whenever you obtain a tier 2 or tier 3 outcome on  a melee free strike, you can automatically grab the target. You can have up to  eight creatures grabbed. |
  | Rhinoceros            | 9th   | 10                | 8             | 2    | +5              | +2/+2/+2           | Whenever you make a melee free strike as part of the Charge action, that  strike gains an edge.                                                                                                                                                                                   |
  | King terror lizard    | 10th  | 20                | 5             | 4    | +3              | +2/+2/+2           | Your melee free strike is a 1 burst with the Area and Strike keywords.                                                                                                                                                                                                                |
features.elementalist.a-conversation-with-fire.name: A Conversation With Fire
features.elementalist.a-conversation-with-fire.description: When you spend 1 uninterrupted minute in
  front of a fire, you can speak the name of another creature. If that creature is willing to speak
  to you, their image appears in the fire, and they can see you before them in a shimmering ball of
  light. The two of you can speak to each other through these images as if you were together in
  person. As a maneuver, you or the creature can end the conversation.
features.elementalist.distance-is-only-memory.name: Distance Is Only Memory
features.elementalist.distance-is-only-memory.description: Each time you finish a respite, you can
  open a two-way portal that leads to any place you have previously been. You and your allies can
  pass through the portal, which remains open for 1 hour or until you dismiss it as a main action.
features.elementalist.burning-grounds.name: Burning Grounds
features.elementalist.burning-grounds.description: At the end of each of your turns, each enemy in
  the area takes fire damage equal to your Reason score.
features.elementalist.flowering-bed.name: Flowering Bed
features.elementalist.flowering-bed.description: At the end of each of your turns, each ally in the
  area gains temporary Stamina equal to your Reason score.
features.elementalist.font-of-essence.name: Font of Essence
features.elementalist.font-of-essence.description: The first time each combat round that you or a
  creature within 10 squares takes damage that isn't untyped or holy damage, you gain 2 essence
  instead of 1.
features.elementalist.mantle-of-essence.name: Mantle of Essence
features.elementalist.mantle-of-essence.description: >-
  While you have 3 or more essence and are not dying, you exude an aura of magic whose distance is
  equal to your Reason score. The effects within the area of the aura are based on your
  specialization, as shown on the Mantle of Essence Specialization Effects table. You can activate
  and deactivate the aura at will (no action required).


  ###### Mantle of Essence Specialization Effects Table


  | Specialization | Feature         |

  | -------------- | --------------- |

  | Earth          | Quaking Earth   |

  | Fire           | Burning Grounds |

  | Green          | Flowering Bed   |

  | Void           | Veiling Bed     |
features.elementalist.quaking-earth.name: Quaking Earth
features.elementalist.quaking-earth.description: At the end of each of your turns, you can push each
  enemy in the area up to a number of squares equal to your Reason score.
features.elementalist.veiling-bed.name: Veiling Bed
features.elementalist.veiling-bed.description: The area provides concealment for you and your allies.
features.elementalist.hide-of-tenfold-shields.name: Hide of Tenfold Shields
features.elementalist.hide-of-tenfold-shields.description: >-
  Your animal forms become hardier. You gain temporary Stamina equal to your level when you enter an
  animal form in combat, which is added to any temporary Stamina provided by the animal form.


  Additionally, an adjacent ally can use a maneuver to pet you. If they do so, you can lose
  temporary Stamina down to a minimum of 0. The ally gains temporary Stamina equal to the amount you
  lost.
features.elementalist.pierce-the-veil-of-substance.name: Pierce the Veil of Substance
features.elementalist.pierce-the-veil-of-substance.description: >-
  Solidity is merely a suggestion to you. Mundane barriers that are 1 square thick or less do not
  block your senses or line of effect. You can only sense or have line of effect past one such
  barrier at a time.


  Additionally, whenever you use a void ability, you or one ally within distance of the ability can
  teleport a number of squares equal to your Reason score.
features.elementalist.smoldering-step.name: Smoldering Step
features.elementalist.smoldering-step.description: >-
  You can use 1 square of movement to walk into an area of fire your size or larger and teleport to
  any other area of fire your size or larger within 10 squares of the first area.


  Additionally, whenever you use a fire ability or are targeted by an ability that deals fire
  damage, each enemy adjacent to you takes fire damage equal to your Reason score.
features.elementalist.the-mountain-does-not-move.name: The Mountain Does Not Move
features.elementalist.the-mountain-does-not-move.description: >-
  You stand firm and magnetize your allies to stay grounded. Your stability increases by your level.


  Additionally, whenever an ally within distance of your Hurl Element ability is force moved, you
  can use a free triggered action to decrease your stability down to a minimum of 0, then increase
  the ally's stability by an amount equal to the stability you lost. This change lasts until the end
  of the round.
features.elementalist.wyrding.name: Wyrding
features.elementalist.wyrding.description: >-
  You can spend 10 uninterrupted minutes to create a freeform magic spell for a variety of
  situations. Choose one of the following magical effects:


  - You create a mundane object of a size equal to your Reason score or smaller.

  - You construct a place of shelter suitable for twenty creatures that lasts for 24 hours and can't
  be detected by enemies.

  - You restore all Stamina to a mundane object of a size equal to your Reason score or smaller.

  - Choose a cube with a size up to your Reason score within 5 squares. You can fill that area with
  difficult terrain or natural phenomena such as fire, water, or plant life, or can clear the area
  of those things.

  - You can preserve a corpse or up to 5 pounds of food for a week, or can cause a corpse or that
  amount of food to instantly rot.

  - You create a seal on a surface that can't be seen or felt by anyone but you. When a creature
  comes adjacent to the surface, you can see and hear through the seal for as long as the creature
  remains adjacent to it. When you create the seal, you can decide to limit the number of creatures
  who activate it by choosing a creature keyword (such as Undead) or a specific name (such as Ajax
  the Invincible) or organization (such as the Black Iron Pact). If you do, the seal alerts you only
  when creatures with the keyword, name, or organizational affiliation you provide pass by it. If
  you create a second seal, the first one disappears. You can dispel a seal at any time (no action
  required).
features.elementalist.mantle-of-quintessence.name: Mantle of Quintessence
features.elementalist.mantle-of-quintessence.description: >-
  Your Mantle of Essence feature no longer requires essence.


  Additionally, your Mantle of Essence now radiates magic that creates a calming air. Creatures in
  the area of the mantle's aura have their starting patience increased by 1 (to a maximum of 5)
  during any negotiation. While in the area, you and any ally gain an edge on tests that use the
  Handle Animals skill. If you have 5 or more Victories, the bonus to patience increases to 2 and
  tests that use the Handle Animals skill have a double edge.
features.elementalist.surging-essence.name: Surging Essence
features.elementalist.surging-essence.description: When you gain essence at the start of each of
  your turns during combat, you gain 3 essence instead of 2.
features.elementalist.black-hole-star.name: Black Hole Star
features.elementalist.black-hole-star.description: >-
  You warp gravity around your heavenly body and can pull even the sturdiest titans toward your
  core. At the end of each of your turns, you target one creature or object within distance of your
  Hurl Element ability and vertical pull that target up to 5 squares. If their stability reduces
  this forced movement, they are pulled a minimum of 2 squares. This forced movement ignores
  stability for your allies.


  Additionally, your Mantle of Essence improves. While in the area of the aura, enemies and objects
  have their stability reduced by an amount equal to your level.
features.elementalist.chimeric-manifestation.name: Chimeric Manifestation
features.elementalist.chimeric-manifestation.description: >-
  Nature isn't static and unchanging, and neither are you. You can enter or exit your animal form as
  a free maneuver the first time you use your Disciple of the Green feature on your turn.


  Additionally, whenever you use your Disciple of the Green feature, you can select an additional
  animal form and gain the positive benefits from both forms. You can choose the size of either
  animal, and if both animal forms grant you the same benefit, you can choose whichever you prefer.
  You gain the highest speed between the two animal forms and have all types of movement from both
  forms.


  You can only combine animal forms whose levels add up to 12 or less. For example, you can combine
  a shark (8th level) with a horse (4th level), but you can't combine a shark with a bear (5th
  level).
features.elementalist.the-flame-primordial.name: The Flame Primordial
features.elementalist.the-flame-primordial.description: >-
  You produce a fire that entrances the fates, distracting them from aiding your foes. Whenever you
  deal fire damage to a creature or object, they take an extra 1d6 fire damage. If you deal fire
  damage to a mundane object, you can use a free triggered action to target it with your Return to
  Formlessness ability instead.


  Additionally, any enemy who starts their turn adjacent to you has fire weakness equal to your
  Reason score until the start of their next turn. This increases to twice your Reason score if the
  enemy is made of or is wearing mostly metal.
features.elementalist.grand-wyrding.name: Grand Wyrding
features.elementalist.grand-wyrding.choices.immunity.prompt: Immunity all (with 5 or more Victories)
features.elementalist.grand-wyrding.choices.immunity.options.acid.name: Acid
features.elementalist.grand-wyrding.choices.immunity.options.cold.name: Cold
features.elementalist.grand-wyrding.choices.immunity.options.corruption.name: Corruption
features.elementalist.grand-wyrding.choices.immunity.options.fire.name: Fire
features.elementalist.grand-wyrding.choices.immunity.options.lightning.name: Lightning
features.elementalist.grand-wyrding.choices.immunity.options.poison.name: Poison
features.elementalist.grand-wyrding.choices.immunity.options.sonic.name: Sonic
features.elementalist.grand-wyrding.description: >-
  You have mastered the magic of shaping a wyrd, and can use your Wyrding feature as a main action.


  Additionally, when you have 5 or more Victories, choose one of the following damage types: acid,
  cold, corruption, fire, lightning, poison, or sonic. You have immunity all to that type.
subclasses.elementalist.earth.name: Earth
subclasses.elementalist.fire.name: Fire
subclasses.elementalist.green.name: Green
subclasses.elementalist.void.name: Void
classes.elementalist.name: Elementalist
classes.elementalist.description: >-
  Air for movement. Earth for permanence. Fire for destruction. Water for change. Green for growth.
  Rot for death. Void for the mystery that which cannot be known. Years of study and practice and
  poring over tomes brought you the revelations that allow you to manipulate these building blocks
  of reality. Now you use your mastery of the seven elements to destroy, create, and warp the world
  with magic.


  **As an elementalist, you can unleash your wrath across a field of foes, debilitate enemies, ward
  yourself and allies, manipulate terrain, warp space, and more. Your elemental specialization
  determines which of these talents you excel at.**


  > "Understanding the mystery, requires ignorance of the mystery."

  >

  > **Embers**
classes.elementalist.choices.subclass.prompt: Elementalist subclass
subclasses.elementalist.earth.description: Earth is the element of permanence. Earth abilities
  bolster your body and grant the power to permanently create and shape physical terrain.
subclasses.elementalist.fire.description: Fire is the element of destruction. Fire abilities
  devastate enemies and melt objects to slag.
subclasses.elementalist.green.description: Green is the element of creation and growth. Green
  abilities make and manipulate plants, fungi, and other forms of life to hamper foes and nourish
  your allies.
subclasses.elementalist.void.description: Void is the element of the mystery. Void abilities warp
  space and reality, allowing you to teleport, create illusions, and make things incorporeal.
