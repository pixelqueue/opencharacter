abilities.talent.entropic-bolt.name: Entropic Bolt
abilities.talent.entropic-bolt.description: "*You advance an enemy's age for a moment.*"
abilities.talent.entropic-bolt.texts.target: One creature or object
abilities.talent.entropic-bolt.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.entropic-bolt.texts.roll: Power Roll + Presence
abilities.talent.entropic-bolt.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + P}} corruption damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.talent.entropic-bolt.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3 + P}} corruption damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, slowed (save ends)'
abilities.talent.entropic-bolt.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {5 + P}} corruption damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, slowed (save ends)'
abilities.talent.entropic-bolt.texts.effect: >-
  Effect: The target takes an extra 1 corruption damage for each additional time they are targeted
  by this ability during the encounter.


  Strained: You gain 1 clarity when you obtain a tier 2 or tier 3 outcome on the power roll.
abilities.talent.perfect-clarity.name: Perfect Clarity
abilities.talent.perfect-clarity.description: '*You clear the mind of nothing but the goal.*'
abilities.talent.perfect-clarity.texts.target: Self or one ally
abilities.talent.perfect-clarity.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.perfect-clarity.texts.effect: >-
  Effect: Until the start of your next turn, the target gains a +3 bonus to speed, and they have a
  double edge on the next power roll they make. If the target obtains a tier 3 outcome on that roll,
  you gain 1 clarity.


  Strained: You take 1d6 damage, and you can't use triggered actions (save ends).
abilities.talent.kinetic-pulse.name: Kinetic Pulse
abilities.talent.kinetic-pulse.description: '*The force of your mind hurls enemies backward.*'
abilities.talent.kinetic-pulse.texts.target: Each enemy in the area
abilities.talent.kinetic-pulse.texts.distance: 1 burst
abilities.talent.kinetic-pulse.texts.roll: Power Roll + Reason
abilities.talent.kinetic-pulse.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} psychic damage'
abilities.talent.kinetic-pulse.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} psychic damage; push 1'
abilities.talent.kinetic-pulse.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} psychic damage; push 2'
abilities.talent.kinetic-pulse.texts.effect: 'Strained: The size of the burst increases by 2, and
  you are bleeding until the start of your next turn.'
abilities.talent.hoarfrost.name: Hoarfrost
abilities.talent.hoarfrost.description: '*You blast a foe with a pulse of cold energy.*'
abilities.talent.hoarfrost.texts.target: One creature
abilities.talent.hoarfrost.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.hoarfrost.texts.roll: Power Roll + Reason
abilities.talent.hoarfrost.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} cold damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (EoT)'
abilities.talent.hoarfrost.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + R}} cold damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, slowed (EoT)'
abilities.talent.hoarfrost.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + R}} cold damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, slowed (EoT)'
abilities.talent.hoarfrost.texts.effect: 'Strained: You are slowed until the end of your next turn.
  Additionally, a target slowed by this ability is restrained instead.'
abilities.talent.optic-blast.name: Optic Blast
abilities.talent.optic-blast.description: '*Your eyes emit rays of powerful enervating force.*'
abilities.talent.optic-blast.texts.target: One creature or object
abilities.talent.optic-blast.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.optic-blast.texts.roll: Power Roll + Reason
abilities.talent.optic-blast.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, prone'
abilities.talent.optic-blast.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + R}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone'
abilities.talent.optic-blast.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + R}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone'
abilities.talent.optic-blast.texts.effect: >-
  Effect: When targeting an object with a solid reflective surface or a creature carrying or wearing
  such an object (such as a mirror, an unpainted metal shield, or shiny metal plate armor), you can
  target one additional creature or object within 3 squares of the first target.


  Strained: You gain 1 surge that you can use immediately, and you take damage equal to your Reason
  score that can't be reduced in any way.
abilities.talent.kinetic-grip.name: Kinetic Grip
abilities.talent.kinetic-grip.description: '*You lift and hurl your foe away from you.*'
abilities.talent.kinetic-grip.texts.target: One creature or object
abilities.talent.kinetic-grip.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.kinetic-grip.texts.roll: Power Roll + Reason
abilities.talent.kinetic-grip.texts.tier1: Slide 2 + R
abilities.talent.kinetic-grip.texts.tier2: Slide 4 + R
abilities.talent.kinetic-grip.texts.tier3: Slide 6 + R; prone
abilities.talent.kinetic-grip.texts.effect: 'Strained: You must vertical push the target instead of sliding them.'
abilities.talent.feedback-loop.name: Feedback Loop
abilities.talent.feedback-loop.description: '*Creating a brief psychic link between an enemy and
  their target gives that foe a taste of their own medicine.*'
abilities.talent.feedback-loop.texts.trigger: The target deals damage to an ally.
abilities.talent.feedback-loop.texts.target: One creature
abilities.talent.feedback-loop.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.feedback-loop.texts.effect: 'Effect: The target takes psychic damage equal to half the triggering damage.'
abilities.talent.mind-spike.name: Mind Spike
abilities.talent.mind-spike.description: "*A telepathic bolt instantly zaps a creature's brain.*"
abilities.talent.mind-spike.texts.target: One creature
abilities.talent.mind-spike.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.mind-spike.texts.roll: Power Roll + Reason
abilities.talent.mind-spike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} psychic damage'
abilities.talent.mind-spike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + R}} psychic damage'
abilities.talent.mind-spike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + R}} psychic damage'
abilities.talent.mind-spike.texts.effect: "Strained: The target takes an extra 2 psychic damage. You
  also take 2 psychic damage that can't be reduced in any way."
abilities.talent.flashback.name: Flashback
abilities.talent.flashback.description: '*The target is thrown several seconds back through time and gets to do it all again.*'
abilities.talent.flashback.texts.target: Self or one ally
abilities.talent.flashback.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.flashback.texts.effect: >-
  Effect: The target uses an ability with a base Heroic Resource cost of 7 or lower that they've
  previously used this round, without needing to spend the base cost. Augmentations to the ability
  can be paid for as usual.


  Strained: You take 1d6 damage and are slowed (save ends).
abilities.talent.spirit-sword.name: Spirit Sword
abilities.talent.spirit-sword.description: '*You form a blade of mind energy and stab your target, invigorating yourself.*'
abilities.talent.spirit-sword.texts.target: One creature or object
abilities.talent.spirit-sword.texts.distance: Melee 2
abilities.talent.spirit-sword.texts.roll: Power Roll + Presence
abilities.talent.spirit-sword.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + P}} damage'
abilities.talent.spirit-sword.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + P}} damage'
abilities.talent.spirit-sword.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + P}} damage'
abilities.talent.spirit-sword.texts.effect: >-
  Effect: You gain 1 surge.


  Strained: The target takes an extra 3 damage. You also take 3 damage that can't be reduced in any
  way.
abilities.talent.minor-telekinesis.name: Minor Telekinesis
abilities.talent.minor-telekinesis.description: '*Wisps of psychic energy ripple visibly from your
  brain as you force the target to move using only your mind.*'
abilities.talent.minor-telekinesis.texts.target: Self or one size 1 creature or object
abilities.talent.minor-telekinesis.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.minor-telekinesis.texts.effect: >-
  Effect: You slide the target up to a number of squares equal to your Reason score.


  Spend 2+ Clarity: The size of the creature or object you can target increases by 1 for every 2
  clarity spent.


  Spend 3 Clarity: You can vertical slide the target.
abilities.talent.accelerate.name: Accelerate
abilities.talent.accelerate.description: '*To your ally, it seems as though the world has slowed down.*'
abilities.talent.accelerate.texts.target: Self or one creature
abilities.talent.accelerate.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.accelerate.texts.effect: |-
  Effect: The target shifts up to a number of squares equal to your Reason score.

  Spend 2 Clarity: The target can use a maneuver.
abilities.talent.incinerate.name: Incinerate
abilities.talent.incinerate.description: '*The air erupts into a column of smokeless flame.*'
abilities.talent.incinerate.texts.target: Each enemy in the area
abilities.talent.incinerate.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.talent.incinerate.texts.roll: Power Roll + Reason
abilities.talent.incinerate.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} fire damage'
abilities.talent.incinerate.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4}} fire damage'
abilities.talent.incinerate.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6}} fire damage'
abilities.talent.incinerate.texts.effect: >-
  Effect: A column of fire remains in the area until the start of your next turn. Each enemy who
  enters the area for the first time in a combat round or starts their turn there takes 2 fire
  damage.


  Strained: The size of the cube increases by 2, but the fire disappears at the end of your turn.
abilities.talent.iron.name: Iron
abilities.talent.iron.description: "*The target's skin turns to hard, dark metal, impenetrable and dense.*"
abilities.talent.iron.texts.target: Self or one ally
abilities.talent.iron.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.iron.texts.effect: >-
  Effect: The target's stability increases by an amount equal to your Reason score, and they gain 10
  temporary Stamina and 2 surges. This stability increase lasts until the target no longer has
  temporary Stamina from this ability.


  Strained: You can't use maneuvers (save ends).
abilities.talent.again.name: Again
abilities.talent.again.description: '*You step back a split second to see if things play out a little differently.*'
abilities.talent.again.texts.trigger: The target makes an ability roll.
abilities.talent.again.texts.target: Self or one creature
abilities.talent.again.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.again.texts.effect: 'Effect: You can use this ability after seeing the result of
  the triggering roll. The target must reroll the power roll and use the new roll.'
abilities.talent.remote-assistance.name: Remote Assistance
abilities.talent.remote-assistance.description: '*An ally gains the benefit of your intellect.*'
abilities.talent.remote-assistance.texts.target: One creature or object
abilities.talent.remote-assistance.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.remote-assistance.texts.effect: >-
  Effect: The next ability roll an ally makes against the target before the start of your next turn
  gains an edge.


  Spend 1 Clarity: You target one additional creature or object.
abilities.talent.choke.name: Choke
abilities.talent.choke.description: '*You crush a foe in a telekinetic grip.*'
abilities.talent.choke.texts.target: One creature
abilities.talent.choke.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.choke.texts.roll: Power Roll + Reason
abilities.talent.choke.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + R}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.talent.choke.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + R}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, slowed (save ends)'
abilities.talent.choke.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + R}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.talent.choke.texts.effect: 'Effect: You can vertical pull the target up to 2 squares. If
  the target is made restrained by this ability, this forced movement ignores their stability.'
abilities.talent.repel.name: Repel
abilities.talent.repel.description: "*They aren't going anywhere, but you might!*"
abilities.talent.repel.texts.trigger: The target takes damage or is force moved.
abilities.talent.repel.texts.target: Self or one ally
abilities.talent.repel.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.repel.texts.effect: 'Effect: The target takes half the triggering damage, or the
  distance of the triggering forced movement is reduced by a number of squares equal to your Reason
  score. If the target took damage and was force moved, you choose the effect. If the forced
  movement is reduced to 0 squares, the target can push the source of the forced movement a number
  of squares equal to your Reason score.'
abilities.talent.precognition.name: Precognition
abilities.talent.precognition.description: "*You give a target a glimpse into the future so that they're ready for what comes next.*"
abilities.talent.precognition.texts.target: Self or one ally
abilities.talent.precognition.texts.distance: Melee 2
abilities.talent.precognition.texts.effect: 'Effect: Ability rolls made against the target take a
  bane until the start of your next turn. Whenever the target takes damage while under this effect,
  they can use a triggered action to make a free strike against the source of the damage.'
abilities.talent.awe.name: Awe
abilities.talent.awe.description: '*You project psionic energy out to a creature and take on a new visage in their mind.*'
abilities.talent.awe.texts.target: One creature
abilities.talent.awe.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.awe.texts.roll: Power Roll + Presence
abilities.talent.awe.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + P}} psychic damage; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
abilities.talent.awe.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + P}} psychic damage; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, frightened (save ends)'
abilities.talent.awe.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + P}} psychic damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.talent.awe.texts.effect: 'Effect: If you target an ally, they gain temporary Stamina equal
  to three times your Presence score, and they can end one effect on them that is ended by a saving
  throw or that ends at the end of their turn. If you target an enemy, you make a power roll.'
abilities.talent.inertia-soak.name: Inertia Soak
abilities.talent.inertia-soak.description: '*Your psionic energy surrounds the target and pushes everything else away from them.*'
abilities.talent.inertia-soak.texts.target: Self or one ally
abilities.talent.inertia-soak.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.inertia-soak.texts.effect: >-
  Effect: The target ignores difficult terrain and takes no damage from forced movement until the
  start of your next turn. Whenever the target enters a square while under this effect, they can
  push one adjacent creature up to a number of squares equal to your Reason score. When pushing an
  ally, the target can ignore that ally's stability. A creature can only be force moved this way
  once a turn.


  Strained: You are weakened (save ends). While you are weakened this way, whenever you are force
  moved, the forced movement distance gains a +5 bonus.
abilities.talent.smolder.name: Smolder
abilities.talent.smolder.params.smolderType.name: Damage type
abilities.talent.smolder.params.smolderType.values.acid.name: Acid
abilities.talent.smolder.params.smolderType.values.corruption.name: Corruption
abilities.talent.smolder.params.smolderType.values.fire.name: Fire
abilities.talent.smolder.description: '*Smoke flows from your enemy like tears as their skin begins to blacken and flake.*'
abilities.talent.smolder.texts.target: One creature
abilities.talent.smolder.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.smolder.texts.roll: Power Roll + Reason
abilities.talent.smolder.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + R}} damage; R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, the target has weakness 5 (save ends)'
abilities.talent.smolder.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + R}} damage; R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, the target has weakness 5 (save ends)'
abilities.talent.smolder.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + R}} damage; R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, the target has weakness equal to 5 + your Reason score (save ends)'
abilities.talent.smolder.texts.effect: 'Effect: Choose the damage type and the weakness for this
  ability from one of the following: acid, corruption, or fire. The target takes damage before this
  ability imposes any weakness.'
abilities.talent.materialize.name: Materialize
abilities.talent.materialize.description: "*You picture an object in your mind and give it form—directly above your opponent's head.*"
abilities.talent.materialize.texts.target: One creature or object
abilities.talent.materialize.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.materialize.texts.roll: Power Roll + Reason
abilities.talent.materialize.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + R}} damage'
abilities.talent.materialize.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + R}} damage'
abilities.talent.materialize.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + R}} damage'
abilities.talent.materialize.texts.effect: >-
  Effect: A worthless size 1M object drops onto the target to deal the damage, then rolls into an
  adjacent unoccupied space of your choice. The object is made of wood, stone, or metal (your
  choice).


  Strained: The object explodes after the damage is dealt, and each creature adjacent to the target
  takes damage equal to your Reason score. You also take damage equal to your Reason score that
  can't be reduced in any way.
abilities.talent.mindwipe.name: Mindwipe
abilities.talent.mindwipe.description: '*You attempt to make them forget all their training.*'
abilities.talent.mindwipe.texts.target: One creature
abilities.talent.mindwipe.texts.distance: Melee 2
abilities.talent.mindwipe.texts.roll: Power Roll + Reason
abilities.talent.mindwipe.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {12 + R}} damage; R < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, the target takes a bane on their next power roll'
abilities.talent.mindwipe.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {17 + R}} damage; R < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target takes a bane on power rolls (save ends)'
abilities.talent.mindwipe.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {23 + R}} damage; R < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, the target has a double bane on power rolls (save ends)'
abilities.talent.mindwipe.texts.effect: |-
  Effect: The target can't communicate with anyone until the end of the encounter.

  Strained: You take 3d6 damage.
abilities.talent.rejuvenate.name: Rejuvenate
abilities.talent.rejuvenate.description: "*You reshape the flow of time in the target's body to return it to an earlier state.*"
abilities.talent.rejuvenate.texts.target: Self or one ally
abilities.talent.rejuvenate.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.rejuvenate.texts.effect: >-
  Effect: Choose two of the following effects:

  - The target can spend any number of Recoveries.

  - The target gains 1 of their Heroic Resource, and can end any effects on them that are ended by a
  saving throw or that end at the end of their turn.

  - The target gains 2 surges, and gains a +3 bonus to speed until the end of the encounter.


  Strained: You and the target both permanently grow visibly younger (the equivalent of 20 human
  years, to the minimum of an 18-year-old). Additionally, you are weakened and slowed (save ends).
abilities.talent.levitation-field.name: Levitation Field
abilities.talent.levitation-field.description: '*You manipulate the air around your allies so they
  can move as freely through the sky as you can.*'
abilities.talent.levitation-field.texts.target: Each ally in the area
abilities.talent.levitation-field.texts.distance: 3 burst
abilities.talent.levitation-field.texts.effect: >-
  Effect: Each target can fly until the start of your next turn, and can immediately shift up to
  their speed. You can also shift up to your speed. While flying, a target's stability is reduced to
  0 and can't be increased.


  Spend 5 Clarity: The effects last for 1 hour instead.
abilities.talent.doubt.name: Doubt
abilities.talent.doubt.description: "*You tug at the strings of the foe's anima and unravel them,
  allowing someone else to take advantage of their drive.*"
abilities.talent.doubt.texts.target: One creature or object
abilities.talent.doubt.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.doubt.texts.roll: Power Roll + Presence
abilities.talent.doubt.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + P}} damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, weakened (save ends)'
abilities.talent.doubt.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14 + P}} damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, weakened (save ends)'
abilities.talent.doubt.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {20 + P}} damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, weakened and slowed (save ends)'
abilities.talent.doubt.texts.effect: >-
  Effect: This ability gains an edge against a target with a soul (see [Draw Steel:
  Monsters](https://mcdm.gg/DS-Monsters)). After you make the power roll, you or one ally within
  distance have a double edge on the next power roll you make before the end of the encounter.


  Strained: You feel dispirited until you finish a respite. If you obtain a tier 3 outcome on the
  power roll, you and the target each have damage weakness 5 (save ends).
abilities.talent.steel.name: Steel
abilities.talent.steel.description: "*The target's skin becomes covered in tough metal.*"
abilities.talent.steel.texts.target: Self or one ally
abilities.talent.steel.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.steel.texts.effect: >-
  Effect: The target has damage immunity 5 and can't be made slowed or weakened until the start of
  your next turn. Whenever the target force moves a creature or object while under this effect, the
  forced movement distance gains a +5 bonus.


  Strained: You can't use maneuvers (save ends).
abilities.talent.stasis-shield.name: Stasis Shield
abilities.talent.stasis-shield.description: '*You freeze time just long enough to bring the victim to safety!*'
abilities.talent.stasis-shield.texts.trigger: The target takes damage.
abilities.talent.stasis-shield.texts.target: Self, or one creature or object
abilities.talent.stasis-shield.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.stasis-shield.texts.effect: >-
  Effect: The target is teleported to an unoccupied space adjacent to you, taking no damage and
  suffering no additional effects if this movement would get them out of harm's way.


  Strained: You can't target yourself, and you take the damage and any additional effects instead of
  the target.
abilities.talent.stasis-field.name: Stasis Field
abilities.talent.stasis-field.description: '*Keep everything as it was. Ignore everything that will be.*'
abilities.talent.stasis-field.texts.target: Each creature and object in the area
abilities.talent.stasis-field.texts.distance: '4 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.talent.stasis-field.texts.roll: Power Roll + Presence
abilities.talent.stasis-field.texts.tier1: 'P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, the target is slowed until the effect ends'
abilities.talent.stasis-field.texts.tier2: P < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target's speed is 0 until the effect ends
abilities.talent.stasis-field.texts.tier3: 'P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, the target is restrained until the effect ends'
abilities.talent.stasis-field.texts.effect: >-
  Effect: The area is frozen in time until the start of your next turn. Each object in the area is
  restrained and can't fall until the effect ends. Until the effect ends, creatures in the area who
  are reduced to 0 Stamina or would die stay alive, and objects in the area that are reduced to 0
  Stamina remain undestroyed.

  Make a power roll that targets each enemy in the area.


  Strained: Any creature or object force moved in the area takes 2 corruption damage for each square
  of the area they enter. Creatures and objects restrained in the area can be force moved. You are
  restrained until the effect ends.
abilities.talent.fate.name: Fate
abilities.talent.fate.description: '*Your foe gets a glimpse of how it will end for them.*'
abilities.talent.fate.texts.target: One enemy
abilities.talent.fate.texts.distance: Melee 2
abilities.talent.fate.texts.roll: Power Roll + Presence
abilities.talent.fate.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + P}} psychic damage'
abilities.talent.fate.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13 + P}} psychic damage'
abilities.talent.fate.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {17 + P}} psychic damage'
abilities.talent.fate.texts.effect: >-
  Effect: The target has damage weakness 5 until the end of your next turn. Whenever the target
  takes damage while they have this weakness, they are knocked prone.


  Strained: This ability gains the Strike keyword as the vision hurts the target's psyche. You make
  a power roll, then are weakened (save ends).
abilities.talent.synaptic-conditioning.name: Synaptic Conditioning
abilities.talent.synaptic-conditioning.description: "*It's a subtle mindset shift. It's not that they're your enemy—you just don't like them!*"
abilities.talent.synaptic-conditioning.texts.target: One creature
abilities.talent.synaptic-conditioning.texts.distance: Melee 2
abilities.talent.synaptic-conditioning.texts.roll: Power Roll + Reason
abilities.talent.synaptic-conditioning.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10}} psychic damage; the target takes a bane on ability rolls made to harm you or your allies (save ends)'
abilities.talent.synaptic-conditioning.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14}} psychic damage; the target has a double bane on ability rolls made to harm you or your allies (save ends)'
abilities.talent.synaptic-conditioning.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {20}} psychic damage; the target considers you and your allies to be their allies when using abilities and features (save ends)'
abilities.talent.synaptic-conditioning.texts.effect: 'Strained: While the target is under this
  effect, you no longer consider your enemies to be your enemies when using your abilities and
  features.'
abilities.talent.gravitic-well.name: Gravitic Well
abilities.talent.gravitic-well.description: '*You bend gravity into a fine point and pull your foes toward it.*'
abilities.talent.gravitic-well.texts.target: Each creature and object in the area
abilities.talent.gravitic-well.texts.distance: '4 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.talent.gravitic-well.texts.roll: Power Roll + Reason
abilities.talent.gravitic-well.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6}} damage; vertical pull 5 toward the center of the area'
abilities.talent.gravitic-well.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} damage; vertical pull 7 toward the center of the area'
abilities.talent.gravitic-well.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13}} damage; vertical pull 10 toward the center of the area'
abilities.talent.gravitic-well.texts.effect: >-
  Effect: Targets closest to the center of the area are pulled first.


  Strained: The size of the area increases by 2. You also target yourself and each ally within
  distance.
abilities.talent.greater-kinetic-grip.name: Greater Kinetic Grip
abilities.talent.greater-kinetic-grip.description: '*You raise the target into the air without breaking a sweat.*'
abilities.talent.greater-kinetic-grip.texts.target: One creature or object
abilities.talent.greater-kinetic-grip.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.greater-kinetic-grip.texts.roll: Power Roll + Reason
abilities.talent.greater-kinetic-grip.texts.tier1: Slide 4 + R; M < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, the forced movement is vertical
abilities.talent.greater-kinetic-grip.texts.tier2: Slide 8 + R; M < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the forced movement is vertical
abilities.talent.greater-kinetic-grip.texts.tier3: Slide 12 + R; prone; M < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, the forced movement is vertical
abilities.talent.greater-kinetic-grip.texts.effect: 'Strained: The forced movement ignores
  stability. You take 2d6 damage and are weakened (save ends).'
abilities.talent.synaptic-dissipation.name: Synaptic Dissipation
abilities.talent.synaptic-dissipation.description: "*You manipulate your enemies' minds and make
  them wonder if you were ever really there in the first place.*"
abilities.talent.synaptic-dissipation.texts.target: Special
abilities.talent.synaptic-dissipation.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.synaptic-dissipation.texts.roll: Power Roll + Reason
abilities.talent.synaptic-dissipation.texts.tier1: Two creatures
abilities.talent.synaptic-dissipation.texts.tier2: Three creatures
abilities.talent.synaptic-dissipation.texts.tier3: Five creatures
abilities.talent.synaptic-dissipation.texts.effect: >-
  Effect: You target a number of creatures with this ability determined by the outcome of your power
  roll. You and your allies are invisible to each target until the start of your next turn.


  Strained: The effect ends early if you take damage from an enemy's ability.
abilities.talent.hypersonic.name: Hypersonic
abilities.talent.hypersonic.description: '*You move fast enough to turn around and watch your foes feel the aftermath.*'
abilities.talent.hypersonic.texts.target: Each enemy in the area
abilities.talent.hypersonic.texts.distance: 5 x 2 line within 1
abilities.talent.hypersonic.texts.roll: Power Roll + Reason
abilities.talent.hypersonic.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {12}} sonic damage'
abilities.talent.hypersonic.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {18}} sonic damage'
abilities.talent.hypersonic.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {24}} sonic damage'
abilities.talent.hypersonic.texts.effect: >-
  Effect: You teleport to a square on the opposite side of the area before making the power roll.


  Strained: If you obtain a tier 2 outcome or better, you are slowed until the end of your turn and
  each target is slowed until the end of their turn.
abilities.talent.exothermic-shield.name: Exothermic Shield
abilities.talent.exothermic-shield.description: '*You encase the target in psionic flame and allow them to flicker without fear of burning out.*'
abilities.talent.exothermic-shield.texts.target: Self or one ally
abilities.talent.exothermic-shield.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.exothermic-shield.texts.effect: >-
  Effect: Until the start of your next turn, the target has cold immunity 10 and fire immunity 10,
  and their strikes deal extra fire damage equal to twice your Reason score. Additionally, whenever
  an enemy uses a melee ability against the target while they are under this effect, the enemy takes
  5 fire damage.


  Strained: The target gains 2 surges. You are weakened and slowed (save ends).
abilities.talent.mind-snare.name: Mind Snare
abilities.talent.mind-snare.description: "*You latch onto your prey's brain and don't let go, like a
  song they can't get out of their head.*"
abilities.talent.mind-snare.texts.target: One creature
abilities.talent.mind-snare.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.mind-snare.texts.roll: Power Roll + Reason
abilities.talent.mind-snare.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + R}} psychic damage; R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.talent.mind-snare.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14 + R}} psychic damage; R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, slowed (save ends)'
abilities.talent.mind-snare.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {20 + R}} psychic damage; R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, slowed (save ends)'
abilities.talent.mind-snare.texts.effect: >-
  Effect: While slowed this way, the target takes 3 psychic damage for each square they willingly
  leave.


  Strained: While slowed this way, the target instead takes 5 psychic damage for each square they
  willingly leave. You have a double bane on ability rolls made against the target while they are
  slowed this way.
abilities.talent.soulbound.name: Soulbound
abilities.talent.soulbound.description: '*You fire a piercing bolt of psychic energy that lances
  through two foes and leaves a faint intangible thread between them.*'
abilities.talent.soulbound.texts.target: Two enemies
abilities.talent.soulbound.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.soulbound.texts.roll: Power Roll + Presence
abilities.talent.soulbound.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8}} damage; A < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, the target is stitched to the other target (save ends)'
abilities.talent.soulbound.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13}} damage; A < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target is stitched to the other target (save ends)'
abilities.talent.soulbound.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {17}} damage; A < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, the target is stitched to the other target (save ends)'
abilities.talent.soulbound.texts.effect: >-
  Effect: If any target becomes stitched to the other, both targets are stitched together. While
  stitched together, a target takes a bane on power rolls while not adjacent to a creature they're
  stitched to. Whenever a stitched target takes damage that wasn't dealt by or also taken by another
  stitched target, each other stitched target takes half the damage the initial target took.


  Strained: You target yourself and three enemies instead.
abilities.talent.overwhelm.name: Overwhelm
abilities.talent.overwhelm.description: '*You overload their senses, turning all their subconscious thoughts into conscious ones.*'
abilities.talent.overwhelm.texts.target: One creature
abilities.talent.overwhelm.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.overwhelm.texts.roll: Power Roll + Reason
abilities.talent.overwhelm.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + R}} psychic damage; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.talent.overwhelm.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + R}} psychic damage; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, weakened (save ends)'
abilities.talent.overwhelm.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {14 + R}} psychic damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.talent.overwhelm.texts.effect: "Strained: You start crying, and you can't use triggered
  actions or make free strikes until the end of the target's next turn."
abilities.talent.applied-chronometrics.name: Applied Chronometrics
abilities.talent.applied-chronometrics.description: "*Time slows down around you. Your heartbeat is
  the only gauge of the extra moments you've gained.*"
abilities.talent.applied-chronometrics.texts.target: Special
abilities.talent.applied-chronometrics.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.applied-chronometrics.texts.roll: Power Roll + Presence
abilities.talent.applied-chronometrics.texts.tier1: You target two creatures, one of which can be you.
abilities.talent.applied-chronometrics.texts.tier2: You target three creatures, one of which can be you.
abilities.talent.applied-chronometrics.texts.tier3: You target four creatures, one of which can be you.
abilities.talent.applied-chronometrics.texts.effect: >-
  Effect: Until the start of your next turn, each target gains a +5 bonus to speed, they can't be
  made dazed, and they can use an additional maneuver on their turn. If a target is already dazed,
  that condition ends for them.


  Strained: Your speed is halved until the end of the encounter.
abilities.talent.gravitic-burst.name: Gravitic Burst
abilities.talent.gravitic-burst.description: '*Everyone get away from me!*'
abilities.talent.gravitic-burst.texts.target: Each enemy in the area
abilities.talent.gravitic-burst.texts.distance: 1 burst
abilities.talent.gravitic-burst.texts.roll: Power Roll + Reason
abilities.talent.gravitic-burst.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3}} damage; vertical push 2'
abilities.talent.gravitic-burst.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} damage; vertical push 4'
abilities.talent.gravitic-burst.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9}} damage; vertical push 6'
abilities.talent.gravitic-burst.texts.effect: 'Strained: The size of the burst increases by 1, and you are weakened until the end of your turn.'
abilities.talent.synaptic-override.name: Synaptic Override
abilities.talent.synaptic-override.description: "*You control an enemy's nervous system. How pleasant for them.*"
abilities.talent.synaptic-override.texts.target: One enemy
abilities.talent.synaptic-override.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.synaptic-override.texts.roll: Power Roll + Reason
abilities.talent.synaptic-override.texts.tier1: The target makes a free strike against one enemy of your choice.
abilities.talent.synaptic-override.texts.tier2: The target shifts up to their speed and uses their
  signature ability against any enemies of your choice.
abilities.talent.synaptic-override.texts.tier3: The target moves up to their speed and uses their
  signature ability against any enemies of your choice.
abilities.talent.synaptic-override.texts.effect: >-
  Effect: You control the target's movement. The target can't be moved in a way that would harm them
  (such as over a cliff), leave them dying, or result in them suffering a condition or other
  negative effect. However, you can move them to provoke opportunity attacks.


  Strained: You take 1d6 damage and are weakened until the end of your turn.
abilities.talent.levity-and-gravity.name: Levity and Gravity
abilities.talent.levity-and-gravity.description: '*You raise the target slightly into the air, then smother them against the ground.*'
abilities.talent.levity-and-gravity.texts.target: One creature or object
abilities.talent.levity-and-gravity.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.levity-and-gravity.texts.roll: Power Roll + Reason
abilities.talent.levity-and-gravity.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + R}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, prone'
abilities.talent.levity-and-gravity.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + R}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone'
abilities.talent.levity-and-gravity.texts.tier3: "{has_self_damage3, select, true {{self_damage3}} other {14 + R}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone and can't stand (save ends)"
abilities.talent.levity-and-gravity.texts.effect: 'Strained: You take half the damage the target takes.'
abilities.talent.slow.name: Slow
abilities.talent.slow.description: '*Perhaps they wonder why everyone else is moving so quickly?*'
abilities.talent.slow.texts.target: Three creatures or objects
abilities.talent.slow.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.slow.texts.roll: Power Roll + Presence
abilities.talent.slow.texts.tier1: "The target's speed is halved (save ends), or if P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, the target is slowed (save ends)."
abilities.talent.slow.texts.tier2: The target is slowed (save ends), or if P < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target's speed is 0 (save ends).
abilities.talent.slow.texts.tier3: The target is slowed (save ends), or if P < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, the target's speed is 0 (save ends).
abilities.talent.slow.texts.effect: >-
  Effect: A target can't use triggered actions while their speed is reduced this way.


  Strained: The potency of this ability increases by 1 and you take 1d6 damage. At the start of each
  combat round while any target is affected by this ability, you take 1d6 damage. You can end the
  effect on all affected targets at any time (no action required).
abilities.talent.force-orbs.name: Force Orbs
abilities.talent.force-orbs.description: '*Spheres of solid psionic energy float around you.*'
abilities.talent.force-orbs.texts.target: Self
abilities.talent.force-orbs.texts.distance: Self; see below
abilities.talent.force-orbs.texts.roll: Power Roll + Reason
abilities.talent.force-orbs.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} damage'
abilities.talent.force-orbs.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3}} damage'
abilities.talent.force-orbs.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {5}} damage'
abilities.talent.force-orbs.texts.effect: >-
  Effect: You create three size 1T orbs that orbit your body. Each orb gives you a cumulative damage
  immunity 1. Each time you take damage, you lose 1 orb.

  Once on each of your turns, you can use a free maneuver to fire an orb at a creature or object
  within 5 squares as a ranged strike, losing the orb after the strike.


  Strained: You create five orbs, and you are weakened while you have any orbs active.
abilities.talent.fling-through-time.name: Fling Through Time
abilities.talent.fling-through-time.description: '*You hurl the target through the annals of time,
  forcing them to witness every moment of their existence all at once.*'
abilities.talent.fling-through-time.texts.target: One creature or object
abilities.talent.fling-through-time.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.fling-through-time.texts.roll: Power Roll + Presence
abilities.talent.fling-through-time.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + P}} corruption damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, weakened (save ends)'
abilities.talent.fling-through-time.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + P}} corruption damage; the target is flung through time, and if P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, they are weakened (save ends)'
abilities.talent.fling-through-time.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + P}} corruption damage; the target is flung through time, and if P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, they are weakened (save ends)'
abilities.talent.fling-through-time.texts.effect: >-
  Effect: A target who is flung through time is removed from the encounter map until the end of
  their next turn, reappearing in their original space or the nearest unoccupied space.


  Strained: You take 2d6 damage and permanently grow visibly older (the equivalent of 10 years for a
  human). If you obtain a tier 3 outcome on the power roll, you gain 2 clarity.
abilities.talent.soul-burn.name: Soul Burn
abilities.talent.soul-burn.description: '*You blast their soul out of their body, leaving it to helplessly float back to a weakened husk.*'
abilities.talent.soul-burn.texts.target: One creature
abilities.talent.soul-burn.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.soul-burn.texts.roll: Power Roll + Presence
abilities.talent.soul-burn.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + P}} damage; P < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, dazed (save ends)'
abilities.talent.soul-burn.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + P}} damage; P < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed (save ends)'
abilities.talent.soul-burn.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {14 + P}} damage; P < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.talent.soul-burn.texts.effect: >-
  Effect: The target takes a bane on Presence tests until the end of the encounter.


  Strained: The potency of this ability increases by 1. You take 2d6 damage and gain 3 surges that
  you can use immediately.
abilities.talent.reflector-field.name: Reflector Field
abilities.talent.reflector-field.description: '*A protective field reverses the momentum of incoming attacks.*'
abilities.talent.reflector-field.texts.target: Special
abilities.talent.reflector-field.texts.distance: 3 aura
abilities.talent.reflector-field.texts.effect: >-
  Effect: The aura lasts until the start of your next turn. Whenever an enemy targets an ally in the
  area with a ranged ability, the ability is negated on the ally and reflected back at the enemy.
  The ability deals half the damage to the enemy that it would have dealt to the ally and loses any
  additional effects.


  Strained: The size of the aura increases by 1. Whenever your aura reflects an ability, you take
  2d6 damage and forget a memory, as determined by you and the Director.
abilities.talent.gravitic-nova.name: Gravitic Nova
abilities.talent.gravitic-nova.description: '*Unbridled psionic energy erupts from your body and flashes outward, hurling your foes back.*'
abilities.talent.gravitic-nova.texts.target: Each enemy and object in the area
abilities.talent.gravitic-nova.texts.distance: 3 burst
abilities.talent.gravitic-nova.texts.roll: Power Roll + Reason
abilities.talent.gravitic-nova.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6}} damage; push 7'
abilities.talent.gravitic-nova.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} damage; push 10'
abilities.talent.gravitic-nova.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13}} damage; push 15'
abilities.talent.gravitic-nova.texts.effect: >-
  Effect: On a critical hit, the size of the area increases by 3, and this ability deals an extra 10
  damage.


  Strained: You are weakened (save ends). If you scored a critical hit with this ability, you die.
abilities.talent.fulcrum.name: Fulcrum
abilities.talent.fulcrum.description: '*You precisely manipulate the creatures around you.*'
abilities.talent.fulcrum.texts.target: Each enemy and object in the area
abilities.talent.fulcrum.texts.distance: Special
abilities.talent.fulcrum.texts.roll: Power Roll + Reason
abilities.talent.fulcrum.texts.tier1: 2 burst
abilities.talent.fulcrum.texts.tier2: 3 burst
abilities.talent.fulcrum.texts.tier3: 4 burst
abilities.talent.fulcrum.texts.effect: >-
  Effect: Make a power roll to determine the area of this ability. Each target is vertical pushed 6
  squares. You can target only objects of size 1L or smaller.


  Strained: You can choose to reduce the size of the burst by 2 (to a minimum of 1 burst) to give
  the forced movement distance a +2 bonus. You take half the total damage all targets take from
  forced movement.
abilities.talent.acceleration-field.name: Acceleration Field
abilities.talent.acceleration-field.description: '*You forcibly stuff more moments into a critical
  point in time, knowing full well you might need to steal some of your own.*'
abilities.talent.acceleration-field.texts.target: Three allies
abilities.talent.acceleration-field.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.talent.acceleration-field.texts.roll: Power Roll + Presence
abilities.talent.acceleration-field.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4}} corruption damage; slowed (save ends)'
abilities.talent.acceleration-field.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} corruption damage; slowed (save ends)'
abilities.talent.acceleration-field.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10}} corruption damage; slowed (save ends)'
abilities.talent.acceleration-field.texts.effect: >-
  Effect: Each target can use any main action available to them as a free triggered action, but they
  lose their main action on their next turn.


  Strained: Make a power roll that targets you and each enemy within distance.
abilities.talent.synaptic-terror.name: Synaptic Terror
abilities.talent.synaptic-terror.description: '*You project a terrifying image into the brains of
  your foes, and their fear psionically invigorates your allies.*'
abilities.talent.synaptic-terror.texts.target: Each ally and enemy in the area
abilities.talent.synaptic-terror.texts.distance: 3 burst
abilities.talent.synaptic-terror.texts.roll: Power Roll + Reason
abilities.talent.synaptic-terror.texts.tier1: 'R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
abilities.talent.synaptic-terror.texts.tier2: 'R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, frightened (save ends)'
abilities.talent.synaptic-terror.texts.tier3: 'R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.talent.synaptic-terror.texts.effect: >-
  Effect: You and each target ally can't obtain lower than a tier 2 outcome on power rolls until the
  start of your next turn. Each target enemy is affected by the ability's power roll.


  Strained: You can't use this ability if doing so would cause you to have negative clarity.
abilities.talent.borrow-from-the-future.name: Borrow From the Future
abilities.talent.borrow-from-the-future.description: '*You lean on future heroism to assist you in the now.*'
abilities.talent.borrow-from-the-future.texts.target: Each ally in the area
abilities.talent.borrow-from-the-future.texts.distance: 2 burst
abilities.talent.borrow-from-the-future.texts.effect: "Effect: The targets share 6 of their Heroic
  Resource among themselves, as you determine. A target can't gain more than 3 of their Heroic
  Resource this way. After using this ability, you can't gain any clarity until the end of the next
  combat round."
abilities.talent.resonant-mind-spike.name: Resonant Mind Spike
abilities.talent.resonant-mind-spike.description: "*You fire a telepathic bolt empowered by every
  consciousness within reach directly into your foe's mind.*"
abilities.talent.resonant-mind-spike.texts.target: One creature
abilities.talent.resonant-mind-spike.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.talent.resonant-mind-spike.texts.roll: Power Roll + Reason
abilities.talent.resonant-mind-spike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {15 + R}} psychic damage'
abilities.talent.resonant-mind-spike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {24 + R}} psychic damage'
abilities.talent.resonant-mind-spike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {28 + R}} psychic damage'
abilities.talent.resonant-mind-spike.texts.effect: >-
  Effect: This ability ignores cover and concealment.


  Strained: The ability roll scores a critical hit on a natural 17 or higher. You take half the
  damage the target takes, and you can't reduce this damage in any way.
abilities.talent.force-orbs.actions.fire-orb.name: Fire an orb
abilities.talent.force-orbs.followUps.lose-orb.name: Lose a force orb
