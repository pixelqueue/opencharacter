titles.echelon-1.monster-bane.name: Monster Bane
titles.echelon-1.monster-bane.description: >-
  *You dare mock Blunwin Mousebane? You think my deed trivial? Ah, but you didn't see the size of
  the mouse!*


  **Prerequisite:** You defeat a leader or solo creature with a Reason score of −2 or lower, such as
  an arixx.


  **Effect:** Choose one of the following benefits:


  - *Beast Bane:* Creatures with the Animal keyword take a bane on strikes made against you.

  - *Monster Soother:* You gain an edge on tests made to calm or tame nonsapient creatures.

  - *Monster Trophy:* You decorate your equipment with a trophy from a creature you defeated. While
  the trophy is visible, you gain an edge on tests made to intimidate sapient creatures.
titles.echelon-1.monster-bane.texts.prerequisite: You defeat a leader or solo creature with a Reason score of −2 or lower, such as an arixx.
titles.echelon-1.monster-bane.choices.benefit.prompt: Benefit
titles.echelon-1.monster-bane.choices.benefit.options.beast-bane.name: Beast Bane
titles.echelon-1.monster-bane.choices.benefit.options.monster-soother.name: Monster Soother
titles.echelon-1.monster-bane.choices.benefit.options.monster-trophy.name: Monster Trophy
titles.echelon-1.owed-a-favor.name: Owed a Favor
titles.echelon-1.owed-a-favor.description: >-
  *The Guild's gratitude knows no bounds! We'll repay you in any way we can... short of actually
  paying you.*


  **Prerequisite:** You successfully perform a service for a powerful faction.


  **Effect:** The faction will perform one favor for the party, provided it doesn't interfere with
  the faction's goals.


  Additionally, the faction is a good source of information. The Director chooses a skill from the
  crafting or lore skill groups appropriate to the faction, such as the Criminal Underworld skill
  for an outlaw gang, the Blacksmithing skill for a blacksmith's guild, or the Society skill for a
  noble house. While in a settlement where the faction has a presence, you gain this skill if you
  don't already have it. If you already have the skill, you instead gain an edge on tests made using
  the skill.
titles.echelon-1.owed-a-favor.texts.prerequisite: You successfully perform a service for a powerful faction.
titles.echelon-1.presumed-dead.name: Presumed Dead
titles.echelon-1.presumed-dead.description: >-
  *But... you're dead. We went to your funeral.*


  **Prerequisite:** You die in a way that prevents your body from being recovered or examined (for
  instance, by falling off a cliff).


  **Effect:** While it might appear that you died, you did not. Instead, you regain 1 Stamina and
  can spend 1 or more Recoveries. Additionally, you gain a 1st-echelon trinket of the Director's
  choice (see Treasures earlier in this chapter).


  At a dramatic moment determined by the Director, you rejoin your party with an explanation for
  your narrow escape, and how you found your new trinket along the way.
titles.echelon-1.presumed-dead.texts.prerequisite: You die in a way that prevents your body from
  being recovered or examined (for instance, by falling off a cliff).
titles.echelon-1.ratcatcher.name: Ratcatcher
titles.echelon-1.ratcatcher.description: >-
  *I like fighting these little guys. Means I don't have to waste money on a helmet.*


  **Prerequisite:** You defeat a leader or solo creature who is size 1S or smaller, such as a goblin
  monarch.


  **Effect:** Choose one of the following benefits:


  - *Come Out to Play:* You have the following ability, which can be paid for using the Heroic
  Resource of your class.


  > ###### Come Out to Play (1 Heroic Resource)

  >

  > *Come out to play—yay!*

  >

  > | **Area, Magic** |                                **Maneuver** |

  > | --------------- | ------------------------------------------: |

  > | **📏 5 burst**  | **🎯 Each enemy in the area hidden to you** |

  >

  > **Effect:** Each target who has P < AVERAGE is taunted by you until the end of their next turn,
  and you know the location of each creature taunted in this way.


  - *Deadly and Big:* Your strikes gain a +3 damage bonus against creatures whose size is smaller
  than yours.

  - *Everybody Move!:* When you use the Knockback maneuver, you can target one additional creature
  of your size or two additional smaller creatures.
titles.echelon-1.ratcatcher.texts.prerequisite: You defeat a leader or solo creature who is size 1S or smaller, such as a goblin monarch.
titles.echelon-1.ratcatcher.choices.benefit.prompt: Benefit
titles.echelon-1.ratcatcher.choices.benefit.options.come-out-to-play.name: Come Out to Play
titles.echelon-1.ratcatcher.choices.benefit.options.deadly-and-big.name: Deadly and Big
titles.echelon-1.ratcatcher.choices.benefit.options.everybody-move.name: Everybody Move!
titles.echelon-1.saved-for-a-worse-fate.name: Saved for a Worse Fate
titles.echelon-1.saved-for-a-worse-fate.description: >-
  *Drink this. You'll need all your strength for what lies ahead!*


  **Prerequisite:** The entire party is killed or captured by sapient foes.


  **Effect:** After being defeated, each character awakes, alive and with full Stamina and
  Recoveries. You are all captives of the creatures who defeated you, and a gruesome end awaits
  you—unless you can escape or overcome the nefarious challenge your captors have planned.


  The Director chooses one of the following benefits, based on the fate your captors have in mind
  for you. Each hero gains the same benefit. Additionally, you must face an encounter, montage test,
  or adventure related to the benefit, as the Director determines.


  - *Gladiators:* You must fight to the death for your captors' amusement. Your intended opponents
  wield or guard a trinket or leveled treasure, which you can earn if you are victorious.

  - *Prey:* Your captors plan to release you and hunt you down, but it's no fun unless you offer a
  challenge. Each of you is given a medicinal draught that grants a +1 bonus to speed and increases
  your Recoveries by 2. This benefit lasts until the end of your next respite.

  - *Sacrifices:* You are to be dropped in a volcano, fed to a sacred monster, abandoned in a
  desert, or otherwise sacrificed to a higher power. You are bedecked with holy jewelry. Each hero
  earns 1 Wealth.

  - *Saviors:* Your captors fear an even stronger foe, and they want you to defeat this enemy for
  them. You can even keep any treasure you find while doing so.
titles.echelon-1.saved-for-a-worse-fate.texts.prerequisite: The entire party is killed or captured by sapient foes.
titles.echelon-1.saved-for-a-worse-fate.choices.benefit.prompt: Benefit
titles.echelon-1.saved-for-a-worse-fate.choices.benefit.options.gladiators.name: Gladiators
titles.echelon-1.saved-for-a-worse-fate.choices.benefit.options.prey.name: Prey
titles.echelon-1.saved-for-a-worse-fate.choices.benefit.options.sacrifices.name: Sacrifices
titles.echelon-1.saved-for-a-worse-fate.choices.benefit.options.saviors.name: Saviors
titles.echelon-1.ship-captain.name: Ship Captain
titles.echelon-1.ship-captain.description: >-
  *Up anchor, shipmates! 'Tisn't gold but glory we seek!*


  **Prerequisite:** You acquire a ship, airship, or similar vessel.


  **Effect:** Choose one of the following benefits:


  - *Deep-Sea Diver:* You can automatically swim at full speed while moving.

  - *Ship Speaker:* You magically know the location of any ship controlled by your party even while
  you aren't aboard. You can telepathically communicate with anyone on board one of your ships who
  understands a language, and they can respond, no matter your distance from the ship.

  - *Signal Flags:* While aboard a ship, you can communicate with and conduct negotiations with
  another ship up to 5 miles away, as long as you and creatures on the other ship have line of
  effect to each other. You gain an edge on Presence tests made while negotiating in this way.

  - *Trained Crewmember:* You gain an edge on tests made to handle air or sea vessels.
titles.echelon-1.ship-captain.texts.prerequisite: You acquire a ship, airship, or similar vessel.
titles.echelon-1.ship-captain.choices.benefit.prompt: Benefit
titles.echelon-1.ship-captain.choices.benefit.options.deep-sea-diver.name: Deep-Sea Diver
titles.echelon-1.ship-captain.choices.benefit.options.ship-speaker.name: Ship Speaker
titles.echelon-1.ship-captain.choices.benefit.options.signal-flags.name: Signal Flags
titles.echelon-1.ship-captain.choices.benefit.options.trained-crewmember.name: Trained Crewmember
titles.echelon-1.troupe-leading-player.name: Troupe Leading Player
titles.echelon-1.troupe-leading-player.description: >-
  *We're actors! We're the opposite of people!*


  **Prerequisite:** The party has successfully performed as a troupe of actors, circus performers,
  or other entertainers.


  **Effect:** Choose one of the following benefits:


  - *Flying Circus:* When you are adjacent to a willing ally on their turn, you can use a triggered
  action to push them up to 2 squares if their size is the same as yours, or 4 squares if they are
  smaller. If this push causes the ally to fall, they can use a maneuver before they fall to reduce
  the height of the fall by 2.

  - *Spotlight:* You magically cause a creature within 10 squares to shed light for 5 squares. This
  light lasts for 1 minute, until the creature is more than 10 squares away from you, or until you
  dismiss the effect (no action required). While illuminated, a creature can't sneak or hide, they
  take a bane on tests made to perform any action secretly, and they gain an edge on tests made
  using the Lead, Music, or Perform skills.

  - *Supporting Player:* You gain an edge on group tests using Presence and on tests made to assist
  another creature with a Presence test.

  - *Work the Crowd:* While any of your allies is playing music or performing, you gain an edge on
  tests made to conceal objects, hide, pick pockets, or sneak.
titles.echelon-1.troupe-leading-player.texts.prerequisite: The party has successfully performed as a
  troupe of actors, circus performers, or other entertainers.
