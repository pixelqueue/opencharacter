titles.echelon-3.armed-and-dangerous.name: Armed and Dangerous
titles.echelon-3.armed-and-dangerous.description: >-
  *I'm not picky. Any tool will suffice. A sword seems a most appropriate tool for this job.*


  **Prerequisite:** You can't use kits, and you defeat five non-minion enemies using weapon
  abilities that don't have the Magic or Psionic keyword.


  **Effect:** You can use and gain the benefits of kits.
titles.echelon-3.armed-and-dangerous.texts.prerequisite: You can't use kits, and you defeat five
  non-minion enemies using weapon abilities that don't have the Magic or Psionic keyword.
titles.echelon-3.back-from-the-grave.name: Back From the Grave
titles.echelon-3.back-from-the-grave.description: >-
  *Hi! Remember me?*


  **Prerequisite:** You die at the hands of your greatest foe, that foe still lives, and you aren't
  a revenant.


  **Effect:** You are restored to life. You gain the Tough But Withered signature trait from the
  revenant ancestry.
titles.echelon-3.back-from-the-grave.texts.prerequisite: You die at the hands of your greatest foe, that foe still lives, and you aren't a revenant.
titles.echelon-3.back-from-the-grave.prerequisites.not-revenant: not a revenant
titles.echelon-3.demon-slayer.name: Demon Slayer
titles.echelon-3.demon-slayer.description: >-
  *F'lath v'korr en zaratha g'rrack.*


  **Prerequisite:** You defeat a leader or solo creature with the Demon keyword, such as a soulraker
  hivequeen, or you are possessed by a demon.


  **Effect:** Choose one of the following benefits:


  *Demonic Lore:* You know the Proto-Ctholl language. Additionally, when you deal damage using a
  magic ability, you can change the ability's damage type to holy.


  - *Lethe:* While you are winded, your strikes gain a +5 damage bonus

  - *Made of Teeth:* Your body can sprout teeth in unusual places. Whenever a creature makes
  physical contact with you or starts their turn touching you, you can deal 5 damage to them (no
  action required).

  - *Soulsight:* Any creature within 2 squares can't be hidden from you.


  **Special:** When you make a Presence test and roll a natural 5 or lower, you are cursed to
  communicate in only Proto-Ctholl for 1 minute, whether you know that language or not.
titles.echelon-3.demon-slayer.texts.prerequisite: You defeat a leader or solo creature with the
  Demon keyword, such as a soulraker hivequeen, or you are possessed by a demon.
