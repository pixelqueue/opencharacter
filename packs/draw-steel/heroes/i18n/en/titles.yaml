titles.echelon-2.faction-officer.name: Faction Officer
titles.echelon-2.faction-officer.description: >-
  *If you want or need something, talk to me. I have a certain... influence in these parts.*


  **Prerequisite:** You have the Faction Member title, and you greatly advance the faction's goals.


  **Effect:** You are given a position of great authority in your faction. Additionally, you gain
  the following benefits:


  - *Requisition:* When you gain this title, you gain a 1st- or 2nd-echelon magic trinket of your
  choice from your faction (see Treasures earlier in this chapter). Whenever you gain a level, you
  can swap the trinket out for another one.

  - *You're the Boss:* Lower-ranking members of your faction follow your routine orders. In
  nonroutine matters, you gain an edge on tests made to influence those characters' behavior.
titles.echelon-2.faction-officer.texts.prerequisite: You have the Faction Member title, and you greatly advance the faction's goals.
titles.echelon-2.faction-officer.prerequisites.faction-member: the Faction Member title
titles.echelon-2.fey-friend.name: Fey Friend
titles.echelon-2.fey-friend.description: >-
  *Do you enjoy the vintage? Yes, you can understand my tongue now. One does not drink at my table
  and leave unchanged.*


  **Prerequisite:** You eat and drink with an elf monarch or archfey.


  **Effect:** You know the Khelt language. Additionally, choose one of the following benefits:


  - *Gift of Charm:* You have a skill of your choice from the interpersonal skill group.

  - *Gift of Foresight:* When resisting potencies, your Intuition score is considered to be 1 higher
  than usual.

  - *Gift of Knowledge:* You gain an edge on tests you make that use any skill from the lore skill
  group.
titles.echelon-2.fey-friend.texts.prerequisite: You eat and drink with an elf monarch or archfey.
