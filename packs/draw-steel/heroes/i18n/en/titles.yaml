titles.echelon-1.elemental-dabbler.name: Elemental Dabbler
titles.echelon-1.elemental-dabbler.description: >-
  *Spirit of fire, I command you!*


  **Prerequisite:** You defeat a creature with the Elemental keyword, such as a crux of fire.


  **Effect:** Choose a damage type to which the defeated creature had an immunity (such as fire).
  Then choose one of the following benefits:


  - *Elemental Blaster:* You have the Elementalist 1st-level Hurl Element feature, dealing the
  chosen damage type.

  - *Elemental Immunity:* You have immunity to the chosen damage type equal to your highest
  characteristic score.

  - *Elemental Weapons:* Whenever you use a damage-dealing weapon ability, that ability can deal
  damage of the chosen type instead of its usual damage type.
titles.echelon-1.elemental-dabbler.texts.prerequisite: You defeat a creature with the Elemental keyword, such as a crux of fire.
titles.echelon-1.elemental-dabbler.choices.damage-type.prompt: Damage type
