titles.echelon-2.master-librarian.name: Master Librarian
titles.echelon-2.master-librarian.description: >-
  *You want to know the exact coordinates of the **Gem of the Waves** shipwreck? I came across that
  just the other day in an unpublished memoir of its second mate. Let me get that for you.*


  **Prerequisite:** You have the Ancient Loremaster title, and you have completed a Discover Lore
  project to learn lost knowledge or forbidden knowledge.


  **Effect:** Choose one of the following benefits:


  - *Arcane Improvisation:* When you use a damage-dealing magic signature ability, you can change
  its damage type to acid, cold, corruption, fire, lightning, poison, or sonic damage.

  - *I Have Just the Book:* If you start a Discover Lore project in your hero's stronghold or other
  a permanent base of operations you immediately gain 60 project points toward the completion of
  that project. If the project costs 60 or fewer points, you complete it in 10 uninterrupted minutes
  without needing to use a respite activity.

  - *Picked Up a Few Things:* You know a skill from the lore skill group.

  - *Polyglot:* You know two languages. Additionally, the project goal for the Learn New Language
  project is halved for you.
titles.echelon-2.master-librarian.texts.prerequisite: You have the Ancient Loremaster title, and you
  have completed a Discover Lore project to learn lost knowledge or forbidden knowledge.
