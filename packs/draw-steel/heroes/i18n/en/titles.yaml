titles.echelon-1.battleaxe-diplomat.choices.benefit.options.warriors-understanding.name: Warriors' Understanding
titles.echelon-1.brawler.name: Brawler
titles.echelon-1.brawler.description: >-
  *We won't kill you. But you might wish we had.*


  **Prerequisite:** You triumph in battle without killing any of your foes.


  **Effect:** Choose one of the following benefits:


  - *Duck!:* When an enemy strikes you while a second creature is flanking you, you can use a
  triggered action to redirect the strike against the second creature. Once you use this benefit,
  you can't use it again until you earn 1 or more Victories.

  - *Furniture Fighter:* When you use a weapon ability with an improvised weapon or a weapon that
  isn't part of your kit, the ability benefits from your kit's melee weapon damage bonus.

  - *Headbutt:* While you are grabbed or restrained, your free strikes don't take a bane when those
  conditions would impose one.

  - *If I Wanted You Dead, You'd Be Dead:* Whenever you defeat foes without killing any of them
  (including the foes you defeat to meet the prerequisite for this title), you gain an edge on tests
  during negotiations with those foes.
titles.echelon-1.brawler.texts.prerequisite: You triumph in battle without killing any of your foes.
titles.echelon-1.brawler.choices.benefit.prompt: Benefit
titles.echelon-1.brawler.choices.benefit.options.duck.name: Duck!
titles.echelon-1.brawler.choices.benefit.options.furniture-fighter.name: Furniture Fighter
titles.echelon-1.brawler.choices.benefit.options.headbutt.name: Headbutt
titles.echelon-1.brawler.choices.benefit.options.if-i-wanted-you-dead-youd-be-dead.name: If I Wanted You Dead, You'd Be Dead
titles.echelon-1.city-rat.name: City Rat
titles.echelon-1.city-rat.description: >-
  *Stay out all night, visit the dives. Get in a fight, run from the cops. That's the real city.*


  **Prerequisite:** You have spent at least five respites in a metropolis.


  **Effect:** Choose one of the following benefits:


  - *Discerning Shopper:* When looking for an item prerequisite for a crafting project, you can
  remember meeting someone who might have the item—or at least information about it.

  - *One with the Crowd:* While you're using one or more creatures as cover, you gain an edge on
  tests made to hide and sneak.

  - *Street Smart:* While in a settlement, you can't be surprised.
titles.echelon-1.city-rat.texts.prerequisite: You have spent at least five respites in a metropolis.
titles.echelon-1.city-rat.choices.benefit.prompt: Benefit
