titles.echelon-3.demon-slayer.choices.benefit.options.soulsight.name: Soulsight
titles.echelon-3.diabolist.name: Diabolist
titles.echelon-3.diabolist.description: >-
  *If you can't beat 'em, join 'em.*


  **Prerequisite:** You defeat a leader or solo creature with the Devil keyword, such as an
  archdevil, or you make a deal with a devil.


  **Effect:** Choose one of the following benefits:


  - *Devil Lore:* You know the Anjali language, and your understanding of this language helps you
  create irresistible supernatural effects. The potencies of your magic or psionic abilities that
  target Reason, Intuition, or Presence increase by 1.

  - *Infernal Legacy:* You gain 3 ancestry points to spend on purchased devil ancestry traits (see
  Chapter 3).

  - *Sly Devil:* You gain the Silver Tongue signature trait from the devil ancestry.

  - *Untouched by Corruption:* Whenever you use a damage-dealing ability, that ability can deal holy
  damage instead of its usual damage type.
titles.echelon-3.diabolist.texts.prerequisite: You defeat a leader or solo creature with the Devil
  keyword, such as an archdevil, or you make a deal with a devil.
