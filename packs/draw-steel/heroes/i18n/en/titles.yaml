titles.echelon-2.battlefield-commander.name: Battlefield Commander
titles.echelon-2.battlefield-commander.description: >-
  *Spells and shadows have their place, but it takes soldiers to hold the field.*


  **Prerequisite:** You lead an army in battle and win.


  **Effect:** Choose one of the following benefits:


  - *Charge!:* You have the following ability, which can be paid for using the Heroic Resource of
  your class.


  > ###### Charge! (9 Heroic Resource)

  >

  > *Follow me!*

  >

  > | **Area**       |                       **Main action** |

  > | -------------- | ------------------------------------: |

  > | **📏 3 burst** | **🎯 Self and each ally in the area** |

  >

  > **Effect:** Each target can use the Charge main action.


  - *Renowned Warrior:* You earn 1 Renown.

  - *Student of War:* Choose a 1st-level doctrine feature from the tactician class. You gain that
  feature even if you don't have the Tactical Doctrine feature.
titles.echelon-2.battlefield-commander.texts.prerequisite: You lead an army in battle and win.
