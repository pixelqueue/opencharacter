titles.echelon-3.noble.name: Noble
titles.echelon-3.noble.description: >-
  *Technically, I'm called Lord Morninghill these days. I did a little favor for Duke Kenway at the
  Battle of Black Forest.*


  **Prerequisite:** A monarch or important noble grants you a noble rank.


  **Effect:** Choose one of the following benefits:


  - *I Know How to Talk to These People:* You gain an edge on Presence tests made to interact with
  royals, nobles, and their feudal followers, provided they are aware of your noble rank.

  - *Noble Splendor:* You earn 1 Renown and 1 Wealth.

  - *Retinue:* The number of followers you can recruit increases by two.


  **Special:** If you take this title, you might occasionally be called upon to perform duties for
  the person who granted your noble rank.
titles.echelon-3.noble.texts.prerequisite: A monarch or important noble grants you a noble rank.
titles.echelon-3.noble.choices.benefit.prompt: Benefit
titles.echelon-3.noble.choices.benefit.options.i-know-how-to-talk-to-these-people.name: I Know How to Talk to These People
titles.echelon-3.noble.choices.benefit.options.noble-splendor.name: Noble Splendor
titles.echelon-3.noble.choices.benefit.options.retinue.name: Retinue
titles.echelon-3.planar-voyager.name: Planar Voyager
titles.echelon-3.planar-voyager.description: >-
  *I've seen skywhales floating above the seas of Primordius. I've seen star freighters dancing
  around the moons of Axiom. So I guess you're right, I'm not from around these parts.*


  **Prerequisite:** You voyage in strange vehicles on different worlds.


  **Effect:** Choose one of the following benefits:


  - *Prismacore Eyes:* Exposure to prismacore has given your eyes a mirrorlike sheen. You have
  psychic immunity 10, creatures can't use magic or psionic abilities or other effects to determine
  your location or read your thoughts unless you allow them to, and you gain a +3 bonus to stability
  against magic or psionic abilities.

  - *Stellar Knowledge:* You gain the Mechanics skill. If you already have this skill, you instead
  gain an edge on tests made using the skill. Additionally, you gain the item prerequisite and
  project source for a psionic trinket.

  - *Time Raider Training:* You gain 2 ancestry points to spend on purchased time raider ancestry
  traits (see Chapter 3).
titles.echelon-3.planar-voyager.texts.prerequisite: You voyage in strange vehicles on different worlds.
titles.echelon-3.planar-voyager.choices.benefit.prompt: Benefit
titles.echelon-3.planar-voyager.choices.benefit.options.prismacore-eyes.name: Prismacore Eyes
titles.echelon-3.planar-voyager.choices.benefit.options.stellar-knowledge.name: Stellar Knowledge
titles.echelon-3.planar-voyager.choices.benefit.options.time-raider-training.name: Time Raider Training
titles.echelon-3.planar-voyager.choices.benefit.options.time-raider-training.choices.traits.prompt: Ancestry traits
titles.echelon-3.scarred.name: Scarred
titles.echelon-3.scarred.description: >-
  *Last time we fought, I gave you a little token to remember me by... now it appears you need
  another reminder of my power.*


  **Prerequisite:** An enemy leader or solo creature reduces you to 0 Stamina.


  **Effect:** You gain a visible scar in a location of your choice. Additionally, your Stamina
  maximum increases by 20, and the creature who scarred you takes a bane on abilities against you.


  **Special:** You can gain this title multiple times. The second and each subsequent time that you
  gain it, your Stamina maximum doesn't increase.
titles.echelon-3.scarred.texts.prerequisite: An enemy leader or solo creature reduces you to 0 Stamina.
titles.echelon-3.siege-breaker.name: Siege Breaker
titles.echelon-3.siege-breaker.description: >-
  *Best way to deal with a castle siege? Be on the outside.*


  **Prerequisite:** You have the Battlefield Commander title, and you lead the defense of a
  settlement or fortification.


  **Effect:** Choose one of the following benefits:


  - *Death From Above:* When you gain an edge on an ability due to high ground, the ability gains a
  +8 damage bonus.

  - *Hold the Line:* While you're within 5 squares of an ally, you and each ally within 5 squares of
  you gains a +3 bonus to stability.

  - *Last Defender:* Whenever an ally within 5 squares is reduced to 0 Stamina, you gain temporary
  Stamina equal to the ally's level (or 1 if they have no level). If you already have temporary
  Stamina granted by this title, you increase your temporary Stamina by the amount you would have
  gained.
titles.echelon-3.siege-breaker.texts.prerequisite: You have the Battlefield Commander title, and you
  lead the defense of a settlement or fortification.
titles.echelon-3.siege-breaker.choices.benefit.prompt: Benefit
titles.echelon-3.siege-breaker.choices.benefit.options.death-from-above.name: Death From Above
titles.echelon-3.siege-breaker.choices.benefit.options.hold-the-line.name: Hold the Line
titles.echelon-3.siege-breaker.choices.benefit.options.last-defender.name: Last Defender
titles.echelon-3.siege-breaker.prerequisites.battlefield-commander: the Battlefield Commander title
titles.echelon-3.teacher.name: Teacher
titles.echelon-3.teacher.description: >-
  *Someday, I'll understand how peeling these carrots for dinner relates to my elementalist
  training.*


  **Prerequisite:** You train or command at least three lower-level members of your class.


  **Effect:** You can travel with a student who shares your class. The student has the statistics of
  a 1st-level member of your class and has the same skills as you, but doesn't engage in combat.
  They can perform any out-of-combat tasks a 1st-level member of your class can perform. Whenever
  they make a test to assist you in a task, they can't obtain less than a tier 2 outcome on the
  test.
titles.echelon-3.teacher.texts.prerequisite: You train or command at least three lower-level members of your class.
titles.echelon-4.champion-competitor.name: Champion Competitor
titles.echelon-4.champion-competitor.description: >-
  *Marduk uses the Beldoit Gambit! Avanna counters with the Iron Defense and goes on the attack!
  Marduk's last tower is knocked down! And just like that, we have a new... world... champion!*


  **Prerequisite:** You beat the best in the world at a game or sport.


  **Effect:** A characteristic used during the competition increases by 1 (to a maximum of 6).
  Additionally, choose one of the following benefits:


  - *Best of the Best:* Choose a skill you used during the competition. You gain a +4 bonus to tests
  made using that skill instead of a +2 bonus

  - *Glory and Riches:* You earn 2 Renown and 1 Wealth.

  - *I'll Just Take the Prize:* You gain a trinket or leveled treasure of the Director's choice.
titles.echelon-4.champion-competitor.texts.prerequisite: You beat the best in the world at a game or sport.
titles.echelon-4.champion-competitor.choices.characteristic.prompt: Characteristic to increase
