titles.echelon-1.ancient-loremaster.choices.benefit.options.susurrus-codex.name: Susurrus Codex
titles.echelon-1.battleaxe-diplomat.name: Battleaxe Diplomat
titles.echelon-1.battleaxe-diplomat.description: >-
  *We seem to be equals in might and combat prowess. Perhaps we should bandy words awhile instead.*


  **Prerequisite:** You gain the friendship or alliance of a creature you once battled.


  **Effect:** Choose one of the following benefits:


  - *Iron Hand in Velvet Glove:* The first time during a negotiation that you make a test using the
  Intimidate skill and don't make an argument that appeals to an NPC's motivation, you don't lower
  the NPC's patience or interest no matter the outcome of the roll.

  - *Truce!:* You have a double edge on tests made to stop combat and start a negotiation.

  - *Warriors' Understanding:* You gain an edge on Presence tests made to interact with creatures
  you have fought against in combat encounters.
titles.echelon-1.battleaxe-diplomat.texts.prerequisite: You gain the friendship or alliance of a creature you once battled.
titles.echelon-1.battleaxe-diplomat.choices.benefit.prompt: Benefit
titles.echelon-1.battleaxe-diplomat.choices.benefit.options.iron-hand-in-velvet-glove.name: Iron Hand in Velvet Glove
