titles.echelon-2.undead-slain.name: Undead Slain
titles.echelon-2.undead-slain.description: >-
  *No, I didn't get bitten. And yes, I'm fine!*


  **Prerequisite:** You are killed by an undead creature.


  **Effect:** You return to life 1 minute after being killed with Stamina equal to your winded
  value. You gain corruption immunity equal to your level and one of the benefits below, based on
  the type of creature who killed you. If you die again, you rise as an undead creature under the
  Director's control.


  - *Ghoul or Vampire:* When you make a melee free strike against an adjacent creature, you can bite
  that creature. If you do so and obtain a tier 3 outcome, you gain temporary Stamina equal to the
  damage dealt. If not lost beforehand, this temporary Stamina lasts until the end of your next
  respite.

  - *Incorporeal Undead:* You can move through other creatures and objects. The first time in a
  combat round that you pass through a creature, that creature takes corruption damage equal to half
  your level. You don't take damage from being force moved into objects.

  - *Other Corporeal Undead:* When you are reduced to 0 Stamina by damage that isn't fire or holy
  damage and your body isn't destroyed, you can regain half your Stamina and fall prone. Once you
  use this benefit, you can't use it again until you earn 10 or more Victories.
titles.echelon-2.undead-slain.texts.prerequisite: You are killed by an undead creature.
titles.echelon-2.undead-slain.choices.benefit.prompt: Benefit
titles.echelon-2.undead-slain.choices.benefit.options.ghoul-or-vampire.name: Ghoul or Vampire
