titles.echelon-1.wanted-dead-or-alive.name: Wanted Dead or Alive
titles.echelon-1.wanted-dead-or-alive.description: >-
  *A hundred silver?! An insult! I turned my father in for fifty golden crowns. And he was
  innocent!*


  **Prerequisite:** You are declared an outlaw by a governmental authority.


  **Effect:** Choose one of the following benefits:


  - *Honor Among Thieves:* When negotiating with criminals, your Renown score is considered to be 2
  higher than usual.

  - *Minion Mower:* When you make a melee strike that targets a minion and at least one more minion
  is within distance of the strike, the strike gains a +3 damage bonus.

  - *No, You're Under Arrest!:* You gain an edge on the Escape Grab maneuver. Additionally, when you
  succeed on a test to escape bonds or manacles, as part of the same maneuver, you can transfer the
  bonds or manacles to an adjacent creature of the same size without them immediately noticing.
titles.echelon-1.wanted-dead-or-alive.texts.prerequisite: You are declared an outlaw by a governmental authority.
titles.echelon-1.wanted-dead-or-alive.choices.benefit.prompt: Benefit
titles.echelon-1.wanted-dead-or-alive.choices.benefit.options.honor-among-thieves.name: Honor Among Thieves
titles.echelon-1.wanted-dead-or-alive.choices.benefit.options.minion-mower.name: Minion Mower
titles.echelon-1.wanted-dead-or-alive.choices.benefit.options.no-youre-under-arrest.name: No, You're Under Arrest!
titles.echelon-1.zombie-slayer.name: Zombie Slayer
titles.echelon-1.zombie-slayer.description: >-
  *Why won't you die?! You've already done it once, you should be good at it by now!*


  **Prerequisite:** You defeat a leader or solo creature with the Undead keyword, such as a ghost.


  **Effect:** Choose one of the following benefits:


  - *Blessed Weapons:* Whenever you use a damage-dealing weapon ability, that ability can deal holy
  damage instead of its usual damage type.

  - *Divine Health:* You gain corruption immunity equal to your highest characteristic score.
  Additionally, you can't be turned into an undead creature.

  - *Holy Terror:* You have the following ability, which can be paid for using the Heroic Resource
  of your class.


  > ###### Holy Terror (3 Heroic Resource)

  >

  > *Return to your grave!*

  >

  > | **Area, Magic** |                         **Maneuver** |

  > | --------------- | -----------------------------------: |

  > | **📏 3 burst**  | **🎯 Each undead enemy in the area** |

  >

  > **Effect:** Each target takes holy damage equal to your Reason, Intuition, or Presence score
  (your choice). Additionally, each target who has P < STRONG is frightened (save ends).
titles.echelon-1.zombie-slayer.texts.prerequisite: You defeat a leader or solo creature with the Undead keyword, such as a ghost.
titles.echelon-1.zombie-slayer.choices.benefit.prompt: Benefit
