titles.echelon-2.godsworn.name: Godsworn
titles.echelon-2.godsworn.description: >-
  *He seemed like he needed help! Now the dead speak to me. I think maybe that old man was more than
  he appeared.*


  **Prerequisite:** You do a favor for an agent of a god or saint, or promise to do so.


  **Effect:** Choose one of the following benefits:


  - *Healing Gift:* You can use the 1st-level Conduit feature Healing Grace as if you had spent 1
  piety (see Chapter 5: Classes). Once you use this benefit, you can't use it again until you earn 1
  or more Victories.

  - *Last-Ditch Prayer:* As a free maneuver, you recite a prayer for help, gaining a pool of 2d10 of
  the Heroic Resource granted by your class. This pool disappears at the end of your turn if you
  haven't used it. Once you use this benefit, you can't use it again until you perform another
  service for a god or saint, or until you gain a level.

  - *Touched by the Divine:* Choose a god or saint from the Deities and Domains table in Chapter 14:
  Gods and Religion. From that god or saint's domains, choose a Conduit 1st-level domain feature
  (see Chapter 5: Classes).
titles.echelon-2.godsworn.texts.prerequisite: You do a favor for an agent of a god or saint, or promise to do so.
