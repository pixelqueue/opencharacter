titles.echelon-3.dragon-blooded.name: Dragon Blooded
titles.echelon-3.dragon-blooded.description: >-
  *I stabbed the wyrm Axarthan in the heart and their silver blood washed over me, leaving me... as
  you see.*


  **Prerequisite:** You defeat a leader or solo creature with the Dragon keyword, such as a gloom
  dragon.


  **Effect:** Choose one of the following benefits:


  - *Dragon Scaled:* Dragon scales grow on your body wherever the heart's blood of the dragon
  touched you. You gain the Wyrmplate signature trait from the dragon knight ancestry (see Chapter
  3).

  - *Dragon Touched:* You gain 3 ancestry points to spend on purchased dragon knight ancestry
  traits.
titles.echelon-3.dragon-blooded.texts.prerequisite: You defeat a leader or solo creature with the Dragon keyword, such as a gloom dragon.
