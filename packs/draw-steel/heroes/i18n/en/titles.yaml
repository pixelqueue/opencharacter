titles.echelon-2.unstoppable.name: Unstoppable
titles.echelon-2.unstoppable.description: >-
  *I seen the goblin king run 'im through with a spear. Then I seen 'im pull 'imself back up, spear
  still in 'im, and headbutt the goblin king... then he pulls out the spear and throws it on the
  goblin king's corpse.*


  **Prerequisite:** You defeat a foe while at or below 0 Stamina.


  **Effect:** Choose one of the following benefits:


  - *From Hell's Heart:* While you are winded, your melee strikes gain a +3 damage bonus.

  - *Furious Attack:* Choose one signature ability from the fury class. You gain that ability
  regardless of whether your class and subclass allow you to take it. If this ability allows you to
  gain or spend ferocity, you can't do so unless you have the Ferocity class feature.

  - *Furious Charge:* When you use the Charge action, your strike made as part of that action gains
  a damage bonus equal to the number of squares you moved as part of the charge.
titles.echelon-2.unstoppable.texts.prerequisite: You defeat a foe while at or below 0 Stamina.
