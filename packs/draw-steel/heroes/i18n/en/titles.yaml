titles.echelon-2.blood-magic.name: Blood Magic
titles.echelon-2.blood-magic.description: >-
  *Flow, blood, thou fiend's libation, and catch my foes in conflagration!*


  **Prerequisite:** You participate in a Discover Lore project to learn forbidden knowledge.


  **Effect:** Choose one of the following benefits:


  - *Blood Mage:* When you use an area ability with the Magic or Psionic keyword, you can take
  damage equal to your level to increase the ability's area by 1 until the end of the encounter. If
  the area is a line, you increase the size of one dimension, not both. This damage can't be reduced
  in any way. You can use this benefit only once per use of an ability.

  - *Bloody Murder:* When you deal rolled damage to a creature with a strike, you can take damage
  equal to your level to deal twice that much corruption damage to the creature. The damage you take
  from this title can't be reduced in any way. You can use this benefit only once per ability. If
  the creature is reduced to 0 Stamina by this corruption damage, the creature explodes in a shower
  of blood and you regain the Stamina you lost. You can't use this benefit on creatures without
  blood, such as constructs, elementals, or undead.

  - *I Reject This Evil Power!:* You gain corruption immunity equal to your level.
titles.echelon-2.blood-magic.texts.prerequisite: You participate in a Discover Lore project to learn forbidden knowledge.
