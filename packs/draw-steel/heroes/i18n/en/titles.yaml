titles.echelon-1.local-hero.name: Local Hero
titles.echelon-1.local-hero.description: >-
  *Your coin won't spend here. The Heroes of Gravesford drink for free in this tavern!*


  **Prerequisite:** You save a community from certain destruction.


  **Effect:** Choose one of the following benefits:


  - *Easy Marks:* You gain an edge on tests made using skills from the interpersonal and intrigue
  skill groups when influencing members of a community that you have saved.

  - *Local Fame:* You earn 1 Renown.

  - *A New Dawn:* Each time you finish a respite while in a community you have saved, the party
  gains a hero token. This hero token disappears at the end of your next respite if it hasn't been
  used.


  > **Renown and Wealth**

  >

  > Many titles bestow Renown, followers, and wealth upon heroes. Those topics are covered later in
  this chapter.
titles.echelon-1.local-hero.texts.prerequisite: You save a community from certain destruction.
titles.echelon-1.local-hero.choices.benefit.prompt: Benefit
titles.echelon-1.local-hero.choices.benefit.options.easy-marks.name: Easy Marks
