titles.echelon-2.blood-magic.choices.benefit.options.i-reject-this-evil-power.name: I Reject This Evil Power!
titles.echelon-2.corsair.name: Corsair
titles.echelon-2.corsair.description: >-
  *Haul down your flag or we'll burn you to the waterline!*


  **Prerequisite:** You have the Ship Captain title, and you sink or capture a ship of equal or
  greater size than your own.


  **Effect:** Choose one of the following benefits:


  - *Artillerist:* You gain a +5 damage bonus when using a ship's weapons

  - *Black Flag:* You have a recognizable flag that strikes terror on the high seas. While your flag
  is flying from your ship, crewmembers of other ships who have line of effect to the flag take a
  bane on strikes made against your ship or its crew.

  - *Fearsome Reputation:* You earn 1 Renown.

  - *Scoundrel Tactics:* While aboard a ship, you can use the following skills to make a test to
  influence another ship up to 5 miles away whose crewmembers have line of effect to you, and you
  gain an edge when you do so. You can use Disguise to hide your ship's identity or general type,
  Intimidate to convince another ship's crew to flee or surrender, or Hide or Sneak to let your ship
  avoid notice.
titles.echelon-2.corsair.texts.prerequisite: You have the Ship Captain title, and you sink or
  capture a ship of equal or greater size than your own.
