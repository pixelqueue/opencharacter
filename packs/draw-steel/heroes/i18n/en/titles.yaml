titles.echelon-3.maestro.name: Maestro
titles.echelon-3.maestro.description: >-
  *When I saw the bloodstained manuscript under Fellwander's arm, I knew his quest for the Opera was
  over—and with it, his chance for redemption.*


  **Prerequisite:** You visit the realms of gods, devils, or other immortal beings and hear a note
  of the Music of Creation.


  **Effect:** Choose one of the following benefits:


  - *Angelic Chorus:* You can use the lessons of musical improvisation in combat. Choose one class
  act triggered action from the troubadour class. You gain that ability regardless of whether your
  class and subclass allow you to take it. If this ability allows you to gain or spend drama, you
  can gain or spend the Heroic Resource of your class in place of drama.

  - *Devil's Opera:* You have the following ability, which can be paid for using the Heroic Resource
  of your class.


  > ###### The Devil's Chord (9 Heroic Resource)

  >

  > *Helloooo Orden!*

  >

  > | **Area, Magic** |                  **Main action** |

  > | --------------- | -------------------------------: |

  > | **📏 5 burst**  | **🎯 Each creature in the area** |

  >

  > **Power Roll + Presence:**

  >

  > - **≤11:** You take 4 sonic damage unless you have the Performance skill.

  > - **12-16:** 6 sonic damage; M < AVERAGE, weakened (save ends)

  > - **17+:** 10 sonic damage; M < STRONG, weakened and bleeding (save ends)

  >

  > **Effect:** The soul of any creature killed by this ability is dragged to Hell.


  - *Music of the Spheres:* As a main action, you sing or play a note as delicate and sharp as
  glass—and just as easily shattered. Until the start of your next turn, whenever a creature within
  10 squares makes a strike, they take 8 sonic damage. Whenever you make a strike during that same
  period, you also take 8 sonic damage.
titles.echelon-3.maestro.texts.prerequisite: You visit the realms of gods, devils, or other immortal
  beings and hear a note of the Music of Creation.
titles.echelon-3.maestro.choices.benefit.prompt: Benefit
