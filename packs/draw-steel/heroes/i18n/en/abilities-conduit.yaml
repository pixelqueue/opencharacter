abilities.conduit.staggering-curse.name: Staggering Curse
abilities.conduit.staggering-curse.description: '*A blast of judgment disorients your foe.*'
abilities.conduit.staggering-curse.texts.target: One creature or object
abilities.conduit.staggering-curse.texts.distance: Melee 1
abilities.conduit.staggering-curse.texts.roll: Power Roll + Intuition
abilities.conduit.staggering-curse.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + I}} holy damage; slide 1'
abilities.conduit.staggering-curse.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + I}} holy damage; slide 2'
abilities.conduit.staggering-curse.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + I}} holy damage; slide 3'
abilities.conduit.word-of-guidance.name: Word of Guidance
abilities.conduit.word-of-guidance.description: '*You invigorate an attacking ally with divine energy.*'
abilities.conduit.word-of-guidance.texts.trigger: The target makes an ability roll for a damage-dealing ability.
abilities.conduit.word-of-guidance.texts.target: One ally
abilities.conduit.word-of-guidance.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.word-of-guidance.texts.effect: |-
  Effect: The power roll gains an edge.

  Spend 1 Piety: The power roll has a double edge.
abilities.conduit.ray-of-wrath.name: Ray of Wrath
abilities.conduit.ray-of-wrath.description: '*You unleash a blast of holy light upon your foe.*'
abilities.conduit.ray-of-wrath.texts.target: One creature or object
abilities.conduit.ray-of-wrath.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.ray-of-wrath.texts.roll: Power Roll + Intuition
abilities.conduit.ray-of-wrath.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + I}} damage'
abilities.conduit.ray-of-wrath.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + I}} damage'
abilities.conduit.ray-of-wrath.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + I}} damage'
abilities.conduit.ray-of-wrath.texts.effect: 'Effect: You can have this ability deal holy damage.'
abilities.conduit.blessed-light.name: Blessed Light
abilities.conduit.blessed-light.description: '*Burning radiance falls upon your foe, transferring some of their energy to a nearby ally.*'
abilities.conduit.blessed-light.texts.target: One creature or object
abilities.conduit.blessed-light.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.blessed-light.texts.roll: Power Roll + Intuition
abilities.conduit.blessed-light.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + I}} holy damage'
abilities.conduit.blessed-light.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + I}} holy damage'
abilities.conduit.blessed-light.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + I}} holy damage'
abilities.conduit.blessed-light.texts.effect: 'Effect: One ally within distance gains a number of
  surges equal to the tier outcome of your power roll.'
abilities.conduit.call-the-thunder-down.name: Call the Thunder Down
abilities.conduit.call-the-thunder-down.description: '*You ask your saint for thunder and your prayer is answered.*'
abilities.conduit.call-the-thunder-down.texts.target: Each enemy in the area
abilities.conduit.call-the-thunder-down.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.conduit.call-the-thunder-down.texts.roll: Power Roll + Intuition
abilities.conduit.call-the-thunder-down.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} sonic damage; push 1'
abilities.conduit.call-the-thunder-down.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3}} sonic damage; push 2'
abilities.conduit.call-the-thunder-down.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {5}} sonic damage; push 3'
abilities.conduit.call-the-thunder-down.texts.effect: 'Effect: You can push each willing ally in the area the same distance, ignoring stability.'
abilities.conduit.healing-grace.name: Healing Grace
abilities.conduit.healing-grace.params.graceRecoveries.name: Extra Recoveries (1 piety each)
abilities.conduit.healing-grace.params.graceStand.name: A prone target stands up (1 piety)
abilities.conduit.healing-grace.description: '*Your divine energy restores the righteous.*'
abilities.conduit.healing-grace.texts.target: Self or one ally
abilities.conduit.healing-grace.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.healing-grace.texts.effect: >-
  Effect: The target can spend a Recovery.


  Spend 1+ Piety: For each piety spent, choose one of the following enhancements:

  - You can target one additional ally within distance.

  - You can end one effect on a target that is ended by a saving throw or that ends at the end of
  their turn.

  - A prone target can stand up.

  - A target can spend 1 additional Recovery.
abilities.conduit.faithful-friend.name: Faithful Friend
abilities.conduit.faithful-friend.description: '*An animal spirit is drawn to you, sharing their senses with you and serving you faithfully.*'
abilities.conduit.faithful-friend.texts.target: Self
abilities.conduit.faithful-friend.texts.distance: Self
abilities.conduit.faithful-friend.texts.effect: "Effect: You conjure a spirit that takes the form of
  any animal you have seen. The incorporeal animal has speed 5 and can fly, but can't physically
  interact with the world. While you are within 10 squares of the spirit, you automatically sense
  everything that type of animal would sense, in addition to sensing your own surroundings. You can
  dismiss the spirit at any time (no action required). If the spirit takes any damage, they are
  dismissed and you take 1d10 psychic damage that can't be reduced in any way."
abilities.conduit.grave-speech.name: Grave Speech
abilities.conduit.grave-speech.description: '*You commune with the lingering soul of the recently dead.*'
abilities.conduit.grave-speech.texts.target: One dead creature
abilities.conduit.grave-speech.texts.distance: Melee 1
abilities.conduit.grave-speech.texts.effect: "Effect: You can speak to the target if they are a
  creature who has died within the last 24 hours and who can speak a language you know, even if they
  are just a head. The target regards you as they would have in life, and you might need to make
  tests to influence them and convince them to speak with you. The trauma of dying can make a
  creature's memory of that event hazy, but the target otherwise knows all they knew in life. After
  1 minute, the effect ends. You can't use this ability on the same creature twice."
abilities.conduit.hands-of-the-maker.name: Hands of the Maker
abilities.conduit.hands-of-the-maker.description: '*You craft objects with the power of your mind.*'
abilities.conduit.hands-of-the-maker.texts.target: Self
abilities.conduit.hands-of-the-maker.texts.distance: Self
abilities.conduit.hands-of-the-maker.texts.effect: 'Effect: You create a mundane object of size 1S
  or smaller. You can maintain a number of objects created this way equal to your {self_domainChar_name} score.
  You can destroy an object created this way with a thought, no matter how far you are from it (no
  action required).'
abilities.conduit.wither.name: Wither
abilities.conduit.wither.description: '*A bolt of holy energy saps the life from a foe.*'
abilities.conduit.wither.texts.target: One creature or object
abilities.conduit.wither.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.wither.texts.roll: Power Roll + Intuition
abilities.conduit.wither.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + I}} corruption damage; P < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, the target takes a bane on their next power roll'
abilities.conduit.wither.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + I}} corruption damage; P < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target takes a bane on their next power roll'
abilities.conduit.wither.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + I}} corruption damage; P < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, the target takes a bane on their next power roll'
abilities.conduit.faith-is-our-armor.name: Faith Is Our Armor
abilities.conduit.faith-is-our-armor.description: "*The heroes' armor glows with golden light, granting divine protection.*"
abilities.conduit.faith-is-our-armor.texts.target: Four allies
abilities.conduit.faith-is-our-armor.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.faith-is-our-armor.texts.roll: Power Roll + Intuition
abilities.conduit.faith-is-our-armor.texts.tier1: The target gains 5 temporary Stamina.
abilities.conduit.faith-is-our-armor.texts.tier2: The target gains 10 temporary Stamina.
abilities.conduit.faith-is-our-armor.texts.tier3: The target gains 15 temporary Stamina.
abilities.conduit.faith-is-our-armor.texts.effect: 'Effect: You can target yourself instead of one ally with this ability.'
abilities.conduit.curse-of-terror.name: Curse of Terror
abilities.conduit.curse-of-terror.description: '*Fear of divine judgment overwhelms your foe.*'
abilities.conduit.curse-of-terror.texts.target: One creature
abilities.conduit.curse-of-terror.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.curse-of-terror.texts.roll: Power Roll + Intuition
abilities.conduit.curse-of-terror.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + I}} holy damage; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
abilities.conduit.curse-of-terror.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + I}} holy damage; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, frightened (save ends)'
abilities.conduit.curse-of-terror.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + I}} holy damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.conduit.sacrificial-offer.name: Sacrificial Offer
abilities.conduit.sacrificial-offer.description: '*Divine magic tears at your foe and defends a nearby friend.*'
abilities.conduit.sacrificial-offer.texts.target: One creature
abilities.conduit.sacrificial-offer.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.sacrificial-offer.texts.roll: Power Roll + Intuition
abilities.conduit.sacrificial-offer.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + I}} corruption damage'
abilities.conduit.sacrificial-offer.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + I}} corruption damage'
abilities.conduit.sacrificial-offer.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + I}} corruption damage'
abilities.conduit.sacrificial-offer.texts.effect: 'Effect: Choose yourself or one ally within
  distance. That character can impose a bane on one power roll made against them before the end of
  their next turn.'
abilities.conduit.judgments-hammer.name: Judgment's Hammer
abilities.conduit.judgments-hammer.description: '*Your divine fury is a hammer that crashes down upon the unrighteous.*'
abilities.conduit.judgments-hammer.texts.target: One creature or object
abilities.conduit.judgments-hammer.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.judgments-hammer.texts.roll: Power Roll + Intuition
abilities.conduit.judgments-hammer.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + I}} holy damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, prone'
abilities.conduit.judgments-hammer.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + I}} holy damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone'
abilities.conduit.judgments-hammer.texts.tier3: "{has_self_damage3, select, true {{self_damage3}} other {9 + I}} holy damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone and can't stand (save ends)"
abilities.conduit.lightfall.name: Lightfall
abilities.conduit.lightfall.description: '*A rain of holy light scours your enemies and repositions your allies.*'
abilities.conduit.lightfall.texts.target: Each enemy in the area
abilities.conduit.lightfall.texts.distance: 2 burst
abilities.conduit.lightfall.texts.roll: Power Roll + Intuition
abilities.conduit.lightfall.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} holy damage'
abilities.conduit.lightfall.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3}} holy damage'
abilities.conduit.lightfall.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {5}} holy damage'
abilities.conduit.lightfall.texts.effect: 'Effect: You can teleport yourself and each ally in the area to unoccupied spaces in the area.'
abilities.conduit.warriors-prayer.name: Warrior's Prayer
abilities.conduit.warriors-prayer.description: '*Your quickly uttered prayer lends aggressive divine energy to a friend engaged in melee.*'
abilities.conduit.warriors-prayer.texts.target: One creature
abilities.conduit.warriors-prayer.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.warriors-prayer.texts.roll: Power Roll + Intuition
abilities.conduit.warriors-prayer.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + I}} holy damage'
abilities.conduit.warriors-prayer.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + I}} holy damage'
abilities.conduit.warriors-prayer.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + I}} holy damage'
abilities.conduit.warriors-prayer.texts.effect: 'Effect: You or one ally within distance gains temporary Stamina equal to your Intuition score.'
abilities.conduit.violence-will-not-aid-thee.name: Violence Will Not Aid Thee
abilities.conduit.violence-will-not-aid-thee.description: '*After some holy lightning, your enemy will think twice about their next attack.*'
abilities.conduit.violence-will-not-aid-thee.texts.target: One creature
abilities.conduit.violence-will-not-aid-thee.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.violence-will-not-aid-thee.texts.roll: Power Roll + Intuition
abilities.conduit.violence-will-not-aid-thee.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + I}} lightning damage'
abilities.conduit.violence-will-not-aid-thee.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + I}} lightning damage'
abilities.conduit.violence-will-not-aid-thee.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + I}} lightning damage'
abilities.conduit.violence-will-not-aid-thee.texts.effect: 'Effect: The first time on a turn that
  the target deals damage to another creature, the target of this ability takes 1d10 lightning
  damage (save ends).'
abilities.conduit.sermon-of-grace.name: Sermon of Grace
abilities.conduit.sermon-of-grace.description: "*You inspire your allies with tales of your saint's great deeds.*"
abilities.conduit.sermon-of-grace.texts.target: Each ally in the area
abilities.conduit.sermon-of-grace.texts.distance: 4 burst
abilities.conduit.sermon-of-grace.texts.effect: 'Effect: Each target can spend a Recovery.
  Additionally, each target can use a free triggered action to end one effect on them that is ended
  by a saving throw or that ends at the end of their turn, or to stand up if prone.'
abilities.conduit.font-of-wrath.name: Font of Wrath
abilities.conduit.font-of-wrath.description: '*A brilliant column of holy light appears on the battlefield, striking out at nearby enemies.*'
abilities.conduit.font-of-wrath.texts.target: Special
abilities.conduit.font-of-wrath.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.font-of-wrath.texts.effect: "Effect: You summon a spirit of size 2 who can't be
  harmed, and who appears in an unoccupied space within distance. The spirit lasts until the end of
  your next turn. You and your allies can move through the spirit's space, but enemies can't. Any
  enemy who moves within 2 squares of the spirit for the first time in a combat round or starts
  their turn there takes holy damage equal to your Intuition score."
abilities.conduit.holy-lash.name: Holy Lash
abilities.conduit.holy-lash.description: '*A tendril of divine energy shoots forth to draw in your foe.*'
abilities.conduit.holy-lash.texts.target: One creature or object
abilities.conduit.holy-lash.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.holy-lash.texts.roll: Power Roll + Intuition
abilities.conduit.holy-lash.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + I}} holy damage; vertical pull 2'
abilities.conduit.holy-lash.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + I}} holy damage; vertical pull 3'
abilities.conduit.holy-lash.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + I}} holy damage; vertical pull 4'
abilities.conduit.corruptions-curse.name: Corruption's Curse
abilities.conduit.corruptions-curse.description: '*Cursed by you, your enemy takes more damage from your allies.*'
abilities.conduit.corruptions-curse.texts.target: One creature or object
abilities.conduit.corruptions-curse.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.corruptions-curse.texts.roll: Power Roll + Intuition
abilities.conduit.corruptions-curse.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + I}} corruption damage; M < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, damage weakness 5 (save ends)'
abilities.conduit.corruptions-curse.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + I}} corruption damage; M < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, damage weakness 5 (save ends)'
abilities.conduit.corruptions-curse.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + I}} corruption damage; M < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, damage weakness 5 (save ends)'
abilities.conduit.drain.name: Drain
abilities.conduit.drain.description: '*You drain the energy from your target to revitalize yourself or an ally.*'
abilities.conduit.drain.texts.target: One creature
abilities.conduit.drain.texts.distance: Melee 1
abilities.conduit.drain.texts.roll: Power Roll + Intuition
abilities.conduit.drain.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + I}} corruption damage'
abilities.conduit.drain.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + I}} corruption damage'
abilities.conduit.drain.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7 + I}} corruption damage'
abilities.conduit.drain.texts.effect: 'Effect: You or one ally within distance can spend a Recovery.'
abilities.conduit.word-of-judgment.name: Word of Judgment
abilities.conduit.word-of-judgment.description: "*Your holy word saps an attacking enemy's strength.*"
abilities.conduit.word-of-judgment.texts.trigger: The target would take damage from an ability that uses a power roll.
abilities.conduit.word-of-judgment.texts.target: One ally
abilities.conduit.word-of-judgment.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.word-of-judgment.texts.effect: |-
  Effect: The power roll takes a bane against the target.

  Spend 1 Piety: The power roll has a double bane against the target.
abilities.conduit.blessing-of-steel.name: Blessing of Steel
abilities.conduit.blessing-of-steel.description: '*A protective aura defends your allies from harm.*'
abilities.conduit.blessing-of-steel.texts.target: Self and each ally in the area
abilities.conduit.blessing-of-steel.texts.distance: 5 aura
abilities.conduit.blessing-of-steel.texts.effect: 'Effect: Until the end of the encounter, any
  ability roll made against a target takes a bane and each target has damage immunity 5.'
abilities.conduit.blessing-of-the-blade.name: Blessing of the Blade
abilities.conduit.blessing-of-the-blade.description: '*"The power of the gods is within you, friends. Allow me to unleash it."*'
abilities.conduit.blessing-of-the-blade.texts.target: Self and each ally in the area
abilities.conduit.blessing-of-the-blade.texts.distance: 5 aura
abilities.conduit.blessing-of-the-blade.texts.effect: 'Effect: At the end of each of your turns
  until the end of the encounter or until you are dying, each target gains 3 surges.'
abilities.conduit.arise.name: Arise!
abilities.conduit.arise.description: '*Your deity rewards you or an ally on the verge of defeat with
  a miracle burst of strength and resolve.*'
abilities.conduit.arise.texts.target: Self or one ally
abilities.conduit.arise.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.arise.texts.effect: 'Effect: The target can spend any number of Recoveries, can
  end any effects on them that are ended by a saving throw or that end at the end of their turn, and
  can stand up if they are prone. Additionally, at the start of each of their turns until the end of
  the encounter or until they are dying, the target gains 3 surges.'
abilities.conduit.drag-the-unworthy.name: Drag the Unworthy
abilities.conduit.drag-the-unworthy.description: '*You conjure an angel who moves a foe and heals your allies.*'
abilities.conduit.drag-the-unworthy.texts.target: One creature or object
abilities.conduit.drag-the-unworthy.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.drag-the-unworthy.texts.roll: Power Roll + Intuition
abilities.conduit.drag-the-unworthy.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {9 + I}} holy damage; slide 3'
abilities.conduit.drag-the-unworthy.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13 + I}} holy damage; slide 4'
abilities.conduit.drag-the-unworthy.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {18 + I}} holy damage; slide 6'
abilities.conduit.drag-the-unworthy.texts.effect: 'Effect: Each ally the target comes adjacent to during the forced movement can spend a Recovery.'
abilities.conduit.invocation-of-undoing.name: Invocation of Undoing
abilities.conduit.invocation-of-undoing.description: '*You utter a secret word of destruction known only to deities.*'
abilities.conduit.invocation-of-undoing.texts.target: Each enemy in the area
abilities.conduit.invocation-of-undoing.texts.distance: 4 burst
abilities.conduit.invocation-of-undoing.texts.roll: Power Roll + Intuition
abilities.conduit.invocation-of-undoing.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3}} sonic damage; push 3'
abilities.conduit.invocation-of-undoing.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} sonic damage; push 5'
abilities.conduit.invocation-of-undoing.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9}} sonic damage; push 7'
abilities.conduit.invocation-of-undoing.texts.effect: 'Special: You can choose to have this ability
  deal damage to and push objects, and to deal damage to buildings.'
abilities.conduit.aura-of-souls.name: Aura of Souls
abilities.conduit.aura-of-souls.description: '*A whirlwind of souls of the dead flies around you at your command.*'
abilities.conduit.aura-of-souls.texts.target: Each creature in the area
abilities.conduit.aura-of-souls.texts.distance: 4 aura
abilities.conduit.aura-of-souls.texts.effect: 'Effect: Until the end of the encounter or until you
  are dying, at the end of each of your turns, you can slide each creature in the area up to a
  number of squares equal to your Intuition score. This forced movement ignores stability for your
  allies.'
abilities.conduit.revitalizing-grace.name: Revitalizing Grace
abilities.conduit.revitalizing-grace.description: '*With a gesture, you restore your health and that of your allies.*'
abilities.conduit.revitalizing-grace.texts.target: Self and each ally in the area
abilities.conduit.revitalizing-grace.texts.distance: 4 burst
abilities.conduit.revitalizing-grace.texts.effect: 'Effect: Each target can spend any number of
  Recoveries. Additionally, each target can end one effect on themself that is ended by a saving
  throw or that ends at the end of their turn, or they can stand up if prone.'
abilities.conduit.lightning-lord.name: Lightning Lord
abilities.conduit.lightning-lord.description: '*Lightning bursts forth from your body in several directions.*'
abilities.conduit.lightning-lord.texts.target: Each enemy in the area
abilities.conduit.lightning-lord.texts.distance: Three 10 x 1 lines within 1
abilities.conduit.lightning-lord.texts.roll: Power Roll + Intuition
abilities.conduit.lightning-lord.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6}} lightning damage; push 1'
abilities.conduit.lightning-lord.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} lightning damage; push 2'
abilities.conduit.lightning-lord.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13}} lightning damage; push 3'
abilities.conduit.lightning-lord.texts.effect: 'Effect: The targets are force moved one at a time,
  starting with the target nearest to you, and can be pushed into other targets in the same line.'
abilities.conduit.your-story-ends-here.name: Your Story Ends Here
abilities.conduit.your-story-ends-here.description: '*You bend the fate of a foe, willing them to die.*'
abilities.conduit.your-story-ends-here.texts.target: One creature
abilities.conduit.your-story-ends-here.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.your-story-ends-here.texts.roll: Power Roll + Intuition
abilities.conduit.your-story-ends-here.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {9 + I}} corruption damage; R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, weakened (save ends)'
abilities.conduit.your-story-ends-here.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14 + I}} corruption damage; R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, weakened (save ends)'
abilities.conduit.your-story-ends-here.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {19 + I}} corruption damage; R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, weakened (save ends)'
abilities.conduit.your-story-ends-here.texts.effect: 'Effect: If this damage kills the target, you and each ally within distance can spend a Recovery.'
abilities.conduit.invocation-of-mystery.name: Invocation of Mystery
abilities.conduit.invocation-of-mystery.description: '*"Now you see us..."*'
abilities.conduit.invocation-of-mystery.texts.target: Self and each ally in the area
abilities.conduit.invocation-of-mystery.texts.distance: 4 burst
abilities.conduit.invocation-of-mystery.texts.effect: 'Effect: Each target is invisible until the start of your next turn.'
abilities.conduit.spirit-stampede.name: Spirit Stampede
abilities.conduit.spirit-stampede.description: '*Animal spirits run through the battlefield, trampling your foes.*'
abilities.conduit.spirit-stampede.texts.target: Each enemy in the area
abilities.conduit.spirit-stampede.texts.distance: '10 x 2 line within {has_self_within, select, true {{self_within}} other {5}}'
abilities.conduit.spirit-stampede.texts.roll: Power Roll + Intuition
abilities.conduit.spirit-stampede.texts.tier1: "{has_self_damage1, select, true {{self_damage1}} other {5}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, prone and can't stand (save ends)"
abilities.conduit.spirit-stampede.texts.tier2: "{has_self_damage2, select, true {{self_damage2}} other {8}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone and can't stand (save ends)"
abilities.conduit.spirit-stampede.texts.tier3: "{has_self_damage3, select, true {{self_damage3}} other {11}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone and can't stand (save ends)"
abilities.conduit.cuirass-of-the-gods.name: Cuirass of the Gods
abilities.conduit.cuirass-of-the-gods.description: '*Your allies are covered in spiritual armor.*'
abilities.conduit.cuirass-of-the-gods.texts.target: Three creatures
abilities.conduit.cuirass-of-the-gods.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.cuirass-of-the-gods.texts.effect: 'Effect: You can target yourself instead of one
  creature with this ability. Each target has damage immunity 5 until the start of your next turn.'
abilities.conduit.gods-machine.name: Gods' Machine
abilities.conduit.gods-machine.description: '*You conjure a whirring tank made of blades and metal.*'
abilities.conduit.gods-machine.texts.target: Special
abilities.conduit.gods-machine.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.gods-machine.texts.roll: Power Roll + Intuition
abilities.conduit.gods-machine.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3}} damage'
abilities.conduit.gods-machine.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} damage'
abilities.conduit.gods-machine.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8}} damage'
abilities.conduit.gods-machine.texts.effect: 'Effect: You conjure a size 2 rolling machine that
  appears in an unoccupied space within distance. The machine has 50 Stamina and immunity all to
  poison and psychic damage. It disappears at the end of the encounter, if its Stamina drops to 0,
  or if you are dying. When the machine first appears, make the following power roll once, targeting
  each enemy adjacent to it.'
abilities.conduit.blessing-of-the-midday-sun.name: Blessing of the Midday Sun
abilities.conduit.blessing-of-the-midday-sun.description: '*Your body emits a heat that bakes your enemies and inspires your allies.*'
abilities.conduit.blessing-of-the-midday-sun.texts.target: Self and each creature in the area
abilities.conduit.blessing-of-the-midday-sun.texts.distance: 4 aura
abilities.conduit.blessing-of-the-midday-sun.texts.effect: 'Effect: Until the end of the encounter
  or until you are dying, each enemy in the area takes a bane on power rolls, and you and each ally
  in the area gain 1 surge at the end of each of your turns.'
abilities.conduit.blade-of-the-heavens.name: Blade of the Heavens
abilities.conduit.blade-of-the-heavens.description: '*A greatsword streams down from the sky, threatening to pin your foe.*'
abilities.conduit.blade-of-the-heavens.texts.target: One creature
abilities.conduit.blade-of-the-heavens.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.conduit.blade-of-the-heavens.texts.roll: Power Roll + Intuition
abilities.conduit.blade-of-the-heavens.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + I}} damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, prone and restrained (save ends)'
abilities.conduit.blade-of-the-heavens.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {12 + I}} damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone and restrained (save ends)'
abilities.conduit.blade-of-the-heavens.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {16 + I}} damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone and restrained (save ends)'
abilities.conduit.lauded-by-god.name: Lauded by God
abilities.conduit.lauded-by-god.description: '*You beseech the gods to give your allies what they need to win the day, and the gods answer.*'
abilities.conduit.lauded-by-god.texts.target: Two allies
abilities.conduit.lauded-by-god.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.lauded-by-god.texts.effect: 'Effect: Each target gains 3 of their Heroic Resource.'
abilities.conduit.beacon-of-grace.name: Beacon of Grace
abilities.conduit.beacon-of-grace.description: '*You ignite a foe with holy radiance, rewarding allies who attack them.*'
abilities.conduit.beacon-of-grace.texts.target: One creature
abilities.conduit.beacon-of-grace.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.beacon-of-grace.texts.roll: Power Roll + Intuition
abilities.conduit.beacon-of-grace.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + I}} holy damage'
abilities.conduit.beacon-of-grace.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13 + I}} holy damage'
abilities.conduit.beacon-of-grace.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {17 + I}} holy damage'
abilities.conduit.beacon-of-grace.texts.effect: 'Effect: Until the end of the encounter, whenever
  you or any ally damages the target using an ability, that creature can spend a Recovery. If the
  target is reduced to 0 Stamina before the end of the encounter, you can use a free triggered
  action to move this effect to another creature within distance.'
abilities.conduit.vessel-of-retribution.name: Vessel of Retribution
abilities.conduit.vessel-of-retribution.description: '*You infuse yourself or an ally with the
  retributive energy of the gods, waiting to be unleashed.*'
abilities.conduit.vessel-of-retribution.texts.target: Self or one ally
abilities.conduit.vessel-of-retribution.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.vessel-of-retribution.texts.effect: 'Effect: The first time the target is dying or
  winded before the end of the encounter, each enemy within 5 squares of them takes 15 holy damage.'
abilities.conduit.penance.name: Penance
abilities.conduit.penance.description: '*"If you won''t kneel, the gods will make you."*'
abilities.conduit.penance.texts.target: Each enemy in the area
abilities.conduit.penance.texts.distance: '4 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.conduit.penance.texts.roll: Power Roll + Intuition
abilities.conduit.penance.texts.tier1: "{has_self_damage1, select, true {{self_damage1}} other {4}} corruption damage; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, prone and can't stand (save ends)"
abilities.conduit.penance.texts.tier2: "{has_self_damage2, select, true {{self_damage2}} other {7}} corruption damage; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone and can't stand (save ends)"
abilities.conduit.penance.texts.tier3: "{has_self_damage3, select, true {{self_damage3}} other {11}} corruption damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone and can't stand (save ends)"
abilities.conduit.sanctuary.name: Sanctuary
abilities.conduit.sanctuary.description: '*You send yourself or an ally to a divine manifold to instantaneously regain health.*'
abilities.conduit.sanctuary.texts.target: Self or one ally
abilities.conduit.sanctuary.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.sanctuary.texts.effect: 'Effect: The target is removed from the encounter map
  until the start of their next turn and can spend any number of Recoveries. At the start of their
  turn, the target reappears in the space they left or the nearest unoccupied space of their
  choice.'
abilities.conduit.nature-judges-thee.name: Nature Judges Thee
abilities.conduit.nature-judges-thee.description: '*Mystical thorned vines appear at your bidding and bind your foes.*'
abilities.conduit.nature-judges-thee.texts.target: Each enemy in the area
abilities.conduit.nature-judges-thee.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.conduit.nature-judges-thee.texts.roll: Power Roll + Intuition
abilities.conduit.nature-judges-thee.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.conduit.nature-judges-thee.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3}} damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.conduit.nature-judges-thee.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.conduit.statue-of-power.name: Statue of Power
abilities.conduit.statue-of-power.description: '*A marble statue of your deity rises from the earth.*'
abilities.conduit.statue-of-power.texts.target: Special
abilities.conduit.statue-of-power.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.statue-of-power.texts.effect: 'Effect: A size 2 statue rises out of the ground in
  an unoccupied space within distance and lasts until the end of the encounter. While within 3
  squares of the statue, you gain 1 surge at the start of each of your turns. Each ally within 3
  squares of the statue gains this same benefit. The statue is destroyed if it takes 20 or more
  damage. It has immunity all to poison and psychic damage.'
abilities.conduit.reap.name: Reap
abilities.conduit.reap.description: '*The gods reward those who smite their foes.*'
abilities.conduit.reap.texts.target: Each ally
abilities.conduit.reap.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.reap.texts.effect: 'Effect: Until the start of your next turn, each time a target
  kills an enemy, they regain Stamina equal to 5 + your Intuition score.'
abilities.conduit.divine-comedy.name: Divine Comedy
abilities.conduit.divine-comedy.description: '*You and your allies swap places to confound your foes.*'
abilities.conduit.divine-comedy.texts.target: Self and each ally in the area
abilities.conduit.divine-comedy.texts.distance: 5 burst
abilities.conduit.divine-comedy.texts.effect: 'Effect: Each target can choose another creature in
  the area, then swap places with that creature. The creature they choose must be able to fit into
  the space they leave and vice versa.'
abilities.conduit.saints-tempest.name: Saint's Tempest
abilities.conduit.saints-tempest.description: '*A raging storm appears, striking your foes with lightning and throwing them around with wind.*'
abilities.conduit.saints-tempest.texts.target: Each enemy in the area
abilities.conduit.saints-tempest.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.conduit.saints-tempest.texts.roll: Power Roll + Intuition
abilities.conduit.saints-tempest.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} lightning damage; vertical slide 1'
abilities.conduit.saints-tempest.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} lightning damage; vertical slide 2'
abilities.conduit.saints-tempest.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} lightning damage; vertical slide 3'
abilities.conduit.blessing-of-fate-and-destiny.name: Blessing of Fate and Destiny
abilities.conduit.blessing-of-fate-and-destiny.description: '*Your enemies suffer their fate; your allies embrace their destiny!*'
abilities.conduit.blessing-of-fate-and-destiny.texts.target: Three creatures
abilities.conduit.blessing-of-fate-and-destiny.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.blessing-of-fate-and-destiny.texts.effect: >-
  Effect: You can target yourself instead of one creature with this ability. Choose one of the
  following effects, which lasts until the end of the encounter or until you are dying:

  - Whenever a target makes a power roll, they can roll three dice and choose which two rolls to
  use.

  - Whenever a target makes a power roll, they must roll three dice and use the lowest two rolls.
abilities.conduit.sacred-bond.name: Sacred Bond
abilities.conduit.sacred-bond.description: '*You forge a divine connection between two creatures.*'
abilities.conduit.sacred-bond.texts.target: Self and one ally
abilities.conduit.sacred-bond.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.sacred-bond.texts.effect: 'Effect: Until the end of the encounter, whenever one
  target takes damage, the other target can use a free triggered action to take the damage instead.
  The original target suffers any effects associated with the damage. Additionally, whenever one
  target spends a Recovery, the other target can use a free triggered action to spend a Recovery.'
abilities.conduit.our-hearts-your-strength.name: Our Hearts Your Strength
abilities.conduit.our-hearts-your-strength.description: '*An ally gains strength from their friends.*'
abilities.conduit.our-hearts-your-strength.texts.target: Self and one ally
abilities.conduit.our-hearts-your-strength.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.our-hearts-your-strength.texts.effect: "Effect: Until the end of the encounter or
  until the target is dying, at the start of each of the target's turns, they gain a bonus to speed
  and a bonus to rolled damage equal to the number of allies within 10 squares of them. This bonus
  lasts until the start of their next turn."
abilities.conduit.the-gods-command-you-obey.name: The Gods Command You Obey
abilities.conduit.the-gods-command-you-obey.description: '*You speak with the voice of your saint, commanding your enemies.*'
abilities.conduit.the-gods-command-you-obey.texts.target: One creature
abilities.conduit.the-gods-command-you-obey.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.the-gods-command-you-obey.texts.roll: Power Roll + Intuition
abilities.conduit.the-gods-command-you-obey.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + I}} holy damage; P < {has_self_potencyWeak, select, true {{self_potencyWeak}} other {WEAK}}, before taking damage, the target makes a free strike against a target you choose'
abilities.conduit.the-gods-command-you-obey.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {7 + I}} holy damage; P < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, before taking damage, the target uses an ability of your choice and you choose any targets for that ability'
abilities.conduit.the-gods-command-you-obey.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11 + I}} holy damage; P < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, before taking damage, the target shifts up to their speed to a location you choose, uses an ability of your choice, and you choose any targets for that ability'
abilities.conduit.morning-light.name: Morning Light
abilities.conduit.morning-light.description: '*Light shines at your command, burning your foes and blessing your allies.*'
abilities.conduit.morning-light.texts.target: Each enemy in the area
abilities.conduit.morning-light.texts.distance: 3 burst
abilities.conduit.morning-light.texts.roll: Power Roll + Intuition
abilities.conduit.morning-light.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4}} fire damage'
abilities.conduit.morning-light.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} fire damage'
abilities.conduit.morning-light.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10}} fire damage'
abilities.conduit.morning-light.texts.effect: 'Effect: Each ally in the area deals fire damage equal
  to your Intuition score with their next strike made before the end of their next turn.'
abilities.conduit.wellspring-of-grace.name: Wellspring of Grace
abilities.conduit.wellspring-of-grace.description: '*A holy light is emitted from your body, healing your allies.*'
abilities.conduit.wellspring-of-grace.texts.target: Each ally in the area
abilities.conduit.wellspring-of-grace.texts.distance: 3 aura
abilities.conduit.wellspring-of-grace.texts.effect: 'Effect: Until the end of the encounter or until
  you are dying, whenever a target starts their turn in the area, they can spend a Recovery.'
abilities.conduit.blessing-of-insight.name: Blessing of Insight
abilities.conduit.blessing-of-insight.description: '*The gods grant insight revealing where best to strike your enemies.*'
abilities.conduit.blessing-of-insight.texts.target: Self and each ally
abilities.conduit.blessing-of-insight.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.blessing-of-insight.texts.effect: 'Effect: Until the end of the encounter or until
  you are dying, each target gains 1 surge at the end of each of your turns.'
abilities.conduit.fear-of-the-gods.name: Fear of the Gods
abilities.conduit.fear-of-the-gods.description: '*Your divine magic makes a creature appear as what your enemies fear most.*'
abilities.conduit.fear-of-the-gods.texts.target: Each enemy in the area
abilities.conduit.fear-of-the-gods.texts.distance: '5 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.conduit.fear-of-the-gods.texts.roll: Power Roll + Intuition
abilities.conduit.fear-of-the-gods.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6}} psychic damage; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
abilities.conduit.fear-of-the-gods.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} psychic damage; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, frightened (save ends)'
abilities.conduit.fear-of-the-gods.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13}} psychic damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.conduit.fear-of-the-gods.texts.effect: 'Effect: Each target is frightened of you or a creature you choose within distance.'
abilities.conduit.words-of-wrath-and-grace.name: Words of Wrath and Grace
abilities.conduit.words-of-wrath-and-grace.description: '*Your saint grants your enemies a vision of pain and fills your allies with healing energy.*'
abilities.conduit.words-of-wrath-and-grace.texts.target: Each enemy in the area
abilities.conduit.words-of-wrath-and-grace.texts.distance: 5 burst
abilities.conduit.words-of-wrath-and-grace.texts.roll: Power Roll + Intuition
abilities.conduit.words-of-wrath-and-grace.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} holy damage'
abilities.conduit.words-of-wrath-and-grace.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} holy damage'
abilities.conduit.words-of-wrath-and-grace.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} holy damage'
abilities.conduit.words-of-wrath-and-grace.texts.effect: 'Effect: Each ally in the area can spend a Recovery.'
abilities.conduit.saints-raiment.name: Saint's Raiment
abilities.conduit.saints-raiment.description: '*An ally becomes the wearer of an empowered golden cloak.*'
abilities.conduit.saints-raiment.texts.target: One ally
abilities.conduit.saints-raiment.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.saints-raiment.texts.effect: 'Effect: The target gains 20 temporary Stamina and 3 surges.'
abilities.conduit.soul-siphon.name: Soul Siphon
abilities.conduit.soul-siphon.description: '*A beam of energy connects a foe to a friend, draining life from one to heal the other.*'
abilities.conduit.soul-siphon.texts.target: One enemy
abilities.conduit.soul-siphon.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.soul-siphon.texts.roll: Power Roll + Intuition
abilities.conduit.soul-siphon.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7 + I}} corruption damage'
abilities.conduit.soul-siphon.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + I}} corruption damage'
abilities.conduit.soul-siphon.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {15 + I}} corruption damage'
abilities.conduit.soul-siphon.texts.effect: 'Effect: One ally within distance can spend any number of Recoveries.'
abilities.conduit.bend-fate.name: Bend Fate
abilities.conduit.bend-fate.description: '*The gods know you must prevail, and they bless your fate.*'
abilities.conduit.bend-fate.texts.target: Self or one ally
abilities.conduit.bend-fate.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.bend-fate.texts.effect: "Effect: Until the end of the encounter or until you are
  dying, each of the target's power rolls has its outcome improved by one tier."
abilities.conduit.blessing-of-the-fortress.name: Blessing of the Fortress
abilities.conduit.blessing-of-the-fortress.description: '*A magic circle extends out from you, barring foes from getting close.*'
abilities.conduit.blessing-of-the-fortress.texts.target: Self
abilities.conduit.blessing-of-the-fortress.texts.distance: Self; see below
abilities.conduit.blessing-of-the-fortress.texts.effect: 'Effect: Until the end of the encounter or
  until you are dying, no enemy can approach within 5 squares of you by moving or by being force
  moved by any enemy. Targets can be force moved closer to you by you or your allies, or can move
  closer because of your movement.'
abilities.conduit.righteous-phalanx.name: Righteous Phalanx
abilities.conduit.righteous-phalanx.description: '*A wall of spinning swords and knives appears where you wish.*'
abilities.conduit.righteous-phalanx.texts.target: Special
abilities.conduit.righteous-phalanx.texts.distance: '15 wall within {has_self_within, select, true {{self_within}} other {10}}'
abilities.conduit.righteous-phalanx.texts.effect: 'Effect: The wall lasts until the end of the
  encounter or until you are dying, and can be placed in occupied squares. Creatures can enter and
  pass through the wall. Each enemy who enters the area for the first time in a combat round or
  starts their turn there takes 15 damage.'
abilities.conduit.night-falls.name: Night Falls
abilities.conduit.night-falls.description: '*You summon darkness that thwarts only your foes.*'
abilities.conduit.night-falls.texts.target: Special
abilities.conduit.night-falls.texts.distance: '5 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.conduit.night-falls.texts.effect: "Effect: Until the end of the encounter or until you are
  dying, the area is filled with magic darkness that your enemies can't see through, but you and
  your allies can."
abilities.conduit.godstorm.name: Godstorm
abilities.conduit.godstorm.description: '*You summon a divine storm that remains under your control.*'
abilities.conduit.godstorm.texts.target: Each enemy in the area
abilities.conduit.godstorm.texts.distance: '5 cube within {has_self_within, select, true {{self_within}} other {5}}'
abilities.conduit.godstorm.texts.roll: Power Roll + Intuition
abilities.conduit.godstorm.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} lightning damage, 2 sonic damage'
abilities.conduit.godstorm.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3}} lightning damage, 3 sonic damage'
abilities.conduit.godstorm.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {5}} lightning damage, 5 sonic damage'
abilities.conduit.godstorm.texts.effect: 'Effect: A raging storm fills the area until the end of the
  encounter or until you are dying. At the start of each of your turns, you can move the storm up to
  5 squares (no action required). On subsequent turns while the storm is active, you can use a
  maneuver to make its power roll.'
abilities.conduit.radiance-of-grace.name: Radiance of Grace
abilities.conduit.radiance-of-grace.description: '*Intense light is emitted from your body, healing your allies.*'
abilities.conduit.radiance-of-grace.texts.target: Four allies
abilities.conduit.radiance-of-grace.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.radiance-of-grace.texts.effect: 'Effect: You can target yourself instead of one
  ally with this ability. Each target can spend any number of Recoveries, can end any effects on
  them that are ended by a saving throw or that end at the end of their turn, and can stand up if
  they are prone.'
abilities.conduit.divine-dragon.name: Divine Dragon
abilities.conduit.divine-dragon.description: '*From nothing but divine will, you create a powerful ally.*'
abilities.conduit.divine-dragon.texts.target: Special
abilities.conduit.divine-dragon.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.divine-dragon.texts.roll: Power Roll + Intuition
abilities.conduit.divine-dragon.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5}} fire damage'
abilities.conduit.divine-dragon.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} fire damage'
abilities.conduit.divine-dragon.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {12}} fire damage'
abilities.conduit.divine-dragon.texts.effect: >-
  Effect: You conjure a size 4 dragon that appears in an unoccupied space within distance. The
  dragon has speed 6 and can fly, stability 4, 100 Stamina, immunity all to fire damage, and uses
  your characteristics. The dragon disappears at the end of the encounter, if their Stamina drops to
  0, or if you are dying.

  On subsequent turns, you can use a main action to command the dragon to breathe magic fire in a 3
  cube within 1 square of them. Make the following power roll targeting each enemy in the area.
abilities.conduit.thorn-cage.name: Thorn Cage
abilities.conduit.thorn-cage.description: '*Vines burst forth from the ground and bind your foe, slowly closing around them.*'
abilities.conduit.thorn-cage.texts.target: One creature
abilities.conduit.thorn-cage.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.thorn-cage.texts.roll: Power Roll + Intuition
abilities.conduit.thorn-cage.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + I}} damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.conduit.thorn-cage.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {15 + I}} damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.conduit.thorn-cage.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {21 + I}} damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.conduit.thorn-cage.texts.effect: 'Effect: While restrained this way, the target takes 10 damage at the start of each of your turns.'
abilities.conduit.word-of-weakening.name: Word of Weakening
abilities.conduit.word-of-weakening.description: '*You utter a divine word that makes a foe brittle.*'
abilities.conduit.word-of-weakening.texts.target: One creature or object
abilities.conduit.word-of-weakening.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.word-of-weakening.texts.roll: Power Roll + Intuition
abilities.conduit.word-of-weakening.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {10 + I}} corruption damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, weakened (save ends)'
abilities.conduit.word-of-weakening.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {15 + I}} corruption damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, weakened (save ends)'
abilities.conduit.word-of-weakening.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {21 + I}} corruption damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, weakened (save ends)'
abilities.conduit.word-of-weakening.texts.effect: 'Effect: While weakened this way, the target has damage weakness 10.'
abilities.conduit.alacrity-of-the-heart.name: Alacrity of the Heart
abilities.conduit.alacrity-of-the-heart.description: '*You speak inspiring words to a friend and spur them to incredible feats.*'
abilities.conduit.alacrity-of-the-heart.texts.target: One ally
abilities.conduit.alacrity-of-the-heart.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.alacrity-of-the-heart.texts.effect: 'Effect: The target has an additional main
  action they can use on their next turn, and gains 3 of their Heroic Resource.'
abilities.conduit.word-of-final-redemption.name: Word of Final Redemption
abilities.conduit.word-of-final-redemption.description: '*Your death will fuel our victory.*'
abilities.conduit.word-of-final-redemption.texts.trigger: The target dies.
abilities.conduit.word-of-final-redemption.texts.target: One creature
abilities.conduit.word-of-final-redemption.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.word-of-final-redemption.texts.effect: "Effect: Before the target dies, you can
  look at their stat block and force them to use one ability that is a main action or a maneuver. If
  the ability costs a Heroic Resource or Malice, the creature can use it without any cost. For the
  purpose of using this ability, your allies and enemies are the target's allies and enemies, and
  you decide who the ability targets."
abilities.conduit.solar-flare.name: Solar Flare
abilities.conduit.solar-flare.description: '*You call down a sphere of fire that burns your foes to ash.*'
abilities.conduit.solar-flare.texts.target: Each enemy in the area
abilities.conduit.solar-flare.texts.distance: '5 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.conduit.solar-flare.texts.roll: Power Roll + Intuition
abilities.conduit.solar-flare.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {9}} fire damage'
abilities.conduit.solar-flare.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {14}} fire damage'
abilities.conduit.solar-flare.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {19}} fire damage'
abilities.conduit.guided-to-your-side.name: Guided to Your Side
abilities.conduit.guided-to-your-side.description: '*You concentrate on a friend and teleport to them.*'
abilities.conduit.guided-to-your-side.texts.target: Self and each ally
abilities.conduit.guided-to-your-side.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.guided-to-your-side.texts.effect: "Effect: Each target is teleported to unoccupied
  spaces within 5 squares of a willing creature who you are bonded to with your Invocation of the
  Heart feature. You don't need line of effect to the bonded creature but you must be on the same
  world."
abilities.conduit.trinity-of-trickery.name: Trinity of Trickery
abilities.conduit.trinity-of-trickery.description: "*Hey! I'm over here. No, here, numbskull.*"
abilities.conduit.trinity-of-trickery.texts.target: Self or one ally
abilities.conduit.trinity-of-trickery.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.conduit.trinity-of-trickery.texts.effect: 'Effect: You create two illusory duplicates of
  the target, which appear anywhere within distance. These duplicates last until the end of the
  encounter. On each of their turns, the target can move each duplicate up to their speed. If the
  target is targeted by an ability, they can use a free triggered action to switch places with a
  duplicate within their line of effect, making the duplicate the target of the ability instead.
  When either duplicate takes damage, it is destroyed.'
abilities.conduit.blessing-of-secrets.name: Blessing of Secrets
abilities.conduit.blessing-of-secrets.description: '*You project an illusory aura that makes you and allies harder to notice.*'
abilities.conduit.blessing-of-secrets.texts.target: Self and each ally in the area
abilities.conduit.blessing-of-secrets.texts.distance: 3 aura
abilities.conduit.blessing-of-secrets.texts.effect: 'Effect: Each creature in the area has a double
  edge on tests made to hide or sneak. The aura lasts until you end it (no action required) or until
  a target harms or deals damage to a creature or object.'
abilities.conduit.warriors-prayer.followUps.temp-stamina.name: Temporary Stamina (Warrior's Prayer)
