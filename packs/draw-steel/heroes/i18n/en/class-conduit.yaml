features.conduit.avatar.name: Avatar
features.conduit.avatar.actions.domain-effect.name: Activate a domain effect
features.conduit.avatar.actions.domain-effect.results.activated.name: Activated
features.conduit.avatar.actions.domain-effect.steps.domain.prompt: Which domain effect?
features.conduit.avatar.description: >-
  You are now an avatar of your god! When you use your Prayer feature, you can be affected by up to
  three prayers at once, and you can change all those prayers and your ward as a respite activity.
  You can also use a maneuver to activate one of your domain effects (see Domain Piety and Effects)
  without needing to pray.


  Additionally, whenever you take a respite, you can open a portal to rest in the presence of your
  deity and bring along any allies. When you do, you can ask your deity three questions, which the
  Director must answer honestly if your deity knows the answers (though they might answer
  cryptically or incompletely). When you finish your respite, you and your allies can appear at any
  location in the timescape where someone worships your deity.
features.conduit.divine-power.name: Divine Power
features.conduit.divine-power.description: >-
  You have an epic resource called divine power. Each time you finish a respite, you gain divine
  power equal to the XP you gain. You can spend divine power on your abilities as if it were piety.


  Additionally, you can spend divine power as if it were piety to use any conduit abilities you
  don't have, as the gods answer your prayers with temporary and unique gifts. If you use a conduit
  ability you don't have that usually costs no piety, you must spend 1 divine power to use it.


  Divine power remains until you spend it.
features.conduit.most-pious.name: Most Pious
features.conduit.most-pious.description: When you roll for piety at the start of your turn in combat
  and you pray, you gain 1 additional piety.
features.conduit.bastion-ward.name: Bastion Ward
features.conduit.bastion-ward.description: Your god grants you a holy countenance that protects you
  at all times. You gain a +1 bonus to saving throws.
features.conduit.blessing-of-compassion.name: Blessing of Compassion
features.conduit.blessing-of-compassion.description: >-
  You exude a magic presence that can soothe those willing to socially engage with you. You gain an
  edge on any test made to assist another creature with a test.


  Additionally, when you are present at the start of a negotiation, one NPC of your choice has their
  patience increased by 1 (to a maximum of 5), and the first test made to influence them gains an
  edge.
features.conduit.blessing-of-comprehension.name: Blessing of Comprehension
features.conduit.blessing-of-comprehension.description: "You can interpret diagrams and charts even
  if you don't understand the language associated with them. You are considered fluent in all
  languages for the purpose of understanding the project source for any research or crafting project
  (see Chapter 12: Downtime Projects)."
features.conduit.blessing-of-fortunate-weather.name: Blessing of Fortunate Weather
features.conduit.blessing-of-fortunate-weather.description: >-
  Each time you finish a respite, you can decide the weather conditions within 100 squares. Until
  you finish another respite, the weather conditions you establish follow you through any mundane
  outdoor locations. Choose one of the following types of weather, each of which grants a benefit to
  you and your allies:


  **Clear:** You and your allies gain an edge on tests that use the Search or Navigate skills.


  **Foggy:** You and your allies gain an edge on tests that use the Hide skill.


  **Overcast:** You and your allies gain an edge on tests that use the Endurance skill.


  **Precipitation:** When the ground is muddy or snowy, you and your allies gain an edge on tests
  that use the Track skill.


  If you are in the same area as a creature using this or a similar feature who has chosen a
  different weather effect, the features negate each other where their areas overlap.
features.conduit.creation-domain-piety-and-effect.name: Creation Domain Piety and Effect
features.conduit.creation-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that a creature within 10 squares
  uses an area ability.

  - **Prayer Effect:** You summon the forces of creation and create a wall of stone within 10
  squares whose size is 5 + your Intuition score. The wall lasts until the end of the encounter.
features.conduit.death-domain-piety-and-effect.name: Death Domain Piety and Effect
features.conduit.death-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that a creature within 10 squares who
  isn't a minion is reduced to 0 Stamina, or the first time in an encounter that a solo creature
  within 10 squares becomes winded.

  - **Prayer Effect:** You inflict a deadly curse on up to two enemies within 10 squares of you.
  Each target takes corruption damage equal to twice your Intuition score.
features.conduit.faithful-friend.name: Faithful Friend
features.conduit.faithful-friend.description: >-
  You have the following ability.


  > ###### Faithful Friend

  >

  > *An animal spirit is drawn to you, sharing their senses with you and serving you faithfully.*

  >

  > | **Magic**   | **Main action** |

  > | ----------- | --------------: |

  > | **📏 Self** |     **🎯 Self** |

  >

  > **Effect:** You conjure a spirit that takes the form of any animal you have seen. The
  incorporeal animal has speed 5 and can fly, but can't physically interact with the world. While
  you are within 10 squares of the spirit, you automatically sense everything that type of animal
  would sense, in addition to sensing your own surroundings. You can dismiss the spirit at any time
  (no action required). If the spirit takes any damage, they are dismissed and you take 1d10 psychic
  damage that can't be reduced in any way.
features.conduit.fate-domain-piety-and-effect.name: Fate Domain Piety and Effect
features.conduit.fate-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that an ally within 10 squares
  obtains a tier 3 outcome on a power roll, or an enemy within 10 squares obtains a tier 1 outcome
  on a power roll.

  - **Prayer Effect:** You call on the forces of fate to create a reliable future. Choose a creature
  within 10 squares. That creature automatically obtains a tier 1 or tier 3 outcome (your choice) on
  their next power roll made before the end of the encounter.
features.conduit.grave-speech.name: Grave Speech
features.conduit.grave-speech.description: >-
  You have the following ability.


  > ###### Grave Speech

  >

  > *You commune with the lingering soul of the recently dead.*

  >

  > | **Magic**      |             **Maneuver** |

  > | -------------- | -----------------------: |

  > | **📏 Melee 1** | **🎯 One dead creature** |

  >

  > **Effect:** You can speak to the target if they are a creature who has died within the last 24
  hours and who can speak a language you know, even if they are just a head. The target regards you
  as they would have in life, and you might need to make tests to influence them and convince them
  to speak with you. The trauma of dying can make a creature's memory of that event hazy, but the
  target otherwise knows all they knew in life. After 1 minute, the effect ends. You can't use this
  ability on the same creature twice.
features.conduit.hands-of-the-maker.name: Hands of the Maker
features.conduit.hands-of-the-maker.description: >-
  You have the following ability.


  > ###### Hands of the Maker

  >

  > *You craft objects with the power of your mind.*

  >

  > | **Magic**   | **Maneuver** |

  > | ----------- | -----------: |

  > | **📏 Self** |  **🎯 Self** |

  >

  > **Effect:** You create a mundane object of size 1S or smaller. You can maintain a number of
  objects created this way equal to your {self_domainChar_name} score. You can destroy an object created this way
  with a thought, no matter how far you are from it (no action required).
features.conduit.healing-grace.name: Healing Grace
features.conduit.healing-grace.description: >-
  You have the following ability, which you can use once on your turn.


  > ###### Healing Grace

  >

  > *Your divine energy restores the righteous.*

  >

  > | **Magic, Ranged** |            **Maneuver** |

  > | ----------------- | ----------------------: |

  > | **📏 Ranged 10**  | **🎯 Self or one ally** |

  >

  > **Effect:** The target can spend a Recovery.

  >

  > **Spend 1+ Piety:** For each piety spent, choose one of the following enhancements:

  >

  > - You can target one additional ally within distance.

  > - You can end one effect on a target that is ended by a saving throw or that ends at the end of
  their turn.

  > - A prone target can stand up.

  > - A target can spend 1 additional Recovery.
features.conduit.inner-light.name: Inner Light
features.conduit.inner-light.description: Each time you finish a respite, you can choose yourself or
  one ally who is also finishing a respite to gain the benefit of a divine ritual. You place a ray
  of morning light into the chosen character's soul, granting them a +1 bonus to saving throws that
  lasts until you finish another respite.
features.conduit.inspired-deception.name: Inspired Deception
features.conduit.inspired-deception.description: The gods favor your thievery with magic. Whenever
  you make a test that uses a skill you have from the intrigue skill group, you can use {self_domainChar_name} on
  the test instead of another characteristic.
features.conduit.knowledge-domain-piety-and-effect.name: Knowledge Domain Piety and Effect
features.conduit.knowledge-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that the Director spends Malice (see
  *[Draw Steel: Monsters](https://mcdm.gg/DS-Monsters)*).

  - **Prayer Effect:** Choose up to five allies within 10 squares of you, or choose yourself instead
  of one ally. Each target gains 1 surge.
features.conduit.life-domain-piety-and-effect.name: Life Domain Piety and Effect
features.conduit.life-domain-piety-and-effect.actions.prayer-effect.steps.which.prompt: Which effect ends?
features.conduit.life-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that a creature within 10 squares
  regains Stamina.

  - **Prayer Effect:** Choose yourself or one ally within 10 squares. That character can spend a
  Recovery, can end one effect on them that is ended by a saving throw or that ends at the end of
  their turn, or can stand up if they are prone. Alternatively, you or one ally within 10 squares
  gains temporary Stamina equal to two times your Intuition score.
features.conduit.love-domain-piety-and-effect.name: Love Domain Piety and Effect
features.conduit.love-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that you or any ally within 10
  squares uses the Aid Attack maneuver or an ability that targets an ally.

  - **Prayer Effect:** Each ally within 10 squares of you gains temporary Stamina equal to two times
  your Intuition score.
features.conduit.nature-domain-piety-and-effect.name: Nature Domain Piety and Effect
features.conduit.nature-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that you or a creature within 10
  squares takes acid, cold, fire, lightning, poison, or sonic damage.

  - **Prayer Effect:** Vines whip up from the floor or ground within 10 squares, wrapping around a
  number of creatures equal to your Intuition score. You can slide each creature up to a number of
  squares equal to your Intuition score. The vines then fade away.
features.conduit.oracular-visions.name: Oracular Visions
features.conduit.oracular-visions.description: Your deity rewards you with hazy visions of things to
  come. Each time you earn 1 or more Victories, you earn an equal number of fate points. Whenever
  you or a creature within 10 squares makes a test, you can spend 1 fate point to tap into a vision
  of the outcome, granting that creature an edge on the test. You lose any remaining fate points
  when you finish a respite.
features.conduit.piety-outside-of-combat.name: Piety Outside of Combat
features.conduit.piety-outside-of-combat.description: >-
  Though you can't gain piety outside of combat, you can use your heroic abilities and effects that
  cost piety without spending it. Whenever you use an ability or effect outside of combat that costs
  piety, you can't use that same ability or effect outside of combat again until you earn 1 or more
  Victories or finish a respite.


  When you use an ability outside of combat that lets you spend unlimited piety on its effect, such
  as Healing Grace, you can use it as if you had spent an amount of piety equal to your Victories.
features.conduit.piety-in-combat.name: Piety in Combat
features.conduit.piety-in-combat.description: >-
  At the start of a combat encounter or some other stressful situation tracked in combat rounds (as
  determined by the Director), you gain piety equal to your Victories. At the start of each of your
  turns during combat, you gain 1d3 piety.


  Additionally, you can gain more piety by praying to the gods—but beware! Doing so can easily draw
  their ire, as the gods hate to be annoyed. Before you roll to gain piety at the start of your
  turn, you can pray (no action required). If you do, your roll gains the following additional
  effects:


  - If the roll is a 1, you gain 1 additional piety but anger the gods! You take psychic damage
  equal to 1d6 + your level, which can't be reduced in any way.

  - If the roll is a 2, you gain 1 additional piety.

  - If the roll is a 3, you gain 2 additional piety and can activate a domain effect of your choice
  (see below).


  You lose any remaining piety at the end of the encounter.
features.conduit.prayer-of-destruction.name: Prayer of Destruction
features.conduit.prayer-of-destruction.description: Your god infuses wrath within your being. You
  gain a +1 bonus to rolled damage with magic abilities.
features.conduit.prayer-of-distance.name: Prayer of Distance
features.conduit.prayer-of-distance.description: Your god blesses you with the ability to stretch
  your divine magic farther. You have a +2 bonus to the distance of your ranged magic abilities.
features.conduit.prayer-of-soldiers-skill.name: Prayer of Soldier's Skill
features.conduit.prayer-of-soldiers-skill.description: >-
  Your god gives your mind the training of a soldier. You can wear light armor and wield light
  weapons effectively, even though you don't have a kit. While you wear light armor, you gain a +3
  bonus to Stamina, and that bonus increases by 3 at 4th, 7th, and 10th levels. While you wield a
  light weapon, you gain a +1 damage bonus with weapon abilities, including free strikes. You can
  use light armor treasures and light weapon treasures.


  If you have a kit, you can't take this blessing.
features.conduit.prayer-of-speed.name: Prayer of Speed
features.conduit.prayer-of-speed.description: Your god blesses your flesh and infuses it with divine
  quickness. You gain a +1 bonus to speed and to the distance you can shift when you take the
  Disengage move action.
features.conduit.prayer-of-steel.name: Prayer of Steel
features.conduit.prayer-of-steel.description: Your god fills your body with the light of creation,
  making you harder to hurt and move. You gain a +6 bonus to Stamina, and this bonus increases by 6
  at 4th, 7th, and 10th levels. Additionally, you gain a +1 bonus to stability.
features.conduit.protection-domain-piety-and-effect.name: Protection Domain Piety and Effect
features.conduit.protection-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that you or any ally within 10
  squares gains temporary Stamina, or uses a triggered action to reduce incoming damage or to impose
  a bane or double bane on an enemy's power roll.

  - **Prayer Effect:** One ally within 10 squares gains temporary Stamina equal to four times your
  Intuition score.
features.conduit.protective-circle.name: Protective Circle
features.conduit.protective-circle.description: You can spend 10 uninterrupted minutes to create a
  protective circle on the ground large enough to hold one size 1 creature. The circle lasts for 24
  hours, until you create another, or until you dismiss it (no action required). Only creatures you
  designate at the time of drawing the circle can enter and exit the area. While in the protective
  circle, a creature can't be targeted by strikes.
features.conduit.quickness-ward.name: Quickness Ward
features.conduit.quickness-ward.description: The gods imbue a divine swiftness within you. Whenever
  an adjacent creature deals damage to you, you can shift up to a number of squares equal to your
  Intuition score after the damage is dealt.
features.conduit.ray-of-wrath.name: Ray of Wrath
features.conduit.ray-of-wrath.description: |-
  You have the following ability, which can be used as a ranged free strike.

  > ###### Ray of Wrath
  >
  > *You unleash a blast of holy light upon your foe.*
  >
  > | **Magic, Ranged, Strike** |               **Main action** |
  > | ------------------------- | ----------------------------: |
  > | **📏 Ranged 10**          | **🎯 One creature or object** |
  >
  > **Power Roll + Intuition:**
  >
  > - **≤11:** 2 + I damage
  > - **12-16:** 4 + I damage
  > - **17+:** 6 + I damage
  >
  > **Effect:** You can have this ability deal holy damage.
features.conduit.revitalizing-ritual.name: Revitalizing Ritual
features.conduit.revitalizing-ritual.description: Each time you finish a respite, you can choose
  yourself or one ally who is also finishing a respite to gain the benefit of a divine ritual. The
  chosen character gains a bonus to their recovery value equal to your level that lasts until you
  finish another respite.
features.conduit.sanctified-weapon.name: Sanctified Weapon
features.conduit.sanctified-weapon.description: As a respite activity, you can bless a weapon. Any
  creature who wields the weapon gains a +1 bonus to rolled damage with abilities that use the
  weapon. This benefit lasts until you finish another respite.
features.conduit.sanctuary-ward.name: Sanctuary Ward
features.conduit.sanctuary-ward.description: In response to a foe's aggression, your god protects
  you. Whenever another creature damages you, that creature can't target you with a strike until you
  harm them or one of their allies, or until the end of their next turn.
features.conduit.spirit-ward.name: Spirit Ward
features.conduit.spirit-ward.description: Invisible spirits surround you if you are harmed. Whenever
  an adjacent creature deals damage to you, they take corruption damage equal to your Intuition
  score.
features.conduit.storm-domain-piety-and-effect.name: Storm Domain Piety and Effect
features.conduit.storm-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that an enemy within 10 squares is
  force moved.

  - **Prayer Effect:** Each enemy in a 3 cube within 10 squares takes lightning damage equal to
  twice your Intuition score.
features.conduit.sun-domain-piety-and-effect.name: Sun Domain Piety and Effect
features.conduit.sun-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that an enemy within 10 squares takes
  fire or holy damage.

  - **Prayer Effect:** One enemy within 10 squares takes fire damage equal to three times your
  Intuition score.
features.conduit.trickery-domain-piety-and-effect.name: Trickery Domain Piety and Effect
features.conduit.trickery-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that you or a creature within 10
  squares takes the Aid Attack or Hide maneuver.

  - **Prayer Effect:** You slide one creature within 10 squares of you up to a number of squares
  equal to 5 + your conduit level.
features.conduit.war-domain-piety-and-effect.name: War Domain Piety and Effect
features.conduit.war-domain-piety-and-effect.description: >-
  - **Piety:** You gain 2 piety the first time in an encounter that you or a creature within 10
  squares takes damage greater than 10 + your level in a single turn.

  - **Prayer Effect:** Choose up to three allies within 10 squares of you, or choose yourself
  instead of one ally. Each target gains 2 surges.
features.conduit.the-lists-of-heaven.name: The Lists of Heaven
features.conduit.the-lists-of-heaven.description: Your deity is aware of your growing influence,
  making it easier to draw their attention and power when you heal your allies. Whenever you allow
  another creature to spend a Recovery, you can also spend a Recovery.
features.conduit.minor-miracle.name: Minor Miracle
features.conduit.minor-miracle.description: >-
  As a respite activity, you can perform a religious ritual and beseech the gods to restore a dead
  creature to life. You must have at least half the creature's remains, and they must have died
  within the last 24 hours from an effect that isn't age related. The creature's soul must be
  willing to return to life for the ritual to work. If they are not willing, you instinctively
  understand that as you start the respite activity and can cease it immediately.


  A creature with a willing soul returns to life at the end of the respite with full Stamina and
  half their Recoveries. You regain only half your Recoveries at the end of the respite.
features.conduit.blessed-domain.name: Blessed Domain
features.conduit.blessed-domain.description: Whenever you gain piety from a domain effect, you gain 1 additional piety.
features.conduit.blessing-of-life.name: Blessing of Life
features.conduit.blessing-of-life.description: Your divine presence causes those you deem worthy to
  recover quickly from a fight. Whenever an ally within distance of your {self_domainAbility_name} ability
  regains Stamina, they regain additional Stamina equal to your {self_domainChar_name} score.
features.conduit.blessing-of-secrets.name: Blessing of Secrets
features.conduit.blessing-of-secrets.description: >-
  You have the following ability.


  > ###### Blessing of Secrets

  >

  > *You project an illusory aura that makes you and allies harder to notice.*

  >

  > | **Area, Magic** |                          **Maneuver** |

  > | --------------- | ------------------------------------: |

  > | **📏 3 aura**   | **🎯 Self and each ally in the area** |

  >

  > **Effect:** Each creature in the area has a double edge on tests made to hide or sneak. The aura
  lasts until you end it (no action required) or until a target harms or deals damage to a creature
  or object.
features.conduit.impervious-touch.name: Impervious Touch
features.conduit.impervious-touch.description: >-
  As a maneuver, you can touch an object with a size equal to your {self_domainChar_name} score or smaller and
  place a protective spell on it. The object has immunity all to untyped damage. You can maintain
  this spell on a number of objects equal to your {self_domainChar_name} score, and you can end the spell on any
  object at any time (no action required).


  Additionally, you can place this spell on a building or vehicle (or a similar structure with the
  Director's approval) that is of a size larger than your {self_domainChar_name} score. You can place the spell
  on only one such target at a time, and you can maintain the spell on a larger target and a number
  of objects equal to your {self_domainChar_name} score simultaneously.
features.conduit.improved-hands-of-the-maker.name: Improved Hands of the Maker
features.conduit.improved-hands-of-the-maker.description: When you use your Hands of the Maker
  ability, you can create a mundane object that is size 2 or smaller.
features.conduit.improved-sanctified-weapon.name: Improved Sanctified Weapon
features.conduit.improved-sanctified-weapon.description: The weapon improved by your Sanctified
  Weapon feature grants a +3 bonus to rolled damage instead of +1.
features.conduit.invocation-of-the-heart.name: Invocation of the Heart
features.conduit.invocation-of-the-heart.description: As a main action, you forge a bond of love and
  friendship with a willing creature you touch. While this bond is active, you can telepathically
  speak with the creature over any distance, including across different worlds. Additionally, while
  this bond is active, you can attempt to assist the creature with any test they make regardless of
  their proximity to you. You can maintain only one bond at a time, and you can end a bond at any
  time (no action required).
features.conduit.light-of-revelation.name: Light of Revelation
features.conduit.light-of-revelation.description: >-
  As a maneuver, you make your body shine brightly, illuminating your space and each square within
  5 squares{self_censor, select, true { until you dismiss the light (no action required)} other
  {}}. This light shines through any darkness. Hidden creatures in the area are automatically
  revealed, and creatures in the light, including you, can't hide. While this feature is active,
  you gain an edge on tests made to notice hidden objects and entrances and to detect supernatural
  illusions.
features.conduit.oracular-warning.name: Oracular Warning
features.conduit.oracular-warning.description: Each time you finish a respite, you can share the
  vague dreams of the future granted to you by the gods with allies who finished the respite with
  you. These premonitions help you and your allies stay alive, granting each of you temporary
  Stamina equal to 10 + your level that lasts until you finish a respite.
features.conduit.saints-epiphany.name: Saint's Epiphany
features.conduit.saints-epiphany.description: At the start of a respite, you can inspire yourself or
  another creature taking the same respite with divine knowledge. If the target makes a project roll
  during this respite, they can add 1d10 plus your {self_domainChar_name} score to the roll.
features.conduit.seance.name: Seance
features.conduit.seance.description: You can commune with a network of spirits. As a respite
  activity, you speak the name of a creature who died and isn't undead. If the creature's spirit is
  free and willing to speak with you, they appear and you can have a conversation with them. During
  this time, the creature responds to you as they would have in life. If the creature isn't free or
  willing to appear, you can speak another name or choose another respite activity.
features.conduit.windwalk.name: Windwalk
features.conduit.windwalk.description: While you have 5 or more Victories, you can fly. If you can
  already fly, you have a +2 bonus to speed while flying instead.
features.conduit.wode-road.name: Wode Road
features.conduit.wode-road.description: As a main action, you touch a living tree and make it part
  of a divine transportation network. You can maintain a number of trees in your network equal to
  your {self_domainChar_name} score. Whenever you touch any tree in your network, you can use a main action to
  teleport yourself and any willing creatures within 10 squares of you to a tree in your network on
  the same world. If a tree in your network dies, it is no longer part of the network. You can
  remove a tree from your network no matter your distance from it, including across different worlds
  (no action required).
features.conduit.burgeoning-saint.name: Burgeoning Saint
features.conduit.burgeoning-saint.description: >-
  You are infused with the power your deity reserves for their most worthy instruments. You have the
  following benefits:


  - You gain an edge on Presence tests made to interact with other creatures.

  - Whenever you deal damage to an enemy, you can spend a Recovery.

  - You have corruption immunity 10 or holy immunity 10 (your choice).

  - Your clothing and equipment changes in a way that reflects your status as your deity's chosen
  champion, such as ordinary robes turning into gold vestments or a simple dagger becoming a wicked
  blade with intricate etching.
features.conduit.blessing-of-iron.name: Blessing of Iron
features.conduit.blessing-of-iron.description: The gods send divine favor to you and your allies.
  While you are not dying, enemies take a bane on strikes against you or any ally within 3 squares
  of you.
features.conduit.covenant-of-the-heart.name: Covenant of the Heart
features.conduit.covenant-of-the-heart.description: >-
  You can maintain bonds with up to three willing creatures using your Invocation of the Heart
  feature. Additionally, you have the following ability.


  > ###### Guided to Your Side

  >

  > *You concentrate on a friend and teleport to them.*

  >

  > | **Magic, Ranged** |           **Main action** |

  > | ----------------- | ------------------------: |

  > | **📏 Ranged 10**  | **🎯 Self and each ally** |

  >

  > **Effect:** Each target is teleported to unoccupied spaces within 5 squares of a willing
  creature who you are bonded to with your Invocation of the Heart feature. You don't need line of
  effect to the bonded creature but you must be on the same world.
features.conduit.divine-quartermaster.name: Divine Quartermaster
features.conduit.divine-quartermaster.description: Each time you finish a respite, you can choose a
  treasure with a project goal equal to 50 times your level or less. You gain a divine version of
  this treasure that lasts until you finish another respite or it is consumed.
features.conduit.faithfuls-reward.name: Faithful's Reward
features.conduit.faithfuls-reward.description: When you roll for piety at the start of your turn in combat, you gain 1d3 + 1 piety.
features.conduit.font-of-grace.name: Font of Grace
features.conduit.font-of-grace.description: >-
  Each time you use your {self_domainAbility_name} ability, you gain 1 {self_censor, select, true
  {wrath} other {piety}} that can be spent only on that ability during the same turn. If you don''t
  use this {self_censor, select, true {wrath} other {piety}}, it is lost. Additionally, {self_censor,
  select, true {the target of {self_domainAbility_name} gains 10 temporary Stamina} other {you can
  use your Minor Miracle feature to return a creature to life even if you don''t have their
  remains}}.
features.conduit.gods-library.name: Gods' Library
features.conduit.gods-library.description: "You can gain access to information you need through
  prayer, so that you no longer require research materials for crafting and research projects (see
  Chapter 12: Downtime Projects). Additionally, you add your level to project rolls you make for
  crafting and research projects. You also have any skills in the lore skill group you don't already
  have, and you gain a number of skills from any other skill groups equal to the number of skills
  you had in the lore skill group before you gained this feature."
features.conduit.light-of-the-burning-sun.name: Light of the Burning Sun
features.conduit.light-of-the-burning-sun.description: Sun infuses your body. Whenever you use an
  ability to deal rolled damage to another creature, that ability deals an extra 5 fire damage, or
  an extra 15 fire damage if the creature is undead. Additionally, you have fire immunity equal to
  your level, which is added to any other fire immunity you have.
features.conduit.natures-bounty.name: Nature's Bounty
features.conduit.natures-bounty.description: >-
  When you finish a respite, you can prepare a magic meal using local flora for any companions who
  rested with you. Choose two of the following benefits for creatures who consume the meal:


  - Each creature gains immunity to acid, cold, corruption, fire, lightning, poison, or sonic damage
  equal to your level. You can choose this benefit twice, choosing a different damage immunity each
  time.

  - Each creature gains 20 temporary Stamina.

  - Each creature gains a +1 bonus to speed.

  - Each creature gains a +1 bonus to saving throws.

  - Each creature gains an edge on tests made to influence other creatures.


  Each benefit lasts until the creature who gains it finishes another respite.
features.conduit.thunderstruck.name: Thunderstruck
features.conduit.thunderstruck.description: Lightning and thunder infuse your body. Whenever you use
  an ability to deal lightning or sonic damage to another creature, you gain 1 surge. Additionally,
  if you use an ability that force moves a creature, the forced movement distance gains a bonus
  equal to your Intuition score.
features.conduit.trinity-of-trickery.name: Trinity of Trickery
features.conduit.trinity-of-trickery.description: >-
  You have the following ability.


  > ###### Trinity of Trickery (9 {self_censor, select, true {Wrath} other {Piety}})

  >

  > *Hey! I'm over here. No, here, numbskull.*

  >

  > | **Magic, Ranged** |            **Maneuver** |

  > | ----------------- | ----------------------: |

  > | **📏 Ranged 10**  | **🎯 Self or one ally** |

  >

  > **Effect:** You create two illusory duplicates of the target, which appear anywhere within
  distance. These duplicates last until the end of the encounter. On each of their turns, the target
  can move each duplicate up to their speed. If the target is targeted by an ability, they can use a
  free triggered action to switch places with a duplicate within their line of effect, making the
  duplicate the target of the ability instead. When either duplicate takes damage, it is destroyed.
features.conduit.word-of-death-deferred.name: Word of Death Deferred
features.conduit.word-of-death-deferred.description: >-
  You can stop death from taking your allies. When an ally within distance of your {self_domainAbility_name}
  ability dies and you are not dying, you can use a free triggered action to instead have that ally
  fall unconscious until they regain Stamina.


  Additionally, your abilities deal an extra 5 damage to winded creatures.
features.conduit.word-of-fate-denied.name: Word of Fate Denied
features.conduit.word-of-fate-denied.description: When an ally within 10 squares takes damage that
  would leave them dying, you can use a free triggered action to make yourself or another willing
  creature within 10 squares of you the target of the triggering damage instead. The creature you
  choose takes the damage and suffers any effects associated with it, and that damage can't be
  reduced in any way.
features.conduit.your-triumphs-are-remembered.name: Your Triumphs Are Remembered
features.conduit.your-triumphs-are-remembered.description: The gods allow you and your companions to
  bask in the glory of past successes. Whenever you finish a respite, you and any other heroes who
  rested with you regain 1 Victory after your Victories are converted to XP. This Victory isn't
  converted into XP at the end of a subsequent respite.
features.conduit.faiths-sword.name: Faith's Sword
features.conduit.faiths-sword.description: Each time you finish a respite, you can choose a willing
  hero ally who finished the respite with you. That ally gains the benefits of your Burgeoning Saint
  feature until you finish another respite. Additionally, you can spend piety as a free maneuver to
  give the hero 1 of their Heroic Resource for every 2 piety spent.
features.conduit.ordained.name: Ordained
features.conduit.ordained.description: Your god elevates the power flowing through you. Your
  characteristic scores are treated as 1 higher for the purpose of resisting potencies.
  Additionally, while you have 5 or more Victories, you speak with the voice of your deity. You have
  a double edge on Presence tests made to influence other creatures.
