classes.conduit.name: Conduit
classes.conduit.description: >-
  The power of the gods flows through you! As a vessel for divine power, you don't just keep your
  allies in the fight. You make those allies more effective, even as you rain divine energy down
  upon your foes. Though the deity or saint you serve might have other faithful and clergy, you are
  special among worshippers, receiving your abilities from the highest source.


  **As a conduit, you heal and buff your allies, and debuff your foes while smiting them with divine
  magic. The spark of divinity within you shines, filling your enemies with awe and making you more
  worldly and aware.**


  > "The gods judge our actions, and our inaction."

  >

  > **Dazar**
