kits.arcane-archer.name: Arcane Archer
kits.arcane-archer.description: >-
  The Arcane Archer kit allows you to combine magic and ranged weapon strikes. Your lack of armor
  keeps you mobile, and your magic makes your arrows explode to devastate your foes.


  You wear no armor and wield a bow.
kits.battlemind.name: Battlemind
kits.battlemind.description: >-
  Who says lightly armored heroes can't also be hard to move? You just need to employ some psionics!
  The Battlemind kit harnesses the power of your mind to make you harder to move—and to make your
  foes easier to push around.


  You wear light armor and wield a medium weapon.
kits.cloak-and-dagger.name: Cloak and Dagger
kits.cloak-and-dagger.description: >-
  Providing throwable light weapons and light armor easily concealed by a cloak to confuse your
  enemies, the Cloak and Dagger kit makes you more mobile while increasing the effectiveness of your
  short-range strikes.


  You wear light armor and wield one or two light weapons.
kits.dual-wielder.name: Dual Wielder
kits.dual-wielder.description: >-
  The Dual Wielder kit is for folks who want to excel at using two weapons at the same time. Your
  fighting style maximizes the power of each weapon you have in hand, making you a whirling dealer
  of death.


  You wear medium armor and wield a light weapon and a medium weapon.
kits.guisarmier.name: Guisarmier
kits.guisarmier.description: >-
  The Guisarmier kit is for those who want to use a polearm for extended reach while remaining
  protected by sturdy armor. This is the kit that allows you to become the ultimate halberd,
  longspear, or glaive fighter.


  You wear medium armor and wield a polearm.
kits.martial-artist.name: Martial Artist
kits.martial-artist.description: >-
  If you want to be fast in a fight, then Martial Artist is the kit for you. Unencumbered by weapons
  or armor, this fighting style rewards quick, focused unarmed strikes against opponents, and allows
  you to be the ultimate skirmisher.


  You wear no armor and wield only your unarmed strikes.
kits.mountain.name: Mountain
kits.mountain.description: >-
  The Mountain kit does exactly what it says on the tin. You don heavy armor and raise a heavy
  weapon to stand strong against your foes, quickly demolishing them when it's your turn to strike.


  You wear heavy armor and wield a heavy weapon.
kits.panther.name: Panther
kits.panther.description: >-
  If you want a good balance of protection, speed, and damage, the Panther kit is for you. This kit
  increases your Stamina not by wearing armor, but through the focused battle preparation of body
  and mind, letting you be fast and mobile while swinging a heavy weapon at your foes.


  You wear no armor and wield a heavy weapon.
kits.pugilist.name: Pugilist
kits.pugilist.description: >-
  Meant for brawlers and boxers, the Pugilist kit gives you access to a melee fighting style that
  grants a boost to Stamina and damage while allowing you to float like a butterfly. If you want to
  be a tough, strong hero who doles out punishment with your fists, then this kit is for you.


  You wear no armor and wield only your unarmed strikes.
kits.raider.name: Raider
kits.raider.description: >-
  The Raider kit keeps you protected while granting you full mobility, providing a boost to speed
  and distance that lets you run around the battlefield like a Viking warrior.


  You wear light armor and wield a shield and a light weapon.
kits.ranger.name: Ranger
kits.ranger.description: >-
  The Ranger kit outfits you with medium armor and weapons for every challenge, letting you easily
  switch between melee and ranged combat. This kit provides a good balance of bonuses to defense and
  offense to create a hero who is a jack-of-all-trades.


  You wear medium armor and wield a bow and a medium weapon.
kits.rapid-fire.name: Rapid-Fire
kits.rapid-fire.description: >-
  The Rapid-Fire kit is for archers who want to deal maximum damage by shooting as many arrows as
  possible into nearby enemies. With this kit, your fighting technique focuses on peppering foes
  before they can get close enough to counterattack.


  You wear light armor and wield a bow.
kits.retiarius.name: Retiarius
kits.retiarius.description: >-
  The retiarius is often depicted as a lightly armored warrior with a net in one hand and a trident
  in the other, and this kit gives you the equipment and fighting technique to make that happen. Tie
  up your foe with a net and then poke them to death!


  You wear light armor and wield several ensnaring weapons and a polearm.
kits.shining-armor.name: Shining Armor
kits.shining-armor.description: >-
  The Shining Armor kit provides the most protection a kit can afford, providing you with the sword,
  shield, and armor necessary to play the prototypical knight.


  You wear heavy armor and wield a shield and a medium weapon.
kits.sniper.name: Sniper
kits.sniper.description: >-
  The Sniper kit gives you the tools and techniques to take down enemies from afar. This kit can
  help you become the archer who lurks behind trees or down tunnels, picking off enemies with a bow
  or crossbow as they approach.


  You wear no armor and wield a bow.
kits.spellsword.name: Spellsword
kits.spellsword.description: >-
  The Spellsword kit combines melee strikes and a little bit of magic, letting you create a warrior
  who doesn't have to choose between the incantation and the blade.


  You wear light armor and wield a shield and a medium weapon.
kits.stick-and-robe.name: Stick and Robe
kits.stick-and-robe.description: >-
  Armed with a simple reach weapon, often a quarterstaff, a character using the Stick and Robe kit
  is highly mobile thanks to their light armor. This allows your hero to make maximum use of their
  weapon's length.


  You wear light armor and wield a polearm.
kits.swashbuckler.name: Swashbuckler
kits.swashbuckler.description: >-
  If you want to be mobile and deal a lot of damage with melee strikes, then you should reach for
  the Swashbuckler kit. This is a great kit for heroes who want to be master duelists.


  You wear light armor and wield a medium weapon.
kits.sword-and-board.name: Sword and Board
kits.sword-and-board.description: >-
  The Sword and Board kit doesn't just give you a shield—it makes the shield part of your offensive
  arsenal. With a medium weapon in one hand and a block of steel or solid oak in the other, you
  protect yourself while you control the battlefield.


  You wear medium armor and wield a shield and a medium weapon.
kits.warrior-priest.name: Warrior Priest
kits.warrior-priest.description: >-
  The Warrior Priest kit imbues the power of the gods into your weapon, making it a smiting
  instrument. You wade into the fray without fear, thanks to the power of the divine... and the
  heavy armor you wear.


  You wear heavy armor and wield a light weapon.
kits.whirlwind.name: Whirlwind
kits.whirlwind.description: >-
  The Whirlwind kit makes effective use of whips, granting you mobility, damage, and reach. If you
  want to be a fast-moving warrior who lashes foes with a chain or whip, then this is the kit for
  you.


  You wear no armor and wield a whip.
features.common.kit.name: Kit
features.common.kit.description: >-
  You can use and gain the benefits of a kit. See Chapter 6: Kits for more information.
features.common.kit.choices.kit.prompt: Choose a kit
