abilities.perk.friend-catapult.name: Friend Catapult
abilities.perk.friend-catapult.texts.distance: Melee 1
abilities.perk.friend-catapult.texts.target: One willing ally or object of your size or smaller
abilities.perk.friend-catapult.texts.effect: You grab the target, then vertical push them up to a number of squares equal to twice your Might score. If a creature you push falls as a result of this movement, the effective distance of the fall is reduced by a number of squares equal to twice your Might score. When you use this perk, you can't use it again until you earn 1 or more Victories.
abilities.perk.ive-got-you.name: I've Got You!
abilities.perk.ive-got-you.texts.trigger: A willing ally falls and would land on you or adjacent to you.
abilities.perk.ive-got-you.texts.target: The triggering ally
abilities.perk.ive-got-you.texts.effect: You safely catch the ally. Neither of you takes damage from the ally's fall.
abilities.perk.gum-up-the-works.name: Gum Up the Works
abilities.perk.gum-up-the-works.texts.trigger: A mundane trap activates within 3 squares.
abilities.perk.gum-up-the-works.texts.target: Self
abilities.perk.gum-up-the-works.texts.effect: You move up to 3 squares toward the trap. If this movement brings you adjacent to any of the trap's mechanisms, you can jam the trap, preventing it from activating. As long as you stay adjacent to the mechanism, the trap can't go off unless an attempt to disarm it fails.
abilities.perk.creature-sense.name: Creature Sense
abilities.perk.creature-sense.texts.distance: Ranged 10
abilities.perk.creature-sense.texts.target: One creature
abilities.perk.creature-sense.texts.effect: If the target is your level or lower, you learn the keywords in their stat block (Demon, Humanoid, Undead, and so forth).
abilities.perk.arcane-trick.name: Arcane Trick
abilities.perk.arcane-trick.description: '*You cast an entertaining spell that creates a minor but impressive magical effect.*'
abilities.perk.arcane-trick.texts.distance: Self; see below
abilities.perk.arcane-trick.texts.target: Self
abilities.perk.arcane-trick.texts.effect: |-
  Choose one of the following effects:
  - You teleport a size 1S or smaller object adjacent to you into an unoccupied space adjacent to you.
  - Until the start of your next turn, a part of your body shoots a shower of harmless noisy sparks that light up each square adjacent to you.
  - You ignite or snuff out (your choice) every mundane light source of 1L or smaller adjacent to you.
  - You transform up to 1 pound of edible food you touch to make it taste delicious or disgusting.
  - Until the start of your next turn, you make your body exude a particular odor you've smelled before. This smell can be sensed by each creature within 5 squares of you, but can't impose any condition or other drawback on those creatures.
  - You place a small magical inscription on the surface of a mundane object you touch, or you can remove an inscription that was made by you or by another creature using Arcane Trick.
  - You touch a size 1T object to cover it with an illusion that makes it look like a different object. Any creature who handles the object becomes aware of the illusion. The illusion ends when you stop touching the object.
abilities.perk.invisible-force.name: Invisible Force
abilities.perk.invisible-force.description: '*You manipulate a tiny object with your mind.*'
abilities.perk.invisible-force.texts.distance: Ranged 10
abilities.perk.invisible-force.texts.target: One size 1T object
abilities.perk.invisible-force.texts.effect: You can grab or manipulate the target object with your mind, moving the object up to a number of squares equal to your Reason, Intuition, or Presence score (your choice). You can use this ability to turn doorknobs, pull levers, and so forth. You can manipulate any small movable piece of a larger object as long as the piece is unattended and size 1T. You can't use this ability to break a smaller piece off a larger object.
abilities.perk.psychic-whisper.name: Psychic Whisper
abilities.perk.psychic-whisper.description: '*You send a one-way telepathic message to a friend.*'
abilities.perk.psychic-whisper.texts.distance: Ranged 10
abilities.perk.psychic-whisper.texts.target: One ally
abilities.perk.psychic-whisper.texts.effect: As long as the target understands one or more languages, you send a telepathic message to them that takes 10 seconds or less to speak. The target knows who the message is from and can decide to ignore it and subsequent messages.
