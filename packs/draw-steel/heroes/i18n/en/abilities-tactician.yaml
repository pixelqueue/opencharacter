abilities.tactician.strike-now.name: '"Strike Now!"'
abilities.tactician.strike-now.description: '*Your foe left an opening. You point this out to an ally!*'
abilities.tactician.strike-now.texts.target: One ally
abilities.tactician.strike-now.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.strike-now.texts.effect: |-
  Effect: The target can use a signature ability as a free triggered action.

  Spend 5 Focus: You target two allies instead of one.
abilities.tactician.inspiring-strike.name: Inspiring Strike
abilities.tactician.inspiring-strike.description: '*Your attack gives an ally hope.*'
abilities.tactician.inspiring-strike.texts.target: One creature or object
abilities.tactician.inspiring-strike.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.tactician.inspiring-strike.texts.roll: Power Roll + Might
abilities.tactician.inspiring-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + M}} damage; you or one ally within 10 squares of you can spend a Recovery'
abilities.tactician.inspiring-strike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + M}} damage; you or one ally within 10 squares of you can spend a Recovery'
abilities.tactician.inspiring-strike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + M}} damage; you and one ally within 10 squares of you can spend a Recovery, and each of you gains an edge on the next ability roll you make during the encounter'
abilities.tactician.concussive-strike.name: Concussive Strike
abilities.tactician.concussive-strike.description: '*Your precise strike leaves your foe struggling to respond.*'
abilities.tactician.concussive-strike.texts.target: One creature or object
abilities.tactician.concussive-strike.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.tactician.concussive-strike.texts.roll: Power Roll + Might
abilities.tactician.concussive-strike.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + M}} damage; M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, dazed (save ends)'
abilities.tactician.concussive-strike.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + M}} damage; M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed (save ends)'
abilities.tactician.concussive-strike.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + M}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.tactician.hammer-and-anvil.name: Hammer and Anvil
abilities.tactician.hammer-and-anvil.description: '*"Let''s not argue about who''s the hammer and who''s the anvil!"*'
abilities.tactician.hammer-and-anvil.texts.target: One creature or object
abilities.tactician.hammer-and-anvil.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.tactician.hammer-and-anvil.texts.roll: Power Roll + Might
abilities.tactician.hammer-and-anvil.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + M}} damage; one ally within 10 squares of you can use a strike signature ability against the target as a free triggered action'
abilities.tactician.hammer-and-anvil.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + M}} damage; one ally within 10 squares of you can use a strike signature ability that gains an edge against the target as a free triggered action'
abilities.tactician.hammer-and-anvil.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {12 + M}} damage; two allies within 10 squares of you can each use a strike signature ability that gains an edge against the target as a free triggered action'
abilities.tactician.hammer-and-anvil.texts.effect: 'Effect: If the target is reduced to 0 Stamina before one or both chosen allies has made their strike, the ally or allies can pick a different target.'
abilities.tactician.this-is-what-we-planned-for.name: This Is What We Planned For
abilities.tactician.this-is-what-we-planned-for.description: '*All those coordination drills you made them do finally pay off.*'
abilities.tactician.this-is-what-we-planned-for.texts.target: Two allies
abilities.tactician.this-is-what-we-planned-for.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.this-is-what-we-planned-for.texts.effect: "Effect: Each target who hasn't acted yet this combat round can take their turn in any order immediately after yours."
abilities.tactician.parry.name: Parry
abilities.tactician.parry.description: '*Your quick reflexes cost an enemy the precision they seek.*'
abilities.tactician.parry.texts.trigger: A creature deals damage to the target.
abilities.tactician.parry.texts.target: Self or one ally
abilities.tactician.parry.texts.distance: Melee 2
abilities.tactician.parry.texts.effect: |-
  Effect: You can shift 1 square. If the target is you, or if you end this shift adjacent to the target, the target takes half the damage. If the damage has any potency effect associated with it, the potency is decreased by 1.

  Spend 1 Focus: This ability's distance becomes Melee 1 + your Reason score, and you can shift up to a number of squares equal to your Reason score instead of 1 square.
abilities.tactician.now.name: Now!
abilities.tactician.now.description: '*Your allies wait for your command—then unleash death!*'
abilities.tactician.now.texts.target: Three allies
abilities.tactician.now.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.now.texts.effect: 'Effect: Each target can make a free strike.'
abilities.tactician.mind-game.name: Mind Game
abilities.tactician.mind-game.description: '*Your attack demoralizes your foe. Your allies begin to think you can win.*'
abilities.tactician.mind-game.texts.target: One creature or object
abilities.tactician.mind-game.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.tactician.mind-game.texts.roll: Power Roll + Might
abilities.tactician.mind-game.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + M}} damage; R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, weakened (save ends)'
abilities.tactician.mind-game.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + M}} damage; R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, weakened (save ends)'
abilities.tactician.mind-game.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10 + M}} damage; R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, weakened (save ends)'
abilities.tactician.mind-game.texts.effect: |-
  Effect: You mark the target.

  Effect: Before the start of your next turn, the first time any ally deals damage to any target marked by you, that ally can spend a Recovery.
abilities.tactician.mark.name: Mark
abilities.tactician.mark.description: "*You draw your allies' attention to a specific foe—with devastating effect.*"
abilities.tactician.mark.texts.target: One creature
abilities.tactician.mark.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.mark.texts.effect: |-
  Effect: The target is marked by you until the end of the encounter, until you are dying, or until you use this ability again. You can willingly end your mark on a creature (no action required), and if another tactician marks a creature, your mark on that creature ends. When a creature marked by you is reduced to 0 Stamina, you can use a free triggered action to mark a new target within distance.
  You can initially mark only one creature using this ability, though other tactician abilities allow you to mark additional creatures at the same time. The mastermind tactical doctrine's Anticipation feature allows you to target additional creatures with this ability starting at 5th level.
  While a creature marked by you is within your line of effect, you and allies within your line of effect gain an edge on power rolls made against that creature. Additionally, whenever you or any ally uses an ability to deal rolled damage to a creature marked by you, you can spend 1 focus to gain one of the following benefits as a free triggered action:
  - The ability deals extra damage equal to twice your Reason score.
  - The creature dealing the damage can spend a Recovery.
  - The creature dealing the damage can shift up to a number of squares equal to your Reason score.
  - If you damage a creature marked by you with a melee ability, the creature is taunted by you until the end of their next turn.
  You can't gain more than one benefit from the same trigger.
abilities.tactician.advanced-tactics.name: Advanced Tactics
abilities.tactician.advanced-tactics.description: '*Your leadership aids an ally.*'
abilities.tactician.advanced-tactics.texts.trigger: The target deals damage to another creature.
abilities.tactician.advanced-tactics.texts.target: One ally
abilities.tactician.advanced-tactics.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.advanced-tactics.texts.effect: |-
  Effect: The target gains 2 surges, which they can use on the triggering damage.

  Spend 1 Focus: If the damage has any potency effect associated with it, the potency is increased by 1.
abilities.tactician.squad-forward.name: Squad! Forward!
abilities.tactician.squad-forward.description: '*On your command, you and your allies force back the enemy line.*'
abilities.tactician.squad-forward.texts.target: Self and two allies
abilities.tactician.squad-forward.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.squad-forward.texts.effect: 'Effect: Each target can move up to their speed.'
abilities.tactician.battle-cry.name: Battle Cry
abilities.tactician.battle-cry.description: '*You shout a phrase that galvanizes your team.*'
abilities.tactician.battle-cry.texts.target: Three allies
abilities.tactician.battle-cry.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.battle-cry.texts.roll: Power Roll + Reason
abilities.tactician.battle-cry.texts.tier1: Each target gains 1 surge.
abilities.tactician.battle-cry.texts.tier2: Each target gains 2 surges.
abilities.tactician.battle-cry.texts.tier3: Each target gains 3 surges.
abilities.tactician.overwatch.name: Overwatch
abilities.tactician.overwatch.description: '*Under your direction, an ally waits for just the right moment to strike.*'
abilities.tactician.overwatch.texts.trigger: The target moves.
abilities.tactician.overwatch.texts.target: One creature
abilities.tactician.overwatch.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.overwatch.texts.effect: |-
  Effect: At any time during the target's movement, one ally can make a free strike against them.

  Spend 1 Focus: If the target has R < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, they are slowed (EoT).
abilities.tactician.ill-open-and-youll-close.name: I'll Open and You'll Close
abilities.tactician.ill-open-and-youll-close.description: '*You create an opening for an ally.*'
abilities.tactician.ill-open-and-youll-close.texts.target: One creature
abilities.tactician.ill-open-and-youll-close.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.tactician.ill-open-and-youll-close.texts.roll: Power Roll + Might
abilities.tactician.ill-open-and-youll-close.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + M}} damage'
abilities.tactician.ill-open-and-youll-close.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + M}} damage'
abilities.tactician.ill-open-and-youll-close.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {14 + M}} damage'
abilities.tactician.ill-open-and-youll-close.texts.effect: 'Effect: One ally within 10 squares of you can use a heroic ability against the target as a free triggered action without spending any of their Heroic Resource, as long as they have enough Heroic Resource to pay for the ability. If the target is reduced to 0 Stamina before the chosen ally has used their ability, the ally can pick a different target.'
abilities.tactician.finish-them.name: Finish Them!
abilities.tactician.finish-them.description: '*You point out an opening to your ally so they can land a killing blow.*'
abilities.tactician.finish-them.texts.trigger: The target is not a leader or solo creature, and becomes winded.
abilities.tactician.finish-them.texts.target: One creature
abilities.tactician.finish-them.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.finish-them.texts.effect: 'Effect: The target is killed. Additionally, the creature who caused the target to be winded can spend a Recovery.'
abilities.tactician.floodgates-open.name: Floodgates Open
abilities.tactician.floodgates-open.description: '*You direct your squad to strike in unison and with devastating effect.*'
abilities.tactician.floodgates-open.texts.target: Three allies
abilities.tactician.floodgates-open.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.floodgates-open.texts.effect: 'Effect: Each target gains 1 surge and can use a signature ability as a free triggered action. That ability gains an edge on the power roll and increases the potency of any potency effects by 1.'
abilities.tactician.go-now-and-speed-well.name: Go Now and Speed Well
abilities.tactician.go-now-and-speed-well.description: '*You direct an attack to strike true.*'
abilities.tactician.go-now-and-speed-well.texts.target: Self or one ally
abilities.tactician.go-now-and-speed-well.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.go-now-and-speed-well.texts.effect: 'Effect: The target gains 2 surges and can use a signature or heroic ability as a free triggered action. The ability has a double edge on the power roll, ignores damage immunity, and increases the potency of any potency effects by 1.'
abilities.tactician.hustle.name: Hustle!
abilities.tactician.hustle.description: '*You and your allies coordinate to form a new battle line.*'
abilities.tactician.hustle.texts.target: Self and each ally in the area
abilities.tactician.hustle.texts.distance: 2 burst
abilities.tactician.hustle.texts.effect: 'Effect: You mark two enemies within 10 squares of you. Each target can shift up to their speed. You and each target gain 2 surges.'
abilities.tactician.coordinated-execution.name: Coordinated Execution
abilities.tactician.coordinated-execution.description: '*You direct your ally to make a killing blow.*'
abilities.tactician.coordinated-execution.texts.trigger: The target uses an ability to deal rolled damage to a creature while hidden.
abilities.tactician.coordinated-execution.texts.target: One ally
abilities.tactician.coordinated-execution.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.coordinated-execution.texts.effect: "Effect: If the target of the triggering ability is not a leader or solo creature, they are reduced to 0 Stamina. If the target of the triggering ability is a minion, the entire squad is killed. If the target of the triggering ability is a leader or solo creature, the triggering ability's power roll automatically obtains a tier 3 outcome."
abilities.tactician.instant-retaliation.name: Instant Retaliation
abilities.tactician.instant-retaliation.description: '*You parry with almost supernatural speed.*'
abilities.tactician.instant-retaliation.texts.trigger: A creature deals damage to the target.
abilities.tactician.instant-retaliation.texts.target: One ally
abilities.tactician.instant-retaliation.texts.distance: Melee 1
abilities.tactician.instant-retaliation.texts.roll: Power Roll + Might
abilities.tactician.instant-retaliation.texts.tier1: 'A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, dazed (save ends)'
abilities.tactician.instant-retaliation.texts.tier2: 'A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed (save ends)'
abilities.tactician.instant-retaliation.texts.tier3: 'A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.tactician.instant-retaliation.texts.effect: 'Effect: The target takes half the damage. You then make a power roll against the triggering creature.'
abilities.tactician.panic-in-their-lines.name: Panic in Their Lines
abilities.tactician.panic-in-their-lines.description: '*You confuse your foes, causing them to turn on each other.*'
abilities.tactician.panic-in-their-lines.texts.target: Two creatures
abilities.tactician.panic-in-their-lines.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.tactician.panic-in-their-lines.texts.roll: Power Roll + Might
abilities.tactician.panic-in-their-lines.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + M}} damage; slide 1'
abilities.tactician.panic-in-their-lines.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + M}} damage; slide 3'
abilities.tactician.panic-in-their-lines.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + M}} damage; slide 5'
abilities.tactician.panic-in-their-lines.texts.effect: 'Effect: If a target is force moved into another creature, they must make a free strike against that creature.'
abilities.tactician.battle-plan.name: Battle Plan
abilities.tactician.battle-plan.description: '*With new understanding of your foes, you create the perfect plan to win the battle.*'
abilities.tactician.battle-plan.texts.target: Three creatures
abilities.tactician.battle-plan.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.battle-plan.texts.effect: |-
  Effect: Each target is marked by you. Immediately and until the end of the encounter, the Director tells you if any creatures marked by you have damage immunity or weakness and the value of that immunity or weakness. Additionally, you and each ally within 3 squares of you gains 2 surges.

  Mark Benefit: Until the end of the encounter, whenever you or any ally makes a strike against a creature marked by you, you can spend 2 focus to make the strike ignore damage immunity and deal extra damage equal to three times your Reason score.
abilities.tactician.to-me-squad.name: To Me Squad!
abilities.tactician.to-me-squad.description: '*You lead your allies in a charge.*'
abilities.tactician.to-me-squad.texts.target: One creature
abilities.tactician.to-me-squad.texts.distance: Melee 1
abilities.tactician.to-me-squad.texts.roll: Power Roll + Might
abilities.tactician.to-me-squad.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6 + M}} damage; one ally within 10 squares can use the Charge main action as a free triggered action, and can use a melee strike signature ability instead of a free strike for the charge'
abilities.tactician.to-me-squad.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + M}} damage; one ally within 10 squares can use the Charge main action as a free triggered action, and can use a melee strike signature ability that gains an edge instead of a free strike for the charge'
abilities.tactician.to-me-squad.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13 + M}} damage; two allies within 10 squares can use the Charge main action as a free triggered action, and can each use a melee strike signature ability that gains an edge instead of a free strike for the charge'
abilities.tactician.to-me-squad.texts.effect: 'Effect: If the target is hit with two or more strikes as part of this ability and they have R < {has_self_potencyStrong, select, true {{self_potencyStrong}} other {STRONG}}, they are dazed (save ends). If the target is reduced to 0 Stamina before one or both allies has made their strike, the ally or allies can pick a different target.'
abilities.tactician.youve-still-got-something-left.name: You've Still Got Something Left
abilities.tactician.youve-still-got-something-left.description: '*You push an ally to use a heroic ability sooner than they otherwise would.*'
abilities.tactician.youve-still-got-something-left.texts.target: One ally
abilities.tactician.youve-still-got-something-left.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.youve-still-got-something-left.texts.effect: 'Effect: The target uses a heroic ability with the Strike keyword as a free triggered action, and deals extra damage with that ability equal to your Reason score. The ability has its Heroic Resource cost reduced by 1 + your Reason score (minimum cost 0).'
abilities.tactician.win-this-day.name: Win This Day!
abilities.tactician.win-this-day.description: '*You inspire your allies to recover and gather their strength.*'
abilities.tactician.win-this-day.texts.target: Self and each ally in the area
abilities.tactician.win-this-day.texts.distance: 3 burst
abilities.tactician.win-this-day.texts.effect: 'Effect: Each target gains 2 surges. Additionally, they can spend a Recovery, remove any conditions or effects on them, and stand up if they are prone.'
abilities.tactician.squad-gear-check.name: Squad! Gear Check!
abilities.tactician.squad-gear-check.description: '*You distract a foe while your allies secure their defensive gear.*'
abilities.tactician.squad-gear-check.texts.target: One creature
abilities.tactician.squad-gear-check.texts.distance: Melee 1
abilities.tactician.squad-gear-check.texts.roll: Power Roll + Might
abilities.tactician.squad-gear-check.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {9 + M}} damage'
abilities.tactician.squad-gear-check.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13 + M}} damage'
abilities.tactician.squad-gear-check.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {18 + M}} damage'
abilities.tactician.squad-gear-check.texts.effect: 'Effect: You and each ally adjacent to the target gain 10 temporary Stamina.'
abilities.tactician.squad-remember-your-training.name: Squad! Remember Your Training!
abilities.tactician.squad-remember-your-training.description: '*You remind your allies how to best use their gear.*'
abilities.tactician.squad-remember-your-training.texts.target: Self and two allies
abilities.tactician.squad-remember-your-training.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.squad-remember-your-training.texts.effect: 'Effect: Each target gains 1 surge and can use a signature ability that has a double edge.'
abilities.tactician.ive-got-your-back.name: I've Got Your Back
abilities.tactician.ive-got-your-back.description: '*Your enemy will think twice about attacking your friend.*'
abilities.tactician.ive-got-your-back.texts.target: One creature
abilities.tactician.ive-got-your-back.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.tactician.ive-got-your-back.texts.roll: Power Roll + Reason
abilities.tactician.ive-got-your-back.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + R}} damage; taunted (EoT)'
abilities.tactician.ive-got-your-back.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + R}} damage; taunted (EoT)'
abilities.tactician.ive-got-your-back.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {12 + R}} damage; taunted (EoT)'
abilities.tactician.ive-got-your-back.texts.effect: 'Effect: One ally adjacent to the target can spend a Recovery.'
abilities.tactician.no-dying-on-my-watch.name: No Dying on My Watch
abilities.tactician.no-dying-on-my-watch.description: '*You prioritize saving an ally over your own safety.*'
abilities.tactician.no-dying-on-my-watch.texts.trigger: The target deals damage to an ally.
abilities.tactician.no-dying-on-my-watch.texts.target: One enemy
abilities.tactician.no-dying-on-my-watch.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.tactician.no-dying-on-my-watch.texts.roll: Power Roll + Might
abilities.tactician.no-dying-on-my-watch.texts.tier1: 'R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, the target is frightened of the triggering ally (save ends)'
abilities.tactician.no-dying-on-my-watch.texts.tier2: 'R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, the target is frightened of the triggering ally (save ends)'
abilities.tactician.no-dying-on-my-watch.texts.tier3: 'R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, the target is frightened of the triggering ally (save ends)'
abilities.tactician.no-dying-on-my-watch.texts.effect: "Effect: You move up to your speed toward the triggering ally, ending this movement adjacent to them or in the nearest square if you can't reach an adjacent square. The triggering ally can spend a Recovery and gains 5 temporary Stamina for each enemy you came adjacent to during the move. You then make a power roll against the target."
abilities.tactician.squad-on-me.name: Squad! On Me!
abilities.tactician.squad-on-me.description: '*Together we are invincible!*'
abilities.tactician.squad-on-me.texts.target: Self and each ally in the area
abilities.tactician.squad-on-me.texts.distance: 1 burst
abilities.tactician.squad-on-me.texts.effect: 'Effect: Until the start of your next turn, each target has a bonus to stability equal to your Might score. Additionally, each target gains 2 surges.'
abilities.tactician.targets-of-opportunity.name: Targets of Opportunity
abilities.tactician.targets-of-opportunity.description: '*You point out easy targets to your friends, allowing them to include more enemies in their attacks.*'
abilities.tactician.targets-of-opportunity.texts.target: Two creatures
abilities.tactician.targets-of-opportunity.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {5}}'
abilities.tactician.targets-of-opportunity.texts.effect: |-
  Effect: Each target is marked by you, and you gain two surges.

  Mark Benefit: Until the end of the encounter, whenever you or any ally makes a strike against a creature marked by you, you can spend 2 focus to add one additional target to the strike.
abilities.tactician.try-me-instead.name: Try Me Instead
abilities.tactician.try-me-instead.description: '*"Try picking on someone my size."*'
abilities.tactician.try-me-instead.texts.target: Self
abilities.tactician.try-me-instead.texts.distance: Self; see below
abilities.tactician.try-me-instead.texts.roll: Power Roll + Reason
abilities.tactician.try-me-instead.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} damage; R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, frightened (save ends)'
abilities.tactician.try-me-instead.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3 + R}} damage; R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, frightened (save ends)'
abilities.tactician.try-me-instead.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {4 + R}} damage; R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, frightened (save ends)'
abilities.tactician.try-me-instead.texts.effect: "Effect: You shift up to your speed directly toward an ally, ending adjacent to them, then swapping locations with that ally as long as you can fit into each other's spaces. The ally can spend a Recovery, and you can make the following weapon strike with a distance of melee 1 against a creature."
abilities.tactician.fog-of-war.name: Fog of War
abilities.tactician.fog-of-war.description: '*Your unorthodox strategy causes enemies to lash out in fear, heedless of who they might be attacking.*'
abilities.tactician.fog-of-war.texts.target: Two creatures
abilities.tactician.fog-of-war.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.fog-of-war.texts.effect: |-
  Effect: Each target is marked by you, and must immediately make a free strike against a creature of your choice within 5 squares of them.

  Mark Benefit: Until the end of the encounter, whenever you or any ally makes a strike against a creature marked by you, you can spend 2 focus to force that target to make a free strike against a creature of your choice within 5 squares of them.
abilities.tactician.rout.name: Rout
abilities.tactician.rout.description: '*The tide begins to turn.*'
abilities.tactician.rout.texts.target: Self
abilities.tactician.rout.texts.distance: Self
abilities.tactician.rout.texts.effect: 'Effect: Until the end of the encounter or until you are dying, whenever you or any ally deals damage to a target marked by you who has R < {has_self_potencyAverage, select, true {{self_potencyAverage}} other {AVERAGE}}, the target is frightened of the creature who dealt the damage (save ends).'
abilities.tactician.frontal-assault.name: Frontal Assault
abilities.tactician.frontal-assault.description: '*The purpose of a charge is to break their morale and force a retreat.*'
abilities.tactician.frontal-assault.texts.target: Self
abilities.tactician.frontal-assault.texts.distance: Self
abilities.tactician.frontal-assault.texts.effect: 'Effect: Until the end of the encounter or until you are dying, the first time on a turn that you or any ally deals damage to a target marked by you, the creature who dealt the damage can push the target up to 2 squares and then shift up to 2 squares. Additionally, any ally using the Charge main action to target a creature marked by you can use a melee strike signature ability or a melee strike heroic ability instead of a melee free strike.'
abilities.tactician.hit-em-hard.name: Hit 'Em Hard!
abilities.tactician.hit-em-hard.description: '*Your allies see the advantages in attacking the targets you select.*'
abilities.tactician.hit-em-hard.texts.target: Self
abilities.tactician.hit-em-hard.texts.distance: Self
abilities.tactician.hit-em-hard.texts.effect: 'Effect: Until the end of the encounter or until you are dying, whenever you or any ally deals damage to a target marked by you, that creature gains 2 surges, which they can use immediately.'
abilities.tactician.stay-strong-and-focus.name: Stay Strong and Focus!
abilities.tactician.stay-strong-and-focus.description: '*"We can do this! Keep faith and hold fast!"*'
abilities.tactician.stay-strong-and-focus.texts.target: Self
abilities.tactician.stay-strong-and-focus.texts.distance: Self
abilities.tactician.stay-strong-and-focus.texts.effect: 'Effect: Until the end of the encounter or until you are dying, whenever you or any ally deals damage to a target marked by you, the creature who dealt the damage can spend a Recovery.'
abilities.tactician.squad-hit-and-run.name: Squad! Hit and Run!
abilities.tactician.squad-hit-and-run.description: '*I had to pry this secret from the shadow colleges.*'
abilities.tactician.squad-hit-and-run.texts.target: Self and two allies
abilities.tactician.squad-hit-and-run.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.squad-hit-and-run.texts.effect: 'Effect: Each target gains 2 surges, and can use a free triggered action to use a signature ability that gains an edge. After resolving their ability, each target can shift up to 2 squares and become hidden even if they have no cover or concealment, or if they are observed.'
abilities.tactician.counterstrategy.name: Counterstrategy
abilities.tactician.counterstrategy.description: "*I've identified a way to negate their strengths.*"
abilities.tactician.counterstrategy.texts.target: Self
abilities.tactician.counterstrategy.texts.distance: Self
abilities.tactician.counterstrategy.texts.effect: 'Effect: You gain 6 surges. Until the end of the encounter or until you are dying, whenever the Director spends Malice (see [Draw Steel: Monsters](https://mcdm.gg/DS-Monsters)), choose yourself or one ally within 10 squares. The chosen character gains 2 of their Heroic Resource.'
abilities.tactician.that-one-is-mine.name: That One Is Mine!
abilities.tactician.that-one-is-mine.description: '*You focus on making an enemy irrelevant.*'
abilities.tactician.that-one-is-mine.texts.target: One creature
abilities.tactician.that-one-is-mine.texts.distance: 'Melee 1 or ranged {has_self_rangedDistance, select, true {{self_rangedDistance}} other {5}}'
abilities.tactician.that-one-is-mine.texts.roll: Power Roll + Might
abilities.tactician.that-one-is-mine.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + M}} damage'
abilities.tactician.that-one-is-mine.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13 + M}} damage'
abilities.tactician.that-one-is-mine.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {17 + M}} damage'
abilities.tactician.that-one-is-mine.texts.effect: |-
  Effect: The target is marked by you.

  Effect: Until the end of the encounter or until you are dying, you can use a signature or heroic ability instead of a free strike against any target marked by you.
abilities.tactician.no-escape.name: No Escape
abilities.tactician.no-escape.description: '*Nothing will stop you from reaching your foe.*'
abilities.tactician.no-escape.texts.target: One creature
abilities.tactician.no-escape.texts.distance: Melee 1
abilities.tactician.no-escape.texts.roll: Power Roll + Might
abilities.tactician.no-escape.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {11 + M}} damage'
abilities.tactician.no-escape.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {16 + M}} damage'
abilities.tactician.no-escape.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {21 + M}} damage'
abilities.tactician.no-escape.texts.effect: |-
  Effect: You mark the target.

  Effect: If you use this ability as part of the Charge main action, enemies' spaces don't count as difficult terrain for your movement. Additionally, if you move through any creature's space, you can slide that creature 1 square out of the path of your charge.
abilities.tactician.their-lack-of-focus-is-their-undoing.name: Their Lack of Focus Is Their Undoing
abilities.tactician.their-lack-of-focus-is-their-undoing.description: '*You trick your enemies into attacking each other and leave them confused by the aftermath.*'
abilities.tactician.their-lack-of-focus-is-their-undoing.texts.target: Three enemies
abilities.tactician.their-lack-of-focus-is-their-undoing.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.tactician.their-lack-of-focus-is-their-undoing.texts.roll: Power Roll + Might
abilities.tactician.their-lack-of-focus-is-their-undoing.texts.tier1: 'R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, dazed (save ends)'
abilities.tactician.their-lack-of-focus-is-their-undoing.texts.tier2: 'R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed (save ends)'
abilities.tactician.their-lack-of-focus-is-their-undoing.texts.tier3: 'R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.tactician.their-lack-of-focus-is-their-undoing.texts.effect: "Effect: Each target uses a signature ability against one or more targets of your choosing, with each ability automatically obtaining a tier 3 outcome on the power roll. After resolving the targets' abilities, you make a power roll against each original target."
abilities.tactician.blot-out-the-sun.name: Blot Out the Sun!
abilities.tactician.blot-out-the-sun.description: '*What makes a good soldier? The ability to fire four shots a minute in any weather.*'
abilities.tactician.blot-out-the-sun.texts.target: Self and each ally in the area
abilities.tactician.blot-out-the-sun.texts.distance: 3 burst
abilities.tactician.blot-out-the-sun.texts.effect: 'Effect: Each target can make a ranged free strike that gains an edge against any enemy marked by you within distance of their ranged free strike. A target ignores banes and double banes when making this strike.'
