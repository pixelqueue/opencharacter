abilities.elementalist.breath-of-dawn-remembered.name: Breath of Dawn Remembered
abilities.elementalist.breath-of-dawn-remembered.description: '*The power you channel grants the ability to get back in the fight.*'
abilities.elementalist.breath-of-dawn-remembered.texts.trigger: The target starts their turn or takes damage.
abilities.elementalist.breath-of-dawn-remembered.texts.target: Self or one ally
abilities.elementalist.breath-of-dawn-remembered.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.breath-of-dawn-remembered.texts.effect: |-
  Effect: The target can spend a Recovery.

  Spend 1+ Essence: The target can spend an additional Recovery for each essence spent.
abilities.elementalist.hurl-element.name: Hurl Element
abilities.elementalist.hurl-element.description: '*You cast a ball of elemental energy at a foe.*'
abilities.elementalist.hurl-element.texts.target: One creature or object
abilities.elementalist.hurl-element.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.hurl-element.texts.roll: Power Roll + Reason
abilities.elementalist.hurl-element.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} damage'
abilities.elementalist.hurl-element.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + R}} damage'
abilities.elementalist.hurl-element.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + R}} damage'
abilities.elementalist.hurl-element.texts.effect: 'Effect: When you make this strike, choose the
  damage type from one of the following options: acid, cold, corruption, fire, lightning, poison, or
  sonic.'
abilities.elementalist.invigorating-growth.name: Invigorating Growth
abilities.elementalist.invigorating-growth.description: '*Mushrooms erupt from a foe, sapping their vitality to spread strengthening spores.*'
abilities.elementalist.invigorating-growth.texts.target: One creature
abilities.elementalist.invigorating-growth.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.invigorating-growth.texts.roll: Power Roll + Reason
abilities.elementalist.invigorating-growth.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4 + R}} poison damage'
abilities.elementalist.invigorating-growth.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {7 + R}} poison damage'
abilities.elementalist.invigorating-growth.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11 + R}} poison damage'
abilities.elementalist.invigorating-growth.texts.effect: "Effect: Mushrooms cover the target's body.
  While the mushrooms are on the target, you and any ally adjacent to the target gain 1 surge
  whenever the target takes damage. The mushrooms can be removed by the target or an adjacent
  creature as a main action."
abilities.elementalist.practical-magic.name: Practical Magic
abilities.elementalist.practical-magic.description: '*Your mastery of elemental power lets you customize your conjurations.*'
abilities.elementalist.practical-magic.texts.target: Self
abilities.elementalist.practical-magic.texts.distance: Self; see below
abilities.elementalist.practical-magic.texts.effect: >-
  Effect: Choose one of the following effects:

  - You use the Knockback maneuver (see Chapter 10: Combat), but its distance becomes the range of
  your Hurl Element ability, and you use Reason instead of Might for the power roll.

  - You choose a creature within the distance of your Hurl Element ability and one of the following
  damage types: acid, cold, corruption, fire, lightning, poison, or sonic. That creature takes
  damage of the chosen type equal to your Reason score.

  - You teleport up to a number of squares equal to your Reason score. If you choose this option,
  you can spend essence to teleport 1 additional square for each essence spent.
abilities.elementalist.ray-of-agonizing-self-reflection.name: Ray of Agonizing Self-Reflection
abilities.elementalist.ray-of-agonizing-self-reflection.description: '*You inflict pain and doubt in equal measure.*'
abilities.elementalist.ray-of-agonizing-self-reflection.texts.target: One creature or object
abilities.elementalist.ray-of-agonizing-self-reflection.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.ray-of-agonizing-self-reflection.texts.roll: Power Roll + Reason
abilities.elementalist.ray-of-agonizing-self-reflection.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} corruption damage; R < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, slowed (save ends)'
abilities.elementalist.ray-of-agonizing-self-reflection.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + R}} corruption damage; R < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, slowed (save ends)'
abilities.elementalist.ray-of-agonizing-self-reflection.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + R}} corruption damage; R < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, slowed (save ends)'
abilities.elementalist.test-of-rain.name: Test of Rain
abilities.elementalist.test-of-rain.description: '*You call down a rain that burns your enemies and restores your allies.*'
abilities.elementalist.test-of-rain.texts.target: Each enemy in the area
abilities.elementalist.test-of-rain.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.test-of-rain.texts.roll: Power Roll + Reason
abilities.elementalist.test-of-rain.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4}} acid damage'
abilities.elementalist.test-of-rain.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} acid damage'
abilities.elementalist.test-of-rain.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10}} acid damage'
abilities.elementalist.test-of-rain.texts.effect: 'Effect: You can end one effect on yourself that
  is ended by a saving throw or that ends at the end of your turn. Each ally in the area also gains
  this benefit.'
abilities.elementalist.the-green-within-the-green-without.name: The Green Within, the Green Without
abilities.elementalist.the-green-within-the-green-without.description: "*Whipping vines erupt from a foe's body to grasp at another close by.*"
abilities.elementalist.the-green-within-the-green-without.texts.target: One creature
abilities.elementalist.the-green-within-the-green-without.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.the-green-within-the-green-without.texts.roll: Power Roll + Reason
abilities.elementalist.the-green-within-the-green-without.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} damage'
abilities.elementalist.the-green-within-the-green-without.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + R}} damage'
abilities.elementalist.the-green-within-the-green-without.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7 + R}} damage'
abilities.elementalist.the-green-within-the-green-without.texts.effect: 'Effect: You slide one creature within 10 squares of the target up to 2 squares.'
abilities.elementalist.motivate-earth.name: Motivate Earth
abilities.elementalist.motivate-earth.description: '*The earth rises, falls, or opens up at your command.*'
abilities.elementalist.motivate-earth.texts.target: Special
abilities.elementalist.motivate-earth.texts.distance: Melee 1
abilities.elementalist.motivate-earth.texts.effect: >-
  Effect: You touch a square containing mundane dirt, stone, or metal and create a 5 wall of the
  same material, which rises up out of the ground and must include the square you touched.

  Alternatively, you touch a structure made of mundane dirt, stone, or metal that occupies 2 or more
  squares. You can open a 1-square opening in the structure where you touched it. You can instead
  touch an existing doorway or other opening that is 1 square or smaller in a mundane dirt, stone,
  or metal surface. The opening is sealed by the same material that makes up the surface.
abilities.elementalist.return-to-formlessness.name: Return to Formlessness
abilities.elementalist.return-to-formlessness.description: '*With the merest touch, you cause an object to turn to slag or ash.*'
abilities.elementalist.return-to-formlessness.texts.target: One mundane object
abilities.elementalist.return-to-formlessness.texts.distance: Melee 1
abilities.elementalist.return-to-formlessness.texts.effect: 'Effect: You heat the target and cause
  it to melt or combust, destroying it. If the object is larger than 1 square, then only the square
  of the object you touch is destroyed.'
abilities.elementalist.grasp-of-beyond.name: Grasp of Beyond
abilities.elementalist.grasp-of-beyond.description: '*You absorb the life energy of another creature and use it to teleport.*'
abilities.elementalist.grasp-of-beyond.texts.target: One creature
abilities.elementalist.grasp-of-beyond.texts.distance: Melee 1
abilities.elementalist.grasp-of-beyond.texts.roll: Power Roll + Reason
abilities.elementalist.grasp-of-beyond.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + R}} corruption damage'
abilities.elementalist.grasp-of-beyond.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6 + R}} corruption damage'
abilities.elementalist.grasp-of-beyond.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9 + R}} corruption damage'
abilities.elementalist.grasp-of-beyond.texts.effect: 'Effect: You can teleport up to a number of squares equal to your Reason score.'
abilities.elementalist.no-more-than-a-breeze.name: No More Than a Breeze
abilities.elementalist.no-more-than-a-breeze.description: '*The material substance of a creature shreds away at your command.*'
abilities.elementalist.no-more-than-a-breeze.texts.target: Self or one ally
abilities.elementalist.no-more-than-a-breeze.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.no-more-than-a-breeze.texts.effect: >-
  Effect: Until the start of your next turn, the target can move through solid matter, they ignore
  difficult terrain, and their movement can't provoke opportunity attacks. If the target ends their
  turn inside solid matter, they are forced out into the space where they entered it and this effect
  ends.


  Persistent 1: The effect lasts until the start of your next turn.
abilities.elementalist.subtle-relocation.name: Subtle Relocation
abilities.elementalist.subtle-relocation.description: '*You call on the void to swallow and spit out an ally.*'
abilities.elementalist.subtle-relocation.texts.trigger: The target starts their turn, moves, or is force moved.
abilities.elementalist.subtle-relocation.texts.target: Self or one ally
abilities.elementalist.subtle-relocation.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.subtle-relocation.texts.effect: >-
  Effect: You teleport the target up to a number of squares equal to your Reason score. If the
  target moves to trigger this ability, you can teleport them at any point during the move.


  Spend 1 Essence: You teleport the target up to a number of squares equal to twice your Reason
  score instead.
abilities.elementalist.viscous-fire.name: Viscous Fire
abilities.elementalist.viscous-fire.description: '*A jet of heavy fire erupts where you strike.*'
abilities.elementalist.viscous-fire.texts.target: One creature or object
abilities.elementalist.viscous-fire.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.viscous-fire.texts.roll: Power Roll + Reason
abilities.elementalist.viscous-fire.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} fire damage; push 2'
abilities.elementalist.viscous-fire.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + R}} fire damage; push 3'
abilities.elementalist.viscous-fire.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7 + R}} fire damage; push 4'
abilities.elementalist.skin-like-castle-walls.name: Skin Like Castle Walls
abilities.elementalist.skin-like-castle-walls.description: '*You cover yourself or an ally in protective stone.*'
abilities.elementalist.skin-like-castle-walls.texts.trigger: The target takes damage.
abilities.elementalist.skin-like-castle-walls.texts.target: Self or one ally
abilities.elementalist.skin-like-castle-walls.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.skin-like-castle-walls.texts.effect: >-
  Effect: The target takes half the damage.


  Spend 1 Essence: If the damage has any potency effects associated with it, the potency is reduced
  by 1 for the target.
abilities.elementalist.shared-void-sense.name: Shared Void Sense
abilities.elementalist.shared-void-sense.description: '*You grant allies a taste of your unearthly vision.*'
abilities.elementalist.shared-void-sense.texts.target: Special
abilities.elementalist.shared-void-sense.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.shared-void-sense.texts.effect: "Effect: For each Victory you have, you can
  target one creature. Each target gains the benefit of your A Beyonding of Vision feature until the
  end of your next turn, but doesn't gain the use of the Shared Void Sense ability."
abilities.elementalist.the-flesh-a-crucible.name: The Flesh, a Crucible
abilities.elementalist.the-flesh-a-crucible.description: '*Fire engulfs your target and continues to churn.*'
abilities.elementalist.the-flesh-a-crucible.texts.target: One creature or object
abilities.elementalist.the-flesh-a-crucible.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.the-flesh-a-crucible.texts.roll: Power Roll + Reason
abilities.elementalist.the-flesh-a-crucible.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + R}} fire damage'
abilities.elementalist.the-flesh-a-crucible.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {8 + R}} fire damage'
abilities.elementalist.the-flesh-a-crucible.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {11 + R}} fire damage'
abilities.elementalist.the-flesh-a-crucible.texts.effect: 'Persistent 1: If the target is within
  distance at the start of your turn, you can make the power roll again without spending essence (no
  action required).'
abilities.elementalist.ripples-in-the-earth.name: Ripples in the Earth
abilities.elementalist.ripples-in-the-earth.description: '*Like a stone was dropped into a pond, waves in the earth radiate from you.*'
abilities.elementalist.ripples-in-the-earth.texts.target: Each enemy in the area
abilities.elementalist.ripples-in-the-earth.texts.distance: 2 burst
abilities.elementalist.ripples-in-the-earth.texts.roll: Power Roll + Reason
abilities.elementalist.ripples-in-the-earth.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3}} damage'
abilities.elementalist.ripples-in-the-earth.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} damage'
abilities.elementalist.ripples-in-the-earth.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8}} damage; M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone'
abilities.elementalist.ripples-in-the-earth.texts.effect: "Effect: You must be touching the ground
  to use this ability. Additionally, you can choose a square of ground in the area that is
  unoccupied or is occupied by you or any ally. A pillar of earth rises out of the ground in that
  square, with a height in squares up to your Reason score. The pillar can't collide with any
  creatures or objects, nor can it force creatures raised by it to collide with other creatures or
  objects."
abilities.elementalist.explosive-assistance.name: Explosive Assistance
abilities.elementalist.explosive-assistance.description: "*You add a little magic to an ally's aggression at just the right time.*"
abilities.elementalist.explosive-assistance.texts.trigger: The target force moves a creature or object.
abilities.elementalist.explosive-assistance.texts.target: Self or one ally
abilities.elementalist.explosive-assistance.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.explosive-assistance.texts.effect: >-
  Effect: The forced movement distance gains a bonus equal to your Reason score.


  Spend 1 Essence: The forced movement distance gains a bonus equal to twice your Reason score
  instead.
abilities.elementalist.meteoric-introduction.name: Meteoric Introduction
abilities.elementalist.meteoric-introduction.description: '*You give your enemy a gentle tap-like an asteroid impact.*'
abilities.elementalist.meteoric-introduction.texts.target: One creature or object
abilities.elementalist.meteoric-introduction.texts.distance: Melee 1
abilities.elementalist.meteoric-introduction.texts.roll: Power Roll + Reason
abilities.elementalist.meteoric-introduction.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3 + R}} damage; push 2'
abilities.elementalist.meteoric-introduction.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5 + R}} damage; push 3'
abilities.elementalist.meteoric-introduction.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8 + R}} damage; push 4'
abilities.elementalist.instantaneous-excavation.name: Instantaneous Excavation
abilities.elementalist.instantaneous-excavation.description: '*The surface of the world around you opens up to swallow foes.*'
abilities.elementalist.instantaneous-excavation.texts.target: Special
abilities.elementalist.instantaneous-excavation.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.instantaneous-excavation.texts.roll: Power Roll + Reason
abilities.elementalist.instantaneous-excavation.texts.tier1: The target can shift 1 square from the
  edge of the hole to the nearest unoccupied space of their choice.
abilities.elementalist.instantaneous-excavation.texts.tier2: The target falls into the hole.
abilities.elementalist.instantaneous-excavation.texts.tier3: The target falls into the hole and can't reduce the height of the fall.
abilities.elementalist.instantaneous-excavation.texts.effect: >-
  Effect: You open up two holes with 1-square openings that are 4 squares deep, which can be placed
  on any mundane surface within distance. You can place these holes next to each other to create
  fewer holes with wider openings. When the holes open, make a separate power roll for each creature
  on the ground above a hole and small enough to fall in. (You can't score a critical hit with this
  ability because it uses a maneuver.)


  Persistent 1: At the start of your turn, you open another hole, making a power roll against each
  creature who could fall into the hole when it opens without spending essence.
abilities.elementalist.bifurcated-incineration.name: Bifurcated Incineration
abilities.elementalist.bifurcated-incineration.description: '*Two jets of flame lance out at your command.*'
abilities.elementalist.bifurcated-incineration.texts.target: Two creatures or objects
abilities.elementalist.bifurcated-incineration.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.bifurcated-incineration.texts.roll: Power Roll + Reason
abilities.elementalist.bifurcated-incineration.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} fire damage'
abilities.elementalist.bifurcated-incineration.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4}} fire damage'
abilities.elementalist.bifurcated-incineration.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6}} fire damage'
abilities.elementalist.behold-the-mystery.name: Behold the Mystery
abilities.elementalist.behold-the-mystery.description: '*You open a rift into the void to harry your foes.*'
abilities.elementalist.behold-the-mystery.texts.target: Each enemy in the area
abilities.elementalist.behold-the-mystery.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.behold-the-mystery.texts.roll: Power Roll + Reason
abilities.elementalist.behold-the-mystery.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} psychic damage'
abilities.elementalist.behold-the-mystery.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4}} psychic damage'
abilities.elementalist.behold-the-mystery.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6}} psychic damage'
abilities.elementalist.behold-the-mystery.texts.effect: 'Persistent 1: At the start of your turn,
  you can use a maneuver to use this ability again without spending essence.'
abilities.elementalist.afflict-a-bountiful-decay.name: Afflict a Bountiful Decay
abilities.elementalist.afflict-a-bountiful-decay.description: "*Your curse causes your foe's flesh to rot off as spores that aid your allies.*"
abilities.elementalist.afflict-a-bountiful-decay.texts.target: One creature
abilities.elementalist.afflict-a-bountiful-decay.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.afflict-a-bountiful-decay.texts.roll: Power Roll + Reason
abilities.elementalist.afflict-a-bountiful-decay.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2 + R}} corruption damage'
abilities.elementalist.afflict-a-bountiful-decay.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {4 + R}} corruption damage'
abilities.elementalist.afflict-a-bountiful-decay.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {6 + R}} corruption damage'
abilities.elementalist.afflict-a-bountiful-decay.texts.effect: 'Effect: Choose yourself or one ally
  within distance. That character can end one effect on them that is ended by a saving throw or that
  ends at the end of their turn.'
abilities.elementalist.unquiet-ground.name: Unquiet Ground
abilities.elementalist.unquiet-ground.description: '*A sudden storm of detritus assaults your foes and leaves them struggling to move.*'
abilities.elementalist.unquiet-ground.texts.target: Each enemy in the area
abilities.elementalist.unquiet-ground.texts.distance: '2 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.unquiet-ground.texts.roll: Power Roll + Reason
abilities.elementalist.unquiet-ground.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} damage'
abilities.elementalist.unquiet-ground.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} damage'
abilities.elementalist.unquiet-ground.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} damage'
abilities.elementalist.unquiet-ground.texts.effect: 'Effect: The ground beneath the area is difficult terrain for enemies.'
abilities.elementalist.conflagration.name: Conflagration
abilities.elementalist.conflagration.description: '*A storm of fire descends upon your enemies.*'
abilities.elementalist.conflagration.texts.target: Each enemy in the area
abilities.elementalist.conflagration.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.conflagration.texts.roll: Power Roll + Reason
abilities.elementalist.conflagration.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {4}} fire damage'
abilities.elementalist.conflagration.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} fire damage'
abilities.elementalist.conflagration.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {10}} fire damage'
abilities.elementalist.conflagration.texts.effect: 'Persistent 2: At the start of your turn, you can
  use a maneuver to use this ability again without spending essence.'
abilities.elementalist.muse-of-fire.name: Muse of Fire
abilities.elementalist.muse-of-fire.description: '*The fire burns hot enough to sear the face of any god watching.*'
abilities.elementalist.muse-of-fire.texts.target: Each enemy in the area
abilities.elementalist.muse-of-fire.texts.distance: '5 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.muse-of-fire.texts.roll: Power Roll + Reason
abilities.elementalist.muse-of-fire.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {7}} fire damage; the Director loses 2 Malice (see [Draw Steel: Monsters](https://mcdm.gg/DS-Monsters))'
abilities.elementalist.muse-of-fire.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10}} fire damage; the Director loses 3 Malice'
abilities.elementalist.muse-of-fire.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {15}} fire damage; the Director loses 4 Malice'
abilities.elementalist.muse-of-fire.texts.effect: "Effect: The Director's Malice can become negative as a result of this ability."
abilities.elementalist.world-torn-asunder.name: World Torn Asunder
abilities.elementalist.world-torn-asunder.description: '*You stomp your foot and quake the whole world over.*'
abilities.elementalist.world-torn-asunder.texts.target: Each enemy in the area
abilities.elementalist.world-torn-asunder.texts.distance: 5 burst
abilities.elementalist.world-torn-asunder.texts.roll: Power Roll + Reason
abilities.elementalist.world-torn-asunder.texts.tier1: 'M < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, prone'
abilities.elementalist.world-torn-asunder.texts.tier2: 'M < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, prone'
abilities.elementalist.world-torn-asunder.texts.tier3: 'M < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, prone'
abilities.elementalist.world-torn-asunder.texts.effect: 'Effect: You create a fissure in the ground
  adjacent to you that is a 10 x 2 line and 6 squares deep. Each creature in the area who is prone
  and size 2 or smaller falls in. Other creatures can enter the fissure or can shift to the nearest
  unoccupied space of their choice outside it.'
abilities.elementalist.return-to-oblivion.name: Return to Oblivion
abilities.elementalist.return-to-oblivion.description: '*You create a tear in reality that could consume everything.*'
abilities.elementalist.return-to-oblivion.texts.target: Special
abilities.elementalist.return-to-oblivion.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.return-to-oblivion.texts.effect: 'Effect: You create a size 1L vortex that
  lasts until the end of the encounter. At the start of each combat round while the vortex is
  unoccupied, the vortex vertical pulls 3 each enemy within 5 squares of it. Each enemy who enters
  the vortex or starts their turn there is knocked prone. At the end of the round, if a winded enemy
  who is not a leader or solo creature is in the vortex, they are instantly destroyed.'
abilities.elementalist.heart-of-the-wode.name: Heart of the Wode
abilities.elementalist.heart-of-the-wode.description: "*You call forth one of the Great Tree's many splinters to provide for your every need.*"
abilities.elementalist.heart-of-the-wode.texts.target: Special
abilities.elementalist.heart-of-the-wode.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.heart-of-the-wode.texts.effect: >-
  Effect: A size 5 tree appears in an unoccupied space within distance. The tree has 100 Stamina and
  can't be force moved. You and any ally can touch the tree to use the Catch Breath maneuver as a
  free maneuver. Additionally, when you start your turn with line of effect to the tree, you can end
  one effect on yourself that is ended by a saving throw or that ends at the end of your turn, or
  you can stand up if you are prone. Each ally within distance also gains this benefit.

  Each enemy who ends their turn within 3 squares of the tree is restrained until the end of their
  next turn. A creature restrained this way can use a main action to end the effect early.
abilities.elementalist.the-green-defends-its-servants.name: The Green Defends Its Servants
abilities.elementalist.the-green-defends-its-servants.description: '*A luminous green shield shows its true beauty the more it cracks.*'
abilities.elementalist.the-green-defends-its-servants.texts.target: Self or one ally
abilities.elementalist.the-green-defends-its-servants.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.the-green-defends-its-servants.texts.effect: >-
  Effect: You conjure an elemental shield that protects the target until the end of your next turn.
  While the shield is active, the target can take the Defend main action as a maneuver on each of
  their turns. The target gains 30 temporary Stamina that lasts until depleted or until the effect
  ends. If this temporary Stamina disappears, the effect ends and the shield explodes, dealing 10
  damage to each enemy within 5 squares of the target.


  Persistent 2: The effect lasts until the start of your next turn.
abilities.elementalist.summon-source-of-earth.name: Summon Source of Earth
abilities.elementalist.summon-source-of-earth.description: |-
  *The ground rumbles as an elemental bursts forth, ready to serve.*

  **Source of Earth** (Elemental, level 8 brute): size 2, speed 6 (burrow), Stamina 45, stability 5, free strike 5; Might +3, Agility +1, Reason −5, Intuition −5, Presence −3.

  **Earthwalk.** Difficult terrain composed of earth and stone doesn't cost the source extra movement.

  **Tunneler.** When the source burrows, they create a size 2 tunnel.

  **Earth Harness.** A creature that has the Earth Accepts Me ability can use it as a free action to meld into the source.

  **Boulder Bash** (signature; Melee, Ranged, Strike, Weapon; melee 2 or ranged 10; one creature). Power Roll + 3: ≤11, 5 damage; push 3. 12–16, 9 damage; push 4. 17+, 12 damage; push 5.
abilities.elementalist.summon-source-of-earth.texts.target: Special
abilities.elementalist.summon-source-of-earth.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.summon-source-of-earth.texts.effect: >-
  Effect: A source of earth emerges from an unoccupied space within distance. The source takes their
  turn immediately after you, moving up to their speed and either taking a main action or a
  maneuver. The source is dismissed at the start of your next turn.

  The source starts an encounter at full Stamina, but maintains their current Stamina throughout the
  encounter, even if they are dismissed and you use this ability again. They can't regain Stamina
  during the encounter. When the source's Stamina is reduced to 0, you can't use this ability again
  until you earn 1 or more Victories.


  Persistent 2: The source takes another turn. They are dismissed at the start of your next turn.

  ###### Source of Earth Statblock


  Source of Earth


  |       Elemental       |            -             |       Level
  8       |          BRUTE          |          EV -          |

  | :-------------------: | :----------------------: | :-----------------: | :---------------------:
  | :--------------------: |

  |    2  Size    |     6  Speed     | 45  Stamina |  5  Stability   | 5  Free Strike |

  | -  Immunities | Burrow  Movement |                     | -  With Captain | -  Weaknesses  |

  |   +3  Might   |   +1  Agility    | -5  Reason  |  -5  Intuition  |  -3  Presence  |
abilities.elementalist.earth-rejects-you.name: Earth Rejects You
abilities.elementalist.earth-rejects-you.description: '*Everyone and everything gets blown away in an eruption of rocks and debris.*'
abilities.elementalist.earth-rejects-you.texts.target: Each enemy and object in the area
abilities.elementalist.earth-rejects-you.texts.distance: '5 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.earth-rejects-you.texts.roll: Power Roll + Reason
abilities.elementalist.earth-rejects-you.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {6}} damage'
abilities.elementalist.earth-rejects-you.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9}} damage'
abilities.elementalist.earth-rejects-you.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {13}} damage'
abilities.elementalist.earth-rejects-you.texts.effect: 'Persistent 2: At the start of your turn, you
  can use a maneuver to use this ability again without spending essence.'
abilities.elementalist.unquenchable-fire.name: Unquenchable Fire
abilities.elementalist.unquenchable-fire.description: '*You let fly a fiery missile braided with pure primal energy.*'
abilities.elementalist.unquenchable-fire.texts.target: One enemy or object
abilities.elementalist.unquenchable-fire.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.unquenchable-fire.texts.roll: Power Roll + Reason
abilities.elementalist.unquenchable-fire.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {13 + R}} fire damage; I < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, dazed (save ends)'
abilities.elementalist.unquenchable-fire.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {18 + R}} fire damage; I < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, dazed (save ends)'
abilities.elementalist.unquenchable-fire.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {25 + R}} fire damage; I < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, dazed (save ends)'
abilities.elementalist.unquenchable-fire.texts.effect: 'Effect: This damage ignores immunity.'
abilities.elementalist.prism.name: Prism
abilities.elementalist.prism.description: '*You split your essence, allowing you to cast multiple effects at once.*'
abilities.elementalist.prism.texts.target: Self
abilities.elementalist.prism.texts.distance: Self
abilities.elementalist.prism.texts.effect: 'Effect: You use up to three heroic abilities whose
  essence costs total 11 or less, spending no additional essence beyond the cost of this ability.
  You can shift up to 2 squares between your use of each ability.'
abilities.elementalist.meteor.name: Meteor
abilities.elementalist.meteor.description: '*You teleport the target into the air and let the ground
  and the elemental force of fire do the rest.*'
abilities.elementalist.meteor.texts.target: One creature or object
abilities.elementalist.meteor.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.meteor.texts.roll: Power Roll + Reason
abilities.elementalist.meteor.texts.tier1: You teleport the target up to 4 squares.
abilities.elementalist.meteor.texts.tier2: You teleport the target up to 6 squares.
abilities.elementalist.meteor.texts.tier3: You teleport the target up to 8 squares.
abilities.elementalist.meteor.texts.effect: 'Effect: If the target is teleported to a space where
  they would fall, they immediately do so, treating the fall as if their Agility score were 0. The
  target takes fire damage from the fall, and each enemy within 3 squares of where they land takes
  the same amount of fire damage. The ground within 3 squares of where the target lands is difficult
  terrain.'
abilities.elementalist.magma-titan.name: Magma Titan
abilities.elementalist.magma-titan.description: '*Their body swells with lava, mud, and might, towering over their enemies.*'
abilities.elementalist.magma-titan.texts.target: Self or one ally
abilities.elementalist.magma-titan.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.magma-titan.texts.effect: >-
  Effect: Until the start of your next turn, the target has the following benefits:

  - Their size and stability increase by 2, with any size 1 target becoming size 3. Each creature
  who is within the target's new space slides to the nearest unoccupied space, ignoring stability.
  If the target doesn't have space to grow, they grow as much as they can and become restrained
  until the effect ends.

  - They have fire immunity 10.

  - Their strikes deal extra fire damage equal to twice your Reason score.

  - When the target force moves a creature or object, the forced movement distance gains a +2 bonus.

  - They can use their highest characteristic instead of Might for Might power rolls.


  Persistent 2: The effect lasts until the start of your next turn. Additionally, at the start of
  your turn, the target can spend 2 Recoveries.
abilities.elementalist.luminous-champion-aloft.name: Luminous Champion Aloft
abilities.elementalist.luminous-champion-aloft.description: '*They shine vibrantly, a beautiful diamond in the night sky.*'
abilities.elementalist.luminous-champion-aloft.texts.target: Self or one ally
abilities.elementalist.luminous-champion-aloft.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.luminous-champion-aloft.texts.effect: >-
  Effect: The target has a +3 bonus to speed, they can fly, and their abilities ignore concealment.
  Additionally, whenever the target gains their Heroic Resource, they gain 1 additional Heroic
  Resource. This effect lasts until the start of your next turn.


  Persistent 1: The effect lasts until the start of your next turn.
abilities.elementalist.the-wode-remembers-and-returns.name: The Wode Remembers and Returns
abilities.elementalist.the-wode-remembers-and-returns.description: '*You create a terrarium that spans from canopy above to underbrush below.*'
abilities.elementalist.the-wode-remembers-and-returns.texts.target: Special
abilities.elementalist.the-wode-remembers-and-returns.texts.distance: 4 burst
abilities.elementalist.the-wode-remembers-and-returns.texts.effect: >-
  Effect: The area becomes dark and verdant, with trees and plant life appearing in unoccupied
  spaces within it until the start of your next turn. The area is difficult terrain for enemies, and
  any ally who ends their turn in the area has cover.


  Persistent 2: The area remains until the start of your next turn. Additionally, at the start of
  your turn, each ally in the area can spend a Recovery.
abilities.elementalist.subverted-perception-of-space.name: Subverted Perception of Space
abilities.elementalist.subverted-perception-of-space.description: "*You rip an enemy's world in twain.*"
abilities.elementalist.subverted-perception-of-space.texts.target: One creature or object
abilities.elementalist.subverted-perception-of-space.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.subverted-perception-of-space.texts.roll: Power Roll + Reason
abilities.elementalist.subverted-perception-of-space.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {9 + R}} corruption damage'
abilities.elementalist.subverted-perception-of-space.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {10 + R}} corruption damage; the target has line of effect only to creatures and objects within 4 squares of them until the start of your next turn'
abilities.elementalist.subverted-perception-of-space.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {15 + R}} corruption damage; the target has line of effect only to adjacent creatures and objects until the start of your next turn'
abilities.elementalist.subverted-perception-of-space.texts.effect: "Persistent 1: The target's limited line of effect lasts until the start of your next turn."
abilities.elementalist.combustion-deferred.name: Combustion Deferred
abilities.elementalist.combustion-deferred.description: '*Your flames dance from kindling to kindling to kindling.*'
abilities.elementalist.combustion-deferred.texts.target: One creature or object
abilities.elementalist.combustion-deferred.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.combustion-deferred.texts.roll: Power Roll + Reason
abilities.elementalist.combustion-deferred.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {8 + R}} fire damage'
abilities.elementalist.combustion-deferred.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {13 + R}} fire damage'
abilities.elementalist.combustion-deferred.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {17 + R}} fire damage'
abilities.elementalist.combustion-deferred.texts.effect: 'Effect: When the target ends their next
  turn, or if they drop to 0 Stamina before then, each enemy adjacent to them takes fire damage
  equal to twice your Reason score. Each affected enemy then gains this same effect.'
abilities.elementalist.storm-of-sands.name: Storm of Sands
abilities.elementalist.storm-of-sands.description: '*Dirt and debris swirl into a dark, pulsing hurricane.*'
abilities.elementalist.storm-of-sands.texts.target: Each enemy in the area
abilities.elementalist.storm-of-sands.texts.distance: '4 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.storm-of-sands.texts.roll: Power Roll + Reason
abilities.elementalist.storm-of-sands.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} damage'
abilities.elementalist.storm-of-sands.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} damage'
abilities.elementalist.storm-of-sands.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {7}} damage'
abilities.elementalist.storm-of-sands.texts.effect: >-
  Effect: The area lasts until the start of your next turn. It is difficult terrain for enemies, and
  you and your allies have concealment while in the area.


  Persistent 1: The area remains until the start of your next turn, and you can move it up to 5
  squares (no action required). As a maneuver, you can make the power roll again without spending
  essence.
abilities.elementalist.web-of-all-thats-come-before.name: Web of All That's Come Before
abilities.elementalist.web-of-all-thats-come-before.description: "*Threads you've been weaving through your adventures create a vibrant, pearlescent web.*"
abilities.elementalist.web-of-all-thats-come-before.texts.target: Each enemy in the area
abilities.elementalist.web-of-all-thats-come-before.texts.distance: '4 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.web-of-all-thats-come-before.texts.roll: Power Roll + Reason
abilities.elementalist.web-of-all-thats-come-before.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {2}} corruption damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.elementalist.web-of-all-thats-come-before.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {3}} corruption damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.elementalist.web-of-all-thats-come-before.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {5}} corruption damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.elementalist.web-of-all-thats-come-before.texts.effect: >-
  Effect: The area is difficult terrain until the start of your next turn. Each enemy who ends their
  turn in the area is restrained (save ends).


  Persistent 1: The area remains until the start of your next turn.
abilities.elementalist.volcanos-embrace.name: Volcano's Embrace
abilities.elementalist.volcanos-embrace.description: '*Wrap them up in fire and melting stone.*'
abilities.elementalist.volcanos-embrace.texts.target: One creature
abilities.elementalist.volcanos-embrace.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.volcanos-embrace.texts.roll: Power Roll + Reason
abilities.elementalist.volcanos-embrace.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + R}} fire damage; A < {has_self_potency1, select, true {{self_potency1}} other {WEAK}}, restrained (save ends)'
abilities.elementalist.volcanos-embrace.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + R}} fire damage; A < {has_self_potency2, select, true {{self_potency2}} other {AVERAGE}}, restrained (save ends)'
abilities.elementalist.volcanos-embrace.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {12 + R}} fire damage; A < {has_self_potency3, select, true {{self_potency3}} other {STRONG}}, restrained (save ends)'
abilities.elementalist.subvert-the-green-within.name: Subvert the Green Within
abilities.elementalist.subvert-the-green-within.description: "*Fungal spores sprout inside your enemy's brain, allowing you to control their actions.*"
abilities.elementalist.subvert-the-green-within.texts.target: One creature
abilities.elementalist.subvert-the-green-within.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.subvert-the-green-within.texts.roll: Power Roll + Reason
abilities.elementalist.subvert-the-green-within.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {5 + R}} poison damage'
abilities.elementalist.subvert-the-green-within.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {9 + R}} poison damage'
abilities.elementalist.subvert-the-green-within.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {12 + R}} poison damage'
abilities.elementalist.subvert-the-green-within.texts.effect: "Effect: The target uses their
  signature ability against a creature of your choice. This signature ability can target the
  creature even if it usually wouldn't. You then make a power roll against the target of this
  ability."
abilities.elementalist.there-is-no-space-between.name: There Is No Space Between
abilities.elementalist.there-is-no-space-between.description: '*Knowledge of the mystery reveals that two spaces are the same space.*'
abilities.elementalist.there-is-no-space-between.texts.target: Special
abilities.elementalist.there-is-no-space-between.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.there-is-no-space-between.texts.effect: >-
  Effect: You open two size 1 portals in unoccupied spaces within distance, which last until you
  move beyond distance from any portal, end the effect as a maneuver, or are dying. Each portal must
  be placed at a height of no more than 1 square above the ground. When you or any ally touch a
  portal, that creature can choose to be instantly teleported to an unoccupied space of their choice
  adjacent to the other portal. If an enemy is force moved into a portal, their forced movement ends
  and they emerge from the other portal in an unoccupied space chosen by the creature who force
  moved them.

  At the start of each of your turns while the portals are active, you can open a new portal
  connected to the others. If three or more portals are present, you and your allies choose which
  portal to emerge from when entering a portal, and a creature who force moves an enemy into a
  portal chooses that enemy's destination portal.
abilities.elementalist.translated-through-flame.name: Translated Through Flame
abilities.elementalist.translated-through-flame.description: '*Your ally disappears, then reappears in a burst of fire.*'
abilities.elementalist.translated-through-flame.texts.target: Self or one ally
abilities.elementalist.translated-through-flame.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.translated-through-flame.texts.roll: Power Roll + Reason
abilities.elementalist.translated-through-flame.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3}} fire damage'
abilities.elementalist.translated-through-flame.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {5}} fire damage'
abilities.elementalist.translated-through-flame.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {8}} fire damage'
abilities.elementalist.translated-through-flame.texts.effect: "Effect: The target is teleported to
  another space within distance. Make a power roll that affects each enemy adjacent to the target's
  new space."
abilities.elementalist.o-flower-aid-o-earth-defend.name: O Flower Aid, O Earth Defend
abilities.elementalist.o-flower-aid-o-earth-defend.description: '*Revitalizing plants and jagged stones grow, helping allies and hindering foes.*'
abilities.elementalist.o-flower-aid-o-earth-defend.texts.target: Special
abilities.elementalist.o-flower-aid-o-earth-defend.texts.distance: '3 cube within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.o-flower-aid-o-earth-defend.texts.effect: >-
  Effect: Until the start of your next turn, the area gains the following effects:

  - Once as a free maneuver at the start of your turn, you allow yourself and each ally in the area
  to spend any number of Recoveries.

  - The area is difficult terrain for enemies.

  - Each enemy who enters the area for the first time in a combat round or starts their turn there
  takes damage equal to your Reason score.


  Persistent 1: The area remains until the start of your next turn. As a maneuver, you can move the
  area up to 5 squares. This ability ends if the area is ever not within your line of effect.
abilities.elementalist.erase.name: Erase
abilities.elementalist.erase.description: '*With a flick of the wrist, you phase creatures out of existence.*'
abilities.elementalist.erase.texts.target: Special
abilities.elementalist.erase.texts.distance: 'Ranged {has_self_distance, select, true {{self_distance}} other {10}}'
abilities.elementalist.erase.texts.roll: Power Roll + Reason
abilities.elementalist.erase.texts.tier1: One creature
abilities.elementalist.erase.texts.tier2: Two creatures
abilities.elementalist.erase.texts.tier3: Three creatures
abilities.elementalist.erase.texts.effect: >-
  Special: The number of creatures you target with this ability is determined by your power roll.


  Effect: Each target begins to fade from existence (save ends). On their first turn while fading
  from existence, a target takes a bane on power rolls. At the end of their first turn, they have a
  double bane on power rolls. At the end of their second turn, they fade from existence for 1 hour,
  after which they reappear in their original space or the nearest unoccupied space.
abilities.elementalist.wall-of-fire.name: Wall of Fire
abilities.elementalist.wall-of-fire.description: '*A blazing, beautifully organized inferno erupts at your command.*'
abilities.elementalist.wall-of-fire.texts.target: Special
abilities.elementalist.wall-of-fire.texts.distance: '10 wall within {has_self_within, select, true {{self_within}} other {10}}'
abilities.elementalist.wall-of-fire.texts.effect: >-
  Effect: The wall lasts until the start of your next turn, and can be placed in occupied squares.
  Creatures can enter and pass through the wall. Each enemy who enters the area for the first time
  in a combat round or starts their turn there takes fire damage equal to your Reason score for each
  square of the area they start their turn in or enter.


  Persistent 1: The wall lasts until the start of your next turn, and you can add a number of
  squares to the wall equal to your Reason score.
abilities.elementalist.earth-accepts-me.name: Earth Accepts Me
abilities.elementalist.earth-accepts-me.description: '*You can slip into the stone.*'
abilities.elementalist.earth-accepts-me.texts.target: Self
abilities.elementalist.earth-accepts-me.texts.distance: Self
abilities.elementalist.earth-accepts-me.texts.effect: "Effect: You step into a mundane dirt, metal,
  or stone object (including a wall) that is as large as you or larger. You can remain inside the
  object for as long as you like. While inside the object, you can observe events and speak to
  creatures outside it, but you don't have line of effect to anything outside the object and vice
  versa. You can travel through the object freely until you exit it. If the object you meld with is
  destroyed, you take 10 damage and exit the object."
abilities.elementalist.swarm-of-spirits.name: Swarm of Spirits
abilities.elementalist.swarm-of-spirits.description: '*Guardian animal spirits surround you to harry your foes and bolster your allies.*'
abilities.elementalist.swarm-of-spirits.texts.target: Each enemy in the area
abilities.elementalist.swarm-of-spirits.texts.distance: 3 aura
abilities.elementalist.swarm-of-spirits.texts.roll: Power Roll + Reason
abilities.elementalist.swarm-of-spirits.texts.tier1: '{has_self_damage1, select, true {{self_damage1}} other {3}} damage'
abilities.elementalist.swarm-of-spirits.texts.tier2: '{has_self_damage2, select, true {{self_damage2}} other {6}} damage'
abilities.elementalist.swarm-of-spirits.texts.tier3: '{has_self_damage3, select, true {{self_damage3}} other {9}} damage'
abilities.elementalist.swarm-of-spirits.texts.effect: >-
  Effect: Until the end of your next turn, each ally in the area has each of their characteristic
  scores treated as 1 higher for the purpose of resisting potencies, and has a +1 bonus to saving
  throws.


  Persistent 1: You make the power roll again to target each enemy in the area without spending
  essence, and the effect lasts until the start of your next turn.
