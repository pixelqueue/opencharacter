abilities.elementalist.remember-growth-and-sun-and-rain.name: Remember Growth and Sun and Rain
abilities.elementalist.remember-growth-and-sun-and-rain.description: "*You stir any wood's memory and learn what it has seen.*"
abilities.elementalist.remember-growth-and-sun-and-rain.texts.target: One mundane wooden object
abilities.elementalist.remember-growth-and-sun-and-rain.texts.distance: Melee 1
abilities.elementalist.remember-growth-and-sun-and-rain.texts.effect: "Effect: You see and hear any
  events that have occurred within 10 squares of the object within the last 12 hours, perceiving
  those events from the object's location as if you were there."
