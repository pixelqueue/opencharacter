# The null: the Null Field aura, discipline from enemies acting in it, Discipline Mastery and the
# reactions that halve incoming damage. This sheet tracks whether the field is up, its size and
# its extra effect; the Null Field ability's aura carries its effects to the enemies inside.
fields:
  # Null Field: up once the maneuver is used, until the null is dying or ends it.
  nullClass.fieldActive: { type: boolean, input: true, default: false }
  # Enlargements until the end of the encounter (the 7-discipline fields, Order) and until the
  # start of the null's next turn (Psychic Pulse, Heat Sink).
  nullClass.fieldEncounter: { type: integer, input: true, default: 0, min: 0 }
  nullClass.fieldTurn: { type: integer, input: true, default: 0, min: 0 }
  nullClass.fieldSize:
    { type: integer, formula: 1 + nullClass.fieldEncounter + nullClass.fieldTurn }
  # The extra effect bought with 1 discipline, until the start of the null's next turn.
  nullClass.fieldEffect:
    type: enum
    values: [none, gravitic-disruption, inertial-anchor, synaptic-break]
    input: true
    default: none
  # Discipline already gained this round from an enemy's main action in the field, and from Malice.
  nullClass.fieldGained: { type: boolean, input: true, default: false }
  nullClass.maliceGained: { type: boolean, input: true, default: false }
  # Discipline Mastery reads the most discipline the null had this turn: a benefit lasts until the
  # end of the turn though the discipline is spent.
  nullClass.masteryPeak: { type: integer, input: true, default: 0, min: 0 }
  nullClass.mastery:
    type: integer
    formula: 'combat.active ? max(heroic.current, nullClass.masteryPeak) : 0'
  # The metakinetic's once-a-round surges from taking damage or being force moved.
  nullClass.masterySurge: { type: boolean, input: true, default: false }
  # Until the end of the encounter: Absolute Zero's avatar of cold, Iron Body's stability.
  nullClass.absoluteZero: { type: boolean, input: true, default: false }
  nullClass.ironBody: { type: boolean, input: true, default: false }
  # The 10th-level epic resource.
  nullClass.order: { type: integer, input: true, default: 0, min: 0 }
  # The reactions the null has, offered on incoming damage.
  nullClass.inertialShield: { type: boolean, formula: 'false' }
  nullClass.inertialAbsorption: { type: boolean, formula: 'false' }
  nullClass.synapticAnchor: { type: boolean, formula: 'false' }
  # Elemental Buffer: 2 surges when damage immunity reduces elemental damage.
  nullClass.elementalBuffer: { type: boolean, formula: 'false' }

# The triggered abilities that halve damage, chosen on the first change of the attack that
# triggers them (one selection halves the whole attack). Inertial Shield also gives Elemental
# Absorption's immunity from 6th level (`elemental-absorption`, below), and with it Elemental
# Buffer's surges when the immunity is the shield's alone (an immunity the hero has gains them by
# the feature's follow-up). The heroic ones pay their discipline here, or outside combat use up
# the ability until a respite, as `use-ability` does; their `use-ability` is for a table that
# doesn't route incoming choices (or Synaptic Anchor on an ally).
situational:
  - id: inertialShield
    type: boolean
    default: false
    incoming: { fields: [stamina.current], tags: [damage] }
    scope: batch
    available: nullClass.inertialShield && !abilities.noTriggered
    effects:
      - target: { incoming: { fields: [stamina.current], tags: [damage] } }
        op: multiply
        value: 0.5
        stackKey: half-damage
    changes:
      - type: adjust
        when: >-
          nullClass.elementalBuffer && level >= 6 && characteristics.intuition.score > 0
            && immunity.all == 0
            && countList(batch.adjustments, x.field == @stamina.current && x.reason == 'requested'
              && x.requested < 0
              && !('damage.unreducible' in x.tags)
              && (('damage.acid' in x.tags && immunity.acid == 0)
                || ('damage.cold' in x.tags && immunity.cold == 0)
                || ('damage.corruption' in x.tags && immunity.corruption == 0)
                || ('damage.fire' in x.tags && immunity.fire == 0)
                || ('damage.lightning' in x.tags && immunity.lightning == 0)
                || ('damage.poison' in x.tags && immunity.poison == 0)
                || ('damage.sonic' in x.tags && immunity.sonic == 0))) > 0
        field: surges.current
        by: 2
  # Inertial Absorption (11 discipline): half the damage, and 3 surges.
  - id: inertialAbsorption
    type: boolean
    default: false
    incoming: { fields: [stamina.current], tags: [damage] }
    scope: batch
    available: >-
      nullClass.inertialAbsorption && !abilities.noTriggered
        && (combat.active ? heroic.current - 11 >= heroic.min
          : !(@abilities.null.inertial-absorption in abilities.usedOutside))
    effects:
      - target: { incoming: { fields: [stamina.current], tags: [damage] } }
        op: multiply
        value: 0.5
        stackKey: half-damage
    changes:
      - { type: adjust, when: combat.active, field: heroic.current, by: -11 }
      - type: set
        when: '!combat.active'
        field: abilities.usedOutside
        value: abilities.usedOutside + [@abilities.null.inertial-absorption]
      - { type: adjust, field: surges.current, by: 3 }
  # Synaptic Anchor (11 discipline) on the null: half the damage. Dazing the creature is the
  # ability's use, against it.
  - id: synapticAnchor
    type: boolean
    default: false
    incoming: { fields: [stamina.current], tags: [damage] }
    scope: batch
    available: >-
      nullClass.synapticAnchor && !abilities.noTriggered
        && (combat.active ? heroic.current - 11 >= heroic.min
          : !(@abilities.null.synaptic-anchor in abilities.usedOutside))
    effects:
      - target: { incoming: { fields: [stamina.current], tags: [damage] } }
        op: multiply
        value: 0.5
        stackKey: half-damage
    changes:
      - { type: adjust, when: combat.active, field: heroic.current, by: -11 }
      - type: set
        when: '!combat.active'
        field: abilities.usedOutside
        value: abilities.usedOutside + [@abilities.null.synaptic-anchor]

effects:
  # Elemental Absorption: with Inertial Shield chosen on an attack, each of its elemental changes
  # meets immunity equal to Intuition (the higher of it and the hero's own counts). It is the
  # hero's own effect, not the batch choice's, so every change gets it whole, and it adds twice its
  # value for the shield's halving that follows (immunity comes last; rules/stamina.yaml).
  - id: elemental-absorption
    target: { incoming: { fields: [stamina.current], tags: [damage] } }
    op: add
    value: >-
      2 * max(0, characteristics.intuition.score - max(immunity.all, maxList(keysOf('damageType'),
        fieldOf('immunity.{damageType}', x), 'damage.' + x in incoming.tags)))
    when: >-
      situational.inertialShield && level >= 6 && incoming.amount < 0
        && !('damage.unreducible' in incoming.tags)
        && countList(['acid', 'cold', 'corruption', 'fire', 'lightning', 'poison', 'sonic'],
          'damage.' + x in incoming.tags) > 0

display:
  fields:
    nullClass.fieldActive:
      groups: [resources]
      priority: 1
      showWhen: "heroic.kind == 'discipline'"
      input: { widget: checkbox }
    nullClass.fieldSize: { groups: [resources], priority: 2, showWhen: nullClass.fieldActive }
    nullClass.fieldEffect: { groups: [resources], priority: 2, showWhen: nullClass.fieldActive }
    nullClass.mastery:
      { groups: [resources], priority: 2, showWhen: "heroic.kind == 'discipline' && combat.active" }
    nullClass.order:
      { groups: [resources], priority: 1, showWhen: "heroic.kind == 'discipline' && level >= 10" }
    nullClass.absoluteZero: { groups: [resources], priority: 3, showWhen: nullClass.absoluteZero }
    nullClass.ironBody: { groups: [resources], priority: 3, showWhen: nullClass.ironBody }
    nullClass.fieldEncounter: { hidden: true }
    nullClass.fieldTurn: { hidden: true }
    nullClass.fieldGained: { hidden: true }
    nullClass.maliceGained: { hidden: true }
    nullClass.masteryPeak: { hidden: true }
    nullClass.masterySurge: { hidden: true }
    nullClass.inertialShield: { hidden: true }
    nullClass.inertialAbsorption: { hidden: true }
    nullClass.synapticAnchor: { hidden: true }
    nullClass.elementalBuffer: { hidden: true }
