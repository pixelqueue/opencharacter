contentTypes:
  # A condition is applied content. Its duration is the effect's: end of turn (EoT), save ends,
  # end of the encounter, until something ends it, or, for an effect on yourself, until the start
  # or the end of your next turn; `by` is the character ID of the creature that imposed it (a
  # frightened creature's source, a taunt's, a grab's). An applied condition counts only while
  # it is active and not blocked by an immunity: its own applied effects say so.
  condition:
    grantOnly: true
    state:
      duration:
        { type: enum, values: [eot, save, encounter, until, next-start, next-end], default: until }
      by: { type: string, default: '' }
    reapply: { state: { duration: replace, by: replace } }
    effects:
      - { target: conditions.active, op: grant, value: { formula: item.id }, scope: applied }
      - target: conditions.frightenedBy
        op: grant
        value: { formula: self.by }
        scope: applied
        when: "item.id == @conditions.frightened && self.by != ''"
      - target: conditions.grabbedBy
        op: grant
        value: { formula: self.by }
        scope: applied
        when: "item.id == @conditions.grabbed && self.by != ''"
      - target: conditions.tauntedBy
        op: grant
        value: { formula: self.by }
        scope: applied
        when: "item.id == @conditions.taunted && self.by != ''"
    actions:
      # A saving throw against this save-ends condition; a success ends it.
      - id: save
        scope: applied
        tags: [saving-throw]
        available: "self.duration == 'save'"
        results: [success, failure]
        steps:
          - { id: save, kind: action, use: saving-throw, params: { entry: self.id } }
          - { id: done, kind: outcome, result: steps.save.result }

  # Any other effect an ability leaves on a creature for a while ("the target has damage weakness
  # 5 (save ends)"): applied content with a condition's duration, source and saving throw. Its
  # rules are its own `scope: applied` effects. Abilities name one in `t{tier}Effect`.
  effect:
    grantOnly: true
    state:
      duration:
        { type: enum, values: [eot, save, encounter, until, next-start, next-end], default: until }
      by: { type: string, default: '' }
    reapply: { state: { duration: replace, by: replace } }
    actions:
      - id: save
        scope: applied
        tags: [saving-throw]
        available: "self.duration == 'save'"
        results: [success, failure]
        steps:
          - { id: save, kind: action, use: saving-throw, params: { entry: self.id } }
          - { id: done, kind: outcome, result: steps.save.result }

fields:
  # The conditions in effect: each active, unblocked applied condition grants itself here (and
  # a dying hero's bleeding), so an immunity keeps a condition off the sheet.
  conditions.active: { type: set, of: condition }
  'conditions.{condition}':
    { type: boolean, formula: '@conditions.{condition} in conditions.active' }
  # Who imposed a frightened, grabbed or taunted condition (character IDs).
  conditions.frightenedBy: { type: set, of: string }
  conditions.grabbedBy: { type: set, of: string }
  conditions.tauntedBy: { type: set, of: string }
  # A dying hero is bleeding, unless something says otherwise (Bloodless, I Am the Weapon).
  stamina.dyingBleeds: { type: boolean, formula: 'true' }

effects:
  - id: dying-bleeds
    target: conditions.active
    op: grant
    value: { formula: '@conditions.bleeding' }
    when: stamina.dying && stamina.dyingBleeds
