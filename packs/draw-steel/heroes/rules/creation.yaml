# Creation: guided (the book's Quick Build picks recommended) and random (every pick drawn).
creation:
  - { id: guided, action: create-hero }
  - { id: random, action: create-hero, params: { random: true }, random: true }

actions:
  - id: create-hero
    tags: [creation]
    available: character.creating
    params:
      random: { type: boolean, default: false }
      level: { type: integer, default: 1, min: 1, max: 10 }
      complication: { type: boolean, default: false }
    results: [created]
    steps:
      - id: ancestry
        kind: choice
        random: params.random
        options: { content: { type: ancestry } }
        recommend: options[0]
        changes: [{ type: addItem, entry: { item: picked.id } }]
      - id: culture
        kind: choice
        random: params.random
        options: { content: { type: culture } }
        recommend: options[0]
        changes: [{ type: addItem, entry: { item: picked.id } }]
      - id: career
        kind: choice
        random: params.random
        options: { content: { type: career } }
        recommend: options[0]
        changes: [{ type: addItem, entry: { item: picked.id } }]
      - id: class
        kind: choice
        random: params.random
        options: { content: { type: class } }
        recommend: options[0]
        changes: [{ type: addItem, entry: { item: picked.id, state: { level: params.level } } }]
      # The array for the characteristics that aren't primary.
      - id: array
        kind: choice
        when: has(steps.class)
        random: params.random
        options:
          - {
              id: two-a,
              when: size(steps.class.item.primaries) == 2,
              flags: { array: '[2, -1, -1]' },
            }
          - {
              id: two-b,
              when: size(steps.class.item.primaries) == 2,
              flags: { array: '[1, 1, -1]' },
            }
          - {
              id: two-c,
              when: size(steps.class.item.primaries) == 2,
              flags: { array: '[1, 0, 0]' },
            }
          - {
              id: one-a,
              when: size(steps.class.item.primaries) == 1,
              flags: { array: '[2, 2, -1, -1]' },
            }
          - {
              id: one-b,
              when: size(steps.class.item.primaries) == 1,
              flags: { array: '[2, 1, 1, -1]' },
            }
          - {
              id: one-c,
              when: size(steps.class.item.primaries) == 1,
              flags: { array: '[2, 1, 0, 0]' },
            }
          - {
              id: one-d,
              when: size(steps.class.item.primaries) == 1,
              flags: { array: '[1, 1, 1, 0]' },
            }
        recommend: "size(steps.class.item.primaries) == 2 ? 'two-a' : 'one-a'"
      - id: primaries
        kind: changes
        when: has(steps.class)
        changes:
          - type: set
            forEach: steps.class.item.primaries
            field: { formula: "fieldId('characteristics.{characteristic}.base', x)" }
            value: 2
      # The array for the characteristics that aren't primary, one step per set of primaries so
      # each recommends exactly the fields it offers: the array, highest first, in the class's
      # `arrayPriority` order (which must list every characteristic that isn't primary).
      - id: restMightAgility
        kind: allocate
        when: has(steps.class) && has(steps.array) && sortList(steps.class.item.primaries) == ['agility', 'might']
        random: params.random
        fields:
          type: field
          where: >-
            'characteristic-base.reason' in item.tags || 'characteristic-base.intuition' in item.tags || 'characteristic-base.presence' in item.tags
        values: ['flags.array[0]', 'flags.array[1]', 'flags.array[2]']
        recommend:
          characteristics.reason.base: "flags.array[indexOf(filterList(steps.class.item.arrayPriority, !(x in steps.class.item.primaries)), 'reason')]"
          characteristics.intuition.base: "flags.array[indexOf(filterList(steps.class.item.arrayPriority, !(x in steps.class.item.primaries)), 'intuition')]"
          characteristics.presence.base: "flags.array[indexOf(filterList(steps.class.item.arrayPriority, !(x in steps.class.item.primaries)), 'presence')]"
      - id: restMightReason
