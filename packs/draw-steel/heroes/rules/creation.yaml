          characteristics.intuition.base: "flags.array[indexOf(filterList(steps.class.item.arrayPriority, !(x in steps.class.item.primaries)), 'intuition')]"
          characteristics.presence.base: "flags.array[indexOf(filterList(steps.class.item.arrayPriority, !(x in steps.class.item.primaries)), 'presence')]"
